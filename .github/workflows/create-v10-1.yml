name: Create V10.1 Debug

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Car Assistant V10.1 Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Prepare V10.1 source
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " PREPARE CAR ASSISTANT V10.1"
          echo "=========================================="

          test -d v10-source

          rm -rf v10-source/.gradle
          rm -rf v10-source/app/build

          echo "V10 source found:"
          find v10-source -maxdepth 2 -type f | sort | head -100

          mkdir -p v10-source/app/src/main/java/com/carassistant/v10

      - name: Replace V10 Launcher
        shell: bash
        run: |
          set -e

          cat > v10-source/app/src/main/java/com/carassistant/v10/V10LauncherActivity.java <<'EOF'
          package com.carassistant.v10;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.pm.ActivityInfo;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;

          public class V10LauncherActivity extends Activity {

              private LinearLayout list;
              private TextView status;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  try {
                      buildUi();
                      loadApps();
                  } catch (Throwable e) {
                      showFatalError(e);
                  }
              }

              private int dp(float value) {
                  return (int) (value * getResources().getDisplayMetrics().density + 0.5f);
              }

              private TextView makeText(String value, float size) {
                  TextView tv = new TextView(this);
                  tv.setText(value);
                  tv.setTextSize(size);
                  tv.setTextColor(0xffeeeeee);
                  tv.setGravity(Gravity.CENTER_VERTICAL);
                  tv.setPadding(dp(16), dp(12), dp(16), dp(12));
                  return tv;
              }

              private void buildUi() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(0xff101114);
                  root.setPadding(dp(16), dp(18), dp(16), dp(16));

                  TextView title = makeText("CAR ASSISTANT V10.1", 24);
                  title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);

                  TextView subtitle = makeText(
                          "V10 Projection Engine\nAndroid 12 compatible",
                          15
                  );

                  status = makeText("Ready", 14);
                  status.setTextColor(0xffbdbdbd);

                  root.addView(title, new LinearLayout.LayoutParams(
                          -1, dp(48)
                  ));

                  root.addView(subtitle, new LinearLayout.LayoutParams(
                          -1, dp(64)
                  ));

                  root.addView(status, new LinearLayout.LayoutParams(
                          -1, dp(44)
                  ));

                  ScrollView scroll = new ScrollView(this);
                  list = new LinearLayout(this);
                  list.setOrientation(LinearLayout.VERTICAL);
                  scroll.addView(list);

                  root.addView(scroll, new LinearLayout.LayoutParams(
                          -1, 0, 1
                  ));

                  setContentView(root);
              }

              private void loadApps() {
                  PackageManager pm = getPackageManager();

                  Intent intent = new Intent(Intent.ACTION_MAIN);
                  intent.addCategory(Intent.CATEGORY_LAUNCHER);

                  List<android.content.pm.ResolveInfo> resolved =
                          pm.queryIntentActivities(intent, PackageManager.MATCH_ALL);

                  Collections.sort(
                          resolved,
                          new Comparator<android.content.pm.ResolveInfo>() {
                              @Override
                              public int compare(
                                      android.content.pm.ResolveInfo a,
                                      android.content.pm.ResolveInfo b) {
                                  String aa = String.valueOf(a.loadLabel(pm));
                                  String bb = String.valueOf(b.loadLabel(pm));
                                  return aa.compareToIgnoreCase(bb);
                              }
                          }
                  );

                  int count = 0;

                  for (android.content.pm.ResolveInfo info : resolved) {
                      if (count >= 12) {
                          break;
                      }

                      ActivityInfo ai = info.activityInfo;

                      if (ai == null) {
                          continue;
                      }

                      if (ai.packageName.equals(getPackageName())) {
                          continue;
                      }

                      if (!ai.enabled) {
                          continue;
                      }

                      final ComponentName component =
                              new ComponentName(ai.packageName, ai.name);

                      String label = String.valueOf(
                              info.loadLabel(pm)
                      );

                      Button button = new Button(this);
                      button.setAllCaps(false);
                      button.setText(label + "\n" + component.flattenToShortString());
                      button.setTextSize(14);
                      button.setGravity(Gravity.CENTER_VERTICAL | Gravity.LEFT);
                      button.setPadding(
                              dp(16),
                              dp(10),
                              dp(16),
                              dp(10)
                      );

                      button.setOnClickListener(new View.OnClickListener() {
                          @Override
                          public void onClick(View v) {
                              launchProjection(component);
                          }
                      });

                      list.addView(button, new LinearLayout.LayoutParams(
                              -1,
                              dp(70)
                      ));

                      count++;
                  }

                  status.setText("Found " + count + " launcher apps");
              }

              private void launchProjection(ComponentName component) {
                  try {
                      status.setText(
                              "Starting:\n" +
                              component.flattenToShortString()
                      );

                      Intent intent = new Intent(
                              V10LauncherActivity.this,
                              V10CarActivity.class
                      );

                      intent.putExtra(
                              "target",
                              component.flattenToString()
                      );

                      startActivity(intent);

                  } catch (Throwable e) {
                      showError("START FAILED", e);
                  }
              }

              private void showError(String title, Throwable e) {
                  String message = e.getClass().getName();

                  if (e.getMessage() != null) {
                      message += "\n" + e.getMessage();
                  }

                  status.setText(title + "\n" + message);
              }

              private void showFatalError(Throwable e) {
                  TextView tv = makeText(
                          "CAR ASSISTANT V10.1\n\n" +
                          "Launcher error:\n" +
                          e.getClass().getName() +
                          "\n\n" +
                          String.valueOf(e.getMessage()),
                          16
                  );

                  tv.setPadding(
                          dp(20),
                          dp(30),
                          dp(20),
                          dp(30)
                  );

                  setContentView(tv);
              }
          }
          EOF

          echo "V10.1 Launcher written."

      - name: Replace V10 Car Activity
        shell: bash
        run: |
          set -e

          cat > v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java <<'EOF'
          package com.carassistant.v10;

          import android.content.ComponentName;
          import android.os.Bundle;
          import android.util.Log;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.widget.FrameLayout;
          import android.widget.TextView;

          import com.google.android.apps.auto.sdk.CarActivity;

          public class V10CarActivity extends CarActivity {

              private static final String TAG = "CarAssistantV10";

              private V10ProjectionSession session;
              private TextView status;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  requestWindowFeature(Window.FEATURE_NO_TITLE);

                  getWindow().setFlags(
                          WindowManager.LayoutParams.FLAG_FULLSCREEN,
                          WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );

                  FrameLayout root = new FrameLayout(this);

                  status = new TextView(this);
                  status.setText("V10.1\nStarting projection...");
                  status.setTextSize(18);
                  status.setTextColor(0xffffffff);
                  status.setGravity(android.view.Gravity.CENTER);
                  status.setBackgroundColor(0xff000000);

                  root.addView(
                          status,
                          new FrameLayout.LayoutParams(-1, -1)
                  );

                  setContentView(root);

                  try {
                      session = new V10ProjectionSession(
                              this,
                              new V10ProjectionSession.StatusListener() {
                                  @Override
                                  public void onStatus(String message) {
                                      Log.i(TAG, message);
                                      if (status != null) {
                                          status.setText(message);
                                      }
                                  }
                              }
                      );

                      String target = getIntent().getStringExtra("target");

                      if (target == null || target.trim().isEmpty()) {
                          session.fail("NO TARGET COMPONENT");
                          return;
                      }

                      ComponentName component =
                              ComponentName.unflattenFromString(target);

                      if (component == null) {
                          session.fail("INVALID TARGET:\n" + target);
                          return;
                      }

                      session.setTarget(component);

                  } catch (Throwable e) {
                      Log.e(TAG, "V10CarActivity create failed", e);
                      showError("ACTIVITY ERROR", e);
                  }
              }

              private void showError(String title, Throwable e) {
                  String msg = title +
                          "\n" +
                          e.getClass().getName();

                  if (e.getMessage() != null) {
                      msg += "\n" + e.getMessage();
                  }

                  if (status != null) {
                      status.setText(msg);
                  }
              }

              @Override
              protected void onDestroy() {
                  try {
                      if (session != null) {
                          session.destroy();
                          session = null;
                      }
                  } catch (Throwable e) {
                      Log.e(TAG, "Session destroy failed", e);
                  }

                  super.onDestroy();
              }
          }
          EOF

          echo "V10.1 CarActivity written."

      - name: Replace V10 Projection Session
        shell: bash
        run: |
          set -e

          cat > v10-source/app/src/main/java/com/carassistant/v10/V10ProjectionSession.java <<'EOF'
          package com.carassistant.v10;

          import android.content.ComponentName;
          import android.content.Context;
          import android.content.pm.ActivityInfo;
          import android.content.pm.PackageManager;
          import android.graphics.SurfaceTexture;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Log;
          import android.view.MotionEvent;
          import android.view.Surface;
          import android.view.TextureView;

          import java.io.IOException;

          public class V10ProjectionSession
                  implements TextureView.SurfaceTextureListener {

              private static final String TAG = "CarAssistantV10";

              private final Context context;
              private final StatusListener listener;
              private final Handler mainHandler =
                      new Handler(Looper.getMainLooper());

              private TextureView textureView;
              private Surface surface;
              private VirtualDisplay virtualDisplay;

              private RootShellSession shell;
              private ComponentName target;

              private int width;
              private int height;

              public interface StatusListener {
                  void onStatus(String message);
              }

              public V10ProjectionSession(
                      Context context,
                      StatusListener listener) {

                  this.context = context;
                  this.listener = listener;

                  postStatus("V10.1 SESSION CREATED");

                  try {
                      shell = new RootShellSession();
                      postStatus("ROOT SHELL READY");
                  } catch (Throwable e) {
                      fail("ROOT SHELL FAILED\n" + errorText(e));
                  }
              }

              public void attachTextureView(TextureView view) {
                  textureView = view;
                  textureView.setSurfaceTextureListener(this);

                  if (textureView.isAvailable()) {
                      onSurfaceTextureAvailable(
                              textureView.getSurfaceTexture(),
                              textureView.getWidth(),
                              textureView.getHeight()
                      );
                  }
              }

              public void setTarget(ComponentName component) {
                  target = component;

                  postStatus(
                          "TARGET:\n" +
                          component.flattenToShortString()
                  );

                  validateTarget();

                  ensureDisplay();
              }

              private void validateTarget() {
                  if (target == null) {
                      fail("TARGET IS NULL");
                      return;
                  }

                  try {
                      PackageManager pm = context.getPackageManager();

                      ActivityInfo info = pm.getActivityInfo(
                              target,
                              PackageManager.MATCH_ALL
                      );

                      if (info == null) {
                          fail("TARGET ACTIVITY NOT FOUND");
                          return;
                      }

                      if (!info.enabled) {
                          fail("TARGET ACTIVITY DISABLED");
                          return;
                      }

                      postStatus("TARGET VALID");
                  } catch (Throwable e) {
                      fail(
                              "TARGET VALIDATION FAILED\n" +
                              errorText(e)
                      );
                  }
              }

              private void ensureDisplay() {
                  if (surface == null) {
                      postStatus("WAITING FOR SURFACE");
                      return;
                  }

                  if (virtualDisplay != null) {
                      postStatus(
                              "DISPLAY ALREADY READY\nID=" +
                              virtualDisplay.getDisplay().getDisplayId()
                      );
                      launchTarget();
                      return;
                  }

                  try {
                      DisplayManager dm =
                              (DisplayManager) context.getSystemService(
                                      Context.DISPLAY_SERVICE
                              );

                      if (dm == null) {
                          fail("DISPLAY MANAGER NULL");
                          return;
                      }

                      width = textureView.getWidth();
                      height = textureView.getHeight();

                      if (width <= 0) {
                          width = 1280;
                      }

                      if (height <= 0) {
                          height = 720;
                      }

                      postStatus(
                              "CREATING VIRTUAL DISPLAY\n" +
                              width + "x" + height
                      );

                      virtualDisplay = dm.createVirtualDisplay(
                              "Car Assistant V10.1",
                              width,
                              height,
                              160,
                              surface,
                              DisplayManager.VIRTUAL_DISPLAY_FLAG_PUBLIC |
                              DisplayManager.VIRTUAL_DISPLAY_FLAG_PRESENTATION |
                              DisplayManager.VIRTUAL_DISPLAY_FLAG_OWN_CONTENT_ONLY
                      );

                      if (virtualDisplay == null) {
                          fail("CREATE VIRTUAL DISPLAY RETURNED NULL");
                          return;
                      }

                      int id =
                              virtualDisplay.getDisplay().getDisplayId();

                      postStatus(
                              "DISPLAY OK\nID=" + id
                      );

                      launchTarget();

                  } catch (Throwable e) {
                      Log.e(TAG, "VirtualDisplay creation failed", e);

                      fail(
                              "DISPLAY FAILED\n" +
                              errorText(e)
                      );
                  }
              }

              private void launchTarget() {
                  if (target == null) {
                      fail("NO TARGET");
                      return;
                  }

                  if (virtualDisplay == null) {
                      fail("NO VIRTUAL DISPLAY");
                      return;
                  }

                  if (shell == null) {
                      fail("NO ROOT SHELL");
                      return;
                  }

                  int displayId =
                          virtualDisplay.getDisplay().getDisplayId();

                  String component =
                          target.flattenToShortString();

                  postStatus(
                          "LAUNCHING\n" +
                          component +
                          "\nDISPLAY=" +
                          displayId
                  );

                  String command =
                          "/system/bin/am start " +
                          "--user 0 " +
                          "--display " + displayId + " " +
                          "--windowingMode 1 " +
                          "-a android.intent.action.MAIN " +
                          "-c android.intent.category.LAUNCHER " +
                          "-f 0x18000000 " +
                          "-n '" + component + "'";

                  new Thread(() -> {
                      try {
                          String result = shell.run(15, command);

                          Log.i(TAG, "am start result:\n" + result);

                          if (result == null) {
                              postStatus("APP START RETURNED NULL");
                              return;
                          }

                          String lower = result.toLowerCase();

                          if (lower.contains("error") ||
                              lower.contains("exception") ||
                              lower.contains("unable to resolve") ||
                              lower.contains("securityexception")) {

                              fail(
                                      "APP START FAILED\n" +
                                      result
                              );
                              return;
                          }

                          postStatus(
                                  "APP START OK\n" +
                                  component +
                                  "\nDISPLAY=" +
                                  displayId
                          );

                      } catch (Throwable e) {
                          Log.e(TAG, "am start failed", e);

                          fail(
                                  "APP START FAILED\n" +
                                  errorText(e)
                          );
                      }
                  }, "V10.1-AppLaunch").start();
              }

              public void onTouch(float x, float y) {
                  if (virtualDisplay == null || shell == null) {
                      return;
                  }

                  int displayId =
                          virtualDisplay.getDisplay().getDisplayId();

                  int ix = Math.max(
                          0,
                          Math.min(width - 1, (int) x)
                  );

                  int iy = Math.max(
                          0,
                          Math.min(height - 1, (int) y)
                  );

                  String command =
                          "/system/bin/input touchscreen " +
                          "-d " + displayId +
                          " tap " + ix + " " + iy;

                  new Thread(() -> {
                      try {
                          shell.run(5, command);
                      } catch (Throwable e) {
                          Log.e(TAG, "Touch injection failed", e);
                      }
                  }, "V10.1-Touch").start();
              }

              @Override
              public boolean onSurfaceTextureAvailable(
                      SurfaceTexture texture,
                      int width,
                      int height) {

                  postStatus(
                          "SURFACE AVAILABLE\n" +
                          width + "x" + height
                  );

                  surface = new Surface(texture);

                  ensureDisplay();

                  return true;
              }

              @Override
              public void onSurfaceTextureSizeChanged(
                      SurfaceTexture texture,
                      int width,
                      int height) {

                  this.width = width;
                  this.height = height;
              }

              @Override
              public boolean onSurfaceTextureDestroyed(
                      SurfaceTexture texture) {

                  if (surface != null) {
                      surface.release();
                      surface = null;
                  }

                  return true;
              }

              @Override
              public void onSurfaceTextureUpdated(
                      SurfaceTexture texture) {
              }

              public void fail(String message) {
                  Log.e(TAG, message);
                  postStatus(message);
              }

              private void postStatus(String message) {
                  if (listener == null) {
                      return;
                  }

                  mainHandler.post(() -> listener.onStatus(message));
              }

              private String errorText(Throwable e) {
                  String text = e.getClass().getName();

                  if (e.getMessage() != null) {
                      text += "\n" + e.getMessage();
                  }

                  return text;
              }

              public void destroy() {
                  try {
                      if (virtualDisplay != null) {
                          virtualDisplay.release();
                          virtualDisplay = null;
                      }
                  } catch (Throwable e) {
                      Log.e(TAG, "VirtualDisplay release failed", e);
                  }

                  try {
                      if (surface != null) {
                          surface.release();
                          surface = null;
                      }
                  } catch (Throwable e) {
                      Log.e(TAG, "Surface release failed", e);
                  }
              }
          }
          EOF

          echo "V10.1 ProjectionSession written."

      - name: Patch CarActivity to attach projection surface
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java"
          )

          s = p.read_text()

          old = '''                  session = new V10ProjectionSession(
                              this,
                              new V10ProjectionSession.StatusListener() {'''

          new = '''                  android.view.TextureView textureView =
                          new android.view.TextureView(this);

                  textureView.setBackgroundColor(0xff000000);

                  ((android.view.ViewGroup) findViewById(android.R.id.content))
                          .addView(
                                  textureView,
                                  new android.view.ViewGroup.LayoutParams(
                                          -1,
                                          -1
                                  )
                          );

                  session = new V10ProjectionSession(
                              this,
                              new V10ProjectionSession.StatusListener() {'''

          if old not in s:
              raise SystemExit("Expected V10ProjectionSession block not found")

          s = s.replace(old, new)

          old2 = '''                      session.setTarget(component);

                  } catch (Throwable e) {'''

          new2 = '''                      session.setTarget(component);
                      session.attachTextureView(textureView);

                  } catch (Throwable e) {'''

          if old2 not in s:
              raise SystemExit("Expected setTarget block not found")

          s = s.replace(old2, new2)

          p.write_text(s)
          PY

          echo "TextureView attached."

      - name: Verify V10.1 source
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " VERIFY V10.1"
          echo "=========================================="

          test -f v10-source/app/src/main/java/com/carassistant/v10/V10LauncherActivity.java
          test -f v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java
          test -f v10-source/app/src/main/java/com/carassistant/v10/V10ProjectionSession.java

          grep -R "CAR ASSISTANT V10.1" \
            v10-source/app/src/main/java/com/carassistant/v10

          grep -R "DISPLAY OK" \
            v10-source/app/src/main/java/com/carassistant/v10

          grep -R "APP START OK" \
            v10-source/app/src/main/java/com/carassistant/v10

          grep -R "RootShellSession" \
            v10-source/app/src/main/java/com/carassistant/v10/V10ProjectionSession.java

          echo "V10.1 SOURCE CHECK PASSED"

      - name: Build V10.1 debug
        working-directory: v10-source
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK:"
          ls -lh "$APK"

          sha256sum "$APK"

          echo "=========================================="
          echo " CAR ASSISTANT V10.1 BUILD PASSED"
          echo "=========================================="

      - name: Upload V10.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10.1-Debug
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit V10.1 source
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add v10-source

          if git diff --cached --quiet; then
            echo "No V10.1 source changes to commit."
            exit 0
          fi

          git commit -m "Create Car Assistant V10.1 debug"
          git push origin HEAD:main

          echo "V10.1 SOURCE COMMITTED"
