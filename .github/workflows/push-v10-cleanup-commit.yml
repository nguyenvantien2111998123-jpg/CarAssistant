name: CarAssistant V10 - Push Cleanup Commit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push-cleanup-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify main and cleanup commit
        shell: bash
        run: |
          set -euo pipefail

          CLEANUP_COMMIT="a5eaf450ab0d8b65dd4e16bfb25ccbfece620efd"

          echo "========================================"
          echo "V10 CLEANUP COMMIT VERIFICATION"
          echo "========================================"

          MAIN_COMMIT="$(git rev-parse HEAD)"

          echo "Current main:"
          echo "$MAIN_COMMIT"

          echo
          echo "Fetching cleanup commit..."
          git fetch origin "$CLEANUP_COMMIT"

          CLEANUP_PARENT="$(
            git show -s --format='%P' "$CLEANUP_COMMIT"
          )"

          CLEANUP_MESSAGE="$(
            git show -s --format='%s' "$CLEANUP_COMMIT"
          )"

          echo
          echo "Cleanup commit:"
          echo "$CLEANUP_COMMIT"

          echo "Cleanup parent:"
          echo "$CLEANUP_PARENT"

          echo "Cleanup message:"
          echo "$CLEANUP_MESSAGE"

          if [ "$CLEANUP_MESSAGE" != "Normalize CarAssistant V10 source structure" ]; then
            echo "ERROR: Cleanup commit message does not match."
            exit 1
          fi

          echo
          echo "Checking parent relationship..."

          if [ "$CLEANUP_PARENT" != "$MAIN_COMMIT" ]; then
            echo "ERROR: Cleanup commit parent is NOT current main."
            echo
            echo "Current main:"
            echo "$MAIN_COMMIT"
            echo
            echo "Cleanup parent:"
            echo "$CLEANUP_PARENT"
            echo
            echo "STOPPING SAFELY."
            echo "No cherry-pick."
            echo "No force-push."
            echo "No architecture changes."
            exit 1
          fi

          echo
          echo "Parent relationship PASS."

      - name: Verify cleanup diff
        shell: bash
        run: |
          set -euo pipefail

          CLEANUP_COMMIT="a5eaf450ab0d8b65dd4e16bfb25ccbfece620efd"

          echo "========================================"
          echo "VERIFY CLEANUP DIFF"
          echo "========================================"

          echo "Changed files in cleanup commit:"
          git diff-tree --no-commit-id \
            --name-status \
            -r \
            "$CLEANUP_COMMIT"

          echo
          echo "Checking Java rename count..."

          JAVA_RENAMES="$(
            git diff-tree --no-commit-id \
              --name-status \
              -r \
              "$CLEANUP_COMMIT" |
              grep -c \
                'v10-source/app/src/main/java/com/hieptran/aacast/doudou/'
              || true
          )"

          echo "Old Java path entries:"
          echo "$JAVA_RENAMES"

          echo
          echo "Cleanup diff verification PASS."

      - name: Apply exact cleanup commit
        shell: bash
        run: |
          set -euo pipefail

          CLEANUP_COMMIT="a5eaf450ab0d8b65dd4e16bfb25ccbfece620efd"

          echo "========================================"
          echo "APPLY EXACT CLEANUP COMMIT"
          echo "========================================"

          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              cherry-pick --no-edit "$CLEANUP_COMMIT"

          echo
          echo "Cherry-pick PASS."

          echo
          echo "New commit:"
          git log -1 --oneline

          echo
          echo "Diff check:"
          git diff --check HEAD^ HEAD

      - name: Push main using CARASSISTANT_PAT
        shell: bash
        env:
          CARASSISTANT_PAT: ${{ secrets.CARASSISTANT_PAT }}
        run: |
          set -euo pipefail

          if [ -z "${CARASSISTANT_PAT:-}" ]; then
            echo "ERROR: CARASSISTANT_PAT secret is missing."
            exit 1
          fi

          echo "========================================"
          echo "PUSH TO MAIN USING PAT"
          echo "========================================"

          git -c http.extraheader="" \
            push \
            "https://x-access-token:${CARASSISTANT_PAT}@github.com/nguyenvantien2111998123-jpg/CarAssistant.git" \
            HEAD:main

          echo
          echo "========================================"
          echo "PUSH PASS"
          echo "========================================"
          echo "Cleanup commit is now on main."
