name: CarAssistant V10 - Apply Cleanup From Current Main

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify current main and cleanup commit
        shell: bash
        run: |
          set -euo pipefail

          CLEANUP_COMMIT="a5eaf450ab0d8b65dd4e16bfb25ccbfece620efd"
          CLEANUP_PARENT="97f50f032da8d1d851c60bd5af7f057be296460c"
          CLEANUP_MESSAGE="Normalize CarAssistant V10 source structure"

          MAIN_COMMIT="$(git rev-parse HEAD)"

          echo "========================================"
          echo "V10 CLEANUP - CURRENT MAIN"
          echo "========================================"

          echo "Current main:"
          echo "$MAIN_COMMIT"

          echo
          echo "Fetching cleanup commit..."
          git fetch origin "$CLEANUP_COMMIT"

          ACTUAL_PARENT="$(git show -s --format='%P' "$CLEANUP_COMMIT")"
          ACTUAL_MESSAGE="$(git show -s --format='%s' "$CLEANUP_COMMIT")"

          echo
          echo "Cleanup commit:"
          echo "$CLEANUP_COMMIT"

          echo "Cleanup parent:"
          echo "$ACTUAL_PARENT"

          echo "Cleanup message:"
          echo "$ACTUAL_MESSAGE"

          if [ "$ACTUAL_PARENT" != "$CLEANUP_PARENT" ]; then
            echo "ERROR: Cleanup parent SHA mismatch."
            exit 1
          fi

          if [ "$ACTUAL_MESSAGE" != "$CLEANUP_MESSAGE" ]; then
            echo "ERROR: Cleanup message mismatch."
            exit 1
          fi

          echo
          echo "Checking cleanup parent is in current main..."

          if ! git merge-base --is-ancestor "$CLEANUP_PARENT" "$MAIN_COMMIT"; then
            echo "ERROR: Cleanup parent is NOT an ancestor of current main."
            echo
            echo "STOPPING SAFELY."
            echo "No cherry-pick."
            echo "No push."
            echo "No force-push."
            exit 1
          fi

          echo "PASS: Cleanup parent is in current main."

          echo
          echo "Checking cleanup commit is not already in main..."

          if git merge-base --is-ancestor "$CLEANUP_COMMIT" "$MAIN_COMMIT"; then
            echo "ERROR: Cleanup commit is already contained in main."
            echo "Nothing to apply."
            exit 1
          fi

          echo "PASS: Cleanup commit is not yet in main."

      - name: Verify cleanup diff
        shell: bash
        run: |
          set -euo pipefail

          CLEANUP_COMMIT="a5eaf450ab0d8b65dd4e16bfb25ccbfece620efd"

          echo "========================================"
          echo "VERIFY CLEANUP DIFF"
          echo "========================================"

          echo "Cleanup statistics:"
          git show --no-ext-diff --stat "$CLEANUP_COMMIT"

          echo
          echo "Changed files:"
          git diff-tree \
            --no-commit-id \
            --name-status \
            -r \
            "$CLEANUP_COMMIT"

          echo
          echo "Checking cleanup commit parent..."

          PARENT="$(git show -s --format='%P' "$CLEANUP_COMMIT")"

          if [ "$PARENT" != "97f50f032da8d1d851c60bd5af7f057be296460c" ]; then
            echo "ERROR: Unexpected cleanup parent."
            exit 1
          fi

          echo
          echo "Cleanup diff verification PASS."

      - name: Apply cleanup commit
        shell: bash
        run: |
          set -euo pipefail

          CLEANUP_COMMIT="a5eaf450ab0d8b65dd4e16bfb25ccbfece620efd"

          echo "========================================"
          echo "APPLY V10 SOURCE CLEANUP"
          echo "========================================"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BEFORE="$(git rev-parse HEAD)"

          echo "Main before cherry-pick:"
          echo "$BEFORE"

          echo
          echo "Cherry-picking cleanup commit..."

          if ! git cherry-pick "$CLEANUP_COMMIT"; then
            echo
            echo "ERROR: Cherry-pick conflict."
            echo "Aborting."
            git cherry-pick --abort
            echo
            echo "No push performed."
            exit 1
          fi

          AFTER="$(git rev-parse HEAD)"

          echo
          echo "Cherry-pick PASS."

          echo "New commit:"
          echo "$AFTER"

          echo
          echo "Checking new commit parent..."

          NEW_PARENT="$(git show -s --format='%P' "$AFTER")"

          if [ "$NEW_PARENT" != "$BEFORE" ]; then
            echo "ERROR: New cleanup commit does not directly follow current main."
            echo "Expected parent:"
            echo "$BEFORE"
            echo "Actual parent:"
            echo "$NEW_PARENT"
            exit 1
          fi

          echo "PASS: New commit directly follows current main."

      - name: Final safety verification
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FINAL SAFETY CHECK"
          echo "========================================"

          echo "Current HEAD:"
          git rev-parse HEAD

          echo
          echo "Current commit:"
          git log -1 --format='%H%n%s'

          echo
          echo "Diff check:"
          git diff --check HEAD^ HEAD

          echo
          echo "Changed files:"
          git diff-tree \
            --no-commit-id \
            --name-status \
            -r \
            HEAD

          echo
          echo "FINAL SAFETY CHECK PASS."

      - name: Push main using CARASSISTANT_PAT
        shell: bash
        env:
          CARASSISTANT_PAT: ${{ secrets.CARASSISTANT_PAT }}
        run: |
          set -euo pipefail

          if [ -z "${CARASSISTANT_PAT:-}" ]; then
            echo "ERROR: CARASSISTANT_PAT is empty or unavailable."
            exit 1
          fi

          echo "========================================"
          echo "PUSH CLEANUP TO MAIN"
          echo "========================================"

          git -c http.extraheader="" \
            push \
            "https://x-access-token:${CARASSISTANT_PAT}@github.com/nguyenvantien2111998123-jpg/CarAssistant.git" \
            HEAD:main

          echo
          echo "========================================"
          echo "PUSH PASS"
          echo "========================================"

          echo "CarAssistant V10 source structure cleanup is now on main."
