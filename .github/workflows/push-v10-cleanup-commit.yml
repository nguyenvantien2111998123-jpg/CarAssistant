name: CarAssistant V10 - Apply Cleanup Safely

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact repository state
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_MAIN="5806a66ac2f92857a6768c30b14bdbe5ff43d596"
          CLEANUP_COMMIT="a5eaf450ab0d8b65dd4e16bfb25ccbfece620efd"
          CLEANUP_PARENT="97f50f032da8d1d851c60bd5af7f057be296460c"
          CLEANUP_MESSAGE="Normalize CarAssistant V10 source structure"

          echo "========================================"
          echo "V10 CLEANUP - STATE VERIFICATION"
          echo "========================================"

          MAIN_COMMIT="$(git rev-parse HEAD)"

          echo "Current main:"
          echo "$MAIN_COMMIT"

          if [ "$MAIN_COMMIT" != "$EXPECTED_MAIN" ]; then
            echo
            echo "ERROR: main changed after this workflow was prepared."
            echo "Expected:"
            echo "$EXPECTED_MAIN"
            echo "Actual:"
            echo "$MAIN_COMMIT"
            echo
            echo "STOPPING SAFELY."
            echo "No cherry-pick."
            echo "No force-push."
            exit 1
          fi

          echo
          echo "Fetching cleanup commit..."
          git fetch origin "$CLEANUP_COMMIT"

          ACTUAL_PARENT="$(git show -s --format='%P' "$CLEANUP_COMMIT")"
          ACTUAL_MESSAGE="$(git show -s --format='%s' "$CLEANUP_COMMIT")"

          echo
          echo "Cleanup commit:"
          echo "$CLEANUP_COMMIT"

          echo "Cleanup parent:"
          echo "$ACTUAL_PARENT"

          echo "Cleanup message:"
          echo "$ACTUAL_MESSAGE"

          if [ "$ACTUAL_PARENT" != "$CLEANUP_PARENT" ]; then
            echo
            echo "ERROR: Cleanup parent SHA does not match."
            exit 1
          fi

          if [ "$ACTUAL_MESSAGE" != "$CLEANUP_MESSAGE" ]; then
            echo
            echo "ERROR: Cleanup commit message does not match."
            exit 1
          fi

          echo
          echo "Checking cleanup parent is already in current main..."

          if ! git merge-base --is-ancestor "$CLEANUP_PARENT" "$MAIN_COMMIT"; then
            echo "ERROR: Cleanup parent is not an ancestor of current main."
            echo "STOPPING SAFELY."
            exit 1
          fi

          echo "PASS: Cleanup parent is in current main."

          echo
          echo "Checking cleanup commit is NOT already in main..."

          if git merge-base --is-ancestor "$CLEANUP_COMMIT" "$MAIN_COMMIT"; then
            echo "ERROR: Cleanup commit is already contained in main."
            echo "Nothing should be applied."
            exit 1
          fi

          echo "PASS: Cleanup commit is not yet in main."

      - name: Verify cleanup diff before applying
        shell: bash
        run: |
          set -euo pipefail

          CLEANUP_COMMIT="a5eaf450ab0d8b65dd4e16bfb25ccbfece620efd"

          echo "========================================"
          echo "VERIFY CLEANUP DIFF"
          echo "========================================"

          echo "Cleanup commit:"
          git show --no-ext-diff --stat "$CLEANUP_COMMIT"

          echo
          echo "Changed files:"
          git diff-tree \
            --no-commit-id \
            --name-status \
            -r \
            "$CLEANUP_COMMIT"

          echo
          echo "Checking cleanup commit is based on expected parent..."

          PARENT="$(git show -s --format='%P' "$CLEANUP_COMMIT")"

          if [ "$PARENT" != "97f50f032da8d1d851c60bd5af7f057be296460c" ]; then
            echo "ERROR: Unexpected cleanup parent."
            exit 1
          fi

          echo "PASS: Cleanup commit identity verified."

      - name: Apply cleanup with cherry-pick
        shell: bash
        run: |
          set -euo pipefail

          CLEANUP_COMMIT="a5eaf450ab0d8b65dd4e16bfb25ccbfece620efd"

          echo "========================================"
          echo "APPLY V10 SOURCE CLEANUP"
          echo "========================================"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Cherry-picking cleanup commit..."
          if ! git cherry-pick "$CLEANUP_COMMIT"; then
            echo
            echo "ERROR: Cherry-pick conflict detected."
            echo "Aborting cherry-pick."
            git cherry-pick --abort
            echo
            echo "STOPPING SAFELY."
            echo "No push performed."
            exit 1
          fi

          echo
          echo "Cherry-pick PASS."

          echo "New HEAD:"
          git rev-parse HEAD

          echo
          echo "New commit:"
          git log -1 --oneline

      - name: Verify resulting commit
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_MAIN="5806a66ac2f92857a6768c30b14bdbe5ff43d596"
          CLEANUP_COMMIT="a5eaf450ab0d8b65dd4e16bfb25ccbfece620efd"

          echo "========================================"
          echo "VERIFY RESULT BEFORE PUSH"
          echo "========================================"

          NEW_HEAD="$(git rev-parse HEAD)"

          if [ "$NEW_HEAD" = "$EXPECTED_MAIN" ]; then
            echo "ERROR: HEAD did not advance."
            exit 1
          fi

          echo "Old main:"
          echo "$EXPECTED_MAIN"

          echo
          echo "New HEAD:"
          echo "$NEW_HEAD"

          echo
          echo "Checking new HEAD parent..."

          NEW_PARENT="$(git show -s --format='%P' "$NEW_HEAD")"

          if [ "$NEW_PARENT" != "$EXPECTED_MAIN" ]; then
            echo "ERROR: New cleanup commit does not directly follow current main."
            echo "Expected parent:"
            echo "$EXPECTED_MAIN"
            echo "Actual parent:"
            echo "$NEW_PARENT"
            exit 1
          fi

          echo "PASS: New commit directly follows current main."

          echo
          echo "Checking cleanup diff..."

          if ! git diff --check "$EXPECTED_MAIN" "$NEW_HEAD"; then
            echo "ERROR: git diff --check failed."
            exit 1
          fi

          echo "PASS: git diff --check."

          echo
          echo "Changed files in resulting commit:"
          git diff-tree \
            --no-commit-id \
            --name-status \
            -r \
            "$NEW_HEAD"

          echo
          echo "Cleanup source commit being applied:"
          echo "$CLEANUP_COMMIT"

      - name: Push main using CARASSISTANT_PAT
        shell: bash
        env:
          CARASSISTANT_PAT: ${{ secrets.CARASSISTANT_PAT }}
        run: |
          set -euo pipefail

          if [ -z "${CARASSISTANT_PAT:-}" ]; then
            echo "ERROR: CARASSISTANT_PAT secret is empty or unavailable."
            exit 1
          fi

          echo "========================================"
          echo "PUSH CLEANUP TO MAIN"
          echo "========================================"

          git -c http.extraheader="" \
            push \
            "https://x-access-token:${CARASSISTANT_PAT}@github.com/nguyenvantien2111998123-jpg/CarAssistant.git" \
            HEAD:main

          echo
          echo "========================================"
          echo "PUSH PASS"
          echo "========================================"

          echo "V10 source structure cleanup is now on main."
