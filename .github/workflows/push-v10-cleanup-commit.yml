name: CarAssistant V10 - Push Cleanup Commit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push-cleanup-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify current main and cleanup commit
        shell: bash
        run: |
          set -euo pipefail

          CLEANUP_COMMIT="a5eaf450ab0d8b65dd4e16bfb25ccbfece620efd"

          echo "========================================"
          echo "V10 CLEANUP COMMIT PUSH"
          echo "========================================"

          echo "Current branch:"
          git branch --show-current

          echo
          echo "Current main:"
          git rev-parse HEAD

          echo
          echo "Fetching cleanup commit..."
          git fetch origin "$CLEANUP_COMMIT"

          echo
          echo "Cleanup commit:"
          git show --no-patch \
            --format='commit=%H%nparent=%P%nmessage=%s' \
            "$CLEANUP_COMMIT"

          echo
          echo "Checking cleanup commit..."
          git show --no-patch \
            --format='%s' \
            "$CLEANUP_COMMIT" | \
            grep -Fx "Normalize CarAssistant V10 source structure"

          echo
          echo "Checking working tree..."
          git status --short

          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: Working tree is not clean."
            exit 1
          fi

          echo
          echo "Verification PASS."

      - name: Apply cleanup commit without changing V10 architecture
        shell: bash
        run: |
          set -euo pipefail

          CLEANUP_COMMIT="a5eaf450ab0d8b65dd4e16bfb25ccbfece620efd"

          echo "========================================"
          echo "APPLY CLEANUP COMMIT"
          echo "========================================"

          if git merge-base --is-ancestor "$CLEANUP_COMMIT" HEAD; then
            echo "Cleanup commit is already contained in main."
            echo "Nothing to push."
            exit 0
          fi

          echo "Applying the exact cleanup diff with cherry-pick..."

          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              cherry-pick --no-edit "$CLEANUP_COMMIT"

          echo
          echo "Cherry-pick PASS."

          echo
          echo "New commit:"
          git log -1 --oneline

          echo
          echo "Changed files:"
          git diff --name-status HEAD^ HEAD

          echo
          echo "Diff check:"
          git diff --check HEAD^ HEAD

      - name: Push main using CARASSISTANT_PAT
        if: success()
        env:
          CARASSISTANT_PAT: ${{ secrets.CARASSISTANT_PAT }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CARASSISTANT_PAT:-}" ]; then
            echo "ERROR: CARASSISTANT_PAT secret is missing."
            exit 1
          fi

          echo "========================================"
          echo "PUSH TO MAIN"
          echo "========================================"

          git push \
            "https://x-access-token:${CARASSISTANT_PAT}@github.com/nguyenvantien2111998123-jpg/CarAssistant.git" \
            HEAD:main

          echo
          echo "PUSH PASS."
          echo "V10 cleanup commit is now on main."
