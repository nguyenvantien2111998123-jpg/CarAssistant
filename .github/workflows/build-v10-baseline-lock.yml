name: Build V10 Baseline Lock - Home UI V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-lock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact Home UI V2 baseline
        uses: actions/checkout@v4
        with:
          ref: 2c814a181d00cde9547a446927ae181e18cb9cbb
          fetch-depth: 1

      - name: Verify exact baseline commit
        shell: bash
        run: |
          set -e

          EXPECTED="2c814a181d00cde9547a446927ae181e18cb9cbb"
          ACTUAL="$(git rev-parse HEAD)"

          echo "EXPECTED=$EXPECTED"
          echo "ACTUAL=$ACTUAL"

          test "$ACTUAL" = "$EXPECTED"

          echo "BASELINE COMMIT: PASS"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build exact Home UI V2 source
        working-directory: v10-source
        shell: bash
        run: |
          set -e

          chmod +x ./gradlew

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace

          echo "JAVA COMPILE: PASS"

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

          echo "APK ASSEMBLE: PASS"

      - name: Create locked baseline artifact
        shell: bash
        run: |
          set -e

          mkdir -p baseline-lock

          APK="$(
            find v10-source/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          test -n "$APK"

          cp "$APK" \
            baseline-lock/CarAssistant-V10-Home-UI-V2-Baseline.apk

          sha256sum \
            baseline-lock/CarAssistant-V10-Home-UI-V2-Baseline.apk \
            | tee baseline-lock/SHA256SUM.txt

          printf '%s\n' \
            "BASELINE_COMMIT=2c814a181d00cde9547a446927ae181e18cb9cbb" \
            "BASELINE_NAME=Home UI V2" \
            "SOURCE=exact commit, no patch" \
            "JAVA=17" \
            "BUILD=:app:assembleDebug" \
            > baseline-lock/BASELINE.txt

      - name: Upload locked baseline
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Home-UI-V2-Baseline-Lock
          path: baseline-lock/
          if-no-files-found: error
          retention-days: 90

      - name: Final baseline lock confirmation
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "CARASSISTANT V10 HOME UI V2"
          echo "BASELINE LOCK: PASS"
          echo "=============================================="
          echo ""
          echo "LOCKED COMMIT:"
          echo "2c814a181d00cde9547a446927ae181e18cb9cbb"
          echo ""
          echo "NO SOURCE PATCH"
          echo "NO HOME UI PATCH"
          echo "NO NAVIGATION"
          echo "NO NEW FEATURE"
          echo ""
          echo "This commit is now the development baseline."
          echo "=============================================="
