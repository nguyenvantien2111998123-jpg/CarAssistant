
name: Fix Touch 3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix-touch-3:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout immutable baseline
        uses: actions/checkout@v4
        with:
          ref: b3528959d71cc33024db0ba0cc4fc65d1aa7d631
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify immutable baseline and workflow sources
        shell: bash
        run: |
          set -euo pipefail

          verify_sha() {
            local file="$1"
            local expected="$2"
            local actual

            test -f "$file"
            actual="$(git hash-object "$file")"

            echo "$file"
            echo "Expected: $expected"
            echo "Actual:   $actual"

            if [ "$actual" != "$expected" ]; then
              echo "FAIL: SHA mismatch; refusing to patch"
              exit 1
            fi
          }

          verify_sha \
            "v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java" \
            "61e82df0fd17e7851c7bf1628ac03a9391e48523"

          verify_sha \
            "v10-source/app/src/main/java/com/carassistant/v10/V10ProjectionSession.java" \
            "27a9ff439fb450750d49f35a546eab3bc2745b4d"

          verify_sha \
            "v10-source/app/src/main/java/com/carassistant/v10/V10InputController.java" \
            "6638fd6152fcad460f9f98c9e9f62ae80bb20bfe"

          verify_sha \
            "v10-source/app/src/main/java/com/carassistant/v10/hook/InputHooks.java" \
            "d99683ce631b1d7210327bcb23a9b2f41753f359"

          verify_sha \
            "v10-source/app/src/main/java/com/carassistant/v10/V10DisplayController.java" \
            "1a35bcaa7db0a5f892e56006f740b4ebf727be8a"

          verify_sha \
            ".github/workflows/build-v10-carassistant-keyboard-pass.yml" \
            "668362096c408b425d12429e987af4a293bb1667"

          verify_sha \
            ".github/workflows/Fix touch.yml" \
            "d70f5d961aadaea0dded1d464a1a13d98bd4d3a9"

          echo "PASS: all pinned baseline files verified"

      - name: Fetch pinned Fix Touch workflow source
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags --depth=1 origin main

          mkdir -p ".github/workflows"

          git show \
            "FETCH_HEAD:.github/workflows/Fix touch.yml" \
            > ".github/workflows/Fix touch.yml"

          test -s ".github/workflows/Fix touch.yml"

          ACTUAL="$(git hash-object ".github/workflows/Fix touch.yml")"
          EXPECTED="d70f5d961aadaea0dded1d464a1a13d98bd4d3a9"

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          test "$ACTUAL" = "$EXPECTED"

          echo "PASS: Fix Touch V2 workflow source fetched and verified"

      - name: Reuse keyboard PASS source-generation steps
        shell: bash
        run: |
          set -euo pipefail

          ruby <<'RUBY'
          require "yaml"
          require "open3"

          path = ".github/workflows/build-v10-carassistant-keyboard-pass.yml"
          workflow = YAML.load_file(path)
          steps = workflow.fetch("jobs").fetch("build").fetch("steps")

          first = "Diagnostic verify main source anchors"
          last  = "Show Navigation patch diff"

          start_index = steps.index { |s| s["name"] == first }
          end_index   = steps.index { |s| s["name"] == last }

          abort("FAIL: keyboard workflow start step not found") unless start_index
          abort("FAIL: keyboard workflow end step not found") unless end_index
          abort("FAIL: invalid keyboard step order") if end_index < start_index

          selected = steps[start_index..end_index]
          abort("FAIL: no keyboard source steps found") if selected.empty?

          selected.each do |step|
            name = step["name"] || "(unnamed keyboard step)"
            script = step["run"]
            next unless script

            puts ""
            puts "========== KEYBOARD SOURCE STEP: #{name} =========="

            _out, status = Open3.popen2e(
              "bash", "-e", "-u", "-o", "pipefail", "-c", script
            ) do |stdin, output, wait_thread|
              stdin.close
              output.each { |line| print line }
              wait_thread.value
            end

            abort("FAIL: keyboard source step: #{name}") unless status.success?
          end

          puts "PASS: keyboard and navigation source steps completed"
          RUBY

      - name: Reuse verified Fix Touch source-generation steps
        shell: bash
        run: |
          set -euo pipefail

          ruby <<'RUBY'
          require "yaml"
          require "open3"

          path = ".github/workflows/Fix touch.yml"
          workflow = YAML.load_file(path)
          steps = workflow.fetch("jobs").fetch("fix-touch").fetch("steps")

          first = "Patch multi-touch controller and session"
          last  = "Add app-origin injection hook"

          start_index = steps.index { |s| s["name"] == first }
          end_index   = steps.index { |s| s["name"] == last }

          abort("FAIL: touch patch start step not found") unless start_index
          abort("FAIL: touch patch end step not found") unless end_index
          abort("FAIL: invalid touch patch step order") if end_index < start_index

          selected = steps[start_index..end_index]
          abort("FAIL: no touch patch steps found") if selected.empty?

          selected.each do |step|
            name = step["name"] || "(unnamed touch step)"
            script = step["run"]
            next unless script

            puts ""
            puts "========== TOUCH SOURCE STEP: #{name} =========="

            _out, status = Open3.popen2e(
              "bash", "-e", "-u", "-o", "pipefail", "-c", script
            ) do |stdin, output, wait_thread|
              stdin.close
              output.each { |line| print line }
              wait_thread.value
            end

            abort("FAIL: touch source step: #{name}") unless status.success?
          end

          puts "PASS: existing touch injection hooks applied"
          RUBY

      - name: Fix original ACTION_DOWN preservation
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/V10InputController.java"

          cat > "$FILE" <<'EOF'
          package com.carassistant.v10;

          import android.view.MotionEvent;
          import android.view.View;

          public final class V10InputController {

              private final V10ProjectionSession session;

              private float downX;
              private float downY;
              private long downTime;

              private boolean moved;
              private boolean multiTouch;
              private MotionEvent pendingDown;

              private static final float MOVE_SLOP = 12f;
              private static final long SWIPE_MIN_DURATION = 80L;
              private static final long SWIPE_MAX_DURATION = 800L;

              public V10InputController(V10ProjectionSession session) {
                  this.session = session;
              }

              private void clearPendingDown() {
                  if (pendingDown != null) {
                      pendingDown.recycle();
                      pendingDown = null;
                  }
              }

              private void resetGesture() {
                  clearPendingDown();
                  multiTouch = false;
                  moved = false;
              }

              public View.OnTouchListener createListener() {
                  return (view, event) -> {
                      switch (event.getActionMasked()) {
                          case MotionEvent.ACTION_DOWN:
                              resetGesture();

                              downX = event.getX(0);
                              downY = event.getY(0);
                              downTime = event.getEventTime();

                              /*
                               * Save the REAL first-finger DOWN event.
                               * Do not inject it yet: single-finger gestures
                               * continue to use the existing root tap/swipe path.
                               */
                              pendingDown = MotionEvent.obtain(event);
                              return true;

                          case MotionEvent.ACTION_POINTER_DOWN:
                              if (!multiTouch) {
                                  multiTouch = true;

                                  /*
                                   * Replay the original first-finger event,
                                   * preserving its original coordinates,
                                   * downTime, eventTime, pointer properties,
                                   * source and flags.
                                   */
                                  if (pendingDown != null) {
                                      try {
                                          session.injectTouchEvent(pendingDown);
                                      } finally {
                                          clearPendingDown();
                                      }
                                  }

                                  /*
                                   * Then forward the actual second-finger event.
                                   */
                                  session.injectTouchEvent(event);
                              } else {
                                  session.injectTouchEvent(event);
                              }
                              return true;

                          case MotionEvent.ACTION_MOVE:
                              if (multiTouch) {
                                  session.injectTouchEvent(event);
                                  return true;
                              }

                              if (event.getPointerCount() == 1) {
                                  float dx = event.getX(0) - downX;
                                  float dy = event.getY(0) - downY;

                                  if (Math.abs(dx) > MOVE_SLOP
                                          || Math.abs(dy) > MOVE_SLOP) {
                                      moved = true;
                                  }
                              }
                              return true;

                          case MotionEvent.ACTION_POINTER_UP:
                              if (multiTouch) {
                                  session.injectTouchEvent(event);
                              }
                              return true;

                          case MotionEvent.ACTION_UP:
                              if (multiTouch) {
                                  try {
                                      session.injectTouchEvent(event);
                                  } finally {
                                      resetGesture();
                                  }
                                  return true;
                              }

                              clearPendingDown();

                              float upX = event.getX(0);
                              float upY = event.getY(0);
                              long duration = event.getEventTime() - downTime;

                              if (!moved) {
                                  session.tap(upX, upY);
                              } else {
                                  duration = Math.max(
                                      SWIPE_MIN_DURATION,
                                      Math.min(SWIPE_MAX_DURATION, duration)
                                  );

                                  session.swipe(
                                      downX, downY, upX, upY, duration
                                  );
                              }

                              resetGesture();
                              return true;

                          case MotionEvent.ACTION_CANCEL:
                              if (multiTouch) {
                                  try {
                                      session.injectTouchEvent(event);
                                  } finally {
                                      resetGesture();
                                  }
                              } else {
                                  resetGesture();
                              }
                              return true;

                          default:
                              return true;
                      }
                  };
              }
          }
          EOF

          echo "PASS: original first-finger DOWN is preserved"
          grep -nE \
            'pendingDown|ACTION_POINTER_DOWN|ACTION_POINTER_UP|injectTouchEvent' \
            "$FILE"

      - name: Verify keyboard, hooks and patch scope
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/carassistant/v10"

          test -s "$BASE/CarAssistantKeyboard.java"
          test -s "$BASE/CarAssistantInputBridge.java"
          test -s "$BASE/CarAssistantKeyboardController.java"

          grep -q 'injectTouchEvent' "$BASE/V10ProjectionSession.java"
          grep -q 'installAppMultiTouchHook' \
            "$BASE/hook/InputHooks.java"

          grep -q 'pendingDown' "$BASE/V10InputController.java"
          grep -q 'ACTION_POINTER_DOWN' "$BASE/V10InputController.java"
          grep -q 'ACTION_POINTER_UP' "$BASE/V10InputController.java"

          echo "PASS: keyboard source files exist"
          echo "PASS: multi-touch injection hook exists"
          echo "PASS: original DOWN preservation exists"

          git diff --check

          echo "=== Changed source files ==="
          git status --short

      - name: Compile Java
        shell: bash
        run: |
          set -euo pipefail
          cd v10-source
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace compileDebugJavaWithJavac

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd v10-source
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Package APK and SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          mkdir -p dist
          cp "$APK" "dist/CarAssistant-Fix-Touch-V3.apk"

          sha256sum \
            "dist/CarAssistant-Fix-Touch-V3.apk" \
            > "dist/CarAssistant-Fix-Touch-V3.sha256"

          cat "dist/CarAssistant-Fix-Touch-V3.sha256"

      - name: Upload Fix Touch V3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-Fix-Touch-V3
          path: |
            dist/CarAssistant-Fix-Touch-V3.apk
            dist/CarAssistant-Fix-Touch-V3.sha256
          if-no-files-found: error
