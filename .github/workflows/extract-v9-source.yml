name: Extract Car Assistant V9 Source

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CarAssistant
        uses: actions/checkout@v4

      - name: Check V9 ZIP
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "CHECK V9 SOURCE ZIP"
          echo "=================================================="

          test -f "CarAssistant-V9-Source.zip"

          ls -lh "CarAssistant-V9-Source.zip"

      - name: Extract V9 source
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "EXTRACT V9 SOURCE"
          echo "=================================================="

          rm -rf v9-source
          mkdir -p v9-source

          unzip -q "CarAssistant-V9-Source.zip" -d v9-source

          echo "Extract completed."

      - name: Normalize V9 source directory
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "NORMALIZE V9 SOURCE"
          echo "=================================================="

          echo "Current extracted tree:"
          find v9-source -maxdepth 3 -type f | sort | head -200

          # Nếu ZIP có thêm một thư mục trung gian,
          # đưa nội dung project lên trực tiếp v9-source.
          if [ ! -f "v9-source/settings.gradle" ] &&
             [ ! -f "v9-source/settings.gradle.kts" ]; then

            FOUND_DIR="$(find v9-source -mindepth 1 -maxdepth 1 -type d | head -1 || true)"

            if [ -n "$FOUND_DIR" ] &&
               { [ -f "$FOUND_DIR/settings.gradle" ] ||
                 [ -f "$FOUND_DIR/settings.gradle.kts" ]; }; then

              echo "Found nested project: $FOUND_DIR"

              shopt -s dotglob
              mv "$FOUND_DIR"/* v9-source/
              rmdir "$FOUND_DIR"
            fi
          fi

      - name: Verify V9 source
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "VERIFY V9 SOURCE"
          echo "=================================================="

          test -d "v9-source/app"

          if [ -f "v9-source/settings.gradle" ]; then
            echo "settings.gradle: OK"
          elif [ -f "v9-source/settings.gradle.kts" ]; then
            echo "settings.gradle.kts: OK"
          else
            echo "ERROR: Missing settings.gradle"
            exit 1
          fi

          if [ -f "v9-source/build.gradle" ]; then
            echo "build.gradle: OK"
          elif [ -f "v9-source/build.gradle.kts" ]; then
            echo "build.gradle.kts: OK"
          else
            echo "ERROR: Missing build.gradle"
            exit 1
          fi

          test -f "v9-source/app/src/main/AndroidManifest.xml"

          echo
          echo "V9 source structure:"
          find v9-source -maxdepth 2 -type f | sort

      - name: Verify AACast engine
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "VERIFY AACAST ENGINE"
          echo "=================================================="

          grep -R -q "CarActivityService" v9-source/app/src/main/java

          grep -R -q "CarActivity" v9-source/app/src/main/java

          grep -R -q "createVirtualDisplay" v9-source/app/src/main/java

          test -f "v9-source/app/libs/aasdk-legacy.dex"
          test -f "v9-source/app/libs/aasdk-legacy.jar"

          echo "CarActivityService: OK"
          echo "CarActivity: OK"
          echo "VirtualDisplay: OK"
          echo "Legacy SDK: OK"

      - name: Show final V9 tree
        shell: bash
        run: |
          echo "=================================================="
          echo "FINAL V9 SOURCE TREE"
          echo "=================================================="

          find v9-source -maxdepth 4 -type f | sort

      - name: Package extracted V9 source
        shell: bash
        run: |
          set -e

          rm -f CarAssistant-V9-Source-Extracted.zip

          cd v9-source
          zip -qr "../CarAssistant-V9-Source-Extracted.zip" .

          cd ..

          ls -lh CarAssistant-V9-Source-Extracted.zip

      - name: Upload extracted V9 source
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V9-Source-Extracted
          path: |
            v9-source/
            CarAssistant-V9-Source-Extracted.zip
          if-no-files-found: error
          retention-days: 30
