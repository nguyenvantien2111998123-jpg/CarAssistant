name: Extract V9

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract v9.zip
        run: |
          set -e

          echo "=== Checking v9.zip ==="
          test -f v9.zip

          echo "=== ZIP CONTENT ==="
          unzip -l v9.zip

          echo "=== Creating v9-source ==="
          rm -rf v9-source
          mkdir -p v9-source

          echo "=== Extracting ==="
          unzip -q v9.zip -d v9-source

          echo "=== Extracted files ==="
          find v9-source -type f | sort

      - name: Commit v9-source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add v9-source

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract V9 source"
            git push
          fi
