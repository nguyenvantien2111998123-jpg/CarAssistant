          unzip -q "CarAssistant-V9-Source.zip" -d v9-source

          INNER_ZIP="$(find v9-source -type f -name '*.zip' | head -1)"

          if [ -n "$INNER_ZIP" ]; then
            TMP_DIR="$(mktemp -d)"
            unzip -q "$INNER_ZIP" -d "$TMP_DIR"

            rm -rf v9-source
            mkdir -p v9-source

            shopt -s dotglob
            mv "$TMP_DIR"/* v9-source/
            rm -rf "$TMP_DIR"
          fi
