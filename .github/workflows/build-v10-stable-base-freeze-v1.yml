name: Build CarAssistant V10 Stable Base Freeze V1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable-base:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install PyYAML
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check PyYAML

      - name: Restore exact V10-6A baseline
        shell: bash
        run: |
          set -euo pipefail

          BASELINE="9075636a7d5947c1b0eee49c2bd3fd0e1b6b0cf1"

          git fetch origin "$BASELINE" --depth=1

          rm -rf v10-source

          git checkout "$BASELINE" -- v10-source

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$SRC/V10ProjectionSession.java"
          test -f "$SRC/V10CarActivity.java"
          test -f "$SRC/V10SessionStore.java"

          if [ -f "$SRC/V10ProjectionService.java" ]; then
            echo "ERROR: V10ProjectionService.java exists"
            exit 1
          fi

          echo "Exact V10-6A baseline restored."

      - name: Verify V10-6A baseline
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          grep -Fq "DisplayManager" "$SRC/V10ProjectionSession.java"
          grep -Fq "createVirtualDisplay" "$SRC/V10ProjectionSession.java"
          grep -Fq "RootShellSession" "$SRC/V10ProjectionSession.java"
          grep -Fq "am force-stop" "$SRC/V10ProjectionSession.java"
          grep -Fq "public void onStop()" "$SRC/V10CarActivity.java"
          grep -Fq "session.release()" "$SRC/V10CarActivity.java"

          echo "V10-6A baseline markers OK."

      - name: Create Display Core V1 from exact workflow
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/run_core.py <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          workflow = Path(
              ".github/workflows/build-v10-display-core-v1.yml"
          )

          data = yaml.safe_load(
              workflow.read_text(encoding="utf-8")
          )

          steps = data["jobs"]["build"]["steps"]

          for step in steps:
              name = step.get("name", "")

              if name == "Build V10 Display Core V1":
                  break

              if "run" not in step:
                  continue

              if step.get("uses"):
                  continue

              print("CORE >", name)

              subprocess.run(
                  [
                      "bash",
                      "-euo",
                      "pipefail",
                      "-c",
                      step["run"]
                  ],
                  check=True
              )

          print("Display Core V1 source workflow completed.")
          PY

          python3 /tmp/run_core.py

      - name: Recover deleted Floating Touch workflow
        shell: bash
        run: |
          set -euo pipefail

          DELETE_COMMIT="6abfbe6a498a738c012a10cb13f98e285cdb8017"
          PATCH_PATH=".github/workflows/build-v10-display-core-v1-floating-touch-fixed.yml"

          git fetch origin "$DELETE_COMMIT" --depth=2

          PARENT="$(git rev-list --parents -n 1 "$DELETE_COMMIT" | awk '{print $2}')"

          if [ -z "$PARENT" ]; then
            echo "ERROR: Cannot find parent commit."
            exit 1
          fi

          git show "$PARENT:$PATCH_PATH" > /tmp/floating-touch-fixed.yml

          test -s /tmp/floating-touch-fixed.yml

          echo "Recovered Floating Touch workflow."
          echo "Recovered from parent commit: $PARENT"

      - name: Apply historical Floating Touch patch
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/apply_floating_touch.py <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import yaml

          workflow_path = Path("/tmp/floating-touch-fixed.yml")

          data = yaml.safe_load(
              workflow_path.read_text(encoding="utf-8")
          )

          patch_step = None

          for step in data["jobs"]["build"]["steps"]:
              if step.get("name") == "Patch V10CarActivity with Floating Touch only":
                  patch_step = step
                  break

          if patch_step is None:
              print("ERROR: Floating Touch patch step not found.")
              sys.exit(1)

          print("Applying historical Floating Touch patch.")

          subprocess.run(
              [
                  "bash",
                  "-e",
                  "uo",
                  "pipefail",
                  "-c",
                  patch_step["run"]
              ],
              check=True
          )

          print("Historical Floating Touch patch applied.")
          PY

          python3 /tmp/apply_floating_touch.py

      - name: Extract exact SAFE Long Press patch
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/extract_longpress.py <<'PY'
          from pathlib import Path
          import sys
          import yaml

          workflow = Path(
              ".github/workflows/build-v10-display-core-v1-floating-touch-longpress-safe.yml"
          )

          if not workflow.exists():
              print("ERROR: SAFE Long Press workflow not found.")
              sys.exit(1)

          data = yaml.safe_load(
              workflow.read_text(encoding="utf-8")
          )

          wanted = (
              "Replace the entire Floating Touch listener "
              "with SAFE long-press version"
          )

          patch_step = None

          for step in data["jobs"]["build"]["steps"]:
              if step.get("name") == wanted:
                  patch_step = step
                  break

          if patch_step is None:
              print("ERROR: SAFE Long Press step not found.")
              sys.exit(1)

          Path("/tmp/safe-longpress.sh").write_text(
              patch_step["run"],
              encoding="utf-8"
          )

          print("Exact SAFE Long Press patch extracted.")
          PY

          python3 /tmp/extract_longpress.py

          test -s /tmp/safe-longpress.sh

      - name: Apply exact SAFE Long Press patch
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          test -f "$FILE"

          bash -euo pipefail /tmp/safe-longpress.sh

          test -f "$FILE"

          echo "SAFE Long Press patch applied."

      - name: Verify Stable Base
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          ACTIVITY="$SRC/V10CarActivity.java"
          SESSION="$SRC/V10ProjectionSession.java"
          DISPLAY="$SRC/V10DisplayController.java"
          SURFACE="$SRC/V10SurfaceManager.java"
          TASK="$SRC/V10TaskSession.java"

          echo "Checking required files..."

          test -f "$ACTIVITY"
          test -f "$SESSION"
          test -f "$DISPLAY"
          test -f "$SURFACE"
          test -f "$TASK"

          echo "Checking Floating Touch..."

          grep -Fq "private TextView floatingTouchKey;" "$ACTIVITY"
          grep -Fq "createFloatingTouchKey();" "$ACTIVITY"
          grep -Fq "private void createFloatingTouchKey()" "$ACTIVITY"

          grep -Fq "floatingDragging" "$ACTIVITY"
          grep -Fq "floatingDownTime" "$ACTIVITY"
          grep -Fq "SystemClock.uptimeMillis()" "$ACTIVITY"
          grep -Fq "ViewConfiguration.getLongPressTimeout()" "$ACTIVITY"

          grep -Fq 'addFloatingMenuButton("BACK"' "$ACTIVITY"
          grep -Fq 'addFloatingMenuButton("HOME"' "$ACTIVITY"

          grep -Fq "handleControlBack();" "$ACTIVITY"
          grep -Fq "handleControlHome();" "$ACTIVITY"

          echo "Floating Touch verification: PASSED"

          echo "Checking Display Core..."

          grep -Fq "DisplayManager" "$DISPLAY"
          grep -Fq "createVirtualDisplay" "$DISPLAY"
          grep -Fq "virtualDisplay.setSurface(null)" "$DISPLAY"
          grep -Fq -- "--activity-reorder-to-front" "$DISPLAY"

          grep -Fq "launchNewTask" "$SESSION"
          grep -Fq "resumeExistingTask" "$SESSION"
          grep -Fq "RootShellSession" "$SESSION"
          grep -Fq "State.HIDDEN" "$SESSION"

          grep -Fq "class V10TaskSession" "$TASK"
          grep -Fq "class V10SurfaceManager" "$SURFACE"

          echo "Display Core verification: PASSED"

          echo "Checking Activity lifecycle..."

          if grep -Fq "session.release()" "$ACTIVITY"; then
            echo "INFO: session.release() exists somewhere in Activity."
          fi

          echo "Checking forbidden legacy features..."

          if grep -Fq "floatingLastTap" "$ACTIVITY"; then
            echo "ERROR: floatingLastTap remains."
            exit 1
          fi

          if grep -Fq "session.recents()" "$ACTIVITY"; then
            echo "ERROR: RECENTS logic remains."
            exit 1
          fi

          if grep -Fq '"RECENTS"' "$ACTIVITY"; then
            echo "ERROR: RECENTS menu remains."
            exit 1
          fi

          if grep -Fq '"2 SCREEN"' "$ACTIVITY"; then
            echo "ERROR: 2 SCREEN remains."
            exit 1
          fi

          if grep -Fq '"3 SCREEN"' "$ACTIVITY"; then
            echo "ERROR: 3 SCREEN remains."
            exit 1
          fi

          if grep -Fq "setLayoutModeExternal(" "$ACTIVITY"; then
            echo "ERROR: external layout patch detected."
            exit 1
          fi

          if grep -Fq "V10ProjectionService" "$SESSION"; then
            echo "ERROR: V10ProjectionService detected."
            exit 1
          fi

          if grep -Fq "am force-stop" "$SESSION"; then
            echo "ERROR: force-stop detected in V10ProjectionSession."
            exit 1
          fi

          if grep -Fq "am force-stop" "$DISPLAY"; then
            echo "ERROR: force-stop detected in V10DisplayController."
            exit 1
          fi

          echo
          echo "=============================================="
          echo "CARASSISTANT V10 STABLE BASE V1"
          echo "SOURCE VERIFICATION: PASSED"
          echo "=============================================="

      - name: Compile Java
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            compileDebugJavaWithJavac

      - name: Assemble Stable Base APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Locate APK and SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find \
            v10-source/app/build/outputs/apk/debug \
            -type f \
            -name '*.apk' \
            -print \
            -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          test -f "$APK"

          mkdir -p stable-base

          echo "APK=$APK"

          sha256sum "$APK" \
            | tee stable-base/CarAssistant-V10-Stable-Base-V1-apk.sha256

      - name: Create Stable Base manifest
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p stable-base

          cat > stable-base/STABLE-BASE.txt <<'EOF'
          CarAssistant V10 Stable Base V1

          ==========================================
          BASE
          ==========================================

          V10-6A baseline

          Commit:
          9075636a7d5947c1b0eee49c2bd3fd0e1b6b0cf1

          ==========================================
          DISPLAY
          ==========================================

          Display Core V1

          ==========================================
          FLOATING TOUCH
          ==========================================

          Historical Floating Touch patch recovered
          from deleted workflow.

          Delete commit:
          6abfbe6a498a738c012a10cb13f98e285cdb8017

          Parent containing original workflow:
          953d6c61664530a94c1813b9335a97d08c212611

          ==========================================
          SAFE TOUCH
          ==========================================

          Floating button
          Drag and drop
          Position persistence
          Short press menu
          BACK
          HOME
          Long press HOME

          ==========================================
          EXCLUDED
          ==========================================

          RECENTS
          2 SCREEN
          3 SCREEN
          V10ProjectionService
          am force-stop

          ==========================================
          PURPOSE
          ==========================================

          This package is the frozen V10 Stable Base.

          Future features must be implemented as
          isolated patches on top of this base.

          Display Core, ProjectionSession, TaskSession
          and Floating Touch must not be rewritten
          unless explicitly required and separately
          tested.
          EOF

          cat stable-base/STABLE-BASE.txt

      - name: Package frozen Stable Base source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p stable-base

          cp -a v10-source stable-base/v10-source

          rm -rf stable-base/v10-source/.gradle
          rm -rf stable-base/v10-source/app/build

          cd stable-base

          zip -qr \
            CarAssistant-V10-Stable-Base-V1-source.zip \
            v10-source

          sha256sum \
            CarAssistant-V10-Stable-Base-V1-source.zip \
            | tee CarAssistant-V10-Stable-Base-V1-source.sha256

      - name: Upload Stable Base
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Stable-Base-V1
          path: |
            v10-source/app/build/outputs/apk/debug/*.apk
            stable-base/STABLE-BASE.txt
            stable-base/CarAssistant-V10-Stable-Base-V1-apk.sha256
            stable-base/CarAssistant-V10-Stable-Base-V1-source.zip
            stable-base/CarAssistant-V10-Stable-Base-V1-source.sha256
          if-no-files-found: error
          retention-days: 30
