name: Build CarAssistant V10 Stable Base Freeze V1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable-base:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install PyYAML
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check PyYAML

      - name: Restore exact V10-6A baseline
        run: |
          set -euo pipefail

          BASELINE="9075636a7d5947c1b0eee49c2bd3fd0e1b6b0cf1"

          git fetch origin "$BASELINE" --depth=1

          rm -rf v10-source
          git checkout "$BASELINE" -- v10-source

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$SRC/V10ProjectionSession.java"
          test -f "$SRC/V10CarActivity.java"
          test -f "$SRC/V10SessionStore.java"

          if [ -f "$SRC/V10ProjectionService.java" ]; then
            echo "ERROR: V10ProjectionService.java exists"
            exit 1
          fi

          echo "Exact V10-6A baseline restored."

      - name: Verify V10-6A baseline
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          grep -Fq "DisplayManager" "$SRC/V10ProjectionSession.java"
          grep -Fq "createVirtualDisplay" "$SRC/V10ProjectionSession.java"
          grep -Fq "RootShellSession" "$SRC/V10ProjectionSession.java"
          grep -Fq "am force-stop" "$SRC/V10ProjectionSession.java"

          grep -Fq "public void onStop()" "$SRC/V10CarActivity.java"
          grep -Fq "session.release()" "$SRC/V10CarActivity.java"

          echo "V10-6A baseline markers OK."

      - name: Create Display Core V1 from exact workflow
        run: |
          set -euo pipefail

          cat > /tmp/run_core.py <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          workflow = Path(
              ".github/workflows/build-v10-display-core-v1.yml"
          )

          data = yaml.safe_load(
              workflow.read_text(encoding="utf-8")
          )

          steps = data["jobs"]["build"]["steps"]

          for step in steps:
              name = step.get("name", "")

              if name == "Build V10 Display Core V1":
                  break

              if "run" not in step:
                  continue

              if step.get("uses"):
                  continue

              print("CORE >", name)

              subprocess.run(
                  [
                      "bash",
                      "-euo",
                      "pipefail",
                      "-c",
                      step["run"]
                  ],
                  check=True
              )

          print("Display Core V1 source workflow completed.")
          PY

          python3 /tmp/run_core.py

      - name: Recover deleted Floating Touch workflow
        run: |
          set -euo pipefail

          DELETE_COMMIT="6abfbe6a498a738c012a10cb13f98e285cdb8017"
          PATCH_PATH=".github/workflows/build-v10-display-core-v1-floating-touch-fixed.yml"

          git fetch origin "$DELETE_COMMIT" --depth=2

          PARENT="$(git rev-list --parents -n 1 "$DELETE_COMMIT" | awk '{print $2}')"

          if [ -z "$PARENT" ]; then
            echo "ERROR: Cannot find parent commit."
            exit 1
          fi

          git show "$PARENT:$PATCH_PATH" > /tmp/floating-touch-fixed.yml

          test -s /tmp/floating-touch-fixed.yml

          echo "Recovered Floating Touch workflow."
          echo "Recovered from parent commit: $PARENT"

      - name: Apply historical Floating Touch patch
        run: |
          set -euo pipefail

          cat > /tmp/apply_floating_touch.py <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import yaml

          workflow_path = Path("/tmp/floating-touch-fixed.yml")

          data = yaml.safe_load(
              workflow_path.read_text(encoding="utf-8")
          )

          patch_step = None

          for step in data["jobs"]["build"]["steps"]:
              if step.get("name") == "Patch V10CarActivity with Floating Touch only":
                  patch_step = step
                  break

          if patch_step is None:
              print("ERROR: Floating Touch patch step not found.")
              sys.exit(1)

          print("Applying historical Floating Touch patch.")

          subprocess.run(
              [
                  "bash",
                  "-euo",
                  "pipefail",
                  "-c",
                  patch_step["run"]
              ],
              check=True
          )

          print("Historical Floating Touch patch applied.")
          PY

          python3 /tmp/apply_floating_touch.py

      - name: Extract exact SAFE Long Press patch
        run: |
          set -euo pipefail

          cat > /tmp/extract_longpress.py <<'PY'
          from pathlib import Path
          import yaml
          import sys

          workflow = Path(
              ".github/workflows/build-v10-display-core-v1-floating-touch-longpress-safe.yml"
          )

          if not workflow.exists():
              print("ERROR: Known-good SAFE Long Press workflow not found.")
              sys.exit(1)

          data = yaml.safe_load(
              workflow.read_text(encoding="utf-8")
          )

          target = None

          for step in data["jobs"]["build"]["steps"]:
              name = step.get("name", "")
              if name == "Replace the entire Floating Touch listener with SAFE long-press version":
                  target = step
                  break

          if target is None:
              print("ERROR: Exact SAFE Long Press step not found.")
              sys.exit(1)

          run_text = target.get("run")

          if not run_text:
              print("ERROR: SAFE Long Press step has no run block.")
              sys.exit(1)

          Path("/tmp/safe-longpress.sh").write_text(
              run_text,
              encoding="utf-8"
          )

          print("Exact SAFE Long Press patch extracted.")
          PY

          python3 /tmp/extract_longpress.py

          test -s /tmp/safe-longpress.sh

      - name: Apply exact SAFE Long Press patch
        run: |
          set -euo pipefail

          bash -euo pipefail /tmp/safe-longpress.sh

          echo "Exact SAFE Long Press patch applied."

      - name: Verify Stable Base
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"
          DISPLAY="$SRC/V10DisplayController.java"
          SURFACE="$SRC/V10SurfaceManager.java"
          SESSION="$SRC/V10ProjectionSession.java"
          TASK="$SRC/V10TaskSession.java"
          ACTIVITY="$SRC/V10CarActivity.java"

          echo "Checking required Display Core files..."

          test -f "$DISPLAY"
          test -f "$SURFACE"
          test -f "$TASK"
          test -f "$SESSION"
          test -f "$ACTIVITY"

          grep -Fq "DisplayManager" "$DISPLAY"
          grep -Fq "createVirtualDisplay" "$DISPLAY"
          grep -Fq "virtualDisplay.setSurface(null)" "$DISPLAY"
          grep -Fq -- "--activity-reorder-to-front" "$DISPLAY"

          echo "Display Core markers OK."

          echo "Checking Projection Session..."

          grep -Fq "launchNewTask" "$SESSION"
          grep -Fq "resumeExistingTask" "$SESSION"
          grep -Fq "RootShellSession" "$SESSION"
          grep -Fq "State.HIDDEN" "$SESSION"

          echo "Projection Session markers OK."

          echo "Checking Task Session..."

          grep -Fq "enum State" "$TASK"
          grep -Fq "NEW" "$TASK"
          grep -Fq "ACTIVE" "$TASK"
          grep -Fq "HIDDEN" "$TASK"
          grep -Fq "CLOSED" "$TASK"

          echo "Task Session markers OK."

          echo "Checking Floating Touch..."

          grep -Fq "floatingTouchKey" "$ACTIVITY"
          grep -Fq "createFloatingTouchKey()" "$ACTIVITY"
          grep -Fq "ViewConfiguration.getLongPressTimeout()" "$ACTIVITY"
          grep -Fq "floatingDownTime" "$ACTIVITY"

          echo "Floating Touch markers OK."

          echo "Checking forbidden legacy paths..."

          if grep -Fq "V10ProjectionService" "$ACTIVITY"; then
            echo "ERROR: V10ProjectionService reference found."
            exit 1
          fi

          if grep -Fq "am force-stop" "$SESSION"; then
            echo "ERROR: am force-stop found in ProjectionSession."
            exit 1
          fi

          if grep -Fq "session.recents()" "$ACTIVITY"; then
            echo "ERROR: legacy session.recents() found."
            exit 1
          fi

          if grep -Fq '"RECENTS"' "$ACTIVITY"; then
            echo "ERROR: legacy RECENTS menu found."
            exit 1
          fi

          if grep -Fq '"2 SCREEN"' "$ACTIVITY"; then
            echo "ERROR: legacy 2 SCREEN menu found."
            exit 1
          fi

          if grep -Fq '"3 SCREEN"' "$ACTIVITY"; then
            echo "ERROR: legacy 3 SCREEN menu found."
            exit 1
          fi

          if grep -Fq "setLayoutModeExternal(" "$ACTIVITY"; then
            echo "ERROR: legacy external layout control found."
            exit 1
          fi

          echo "Stable Base verification PASSED."

      - name: Compile Java
        run: |
          set -euo pipefail

          cd v10-source

          ./gradlew \
            --no-daemon \
            --stacktrace \
            compileDebugJavaWithJavac

      - name: Assemble Stable Base APK
        run: |
          set -euo pipefail

          cd v10-source

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Locate APK and SHA256
        run: |
          set -euo pipefail

          APK="$(find v10-source -type f -path '*/build/outputs/apk/*/*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          cp "$APK" CarAssistant-V10-Stable-Base-V1.apk

          SHA="$(sha256sum CarAssistant-V10-Stable-Base-V1.apk | awk '{print $1}')"

          echo "APK: CarAssistant-V10-Stable-Base-V1.apk"
          echo "SHA256: $SHA"

          printf '%s\n' "$SHA" > CarAssistant-V10-Stable-Base-V1.sha256

      - name: Create Stable Base manifest
        run: |
          set -euo pipefail

          cat > Stable-Base-V1-MANIFEST.txt <<'EOF'
          CarAssistant V10 Stable Base Freeze V1

          BASELINE
          V10-6A commit:
          9075636a7d5947c1b0eee49c2bd3fd0e1b6b0cf1

          DISPLAY CORE
          Display Core V1 restored from:
          .github/workflows/build-v10-display-core-v1.yml

          FLOATING TOUCH
          Historical Floating Touch patch recovered from:
          commit 953d6c61664530a94c1813b9335a97d08c212611

          SAFE LONG PRESS
          Exact SAFE Long Press patch recovered from:
          .github/workflows/build-v10-display-core-v1-floating-touch-longpress-safe.yml

          PERSISTENCE
          No Persistence rewrite performed.

          HOME UI
          No Home UI redesign performed.

          LEGACY
          No V10ProjectionService.
          No am force-stop.
          No RECENTS menu.
          No 2 SCREEN menu.
          No 3 SCREEN menu.
          No external layout mode.

          PURPOSE
          This APK is the frozen Stable Base for subsequent isolated UI work.
          EOF

      - name: Package frozen Stable Base source
        run: |
          set -euo pipefail

          zip -qr \
            CarAssistant-V10-Stable-Base-V1-source.zip \
            v10-source

      - name: Upload Stable Base
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Stable-Base-V1
          path: |
            CarAssistant-V10-Stable-Base-V1.apk
            CarAssistant-V10-Stable-Base-V1.sha256
            Stable-Base-V1-MANIFEST.txt
            CarAssistant-V10-Stable-Base-V1-source.zip
          if-no-files-found: error
