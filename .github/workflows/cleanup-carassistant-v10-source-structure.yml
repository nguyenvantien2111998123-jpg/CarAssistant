name: CarAssistant V10 - Cleanup Source Structure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      # ============================================================
      # 1. CHECKOUT MAIN
      # ============================================================
      - name: 1 - Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Verify checkout revision
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CHECKOUT MAIN"
          echo "========================================"

          git branch --show-current || true
          git rev-parse HEAD

          test -d v10-source
          test -f v10-source/settings.gradle
          test -f v10-source/build.gradle
          test -f v10-source/gradlew
          test -f v10-source/app/build.gradle
          test -f v10-source/app/src/main/AndroidManifest.xml

          echo "PASS: main source tree exists."


      # ============================================================
      # 2. VERIFY EXACTLY 32 JAVA FILES
      # ============================================================
      - name: 2 - Verify exactly 32 Java files before cleanup
        shell: bash
        run: |
          set -euo pipefail

          OLD_ROOT="v10-source/app/src/main/java/com/carassistant/v10"

          echo "========================================"
          echo "VERIFY JAVA SOURCE BEFORE CLEANUP"
          echo "========================================"

          test -d "$OLD_ROOT"

          COUNT="$(find "$OLD_ROOT" -type f -name '*.java' | wc -l | tr -d ' ')"

          echo "Java file count: $COUNT"

          if [ "$COUNT" != "32" ]; then
            echo "ERROR: Expected exactly 32 Java files."
            echo "Actual: $COUNT"
            echo
            echo "Current Java files:"
            find "$OLD_ROOT" -type f -name '*.java' | sort
            exit 1
          fi

          echo "PASS: exactly 32 Java files exist."


      # ============================================================
      # 3. VERIFY PACKAGE
      # ============================================================
      - name: 3 - Verify all Java packages before cleanup
        shell: bash
        run: |
          set -euo pipefail

          OLD_ROOT="v10-source/app/src/main/java/com/carassistant/v10"

          echo "========================================"
          echo "VERIFY JAVA PACKAGE DECLARATIONS"
          echo "========================================"

          BAD=0

          while IFS= read -r FILE; do

            PACKAGE="$(grep -m1 '^package ' "$FILE" || true)"

            echo "$FILE"
            echo "  $PACKAGE"

            case "$FILE" in
              */hook/*)
                EXPECTED='package com.carassistant.v10.hook;'
                ;;
              */aabridge/*)
                EXPECTED='package com.carassistant.v10.aabridge;'
                ;;
              *)
                EXPECTED='package com.carassistant.v10;'
                ;;
            esac

            if [ "$PACKAGE" != "$EXPECTED" ]; then
              echo "ERROR: Package mismatch."
              echo "Expected: $EXPECTED"
              echo "Actual:   $PACKAGE"
              BAD=1
            fi

          done < <(find "$OLD_ROOT" -type f -name '*.java' | sort)

          if [ "$BAD" != "0" ]; then
            exit 1
          fi

          echo
          echo "PASS: all 32 Java files already declare com.carassistant.v10 packages."


      # ============================================================
      # 4. MOVE JAVA SOURCE
      # ============================================================
      - name: 4 - Move Java source to com/carassistant/v10
        shell: bash
        run: |
          set -euo pipefail

          OLD_ROOT="v10-source/app/src/main/java/com/carassistant/v10"
          NEW_ROOT="v10-source/app/src/main/java/com/carassistant/v10"

          echo "========================================"
          echo "MOVE JAVA SOURCE TREE"
          echo "========================================"

          test -d "$OLD_ROOT"

          if [ -e "$NEW_ROOT" ]; then
            echo "ERROR: Destination already exists:"
            echo "$NEW_ROOT"
            exit 1
          fi

          mkdir -p \
            "v10-source/app/src/main/java/com/carassistant"

          mv \
            "$OLD_ROOT" \
            "$NEW_ROOT"

          test -d "$NEW_ROOT"
          test ! -e "$OLD_ROOT"

          echo "PASS: Java source moved."

          echo
          echo "New source tree:"
          find "$NEW_ROOT" -type f -name '*.java' | sort


      # ============================================================
      # 5. XPOSED_INIT
      # ============================================================
      - name: 5 - Normalize xposed_init
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/assets/xposed_init"
          EXPECTED="com.carassistant.v10.aabridge.AACastBridge"

          echo "========================================"
          echo "NORMALIZE XPOSED INIT"
          echo "========================================"

          test -f "$FILE"

          printf '%s\n' "$EXPECTED" > "$FILE"

          ACTUAL="$(tr -d '\r\n' < "$FILE")"

          echo "xposed_init:"
          echo "$ACTUAL"

          test "$ACTUAL" = "$EXPECTED"

          if grep -Fq 'com.carassistant.v9' "$FILE"; then
            echo "ERROR: V9 xposed_init reference remains."
            exit 1
          fi

          echo "PASS: xposed_init points to V10 AACastBridge."


      # ============================================================
      # 6. PROGUARD
      # ============================================================
      - name: 6 - Normalize ProGuard package references
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/proguard-rules.pro"

          echo "========================================"
          echo "NORMALIZE PROGUARD"
          echo "========================================"

          test -f "$FILE"

          sed -i \
            's/com\.hieptran\.aacast\.doudou/com.carassistant.v10/g' \
            "$FILE"

          sed -i \
            's/com\/hieptran\/aacast\/doudou/com\/carassistant\/v10/g' \
            "$FILE"

          echo "Checking ProGuard..."

          if grep -nE \
            'com\.hieptran\.aacast\.doudou|com/carassistant/v10' \
            "$FILE"; then

            echo "ERROR: Old package remains in ProGuard."
            exit 1
          fi

          grep -Fq \
            'com.carassistant.v10.aabridge.AACastBridge' \
            "$FILE"

          echo "PASS: ProGuard package references normalized."


      # ============================================================
      # 7. NORMALIZE ALL WORKFLOW REFERENCES
      # ============================================================
      - name: 7 - Normalize all workflow source paths
        shell: bash
        run: |
          set -euo pipefail

          OLD_PATH="com/carassistant/v10"
          NEW_PATH="com/carassistant/v10"

          OLD_PACKAGE="com.carassistant.v10"
          NEW_PACKAGE="com.carassistant.v10"

          echo "========================================"
          echo "NORMALIZE WORKFLOW REFERENCES"
          echo "========================================"

          if [ ! -d ".github/workflows" ]; then
            echo "No workflow directory found."
            exit 1
          fi

          mapfile -t WORKFLOWS < <(
            find .github/workflows \
              -type f \
              \( -name '*.yml' -o -name '*.yaml' \) \
              -print
          )

          for FILE in "${WORKFLOWS[@]}"; do

            if grep -Fq "$OLD_PATH" "$FILE" || \
               grep -Fq "$OLD_PACKAGE" "$FILE"; then

              echo "Updating:"
              echo "  $FILE"

              sed -i \
                "s|$OLD_PATH|$NEW_PATH|g" \
                "$FILE"

              sed -i \
                "s|$OLD_PACKAGE|$NEW_PACKAGE|g" \
                "$FILE"
            fi

          done

          echo
          echo "Checking for remaining old workflow references..."

          if grep -RInE \
            'com/carassistant/v10|com\.hieptran\.aacast\.doudou' \
            .github/workflows \
            --include='*.yml' \
            --include='*.yaml'; then

            echo "ERROR: Old package/path remains in workflow files."
            exit 1
          fi

          echo "PASS: workflow references normalized."


      # ============================================================
      # 8. VERIFY-APK + README
      # ============================================================
      - name: 8 - Normalize verify-apk and V10 README files
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "NORMALIZE V10 DOCUMENTATION / TOOLS"
          echo "========================================"

          FILES=()

          if [ -f "v10-source/tools/verify-apk.sh" ]; then
            FILES+=("v10-source/tools/verify-apk.sh")
          fi

          if [ -f "v10-source/README.md" ]; then
            FILES+=("v10-source/README.md")
          fi

          if [ -f "v10-source/README.vi.md" ]; then
            FILES+=("v10-source/README.vi.md")
          fi

          for FILE in "${FILES[@]}"; do

            echo "Updating:"
            echo "  $FILE"

            sed -i \
              's/com\.hieptran\.aacast\.doudou/com.carassistant.v10/g' \
              "$FILE"

            sed -i \
              's/com\/hieptran\/aacast\/doudou/com\/carassistant\/v10/g' \
              "$FILE"

          done

          echo "PASS: verify-apk / README normalization complete."


      # ============================================================
      # 9. VERIFY NO OLD PACKAGE / OLD JAVA SOURCE
      # ============================================================
      - name: 9 - Verify no old package remains in V10 source
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFY NO OLD V10 PACKAGE REFERENCES"
          echo "========================================"

          if grep -RInE \
            'com\.hieptran\.aacast\.doudou|com/carassistant/v10' \
            v10-source \
            --exclude-dir=.gradle \
            --exclude-dir=build; then

            echo
            echo "ERROR: Old com.hieptran package/path still exists in v10-source."
            exit 1
          fi

          OLD_JAVA_ROOT="v10-source/app/src/main/java/com/hieptran"

          if [ -d "$OLD_JAVA_ROOT" ]; then

            OLD_JAVA_FILES="$(
              find "$OLD_JAVA_ROOT" \
                -type f \
                -name '*.java' \
                -print
            )"

            if [ -n "$OLD_JAVA_FILES" ]; then
              echo "ERROR: Old Java source files still exist:"
              echo "$OLD_JAVA_FILES"
              exit 1
            fi

            echo "Old com/hieptran directory contains no Java source."

            rmdir \
              "$OLD_JAVA_ROOT/aacast" \
              2>/dev/null || true

            rmdir \
              "$OLD_JAVA_ROOT" \
              2>/dev/null || true
          fi

          if [ -e "$OLD_JAVA_ROOT" ]; then
            echo "INFO: Legacy parent directory remains but contains no Java source."
          else
            echo "PASS: Old Java parent directory removed."
          fi

          echo "PASS: no old Java source/package references remain."


      # ============================================================
      # 10. VERIFY NO V9 XPOSED_INIT
      # ============================================================
      - name: 10 - Verify no V9 xposed_init reference
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/assets/xposed_init"

          echo "========================================"
          echo "VERIFY XPOSED ENTRY"
          echo "========================================"

          test -f "$FILE"

          EXPECTED="com.carassistant.v10.aabridge.AACastBridge"
          ACTUAL="$(tr -d '\r\n' < "$FILE")"

          echo "Expected:"
          echo "$EXPECTED"

          echo "Actual:"
          echo "$ACTUAL"

          test "$ACTUAL" = "$EXPECTED"

          if grep -Fq \
            'com.carassistant.v9' \
            "$FILE"; then

            echo "ERROR: V9 Xposed reference remains."
            exit 1
          fi

          if grep -Fq \
            'com.hieptran' \
            "$FILE"; then

            echo "ERROR: Old package remains in xposed_init."
            exit 1
          fi

          echo "PASS: xposed_init is V10-only."


      # ============================================================
      # 11. VERIFY EXACTLY 32 JAVA FILES AFTER MOVE
      # ============================================================
      - name: 11 - Verify exactly 32 Java files after cleanup
        shell: bash
        run: |
          set -euo pipefail

          NEW_ROOT="v10-source/app/src/main/java/com/carassistant/v10"

          echo "========================================"
          echo "VERIFY JAVA FILE COUNT AFTER CLEANUP"
          echo "========================================"

          test -d "$NEW_ROOT"

          COUNT="$(
            find "$NEW_ROOT" \
              -type f \
              -name '*.java' \
              | wc -l \
              | tr -d ' '
          )"

          echo "Java file count after cleanup: $COUNT"

          if [ "$COUNT" != "32" ]; then
            echo "ERROR: Java file count changed."
            echo "Expected: 32"
            echo "Actual:   $COUNT"
            exit 1
          fi

          echo "PASS: exactly 32 Java files remain."

          echo
          echo "Checking old Java source tree..."

          OLD_JAVA_FILES="$(
            find "v10-source/app/src/main/java/com/hieptran" \
              -type f \
              -name '*.java' \
              -print 2>/dev/null || true
          )"

          if [ -n "$OLD_JAVA_FILES" ]; then
            echo "ERROR: Old Java source files remain:"
            echo "$OLD_JAVA_FILES"
            exit 1
          fi

          echo "PASS: no old Java source files remain."


      # ============================================================
      # 12. VERIFY ANDROID CONFIGURATION
      # ============================================================
      - name: 12 - Verify Android configuration after cleanup
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="v10-source/app/build.gradle"
          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          echo "========================================"
          echo "VERIFY ANDROID CONFIGURATION"
          echo "========================================"

          grep -Fq \
            "namespace 'com.carassistant.v10'" \
            "$GRADLE"

          grep -Fq \
            'applicationId "com.carassistant.v10"' \
            "$GRADLE"

          grep -Fq \
            'com.carassistant.v10.V10LauncherActivity' \
            "$MANIFEST"

          grep -Fq \
            'com.carassistant.v10.V10CarActivity' \
            "$MANIFEST"

          grep -Fq \
            'com.carassistant.v10.AACastCarService' \
            "$MANIFEST"

          grep -Fq \
            'com.carassistant.v10.V10ControlReceiver' \
            "$MANIFEST"

          grep -Fq \
            'com.carassistant.v10.DockStateProvider' \
            "$MANIFEST"

          echo "PASS: Gradle namespace/applicationId."
          echo "PASS: Manifest component package names."


      # ============================================================
      # 13. COMPILE
      # ============================================================
      - name: 13 - Compile Debug Java
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "COMPILE DEBUG JAVA"
          echo "========================================"

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            :app:compileDebugJavaWithJavac \
            --stacktrace

          echo "PASS: compileDebugJavaWithJavac."


      # ============================================================
      # 14. ASSEMBLE APK
      # ============================================================
      - name: 14 - Assemble Debug APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "ASSEMBLE DEBUG APK"
          echo "========================================"

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

          echo "PASS: assembleDebug."


      # ============================================================
      # VERIFY APK
      # ============================================================
      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find v10-source/app/build/outputs/apk \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          test -s "$APK"

          echo "Generated APK:"
          echo "$APK"

          ls -lh "$APK"

          sha256sum "$APK"

          echo "PASS: APK exists."


      # ============================================================
      # FINAL SAFETY CHECK
      # ============================================================
      - name: Final cleanup safety check
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FINAL CLEANUP SAFETY CHECK"
          echo "========================================"

          OLD_COUNT="$(
            find v10-source/app/src/main/java \
              -type f \
              -name '*.java' \
              -path '*/com/hieptran/*' \
              | wc -l \
              | tr -d ' '
          )"

          echo "Old Java source count: $OLD_COUNT"

          if [ "$OLD_COUNT" != "0" ]; then
            echo "ERROR: Java files still exist under old package tree."
            find v10-source/app/src/main/java \
              -type f \
              -name '*.java' \
              -path '*/com/hieptran/*' \
              -print
            exit 1
          fi

          if grep -RInE \
            'com\.hieptran\.aacast\.doudou|com/carassistant/v10' \
            v10-source \
            .github/workflows \
            --exclude-dir=.gradle \
            --exclude-dir=build; then

            echo
            echo "ERROR: Old package/path remains after cleanup."
            exit 1
          fi

          XPOSED="v10-source/app/src/main/assets/xposed_init"

          test \
            "$(tr -d '\r\n' < "$XPOSED")" \
            = \
            "com.carassistant.v10.aabridge.AACastBridge"

          FINAL_COUNT="$(
            find v10-source/app/src/main/java/com/carassistant/v10 \
              -type f \
              -name '*.java' \
              | wc -l \
              | tr -d ' '
          )"

          test "$FINAL_COUNT" = "32"

          echo "PASS: no old Java package."
          echo "PASS: no old workflow path."
          echo "PASS: no V9 xposed_init."
          echo "PASS: exactly 32 Java files."
          echo "PASS: cleanup safety check."


      # ============================================================
      # GIT DIFF CHECK
      # ============================================================
      - name: Git diff check
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "GIT DIFF CHECK"
          echo "========================================"

          git diff --check

          echo
          echo "Changed files:"
          git status --short

          echo
          echo "Diff summary:"
          git diff --stat

          echo "PASS: git diff --check."


      # ============================================================
      # 15. COMMIT + PUSH MAIN
      # ============================================================
      - name: 15 - Commit cleanup to main
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "COMMIT CLEANUP TO MAIN"
          echo "========================================"

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "ERROR: No cleanup changes detected."
            exit 1
          fi

          echo
          echo "Staged changes:"
          git status --short

          git commit \
            -m "Normalize CarAssistant V10 source structure"

          echo
          echo "Pushing cleanup commit to main..."

          git push origin HEAD:main

          echo
          echo "========================================"
          echo "CLEANUP COMMITTED"
          echo "========================================"

          git rev-parse HEAD

          echo "PASS: cleanup committed and pushed to main."
