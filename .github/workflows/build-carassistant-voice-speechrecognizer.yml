name: Tro ly CarAsistant 

on:
 workflow_dispatch:

permissions:
 contents: read

jobs:
 build:
  runs-on: ubuntu-latest
  timeout-minutes: 25

  steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Gradle 8.13
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.13'

  - name: Create standalone Voice project
    shell: bash
    run: |
      set -euo pipefail

      PROJECT="carassistant-voice"
      JAVA_DIR="$PROJECT/app/src/main/java/com/carassistant/voice"

      mkdir -p "$JAVA_DIR"

      cat > "$PROJECT/settings.gradle" <<'EOF'
      pluginManagement {
          repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
          }
      }

      dependencyResolutionManagement {
          repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
          repositories {
              google()
              mavenCentral()
          }
      }

      rootProject.name = "CarAssistantVoice"
      include ':app'
      EOF

      cat > "$PROJECT/build.gradle" <<'EOF'
      plugins {
          id 'com.android.application' version '8.13.0' apply false
      }
      EOF

      cat > "$PROJECT/app/build.gradle" <<'EOF'
      plugins {
          id 'com.android.application'
      }

      android {
          namespace 'com.carassistant.voice'
          compileSdk 36

          defaultConfig {
              applicationId 'com.carassistant.voice'
              minSdk 29
              targetSdk 35
              versionCode 1
              versionName '0.1.0'
          }

          compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
          }

          buildTypes {
              debug {
                  minifyEnabled false
              }
          }
      }
      EOF

      cat > "$PROJECT/app/src/main/AndroidManifest.xml" <<'EOF'
      <?xml version="1.0" encoding="utf-8"?>
      <manifest xmlns:android="http://schemas.android.com/apk/res/android">

          <uses-permission
              android:name="android.permission.RECORD_AUDIO" />

          <queries>
              <intent>
                  <action
                      android:name="android.speech.RecognitionService" />
              </intent>
          </queries>

          <application
              android:allowBackup="false"
              android:label="CarAssistant Voice"
              android:theme="@android:style/Theme.Material.Light.NoActionBar">

              <activity
                  android:name=".MainActivity"
                  android:exported="true">

                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>

              </activity>
          </application>
      </manifest>
      EOF

      cat > "$JAVA_DIR/MainActivity.java" <<'EOF'
      package com.carassistant.voice;

      import android.Manifest;
      import android.app.Activity;
      import android.content.Intent;
      import android.content.pm.PackageManager;
      import android.graphics.Color;
      import android.media.AudioManager;
      import android.media.ToneGenerator;
      import android.os.Bundle;
      import android.speech.RecognitionListener;
      import android.speech.RecognizerIntent;
      import android.speech.SpeechRecognizer;
      import android.view.Gravity;
      import android.widget.Button;
      import android.widget.LinearLayout;
      import android.widget.ScrollView;
      import android.widget.TextView;

      import java.util.ArrayList;
      import java.util.Locale;

      public final class MainActivity extends Activity {

          private static final int MIC_REQUEST = 41;

          private SpeechRecognizer recognizer;
          private TextView status;
          private TextView transcript;
          private TextView action;
          private Button micButton;

          @Override
          protected void onCreate(Bundle state) {
              super.onCreate(state);

              getWindow().setStatusBarColor(Color.rgb(18, 24, 35));
              getWindow().setNavigationBarColor(Color.rgb(18, 24, 35));

              buildUi();

              if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                  status.setText(
                          "Không tìm thấy dịch vụ nhận dạng giọng nói.");
                  micButton.setEnabled(false);
              } else {
                  status.setText(
                          "Sẵn sàng. Nhấn mic và nói tiếng Việt.");
              }
          }

          private void buildUi() {
              LinearLayout root = new LinearLayout(this);
              root.setOrientation(LinearLayout.VERTICAL);
              root.setPadding(24, 30, 24, 24);
              root.setBackgroundColor(Color.rgb(18, 24, 35));

              TextView title = makeText("CarAssistant Voice", 27);
              title.setGravity(Gravity.CENTER);
              root.addView(title);

              status = makeText("Đang khởi tạo...", 16);
              status.setPadding(0, 24, 0, 16);
              root.addView(status);

              micButton = new Button(this);
              micButton.setText("🎙 BẮT ĐẦU NÓI");
              root.addView(micButton);

              root.addView(makeText("NỘI DUNG NHẬN DẠNG", 14));

              transcript = makeText(
                      "Lời nói sẽ hiển thị ở đây.", 21);
              transcript.setMinHeight(100);
              root.addView(transcript);

              root.addView(makeText("LỆNH ĐÃ PHÂN TÍCH", 14));

              action = makeText("Chưa có lệnh.", 17);
              root.addView(action);

              TextView note = makeText(
                      "Bản thử nghiệm dùng dịch vụ nhận dạng Android. " +
                      "Khả năng ngoại tuyến tùy dịch vụ trên điện thoại.",
                      13);
              note.setPadding(0, 24, 0, 0);
              root.addView(note);

              ScrollView scroll = new ScrollView(this);
              scroll.addView(root);
              setContentView(scroll);

              micButton.setOnClickListener(v -> startVoice());
          }

          private TextView makeText(String value, int size) {
              TextView view = new TextView(this);
              view.setText(value);
              view.setTextSize(size);
              view.setTextColor(Color.WHITE);
              return view;
          }

          private void startVoice() {
              if (checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                      != PackageManager.PERMISSION_GRANTED) {
                  requestPermissions(
                          new String[]{Manifest.permission.RECORD_AUDIO},
                          MIC_REQUEST);
                  return;
              }

              if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                  status.setText(
                          "Không có dịch vụ nhận dạng tương thích.");
                  return;
              }

              stopRecognizer();

              try {
                  recognizer =
                          SpeechRecognizer.createSpeechRecognizer(this);

                  recognizer.setRecognitionListener(
                          new RecognitionListener() {
                              @Override
                              public void onReadyForSpeech(Bundle params) {
                                  status.setText("Đang nghe...");
                              }

                              @Override
                              public void onBeginningOfSpeech() {
                                  status.setText("Đang nghe tiếng Việt...");
                              }

                              @Override
                              public void onRmsChanged(float rmsdB) {}

                              @Override
                              public void onBufferReceived(byte[] buffer) {}

                              @Override
                              public void onEndOfSpeech() {
                                  status.setText("Đang xử lý...");
                              }

                              @Override
                              public void onError(int error) {
                                  status.setText(errorMessage(error));
                                  micButton.setText("🎙 THỬ LẠI");
                                  stopRecognizer();
                              }

                              @Override
                              public void onResults(Bundle results) {
                                  showResults(results, false);
                              }

                              @Override
                              public void onPartialResults(Bundle results) {
                                  showResults(results, true);
                              }

                              @Override
                              public void onEvent(
                                      int eventType, Bundle params) {}
                          });

                  Intent intent = new Intent(
                          RecognizerIntent.ACTION_RECOGNIZE_SPEECH);

                  intent.putExtra(
                          RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                          RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);

                  intent.putExtra(
                          RecognizerIntent.EXTRA_LANGUAGE,
                          "vi-VN");

                  intent.putExtra(
                          RecognizerIntent.EXTRA_PARTIAL_RESULTS,
                          true);

                  intent.putExtra(
                          RecognizerIntent.EXTRA_PREFER_OFFLINE,
                          true);

                  intent.putExtra(
                          RecognizerIntent
                                  .EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS,
                          5000L);

                  transcript.setText("Đang chờ lời nói...");
                  action.setText("Chưa có lệnh.");
                  micButton.setText("ĐANG NGHE...");
                  status.setText("Chuẩn bị micro...");

                  ToneGenerator tone = new ToneGenerator(
                          AudioManager.STREAM_NOTIFICATION, 70);

                  tone.startTone(
                          ToneGenerator.TONE_PROP_BEEP, 160);

                  tone.release();

                  recognizer.startListening(intent);

              } catch (RuntimeException e) {
                  status.setText(
                          "Không thể khởi động nhận dạng giọng nói.");
                  micButton.setText("🎙 THỬ LẠI");
                  stopRecognizer();
              }
          }

          private void showResults(
                  Bundle bundle, boolean partial) {
              if (bundle == null) {
                  return;
              }

              ArrayList<String> matches = bundle.getStringArrayList(
                      SpeechRecognizer.RESULTS_RECOGNITION);

              if (matches == null || matches.isEmpty()) {
                  return;
              }

              String spoken = matches.get(0).trim();
              transcript.setText(spoken);

              if (!partial) {
                  status.setText("Đã nhận dạng xong.");
                  micButton.setText("🎙 NÓI TIẾP");
                  parseCommand(spoken);
                  stopRecognizer();
              }
          }

          private void parseCommand(String spoken) {
              String normalized =
                      spoken.toLowerCase(Locale.ROOT).trim();

              String query = normalized;

              String[] prefixes = {
                  "mở ", "tìm kiếm ", "tìm ", "phát "
              };

              for (String prefix : prefixes) {
                  if (query.startsWith(prefix)) {
                      query = query.substring(prefix.length()).trim();
                      break;
                  }
              }

              String[] suffixes = {
                  " trên youtube giúp tôi",
                  " trên youtube nhé",
                  " trên youtube"
              };

              for (String suffix : suffixes) {
                  if (query.endsWith(suffix)) {
                      query = query.substring(
                              0, query.length() - suffix.length()).trim();
                      break;
                  }
              }

              if (normalized.contains("youtube") && !query.isEmpty()) {
                  action.setText(
                          "ACTION: SEARCH_YOUTUBE\nQUERY: " + query +
                          "\n\nBản thử nghiệm chưa tự mở YouTube.");
              } else {
                  action.setText(
                          "ACTION: UNKNOWN\nTEXT: " + spoken);
              }
          }

          private String errorMessage(int error) {
              switch (error) {
                  case SpeechRecognizer.ERROR_NO_MATCH:
                      return "Không nhận ra lời nói. Hãy thử lại.";

                  case SpeechRecognizer.ERROR_SPEECH_TIMEOUT:
                      return "Không nghe thấy lời nói.";

                  case SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS:
                      return "Chưa được cấp quyền micro.";

                  case SpeechRecognizer.ERROR_NETWORK:
                  case SpeechRecognizer.ERROR_NETWORK_TIMEOUT:
                      return "Dịch vụ nhận dạng gặp lỗi mạng.";

                  case SpeechRecognizer.ERROR_RECOGNIZER_BUSY:
                      return "Bộ nhận dạng đang bận.";

                  default:
                      return "Nhận dạng thất bại. Mã lỗi: " + error;
              }
          }

          @Override
          public void onRequestPermissionsResult(
                  int requestCode,
                  String[] permissions,
                  int[] grantResults) {

              super.onRequestPermissionsResult(
                      requestCode, permissions, grantResults);

              if (requestCode == MIC_REQUEST
                      && grantResults.length > 0
                      && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                  startVoice();
              } else if (requestCode == MIC_REQUEST) {
                  status.setText("Bạn cần cấp quyền micro.");
              }
          }

          private void stopRecognizer() {
              if (recognizer != null) {
                  try {
                      recognizer.cancel();
                  } catch (RuntimeException ignored) {}

                  try {
                      recognizer.destroy();
                  } catch (RuntimeException ignored) {}

                  recognizer = null;
              }
          }

          @Override
          protected void onDestroy() {
              stopRecognizer();
              super.onDestroy();
          }
      }
      EOF

  - name: Verify generated files and manifest
    shell: bash
    run: |
      set -euo pipefail

      test -s carassistant-voice/settings.gradle
      test -s carassistant-voice/build.gradle
      test -s carassistant-voice/app/build.gradle
      test -s carassistant-voice/app/src/main/AndroidManifest.xml
      test -s carassistant-voice/app/src/main/java/com/carassistant/voice/MainActivity.java

      python3 - <<'PY'
      import xml.etree.ElementTree as ET

      ET.parse(
          "carassistant-voice/app/src/main/AndroidManifest.xml"
      )

      print("PASS: AndroidManifest.xml XML parse")
      print("PASS: generated source files exist")
      PY

  - name: Build standalone Voice APK
    shell: bash
    run: |
      set -euo pipefail

      cd carassistant-voice
      gradle --no-daemon --stacktrace assembleDebug

  - name: Package APK and checksum
    shell: bash
    run: |
      set -euo pipefail

      APK="carassistant-voice/app/build/outputs/apk/debug/app-debug.apk"
      test -s "$APK"

      mkdir -p dist

      cp "$APK" \
        dist/CarAssistant-Voice-SpeechRecognizer.apk

      sha256sum \
        dist/CarAssistant-Voice-SpeechRecognizer.apk \
        > dist/CarAssistant-Voice-SpeechRecognizer.sha256

      cat dist/CarAssistant-Voice-SpeechRecognizer.sha256

  - name: Upload standalone Voice APK
    uses: actions/upload-artifact@v4
    with:
      name: CarAssistant-Voice-SpeechRecognizer
      path: |
        dist/CarAssistant-Voice-SpeechRecognizer.apk
        dist/CarAssistant-Voice-SpeechRecognizer.sha256
      if-no-files-found: error
