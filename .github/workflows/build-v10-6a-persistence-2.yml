name: Build Car Assistant V10-6A Persistence 2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. REAL YAML VALIDATION
      # ============================================================
      - name: Validate workflow YAML
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --quiet pyyaml

          python3 - <<'PY'
          from pathlib import Path
          import yaml

          path = Path(".github/workflows/build-v10-6a-persistence-2.yml")

          if not path.exists():
              raise SystemExit(
                  "ERROR: workflow file not found."
              )

          text = path.read_text(encoding="utf-8")

          if not text.strip():
              raise SystemExit(
                  "ERROR: workflow file is empty."
              )

          try:
              data = yaml.safe_load(text)
          except Exception as exc:
              raise SystemExit(
                  f"ERROR: YAML parse failed: {exc}"
              )

          if not isinstance(data, dict):
              raise SystemExit(
                  "ERROR: YAML root is not a mapping."
              )

          if "name" not in data:
              raise SystemExit(
                  "ERROR: top-level 'name' is missing."
              )

          # PyYAML YAML 1.1 may parse "on" as boolean True.
          if "on" not in data and True not in data:
              raise SystemExit(
                  "ERROR: top-level 'on' is missing."
              )

          if "jobs" not in data:
              raise SystemExit(
                  "ERROR: top-level 'jobs' is missing."
              )

          if not isinstance(data["jobs"], dict):
              raise SystemExit(
                  "ERROR: 'jobs' is not a mapping."
              )

          if "build" not in data["jobs"]:
              raise SystemExit(
                  "ERROR: jobs.build is missing."
              )

          print("REAL YAML VALIDATION PASSED.")
          print("Workflow name:", data["name"])
          print("jobs.build detected.")
          PY

      # ============================================================
      # 3. RESTORE EXACT V10-6A BASELINE
      # ============================================================
      - name: Restore V10-6A source baseline
        shell: bash
        run: |
          set -euo pipefail

          BASELINE="9075636a7d5947c1b0eee49c2bd3fd0e1b6b0cf1"

          echo "Restoring V10-6A source from:"
          echo "$BASELINE"

          git fetch origin "$BASELINE" --depth=1
          git checkout "$BASELINE" -- v10-source

          test -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java

          test -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

          test -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/RootView.java

          if [ -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java
          ]; then
            echo "ERROR: V10ProjectionService.java exists."
            echo "This is NOT the V10-6A baseline."
            exit 1
          fi

          echo "V10-6A source baseline restored successfully."

      # ============================================================
      # 4. JDK
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 5. CHECK BASE SOURCE
      # ============================================================
      - name: Check source files
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          test -f app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java
          test -f app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java
          test -f app/src/main/java/com/hieptran/aacast/doudou/RootView.java

          echo "Source files OK."

      # ============================================================
      # 6. RECENTS
      # ============================================================
      - name: Patch V10ProjectionSession - display RECENTS
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          cat > /tmp/v10_recents_method.txt <<'EOF'
              public void recents() {
                  if (!isActive()) {
                      return;
                  }

                  final int displayId =
                          display.getDisplayId();

                  final String command =
                          "/system/bin/input -d "
                                  + displayId
                                  + " keyevent 187";

                  RootShellSession.EXEC.execute(
                          () -> {
                              try {
                                  rootShell.run(
                                          5,
                                          command);
                              } catch (Throwable t) {
                                  Log.w(
                                          TAG,
                                          "Recents failed",
                                          t);
                              }
                          });
              }

          EOF

          python3 - "$FILE" /tmp/v10_recents_method.txt <<'PY'
          from pathlib import Path
          import re
          import sys

          source = Path(sys.argv[1])
          method_file = Path(sys.argv[2])

          text = source.read_text(encoding="utf-8")
          method = method_file.read_text(encoding="utf-8")

          if "public void recents()" not in text:
              pattern = re.compile(
                  r"(?m)^[ \t]*public\s+void\s+back\s*\(\s*\)\s*\{"
              )

              match = pattern.search(text)

              if not match:
                  raise SystemExit(
                      "ERROR: V10ProjectionSession.back() was not found."
                  )

              text = (
                  text[:match.start()]
                  + method
                  + text[match.start():]
              )

              source.write_text(
                  text,
                  encoding="utf-8"
              )

          print("V10ProjectionSession RECENTS patch OK.")
          PY

      # ============================================================
      # 7. ACTIVITY IMPORTS
      # ============================================================
      - name: Patch V10CarActivity - imports
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          text = source.read_text(encoding="utf-8")

          marker = "import android.content.pm.ResolveInfo;"

          imports = [
              "import android.content.SharedPreferences;",
              "import android.os.SystemClock;",
              "import android.view.MotionEvent;",
              "import android.view.ViewConfiguration;",
              "import android.view.ViewGroup;",
          ]

          missing = [
              item
              for item in imports
              if item not in text
          ]

          if missing:
              if marker not in text:
                  raise SystemExit(
                      "ERROR: ResolveInfo import marker not found."
                  )

              addition = "\n".join(missing) + "\n"

              text = text.replace(
                  marker,
                  marker + "\n" + addition,
                  1
              )

              source.write_text(
                  text,
                  encoding="utf-8"
              )

          print("V10CarActivity imports OK.")
          PY

      # ============================================================
      # 8. FLOATING KEY FIELDS
      # ============================================================
      - name: Patch V10CarActivity - fields
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          cat > /tmp/v10_floating_fields.txt <<'EOF'
              private TextView floatingTouchKey;
              private LinearLayout floatingMenu;

              private boolean floatingDragging;
              private float floatingDownRawX;
              private float floatingDownRawY;
              private int floatingStartX;
              private int floatingStartY;
              private long floatingLastTap;

          EOF

          python3 - "$FILE" /tmp/v10_floating_fields.txt <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          field_file = Path(sys.argv[2])

          text = source.read_text(encoding="utf-8")
          fields = field_file.read_text(encoding="utf-8")

          if "private TextView floatingTouchKey;" not in text:
              marker = "    private V10ProjectionSession session;"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: V10ProjectionSession field marker not found."
                  )

              text = text.replace(
                  marker,
                  marker + "\n" + fields.rstrip(),
                  1
              )

              source.write_text(
                  text,
                  encoding="utf-8"
              )

          print("V10CarActivity fields OK.")
          PY

      # ============================================================
      # 9. FLOATING KEY CALL
      # IMPORTANT: marker has 16 spaces before textureView
      # ============================================================
      - name: Patch V10CarActivity - create floating key call
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          text = source.read_text(encoding="utf-8")

          if "createFloatingTouchKey();" in text:
              print("Floating key call already exists.")
              raise SystemExit(0)

          marker = """        session.attachTextureView(
                textureView);"""

          if marker not in text:
              raise SystemExit(
                  "ERROR: session.attachTextureView(textureView) marker not found."
              )

          replacement = (
              marker
              + "\n\n"
              + "        createFloatingTouchKey();"
          )

          text = text.replace(
              marker,
              replacement,
              1
          )

          source.write_text(
              text,
              encoding="utf-8"
          )

          print("Floating key call inserted.")
          PY

      # ============================================================
      # 10. FLOATING KEY IMPLEMENTATION
      # ============================================================
      - name: Patch V10CarActivity - floating key implementation
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          cat > /tmp/v10_floating_methods.txt <<'EOF'
              private void createFloatingTouchKey() {
                  if (floatingTouchKey != null) {
                      return;
                  }

                  floatingTouchKey = new TextView(this);
                  floatingTouchKey.setText("●");
                  floatingTouchKey.setTextColor(Color.WHITE);
                  floatingTouchKey.setTextSize(22);
                  floatingTouchKey.setGravity(Gravity.CENTER);

                  GradientDrawable bg =
                          new GradientDrawable();

                  bg.setShape(
                          GradientDrawable.OVAL);

                  bg.setColor(
                          Color.rgb(25, 35, 45));

                  bg.setStroke(
                          dp(2),
                          Color.rgb(80, 170, 230));

                  floatingTouchKey.setBackground(bg);
                  floatingTouchKey.setElevation(dp(12));

                  SharedPreferences prefs =
                          getSharedPreferences(
                                  "v10_floating_key",
                                  MODE_PRIVATE);

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  dp(58),
                                  dp(58),
                                  Gravity.TOP | Gravity.END);

                  int savedX =
                          prefs.getInt(
                                  "x",
                                  dp(18));

                  int savedY =
                          prefs.getInt(
                                  "y",
                                  dp(120));

                  params.setMargins(
                          0,
                          savedY,
                          savedX,
                          0);

                  projectionLayer.addView(
                          floatingTouchKey,
                          params);

                  floatingTouchKey.setOnTouchListener(
                          (view, event) -> {
                              switch (
                                      event.getActionMasked()) {

                                  case MotionEvent.ACTION_DOWN:
                                      floatingDragging = false;

                                      floatingDownRawX =
                                              event.getRawX();

                                      floatingDownRawY =
                                              event.getRawY();

                                      ViewGroup.LayoutParams lp =
                                              view.getLayoutParams();

                                      if (lp
                                              instanceof FrameLayout.LayoutParams) {
                                          FrameLayout.LayoutParams fp =
                                                  (FrameLayout.LayoutParams) lp;

                                          floatingStartX =
                                                  fp.rightMargin;

                                          floatingStartY =
                                                  fp.topMargin;
                                      }

                                      return true;

                                  case MotionEvent.ACTION_MOVE:
                                      float dx =
                                              event.getRawX()
                                                      - floatingDownRawX;

                                      float dy =
                                              event.getRawY()
                                                      - floatingDownRawY;

                                      if (!floatingDragging
                                              && Math.hypot(dx, dy)
                                              > ViewConfiguration
                                                      .get(this)
                                                      .getScaledTouchSlop()) {
                                          floatingDragging = true;
                                      }

                                      if (floatingDragging) {
                                          int width =
                                                  projectionLayer.getWidth();

                                          int height =
                                                  projectionLayer.getHeight();

                                          int keySize =
                                                  dp(58);

                                          int right =
                                                  Math.round(
                                                          floatingStartX
                                                                  - dx);

                                          int top =
                                                  Math.round(
                                                          floatingStartY
                                                                  + dy);

                                          right =
                                                  Math.max(
                                                          0,
                                                          Math.min(
                                                                  Math.max(
                                                                          0,
                                                                          width
                                                                                  - keySize),
                                                                  right));

                                          top =
                                                  Math.max(
                                                          0,
                                                          Math.min(
                                                                  Math.max(
                                                                          0,
                                                                          height
                                                                                  - keySize),
                                                                  top));

                                          FrameLayout.LayoutParams fp =
                                                  (FrameLayout.LayoutParams)
                                                          view.getLayoutParams();

                                          fp.rightMargin =
                                                  right;

                                          fp.topMargin =
                                                  top;

                                          view.setLayoutParams(fp);
                                      }

                                      return true;

                                  case MotionEvent.ACTION_UP:
                                      if (floatingDragging) {
                                          FrameLayout.LayoutParams fp =
                                                  (FrameLayout.LayoutParams)
                                                          view.getLayoutParams();

                                          prefs.edit()
                                                  .putInt(
                                                          "x",
                                                          fp.rightMargin)
                                                  .putInt(
                                                          "y",
                                                          fp.topMargin)
                                                  .apply();

                                          floatingDragging = false;

                                          return true;
                                      }

                                      long now =
                                              SystemClock.uptimeMillis();

                                      long delta =
                                              now
                                                      - floatingLastTap;

                                      floatingLastTap = now;

                                      if (delta > 0
                                              && delta < 320) {
                                          handleControlHome();
                                          hideFloatingMenu();
                                      } else {
                                          showFloatingMenu();
                                      }

                                      view.performClick();

                                      return true;

                                  case MotionEvent.ACTION_CANCEL:
                                      floatingDragging = false;
                                      return true;

                                  default:
                                      return true;
                              }
                          });

                  floatingTouchKey.bringToFront();
              }

              private void showFloatingMenu() {
                  if (floatingMenu != null) {
                      hideFloatingMenu();
                      return;
                  }

                  floatingMenu =
                          new LinearLayout(this);

                  floatingMenu.setOrientation(
                          LinearLayout.VERTICAL);

                  floatingMenu.setPadding(
                          dp(8),
                          dp(8),
                          dp(8),
                          dp(8));

                  GradientDrawable menuBg =
                          new GradientDrawable();

                  menuBg.setColor(
                          Color.rgb(15, 20, 26));

                  menuBg.setCornerRadius(
                          dp(16));

                  menuBg.setStroke(
                          dp(1),
                          Color.rgb(65, 85, 105));

                  floatingMenu.setBackground(
                          menuBg);

                  floatingMenu.setElevation(
                          dp(14));

                  addFloatingMenuButton(
                          "BACK",
                          () -> {
                              handleControlBack();
                              hideFloatingMenu();
                          });

                  addFloatingMenuButton(
                          "RECENTS",
                          () -> {
                              if (session != null) {
                                  session.recents();
                              }

                              hideFloatingMenu();
                          });

                  addFloatingMenuButton(
                          "2 SCREEN",
                          () -> {
                              switchToTwoScreen();
                              hideFloatingMenu();
                          });

                  addFloatingMenuButton(
                          "3 SCREEN",
                          () -> {
                              switchToThreeScreen();
                              hideFloatingMenu();
                          });

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  dp(170),
                                  -2,
                                  Gravity.TOP | Gravity.END);

                  params.setMargins(
                          0,
                          dp(70),
                          dp(18),
                          0);

                  projectionLayer.addView(
                          floatingMenu,
                          params);

                  floatingMenu.bringToFront();

                  floatingTouchKey.bringToFront();
              }

              private void addFloatingMenuButton(
                      String label,
                      Runnable action) {

                  TextView button =
                          new TextView(this);

                  button.setText(label);
                  button.setTextColor(Color.WHITE);
                  button.setTextSize(14);
                  button.setGravity(
                          Gravity.CENTER_VERTICAL);

                  GradientDrawable bg =
                          new GradientDrawable();

                  bg.setColor(
                          Color.rgb(28, 38, 48));

                  bg.setCornerRadius(
                          dp(10));

                  button.setBackground(bg);

                  button.setPadding(
                          dp(16),
                          0,
                          dp(16),
                          0);

                  button.setOnClickListener(
                          v -> action.run());

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(48));

                  params.setMargins(
                          0,
                          dp(3),
                          0,
                          dp(3));

                  floatingMenu.addView(
                          button,
                          params);
              }

              private void hideFloatingMenu() {
                  if (floatingMenu == null) {
                      return;
                  }

                  projectionLayer.removeView(
                          floatingMenu);

                  floatingMenu = null;
              }

              private void switchToTwoScreen() {
                  RootView rootView =
                          RootView.getCurrent();

                  if (rootView != null) {
                      rootView.setLayoutModeExternal(0);
                  }
              }

              private void switchToThreeScreen() {
                  RootView rootView =
                          RootView.getCurrent();

                  if (rootView != null) {
                      rootView.setLayoutModeExternal(2);
                  }
              }

          EOF

          python3 - "$FILE" /tmp/v10_floating_methods.txt <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          method_file = Path(sys.argv[2])

          text = source.read_text(encoding="utf-8")
          methods = method_file.read_text(encoding="utf-8")

          if "private void createFloatingTouchKey()" in text:
              print("Floating methods already exist.")
              raise SystemExit(0)

          marker = "    public void handleControlBack()"

          if marker not in text:
              raise SystemExit(
                  "ERROR: handleControlBack() marker not found."
              )

          text = text.replace(
              marker,
              methods.rstrip()
              + "\n\n"
              + marker,
              1
          )

          source.write_text(
              text,
              encoding="utf-8"
          )

          print("Floating key implementation inserted.")
          PY

      # ============================================================
      # 11. ROOTVIEW EXTERNAL LAYOUT
      # ============================================================
      - name: Patch RootView - external layout mode
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/RootView.java"

          cat > /tmp/v10_layout_method.txt <<'EOF'
              public void setLayoutModeExternal(int mode) {
                  final int targetMode =
                          clamp(mode, 0, 5);

                  handler.post(
                          () -> {
                              if (destroyed) {
                                  return;
                              }

                              layoutMode =
                                      targetMode;

                              loadRatios();

                              prefs.edit()
                                      .putInt(
                                              "layout_mode_v3",
                                              layoutMode)
                                      .apply();

                              applyVisibility();

                              container.requestLayout();
                              container.resizeAll();
                          });
              }

          EOF

          python3 - "$FILE" /tmp/v10_layout_method.txt <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          method_file = Path(sys.argv[2])

          text = source.read_text(encoding="utf-8")
          method = method_file.read_text(encoding="utf-8")

          if "setLayoutModeExternal(int mode)" in text:
              print("RootView external layout method already exists.")
              raise SystemExit(0)

          marker = "    public void reloadSettings()"

          if marker not in text:
              raise SystemExit(
                  "ERROR: RootView.reloadSettings() marker not found."
              )

          text = text.replace(
              marker,
              method.rstrip()
              + "\n\n"
              + marker,
              1
          )

          source.write_text(
              text,
              encoding="utf-8"
          )

          print("RootView patch OK.")
          PY

      # ============================================================
      # 12. PERSISTENCE 2 - PROJECTION SESSION
      # ============================================================
      - name: Patch Persistence 2 - ProjectionSession
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          source = Path(sys.argv[1])
          text = source.read_text(encoding="utf-8")

          # --------------------------------------------------------
          # Add targetLaunched field
          # --------------------------------------------------------
          if "private boolean targetLaunched;" not in text:
              marker = "    private boolean destroyed;"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: destroyed field marker not found."
                  )

              text = text.replace(
                  marker,
                  marker
                  + "\n"
                  + "    private boolean targetLaunched;",
                  1
              )

          # --------------------------------------------------------
          # Replace launchTarget()
          # --------------------------------------------------------
          start = text.find("    private void launchTarget()")

          if start < 0:
              raise SystemExit(
                  "ERROR: launchTarget() not found."
              )

          next_method = text.find(
              "\n    private void releaseDisplayOnly()",
              start
          )

          if next_method < 0:
              raise SystemExit(
                  "ERROR: releaseDisplayOnly() marker not found."
              )

          new_launch = r'''    private void launchTarget() {
          if (display == null || target == null) {
              return;
          }

          if (targetLaunched) {
              return;
          }

          final int displayId =
                  display.getDisplayId();

          final int userId =
                  Process.myUid() / 100000;

          final String flat =
                  target.flattenToString()
                          .replace(
                                  "'",
                                  "'\"'\"'");

          final String command =
                  "/system/bin/am start"
                          + " --user "
                          + userId
                          + " --display "
                          + displayId
                          + " --windowingMode 1"
                          + " -a android.intent.action.MAIN"
                          + " -c android.intent.category.LAUNCHER"
                          + " -f 0x18000000"
                          + " --activity-reorder-to-front"
                          + " -n '"
                          + flat
                          + "'";

          targetLaunched = true;

          RootShellSession.EXEC.execute(
                  () -> {
                      try {
                          rootShell.run(
                                  10,
                                  command);
                      } catch (Throwable t) {
                          Log.w(
                                  TAG,
                                  "Launch failed",
                                  t);
                      }
                  });
      }
'''

          text = (
              text[:start]
              + new_launch
              + text[next_method + 1:]
          )

          # --------------------------------------------------------
          # Replace releaseDisplayOnly()
          # --------------------------------------------------------
          start = text.find(
              "    private void releaseDisplayOnly()"
          )

          if start < 0:
              raise SystemExit(
                  "ERROR: releaseDisplayOnly() not found."
              )

          next_method = text.find(
              "\n    public void release()",
              start
          )

          if next_method < 0:
              raise SystemExit(
                  "ERROR: public release() marker not found."
              )

          new_release = r'''    private void releaseDisplayOnly() {
          if (virtualDisplay != null) {
              try {
                  virtualDisplay.release();
              } catch (Throwable ignored) {
              }
          }

          virtualDisplay = null;
          display = null;

          if (surface != null) {
              try {
                  surface.release();
              } catch (Throwable ignored) {
              }
          }

          surface = null;

          targetLaunched = false;
      }
'''

          text = (
              text[:start]
              + new_release
              + text[next_method + 1:]
          )

          # --------------------------------------------------------
          # Replace SurfaceTextureAvailable
          # --------------------------------------------------------
          old_available = r'''    @Override
      public void onSurfaceTextureAvailable(
              SurfaceTexture surface,
              int width,
              int height) {
          ensureDisplay();
      }
'''

          new_available = r'''    @Override
      public void onSurfaceTextureAvailable(
              SurfaceTexture surfaceTexture,
              int width,
              int height) {

          if (destroyed
                  || target == null
                  || textureView == null) {
              return;
          }

          try {
              surfaceTexture.setDefaultBufferSize(
                      width,
                      height);

              if (virtualDisplay != null) {
                  Surface newSurface =
                          new Surface(surfaceTexture);

                  if (surface != null) {
                      try {
                          surface.release();
                      } catch (Throwable ignored) {
                      }
                  }

                  surface = newSurface;

                  virtualDisplay.setSurface(
                          newSurface);

                  contentWidth = width;
                  contentHeight = height;

                  launchTarget();

                  Log.d(
                          TAG,
                          "Reattached Surface to existing VirtualDisplay.");
              } else {
                  ensureDisplay();
              }

          } catch (Throwable t) {
              Log.w(
                      TAG,
                      "Surface reattach failed",
                      t);
          }
      }
'''

          if old_available not in text:
              pattern = re.compile(
                  r"    @Override\s+"
                  r"public void onSurfaceTextureAvailable\s*\("
                  r".*?"
                  r"\n    \}\n",
                  re.DOTALL
              )

              match = pattern.search(text)

              if not match:
                  raise SystemExit(
                      "ERROR: onSurfaceTextureAvailable() not found."
                  )

              text = (
                  text[:match.start()]
                  + new_available
                  + text[match.end():]
              )
          else:
              text = text.replace(
                  old_available,
                  new_available,
                  1
              )

          # --------------------------------------------------------
          # Replace SurfaceTextureDestroyed
          # IMPORTANT:
          # DO NOT release VirtualDisplay here.
          # --------------------------------------------------------
          old_destroyed = r'''    @Override
      public boolean onSurfaceTextureDestroyed(
              SurfaceTexture surface) {
          releaseDisplayOnly();
          return true;
      }
'''

          new_destroyed = r'''    @Override
      public boolean onSurfaceTextureDestroyed(
              SurfaceTexture surfaceTexture) {

          if (virtualDisplay != null) {
              try {
                  virtualDisplay.setSurface(null);
              } catch (Throwable ignored) {
              }
          }

          if (surface != null) {
              try {
                  surface.release();
              } catch (Throwable ignored) {
              }
          }

          surface = null;

          Log.d(
                  TAG,
                  "Surface destroyed; keeping VirtualDisplay alive.");

          return true;
      }
'''

          if old_destroyed in text:
              text = text.replace(
                  old_destroyed,
                  new_destroyed,
                  1
              )
          else:
              pattern = re.compile(
                  r"    @Override\s+"
                  r"public boolean onSurfaceTextureDestroyed\s*\("
                  r".*?"
                  r"\n    \}\n",
                  re.DOTALL
              )

              match = pattern.search(text)

              if not match:
                  raise SystemExit(
                      "ERROR: onSurfaceTextureDestroyed() not found."
                  )

              text = (
                  text[:match.start()]
                  + new_destroyed
                  + text[match.end():]
              )

          source.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "Persistence 2 ProjectionSession patch OK."
          )
          PY

      # ============================================================
      # 13. PERSISTENCE 2 - ACTIVITY LIFECYCLE
      # ============================================================
      - name: Patch Persistence 2 - Activity lifecycle
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          source = Path(sys.argv[1])
          text = source.read_text(encoding="utf-8")

          # --------------------------------------------------------
          # Remove session.release() from onStop()
          # --------------------------------------------------------
          pattern = re.compile(
              r"(?s)(@Override\s+"
              r"\s*protected\s+void\s+onStop\s*\(\s*\)\s*\{)"
              r"(.*?)"
              r"(\n\s*super\.onStop\s*\(\s*\)\s*;\s*\n\s*\})"
          )

          match = pattern.search(text)

          if not match:
              raise SystemExit(
                  "ERROR: V10CarActivity.onStop() not found."
              )

          body = match.group(2)

          body = re.sub(
              r"\s*if\s*\(\s*session\s*!=\s*null\s*\)\s*\{\s*"
              r"session\.release\s*\(\s*\)\s*;\s*\}\s*",
              "\n",
              body
          )

          replacement = (
              match.group(1)
              + body
              + match.group(3)
          )

          text = (
              text[:match.start()]
              + replacement
              + text[match.end():]
          )

          source.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "Persistence 2 Activity lifecycle patch OK."
          )
          PY

      # ============================================================
      # 14. STATIC VERIFICATION
      # ============================================================
      - name: Verify V10-6A Persistence 2 source
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          SESSION="app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
          ACTIVITY="app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          ROOT="app/src/main/java/com/hieptran/aacast/doudou/RootView.java"

          echo "=========================================="
          echo "VERIFY ARCHITECTURE"
          echo "=========================================="

          if [ -f \
            app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java
          ]; then
            echo "ERROR: V10ProjectionService.java detected."
            echo "V10-8 architecture must NOT be used."
            exit 1
          fi

          echo "Architecture: PASS"

          echo "=========================================="
          echo "VERIFY RECENTS"
          echo "=========================================="

          grep -q "public void recents()" "$SESSION"
          grep -q "/system/bin/input -d " "$SESSION"
          grep -q "keyevent 187" "$SESSION"

          echo "RECENTS: PASS"

          echo "=========================================="
          echo "VERIFY FLOATING KEY"
          echo "=========================================="

          grep -q "createFloatingTouchKey" "$ACTIVITY"
          grep -q '"BACK"' "$ACTIVITY"
          grep -q '"RECENTS"' "$ACTIVITY"
          grep -q '"2 SCREEN"' "$ACTIVITY"
          grep -q '"3 SCREEN"' "$ACTIVITY"

          echo "Floating key/menu: PASS"

          echo "=========================================="
          echo "VERIFY ROOTVIEW"
          echo "=========================================="

          grep -q "setLayoutModeExternal(int mode)" "$ROOT"

          echo "2/3 SCREEN external control: PASS"

          echo "=========================================="
          echo "VERIFY PERSISTENCE 2"
          echo "=========================================="

          grep -q "private boolean targetLaunched;" "$SESSION"

          grep -q -- "--activity-reorder-to-front" "$SESSION"

          if grep -q "am force-stop" "$SESSION"; then
            echo "ERROR: am force-stop still exists."
            exit 1
          fi

          grep -q "virtualDisplay.setSurface(null)" "$SESSION"

          grep -q \
            "keeping VirtualDisplay alive" \
            "$SESSION"

          grep -q \
            "virtualDisplay.setSurface(newSurface)" \
            "$SESSION"

          if grep -A8 \
            "onSurfaceTextureDestroyed" \
            "$SESSION" \
            | grep -q "releaseDisplayOnly"; then
            echo "ERROR: Surface destruction still calls releaseDisplayOnly()."
            exit 1
          fi

          echo "ProjectionSession persistence: PASS"

          echo "=========================================="
          echo "VERIFY ACTIVITY onStop"
          echo "=========================================="

          ONSTOP_BLOCK="$(
            awk '
              /protected void onStop\(\)/ {inside=1}
              inside {print}
              inside && /^[[:space:]]*}/ {exit}
            ' "$ACTIVITY"
          )"

          echo "$ONSTOP_BLOCK"

          if echo "$ONSTOP_BLOCK" | grep -q "session.release"; then
            echo "ERROR: session.release() still exists in onStop()."
            exit 1
          fi

          echo "Activity lifecycle persistence: PASS"

          echo "=========================================="
          echo "VERIFY NO OLD FORCE-STOP"
          echo "=========================================="

          if grep -R \
            "am force-stop" \
            app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java; then
            echo "ERROR: force-stop command detected."
            exit 1
          fi

          echo "Force-stop check: PASS"

          echo "=========================================="
          echo "ALL STATIC CHECKS PASSED"
          echo "=========================================="

      # ============================================================
      # 15. COMPILE
      # ============================================================
      - name: Compile Java
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            compileDebugJavaWithJavac

      # ============================================================
