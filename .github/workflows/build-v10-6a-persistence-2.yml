name: Build Car Assistant V10-6A Persistence 2

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. REAL YAML SYNTAX CHECK
      # ============================================================
      - name: Validate workflow YAML
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing PyYAML..."
          python3 -m pip install \
            --disable-pip-version-check \
            --quiet \
            pyyaml

          echo "Validating workflow YAML..."

          python3 - <<'PY'
          from pathlib import Path
          import yaml

          workflow = Path(
              ".github/workflows/build-v10-6a-persistence-2.yml"
          )

          if not workflow.is_file():
              raise SystemExit(
                  "ERROR: workflow file not found."
              )

          text = workflow.read_text(
              encoding="utf-8"
          )

          if not text.strip():
              raise SystemExit(
                  "ERROR: workflow file is empty."
              )

          try:
              data = yaml.safe_load(text)
          except yaml.YAMLError as exc:
              print("YAML SYNTAX ERROR:")
              print(exc)
              raise SystemExit(1)

          if not isinstance(data, dict):
              raise SystemExit(
                  "ERROR: workflow root must be a YAML mapping."
              )

          print("YAML syntax: PASS")
          print("Root type:", type(data).__name__)
          print("Top-level keys:", list(data.keys()))

          if "name" not in data:
              raise SystemExit(
                  "ERROR: missing top-level 'name'."
              )

          # PyYAML/YAML 1.1 can interpret 'on' as boolean.
          # Accept either representation here.
          has_on = (
              "on" in data
              or True in data
          )

          if not has_on:
              raise SystemExit(
                  "ERROR: missing top-level 'on'."
              )

          if "jobs" not in data:
              raise SystemExit(
                  "ERROR: missing top-level 'jobs'."
              )

          if not isinstance(data["jobs"], dict):
              raise SystemExit(
                  "ERROR: 'jobs' must be a mapping."
              )

          if "build" not in data["jobs"]:
              raise SystemExit(
                  "ERROR: missing jobs.build."
              )

          print("GitHub Actions basic structure: PASS")
          print("YAML validation: PASS")
          PY

      # ============================================================
      # 3. RESTORE EXACT V10-6A BASELINE
      # ============================================================
      - name: Restore V10-6A baseline
        shell: bash
        run: |
          set -euo pipefail

          BASELINE="9075636a7d5947c1b0eee49c2bd3fd0e1b6b0cf1"

          git fetch origin "$BASELINE" --depth=1
          git checkout "$BASELINE" -- v10-source

          test -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java

          test -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

          test -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/RootView.java

          if [ -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java
          ]; then
            echo "ERROR: V10-8 ProjectionService detected."
            exit 1
          fi

          echo "V10-6A baseline OK."

      # ============================================================
      # 4. JAVA 17
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 5. PATCH RECENTS
      # ============================================================
      - name: Patch V10ProjectionSession - RECENTS
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          if "public void recents()" not in s:

              method = """
              public void recents() {
                  if (!isActive()) {
                      return;
                  }

                  final int displayId = display.getDisplayId();

                  final String command =
                          "/system/bin/input -d "
                                  + displayId
                                  + " keyevent 187";

                  RootShellSession.EXEC.execute(
                          () -> {
                              try {
                                  rootShell.run(5, command);
                              } catch (Throwable t) {
                                  Log.w(
                                          TAG,
                                          "Recents failed",
                                          t);
                              }
                          });
              }

              """

              pattern = re.compile(
                  r"(?m)^[ \t]*public\s+void\s+back\s*\(\s*\)\s*\{"
              )

              m = pattern.search(s)

              if not m:
                  raise SystemExit(
                      "ERROR: back() method not found."
                  )

              s = s[:m.start()] + method + s[m.start():]

          p.write_text(s, encoding="utf-8")

          print("RECENTS patch OK.")
          PY

      # ============================================================
      # 6. PATCH ACTIVITY IMPORTS
      # ============================================================
      - name: Patch V10CarActivity - imports
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          imports = [
              "import android.content.SharedPreferences;",
              "import android.os.SystemClock;",
              "import android.view.MotionEvent;",
              "import android.view.ViewConfiguration;",
              "import android.view.ViewGroup;",
          ]

          marker = "import android.content.pm.ResolveInfo;"

          missing = [
              x for x in imports
              if x not in s
          ]

          if missing:
              if marker not in s:
                  raise SystemExit(
                      "ERROR: import marker not found."
                  )

              s = s.replace(
                  marker,
                  marker + "\n" + "\n".join(missing),
                  1
              )

          p.write_text(s, encoding="utf-8")

          print("Imports OK.")
          PY

      # ============================================================
      # 7. FLOATING KEY FIELDS
      # ============================================================
      - name: Patch V10CarActivity - floating fields
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          if "private TextView floatingTouchKey;" not in s:

              marker = "    private V10ProjectionSession session;"

              fields = """
              private TextView floatingTouchKey;
              private LinearLayout floatingMenu;

              private boolean floatingDragging;
              private float floatingDownRawX;
              private float floatingDownRawY;
              private int floatingStartX;
              private int floatingStartY;
              private long floatingLastTap;
              """

              if marker not in s:
                  raise SystemExit(
                      "ERROR: session field marker not found."
                  )

              s = s.replace(
                  marker,
                  marker + fields,
                  1
              )

          p.write_text(s, encoding="utf-8")

          print("Floating fields OK.")
          PY

      # ============================================================
      # 8. FLOATING KEY
      # IMPORTANT:
      # textureView indentation corrected to 16 spaces.
      # ============================================================
      - name: Patch V10CarActivity - floating key
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          if "createFloatingTouchKey();" not in s:

              # CORRECT BASELINE MARKER
              marker = """        session.attachTextureView(
                textureView);"""

              if marker not in s:
                  raise SystemExit(
                      "ERROR: attachTextureView marker not found."
                  )

              s = s.replace(
                  marker,
                  marker + "\n\n        createFloatingTouchKey();",
                  1
              )

          if "private void createFloatingTouchKey()" not in s:

              methods = r'''
              private void createFloatingTouchKey() {
                  if (floatingTouchKey != null) {
                      return;
                  }

                  floatingTouchKey = new TextView(this);
                  floatingTouchKey.setText("●");
                  floatingTouchKey.setTextColor(Color.WHITE);
                  floatingTouchKey.setTextSize(22);
                  floatingTouchKey.setGravity(Gravity.CENTER);

                  GradientDrawable bg =
                          new GradientDrawable();

                  bg.setShape(
                          GradientDrawable.OVAL);

                  bg.setColor(
                          Color.rgb(25, 35, 45));

                  bg.setStroke(
                          dp(2),
                          Color.rgb(80, 170, 230));

                  floatingTouchKey.setBackground(bg);
                  floatingTouchKey.setElevation(dp(12));

                  SharedPreferences prefs =
                          getSharedPreferences(
                                  "v10_floating_key",
                                  MODE_PRIVATE);

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  dp(58),
                                  dp(58),
                                  Gravity.TOP | Gravity.END);

                  int savedX =
                          prefs.getInt("x", dp(18));

                  int savedY =
                          prefs.getInt("y", dp(120));

                  params.setMargins(
                          0,
                          savedY,
                          savedX,
                          0);

                  projectionLayer.addView(
                          floatingTouchKey,
                          params);

                  floatingTouchKey.setOnTouchListener(
                          (view, event) -> {

                              switch (
                                      event.getActionMasked()) {

                                  case MotionEvent.ACTION_DOWN:

                                      floatingDragging = false;

                                      floatingDownRawX =
                                              event.getRawX();

                                      floatingDownRawY =
                                              event.getRawY();

                                      ViewGroup.LayoutParams lp =
                                              view.getLayoutParams();

                                      if (lp instanceof
                                              FrameLayout.LayoutParams) {

                                          FrameLayout.LayoutParams fp =
                                                  (FrameLayout.LayoutParams)
                                                          lp;

                                          floatingStartX =
                                                  fp.rightMargin;

                                          floatingStartY =
                                                  fp.topMargin;
                                      }

                                      return true;

                                  case MotionEvent.ACTION_MOVE:

                                      float dx =
                                              event.getRawX()
                                                      - floatingDownRawX;

                                      float dy =
                                              event.getRawY()
                                                      - floatingDownRawY;

                                      if (!floatingDragging
                                              && Math.hypot(dx, dy)
                                              > ViewConfiguration
                                                      .get(this)
                                                      .getScaledTouchSlop()) {

                                          floatingDragging = true;
                                      }

                                      if (floatingDragging) {

                                          int width =
                                                  projectionLayer.getWidth();

                                          int height =
                                                  projectionLayer.getHeight();

                                          int size = dp(58);

                                          int right =
                                                  Math.round(
                                                          floatingStartX
                                                                  - dx);

                                          int top =
                                                  Math.round(
                                                          floatingStartY
                                                                  + dy);

                                          right =
                                                  Math.max(
                                                          0,
                                                          Math.min(
                                                                  Math.max(
                                                                          0,
                                                                          width
                                                                                  - size),
                                                                  right));

                                          top =
                                                  Math.max(
                                                          0,
                                                          Math.min(
                                                                  Math.max(
                                                                          0,
                                                                          height
                                                                                  - size),
                                                                  top));

                                          FrameLayout.LayoutParams fp =
                                                  (FrameLayout.LayoutParams)
                                                          view.getLayoutParams();

                                          fp.rightMargin = right;
                                          fp.topMargin = top;

                                          view.setLayoutParams(fp);
                                      }

                                      return true;

                                  case MotionEvent.ACTION_UP:

                                      if (floatingDragging) {

                                          FrameLayout.LayoutParams fp =
                                                  (FrameLayout.LayoutParams)
                                                          view.getLayoutParams();

                                          prefs.edit()
                                                  .putInt(
                                                          "x",
                                                          fp.rightMargin)
                                                  .putInt(
                                                          "y",
                                                          fp.topMargin)
                                                  .apply();

                                          floatingDragging = false;

                                          return true;
                                      }

                                      long now =
                                              SystemClock
                                                      .uptimeMillis();

                                      long delta =
                                              now
                                                      - floatingLastTap;

                                      floatingLastTap = now;

                                      if (delta > 0
                                              && delta < 320) {

                                          handleControlHome();

                                          hideFloatingMenu();

                                      } else {

                                          showFloatingMenu();
                                      }

                                      view.performClick();

                                      return true;

                                  case MotionEvent.ACTION_CANCEL:

                                      floatingDragging = false;

                                      return true;

                                  default:

                                      return true;
                              }
                          });

                  floatingTouchKey.bringToFront();
              }

              private void showFloatingMenu() {

                  if (floatingMenu != null) {
                      hideFloatingMenu();
                      return;
                  }

                  floatingMenu =
                          new LinearLayout(this);

                  floatingMenu.setOrientation(
                          LinearLayout.VERTICAL);

                  floatingMenu.setPadding(
                          dp(8),
                          dp(8),
                          dp(8),
                          dp(8));

                  GradientDrawable bg =
                          new GradientDrawable();

                  bg.setColor(
                          Color.rgb(15, 20, 26));

                  bg.setCornerRadius(
                          dp(16));

                  bg.setStroke(
                          dp(1),
                          Color.rgb(65, 85, 105));

                  floatingMenu.setBackground(bg);
                  floatingMenu.setElevation(dp(14));

                  addFloatingMenuButton(
                          "BACK",
                          () -> {
                              handleControlBack();
                              hideFloatingMenu();
                          });

                  addFloatingMenuButton(
                          "RECENTS",
                          () -> {
                              if (session != null) {
                                  session.recents();
                              }
                              hideFloatingMenu();
                          });

                  addFloatingMenuButton(
                          "2 SCREEN",
                          () -> {
                              switchToTwoScreen();
                              hideFloatingMenu();
                          });

                  addFloatingMenuButton(
                          "3 SCREEN",
                          () -> {
                              switchToThreeScreen();
                              hideFloatingMenu();
                          });

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  dp(170),
                                  -2,
                                  Gravity.TOP | Gravity.END);

                  params.setMargins(
                          0,
                          dp(70),
                          dp(18),
                          0);

                  projectionLayer.addView(
                          floatingMenu,
                          params);

                  floatingMenu.bringToFront();
                  floatingTouchKey.bringToFront();
              }

              private void addFloatingMenuButton(
                      String label,
                      Runnable action) {

                  TextView button =
                          new TextView(this);

                  button.setText(label);
                  button.setTextColor(Color.WHITE);
                  button.setTextSize(14);
                  button.setGravity(
                          Gravity.CENTER_VERTICAL);

                  GradientDrawable bg =
                          new GradientDrawable();

                  bg.setColor(
                          Color.rgb(28, 38, 48));

                  bg.setCornerRadius(
                          dp(10));

                  button.setBackground(bg);

                  button.setPadding(
                          dp(16),
                          0,
                          dp(16),
                          0);

                  button.setOnClickListener(
                          v -> action.run());

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(48));

                  params.setMargins(
                          0,
                          dp(3),
                          0,
                          dp(3));

                  floatingMenu.addView(
                          button,
                          params);
              }

              private void hideFloatingMenu() {

                  if (floatingMenu == null) {
                      return;
                  }

                  projectionLayer.removeView(
                          floatingMenu);

                  floatingMenu = null;
              }

              private void switchToTwoScreen() {

                  RootView rootView =
                          RootView.getCurrent();

                  if (rootView != null) {
                      rootView.setLayoutModeExternal(0);
                  }
              }

              private void switchToThreeScreen() {

                  RootView rootView =
                          RootView.getCurrent();

                  if (rootView != null) {
                      rootView.setLayoutModeExternal(2);
                  }
              }

              '''

              marker =
                  "    public void handleControlBack()"

              if marker not in s:
                  raise SystemExit(
                      "ERROR: handleControlBack marker not found."
                  )

              s = s.replace(
                  marker,
                  methods + "\n" + marker,
                  1
              )

          p.write_text(s, encoding="utf-8")

          print("Floating key patch OK.")
          PY

      # ============================================================
      # 9. ROOTVIEW EXTERNAL LAYOUT
      # ============================================================
      - name: Patch RootView - external layout
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/RootView.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          if "setLayoutModeExternal(int mode)" not in s:

              method = """
              public void setLayoutModeExternal(int mode) {
                  final int targetMode =
                          clamp(mode, 0, 5);

                  handler.post(
                          () -> {
                              if (destroyed) {
                                  return;
                              }

                              layoutMode = targetMode;

                              loadRatios();

                              prefs.edit()
                                      .putInt(
                                              "layout_mode_v3",
                                              layoutMode)
                                      .apply();

                              applyVisibility();

                              container.requestLayout();
                              container.resizeAll();
                          });
              }

              """

              marker =
                  "    public void reloadSettings()"

              if marker not in s:
                  raise SystemExit(
                      "ERROR: reloadSettings marker not found."
                  )

              s = s.replace(
                  marker,
                  method + marker,
                  1
              )

          p.write_text(s, encoding="utf-8")

          print("RootView patch OK.")
          PY

      # ============================================================
      # 10. PERSISTENCE 2 - PROJECTION SESSION
      # ============================================================
      - name: Patch Persistence 2 - ProjectionSession
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          if "private boolean targetLaunched;" not in s:

              marker =
                  "    private boolean destroyed;"

              if marker not in s:
                  raise SystemExit(
                      "ERROR: destroyed field marker not found."
                  )

              s = s.replace(
                  marker,
                  marker
                  + "\n\n    private boolean targetLaunched;",
                  1
              )

          old = """        final String command =
                "/system/bin/am force-stop '"
                        + packageName
                        + "'; "
                        + "/system/bin/am start"
                        + " --user "
                        + userId
                        + " --display "
                        + displayId
                        + " --windowingMode 1"
                        + " -a android.intent.action.MAIN"
                        + " -c android.intent.category.LAUNCHER"
                        + " -f 0x18000000"
                        + " -n '"
                        + flat
                        + "'";"""

          new = """        if (targetLaunched) {
            final String command =
                    "/system/bin/am start"
                            + " --user "
                            + userId
                            + " --display "
                            + displayId
                            + " --windowingMode 1"
                            + " -a android.intent.action.MAIN"
                            + " -c android.intent.category.LAUNCHER"
                            + " -f 0x18000000"
                            + " --activity-reorder-to-front"
                            + " -n '"
                            + flat
                            + "'";

            RootShellSession.EXEC.execute(
                    () -> {
                        try {
                            rootShell.run(10, command);
                        } catch (Throwable t) {
                            Log.w(
                                    TAG,
                                    "Reorder task failed",
                                    t);
                        }
                    });

            return;
        }

        targetLaunched = true;

        final String command =
                "/system/bin/am start"
                        + " --user "
                        + userId
                        + " --display "
                        + displayId
                        + " --windowingMode 1"
                        + " -a android.intent.action.MAIN"
                        + " -c android.intent.category.LAUNCHER"
                        + " -f 0x18000000"
                        + " --activity-reorder-to-front"
                        + " -n '"
                        + flat
                        + "'";"""

          if old not in s:
              raise SystemExit(
                  "ERROR: original launchTarget block not found."
              )

          s = s.replace(
              old,
              new,
              1
          )

          if "targetLaunched = false;" not in s:

              marker = """        virtualDisplay = null;
        display = null;"""

              if marker not in s:
                  raise SystemExit(
                      "ERROR: release marker not found."
                  )

              s = s.replace(
                  marker,
                  """        virtualDisplay = null;
        display = null;
        targetLaunched = false;""",
                  1
              )

          p.write_text(s, encoding="utf-8")

          print(
              "Persistence 2 ProjectionSession patch OK."
          )
          PY

      # ============================================================
      # 11. PERSISTENCE 2 - ACTIVITY LIFECYCLE
      # ============================================================
      - name: Patch Persistence 2 - Activity lifecycle
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          old = """        if (session != null) {
            session.release();
        }

        super.onStop();"""

          new = """        /*
         * Persistence 2:
         *
         * Android Auto may temporarily stop this Activity.
         * Keep the projection session alive.
         *
         * Explicit HOME / target switching / onDestroy()
         * remain responsible for final cleanup.
         */

        super.onStop();"""

          if old in s:

              s = s.replace(
                  old,
                  new,
                  1
              )

          elif "Persistence 2:" not in s:

              raise SystemExit(
                  "ERROR: onStop release block not found."
              )

          p.write_text(s, encoding="utf-8")

          print(
              "Persistence 2 Activity lifecycle patch OK."
          )
          PY

      # ============================================================
      # 12. VERIFY SOURCE
      # ============================================================
      - name: Verify source
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          SESSION="app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
          ACTIVITY="app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          ROOT="app/src/main/java/com/hieptran/aacast/doudou/RootView.java"

          echo "Checking source architecture..."

          test ! -f \
            app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java

          grep -q \
            "public void recents()" \
            "$SESSION"

          grep -q \
            "keyevent 187" \
            "$SESSION"

          grep -q \
            "createFloatingTouchKey" \
            "$ACTIVITY"

          grep -q \
            'session.recents()' \
            "$ACTIVITY"

          grep -q \
            '"RECENTS"' \
            "$ACTIVITY"

          grep -q \
            '"2 SCREEN"' \
            "$ACTIVITY"

          grep -q \
            '"3 SCREEN"' \
            "$ACTIVITY"

          grep -q \
            "setLayoutModeExternal(int mode)" \
            "$ROOT"

          grep -q \
            "private boolean targetLaunched;" \
            "$SESSION"

          grep -q \
            "targetLaunched = true;" \
            "$SESSION"

          grep -q \
            "targetLaunched = false;" \
            "$SESSION"

          grep -q \
            "activity-reorder-to-front" \
            "$SESSION"

          if grep -q \
            "am force-stop" \
            "$SESSION"; then

            echo "ERROR: force-stop still exists."
            exit 1
          fi

          if grep -A18 \
            "public void onStop()" \
            "$ACTIVITY" |
            grep -q "session.release()"; then

            echo "ERROR: onStop still releases session."
            exit 1
          fi

          echo "All source checks PASS."

      # ============================================================
      # 13. COMPILE
      # ============================================================
      - name: Compile
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            compileDebugJavaWithJavac

      # ============================================================
      # 14. BUILD APK
      # ============================================================
      - name: Assemble APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ============================================================
      # 15. VERIFY APK
      # ============================================================
      - name: Verify APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print -quit)"

          test -n "$APK"

          echo "APK found:"
          echo "$APK"

      # ============================================================
      # 16. UPLOAD APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-6A-Persistence-2
          path: v10-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
