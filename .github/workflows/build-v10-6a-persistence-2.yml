      # ============================================================
      # 17. LOCATE APK
      # ============================================================
      - name: Locate APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK="$(
            find app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              -print -quit
          )"

          test -n "$APK"

          echo "APK=$APK"

      # ============================================================
      # 18. UPLOAD APK
      # ============================================================
      - name: Upload V10-6A Persistence 2 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-6A-Persistence-2
          path: v10-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
