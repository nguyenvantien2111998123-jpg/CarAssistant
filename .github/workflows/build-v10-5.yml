name: Build Car Assistant V10-5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Patch V10CarActivity
        working-directory: v10-source
        shell: python
        run: |
          from pathlib import Path

          file = Path("app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java")

          if not file.exists():
              raise SystemExit("V10CarActivity.java not found")

          text = file.read_text(encoding="utf-8")

          if "projectionControls" in text:
              print("V10-5 patch already exists.")
              raise SystemExit(0)

          marker = """        textureView
                .setOnTouchListener(
                        inputController
                                .createListener());
"""

          if marker not in text:
              raise SystemExit(
                  "Expected attachProjection() marker was not found"
              )

          insert = "\n".join([
              "        // V10-5 projection controls",
              "        projectionControls = new LinearLayout(this);",
              "        projectionControls.setOrientation(LinearLayout.HORIZONTAL);",
              "        projectionControls.setGravity(Gravity.CENTER_VERTICAL);",
              "",
              '        TextView backButton = buttonText("BACK");',
              "        backButton.setOnClickListener(",
              "                v -> handleControlBack());",
              "",
              '        TextView homeButton = buttonText("HOME");',
              "        homeButton.setOnClickListener(",
              "                v -> handleControlHome());",
              "",
              "        projectionControls.addView(",
              "                backButton,",
              "                new LinearLayout.LayoutParams(",
              "                        dp(90),",
              "                        dp(52)));",
              "",
              "        LinearLayout.LayoutParams homeParams =",
              "                new LinearLayout.LayoutParams(",
              "                        dp(90),",
              "                        dp(52));",
              "",
              "        homeParams.leftMargin = dp(8);",
              "",
              "        projectionControls.addView(",
              "                homeButton,",
              "                homeParams);",
              "",
              "        FrameLayout.LayoutParams controlsParams =",
              "                new FrameLayout.LayoutParams(",
              "                        -2,",
              "                        dp(60),",
              "                        Gravity.TOP | Gravity.END);",
              "",
              "        controlsParams.topMargin = dp(12);",
              "        controlsParams.rightMargin = dp(12);",
              "",
              "        projectionLayer.addView(",
              "                projectionControls,",
              "                controlsParams);",
          ])

          replacement = marker + "\n" + insert + "\n"

          text = text.replace(marker, replacement, 1)

          file.write_text(text, encoding="utf-8")

          print("V10-5 patch applied successfully.")

      - name: Verify source
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -q "projectionControls" "$FILE"
          grep -q 'buttonText("BACK")' "$FILE"
          grep -q 'buttonText("HOME")' "$FILE"
          grep -q "handleControlBack()" "$FILE"
          grep -q "handleControlHome()" "$FILE"

          echo "V10-5 source verification OK"

      - name: Build V10-5
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-5
          path: v10-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
