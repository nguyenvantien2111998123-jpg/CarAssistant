name: CarAssistant - Migrate Navigation V1 Package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-navigation-v1-package:
    name: Migrate com.hieptran.aacast.doudou -> com.carassistant.v10
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ============================================================
      # 01. CHECKOUT MAIN
      # ============================================================
      - name: 01 - Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ============================================================
      # 02. JAVA 17
      # ============================================================
      - name: 02 - Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ============================================================
      # 03. DEFINE PATHS
      # ============================================================
      - name: 03 - Define migration paths
        shell: bash
        run: |
          set -euo pipefail

          OLD_DIR="navigation-v1-source/app/src/main/java/com/hieptran/aacast/doudou"
          NEW_DIR="navigation-v1-source/app/src/main/java/com/carassistant/v10"

          OLD_PACKAGE="com.hieptran.aacast.doudou"
          NEW_PACKAGE="com.carassistant.v10"

          OLD_PATH="com/hieptran/aacast/doudou"
          NEW_PATH="com/carassistant/v10"

          echo "OLD_DIR=$OLD_DIR" >> "$GITHUB_ENV"
          echo "NEW_DIR=$NEW_DIR" >> "$GITHUB_ENV"
          echo "OLD_PACKAGE=$OLD_PACKAGE" >> "$GITHUB_ENV"
          echo "NEW_PACKAGE=$NEW_PACKAGE" >> "$GITHUB_ENV"
          echo "OLD_PATH=$OLD_PATH" >> "$GITHUB_ENV"
          echo "NEW_PATH=$NEW_PATH" >> "$GITHUB_ENV"

          echo "=============================================="
          echo "Navigation V1 package migration"
          echo "=============================================="
          echo "OLD PACKAGE : $OLD_PACKAGE"
          echo "NEW PACKAGE : $NEW_PACKAGE"
          echo "OLD PATH    : $OLD_PATH"
          echo "NEW PATH    : $NEW_PATH"
          echo "=============================================="

      # ============================================================
      # 04. VERIFY CURRENT MAIN STRUCTURE
      # ============================================================
      - name: 04 - Verify current Navigation V1 structure
        shell: bash
        run: |
          set -euo pipefail

          test -d "$OLD_DIR"

          test -f "$OLD_DIR/V10CarActivity.java"
          test -f "$OLD_DIR/NavigationMapView.java"
          test -f "$OLD_DIR/V10ProjectionSession.java"
          test -f "$OLD_DIR/V10DisplayController.java"
          test -f "$OLD_DIR/V10SessionStore.java"
          test -f "$OLD_DIR/V10TaskSession.java"

          test -f "navigation-v1-source/app/build.gradle"
          test -f "navigation-v1-source/build.gradle"
          test -f "navigation-v1-source/settings.gradle"

          echo "PASS: Current Navigation V1 structure verified."

      # ============================================================
      # 05. PROTECT V10-SOURCE
      # ============================================================
      - name: 05 - Protect v10-source
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "v10-source" ]; then
            find v10-source -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > /tmp/v10-source.before.sha256

            echo "PASS: v10-source backup hash created."
          else
            echo "INFO: v10-source does not exist on main."
          fi

      # ============================================================
      # 06. RECORD NAVIGATION FILE COUNT
      # ============================================================
      - name: 06 - Record Navigation V1 file inventory
        shell: bash
        run: |
          set -euo pipefail

          find "$OLD_DIR" \
            -type f \
            -name "*.java" \
            | sort \
            > /tmp/navigation-java-before.txt

          JAVA_COUNT="$(wc -l < /tmp/navigation-java-before.txt | tr -d ' ')"

          echo "Navigation V1 Java file count before migration: $JAVA_COUNT"

          if [ "$JAVA_COUNT" -ne 31 ]; then
            echo "ERROR: Expected exactly 31 Navigation V1 Java files."
            exit 1
          fi

          echo "PASS: Exactly 31 Navigation V1 Java files found."

      # ============================================================
      # 07. BACKUP SOURCE HASHES
      # ============================================================
      - name: 07 - Record source hashes before migration
        shell: bash
        run: |
          set -euo pipefail

          find "$OLD_DIR" \
            -type f \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > /tmp/navigation-source-before.sha256

          echo "PASS: Navigation V1 source hashes recorded."

      # ============================================================
      # 08. CREATE NEW PACKAGE DIRECTORY
      # ============================================================
      - name: 08 - Create new package directory
        shell: bash
        run: |
          set -euo pipefail

          if [ -e "$NEW_DIR" ]; then
            echo "ERROR: New package directory already exists:"
            echo "$NEW_DIR"
            exit 1
          fi

          mkdir -p "$NEW_DIR"

          echo "PASS: Created:"
          echo "$NEW_DIR"

      # ============================================================
      # 09. MOVE ENTIRE PACKAGE TREE
      # ============================================================
      - name: 09 - Move entire Navigation package tree
        shell: bash
        run: |
          set -euo pipefail

          find "$OLD_DIR" -mindepth 1 -maxdepth 1 -exec mv {} "$NEW_DIR"/ \;

          rmdir "$OLD_DIR"

          test ! -d "$OLD_DIR"
          test -d "$NEW_DIR"

          echo "PASS: Entire package tree moved."
          echo ""
          echo "NEW TREE:"
          find "$NEW_DIR" -type f | sort

      # ============================================================
      # 10. UPDATE PACKAGE AND PATH REFERENCES
      # ============================================================
      - name: 10 - Update package and path references
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          roots = [
              Path("navigation-v1-source"),
              Path(".github/workflows"),
          ]

          old_package = "com.hieptran.aacast.doudou"
          new_package = "com.carassistant.v10"

          old_path = "com/hieptran/aacast/doudou"
          new_path = "com/carassistant/v10"

          text_extensions = {
              ".java",
              ".kt",
              ".xml",
              ".gradle",
              ".properties",
              ".pro",
              ".txt",
              ".md",
              ".yml",
              ".yaml",
              ".json",
              ".sh",
          }

          changed = []

          for root in roots:
              if not root.exists():
                  continue

              for path in root.rglob("*"):
                  if not path.is_file():
                      continue

                  if path.suffix.lower() not in text_extensions:
                      continue

                  try:
                      data = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue

                  updated = data.replace(old_package, new_package)
                  updated = updated.replace(old_path, new_path)

                  if updated != data:
                      path.write_text(updated, encoding="utf-8")
                      changed.append(str(path))

          print("Files updated:")
          for item in sorted(changed):
              print("  " + item)

          print("")
          print(f"Updated file count: {len(changed)}")
          print("PASS: Package/path references migrated.")
          PY

      # ============================================================
      # 11. VERIFY JAVA PACKAGE DECLARATIONS
      # ============================================================
      - name: 11 - Verify Java package declarations
        shell: bash
        run: |
          set -euo pipefail

          if grep -RIn \
            --include="*.java" \
            "package com.hieptran.aacast.doudou" \
            "navigation-v1-source"; then

            echo "ERROR: Old Java package declaration remains."
            exit 1
          fi

          OLD_IMPORTS="$(grep -RIn \
            --include="*.java" \
            "com.hieptran.aacast.doudou" \
            navigation-v1-source || true)"

          if [ -n "$OLD_IMPORTS" ]; then
            echo "$OLD_IMPORTS"
            echo "ERROR: Old Java package reference remains."
            exit 1
          fi

          echo "PASS: No old Java package declarations/imports."

      # ============================================================
      # 12. VERIFY OLD PHYSICAL PATH IS GONE
      # ============================================================
      - name: 12 - Verify old physical package path removed
        shell: bash
        run: |
          set -euo pipefail

          test ! -d "$OLD_DIR"
          test -d "$NEW_DIR"

          OLD_PATHS="$(find navigation-v1-source \
            -type f \
            -path "*$OLD_PATH*" \
            -print || true)"

          if [ -n "$OLD_PATHS" ]; then
            echo "$OLD_PATHS"
            echo "ERROR: Old physical package path still exists."
            exit 1
          fi

          echo "PASS: Old physical package path removed."

      # ============================================================
      # 13. VERIFY NEW TREE FILE COUNT
      # ============================================================
      - name: 13 - Verify migrated Java file count
        shell: bash
        run: |
          set -euo pipefail

          find "$NEW_DIR" \
            -type f \
            -name "*.java" \
            | sort \
            > /tmp/navigation-java-after.txt

          BEFORE_COUNT="$(wc -l < /tmp/navigation-java-before.txt | tr -d ' ')"
          AFTER_COUNT="$(wc -l < /tmp/navigation-java-after.txt | tr -d ' ')"

          echo "Before: $BEFORE_COUNT"
          echo "After : $AFTER_COUNT"

          if [ "$BEFORE_COUNT" -ne "$AFTER_COUNT" ]; then
            echo "ERROR: Java file count changed during migration."
            exit 1
          fi

          if [ "$AFTER_COUNT" -ne 31 ]; then
            echo "ERROR: Expected 31 Java files after migration."
            exit 1
          fi

          echo "PASS: All 31 Java files preserved."

      # ============================================================
      # 14. VERIFY IMPORTANT FILES
      # ============================================================
      - name: 14 - Verify important Navigation V1 files
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "AACastCarService.java"
            "AACastDisplay.java"
            "AppCatalog.java"
            "AppEntry.java"
            "DividerView.java"
            "DockStateProvider.java"
            "LayoutMath.java"
            "LayoutRects.java"
            "NavigationMapView.java"
            "PaneContainer.java"
            "PaneView.java"
            "RootShellSession.java"
            "RootView.java"
            "TileOrder.java"
            "V10CarActivity.java"
            "V10ControlReceiver.java"
            "V10Display.java"
            "V10DisplayController.java"
            "V10InputController.java"
            "V10LauncherActivity.java"
            "V10ProjectionSession.java"
            "V10SessionStore.java"
            "V10SurfaceManager.java"
            "V10TaskSession.java"
            "aabridge/AACastBridge.java"
            "hook/DisplayHooks.java"
            "hook/DisplayReflect.java"
            "hook/GearheadAllow.java"
            "hook/GearheadDockPatcher.java"
            "hook/InputHooks.java"
            "hook/InstallerSpoof.java"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            test -f "$NEW_DIR/$FILE"
          done

          echo "PASS: All 31 expected Navigation V1 Java files exist."

      # ============================================================
      # 15. VERIFY BUILD CONFIG WAS NOT REDESIGNED
      # ============================================================
      - name: 15 - Verify build configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f "navigation-v1-source/app/build.gradle"

          grep -Fq "namespace 'com.carassistant.v10'" \
            navigation-v1-source/app/build.gradle

          grep -Fq 'org.maplibre.gl:android-sdk:11.11.0' \
            navigation-v1-source/app/build.gradle

          grep -Fq "compileOnly files('libs/xposed-api-82.jar')" \
            navigation-v1-source/app/build.gradle

          grep -Fq "compileOnly files('libs/aasdk-legacy.jar')" \
            navigation-v1-source/app/build.gradle

          test -f "navigation-v1-source/app/libs/aasdk-legacy.dex"
          test -f "navigation-v1-source/app/libs/aasdk-legacy.jar"

          echo "PASS: Existing Navigation V1 build configuration preserved."
          echo "PASS: Legacy DEX/JAR preserved."

      # ============================================================
      # 16. VERIFY NO OLD PACKAGE ANYWHERE IN NAVIGATION SOURCE
      # ============================================================
      - name: 16 - Verify no old package references remain
        shell: bash
        run: |
          set -euo pipefail

          if grep -RIn \
            --exclude-dir=.git \
            "$OLD_PACKAGE" \
            navigation-v1-source 2>/dev/null; then

            echo "ERROR: Old package reference remains in Navigation V1."
            exit 1
          fi

          if grep -RIn \
            --exclude-dir=.git \
            "$OLD_PATH" \
            navigation-v1-source 2>/dev/null; then

            echo "ERROR: Old package path reference remains in Navigation V1."
            exit 1
          fi

          echo "PASS: Old package/path completely removed from Navigation V1."

      # ============================================================
      # 17. VERIFY NEW PACKAGE REFERENCES
      # ============================================================
      - name: 17 - Verify new package references
        shell: bash
        run: |
          set -euo pipefail

          NEW_COUNT="$(grep -RIl \
            --include="*.java" \
            "$NEW_PACKAGE" \
            "$NEW_DIR" \
            | wc -l \
            | tr -d ' ')"

          echo "Java files containing new package: $NEW_COUNT"

          if [ "$NEW_COUNT" -lt 31 ]; then
            echo "ERROR: Not all migrated Java files contain new package."
            exit 1
          fi

          echo "PASS: New package com.carassistant.v10 is active."

      # ============================================================
      # 18. PROTECT V10-SOURCE
      # ============================================================
      - name: 18 - Verify v10-source untouched
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f /tmp/v10-source.before.sha256 ]; then
            echo "INFO: No v10-source backup was created."
            exit 0
          fi

          find v10-source -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > /tmp/v10-source.after.sha256

          if ! diff -u \
            /tmp/v10-source.before.sha256 \
            /tmp/v10-source.after.sha256; then

            echo "ERROR: v10-source changed."
            exit 1
          fi

          echo "PASS: v10-source is untouched."

      # ============================================================
      # 19. VERIFY GIT SCOPE
      # ============================================================
      - name: 19 - Inspect migration diff
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "GIT STATUS"
          echo "=============================================="

          git status --short

          echo ""
          echo "=============================================="
          echo "CHANGED FILES"
          echo "=============================================="

          git diff --name-status

          echo ""
          echo "=============================================="
          echo "DIFF STAT"
          echo "=============================================="

          git diff --stat

          echo "=============================================="

          if git diff --name-only | grep -q '^v10-source/'; then
            echo "ERROR: v10-source was modified."
            exit 1
          fi

          echo "PASS: Migration scope verified."

      # ============================================================
      # 20. PREPARE GRADLE
      # ============================================================
      - name: 20 - Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd navigation-v1-source

          chmod +x gradlew

          test -x gradlew

          echo "PASS: Gradle wrapper ready."

      # ============================================================
      # 21. COMPILE ONLY
      #
      # Không thay đổi mergeDexRelease.
      # Không chạy R8.
      # Không sanitize.
      #
      # Mục tiêu bước này chỉ xác nhận package migration
      # không phá Java compilation.
      # ============================================================
      - name: 21 - Compile migrated Navigation V1
        shell: bash
        run: |
          set -euo pipefail

          cd navigation-v1-source

          ./gradlew \
            :app:compileReleaseJavaWithJavac \
            --no-daemon \
            --stacktrace

          echo "PASS: Navigation V1 compiles after package migration."

      # ============================================================
      # 22. FINAL VERIFY
      # ============================================================
      - name: 22 - Final migration verification
        shell: bash
        run: |
          set -euo pipefail

          test -d "$NEW_DIR"
          test ! -d "$OLD_DIR"

          test -f "$NEW_DIR/V10CarActivity.java"
          test -f "$NEW_DIR/NavigationMapView.java"
          test -f "$NEW_DIR/V10ProjectionSession.java"
          test -f "$NEW_DIR/V10SessionStore.java"

          if grep -RIn \
            --exclude-dir=.git \
            "$OLD_PACKAGE" \
            navigation-v1-source 2>/dev/null; then
            echo "ERROR: Old package still exists."
            exit 1
          fi

          if grep -RIn \
            --exclude-dir=.git \
            "$OLD_PATH" \
            navigation-v1-source 2>/dev/null; then
            echo "ERROR: Old package path still exists."
            exit 1
          fi

          if git diff --name-only | grep -q '^v10-source/'; then
            echo "ERROR: v10-source changed."
            exit 1
          fi

          echo "=============================================="
          echo "FINAL MIGRATION CHECK"
          echo "=============================================="
          echo "Old package : REMOVED"
          echo "New package : com.carassistant.v10"
          echo "Old path    : REMOVED"
          echo "New path    : PRESENT"
          echo "Java files  : 31"
          echo "Compile     : PASS"
          echo "v10-source  : UNTOUCHED"
          echo "Legacy DEX  : PRESERVED"
          echo "Legacy JAR  : PRESERVED"
          echo "=============================================="

      # ============================================================
      # 23. COMMIT
      # ============================================================
      - name: 23 - Commit migration
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            navigation-v1-source \
            .github/workflows

          if git diff --cached --quiet; then
            echo "INFO: No migration changes to commit."
            exit 0
          fi

          git commit \
            -m "chore: migrate Navigation V1 package to com.carassistant.v10"

          echo "PASS: Migration commit created."

      # ============================================================
      # 24. PUSH MAIN
      # ============================================================
      - name: 24 - Push migration to main
        shell: bash
        run: |
          set -euo pipefail

          git push origin HEAD:main

          echo "PASS: Navigation V1 package migration pushed to main."

      # ============================================================
      # 25. FINAL RESULT
      # ============================================================
      - name: 25 - Migration PASS
        shell: bash
        run: |
          echo "================================================"
          echo "PASS: Navigation V1 package migration"
          echo "================================================"
          echo ""
          echo "OLD:"
          echo "com/hieptran/aacast/doudou"
          echo ""
          echo "NEW:"
          echo "com/carassistant/v10"
          echo ""
          echo "JAVA PACKAGE:"
          echo "com.carassistant.v10"
          echo ""
          echo "31 Java files migrated."
          echo "AACast legacy structure preserved."
          echo "Navigation V1 compile: PASS"
          echo "Legacy DEX: preserved"
          echo "Legacy JAR: preserved"
          echo "v10-source: untouched"
          echo "Main: updated"
          echo "================================================"
