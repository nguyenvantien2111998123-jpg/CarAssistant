name: CarAssistant - Migrate Navigation V1 Package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-navigation-v1-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ============================================================
      # 01. CHECKOUT MAIN
      # ============================================================
      - name: "01 - Checkout main"
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ============================================================
      # 02. JAVA 17
      # ============================================================
      - name: "02 - Setup Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 03. DEFINE MIGRATION PATHS
      # ============================================================
      - name: "03 - Define migration paths"
        shell: bash
        run: |
          set -euo pipefail

          OLD_DIR="navigation-v1-source/app/src/main/java/com/hieptran/aacast/doudou"
          NEW_DIR="navigation-v1-source/app/src/main/java/com/carassistant/v10"

          OLD_PACKAGE="com.hieptran.aacast.doudou"
          NEW_PACKAGE="com.carassistant.v10"

          OLD_PATH="com/hieptran/aacast/doudou"
          NEW_PATH="com/carassistant/v10"

          echo "OLD_DIR=$OLD_DIR" >> "$GITHUB_ENV"
          echo "NEW_DIR=$NEW_DIR" >> "$GITHUB_ENV"
          echo "OLD_PACKAGE=$OLD_PACKAGE" >> "$GITHUB_ENV"
          echo "NEW_PACKAGE=$NEW_PACKAGE" >> "$GITHUB_ENV"
          echo "OLD_PATH=$OLD_PATH" >> "$GITHUB_ENV"
          echo "NEW_PATH=$NEW_PATH" >> "$GITHUB_ENV"

          echo "OLD_DIR=$OLD_DIR"
          echo "NEW_DIR=$NEW_DIR"
          echo "OLD_PACKAGE=$OLD_PACKAGE"
          echo "NEW_PACKAGE=$NEW_PACKAGE"

      # ============================================================
      # 04. VERIFY CURRENT STRUCTURE
      # ============================================================
      - name: "04 - Verify current Navigation V1 structure"
        shell: bash
        run: |
          set -euo pipefail

          test -d "$OLD_DIR"
          test ! -e "$NEW_DIR"

          test -f "$OLD_DIR/V10CarActivity.java"
          test -f "$OLD_DIR/NavigationMapView.java"
          test -f "$OLD_DIR/V10ProjectionSession.java"
          test -f "$OLD_DIR/V10DisplayController.java"
          test -f "$OLD_DIR/V10SessionStore.java"
          test -f "$OLD_DIR/V10TaskSession.java"

          test -f navigation-v1-source/app/build.gradle
          test -f navigation-v1-source/build.gradle
          test -f navigation-v1-source/settings.gradle

          echo "PASS: current Navigation V1 structure verified."

      # ============================================================
      # 05. PROTECT V10 SOURCE
      # ============================================================
      - name: "05 - Record protected v10-source hash"
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "v10-source" ]; then
            find v10-source -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/v10-source.before.sha256
            echo "Protected v10-source snapshot created."
          else
            : > /tmp/v10-source.before.sha256
            echo "v10-source does not exist."
          fi

      # ============================================================
      # 06. RECORD JAVA INVENTORY
      # ============================================================
      - name: "06 - Record Navigation V1 Java inventory"
        shell: bash
        run: |
          set -euo pipefail

          find "$OLD_DIR" -type f -name '*.java' -print \
            | sed "s#^$OLD_DIR/##" \
            | sort > /tmp/navigation-java.before.txt

          JAVA_COUNT=$(wc -l < /tmp/navigation-java.before.txt | tr -d ' ')

          echo "Navigation V1 Java file count before migration: $JAVA_COUNT"

          if [ "$JAVA_COUNT" -eq 0 ]; then
            echo "ERROR: No Navigation V1 Java files found."
            exit 1
          fi

          echo "JAVA_COUNT_BEFORE=$JAVA_COUNT" >> "$GITHUB_ENV"

          echo "PASS: Java inventory recorded."

      # ============================================================
      # 07. RECORD SOURCE HASH
      # ============================================================
      - name: "07 - Record Navigation V1 source hash"
        shell: bash
        run: |
          set -euo pipefail

          find navigation-v1-source/app/src/main/java -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > /tmp/navigation-source.before.sha256

          echo "PASS: Navigation V1 source hash recorded."

      # ============================================================
      # 08. CREATE NEW PACKAGE DIRECTORY
      # ============================================================
      - name: "08 - Create new package directory"
        shell: bash
        run: |
          set -euo pipefail

          if [ -e "$NEW_DIR" ]; then
            echo "ERROR: New package directory already exists:"
            echo "$NEW_DIR"
            exit 1
          fi

          mkdir -p "$NEW_DIR"

          echo "PASS: New package directory created."

      # ============================================================
      # 09. MOVE ALL SOURCE FILES
      # ============================================================
      - name: "09 - Move all files to new package"
        shell: bash
        run: |
          set -euo pipefail

          shopt -s dotglob nullglob

          files=("$OLD_DIR"/*)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "ERROR: Old package directory is empty."
            exit 1
          fi

          mv "${files[@]}" "$NEW_DIR/"

          rmdir "$OLD_DIR"

          echo "PASS: All direct children moved from old package to new package."

      # ============================================================
      # 10. MIGRATE PACKAGE REFERENCES
      # ============================================================
      - name: "10 - Migrate package and path references"
        shell: bash
        run: |
          set -euo pipefail

          find navigation-v1-source -type f \
            \( -name '*.java' -o -name '*.kt' -o -name '*.gradle' -o -name '*.xml' -o -name '*.properties' -o -name '*.md' -o -name '*.yml' -o -name '*.yaml' \) \
            -print0 |
          while IFS= read -r -d '' file; do
            sed -i \
              -e "s#${OLD_PACKAGE}#${NEW_PACKAGE}#g" \
              -e "s#${OLD_PATH}#${NEW_PATH}#g" \
              "$file"
          done

          echo "PASS: Package/path references migrated."

      # ============================================================
      # 11. VERIFY NO OLD PACKAGE DECLARATIONS
      # ============================================================
      - name: "11 - Verify Java package declarations"
        shell: bash
        run: |
          set -euo pipefail

          if grep -RIn --include='*.java' \
            -E "package ${OLD_PACKAGE//./\\.}|import ${OLD_PACKAGE//./\\.}" \
            navigation-v1-source 2>/dev/null; then
            echo "ERROR: Old package declaration/import still exists."
            exit 1
          fi

          echo "PASS: No old Java package declarations/imports found."

      # ============================================================
      # 12. VERIFY OLD PHYSICAL PATH
      # ============================================================
      - name: "12 - Verify old physical package path is gone"
        shell: bash
        run: |
          set -euo pipefail

          if [ -e "$OLD_DIR" ]; then
            echo "ERROR: Old package directory still exists."
            exit 1
          fi

          echo "PASS: Old physical package path removed."

      # ============================================================
      # 13. VERIFY JAVA FILE COUNT
      # ============================================================
      - name: "13 - Verify Java file count preserved"
        shell: bash
        run: |
          set -euo pipefail

          JAVA_COUNT_AFTER=$(find "$NEW_DIR" -type f -name '*.java' | wc -l | tr -d ' ')

          echo "Java file count before: $JAVA_COUNT_BEFORE"
          echo "Java file count after : $JAVA_COUNT_AFTER"

          if [ "$JAVA_COUNT_AFTER" -ne "$JAVA_COUNT_BEFORE" ]; then
            echo "ERROR: Java file count changed."
            exit 1
          fi

          echo "PASS: Java file count preserved."

      # ============================================================
      # 14. VERIFY COMPLETE INVENTORY BEFORE/AFTER
      # ============================================================
      - name: "14 - Verify complete Java inventory before and after"
        shell: bash
        run: |
          set -euo pipefail

          find "$NEW_DIR" -type f -name '*.java' -print \
            | sed "s#^$NEW_DIR/##" \
            | sort > /tmp/navigation-java.after.txt

          BEFORE_COUNT=$(wc -l < /tmp/navigation-java.before.txt | tr -d ' ')
          AFTER_COUNT=$(wc -l < /tmp/navigation-java.after.txt | tr -d ' ')

          echo "Inventory before: $BEFORE_COUNT Java files"
          echo "Inventory after : $AFTER_COUNT Java files"

          if [ "$BEFORE_COUNT" -ne "$AFTER_COUNT" ]; then
            echo "ERROR: Java inventory count mismatch."
            echo "Missing/extra files:"
            diff -u /tmp/navigation-java.before.txt /tmp/navigation-java.after.txt || true
            exit 1
          fi

          if ! diff -u /tmp/navigation-java.before.txt /tmp/navigation-java.after.txt > /tmp/navigation-java.inventory.diff; then
            echo "ERROR: Java inventory changed during migration."
            echo
            cat /tmp/navigation-java.inventory.diff
            exit 1
          fi

          echo "PASS: Complete Java inventory preserved."
          echo "PASS: No Navigation V1 Java file was lost or added unexpectedly."

      # ============================================================
      # 15. VERIFY BUILD.GRADLE ARCHITECTURE
      # ============================================================
      - name: "15 - Verify Navigation V1 build architecture"
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="navigation-v1-source/app/build.gradle"

          grep -Fq 'namespace "com.carassistant.v10"' "$BUILD_FILE"
          grep -Fq 'org.maplibre.gl:android-sdk:11.11.0' "$BUILD_FILE"
          grep -Fq "compileOnly files('libs/xposed-api-82.jar')" "$BUILD_FILE"
          grep -Fq "compileOnly files('libs/aasdk-legacy.jar')" "$BUILD_FILE"
          grep -Fq 'aasdk-legacy.dex' "$BUILD_FILE"

          test -f navigation-v1-source/app/libs/xposed-api-82.jar
          test -f navigation-v1-source/app/libs/aasdk-legacy.jar
          test -f navigation-v1-source/app/libs/aasdk-legacy.dex

          echo "PASS: Navigation V1 build architecture verified."

      # ============================================================
      # 16. VERIFY OLD PACKAGE/PATH ABSENCE
      # ============================================================
      - name: "16 - Verify old package and path are absent"
        shell: bash
        run: |
          set -euo pipefail

          if grep -RIn \
            -E "${OLD_PACKAGE//./\\.}|${OLD_PATH//\//\\/}" \
            navigation-v1-source 2>/dev/null; then
            echo "ERROR: Old package/path reference remains in Navigation V1."
            exit 1
          fi

          echo "PASS: Old package/path absent from Navigation V1."

      # ============================================================
      # 17. VERIFY ALL JAVA FILES USE NEW PACKAGE
      # ============================================================
      - name: "17 - Verify all Java files use new package"
        shell: bash
        run: |
          set -euo pipefail

          JAVA_FILES=$(find "$NEW_DIR" -type f -name '*.java')

          if [ -z "$JAVA_FILES" ]; then
            echo "ERROR: No Java files found after migration."
            exit 1
          fi

          while IFS= read -r file; do
            if ! grep -Fq "package $NEW_PACKAGE" "$file"; then
              echo "ERROR: Missing new package declaration:"
              echo "$file"
              exit 1
            fi
          done <<< "$JAVA_FILES"

          echo "PASS: All Navigation V1 Java files use the new package."

      # ============================================================
      # 18. VERIFY V10 SOURCE UNCHANGED
      # ============================================================
      - name: "18 - Verify v10-source unchanged"
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "v10-source" ]; then
            find v10-source -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/v10-source.after.sha256

            if ! diff -u /tmp/v10-source.before.sha256 /tmp/v10-source.after.sha256; then
              echo "ERROR: v10-source was modified."
              exit 1
            fi
          fi

          echo "PASS: v10-source unchanged."

      # ============================================================
      # 19. INSPECT GIT DIFF
      # ============================================================
      - name: "19 - Verify migration diff scope"
        shell: bash
        run: |
          set -euo pipefail

          git status --short
          git diff --stat

          if git diff --name-only | grep -q '^v10-source/'; then
            echo "ERROR: v10-source appears in git diff."
            exit 1
          fi

          echo "PASS: Migration diff scope verified."

      # ============================================================
      # 20. PREPARE GRADLE
      # ============================================================
      - name: "20 - Prepare Gradle"
        shell: bash
        working-directory: navigation-v1-source
        run: |
          set -euo pipefail

          chmod +x ./gradlew
          ./gradlew --version

      # ============================================================
      # 21. COMPILE JAVA
      # ============================================================
      - name: "21 - Compile migrated Navigation V1 Java"
        shell: bash
        working-directory: navigation-v1-source
        run: |
          set -euo pipefail

          ./gradlew :app:compileReleaseJavaWithJavac \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 22. FINAL PRE-COMMIT VERIFICATION
      # ============================================================
      - name: "22 - Final migration verification"
        shell: bash
        run: |
          set -euo pipefail

          test -d "$NEW_DIR"
          test ! -e "$OLD_DIR"

          FINAL_COUNT=$(find "$NEW_DIR" -type f -name '*.java' | wc -l | tr -d ' ')

          if [ "$FINAL_COUNT" -ne "$JAVA_COUNT_BEFORE" ]; then
            echo "ERROR: Final Java file count mismatch."
            exit 1
          fi

          if ! diff -u /tmp/navigation-java.before.txt /tmp/navigation-java.after.txt; then
            echo "ERROR: Final Java inventory mismatch."
            exit 1
          fi

          if grep -RIn \
            -E "${OLD_PACKAGE//./\\.}|${OLD_PATH//\//\\/}" \
            navigation-v1-source 2>/dev/null; then
            echo "ERROR: Old package/path still exists."
            exit 1
          fi

          echo "PASS: Final migration verification."
          echo "PASS: $FINAL_COUNT Java files preserved."
          echo "PASS: Package migrated to $NEW_PACKAGE."

      # ============================================================
      # 23. COMMIT
      # ============================================================
      - name: "23 - Commit migration"
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add navigation-v1-source

          if git diff --cached --quiet; then
            echo "ERROR: No migration changes staged."
            exit 1
          fi

          git commit -m "Migrate Navigation V1 package to com.carassistant.v10"

      # ============================================================
      # 24. PUSH MAIN
      # ============================================================
      - name: "24 - Push migration to main"
        shell: bash
        run: |
          set -euo pipefail

          git push origin HEAD:main

          echo "PASS: Migration pushed to main."

      # ============================================================
      # 25. FINAL RESULT
      # ============================================================
      - name: "25 - Final result"
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "NAVIGATION V1 PACKAGE MIGRATION COMPLETE"
          echo "============================================================"
          echo "Old package : $OLD_PACKAGE"
          echo "New package : $NEW_PACKAGE"
          echo "Java files  : $JAVA_COUNT_BEFORE"
          echo "Old path    : REMOVED"
          echo "New path    : $NEW_DIR"
          echo "Compile     : PASS"
          echo "Push main   : PASS"
          echo "============================================================"
