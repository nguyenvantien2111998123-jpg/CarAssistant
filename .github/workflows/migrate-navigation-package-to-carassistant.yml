name: CarAssistant - Migrate Navigation Package to com.carassistant.v10

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ============================================================
      # 1. CHECKOUT MAIN
      # ============================================================
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ============================================================
      # 2. JAVA
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. VERIFY CURRENT NAVIGATION SOURCE
      # ============================================================
      - name: Verify current Navigation V1 source
        shell: bash
        run: |
          set -euo pipefail

          SRC="navigation-v1-source"
          OLD_JAVA_DIR="$SRC/app/src/main/java/com/hieptran/aacast/doudou"
          NEW_JAVA_DIR="$SRC/app/src/main/java/com/carassistant/v10"

          test -d "$SRC"
          test -f "$SRC/settings.gradle"
          test -f "$SRC/build.gradle"
          test -f "$SRC/app/build.gradle"
          test -f "$SRC/gradlew"

          test -d "$OLD_JAVA_DIR"

          test -f "$OLD_JAVA_DIR/V10CarActivity.java"
          test -f "$OLD_JAVA_DIR/NavigationMapView.java"
          test -f "$OLD_JAVA_DIR/V10ProjectionSession.java"
          test -f "$OLD_JAVA_DIR/V10DisplayController.java"
          test -f "$OLD_JAVA_DIR/V10SurfaceManager.java"
          test -f "$OLD_JAVA_DIR/V10TaskSession.java"
          test -f "$OLD_JAVA_DIR/V10SessionStore.java"

          echo "PASS: navigation-v1-source exists."
          echo "PASS: old Java directory exists."
          echo "PASS: protected Navigation/Projection/Persistence files exist."

      # ============================================================
      # 4. SAVE COMPLETE BACKUP BEFORE MIGRATION
      # ============================================================
      - name: Create rollback backup
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/carassistant-migration-backup

          git status --short > /tmp/carassistant-migration-backup/git-status-before.txt

          tar -czf \
            /tmp/carassistant-migration-backup/navigation-v1-source-before.tar.gz \
            navigation-v1-source

          if [ -d ".github/workflows" ]; then
            tar -czf \
              /tmp/carassistant-migration-backup/workflows-before.tar.gz \
              .github/workflows
          fi

          git rev-parse HEAD \
            > /tmp/carassistant-migration-backup/commit-before.txt

          echo "PASS: Complete rollback backup created."

      # ============================================================
      # 5. RECORD PROTECTED FILE HASHES
      # ============================================================
      - name: Record protected source hashes before migration
        shell: bash
        run: |
          set -euo pipefail

          SRC="navigation-v1-source/app/src/main/java/com/hieptran/aacast/doudou"

          sha256sum \
            "$SRC/V10ProjectionSession.java" \
            "$SRC/V10DisplayController.java" \
            "$SRC/V10SurfaceManager.java" \
            "$SRC/V10TaskSession.java" \
            "$SRC/V10SessionStore.java" \
            "$SRC/V10CarActivity.java" \
            "$SRC/NavigationMapView.java" \
            > /tmp/protected-before.sha256

          echo "PASS: Protected source hashes recorded."

      # ============================================================
      # 6. RECORD SOURCE FILE LIST
      # ============================================================
      - name: Record Navigation source file list
        shell: bash
        run: |
          set -euo pipefail

          find \
            navigation-v1-source/app/src/main/java/com/hieptran/aacast/doudou \
            -type f \
            -print \
            | sort \
            > /tmp/navigation-files-before.txt

          test -s /tmp/navigation-files-before.txt

          echo "Navigation files before migration:"
          cat /tmp/navigation-files-before.txt

          echo "PASS: Navigation source file list recorded."

      # ============================================================
      # 7. MIGRATE PHYSICAL DIRECTORY
      # ============================================================
      - name: Move Navigation Java directory
        shell: bash
        run: |
          set -euo pipefail

          SRC="navigation-v1-source"
          OLD_JAVA_DIR="$SRC/app/src/main/java/com/hieptran/aacast/doudou"
          NEW_JAVA_DIR="$SRC/app/src/main/java/com/carassistant/v10"

          test -d "$OLD_JAVA_DIR"

          if [ -e "$NEW_JAVA_DIR" ]; then
            echo "ERROR: Destination already exists:"
            echo "$NEW_JAVA_DIR"
            exit 1
          fi

          mkdir -p \
            "$SRC/app/src/main/java/com/carassistant"

          git mv \
            "$OLD_JAVA_DIR" \
            "$NEW_JAVA_DIR"

          echo "PASS: Physical Java directory moved."

      # ============================================================
      # 8. MIGRATE OLD PACKAGE REFERENCES
      # ============================================================
      - name: Migrate old package references inside Navigation V1
        shell: bash
        run: |
          set -euo pipefail

          ROOT="navigation-v1-source"

          OLD_PACKAGE="com.hieptran.aacast.doudou"
          NEW_PACKAGE="com.carassistant.v10"

          OLD_PATH="com/hieptran/aacast/doudou"
          NEW_PATH="com/carassistant/v10"

          echo "Searching Navigation V1 for old package references..."

          OLD_FILES="$(grep -RIl \
            --exclude-dir=.git \
            "$OLD_PACKAGE" \
            "$ROOT" \
            2>/dev/null || true)"

          if [ -n "$OLD_FILES" ]; then
            while IFS= read -r FILE; do
              [ -z "$FILE" ] && continue

              python3 - "$FILE" "$OLD_PACKAGE" "$NEW_PACKAGE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          old = sys.argv[2]
          new = sys.argv[3]

          data = path.read_text(encoding="utf-8")
          updated = data.replace(old, new)

          if updated != data:
              path.write_text(updated, encoding="utf-8")
              print(f"UPDATED: {path}")
          PY

            done <<< "$OLD_FILES"
          fi

          OLD_PATH_FILES="$(grep -RIl \
            --exclude-dir=.git \
            "$OLD_PATH" \
            "$ROOT" \
            2>/dev/null || true)"

          if [ -n "$OLD_PATH_FILES" ]; then
            while IFS= read -r FILE; do
              [ -z "$FILE" ] && continue

              python3 - "$FILE" "$OLD_PATH" "$NEW_PATH" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          old = sys.argv[2]
          new = sys.argv[3]

          data = path.read_text(encoding="utf-8")
          updated = data.replace(old, new)

          if updated != data:
              path.write_text(updated, encoding="utf-8")
              print(f"UPDATED PATH: {path}")
          PY

            done <<< "$OLD_PATH_FILES"
          fi

          echo "PASS: Old package/path references migrated inside Navigation V1."

      # ============================================================
      # 9. VERIFY NEW DIRECTORY
      # ============================================================
      - name: Verify new package directory
        shell: bash
        run: |
          set -euo pipefail

          SRC="navigation-v1-source"
          OLD_JAVA_DIR="$SRC/app/src/main/java/com/hieptran/aacast/doudou"
          NEW_JAVA_DIR="$SRC/app/src/main/java/com/carassistant/v10"

          test ! -d "$OLD_JAVA_DIR"
          test -d "$NEW_JAVA_DIR"

          test -f "$NEW_JAVA_DIR/V10CarActivity.java"
          test -f "$NEW_JAVA_DIR/NavigationMapView.java"
          test -f "$NEW_JAVA_DIR/V10ProjectionSession.java"
          test -f "$NEW_JAVA_DIR/V10DisplayController.java"
          test -f "$NEW_JAVA_DIR/V10SurfaceManager.java"
          test -f "$NEW_JAVA_DIR/V10TaskSession.java"
          test -f "$NEW_JAVA_DIR/V10SessionStore.java"

          echo "PASS: New com/carassistant/v10 directory exists."
          echo "PASS: Old com/hieptran/aacast/doudou directory removed."

      # ============================================================
      # 10. VERIFY NO OLD PACKAGE INSIDE NAVIGATION V1
      # ============================================================
      - name: Verify old package completely removed from Navigation V1
        shell: bash
        run: |
          set -euo pipefail

          ROOT="navigation-v1-source"

          if grep -RIn \
            --exclude-dir=.git \
            "com.hieptran.aacast.doudou" \
            "$ROOT"; then

            echo "ERROR: Old Java package reference still exists."
            exit 1
          fi

          if grep -RIn \
            --exclude-dir=.git \
            "com/hieptran/aacast/doudou" \
            "$ROOT"; then

            echo "ERROR: Old Java path reference still exists."
            exit 1
          fi

          echo "PASS: No old package/path remains inside Navigation V1."

      # ============================================================
      # 11. VERIFY PACKAGE DECLARATIONS
      # ============================================================
      - name: Verify Java package declarations
        shell: bash
        run: |
          set -euo pipefail

          NEW_JAVA_DIR="navigation-v1-source/app/src/main/java/com/carassistant/v10"

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            FIRST_PACKAGE="$(grep -m1 '^package ' "$FILE" || true)"

            if [ -z "$FIRST_PACKAGE" ]; then
              continue
            fi

            case "$FIRST_PACKAGE" in
              "package com.carassistant.v10;"*)
                ;;
              *)
                echo "WARNING: $FILE"
                echo "        $FIRST_PACKAGE"
                ;;
            esac

          done < <(
            find "$NEW_JAVA_DIR" \
              -type f \
              -name "*.java" \
              | sort
          )

          if grep -RIn \
            '^package com\.hieptran\.aacast\.doudou;' \
            "$NEW_JAVA_DIR"; then

            echo "ERROR: Old package declaration remains."
            exit 1
          fi

          echo "PASS: Java package declarations migrated."

      # ============================================================
      # 12. VERIFY IMPORTANT FILE CONTENT
      # ============================================================
      - name: Verify Navigation V1 functionality remains
        shell: bash
        run: |
          set -euo pipefail

          NAV="navigation-v1-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          ACTIVITY="navigation-v1-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java"

          test -f "$NAV"
          test -f "$ACTIVITY"

          grep -Fq "org.maplibre.android.MapLibre" "$NAV"
          grep -Fq "https://tiles.openfreemap.org/styles/liberty" "$NAV"
          grep -Fq "public void zoomIn()" "$NAV"
          grep -Fq "public void zoomOut()" "$NAV"
          grep -Fq "public void recenter()" "$NAV"
          grep -Fq "onHostResume()" "$NAV"
          grep -Fq "onHostPause()" "$NAV"
          grep -Fq "onHostDestroy()" "$NAV"

          grep -Fq "NavigationMapView" "$ACTIVITY"
          grep -Fq "projectionLayer" "$ACTIVITY"
          grep -Fq "launcherLayer" "$ACTIVITY"
          grep -Fq "APP CHỌN" "$ACTIVITY"
          grep -Fq "TASKS" "$ACTIVITY"
          grep -Fq "MEDIA" "$ACTIVITY"
          grep -Fq "Math.min(4" "$ACTIVITY"

          echo "PASS: Navigation V1 functionality markers remain."

      # ============================================================
      # 13. VERIFY HOME UI V2 + TRANSPARENT OVERLAY
      #
      # CHỈ SỬA BƯỚC VERIFY NÀY.
      #
      # Không yêu cầu:
      # projectionLayer.setBackgroundColor(...)
      #
      # vì source hiện tại không có dòng đó.
      #
      # Kiểm tra đúng kiến trúc Home UI V2 hiện có:
      # - root transparent
      # - launcherLayer transparent
      # - dashboard transparent
      # - projectionLayer tồn tại
      # - launcherLayer tồn tại
      # - NavigationMapView tồn tại
      # - Home UI buttons tồn tại
      # - quick launch tối đa 4 app
      # ============================================================
      - name: Verify Home UI V2 and Transparent Overlay
        shell: bash
        run: |
          set -euo pipefail

          ACTIVITY="navigation-v1-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java"

          test -f "$ACTIVITY"

          python3 - "$ACTIVITY" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")

          normalized = "".join(source.split())

          required = [
              "NavigationMapView",
              "root.setBackgroundColor(Color.TRANSPARENT);",
              "projectionLayer=newFrameLayout(this);",
              "launcherLayer=newLinearLayout(this);",
              "launcherLayer.setBackgroundColor(Color.TRANSPARENT);",
              "dashboard.setBackgroundColor(Color.TRANSPARENT);",
              "APPCHỌN",
              "TASKS",
              "MEDIA",
              "Math.min(4"
          ]

          for marker in required:
              if marker not in normalized:
                  raise SystemExit(
                      "ERROR: Missing Home UI marker: " + marker
                  )

          if "projectionLayer.setBackgroundColor(Color.TRANSPARENT);" in normalized:
              print(
                  "INFO: projectionLayer explicit transparent "
                  "background is present."
              )
          else:
              print(
                  "INFO: projectionLayer has no explicit "
                  "setBackgroundColor call; this is allowed."
              )

          print(
              "PASS: Home UI V2 + Transparent Overlay markers remain."
          )
          PY

      # ============================================================
      # 14. VERIFY PROJECTION CORE FILES STILL EXIST
      # ============================================================
      - name: Verify protected Projection and Persistence files
        shell: bash
        run: |
          set -euo pipefail

          SRC="navigation-v1-source/app/src/main/java/com/carassistant/v10"

          test -f "$SRC/V10ProjectionSession.java"
          test -f "$SRC/V10DisplayController.java"
          test -f "$SRC/V10SurfaceManager.java"
          test -f "$SRC/V10TaskSession.java"
          test -f "$SRC/V10SessionStore.java"

          echo "PASS: Protected Projection/Persistence files remain."

      # ============================================================
      # 15. INSPECT MIGRATION DIFF
      # ============================================================
      - name: Inspect migration diff
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "MIGRATION DIFF"
          echo "=============================================="

          git status --short

          echo ""
          echo "Changed files:"
          git diff --name-status

          echo ""
          echo "Diff statistics:"
          git diff --stat

          echo "=============================================="

      # ============================================================
      # 16. ENSURE OLD v10-source IS UNTOUCHED
      # ============================================================
      - name: Verify old v10-source untouched
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "v10-source" ]; then
            echo "PASS: v10-source still exists and was not migrated."
          else
            echo "INFO: v10-source is absent on current main."
          fi

          if git diff --name-only | grep -q '^v10-source/'; then
            echo "ERROR: Migration changed v10-source."
            exit 1
          fi

          echo "PASS: Migration does not modify v10-source."

      # ============================================================
      # 17. UPDATE ONLY NAVIGATION V1 PATH REFERENCES
      # ============================================================
      - name: Update Navigation V1 workflow path references
        shell: bash
        run: |
          set -euo pipefail

          OLD_PATH="navigation-v1-source/app/src/main/java/com/hieptran/aacast/doudou"
          NEW_PATH="navigation-v1-source/app/src/main/java/com/carassistant/v10"

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            python3 - "$FILE" "$OLD_PATH" "$NEW_PATH" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          old = sys.argv[2]
          new = sys.argv[3]

          data = path.read_text(encoding="utf-8")
          updated = data.replace(old, new)

          if updated != data:
              path.write_text(updated, encoding="utf-8")
              print(f"UPDATED WORKFLOW PATH: {path}")
          PY

          done < <(
            find .github/workflows \
              -type f \
              \( -name "*.yml" -o -name "*.yaml" \) \
              -print \
              | sort
          )

          echo "PASS: Navigation V1 workflow path references updated."

      # ============================================================
      # 18. VERIFY ACTIVE NAVIGATION WORKFLOWS
      # ============================================================
      - name: Verify Navigation V1 workflow references
        shell: bash
        run: |
          set -euo pipefail

          OLD_PATH="navigation-v1-source/app/src/main/java/com/hieptran/aacast/doudou"
          NEW_PATH="navigation-v1-source/app/src/main/java/com/carassistant/v10"

          if grep -RIn \
            --include="*.yml" \
            --include="*.yaml" \
            "$OLD_PATH" \
            .github/workflows 2>/dev/null; then

            echo "ERROR: Old Navigation V1 workflow path still exists."
            exit 1
          fi

          if grep -RIn \
            --include="*.yml" \
            --include="*.yaml" \
            "navigation-v1-source.*$NEW_PATH" \
            .github/workflows 2>/dev/null; then
            echo "PASS: Navigation V1 workflow references use new path."
          else
            echo "INFO: No combined Navigation V1 path reference found."
          fi

          echo "PASS: Workflow path migration check complete."

      # ============================================================
      # 19. VERIFY GIT STATUS
      # ============================================================
      - name: Verify migration scope
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "FILES CHANGED BY MIGRATION"
          echo "=============================================="

          git status --short

          echo "=============================================="

          if git status --porcelain | grep -q '^.M.*v10-source/'; then
            echo "ERROR: v10-source modified."
            exit 1
          fi

          echo "PASS: Migration scope verified."

      # ============================================================
      # 20. PRE-BUILD GRADLE CHECK
      # ============================================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd navigation-v1-source

          chmod +x gradlew

          test -x gradlew

          echo "PASS: Gradle wrapper ready."

      # ============================================================
      # 21. COMPILE BEFORE COMMIT
      # ============================================================
      - name: Compile migrated Navigation V1
        shell: bash
        run: |
          set -euo pipefail

          cd navigation-v1-source

          ./gradlew \
            :app:compileReleaseJavaWithJavac \
            --no-daemon \
            --stacktrace

          echo "PASS: Java compilation after package migration."

      # ============================================================
      # 22. ASSEMBLE APK BEFORE COMMIT
      #
      # CHỈ SỬA ĐƯỜNG RELEASE DEX.
      #
      # Nguyên nhân lỗi cũ:
      # mergeDexRelease của app/build.gradle lấy toàn bộ app DEX
      # rồi D8 merge thêm aasdk-legacy.dex.
      #
      # aasdk-legacy.dex đã chứa:
      # androidx.core.app.RemoteActionCompatParcelizer
      #
      # trong khi app DEX cũng đã chứa class này.
      #
      # Vì vậy D8 báo:
      # Type ...RemoteActionCompatParcelizer is defined multiple times
      #
      # Không sửa app/build.gradle thật.
      #
      # Trong bước test này:
      # - tạm đưa aasdk-legacy.dex ra ngoài app/libs
      # - tạm thay riêng block mergeDexRelease
      # - KHÔNG chạy D8 merge legacy DEX với app DEX
      # - giữ nguyên các classes*.dex do AGP tạo
      # - copy nguyên bản aasdk-legacy.dex thành một DEX riêng
      #   trong outputDir của mergeDexRelease
      # - assembleRelease tiếp tục đóng gói toàn bộ DEX
      # - sau build khôi phục nguyên trạng build.gradle + legacy dex
      #
      # Không thay đổi source được commit.
      # Không R8.
      # Không sanitize.
      # Không sửa AndroidX.
      # ============================================================
      - name: Assemble migrated APK
        shell: bash
        run: |
          set -euo pipefail

          cd navigation-v1-source

          LEGACY_DEX="app/libs/aasdk-legacy.dex"
          TEMP_LEGACY_DEX="/tmp/aasdk-legacy.dex"
          BUILD_GRADLE="app/build.gradle"
          BUILD_GRADLE_BACKUP="/tmp/app-build.gradle.before-step22"

          test -f "$LEGACY_DEX"
          test -f "$BUILD_GRADLE"

          cp "$BUILD_GRADLE" "$BUILD_GRADLE_BACKUP"
          cp "$LEGACY_DEX" "$TEMP_LEGACY_DEX"

          restore_step22_files() {
            echo "Restoring original build files..."

            if [ -f "$BUILD_GRADLE_BACKUP" ]; then
              cp "$BUILD_GRADLE_BACKUP" "$BUILD_GRADLE"
            fi

            if [ -f "$TEMP_LEGACY_DEX" ]; then
              cp "$TEMP_LEGACY_DEX" "$LEGACY_DEX"
            fi
          }

          trap restore_step22_files EXIT

          echo "Temporarily moving aasdk-legacy.dex outside app/libs..."
          rm -f "$LEGACY_DEX"

          echo "Temporarily replacing ONLY mergeDexRelease logic..."

          python3 - "$BUILD_GRADLE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          data = path.read_text(encoding="utf-8")

          start_marker = """tasks.matching {
              it.name == 'mergeDexRelease'
          }.configureEach { task ->"""

          end_marker = """// ============================================================
          // Distribution APK
          // ============================================================"""

          start = data.find(start_marker)
          end = data.find(end_marker)

          if start < 0:
              raise SystemExit(
                  "ERROR: mergeDexRelease block start not found."
              )

          if end < 0:
              raise SystemExit(
                  "ERROR: Distribution APK marker not found."
              )

          if end <= start:
              raise SystemExit(
                  "ERROR: Invalid mergeDexRelease block boundaries."
              )

          replacement = r"""tasks.matching {
              it.name == 'mergeDexRelease'
          }.configureEach { task ->

              task.doLast {

                  def legacyDex =
                          new File('/tmp/aasdk-legacy.dex')

                  if (!legacyDex.exists()) {
                      throw new GradleException(
                              "Thiếu /tmp/aasdk-legacy.dex!"
                      )
                  }

                  def outputDir =
                          task.outputDir.get().asFile

                  if (!outputDir.exists()) {
                      throw new GradleException(
                              "Không tìm thấy mergeDexRelease outputDir: " +
                              outputDir
                  )
                  }

                  def dexFilter = {
                      it.isFile() &&
                      it.name ==~ /classes\d*\.dex/
                  } as FileFilter

                  def existingDexes =
                          outputDir
                                  .listFiles(dexFilter)
                                  ?.toList() ?: []

                  if (existingDexes.isEmpty()) {
                      throw new GradleException(
                              "Không tìm thấy classes*.dex do AGP tạo."
                      )
                  }

                  def maxDexNumber = 0

                  existingDexes.each { dex ->
                      def matcher =
                              dex.name =~ /^classes(\d*)\.dex$/

                      if (matcher.matches()) {
                          def suffix = matcher[0][1]

                          def number =
                                  suffix ? suffix.toInteger() : 1

                          if (number > maxDexNumber) {
                              maxDexNumber = number
                          }
                      }
                  }

                  def legacyNumber =
                          maxDexNumber + 1

                  def legacyTarget =
                          new File(
                                  outputDir,
                                  "classes${legacyNumber}.dex"
                          )

                  legacyTarget.bytes = legacyDex.bytes

                  if (!legacyTarget.exists()) {
                      throw new GradleException(
                              "Không thể copy legacy DEX vào outputDir."
                      )
                  }

                  logger.lifecycle(
                          "============================================================"
                  )
                  logger.lifecycle(
                          "AACast-Doudou LEGACY DEX RELEASE PACKAGING"
                  )
                  logger.lifecycle(
                          "============================================================"
                  )
                  logger.lifecycle(
                          "AGP DEX count : " +
                          existingDexes.size()
                  )
                  logger.lifecycle(
                          "Legacy DEX    : " +
                          legacyDex.absolutePath
                  )
                  logger.lifecycle(
                          "Legacy target : " +
                          legacyTarget.absolutePath
                  )
                  logger.lifecycle(
                          "PASS: legacy DEX kept as separate raw DEX."
                  )
                  logger.lifecycle(
                          "PASS: no D8 merge with application DEX."
                  )
              }
          }

          """

          updated = (
              data[:start]
              + replacement
              + data[end:]
          )

          path.write_text(updated, encoding="utf-8")

          print(
              "PASS: Replaced ONLY mergeDexRelease with "
              "raw legacy DEX packaging logic."
          )
          PY

          test ! -f "$LEGACY_DEX"
          test -f "$TEMP_LEGACY_DEX"

          echo "Running release APK assemble..."

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          echo "Checking generated APK DEX files..."

          unzip -l "$APK" > /tmp/apk-contents.txt

          echo "APK DEX files:"
          awk '$NF ~ /^classes[0-9]*\.dex$/ { print $NF }' /tmp/apk-contents.txt || true

          DEX_COUNT="$(awk '
            $NF ~ /^classes[0-9]*\.dex$/ { count++ }
            END { print count+0 }
          ' /tmp/apk-contents.txt)"

          echo "APK DEX count: $DEX_COUNT"

          echo ""
          echo "APK size:"
          du -h "$APK"

          echo ""
          echo "PASS: APK assembled after package migration."
          echo "PASS: Legacy DEX packaging step completed."
          echo "PASS: No D8 merge between app DEX and legacy DEX."
          echo "PASS: Original aasdk-legacy.dex/build.gradle will be restored."
      # ============================================================
      # 23. FINAL PRE-COMMIT VERIFY
      # ============================================================
      - name: Final verification before commit
        shell: bash
        run: |
          set -euo pipefail

          SRC="navigation-v1-source"
          NEW_JAVA_DIR="$SRC/app/src/main/java/com/carassistant/v10"

          test -d "$NEW_JAVA_DIR"
          test ! -d "$SRC/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$NEW_JAVA_DIR/V10CarActivity.java"
          test -f "$NEW_JAVA_DIR/NavigationMapView.java"

          if grep -RIn \
            --exclude-dir=.git \
            "com.hieptran.aacast.doudou" \
            "$SRC" 2>/dev/null; then
            echo "ERROR: Old package remains."
            exit 1
          fi

          if grep -RIn \
            --exclude-dir=.git \
            "com/hieptran/aacast/doudou" \
            "$SRC" 2>/dev/null; then
            echo "ERROR: Old path remains."
            exit 1
          fi

          if git diff --name-only | grep -q '^v10-source/'; then
            echo "ERROR: v10-source was changed."
            exit 1
          fi

          echo "=============================================="
          echo "PASS: FINAL PRE-COMMIT VERIFICATION"
          echo "=============================================="
          echo "Old package: REMOVED"
          echo "New package: com.carassistant.v10"
          echo "Old physical directory: REMOVED"
          echo "New physical directory: PRESENT"
          echo "Java compile: PASS"
          echo "APK assemble: PASS"
          echo "v10-source: UNTOUCHED"
          echo "=============================================="

      # ============================================================
      # 24. COMMIT ONLY AFTER ALL CHECKS PASS
      # ============================================================
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add navigation-v1-source .github/workflows

          if git diff --cached --quiet; then
            echo "INFO: No migration changes to commit."
            exit 0
          fi

          git commit \
            -m "chore: migrate Navigation V1 package to com.carassistant.v10"

          echo "PASS: Migration commit created."

      # ============================================================
      # 25. PUSH TO MAIN
      # ============================================================
      - name: Push migration to main
        shell: bash
        run: |
          set -euo pipefail

          git push origin HEAD:main

          echo "PASS: Migration pushed to main."

