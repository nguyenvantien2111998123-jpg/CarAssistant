name: Fix V10 Back Home Buttons

on:
  workflow_dispatch:

jobs:
  fix-v10-back-home:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Patch V10CarActivity
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          test -f "$FILE"

          echo "=== Checking V10CarActivity ==="
          grep -n "private void attachProjection" "$FILE"

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          text = path.read_text()

          # ------------------------------------------------------------
          # 1. Add projectionControls field
          # ------------------------------------------------------------

          old = """    private TextureView textureView;
              private V10ProjectionSession session;"""

          new = """    private TextureView textureView;
              private LinearLayout projectionControls;
              private V10ProjectionSession session;"""

          if old in text:
              text = text.replace(old, new, 1)
          elif "private LinearLayout projectionControls;" not in text:
              old = """    private TextureView textureView;
              private V10ProjectionSession session;"""
              if old not in text:
                  raise SystemExit(
                      "ERROR: Could not find TextureView/session declarations"
                  )

          # ------------------------------------------------------------
          # 2. Add visible BACK/HOME controls above TextureView
          # ------------------------------------------------------------

          anchor = """        projectionLayer.addView(
                  textureView,
                  new FrameLayout.LayoutParams(
                          -1,
                          -1));

              session =
                      new V10ProjectionSession(
                              this);"""

          replacement = """        projectionLayer.addView(
                  textureView,
                  new FrameLayout.LayoutParams(
                          -1,
                          -1));

              /*
               * V10 navigation controls.
               *
               * The projection TextureView occupies the complete
               * Android Auto surface. Put the navigation buttons
               * in a separate layer ABOVE the TextureView so they
               * remain visible while an application is projected.
               */
              projectionControls =
                      new LinearLayout(this);

              projectionControls.setOrientation(
                      LinearLayout.HORIZONTAL);

              projectionControls.setGravity(
                      Gravity.CENTER);

              projectionControls.setPadding(
                      dp(8),
                      dp(6),
                      dp(8),
                      dp(6));

              projectionControls.setBackgroundColor(
                      Color.rgb(
                              12,
                              15,
                              19));

              FrameLayout.LayoutParams
                      controlsParams =
                      new FrameLayout.LayoutParams(
                              -1,
                              dp(64),
                              Gravity.BOTTOM);

              projectionLayer.addView(
                      projectionControls,
                      controlsParams);

              TextView backButton =
                      buttonText("BACK");

              backButton.setOnClickListener(
                      v -> handleControlBack());

              projectionControls.addView(
                      backButton,
                      new LinearLayout.LayoutParams(
                              0,
                              dp(52),
                              1f));

              TextView homeButton =
                      buttonText("HOME");

              homeButton.setOnClickListener(
                      v -> handleControlHome());

              LinearLayout.LayoutParams
                      homeParams =
                      new LinearLayout.LayoutParams(
                              0,
                              dp(52),
                              1f);

              homeParams.setMargins(
                      dp(8),
                      0,
                      0,
                      0);

              projectionControls.addView(
                      homeButton,
                      homeParams);

              session =
                      new V10ProjectionSession(
                              this);"""

          if anchor not in text:
              if "projectionControls ="
              not in text:
                  raise SystemExit(
                      "ERROR: attachProjection anchor not found"
                  )
          else:
              text = text.replace(
                  anchor,
                  replacement,
                  1
              )

          # ------------------------------------------------------------
          # 3. Do NOT destroy the controls reference incorrectly.
          # ------------------------------------------------------------

          # Existing lifecycle can safely remove the view reference.
          # The actual view belongs to projectionLayer and is destroyed
          # together with the activity.

          if "projectionControls = null;" not in text:
              marker = """        textureView = null;
              projectionLayer = null;"""

              if marker in text:
                  text = text.replace(
                      marker,
                      """        textureView = null;
              projectionControls = null;
              projectionLayer = null;""",
                      1
                  )

          path.write_text(text)

          print("V10CarActivity patched successfully.")
          PY

      - name: Verify Back/Home implementation
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          echo "=== BACK/HOME verification ==="

          grep -n "projectionControls" "$FILE"
          grep -n 'buttonText("BACK")' "$FILE"
          grep -n 'buttonText("HOME")' "$FILE"
          grep -n "handleControlBack()" "$FILE"
          grep -n "handleControlHome()" "$FILE"

          echo "=== Checking control count ==="

          BACK_COUNT=$(grep -c 'buttonText("BACK")' "$FILE" || true)
          HOME_COUNT=$(grep -c 'buttonText("HOME")' "$FILE" || true)

          test "$BACK_COUNT" -eq 1
          test "$HOME_COUNT" -eq 1

          echo "BACK button: OK"
          echo "HOME button: OK"

      - name: Show Gradle files
        shell: bash
        run: |
          set -euo pipefail

          find v10-source -maxdepth 3 \
            \( -name "gradlew" -o -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print

      - name: Make gradlew executable
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "v10-source/gradlew" ]; then
            chmod +x v10-source/gradlew
          else
            echo "ERROR: v10-source/gradlew not found"
            exit 1
          fi

      - name: Build V10 debug APK
        shell: bash
        working-directory: v10-source
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          echo "=== APK files ==="

          find v10-source \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload V10 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Fix-Back-Home
          path: |
            v10-source/**/build/outputs/apk/**/*.apk
            v10-source/**/build/outputs/apk/*.apk
          if-no-files-found: error

      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Patched-Source
          path: v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java
          if-no-files-found: error
