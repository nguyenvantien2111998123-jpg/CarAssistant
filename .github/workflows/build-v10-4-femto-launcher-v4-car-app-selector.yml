name: Build Car Assistant V10.4 - V4 Car App Selector

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-disabled: true

      # ============================================================
      # VERIFY V10.4 V3 BASE
      # ============================================================

      - name: Verify V10.4 V3 base
        shell: bash
        run: |
          set -euo pipefail

          ROOT="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          echo "=== VERIFY V10 SOURCE ==="

          test -d "v10-source"

          test -f "$ROOT/V10CarActivity.java"
          test -f "$ROOT/V10LauncherActivity.java"
          test -f "$ROOT/V10ProjectionSession.java"
          test -f "$ROOT/V10InputController.java"
          test -f "$ROOT/V10SessionStore.java"
          test -f "$ROOT/V10ControlReceiver.java"
          test -f "$ROOT/RootShellSession.java"
          test -f "$ROOT/V10Display.java"

          echo "V10.4 V3 BASE OK"

      # ============================================================
      # BACKUP CURRENT V10 CAR ACTIVITY
      # ============================================================

      - name: Backup V10CarActivity
        shell: bash
        run: |
          set -euo pipefail

          cp \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java \
            /tmp/V10CarActivity.java.before-v4

          echo "Backup created."

      # ============================================================
      # PATCH V10 CAR ACTIVITY
      #
      # V4 GOAL:
      #
      # Android Auto itself becomes the application selector.
      #
      # Dashboard
      #    |
      #    +-- APPS
      #          |
      #          +-- APPLICATIONS
      #                 |
      #                 +-- Select app
      #                         |
      #                         +-- Projection
      #
      # While an app is projected:
      #
      # Projection
      #    |
      #    +-- APPS
      #          |
      #          +-- APPLICATIONS
      #                 |
      #                 +-- Select another app
      #                         |
      #                         +-- New Projection
      #
      # Phone selection is NOT required.
      # ============================================================

      - name: Patch V10CarActivity for direct Android Auto App Selector
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          s = p.read_text()

          # ========================================================
          # REPLACE showApps()
          # ========================================================

          old = """    private void showApps() {

          dashboard
                  .setVisibility(
                          View.GONE);

          appPanel
                  .setVisibility(
                          View.VISIBLE);
      }
  """

          new = """    private void showApps() {

          /*
           * V10.4 V4
           *
           * APPS is a real Android Auto-side application
           * selector.
           *
           * It must work from both:
           *
           * 1. Dashboard
           * 2. Active projection
           *
           * Therefore launcherLayer is explicitly restored
           * before displaying the Applications panel.
           */

          if (launcherLayer == null
                  || appPanel == null
                  || dashboard == null) {

              return;
          }

          /*
           * Hide the projected application while the selector
           * is visible.
           *
           * The V10 projection session itself remains available
           * until another application is selected.
           */
          projectionLayer.setVisibility(
                  View.GONE);

          launcherLayer.setVisibility(
                  View.VISIBLE);

          dashboard.setVisibility(
                  View.GONE);

          appPanel.setVisibility(
                  View.VISIBLE);

          loadApps();
      }
  """

          if old not in s:
              raise SystemExit(
                  "ERROR: existing showApps() block not found"
              )

          s = s.replace(old, new, 1)

          # ========================================================
          # REPLACE hideApps()
          # ========================================================

          old = """    private void hideApps() {

          appPanel
                  .setVisibility(
                          View.GONE);

          dashboard
                  .setVisibility(
                          View.VISIBLE);
      }
  """

          new = """    private void hideApps() {

          if (appPanel == null
                  || dashboard == null
                  || launcherLayer == null) {

              return;
          }

          appPanel.setVisibility(
                  View.GONE);

          dashboard.setVisibility(
                  View.VISIBLE);

          launcherLayer.setVisibility(
                  View.VISIBLE);

          /*
           * Returning from Applications means returning to
           * the V10 dashboard.
           */
          projectionLayer.setVisibility(
                  View.GONE);
      }
  """

          if old not in s:
              raise SystemExit(
                  "ERROR: existing hideApps() block not found"
              )

          s = s.replace(old, new, 1)

          # ========================================================
          # REPLACE launchProjection()
          # ========================================================

          old = """    private void launchProjection(
              ComponentName component) {

          if (component == null
                  || session == null) {
              return;
          }

          activeTarget =
                  component;

          V10SessionStore
                  .setTarget(
                          this,
                          component);

          session.setTarget(
                  component);

          launcherLayer
                  .setVisibility(
                          View.GONE);

          projectionLayer
                  .setVisibility(
                          View.VISIBLE);
      }
  """

          new = """    private void launchProjection(
              ComponentName component) {

          if (component == null
                  || session == null) {

              return;
          }

          /*
           * Switching applications from the Android Auto
           * application selector.
           *
           * Release the previous virtual display before
           * creating the new projection.
           */
          if (activeTarget != null
                  && !activeTarget.equals(component)) {

              session.release();
          }

          activeTarget =
                  component;

          /*
           * Persist the selected application so the existing
           * V10 session architecture continues to work.
           */
          V10SessionStore
                  .setTarget(
                          this,
                          component);

          /*
           * Hide every launcher layer before projection.
           */
          launcherLayer
                  .setVisibility(
                          View.GONE);

          appPanel
                  .setVisibility(
                          View.GONE);

          dashboard
                  .setVisibility(
                          View.GONE);

          projectionLayer
                  .setVisibility(
                          View.VISIBLE);

          /*
           * Start the proven V10 projection engine.
           */
          session.setTarget(
                  component);
      }
  """

          if old not in s:
              raise SystemExit(
                  "ERROR: existing launchProjection() block not found"
              )

          s = s.replace(old, new, 1)

          # ========================================================
          # KEEP CONTROL APPS EXPLICIT
          # ========================================================

          old = """    public void handleControlApps() {

          showApps();
      }
  """

          new = """    public void handleControlApps() {

          /*
           * APPS is intentionally handled entirely inside
           * Android Auto.
           *
           * The phone launcher is not required.
           */
          showApps();
      }
  """

          if old not in s:
              raise SystemExit(
                  "ERROR: existing handleControlApps() block not found"
              )

          s = s.replace(old, new, 1)

          # ========================================================
          # KEEP HOME AS DASHBOARD
          # ========================================================

          old = """    public void handleControlHome() {

          returnToLauncher();
      }
  """

          new = """    public void handleControlHome() {

          /*
           * HOME always returns to the Car Assistant dashboard.
           */
          returnToLauncher();
      }
  """

          if old not in s:
              raise SystemExit(
                  "ERROR: existing handleControlHome() block not found"
              )

          s = s.replace(old, new, 1)

          p.write_text(s)

          print("V10CarActivity V4 patch completed.")
          PY

      # ============================================================
      # VERIFY DIRECT CAR APP SELECTOR
      # ============================================================

      - name: Verify direct Android Auto selector
        shell: bash
        run: |
          set -euo pipefail

          CAR="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          echo "=== VERIFY CAR APP SELECTOR ==="

          grep -q "private void showApps()" "$CAR"
          grep -q "private void hideApps()" "$CAR"

          grep -q "APPLICATIONS" "$CAR"

          grep -q "ACTION_MAIN" "$CAR"
          grep -q "CATEGORY_LAUNCHER" "$CAR"

          grep -q "launchProjection" "$CAR"

          grep -q "handleControlApps" "$CAR"

          grep -q "projectionLayer" "$CAR"

          grep -q "launcherLayer" "$CAR"

          echo "CAR APP SELECTOR OK"

      # ============================================================
      # VERIFY APP SELECTION ACTUALLY CALLS PROJECTION
      # ============================================================

      - name: Verify app selection launches projection
        shell: bash
        run: |
          set -euo pipefail

          CAR="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          echo "=== VERIFY APP TILE FLOW ==="

          grep -q "tile.setOnClickListener" "$CAR"

          grep -q "launchProjection(" "$CAR"

          echo "APP TILE -> PROJECTION FLOW OK"

      # ============================================================
      # VERIFY EXISTING PROJECTION ENGINE
      # ============================================================

      - name: Verify projection engine
        shell: bash
        run: |
          set -euo pipefail

          SESSION="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
          INPUT="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10InputController.java"
          SHELL="v10-source/app/src/main/java/com/hieptran/aacast/doudou/RootShellSession.java"

          echo "=== VERIFY VIRTUAL DISPLAY ==="

          grep -q "createVirtualDisplay" "$SESSION"
          grep -q "setDefaultBufferSize" "$SESSION"
          grep -q "V10Display.nameFor" "$SESSION"

          echo "VirtualDisplay OK"

          echo "=== VERIFY APP LAUNCH ==="

          grep -q "am start" "$SESSION"
          grep -q -- "--display" "$SESSION"
          grep -q -- "--windowingMode" "$SESSION"

          echo "Projection launch OK"

          echo "=== VERIFY INPUT ==="

          grep -q "session.tap" "$INPUT"
          grep -q "session.swipe" "$INPUT"

          echo "Touch/swipe controller OK"

          echo "=== VERIFY ROOT SHELL ==="

          grep -q 'ProcessBuilder("su")' "$SHELL"

          echo "RootShell OK"

      # ============================================================
      # VERIFY V10 DISPLAY
      # ============================================================

      - name: Verify V10 display identity
        shell: bash
        run: |
          set -euo pipefail

          DISPLAY="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10Display.java"

          grep -q "com.carassistant.v10" "$DISPLAY"
          grep -q "Car Assistant V10" "$DISPLAY"
          grep -q "type != 5" "$DISPLAY"

          echo "V10 display identity OK"

      # ============================================================
      # VERIFY CONTROL RECEIVER
      # ============================================================

      - name: Verify Android Auto controls
        shell: bash
        run: |
          set -euo pipefail

          RECEIVER="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ControlReceiver.java"

          echo "=== VERIFY CONTROL RECEIVER ==="

          grep -q "handleControlBack" "$RECEIVER"
          grep -q "handleControlHome" "$RECEIVER"
          grep -q "handleControlRecents" "$RECEIVER"
          grep -q "handleControlApps" "$RECEIVER"

          echo "Back/Home/Recents/Apps controls OK"

      # ============================================================
      # VERIFY SESSION STORE
      # ============================================================

      - name: Verify session store
        shell: bash
        run: |
          set -euo pipefail

          STORE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java"

          grep -q "setTarget" "$STORE"
          grep -q "getTarget" "$STORE"
          grep -q "clearTarget" "$STORE"
          grep -q "setCurrentActivity" "$STORE"

          echo "Session store OK"

      # ============================================================
      # NO GEARHEAD CONTROL BAR
      # ============================================================

      - name: Verify no GearheadControlBar dependency
        shell: bash
        run: |
          set -euo pipefail

          JAVA="v10-source/app/src/main/java"

          if grep -R \
            "GearheadControlBar" \
            "$JAVA" \
            --include="*.java"; then

            echo
            echo "ERROR: GearheadControlBar dependency found."
            exit 1
          fi

          echo "No GearheadControlBar dependency."

      # ============================================================
      # NO ACCIDENTAL ANDROID 13 ONLY API
      # ============================================================

      - name: Verify Android 12 compatibility
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="v10-source/app/build.gradle"

          echo "=== VERIFY SDK ==="

          grep -q "compileSdk" "$GRADLE"
          grep -q "minSdk" "$GRADLE"

          echo "SDK configuration found."

          MINSDK=$(grep -oE 'minSdk(Value)?[[:space:]]+[0-9]+' "$GRADLE" \
            | grep -oE '[0-9]+' \
            | tail -1 || true)

          if [ -n "$MINSDK" ]; then
            echo "Detected minSdk: $MINSDK"

            if [ "$MINSDK" -gt 31 ]; then
              echo "ERROR: minSdk is above Android 12."
              exit 1
            fi
          fi

          echo "Android 12 compatibility check passed."

      # ============================================================
      # CHECK PACKAGE
      # ============================================================

      - name: Verify V10 package
        shell: bash
        run: |
          set -euo pipefail

          JAVA="v10-source/app/src/main/java"

          if grep -R \
            "package com.carassistant.v9" \
            "$JAVA" \
            --include="*.java"; then

            echo "ERROR: V9 package remains in Java source."
            exit 1
          fi

          grep -R \
            "package com.carassistant.v10" \
            "$JAVA" \
            --include="*.java" \
            >/dev/null

          echo "V10 package verification passed."

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build V10.4 V4
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "========================================"
          echo " BUILD CAR ASSISTANT V10.4 V4"
          echo "========================================"

          ./gradlew \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "=== VERIFY APK ==="

          test -f "$APK"

          echo
          echo "APK:"
          ls -lh "$APK"

          echo
          echo "SHA256:"
          sha256sum "$APK"

          echo
          echo "APK verification passed."

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload V10.4 V4 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10.4-Femto-Launcher-V4-Car-App-Selector
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # COMMIT SOURCE
      # ============================================================

      - name: Commit V10.4 V4 source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

          if git diff --cached --quiet; then

            echo "No V10.4 V4 source changes."

          else

            git commit \
              -m "Add direct Android Auto app selector"

            git push

          fi

      # ============================================================
      # COMPLETE
      # ============================================================

      - name: Complete
        shell: bash
        run: |
          echo
          echo "================================================"
          echo " CAR ASSISTANT V10.4 V4 COMPLETE"
          echo "================================================"
          echo
          echo "PHONE:"
          echo "  Femto dashboard preserved"
          echo
          echo "ANDROID AUTO:"
          echo "  Dashboard"
          echo "      -> APPS"
          echo "      -> APPLICATIONS"
          echo "      -> Select app"
          echo "      -> Projection"
          echo
          echo "ACTIVE PROJECTION:"
          echo "  APPS"
          echo "      -> Applications"
          echo "      -> Select another app"
          echo "      -> New projection"
          echo
          echo "PROJECTION ENGINE:"
          echo "  V10.4 V3 engine preserved"
          echo
          echo "ROOT INPUT:"
          echo "  Preserved"
          echo
          echo "GEARHEAD UI INJECTION:"
          echo "  Not used"
          echo
          echo "================================================"
