name: Build Car Assistant V10.4 - V4 Car App Selector

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-disabled: true

      # ============================================================
      # VERIFY V10.4 V3 BASE
      # ============================================================

      - name: Verify V10.4 V3 base
        shell: bash
        run: |
          set -euo pipefail

          ROOT="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          echo "========================================"
          echo " VERIFY V10.4 V3 BASE"
          echo "========================================"

          test -d "v10-source"

          test -f "$ROOT/V10CarActivity.java"
          test -f "$ROOT/V10LauncherActivity.java"
          test -f "$ROOT/V10ProjectionSession.java"
          test -f "$ROOT/V10InputController.java"
          test -f "$ROOT/V10SessionStore.java"
          test -f "$ROOT/V10ControlReceiver.java"
          test -f "$ROOT/RootShellSession.java"
          test -f "$ROOT/V10Display.java"

          echo "V10.4 V3 BASE OK"

      # ============================================================
      # BACKUP CAR ACTIVITY
      # ============================================================

      - name: Backup V10CarActivity
        shell: bash
        run: |
          set -euo pipefail

          cp \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java \
            /tmp/V10CarActivity.java.before-v4

          echo "Backup created."

      # ============================================================
      # PATCH V10 CAR ACTIVITY
      #
      # IMPORTANT:
      # Do NOT depend on exact Java whitespace.
      #
      # We locate each method by signature and replace the
      # complete balanced-brace method body.
      # ============================================================

      - name: Patch V10CarActivity for direct Android Auto App Selector
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          source = path.read_text(encoding="utf-8")

          def replace_method(source, signature, replacement):
              """
              Replace one Java method by locating its signature,
              finding its opening '{', then matching balanced braces.

              This intentionally ignores whitespace/indentation so
              future formatting changes do not break the workflow.
              """

              start = source.find(signature)

              if start < 0:
                  raise RuntimeError(
                      "Method signature not found: " + signature
                  )

              brace = source.find("{", start)

              if brace < 0:
                  raise RuntimeError(
                      "Opening brace not found for: " + signature
                  )

              depth = 0
              end = None

              for i in range(brace, len(source)):
                  char = source[i]

                  if char == "{":
                      depth += 1

                  elif char == "}":
                      depth -= 1

                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise RuntimeError(
                      "Balanced closing brace not found for: "
                      + signature
                  )

              return (
                  source[:start]
                  + replacement.rstrip()
                  + source[end:]
              )

          # ========================================================
          # 1. showApps()
          # ========================================================

          show_apps = r'''
          private void showApps() {

              /*
               * V10.4 V4
               *
               * APPS is a real Android Auto-side application
               * selector.
               *
               * It works from:
               *
               * 1. Dashboard
               * 2. Active projection
               *
               * Therefore the launcher layer is explicitly
               * restored before displaying Applications.
               */

              if (launcherLayer == null
                      || appPanel == null
                      || dashboard == null) {

                  return;
              }

              /*
               * Hide the projected application while the
               * application selector is visible.
               *
               * The projection session itself is intentionally
               * kept alive. If another application is selected,
               * V10ProjectionSession.setTarget() will detect the
               * changed target and recreate the display.
               */
              projectionLayer.setVisibility(
                      View.GONE);

              launcherLayer.setVisibility(
                      View.VISIBLE);

              dashboard.setVisibility(
                      View.GONE);

              appPanel.setVisibility(
                      View.VISIBLE);

              loadApps();
          }
          '''

          source = replace_method(
              source,
              "private void showApps()",
              show_apps
          )

          # ========================================================
          # 2. hideApps()
          # ========================================================

          hide_apps = r'''
          private void hideApps() {

              if (appPanel == null
                      || dashboard == null
                      || launcherLayer == null) {

                  return;
              }

              appPanel.setVisibility(
                      View.GONE);

              dashboard.setVisibility(
                      View.VISIBLE);

              launcherLayer.setVisibility(
                      View.VISIBLE);

              /*
               * The Applications screen belongs to the
               * V10 dashboard.
               *
               * Projection is hidden until an application
               * is selected again.
               */
              projectionLayer.setVisibility(
                      View.GONE);
          }
          '''

          source = replace_method(
              source,
              "private void hideApps()",
              hide_apps
          )

          # ========================================================
          # 3. launchProjection()
          # ========================================================

          launch_projection = r'''
          private void launchProjection(
                  ComponentName component) {

              if (component == null
                      || session == null) {

                  return;
              }

              /*
               * If the user selects another application while
               * an application is already projected, release
               * the old display first.
               *
               * V10ProjectionSession itself also handles target
               * changes safely.
               */
              if (activeTarget != null
                      && !activeTarget.equals(component)) {

                  session.release();
              }

              activeTarget =
                      component;

              /*
               * Keep the existing V10 session persistence.
               */
              V10SessionStore
                      .setTarget(
                              this,
                              component);

              /*
               * Hide the complete launcher UI.
               */
              launcherLayer
                      .setVisibility(
                              View.GONE);

              appPanel
                      .setVisibility(
                              View.GONE);

              dashboard
                      .setVisibility(
                              View.GONE);

              projectionLayer
                      .setVisibility(
                              View.VISIBLE);

              /*
               * Start the existing proven V10 projection
               * engine.
               */
              session.setTarget(
                      component);
          }
          '''

          source = replace_method(
              source,
              "private void launchProjection(",
              launch_projection
          )

          path.write_text(
              source,
              encoding="utf-8"
          )

          print("========================================")
          print(" V10CarActivity V4 PATCH SUCCESS")
          print("========================================")
          print("showApps()             -> replaced")
          print("hideApps()             -> replaced")
          print("launchProjection()     -> replaced")
          print("Patch method uses balanced Java braces.")
          PY

      # ============================================================
      # VERIFY PATCH RESULT
      # ============================================================

      - name: Verify direct Android Auto selector
        shell: bash
        run: |
          set -euo pipefail

          CAR="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          echo "========================================"
          echo " VERIFY DIRECT CAR APP SELECTOR"
          echo "========================================"

          grep -q "private void showApps()" "$CAR"
          grep -q "private void hideApps()" "$CAR"
          grep -q "private void launchProjection(" "$CAR"

          grep -q "APPLICATIONS" "$CAR"

          grep -q "ACTION_MAIN" "$CAR"
          grep -q "CATEGORY_LAUNCHER" "$CAR"

          grep -q "projectionLayer" "$CAR"
          grep -q "launcherLayer" "$CAR"

          grep -q "loadApps()" "$CAR"

          grep -q "V10SessionStore" "$CAR"

          echo "DIRECT CAR APP SELECTOR OK"

      # ============================================================
      # VERIFY APPS BUTTON
      # ============================================================

      - name: Verify APPS button
        shell: bash
        run: |
          set -euo pipefail

          CAR="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          echo "========================================"
          echo " VERIFY APPS BUTTON"
          echo "========================================"

          grep -q 'buttonText("APPS")' "$CAR"

          grep -q "v -> showApps()" "$CAR"

          echo "APPS BUTTON OK"

      # ============================================================
      # VERIFY APPLICATION GRID
      # ============================================================

      - name: Verify application grid
        shell: bash
        run: |
          set -euo pipefail

          CAR="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          echo "========================================"
          echo " VERIFY APPLICATION GRID"
          echo "========================================"

          grep -q "GridLayout" "$CAR"
          grep -q "setColumnCount(4)" "$CAR"
          grep -q "appTile" "$CAR"
          grep -q "tile.setOnClickListener" "$CAR"

          echo "APPLICATION GRID OK"

      # ============================================================
      # VERIFY APP TILE -> PROJECTION
      # ============================================================

      - name: Verify app tile launches projection
        shell: bash
        run: |
          set -euo pipefail

          CAR="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          echo "========================================"
          echo " VERIFY APP TILE -> PROJECTION"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          s = p.read_text(encoding="utf-8")

          required = [
              "tile.setOnClickListener",
              "launchProjection(",
              "app.component",
          ]

          for item in required:
              if item not in s:
                  raise SystemExit(
                      "Missing required app selection code: "
                      + item
                  )

          print("APP TILE -> PROJECTION FLOW OK")
          PY

      # ============================================================
      # VERIFY CONTROL METHODS
      # ============================================================

      - name: Verify Android Auto control methods
        shell: bash
        run: |
          set -euo pipefail

          CAR="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          echo "========================================"
          echo " VERIFY CONTROL METHODS"
          echo "========================================"

          grep -q "handleControlBack" "$CAR"
          grep -q "handleControlHome" "$CAR"
          grep -q "handleControlRecents" "$CAR"
          grep -q "handleControlApps" "$CAR"

          echo "CONTROL METHODS OK"

      # ============================================================
      # VERIFY CONTROL RECEIVER
      # ============================================================

      - name: Verify Android Auto control receiver
        shell: bash
        run: |
          set -euo pipefail

          RECEIVER="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ControlReceiver.java"

          echo "========================================"
          echo " VERIFY CONTROL RECEIVER"
          echo "========================================"

          test -f "$RECEIVER"

          grep -q "handleControlBack" "$RECEIVER"
          grep -q "handleControlHome" "$RECEIVER"
          grep -q "handleControlRecents" "$RECEIVER"
          grep -q "handleControlApps" "$RECEIVER"

          echo "CONTROL RECEIVER OK"

      # ============================================================
      # VERIFY PROJECTION ENGINE
      #
      # DO NOT MODIFY THIS ENGINE.
      # ============================================================

      - name: Verify existing V10 projection engine
        shell: bash
        run: |
          set -euo pipefail

          SESSION="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
          INPUT="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10InputController.java"
          SHELL="v10-source/app/src/main/java/com/hieptran/aacast/doudou/RootShellSession.java"

          echo "========================================"
          echo " VERIFY V10 PROJECTION ENGINE"
          echo "========================================"

          test -f "$SESSION"
          test -f "$INPUT"
          test -f "$SHELL"

          echo
          echo "--- VirtualDisplay ---"

          grep -q "createVirtualDisplay" "$SESSION"
          grep -q "setDefaultBufferSize" "$SESSION"
          grep -q "V10Display.nameFor" "$SESSION"

          echo "VirtualDisplay OK"

          echo
          echo "--- Display launch ---"

          grep -q "am start" "$SESSION"
          grep -q -- "--display" "$SESSION"
          grep -q -- "--windowingMode" "$SESSION"
          grep -q -- "--user" "$SESSION"

          echo "Display launch OK"

          echo
          echo "--- Input ---"

          grep -q "session" "$INPUT"
          grep -q "tap" "$INPUT"
          grep -q "swipe" "$INPUT"

          echo "Input controller OK"

          echo
          echo "--- Root shell ---"

          grep -q 'ProcessBuilder("su")' "$SHELL"

          echo "RootShell OK"

      # ============================================================
      # VERIFY DISPLAY IDENTITY
      # ============================================================

      - name: Verify V10 display identity
        shell: bash
        run: |
          set -euo pipefail

          DISPLAY="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10Display.java"

          echo "========================================"
          echo " VERIFY V10 DISPLAY IDENTITY"
          echo "========================================"

          grep -q "com.carassistant.v10" "$DISPLAY"
          grep -q "Car Assistant V10" "$DISPLAY"
          grep -q "type != 5" "$DISPLAY"

          echo "V10 DISPLAY IDENTITY OK"

      # ============================================================
      # VERIFY SESSION STORE
      # ============================================================

      - name: Verify V10 session store
        shell: bash
        run: |
          set -euo pipefail

          STORE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java"

          echo "========================================"
          echo " VERIFY SESSION STORE"
          echo "========================================"

          test -f "$STORE"

          grep -q "setTarget" "$STORE"
          grep -q "getTarget" "$STORE"
          grep -q "clearTarget" "$STORE"
          grep -q "setCurrentActivity" "$STORE"

          echo "SESSION STORE OK"

      # ============================================================
      # VERIFY NO GEARHEAD CONTROL BAR
      # ============================================================

      - name: Verify no GearheadControlBar dependency
        shell: bash
        run: |
          set -euo pipefail

          JAVA="v10-source/app/src/main/java"

          echo "========================================"
          echo " VERIFY NO GEARHEAD CONTROL BAR"
          echo "========================================"

          if grep -R \
            "GearheadControlBar" \
            "$JAVA" \
            --include="*.java"; then

            echo
            echo "ERROR: GearheadControlBar dependency found."
            exit 1
          fi

          echo "NO GEARHEAD CONTROL BAR OK"

      # ============================================================
      # VERIFY ANDROID 12 COMPATIBILITY
      # ============================================================

      - name: Verify Android 12 compatibility
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="v10-source/app/build.gradle"

          echo "========================================"
          echo " VERIFY ANDROID 12 COMPATIBILITY"
          echo "========================================"

          grep -q "compileSdk" "$GRADLE"
          grep -q "minSdk" "$GRADLE"

          echo "SDK declarations found."

          python3 <<'PY'
          import re
          from pathlib import Path

          p = Path(
              "v10-source/app/build.gradle"
          )

          s = p.read_text(
              encoding="utf-8"
          )

          match = re.search(
              r'minSdk(?:Version)?\s*[= ]\s*(\d+)',
              s
          )

          if match:
              value = int(match.group(1))

              print(
                  f"Detected minSdk: {value}"
              )

              if value > 31:
                  raise SystemExit(
                      "ERROR: minSdk is above Android 12."
                  )
          else:
              print(
                  "minSdk numeric value could not be "
                  "parsed directly; build will verify SDK."
              )

          print(
              "Android 12 compatibility check passed."
          )
          PY

      # ============================================================
      # VERIFY PACKAGE
      # ============================================================

      - name: Verify V10 package
        shell: bash
        run: |
          set -euo pipefail

          JAVA="v10-source/app/src/main/java"

          echo "========================================"
          echo " VERIFY V10 PACKAGE"
          echo "========================================"

          if grep -R \
            "package com.carassistant.v9" \
            "$JAVA" \
            --include="*.java"; then

            echo
            echo "ERROR: V9 package remains in Java source."
            exit 1
          fi

          if ! grep -R \
            "package com.carassistant.v10" \
            "$JAVA" \
            --include="*.java" \
            >/dev/null; then

            echo
            echo "ERROR: V10 package not found."
            exit 1
          fi

          echo "V10 PACKAGE OK"

      # ============================================================
      # JAVA SOURCE SANITY CHECK
      # ============================================================

      - name: Java source sanity check
        shell: bash
        run: |
          set -euo pipefail

          CAR="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          echo "========================================"
          echo " JAVA SOURCE SANITY CHECK"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          s = p.read_text(
              encoding="utf-8"
          )

          methods = [
              "showApps()",
              "hideApps()",
              "launchProjection(",
              "handleControlBack()",
              "handleControlHome()",
              "handleControlRecents()",
              "handleControlApps()",
          ]

          for method in methods:
              if method not in s:
                  raise SystemExit(
                      "Missing method: " + method
                  )

          print(
              "V10CarActivity source sanity check passed."
          )
          PY

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build Car Assistant V10.4 V4
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "========================================"
          echo " BUILD CAR ASSISTANT V10.4 V4"
          echo "========================================"
          echo

          ./gradlew \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "========================================"
          echo " VERIFY APK"
          echo "========================================"

          test -f "$APK"

          echo
          echo "APK:"
          ls -lh "$APK"

          echo
          echo "SHA256:"
          sha256sum "$APK"

          echo
          echo "APK VERIFICATION PASSED"

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload V10.4 V4 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10.4-Femto-Launcher-V4-Car-App-Selector
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # COMMIT SOURCE
      # ============================================================

      - name: Commit V10.4 V4 source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

          if git diff --cached --quiet; then

            echo "No V10.4 V4 source changes."

          else

            git commit \
              -m "Add direct Android Auto app selector"

            git push

          fi

      # ============================================================
      # COMPLETE
      # ============================================================

      - name: Complete
        shell: bash
        run: |
          echo
          echo "================================================"
          echo " CAR ASSISTANT V10.4 V4 COMPLETE"
          echo "================================================"
          echo
          echo "PHONE:"
          echo "  Femto dashboard preserved"
          echo
          echo "ANDROID AUTO:"
          echo "  Dashboard"
          echo "      -> APPS"
          echo "      -> APPLICATIONS"
          echo "      -> Select app"
          echo "      -> Projection"
          echo
          echo "ACTIVE PROJECTION:"
          echo "  APPS"
          echo "      -> Applications"
          echo "      -> Select another app"
          echo "      -> New projection"
          echo
          echo "PROJECTION ENGINE:"
          echo "  V10.4 V3 engine preserved"
          echo
          echo "ROOT INPUT:"
          echo "  Preserved"
          echo
          echo "GEARHEAD UI INJECTION:"
          echo "  Not used"
          echo
          echo "================================================"
