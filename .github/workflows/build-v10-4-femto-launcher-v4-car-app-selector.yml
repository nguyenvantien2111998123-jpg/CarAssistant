name: Build Car Assistant V10.4 - V4.1 Persistent Control Bar

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build V10.4 V4.1
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # JDK
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # ============================================================
      # VERIFY BASE
      # ============================================================

      - name: Verify V10.4 V4 base
        shell: bash
        run: |
          set -euo pipefail

          JAVA=\
          v10-source/app/src/main/java/com/hieptran/aacast/doudou

          test -f "$JAVA/V10CarActivity.java"
          test -f "$JAVA/V10ProjectionSession.java"
          test -f "$JAVA/V10InputController.java"
          test -f "$JAVA/V10SessionStore.java"
          test -f "$JAVA/V10ControlReceiver.java"
          test -f "$JAVA/V10Display.java"
          test -f "$JAVA/RootShellSession.java"

          echo "V10.4 V4 BASE OK"

      # ============================================================
      # BACKUP
      # ============================================================

      - name: Backup V10CarActivity
        shell: bash
        run: |
          set -euo pipefail

          cp \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java \
            /tmp/V10CarActivity.v4.1.backup

      # ============================================================
      # PATCH V10CarActivity
      # ============================================================

      - name: Patch V10CarActivity V4.1
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          source = path.read_text()

          # ========================================================
          # METHOD FINDER
          #
          # Finds a Java method by its declaration name and replaces
          # the complete method using balanced braces.
          #
          # This deliberately does NOT depend on formatting.
          # ========================================================

          def find_method_start(text, method_name):
              candidates = [
                  "private void " + method_name + "(",
                  "public void " + method_name + "(",
                  "protected void " + method_name + "(",
              ]

              positions = []

              for candidate in candidates:
                  pos = text.find(candidate)
                  if pos >= 0:
                      positions.append(pos)

              if not positions:
                  raise SystemExit(
                      "Method not found: " + method_name
                  )

              return min(positions)

          def replace_method(text, method_name, replacement):
              start = find_method_start(
                  text,
                  method_name
              )

              brace = text.find("{", start)

              if brace < 0:
                  raise SystemExit(
                      "Opening brace not found: "
                      + method_name
                  )

              depth = 0
              in_string = False
              in_char = False
              escape = False
              line_comment = False
              block_comment = False

              end = None
              i = brace

              while i < len(text):

                  ch = text[i]

                  if line_comment:
                      if ch == "\n":
                          line_comment = False
                      i += 1
                      continue

                  if block_comment:
                      if ch == "*" and i + 1 < len(text):
                          if text[i + 1] == "/":
                              block_comment = False
                              i += 2
                              continue

                      i += 1
                      continue

                  if in_string:
                      if escape:
                          escape = False
                      elif ch == "\\":
                          escape = True
                      elif ch == '"':
                          in_string = False

                      i += 1
                      continue

                  if in_char:
                      if escape:
                          escape = False
                      elif ch == "\\":
                          escape = True
                      elif ch == "'":
                          in_char = False

                      i += 1
                      continue

                  if ch == "/" and i + 1 < len(text):

                      if text[i + 1] == "/":
                          line_comment = True
                          i += 2
                          continue

                      if text[i + 1] == "*":
                          block_comment = True
                          i += 2
                          continue

                  if ch == '"':
                      in_string = True
                      i += 1
                      continue

                  if ch == "'":
                      in_char = True
                      i += 1
                      continue

                  if ch == "{":
                      depth += 1

                  elif ch == "}":
                      depth -= 1

                      if depth == 0:
                          end = i + 1
                          break

                  i += 1

              if end is None:
                  raise SystemExit(
                      "Could not find end of method: "
                      + method_name
                  )

              return (
                  text[:start]
                  + replacement.rstrip()
                  + "\n"
                  + text[end:]
              )

          # ========================================================
          # 1. ADD CONTROL BAR FIELD
          # ========================================================

          if "private LinearLayout controlBar;" not in source:

              marker = """    private LinearLayout dock;
          """

              if marker not in source:
                  raise SystemExit(
                      "Cannot find dock field"
                  )

              source = source.replace(
                  marker,
                  """    private LinearLayout dock;
              private LinearLayout controlBar;
          """,
                  1
              )

          # ========================================================
          # 2. PATCH buildUi()
          #
          # Control bar is created AFTER launcher/projection layers.
          # FrameLayout draws later children on top.
          # ========================================================

          build_ui = r'''    private void buildUi() {

              root =
                      new FrameLayout(this);

              root.setBackgroundColor(
                      Color.rgb(
                              7,
                              9,
                              12));

              projectionLayer =
                      new FrameLayout(this);

              projectionLayer.setVisibility(
                      View.GONE);

              root.addView(
                      projectionLayer,
                      new FrameLayout.LayoutParams(
                              -1,
                              -1));

              launcherLayer =
                      new LinearLayout(this);

              launcherLayer.setOrientation(
                      LinearLayout.VERTICAL);

              launcherLayer.setPadding(
                      dp(18),
                      dp(12),
                      dp(18),
                      dp(8));

              root.addView(
                      launcherLayer,
                      new FrameLayout.LayoutParams(
                              -1,
                              -1));

              buildDashboard();

              buildAppPanel();

              /*
               * IMPORTANT:
               *
               * The control bar is added LAST.
               *
               * Therefore it remains above both:
               *
               * projectionLayer
               * launcherLayer
               */
              buildPersistentControlBar();

              setContentView(root);
          }
          '''

          source = replace_method(
              source,
              "buildUi",
              build_ui
          )

          # ========================================================
          # 3. INSERT PERSISTENT CONTROL BAR
          # ========================================================

          if "private void buildPersistentControlBar()" in source:
              raise SystemExit(
                  "Control bar already exists unexpectedly"
              )

          marker = "    private void buildDashboard()"

          if marker not in source:
              raise SystemExit(
                  "Cannot find buildDashboard()"
              )

          control_bar = r'''    private void buildPersistentControlBar() {

              controlBar =
                      new LinearLayout(this);

              controlBar.setOrientation(
                      LinearLayout.HORIZONTAL);

              controlBar.setGravity(
                      Gravity.CENTER);

              controlBar.setPadding(
                      dp(8),
                      dp(5),
                      dp(8),
                      dp(5));

              GradientDrawable background =
                      new GradientDrawable();

              background.setColor(
                      Color.rgb(
                              15,
                              18,
                              22));

              background.setCornerRadius(
                      dp(18));

              controlBar.setBackground(
                      background);

              TextView back =
                      buttonText("BACK");

              back.setOnClickListener(
                      v -> handleControlBack());

              controlBar.addView(
                      back,
                      new LinearLayout.LayoutParams(
                              0,
                              -1,
                              1f));

              TextView home =
                      buttonText("HOME");

              home.setOnClickListener(
                      v -> handleControlHome());

              LinearLayout.LayoutParams
                      homeParams =
                              new LinearLayout.LayoutParams(
                                      0,
                                      -1,
                                      1f);

              homeParams.setMargins(
                      dp(6),
                      0,
                      dp(6),
                      0);

              controlBar.addView(
                      home,
                      homeParams);

              TextView apps =
                      buttonText("APPS");

              apps.setOnClickListener(
                      v -> handleControlApps());

              controlBar.addView(
                      apps,
                      new LinearLayout.LayoutParams(
                              0,
                              -1,
                              1f));

              FrameLayout.LayoutParams
                      barParams =
                              new FrameLayout.LayoutParams(
                                      -1,
                                      dp(64),
                                      Gravity.BOTTOM);

              barParams.setMargins(
                      dp(12),
                      0,
                      dp(12),
                      dp(8));

              root.addView(
                      controlBar,
                      barParams);
          }

          '''

          source = source.replace(
              marker,
              control_bar + marker,
              1
          )

          # ========================================================
          # 4. PATCH launchProjection()
          #
          # Control bar is NEVER hidden.
          # ========================================================

          launch_projection = r'''    private void launchProjection(
              ComponentName component) {

              if (component == null
                      || session == null) {

                  return;
              }

              if (activeTarget != null
                      && !activeTarget.equals(component)) {

                  session.release();
              }

              activeTarget =
                      component;

              V10SessionStore
                      .setTarget(
                              this,
                              component);

              launcherLayer
                      .setVisibility(
                              View.GONE);

              appPanel
                      .setVisibility(
                              View.GONE);

              dashboard
                      .setVisibility(
                              View.GONE);

              projectionLayer
                      .setVisibility(
                              View.VISIBLE);

              /*
               * NEVER hide controlBar.
               *
               * BACK / HOME / APPS must remain
               * available while an application
               * is projected.
               */
              if (controlBar != null) {
                  controlBar.setVisibility(
                          View.VISIBLE);
              }

              session.setTarget(
                      component);
          }
          '''

          source = replace_method(
              source,
              "launchProjection",
              launch_projection
          )

          # ========================================================
          # 5. PATCH returnToLauncher()
          # ========================================================

          return_launcher = r'''    private void returnToLauncher() {

              activeTarget = null;

              V10SessionStore
                      .clearTarget(this);

              if (session != null) {
                  session.release();
              }

              projectionLayer
                      .setVisibility(
                              View.GONE);

              launcherLayer
                      .setVisibility(
                              View.VISIBLE);

              dashboard
                      .setVisibility(
                              View.VISIBLE);

              appPanel
                      .setVisibility(
                              View.GONE);

              if (controlBar != null) {
                  controlBar.setVisibility(
                          View.VISIBLE);
              }
          }
          '''

          source = replace_method(
              source,
              "returnToLauncher",
              return_launcher
          )

          # ========================================================
          # 6. PATCH showApps()
          #
          # Works from both dashboard and projection.
          # ========================================================

          show_apps = r'''    private void showApps() {

              if (launcherLayer == null
                      || appPanel == null
                      || dashboard == null) {

                  return;
              }

              projectionLayer
                      .setVisibility(
                              View.GONE);

              launcherLayer
                      .setVisibility(
                              View.VISIBLE);

              dashboard
                      .setVisibility(
                              View.GONE);

              appPanel
                      .setVisibility(
                              View.VISIBLE);

              if (controlBar != null) {
                  controlBar.setVisibility(
                          View.VISIBLE);
              }

              loadApps();
          }
          '''

          source = replace_method(
              source,
              "showApps",
              show_apps
          )

          # ========================================================
          # 7. PATCH hideApps()
          # ========================================================

          hide_apps = r'''    private void hideApps() {

              if (appPanel == null
                      || dashboard == null
                      || launcherLayer == null) {

                  return;
              }

              appPanel
                      .setVisibility(
                              View.GONE);

              dashboard
                      .setVisibility(
                              View.VISIBLE);

              launcherLayer
                      .setVisibility(
                              View.VISIBLE);

              projectionLayer
                      .setVisibility(
                              View.GONE);

              if (controlBar != null) {
                  controlBar.setVisibility(
                          View.VISIBLE);
              }
          }
          '''

          source = replace_method(
              source,
              "hideApps",
              hide_apps
          )

          # ========================================================
          # 8. CLEANUP
          # ========================================================

          if "controlBar = null;" not in source:

              marker = """        dock = null;
          """

              if marker not in source:
                  raise SystemExit(
                      "Cannot find onDestroy dock cleanup"
                  )

              source = source.replace(
                  marker,
                  """        dock = null;
                  controlBar = null;
          """,
                  1
              )

          path.write_text(source)

          print(
              "V10CarActivity V4.1 patch completed."
          )
          PY

      # ============================================================
      # VERIFY SOURCE PATCH
      # ============================================================

      - name: Verify V4.1 source
        shell: bash
        run: |
          set -euo pipefail

          FILE=\
          v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

          echo "=== VERIFY CONTROL BAR ==="

          grep -q \
            "private LinearLayout controlBar;" \
            "$FILE"

          grep -q \
            "buildPersistentControlBar()" \
            "$FILE"

          grep -q \
            'buttonText("BACK")' \
            "$FILE"

          grep -q \
            'buttonText("HOME")' \
            "$FILE"

          grep -q \
            'buttonText("APPS")' \
            "$FILE"

          echo "CONTROL BAR OK"

          echo "=== VERIFY CONTROL HANDLERS ==="

          grep -q \
            "handleControlBack()" \
            "$FILE"

          grep -q \
            "handleControlHome()" \
            "$FILE"

          grep -q \
            "handleControlApps()" \
            "$FILE"

          echo "CONTROL HANDLERS OK"

          echo "=== VERIFY APP SELECTOR ==="

          grep -q \
            "APPLICATIONS" \
            "$FILE"

          grep -q \
            "ACTION_MAIN" \
            "$FILE"

          grep -q \
            "CATEGORY_LAUNCHER" \
            "$FILE"

          grep -q \
            "launchProjection" \
            "$FILE"

          echo "APP SELECTOR OK"

      # ============================================================
      # VERIFY PROJECTION ENGINE
      # ============================================================

      - name: Verify V10 projection engine
        shell: bash
        run: |
          set -euo pipefail

          FILE=\
          v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java

          grep -q \
            "createVirtualDisplay" \
            "$FILE"

          grep -q \
            "setDefaultBufferSize" \
            "$FILE"

          grep -q \
            "V10Display.nameFor" \
            "$FILE"

          grep -q \
            "/system/bin/am start" \
            "$FILE"

          grep -q \
            "--display" \
            "$FILE"

          grep -q \
            "--windowingMode 1" \
            "$FILE"

          echo "PROJECTION ENGINE OK"

      # ============================================================
      # VERIFY INPUT
      # ============================================================

      - name: Verify input controller
        shell: bash
        run: |
          set -euo pipefail

          FILE=\
          v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10InputController.java

          grep -q \
            "input touchscreen" \
            "$FILE"

          grep -q \
            "swipe" \
            "$FILE"

          grep -q \
            "keyevent 4" \
            "$FILE"

          echo "INPUT CONTROLLER OK"

      # ============================================================
      # VERIFY ROOT
      # ============================================================

      - name: Verify root shell
        shell: bash
        run: |
          set -euo pipefail

          FILE=\
          v10-source/app/src/main/java/com/hieptran/aacast/doudou/RootShellSession.java

          grep -q \
            'ProcessBuilder("su")' \
            "$FILE"

          echo "ROOT SHELL OK"

      # ============================================================
      # VERIFY DISPLAY
      # ============================================================

      - name: Verify V10 display identity
        shell: bash
        run: |
          set -euo pipefail

          FILE=\
          v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10Display.java

          grep -q \
            'com.carassistant.v10' \
            "$FILE"

          grep -q \
            'Car Assistant V10' \
            "$FILE"

          grep -q \
            'type != 5' \
            "$FILE"

          echo "DISPLAY IDENTITY OK"

      # ============================================================
      # VERIFY CONTROL RECEIVER
      # ============================================================

      - name: Verify control receiver
        shell: bash
        run: |
          set -euo pipefail

          FILE=\
          v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ControlReceiver.java

          grep -q \
            'com.carassistant.v10.CONTROL' \
            "$FILE"

          grep -q \
            'handleControlBack' \
            "$FILE"

          grep -q \
            'handleControlHome' \
            "$FILE"

          grep -q \
            'handleControlApps' \
            "$FILE"

          echo "CONTROL RECEIVER OK"

      # ============================================================
      # VERIFY NO GEARHEAD
      # ============================================================

      - name: Verify architecture
        shell: bash
        run: |
          set -euo pipefail

          if grep -R \
            "GearheadControlBar" \
            v10-source/app/src/main/java \
            >/dev/null 2>&1; then

            echo "ERROR: GearheadControlBar still exists."

            exit 1
          fi

          if grep -R \
            "com.carassistant.v9" \
            v10-source/app/src/main/java \
            >/dev/null 2>&1; then

            echo "ERROR: V9 package reference remains."

            exit 1
          fi

          echo "ARCHITECTURE OK"

      # ============================================================
      # JAVA BRACE CHECK
      # ============================================================

      - name: Java source sanity
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          text = path.read_text()

          depth = 0
          in_string = False
          in_char = False
          escape = False
          line_comment = False
          block_comment = False

          i = 0

          while i < len(text):

              ch = text[i]

              if line_comment:
                  if ch == "\n":
                      line_comment = False
                  i += 1
                  continue

              if block_comment:
                  if ch == "*" and i + 1 < len(text):
                      if text[i + 1] == "/":
                          block_comment = False
                          i += 2
                          continue

                  i += 1
                  continue

              if in_string:

                  if escape:
                      escape = False

                  elif ch == "\\":
                      escape = True

                  elif ch == '"':
                      in_string = False

                  i += 1
                  continue

              if in_char:

                  if escape:
                      escape = False

                  elif ch == "\\":
                      escape = True

                  elif ch == "'":
                      in_char = False

                  i += 1
                  continue

              if ch == "/" and i + 1 < len(text):

                  if text[i + 1] == "/":
                      line_comment = True
                      i += 2
                      continue

                  if text[i + 1] == "*":
                      block_comment = True
                      i += 2
                      continue

              if ch == '"':
                  in_string = True
                  i += 1
                  continue

              if ch == "'":
                  in_char = True
                  i += 1
                  continue

              if ch == "{":
                  depth += 1

              elif ch == "}":
                  depth -= 1

                  if depth < 0:
                      raise SystemExit(
                          "Brace balance became negative"
                      )

              i += 1

          if depth != 0:
              raise SystemExit(
                  f"Brace balance failed: {depth}"
              )

          print(
              "V10CarActivity JAVA BALANCE OK"
          )
          PY

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build V10.4 V4.1
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          APK=\
          app/build/outputs/apk/debug/app-debug.apk

          test -f "$APK"

          echo
          echo "========================================"
          echo " CAR ASSISTANT V10.4 V4.1"
          echo " BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh "$APK"

          echo
          echo "SHA256:"
          sha256sum "$APK"

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload V4.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10.4-Femto-Launcher-V4.1-Control-Bar
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit V4.1 source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

          if git diff --cached --quiet; then

            echo "No V4.1 source changes."

          else

            git commit \
              -m "Restore persistent V10 Android Auto control bar"

            git push

          fi

      # ============================================================
      # COMPLETE
      # ============================================================

      - name: Complete
        shell: bash
        run: |
          echo
          echo "========================================"
          echo " CAR ASSISTANT V10.4 V4.1 COMPLETE"
          echo "========================================"
          echo
          echo "Persistent BACK : OK"
          echo "Persistent HOME : OK"
          echo "Persistent APPS : OK"
          echo "Direct app selector : OK"
          echo "Projection engine : preserved"
          echo "Android 12 : preserved"
          echo
