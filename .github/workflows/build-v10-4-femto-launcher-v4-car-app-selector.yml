name: Build Car Assistant V10.4 - V4.1 Persistent Control Bar

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build V10.4 V4.1
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # ============================================================
      # VERIFY V4 BASE
      # ============================================================

      - name: Verify V4 base
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

          test -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java

          test -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10InputController.java

          test -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java

          test -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ControlReceiver.java

          echo "V10.4 V4 BASE OK"

      # ============================================================
      # BACKUP
      # ============================================================

      - name: Backup V10CarActivity
        shell: bash
        run: |
          set -euo pipefail

          cp \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java \
            /tmp/V10CarActivity.java.v4.1.backup

      # ============================================================
      # PATCH V10CarActivity
      # ============================================================

      - name: Patch V10CarActivity V4.1
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          text = path.read_text()

          # --------------------------------------------------------
          # Add control bar field
          # --------------------------------------------------------

          old_field = """    private LinearLayout dock;
          """

          new_field = """    private LinearLayout dock;
              private LinearLayout controlBar;
          """

          if "private LinearLayout controlBar;" not in text:
              if old_field not in text:
                  raise SystemExit(
                      "Cannot find dock field"
                  )

              text = text.replace(
                  old_field,
                  new_field,
                  1
              )

          # --------------------------------------------------------
          # Helper: replace complete Java method
          # --------------------------------------------------------

          def replace_method(source, signature, replacement):
              start = source.find(signature)

              if start < 0:
                  raise SystemExit(
                      "Method not found: " + signature
                  )

              brace = source.find("{", start)

              if brace < 0:
                  raise SystemExit(
                      "Opening brace not found: " + signature
                  )

              depth = 0
              end = None

              for i in range(brace, len(source)):
                  ch = source[i]

                  if ch == "{":
                      depth += 1

                  elif ch == "}":
                      depth -= 1

                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise SystemExit(
                      "Could not find method end: " + signature
                  )

              return (
                  source[:start]
                  + replacement.rstrip()
                  + "\n"
                  + source[end:]
              )

          # --------------------------------------------------------
          # buildUi()
          #
          # Adds control bar AFTER launcher/projection layers.
          # Because FrameLayout uses later children on top,
          # controlBar remains visible above projection.
          # --------------------------------------------------------

          build_ui = r'''    private void buildUi() {

                  root =
                          new FrameLayout(this);

                  root.setBackgroundColor(
                          Color.rgb(
                                  7,
                                  9,
                                  12));

                  projectionLayer =
                          new FrameLayout(this);

                  projectionLayer.setVisibility(
                          View.GONE);

                  root.addView(
                          projectionLayer,
                          new FrameLayout.LayoutParams(
                                  -1,
                                  -1));

                  launcherLayer =
                          new LinearLayout(this);

                  launcherLayer.setOrientation(
                          LinearLayout.VERTICAL);

                  launcherLayer.setPadding(
                          dp(18),
                          dp(12),
                          dp(18),
                          dp(8));

                  root.addView(
                          launcherLayer,
                          new FrameLayout.LayoutParams(
                                  -1,
                                  -1));

                  buildDashboard();
                  buildAppPanel();

                  buildPersistentControlBar();

                  setContentView(root);
              }

              private void buildPersistentControlBar() {

                  controlBar =
                          new LinearLayout(this);

                  controlBar.setOrientation(
                          LinearLayout.HORIZONTAL);

                  controlBar.setGravity(
                          Gravity.CENTER);

                  controlBar.setPadding(
                          dp(8),
                          dp(5),
                          dp(8),
                          dp(5));

                  GradientDrawable background =
                          new GradientDrawable();

                  background.setColor(
                          Color.rgb(
                                  15,
                                  18,
                                  22));

                  background.setCornerRadius(
                          dp(18));

                  controlBar.setBackground(
                          background);

                  FrameLayout.LayoutParams
                          barParams =
                                  new FrameLayout.LayoutParams(
                                          -1,
                                          dp(64),
                                          Gravity.BOTTOM);

                  barParams.setMargins(
                          dp(12),
                          0,
                          dp(12),
                          dp(8));

                  TextView back =
                          buttonText("BACK");

                  back.setTextSize(13);

                  back.setOnClickListener(
                          v -> handleControlBack());

                  controlBar.addView(
                          back,
                          new LinearLayout.LayoutParams(
                                  0,
                                  -1,
                                  1f));

                  TextView home =
                          buttonText("HOME");

                  home.setTextSize(13);

                  home.setOnClickListener(
                          v -> handleControlHome());

                  LinearLayout.LayoutParams
                          homeParams =
                                  new LinearLayout.LayoutParams(
                                          0,
                                          -1,
                                          1f);

                  homeParams.setMargins(
                          dp(6),
                          0,
                          dp(6),
                          0);

                  controlBar.addView(
                          home,
                          homeParams);

                  TextView apps =
                          buttonText("APPS");

                  apps.setTextSize(13);

                  apps.setOnClickListener(
                          v -> handleControlApps());

                  controlBar.addView(
                          apps,
                          new LinearLayout.LayoutParams(
                                  0,
                                  -1,
                                  1f));

                  root.addView(
                          controlBar,
                          barParams);
              }
          '''

          text = replace_method(
              text,
              "    private void buildUi()",
              build_ui
          )

          # --------------------------------------------------------
          # launchProjection()
          #
          # Keep control bar visible.
          # --------------------------------------------------------

          launch_projection = r'''    private void launchProjection(
                      ComponentName component) {

                  if (component == null
                          || session == null) {

                      return;
                  }

                  if (activeTarget != null
                          && !activeTarget.equals(component)) {

                      session.release();
                  }

                  activeTarget =
                          component;

                  V10SessionStore
                          .setTarget(
                                  this,
                                  component);

                  launcherLayer
                          .setVisibility(
                                  View.GONE);

                  appPanel
                          .setVisibility(
                                  View.GONE);

                  dashboard
                          .setVisibility(
                                  View.GONE);

                  projectionLayer
                          .setVisibility(
                                  View.VISIBLE);

                  /*
                   * controlBar intentionally remains visible.
                   */

                  if (controlBar != null) {
                      controlBar.setVisibility(
                              View.VISIBLE);
                  }

                  session.setTarget(
                          component);
              }
          '''

          text = replace_method(
              text,
              "    private void launchProjection(",
              launch_projection
          )

          # --------------------------------------------------------
          # returnToLauncher()
          # --------------------------------------------------------

          return_launcher = r'''    private void returnToLauncher() {

                  activeTarget = null;

                  V10SessionStore
                          .clearTarget(this);

                  if (session != null) {
                      session.release();
                  }

                  projectionLayer
                          .setVisibility(
                                  View.GONE);

                  launcherLayer
                          .setVisibility(
                                  View.VISIBLE);

                  dashboard
                          .setVisibility(
                                  View.VISIBLE);

                  appPanel
                          .setVisibility(
                                  View.GONE);

                  if (controlBar != null) {
                      controlBar.setVisibility(
                              View.VISIBLE);
                  }
              }
          '''

          text = replace_method(
              text,
              "    private void returnToLauncher()",
              return_launcher
          )

          # --------------------------------------------------------
          # showApps()
          #
          # When APPS is pressed during projection:
          # - projection is hidden
          # - launcher appears
          # - application panel appears
          # - control bar stays visible
          # --------------------------------------------------------

          show_apps = r'''    private void showApps() {

                  if (launcherLayer == null
                          || appPanel == null
                          || dashboard == null) {

                      return;
                  }

                  projectionLayer
                          .setVisibility(
                                  View.GONE);

                  launcherLayer
                          .setVisibility(
                                  View.VISIBLE);

                  dashboard
                          .setVisibility(
                                  View.GONE);

                  appPanel
                          .setVisibility(
                                  View.VISIBLE);

                  if (controlBar != null) {
                      controlBar.setVisibility(
                              View.VISIBLE);
                  }

                  loadApps();
              }
          '''

          text = replace_method(
              text,
              "    private void showApps()",
              show_apps
          )

          # --------------------------------------------------------
          # hideApps()
          # --------------------------------------------------------

          hide_apps = r'''    private void hideApps() {

                  if (appPanel == null
                          || dashboard == null
                          || launcherLayer == null) {

                      return;
                  }

                  appPanel
                          .setVisibility(
                                  View.GONE);

                  dashboard
                          .setVisibility(
                                  View.VISIBLE);

                  launcherLayer
                          .setVisibility(
                                  View.VISIBLE);

                  projectionLayer
                          .setVisibility(
                                  View.GONE);

                  if (controlBar != null) {
                      controlBar.setVisibility(
                              View.VISIBLE);
                  }
              }
          '''

          text = replace_method(
              text,
              "    private void hideApps()",
              hide_apps
          )

          # --------------------------------------------------------
          # onDestroy cleanup
          # --------------------------------------------------------

          old_cleanup = """        dock = null;

                  super.onDestroy();
          """

          new_cleanup = """        dock = null;
                  controlBar = null;

                  super.onDestroy();
          """

          if old_cleanup in text:
              text = text.replace(
                  old_cleanup,
                  new_cleanup,
                  1
              )
          elif "controlBar = null;" not in text:
              raise SystemExit(
                  "Could not patch onDestroy cleanup"
              )

          path.write_text(text)

          print(
              "V10CarActivity V4.1 patched successfully."
          )
          PY

      # ============================================================
      # VERIFY CONTROL BAR
      # ============================================================

      - name: Verify V4.1 control bar
        shell: bash
        run: |
          set -euo pipefail

          FILE=\
          v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

          echo "=== CONTROL BAR ==="

          grep -q \
            "private LinearLayout controlBar" \
            "$FILE"

          grep -q \
            "buildPersistentControlBar" \
            "$FILE"

          grep -q \
            'buttonText("BACK")' \
            "$FILE"

          grep -q \
            'buttonText("HOME")' \
            "$FILE"

          grep -q \
            'buttonText("APPS")' \
            "$FILE"

          grep -q \
            "handleControlBack()" \
            "$FILE"

          grep -q \
            "handleControlHome()" \
            "$FILE"

          grep -q \
            "handleControlApps()" \
            "$FILE"

          echo "CONTROL BAR OK"

      # ============================================================
      # VERIFY DIRECT APP SELECTOR
      # ============================================================

      - name: Verify Android Auto app selector
        shell: bash
        run: |
          set -euo pipefail

          FILE=\
          v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

          grep -q \
            "APPLICATIONS" \
            "$FILE"

          grep -q \
            "ACTION_MAIN" \
            "$FILE"

          grep -q \
            "CATEGORY_LAUNCHER" \
            "$FILE"

          grep -q \
            "launchProjection(" \
            "$FILE"

          grep -q \
            "V10SessionStore" \
            "$FILE"

          echo "DIRECT APP SELECTOR OK"

      # ============================================================
      # VERIFY PROJECTION ENGINE UNTOUCHED
      # ============================================================

      - name: Verify V10 projection engine
        shell: bash
        run: |
          set -euo pipefail

          FILE=\
          v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java

          grep -q \
            "createVirtualDisplay" \
            "$FILE"

          grep -q \
            "setDefaultBufferSize" \
            "$FILE"

          grep -q \
            "V10Display.nameFor" \
            "$FILE"

          grep -q \
            "/system/bin/am start" \
            "$FILE"

          grep -q \
            "--display" \
            "$FILE"

          grep -q \
            "--windowingMode 1" \
            "$FILE"

          echo "PROJECTION ENGINE OK"

      # ============================================================
      # VERIFY ROOT SHELL
      # ============================================================

      - name: Verify root shell
        shell: bash
        run: |
          set -euo pipefail

          FILE=\
          v10-source/app/src/main/java/com/hieptran/aacast/doudou/RootShellSession.java

          grep -q \
            'ProcessBuilder("su")' \
            "$FILE"

          echo "ROOT SHELL OK"

      # ============================================================
      # VERIFY INPUT
      # ============================================================

      - name: Verify input controller
        shell: bash
        run: |
          set -euo pipefail

          FILE=\
          v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10InputController.java

          grep -q \
            "input touchscreen" \
            "$FILE"

          grep -q \
            "swipe" \
            "$FILE"

          grep -q \
            "keyevent 4" \
            "$FILE"

          echo "INPUT CONTROLLER OK"

      # ============================================================
      # VERIFY DISPLAY IDENTITY
      # ============================================================

      - name: Verify V10 display identity
        shell: bash
        run: |
          set -euo pipefail

          FILE=\
          v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10Display.java

          grep -q \
            'com.carassistant.v10' \
            "$FILE"

          grep -q \
            'Car Assistant V10' \
            "$FILE"

          grep -q \
            'type != 5' \
            "$FILE"

          echo "V10 DISPLAY IDENTITY OK"

      # ============================================================
      # VERIFY CONTROL RECEIVER
      # ============================================================

      - name: Verify control receiver
        shell: bash
        run: |
          set -euo pipefail

          FILE=\
          v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ControlReceiver.java

          grep -q \
            'com.carassistant.v10.CONTROL' \
            "$FILE"

          grep -q \
            'handleControlBack' \
            "$FILE"

          grep -q \
            'handleControlHome' \
            "$FILE"

          grep -q \
            'handleControlApps' \
            "$FILE"

          echo "CONTROL RECEIVER OK"

      # ============================================================
      # VERIFY ANDROID 12 / NO GEARHEAD
      # ============================================================

      - name: Verify Android 12 architecture
        shell: bash
        run: |
          set -euo pipefail

          if grep -R \
            "GearheadControlBar" \
            v10-source/app/src/main/java \
            >/dev/null 2>&1; then

            echo "ERROR: GearheadControlBar still exists."
            exit 1
          fi

          if grep -R \
            "com.carassistant.v9" \
            v10-source/app/src/main/java \
            >/dev/null 2>&1; then

            echo "ERROR: V9 package reference remains."
            exit 1
          fi

          echo "ANDROID 12 ARCHITECTURE OK"

      # ============================================================
      # JAVA SANITY
      # ============================================================

      - name: Java source sanity
        shell: bash
        run: |
          set -euo pipefail

          FILE=\
          v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          s = p.read_text()

          depth = 0
          in_string = False
          escape = False
          in_line_comment = False
          in_block_comment = False

          for i, ch in enumerate(s):

              if in_line_comment:
                  if ch == "\n":
                      in_line_comment = False
                  continue

              if in_block_comment:
                  if ch == "*" and i + 1 < len(s) and s[i + 1] == "/":
                      in_block_comment = False
                  continue

              if not in_string and ch == "/" and i + 1 < len(s):
                  if s[i + 1] == "/":
                      in_line_comment = True
                      continue
                  if s[i + 1] == "*":
                      in_block_comment = True
                      continue

              if ch == '"' and not escape:
                  in_string = not in_string

              if in_string:
                  escape = (ch == "\\" and not escape)
                  continue

              escape = False

              if ch == "{":
                  depth += 1
              elif ch == "}":
                  depth -= 1

              if depth < 0:
                  raise SystemExit(
                      "Brace balance became negative"
                  )

          if depth != 0:
              raise SystemExit(
                  f"Brace balance failed: {depth}"
              )

          print("JAVA SOURCE BALANCE OK")
          PY

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build V10.4 V4.1
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          APK=\
          app/build/outputs/apk/debug/app-debug.apk

          test -f "$APK"

          echo
          echo "========================================"
          echo " V10.4 V4.1 BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh "$APK"

          echo
          echo "SHA256:"

          sha256sum "$APK"

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload V4.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10.4-Femto-Launcher-V4.1-Control-Bar
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit V4.1 source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

          if git diff --cached --quiet; then

            echo "No V4.1 source changes."

          else

            git commit \
              -m "Restore persistent V10 Android Auto control bar"

            git push

          fi

      # ============================================================
      # COMPLETE
      # ============================================================

      - name: Complete
        shell: bash
        run: |
          echo
          echo "========================================"
          echo " CAR ASSISTANT V10.4 V4.1 COMPLETE"
          echo "========================================"
          echo
          echo "BACK  : persistent"
          echo "HOME  : persistent"
          echo "APPS  : persistent"
          echo "APP SELECTOR : enabled"
          echo "PROJECTION ENGINE : preserved"
          echo "ANDROID 12 : preserved"
          echo
