name: Navigation V1 Safe - Foundation Locked

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation-v1-safe:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout exact Foundation V1
        uses: actions/checkout@v4
        with:
          ref: 2c814a181d00cde9547a446927ae181e18cb9cbb
          fetch-depth: 1

      - name: Verify Foundation V1 lock
        shell: bash
        run: |
          set -e
          EXPECTED="2c814a181d00cde9547a446927ae181e18cb9cbb"
          ACTUAL="$(git rev-parse HEAD)"
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Verify Foundation source structure
        shell: bash
        run: |
          set -e

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$BASE/V10LauncherActivity.java"
          test -f "$BASE/V10CarActivity.java"

          grep -q '^package com\.carassistant\.v10;' \
            "$BASE/V10LauncherActivity.java"

          grep -q '^package com\.carassistant\.v10;' \
            "$BASE/V10CarActivity.java"

          echo "Foundation source structure PASS"

      - name: Verify NavigationMapView baseline state
        shell: bash
        run: |
          set -e

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          if [ -f "$FILE" ]; then
            echo "NavigationMapView.java already exists in Foundation."
            echo "It will NOT be overwritten."
            exit 0
          fi

          echo "NavigationMapView.java is absent from Foundation V1."
          echo "Navigation V1 will create it explicitly."

      - name: Add MapLibre dependency
        shell: bash
        run: |
          set -e

          FILE="v10-source/app/build.gradle"

          grep -q 'org.maplibre.gl:android-sdk' "$FILE" && {
            echo "MapLibre dependency already present"
            exit 0
          }

          sed -i '/dependencies {/a\
    implementation "org.maplibre.gl:android-sdk:11.11.0"' "$FILE"

          grep -q 'org.maplibre.gl:android-sdk:11.11.0' "$FILE"

          echo "MapLibre dependency PASS"

      - name: Add navigation permissions
        shell: bash
        run: |
          set -e

          FILE="v10-source/app/src/main/AndroidManifest.xml"

          grep -q 'android.permission.ACCESS_FINE_LOCATION' "$FILE" || \
            sed -i '/<manifest /a\
    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' "$FILE"

          grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$FILE" || \
            sed -i '/<manifest /a\
    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' "$FILE"

          grep -q 'android.permission.ACCESS_FINE_LOCATION' "$FILE"
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$FILE"

          echo "Navigation permissions PASS"

      - name: Create NavigationMapView manually
        shell: bash
        run: |
          set -e

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"
          FILE="$BASE/NavigationMapView.java"

          mkdir -p "$BASE"

          if [ -f "$FILE" ]; then
            echo "NavigationMapView.java already exists. Keeping existing file."
            exit 0
          fi

          printf '%s\n' \
            'package com.carassistant.v10;' \
            '' \
            'import android.Manifest;' \
            'import android.content.Context;' \
            'import android.content.pm.PackageManager;' \
            'import android.graphics.Color;' \
            'import android.location.Location;' \
            'import android.os.Bundle;' \
            'import android.view.Gravity;' \
            'import android.widget.FrameLayout;' \
            '' \
            'import androidx.annotation.NonNull;' \
            'import androidx.core.app.ActivityCompat;' \
            'import androidx.core.content.ContextCompat;' \
            '' \
            'import org.maplibre.android.MapLibre;' \
            'import org.maplibre.android.camera.CameraPosition;' \
            'import org.maplibre.android.camera.CameraUpdateFactory;' \
            'import org.maplibre.android.geometry.LatLng;' \
            'import org.maplibre.android.location.LocationComponentActivationOptions;' \
            'import org.maplibre.android.location.LocationComponentOptions;' \
            'import org.maplibre.android.maps.MapView;' \
            'import org.maplibre.android.maps.MapboxMap;' \
            'import org.maplibre.android.maps.Style;' \
            'import org.maplibre.android.maps.UiSettings;' \
            '' \
            'public class NavigationMapView extends FrameLayout {' \
            '' \
            '    private static final int LOCATION_REQUEST = 4101;' \
            '' \
            '    private final MapView mapView;' \
            '    private MapboxMap map;' \
            '    private boolean mapReady = false;' \
            '' \
            '    public NavigationMapView(Context context) {' \
            '        super(context);' \
            '' \
            '        setBackgroundColor(Color.BLACK);' \
            '' \
            '        MapLibre.getInstance(context.getApplicationContext());' \
            '' \
            '        mapView = new MapView(context);' \
            '        mapView.onCreate(new Bundle());' \
            '' \
            '        LayoutParams params = new LayoutParams(' \
            '                LayoutParams.MATCH_PARENT,' \
            '                LayoutParams.MATCH_PARENT);' \
            '' \
            '        addView(mapView, params);' \
            '' \
            '        mapView.getMapAsync(this::onMapReady);' \
            '    }' \
            '' \
            '    private void onMapReady(@NonNull MapboxMap readyMap) {' \
            '        map = readyMap;' \
            '        mapReady = true;' \
            '' \
            '        UiSettings ui = map.getUiSettings();' \
            '        ui.setCompassEnabled(false);' \
            '        ui.setZoomGesturesEnabled(true);' \
            '        ui.setScrollGesturesEnabled(true);' \
            '        ui.setRotateGesturesEnabled(true);' \
            '        ui.setTiltGesturesEnabled(false);' \
            '' \
            '        map.setStyle(' \
            '                "https://tiles.openfreemap.org/styles/liberty", ' \
            '                style -> enableLocation());' \
            '    }' \
            '' \
            '    private void enableLocation() {' \
            '        if (map == null || !mapReady) {' \
            '            return;' \
            '        }' \
            '' \
            '        Context context = getContext();' \
            '' \
            '        if (ContextCompat.checkSelfPermission(' \
            '                context,' \
            '                Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {' \
            '            if (context instanceof V10LauncherActivity) {' \
            '                ActivityCompat.requestPermissions(' \
            '                        (V10LauncherActivity) context,' \
            '                        new String[]{' \
            '                                Manifest.permission.ACCESS_FINE_LOCATION,' \
            '                                Manifest.permission.ACCESS_COARSE_LOCATION},' \
            '                        LOCATION_REQUEST);' \
            '            } else if (context instanceof V10CarActivity) {' \
            '                ActivityCompat.requestPermissions(' \
            '                        (V10CarActivity) context,' \
            '                        new String[]{' \
            '                                Manifest.permission.ACCESS_FINE_LOCATION,' \
            '                                Manifest.permission.ACCESS_COARSE_LOCATION},' \
            '                        LOCATION_REQUEST);' \
            '            }' \
            '            return;' \
            '        }' \
            '' \
            '        LocationComponentOptions options = LocationComponentOptions.builder(context)' \
            '                .pulseEnabled(true)' \
            '                .build();' \
            '' \
            '        LocationComponentActivationOptions activation =' \
            '                LocationComponentActivationOptions.builder(context, map.getStyle())' \
            '                        .locationComponentOptions(options)' \
            '                        .build();' \
            '' \
            '        map.getLocationComponent().activateLocationComponent(activation);' \
            '        map.getLocationComponent().setLocationComponentEnabled(true);' \
            '        map.getLocationComponent().setCameraMode(' \
            '                org.maplibre.android.location.modes.CameraMode.TRACKING);' \
            '    }' \
            '' \
            '    public void zoomIn() {' \
            '        if (map == null) return;' \
            '        double zoom = map.getCameraPosition().zoom;' \
            '        map.animateCamera(CameraUpdateFactory.zoomTo(Math.min(20.0, zoom + 1.0)), 250);' \
            '    }' \
            '' \
            '    public void zoomOut() {' \
            '        if (map == null) return;' \
            '        double zoom = map.getCameraPosition().zoom;' \
            '        map.animateCamera(CameraUpdateFactory.zoomTo(Math.max(1.0, zoom - 1.0)), 250);' \
            '    }' \
            '' \
            '    public void recenter() {' \
            '        if (map == null) return;' \
            '        try {' \
            '            Location location = map.getLocationComponent().getLastKnownLocation();' \
            '            if (location == null) return;' \
            '' \
            '            LatLng target = new LatLng(' \
            '                    location.getLatitude(),' \
            '                    location.getLongitude());' \
            '' \
            '            map.animateCamera(' \
            '                    CameraUpdateFactory.newLatLngZoom(target, 16.0), ' \
            '                    500);' \
            '        } catch (Exception ignored) {' \
            '        }' \
            '    }' \
            '' \
            '    public void onHostResume() {' \
            '        mapView.onResume();' \
            '    }' \
            '' \
            '    public void onHostPause() {' \
            '        mapView.onPause();' \
            '    }' \
            '' \
            '    public void onHostDestroy() {' \
            '        mapView.onDestroy();' \
            '    }' \
            '}' \
            > "$FILE"

          test -f "$FILE"
          grep -q '^package com\.carassistant\.v10;' "$FILE"
          grep -q 'class NavigationMapView' "$FILE"
          grep -q 'MapView' "$FILE"
          grep -q 'MapLibre' "$FILE"

          echo "NavigationMapView.java created successfully"
          echo "Path: $FILE"

      - name: Prepare exact Activity patch script
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/navigation-v1

          printf '%s\n' \
            'from pathlib import Path' \
            '' \
            'BASE = Path("v10-source/app/src/main/java/com/hieptran/aacast/doudou")' \
            '' \
            'OLD = """        LinearLayout content =' \
            '                new LinearLayout(this);' \
            '' \
            '        content.setOrientation(' \
            '                LinearLayout.VERTICAL);' \
            '' \
            '        LinearLayout map =' \
            '                card();' \
            '' \
            '        map.addView(' \
            '                text(' \
            '                        "MAP",' \
            '                        12,' \
            '                        Color.LTGRAY));' \
            '' \
            '        TextView mapText =' \
            '                text(' \
            '                        "Navigation",' \
            '                        28,' \
            '                        Color.WHITE);' \
            '' \
            '        mapText.setGravity(' \
            '                Gravity.CENTER);' \
            '' \
            '        map.addView(' \
            '                mapText,' \
            '                new LinearLayout.LayoutParams(' \
            '                        -1,' \
            '                        0,' \
            '                        1));' \
            '' \
            '        content.addView(' \
            '                map,' \
            '                new LinearLayout.LayoutParams(' \
            '                        -1,' \
            '                        0,' \
            '                        2));"""' \
            '' \
            'NEW = """        LinearLayout content =' \
            '                new LinearLayout(this);' \
            '' \
            '        content.setOrientation(' \
            '                LinearLayout.VERTICAL);' \
            '' \
            '        FrameLayout navigationContainer =' \
            '                new FrameLayout(this);' \
            '' \
            '        NavigationMapView navigationMap =' \
            '                new NavigationMapView(this);' \
            '' \
            '        navigationContainer.addView(' \
            '                navigationMap,' \
            '                new FrameLayout.LayoutParams(' \
            '                        -1,' \
            '                        -1));' \
            '' \
            '        content.addView(' \
            '                navigationContainer,' \
            '                new LinearLayout.LayoutParams(' \
            '                        -1,' \
            '                        0,' \
            '                        2));"""' \
            '' \
            'for name in ["V10LauncherActivity.java", "V10CarActivity.java"]:' \
            '    path = BASE / name' \
            '    text = path.read_text()' \
            '    if "NavigationMapView" in text:' \
            '        print(name + ": NavigationMapView already referenced")' \
            '        continue' \
            '    if OLD not in text:' \
            '        raise SystemExit(name + ": exact Foundation MAP block not found")' \
            '    text = text.replace(OLD, NEW, 1)' \
            '    if "FrameLayout" not in text.split("public class", 1)[0]:' \
            '        text = text.replace("import android.widget.LinearLayout;", "import android.widget.FrameLayout;\\nimport android.widget.LinearLayout;", 1)' \
            '    path.write_text(text)' \
            '    print(name + ": patched")' \
            > /tmp/navigation-v1/patch_activities.py

          python3 /tmp/navigation-v1/patch_activities.py

      - name: Verify Navigation V1 source
        shell: bash
        run: |
          set -e

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$BASE/NavigationMapView.java"

          grep -q 'NavigationMapView' \
            "$BASE/V10LauncherActivity.java"

          grep -q 'NavigationMapView' \
            "$BASE/V10CarActivity.java"

          grep -q 'FrameLayout' \
            "$BASE/V10LauncherActivity.java"

          grep -q 'FrameLayout' \
            "$BASE/V10CarActivity.java"

          echo "Navigation V1 source verification PASS"

      - name: Verify changed files
        shell: bash
        run: |
          set -e

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"
          MAP="$BASE/NavigationMapView.java"

          test -f "$MAP"
          test -f "v10-source/app/build.gradle"
          test -f "v10-source/app/src/main/AndroidManifest.xml"
          test -f "$BASE/V10LauncherActivity.java"
          test -f "$BASE/V10CarActivity.java"

          echo "Required Navigation V1 files exist"

          git status --short

      - name: Git diff check
        shell: bash
        run: |
          set -e
          git diff --check
          echo "git diff --check PASS"

      - name: Compile Navigation V1
        shell: bash
        working-directory: v10-source
        run: |
          set -e
          chmod +x gradlew
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon

      - name: Assemble Navigation V1 APK
        shell: bash
        working-directory: v10-source
        run: |
          set -e
          ./gradlew :app:assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          ls -lh "$APK"
          sha256sum "$APK"

      - name: Save Navigation V1 audit
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/navigation-v1/audit

          git status --short \
            > /tmp/navigation-v1/audit/git-status.txt

          git diff -- \
            v10-source/app/build.gradle \
            v10-source/app/src/main/AndroidManifest.xml \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java \
            > /tmp/navigation-v1/audit/navigation.diff || true

          sha256sum \
            v10-source/app/build/outputs/apk/debug/app-debug.apk \
            > /tmp/navigation-v1/audit/apk-sha256.txt

      - name: Upload Navigation V1 APK
        uses: actions/upload-artifact@v4
        with:
          name: carassistant-navigation-v1-safe
          path: |
            v10-source/app/build/outputs/apk/debug/app-debug.apk
            /tmp/navigation-v1/audit/git-status.txt
            /tmp/navigation-v1/audit/navigation.diff
            /tmp/navigation-v1/audit/apk-sha256.txt
          if-no-files-found: error
