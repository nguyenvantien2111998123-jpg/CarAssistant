name: Build Navigation V1 Safe - Foundation Locked

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-navigation-v1:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout exact Foundation V1
        uses: actions/checkout@v4
        with:
          ref: 2c814a181d00cde9547a446927ae181e18cb9cbb
          fetch-depth: 0

      - name: Verify Foundation V1
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="2c814a181d00cde9547a446927ae181e18cb9cbb"
          ACTUAL="$(git rev-parse HEAD)"

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          test "$ACTUAL" = "$EXPECTED"

          echo "FOUNDATION V1 LOCK: PASS"

      - name: Verify exact source structure
        shell: bash
        run: |
          set -euo pipefail

          LAUNCHER="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"
          CAR="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          test -f "$LAUNCHER"
          test -f "$CAR"

          grep -q '^package com\.carassistant\.v10;' "$LAUNCHER"
          grep -q '^package com\.carassistant\.v10;' "$CAR"

          grep -q 'public final class V10LauncherActivity' "$LAUNCHER"
          grep -q 'public final class V10CarActivity' "$CAR"

          grep -q '"Navigation"' "$LAUNCHER"
          grep -q '"Navigation"' "$CAR"

          echo "Source structure: PASS"

      - name: Add MapLibre dependency
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/build.gradle"

          if ! grep -q 'org.maplibre.gl:android-sdk:11.11.0' "$FILE"; then
            perl -0pi -e 's/(dependencies\s*\{\s*\n)/$1    implementation "org.maplibre.gl:android-sdk:11.11.0"\n/' "$FILE"
          fi

          grep -q 'org.maplibre.gl:android-sdk:11.11.0' "$FILE"

          echo "MapLibre dependency: PASS"

      - name: Add Navigation permissions
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/AndroidManifest.xml"

          if ! grep -q 'android.permission.INTERNET' "$FILE"; then
            perl -0pi -e 's#(<manifest[^>]*>\s*)#$1    <uses-permission android:name="android.permission.INTERNET"/>\n#' "$FILE"
          fi

          if ! grep -q 'android.permission.ACCESS_FINE_LOCATION' "$FILE"; then
            perl -0pi -e 's#(<manifest[^>]*>\s*)#$1    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n#' "$FILE"
          fi

          if ! grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$FILE"; then
            perl -0pi -e 's#(<manifest[^>]*>\s*)#$1    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n#' "$FILE"
          fi

          grep -q 'android.permission.INTERNET' "$FILE"
          grep -q 'android.permission.ACCESS_FINE_LOCATION' "$FILE"
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$FILE"

          echo "Permissions: PASS"

      - name: Create NavigationMapView
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          cat > "$FILE" <<'JAVA'
          package com.carassistant.v10;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.FrameLayout;
          import android.widget.TextView;

          import org.maplibre.android.MapLibre;
          import org.maplibre.android.camera.CameraPosition;
          import org.maplibre.android.camera.CameraUpdateFactory;
          import org.maplibre.android.geometry.LatLng;
          import org.maplibre.android.maps.MapLibreMap;
          import org.maplibre.android.maps.MapView;
          import org.maplibre.android.maps.OnMapReadyCallback;

          public final class NavigationMapView
                  extends FrameLayout
                  implements OnMapReadyCallback, LocationListener {

              private static final String STYLE_URL =
                      "https://tiles.openfreemap.org/styles/liberty";

              private final MapView mapView;
              private final TextView vehicle;
              private final TextView recenter;
              private final TextView zoomIn;
              private final TextView zoomOut;
              private final TextView mode;

              private MapLibreMap map;
              private LocationManager locationManager;

              private boolean follow = true;
              private boolean headingUp = true;
              private boolean locationStarted = false;

              private double lastLat = 0.0;
              private double lastLon = 0.0;
              private float lastBearing = 0.0f;

              public NavigationMapView(Context context) {
                  super(context);

                  MapLibre.getInstance(
                          context.getApplicationContext());

                  setBackgroundColor(Color.BLACK);

                  mapView = new MapView(context);

                  addView(
                          mapView,
                          new LayoutParams(
                                  LayoutParams.MATCH_PARENT,
                                  LayoutParams.MATCH_PARENT));

                  vehicle = control("▲", 28);

                  LayoutParams vehicleParams =
                          new LayoutParams(
                                  dp(64),
                                  dp(64),
                                  Gravity.CENTER);

                  addView(
                          vehicle,
                          vehicleParams);

                  recenter = control("◎", 25);

                  LayoutParams recenterParams =
                          new LayoutParams(
                                  dp(58),
                                  dp(58),
                                  Gravity.BOTTOM | Gravity.END);

                  recenterParams.setMargins(
                          0,
                          0,
                          dp(18),
                          dp(18));

                  addView(
                          recenter,
                          recenterParams);

                  zoomIn = control("+", 25);

                  LayoutParams zoomInParams =
                          new LayoutParams(
                                  dp(52),
                                  dp(52),
                                  Gravity.TOP | Gravity.END);

                  zoomInParams.setMargins(
                          0,
                          dp(18),
                          dp(18),
                          0);

                  addView(
                          zoomIn,
                          zoomInParams);

                  zoomOut = control("−", 25);

                  LayoutParams zoomOutParams =
                          new LayoutParams(
                                  dp(52),
                                  dp(52),
                                  Gravity.TOP | Gravity.END);

                  zoomOutParams.setMargins(
                          0,
                          dp(78),
                          dp(18),
                          0);

                  addView(
                          zoomOut,
                          zoomOutParams);

                  mode = control("H", 16);

                  LayoutParams modeParams =
                          new LayoutParams(
                                  dp(52),
                                  dp(52),
                                  Gravity.TOP | Gravity.START);

                  modeParams.setMargins(
                          dp(18),
                          dp(18),
                          0,
                          0);

                  addView(
                          mode,
                          modeParams);

                  recenter.setOnClickListener(
                          v -> recenter());

                  zoomIn.setOnClickListener(
                          v -> zoom(1.0));

                  zoomOut.setOnClickListener(
                          v -> zoom(-1.0));

                  mode.setOnClickListener(
                          v -> toggleHeadingMode());

                  mapView.onCreate(null);
                  mapView.getMapAsync(this);
              }

              private TextView control(
                      String value,
                      float size) {

                  TextView text =
                          new TextView(getContext());

                  text.setText(value);
                  text.setTextColor(Color.WHITE);
                  text.setTextSize(size);
                  text.setGravity(Gravity.CENTER);
                  text.setBackgroundColor(0x66000000);
                  text.setElevation(dp(6));

                  return text;
              }

              @Override
              public void onMapReady(
                      MapLibreMap mapLibreMap) {

                  map = mapLibreMap;

                  map.setStyle(STYLE_URL);

                  map.getUiSettings()
                          .setCompassEnabled(false);

                  map.getUiSettings()
                          .setLogoEnabled(false);

                  map.getUiSettings()
                          .setAttributionEnabled(false);

                  map.setCameraPosition(
                          new CameraPosition.Builder()
                                  .target(
                                          new LatLng(
                                                  12.666,
                                                  108.037))
                                  .zoom(12.0)
                                  .build());

                  startLocation();
              }

              private void startLocation() {

                  if (locationStarted) {
                      return;
                  }

                  Context context = getContext();

                  if (!(context instanceof Activity)) {
                      return;
                  }

                  Activity activity =
                          (Activity) context;

                  if (android.os.Build.VERSION.SDK_INT >= 23) {

                      if (activity.checkSelfPermission(
                                      Manifest.permission.ACCESS_FINE_LOCATION)
                              != PackageManager.PERMISSION_GRANTED
                              &&
                              activity.checkSelfPermission(
                                      Manifest.permission.ACCESS_COARSE_LOCATION)
                              != PackageManager.PERMISSION_GRANTED) {

                          activity.requestPermissions(
                                  new String[] {
                                          Manifest.permission.ACCESS_FINE_LOCATION,
                                          Manifest.permission.ACCESS_COARSE_LOCATION
                                  },
                                  9001);

                          return;
                      }
                  }

                  locationManager =
                          (LocationManager)
                                  context.getSystemService(
                                          Context.LOCATION_SERVICE);

                  if (locationManager == null) {
                      return;
                  }

                  try {

                      if (locationManager.isProviderEnabled(
                              LocationManager.GPS_PROVIDER)) {

                          locationManager.requestLocationUpdates(
                                  LocationManager.GPS_PROVIDER,
                                  500,
                                  1.0f,
                                  this);

                          locationStarted = true;
                      }

                  } catch (SecurityException ignored) {
                  }
              }

              private void stopLocation() {

                  if (locationManager == null
                          || !locationStarted) {
                      return;
                  }

                  try {
                      locationManager.removeUpdates(this);
                  } catch (SecurityException ignored) {
                  }

                  locationStarted = false;
              }

              @Override
              public void onLocationChanged(
                      Location location) {

                  lastLat = location.getLatitude();
                  lastLon = location.getLongitude();

                  if (location.hasBearing()) {
                      lastBearing = location.getBearing();
                  }

                  vehicle.setRotation(
                          headingUp
                                  ? lastBearing
                                  : 0.0f);

                  if (!follow || map == null) {
                      return;
                  }

                  CameraPosition.Builder builder =
                          new CameraPosition.Builder()
                                  .target(
                                          new LatLng(
                                                  lastLat,
                                                  lastLon))
                                  .zoom(
                                          Math.max(
                                                  15.0,
                                                  map.getCameraPosition()
                                                          .zoom));

                  builder.bearing(
                          headingUp
                                  ? lastBearing
                                  : 0.0);

                  map.animateCamera(
                          CameraUpdateFactory
                                  .newCameraPosition(
                                          builder.build()),
                          500);
              }

              private void recenter() {

                  if (map == null) {
                      return;
                  }

                  follow = true;

                  if (lastLat == 0.0
                          && lastLon == 0.0) {
                      return;
                  }

                  CameraPosition.Builder builder =
                          new CameraPosition.Builder()
                                  .target(
                                          new LatLng(
                                                  lastLat,
                                                  lastLon))
                                  .zoom(16.0)
                                  .bearing(
                                          headingUp
                                                  ? lastBearing
                                                  : 0.0);

                  map.animateCamera(
                          CameraUpdateFactory
                                  .newCameraPosition(
                                          builder.build()),
                          500);
              }

              private void zoom(
                      double amount) {

                  if (map == null) {
                      return;
                  }

                  double current =
                          map.getCameraPosition()
                                  .zoom;

                  double next =
                          Math.max(
                                  3.0,
                                  Math.min(
                                          20.0,
                                          current + amount));

                  map.setZoom(
                          next,
                          null,
                          250);
              }

              private void toggleHeadingMode() {

                  headingUp = !headingUp;

                  mode.setText(
                          headingUp
                                  ? "H"
                                  : "N");

                  vehicle.setRotation(
                          headingUp
                                  ? lastBearing
                                  : 0.0f);

                  if (map == null) {
                      return;
                  }

                  CameraPosition current =
                          map.getCameraPosition();

                  map.setCameraPosition(
                          new CameraPosition.Builder()
                                  .target(current.target)
                                  .zoom(current.zoom)
                                  .bearing(
                                          headingUp
                                                  ? lastBearing
                                                  : 0.0)
                                  .tilt(current.tilt)
                                  .build());
              }

              @Override
              protected void onAttachedToWindow() {

                  super.onAttachedToWindow();

                  mapView.onStart();
                  mapView.onResume();

                  startLocation();
              }

              @Override
              protected void onDetachedFromWindow() {

                  stopLocation();

                  mapView.onPause();
                  mapView.onStop();
                  mapView.onDestroy();

                  super.onDetachedFromWindow();
              }

              @Override
              public void onProviderEnabled(
                      String provider) {
              }

              @Override
              public void onProviderDisabled(
                      String provider) {
              }

              @Override
              public void onStatusChanged(
                      String provider,
                      int status,
                      Bundle extras) {
              }

              private int dp(float value) {

                  return Math.round(
                          value
                                  * getResources()
                                          .getDisplayMetrics()
                                          .density);
              }
          }
          JAVA

          test -f "$FILE"

          grep -q '^package com\.carassistant\.v10;' "$FILE"
          grep -q 'org.maplibre.android.maps.MapView' "$FILE"
          grep -q 'org.maplibre.android.maps.MapLibreMap' "$FILE"
          grep -q 'org.maplibre.android.camera.CameraPosition' "$FILE"

          echo "NavigationMapView: PASS"

      - name: Patch V10LauncherActivity
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"

          perl -0pi -e '
          s{
          \Q        LinearLayout map =\E.*?
          \Q        content.addView(\E
          \s*
          \Q                map,\E
          \s*
          \Q                new LinearLayout.LayoutParams(\E
          \s*
          \Q                        -1,\E
          \s*
          \Q                        0,\E
          \s*
          \Q                        2));\E
          }{
                  NavigationMapView navigationMap =
                          new NavigationMapView(this);

                  content.addView(
                          navigationMap,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  2));
          }sx
          ' "$FILE"

          grep -q 'NavigationMapView navigationMap' "$FILE"

          echo "V10LauncherActivity patch: PASS"

      - name: Patch V10CarActivity
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          perl -0pi -e '
          s{
          \Q        LinearLayout map =\E.*?
          \Q        content.addView(\E
          \s*
          \Q                map,\E
          \s*
          \Q                new LinearLayout.LayoutParams(\E
          \s*
          \Q                        -1,\E
          \s*
          \Q                        0,\E
          \s*
          \Q                        2));\E
          }{
                  NavigationMapView navigationMap =
                          new NavigationMapView(this);

                  content.addView(
                          navigationMap,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  2));
          }sx
          ' "$FILE"

          grep -q 'NavigationMapView navigationMap' "$FILE"

          echo "V10CarActivity patch: PASS"

      - name: Verify changed files
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          git diff --name-only > /tmp/navigation-files.txt

          cat /tmp/navigation-files.txt

          test "$(wc -l < /tmp/navigation-files.txt)" -eq 5

          grep -Fxq \
            "v10-source/app/build.gradle" \
            /tmp/navigation-files.txt

          grep -Fxq \
            "v10-source/app/src/main/AndroidManifest.xml" \
            /tmp/navigation-files.txt

          grep -Fxq \
            "v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java" \
            /tmp/navigation-files.txt

          grep -Fxq \
            "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java" \
            /tmp/navigation-files.txt

          grep -Fxq \
            "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java" \
            /tmp/navigation-files.txt

          echo "Changed-file scope: PASS"

      - name: Create diff audit file
        shell: bash
        run: |
          set -euo pipefail

          git diff > navigation-v1.diff

          test -s navigation-v1.diff

          echo "Navigation diff: PASS"

      - name: Final Foundation lock check
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="2c814a181d00cde9547a446927ae181e18cb9cbb"
          ACTUAL="$(git rev-parse HEAD)"

          test "$ACTUAL" = "$EXPECTED"

          echo "Foundation still locked."
          echo "HEAD=$ACTUAL"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Navigation V1
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --stacktrace \
            --no-daemon

      - name: Assemble Navigation V1 APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find v10-source/app/build/outputs/apk/debug \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          test -n "$APK"
          test -f "$APK"

          cp "$APK" CarAssistant-Navigation-V1.apk

          sha256sum \
            CarAssistant-Navigation-V1.apk \
            | tee Navigation-V1-SHA256.txt

          printf '%s\n' \
            'CarAssistant Navigation V1' \
            'Foundation: 2c814a181d00cde9547a446927ae181e18cb9cbb' \
            'Package: com.carassistant.v10' \
            'MapLibre Android SDK: 11.11.0' \
            'GPS: enabled' \
            'Vehicle marker: enabled' \
            'Recenter: enabled' \
            'Zoom: enabled' \
            'Heading-up / North-up: enabled' \
            > Navigation-V1-BUILD-INFO.txt

      - name: Upload Navigation V1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-Navigation-V1
          path: |
            CarAssistant-Navigation-V1.apk
            Navigation-V1-SHA256.txt
            Navigation-V1-BUILD-INFO.txt
            navigation-v1.diff
          if-no-files-found: error

      - name: Navigation V1 final PASS
        shell: bash
        run: |
          set -euo pipefail

          test -s CarAssistant-Navigation-V1.apk
          test -s navigation-v1.diff

          EXPECTED="2c814a181d00cde9547a446927ae181e18cb9cbb"
          ACTUAL="$(git rev-parse HEAD)"

          test "$ACTUAL" = "$EXPECTED"

          echo "========================================"
          echo "NAVIGATION V1 SAFE: PASS"
          echo "========================================"
          echo "Foundation V1: LOCKED"
          echo "HEAD: $ACTUAL"
          echo "APK: CarAssistant-Navigation-V1.apk"
          echo "========================================"
