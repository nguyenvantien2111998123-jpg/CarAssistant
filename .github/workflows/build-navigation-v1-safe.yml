name: Navigation V1 Safe - Foundation Locked

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation-v1-safe:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout exact Foundation V1
        uses: actions/checkout@v4
        with:
          ref: 2c814a181d00cde9547a446927ae181e18cb9cbb
          fetch-depth: 1

      - name: Verify Foundation V1 lock
        shell: bash
        run: |
          set -e

          EXPECTED="2c814a181d00cde9547a446927ae181e18cb9cbb"
          ACTUAL="$(git rev-parse HEAD)"

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          test "$ACTUAL" = "$EXPECTED"

          echo "FOUNDATION LOCK PASS"

      - name: Verify Foundation source structure
        shell: bash
        run: |
          set -e

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          LAUNCHER="$BASE/V10LauncherActivity.java"
          CAR="$BASE/V10CarActivity.java"
          NAV="$BASE/NavigationMapView.java"

          test -f "$LAUNCHER"
          test -f "$CAR"

          grep -q '^package com\.carassistant\.v10;' "$LAUNCHER"
          grep -q '^package com\.carassistant\.v10;' "$CAR"

          grep -q 'class V10LauncherActivity' "$LAUNCHER"
          grep -q 'class V10CarActivity' "$CAR"

          grep -q 'private void buildDashboard()' "$LAUNCHER"
          grep -q 'private void buildDashboard()' "$CAR"

          grep -q '"MAP"' "$LAUNCHER"
          grep -q '"MAP"' "$CAR"

          grep -q 'infoCard(' "$LAUNCHER"
          grep -q 'infoCard(' "$CAR"

          test ! -f "$NAV"

          echo "FOUNDATION SOURCE STRUCTURE PASS"

      - name: Verify NavigationMapView baseline state
        shell: bash
        run: |
          set -e

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          if [ -f "$FILE" ]; then
            echo "ERROR: NavigationMapView.java already exists in Foundation."
            exit 1
          fi

          echo "NavigationMapView.java absent as expected"

      - name: Add MapLibre dependency
        shell: bash
        run: |
          set -e

          FILE="v10-source/app/build.gradle"

          if grep -q 'org.maplibre.gl:android-sdk' "$FILE"; then
            echo "MapLibre dependency already present"
          else
            sed -i '/dependencies {/a\    implementation "org.maplibre.gl:android-sdk:11.11.0"' "$FILE"
            echo "MapLibre dependency added"
          fi

          grep -q 'org.maplibre.gl:android-sdk:11.11.0' "$FILE"

          echo "MAPLIBRE DEPENDENCY PASS"

      - name: Add navigation permissions
        shell: bash
        run: |
          set -e

          FILE="v10-source/app/src/main/AndroidManifest.xml"

          if ! grep -q 'android.permission.ACCESS_FINE_LOCATION' "$FILE"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' "$FILE"
          fi

          if ! grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$FILE"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' "$FILE"
          fi

          grep -q 'android.permission.ACCESS_FINE_LOCATION' "$FILE"
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$FILE"

          echo "NAVIGATION PERMISSIONS PASS"

      - name: Create NavigationMapView
        shell: bash
        run: |
          set -e

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"
          FILE="$BASE/NavigationMapView.java"

          mkdir -p "$BASE"

          printf '%s\n' \
            'package com.carassistant.v10;' \
            '' \
            'import android.Manifest;' \
            'import android.content.Context;' \
            'import android.content.pm.PackageManager;' \
            'import android.graphics.Color;' \
            'import android.location.Location;' \
            'import android.os.Bundle;' \
            'import android.widget.FrameLayout;' \
            '' \
            'import androidx.annotation.NonNull;' \
            'import androidx.core.app.ActivityCompat;' \
            'import androidx.core.content.ContextCompat;' \
            '' \
            'import org.maplibre.android.MapLibre;' \
            'import org.maplibre.android.camera.CameraUpdateFactory;' \
            'import org.maplibre.android.geometry.LatLng;' \
            'import org.maplibre.android.location.LocationComponentActivationOptions;' \
            'import org.maplibre.android.location.LocationComponentOptions;' \
            'import org.maplibre.android.maps.MapView;' \
            'import org.maplibre.android.maps.MapboxMap;' \
            'import org.maplibre.android.maps.UiSettings;' \
            '' \
            'public final class NavigationMapView extends FrameLayout {' \
            '' \
            '    private static final int LOCATION_REQUEST = 4101;' \
            '' \
            '    private final MapView mapView;' \
            '    private MapboxMap map;' \
            '' \
            '    public NavigationMapView(Context context) {' \
            '        super(context);' \
            '' \
            '        setBackgroundColor(Color.BLACK);' \
            '' \
            '        MapLibre.getInstance(context.getApplicationContext());' \
            '' \
            '        mapView = new MapView(context);' \
            '        mapView.onCreate(new Bundle());' \
            '' \
            '        LayoutParams params = new LayoutParams(' \
            '                LayoutParams.MATCH_PARENT,' \
            '                LayoutParams.MATCH_PARENT);' \
            '' \
            '        addView(mapView, params);' \
            '' \
            '        mapView.getMapAsync(this::onMapReady);' \
            '    }' \
            '' \
            '    private void onMapReady(@NonNull MapboxMap readyMap) {' \
            '        map = readyMap;' \
            '' \
            '        UiSettings ui = map.getUiSettings();' \
            '        ui.setCompassEnabled(false);' \
            '        ui.setZoomGesturesEnabled(true);' \
            '        ui.setScrollGesturesEnabled(true);' \
            '        ui.setRotateGesturesEnabled(true);' \
            '        ui.setTiltGesturesEnabled(false);' \
            '' \
            '        map.setStyle(' \
            '                "https://tiles.openfreemap.org/styles/liberty",' \
            '                style -> enableLocation());' \
            '    }' \
            '' \
            '    private void enableLocation() {' \
            '        if (map == null) {' \
            '            return;' \
            '        }' \
            '' \
            '        Context context = getContext();' \
            '' \
            '        if (ContextCompat.checkSelfPermission(' \
            '                context,' \
            '                Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {' \
            '            if (context instanceof V10LauncherActivity) {' \
            '                ActivityCompat.requestPermissions(' \
            '                        (V10LauncherActivity) context,' \
            '                        new String[]{' \
            '                                Manifest.permission.ACCESS_FINE_LOCATION,' \
            '                                Manifest.permission.ACCESS_COARSE_LOCATION},' \
            '                        LOCATION_REQUEST);' \
            '            } else if (context instanceof V10CarActivity) {' \
            '                ActivityCompat.requestPermissions(' \
            '                        (V10CarActivity) context,' \
            '                        new String[]{' \
            '                                Manifest.permission.ACCESS_FINE_LOCATION,' \
            '                                Manifest.permission.ACCESS_COARSE_LOCATION},' \
            '                        LOCATION_REQUEST);' \
            '            }' \
            '            return;' \
            '        }' \
            '' \
            '        LocationComponentOptions options =' \
            '                LocationComponentOptions.builder(context)' \
            '                        .pulseEnabled(true)' \
            '                        .build();' \
            '' \
            '        LocationComponentActivationOptions activation =' \
            '                LocationComponentActivationOptions.builder(context, map.getStyle())' \
            '                        .locationComponentOptions(options)' \
            '                        .build();' \
            '' \
            '        map.getLocationComponent()' \
            '                .activateLocationComponent(activation);' \
            '        map.getLocationComponent()' \
            '                .setLocationComponentEnabled(true);' \
            '    }' \
            '' \
            '    public void zoomIn() {' \
            '        if (map == null) return;' \
            '        double zoom = map.getCameraPosition().zoom;' \
            '        map.animateCamera(' \
            '                CameraUpdateFactory.zoomTo(Math.min(20.0, zoom + 1.0)), 250);' \
            '    }' \
            '' \
            '    public void zoomOut() {' \
            '        if (map == null) return;' \
            '        double zoom = map.getCameraPosition().zoom;' \
            '        map.animateCamera(' \
            '                CameraUpdateFactory.zoomTo(Math.max(1.0, zoom - 1.0)), 250);' \
            '    }' \
            '' \
            '    public void recenter() {' \
            '        if (map == null) return;' \
            '' \
            '        try {' \
            '            Location location =' \
            '                    map.getLocationComponent().getLastKnownLocation();' \
            '' \
            '            if (location == null) return;' \
            '' \
            '            LatLng target = new LatLng(' \
            '                    location.getLatitude(),' \
            '                    location.getLongitude());' \
            '' \
            '            map.animateCamera(' \
            '                    CameraUpdateFactory.newLatLngZoom(target, 16.0),' \
            '                    500);' \
            '        } catch (Exception ignored) {' \
            '        }' \
            '    }' \
            '' \
            '    public void onHostResume() {' \
            '        mapView.onResume();' \
            '    }' \
            '' \
            '    public void onHostPause() {' \
            '        mapView.onPause();' \
            '    }' \
            '' \
            '    public void onHostDestroy() {' \
            '        mapView.onDestroy();' \
            '    }' \
            '}' \
            > "$FILE"

          test -f "$FILE"
          grep -q '^package com\.carassistant\.v10;' "$FILE"
          grep -q 'class NavigationMapView' "$FILE"
          grep -q 'MapLibre' "$FILE"
          grep -q 'MapView' "$FILE"

          echo "NAVIGATION MAP VIEW PASS"

      - name: Patch Launcher and Car navigation block
        shell: bash
        run: |
          set -e

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          patch_file() {
            FILE="$1"

            if grep -q 'NavigationMapView navigationMap' "$FILE"; then
              echo "$FILE already patched"
              return
            fi

            perl -0pi -e 's/        LinearLayout map =.*?        content\.addView\(\s*map,\s*new LinearLayout\.LayoutParams\(\s*-1,\s*0,\s*2\)\);/        NavigationMapView navigationMap =\n                new NavigationMapView(this);\n\n        content.addView(\n                navigationMap,\n                new LinearLayout.LayoutParams(\n                        -1,\n                        0,\n                        2));/s' "$FILE"

            if ! grep -q 'NavigationMapView navigationMap' "$FILE"; then
              echo "ERROR: patch failed for $FILE"
              exit 1
            fi

            echo "PATCH PASS: $FILE"
          }

          patch_file "$BASE/V10LauncherActivity.java"
          patch_file "$BASE/V10CarActivity.java"

          grep -q 'NavigationMapView navigationMap' \
            "$BASE/V10LauncherActivity.java"

          grep -q 'NavigationMapView navigationMap' \
            "$BASE/V10CarActivity.java"

          echo "ACTIVITY NAVIGATION PATCH PASS"

      - name: Verify Navigation V1 source
        shell: bash
        run: |
          set -e

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          grep -q 'NavigationMapView navigationMap' \
            "$BASE/V10LauncherActivity.java"

          grep -q 'NavigationMapView navigationMap' \
            "$BASE/V10CarActivity.java"

          if grep -q 'LinearLayout map' \
            "$BASE/V10LauncherActivity.java"; then
            echo "ERROR: old Launcher MAP block remains"
            exit 1
          fi

          if grep -q 'LinearLayout map' \
            "$BASE/V10CarActivity.java"; then
            echo "ERROR: old Car MAP block remains"
            exit 1
          fi

          test -f "$BASE/NavigationMapView.java"

          echo "NAVIGATION V1 SOURCE PASS"

      - name: Git diff check
        shell: bash
        run: |
          set -e

          git diff --check

          echo "GIT DIFF CHECK PASS"

      - name: Verify changed files
        shell: bash
        run: |
          set -e

          test -f "v10-source/app/build.gradle"
          test -f "v10-source/app/src/main/AndroidManifest.xml"
          test -f "v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"
          test -f "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"
          test -f "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          git status --short

          echo "CHANGED FILES PASS"

      - name: Compile Navigation V1
        shell: bash
        working-directory: v10-source
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --no-daemon

      - name: Assemble Navigation V1 APK
        shell: bash
        working-directory: v10-source
        run: |
          set -e

          ./gradlew \
            :app:assembleDebug \
            --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          ls -lh "$APK"
          sha256sum "$APK"

          echo "APK VERIFY PASS"

      - name: Upload Navigation V1 APK
        uses: actions/upload-artifact@v4
        with:
          name: carassistant-navigation-v1-safe
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
