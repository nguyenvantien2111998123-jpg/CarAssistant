name: Navigation V1 Safe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation-v1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact Foundation V1
        uses: actions/checkout@v4
        with:
          ref: 2c814a181d00cde9547a446927ae181e18cb9cbb
          fetch-depth: 1

      - name: Verify Foundation V1
        shell: bash
        run: |
          set -e

          EXPECTED="2c814a181d00cde9547a446927ae181e18cb9cbb"
          ACTUAL="$(git rev-parse HEAD)"

          test "$ACTUAL" = "$EXPECTED"

          echo "Foundation V1: $ACTUAL"
          echo "FOUNDATION LOCK PASS"

      - name: Verify Foundation source structure
        shell: bash
        run: |
          set -e

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$BASE/V10LauncherActivity.java"
          test -f "$BASE/V10CarActivity.java"

          grep -q '^package com.carassistant.v10;' \
            "$BASE/V10LauncherActivity.java"

          grep -q '^package com.carassistant.v10;' \
            "$BASE/V10CarActivity.java"

          test "$(grep -c '^        // MAP$' "$BASE/V10LauncherActivity.java")" = "1"
          test "$(grep -c '^        // INFORMATION CARDS$' "$BASE/V10LauncherActivity.java")" = "1"

          test "$(grep -c '^        // MAP$' "$BASE/V10CarActivity.java")" = "1"
          test "$(grep -c '^        // INFORMATION CARDS$' "$BASE/V10CarActivity.java")" = "1"

          test ! -f "$BASE/NavigationMapView.java"

          echo "FOUNDATION SOURCE STRUCTURE PASS"

      - name: Add MapLibre dependency
        shell: bash
        run: |
          set -e

          FILE="v10-source/app/build.gradle"

          grep -q '^dependencies {' "$FILE"

          if ! grep -q 'org.maplibre.gl:android-sdk:11.11.0' "$FILE"; then
            perl -0pi -e 's@dependencies \{@dependencies {\n    implementation "org.maplibre.gl:android-sdk:11.11.0"@' "$FILE"
          fi

          grep -q 'org.maplibre.gl:android-sdk:11.11.0' "$FILE"

          echo "MAPLIBRE DEPENDENCY PASS"

      - name: Add location permissions
        shell: bash
        run: |
          set -e

          FILE="v10-source/app/src/main/AndroidManifest.xml"

          grep -q '<manifest ' "$FILE"

          if ! grep -q 'android.permission.ACCESS_FINE_LOCATION' "$FILE"; then
            perl -0pi -e 's@(<manifest[^>]*>)@$1\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />@' "$FILE"
          fi

          if ! grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$FILE"; then
            perl -0pi -e 's@(<manifest[^>]*>)@$1\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />@' "$FILE"
          fi

          grep -q 'android.permission.ACCESS_FINE_LOCATION' "$FILE"
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$FILE"

          echo "LOCATION PERMISSION PASS"

      - name: Create NavigationMapView
        shell: bash
        run: |
          set -e

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"
          FILE="$BASE/NavigationMapView.java"

          test ! -f "$FILE"

          : > "$FILE"

          printf '%s\n' 'package com.carassistant.v10;' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' 'import android.Manifest;' >> "$FILE"
          printf '%s\n' 'import android.app.Activity;' >> "$FILE"
          printf '%s\n' 'import android.content.Context;' >> "$FILE"
          printf '%s\n' 'import android.content.pm.PackageManager;' >> "$FILE"
          printf '%s\n' 'import android.graphics.Color;' >> "$FILE"
          printf '%s\n' 'import android.graphics.drawable.GradientDrawable;' >> "$FILE"
          printf '%s\n' 'import android.os.Bundle;' >> "$FILE"
          printf '%s\n' 'import android.view.Gravity;' >> "$FILE"
          printf '%s\n' 'import android.widget.FrameLayout;' >> "$FILE"
          printf '%s\n' 'import android.widget.TextView;' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' 'import org.maplibre.android.MapLibre;' >> "$FILE"
          printf '%s\n' 'import org.maplibre.android.camera.CameraUpdateFactory;' >> "$FILE"
          printf '%s\n' 'import org.maplibre.android.location.LocationComponentActivationOptions;' >> "$FILE"
          printf '%s\n' 'import org.maplibre.android.location.LocationComponentOptions;' >> "$FILE"
          printf '%s\n' 'import org.maplibre.android.location.modes.CameraMode;' >> "$FILE"
          printf '%s\n' 'import org.maplibre.android.location.modes.RenderMode;' >> "$FILE"
          printf '%s\n' 'import org.maplibre.android.maps.MapLibreMap;' >> "$FILE"
          printf '%s\n' 'import org.maplibre.android.maps.MapView;' >> "$FILE"
          printf '%s\n' 'import org.maplibre.android.maps.Style;' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' 'public final class NavigationMapView extends FrameLayout {' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '    private static final int LOCATION_REQUEST = 4101;' >> "$FILE"
          printf '%s\n' '    private static final String STYLE_URL =' >> "$FILE"
          printf '%s\n' '            "https://tiles.openfreemap.org/styles/liberty";' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '    private final MapView mapView;' >> "$FILE"
          printf '%s\n' '    private MapLibreMap map;' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '    public NavigationMapView(Context context) {' >> "$FILE"
          printf '%s\n' '        super(context);' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '        MapLibre.getInstance(context.getApplicationContext());' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '        mapView = new MapView(context);' >> "$FILE"
          printf '%s\n' '        mapView.onCreate(null);' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '        addView(' >> "$FILE"
          printf '%s\n' '                mapView,' >> "$FILE"
          printf '%s\n' '                new FrameLayout.LayoutParams(' >> "$FILE"
          printf '%s\n' '                        -1,' >> "$FILE"
          printf '%s\n' '                        -1));' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '        mapView.getMapAsync(this::onMapReady);' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '        buildControls(context);' >> "$FILE"
          printf '%s\n' '    }' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '    private void onMapReady(MapLibreMap readyMap) {' >> "$FILE"
          printf '%s\n' '        map = readyMap;' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '        map.getUiSettings().setCompassEnabled(false);' >> "$FILE"
          printf '%s\n' '        map.getUiSettings().setZoomGesturesEnabled(true);' >> "$FILE"
          printf '%s\n' '        map.getUiSettings().setScrollGesturesEnabled(true);' >> "$FILE"
          printf '%s\n' '        map.getUiSettings().setRotateGesturesEnabled(true);' >> "$FILE"
          printf '%s\n' '        map.getUiSettings().setTiltGesturesEnabled(false);' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '        map.setStyle(STYLE_URL, this::activateLocation);' >> "$FILE"
          printf '%s\n' '    }' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '    private void activateLocation(Style style) {' >> "$FILE"
          printf '%s\n' '        Context context = getContext();' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '        if (context.checkSelfPermission(' >> "$FILE"
          printf '%s\n' '                Manifest.permission.ACCESS_FINE_LOCATION)' >> "$FILE"
          printf '%s\n' '                != PackageManager.PERMISSION_GRANTED' >> "$FILE"
          printf '%s\n' '                && context.checkSelfPermission(' >> "$FILE"
          printf '%s\n' '                Manifest.permission.ACCESS_COARSE_LOCATION)' >> "$FILE"
          printf '%s\n' '                != PackageManager.PERMISSION_GRANTED) {' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '            if (context instanceof Activity) {' >> "$FILE"
          printf '%s\n' '                ((Activity) context).requestPermissions(' >> "$FILE"
          printf '%s\n' '                        new String[]{' >> "$FILE"
          printf '%s\n' '                                Manifest.permission.ACCESS_FINE_LOCATION,' >> "$FILE"
          printf '%s\n' '                                Manifest.permission.ACCESS_COARSE_LOCATION},' >> "$FILE"
          printf '%s\n' '                        LOCATION_REQUEST);' >> "$FILE"
          printf '%s\n' '            }' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '            postDelayed(() -> activateLocation(style), 1500);' >> "$FILE"
          printf '%s\n' '            return;' >> "$FILE"
          printf '%s\n' '        }' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '        LocationComponentOptions options =' >> "$FILE"
          printf '%s\n' '                LocationComponentOptions.builder(context)' >> "$FILE"
          printf '%s\n' '                        .pulseEnabled(true)' >> "$FILE"
          printf '%s\n' '                        .trackingGesturesManagement(true)' >> "$FILE"
          printf '%s\n' '                        .build();' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '        LocationComponentActivationOptions activation =' >> "$FILE"
          printf '%s\n' '                LocationComponentActivationOptions.builder(' >> "$FILE"
          printf '%s\n' '                        context,' >> "$FILE"
          printf '%s\n' '                        style)' >> "$FILE"
          printf '%s\n' '                        .locationComponentOptions(options)' >> "$FILE"
          printf '%s\n' '                        .useDefaultLocationEngine(true)' >> "$FILE"
          printf '%s\n' '                        .build();' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '        map.getLocationComponent()' >> "$FILE"
          printf '%s\n' '                .activateLocationComponent(activation);' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '        map.getLocationComponent()' >> "$FILE"
          printf '%s\n' '                .setLocationComponentEnabled(true);' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '        map.getLocationComponent()' >> "$FILE"
          printf '%s\n' '                .setRenderMode(RenderMode.GPS);' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '        map.getLocationComponent()' >> "$FILE"
          printf '%s\n' '                .setCameraMode(CameraMode.TRACKING_GPS);' >> "$FILE"
          printf '%s\n' '    }' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '    private void buildControls(Context context) {' >> "$FILE"
          printf '%s\n' '        addButton(context, "+", 16, 16, () -> zoom(1.0));' >> "$FILE"
          printf '%s\n' '        addButton(context, "-", 16, 68, () -> zoom(-1.0));' >> "$FILE"
          printf '%s\n' '        addButton(context, "N", 16, 120, this::northUp);' >> "$FILE"
          printf '%s\n' '        addButton(context, "◎", 16, 172, this::recenter);' >> "$FILE"
          printf '%s\n' '    }' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '    private void addButton(' >> "$FILE"
          printf '%s\n' '            Context context,' >> "$FILE"
          printf '%s\n' '            String label,' >> "$FILE"
          printf '%s\n' '            int right,' >> "$FILE"
          printf '%s\n' '            int top,' >> "$FILE"
          printf '%s\n' '            Runnable action) {' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '        TextView button = new TextView(context);' >> "$FILE"
          printf '%s\n' '        button.setText(label);' >> "$FILE"
          printf '%s\n' '        button.setTextColor(Color.WHITE);' >> "$FILE"
          printf '%s\n' '        button.setTextSize(18);' >> "$FILE"
          printf '%s\n' '        button.setGravity(Gravity.CENTER);' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '        GradientDrawable background =' >> "$FILE"
          printf '%s\n' '                new GradientDrawable();' >> "$FILE"
          printf '%s\n' '        background.setColor(Color.argb(170, 15, 20, 25));' >> "$FILE"
          printf '%s\n' '        background.setCornerRadius(40);' >> "$FILE"
          printf '%s\n' '        button.setBackground(background);' >> "$FILE"
          printf '%s\n' '        button.setOnClickListener(v -> action.run());' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '        FrameLayout.LayoutParams params =' >> "$FILE"
          printf '%s\n' '                new FrameLayout.LayoutParams(52, 52);' >> "$FILE"
          printf '%s\n' '        params.gravity = Gravity.TOP | Gravity.END;' >> "$FILE"
          printf '%s\n' '        params.setMargins(0, top, right, 0);' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '        addView(button, params);' >> "$FILE"
          printf '%s\n' '        button.bringToFront();' >> "$FILE"
          printf '%s\n' '    }' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '    private void zoom(double amount) {' >> "$FILE"
          printf '%s\n' '        if (map != null) {' >> "$FILE"
          printf '%s\n' '            map.animateCamera(' >> "$FILE"
          printf '%s\n' '                    CameraUpdateFactory.zoomBy(amount),' >> "$FILE"
          printf '%s\n' '                    200);' >> "$FILE"
          printf '%s\n' '        }' >> "$FILE"
          printf '%s\n' '    }' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '    private void northUp() {' >> "$FILE"
          printf '%s\n' '        if (map != null) {' >> "$FILE"
          printf '%s\n' '            map.getLocationComponent()' >> "$FILE"
          printf '%s\n' '                    .setCameraMode(CameraMode.TRACKING_GPS_NORTH);' >> "$FILE"
          printf '%s\n' '        }' >> "$FILE"
          printf '%s\n' '    }' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '    private void recenter() {' >> "$FILE"
          printf '%s\n' '        if (map != null) {' >> "$FILE"
          printf '%s\n' '            map.getLocationComponent()' >> "$FILE"
          printf '%s\n' '                    .setCameraMode(CameraMode.TRACKING_GPS);' >> "$FILE"
          printf '%s\n' '        }' >> "$FILE"
          printf '%s\n' '    }' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '    @Override' >> "$FILE"
          printf '%s\n' '    protected void onAttachedToWindow() {' >> "$FILE"
          printf '%s\n' '        super.onAttachedToWindow();' >> "$FILE"
          printf '%s\n' '        mapView.onStart();' >> "$FILE"
          printf '%s\n' '        mapView.onResume();' >> "$FILE"
          printf '%s\n' '    }' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '    @Override' >> "$FILE"
          printf '%s\n' '    protected void onDetachedFromWindow() {' >> "$FILE"
          printf '%s\n' '        mapView.onPause();' >> "$FILE"
          printf '%s\n' '        mapView.onStop();' >> "$FILE"
          printf '%s\n' '        mapView.onDestroy();' >> "$FILE"
          printf '%s\n' '        super.onDetachedFromWindow();' >> "$FILE"
          printf '%s\n' '    }' >> "$FILE"
          printf '%s\n' '}' >> "$FILE"

          test -f "$FILE"
          grep -q '^package com.carassistant.v10;' "$FILE"
          grep -q 'class NavigationMapView' "$FILE"
          grep -q 'MapLibreMap' "$FILE"
          grep -q 'CameraMode.TRACKING_GPS' "$FILE"

          echo "NAVIGATION MAP VIEW PASS"

      - name: Patch Launcher navigation block
        shell: bash
        run: |
          set -e

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"

          perl -0pi -e 's@        // MAP\n.*?        // INFORMATION CARDS@        // MAP\n\n        NavigationMapView navigationMap = new NavigationMapView(this);\n\n        content.addView(\n                navigationMap,\n                new LinearLayout.LayoutParams(\n                        -1,\n                        0,\n                        2));\n\n        // INFORMATION CARDS@s' "$FILE"

          grep -q 'NavigationMapView navigationMap' "$FILE"

          echo "LAUNCHER NAVIGATION PATCH PASS"

      - name: Patch Car navigation block
        shell: bash
        run: |
          set -e

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          perl -0pi -e 's@        // MAP\n.*?        // INFORMATION CARDS@        // MAP\n\n        NavigationMapView navigationMap = new NavigationMapView(this);\n\n        content.addView(\n                navigationMap,\n                new LinearLayout.LayoutParams(\n                        -1,\n                        0,\n                        2));\n\n        // INFORMATION CARDS@s' "$FILE"

          grep -q 'NavigationMapView navigationMap' "$FILE"

          echo "CAR NAVIGATION PATCH PASS"

      - name: Verify source before compile
        shell: bash
        run: |
          set -e

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$BASE/NavigationMapView.java"

          grep -q 'org.maplibre.gl:android-sdk:11.11.0' \
            v10-source/app/build.gradle

          grep -q 'android.permission.ACCESS_FINE_LOCATION' \
            v10-source/app/src/main/AndroidManifest.xml

          grep -q 'android.permission.ACCESS_COARSE_LOCATION' \
            v10-source/app/src/main/AndroidManifest.xml

          grep -q 'NavigationMapView navigationMap' \
            "$BASE/V10LauncherActivity.java"

          grep -q 'NavigationMapView navigationMap' \
            "$BASE/V10CarActivity.java"

          grep -q 'CameraMode.TRACKING_GPS' \
            "$BASE/NavigationMapView.java"

          grep -q 'CameraMode.TRACKING_GPS_NORTH' \
            "$BASE/NavigationMapView.java"

          git diff --check

          echo "SOURCE VERIFICATION PASS"

      - name: Verify changed files
        shell: bash
        run: |
          set -e

          echo "Changed files:"
          git status --short

          test "$(git status --short | wc -l)" = "5"

          echo "CHANGED FILE COUNT PASS"

      - name: Compile Java
        shell: bash
        working-directory: v10-source
        run: |
          set -e

          chmod +x gradlew

          ./gradlew :app:compileDebugJavaWithJavac --no-daemon

      - name: Assemble Debug APK
        shell: bash
        working-directory: v10-source
        run: |
          set -e

          ./gradlew :app:assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK:"
          ls -lh "$APK"

          echo "SHA256:"
          sha256sum "$APK"

          echo "NAVIGATION V1 BUILD PASS"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: carassistant-navigation-v1-safe
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
