          \s*
          \Q                        Color.WHITE);\E
          \s*
          \Q        mapText.setGravity(\E
          \s*
          \Q                Gravity.CENTER);\E
          \s*
          \Q        map.addView(\E
          \s*
          \Q                mapText,\E
          \s*
          \Q                new LinearLayout.LayoutParams(\E
          \s*
          \Q                        -1,\E
          \s*
          \Q                        0,\E
          \s*
          \Q                        1));\E
          \s*
          \Q        content.addView(\E
          \s*
          \Q                map,\E
          \s*
          \Q                new LinearLayout.LayoutParams(\E
          \s*
          \Q                        -1,\E
          \s*
          \Q                        0,\E
          \s*
