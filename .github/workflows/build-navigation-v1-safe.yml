name: Navigation V1 Safe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation-v1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Foundation V1
        uses: actions/checkout@v4
        with:
          ref: 2c814a181d00cde9547a446927ae181e18cb9cbb
          fetch-depth: 1

      - name: Verify Foundation lock
        shell: bash
        run: |
          set -e
          test "$(git rev-parse HEAD)" = "2c814a181d00cde9547a446927ae181e18cb9cbb"
          echo "Foundation V1 LOCK PASS"

      - name: Verify source files
        shell: bash
        run: |
          set -e
          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$BASE/V10LauncherActivity.java"
          test -f "$BASE/V10CarActivity.java"

          grep -q 'package com.carassistant.v10;' "$BASE/V10LauncherActivity.java"
          grep -q 'package com.carassistant.v10;' "$BASE/V10CarActivity.java"

          echo "SOURCE STRUCTURE PASS"

      - name: Add MapLibre dependency
        shell: bash
        run: |
          set -e

          FILE="v10-source/app/build.gradle"

          if grep -q 'org.maplibre.gl:android-sdk' "$FILE"; then
            echo "MapLibre already present"
          else
            sed -i '/dependencies {/a\
    implementation "org.maplibre.gl:android-sdk:11.11.0"' "$FILE"
          fi

          grep -q 'org.maplibre.gl:android-sdk:11.11.0' "$FILE"
          echo "MAPLIBRE PASS"

      - name: Add location permissions
        shell: bash
        run: |
          set -e

          FILE="v10-source/app/src/main/AndroidManifest.xml"

          if ! grep -q 'android.permission.ACCESS_FINE_LOCATION' "$FILE"; then
            sed -i '/<manifest /a\
    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' "$FILE"
          fi

          if ! grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$FILE"; then
            sed -i '/<manifest /a\
    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' "$FILE"
          fi

          grep -q 'android.permission.ACCESS_FINE_LOCATION' "$FILE"
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$FILE"

          echo "LOCATION PERMISSION PASS"

      - name: Create NavigationMapView
        shell: bash
        run: |
          set -e

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"
          FILE="$BASE/NavigationMapView.java"

          mkdir -p "$BASE"

          if [ -f "$FILE" ]; then
            echo "NavigationMapView already exists"
            exit 0
          fi

          : > "$FILE"

          printf '%s\n' 'package com.carassistant.v10;' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' 'import android.Manifest;' >> "$FILE"
          printf '%s\n' 'import android.content.Context;' >> "$FILE"
          printf '%s\n' 'import android.content.pm.PackageManager;' >> "$FILE"
          printf '%s\n' 'import android.graphics.Color;' >> "$FILE"
          printf '%s\n' 'import android.location.Location;' >> "$FILE"
          printf '%s\n' 'import android.view.ViewGroup;' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' 'import androidx.annotation.NonNull;' >> "$FILE"
          printf '%s\n' 'import androidx.core.app.ActivityCompat;' >> "$FILE"
          printf '%s\n' 'import androidx.core.content.ContextCompat;' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' 'import org.maplibre.android.MapLibre;' >> "$FILE"
          printf '%s\n' 'import org.maplibre.android.camera.CameraUpdateFactory;' >> "$FILE"
          printf '%s\n' 'import org.maplibre.android.geometry.LatLng;' >> "$FILE"
          printf '%s\n' 'import org.maplibre.android.location.LocationComponentActivationOptions;' >> "$FILE"
          printf '%s\n' 'import org.maplibre.android.location.LocationComponentOptions;' >> "$FILE"
          printf '%s\n' 'import org.maplibre.android.maps.MapView;' >> "$FILE"
          printf '%s\n' 'import org.maplibre.android.maps.MapboxMap;' >> "$FILE"
          printf '%s\n' 'import org.maplibre.android.maps.Style;' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' 'public class NavigationMapView extends MapView {' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '    private static final int LOCATION_REQUEST = 4101;' >> "$FILE"
          printf '%s\n' '    private MapboxMap map;' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '    public NavigationMapView(Context context) {' >> "$FILE"
          printf '%s\n' '        super(context);' >> "$FILE"
          printf '%s\n' '        MapLibre.getInstance(context.getApplicationContext());' >> "$FILE"
          printf '%s\n' '        getMapAsync(this::onMapReady);' >> "$FILE"
          printf '%s\n' '    }' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '    private void onMapReady(@NonNull MapboxMap readyMap) {' >> "$FILE"
          printf '%s\n' '        map = readyMap;' >> "$FILE"
          printf '%s\n' '        map.getUiSettings().setCompassEnabled(false);' >> "$FILE"
          printf '%s\n' '        map.getUiSettings().setZoomGesturesEnabled(true);' >> "$FILE"
          printf '%s\n' '        map.getUiSettings().setScrollGesturesEnabled(true);' >> "$FILE"
          printf '%s\n' '        map.getUiSettings().setRotateGesturesEnabled(true);' >> "$FILE"
          printf '%s\n' '        map.getUiSettings().setTiltGesturesEnabled(false);' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '        map.setStyle("https://tiles.openfreemap.org/styles/liberty",' >> "$FILE"
          printf '%s\n' '                style -> enableLocation());' >> "$FILE"
          printf '%s\n' '    }' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '    private void enableLocation() {' >> "$FILE"
          printf '%s\n' '        Context context = getContext();' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '        if (ContextCompat.checkSelfPermission(context,' >> "$FILE"
          printf '%s\n' '                Manifest.permission.ACCESS_FINE_LOCATION)' >> "$FILE"
          printf '%s\n' '                != PackageManager.PERMISSION_GRANTED) {' >> "$FILE"
          printf '%s\n' '            if (context instanceof android.app.Activity) {' >> "$FILE"
          printf '%s\n' '                ActivityCompat.requestPermissions(' >> "$FILE"
          printf '%s\n' '                        (android.app.Activity) context,' >> "$FILE"
          printf '%s\n' '                        new String[]{' >> "$FILE"
          printf '%s\n' '                                Manifest.permission.ACCESS_FINE_LOCATION,' >> "$FILE"
          printf '%s\n' '                                Manifest.permission.ACCESS_COARSE_LOCATION},' >> "$FILE"
          printf '%s\n' '                        LOCATION_REQUEST);' >> "$FILE"
          printf '%s\n' '            }' >> "$FILE"
          printf '%s\n' '            return;' >> "$FILE"
          printf '%s\n' '        }' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '        LocationComponentOptions options =' >> "$FILE"
          printf '%s\n' '                LocationComponentOptions.builder(context).build();' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '        LocationComponentActivationOptions activation =' >> "$FILE"
          printf '%s\n' '                LocationComponentActivationOptions.builder(' >> "$FILE"
          printf '%s\n' '                        context, map.getStyle())' >> "$FILE"
          printf '%s\n' '                        .locationComponentOptions(options)' >> "$FILE"
          printf '%s\n' '                        .build();' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '        map.getLocationComponent().activateLocationComponent(activation);' >> "$FILE"
          printf '%s\n' '        map.getLocationComponent().setLocationComponentEnabled(true);' >> "$FILE"
          printf '%s\n' '    }' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '    public void zoomIn() {' >> "$FILE"
          printf '%s\n' '        if (map == null) return;' >> "$FILE"
          printf '%s\n' '        double zoom = map.getCameraPosition().zoom;' >> "$FILE"
          printf '%s\n' '        map.animateCamera(CameraUpdateFactory.zoomTo(zoom + 1.0), 250);' >> "$FILE"
          printf '%s\n' '    }' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '    public void zoomOut() {' >> "$FILE"
          printf '%s\n' '        if (map == null) return;' >> "$FILE"
          printf '%s\n' '        double zoom = map.getCameraPosition().zoom;' >> "$FILE"
          printf '%s\n' '        map.animateCamera(CameraUpdateFactory.zoomTo(zoom - 1.0), 250);' >> "$FILE"
          printf '%s\n' '    }' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '    public void recenter() {' >> "$FILE"
          printf '%s\n' '        if (map == null) return;' >> "$FILE"
          printf '%s\n' '        try {' >> "$FILE"
          printf '%s\n' '            Location location =' >> "$FILE"
          printf '%s\n' '                    map.getLocationComponent().getLastKnownLocation();' >> "$FILE"
          printf '%s\n' '            if (location == null) return;' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '            LatLng target = new LatLng(' >> "$FILE"
          printf '%s\n' '                    location.getLatitude(),' >> "$FILE"
          printf '%s\n' '                    location.getLongitude());' >> "$FILE"
          printf '%s\n' '' >> "$FILE"
          printf '%s\n' '            map.animateCamera(' >> "$FILE"
          printf '%s\n' '                    CameraUpdateFactory.newLatLngZoom(target, 16.0),' >> "$FILE"
          printf '%s\n' '                    500);' >> "$FILE"
          printf '%s\n' '        } catch (Exception ignored) {' >> "$FILE"
          printf '%s\n' '        }' >> "$FILE"
          printf '%s\n' '    }' >> "$FILE"
          printf '%s\n' '}' >> "$FILE"

          test -f "$FILE"
          grep -q 'class NavigationMapView' "$FILE"
          grep -q 'MapView' "$FILE"
          grep -q 'MapLibre' "$FILE"

          echo "NavigationMapView CREATE PASS"

      - name: Patch Launcher navigation block
        shell: bash
        run: |
          set -e

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"

          grep -q 'NavigationMapView' "$FILE" && {
            echo "Launcher already patched"
            exit 0
          }

          sed -i '/LinearLayout map =/,+25c\
        NavigationMapView navigationMap = new NavigationMapView(this);\
\
        content.addView(\
                navigationMap,\
                new LinearLayout.LayoutParams(\
                        -1,\
                        0,\
                        2));' "$FILE"

          grep -q 'NavigationMapView navigationMap' "$FILE"

          echo "Launcher patch PASS"

      - name: Patch Car navigation block
        shell: bash
        run: |
          set -e

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -q 'NavigationMapView' "$FILE" && {
            echo "Car activity already patched"
            exit 0
          }

          sed -i '/LinearLayout map =/,+25c\
        NavigationMapView navigationMap = new NavigationMapView(this);\
\
        content.addView(\
                navigationMap,\
                new LinearLayout.LayoutParams(\
                        -1,\
                        0,\
                        2));' "$FILE"

          grep -q 'NavigationMapView navigationMap' "$FILE"

          echo "Car activity patch PASS"

      - name: Verify Navigation V1
        shell: bash
        run: |
          set -e

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$BASE/NavigationMapView.java"

          grep -q 'NavigationMapView navigationMap' \
            "$BASE/V10LauncherActivity.java"

          grep -q 'NavigationMapView navigationMap' \
            "$BASE/V10CarActivity.java"

          git diff --check

          echo "NAVIGATION V1 SOURCE PASS"

      - name: Compile
        shell: bash
        working-directory: v10-source
        run: |
          set -e
          chmod +x gradlew
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon

      - name: Assemble APK
        shell: bash
        working-directory: v10-source
        run: |
          set -e
          ./gradlew :app:assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: carassistant-navigation-v1-safe
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
