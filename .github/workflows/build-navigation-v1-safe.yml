          grep -q 'NavigationMapView navigationMap' "$FILE"

          echo "V10CarActivity Navigation patch: PASS"

      # ============================================================
      # 9. VERIFY ONLY EXPECTED FILES CHANGED
      # ============================================================

      - name: Verify Navigation V1 changed files
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          git diff --name-only > /tmp/navigation-files.txt

          cat /tmp/navigation-files.txt

          EXPECTED_COUNT=5
          ACTUAL_COUNT="$(wc -l < /tmp/navigation-files.txt)"

          test "$ACTUAL_COUNT" -eq "$EXPECTED_COUNT"

          grep -Fxq \
            "v10-source/app/build.gradle" \
            /tmp/navigation-files.txt

          grep -Fxq \
            "v10-source/app/src/main/AndroidManifest.xml" \
            /tmp/navigation-files.txt

          grep -Fxq \
            "v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java" \
            /tmp/navigation-files.txt

          grep -Fxq \
            "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java" \
            /tmp/navigation-files.txt

          grep -Fxq \
            "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java" \
            /tmp/navigation-files.txt

          echo "Navigation V1 file scope: PASS"

      # ============================================================
      # 10. SAVE DIFF FOR AUDIT
      # ============================================================

      - name: Create Navigation V1 diff artifact
        shell: bash
        run: |
          set -euo pipefail

          git diff > navigation-v1.diff

          test -s navigation-v1.diff

          echo "Navigation V1 diff created."

      # ============================================================
      # 11. VERIFY FOUNDATION HEAD DID NOT MOVE
      # ============================================================

      - name: Final Foundation lock check before build
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="2c814a181d00cde9547a446927ae181e18cb9cbb"
          ACTUAL="$(git rev-parse HEAD)"

          test "$ACTUAL" = "$EXPECTED"

          echo "Foundation V1 remains locked."
          echo "HEAD=$ACTUAL"

      # ============================================================
      # 12. GRADLE CACHE
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ============================================================
      # 13. COMPILE JAVA FIRST
      # ============================================================

      - name: Compile Navigation V1
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --stacktrace \
            --no-daemon

      # ============================================================
      # 14. BUILD APK
      # ============================================================

      - name: Assemble Navigation V1 APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon

      # ============================================================
      # 15. COLLECT APK
      # ============================================================

      - name: Prepare Navigation V1 artifact
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find v10-source/app/build/outputs/apk/debug \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          test -n "$APK"
          test -f "$APK"

          cp "$APK" CarAssistant-Navigation-V1.apk

          sha256sum CarAssistant-Navigation-V1.apk \
            | tee Navigation-V1-SHA256.txt

          cat > Navigation-V1-BUILD-INFO.txt <<EOF
          CarAssistant Navigation V1
          Foundation: 2c814a181d00cde9547a446927ae181e18cb9cbb
          MapLibre Android SDK: 11.11.0
          Package: com.carassistant.v10
          Scope: Phone + Android Auto
          Features:
          - MapLibre map
          - GPS location
          - Vehicle marker
          - Recenter
          - Zoom in/out
          - Heading-up / North-up
          - Free pan
          - Floating transparent controls
          EOF

      # ============================================================
      # 16. UPLOAD APK + DIFF + INFO
      # ============================================================

      - name: Upload Navigation V1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-Navigation-V1
          path: |
            CarAssistant-Navigation-V1.apk
            Navigation-V1-SHA256.txt
            Navigation-V1-BUILD-INFO.txt
            navigation-v1.diff
          if-no-files-found: error

      # ============================================================
      # 17. FINAL SUCCESS CHECK
      # ============================================================

      - name: Navigation V1 final verification
        shell: bash
        run: |
          set -euo pipefail

          test -f CarAssistant-Navigation-V1.apk
          test -s CarAssistant-Navigation-V1.apk
          test -s navigation-v1.diff

          EXPECTED="2c814a181d00cde9547a446927ae181e18cb9cbb"
          ACTUAL="$(git rev-parse HEAD)"

          test "$ACTUAL" = "$EXPECTED"

          echo "========================================"
          echo "NAVIGATION V1 SAFE: PASS"
          echo "========================================"
          echo "Foundation V1: LOCKED"
          echo "Foundation HEAD: $ACTUAL"
          echo "APK: CarAssistant-Navigation-V1.apk"
          echo "========================================"
