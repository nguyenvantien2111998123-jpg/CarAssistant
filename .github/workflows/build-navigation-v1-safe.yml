name: Build Navigation V1 Safe - Phone + Android Auto

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation-v1:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT FOUNDATION V1 - KHÔNG ĐỤNG MAIN BASELINE
      # ============================================================
      - name: Checkout exact Foundation V1
        uses: actions/checkout@v4
        with:
          ref: 2c814a181d00cde9547a446927ae181e18cb9cbb
          fetch-depth: 1

      - name: Verify Foundation V1
        shell: bash
        run: |
          set -e

          EXPECTED="2c814a181d00cde9547a446927ae181e18cb9cbb"
          ACTUAL="$(git rev-parse HEAD)"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Foundation V1 mismatch"
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi

          echo "FOUNDATION V1 CHECK: PASS"
          echo "FOUNDATION COMMIT: $ACTUAL"


      # ============================================================
      # 2. APPLY ONLY NAVIGATION V1 WORKSPACE PATCH
      #    Không commit ngược vào Foundation V1
      # ============================================================
      - name: Apply Navigation V1 Safe patch
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/navigation-v1

          cat > /tmp/navigation-v1/navigation.patch <<'PATCH'
          diff --git a/v10-source/app/build.gradle b/v10-source/app/build.gradle
          --- a/v10-source/app/build.gradle
          +++ b/v10-source/app/build.gradle
          @@
           dependencies {
          +    implementation 'org.maplibre.gl:android-sdk:11.11.0'
          +
               // Xposed API: chỉ compile, runtime do LSPosed cung cấp (KHÔNG đóng gói).
               compileOnly files('libs/xposed-api-82.jar')

          diff --git a/v10-source/app/src/main/AndroidManifest.xml b/v10-source/app/src/main/AndroidManifest.xml
          --- a/v10-source/app/src/main/AndroidManifest.xml
          +++ b/v10-source/app/src/main/AndroidManifest.xml
          @@
           <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          +
          +    <uses-permission android:name="android.permission.INTERNET" />
          +    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
          +    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

          diff --git a/v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java b/v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java
          --- a/v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java
          +++ b/v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java
          @@
               private LinearLayout dock;
          +    private NavigationMapView navigationMap;

          @@
          -        LinearLayout map =
          -                card();
          -
          -        map.addView(
          -                text(
          -                        "MAP",
          -                        12,
          -                        Color.LTGRAY));
          -
          -        TextView mapText =
          -                text(
          -                        "Navigation",
          -                        28,
          -                        Color.WHITE);
          -
          -        mapText.setGravity(
          -                Gravity.CENTER);
          -
          -        map.addView(
          -                mapText,
          -                new LinearLayout.LayoutParams(
          -                        -1,
          -                        0,
          -                        1));
          +        NavigationMapView map =
          +                new NavigationMapView(this);
          +
          +        navigationMap = map;

          @@
               protected void onDestroy() {
          +
          +        if (navigationMap != null) {
          +            navigationMap.destroy();
          +            navigationMap = null;
          +        }

                   handler.removeCallbacks(
                           clockTicker);

                   super.onDestroy();
               }

          diff --git a/v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java b/v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java
          --- a/v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java
          +++ b/v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java
          @@
               private LinearLayout dock;
          +    private NavigationMapView navigationMap;

          @@
          -        LinearLayout map =
          -                card();
          -
          -        map.addView(
          -                text(
          -                        "MAP",
          -                        12,
          -                        Color.LTGRAY));
          -
          -        TextView mapText =
          -                text(
          -                        "Navigation",
          -                        28,
          -                        Color.WHITE);
          -
          -        mapText.setGravity(
          -                Gravity.CENTER);
          -
          -        map.addView(
          -                mapText,
          -                new LinearLayout.LayoutParams(
          -                        -1,
          -                        0,
          -                        1));
          +        NavigationMapView map =
          +                new NavigationMapView(this);
          +
          +        navigationMap = map;

          @@
               public void onDestroy() {
          +
          +        if (navigationMap != null) {
          +            navigationMap.destroy();
          +            navigationMap = null;
          +        }

                   resumed = false;

          diff --git /dev/null b/v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java
          --- /dev/null
          +++ b/v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java
          @@
          +package com.carassistant.v10;
          +
          +import android.Manifest;
          +import android.app.Activity;
          +import android.content.Context;
          +import android.content.pm.PackageManager;
          +import android.graphics.Color;
          +import android.graphics.Typeface;
          +import android.location.Location;
          +import android.location.LocationListener;
          +import android.location.LocationManager;
          +import android.os.Bundle;
          +import android.view.Gravity;
          +import android.view.View;
          +import android.widget.FrameLayout;
          +import android.widget.TextView;
          +
          +import org.maplibre.android.MapLibre;
          +import org.maplibre.android.camera.CameraPosition;
          +import org.maplibre.android.camera.CameraUpdateFactory;
          +import org.maplibre.android.geometry.LatLng;
          +import org.maplibre.android.maps.MapLibreMap;
          +import org.maplibre.android.maps.MapLibreMapOptions;
          +import org.maplibre.android.maps.MapView;
          +import org.maplibre.android.annotations.Marker;
          +import org.maplibre.android.annotations.MarkerOptions;
          +
          +public final class NavigationMapView extends FrameLayout {
          +
          +    private static final String STYLE =
          +            "https://tiles.openfreemap.org/styles/liberty";
          +
          +    private final Context context;
          +    private final LocationManager locationManager;
          +
          +    private MapView mapView;
          +    private MapLibreMap map;
          +    private Marker vehicleMarker;
          +
          +    private boolean follow = true;
          +    private boolean northUp = false;
          +    private boolean destroyed = false;
          +    private float lastBearing = 0f;
          +
          +    private final LocationListener locationListener =
          +            new LocationListener() {
          +
          +                @Override
          +                public void onLocationChanged(
          +                        Location location) {
          +                    updateVehicle(location);
          +                }
          +            };
          +
          +    public NavigationMapView(Context context) {
          +        super(context);
          +
          +        this.context = context;
          +
          +        setBackgroundColor(
          +                Color.TRANSPARENT);
          +
          +        locationManager =
          +                (LocationManager)
          +                        context.getSystemService(
          +                                Context.LOCATION_SERVICE);
          +
          +        MapLibre.getInstance(
          +                context.getApplicationContext());
          +
          +        buildMap();
          +    }
          +
          +    private void buildMap() {
          +
          +        MapLibreMapOptions options =
          +                MapLibreMapOptions
          +                        .createFromAttributes(
          +                                context);
          +
          +        mapView =
          +                new MapView(
          +                        context,
          +                        options);
          +
          +        mapView.onCreate(
          +                new Bundle());
          +
          +        addView(
          +                mapView,
          +                new FrameLayout.LayoutParams(
          +                        LayoutParams.MATCH_PARENT,
          +                        LayoutParams.MATCH_PARENT));
          +
          +        mapView.getMapAsync(
          +                readyMap -> {
          +
          +                    if (destroyed) {
          +                        return;
          +                    }
          +
          +                    map = readyMap;
          +
          +                    map.setStyle(STYLE);
          +
          +                    map.getUiSettings()
          +                            .setCompassEnabled(true);
          +
          +                    map.getUiSettings()
          +                            .setZoomGesturesEnabled(true);
          +
          +                    map.getUiSettings()
          +                            .setScrollGesturesEnabled(true);
          +
          +                    map.getUiSettings()
          +                            .setRotateGesturesEnabled(true);
          +
          +                    map.addOnCameraMoveStartedListener(
          +                            reason -> {
          +
          +                                if (reason
          +                                        != MapLibreMap
          +                                                .OnCameraMoveStartedListener
          +                                                .REASON_API_ANIMATION) {
          +                                    follow = false;
          +                                }
          +                            });
          +
          +                    addControls();
          +                    requestLocation();
          +                });
          +
          +        mapView.onStart();
          +        mapView.onResume();
          +    }
          +
          +    private void addControls() {
          +
          +        TextView title =
          +                control(
          +                        "NAVIGATION V1",
          +                        11);
          +
          +        title.setTypeface(
          +                Typeface.DEFAULT,
          +                Typeface.BOLD);
          +
          +        LayoutParams titleParams =
          +                new LayoutParams(
          +                        dp(150),
          +                        dp(42),
          +                        Gravity.TOP
          +                                | Gravity.START);
          +
          +        titleParams.setMargins(
          +                dp(12),
          +                dp(12),
          +                0,
          +                0);
          +
          +        addView(
          +                title,
          +                titleParams);
          +
          +        TextView zoomIn =
          +                control("+", 22);
          +
          +        LayoutParams plusParams =
          +                new LayoutParams(
          +                        dp(50),
          +                        dp(50),
          +                        Gravity.TOP
          +                                | Gravity.END);
          +
          +        plusParams.setMargins(
          +                0,
          +                dp(12),
          +                dp(12),
          +                0);
          +
          +        addView(
          +                zoomIn,
          +                plusParams);
          +
          +        zoomIn.setOnClickListener(
          +                v -> {
          +                    if (map != null) {
          +                        map.animateCamera(
          +                                CameraUpdateFactory.zoomIn(),
          +                                250);
          +                    }
          +                });
          +
          +        TextView zoomOut =
          +                control("-", 22);
          +
          +        LayoutParams minusParams =
          +                new LayoutParams(
          +                        dp(50),
          +                        dp(50),
          +                        Gravity.TOP
          +                                | Gravity.END);
          +
          +        minusParams.setMargins(
          +                0,
          +                dp(70),
          +                dp(12),
          +                0);
          +
          +        addView(
          +                zoomOut,
          +                minusParams);
          +
          +        zoomOut.setOnClickListener(
          +                v -> {
          +                    if (map != null) {
          +                        map.animateCamera(
          +                                CameraUpdateFactory.zoomOut(),
          +                                250);
          +                    }
          +                });
          +
          +        TextView recenter =
          +                control("◎", 22);
          +
          +        LayoutParams recenterParams =
          +                new LayoutParams(
          +                        dp(54),
          +                        dp(54),
          +                        Gravity.BOTTOM
          +                                | Gravity.END);
          +
          +        recenterParams.setMargins(
          +                0,
          +                0,
          +                dp(12),
          +                dp(12));
          +
          +        addView(
          +                recenter,
          +                recenterParams);
          +
          +        recenter.setOnClickListener(
          +                v -> {
          +                    follow = true;
          +
          +                    if (vehicleMarker != null) {
          +                        moveCamera(
          +                                vehicleMarker.getPosition(),
          +                                northUp
          +                                        ? 0f
          +                                        : lastBearing);
          +                    }
          +                });
          +
          +        TextView orientation =
          +                control("N", 16);
          +
          +        LayoutParams orientationParams =
          +                new LayoutParams(
          +                        dp(54),
          +                        dp(54),
          +                        Gravity.BOTTOM
          +                                | Gravity.START);
          +
          +        orientationParams.setMargins(
          +                dp(12),
          +                0,
          +                0,
          +                dp(12));
          +
          +        addView(
          +                orientation,
          +                orientationParams);
          +
          +        orientation.setOnClickListener(
          +                v -> {
          +
          +                    northUp = !northUp;
          +
          +                    orientation.setText(
          +                            northUp
          +                                    ? "N"
          +                                    : "↗");
          +
          +                    if (vehicleMarker != null) {
          +                        moveCamera(
          +                                vehicleMarker.getPosition(),
          +                                northUp
          +                                        ? 0f
          +                                        : lastBearing);
          +                    }
          +                });
          +    }
          +
          +    private TextView control(
          +            String value,
          +            float size) {
          +
          +        TextView view =
          +                new TextView(context);
          +
          +        view.setText(value);
          +        view.setTextSize(size);
          +        view.setTextColor(Color.WHITE);
          +        view.setGravity(Gravity.CENTER);
          +
          +        /*
          +         * TRANSPARENT FLOATING UI
          +         * Map remains visible underneath.
          +         */
          +        view.setBackgroundColor(
          +                0x99070B10);
          +
          +        view.setElevation(
          +                dp(6));
          +
          +        return view;
          +    }
          +
          +    private void requestLocation() {
          +
          +        if (!(context instanceof Activity)) {
          +            return;
          +        }
          +
          +        Activity activity =
          +                (Activity) context;
          +
          +        if (activity.checkSelfPermission(
          +                Manifest.permission.ACCESS_FINE_LOCATION)
          +                != PackageManager.PERMISSION_GRANTED) {
          +
          +            activity.requestPermissions(
          +                    new String[] {
          +                            Manifest.permission.ACCESS_FINE_LOCATION,
          +                            Manifest.permission.ACCESS_COARSE_LOCATION
          +                    },
          +                    7001);
          +
          +            return;
          +        }
          +
          +        startLocationUpdates();
          +    }
          +
          +    private void startLocationUpdates() {
          +
          +        if (locationManager == null) {
          +            return;
          +        }
          +
          +        try {
          +
          +            if (locationManager.isProviderEnabled(
          +                    LocationManager.GPS_PROVIDER)) {
          +
          +                locationManager.requestLocationUpdates(
          +                        LocationManager.GPS_PROVIDER,
          +                        1000L,
          +                        1f,
          +                        locationListener);
          +            }
          +
          +        } catch (SecurityException ignored) {
          +        }
          +
          +        try {
          +
          +            if (locationManager.isProviderEnabled(
          +                    LocationManager.NETWORK_PROVIDER)) {
          +
          +                locationManager.requestLocationUpdates(
          +                        LocationManager.NETWORK_PROVIDER,
          +                        2000L,
          +                        3f,
          +                        locationListener);
          +            }
          +
          +        } catch (SecurityException ignored) {
          +        }
          +
          +        Location last = null;
          +
          +        try {
          +
          +            if (locationManager.isProviderEnabled(
          +                    LocationManager.GPS_PROVIDER)) {
          +
          +                last =
          +                        locationManager
          +                                .getLastKnownLocation(
          +                                        LocationManager.GPS_PROVIDER);
          +            }
          +
          +        } catch (SecurityException ignored) {
          +        }
          +
          +        if (last != null) {
          +            updateVehicle(last);
          +        }
          +    }
          +
          +    private void updateVehicle(
          +            Location location) {
          +
          +        if (map == null
          +                || location == null) {
          +            return;
          +        }
          +
          +        LatLng position =
          +                new LatLng(
          +                        location.getLatitude(),
          +                        location.getLongitude());
          +
          +        if (vehicleMarker == null) {
          +
          +            vehicleMarker =
          +                    map.addMarker(
          +                            new MarkerOptions()
          +                                    .position(position)
          +                                    .title("Vehicle"));
          +
          +            moveCamera(
          +                    position,
          +                    location.hasBearing()
          +                            ? location.getBearing()
          +                            : 0f);
          +
          +            return;
          +        }
          +
          +        vehicleMarker.setPosition(
          +                position);
          +
          +        if (location.hasBearing()
          +                && location.getSpeed() > 1.0f) {
          +
          +            lastBearing =
          +                    location.getBearing();
          +        }
          +
          +        if (follow) {
          +
          +            moveCamera(
          +                    position,
          +                    northUp
          +                            ? 0f
          +                            : lastBearing);
          +        }
          +    }
          +
          +    private void moveCamera(
          +            LatLng position,
          +            float bearing) {
          +
          +        if (map == null
          +                || position == null) {
          +            return;
          +        }
          +
          +        CameraPosition camera =
          +                new CameraPosition.Builder()
          +                        .target(position)
          +                        .zoom(16.5)
          +                        .bearing(bearing)
          +                        .tilt(35)
          +                        .build();
          +
          +        map.animateCamera(
          +                CameraUpdateFactory
          +                        .newCameraPosition(
          +                                camera),
          +                450);
          +    }
          +
          +    private boolean hasLocationPermission() {
          +
          +        if (!(context instanceof Activity)) {
          +            return false;
          +        }
          +
          +        Activity activity =
          +                (Activity) context;
          +
          +        return activity.checkSelfPermission(
          +                Manifest.permission.ACCESS_FINE_LOCATION)
          +                == PackageManager.PERMISSION_GRANTED;
          +    }
          +
          +    private void stopLocationUpdates() {
          +
          +        if (locationManager == null) {
          +            return;
          +        }
          +
          +        try {
          +            locationManager.removeUpdates(
          +                    locationListener);
          +        } catch (SecurityException ignored) {
          +        }
          +    }
          +
          +    @Override
          +    protected void onDetachedFromWindow() {
          +
          +        stopLocationUpdates();
          +
          +        if (mapView != null
          +                && !destroyed) {
          +
          +            mapView.onPause();
          +            mapView.onStop();
          +        }
          +
          +        super.onDetachedFromWindow();
          +    }
          +
          +    public void destroy() {
          +
          +        if (destroyed) {
          +            return;
          +        }
          +
          +        destroyed = true;
          +
          +        stopLocationUpdates();
          +
          +        if (mapView != null) {
          +            mapView.onPause();
          +            mapView.onStop();
          +            mapView.onDestroy();
          +        }
          +    }
          +
          +    private int dp(float value) {
          +
          +        return Math.round(
          +                value
          +                        * getResources()
          +                                .getDisplayMetrics()
          +                                .density);
          +    }
          +}
          PATCH

          git apply --check /tmp/navigation-v1/navigation.patch
          git apply /tmp/navigation-v1/navigation.patch

          echo "NAVIGATION V1 PATCH: PASS"


      # ============================================================
      # 3. VERIFY PATCH KHÔNG ĐỘNG FOUNDATION
      # ============================================================
      - name: Verify Navigation V1 patch scope
        shell: bash
        run: |
          set -e

          CHANGED="$(git diff --name-only)"

          echo "Changed files:"
          echo "$CHANGED"

          echo "$CHANGED" | grep -q \
            "^v10-source/app/build.gradle$"

          echo "$CHANGED" | grep -q \
            "^v10-source/app/src/main/AndroidManifest.xml$"

          echo "$CHANGED" | grep -q \
            "^v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java$"

          echo "$CHANGED" | grep -q \
            "^v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java$"

          echo "$CHANGED" | grep -q \
            "^v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java$"

          COUNT="$(printf '%s\n' "$CHANGED" | sed '/^$/d' | wc -l)"

          if [ "$COUNT" -ne 5 ]; then
            echo "ERROR: Unexpected files changed"
            exit 1
          fi

          echo "PATCH SCOPE: PASS"


      # ============================================================
      # 4. VERIFY NO ROUTING / TURN-BY-TURN IN V1
      # ============================================================
      - name: Verify Navigation V1 scope
        shell: bash
        run: |
          set -e

          grep -q \
            "org.maplibre.gl:android-sdk:11.11.0" \
            v10-source/app/build.gradle

          grep -q \
            "tiles.openfreemap.org/styles/liberty" \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java

          grep -q \
            "ACCESS_FINE_LOCATION" \
            v10-source/app/src/main/AndroidManifest.xml

          grep -q \
            "follow = true" \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java

          grep -q \
            "northUp" \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java

          grep -q \
            "zoomIn" \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java

          grep -q \
            "zoomOut" \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java

          grep -q \
            "recenter" \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java

          echo "NAVIGATION V1 SCOPE: PASS"


      # ============================================================
      # 5. JAVA COMPILE
      # ============================================================
      - name: Compile Navigation V1
        working-directory: v10-source
        shell: bash
        run: |
          set -e

          chmod +x ./gradlew

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace

          echo "JAVA COMPILE: PASS"


      # ============================================================
      # 6. BUILD APK
      # ============================================================
      - name: Assemble Navigation V1 APK
        working-directory: v10-source
        shell: bash
        run: |
          set -e

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

          echo "APK ASSEMBLE: PASS"


      # ============================================================
      # 7. VERIFY APK
      # ============================================================
      - name: Verify APK output
        shell: bash
        run: |
          set -e

          APK="$(find \
            v10-source/app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK=$APK"

          test -s "$APK"

          echo "APK VERIFY: PASS"


      # ============================================================
      # 8. PACKAGE ARTIFACT
      # ============================================================
      - name: Package Navigation V1 artifact
        shell: bash
        run: |
          set -e

          mkdir -p navigation-v1

          APK="$(find \
            v10-source/app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          cp "$APK" \
            navigation-v1/CarAssistant-Navigation-V1.apk

          sha256sum \
            navigation-v1/CarAssistant-Navigation-V1.apk \
            | tee navigation-v1/SHA256SUM.txt

          cat > navigation-v1/BUILD_INFO.txt <<'INFO'
          BUILD=Navigation V1
