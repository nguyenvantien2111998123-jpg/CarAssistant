      # ============================================================
      # 8. REPLACE EXACT MAP BLOCK IN V10CARACTIVITY
      # ============================================================

      - name: Patch V10CarActivity Navigation block
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          perl -0pi -e '
          s{
          \Q        LinearLayout map =\E
          \s*
          \Q                card();\E
          \s*
          \Q        map.addView(\E
          \s*
