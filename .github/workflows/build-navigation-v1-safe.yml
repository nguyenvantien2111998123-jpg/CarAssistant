name: Build Navigation V1 Safe - Foundation Locked

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-navigation-v1:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT EXACT FOUNDATION V1
      # ============================================================

      - name: Checkout exact Foundation V1
        uses: actions/checkout@v4
        with:
          ref: 2c814a181d00cde9547a446927ae181e18cb9cbb
          fetch-depth: 0

      - name: Verify Foundation V1 commit
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="2c814a181d00cde9547a446927ae181e18cb9cbb"
          ACTUAL="$(git rev-parse HEAD)"

          echo "Expected Foundation:"
          echo "$EXPECTED"

          echo "Actual HEAD:"
          echo "$ACTUAL"

          test "$ACTUAL" = "$EXPECTED"

          echo "FOUNDATION V1 LOCK: PASS"

      # ============================================================
      # 2. VERIFY EXACT SOURCE STRUCTURE
      # ============================================================

      - name: Verify exact Foundation source structure
        shell: bash
        run: |
          set -euo pipefail

          LAUNCHER="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"
          CAR="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          test -f "$LAUNCHER"
          test -f "$CAR"

          grep -q '^package com\.carassistant\.v10;' "$LAUNCHER"
          grep -q '^package com\.carassistant\.v10;' "$CAR"

          grep -q 'public final class V10LauncherActivity' "$LAUNCHER"
          grep -q 'public final class V10CarActivity' "$CAR"

          echo "V10LauncherActivity: PASS"
          echo "V10CarActivity: PASS"
          echo "Package: com.carassistant.v10"

      # ============================================================
      # 3. VERIFY THE EXACT MAP PLACEHOLDER EXISTS
      # ============================================================

      - name: Verify exact Navigation placeholder
        shell: bash
        run: |
          set -euo pipefail

          LAUNCHER="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"
          CAR="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -q 'text(' "$LAUNCHER"
          grep -q '"Navigation"' "$LAUNCHER"

          grep -q 'text(' "$CAR"
          grep -q '"Navigation"' "$CAR"

          echo "Launcher Navigation placeholder: PASS"
          echo "Car Navigation placeholder: PASS"

      # ============================================================
      # 4. ADD MAPLIBRE DEPENDENCY
      # ============================================================

      - name: Add MapLibre dependency
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="v10-source/app/build.gradle"

          test -f "$GRADLE"

          grep -q 'dependencies[[:space:]]*{' "$GRADLE"

          if grep -q 'org.maplibre.gl:android-sdk:' "$GRADLE"; then
            echo "MapLibre dependency already exists."
          else
            perl -0pi -e \
              's/(dependencies\s*\{\s*\n)/$1    implementation "org.maplibre.gl:android-sdk:11.11.0"\n/' \
              "$GRADLE"
          fi

          grep -q 'org.maplibre.gl:android-sdk:11.11.0' "$GRADLE"

          echo "MapLibre dependency: PASS"

      # ============================================================
      # 5. ADD INTERNET + LOCATION PERMISSIONS
      # ============================================================

      - name: Add Navigation permissions
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            perl -0pi -e \
              's#(<manifest[^>]*>\s*)#$1    <uses-permission android:name="android.permission.INTERNET"/>\n#' \
              "$MANIFEST"
          fi

          if ! grep -q 'android.permission.ACCESS_FINE_LOCATION' "$MANIFEST"; then
            perl -0pi -e \
              's#(<manifest[^>]*>\s*)#$1    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n#' \
              "$MANIFEST"
          fi

          if ! grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$MANIFEST"; then
            perl -0pi -e \
              's#(<manifest[^>]*>\s*)#$1    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n#' \
              "$MANIFEST"
          fi

          grep -q 'android.permission.INTERNET' "$MANIFEST"
          grep -q 'android.permission.ACCESS_FINE_LOCATION' "$MANIFEST"
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$MANIFEST"

          echo "Navigation permissions: PASS"

      # ============================================================
      # 6. CREATE NAVIGATION MAP VIEW
      # ============================================================

      - name: Create NavigationMapView
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          cat > "$FILE" <<'JAVA'
package com.carassistant.v10;

import android.Manifest;
import android.app.Activity;
import android.content.Context;
import android.content.pm.PackageManager;
import android.graphics.Color;
import android.location.Location;
import android.location.LocationListener;
import android.location.LocationManager;
import android.os.Bundle;
import android.view.Gravity;
import android.view.View;
import android.widget.FrameLayout;
import android.widget.TextView;

import org.maplibre.android.MapLibre;
import org.maplibre.android.camera.CameraPosition;
import org.maplibre.android.geometry.LatLng;
import org.maplibre.android.maps.MapLibreMap;
import org.maplibre.android.maps.MapView;
import org.maplibre.android.maps.OnMapReadyCallback;

public final class NavigationMapView
        extends FrameLayout
        implements OnMapReadyCallback, LocationListener {

    private static final String STYLE_URL =
            "https://tiles.openfreemap.org/styles/liberty";

    private final MapView mapView;
    private final TextView vehicle;
    private final TextView recenter;
    private final TextView zoomIn;
    private final TextView zoomOut;
    private final TextView mode;

    private MapLibreMap map;
    private LocationManager locationManager;

    private boolean follow = true;
    private boolean headingUp = true;
    private boolean lifecycleStarted = false;
    private boolean locationStarted = false;

    private double lastLat = 0.0;
    private double lastLon = 0.0;
    private float lastBearing = 0.0f;

    public NavigationMapView(Context context) {
        super(context);

        MapLibre.getInstance(context.getApplicationContext());

        setBackgroundColor(Color.BLACK);

        mapView = new MapView(context);

        LayoutParams mapParams =
                new LayoutParams(
                        LayoutParams.MATCH_PARENT,
                        LayoutParams.MATCH_PARENT);

        addView(
                mapView,
                mapParams);

        vehicle = control(
                "▲",
                28);

        LayoutParams vehicleParams =
                new LayoutParams(
                        dp(64),
                        dp(64),
                        Gravity.CENTER);

        addView(
                vehicle,
                vehicleParams);

        recenter = control(
                "◎",
                25);

        LayoutParams recenterParams =
                new LayoutParams(
                        dp(58),
                        dp(58),
                        Gravity.BOTTOM | Gravity.END);

        recenterParams.setMargins(
                dp(0),
                dp(0),
                dp(18),
                dp(18));

        addView(
                recenter,
                recenterParams);

        zoomIn = control(
                "+",
                25);

        LayoutParams zoomInParams =
                new LayoutParams(
                        dp(52),
                        dp(52),
                        Gravity.TOP | Gravity.END);

        zoomInParams.setMargins(
                0,
                dp(18),
                dp(18),
                0);

        addView(
                zoomIn,
                zoomInParams);

        zoomOut = control(
                "−",
                25);

        LayoutParams zoomOutParams =
                new LayoutParams(
                        dp(52),
                        dp(52),
                        Gravity.TOP | Gravity.END);

        zoomOutParams.setMargins(
                0,
                dp(78),
                dp(18),
                0);

        addView(
                zoomOut,
                zoomOutParams);

        mode = control(
                "N",
                16);

        LayoutParams modeParams =
                new LayoutParams(
                        dp(52),
                        dp(52),
                        Gravity.TOP | Gravity.START);

        modeParams.setMargins(
                dp(18),
                dp(18),
                0,
                0);

        addView(
                mode,
                modeParams);

        recenter.setOnClickListener(
                v -> recenter());

        zoomIn.setOnClickListener(
                v -> zoom(1.0));

        zoomOut.setOnClickListener(
                v -> zoom(-1.0));

        mode.setOnClickListener(
                v -> toggleHeadingMode());

        mapView.onCreate(null);
        mapView.getMapAsync(this);
    }

    private TextView control(
            String value,
            float size) {

        TextView text =
                new TextView(getContext());

        text.setText(value);
        text.setTextColor(Color.WHITE);
        text.setTextSize(size);
        text.setGravity(Gravity.CENTER);

        text.setBackgroundColor(
                0x66000000);

        text.setElevation(
                dp(6));

        return text;
    }

    @Override
    public void onMapReady(
            MapLibreMap mapLibreMap) {

        map = mapLibreMap;

        map.setStyle(STYLE_URL);

        map.getUiSettings()
                .setCompassEnabled(false);

        map.getUiSettings()
                .setLogoEnabled(false);

        map.getUiSettings()
                .setAttributionEnabled(false);

        map.setCameraPosition(
                new CameraPosition.Builder()
                        .target(
                                new LatLng(
                                        12.666,
                                        108.037))
                        .zoom(12.0)
                        .build());

        startLocation();
    }

    private void startLocation() {

        if (locationStarted) {
            return;
        }

        Context context = getContext();

        if (!(context instanceof Activity)) {
            return;
        }

        Activity activity =
                (Activity) context;

        if (android.os.Build.VERSION.SDK_INT >= 23) {

            if (activity.checkSelfPermission(
                    Manifest.permission.ACCESS_FINE_LOCATION)
                    != PackageManager.PERMISSION_GRANTED
                    &&
                    activity.checkSelfPermission(
                    Manifest.permission.ACCESS_COARSE_LOCATION)
                    != PackageManager.PERMISSION_GRANTED) {

                activity.requestPermissions(
                        new String[] {
                                Manifest.permission.ACCESS_FINE_LOCATION,
                                Manifest.permission.ACCESS_COARSE_LOCATION
                        },
                        9001);

                return;
            }
        }

        locationManager =
                (LocationManager)
                        context.getSystemService(
                                Context.LOCATION_SERVICE);

        if (locationManager == null) {
            return;
        }

        try {

            if (locationManager.isProviderEnabled(
                    LocationManager.GPS_PROVIDER)) {

                locationManager.requestLocationUpdates(
                        LocationManager.GPS_PROVIDER,
                        500,
                        1.0f,
                        this);

                locationStarted = true;
            }

        } catch (SecurityException ignored) {
        }
    }

    private void stopLocation() {

        if (locationManager == null
                || !locationStarted) {
            return;
        }

        try {

            locationManager.removeUpdates(
                    this);

        } catch (SecurityException ignored) {
        }

        locationStarted = false;
    }

    @Override
    public void onLocationChanged(
            Location location) {

        lastLat = location.getLatitude();
        lastLon = location.getLongitude();

        if (location.hasBearing()) {
            lastBearing = location.getBearing();
        }

        updateVehicle();

        if (!follow || map == null) {
            return;
        }

        CameraPosition.Builder builder =
                new CameraPosition.Builder()
                        .target(
                                new LatLng(
                                        lastLat,
                                        lastLon))
                        .zoom(
                                Math.max(
                                        15.0,
                                        map.getCameraPosition()
                                                .zoom));

        if (headingUp) {
            builder.bearing(lastBearing);
        } else {
            builder.bearing(0.0);
        }

        map.animateCamera(
                org.maplibre.android.camera
                        .CameraUpdateFactory
                        .newCameraPosition(
                                builder.build()),
                500);
    }

    private void updateVehicle() {

        if (headingUp) {

            vehicle.setRotation(
                    lastBearing);

        } else {

            vehicle.setRotation(0.0f);
        }
    }

    private void recenter() {

        if (map == null) {
            return;
        }

        follow = true;

        if (lastLat == 0.0
                && lastLon == 0.0) {
            return;
        }

        CameraPosition.Builder builder =
                new CameraPosition.Builder()
                        .target(
                                new LatLng(
                                        lastLat,
                                        lastLon))
                        .zoom(16.0);

        if (headingUp) {
            builder.bearing(lastBearing);
        } else {
            builder.bearing(0.0);
        }

        map.animateCamera(
                org.maplibre.android.camera
                        .CameraUpdateFactory
                        .newCameraPosition(
                                builder.build()),
                500);
    }

    private void zoom(
            double amount) {

        if (map == null) {
            return;
        }

        double current =
                map.getCameraPosition()
                        .zoom;

        double next =
                Math.max(
                        3.0,
                        Math.min(
                                20.0,
                                current + amount));

        map.setZoom(
                next,
                null,
                250);
    }

    private void toggleHeadingMode() {

        headingUp = !headingUp;

        mode.setText(
                headingUp
                        ? "H"
                        : "N");

        updateVehicle();

        if (map == null) {
            return;
        }

        double bearing =
                headingUp
                        ? lastBearing
                        : 0.0;

        CameraPosition current =
                map.getCameraPosition();

        map.setCameraPosition(
                new CameraPosition.Builder()
                        .target(
                                current.target)
                        .zoom(
                                current.zoom)
                        .bearing(
                                bearing)
                        .tilt(
                                current.tilt)
                        .build());
    }

    @Override
    protected void onAttachedToWindow() {

        super.onAttachedToWindow();

        if (!lifecycleStarted) {

            lifecycleStarted = true;

            mapView.onStart();
            mapView.onResume();
        }

        startLocation();
    }

    @Override
    protected void onDetachedFromWindow() {

        stopLocation();

        if (lifecycleStarted) {

            mapView.onPause();
            mapView.onStop();
            mapView.onDestroy();

            lifecycleStarted = false;
        }

        super.onDetachedFromWindow();
    }

    @Override
    protected void onSizeChanged(
            int width,
            int height,
            int oldWidth,
            int oldHeight) {

        super.onSizeChanged(
                width,
                height,
                oldWidth,
                oldHeight);
    }

    private int dp(float value) {

        return Math.round(
                value
                        * getResources()
                                .getDisplayMetrics()
                                .density);
    }

    @Override
    public void onProviderEnabled(
            String provider) {
    }

    @Override
    public void onProviderDisabled(
            String provider) {
    }

    @Override
    public void onStatusChanged(
            String provider,
            int status,
            Bundle extras) {
    }

    @Override
    public void onDestroy() {
        stopLocation();
        super.onDetachedFromWindow();
    }
}
JAVA

          test -f "$FILE"

          grep -q '^package com\.carassistant\.v10;' "$FILE"
          grep -q 'org.maplibre.android.maps.MapView' "$FILE"
          grep -q 'org.maplibre.android.maps.MapLibreMap' "$FILE"
          grep -q 'org.maplibre.android.camera.CameraPosition' "$FILE"

          echo "NavigationMapView source: PASS"

      # ============================================================
      # 7. REPLACE EXACT MAP BLOCK IN V10LAUNCHERACTIVITY
      # ============================================================

      - name: Patch V10LauncherActivity Navigation block
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"

          perl -0pi -e '
          s{
          \Q        LinearLayout map =\E
          \s*
          \Q                card();\E
          \s*
          \Q        map.addView(\E
          \s*
          \Q                text(\E
          \s*
          \Q                        "MAP",\E
