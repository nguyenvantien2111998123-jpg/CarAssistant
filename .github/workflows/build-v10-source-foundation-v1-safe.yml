name: CarAssistant V10 - Source Foundation V1 Safe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install PyYAML
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check PyYAML

      - name: Restore exact Stable Base V1
        shell: bash
        run: |
          set -euo pipefail

          BASELINE="9075636a7d5947c1b0eee49c2bd3fd0e1b6b0cf1"

          git fetch origin "$BASELINE" --depth=1

          rm -rf v10-source

          git checkout "$BASELINE" -- v10-source

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$SRC/V10CarActivity.java"
          test -f "$SRC/V10ProjectionSession.java"
          test -f "$SRC/V10SessionStore.java"

          if [ -f "$SRC/V10ProjectionService.java" ]; then
            echo "ERROR: V10ProjectionService.java exists."
            exit 1
          fi

          echo "Stable Base V1 restored."
          echo "BASELINE=$BASELINE"

      - name: Rebuild Display Core V1 from Stable Freeze
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/run_core.py <<'PY'
          from pathlib import Path
          import subprocess
          import yaml
          import sys

          workflow = Path(
              ".github/workflows/build-v10-stable-base-freeze-v1.yml"
          )

          if not workflow.exists():
              print("ERROR: Stable Freeze workflow missing.")
              sys.exit(1)

          data = yaml.safe_load(
              workflow.read_text(encoding="utf-8")
          )

          steps = data["jobs"]["stable-base"]["steps"]

          wanted = "Create Display Core V1 from exact workflow"

          for step in steps:
              if step.get("name", "") == wanted:
                  run = step.get("run")
                  if not run:
                      print("ERROR: Display Core run block missing.")
                      sys.exit(1)

                  subprocess.run(
                      [
                          "bash",
                          "-euo",
                          "pipefail",
                          "-c",
                          run,
                      ],
                      check=True,
                  )

                  print("Display Core V1 restored.")
                  break
          else:
              print(
                  "ERROR: Stable Freeze Display Core step not found."
              )
              sys.exit(1)
          PY

          python3 /tmp/run_core.py

      - name: Apply Stable Floating Touch and SAFE Long Press
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/apply_stable_patches.py <<'PY'
          from pathlib import Path
          import subprocess
          import yaml
          import sys

          workflow = Path(
              ".github/workflows/build-v10-stable-base-freeze-v1.yml"
          )

          if not workflow.exists():
              print("ERROR: Stable Freeze workflow missing.")
              sys.exit(1)

          data = yaml.safe_load(
              workflow.read_text(encoding="utf-8")
          )

          wanted = {
              "Recover deleted Floating Touch workflow",
              "Apply historical Floating Touch patch",
              "Extract exact SAFE Long Press patch",
              "Apply exact SAFE Long Press patch",
          }

          found = set()

          for step in data["jobs"]["stable-base"]["steps"]:
              name = step.get("name", "")

              if name not in wanted:
                  continue

              run = step.get("run")

              if not run:
                  print("ERROR: missing run block:", name)
                  sys.exit(1)

              subprocess.run(
                  [
                      "bash",
                      "-euo",
                      "pipefail",
                      "-c",
                      run,
                  ],
                  check=True,
              )

              found.add(name)

          missing = wanted - found

          if missing:
              print("ERROR: missing Stable Freeze steps:")
              for item in sorted(missing):
                  print(" -", item)
              sys.exit(1)

          print(
              "Stable Freeze Floating Touch + SAFE Long Press applied."
          )
          PY

          python3 /tmp/apply_stable_patches.py

      - name: Source Structure Discovery
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          test -f "$FILE"

          echo "===== SOURCE STRUCTURE ====="

          grep -nE \
            "private void (buildMainLayout|buildDashboard|buildTransparentBottomBar|buildAppPanel)|private void rebuildAppGrid|private LinearLayout appTile" \
            "$FILE" || true

          echo "============================"

          if grep -Fq "private void buildMainLayout(" "$FILE"; then
            echo "HOME_LAYOUT_METHOD=buildMainLayout"
          elif grep -Fq "private void buildDashboard(" "$FILE"; then
            echo "HOME_LAYOUT_METHOD=buildDashboard"
          else
            echo "ERROR: No supported Home layout method found."
            echo "Expected buildMainLayout() or buildDashboard()."
            exit 1
          fi

          grep -Fq \
            "private void buildTransparentBottomBar(" \
            "$FILE"

          grep -Fq \
            "private void buildAppPanel(" \
            "$FILE"

          grep -Fq \
            "private void rebuildAppGrid(" \
            "$FILE"

          grep -Fq \
            "private LinearLayout appTile(" \
            "$FILE"

          echo "Actual source structure verified."

      - name: Freeze protected Core and Persistence files
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          sha256sum \
            "$SRC/V10DisplayController.java" \
            "$SRC/V10SurfaceManager.java" \
            "$SRC/V10TaskSession.java" \
            "$SRC/V10ProjectionSession.java" \
            "$SRC/V10SessionStore.java" \
            > /tmp/protected-before.sha256

          echo "Protected files fingerprinted."

      - name: Patch Source Foundation V1
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/patch_source_foundation.py <<'PY'
          from pathlib import Path
          import sys

          FILE = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          text = FILE.read_text(encoding="utf-8")
          original = text

          def find_method(source, signature):
              start = source.find(signature)

              if start < 0:
                  raise SystemExit(
                      "Method not found: " + signature
                  )

              brace = source.find("{", start)

              if brace < 0:
                  raise SystemExit(
                      "Opening brace not found: " + signature
                  )

              depth = 0
              in_string = False
              escaped = False
              line_comment = False
              block_comment = False

              i = brace

              while i < len(source):
                  c = source[i]
                  n = (
                      source[i + 1]
                      if i + 1 < len(source)
                      else ""
                  )

                  if line_comment:
                      if c == "\n":
                          line_comment = False

                  elif block_comment:
                      if c == "*" and n == "/":
                          block_comment = False
                          i += 1

                  elif in_string:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == '"':
                          in_string = False

                  else:
                      if c == "/" and n == "/":
                          line_comment = True
                          i += 1

                      elif c == "/" and n == "*":
                          block_comment = True
                          i += 1

                      elif c == '"':
                          in_string = True

                      elif c == "{":
                          depth += 1

                      elif c == "}":
                          depth -= 1

                          if depth == 0:
                              return start, i + 1

                  i += 1

              raise SystemExit(
                  "Closing brace not found: " + signature
              )

          # ------------------------------------------------------
          # HARD SAFETY:
          # This workflow must NEVER create or expect rebuildDock.
          # ------------------------------------------------------

          if "rebuildDock" in text:
              raise SystemExit(
                  "ERROR: rebuildDock already exists in source. "
                  "This Foundation workflow will not use it."
              )

          # ------------------------------------------------------
          # CLOCK / DATE declarations must remain.
          # ------------------------------------------------------

          required_clock = [
              "private TextView clock;",
              "private TextView date;",
              "private void updateClock()",
          ]

          for marker in required_clock:
              if marker not in text:
                  raise SystemExit(
                      "ERROR: required clock/date marker missing: "
                      + marker
                  )

          # ------------------------------------------------------
          # Required real-app icon imports.
          # ------------------------------------------------------

          if "import android.content.pm.ApplicationInfo;" not in text:
              marker = "import android.content.pm.ResolveInfo;"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: ResolveInfo import not found."
                  )

              text = text.replace(
                  marker,
                  marker
                  + "\n"
                  + "import android.content.pm.ApplicationInfo;",
                  1,
              )

          if "import android.widget.ImageView;" not in text:
              marker = "import android.widget.FrameLayout;"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: FrameLayout import not found."
                  )

              text = text.replace(
                  marker,
                  marker
                  + "\n"
                  + "import android.widget.ImageView;",
                  1,
              )

          # ------------------------------------------------------
          # Locate ACTUAL Home layout method.
          #
          # No invented method names.
          # ------------------------------------------------------

          if "private void buildMainLayout(" in text:
              home_signature = "private void buildMainLayout("
          elif "private void buildDashboard(" in text:
              home_signature = "private void buildDashboard("
          else:
              raise SystemExit(
                  "ERROR: actual Home layout method not found."
              )

          # ------------------------------------------------------
          # Only normalize the existing Home layout.
          #
          # No Voice functionality.
          # No Running Apps functionality.
          # No WYN functionality.
          # No Media functionality.
          #
          # The existing layout remains the source of truth.
          # ------------------------------------------------------

          start, end = find_method(text, home_signature)

          home = text[start:end]

          # Existing source already contains the sidebar structure.
          # We do NOT rebuild the entire architecture here.
          #
          # Only ensure four quick-app slots exist structurally.
          #
          # The actual app icons continue to be supplied by appTile()
          # and ApplicationInfo.loadIcon().
          #

          if home.count("sidebarButton(\"⭐\")") < 4:
              old_loop = """for (int i = 0; i < 3; i++) {
          """
              new_loop = """for (int i = 0; i < 4; i++) {
          """

              if old_loop in home:
                  home = home.replace(
                      old_loop,
                      new_loop,
                      1,
                  )
              else:
                  raise SystemExit(
                      "ERROR: Existing quick-app sidebar structure "
                      "was not found exactly."
                  )

          text = text[:start] + home + text[end:]

          # ------------------------------------------------------
          # Normalize the existing bottom bar.
          #
          # We keep this as PLACEHOLDER UI only.
          # No media API, WYN API or service is introduced.
          # ------------------------------------------------------

          start, end = find_method(
              text,
              "private void buildTransparentBottomBar("
          )

          bottom = text[start:end]

          if "Traffic Info" not in bottom:
              raise SystemExit(
                  "ERROR: expected existing traffic placeholder "
                  "was not found."
              )

          if '"Now playing"' not in bottom:
              raise SystemExit(
                  "ERROR: expected existing media placeholder "
                  "was not found."
              )

          # Existing implementation is intentionally preserved.
          # Foundation V1 does not add functionality here.

          # ------------------------------------------------------
          # Verify actual app tile implementation.
          # ------------------------------------------------------

          start, end = find_method(
              text,
              "private LinearLayout appTile("
          )

          app_tile = text[start:end]

          if "loadIcon(" not in app_tile:
              raise SystemExit(
                  "ERROR: appTile() does not use real app icons."
              )

          if "ApplicationInfo" not in app_tile:
              raise SystemExit(
                  "ERROR: appTile() ApplicationInfo marker missing."
              )

          if "launchProjection(" not in app_tile:
              raise SystemExit(
                  "ERROR: appTile() projection launch marker missing."
              )

          # ------------------------------------------------------
          # Verify app grid remains connected to appTile().
          # ------------------------------------------------------

          start, end = find_method(
              text,
              "private void rebuildAppGrid("
          )

          grid = text[start:end]

          if "appTile(app)" not in grid:
              raise SystemExit(
                  "ERROR: rebuildAppGrid() no longer calls appTile()."
              )

          # ------------------------------------------------------
          # Forbidden architecture checks.
          # ------------------------------------------------------

          forbidden = [
              "private void rebuildDock(",
              "V10ProjectionService",
              "am force-stop",
              'session.recents()',
              '"RECENTS"',
              '"2 SCREEN"',
              '"3 SCREEN"',
          ]

          for marker in forbidden:
              if marker in text:
                  raise SystemExit(
                      "ERROR: forbidden marker found: "
                      + marker
                  )

          if text == original:
              raise SystemExit(
                  "ERROR: Foundation patch produced no changes."
              )

          FILE.write_text(
              text,
              encoding="utf-8",
          )

          print(
              "Source Foundation V1 patch applied."
          )
          print(
              "Actual Home method:",
              home_signature
          )
          print(
              "No rebuildDock() used."
          )
          print(
              "No Voice functionality added."
          )
          print(
              "No Running Apps functionality added."
          )
          print(
              "No WYN functionality added."
          )
          print(
              "No Media functionality added."
          )
          PY

          python3 /tmp/patch_source_foundation.py

      - name: Verify Source Foundation V1
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          test -f "$FILE"

          echo "===== FINAL HOME SOURCE MAP ====="

          grep -nE \
            "private void (buildMainLayout|buildDashboard|buildTransparentBottomBar|buildAppPanel)|private void rebuildAppGrid|private LinearLayout appTile" \
            "$FILE"

          echo "================================="

          grep -Fq \
            "private TextView clock;" \
            "$FILE"

          grep -Fq \
            "private TextView date;" \
            "$FILE"

          grep -Fq \
            "private void updateClock()" \
            "$FILE"

          grep -Fq \
            "private void buildTransparentBottomBar(" \
            "$FILE"

          grep -Fq \
            "private void buildAppPanel(" \
            "$FILE"

          grep -Fq \
            "private void rebuildAppGrid(" \
            "$FILE"

          grep -Fq \
            "private LinearLayout appTile(" \
            "$FILE"

          grep -Fq \
            "ApplicationInfo" \
            "$FILE"

          grep -Fq \
            "loadIcon(" \
            "$FILE"

          grep -Fq \
            "ImageView" \
            "$FILE"

          if grep -Fq "rebuildDock" "$FILE"; then
            echo "ERROR: rebuildDock must not exist."
            exit 1
          fi

          if grep -Fq "V10ProjectionService" "$FILE"; then
            echo "ERROR: V10ProjectionService marker found."
            exit 1
          fi

          if grep -Fq "am force-stop" "$FILE"; then
            echo "ERROR: am force-stop found."
            exit 1
          fi

          if grep -Fq 'session.recents()' "$FILE"; then
            echo "ERROR: RECENTS logic found."
            exit 1
          fi

          if grep -Fq '"RECENTS"' "$FILE"; then
            echo "ERROR: RECENTS menu found."
            exit 1
          fi

          if grep -Fq '"2 SCREEN"' "$FILE"; then
            echo "ERROR: 2 SCREEN found."
            exit 1
          fi

          if grep -Fq '"3 SCREEN"' "$FILE"; then
            echo "ERROR: 3 SCREEN found."
            exit 1
          fi

          echo "Source Foundation V1 verification PASS."

      - name: Verify protected Core and Persistence isolation
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          sha256sum \
            "$SRC/V10DisplayController.java" \
            "$SRC/V10SurfaceManager.java" \
            "$SRC/V10TaskSession.java" \
            "$SRC/V10ProjectionSession.java" \
            "$SRC/V10SessionStore.java" \
            > /tmp/protected-after.sha256

          diff -u \
            /tmp/protected-before.sha256 \
            /tmp/protected-after.sha256

          echo "Core/Persistence isolation PASS."

      - name: Verify Floating Touch and SAFE Long Press
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq \
            "floatingTouchKey" \
            "$FILE"

          grep -Fq \
            "createFloatingTouchKey()" \
            "$FILE"

          grep -Fq \
            "floatingDownTime" \
            "$FILE"

          grep -Fq \
            "ViewConfiguration.getLongPressTimeout()" \
            "$FILE"

          grep -Fq \
            'addFloatingMenuButton("BACK"' \
            "$FILE"

          grep -Fq \
            'addFloatingMenuButton("HOME"' \
            "$FILE"

          if grep -Fq "floatingLastTap" "$FILE"; then
            echo "ERROR: old floatingLastTap remains."
            exit 1
          fi

          if grep -Fq 'session.recents()' "$FILE"; then
            echo "ERROR: RECENTS logic remains."
            exit 1
          fi

          echo "Floating Touch + SAFE Long Press integrity PASS."

      - name: Compile Java
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            compileDebugJavaWithJavac

      - name: Assemble APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Locate APK and SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find v10-source \
              -type f \
              -path '*/build/outputs/apk/*/*.apk' \
              -print \
              -quit
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          cp \
            "$APK" \
            CarAssistant-V10-Source-Foundation-V1-Safe.apk

          SHA="$(
            sha256sum \
              CarAssistant-V10-Source-Foundation-V1-Safe.apk \
              | awk '{print $1}'
          )"

          printf '%s\n' "$SHA" \
            > CarAssistant-V10-Source-Foundation-V1-Safe.sha256

          echo "APK:"
          echo "CarAssistant-V10-Source-Foundation-V1-Safe.apk"

          echo "SHA256:"
          echo "$SHA"

      - name: Create Source Foundation manifest
        shell: bash
        run: |
          set -euo pipefail

          cat > Source-Foundation-V1-SAFE-MANIFEST.txt <<'EOF'
          CarAssistant V10
          Source Foundation V1 SAFE

          SOURCE
          Based on Stable Base V1 used by run 37261451877.

          BASELINE
          9075636a7d5947c1b0eee49c2bd3fd0e1b6b0cf1

          HOME SOURCE
          Actual Home method is discovered from source.
          Supported:
          buildMainLayout()
          buildDashboard()

          IMPORTANT
          No rebuildDock() is used.
          No rebuildDock() is created.

          HOME UI
          Source structure normalized only.
          Existing app chooser preserved.
          Existing appTile() preserved.
          Real ApplicationInfo.loadIcon() preserved.

          CLOCK
          private TextView clock; preserved.
          private TextView date; preserved.
          updateClock() preserved.
          Clock/date are not recreated as Home UI widgets.

          NOT ADDED
          No real Voice.
          No real Running Apps.
          No real WYN.
          No real Media API.
          No RECENTS.
          No 2 SCREEN.
          No 3 SCREEN.

          PROTECTED
          V10DisplayController unchanged.
          V10SurfaceManager unchanged.
          V10TaskSession unchanged.
          V10ProjectionSession unchanged.
          V10SessionStore unchanged.

          FLOATING TOUCH
          Stable Freeze Floating Touch preserved.
          SAFE Long Press preserved.

          PURPOSE
          Establish an accurate source foundation before adding
          new Home UI functionality.
          EOF

      - name: Upload Source Foundation APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Source-Foundation-V1-Safe
          path: |
            CarAssistant-V10-Source-Foundation-V1-Safe.apk
            CarAssistant-V10-Source-Foundation-V1-Safe.sha256
            Source-Foundation-V1-SAFE-MANIFEST.txt
          if-no-files-found: error
          retention-days: 14
