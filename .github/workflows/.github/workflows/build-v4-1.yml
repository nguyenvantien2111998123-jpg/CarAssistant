name: Build Car Assistant V4.1.1

on:
  workflow_dispatch:

jobs:
  build-v4-1-1:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create V4.1.1 source
        run: |
          rm -rf v4-source
          cp -R v3-source v4-source

          sed -i 's/versionCode = 1/versionCode = 411/' v4-source/app/build.gradle.kts
          sed -i 's/versionName = "1.0"/versionName = "4.1.1"/' v4-source/app/build.gradle.kts

          cat > v4-source/app/src/main/java/com/carassistant/service/CarMediaService.kt <<'EOF'
package com.carassistant.service

import android.net.Uri
import androidx.media3.common.MediaItem
import androidx.media3.common.MediaMetadata
import androidx.media3.exoplayer.ExoPlayer
import androidx.media3.session.LibraryResult
import androidx.media3.session.MediaLibraryService
import androidx.media3.session.MediaSession
import com.google.common.collect.ImmutableList
import com.google.common.util.concurrent.Futures

class CarMediaService : MediaLibraryService() {

    private var player: ExoPlayer? = null
    private var session: MediaLibraryService.MediaLibrarySession? = null

    override fun onCreate() {
        super.onCreate()

        player = ExoPlayer.Builder(this).build()

        session = MediaLibraryService.MediaLibrarySession.Builder(
            this,
            player!!,
            LibraryCallback()
        )
            .setId("CarAssistantV411Session")
            .build()
    }

    override fun onGetSession(
        controllerInfo: MediaSession.ControllerInfo
    ): MediaLibraryService.MediaLibrarySession? {
        return session
    }

    override fun onDestroy() {
        session?.release()
        player?.release()

        session = null
        player = null

        super.onDestroy()
    }

    private class LibraryCallback :
        MediaLibraryService.MediaLibrarySession.Callback {

        override fun onGetLibraryRoot(
            session: MediaLibraryService.MediaLibrarySession,
            browser: MediaSession.ControllerInfo,
            params: MediaLibraryService.LibraryParams?
        ) = Futures.immediateFuture(
            LibraryResult.ofItem(
                MediaItem.Builder()
                    .setMediaId("root")
                    .setMediaMetadata(
                        MediaMetadata.Builder()
                            .setTitle("Car Assistant")
                            .setIsBrowsable(true)
                            .setIsPlayable(false)
                            .build()
                    )
                    .build(),
                params
            )
        )

        override fun onGetChildren(
            session: MediaLibraryService.MediaLibrarySession,
            browser: MediaSession.ControllerInfo,
            parentId: String,
            page: Int,
            pageSize: Int,
            params: MediaLibraryService.LibraryParams?
        ) = Futures.immediateFuture(
            LibraryResult.ofItemList(
                if (parentId == "root") {
                    ImmutableList.of(internetItem())
                } else {
                    ImmutableList.of()
                },
                params
            )
        )

        override fun onAddMediaItems(
            mediaSession: MediaSession,
            controller: MediaSession.ControllerInfo,
            mediaItems: List<MediaItem>
        ) = Futures.immediateFuture(
            mediaItems.map { requested ->
                when (requested.mediaId) {
                    "internet-audio" -> internetItem()
                    else -> requested
                }
            }
        )

        private fun internetItem(): MediaItem =
            MediaItem.Builder()
                .setMediaId("internet-audio")
                .setUri(
                    Uri.parse(
                        "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
                    )
                )
                .setMediaMetadata(
                    MediaMetadata.Builder()
                        .setTitle("Car Assistant Internet Test")
                        .setArtist("V4.1.1 - Internet Audio")
                        .setIsBrowsable(false)
                        .setIsPlayable(true)
                        .build()
                )
                .build()
    }
}
EOF

      - name: Show V4.1.1 source
        run: |
          echo "=== VERSION ==="
          grep -n "versionCode\|versionName" \
            v4-source/app/build.gradle.kts

          echo "=== MEDIA SERVICE ==="
          grep -n "internet-audio\|https://\|Internet Test" \
            v4-source/app/src/main/java/com/carassistant/service/CarMediaService.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: v4-source
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload V4.1.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: car-assistant-v4-1-1-debug-apk
          path: v4-source/app/build/outputs/apk/debug/app-debug.apk
