name: Build Car Assistant V10 UI Shell V1 - Frozen Core Isolated

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify V10CarActivity.java exists
        shell: bash
        run: |
          set -euo pipefail
          
          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"
          
          if [ ! -f "$SRC/V10CarActivity.java" ]; then
            echo "ERROR: V10CarActivity.java not found at $SRC/V10CarActivity.java"
            exit 1
          fi
          
          echo "✓ V10CarActivity.java exists"

      - name: Patch UI Shell V1
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          cat > /tmp/ui_shell_method.java <<'JAVA'
          private void buildDashboard() {

              dashboard = new LinearLayout(this);
              dashboard.setOrientation(
                      LinearLayout.VERTICAL);

              dashboard.setPadding(
                      dp(4),
                      dp(4),
                      dp(4),
                      dp(4));

              launcherLayer.addView(
                      dashboard,
                      new LinearLayout.LayoutParams(
                              -1,
                              -1));

              LinearLayout header =
                      new LinearLayout(this);

              header.setGravity(
                      Gravity.CENTER_VERTICAL);

              LinearLayout titleBox =
                      new LinearLayout(this);

              titleBox.setOrientation(
                      LinearLayout.VERTICAL);

              TextView title =
                      text(
                              "CAR ASSISTANT",
                              23,
                              Color.WHITE);

              title.setTypeface(
                      Typeface.DEFAULT,
                      Typeface.BOLD);

              date =
                      text(
                              "",
                              11,
                              Color.LTGRAY);

              titleBox.addView(title);
              titleBox.addView(date);

              header.addView(
                      titleBox,
                      new LinearLayout.LayoutParams(
                              0,
                              -2,
                              1));

              clock =
                      text(
                              "",
                              28,
                              Color.WHITE);

              clock.setGravity(
                      Gravity.CENTER);

              header.addView(
                      clock,
                      new LinearLayout.LayoutParams(
                              dp(120),
                              dp(58)));

              dashboard.addView(
                      header,
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(62)));

              TextView mode =
                      text(
                              "DRIVE  CONNECT  CONTROL",
                              12,
                              Color.LTGRAY);

              mode.setGravity(
                      Gravity.CENTER_VERTICAL);

              GradientDrawable modeBg =
                      new GradientDrawable();

              modeBg.setColor(
                      Color.rgb(
                              19,
                              25,
                              32));

              modeBg.setCornerRadius(
                      dp(12));

              mode.setBackground(modeBg);

              mode.setPadding(
                      dp(14),
                      0,
                      dp(14),
                      0);

              dashboard.addView(
                      mode,
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(42)));

              LinearLayout main =
                      new LinearLayout(this);

              main.setOrientation(
                      LinearLayout.VERTICAL);

              LinearLayout appsRow =
                      new LinearLayout(this);

              appsRow.setOrientation(
                      LinearLayout.HORIZONTAL);

              appsRow.setGravity(
                      Gravity.CENTER);

              TextView apps =
                      dashboardTile(
                              "APPS",
                              "Applications");

              apps.setOnClickListener(
                      v -> showApps());

              TextView voice =
                      dashboardTile(
                              "VOICE",
                              "Voice control");

              TextView tasks =
                      dashboardTile(
                              "TASKS",
                              "Recent tasks");

              tasks.setOnClickListener(
                      v -> showApps());

              appsRow.addView(
                      apps,
                      dashboardWeight());

              appsRow.addView(
                      voice,
                      dashboardWeight());

              appsRow.addView(
                      tasks,
                      dashboardWeight());

              main.addView(
                      appsRow,
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(100)));

              LinearLayout navigationRow =
                      new LinearLayout(this);

              navigationRow.setOrientation(
                      LinearLayout.HORIZONTAL);

              TextView navigation =
                      dashboardTile(
                              "NAVIGATION",
                              "Maps / route");

              navigation.setOnClickListener(
                      v -> showApps());

              TextView speed =
                      dashboardTile(
                              "SPEED",
                              "0 km/h");

              TextView weather =
                      dashboardTile(
                              "WEATHER",
                              "-- °C");

              navigationRow.addView(
                      navigation,
                      dashboardWeight());

              navigationRow.addView(
                      speed,
                      dashboardWeight());

              navigationRow.addView(
                      weather,
                      dashboardWeight());

              main.addView(
                      navigationRow,
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(100)));

              LinearLayout mediaRow =
                      new LinearLayout(this);

              mediaRow.setOrientation(
                      LinearLayout.HORIZONTAL);

              TextView media =
                      dashboardTile(
                              "MEDIA",
                              "No media");

              TextView allApps =
                      dashboardTile(
                              "ALL APPS",
                              "Application drawer");

              allApps.setOnClickListener(
                      v -> showApps());

              mediaRow.addView(
                      media,
                      dashboardWeight());

              mediaRow.addView(
                      allApps,
                      dashboardWeight());

              main.addView(
                      mediaRow,
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(100)));

              TextView core =
                      text(
                              "DISPLAY CORE V1",
                              11,
                              Color.LTGRAY);

              core.setGravity(
                      Gravity.CENTER);

              main.addView(
                      core,
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(32)));

              dashboard.addView(
                      main,
                      new LinearLayout.LayoutParams(
                              -1,
                              0,
                              1));

              LinearLayout dockRow =
                      new LinearLayout(this);

              dockRow.setGravity(
                      Gravity.CENTER_VERTICAL);

              dock =
                      new LinearLayout(this);

              dock.setGravity(
                      Gravity.CENTER_VERTICAL);

              dockRow.addView(
                      dock,
                      new LinearLayout.LayoutParams(
                              0,
                              -1,
                              1));

              TextView appsButton =
                      buttonText("APPS");

              appsButton.setOnClickListener(
                      v -> showApps());

              dockRow.addView(
                      appsButton,
                      new LinearLayout.LayoutParams(
                              dp(96),
                              dp(56)));

              dashboard.addView(
                      dockRow,
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(64)));
          }
          JAVA

          python3 - "$FILE" /tmp/ui_shell_method.java <<'PY'
          from pathlib import Path
          import sys

          source_path = Path(sys.argv[1])
          method_path = Path(sys.argv[2])

          source = source_path.read_text(encoding="utf-8")
          new_method = method_path.read_text(encoding="utf-8").rstrip()

          marker = "private void buildDashboard()"
          start = source.find(marker)

          if start < 0:
              raise SystemExit("ERROR: buildDashboard() not found.")

          opening = source.find("{", start)
          if opening < 0:
              raise SystemExit("ERROR: buildDashboard() opening brace not found.")

          depth = 0
          in_string = False
          escaped = False
          line_comment = False
          block_comment = False
          closing = -1

          i = opening

          while i < len(source):
              c = source[i]
              n = source[i + 1] if i + 1 < len(source) else ""

              if line_comment:
                  if c == "\n":
                      line_comment = False
              elif block_comment:
                  if c == "*" and n == "/":
                      block_comment = False
                      i += 1
              elif in_string:
                  if escaped:
                      escaped = False
                  elif c == "\\":
                      escaped = True
                  elif c == '"':
                      in_string = False
              else:
                  if c == "/" and n == "/":
                      line_comment = True
                      i += 1
                  elif c == "/" and n == "*":
                      block_comment = True
                      i += 1
                  elif c == '"':
                      in_string = True
                  elif c == "{":
                      depth += 1
                  elif c == "}":
                      depth -= 1
                      if depth == 0:
                          closing = i
                          break

              i += 1

          if closing < 0:
              raise SystemExit("ERROR: buildDashboard() closing brace not found.")

          patched = source[:start] + new_method + source[closing + 1:]
          source_path.write_text(patched, encoding="utf-8")
          print("PASS: buildDashboard() replaced.")
          PY

      - name: Verify patch was applied
        shell: bash
        run: |
          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          
          if grep -q "DRIVE  CONNECT  CONTROL" "$FILE"; then
            echo "✓ UI Shell V1 patch applied successfully"
          else
            echo "ERROR: UI Shell V1 patch verification failed"
            exit 1
          fi

      - name: Build summary
        shell: bash
        run: |
          echo "==== BUILD SUMMARY ===="
          echo "✓ Repository checked out"
          echo "✓ V10CarActivity.java verified"
          echo "✓ buildDashboard() method patched"
          echo "✓ UI Shell V1 build completed"
