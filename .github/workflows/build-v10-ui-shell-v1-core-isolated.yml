          }
          JAVA

          python3 - "$FILE" /tmp/ui_shell_method.java <<'PY'
          from pathlib import Path
          import sys

          source_path = Path(sys.argv[1])
          method_path = Path(sys.argv[2])

          source = source_path.read_text(
              encoding="utf-8"
          )

          new_method = method_path.read_text(
              encoding="utf-8"
          ).rstrip()

          marker = "private void buildDashboard()"

          start = source.find(marker)

          if start < 0:
              raise SystemExit(
                  "ERROR: buildDashboard() not found."
              )

          opening = source.find(
              "{",
              start
          )

          if opening < 0:
              raise SystemExit(
                  "ERROR: buildDashboard() opening brace not found."
              )

          depth = 0
          in_string = False
          escaped = False
          line_comment = False
          block_comment = False
          closing = -1

          i = opening

          while i < len(source):

              c = source[i]

              n = (
                  source[i + 1]
                  if i + 1 < len(source)
                  else ""
              )

              if line_comment:

                  if c == "\n":
                      line_comment = False

              elif block_comment:

                  if c == "*" and n == "/":
                      block_comment = False
                      i += 1

              elif in_string:

                  if escaped:
                      escaped = False

                  elif c == "\\":
                      escaped = True

                  elif c == '"':
                      in_string = False

              else:

                  if c == "/" and n == "/":
                      line_comment = True
                      i += 1

                  elif c == "/" and n == "*":
                      block_comment = True
                      i += 1

                  elif c == '"':
                      in_string = True

                  elif c == "{":
                      depth += 1

                  elif c == "}":
                      depth -= 1

                      if depth == 0:
                          closing = i
                          break

              i += 1

          if closing < 0:
              raise SystemExit(
                  "ERROR: buildDashboard() closing brace not found."
              )

          patched = (
              source[:start]
              + new_method
              + source[closing + 1:]
          )

          source_path.write_text(
              patched,
              encoding="utf-8"
          )

          print(
              "PASS: buildDashboard() replaced."
          )
          PY

      - name: Add UI Shell helper methods and Floating Touch
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])

          source = path.read_text(
              encoding="utf-8"
          )

          import_marker = "import android.os.Bundle;\n"

          imports = (
              "import android.os.SystemClock;\n"
              "import android.view.MotionEvent;\n"
              "import android.view.ViewConfiguration;\n"
          )

          if "import android.os.SystemClock;" not in source:

              if import_marker not in source:
                  raise SystemExit(
                      "ERROR: import marker not found."
                  )

              source = source.replace(
                  import_marker,
                  import_marker + imports,
                  1
              )

          field_marker = (
              "    private TextView date;\n"
          )

          fields = r'''

              private TextView floatingTouchKey;
              private LinearLayout floatingMenu;

              private boolean floatingDragging;
              private float floatingDownRawX;
              private float floatingDownRawY;
              private int floatingStartX;
              private int floatingStartY;
              private long floatingLastTap;
          '''

          if "private TextView floatingTouchKey;" not in source:

              if field_marker not in source:
                  raise SystemExit(
                      "ERROR: field marker not found."
                  )

              source = source.replace(
                  field_marker,
                  field_marker + fields,
                  1
              )

          helper_methods = r'''

              private LinearLayout.LayoutParams dashboardWeight() {

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  0,
                                  -1,
                                  1f);

                  params.setMargins(
                          dp(4),
                          dp(4),
                          dp(4),
                          dp(4));

                  return params;
              }

              private TextView dashboardTile(
                      String title,
                      String subtitle) {

                  TextView tile =
                          new TextView(this);

                  tile.setText(
                          title + "\n" + subtitle);

                  tile.setTextColor(
                          Color.WHITE);

                  tile.setTextSize(14);

                  tile.setGravity(
                          Gravity.CENTER);

                  tile.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD);

                  tile.setPadding(
                          dp(8),
                          dp(8),
                          dp(8),
                          dp(8));

                  GradientDrawable bg =
                          new GradientDrawable();

                  bg.setColor(
                          Color.rgb(
                                  22,
                                  29,
                                  37));

                  bg.setCornerRadius(
                          dp(16));

                  bg.setStroke(
                          dp(1),
                          Color.rgb(
                                  45,
                                  60,
                                  75));

                  tile.setBackground(bg);

                  return tile;
              }

              private void createFloatingTouchKey() {

                  if (floatingTouchKey != null) {
                      return;
                  }

                  floatingTouchKey =
                          new TextView(this);

                  floatingTouchKey.setText("≡");

                  floatingTouchKey.setTextColor(
                          Color.WHITE);

                  floatingTouchKey.setTextSize(28);

                  floatingTouchKey.setGravity(
                          Gravity.CENTER);

                  GradientDrawable bg =
                          new GradientDrawable();

                  bg.setColor(
                          Color.rgb(
                                  35,
                                  95,
                                  145));

                  bg.setCornerRadius(
                          dp(29));

                  bg.setStroke(
                          dp(2),
                          Color.rgb(
                                  80,
                                  170,
                                  230));

                  floatingTouchKey.setBackground(bg);

                  floatingTouchKey.setElevation(
                          dp(12));

                  final android.content.SharedPreferences prefs =
                          getSharedPreferences(
                                  "v10_floating_key",
                                  MODE_PRIVATE);

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  dp(58),
                                  dp(58),
                                  Gravity.TOP | Gravity.END);

                  int savedX =
                          prefs.getInt(
                                  "x",
                                  dp(18));

                  int savedY =
                          prefs.getInt(
                                  "y",
                                  dp(120));

                  params.setMargins(
                          0,
                          savedY,
                          savedX,
                          0);

                  projectionLayer.addView(
                          floatingTouchKey,
                          params);

                  floatingTouchKey.setOnTouchListener(
                          (view, event) -> {

                              switch (
                                      event.getActionMasked()) {

                                  case MotionEvent.ACTION_DOWN:

                                      floatingDragging =
                                              false;

                                      floatingDownRawX =
                                              event.getRawX();

                                      floatingDownRawY =
                                              event.getRawY();

                                      FrameLayout.LayoutParams
                                              downParams =
                                              (FrameLayout.LayoutParams)
                                                      view.getLayoutParams();

                                      floatingStartX =
                                              downParams.rightMargin;

                                      floatingStartY =
                                              downParams.topMargin;

                                      return true;

                                  case MotionEvent.ACTION_MOVE:

                                      float dx =
                                              event.getRawX()
                                                      - floatingDownRawX;

                                      float dy =
                                              event.getRawY()
                                                      - floatingDownRawY;

                                      if (!floatingDragging
                                              && Math.hypot(
                                                      dx,
                                                      dy)
                                                      > ViewConfiguration
                                                              .get(this)
                                                              .getScaledTouchSlop()) {

                                          floatingDragging =
                                                  true;
                                      }

                                      if (floatingDragging) {

                                          int width =
                                                  projectionLayer
                                                          .getWidth();

                                          int height =
                                                  projectionLayer
                                                          .getHeight();

                                          int keySize =
                                                  dp(58);

                                          int right =
                                                  Math.round(
                                                          floatingStartX
                                                                  - dx);

                                          int top =
                                                  Math.round(
                                                          floatingStartY
                                                                  + dy);

                                          right =
                                                  Math.max(
                                                          0,
                                                          Math.min(
                                                                  Math.max(
                                                                          0,
                                                                          width
                                                                                  - keySize),
                                                                  right));

                                          top =
                                                  Math.max(
                                                          0,
                                                          Math.min(
                                                                  Math.max(
                                                                          0,
                                                                          height
                                                                                  - keySize),
                                                                  top));

                                          FrameLayout.LayoutParams
                                                  moveParams =
                                                  (FrameLayout.LayoutParams)
                                                          view.getLayoutParams();

                                          moveParams.rightMargin =
                                                  right;

                                          moveParams.topMargin =
                                                  top;

                                          view.setLayoutParams(
                                                  moveParams);
                                      }

                                      return true;

                                  case MotionEvent.ACTION_UP:

                                      if (floatingDragging) {

                                          FrameLayout.LayoutParams
                                                  saveParams =
                                                  (FrameLayout.LayoutParams)
                                                          view.getLayoutParams();

                                          prefs.edit()
                                                  .putInt(
                                                          "x",
                                                          saveParams.rightMargin)
                                                  .putInt(
                                                          "y",
                                                          saveParams.topMargin)
                                                  .apply();

                                          floatingDragging =
                                                  false;

                                          return true;
                                      }

                                      long now =
                                              SystemClock
                                                      .uptimeMillis();

                                      long delta =
                                              now
                                                      - floatingLastTap;

                                      floatingLastTap =
                                              now;

                                      if (delta > 0
                                              && delta < 320) {

                                          handleControlHome();

                                          hideFloatingMenu();

                                      } else {

                                          showFloatingMenu();
                                      }

                                      view.performClick();

                                      return true;

                                  case MotionEvent.ACTION_CANCEL:

                                      floatingDragging =
                                              false;

                                      return true;

                                  default:
                                      return true;
                              }
                          });

                  floatingTouchKey.bringToFront();
              }

              private void showFloatingMenu() {

                  if (floatingMenu != null) {
                      hideFloatingMenu();
                      return;
                  }

                  floatingMenu =
                          new LinearLayout(this);

                  floatingMenu.setOrientation(
                          LinearLayout.VERTICAL);

                  floatingMenu.setPadding(
                          dp(8),
                          dp(8),
                          dp(8),
                          dp(8));

                  GradientDrawable menuBg =
                          new GradientDrawable();

                  menuBg.setColor(
                          Color.rgb(
                                  15,
                                  20,
                                  26));

                  menuBg.setCornerRadius(
                          dp(16));

                  menuBg.setStroke(
                          dp(1),
                          Color.rgb(
                                  65,
                                  85,
                                  105));

                  floatingMenu.setBackground(
                          menuBg);

                  floatingMenu.setElevation(
                          dp(14));

                  addFloatingMenuButton(
                          "BACK",
                          () -> {
                              handleControlBack();
                              hideFloatingMenu();
                          });

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  dp(170),
                                  -2,
                                  Gravity.TOP | Gravity.END);

                  params.setMargins(
                          0,
                          dp(70),
                          dp(18),
                          0);

                  projectionLayer.addView(
                          floatingMenu,
                          params);

                  floatingMenu.bringToFront();
                  floatingTouchKey.bringToFront();
              }

              private void addFloatingMenuButton(
                      String label,
                      Runnable action) {

                  TextView button =
                          new TextView(this);

                  button.setText(label);

                  button.setTextColor(
                          Color.WHITE);

                  button.setTextSize(14);

                  button.setGravity(
                          Gravity.CENTER);

                  GradientDrawable bg =
                          new GradientDrawable();

                  bg.setColor(
                          Color.rgb(
                                  28,
                                  38,
                                  48));

                  bg.setCornerRadius(
                          dp(10));

                  button.setBackground(bg);

                  button.setPadding(
                          dp(16),
                          0,
                          dp(16),
                          0);

                  button.setOnClickListener(
                          v -> action.run());

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(48));

                  params.setMargins(
                          0,
                          dp(3),
                          0,
                          dp(3));

                  floatingMenu.addView(
                          button,
                          params);
              }

              private void hideFloatingMenu() {

                  if (floatingMenu == null) {
                      return;
                  }

                  projectionLayer.removeView(
                          floatingMenu);

                  floatingMenu = null;
              }
          '''

          anchor =
                  "    public void handleControlBack()"

          if (
              "private void createFloatingTouchKey()"
              not in source
          ):

              if anchor not in source:
                  raise SystemExit(
                      "ERROR: handleControlBack() marker not found."
                  )

              source = source.replace(
                  anchor,
                  helper_methods
                  + "\n\n"
                  + anchor,
                  1
              )

          path.write_text(
              source,
              encoding="utf-8"
          )

          print(
              "PASS: UI helper + Floating Touch methods added."
          )
          PY

      - name: Verify UI Shell and Floating Touch markers
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          ACTIVITY="$SRC/V10CarActivity.java"
          SESSION="$SRC/V10ProjectionSession.java"

          grep -Fq 'CAR ASSISTANT' "$ACTIVITY"
          grep -Fq 'DRIVE  CONNECT  CONTROL' "$ACTIVITY"

          grep -Fq '"APPS"' "$ACTIVITY"
          grep -Fq '"VOICE"' "$ACTIVITY"
          grep -Fq '"TASKS"' "$ACTIVITY"
          grep -Fq '"NAVIGATION"' "$ACTIVITY"
          grep -Fq '"SPEED"' "$ACTIVITY"
          grep -Fq '"WEATHER"' "$ACTIVITY"
          grep -Fq '"MEDIA"' "$ACTIVITY"
          grep -Fq '"ALL APPS"' "$ACTIVITY"
          grep -Fq 'DISPLAY CORE V1' "$ACTIVITY"

          grep -Fq \
            'private TextView floatingTouchKey;' \
            "$ACTIVITY"

          grep -Fq \
            'private void createFloatingTouchKey()' \
            "$ACTIVITY"

          grep -Fq \
            'floatingDragging' \
            "$ACTIVITY"

          grep -Fq \
            'SystemClock.uptimeMillis()' \
            "$ACTIVITY"

          grep -Fq \
            'addFloatingMenuButton(' \
            "$ACTIVITY"

          grep -Fq \
            'handleControlBack();' \
            "$ACTIVITY"

          grep -Fq \
            'handleControlHome();' \
            "$ACTIVITY"

          grep -Fq -- \
            '--activity-reorder-to-front' \
            "$SRC/V10DisplayController.java"

          grep -Fq \
            'DisplayManager' \
            "$SESSION"

          grep -Fq \
            'RootShellSession' \
            "$SESSION"

          if grep -Fq \
              'V10ProjectionService' \
              "$SESSION"; then
            echo "ERROR: V10ProjectionService detected."
            exit 1
          fi

          if grep -Fq \
              'am force-stop' \
              "$SESSION"; then
            echo "ERROR: force-stop detected."
            exit 1
          fi

          if grep -Fq \
              '2 SCREEN' \
              "$ACTIVITY"; then
            echo "ERROR: 2 SCREEN detected."
            exit 1
          fi

          if grep -Fq \
              '3 SCREEN' \
              "$ACTIVITY"; then
            echo "ERROR: 3 SCREEN detected."
            exit 1
          fi

          if grep -Fq \
              'session.recents()' \
              "$ACTIVITY"; then
            echo "ERROR: recents() detected."
            exit 1
          fi

          echo "PASS: UI Shell + Floating Touch markers verified."

      - name: Verify Core files unchanged after UI patch
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          sha256sum \
            "$SRC/V10ProjectionSession.java" \
            "$SRC/V10DisplayController.java" \
            "$SRC/V10SurfaceManager.java" \
            "$SRC/V10TaskSession.java" \
            > /tmp/core-after-ui.sha256

          echo "Before UI patch:"
          cat /tmp/core-before-ui.sha256

          echo "After UI patch:"
          cat /tmp/core-after-ui.sha256

          diff -u \
            /tmp/core-before-ui.sha256 \
            /tmp/core-after-ui.sha256

          echo "PASS: Display Core V1 source is unchanged."

      - name: Verify Java source structure
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1]).read_text(
              encoding="utf-8"
          )

          required = [
              "private void buildDashboard()",
              "private LinearLayout.LayoutParams dashboardWeight()",
              "private TextView dashboardTile(",
              "private void createFloatingTouchKey()",
              "private void showFloatingMenu()",
              "private void addFloatingMenuButton(",
              "private void hideFloatingMenu()",
              "public void handleControlBack()",
              "public void handleControlHome()",
          ]

          for marker in required:

              count = source.count(marker)

              if count != 1:
                  raise SystemExit(
                      "ERROR: marker appears "
                      + str(count)
                      + " times: "
                      + marker
                  )

          print(
              "PASS: Java method structure is unique."
          )
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile Java
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            compileDebugJavaWithJavac

      - name: Build APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Locate APK and SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find v10-source \
              -type f \
              -path '*/build/outputs/apk/*/*.apk' \
              | head -n 1
          )"

          test -n "$APK"
          test -f "$APK"

          echo "APK=$APK"
          echo "APK SHA256:"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-UI-Shell-V1-Frozen-Core
          path: v10-source/**/build/outputs/apk/*/*.apk
          if-no-files-found: error
          retention-days: 14
