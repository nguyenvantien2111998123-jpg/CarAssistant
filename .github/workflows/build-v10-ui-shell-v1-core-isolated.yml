name: Build V10 Display Core V1 + Home UI V1 Safe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact V10-6A baseline
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="9075636a7d5947c1b0eee49c2bd3fd0e1b6b0cf1"

          git fetch --no-tags origin main
          git cat-file -e "${BASELINE}^{commit}"

          rm -rf v10-source
          git archive "${BASELINE}" v10-source | tar -x

          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

          echo "BASELINE_OK=${BASELINE}"

      - name: Check required source workflows
        shell: bash
        run: |
          set -euo pipefail

          test -f .github/workflows/build-v10-display-core-v1.yml
          test -f .github/workflows/build-v10-6a-floating-key-fix.yml
          test -f .github/workflows/build-v10-display-core-v1-floating-touch-longpress-safe.yml

          echo "SOURCE_WORKFLOWS_OK"

      - name: Rebuild Display Core V1 from known-good workflow
        shell: bash
        run: |
          set -euo pipefail

          python3 -c '
          import yaml, subprocess, sys

          path=".github/workflows/build-v10-display-core-v1.yml"
          data=yaml.safe_load(open(path, encoding="utf-8"))

          wanted={
              "Create V10 Display Core classes",
              "Replace V10ProjectionSession with Core V1 bridge",
              "Patch V10CarActivity lifecycle and HOME",
          }

          found=set()

          for step in data["jobs"]["build"]["steps"]:
              name=step.get("name","")
              if name not in wanted:
                  continue

              found.add(name)
              script=step.get("run")
              if not script:
                  raise SystemExit("Missing run block: "+name)

              if "${{" in script:
                  raise SystemExit("GitHub expression found in source step: "+name)

              print("EXECUTING:", name)
              subprocess.run(
                  ["bash","-euo","pipefail","-c",script],
                  check=True
              )

          missing=wanted-found
          if missing:
              raise SystemExit("Missing Display Core steps: "+str(sorted(missing)))

          print("DISPLAY_CORE_V1_OK")
          '

      - name: Apply known-good V10-6A Floating Touch base
        shell: bash
        run: |
          set -euo pipefail

          python3 -c '
          import yaml, subprocess, sys

          path=".github/workflows/build-v10-6a-floating-key-fix.yml"
          data=yaml.safe_load(open(path, encoding="utf-8"))

          wanted={
              "Patch V10CarActivity - imports",
              "Patch V10CarActivity - fields",
              "Patch V10CarActivity - create floating key call",
              "Patch V10CarActivity - floating key implementation",
          }

          found=set()

          for step in data["jobs"]["build"]["steps"]:
              name=step.get("name","")
              if name not in wanted:
                  continue

              found.add(name)
              script=step.get("run")
              if not script:
                  raise SystemExit("Missing run block: "+name)

              if "${{" in script:
                  raise SystemExit("GitHub expression found in source step: "+name)

              print("EXECUTING:", name)
              subprocess.run(
                  ["bash","-euo","pipefail","-c",script],
                  check=True
              )

          missing=wanted-found
          if missing:
              raise SystemExit("Missing Floating Touch steps: "+str(sorted(missing)))

          print("FLOATING_TOUCH_BASE_OK")
          '

      - name: Apply known-good SAFE Long Press listener
        shell: bash
        run: |
          set -euo pipefail

          python3 -c '
          import yaml, subprocess, sys

          path=".github/workflows/build-v10-display-core-v1-floating-touch-longpress-safe.yml"
          data=yaml.safe_load(open(path, encoding="utf-8"))

          wanted={
              "Replace the entire Floating Touch listener with SAFE long-press version"
          }

          found=set()

          for step in data["jobs"]["build"]["steps"]:
              name=step.get("name","")
              if name not in wanted:
                  continue

              found.add(name)
              script=step.get("run")
              if not script:
                  raise SystemExit("Missing run block: "+name)

              if "${{" in script:
                  raise SystemExit("GitHub expression found in source step: "+name)

              print("EXECUTING:", name)
              subprocess.run(
                  ["bash","-euo","pipefail","-c",script],
                  check=True
              )

          missing=wanted-found
          if missing:
              raise SystemExit("Missing SAFE Long Press step: "+str(sorted(missing)))

          print("SAFE_LONG_PRESS_OK")
          '

      - name: Remove obsolete 2-screen and 3-screen helpers
        shell: bash
        run: |
          set -euo pipefail

          python3 -c '
          from pathlib import Path
          import re

          p=Path("v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java")
          s=p.read_text(encoding="utf-8")

          def remove_method(src, name):
              pattern=r"(?ms)^[ \t]*(?:private|protected|public)?[ \t]*(?:static[ \t]+)?(?:void|boolean|int|long|float|double|String|[A-Za-z0-9_<>,.? ]+)[ \t]+"+re.escape(name)+r"[ \t]*\([^;{}]*\)[ \t]*\{"

              m=re.search(pattern, src)
              if not m:
                  return src

              start=m.start()
              brace=src.find("{",m.start(),m.end())
              depth=0
              i=brace

              while i<len(src):
                  if src[i]=="{":
                      depth+=1
                  elif src[i]=="}":
                      depth-=1
                      if depth==0:
                          end=i+1
                          while end<len(src) and src[end] in " \t\r\n":
                              end+=1
                          return src[:start]+src[end:]
                  i+=1

              raise RuntimeError("Unclosed method: "+name)

          for method_name in [
              "switchToTwoScreen",
              "switchToThreeScreen"
          ]:
              s=remove_method(s,method_name)

          p.write_text(s,encoding="utf-8")

          print("OBSOLETE_SCREEN_HELPERS_REMOVED")
          '

      - name: Freeze Display Core and Persistence hashes
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/v10-protected-before

          for f in \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10InputController.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/RootView.java
          do
            test -f "$f"
            sha256sum "$f"
          done > /tmp/v10-protected-before/hashes.txt

          cp /tmp/v10-protected-before/hashes.txt /tmp/v10-protected-before/hashes-reference.txt

          echo "PROTECTED_HASHES_FROZEN"
          cat /tmp/v10-protected-before/hashes.txt

      - name: Patch Home UI only
        shell: bash
        run: |
          set -euo pipefail

          python3 -c '
          from pathlib import Path
          import subprocess
          import re

          target=Path("v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java")

          current=target.read_text(encoding="utf-8")

          result=subprocess.run(
              [
                  "git",
                  "show",
                  "main:v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
              ],
              capture_output=True,
              text=True,
              check=True
          )

          source=result.stdout

          def find_method(src,name):
              pattern=r"(?m)^[ \t]*(?:private|protected|public)[ \t]+(?:static[ \t]+)?[A-Za-z0-9_<>,.? \[\]]+[ \t]+"+re.escape(name)+r"[ \t]*\([^;{}]*\)[ \t]*\{"

              m=re.search(pattern,src)
              if not m:
                  raise RuntimeError("Cannot find method: "+name)

              brace=src.find("{",m.start(),m.end())
              depth=0
              i=brace
              in_string=False
              quote=""
              escape=False
              line_comment=False
              block_comment=False

              while i<len(src):
                  c=src[i]
                  n=src[i+1] if i+1<len(src) else ""

                  if line_comment:
                      if c=="\n":
                          line_comment=False
                  elif block_comment:
                      if c=="*" and n=="/":
                          block_comment=False
                          i+=1
                  elif in_string:
                      if escape:
                          escape=False
                      elif c=="\\":
                          escape=True
                      elif c==quote:
                          in_string=False
                  else:
                      if c=="/" and n=="/":
                          line_comment=True
                          i+=1
                      elif c=="/" and n=="*":
                          block_comment=True
                          i+=1
                      elif c in "\"'":
                          in_string=True
                          quote=c
                      elif c=="{":
                          depth+=1
                      elif c=="}":
                          depth-=1
                          if depth==0:
                              return m.start(),i+1

                  i+=1

              raise RuntimeError("Unclosed method: "+name)

          methods=[
              "buildUi",
              "buildMainLayout",
              "buildTransparentBottomBar",
              "sidebarButton",
              "spacer",
              "buttonText",
              "text",
              "initial",
              "dp"
          ]

          replacements=[]

          for name in methods:
              a,b=find_method(source,name)
              replacements.append((a,b,source[a:b],name))

          for a,b,body,name in sorted(replacements,reverse=True):
              ca,cb=find_method(current,name)
              current=current[:ca]+body+current[cb:]

          if "private LinearLayout bottomBar;" not in current:
              anchor="private LinearLayout mainLayout;"
              if anchor in current:
                  current=current.replace(
                      anchor,
                      anchor+"\\n    private LinearLayout bottomBar;",
                      1
                  )
              else:
                  raise RuntimeError("Could not find UI field anchor")

          target.write_text(current,encoding="utf-8")

          print("HOME_UI_PATCH_OK")
          '

      - name: Verify Core and Persistence files unchanged
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/v10-protected-after

          for f in \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10InputController.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/RootView.java
          do
            test -f "$f"
            sha256sum "$f"
          done > /tmp/v10-protected-after/hashes.txt

          diff -u \
            /tmp/v10-protected-before/hashes.txt \
            /tmp/v10-protected-after/hashes.txt

          echo "CORE_PERSISTENCE_PROTECTED_OK"

      - name: Verify final source safety
        shell: bash
        run: |
          set -euo pipefail

          ACTIVITY="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          test -f "$ACTIVITY"

          if grep -nE \
            'session\.recents\(\)|"RECENTS"|"2 SCREEN"|"3 SCREEN"|switchToTwoScreen|switchToThreeScreen|V10ProjectionService|am force-stop' \
            "$ACTIVITY"
          then
            echo "UNSAFE_LEGACY_CODE_FOUND"
            exit 1
          fi

          if grep -RInE \
            'am force-stop|session\.recents\(\)|"RECENTS"|switchToTwoScreen|switchToThreeScreen' \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10InputController.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/RootView.java
          then
            echo "UNSAFE_CORE_CODE_FOUND"
            exit 1
          fi

          echo "FINAL_SOURCE_SAFETY_OK"

      - name: Compile Java
        shell: bash
        working-directory: v10-source
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace compileDebugJavaWithJavac

      - name: Assemble APK
        shell: bash
        working-directory: v10-source
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find v10-source -type f -name '*.apk' | head -n 1)"

          test -n "$APK"
          test -f "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK_FOUND=$APK"

      - name: SHA256 APK
        shell: bash
        run: |
          set -euo pipefail

          sha256sum "$APK_PATH" | tee v10-apk-sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-DisplayCoreV1-HomeUIV1-Safe
          path: |
            ${{ env.APK_PATH }}
            v10-apk-sha256.txt
          if-no-files-found: error

      - name: Final build report
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CARASSISTANT V10 SAFE BUILD COMPLETE"
          echo "========================================"
          echo "Baseline: 9075636a7d5947c1b0eee49c2bd3fd0e1b6b0cf1"
          echo "Display Core V1: OK"
          echo "Floating Touch: OK"
          echo "Long Press: OK"
          echo "Home UI V1: OK"
          echo "Core/Persistence protection: OK"
          echo "Java compile: OK"
          echo "APK assemble: OK"
          echo "APK: $APK_PATH"
          echo "SHA256:"
          cat v10-apk-sha256.txt
          echo "========================================"
