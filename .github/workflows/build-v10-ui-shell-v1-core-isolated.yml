name: Build Car Assistant V10 UI Shell V1 - Frozen Core Isolated

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore exact tested Core V1 + Floating Touch source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_REF="953d6c61664530a94c1813b9335a97d08c212611"
          SOURCE_WORKFLOW=".github/workflows/build-v10-display-core-v1-floating-touch-fixed.yml"
          EXPECTED_WORKFLOW_SHA="f8abedfc4491205028f6d75456fe2fda80f232ff"

          git fetch origin "$SOURCE_REF" --depth=1

          git show "$SOURCE_REF:$SOURCE_WORKFLOW" > /tmp/frozen-floating.yml

          ACTUAL_WORKFLOW_SHA="$(git hash-object /tmp/frozen-floating.yml)"

          echo "Frozen source workflow SHA: $ACTUAL_WORKFLOW_SHA"

          if [ "$ACTUAL_WORKFLOW_SHA" != "$EXPECTED_WORKFLOW_SHA" ]; then
            echo "ERROR: Frozen source workflow changed."
            exit 1
          fi

          python3 -m pip install --quiet pyyaml

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          wf = Path("/tmp/frozen-floating.yml")

          data = yaml.safe_load(
              wf.read_text(encoding="utf-8")
          )

          steps = data["jobs"]["build"]["steps"]

          allowed = [
              "Restore exact V10-6A baseline",
              "Verify V10-6A baseline",
              "Create Display Core V1 classes",
              "Replace ProjectionSession with Display Core V1 bridge",
              "Patch V10CarActivity with Floating Touch only",
              "Verify only allowed Floating Touch changes",
          ]

          selected = {
              step.get("name"): step
              for step in steps
              if step.get("name") in allowed
          }

          missing = [
              name
              for name in allowed
              if name not in selected
          ]

          if missing:
              raise SystemExit(
                  "Missing frozen steps: "
                  + ", ".join(missing)
              )

          for name in allowed:
              command = selected[name].get("run")

              if not command:
                  raise SystemExit(
                      "Frozen step has no run command: "
                      + name
                  )

              print("FROZEN > " + name)

              subprocess.run(
                  [
                      "bash",
                      "-euo",
                      "pipefail",
                      "-c",
                      command,
                  ],
                  check=True,
              )

          print(
              "Frozen Core V1 + Floating Touch "
              "source reconstruction PASSED."
          )
          PY

      - name: Save frozen Core checksums
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$SRC/V10TaskSession.java"
          test -f "$SRC/V10DisplayController.java"
          test -f "$SRC/V10SurfaceManager.java"
          test -f "$SRC/V10ProjectionSession.java"
          test -f "$SRC/V10CarActivity.java"

          sha256sum \
            "$SRC/V10ProjectionSession.java" \
            "$SRC/V10DisplayController.java" \
            "$SRC/V10SurfaceManager.java" \
            "$SRC/V10TaskSession.java" \
            > /tmp/core-before-ui.sha256

          cat /tmp/core-before-ui.sha256

          grep -Fq \
            'private TextView floatingTouchKey;' \
            "$SRC/V10CarActivity.java"

          grep -Fq \
            'private void createFloatingTouchKey()' \
            "$SRC/V10CarActivity.java"

          grep -Fq \
            'floatingDragging' \
            "$SRC/V10CarActivity.java"

          grep -Fq \
            'SystemClock.uptimeMillis()' \
            "$SRC/V10CarActivity.java"

      - name: Patch UI Shell V1
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          cat > /tmp/ui_shell_method.java <<'JAVA'
          private void buildDashboard() {

