name: Validate Car Assistant V10 Home UI - No Patch

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Enable verbose logging'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Setup environment
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Build Environment ==="
          echo "Java:"
          java -version 2>&1 | head -3
          echo "Python:"
          python3 --version
          echo "Git:"
          git --version

      - name: ✅ Verify project structure
        shell: bash
        run: |
          set -euo pipefail
          
          echo "📁 Checking V10 source layout..."
          
          BASE_PATH="v10-source/app/src/main/java/com/hieptran/aacast/doudou"
          
          # Core files to verify
          declare -A files=(
            ["V10CarActivity.java"]="Main Activity - Home UI"
            ["V10ProjectionSession.java"]="Projection Engine"
            ["V10SessionStore.java"]="Session Persistence"
            ["V10ControlReceiver.java"]="Control Receiver"
            ["V10LauncherActivity.java"]="Launcher Activity"
            ["V10InputController.java"]="Input Controller"
          )
          
          echo ""
          for file in "${!files[@]}"; do
            desc="${files[$file]}"
            if [ -f "$BASE_PATH/$file" ]; then
              size=$(wc -c < "$BASE_PATH/$file")
              lines=$(wc -l < "$BASE_PATH/$file")
              printf "✓ %-35s %s (%d lines, %d bytes)\n" "$file" "$desc" "$lines" "$size"
            else
              echo "❌ MISSING: $file - $desc"
              exit 1
            fi
          done
          
          echo ""
          echo "✅ All core source files verified"

      - name: 🔎 Validate V10CarActivity.java
        shell: bash
        run: |
          set -euo pipefail
          
          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          
          echo "📋 Analyzing V10CarActivity.java..."
          echo ""
          
          # Check package declaration
          echo "Package check:"
          if grep -q "^package com.carassistant.v10" "$FILE"; then
            package=$(grep "^package" "$FILE")
            echo "  ✓ $package"
          else
            echo "  ❌ Package declaration not found or incorrect"
            exit 1
          fi
          
          echo ""
          echo "Class declaration:"
          if grep -q "public final class V10CarActivity" "$FILE"; then
            echo "  ✓ V10CarActivity found"
          else
            echo "  ❌ Class not found"
            exit 1
          fi
          
          echo ""
          echo "Key imports:"
          imports=(
            "android.widget.LinearLayout"
            "android.widget.FrameLayout"
            "android.widget.TextView"
            "android.graphics.Color"
            "android.os.Handler"
            "android.os.Looper"
            "com.google.android.apps.auto.sdk.CarActivity"
          )
          
          for imp in "${imports[@]}"; do
            if grep -q "import.*$imp" "$FILE"; then
              echo "  ✓ $imp"
            else
              echo "  ⚠ Missing: $imp"
            fi
          done
          
          echo ""
          echo "✅ V10CarActivity.java structure valid"

      - name: 📊 Validate core UI methods
        shell: bash
        run: |
          set -euo pipefail
          
          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          
          echo "🎨 Checking UI methods..."
          echo ""
          
          declare -A methods=(
            ["buildUi"]="Build main UI"
            ["buildDashboard"]="Build dashboard (Home UI)"
            ["buildAppPanel"]="Build app selector panel"
            ["onCreate"]="Activity lifecycle"
            ["onResume"]="Activity lifecycle"
            ["onPause"]="Activity lifecycle"
            ["onDestroy"]="Activity cleanup"
            ["loadApps"]="App loading"
            ["rebuildDock"]="Dock rebuild"
            ["launchProjection"]="Projection launch"
            ["handleControlHome"]="Home button handler"
            ["handleControlBack"]="Back button handler"
          )
          
          missing=()
          for method in "${!methods[@]}"; do
            desc="${methods[$method]}"
            if grep -q "private void $method\|public void $method" "$FILE"; then
              echo "  ✓ $method() - $desc"
            else
              echo "  ❌ $method() - $desc [MISSING]"
              missing+=("$method")
            fi
          done
          
          echo ""
          if [ ${#missing[@]} -eq 0 ]; then
            echo "✅ All core UI methods present"
          else
            echo "❌ Missing methods: ${missing[*]}"
            exit 1
          fi

      - name: 🎯 Validate field declarations
        shell: bash
        run: |
          set -euo pipefail
          
          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          
          echo "📦 Checking field declarations..."
          echo ""
          
          declare -A fields=(
            ["FrameLayout root"]="Root container"
            ["FrameLayout projectionLayer"]="Projection layer"
            ["LinearLayout launcherLayer"]="Launcher layer"
            ["LinearLayout dashboard"]="Dashboard (Home)"
            ["LinearLayout appPanel"]="App panel"
            ["LinearLayout dock"]="Dock"
            ["TextView clock"]="Clock display"
            ["TextView date"]="Date display"
            ["TextureView textureView"]="Texture for projection"
            ["V10ProjectionSession session"]="Projection session"
            ["Handler handler"]="Main handler"
          )
          
          missing=()
          for field in "${!fields[@]}"; do
            desc="${fields[$field]}"
            if grep -q "private $field" "$FILE"; then
              echo "  ✓ $field - $desc"
            else
              echo "  ⚠ $field - $desc [NOT FOUND]"
              missing+=("$field")
            fi
          done
          
          echo ""
          if [ ${#missing[@]} -le 2 ]; then
            echo "✅ Field declarations validated (${#fields[@]} expected)"
          else
            echo "⚠ Some fields missing: ${#missing[@]} missing"
          fi

      - name: 📐 Analyze buildDashboard() structure
        shell: bash
        run: |
          set -euo pipefail
          
          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          
          echo "🔬 Analyzing buildDashboard() method..."
          echo ""
          
          # Extract buildDashboard method (approximate)
          if grep -q "private void buildDashboard()" "$FILE"; then
            echo "✓ buildDashboard() exists"
            
            # Check for UI components within buildDashboard
            components=(
              "LinearLayout"
              "TextView"
              "setOrientation"
              "setPadding"
              "addView"
              "setGravity"
            )
            
            echo ""
            echo "UI components used:"
            for comp in "${components[@]}"; do
              count=$(awk '/private void buildDashboard/,/^    \}/' "$FILE" | grep -c "$comp" || true)
              if [ "$count" -gt 0 ]; then
                echo "  ✓ $comp ($count uses)"
              fi
            done
            
            echo ""
            echo "✅ buildDashboard() structure looks good"
          else
            echo "❌ buildDashboard() not found"
            exit 1
          fi

      - name: 🎨 Check UI framework compatibility
        shell: bash
        run: |
          set -euo pipefail
          
          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          
          echo "🚗 Checking Android UI framework..."
          echo ""
          
          frameworks=(
            "CarActivity"
            "LinearLayout"
            "FrameLayout"
            "TextView"
            "GridLayout"
            "ScrollView"
            "GradientDrawable"
            "Gravity"
            "Handler"
            "Looper"
          )
          
          echo "Required Android framework classes:"
          missing_fw=()
          for fw in "${frameworks[@]}"; do
            if grep -q "$fw" "$FILE"; then
              echo "  ✓ $fw"
            else
              echo "  ⚠ $fw"
              missing_fw+=("$fw")
            fi
          done
          
          echo ""
          if [ ${#missing_fw[@]} -eq 0 ]; then
            echo "✅ All framework classes available"
          else
            echo "⚠ Missing framework classes may need to be added"
          fi

      - name: 📈 Generate validation report
        shell: bash
        run: |
          set -euo pipefail
          
          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          
          # Get file stats
          lines=$(wc -l < "$FILE")
          size=$(du -h "$FILE" | cut -f1)
          methods=$(grep -c "private void\|public void\|private.*get\|private.*set" "$FILE" || true)
          
          cat > /tmp/validation_report.txt <<REPORT
╔════════════════════════════════════════════════════════════════════════════╗
║       Car Assistant V10 - Home UI Validation Report                         ║
║       (Validate-Only - No Source Modification)                              ║
╚════════════════════════════════════════════════════════════════════════════╝

📋 FILE STATISTICS:
  • V10CarActivity.java
    - Lines: $lines
    - Size: $size
    - Methods: $methods
    - Status: ✅ VALID

🏗️ PROJECT STRUCTURE:
  ✅ Package: com.carassistant.v10
  ✅ Base Path: v10-source/app/src/main/java/com/hieptran/aacast/doudou/
  ✅ Core Files: V10CarActivity, V10ProjectionSession, V10SessionStore
  ✅ Class: V10CarActivity extends CarActivity

🎨 HOME UI COMPONENTS (buildDashboard):
