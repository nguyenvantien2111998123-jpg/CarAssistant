name: CarAsistant Virtual Lab

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - projection-background-settings-v1
      - voice-assistant-v1
# Keep each commit's diagnostics run alive; cancelling an emulator boot mid-run
# leaves no logs and prevents us from verifying the KVM fix.
concurrency:
  group: carassistant-virtual-lab-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-unit-test:
    name: Build APK and run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run JUnit unit tests
        working-directory: v10-source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Assemble debug APK
        working-directory: v10-source
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify release variant builds
        working-directory: v10-source
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload APK for emulator job
        uses: actions/upload-artifact@v4
        with:
          name: carassistant-debug-apk
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carassistant-unit-test-report
          path: |
            v10-source/app/build/reports/tests/testDebugUnitTest/
            v10-source/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  poco-f1-emulator-smoke:
    name: POCO F1 profile emulator smoke test
    needs: build-and-unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: carassistant-debug-apk
          path: dist

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is unavailable on this runner; refusing to start a software-emulated Android AVD that can hang for 10+ minutes."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::The runner user cannot read/write /dev/kvm after permission setup."
            exit 1
          fi
          ANDROID_EMULATOR="${ANDROID_HOME:-/usr/local/lib/android/sdk}/emulator/emulator"
          if [ ! -x "$ANDROID_EMULATOR" ]; then
            echo "::error::Android emulator binary not found at $ANDROID_EMULATOR; check runner Android SDK installation."
            exit 1
          fi
          "$ANDROID_EMULATOR" -accel-check

      - name: Boot Android 12 emulator with POCO F1 screen profile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-linux-hw-accel: false
          # KVM is verified by the preceding step; force hardware acceleration instead of silently
          # falling back to -accel off, which previously caused 10-minute boots and broken ADB.
          emulator-boot-timeout: 1200
          script: |
            set -eu
            mkdir -p test-results
            adb wait-for-device
            adb shell settings put system accelerometer_rotation 0 || true
            adb shell wm size 1080x2246
            adb shell wm density 440
            adb shell getprop > test-results/emulator-getprop.txt
            adb shell wm size > test-results/emulator-size.txt
            adb shell wm density > test-results/emulator-density.txt
            adb shell getprop ro.build.version.sdk > test-results/android-api.txt
            adb shell getprop ro.build.version.release > test-results/android-release.txt
            adb shell getprop ro.build.fingerprint > test-results/build-fingerprint.txt
            adb shell dumpsys display > test-results/display-before.txt

            adb logcat -c
            adb install -r dist/app-debug.apk
            adb shell am force-stop com.carassistant.v10
            adb shell am start -W -n com.carassistant.v10/.V10LauncherActivity | tee test-results/launch.txt

            # Give Android time to complete activity startup and record any crash.
            sleep 8
            adb logcat -d -v threadtime > test-results/logcat.txt
            adb shell dumpsys activity activities > test-results/activities.txt
            adb shell dumpsys display > test-results/display-after.txt
            adb shell screencap -p /sdcard/carassistant-screen.png
            adb pull /sdcard/carassistant-screen.png test-results/carassistant-screen.png

            if grep -E 'FATAL EXCEPTION|Fatal signal|Process: com\.carassistant\.v10' test-results/logcat.txt; then
              echo 'FAIL: crash signature found in logcat'
              exit 1
            fi

            if ! adb shell pidof com.carassistant.v10 >/dev/null 2>&1; then
              echo 'FAIL: CarAsistant process is not running after launch'
              exit 1
            fi

            echo 'PASS: APK installed, launcher start requested, process alive, no fatal crash signature found.'

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carassistant-virtual-lab-diagnostics
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  car-display-simulation:
    name: Landscape virtual car display probe
    # Run emulators sequentially: parallel API 31 AVDs have caused adb transport
    # failures on hosted runners. Still run this probe if the phone smoke test fails.
    needs: [build-and-unit-test, poco-f1-emulator-smoke]
    if: ${{ always() && needs.build-and-unit-test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: carassistant-debug-apk
          path: dist

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is unavailable on this runner; refusing to start a software-emulated Android AVD that can hang for 10+ minutes."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::The runner user cannot read/write /dev/kvm after permission setup."
            exit 1
          fi
          ANDROID_EMULATOR="${ANDROID_HOME:-/usr/local/lib/android/sdk}/emulator/emulator"
          if [ ! -x "$ANDROID_EMULATOR" ]; then
            echo "::error::Android emulator binary not found at $ANDROID_EMULATOR; check runner Android SDK installation."
            exit 1
          fi
          "$ANDROID_EMULATOR" -accel-check

      - name: Boot Android 12 landscape car-screen emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-linux-hw-accel: false
          # KVM is verified by the preceding step; force hardware acceleration instead of silently
          # falling back to -accel off, which previously caused 10-minute boots and broken ADB.
          emulator-boot-timeout: 1200
          script: |
            set -eu
            mkdir -p test-results
            adb wait-for-device
            adb shell settings put system accelerometer_rotation 0 || true
            adb shell wm size 1280x720
            adb shell wm density 160
            adb shell wm size > test-results/car-display-size.txt
            adb shell wm density > test-results/car-display-density.txt
            adb shell getprop ro.build.version.sdk > test-results/car-android-api.txt
            adb shell getprop ro.build.version.release > test-results/car-android-release.txt
            adb shell dumpsys display > test-results/car-display-before.txt
            adb logcat -c
            adb install -r dist/app-debug.apk

            # Probe the real CarActivity on a landscape Android emulator.
            # A successful standalone launch is useful smoke coverage; a failure
            # may mean the Android Auto host/gearhead service is absent, so it is
            # reported as INCONCLUSIVE rather than mislabelled as an app crash.
            adb shell am force-stop com.carassistant.v10
            (adb shell am start -W -n com.carassistant.v10/.V10CarActivity > test-results/car-activity-launch.txt 2>&1 || true)
            sleep 8
            adb logcat -d -v threadtime > test-results/car-display-logcat.txt
            adb shell dumpsys activity activities > test-results/car-display-activities.txt
            adb shell dumpsys display > test-results/car-display-after.txt
            adb shell screencap -p /sdcard/carassistant-car-screen.png
            adb pull /sdcard/carassistant-car-screen.png test-results/carassistant-car-screen.png || true

            if grep -E 'FATAL EXCEPTION|Fatal signal|Process: com\.carassistant\.v10' test-results/car-display-logcat.txt; then
              echo 'INCONCLUSIVE: CarActivity failed in a hostless emulator; inspect logcat because Android Auto gearhead is not installed.' | tee test-results/car-display-status.txt
            elif grep -q 'V10CarActivity' test-results/car-display-activities.txt; then
              echo 'PASS: V10CarActivity appears in the landscape emulator activity stack.' | tee test-results/car-display-status.txt
            else
              echo 'INCONCLUSIVE: standalone CarActivity launch did not appear in activity stack; a real Android Auto host may be required.' | tee test-results/car-display-status.txt
            fi

      - name: Upload car-display diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carassistant-car-display-diagnostics
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
