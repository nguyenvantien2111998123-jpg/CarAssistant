

name: TL3 UI Tree Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tl3-ui-tree-diagnostic
  cancel-in-progress: false

jobs:
  build:
    name: Build standalone UI tree diagnostic APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate isolated diagnostic project
        shell: bash
        run: |
          set -euo pipefail

          P="$RUNNER_TEMP/ui-tree-diagnostic"
          mkdir -p "$P/app/src/main/java/com/carassistant/uidiag"
          mkdir -p "$P/app/src/main/res/values"

          cat > "$P/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "UiTreeDiagnostic"
          include(":app")
          EOF

          cat > "$P/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > "$P/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > "$P/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.carassistant.uidiag'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.carassistant.uidiag'
                  minSdk 26
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_11
                  targetCompatibility JavaVersion.VERSION_11
              }
          }
          EOF

          cat > "$P/app/src/main/res/values/styles.xml" <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1565C0</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

          cat > "$P/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/AppTheme"
                  android:label="UI Tree Diagnostic"
                  android:allowBackup="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "$P/app/src/main/java/com/carassistant/uidiag/MainActivity.java" <<'EOF'
          package com.carassistant.uidiag;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Typeface;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.util.concurrent.Executors;
          import java.util.concurrent.TimeUnit;

          public class MainActivity extends Activity {
              private TextView output;
              private Button runButton;

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(24, 24, 24, 24);

                  TextView title = new TextView(this);
                  title.setText("CarAssistant - UI Tree Diagnostic");
                  title.setTextSize(21);
                  title.setTypeface(null, Typeface.BOLD);
                  root.addView(title);

                  TextView info = new TextView(this);
                  info.setText(
                      "Chiếu YouTube hoặc ứng dụng cần kiểm tra lên Android Auto trước. " +
                      "Sau đó quay lại đây và bấm nút bên dưới. " +
                      "Chẩn đoán chỉ đọc, không tự bấm hoặc nhập văn bản."
                  );
                  info.setTextSize(15);
                  root.addView(info);

                  runButton = new Button(this);
                  runButton.setText("ĐỌC CÂY GIAO DIỆN");
                  root.addView(runButton);

                  ScrollView scroll = new ScrollView(this);
                  output = new TextView(this);
                  output.setTextIsSelectable(true);
                  output.setTextSize(12);
                  output.setTypeface(Typeface.MONOSPACE);
                  output.setText("Chưa chạy chẩn đoán.");
                  scroll.addView(output);
                  root.addView(scroll, new LinearLayout.LayoutParams(
                      -1, 0, 1
                  ));

                  setContentView(root);

                  runButton.setOnClickListener(v -> runProbe());
              }

              private void runProbe() {
                  runButton.setEnabled(false);
                  output.setText(
                      "Đang yêu cầu quyền root chạy helper với UID shell 2000...\n" +
                      "Nếu không có kết quả, hãy kiểm tra Magisk và cấp quyền root."
                  );

                  Executors.newSingleThreadExecutor().execute(() -> {
                      StringBuilder report = new StringBuilder();
                      Process process = null;

                      try {
                          String apk = getApplicationInfo().sourceDir;
                          String command =
                              "CLASSPATH=" + shellQuote(apk) +
                              " /system/bin/app_process /system/bin " +
                              "com.carassistant.uidiag.UiTreeProbe";

                          process = new ProcessBuilder(
                              "su", "2000", "-c", command
                          ).redirectErrorStream(true).start();

                          final Process p = process;
                          Thread reader = new Thread(() -> {
                              try (BufferedReader br = new BufferedReader(
                                      new InputStreamReader(p.getInputStream()))) {
                                  String line;
                                  while ((line = br.readLine()) != null) {
                                      synchronized (report) {
                                          report.append(line).append('\n');
                                      }
                                  }
                              } catch (Exception e) {
                                  synchronized (report) {
                                      report.append("READ ERROR: ")
                                          .append(e).append('\n');
                                  }
                              }
                          });
                          reader.setDaemon(true);
                          reader.start();

                          boolean done = process.waitFor(25, TimeUnit.SECONDS);
                          if (!done) {
                              process.destroyForcibly();
                              report.append("\nTIMEOUT: helper không kết thúc trong 25 giây.\n");
                          } else {
                              reader.join(3000);
                              report.append("\nProcess exit code: ")
                                  .append(process.exitValue()).append('\n');
                          }
                      } catch (Exception e) {
                          report.append("\nERROR: ").append(e).append('\n');
                      } finally {
                          if (process != null && process.isAlive()) {
                              process.destroyForcibly();
                          }
                      }

                      runOnUiThread(() -> {
                          synchronized (report) {
                              output.setText(report.toString());
                          }
                          runButton.setEnabled(true);
                      });
                  });
              }

              private static String shellQuote(String value) {
                  return "'" + value.replace("'", "'\\''") + "'";
              }
          }
          EOF

          cat > "$P/app/src/main/java/com/carassistant/uidiag/UiTreeProbe.java" <<'EOF'
          package com.carassistant.uidiag;

          import android.os.Looper;
          import android.util.SparseArray;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.view.accessibility.AccessibilityWindowInfo;
          import java.lang.reflect.Constructor;
          import java.lang.reflect.Method;
          import java.util.ArrayDeque;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Set;

          public final class UiTreeProbe {
              private static int totalNodes;
              private static int totalWindows;
              private static int totalSearchMatches;

              public static void main(String[] args) {
                  Object automation = null;
                  try {
                      System.out.println("UI_TREE_DIAGNOSTIC_V1");
                      System.out.println("uid-shell helper started");

                      if (Looper.myLooper() == null) {
                          Looper.prepare();
                      }

                      Class<?> connectionClass =
                          Class.forName("android.app.UiAutomationConnection");
                      Constructor<?> connectionCtor =
                          connectionClass.getDeclaredConstructor();
                      connectionCtor.setAccessible(true);
                      Object connection = connectionCtor.newInstance();

                      Class<?> interfaceClass =
                          Class.forName("android.app.IUiAutomationConnection");
                      Class<?> automationClass =
                          Class.forName("android.app.UiAutomation");

                      Constructor<?> automationCtor = null;
                      for (Constructor<?> c : automationClass.getDeclaredConstructors()) {
                          Class<?>[] p = c.getParameterTypes();
                          if (p.length == 2 &&
                              p[0] == Looper.class &&
                              p[1].isAssignableFrom(interfaceClass)) {
                              automationCtor = c;
                              break;
                          }
                      }

                      if (automationCtor == null) {
                          throw new IllegalStateException(
                              "UiAutomation(Looper, IUiAutomationConnection) constructor not found"
                          );
                      }

                      automationCtor.setAccessible(true);
                      automation = automationCtor.newInstance(Looper.myLooper(), connection);

                      Method connect = null;
                      for (Method m : automationClass.getDeclaredMethods()) {
                          if (m.getName().equals("connect") &&
                              (m.getParameterCount() == 0 ||
                               (m.getParameterCount() == 1 &&
                                m.getParameterTypes()[0] == int.class))) {
                              connect = m;
                              if (m.getParameterCount() == 1) break;
                          }
                      }
                      if (connect == null) {
                          throw new IllegalStateException("UiAutomation.connect not found");
                      }

                      connect.setAccessible(true);
                      if (connect.getParameterCount() == 1) {
                          connect.invoke(automation, 0);
                      } else {
                          connect.invoke(automation);
                      }

                      System.out.println("UI_AUTOMATION_CONNECT=PASS");

                      Method allDisplays = null;
                      for (Method m : automationClass.getDeclaredMethods()) {
                          if (m.getName().equals("getWindowsOnAllDisplays") &&
                              m.getParameterCount() == 0) {
                              allDisplays = m;
                              break;
                          }
                      }

                      if (allDisplays == null) {
                          System.out.println("MULTI_DISPLAY_API=UNAVAILABLE");
                          System.out.println("Trying getWindows() fallback.");
                          dumpWindows(automationClass.getMethod("getWindows").invoke(automation), -1);
                      } else {
                          allDisplays.setAccessible(true);
                          Object result = allDisplays.invoke(automation);
                          if (!(result instanceof SparseArray)) {
                              System.out.println("MULTI_DISPLAY_RESULT=UNEXPECTED_TYPE");
                              System.out.println("TYPE=" +
                                  (result == null ? "null" : result.getClass().getName()));
                          } else {
                              SparseArray<?> displays = (SparseArray<?>) result;
                              System.out.println("DISPLAY_COUNT=" + displays.size());

                              for (int i = 0; i < displays.size(); i++) {
                                  int displayId = displays.keyAt(i);
                                  Object windows = displays.valueAt(i);
                                  System.out.println("\nDISPLAY_ID=" + displayId);
                                  dumpWindows(windows, displayId);
                              }
                          }
                      }

                      System.out.println("\nSUMMARY_WINDOWS=" + totalWindows);
                      System.out.println("SUMMARY_NODES=" + totalNodes);
                      System.out.println("SUMMARY_SEARCH_MATCHES=" + totalSearchMatches);
                      System.out.println("NOTE=No tap, keyevent, text injection, or click performed.");
                  } catch (Throwable e) {
                      System.out.println("DIAGNOSTIC_ERROR=" + e.getClass().getName());
                      System.out.println("ERROR_MESSAGE=" + String.valueOf(e.getMessage()));
                      Throwable cause = e.getCause();
                      if (cause != null) {
                          System.out.println("CAUSE=" + cause.getClass().getName() +
                              ": " + String.valueOf(cause.getMessage()));
                      }
                      System.out.println("CHECK=ROM hidden API restrictions, root authorization, and UiAutomation support.");
                  } finally {
                      if (automation != null) {
                          try {
                              Method disconnect =
                                  automation.getClass().getDeclaredMethod("disconnect");
                              disconnect.setAccessible(true);
                              disconnect.invoke(automation);
                          } catch (Throwable ignored) {
                          }
                      }
                  }
              }

              private static void dumpWindows(Object value, int expectedDisplay) {
                  if (!(value instanceof List)) {
                      System.out.println("WINDOW_LIST_TYPE=" +
                          (value == null ? "null" : value.getClass().getName()));
                      return;
                  }

                  List<?> windows = (List<?>) value;
                  System.out.println("WINDOW_COUNT=" + windows.size());

                  for (Object item : windows) {
                      if (!(item instanceof AccessibilityWindowInfo)) continue;

                      AccessibilityWindowInfo window =
                          (AccessibilityWindowInfo) item;
                      totalWindows++;

                      int displayId = -1;
                      try {
                          displayId = window.getDisplayId();
                      } catch (Throwable ignored) {
                      }

                      System.out.println(
                          "WINDOW id=" + window.getId() +
                          " displayId=" + displayId +
                          " type=" + window.getType() +
                          " layer=" + window.getLayer() +
                          " active=" + window.isActive() +
                          " focused=" + window.isFocused()
                      );

                      if (expectedDisplay >= 0 && displayId != expectedDisplay) {
                          System.out.println("WINDOW_DISPLAY_MISMATCH=true");
                      }

                      AccessibilityNodeInfo root = window.getRoot();
                      if (root == null) {
                          System.out.println("ROOT=null");
                          continue;
                      }

                      walkTree(root, displayId);
                  }
              }

              private static void walkTree(
                  AccessibilityNodeInfo root, int displayId
              ) {
                  ArrayDeque<AccessibilityNodeInfo> queue = new ArrayDeque<>();
                  Set<String> seen = new HashSet<>();
                  queue.add(root);
                  int localCount = 0;

                  while (!queue.isEmpty() && localCount < 12000) {
                      AccessibilityNodeInfo node = queue.removeFirst();
                      if (node == null) continue;

                      String identity = node.getWindowId() + "|" +
                          node.getClassName() + "|" +
                          node.getViewIdResourceName() + "|" +
                          node.getBoundsInScreen(new android.graphics.Rect());

                      if (!seen.add(identity)) continue;

                      localCount++;
                      totalNodes++;

                      String text = safe(node.getText());
                      String desc = safe(node.getContentDescription());
                      String id = safe(node.getViewIdResourceName());
                      String cls = safe(node.getClassName());
                      String combined = (text + " " + desc + " " + id + " " + cls)
                          .toLowerCase(java.util.Locale.ROOT);

                      boolean searchLike =
                          combined.contains("search") ||
                          combined.contains("find") ||
                          combined.contains("magnif") ||
                          combined.contains("query") ||
                          combined.contains("tìm kiếm") ||
                          combined.contains("tim kiem") ||
                          combined.contains("recherche") ||
                          combined.contains("buscar") ||
                          combined.contains("검색") ||
                          combined.contains("搜索");

                      if (searchLike) {
                          totalSearchMatches++;
                          System.out.println(
                              "SEARCH_NODE displayId=" + displayId +
                              " text=\"" + text + "\"" +
                              " desc=\"" + desc + "\"" +
                              " id=\"" + id + "\"" +
                              " class=\"" + cls + "\"" +
                              " clickable=" + node.isClickable() +
                              " enabled=" + node.isEnabled()
                          );
                      }

                      if (!text.isEmpty() || !desc.isEmpty() || !id.isEmpty()) {
                          System.out.println(
                              "NODE displayId=" + displayId +
                              " text=\"" + text + "\"" +
                              " desc=\"" + desc + "\"" +
                              " id=\"" + id + "\"" +
                              " class=\"" + cls + "\"" +
                              " clickable=" + node.isClickable()
                          );
                      }

                      for (int i = 0; i < node.getChildCount(); i++) {
                          try {
                              AccessibilityNodeInfo child = node.getChild(i);
                              if (child != null) queue.addLast(child);
                          } catch (Throwable ignored) {
                          }
                      }
                  }

                  System.out.println(
                      "TREE_RESULT displayId=" + displayId +
                      " nodesVisited=" + localCount
                  );
              }

              private static String safe(CharSequence value) {
                  if (value == null) return "";
                  return value.toString()
                      .replace("\n", " ")
                      .replace("\r", " ")
                      .replace("\"", "'");
              }
          }
          EOF

          echo "Diagnostic project generated at $P"
          test -f "$P/app/src/main/java/com/carassistant/uidiag/UiTreeProbe.java"
          test -f "$P/app/src/main/java/com/carassistant/uidiag/MainActivity.java"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build diagnostic APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ui-tree-diagnostic"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK and print SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/ui-tree-diagnostic/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 8

      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: TL3-UiTree-Diagnostic-APK
          path: ${{ runner.temp }}/ui-tree-diagnostic/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
