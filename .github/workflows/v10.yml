name: Car Assistant V10

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # ============================================================
      # FIND V9 SOURCE
      # ============================================================

      - name: Locate V9 source ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f \
            -name 'CarAssistant-V9-Source.zip' \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: CarAssistant-V9-Source.zip not found"
            exit 1
          fi

          echo "V9 ZIP: $ZIP"
          echo "V9_ZIP=$ZIP" >> "$GITHUB_ENV"

      # ============================================================
      # EXTRACT
      # ============================================================

      - name: Extract V9 source
        shell: bash
        run: |
          set -e

          rm -rf v9-unpack
          rm -rf v9-source
          rm -rf v10-source

          mkdir -p v9-unpack
          unzip -q "$V9_ZIP" -d v9-unpack

          INNER=$(find v9-unpack -type f \
            -name 'CarAssistant-V9-source.zip' \
            | head -n 1)

          if [ -z "$INNER" ]; then
            echo "ERROR: inner V9 source ZIP not found"
            find v9-unpack -maxdepth 5 -type f | sort
            exit 1
          fi

          mkdir -p v9-source
          unzip -q "$INNER" -d v9-source

          echo "V9 source extracted."

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT=""

          SETTINGS=$(find v9-source -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -n 1)

          if [ -n "$SETTINGS" ]; then
            PROJECT=$(dirname "$SETTINGS")
          fi

          if [ -z "$PROJECT" ]; then
            APP_DIR=$(find v9-source -type d \
              -name app | head -n 1)

            if [ -n "$APP_DIR" ]; then
              PROJECT=$(dirname "$APP_DIR")
            fi
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "PROJECT=$PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      # ============================================================
      # V9 -> V10
      # ============================================================

      - name: Copy V9 to V10
        shell: bash
        run: |
          set -e

          cp -a "$PROJECT" v10-source

          echo "V10 source created."

      - name: Transform package
        shell: bash
        run: |
          set -e

          find v10-source -type f \
            \( \
              -name "*.java" \
              -o -name "*.xml" \
              -o -name "*.gradle" \
              -o -name "*.gradle.kts" \
              -o -name "*.properties" \
              -o -name "*.txt" \
              -o -name "*.md" \
              -o -name "xposed_init" \
            \) \
            -print0 |
          xargs -0 sed -i \
            's/com\.hieptran\.aacast\.doudou/com.carassistant.v9/g'

          find v10-source -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -print0 |
          xargs -0 sed -i \
            's/applicationId[[:space:]]*"com\.hieptran\.aacast\.doudou"/applicationId "com.carassistant.v9"/g'

          find v10-source -type f \
            -name "xposed_init" \
            -print0 |
          while IFS= read -r -d '' FILE; do
            printf '%s\n' \
              'com.carassistant.v9.aabridge.AACastBridge' \
              > "$FILE"
          done

      # ============================================================
      # VERSION
      # ============================================================

      - name: Set V10 version
        shell: bash
        run: |
          set -e

          find v10-source -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -print0 |
          xargs -0 sed -i \
            -E 's/versionCode[[:space:]]+[0-9]+/versionCode 1000/g'

          find v10-source -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -print0 |
          xargs -0 sed -i \
            -E 's/versionName[[:space:]]+"[^"]+"/versionName "10.0-Launcher"/g'

      # ============================================================
      # LOCATE AACAST
      # ============================================================

      - name: Locate AACast files
        shell: bash
        run: |
          set -e

          ACTIVITY=$(find v10-source -type f \
            -name 'AACastCarActivity.java' | head -n 1)

          SERVICE=$(find v10-source -type f \
            -name 'AACastCarService.java' | head -n 1)

          ROOTVIEW=$(find v10-source -type f \
            -name 'RootView.java' | head -n 1)

          DISPLAY=$(find v10-source -type f \
            -name 'AACastDisplay.java' | head -n 1)

          test -n "$ACTIVITY"
          test -n "$SERVICE"
          test -n "$ROOTVIEW"
          test -n "$DISPLAY"

          JAVA_DIR=$(dirname "$ACTIVITY")

          echo "ACTIVITY=$ACTIVITY"
          echo "SERVICE=$SERVICE"
          echo "ROOTVIEW=$ROOTVIEW"
          echo "DISPLAY=$DISPLAY"
          echo "JAVA_DIR=$JAVA_DIR"

          echo "ACTIVITY=$ACTIVITY" >> "$GITHUB_ENV"
          echo "SERVICE=$SERVICE" >> "$GITHUB_ENV"
          echo "ROOTVIEW=$ROOTVIEW" >> "$GITHUB_ENV"
          echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"
          echo "JAVA_DIR=$JAVA_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # VERIFY AACAST
      # ============================================================

      - name: Verify AACast architecture
        shell: bash
        run: |
          set -e

          grep -q "extends CarActivity" "$ACTIVITY"
          grep -q "getCarActivity" "$SERVICE"
          grep -q "createVirtualDisplay" "$DISPLAY"
          grep -q "VirtualDisplay" "$DISPLAY"

          grep -R -q "IXposedHookLoadPackage" v10-source
          grep -R -q "com.google.android.projection.gearhead" v10-source
          grep -R -q "getDisplayDeviceInfoLocked" v10-source
          grep -R -q "injectInputEventToTarget" v10-source

          echo "AACast architecture: OK"

      # ============================================================
      # MANIFEST
      # ============================================================

      - name: Verify manifest
        shell: bash
        run: |
          set -e

          MANIFEST=$(find v10-source -type f \
            -name AndroidManifest.xml | head -n 1)

          test -n "$MANIFEST"

          grep -q \
            "com.carassistant.v9.AACastCarActivity" \
            "$MANIFEST"

          grep -q \
            "com.carassistant.v9.AACastCarService" \
            "$MANIFEST"

          echo "Manifest: OK"

      # ============================================================
      # CREATE LAUNCHER
      # ============================================================

      - name: Create V10 launcher
        shell: bash
        run: |
          set -e

          TARGET_DIR="v10-source/$JAVA_DIR"

          mkdir -p "$TARGET_DIR"

          printf '%s' \
          '' |
          base64 -d > "$TARGET_DIR/CarAssistantLauncherView.java"

          test -s "$TARGET_DIR/CarAssistantLauncherView.java"

          echo "Launcher created."

      # ============================================================
      # CREATE AACAST ACTIVITY
      # ============================================================

      - name: Create V10 AACast Activity
        shell: bash
        run: |
          set -e

          TARGET_DIR="v10-source/$JAVA_DIR"

          printf '%s' \
          '' |
          base64 -d > "$TARGET_DIR/AACastCarActivity.java"

          test -s "$TARGET_DIR/AACastCarActivity.java"

          echo "AACast Activity created."

      # ============================================================
      # VERIFY V10
      # ============================================================

      - name: Verify V10 source
        shell: bash
        run: |
          set -e

          TARGET_DIR="v10-source/$JAVA_DIR"

          test -f "$TARGET_DIR/CarAssistantLauncherView.java"
          test -f "$TARGET_DIR/AACastCarActivity.java"

          grep -q "CAR ASSISTANT" \
            "$TARGET_DIR/CarAssistantLauncherView.java"

          grep -q "Android Auto Desktop" \
            "$TARGET_DIR/CarAssistantLauncherView.java"

          grep -q "class AACastCarActivity" \
            "$TARGET_DIR/AACastCarActivity.java"

          grep -q "showCastRoot" \
            "$TARGET_DIR/AACastCarActivity.java"

          echo "V10 source verification: OK"

      # ============================================================
      # BUILD
      # ============================================================

      - name: Generate Gradle wrapper
        working-directory: v10-source
        shell: bash
        run: |
          set -e
          gradle wrapper --gradle-version 8.13

      - name: Clean
        working-directory: v10-source
        shell: bash
        run: |
          ./gradlew clean

      - name: Build Debug APK
        working-directory: v10-source
        shell: bash
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        working-directory: v10-source
        shell: bash
        run: |
          ./gradlew assembleRelease --stacktrace

      # ============================================================
      # COLLECT APK
      # ============================================================

      - name: Collect V10 APKs
        shell: bash
        run: |
          set -e

          rm -rf output
          mkdir -p output

          DEBUG_APK=$(find v10-source -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          RELEASE_APK=$(find v10-source -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            | head -n 1)

          test -n "$DEBUG_APK"
          test -n "$RELEASE_APK"

          cp "$DEBUG_APK" \
            output/CarAssistant-V10-debug.apk

          cp "$RELEASE_APK" \
            output/CarAssistant-V10-release.apk

          cd output

          sha256sum \
            CarAssistant-V10-debug.apk \
            CarAssistant-V10-release.apk \
            > SHA256SUMS.txt

          cd ..

          ls -lh output
          cat output/SHA256SUMS.txt

      - name: Upload V10 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10
          path: output/

      # ============================================================
      # ANDROID 12 EMULATOR
      # ============================================================

      - name: Test V10 Android 12 + Secondary Display
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true

          script: |
            set -euxo pipefail

            mkdir -p "$GITHUB_WORKSPACE/emulator-evidence"

            cd "$GITHUB_WORKSPACE/emulator-evidence"

            echo "=== ADB DEVICES ==="
            adb devices | tee devices.txt

            echo "=== ANDROID VERSION ==="
            adb shell getprop ro.build.version.release \
              | tee android-version.txt

            adb shell getprop ro.build.version.sdk \
              | tee api-level.txt

            echo "=== SCREEN ==="
            adb shell wm size | tee wm-size.txt
            adb shell wm density | tee wm-density.txt

            echo "=== DISPLAY BEFORE ==="
            adb shell dumpsys display \
              > display-before.txt

            # ========================================================
            # INSTALL
            # ========================================================

            echo "=== INSTALL V10 ==="

            adb install -r "$GITHUB_WORKSPACE/output/CarAssistant-V10-debug.apk"

            echo "=== PACKAGE ==="

            adb shell dumpsys package com.carassistant.v9 \
              > package.txt

            # ========================================================
            # SECONDARY DISPLAY
            # ========================================================

            echo "=== CREATE SECONDARY DISPLAY ==="

            adb shell settings put global overlay_display_devices \
              "1920x1080/240"

            sleep 3

            adb shell dumpsys display \
              > display-secondary.txt

            # ========================================================
            # LAUNCH
            # ========================================================

            echo "=== LAUNCH V10 ==="

            adb shell monkey \
              -p com.carassistant.v9 \
              -c android.intent.category.LAUNCHER \
              1 \
              > launcher.txt 2>&1 || true

            sleep 5

            # ========================================================
            # ACTIVITY
            # ========================================================

            adb shell cmd package resolve-activity \
              --brief \
              -c android.intent.category.LAUNCHER \
              com.carassistant.v9 \
              > resolved-activity.txt || true

            adb shell dumpsys activity activities \
              > activity.txt

            grep -E \
              "mResumedActivity|mFocusedApp|com.carassistant.v9" \
              activity.txt \
              || true

            # ========================================================
            # DISPLAY AFTER LAUNCH
            # ========================================================

            adb shell dumpsys display \
              > display-after-launch.txt

            # ========================================================
            # PROCESS
            # ========================================================

            adb shell pidof com.carassistant.v9 \
              > process.txt || true

            # ========================================================
            # LOGCAT
            # ========================================================

            adb logcat -d \
              -v threadtime \
              > full-logcat.txt || true

            grep -Ei \
              "AACast|VirtualDisplay|DisplayManager|CarActivity|CarAssistant|Gearhead|FATAL EXCEPTION|AndroidRuntime|ANR" \
              full-logcat.txt \
              > aacast-display-log.txt || true

            # ========================================================
            # CRASH / ANR
            # ========================================================

            adb shell dumpsys dropbox \
              --print \
              data_app_crash \
              > crash-anr.txt 2>&1 || true

            adb shell dumpsys dropbox \
              --print \
              system_app_anr \
              >> crash-anr.txt 2>&1 || true

            # ========================================================
            # SCREENSHOT
            # ========================================================

            adb exec-out screencap -p \
              > v10-default-display.png || true

            # ========================================================
            # CLEANUP
            # ========================================================

            adb shell settings put global overlay_display_devices ""

            sleep 2

            adb shell dumpsys display \
              > display-after-cleanup.txt

            echo "=== V10 TEST COMPLETE ==="

      # ============================================================
      # UPLOAD EVIDENCE
      # ============================================================

      - name: Upload V10 display test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-display-test
          path: ${{ github.workspace }}/emulator-evidence/
          if-no-files-found: ignore
