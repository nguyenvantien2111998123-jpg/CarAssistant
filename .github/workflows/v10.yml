name: Car Assistant V10

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Find V9 source ZIP
        shell: bash
        run: |
          set -e

          ZIP="$(find . -type f -name 'CarAssistant-V9-Source.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: CarAssistant-V9-Source.zip not found"
            exit 1
          fi

          echo "Found: $ZIP"
          echo "V9_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract V9 source
        shell: bash
        run: |
          set -e

          rm -rf v9-unpack v9-source v10-source
          mkdir -p v9-unpack v9-source

          unzip -q "$V9_ZIP" -d v9-unpack

          INNER="$(find v9-unpack -type f -name 'CarAssistant-V9-source.zip' | head -n 1)"

          if [ -z "$INNER" ]; then
            echo "ERROR: Inner CarAssistant-V9-source.zip not found"
            find v9-unpack -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Inner ZIP: $INNER"

          unzip -q "$INNER" -d v9-source

          echo "Extracted V9 source:"
          find v9-source -maxdepth 4 -type f | sort | head -n 200

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT="$(find v9-source -type f -path '*/app/build.gradle' -o -path '*/app/build.gradle.kts' | head -n 1)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android app module not found"
            find v9-source -maxdepth 8 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$PROJECT")")"

          echo "PROJECT=$PROJECT_DIR"
          echo "PROJECT=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare V10 source
        shell: bash
        run: |
          set -e

          rm -rf v10-source
          cp -a "$PROJECT" v10-source

          echo "V10 source prepared:"
          find v10-source -maxdepth 4 -type f | sort | head -n 200

      - name: Transform V9 package to V10 package
        shell: bash
        run: |
          set -e

          find v10-source -type f \
            \( \
              -name "*.java" \
              -o -name "*.xml" \
              -o -name "*.gradle" \
              -o -name "*.gradle.kts" \
              -o -name "*.properties" \
              -o -name "*.txt" \
              -o -name "*.md" \
              -o -name "xposed_init" \
            \) \
            -print0 |
          xargs -0 sed -i \
            's/com\.hieptran\.aacast\.doudou/com.carassistant.v9/g'

      - name: Set applicationId and namespace
        shell: bash
        run: |
          set -e

          find v10-source -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print0 |
          xargs -0 sed -i \
            's/applicationId "com\.hieptran\.aacast\.doudou"/applicationId "com.carassistant.v9"/g'

          find v10-source -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print0 |
          xargs -0 sed -i \
            "s/namespace 'com\.hieptran\.aacast\.doudou'/namespace 'com.carassistant.v9'/g"

          find v10-source -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print0 |
          xargs -0 sed -i \
            's/namespace "com\.hieptran\.aacast\.doudou"/namespace "com.carassistant.v9"/g'

      - name: Write Xposed entry
        shell: bash
        run: |
          set -e

          mkdir -p v10-source/app/src/main/assets

          printf '%s\n' \
            'com.carassistant.v9.aabridge.AACastBridge' \
            > v10-source/app/src/main/assets/xposed_init

          echo "Xposed entry:"
          cat v10-source/app/src/main/assets/xposed_init

      - name: Set V10 version
        shell: bash
        run: |
          set -e

          BUILD_FILE="v10-source/app/build.gradle"

          if [ -f "$BUILD_FILE" ]; then
            sed -i \
              's/versionCode[[:space:]]\+[0-9]\+/versionCode 1000/g' \
              "$BUILD_FILE" || true

            sed -i \
              's/versionName[[:space:]]\+["'\''][^"'\'']*["'\'']/versionName "10.0-Launcher"/g' \
              "$BUILD_FILE" || true
          fi

          echo "Version configuration:"
          grep -nE 'versionCode|versionName' "$BUILD_FILE" || true

      - name: Discover AACast Java directory
        shell: bash
        run: |
          set -e

          ACTIVITY="$(find v10-source -type f -name 'AACastCarActivity.java' | head -n 1)"
          SERVICE="$(find v10-source -type f -name 'AACastCarService.java' | head -n 1)"
          ROOTVIEW="$(find v10-source -type f -name 'RootView.java' | head -n 1)"
          DISPLAY="$(find v10-source -type f -name 'AACastDisplay.java' | head -n 1)"

          if [ -z "$ACTIVITY" ]; then
            echo "ERROR: AACastCarActivity.java not found"
            exit 1
          fi

          if [ -z "$SERVICE" ]; then
            echo "ERROR: AACastCarService.java not found"
            exit 1
          fi

          if [ -z "$ROOTVIEW" ]; then
            echo "ERROR: RootView.java not found"
            exit 1
          fi

          if [ -z "$DISPLAY" ]; then
            echo "ERROR: AACastDisplay.java not found"
            exit 1
          fi

          JAVA_DIR="$(dirname "$ACTIVITY")"

          echo "ACTIVITY=$ACTIVITY"
          echo "SERVICE=$SERVICE"
          echo "ROOTVIEW=$ROOTVIEW"
          echo "DISPLAY=$DISPLAY"
          echo "JAVA_DIR=$JAVA_DIR"

          echo "JAVA_DIR=$JAVA_DIR" >> "$GITHUB_ENV"

      - name: Verify V9 AACast architecture
        shell: bash
        run: |
          set -e

          echo "Checking AACast architecture..."

          grep -R "extends CarActivityService" v10-source/app/src/main/java
          grep -R "getCarActivity()" v10-source/app/src/main/java
          grep -R "extends CarActivity" v10-source/app/src/main/java
          grep -R "createVirtualDisplay" v10-source/app/src/main/java
          grep -R "VirtualDisplay" v10-source/app/src/main/java
          grep -R -- "--display" v10-source/app/src/main/java
          grep -R "su" v10-source/app/src/main/java

          grep -R "IXposedHookLoadPackage" \
            v10-source/app/src/main/java \
            v10-source/app/src/main/assets

          grep -R "com.google.android.projection.gearhead" \
            v10-source/app/src/main/java \
            v10-source/app/src/main/AndroidManifest.xml

          grep -R "getDisplayDeviceInfoLocked" \
            v10-source/app/src/main/java

          grep -R "injectInputEventToTarget" \
            v10-source/app/src/main/java

          if grep -R "androidx.car.app.CarAppService" \
            v10-source/app/src/main/java \
            v10-source/app/src/main/AndroidManifest.xml; then
            echo "ERROR: AndroidX CarAppService detected"
            exit 1
          fi

          echo "AACast architecture verification: OK"

      - name: Verify manifest
        shell: bash
        run: |
          set -e

          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: Manifest not found"
            exit 1
          fi

          echo "Manifest:"
          cat "$MANIFEST"

          grep -q "com.carassistant.v9.AACastCarActivity" "$MANIFEST"
          grep -q "com.carassistant.v9.AACastCarService" "$MANIFEST"

          echo "Manifest verification: OK"

      - name: Create V10 launcher
        shell: bash
        run: |
          set -e

          # JAVA_DIR is relative to v10-source.
          # GitHub Actions is currently running from repository root,
          # therefore prepend v10-source.
          TARGET_DIR="v10-source/$JAVA_DIR"

          mkdir -p "$TARGET_DIR"

          cat > "$TARGET_DIR/CarAssistantLauncherView.java" <<'JAVA'
          package com.carassistant.v9;

          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.drawable.Drawable;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.GridLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;

          public class CarAssistantLauncherView extends LinearLayout {

              private final Context context;
              private final GridLayout grid;
              private final PackageManager pm;

              public CarAssistantLauncherView(Context context) {
                  super(context);

                  this.context = context;
                  this.pm = context.getPackageManager();

                  setOrientation(VERTICAL);
                  setBackgroundColor(Color.rgb(18, 18, 18));
                  setPadding(24, 20, 24, 20);

                  TextView title = new TextView(context);
                  title.setText("CAR ASSISTANT");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(24);
                  title.setGravity(Gravity.CENTER_VERTICAL);

                  addView(
                      title,
                      new LinearLayout.LayoutParams(
                          LayoutParams.MATCH_PARENT,
                          60
                      )
                  );

                  TextView subtitle = new TextView(context);
                  subtitle.setText("Android Auto Desktop");
                  subtitle.setTextColor(Color.LTGRAY);
                  subtitle.setTextSize(14);

                  addView(
                      subtitle,
                      new LinearLayout.LayoutParams(
                          LayoutParams.MATCH_PARENT,
                          40
                      )
                  );

                  grid = new GridLayout(context);
                  grid.setColumnCount(5);
                  grid.setRowCount(3);
                  grid.setUseDefaultMargins(true);

                  LinearLayout.LayoutParams gridParams =
                      new LinearLayout.LayoutParams(
                          LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      );

                  addView(grid, gridParams);

                  LinearLayout dock = new LinearLayout(context);
                  dock.setOrientation(HORIZONTAL);
                  dock.setGravity(Gravity.CENTER);

                  Button allApps = new Button(context);
                  allApps.setText("ALL APPS");

                  Button cast = new Button(context);
                  cast.setText("CAST");

                  Button refresh = new Button(context);
                  refresh.setText("REFRESH");

                  dock.addView(
                      allApps,
                      new LinearLayout.LayoutParams(0, 60, 1f)
                  );

                  dock.addView(
                      cast,
                      new LinearLayout.LayoutParams(0, 60, 1f)
                  );

                  dock.addView(
                      refresh,
                      new LinearLayout.LayoutParams(0, 60, 1f)
                  );

                  addView(
                      dock,
                      new LinearLayout.LayoutParams(
                          LayoutParams.MATCH_PARENT,
                          70
                      )
                  );

                  refresh.setOnClickListener(v -> loadApps());

                  allApps.setOnClickListener(v -> loadApps());

                  cast.setOnClickListener(v -> {
                      try {
                          if (context instanceof AACastCarActivity) {
                              ((AACastCarActivity) context).showCastRoot();
                          }
                      } catch (Throwable ignored) {
                      }
                  });

                  loadApps();
              }

              private void loadApps() {
                  grid.removeAllViews();

                  Intent launcherIntent = new Intent(Intent.ACTION_MAIN);
                  launcherIntent.addCategory(Intent.CATEGORY_LAUNCHER);

                  List<android.content.pm.ResolveInfo> apps =
                      pm.queryIntentActivities(
                          launcherIntent,
                          PackageManager.MATCH_ALL
                      );

                  Collections.sort(
                      apps,
                      new Comparator<android.content.pm.ResolveInfo>() {
                          @Override
                          public int compare(
                              android.content.pm.ResolveInfo a,
                              android.content.pm.ResolveInfo b
                          ) {
                              String aa =
                                  a.loadLabel(pm).toString();

                              String bb =
                                  b.loadLabel(pm).toString();

                              return aa.compareToIgnoreCase(bb);
                          }
                      }
                  );

                  int count = Math.min(apps.size(), 15);

                  for (int i = 0; i < count; i++) {
                      final android.content.pm.ResolveInfo info = apps.get(i);

                      Button appButton = new Button(context);
                      appButton.setText(
                          info.loadLabel(pm).toString()
                      );
                      appButton.setAllCaps(false);

                      Drawable icon = info.loadIcon(pm);
                      appButton.setCompoundDrawablesWithIntrinsicBounds(
                          null,
                          icon,
                          null,
                          null
                      );

                      appButton.setOnClickListener(v -> {
                          try {
                              String packageName =
                                  info.activityInfo.packageName;

                              Intent launch =
                                  pm.getLaunchIntentForPackage(packageName);

                              if (launch != null) {
                                  launch.addFlags(
                                      Intent.FLAG_ACTIVITY_NEW_TASK
                                  );
                                  context.startActivity(launch);
                              }
                          } catch (Throwable ignored) {
                          }
                      });

                      GridLayout.LayoutParams params =
                          new GridLayout.LayoutParams();

                      params.width = 0;
                      params.height = 0;
                      params.columnSpec =
                          GridLayout.spec(
                              GridLayout.UNDEFINED,
                              1f
                          );
                      params.rowSpec =
                          GridLayout.spec(
                              GridLayout.UNDEFINED,
                              1f
                          );

                      params.setMargins(8, 8, 8, 8);

                      grid.addView(appButton, params);
                  }
              }
          }
          JAVA

          test -f "$TARGET_DIR/CarAssistantLauncherView.java"

          echo "Launcher created:"
          echo "$TARGET_DIR/CarAssistantLauncherView.java"

      - name: Create V10 AACast Activity
        shell: bash
        run: |
          set -e

          # JAVA_DIR is relative to v10-source.
          TARGET_DIR="v10-source/$JAVA_DIR"

          mkdir -p "$TARGET_DIR"

          cat > "$TARGET_DIR/AACastCarActivity.java" <<'JAVA'
          package com.carassistant.v9;

          import android.os.Bundle;
          import android.view.View;
          import android.widget.FrameLayout;

          public class AACastCarActivity extends CarActivity {

              private FrameLayout root;
              private CarAssistantLauncherView launcher;
              private RootView castRoot;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  root = new FrameLayout(this);
                  root.setBackgroundColor(
                      android.graphics.Color.BLACK
                  );

                  launcher = new CarAssistantLauncherView(this);

                  root.addView(
                      launcher,
                      new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )
                  );

                  setContentView(root);
              }

              public void showCastRoot() {
                  try {
                      if (castRoot == null) {
                          castRoot = new RootView(this);
                      }

                      root.removeAllViews();

                      root.addView(
                          castRoot,
                          new FrameLayout.LayoutParams(
                              FrameLayout.LayoutParams.MATCH_PARENT,
                              FrameLayout.LayoutParams.MATCH_PARENT
                          )
                      );
                  } catch (Throwable ignored) {
                  }
              }

              public void showLauncher() {
                  if (root == null || launcher == null) {
                      return;
                  }

                  root.removeAllViews();

                  root.addView(
                      launcher,
                      new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )
                  );
              }
          }
          JAVA

          test -f "$TARGET_DIR/AACastCarActivity.java"

          echo "V10 AACast Activity created:"
          echo "$TARGET_DIR/AACastCarActivity.java"

      - name: Verify V10 source
        shell: bash
        run: |
          set -e

          echo "Checking V10 Java files..."

          grep -R "package com.carassistant.v9;" \
            "v10-source/$JAVA_DIR"

          test -f \
            "v10-source/$JAVA_DIR/CarAssistantLauncherView.java"

          test -f \
            "v10-source/$JAVA_DIR/AACastCarActivity.java"

          grep -q "CarAssistantLauncherView" \
            "v10-source/$JAVA_DIR/AACastCarActivity.java"

          echo "V10 source verification: OK"

      - name: Verify final manifest
        shell: bash
        run: |
          set -e

          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          grep -q "com.carassistant.v9.AACastCarActivity" "$MANIFEST"
          grep -q "com.carassistant.v9.AACastCarService" "$MANIFEST"

          echo "Final manifest verification: OK"

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -e

          cd v10-source

          gradle wrapper \
            --gradle-version 8.13 \
            --distribution-type bin

          chmod +x gradlew

      - name: Clean
        shell: bash
        run: |
          set -e

          cd v10-source
          ./gradlew clean --no-daemon

      - name: Build debug APK
        shell: bash
        run: |
          set -e

          cd v10-source

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Build release APK
        shell: bash
        run: |
          set -e

          cd v10-source

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Collect APKs
        shell: bash
        run: |
          set -e

          mkdir -p output

          DEBUG_APK="$(find v10-source/app/build/outputs/apk -type f -name '*debug*.apk' | head -n 1)"
          RELEASE_APK="$(find v10-source/app/build/outputs/apk -type f -name '*release*.apk' | head -n 1)"

          if [ -z "$DEBUG_APK" ]; then
            echo "ERROR: Debug APK not found"
            find v10-source/app/build/outputs -type f | sort
            exit 1
          fi

          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: Release APK not found"
            find v10-source/app/build/outputs -type f | sort
            exit 1
          fi

          cp "$DEBUG_APK" \
            output/CarAssistant-V10-debug.apk

          cp "$RELEASE_APK" \
            output/CarAssistant-V10-release.apk

          cd output

          sha256sum \
            CarAssistant-V10-debug.apk \
            CarAssistant-V10-release.apk \
            > SHA256SUMS.txt

          echo "Output:"
          ls -lh

          cat SHA256SUMS.txt

      - name: Upload V10 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10
          path: output/
          if-no-files-found: error
