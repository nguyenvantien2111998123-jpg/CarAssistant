name: Diagnose AndroidX Legacy Dex Duplicate

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: navigation-v1-source

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify legacy SDK files
        shell: bash
        run: |
          set -euo pipefail

          test -f app/libs/aasdk-legacy.dex
          test -f app/libs/aasdk-legacy.jar

          echo "PASS: legacy DEX/JAR exist"
          ls -lh app/libs/aasdk-legacy.dex app/libs/aasdk-legacy.jar

          echo "=== SHA256 ==="
          sha256sum \
            app/libs/aasdk-legacy.dex \
            app/libs/aasdk-legacy.jar

      - name: Inspect legacy JAR AndroidX classes
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "AndroidX/support classes in legacy JAR"
          echo "========================================"

          jar tf app/libs/aasdk-legacy.jar \
            | grep -E '^androidx/core/|^android/support/' \
            | tee /tmp/legacy-jar-androidx.txt \
            || true

          echo
          echo "=== Exact failing class ==="

          if grep -q \
            '^androidx/core/app/RemoteActionCompatParcelizer.class$' \
            /tmp/legacy-jar-androidx.txt; then

            echo "FOUND: RemoteActionCompatParcelizer in aasdk-legacy.jar"

          else

            echo "NOT FOUND in aasdk-legacy.jar"

          fi

      - name: Inspect legacy DEX
        shell: bash
        run: |
          set -euo pipefail

          DEXDUMP=""

          for p in \
            "$ANDROID_HOME/build-tools/36.0.0/dexdump" \
            "$ANDROID_HOME/build-tools/35.0.0/dexdump" \
            "$ANDROID_HOME/build-tools/34.0.0/dexdump"
          do
            if [ -x "$p" ]; then
              DEXDUMP="$p"
              break
            fi
          done

          if [ -z "$DEXDUMP" ]; then
            DEXDUMP="$(
              find "$ANDROID_HOME/build-tools" \
                -type f \
                -name dexdump \
                -print \
                -quit \
                || true
            )"
          fi

          echo "DEXDUMP=$DEXDUMP"

          if [ -n "$DEXDUMP" ] && [ -x "$DEXDUMP" ]; then

            echo "========================================"
            echo "Searching aasdk-legacy.dex"
            echo "========================================"

            "$DEXDUMP" app/libs/aasdk-legacy.dex \
              > /tmp/legacy-dexdump.txt

            grep -E \
              'androidx/core/|RemoteActionCompatParcelizer' \
              /tmp/legacy-dexdump.txt \
              | head -300 \
              || true

          else

            echo "WARNING: dexdump not available."

            APKANALYZER="$(
              find "$ANDROID_HOME" \
                -type f \
                -name apkanalyzer \
                -print \
                -quit \
                || true
            )"

            if [ -n "$APKANALYZER" ]; then
              "$APKANALYZER" \
                dex packages \
                app/libs/aasdk-legacy.dex \
                | grep -E \
                  'androidx.core|android.support' \
                | head -300 \
                || true
            fi

          fi

      - name: Gradle release dependency graph
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:dependencies \
            --configuration releaseRuntimeClasspath \
            > /tmp/releaseRuntimeClasspath.txt

          echo "========================================"
          echo "AndroidX Core dependencies"
          echo "========================================"

          grep -n -E \
            'androidx.core|core-ktx|core:' \
            /tmp/releaseRuntimeClasspath.txt \
            | head -300 \
            || true

          echo
          echo "========================================"
          echo "MapLibre dependencies"
          echo "========================================"

          grep -n -E \
            'maplibre|mapbox' \
            /tmp/releaseRuntimeClasspath.txt \
            | head -200 \
            || true

      - name: AndroidX Core dependency insight
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:dependencyInsight \
            --dependency androidx.core \
            --configuration releaseRuntimeClasspath \
            > /tmp/androidx-core-insight.txt

          echo "========================================"
          echo "ANDROIDX CORE DEPENDENCY INSIGHT"
          echo "========================================"

          cat /tmp/androidx-core-insight.txt

      - name: Check exact duplicate class
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "EXACT DUPLICATE CLASS"
          echo "========================================"

          echo "androidx.core.app.RemoteActionCompatParcelizer"

          if jar tf app/libs/aasdk-legacy.jar \
            | grep -q \
            '^androidx/core/app/RemoteActionCompatParcelizer.class$'
          then

            echo "FOUND in aasdk-legacy.jar"

          else

            echo "NOT FOUND in aasdk-legacy.jar"

          fi

          echo
          echo "========================================"
          echo "ROOT-CAUSE DIAGNOSTIC COMPLETE"
          echo "========================================"
          echo "No source/build.gradle files were modified."

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidx-legacy-dex-diagnostic
          path: |
            /tmp/releaseRuntimeClasspath.txt
            /tmp/androidx-core-insight.txt
            /tmp/legacy-dexdump.txt
            /tmp/legacy-jar-androidx.txt
          if-no-files-found: ignore
