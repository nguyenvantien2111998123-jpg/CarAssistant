name: Inspect Navigation V1 APK Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: navigation-v1-source

jobs:
  inspect-navigation-v1-apk:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # STEP 01
      # Checkout đúng main
      # ============================================================
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ============================================================
      # STEP 02
      # Xác nhận commit main
      # ============================================================
      - name: Verify main commit
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          echo "=== HEAD ==="
          git rev-parse HEAD

          echo
          echo "=== origin/main ==="
          git fetch origin main --depth=1
          git rev-parse origin/main

          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          echo
          echo "PASS: đang build đúng main."

      # ============================================================
      # STEP 03
      # Bằng chứng source/Gradle KHÔNG bị workflow này sửa
      # ============================================================
      - name: Record source and Gradle checksums before build
        shell: bash
        run: |
          set -euo pipefail

          echo "=== app/build.gradle SHA256 BEFORE BUILD ==="
          sha256sum app/build.gradle

          echo
          echo "=== Source inventory BEFORE BUILD ==="
          find app/src/main \
            -type f \
            -print \
            | sort \
            > /tmp/source_inventory_before.txt

          cat /tmp/source_inventory_before.txt

          echo
          echo "=== Legacy DEX ==="
          test -f app/libs/aasdk-legacy.dex
          test -s app/libs/aasdk-legacy.dex
          ls -lh app/libs/aasdk-legacy.dex
          sha256sum app/libs/aasdk-legacy.dex

      # ============================================================
      # STEP 04
      # Setup Java
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # STEP 05
      # Setup Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ============================================================
      # STEP 06
      # Android SDK
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

          echo "PASS: Android SDK installed."

      # ============================================================
      # STEP 07
      # Gradle wrapper
      # ============================================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew
          chmod +x ./gradlew

          echo "PASS: Gradle wrapper ready."

      # ============================================================
      # STEP 08
      # BUILD
      #
      # QUAN TRỌNG:
      # Không patch build.gradle.
      # Không patch source.
      # Không lọc DEX.
      # Chỉ build main hiện tại.
      # ============================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace

          echo
          echo "PASS: assembleRelease."

      # ============================================================
      # STEP 09
      # Kiểm tra source/Gradle sau build
      # ============================================================
      - name: Verify source and Gradle were not modified
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          echo "=== Git status ==="
          git status --short

          echo
          echo "=== app/build.gradle SHA256 AFTER BUILD ==="
          sha256sum navigation-v1-source/app/build.gradle

          echo
          echo "=== Compare source inventory ==="

          find navigation-v1-source/app/src/main \
            -type f \
            -print \
            | sort \
            > /tmp/source_inventory_after.txt

          diff -u \
            /tmp/source_inventory_before.txt \
            /tmp/source_inventory_after.txt

          echo
          echo "PASS: source inventory unchanged."

      # ============================================================
      # STEP 10
      # Xác định APK thật
      # ============================================================
      - name: Locate Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"
          test -s "$APK"

          echo "=== APK ==="
          ls -lh "$APK"

          echo
          echo "=== APK SHA256 ==="
          sha256sum "$APK"

          echo
          echo "APK=$APK" >> "$GITHUB_ENV"

      # ============================================================
      # STEP 11
      # IN TOÀN BỘ ZIP ENTRY
      #
      # Đây là bằng chứng trực tiếp từ APK.
      # Không dùng unzip -l | grep vì pipefail.
      # ============================================================
      - name: Dump APK ZIP entries
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          echo "============================================================"
          echo "ALL FILES INSIDE APK"
          echo "============================================================"

          unzip -Z1 "$APK" \
            > /tmp/apk_zip_entries.txt

          cat /tmp/apk_zip_entries.txt

          echo
          echo "=== ZIP ENTRY COUNT ==="
          wc -l /tmp/apk_zip_entries.txt

          echo
          echo "PASS: APK ZIP inventory collected."

      # ============================================================
      # STEP 12
      # LẤY CHÍNH XÁC CÁC DEX TRONG APK
      # ============================================================
      - name: Extract APK DEX evidence
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          echo "============================================================"
          echo "DEX ENTRIES DIRECTLY FROM APK"
          echo "============================================================"

          awk '
            /^classes\.dex$/ {
              print
              next
            }

            /^classes[0-9]+\.dex$/ {
              print
            }
          ' /tmp/apk_zip_entries.txt \
            > /tmp/apk_dex_entries.txt

          echo
          echo "=== DEX ENTRIES ==="

          if [ -s /tmp/apk_dex_entries.txt ]; then
            cat /tmp/apk_dex_entries.txt
          else
            echo "NO ROOT classes*.dex ENTRY FOUND."
          fi

          echo
          echo "=== ANY .dex ENTRY ==="

          grep -F '.dex' /tmp/apk_zip_entries.txt \
            > /tmp/apk_any_dex_entries.txt \
            || true

          if [ -s /tmp/apk_any_dex_entries.txt ]; then
            cat /tmp/apk_any_dex_entries.txt
          else
            echo "NO .dex ENTRY FOUND ANYWHERE."
          fi

      # ============================================================
      # STEP 13
      # SHA256 TỪNG DEX TRONG APK
      #
      # Không sửa DEX.
      # Chỉ đọc rồi tính SHA256.
      # ============================================================
      - name: SHA256 every DEX directly from APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          LEGACY="app/libs/aasdk-legacy.dex"

          mkdir -p /tmp/apk_dex_evidence

          echo "============================================================"
          echo "SOURCE LEGACY DEX"
          echo "============================================================"

          LEGACY_SHA="$(sha256sum "$LEGACY" | awk '{print $1}')"
          LEGACY_SIZE="$(stat -c '%s' "$LEGACY")"

          echo "File   : $LEGACY"
          echo "Size   : $LEGACY_SIZE bytes"
          echo "SHA256 : $LEGACY_SHA"

          echo
          echo "============================================================"
          echo "DEX FILES INSIDE APK"
          echo "============================================================"

          : > /tmp/apk_dex_sha256.txt

          if [ ! -s /tmp/apk_dex_entries.txt ]; then
            echo "ERROR: APK has no root classes*.dex."
            exit 1
          fi

          while IFS= read -r ENTRY; do

            echo
            echo "------------------------------------------------------------"
            echo "ENTRY: $ENTRY"
            echo "------------------------------------------------------------"

            SAFE_NAME="$(basename "$ENTRY")"

            OUT="/tmp/apk_dex_evidence/$SAFE_NAME"

            unzip -p "$APK" "$ENTRY" > "$OUT"

            SIZE="$(stat -c '%s' "$OUT")"
            SHA="$(sha256sum "$OUT" | awk '{print $1}')"

            echo "Size   : $SIZE bytes"
            echo "SHA256 : $SHA"

            printf '%s|%s|%s\n' \
              "$ENTRY" \
              "$SIZE" \
              "$SHA" \
              >> /tmp/apk_dex_sha256.txt

          done < /tmp/apk_dex_entries.txt

          echo
          echo "============================================================"
          echo "SUMMARY"
          echo "============================================================"

          cat /tmp/apk_dex_sha256.txt

          echo
          echo "Source legacy SHA:"
          echo "$LEGACY_SHA"

          echo
          echo "APK DEX matching source legacy SHA:"

          MATCH_COUNT=0

          while IFS='|' read -r ENTRY SIZE SHA; do

            if [ "$SHA" = "$LEGACY_SHA" ]; then
              echo "MATCH: $ENTRY"
              MATCH_COUNT=$((MATCH_COUNT + 1))
            fi

          done < /tmp/apk_dex_sha256.txt

          echo
          echo "MATCH COUNT = $MATCH_COUNT"

          if [ "$MATCH_COUNT" -eq 0 ]; then
            echo "RESULT: NO BYTE-IDENTICAL LEGACY DEX FOUND IN APK."
          elif [ "$MATCH_COUNT" -eq 1 ]; then
            echo "RESULT: EXACTLY ONE BYTE-IDENTICAL LEGACY DEX FOUND."
          else
            echo "RESULT: MORE THAN ONE BYTE-IDENTICAL LEGACY DEX FOUND."
          fi

      # ============================================================
      # STEP 14
      # BYTE-FOR-BYTE CMP
      #
      # Chỉ chạy nếu có đúng một SHA match.
      # ============================================================
      - name: Byte-for-byte compare matching legacy DEX
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          LEGACY="app/libs/aasdk-legacy.dex"

          LEGACY_SHA="$(sha256sum "$LEGACY" | awk '{print $1}')"

          MATCH_COUNT=0
          MATCH_ENTRY=""

          while IFS='|' read -r ENTRY SIZE SHA; do

            if [ "$SHA" = "$LEGACY_SHA" ]; then
              MATCH_COUNT=$((MATCH_COUNT + 1))
              MATCH_ENTRY="$ENTRY"
            fi

          done < /tmp/apk_dex_sha256.txt

          echo "MATCH COUNT = $MATCH_COUNT"

          if [ "$MATCH_COUNT" -eq 0 ]; then
            echo "No matching DEX."
            echo "Byte-for-byte comparison cannot be performed."
            exit 0
          fi

          if [ "$MATCH_COUNT" -ne 1 ]; then
            echo "More than one matching DEX."
            echo "Byte-for-byte comparison is ambiguous."
            exit 0
          fi

          OUT="/tmp/apk_dex_evidence/$(basename "$MATCH_ENTRY")"

          echo
          echo "Matched APK entry:"
          echo "$MATCH_ENTRY"

          echo
          echo "=== cmp ==="

          if cmp -s "$LEGACY" "$OUT"; then
            echo "PASS: APK DEX is byte-for-byte identical to aasdk-legacy.dex."
          else
            echo "FAIL: SHA unexpectedly matched but cmp failed."
            exit 1
          fi

          echo
          echo "=== Source size ==="
          stat -c '%s' "$LEGACY"

          echo
          echo "=== APK DEX size ==="
          stat -c '%s' "$OUT"

      # ============================================================
      # STEP 15
      # APK ZIP metadata / compression evidence
      # ============================================================
      - name: Inspect APK DEX ZIP metadata
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          echo "============================================================"
          echo "ZIPINFO DEX METADATA"
          echo "============================================================"

          zipinfo -l "$APK" \
            | awk '
              /classes\.dex/ ||
              /classes[0-9]+\.dex/
            {
              print
            }
          ' \
            > /tmp/apk_dex_zipinfo.txt

          if [ -s /tmp/apk_dex_zipinfo.txt ]; then
            cat /tmp/apk_dex_zipinfo.txt
          else
            echo "NO classes*.dex ZIP metadata found."
          fi

      # ============================================================
      # STEP 16
      # Lưu báo cáo
      # ============================================================
      - name: Prepare APK evidence report
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/navigation-v1-apk-evidence

          cp /tmp/apk_zip_entries.txt \
            /tmp/navigation-v1-apk-evidence/

          cp /tmp/apk_dex_entries.txt \
            /tmp/navigation-v1-apk-evidence/

          cp /tmp/apk_any_dex_entries.txt \
            /tmp/navigation-v1-apk-evidence/

          cp /tmp/apk_dex_sha256.txt \
            /tmp/navigation-v1-apk-evidence/

          cp /tmp/apk_dex_zipinfo.txt \
            /tmp/navigation-v1-apk-evidence/

          sha256sum \
            app-release.apk \
            2>/dev/null \
            || true

          sha256sum \
            app/build/outputs/apk/release/app-release.apk \
            > /tmp/navigation-v1-apk-evidence/apk.sha256

          sha256sum \
            app/libs/aasdk-legacy.dex \
            > /tmp/navigation-v1-apk-evidence/source-legacy-dex.sha256

          echo
          echo "=== EVIDENCE FILES ==="

          find /tmp/navigation-v1-apk-evidence \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

      # ============================================================
      # STEP 17
      # Upload APK thật
      # ============================================================
      - name: Upload APK evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-v1-apk-evidence
          path: navigation-v1-source/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # ============================================================
      # STEP 18
      # Upload toàn bộ báo cáo bằng chứng
      # ============================================================
      - name: Upload APK evidence reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-v1-apk-evidence-reports
          path: |
            /tmp/navigation-v1-apk-evidence/apk.sha256
            /tmp/navigation-v1-apk-evidence/source-legacy-dex.sha256
            /tmp/navigation-v1-apk-evidence/apk_zip_entries.txt
            /tmp/navigation-v1-apk-evidence/apk_dex_entries.txt
            /tmp/navigation-v1-apk-evidence/apk_any_dex_entries.txt
            /tmp/navigation-v1-apk-evidence/apk_dex_sha256.txt
            /tmp/navigation-v1-apk-evidence/apk_dex_zipinfo.txt
          if-no-files-found: warn
