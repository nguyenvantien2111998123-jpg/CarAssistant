name: Rename Navigation V1 Source to V10

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Rename source folder
        run: |
          set -e
          test -d navigation-v1-source
          test ! -e v10-source
          mv navigation-v1-source v10-source
          git status --short

      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename navigation-v1-source to v10-source"
          git push origin HEAD:main
