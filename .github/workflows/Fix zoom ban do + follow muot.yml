name: fix zoom va auto follow muot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation-follow-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      # ============================================================
      # 0. CHECKOUT CURRENT MAIN
      # ============================================================

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 1. VERIFY EXACT CURRENT BASELINE
      # ============================================================

      - name: Verify current NavigationMapView baseline
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          GRADLE="v10-source/app/build.gradle"

          test -f "$FILE"
          test -f "$GRADLE"

          echo "========================================"
          echo "CURRENT MAIN"
          echo "========================================"

          echo "Commit:"
          git rev-parse HEAD

          echo ""
          echo "NavigationMapView SHA:"
          ACTUAL_SHA="$(git hash-object "$FILE")"
          echo "$ACTUAL_SHA"

          EXPECTED_SHA="1600edf884196a146ce5f4233f8de0a8ea282a4e"

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo ""
            echo "ERROR: NavigationMapView baseline mismatch."
            echo "Expected: $EXPECTED_SHA"
            echo "Actual:   $ACTUAL_SHA"
            exit 1
          fi

          echo "PASS: NavigationMapView baseline"

          grep -q '^package com\.carassistant\.v10;' "$FILE"
          echo "PASS: package com.carassistant.v10"

          grep -q 'org\.maplibre\.gl:android-sdk:11\.11\.0' "$GRADLE"
          echo "PASS: MapLibre 11.11.0"

      # ============================================================
      # 2. VERIFY ORIGINAL SOURCE ANCHORS
      # ============================================================

      - name: Verify original Navigation source
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          checks = [
              (
                  "NavigationMapView class",
                  r"class\s+NavigationMapView\s+extends\s+FrameLayout"
              ),
              (
                  "AUTO_FOLLOW_ZOOM 16.0",
                  r"private\s+static\s+final\s+double\s+AUTO_FOLLOW_ZOOM\s*=\s*16\.0\s*;"
              ),
              (
                  "follow button ◎",
                  r'addControlButton\s*\(\s*controls\s*,\s*"◎"\s*,\s*"Recenter and resume auto follow"\s*,\s*v\s*->\s*recenter\s*\(\s*\)\s*\)'
              ),
              (
                  "location component enabled",
                  r"setLocationComponentEnabled\s*\(\s*true\s*\)"
              ),
              (
                  "startAutoFollow",
                  r"private\s+void\s+startAutoFollow\s*\(\s*\)"
              ),
              (
                  "recenter",
                  r"public\s+void\s+recenter\s*\(\s*\)"
              ),
          ]

          failures = 0

          for name, pattern in checks:

              count = len(
                  re.findall(
                      pattern,
                      text,
                      re.MULTILINE | re.DOTALL
                  )
              )

              if count == 1:
                  print(f"PASS: {name}")
              else:
                  print(f"FAIL: {name} -> {count} matches")
                  failures += 1

          if failures:
              print("")
              print("ERROR: Current source is not the expected baseline.")
              sys.exit(1)

          print("")
          print("PASS: Original Navigation source verified.")
          PY

      # ============================================================
      # 3. PATCH FOLLOW V2
      # ============================================================

      - name: Patch NavigationMapView Follow V2
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          # ========================================================
          # 1. RenderMode import
          # ========================================================

          import_line = (
              "import org.maplibre.android.location.modes.RenderMode;"
          )

          if import_line not in text:

              anchor = (
                  "import org.maplibre.android.location.modes.CameraMode;"
              )

              if anchor not in text:
                  raise SystemExit(
                      "ERROR: CameraMode import not found."
                  )

              text = text.replace(
                  anchor,
                  anchor + "\n" + import_line,
                  1
              )

              print("PASS: Added RenderMode import")

          else:
              print("PASS: RenderMode import already present")

          # ========================================================
          # 2. AUTO_FOLLOW_ZOOM 16 -> 17
          # ========================================================

          pattern = (
              r"private\s+static\s+final\s+double\s+"
              r"AUTO_FOLLOW_ZOOM\s*=\s*16\.0\s*;"
          )

          matches = list(
              re.finditer(
                  pattern,
                  text
              )
          )

          if len(matches) == 1:

              text = re.sub(
                  pattern,
                  "private static final double AUTO_FOLLOW_ZOOM = 17.0;",
                  text,
                  count=1
              )

              print("PASS: AUTO_FOLLOW_ZOOM 16.0 -> 17.0")

          elif re.search(
              r"AUTO_FOLLOW_ZOOM\s*=\s*17\.0\s*;",
              text
          ):

              print("PASS: AUTO_FOLLOW_ZOOM already 17.0")

          else:

              raise SystemExit(
                  "ERROR: AUTO_FOLLOW_ZOOM anchor not found."
              )

          # ========================================================
          # 3. FOLLOW BUTTON
          #
          # IMPORTANT:
          # Use regex instead of exact whitespace replacement.
          # ========================================================

          follow_pattern = (
              r'addControlButton\s*\(\s*'
              r'controls\s*,\s*'
              r'"◎"\s*,\s*'
              r'"Recenter and resume auto follow"\s*,\s*'
              r'v\s*->\s*recenter\s*\(\s*\)\s*'
              r'\)\s*;'
          )

          follow_matches = list(
              re.finditer(
                  follow_pattern,
                  text,
                  re.MULTILINE | re.DOTALL
              )
          )

          if len(follow_matches) == 1:

              replacement = '''addControlButton(
                controls,
                "➤",
                "Follow current location",
                v -> followCurrentLocation());'''

              text = (
                  text[:follow_matches[0].start()]
                  + replacement
                  + text[follow_matches[0].end():]
              )

              print("PASS: Follow button patched")

          elif "v -> followCurrentLocation()" in text:

              print("PASS: Follow button already patched")

          else:

              print("ERROR: Current follow button block not found.")

              print("")
              print("Relevant source:")

              lines = text.splitlines()

              for i, line in enumerate(lines):

                  if 'addControlButton(' in line:

                      start = max(0, i - 2)
                      end = min(len(lines), i + 12)

                      for n in range(start, end):
                          print(
                              f"{n + 1:4}: {lines[n]}"
                          )

                      break

              raise SystemExit(1)

          # ========================================================
          # 4. GPS RENDER MODE
          # ========================================================

          gps_anchor = '''        map.getLocationComponent()
                .setLocationComponentEnabled(true);

          startAutoFollow();'''

          gps_replacement = '''        map.getLocationComponent()
                .setLocationComponentEnabled(true);

          map.getLocationComponent()
                .setRenderMode(RenderMode.GPS);

           startAutoFollow();'''

          if "setRenderMode(RenderMode.GPS);" not in text:

              if gps_anchor not in text:
                  raise SystemExit(
                      "ERROR: Location component anchor not found."
                  )

              text = text.replace(
                  gps_anchor,
                  gps_replacement,
                  1
              )

              print("PASS: Added GPS render mode")

          else:
              print("PASS: GPS render mode already present")

          # ========================================================
          # 5. INSERT followCurrentLocation()
          # ========================================================

          if "private void followCurrentLocation()" not in text:

              marker = "    public void zoomIn() {"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: zoomIn() insertion marker not found."
                  )

              method = '''    private void followCurrentLocation() {

           if (map == null) {
            return;
          }

           try {

            Location location =
                    map.getLocationComponent()
                            .getLastKnownLocation();

            if (location == null) {

                startAutoFollow();

                return;
            }

            map.getLocationComponent()
                    .setRenderMode(RenderMode.GPS);

            LatLng current =
                    new LatLng(
                            location.getLatitude(),
                            location.getLongitude());

            map.animateCamera(
                    CameraUpdateFactory.newLatLngZoom(
                            current,
                            AUTO_FOLLOW_ZOOM),
                    500);

            map.getLocationComponent()
                    .setCameraMode(
                            CameraMode.TRACKING,
                            500L,
                            AUTO_FOLLOW_ZOOM,
                            null,
                            0.0,
                            null);

           } catch (Exception ignored) {
           }
           }

           '''

              text = text.replace(
                  marker,
                  method + marker,
                  1
              )

              print(
                  "PASS: followCurrentLocation() inserted"
              )

          else:

              print(
                  "PASS: followCurrentLocation() already present"
              )

          # ========================================================
          # 6. REPLACE recenter() BODY
          # ========================================================

          recenter_pattern = re.compile(
              r'public\s+void\s+recenter\s*\(\s*\)\s*\{.*?\n\s*\}',
              re.MULTILINE | re.DOTALL
          )

          matches = list(
              recenter_pattern.finditer(text)
          )

          if len(matches) != 1:

              raise SystemExit(
                  f"ERROR: Expected exactly one recenter(), "
                  f"found {len(matches)}."
              )

          replacement = '''public void recenter() {

          followCurrentLocation();
          }'''

          text = (
              text[:matches[0].start()]
              + replacement
              + text[matches[0].end():]
          )

          print(
              "PASS: recenter() redirected to followCurrentLocation()"
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print("")
          print(
              "PASS: Follow V2 patch completed in workspace."
          )
          PY

      # ============================================================
      # 4. VERIFY PATCH
      # ============================================================

      - name: Verify Follow V2 patch
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          text = Path(sys.argv[1]).read_text(
              encoding="utf-8"
          )

          checks = [
              (
                  "RenderMode import",
                  r"import\s+org\.maplibre\.android\.location\.modes\.RenderMode;"
              ),
              (
                  "AUTO_FOLLOW_ZOOM 17",
                  r"AUTO_FOLLOW_ZOOM\s*=\s*17\.0\s*;"
              ),
              (
                  "Follow button",
                  r'addControlButton\s*\(\s*controls\s*,\s*"➤"\s*,\s*"Follow current location"\s*,\s*v\s*->\s*followCurrentLocation\s*\(\s*\)\s*\)\s*;'
              ),
              (
                  "GPS render mode",
                  r"setRenderMode\s*\(\s*RenderMode\.GPS\s*\)"
              ),
              (
                  "followCurrentLocation",
                  r"private\s+void\s+followCurrentLocation\s*\(\s*\)"
              ),
              (
                  "recenter delegates",
                  r"public\s+void\s+recenter\s*\(\s*\)\s*\{\s*followCurrentLocation\s*\(\s*\)\s*;\s*\}"
              ),
          ]

          failures = 0

          for name, pattern in checks:

              if re.search(
                  pattern,
                  text,
                  re.MULTILINE | re.DOTALL
              ):
                  print(f"PASS: {name}")
              else:
                  print(f"FAIL: {name}")
                  failures += 1

          if failures:
              sys.exit(1)

          print("")
          print("PASS: Follow V2 verification complete.")
          PY

      # ============================================================
      # 5. SHOW DIFF
      # ============================================================

      - name: Show NavigationMapView diff
        shell: bash
        run: |
          set -euo pipefail

          git diff -- \
            v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java

      # ============================================================
      # 6. COMPILE
      # ============================================================

      - name: Compile debug Java
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            compileDebugJavaWithJavac

      # ============================================================
      # 7. BUILD APK
      # ============================================================

      - name: Build debug APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ============================================================
      # 8. PACKAGE APK
      # ============================================================

      - name: Package Navigation Follow V2 APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          mkdir -p dist

          cp \
            "$APK" \
            "dist/CarAssistant-Navigation-Follow-V2.apk"

          sha256sum \
            "dist/CarAssistant-Navigation-Follow-V2.apk" \
            > \
            "dist/CarAssistant-Navigation-Follow-V2.sha256"

          echo ""
          echo "========================================"
          echo "APK CREATED"
          echo "========================================"

          ls -lh \
            "dist/CarAssistant-Navigation-Follow-V2.apk"

          cat \
            "dist/CarAssistant-Navigation-Follow-V2.sha256"

      # ============================================================
      # 9. UPLOAD
      # ============================================================

      - name: Upload Navigation Follow V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-Navigation-Follow-V2
          path: |
            dist/CarAssistant-Navigation-Follow-V2.apk
            dist/CarAssistant-Navigation-Follow-V2.sha256
          if-no-files-found: error
          retention-days: 14
