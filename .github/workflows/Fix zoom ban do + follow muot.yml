name: CarAssistant V10 Follow V8 Direct APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build V10 Follow V8 Direct APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # ============================================================
      # 0. CHECKOUT
      # ============================================================

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ============================================================
      # 1. VERIFY PROJECT STRUCTURE
      # ============================================================

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          GRADLE="v10-source/app/build.gradle"
          GRADLEW="v10-source/gradlew"

          test -s "$NAV"
          test -s "$GRADLE"
          test -s "$GRADLEW"

          echo "PASS: NavigationMapView exists"
          echo "PASS: build.gradle exists"
          echo "PASS: Gradle wrapper exists"

      # ============================================================
      # 2. VERIFY CURRENT V8 SOURCE
      # ============================================================

      - name: Verify Follow V8 source
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          GRADLE="v10-source/app/build.gradle"

          EXPECTED_NAV_SHA="4362ba9cffe209e6554fd0953495ed9875b8b882"
          EXPECTED_GRADLE_SHA="4d512337d46324a33a685d8cdb095e4ecacd3ceb"

          ACTUAL_NAV_SHA="$(git hash-object "$NAV")"
          ACTUAL_GRADLE_SHA="$(git hash-object "$GRADLE")"

          echo "NavigationMapView:"
          echo "$ACTUAL_NAV_SHA"

          echo "build.gradle:"
          echo "$ACTUAL_GRADLE_SHA"

          test "$ACTUAL_NAV_SHA" = "$EXPECTED_NAV_SHA"
          test "$ACTUAL_GRADLE_SHA" = "$EXPECTED_GRADLE_SHA"

          grep -Fq \
            'import org.maplibre.android.location.modes.RenderMode;' \
            "$NAV"

          grep -Fq \
            'private static final double AUTO_FOLLOW_ZOOM = 17.0;' \
            "$NAV"

          grep -Fq \
            'private void followCurrentLocation() {' \
            "$NAV"

          grep -Fq \
            '.setRenderMode(RenderMode.GPS);' \
            "$NAV"

          grep -Fq \
            'CameraMode.TRACKING' \
            "$NAV"

          echo "PASS: Follow V8 source"
          echo "PASS: build.gradle unchanged"

      # ============================================================
      # 3. VERIFY NO DEX PACKAGING PIPELINE
      # ============================================================

      - name: Verify direct APK build mode
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="v10-source/app/build.gradle"

          if grep -Fq \
              "tasks.matching { it.name == 'mergeDexRelease' }.configureEach" \
              "$GRADLE"; then
            echo "INFO: legacy mergeDexRelease block exists in source."
            echo "INFO: It will NOT be used by this workflow."
          fi

          echo "PASS: workflow will not modify build.gradle"
          echo "PASS: workflow will not inject external DEX"
          echo "PASS: workflow will not rewrite APK contents"

      # ============================================================
      # 4. JAVA COMPILE
      # ============================================================

      - name: Java compile
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:compileDebugJavaWithJavac

          echo "PASS: Java compile"

      # ============================================================
      # 5. DIRECT APK BUILD
      #
      # IMPORTANT:
      # No temporary Gradle modification.
      # No legacy DEX extraction.
      # No DEX injection.
      # ============================================================

      - name: Assemble direct Debug APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "PASS: Gradle assembleDebug"
          echo "PASS: direct APK created"
          echo "APK: $APK"

          ls -lh "$APK"

      # ============================================================
      # 6. VERIFY APK
      # ============================================================

      - name: Verify direct APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "========================================"
          echo "APK SHA256"
          echo "========================================"

          sha256sum "$APK"

          echo ""
          echo "========================================"
          echo "APK DEX FILES"
          echo "========================================"

          unzip -Z1 "$APK" \
            | grep -E '^classes[0-9]*\.dex$' \
            | sort -V

          DEX_COUNT="$(
            unzip -Z1 "$APK" \
              | grep -E '^classes[0-9]*\.dex$' \
              | wc -l \
              | tr -d ' '
          )"

          test "$DEX_COUNT" -ge 1

          echo ""
          echo "PASS: APK contains normal Gradle-generated DEX"
          echo "DEX count: $DEX_COUNT"
          echo "PASS: no external DEX injection step was executed"

      # ============================================================
      # 7. VERIFY WORKSPACE WAS NOT MODIFIED
      # ============================================================

      - name: Verify protected source files
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          GRADLE="v10-source/app/build.gradle"

          EXPECTED_NAV_SHA="4362ba9cffe209e6554fd0953495ed9875b8b882"
          EXPECTED_GRADLE_SHA="4d512337d46324a33a685d8cdb095e4ecacd3ceb"

          test "$(git hash-object "$NAV")" = \
            "$EXPECTED_NAV_SHA"

          test "$(git hash-object "$GRADLE")" = \
            "$EXPECTED_GRADLE_SHA"

          git diff --check

          echo "PASS: NavigationMapView unchanged"
          echo "PASS: build.gradle unchanged"
          echo "PASS: workspace integrity"

      # ============================================================
      # 8. PACKAGE APK
      # ============================================================

      - name: Package Direct APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          mkdir -p dist

          cp \
            "$APK" \
            "dist/CarAssistant-V10-Follow-V8-Direct.apk"

          sha256sum \
            "dist/CarAssistant-V10-Follow-V8-Direct.apk" \
            > \
            "dist/CarAssistant-V10-Follow-V8-Direct.sha256"

          echo "========================================"
          echo "DIRECT APK"
          echo "========================================"

          cat \
            "dist/CarAssistant-V10-Follow-V8-Direct.sha256"

      # ============================================================
      # 9. UPLOAD
      # ============================================================

      - name: Upload Direct APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Follow-V8-Direct
          path: |
            dist/CarAssistant-V10-Follow-V8-Direct.apk
            dist/CarAssistant-V10-Follow-V8-Direct.sha256
          if-no-files-found: error

      # ============================================================
      # 10. FINAL PASS
      # ============================================================

      - name: Final PASS
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CARASSISTANT V10 FOLLOW V8 DIRECT APK : PASS"
          echo "============================================================"
          echo "Source verification       : PASS"
          echo "Navigation V8 preserved   : PASS"
          echo "build.gradle preserved    : PASS"
          echo "Java compile              : PASS"
          echo "Gradle assembleDebug      : PASS"
          echo "Direct APK                : PASS"
          echo "External DEX injection    : NOT USED"
          echo "APK packaging             : PASS"
          echo "Artifact upload           : PASS"
          echo "============================================================"
