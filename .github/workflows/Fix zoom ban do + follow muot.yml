name: Patch NavigationMapView Follow V4 Safe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-navigation-map-view:
    runs-on: ubuntu-latest

    steps:
      - name: 01 - Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 02 - Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 03 - Parse running workflow YAML
        shell: bash
        run: |
          set -euo pipefail

          WORKFLOW_REL="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          WORKFLOW_REL="${WORKFLOW_REL%@*}"

          case "$WORKFLOW_REL" in
            .github/workflows/*.yml|.github/workflows/*.yaml)
              ;;
            *)
              echo "FAIL: invalid workflow path: $WORKFLOW_REL"
              exit 1
              ;;
          esac

          test -s "$WORKFLOW_REL"

          export WORKFLOW_REL

          ruby <<'RUBY'
          require "yaml"

          path = ENV.fetch("WORKFLOW_REL")
          text = File.read(path, encoding: "UTF-8")

          abort("FAIL: workflow file is empty") if text.strip.empty?

          data = YAML.load_file(path)

          abort("FAIL: YAML root is not a mapping") unless data.is_a?(Hash)

          abort("FAIL: missing top-level on") unless
            data.key?("on") || data.key?(true)

          abort("FAIL: missing top-level jobs") unless
            data.key?("jobs")

          jobs = data["jobs"]

          abort("FAIL: jobs is not a mapping") unless
            jobs.is_a?(Hash)

          abort("FAIL: jobs is empty") if jobs.empty?

          jobs.each do |job_id, job|
            abort("FAIL: invalid job id #{job_id}") unless
              job_id.is_a?(String)

            abort("FAIL: job #{job_id} is not a mapping") unless
              job.is_a?(Hash)

            steps = job["steps"]

            abort("FAIL: job #{job_id} has no steps") unless
              steps.is_a?(Array)

            abort("FAIL: job #{job_id} has zero steps") if
              steps.empty?
          end

          puts "PASS: workflow YAML parsed successfully"
          puts "PASS: workflow structure is valid"
          RUBY

      - name: 04 - Verify repository structure
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          GRADLE="v10-source/app/build.gradle"
          LEGACY="v10-source/app/libs/aasdk-legacy.dex"
          GRADLEW="v10-source/gradlew"

          test -s "$NAV"
          test -s "$GRADLE"
          test -s "$LEGACY"
          test -s "$GRADLEW"

          echo "PASS: repository structure"

      - name: 05 - Verify exact source baseline
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          GRADLE="v10-source/app/build.gradle"
          LEGACY="v10-source/app/libs/aasdk-legacy.dex"

          EXPECTED_NAV_SHA="1600edf884196a146ce5f4233f8de0a8ea282a4e"
          EXPECTED_GRADLE_SHA="4d512337d46324a33a685d8cdb095e4ecacd3ceb"

          test "$(git hash-object "$NAV")" = "$EXPECTED_NAV_SHA"
          test "$(git hash-object "$GRADLE")" = "$EXPECTED_GRADLE_SHA"

          test -z "$(git status --porcelain -- "$NAV")"
          test -z "$(git status --porcelain -- "$GRADLE")"
          test -z "$(git status --porcelain -- "$LEGACY")"

          grep -Fq \
            'import org.maplibre.android.location.modes.CameraMode;' \
            "$NAV"

          ! grep -Fq \
            'import org.maplibre.android.location.modes.RenderMode;' \
            "$NAV"

          grep -Fq \
            'private static final double AUTO_FOLLOW_ZOOM = 16.0;' \
            "$NAV"

          grep -Fq \
            'private void startAutoFollow() {' \
            "$NAV"

          grep -Fq \
            'CameraMode.TRACKING' \
            "$NAV"

          grep -Fq \
            'tasks.matching { it.name == '\''mergeDexRelease'\'' }.configureEach' \
            "$GRADLE"

          grep -Fq \
            'app/libs/aasdk-legacy.dex' \
            "$GRADLE"

          echo "PASS: exact NavigationMapView baseline"
          echo "PASS: exact build.gradle baseline"
          echo "PASS: legacy DEX baseline"
          echo "PASS: baseline structure"

      - name: 06 - Create Python patch script
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/patch_navigation.py <<'PY'
          from pathlib import Path

          NAV = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          )

          EXPECTED_SHA = (
              "1600edf884196a146ce5f4233f8de0a8ea282a4e"
          )

          text = NAV.read_text(encoding="utf-8")

          def require_once(old: str, new: str, label: str) -> None:
              global text

              count = text.count(old)

              if count != 1:
                  raise SystemExit(
                      f"FAIL: expected exactly one occurrence for "
                      f"{label}, got {count}"
                  )

              text = text.replace(old, new, 1)

          actual_sha = __import__("hashlib").sha1(
              b"blob %d\0" % len(
                  NAV.read_bytes()
              ) + NAV.read_bytes()
          ).hexdigest()

          if actual_sha != EXPECTED_SHA:
              raise SystemExit(
                  "FAIL: NavigationMapView baseline SHA changed before patch: "
                  + actual_sha
              )

          require_once(
              "import org.maplibre.android.location.modes.CameraMode;\n",
              "import org.maplibre.android.location.modes.CameraMode;\n"
              "import org.maplibre.android.location.modes.RenderMode;\n",
              "RenderMode import",
          )

          require_once(
              "private static final double AUTO_FOLLOW_ZOOM = 16.0;",
              "private static final double AUTO_FOLLOW_ZOOM = 17.5;",
              "AUTO_FOLLOW_ZOOM",
          )

          require_once(
              """        LocationComponentOptions options =
                  LocationComponentOptions
                          .builder(context)
                          .pulseEnabled(true)
                          .trackingGesturesManagement(true)
                          .build();""",
              """        LocationComponentOptions options =
                  LocationComponentOptions
                          .builder(context)
                          .pulseEnabled(true)
                          .trackingGesturesManagement(true)
                          .compassAnimationEnabled(true)
                          .build();""",
              "LocationComponentOptions",
          )

          require_once(
              """        map.getLocationComponent()
                .setLocationComponentEnabled(true);

          startAutoFollow();""",
              """        map.getLocationComponent()
                .setLocationComponentEnabled(true);

          map.getLocationComponent()
                .setRenderMode(RenderMode.GPS);

          startAutoFollow();""",
              "GPS render mode",
          )

          require_once(
              """                            CameraMode.TRACKING,
                            800L,
                            AUTO_FOLLOW_ZOOM,""",
              """                            CameraMode.TRACKING_GPS,
                            600L,
                            AUTO_FOLLOW_ZOOM,""",
              "auto-follow camera mode",
          )

          require_once(
              """                            CameraMode.TRACKING,
                            500L,
                            AUTO_FOLLOW_ZOOM,""",
              """                            CameraMode.TRACKING_GPS,
                            600L,
                            AUTO_FOLLOW_ZOOM,""",
              "recenter camera mode",
          )

          NAV.write_text(text, encoding="utf-8")

          print("PASS: NavigationMapView patch applied")
          print("PASS: zoom 17.5")
          print("PASS: GPS location render mode")
          print("PASS: GPS camera tracking")
          print("PASS: smooth 600ms follow transition")
          print("PASS: compass animation enabled")
          PY

      - name: 07 - Python parse and execute navigation patch
        shell: bash
        run: |
          set -euo pipefail

          python3 -m py_compile /tmp/patch_navigation.py

          echo "PASS: Python syntax parse"

          python3 /tmp/patch_navigation.py

          echo "PASS: Python patch execution"

      - name: 08 - Verify source after patch
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          GRADLE="v10-source/app/build.gradle"
          LEGACY="v10-source/app/libs/aasdk-legacy.dex"

          CURRENT_NAV_SHA="$(git hash-object "$NAV")"
          CURRENT_GRADLE_SHA="$(git hash-object "$GRADLE")"

          echo "Patched NavigationMapView SHA:"
          echo "$CURRENT_NAV_SHA"

          echo "build.gradle SHA:"
          echo "$CURRENT_GRADLE_SHA"

          test "$CURRENT_NAV_SHA" != \
            "1600edf884196a146ce5f4233f8de0a8ea282a4e"

          test "$CURRENT_GRADLE_SHA" = \
            "4d512337d46324a33a685d8cdb095e4ecacd3ceb"

          grep -Fq \
            'private static final double AUTO_FOLLOW_ZOOM = 17.5;' \
            "$NAV"

          grep -Fq \
            'import org.maplibre.android.location.modes.RenderMode;' \
            "$NAV"

          grep -Fq \
            '.setRenderMode(RenderMode.GPS);' \
            "$NAV"

          grep -Fq \
            'CameraMode.TRACKING_GPS' \
            "$NAV"

          grep -Fq \
            '.compassAnimationEnabled(true)' \
            "$NAV"

          test "$(grep -Fc 'CameraMode.TRACKING_GPS' "$NAV")" -eq 2

          test "$(grep -Fc 'CameraMode.TRACKING,' "$NAV")" -eq 0

          test -s "$LEGACY"

          echo "PASS: patched source structure"
          echo "PASS: GPS render mode"
          echo "PASS: TRACKING_GPS enabled"
          echo "PASS: old TRACKING mode removed"
          echo "PASS: zoom 17.5"
          echo "PASS: compass animation"
          echo "PASS: build.gradle unchanged"
          echo "PASS: legacy DEX present"

      - name: 09 - Verify source diff
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          GRADLE="v10-source/app/build.gradle"
          LEGACY="v10-source/app/libs/aasdk-legacy.dex"

          git diff --check

          test -z "$(git status --porcelain -- "$GRADLE")"
          test -z "$(git status --porcelain -- "$LEGACY")"

          CHANGED_FILES="$(
            git status --porcelain |
              awk '{print substr($0,4)}'
          )"

          test "$CHANGED_FILES" = "$NAV"

          echo "PASS: exactly one source file changed"
          echo "PASS: build.gradle unchanged"
          echo "PASS: legacy DEX unchanged"
          echo "PASS: git diff --check"

          git diff -- "$NAV"

      - name: 10 - Java syntax and compile
        shell: bash
        working-directory: v10-source
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:compileReleaseJavaWithJavac

          echo "PASS: Java syntax / compile"

      - name: 11 - Gradle assemble release
        shell: bash
        working-directory: v10-source
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease

          APK="app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          echo "PASS: Gradle assembleRelease"
          ls -lh "$APK"

      - name: 12 - Verify APK and DEX layout
        shell: bash
        working-directory: v10-source
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          LEGACY="$GITHUB_WORKSPACE/v10-source/app/libs/aasdk-legacy.dex"

          test -s "$APK"
          test -s "$LEGACY"

          mapfile -t DEX_FILES < <(
            unzip -Z1 "$APK" |
              grep -E '^classes[0-9]*\.dex$' |
              sort -V
          )

          test "${#DEX_FILES[@]}" -ge 2

          echo "APK DEX files:"
          printf '%s\n' "${DEX_FILES[@]}"

          echo "PASS: APK contains ${#DEX_FILES[@]} DEX files"
          echo "PASS: legacy DEX packaging preserved"

      - name: 13 - Final protected-file verification
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          GRADLE="v10-source/app/build.gradle"
          LEGACY="v10-source/app/libs/aasdk-legacy.dex"

          EXPECTED_GRADLE_SHA="4d512337d46324a33a685d8cdb095e4ecacd3ceb"

          test "$(git hash-object "$GRADLE")" = \
            "$EXPECTED_GRADLE_SHA"

          test -s "$LEGACY"

          test -z "$(git status --porcelain -- "$GRADLE")"
          test -z "$(git status --porcelain -- "$LEGACY")"

          test -n "$(git status --porcelain -- "$NAV")"

          test "$(git hash-object "$NAV")" != \
            "1600edf884196a146ce5f4233f8de0a8ea282a4e"

          git diff --check -- "$NAV"

          echo "PASS: build.gradle protected"
          echo "PASS: legacy DEX protected"
          echo "PASS: NavigationMapView contains intended patch"
          echo "PASS: protected-file verification"

      - name: 14 - Commit only NavigationMapView
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          GRADLE="v10-source/app/build.gradle"
          LEGACY="v10-source/app/libs/aasdk-legacy.dex"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "$NAV"

          test -n "$(git diff --cached --name-only)"

          STAGED_FILES="$(
            git diff --cached --name-only
          )"

          test "$STAGED_FILES" = "$NAV"

          test -z "$(git diff --cached -- "$GRADLE")"
          test -z "$(git diff --cached -- "$LEGACY")"

          git commit \
            -m "Patch NavigationMapView GPS auto follow"

          git push origin HEAD:main

          echo "PASS: committed only NavigationMapView.java"
          echo "PASS: pushed to main"

      - name: 15 - Final PASS
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"

          test -s "$NAV"

          echo "PASS: NavigationMapView Follow V4"
          echo "PASS: YAML"
          echo "PASS: Python"
          echo "PASS: source patch"
          echo "PASS: Java compile"
          echo "PASS: Gradle build"
          echo "PASS: APK / DEX"
          echo "PASS: protected files"
          echo "PASS: commit"
