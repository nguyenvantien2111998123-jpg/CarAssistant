name: Fix zoom va auto follow muot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix-zoom-auto-follow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify current source structure
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          GRADLE="v10-source/app/build.gradle"

          echo "========================================"
          echo "CURRENT COMMIT"
          echo "========================================"
          git rev-parse HEAD

          echo
          echo "========================================"
          echo "SOURCE SHA256"
          echo "========================================"
          sha256sum "$FILE"

          echo
          echo "========================================"
          echo "GRADLE SHA256"
          echo "========================================"
          sha256sum "$GRADLE"

          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import re

          source = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          )

          gradle = Path(
              "v10-source/app/build.gradle"
          )

          text = source.read_text(encoding="utf-8")
          gradle_text = gradle.read_text(encoding="utf-8")

          expected_blob_sha = (
              "1600edf884196a146ce5f4233f8de0a8ea282a4e"
          )

          data = source.read_bytes()

          git_blob = (
              f"blob {len(data)}\0".encode("utf-8")
              + data
          )

          actual_blob_sha = hashlib.sha1(
              git_blob
          ).hexdigest()

          print(
              "NavigationMapView Git blob SHA:",
              actual_blob_sha
          )

          if actual_blob_sha != expected_blob_sha:
              raise SystemExit(
                  "FAIL: NavigationMapView.java does not match "
                  "the inspected current main baseline."
              )

          print(
              "PASS: Exact current NavigationMapView baseline"
          )

          if "package com.carassistant.v10;" not in text:
              raise SystemExit(
                  "FAIL: Package mismatch."
              )

          print("PASS: Package")

          if (
              "org.maplibre.gl:android-sdk:11.11.0"
              not in gradle_text
          ):
              raise SystemExit(
                  "FAIL: MapLibre 11.11.0 not found."
              )

          print("PASS: MapLibre 11.11.0")

          if (
              "import org.maplibre.android.location.modes.CameraMode;"
              not in text
          ):
              raise SystemExit(
                  "FAIL: CameraMode import missing."
              )

          print("PASS: CameraMode import")

          if (
              "import org.maplibre.android.location.modes.RenderMode;"
              in text
          ):
              raise SystemExit(
                  "FAIL: RenderMode already patched."
              )

          print("PASS: RenderMode not yet patched")

          if (
              "private static final double AUTO_FOLLOW_ZOOM = 16.0;"
              not in text
          ):
              raise SystemExit(
                  "FAIL: AUTO_FOLLOW_ZOOM 16.0 baseline missing."
              )

          print(
              "PASS: AUTO_FOLLOW_ZOOM 16.0 baseline"
          )

          button_pattern = re.compile(
              r'addControlButton\s*\(\s*'
              r'controls\s*,\s*'
              r'"◎"\s*,\s*'
              r'"Recenter and resume auto follow"\s*,\s*'
              r'v\s*->\s*recenter\(\)\s*'
              r'\)\s*;',
              re.S
          )

          if not button_pattern.search(text):
              raise SystemExit(
                  "FAIL: Current follow button structure missing."
              )

          print(
              "PASS: Current follow button structure"
          )

          enable_pattern = re.compile(
              r'map\.getLocationComponent\(\)\s*'
              r'\.\s*setLocationComponentEnabled\s*\(\s*true\s*\)\s*;'
              r'\s*startAutoFollow\s*\(\s*\)\s*;',
              re.S
          )

          if not enable_pattern.search(text):
              raise SystemExit(
                  "FAIL: enableLocation structure missing."
              )

          print(
              "PASS: enableLocation structure"
          )

          if (
              "private void startAutoFollow()"
              not in text
          ):
              raise SystemExit(
                  "FAIL: startAutoFollow() missing."
              )

          if "CameraMode.TRACKING" not in text:
              raise SystemExit(
                  "FAIL: CameraMode.TRACKING missing."
              )

          print(
              "PASS: startAutoFollow structure"
          )

          if "public void recenter()" not in text:
              raise SystemExit(
                  "FAIL: recenter() missing."
              )

          print(
              "PASS: recenter() structure"
          )

          print()
          print(
              "========================================"
          )
          print(
              "BASELINE STRUCTURE VERIFIED"
          )
          print(
              "========================================"
          )
          PY

      - name: Patch zoom and smooth auto follow
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          # ========================================================
          # 1. ADD RenderMode IMPORT
          # ========================================================

          camera_import = (
              "import org.maplibre.android.location.modes.CameraMode;"
          )

          render_import = (
              "import org.maplibre.android.location.modes.RenderMode;"
          )

          if render_import not in text:
              if camera_import not in text:
                  raise SystemExit(
                      "FAIL: CameraMode import anchor missing."
                  )

              text = text.replace(
                  camera_import,
                  camera_import
                  + "\n"
                  + render_import,
                  1
              )

              print(
                  "PATCH: Added RenderMode import"
              )
          else:
              print(
                  "PATCH: RenderMode import already exists"
              )

          # ========================================================
          # 2. CHANGE AUTO FOLLOW ZOOM 16 -> 17
          # ========================================================

          old_zoom = (
              "private static final double AUTO_FOLLOW_ZOOM = 16.0;"
          )

          new_zoom = (
              "private static final double AUTO_FOLLOW_ZOOM = 17.0;"
          )

          if old_zoom in text:
              text = text.replace(
                  old_zoom,
                  new_zoom,
                  1
              )

              print(
                  "PATCH: AUTO_FOLLOW_ZOOM 16.0 -> 17.0"
              )

          elif new_zoom in text:
              print(
                  "PATCH: AUTO_FOLLOW_ZOOM already 17.0"
              )

          else:
              raise SystemExit(
                  "FAIL: AUTO_FOLLOW_ZOOM anchor missing."
              )

          # ========================================================
          # 3. CHANGE FOLLOW BUTTON
          # ========================================================

          button_pattern = re.compile(
              r'addControlButton\s*\(\s*'
              r'controls\s*,\s*'
              r'"◎"\s*,\s*'
              r'"Recenter and resume auto follow"\s*,\s*'
              r'v\s*->\s*recenter\(\)\s*'
              r'\)\s*;',
              re.S
          )

          button_replacement = """addControlButton(
                controls,
                "➤",
                "Follow current location",
                v -> followCurrentLocation());"""

          text, count = button_pattern.subn(
              button_replacement,
              text,
              count=1
          )

          if count == 1:
              print(
                  "PATCH: Follow button"
              )
          elif (
              '"➤"' in text
              and "followCurrentLocation()" in text
          ):
              print(
                  "PATCH: Follow button already patched"
              )
          else:
              raise SystemExit(
                  "FAIL: Follow button patch failed."
              )

          # ========================================================
          # 4. ENABLE GPS RENDER MODE
          # ========================================================

          enable_pattern = re.compile(
              r'(\s*map\.getLocationComponent\(\)\s*'
              r'\.\s*setLocationComponentEnabled\s*\(\s*true\s*\)\s*;)'
              r'\s*'
              r'(startAutoFollow\s*\(\s*\)\s*;)',
              re.S
          )

          match = enable_pattern.search(text)

          if match:
              replacement = (
                  match.group(1)
                  + "\n\n"
                  + "        map.getLocationComponent()\n"
                  + "                .setRenderMode(RenderMode.GPS);\n\n"
                  + "        "
                  + match.group(2)
              )

              text = (
                  text[:match.start()]
                  + replacement
                  + text[match.end():]
              )

              print(
                  "PATCH: Added RenderMode.GPS"
              )

          elif (
              "setRenderMode(RenderMode.GPS);"
              in text
          ):
              print(
                  "PATCH: RenderMode.GPS already exists"
              )

          else:
              raise SystemExit(
                  "FAIL: Location enable anchor missing."
              )

          # ========================================================
          # 5. ADD followCurrentLocation()
          # ========================================================

          if (
              "private void followCurrentLocation()"
              not in text
          ):

              method = """    private void followCurrentLocation() {

          if (map == null) {
            return;
          }

          try {

            Location location =
                    map.getLocationComponent()
                            .getLastKnownLocation();

            map.getLocationComponent()
                    .setRenderMode(RenderMode.GPS);

            if (location != null) {

                LatLng target =
                        new LatLng(
                                location.getLatitude(),
                                location.getLongitude());

                map.animateCamera(
                        CameraUpdateFactory.newLatLngZoom(
                                target,
                                AUTO_FOLLOW_ZOOM),
                        500);
            }

            map.getLocationComponent()
                    .setCameraMode(
                            CameraMode.TRACKING,
                            500L,
                            AUTO_FOLLOW_ZOOM,
                            null,
                            0.0,
                            null);

          } catch (Exception ignored) {
          }
          }

          """

              zoom_marker = (
                  "    public void zoomIn() {"
              )

              if zoom_marker not in text:
                  raise SystemExit(
                      "FAIL: zoomIn() insertion anchor missing."
                  )

              text = text.replace(
                  zoom_marker,
                  method + zoom_marker,
                  1
              )

              print(
                  "PATCH: Added followCurrentLocation()"
              )

          else:
              print(
                  "PATCH: followCurrentLocation() already exists"
              )

          # ========================================================
          # 6. REPLACE recenter()
          # ========================================================

          def find_method_span(
              source,
              signature
          ):
              start = source.find(
                  signature
              )

              if start < 0:
                  return None

              brace = source.find(
                  "{",
                  start
              )

              if brace < 0:
                  return None

              depth = 0
              in_string = False
              escape = False
              in_line_comment = False
              in_block_comment = False

              i = brace

              while i < len(source):

                  ch = source[i]

                  nxt = (
                      source[i + 1]
                      if i + 1 < len(source)
                      else ""
                  )

                  if in_line_comment:
                      if ch == "\n":
                          in_line_comment = False

                      i += 1
                      continue

                  if in_block_comment:

                      if (
                          ch == "*"
                          and nxt == "/"
                      ):
                          in_block_comment = False
                          i += 2
                          continue

                      i += 1
                      continue

                  if in_string:

                      if escape:
                          escape = False

                      elif ch == "\\":
                          escape = True

                      elif ch == '"':
                          in_string = False

                      i += 1
                      continue

                  if (
                      ch == "/"
                      and nxt == "/"
                  ):
                      in_line_comment = True
                      i += 2
                      continue

                  if (
                      ch == "/"
                      and nxt == "*"
                  ):
                      in_block_comment = True
                      i += 2
                      continue

                  if ch == '"':
                      in_string = True
                      i += 1
                      continue

                  if ch == "{":
                      depth += 1

                  elif ch == "}":

                      depth -= 1

                      if depth == 0:
                          return (
                              start,
                              i + 1
                          )

                  i += 1

              return None

          recenter_signature = (
              "    public void recenter()"
          )

          span = find_method_span(
              text,
              recenter_signature
          )

          if span is None:
              raise SystemExit(
                  "FAIL: recenter() method not found."
              )

          start, end = span

          recenter_method = """    public void recenter() {

          followCurrentLocation();
          }"""

          text = (
              text[:start]
              + recenter_method
              + text[end:]
          )

          print(
              "PATCH: Replaced recenter() safely"
          )

          # ========================================================
          # WRITE SOURCE
          # ========================================================

          path.write_text(
              text,
              encoding="utf-8"
          )

          print()
          print(
              "========================================"
          )
          print(
              "PATCH COMPLETE"
          )
          print(
              "========================================"
          )
          PY

      - name: Verify patched structure
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          errors = []

          # --------------------------------------------------------
          # RenderMode import
          # --------------------------------------------------------

          if (
              "import org.maplibre.android.location.modes.RenderMode;"
              not in text
          ):
              errors.append(
                  "RenderMode import missing"
              )
          else:
              print(
                  "PASS: RenderMode import"
              )

          # --------------------------------------------------------
          # Zoom 17
          # --------------------------------------------------------

          if (
              "private static final double AUTO_FOLLOW_ZOOM = 17.0;"
              not in text
          ):
              errors.append(
                  "AUTO_FOLLOW_ZOOM 17.0 missing"
              )
          else:
              print(
                  "PASS: AUTO_FOLLOW_ZOOM = 17.0"
              )

          if (
              "private static final double AUTO_FOLLOW_ZOOM = 16.0;"
              in text
          ):
              errors.append(
                  "Old AUTO_FOLLOW_ZOOM 16.0 remains"
              )

          # --------------------------------------------------------
          # Follow button
          # --------------------------------------------------------

          button_pattern = re.compile(
              r'addControlButton\s*\(\s*'
              r'controls\s*,\s*'
              r'"➤"\s*,\s*'
              r'"Follow current location"\s*,\s*'
              r'v\s*->\s*followCurrentLocation\(\)\s*'
              r'\)\s*;',
              re.S
          )

          if not button_pattern.search(text):
              errors.append(
                  "Follow button syntax invalid"
              )
          else:
              print(
                  "PASS: Follow button complete"
              )

          # --------------------------------------------------------
          # GPS
          # --------------------------------------------------------

          if (
              "setRenderMode(RenderMode.GPS);"
              not in text
          ):
              errors.append(
                  "RenderMode.GPS missing"
              )
          else:
              print(
                  "PASS: RenderMode.GPS"
              )

          # --------------------------------------------------------
          # followCurrentLocation()
          # --------------------------------------------------------

          if (
              "private void followCurrentLocation()"
              not in text
          ):
              errors.append(
                  "followCurrentLocation() missing"
              )
          else:
              print(
                  "PASS: followCurrentLocation()"
              )

          if (
              "getLastKnownLocation()"
              not in text
          ):
              errors.append(
                  "getLastKnownLocation() missing"
              )

          if (
              "CameraMode.TRACKING"
              not in text
          ):
              errors.append(
                  "CameraMode.TRACKING missing"
              )

          # --------------------------------------------------------
          # recenter()
          # --------------------------------------------------------

          recenter_pattern = re.compile(
              r'public\s+void\s+recenter\s*\(\s*\)\s*\{'
              r'(.*?)'
              r'\n\s*\}',
              re.S
          )

          recenter_match = (
              recenter_pattern.search(text)
          )

          if not recenter_match:
              errors.append(
                  "recenter() cannot be verified"
              )
          else:
              body = recenter_match.group(1)

              if (
                  "followCurrentLocation();"
                  not in body
              ):
                  errors.append(
                      "recenter() does not call followCurrentLocation()"
                  )
              else:
                  print(
                      "PASS: recenter() delegates to followCurrentLocation()"
                  )

              if (
                  "startAutoFollow();"
                  in body
              ):
                  errors.append(
                      "recenter() still calls startAutoFollow()"
                  )

          # --------------------------------------------------------
          # Print relevant lines
          # --------------------------------------------------------

          print()
          print(
              "========================================"
          )
          print(
              "PATCHED SOURCE CHECK"
          )
          print(
              "========================================"
          )

          for number, line in enumerate(
              text.splitlines(),
              start=1
          ):
              if (
                  "RenderMode" in line
                  or "AUTO_FOLLOW_ZOOM" in line
                  or "followCurrentLocation" in line
                  or "setRenderMode" in line
                  or "public void recenter" in line
              ):
                  print(
                      f"{number}: {line}"
                  )

          # --------------------------------------------------------
          # FINAL
          # --------------------------------------------------------

          if errors:

              print()
              print(
                  "========================================"
              )
              print(
                  "VERIFY FAILED"
              )
              print(
                  "========================================"
              )

              for error in errors:
                  print(
                      "ERROR:",
                      error
                  )

              raise SystemExit(1)

          print()
          print(
              "========================================"
          )
          print(
              "PATCHED STRUCTURE VERIFIED"
          )
          print(
              "========================================"
          )
          PY

      - name: Locate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          if [ -x "v10-source/gradlew" ]; then
            echo "PASS: v10-source/gradlew"
          elif [ -x "gradlew" ]; then
            echo "PASS: root gradlew"
          else
            echo "FAIL: Gradle wrapper not found."

            find . \
              -maxdepth 3 \
              -name gradlew \
              -type f \
              -print

            exit 1
          fi

      - name: Compile release APK
        shell: bash
        run: |
          set -euo pipefail

          if [ -x "v10-source/gradlew" ]; then
            cd v10-source

            ./gradlew \
              clean \
              assembleRelease \
              --stacktrace

          elif [ -x "gradlew" ]; then
            ./gradlew \
              clean \
              :v10-source:assembleRelease \
              --stacktrace

          else
            echo "FAIL: No Gradle wrapper."
            exit 1
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "FAIL: APK not found:"
            echo "$APK"

            find v10-source/app/build \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "========================================"
          echo "APK FOUND"
          echo "========================================"

          ls -lh "$APK"

          echo
          echo "SHA256:"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fix-zoom-va-auto-follow-muot-apk
          path: v10-source/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
