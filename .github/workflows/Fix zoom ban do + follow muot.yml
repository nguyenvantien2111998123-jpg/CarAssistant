name: Fix zoom va follow auto muot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation-follow-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 1. VERIFY EXACT BASELINE
      # ============================================================
      - name: Verify exact baseline and source structure
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          GRADLE="v10-source/app/build.gradle"

          EXPECTED_SHA="1600edf884196a146ce5f4233f8de0a8ea282a4e"

          echo "========================================"
          echo "VERIFY EXACT BASELINE"
          echo "========================================"

          test -f "$FILE"
          test -f "$GRADLE"

          ACTUAL_SHA="$(git hash-object "$FILE")"

          echo "Expected NavigationMapView SHA:"
          echo "$EXPECTED_SHA"

          echo "Actual NavigationMapView SHA:"
          echo "$ACTUAL_SHA"

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: NavigationMapView.java SHA mismatch."
            echo "This workflow refuses to patch an unknown source."
            exit 1
          fi

          grep -Fq 'package com.carassistant.v10;' "$FILE"
          grep -Fq 'import org.maplibre.android.location.modes.CameraMode;' "$FILE"
          grep -Fq 'org.maplibre.gl:android-sdk:11.11.0' "$GRADLE"
          grep -Fq 'applicationId "com.carassistant.v10"' "$GRADLE"
          grep -Fq 'sourceCompatibility JavaVersion.VERSION_17' "$GRADLE"

          echo "PASS: Exact baseline verified."

          echo
          echo "========================================"
          echo "STRUCTURAL SOURCE VERIFICATION"
          echo "========================================"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          def require(label, condition):
              if not condition:
                  print(f"ERROR: Missing structural anchor: {label}")
                  sys.exit(1)
              print(f"PASS: {label}")

          require(
              "CameraMode import",
              "import org.maplibre.android.location.modes.CameraMode;" in text
          )

          require(
              "AUTO_FOLLOW_ZOOM 16.0",
              "private static final double AUTO_FOLLOW_ZOOM = 16.0;" in text
          )

          require(
              "Zoom in control",
              '"Zoom in"' in text and 'v -> zoomIn()' in text
          )

          require(
              "Zoom out control",
              '"Zoom out"' in text and 'v -> zoomOut()' in text
          )

          require(
              "Original follow button",
              '"◎"' in text
              and '"Recenter and resume auto follow"' in text
              and 'v -> recenter()' in text
          )

          require(
              "enableLocation method",
              "private void enableLocation()" in text
          )

          require(
              "Location component enabled",
              "setLocationComponentEnabled(true);" in text
          )

          require(
              "startAutoFollow method",
              "private void startAutoFollow()" in text
          )

          require(
              "CameraMode.TRACKING",
              "CameraMode.TRACKING" in text
          )

          require(
              "getLastKnownLocation",
              "getLastKnownLocation()" in text
          )

          require(
              "zoomIn method",
              "public void zoomIn()" in text
          )

          require(
              "recenter method",
              "public void recenter()" in text
          )

          require(
              "RenderMode not already patched",
              "import org.maplibre.android.location.modes.RenderMode;" not in text
          )

          require(
              "followCurrentLocation not already patched",
              "followCurrentLocation()" not in text
          )

          print()
          print("PASS: Current source structure matches the intended V2 patch.")
          PY

      # ============================================================
      # 2. PATCH WORKSPACE ONLY
      # ============================================================
      - name: Patch NavigationMapView Follow V2
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"

          python3 - "$FILE" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          original = text

          # --------------------------------------------------------
          # 1. Add RenderMode import
          # --------------------------------------------------------
          render_import = (
              "import org.maplibre.android.location.modes.RenderMode;\n"
          )

          if "import org.maplibre.android.location.modes.RenderMode;" not in text:
              anchor = (
                  "import org.maplibre.android.location.modes.CameraMode;\n"
              )

              if anchor not in text:
                  raise SystemExit(
                      "ERROR: CameraMode import anchor not found."
                  )

              text = text.replace(
                  anchor,
                  anchor + render_import,
                  1
              )

              print("PASS: Added RenderMode import.")
          else:
              print("PASS: RenderMode import already present.")

          # --------------------------------------------------------
          # 2. AUTO_FOLLOW_ZOOM 16.0 -> 17.0
          # --------------------------------------------------------
          old_zoom = (
              "private static final double AUTO_FOLLOW_ZOOM = 16.0;"
          )

          new_zoom = (
              "private static final double AUTO_FOLLOW_ZOOM = 17.0;"
          )

          if old_zoom in text:
              text = text.replace(old_zoom, new_zoom, 1)
              print("PASS: AUTO_FOLLOW_ZOOM changed 16.0 -> 17.0.")
          elif new_zoom in text:
              print("PASS: AUTO_FOLLOW_ZOOM already 17.0.")
          else:
              raise SystemExit(
                  "ERROR: AUTO_FOLLOW_ZOOM structural anchor not found."
              )

          # --------------------------------------------------------
          # 3. Follow button
          #    Do not depend on indentation.
          # --------------------------------------------------------
          button_pattern = re.compile(
              r'"◎"\s*,\s*'
              r'"Recenter and resume auto follow"\s*,\s*'
              r'v\s*->\s*recenter\(\)\s*\)'
          )

          button_replacement = (
              '"➤",\n'
              '                "Follow current location",\n'
              '                v -> followCurrentLocation()'
          )

          matches = list(button_pattern.finditer(text))

          if len(matches) == 1:
              text = button_pattern.sub(
                  button_replacement,
                  text,
                  count=1
              )
              print("PASS: Follow button patched.")
          elif len(matches) == 0:
              raise SystemExit(
                  "ERROR: Original follow button structure not found."
              )
          else:
              raise SystemExit(
                  "ERROR: Multiple original follow button structures found."
              )

          # --------------------------------------------------------
          # 4. Add GPS render mode immediately after enabling
          #    location component.
          #
          #    This searches by statement, not whitespace.
          # --------------------------------------------------------
          enable_statement = (
              "setLocationComponentEnabled(true);"
          )

          occurrences = [
              m.start()
              for m in re.finditer(
                  re.escape(enable_statement),
                  text
              )
          ]

          if len(occurrences) != 1:
              raise SystemExit(
                  "ERROR: Expected exactly one "
                  "setLocationComponentEnabled(true);"
              )

          pos = occurrences[0]

          line_start = text.rfind("\n", 0, pos) + 1

          indent_match = re.match(
              r"[ \t]*",
              text[line_start:]
          )

          indent = (
              indent_match.group(0)
              if indent_match
              else "        "
          )

          gps_block = (
              "\n"
              + indent
              + "map.getLocationComponent()\n"
              + indent
              + "        .setRenderMode(RenderMode.GPS);"
          )

          after_statement = pos + len(enable_statement)

          if "setRenderMode(RenderMode.GPS);" not in text:
              text = (
                  text[:after_statement]
                  + gps_block
                  + text[after_statement:]
              )

              print("PASS: GPS render mode inserted.")
          else:
              print("PASS: GPS render mode already present.")

          # --------------------------------------------------------
          # 5. Insert followCurrentLocation() before zoomIn()
          # --------------------------------------------------------
          if "private void followCurrentLocation()" not in text:

              zoom_anchor = "    public void zoomIn() {"

              if zoom_anchor not in text:
                  raise SystemExit(
                      "ERROR: zoomIn() insertion anchor not found."
                  )

              follow_method = r'''
              private void followCurrentLocation() {

                  if (map == null) {
                      return;
                  }

                  try {

                      Location location =
                              map.getLocationComponent()
                                      .getLastKnownLocation();

                      map.getLocationComponent()
                              .setRenderMode(RenderMode.GPS);

                      if (location != null) {

                          LatLng target =
                                  new LatLng(
                                          location.getLatitude(),
                                          location.getLongitude());

                          map.animateCamera(
                                  CameraUpdateFactory.newLatLngZoom(
                                          target,
                                          AUTO_FOLLOW_ZOOM),
                                  500);
                      }

                      map.getLocationComponent()
                              .setCameraMode(
                                      CameraMode.TRACKING,
                                      500L,
                                      AUTO_FOLLOW_ZOOM,
                                      null,
                                      0.0,
                                      null);

                  } catch (Exception ignored) {
                  }
              }

          '''

              # Remove the Python indentation from the method body.
              follow_method = "\n".join(
                  line[12:] if line.startswith("            ")
                  else line
                  for line in follow_method.splitlines()
              )

              text = text.replace(
                  zoom_anchor,
                  follow_method + zoom_anchor,
                  1
              )

              print("PASS: followCurrentLocation() inserted.")
          else:
              print("PASS: followCurrentLocation() already present.")

          # --------------------------------------------------------
          # 6. Replace recenter() structurally.
          # --------------------------------------------------------
          recenter_pattern = re.compile(
              r'    public void recenter\(\) \{.*?\n    \}\n',
              re.DOTALL
          )

          recenter_matches = list(
              recenter_pattern.finditer(text)
          )

          if len(recenter_matches) != 1:
              raise SystemExit(
                  "ERROR: Expected exactly one recenter() method."
              )

          new_recenter = '''    public void recenter() {

                  followCurrentLocation();
              }

          '''

          # Normalize method indentation.
          new_recenter = "\n".join(
              line[12:] if line.startswith("            ")
              else line
              for line in new_recenter.splitlines()
          )

          text = recenter_pattern.sub(
              new_recenter,
              text,
              count=1
          )

          print("PASS: recenter() delegated to followCurrentLocation().")

          if text == original:
              raise SystemExit(
                  "ERROR: Patch produced no source change."
              )

          path.write_text(text, encoding="utf-8")

          print("PASS: Workspace patch completed.")
          PY

      # ============================================================
      # 3. VERIFY PATCH RESULT
      # ============================================================
      - name: Verify patched source structurally
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          def require(label, condition):
              if not condition:
                  print(f"ERROR: Post-patch verification failed: {label}")
                  sys.exit(1)
              print(f"PASS: {label}")

          require(
              "RenderMode import",
              "import org.maplibre.android.location.modes.RenderMode;"
              in text
          )

          require(
              "AUTO_FOLLOW_ZOOM 17.0",
              "private static final double AUTO_FOLLOW_ZOOM = 17.0;"
              in text
          )

          require(
              "New follow icon",
              '"➤"' in text
          )

          require(
              "New follow description",
              '"Follow current location"' in text
          )

          require(
              "Follow button listener",
              "v -> followCurrentLocation()" in text
          )

          require(
              "GPS render mode",
              "setRenderMode(RenderMode.GPS);" in text
          )

          require(
              "followCurrentLocation method",
              "private void followCurrentLocation()" in text
          )

          require(
              "Last known location",
              "getLastKnownLocation()" in text
          )

          require(
              "CameraUpdateFactory.newLatLngZoom",
              "CameraUpdateFactory.newLatLngZoom" in text
          )

          require(
              "CameraMode.TRACKING",
              "CameraMode.TRACKING" in text
          )

          require(
              "recenter delegates to followCurrentLocation",
              "public void recenter()" in text
              and "followCurrentLocation();" in text
          )

          require(
              "Old follow icon removed",
              '"◎"' not in text
          )

          require(
              "Old follow description removed",
              '"Recenter and resume auto follow"' not in text
          )

          # Make sure we did not accidentally create recursive
          # followCurrentLocation -> startAutoFollow -> recenter
          # fallback logic.
          follow_start = text.find(
              "private void followCurrentLocation()"
          )
          zoom_start = text.find(
              "    public void zoomIn()",
              follow_start
          )

          if follow_start < 0 or zoom_start < 0:
              raise SystemExit(
                  "ERROR: Cannot isolate followCurrentLocation()."
              )

          follow_body = text[follow_start:zoom_start]

          if "startAutoFollow();" in follow_body:
              raise SystemExit(
                  "ERROR: followCurrentLocation() contains "
                  "startAutoFollow(); recursion risk."
              )

          print("PASS: No follow/recenter recursion risk detected.")

          print()
          print("========================================")
          print("PASS: PATCHED SOURCE VERIFIED")
          print("========================================")
          PY

          echo
          echo "Patched NavigationMapView SHA:"
          git hash-object "$FILE"

      # ============================================================
      # 4. FIND GRADLE WRAPPER
      # ============================================================
      - name: Locate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "LOCATE GRADLE WRAPPER"
          echo "========================================"

          if [ -x "v10-source/gradlew" ]; then
            echo "GRADLE_WRAPPER=v10-source/gradlew" >> "$GITHUB_ENV"
            echo "GRADLE_PREFIX=cd v10-source && ./gradlew" >> "$GITHUB_ENV"
            echo "PASS: Found v10-source/gradlew"

          elif [ -x "./gradlew" ]; then
            echo "GRADLE_WRAPPER=./gradlew" >> "$GITHUB_ENV"
            echo "GRADLE_PREFIX=./gradlew" >> "$GITHUB_ENV"
            echo "PASS: Found root ./gradlew"

          else
            echo "ERROR: No Gradle wrapper found."
            echo "Checked:"
            echo "  v10-source/gradlew"
            echo "  ./gradlew"
            exit 1
          fi

      # ============================================================
      # 5. COMPILE
      # ============================================================
      - name: Compile release APK
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "COMPILE RELEASE"
          echo "========================================"

          if [ -x "v10-source/gradlew" ]; then
            cd v10-source
            ./gradlew assembleRelease --no-daemon --stacktrace

          elif [ -x "./gradlew" ]; then
            ./gradlew -p v10-source assembleRelease --no-daemon --stacktrace

          else
            echo "ERROR: Gradle wrapper disappeared."
            exit 1
          fi

          echo
          echo "PASS: assembleRelease completed."

      # ============================================================
      # 6. VERIFY APK
      # ============================================================
      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/release/app-release.apk"

          echo "========================================"
          echo "VERIFY APK"
          echo "========================================"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found:"
            echo "$APK"
            exit 1
          fi

          ls -lh "$APK"

          SHA256="$(sha256sum "$APK" | awk '{print $1}')"

          echo
          echo "APK SHA256:"
          echo "$SHA256"

          echo
          echo "PASS: Release APK exists."

      # ============================================================
      # 7. UPLOAD APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: navigation-v2-follow-structural
          path: v10-source/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
