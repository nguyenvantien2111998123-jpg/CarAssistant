name: Fix Zoom Auto Follow V7 Safe Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-patch-compile-build:
    name: Verify Patch Compile and Build V10
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 01 - CHECKOUT MAIN
      # ============================================================
      - name: 01 - Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      # ============================================================
      # 02 - JAVA 17
      # ============================================================
      - name: 02 - Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # ============================================================
      # 03 - YAML PARSE
      # ============================================================
      - name: 03 - Parse running workflow YAML
        shell: bash
        run: |
          set -euo pipefail

          WORKFLOW_REL="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          WORKFLOW_REL="${WORKFLOW_REL%@*}"

          echo "GITHUB_REPOSITORY:"
          echo "$GITHUB_REPOSITORY"

          echo "GITHUB_WORKFLOW_REF:"
          echo "$GITHUB_WORKFLOW_REF"

          echo "Resolved workflow:"
          echo "$WORKFLOW_REL"

          case "$WORKFLOW_REL" in
            .github/workflows/*.yml)
              ;;
            .github/workflows/*.yaml)
              ;;
            *)
              echo "FAIL: invalid workflow path"
              exit 1
              ;;
          esac

          test -f "$WORKFLOW_REL"

          export WORKFLOW_REL

          ruby <<'RUBY'
          require "yaml"

          path = ENV.fetch("WORKFLOW_REL")

          text = File.read(
            path,
            encoding: "UTF-8"
          )

          abort(
            "FAIL: workflow file is empty"
          ) if text.strip.empty?

          data = YAML.load_file(path)

          abort(
            "FAIL: YAML root is not a mapping"
          ) unless data.is_a?(Hash)

          unless data.key?("on") || data.key?(true)
            abort(
              "FAIL: missing top-level on"
            )
          end

          abort(
            "FAIL: missing top-level jobs"
          ) unless data.key?("jobs")

          jobs = data["jobs"]

          abort(
            "FAIL: jobs is not a mapping"
          ) unless jobs.is_a?(Hash)

          abort(
            "FAIL: jobs is empty"
          ) if jobs.empty?

          jobs.each do |job_id, job|
            abort(
              "FAIL: invalid job id #{job_id}"
            ) unless job_id.is_a?(String)

            abort(
              "FAIL: job #{job_id} is not a mapping"
            ) unless job.is_a?(Hash)

            steps = job["steps"]

            abort(
              "FAIL: job #{job_id} has no steps"
            ) unless steps.is_a?(Array)

            abort(
              "FAIL: job #{job_id} has zero steps"
            ) if steps.empty?
          end

          puts "PASS: workflow file exists"
          puts "PASS: YAML parsed successfully"
          puts "PASS: top-level on exists"
          puts "PASS: top-level jobs exists"
          puts "PASS: jobs mapping valid"
          puts "PASS: every job contains steps"
          RUBY

      # ============================================================
      # 04 - VERIFY REPOSITORY STRUCTURE
      # ============================================================
      - name: 04 - Verify repository structure
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          GRADLE="v10-source/app/build.gradle"
          LEGACY="v10-source/app/libs/aasdk-legacy.dex"
          GRADLEW="v10-source/gradlew"

          test -f "$NAV"
          test -f "$GRADLE"
          test -f "$LEGACY"
          test -f "$GRADLEW"

          test -s "$NAV"
          test -s "$GRADLE"
          test -s "$LEGACY"
          test -s "$GRADLEW"

          echo "PASS: NavigationMapView.java exists"
          echo "PASS: build.gradle exists"
          echo "PASS: aasdk-legacy.dex exists"
          echo "PASS: gradlew exists"

      # ============================================================
      # 05 - VERIFY EXACT BASELINE
      # ============================================================
      - name: 05 - Verify exact source baseline
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          GRADLE="v10-source/app/build.gradle"
          LEGACY="v10-source/app/libs/aasdk-legacy.dex"

          EXPECTED_NAV_SHA="1600edf884196a146ce5f4233f8de0a8ea282a4e"
          EXPECTED_GRADLE_SHA="4d512337d46324a33a685d8cdb095e4ecacd3ceb"

          ACTUAL_NAV_SHA="$(
            git hash-object "$NAV"
          )"

          ACTUAL_GRADLE_SHA="$(
            git hash-object "$GRADLE"
          )"

          echo "NavigationMapView expected:"
          echo "$EXPECTED_NAV_SHA"

          echo "NavigationMapView actual:"
          echo "$ACTUAL_NAV_SHA"

          echo "build.gradle expected:"
          echo "$EXPECTED_GRADLE_SHA"

          echo "build.gradle actual:"
          echo "$ACTUAL_GRADLE_SHA"

          test "$ACTUAL_NAV_SHA" = "$EXPECTED_NAV_SHA"
          test "$ACTUAL_GRADLE_SHA" = "$EXPECTED_GRADLE_SHA"

          grep -Fq \
            'import org.maplibre.android.location.modes.CameraMode;' \
            "$NAV"

          ! grep -Fq \
            'import org.maplibre.android.location.modes.RenderMode;' \
            "$NAV"

          grep -Fq \
            'private static final double AUTO_FOLLOW_ZOOM = 16.0;' \
            "$NAV"

          grep -Fq \
            '"◎",' \
            "$NAV"

          grep -Fq \
            '"Recenter and resume auto follow",' \
            "$NAV"

          grep -Fq \
            'v -> recenter());' \
            "$NAV"

          grep -Fq \
            'private void startAutoFollow() {' \
            "$NAV"

          grep -Fq \
            'CameraMode.TRACKING' \
            "$NAV"

          grep -Fq \
            "tasks.matching { it.name == 'mergeDexRelease' }.configureEach" \
            "$GRADLE"

          grep -Fq \
            "app/libs/aasdk-legacy.dex" \
            "$GRADLE"

          test -s "$LEGACY"

          echo "PASS: exact NavigationMapView baseline"
          echo "PASS: exact build.gradle baseline"
          echo "PASS: legacy DEX exists"
          echo "PASS: expected pre-patch structure verified"

      # ============================================================
      # 06 - PYTHON PARSE + EXECUTE NAVIGATION PATCH
      # ============================================================
      - name: 06 - Python parse and execute navigation patch
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/apply_navigation_patch.py <<'PY'
          from pathlib import Path
          import re


          NAV = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          )


          if not NAV.is_file():
              raise SystemExit(
                  "FAIL: NavigationMapView.java not found"
              )


          text = NAV.read_text(
              encoding="utf-8"
          )


          def replace_once(
              old: str,
              new: str,
              label: str,
          ):
              global text

              count = text.count(old)

              if count != 1:
                  raise SystemExit(
                      f"FAIL: {label}: "
                      f"expected exactly 1 match, found {count}"
                  )

              text = text.replace(
                  old,
                  new,
                  1,
              )


          # --------------------------------------------------------
          # 1. RenderMode import
          # --------------------------------------------------------
          replace_once(
              "import org.maplibre.android.location.modes.CameraMode;",
              "import org.maplibre.android.location.modes.CameraMode;\n"
              "import org.maplibre.android.location.modes.RenderMode;",
              "RenderMode import",
          )


          # --------------------------------------------------------
          # 2. Auto follow zoom 16 -> 17
          # --------------------------------------------------------
          replace_once(
              "private static final double AUTO_FOLLOW_ZOOM = 16.0;",
              "private static final double AUTO_FOLLOW_ZOOM = 17.0;",
              "AUTO_FOLLOW_ZOOM",
          )


          # --------------------------------------------------------
          # 3. Follow button
          # --------------------------------------------------------
          replace_once(
              '                "◎",\n'
              '                "Recenter and resume auto follow",\n'
              '                v -> recenter());',
              '                "➤",\n'
              '                "Follow current location",\n'
              '                v -> followCurrentLocation());',
              "follow control",
          )


          # --------------------------------------------------------
          # 4. Enable GPS render mode
          # --------------------------------------------------------
          replace_once(
              "        map.getLocationComponent()\n"
              "                .setLocationComponentEnabled(true);\n\n"
              "        startAutoFollow();",
              "        map.getLocationComponent()\n"
              "                .setLocationComponentEnabled(true);\n\n"
              "        map.getLocationComponent()\n"
              "                .setRenderMode(RenderMode.GPS);\n\n"
              "        startAutoFollow();",
              "RenderMode.GPS enableLocation",
          )


          # --------------------------------------------------------
          # 5. Insert followCurrentLocation()
          # --------------------------------------------------------
          follow_method = (
              "    private void followCurrentLocation() {\n"
              "\n"
              "        if (map == null) {\n"
              "            return;\n"
              "        }\n"
              "\n"
              "        try {\n"
              "\n"
              "            Location location =\n"
              "                    map.getLocationComponent()\n"
              "                            .getLastKnownLocation();\n"
              "\n"
              "            map.getLocationComponent()\n"
              "                    .setRenderMode(RenderMode.GPS);\n"
              "\n"
              "            if (location != null) {\n"
              "\n"
              "                LatLng target =\n"
              "                        new LatLng(\n"
              "                                location.getLatitude(),\n"
              "                                location.getLongitude());\n"
              "\n"
              "                map.animateCamera(\n"
              "                        CameraUpdateFactory.newLatLngZoom(\n"
              "                                target,\n"
              "                                AUTO_FOLLOW_ZOOM),\n"
              "                        500);\n"
              "            }\n"
              "\n"
              "            map.getLocationComponent()\n"
              "                    .setCameraMode(\n"
              "                            CameraMode.TRACKING,\n"
              "                            500L,\n"
              "                            AUTO_FOLLOW_ZOOM,\n"
              "                            null,\n"
              "                            0.0,\n"
              "                            null);\n"
              "\n"
              "        } catch (Exception ignored) {\n"
              "        }\n"
              "    }\n"
              "\n"
          )


          replace_once(
              "    public void zoomIn() {",
              follow_method
              + "    public void zoomIn() {",
              "followCurrentLocation insertion",
          )


          # --------------------------------------------------------
          # 6. Replace recenter()
          # --------------------------------------------------------
          recenter_pattern = re.compile(
              r"    public void recenter\(\) \{\n"
              r".*?"
              r"    \}\n\n"
              r"    /\*\n"
              r"     \* =========================================================\n"
              r"     \* LIFECYCLE",
              re.DOTALL,
          )


          recenter_replacement = (
              "    public void recenter() {\n"
              "\n"
              "        followCurrentLocation();\n"
              "    }\n\n"
              "    /*\n"
              "     * =========================================================\n"
              "     * LIFECYCLE"
          )


          text, count = recenter_pattern.subn(
              recenter_replacement,
              text,
              count=1,
          )


          if count != 1:
              raise SystemExit(
                  "FAIL: recenter() replacement "
                  f"expected 1 match, found {count}"
              )


          NAV.write_text(
              text,
              encoding="utf-8",
          )


          print("PASS: patch engine executed")
          print("PASS: NavigationMapView patched")
          PY

          python3 -m py_compile \
            /tmp/apply_navigation_patch.py

          echo "PASS: Python syntax"

          python3 \
            /tmp/apply_navigation_patch.py

          echo "PASS: Python patch execution"

      # ============================================================
      # 07 - VERIFY SOURCE AFTER PATCH
      # ============================================================
      - name: 07 - Verify source after patch
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          GRADLE="v10-source/app/build.gradle"

          grep -Fq \
            'import org.maplibre.android.location.modes.RenderMode;' \
            "$NAV"

          grep -Fq \
            'private static final double AUTO_FOLLOW_ZOOM = 17.0;' \
            "$NAV"

          grep -Fq \
            '"➤",' \
            "$NAV"

          grep -Fq \
            '"Follow current location",' \
            "$NAV"

          grep -Fq \
            'v -> followCurrentLocation());' \
            "$NAV"

          grep -Fq \
            'private void followCurrentLocation() {' \
            "$NAV"

          grep -Fq \
            '.setRenderMode(RenderMode.GPS);' \
            "$NAV"

          grep -Fq \
            'public void recenter() {' \
            "$NAV"

          grep -Fq \
            'followCurrentLocation();' \
            "$NAV"

          ! grep -Fq \
            'private static final double AUTO_FOLLOW_ZOOM = 16.0;' \
            "$NAV"

          ! grep -Fq \
            '"◎",' \
            "$NAV"

          ! grep -Fq \
            '"Recenter and resume auto follow",' \
            "$NAV"

          python3 <<'PY'
          from pathlib import Path


          nav = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          ).read_text(
              encoding="utf-8"
          )


          def count_is(
              needle,
              expected,
              label,
          ):
              actual = nav.count(needle)

              if actual != expected:
                  raise SystemExit(
                      f"FAIL: {label}: "
                      f"expected {expected}, found {actual}"
                  )


          count_is(
              "import org.maplibre.android.location.modes.RenderMode;",
              1,
              "RenderMode import",
          )

          count_is(
              "private void followCurrentLocation() {",
              1,
              "followCurrentLocation method",
          )

          count_is(
              "public void recenter() {",
              1,
              "recenter method",
          )

          count_is(
              "v -> followCurrentLocation());",
              1,
              "follow listener",
          )

          count_is(
              ".setRenderMode(RenderMode.GPS);",
              2,
              "RenderMode.GPS",
          )

          count_is(
              "private static final double AUTO_FOLLOW_ZOOM = 17.0;",
              1,
              "AUTO_FOLLOW_ZOOM",
          )


          depth = 0
          in_block_comment = False


          for line_no, line in enumerate(
              nav.splitlines(),
              1,
          ):
              stripped = line.strip()

              if in_block_comment:
                  if "*/" in stripped:
                      in_block_comment = False
                  continue

              if stripped.startswith("/*"):
                  if "*/" not in stripped:
                      in_block_comment = True
                  continue

              if stripped.startswith("//"):
                  continue

              code = line.split(
                  "//",
                  1,
              )[0]

              depth += (
                  code.count("{")
                  - code.count("}")
              )

              if depth < 0:
                  raise SystemExit(
                      f"FAIL: negative brace depth at line {line_no}"
                  )


          if depth != 0:
              raise SystemExit(
                  f"FAIL: final Java brace depth = {depth}"
              )


          print("PASS: exact patched structure")
          print("PASS: Java brace balance")
          PY

          EXPECTED_GRADLE_SHA="4d512337d46324a33a685d8cdb095e4ecacd3ceb"

          ACTUAL_GRADLE_SHA="$(
            git hash-object "$GRADLE"
          )"

          test "$ACTUAL_GRADLE_SHA" = "$EXPECTED_GRADLE_SHA"

          git diff --check

          echo "PASS: patched source verified"
          echo "PASS: build.gradle unchanged"
          echo "PASS: git diff --check"

      # ============================================================
      # 08 - JAVA SYNTAX / COMPILE
      # ============================================================
      - name: 08 - Java syntax and compile
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:compileReleaseJavaWithJavac

          echo "PASS: Java compile"

      # ============================================================
      # 09 - PREPARE TEMPORARY RELEASE DEX BUILD PATCH
      #
      # IMPORTANT:
      # build.gradle is changed ONLY inside the runner workspace.
      #
      # The repository file is NOT committed.
      #
      # Original SHA is restored after the build.
      #
      # Why:
      # Current AGP sees aasdk-legacy.dex in libs and tries to merge
      # it with classes.dex. That creates duplicate AndroidX classes.
      #
      # V7 keeps legacy DEX as a separate DEX instead of D8-merging
      # it with application DEX.
      # ============================================================
      - name: 09 - Prepare temporary release DEX build
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="v10-source/app/build.gradle"
          LEGACY="v10-source/app/libs/aasdk-legacy.dex"

          EXPECTED_GRADLE_SHA="4d512337d46324a33a685d8cdb095e4ecacd3ceb"

          ACTUAL_GRADLE_SHA="$(
            git hash-object "$GRADLE"
          )"

          test "$ACTUAL_GRADLE_SHA" = "$EXPECTED_GRADLE_SHA"
          test -s "$LEGACY"

          cp \
            "$GRADLE" \
            /tmp/build.gradle.original

          cp \
            "$LEGACY" \
            /tmp/aasdk-legacy.dex.original

          cat > /tmp/patch_release_dex_build.py <<'PY'
          from pathlib import Path
          import re


          path = Path(
              "v10-source/app/build.gradle"
          )

          text = path.read_text(
              encoding="utf-8"
          )


          pattern = re.compile(
              r"tasks\.matching \{ it\.name == 'mergeDexRelease' \}\.configureEach \{ task ->\n"
              r"    task\.doLast \{\n"
              r".*?"
              r"    \}\n"
              r"\}\n",
              re.DOTALL,
          )


          replacement = """tasks.matching { it.name == 'mergeDexRelease' }.configureEach { task ->
    task.doLast {
        def legacyDex = rootProject.file('app/libs/aasdk-legacy.dex')

        if (!legacyDex.exists()) {
            throw new GradleException("Thiếu app/libs/aasdk-legacy.dex!")
        }

        def outputDir = task.outputDir.get().asFile
        def dexFilter = { it.isFile() && it.name ==~ /classes\\d*\\.dex/ } as FileFilter
        def appDexes = outputDir.listFiles(dexFilter)?.toList() ?: []

        if (appDexes.isEmpty()) {
            throw new GradleException(
                "Không tìm thấy classes*.dex trong " + outputDir
            )
        }

        def used = appDexes.collect { it.name } as Set
        def index = 2

        while (used.contains("classes${index}.dex")) {
            index++
        }

        def target = new File(
            outputDir,
            "classes${index}.dex"
        )

        target.bytes = legacyDex.bytes

        println(
            "V7: giữ app DEX nguyên bản"
        )

        println(
            "V7: thêm aasdk-legacy.dex thành " + target.name
        )
    }
}
"""


          matches = list(
              pattern.finditer(text)
          )


          if len(matches) != 1:
              raise SystemExit(
                  "FAIL: expected exactly one "
                  "mergeDexRelease block, found "
                  f"{len(matches)}"
              )


          text = pattern.sub(
              replacement,
              text,
              count=1,
          )


          path.write_text(
              text,
              encoding="utf-8",
          )


          print(
              "PASS: temporary release DEX build patch applied"
          )
          PY

          python3 -m py_compile \
            /tmp/patch_release_dex_build.py

          echo "PASS: Python build patch syntax"

          python3 \
            /tmp/patch_release_dex_build.py

          echo
          echo "Temporary build.gradle SHA:"
          git hash-object "$GRADLE"

          echo
          echo "Original build.gradle SHA:"
          echo "$EXPECTED_GRADLE_SHA"

          echo
          echo "PASS: temporary workspace-only build patch"

      # ============================================================
      # 10 - GRADLE RELEASE BUILD
      # ============================================================
      - name: 10 - Gradle assemble release
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"
          test -s "$APK"

          echo "PASS: Gradle assembleRelease"
          echo "PASS: APK exists"

      # ============================================================
      # 11 - VERIFY APK DEX
      # ============================================================
      - name: 11 - Verify APK DEX layout
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"
          test -s "$APK"

          echo "APK SHA256:"
          sha256sum "$APK"

          echo
          echo "APK DEX files:"

          unzip -Z1 "$APK" \
            | grep -E '^classes[0-9]*\.dex$'

          DEX_COUNT="$(
            unzip -Z1 "$APK" \
              | grep -E '^classes[0-9]*\.dex$' \
              | wc -l \
              | tr -d ' '
          )"

          test "$DEX_COUNT" -ge 2

          echo
          echo "PASS: APK contains $DEX_COUNT DEX files"

          echo
          echo "Checking legacy DEX size:"

          LEGACY_SIZE="$(
            stat -c '%s' \
              "v10-source/app/libs/aasdk-legacy.dex"
          )"

          echo "$LEGACY_SIZE"

          test "$LEGACY_SIZE" -gt 0

          echo "PASS: legacy DEX remains present in workspace"

      # ============================================================
      # 12 - RESTORE ORIGINAL BUILD.GRADLE
      #
      # This guarantees the repository baseline is not modified.
      # ============================================================
      - name: 12 - Restore original build.gradle
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="v10-source/app/build.gradle"

          test -f /tmp/build.gradle.original

          cp \
            /tmp/build.gradle.original \
            "$GRADLE"

          EXPECTED_GRADLE_SHA="4d512337d46324a33a685d8cdb095e4ecacd3ceb"

          ACTUAL_GRADLE_SHA="$(
            git hash-object "$GRADLE"
          )"

          echo "Restored build.gradle SHA:"
          echo "$ACTUAL_GRADLE_SHA"

          test "$ACTUAL_GRADLE_SHA" = "$EXPECTED_GRADLE_SHA"

          echo "PASS: original build.gradle restored"

      # ============================================================
      # 13 - VERIFY PROTECTED FILES
      # ============================================================
      - name: 13 - Verify protected files
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          GRADLE="v10-source/app/build.gradle"
          LEGACY="v10-source/app/libs/aasdk-legacy.dex"

          EXPECTED_NAV_SHA="1600edf884196a146ce5f4233f8de0a8ea282a4e"
          EXPECTED_GRADLE_SHA="4d512337d46324a33a685d8cdb095e4ecacd3ceb"

          ACTUAL_NAV_SHA="$(
            git hash-object "$NAV"
          )"

          ACTUAL_GRADLE_SHA="$(
            git hash-object "$GRADLE"
          )"

          test "$ACTUAL_NAV_SHA" = "$EXPECTED_NAV_SHA"
          test "$ACTUAL_GRADLE_SHA" = "$EXPECTED_GRADLE_SHA"

          test -s "$LEGACY"

          if git status --porcelain \
              | grep -Fq \
                "v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"; then
            echo "FAIL: NavigationMapView.java unexpectedly modified in git"
            exit 1
          fi

          if git status --porcelain \
              | grep -Fq \
                "v10-source/app/build.gradle"; then
            echo "FAIL: build.gradle unexpectedly modified in git"
            exit 1
          fi

          if git status --porcelain \
              | grep -Fq \
                "v10-source/app/libs/aasdk-legacy.dex"; then
            echo "FAIL: legacy DEX unexpectedly modified in git"
            exit 1
          fi

          echo "PASS: NavigationMapView baseline protected"
          echo "PASS: build.gradle baseline restored"
          echo "PASS: legacy DEX unchanged"

      # ============================================================
      # 14 - UPLOAD APK
      # ============================================================
      - name: 14 - Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Follow-V7
          path: v10-source/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # ============================================================
