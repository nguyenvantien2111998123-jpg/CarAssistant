name: Fix zoom va follow auto muot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation-follow-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact main baseline
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify exact baseline
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          GRADLE="v10-source/app/build.gradle"
          EXPECTED_SHA="1600edf884196a146ce5f4233f8de0a8ea282a4e"

          test -f "$FILE"
          test -f "$GRADLE"

          ACTUAL_SHA="$(git hash-object "$FILE")"

          echo "NavigationMapView SHA:"
          echo "$ACTUAL_SHA"

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: NavigationMapView.java SHA mismatch."
            echo "Expected: $EXPECTED_SHA"
            echo "Actual:   $ACTUAL_SHA"
            exit 1
          fi

          grep -Fq 'package com.carassistant.v10;' "$FILE"
          grep -Fq 'org.maplibre.android.location.modes.CameraMode' "$FILE"
          grep -Fq 'org.maplibre.gl:android-sdk:11.11.0' "$GRADLE"

          echo "PASS: Exact baseline verified."

      - name: Verify exact source structure before patch
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          required = [
              "import org.maplibre.android.location.modes.CameraMode;",
              "private static final double AUTO_FOLLOW_ZOOM = 16.0;",
              'addControlButton(',
              '"◎"',
              '"Recenter and resume auto follow"',
              "v -> recenter());",
              "private void enableLocation()",
              """map.getLocationComponent()
                  .setLocationComponentEnabled(true);""",
              "startAutoFollow();",
              "private void startAutoFollow()",
              "public void zoomIn()",
              "public void recenter()",
              "getLastKnownLocation()",
              "CameraMode.TRACKING",
          ]

          for anchor in required:
              if anchor not in text:
                  print("ERROR: Missing source anchor:")
                  print(repr(anchor))
                  sys.exit(1)

          print("PASS: All expected source anchors found.")

          lines = text.splitlines()

          for i, line in enumerate(lines):
              if "setLocationComponentEnabled(true);" in line:
                  start = max(0, i - 5)
                  end = min(len(lines), i + 6)

                  print("")
                  print("===== enableLocation() context =====")

                  for n in range(start, end):
                      print(f"{n + 1}: {lines[n]}")

              if '"◎"' in line:
                  start = max(0, i - 4)
                  end = min(len(lines), i + 7)

                  print("")
                  print("===== Follow button context =====")

                  for n in range(start, end):
                      print(f"{n + 1}: {lines[n]}")

              if line.strip() == "public void recenter() {":
                  start = i
                  end = min(len(lines), i + 35)

                  print("")
                  print("===== recenter() context =====")

                  for n in range(start, end):
                      print(f"{n + 1}: {lines[n]}")

                  break
          PY

      - name: Patch NavigationMapView Follow V2
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          def find_method(text, signature):
              start = text.find(signature)

              if start < 0:
                  raise RuntimeError(
                      f"Method not found: {signature}"
                  )

              brace = text.find("{", start)

              if brace < 0:
                  raise RuntimeError(
                      f"Opening brace not found: {signature}"
                  )

              depth = 0
              in_string = False
              escape = False
              in_line_comment = False
              in_block_comment = False

              i = brace

              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ""

                  if in_line_comment:
                      if ch == "\n":
                          in_line_comment = False

                      i += 1
                      continue

                  if in_block_comment:
                      if ch == "*" and nxt == "/":
                          in_block_comment = False
                          i += 2
                          continue

                      i += 1
                      continue

                  if in_string:
                      if escape:
                          escape = False
                      elif ch == "\\":
                          escape = True
                      elif ch == '"':
                          in_string = False

                      i += 1
                      continue

                  if ch == "/" and nxt == "/":
                      in_line_comment = True
                      i += 2
                      continue

                  if ch == "/" and nxt == "*":
                      in_block_comment = True
                      i += 2
                      continue

                  if ch == '"':
                      in_string = True
                      i += 1
                      continue

                  if ch == "{":
                      depth += 1

                  elif ch == "}":
                      depth -= 1

                      if depth == 0:
                          return start, i + 1

                  i += 1

              raise RuntimeError(
                  f"Unclosed method: {signature}"
              )

          render_import = (
              "import org.maplibre.android.location.modes.RenderMode;"
          )

          if render_import not in text:
              camera_import = (
                  "import org.maplibre.android.location.modes.CameraMode;"
              )

              if camera_import not in text:
                  raise RuntimeError(
                      "CameraMode import anchor not found."
                  )

              text = text.replace(
                  camera_import,
                  camera_import + "\n" + render_import,
                  1
              )

              print("PASS: Added RenderMode import")
          else:
              print("PASS: RenderMode import already exists")

          old_zoom = (
              "private static final double AUTO_FOLLOW_ZOOM = 16.0;"
          )

          new_zoom = (
              "private static final double AUTO_FOLLOW_ZOOM = 17.0;"
          )

          count = text.count(old_zoom)

          if count != 1:
              raise RuntimeError(
                  "Expected exactly one AUTO_FOLLOW_ZOOM 16.0 "
                  f"anchor, found {count}."
              )

          text = text.replace(
              old_zoom,
              new_zoom,
              1
          )

          print("PASS: AUTO_FOLLOW_ZOOM 16.0 -> 17.0")

          old_button = """addControlButton(
                controls,
                "◎",
                "Recenter and resume auto follow",
                v -> recenter());"""

          new_button = """addControlButton(
                controls,
                "➤",
                "Follow current location",
                v -> followCurrentLocation());"""

          if old_button not in text:
              raise RuntimeError(
                  "Exact Follow button block not found."
              )

          text = text.replace(
              old_button,
              new_button,
              1
          )

          print("PASS: Follow button patched")

          method_start, method_end = find_method(
              text,
              "private void enableLocation()"
          )

          method = text[method_start:method_end]

          location_anchor = """map.getLocationComponent()
                  .setLocationComponentEnabled(true);"""

          gps_block = """map.getLocationComponent()
                  .setLocationComponentEnabled(true);

              map.getLocationComponent()
                  .setRenderMode(RenderMode.GPS);"""

          if method.count(location_anchor) != 1:
              raise RuntimeError(
                  "Expected exactly one location component "
                  "anchor inside enableLocation()."
              )

          if "setRenderMode(RenderMode.GPS);" not in method:
              method = method.replace(
                  location_anchor,
                  gps_block,
                  1
              )

              text = (
                  text[:method_start]
                  + method
                  + text[method_end:]
              )

              print(
                  "PASS: Added RenderMode.GPS "
                  "inside enableLocation()"
              )
          else:
              print(
                  "PASS: RenderMode.GPS already exists "
                  "inside enableLocation()"
              )

          follow_signature = (
              "private void followCurrentLocation()"
          )

          if follow_signature not in text:
              zoom_method = "public void zoomIn()"
              insert_at = text.find(zoom_method)

              if insert_at < 0:
                  raise RuntimeError(
                      "public void zoomIn() anchor not found."
                  )

              follow_method = """
          private void followCurrentLocation() {

              if (map == null) {
                  return;
              }

              try {

                  Location location =
                          map.getLocationComponent()
                                  .getLastKnownLocation();

                  if (location == null) {
                      startAutoFollow();
                      return;
                  }

                  map.getLocationComponent()
                          .setRenderMode(RenderMode.GPS);

                  map.animateCamera(
                          CameraUpdateFactory.newLatLngZoom(
                                  new LatLng(
                                          location.getLatitude(),
                                          location.getLongitude()),
                                  AUTO_FOLLOW_ZOOM),
                          500);

                  map.getLocationComponent()
                          .setCameraMode(
                                  CameraMode.TRACKING,
                                  500L,
                                  AUTO_FOLLOW_ZOOM,
                                  null,
                                  0.0,
                                  null);

              } catch (Exception ignored) {
              }
          }

          """

              text = (
                  text[:insert_at]
                  + follow_method
                  + text[insert_at:]
              )

              print(
                  "PASS: Inserted followCurrentLocation()"
              )
          else:
              print(
                  "PASS: followCurrentLocation() "
                  "already exists"
              )

          recenter_start, recenter_end = find_method(
              text,
              "public void recenter()"
          )

          new_recenter = """public void recenter() {

              followCurrentLocation();
          }"""

          text = (
              text[:recenter_start]
              + new_recenter
              + text[recenter_end:]
          )

          print(
              "PASS: recenter() replaced safely"
          )

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

      - name: Verify final patched source
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(
              encoding="utf-8"
          )

          checks = {
              "RenderMode import":
                  "import org.maplibre.android.location.modes.RenderMode;"
                  in text,

              "AUTO_FOLLOW_ZOOM 17":
                  "private static final double AUTO_FOLLOW_ZOOM = 17.0;"
                  in text,

              "Follow button":
                  """addControlButton(
                controls,
                "➤",
                "Follow current location",
                v -> followCurrentLocation());"""
                  in text,

              "GPS render mode":
                  "setRenderMode(RenderMode.GPS);" in text,

              "followCurrentLocation":
                  "private void followCurrentLocation()" in text,

              "recenter delegation":
                  """public void recenter() {

              followCurrentLocation();
          }"""
                  in text,
          }

          failed = False

          for name, ok in checks.items():
              if ok:
                  print(f"PASS: {name}")
              else:
                  print(f"FAIL: {name}")
                  failed = True

          if failed:
              sys.exit(1)

          print("")
          print(
              "PASS: Follow V2 source verification complete."
          )
          PY

      - name: Show final source diff
        shell: bash
        run: |
          set -euo pipefail

          git diff -- \
            v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java

      - name: Compile Debug Java
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:compileDebugJavaWithJavac

      - name: Build Debug APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find v10-source/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          mkdir -p dist

          cp "$APK" \
            "dist/CarAssistant-Navigation-Follow-V2.apk"

          sha256sum \
            "dist/CarAssistant-Navigation-Follow-V2.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-Navigation-Follow-V2
          path: dist/CarAssistant-Navigation-Follow-V2.apk
          if-no-files-found: error
