name: Fix Zoom Auto Follow V4 Safe Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix-zoom-auto-follow-v4:
    name: Verify Patch Compile and Build V10
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:

      # ============================================================
      # 01 - CHECKOUT
      # ============================================================
      - name: 01 - Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      # ============================================================
      # 02 - SETUP JAVA
      # ============================================================
      - name: 02 - Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ============================================================
      # 03 - YAML PARSE
      #
      # IMPORTANT:
      # Parse CHINH workflow dang duoc commit.
      # Khong tham chieu ten workflow cu.
      #
      # Ruby Psych co the parse key "on" thanh boolean true,
      # nen phan verify chap nhan ca "on" va true.
      # ============================================================
      - name: 03 - Parse workflow YAML
        shell: bash
        run: |
          set -euo pipefail

          WORKFLOW="${GITHUB_WORKSPACE}/.github/workflows/fix-zoom-auto-follow-v4-safe-build.yml"

          echo "Workflow path:"
          echo "$WORKFLOW"

          test -f "$WORKFLOW"

          ruby -e '
            require "yaml"

            path = ARGV.fetch(0)
            text = File.read(path, encoding: "UTF-8")

            abort("FAIL: workflow file is empty") if text.strip.empty?

            data = YAML.load_file(path)

            abort("FAIL: YAML root is not a mapping") unless data.is_a?(Hash)

            unless data.key?("on") || data.key?(true)
              abort("FAIL: missing top-level on")
            end

            abort("FAIL: missing top-level jobs") unless data.key?("jobs")

            jobs = data["jobs"]

            abort("FAIL: jobs is not a mapping") unless jobs.is_a?(Hash)
            abort("FAIL: jobs is empty") if jobs.empty?

            puts "PASS: workflow file exists"
            puts "PASS: YAML parsed successfully"
            puts "PASS: top-level on exists"
            puts "PASS: top-level jobs exists"
            puts "PASS: jobs mapping is non-empty"
          ' "$WORKFLOW"

      # ============================================================
      # 04 - PYTHON PARSE / EXECUTION
      #
      # Khong patch Java o buoc nay.
      # Chi verify Python patch engine co the parse + execute.
      # ============================================================
      - name: 04 - Validate Python patch engine
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/validate_patch_engine.py <<'PY'
          from pathlib import Path


          NAV = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          )

          GRADLE = Path(
              "v10-source/app/build.gradle"
          )


          if not NAV.is_file():
              raise SystemExit(
                  "FAIL: NavigationMapView.java not found"
              )

          if not GRADLE.is_file():
              raise SystemExit(
                  "FAIL: app/build.gradle not found"
              )


          nav = NAV.read_text(
              encoding="utf-8"
          )

          gradle = GRADLE.read_text(
              encoding="utf-8"
          )


          required_nav = [
              "import org.maplibre.android.location.modes.CameraMode;",
              "private static final double AUTO_FOLLOW_ZOOM = 16.0;",
              '"◎",',
              "v -> recenter());",
              "public void zoomIn() {",
              "public void recenter() {",
              "private void startAutoFollow() {",
          ]


          required_gradle = [
              "tasks.matching { it.name == 'mergeDexRelease' }.configureEach",
              "project.exec {",
              "app/libs/aasdk-legacy.dex",
          ]


          for item in required_nav:
              if item not in nav:
                  raise SystemExit(
                      f"FAIL: missing NavigationMapView baseline anchor: {item}"
                  )


          for item in required_gradle:
              if item not in gradle:
                  raise SystemExit(
                      f"FAIL: missing build.gradle baseline anchor: {item}"
                  )


          patch_source = r'''
          def replace_once(text, old, new, label):
              count = text.count(old)

              if count != 1:
                  raise SystemExit(
                      f"FAIL: {label}: expected exactly 1 match, found {count}"
                  )

              return text.replace(old, new, 1)


          def check():
              return True
          '''


          compile(
              patch_source,
              "<embedded-patch-engine>",
              "exec",
          )


          namespace = {}
          exec(
              patch_source,
              namespace,
              namespace,
          )


          assert namespace["check"]() is True


          print("PASS: Python patch source parses")
          print("PASS: Python patch engine executes")
          PY

          python3 -m py_compile \
            /tmp/validate_patch_engine.py

          python3 \
            /tmp/validate_patch_engine.py

      # ============================================================
      # 05 - VERIFY CURRENT SOURCE BASELINE
      #
      # KHONG khoa HEAD commit.
      # Chi khoa dung cac file/source baseline can bao ve.
      #
      # Ly do:
      # main co the co them workflow-only commits.
      # ============================================================
      - name: 05 - Verify exact current source baseline
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          GRADLE="v10-source/app/build.gradle"

          EXPECTED_NAV_SHA="1600edf884196a146ce5f4233f8de0a8ea282a4e"
          EXPECTED_GRADLE_SHA="4d512337d46324a33a685d8cdb095e4ecacd3ceb"

          test -f "$NAV"
          test -f "$GRADLE"

          ACTUAL_NAV_SHA="$(
            git hash-object "$NAV"
          )"

          ACTUAL_GRADLE_SHA="$(
            git hash-object "$GRADLE"
          )"

          echo "NavigationMapView:"
          echo "  expected = $EXPECTED_NAV_SHA"
          echo "  actual   = $ACTUAL_NAV_SHA"

          echo "build.gradle:"
          echo "  expected = $EXPECTED_GRADLE_SHA"
          echo "  actual   = $ACTUAL_GRADLE_SHA"

          test "$ACTUAL_NAV_SHA" = "$EXPECTED_NAV_SHA"
          test "$ACTUAL_GRADLE_SHA" = "$EXPECTED_GRADLE_SHA"

          # NavigationMapView baseline anchors.
          grep -Fq \
            'import org.maplibre.android.location.modes.CameraMode;' \
            "$NAV"

          ! grep -Fq \
            'import org.maplibre.android.location.modes.RenderMode;' \
            "$NAV"

          grep -Fq \
            'private static final double AUTO_FOLLOW_ZOOM = 16.0;' \
            "$NAV"

          grep -Fq \
            '"◎",' \
            "$NAV"

          grep -Fq \
            'v -> recenter());' \
            "$NAV"

          grep -Fq \
            'startAutoFollow();' \
            "$NAV"

          grep -Fq \
            'setCameraMode(' \
            "$NAV"

          grep -Fq \
            'public void zoomIn() {' \
            "$NAV"

          grep -Fq \
            'public void recenter() {' \
            "$NAV"

          # build.gradle baseline anchors.
          grep -Fq \
            "tasks.matching { it.name == 'mergeDexRelease' }.configureEach" \
            "$GRADLE"

          grep -Fq \
            "project.exec {" \
            "$GRADLE"

          grep -Fq \
            "app/libs/aasdk-legacy.dex" \
            "$GRADLE"

          echo "PASS: exact current source baseline verified"

      # ============================================================
      # 06 - PATCH NAVIGATIONMAPVIEW ONLY
      #
      # build.gradle KHONG patch.
      # aasdk-legacy.dex KHONG patch.
      # ============================================================
      - name: 06 - Patch zoom and smooth auto follow
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"

          cat > /tmp/apply_navigation_patch.py <<'PY'
          from pathlib import Path
          import re


          NAV_PATH = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          )


          text = NAV_PATH.read_text(
              encoding="utf-8"
          )


          def replace_once(old, new, label):
              global text

              count = text.count(old)

              if count != 1:
                  raise SystemExit(
                      f"FAIL: {label}: expected exactly 1 match, found {count}"
                  )

              text = text.replace(
                  old,
                  new,
                  1,
              )


          # --------------------------------------------------------
          # 1. RenderMode import
          # --------------------------------------------------------
          replace_once(
              "import org.maplibre.android.location.modes.CameraMode;",
              "import org.maplibre.android.location.modes.CameraMode;\n"
              "import org.maplibre.android.location.modes.RenderMode;",
              "RenderMode import",
          )


          # --------------------------------------------------------
          # 2. Zoom 16 -> 17
          # --------------------------------------------------------
          replace_once(
              "private static final double AUTO_FOLLOW_ZOOM = 16.0;",
              "private static final double AUTO_FOLLOW_ZOOM = 17.0;",
              "AUTO_FOLLOW_ZOOM",
          )


          # --------------------------------------------------------
          # 3. Follow button
          # --------------------------------------------------------
          replace_once(
              '                "◎",\n'
              '                "Recenter and resume auto follow",\n'
              '                v -> recenter());',
              '                "➤",\n'
              '                "Follow current location",\n'
              '                v -> followCurrentLocation());',
              "follow control",
          )


          # --------------------------------------------------------
          # 4. GPS render mode when location is enabled
          # --------------------------------------------------------
          replace_once(
              "        map.getLocationComponent()\n"
              "                .setLocationComponentEnabled(true);\n\n"
              "        startAutoFollow();",
              "        map.getLocationComponent()\n"
              "                .setLocationComponentEnabled(true);\n\n"
              "        map.getLocationComponent()\n"
              "                .setRenderMode(RenderMode.GPS);\n\n"
              "        startAutoFollow();",
              "RenderMode.GPS enableLocation",
          )


          # --------------------------------------------------------
          # 5. Insert followCurrentLocation()
          # --------------------------------------------------------
          method = "\n".join(
              [
                  "    private void followCurrentLocation() {",
                  "",
                  "        if (map == null) {",
                  "            return;",
                  "        }",
                  "",
                  "        try {",
                  "",
                  "            Location location =",
                  "                    map.getLocationComponent()",
                  "                            .getLastKnownLocation();",
                  "",
                  "            map.getLocationComponent()",
                  "                    .setRenderMode(RenderMode.GPS);",
                  "",
                  "            if (location != null) {",
                  "",
                  "                LatLng target =",
                  "                        new LatLng(",
                  "                                location.getLatitude(),",
                  "                                location.getLongitude());",
                  "",
                  "                map.animateCamera(",
                  "                        CameraUpdateFactory.newLatLngZoom(",
                  "                                target,",
                  "                                AUTO_FOLLOW_ZOOM),",
                  "                        500);",
                  "            }",
                  "",
                  "            map.getLocationComponent()",
                  "                    .setCameraMode(",
                  "                            CameraMode.TRACKING,",
                  "                            500L,",
                  "                            AUTO_FOLLOW_ZOOM,",
                  "                            null,",
                  "                            0.0,",
                  "                            null);",
                  "",
                  "        } catch (Exception ignored) {",
                  "        }",
                  "    }",
                  "",
              ]
          )


          replace_once(
              "    public void zoomIn() {",
              method + "    public void zoomIn() {",
              "followCurrentLocation insertion",
          )


          # --------------------------------------------------------
          # 6. Replace recenter body
          #
          # Match only the known current baseline structure.
          # --------------------------------------------------------
          recenter_pattern = re.compile(
              r"    public void recenter\(\) \{\n"
              r".*?\n"
              r"    \}\n\n"
              r"    /\*\n"
              r"     \* =========================================================\n"
              r"     \* LIFECYCLE",
              re.DOTALL,
          )


          replacement = (
              "    public void recenter() {\n"
              "\n"
              "        followCurrentLocation();\n"
              "    }\n\n"
              "    /*\n"
              "     * =========================================================\n"
              "     * LIFECYCLE"
          )


          text, count = recenter_pattern.subn(
              replacement,
              text,
              count=1,
          )


          if count != 1:
              raise SystemExit(
                  f"FAIL: recenter replacement: expected 1 match, found {count}"
              )


          NAV_PATH.write_text(
              text,
              encoding="utf-8",
          )


          print(
              "PASS: NavigationMapView patch applied"
          )
          PY

          python3 -m py_compile \
            /tmp/apply_navigation_patch.py

          python3 \
            /tmp/apply_navigation_patch.py

      # ============================================================
      # 07 - VERIFY PATCHED SOURCE STRUCTURE
      #
      # YAML -> Python -> PATCH -> source structure
      # ============================================================
      - name: 07 - Verify patched source structure
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          GRADLE="v10-source/app/build.gradle"

          # --------------------------------------------------------
          # Expected new structure
          # --------------------------------------------------------
          grep -Fq \
            'import org.maplibre.android.location.modes.RenderMode;' \
            "$NAV"

          grep -Fq \
            'private static final double AUTO_FOLLOW_ZOOM = 17.0;' \
            "$NAV"

          grep -Fq \
            '"➤",' \
            "$NAV"

          grep -Fq \
            '"Follow current location",' \
            "$NAV"

          grep -Fq \
            'v -> followCurrentLocation());' \
            "$NAV"

          grep -Fq \
            '.setRenderMode(RenderMode.GPS);' \
            "$NAV"

          grep -Fq \
            'private void followCurrentLocation() {' \
            "$NAV"

          grep -Fq \
            'public void recenter() {' \
            "$NAV"

          grep -Fq \
            'followCurrentLocation();' \
            "$NAV"

          # --------------------------------------------------------
          # Old structure must be gone
          # --------------------------------------------------------
          ! grep -Fq \
            '"◎",' \
            "$NAV"

          ! grep -Fq \
            '"Recenter and resume auto follow",' \
            "$NAV"

          ! grep -Fq \
            'private static final double AUTO_FOLLOW_ZOOM = 16.0;' \
            "$NAV"

          # --------------------------------------------------------
          # Exact occurrence counts
          # --------------------------------------------------------
          python3 <<'PY'
          from pathlib import Path


          nav = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          ).read_text(
              encoding="utf-8"
          )


          def require_count(text, needle, expected, label):
              actual = text.count(needle)

              if actual != expected:
                  raise SystemExit(
                      f"FAIL: {label}: expected {expected}, found {actual}"
                  )


          require_count(
              nav,
              "import org.maplibre.android.location.modes.RenderMode;",
              1,
              "RenderMode import",
          )

          require_count(
              nav,
              "private void followCurrentLocation() {",
              1,
              "followCurrentLocation method",
          )

          require_count(
              nav,
              "public void recenter() {",
              1,
              "recenter method",
          )

          require_count(
              nav,
              "v -> followCurrentLocation());",
              1,
              "follow listener",
          )

          require_count(
              nav,
              ".setRenderMode(RenderMode.GPS);",
              2,
              "RenderMode.GPS",
          )

          require_count(
              nav,
              "private static final double AUTO_FOLLOW_ZOOM = 17.0;",
              1,
              "AUTO_FOLLOW_ZOOM",
          )


          # --------------------------------------------------------
          # Basic Java brace balance.
          #
          # Ignore // comments and block comments.
          # This is a structural check before javac.
          # --------------------------------------------------------
          depth = 0
          in_block_comment = False


          for line_no, line in enumerate(
              nav.splitlines(),
              1,
          ):
              stripped = line.strip()

              if in_block_comment:
                  if "*/" in stripped:
                      in_block_comment = False
                  continue

              if stripped.startswith("/*"):
                  if "*/" not in stripped:
                      in_block_comment = True
                  continue

              if stripped.startswith("//"):
                  continue

              code = line.split(
                  "//",
                  1,
              )[0]

              depth += (
                  code.count("{")
                  - code.count("}")
              )

              if depth < 0:
                  raise SystemExit(
                      f"FAIL: Java brace depth negative at line {line_no}"
                  )


          if depth != 0:
              raise SystemExit(
                  f"FAIL: Java brace depth ends at {depth}"
              )


          print(
              "PASS: Java structural brace verification"
          )
          PY

          # --------------------------------------------------------
          # build.gradle MUST remain byte-for-byte unchanged.
          # --------------------------------------------------------
          EXPECTED_GRADLE_SHA="4d512337d46324a33a685d8cdb095e4ecacd3ceb"

          ACTUAL_GRADLE_SHA="$(
            git hash-object "$GRADLE"
          )"

          test "$ACTUAL_GRADLE_SHA" = "$EXPECTED_GRADLE_SHA"

          git diff --check

          echo "PASS: patched source structure verified"
          echo "PASS: build.gradle remains unchanged"

      # ============================================================
      # 08 - JAVA SYNTAX / COMPILE
      # ============================================================
      - name: 08 - Java compile syntax check
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:compileReleaseJavaWithJavac

          echo "PASS: compileReleaseJavaWithJavac"

      # ============================================================
      # 09 - GRADLE RELEASE ASSEMBLE
      #
      # Preserve original build.gradle and legacy DEX.
      #
      # Temporarily:
      #   app/libs/aasdk-legacy.dex -> /tmp
      #
      # Redirect exactly 2 references in build.gradle.
      #
      # Restore ALL files via trap.
      # ============================================================
      - name: 09 - Assemble release with temporary legacy DEX isolation
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          LEGACY_DEX="app/libs/aasdk-legacy.dex"
          TEMP_LEGACY_DEX="/tmp/aasdk-legacy.dex"

          BUILD_GRADLE="app/build.gradle"
          BUILD_GRADLE_BACKUP="/tmp/app-build.gradle.before-isolation"

          test -f "$LEGACY_DEX"
          test -f "$BUILD_GRADLE"

          cp \
            "$BUILD_GRADLE" \
            "$BUILD_GRADLE_BACKUP"

          cp \
            "$LEGACY_DEX" \
            "$TEMP_LEGACY_DEX"

          restore_original_files() {
            echo "Restoring original build files..."

            if [ -f "$BUILD_GRADLE_BACKUP" ]; then
              cp \
                "$BUILD_GRADLE_BACKUP" \
                "$BUILD_GRADLE"
            fi

            if [ -f "$TEMP_LEGACY_DEX" ]; then
              cp \
                "$TEMP_LEGACY_DEX" \
                "$LEGACY_DEX"
            fi

            echo "PASS: build.gradle restored"
            echo "PASS: aasdk-legacy.dex restored"
          }

          trap restore_original_files EXIT

          echo "Temporarily moving legacy DEX..."
          rm -f "$LEGACY_DEX"

          test ! -f "$LEGACY_DEX"
          test -f "$TEMP_LEGACY_DEX"

          echo "Redirecting exactly 2 legacy DEX references..."

          python3 - "$BUILD_GRADLE" <<'PY'
          from pathlib import Path
          import sys


          path = Path(
              sys.argv[1]
          )


          data = path.read_text(
              encoding="utf-8"
          )


          old = "rootProject.file('app/libs/aasdk-legacy.dex')"
          new = "rootProject.file('/tmp/aasdk-legacy.dex')"


          count = data.count(old)


          if count != 2:
              raise SystemExit(
                  f"FAIL: expected exactly 2 legacy dex references, found {count}"
              )


          updated = data.replace(
              old,
              new,
          )


          path.write_text(
              updated,
              encoding="utf-8",
          )


          print(
              "PASS: exactly 2 legacy DEX references redirected"
          )
          PY

          test "$(
            grep -F \
              -c \
              "rootProject.file('/tmp/aasdk-legacy.dex')" \
              "$BUILD_GRADLE"
          )" -eq 2

          test "$(
            grep -F \
              -c \
              "rootProject.file('app/libs/aasdk-legacy.dex')" \
              "$BUILD_GRADLE"
          )" -eq 0

          echo "Running assembleRelease..."

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease

          test -f \
            "app/build/outputs/apk/release/app-release.apk"

          test -s \
            "app/build/outputs/apk/release/app-release.apk"

          echo "PASS: assembleRelease"

      # ============================================================
      # 10 - VERIFY RESTORATION
      # ============================================================
      - name: 10 - Verify original build files restored
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="v10-source/app/build.gradle"
          LEGACY="v10-source/app/libs/aasdk-legacy.dex"

          EXPECTED_GRADLE_SHA="4d512337d46324a33a685d8cdb095e4ecacd3ceb"

          test -f "$GRADLE"
          test -f "$LEGACY"

          ACTUAL_GRADLE_SHA="$(
            git hash-object "$GRADLE"
          )"

          test "$ACTUAL_GRADLE_SHA" = "$EXPECTED_GRADLE_SHA"

          test "$(
            git status --porcelain -- "$GRADLE"
          )" = ""

          test -s "$LEGACY"

          echo "PASS: build.gradle restored unchanged"
          echo "PASS: aasdk-legacy.dex restored"

      # ============================================================
      # 11 - VERIFY APK
      # ============================================================
      - name: 11 - Verify APK and DEX layout
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"
          test -s "$APK"

          DEX_LIST="$(
            unzip -Z1 "$APK" \
              | grep -E '^classes[0-9]*\.dex$' \
              || true
          )"

          test -n "$DEX_LIST"

          DEX_COUNT="$(
            printf '%s\n' "$DEX_LIST" \
              | sed '/^$/d' \
              | wc -l \
              | tr -d ' '
          )"

          test "$DEX_COUNT" -ge 2

          echo "PASS: APK exists"
          echo "PASS: APK DEX count = $DEX_COUNT"

          echo
          echo "APK DEX files:"
          printf '%s\n' "$DEX_LIST"

          rm -rf \
            /tmp/carassistant-apk-dex

          mkdir -p \
            /tmp/carassistant-apk-dex

          unzip -oq \
            "$APK" \
            'classes*.dex' \
            -d /tmp/carassistant-apk-dex

          LEGACY_FOUND=0

          while IFS= read -r dex; do

            echo
            echo "Checking $dex"

            if "$ANDROID_HOME/build-tools/35.0.0/dexdump" "$dex" \
                | grep -Fq \
                  "com/google/android/apps/auto/sdk"; then

              echo \
                "PASS: Android Auto legacy SDK found in $dex"

              LEGACY_FOUND=1
            fi

          done < <(
            find \
              /tmp/carassistant-apk-dex \
              -type f \
              -name 'classes*.dex' \
              | sort
          )

          if [ "$LEGACY_FOUND" -ne 1 ]; then
            echo \
              "FAIL: Android Auto legacy SDK not found in APK"
            exit 1
          fi

          echo \
            "PASS: Android Auto legacy SDK packaged"

          echo
          echo "APK SHA256:"
          sha256sum "$APK"

      # ============================================================
      # 12 - FINAL CHANGED-FILE VERIFICATION
      #
      # Only NavigationMapView.java may remain modified.
      # ============================================================
      - name: 12 - Final changed-file verification
        shell: bash
        run: |
          set -euo pipefail

          echo "Git status:"
          git status --short

          if git status --porcelain | grep -Fq \
            "v10-source/app/build.gradle"; then

            echo \
              "FAIL: build.gradle was permanently modified"

            exit 1
          fi

          if git status --porcelain | grep -Fq \
            "v10-source/app/libs/aasdk-legacy.dex"; then

            echo \
              "FAIL: aasdk-legacy.dex was permanently modified"

            exit 1
          fi

          if git status --porcelain \
              | grep -Fv \
                "v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java" \
              | grep -q .; then

            echo \
              "FAIL: unexpected files were modified"

            exit 1
          fi

          echo \
            "PASS: only NavigationMapView.java contains intended changes"

      # ============================================================
      # 13 - UPLOAD APK
      # ============================================================
      - name: 13 - Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Follow-V4
