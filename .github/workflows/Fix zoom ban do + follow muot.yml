name: CarAssistant V10 Direct APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build V10 Direct APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      # ============================================================
      # 0. CHECKOUT
      # ============================================================

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ============================================================
      # 1. VERIFY REAL CURRENT SOURCE
      # ============================================================

      - name: Verify current source
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/carassistant/v10"
          NAV="$BASE/NavigationMapView.java"
          GRADLE="v10-source/app/build.gradle"
          GRADLEW="v10-source/gradlew"

          test -s "$NAV"
          test -s "$GRADLE"
          test -s "$GRADLEW"

          echo "========================================"
          echo "CURRENT SOURCE"
          echo "========================================"

          echo "Git commit:"
          git rev-parse HEAD

          echo ""
          echo "NavigationMapView SHA:"
          git hash-object "$NAV"

          echo ""
          echo "build.gradle SHA:"
          git hash-object "$GRADLE"

          echo ""
          echo "PASS: source files exist"
          echo "PASS: current main source verified"

      # ============================================================
      # 2. PROTECT CURRENT NAVIGATION SOURCE
      # ============================================================

      - name: Verify Navigation source
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"

          EXPECTED_NAV_SHA="1600edf884196a146ce5f4233f8de0a8ea282a4e"

          ACTUAL_NAV_SHA="$(git hash-object "$NAV")"

          echo "Expected:"
          echo "$EXPECTED_NAV_SHA"

          echo ""
          echo "Actual:"
          echo "$ACTUAL_NAV_SHA"

          test "$ACTUAL_NAV_SHA" = "$EXPECTED_NAV_SHA"

          grep -Pq \
            '^\s*(?:(?:public|protected|private)\s+)?(?:abstract|final\s+)?class\s+NavigationMapView' \
            "$NAV"

          echo ""
          echo "PASS: NavigationMapView current baseline"
          echo "PASS: NavigationMapView class structure"

      # ============================================================
      # 3. PROTECT GRADLE SOURCE
      # ============================================================

      - name: Verify Gradle source
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="v10-source/app/build.gradle"

          EXPECTED_GRADLE_SHA="4d512337d46324a33a685d8cdb095e4ecacd3ceb"

          ACTUAL_GRADLE_SHA="$(git hash-object "$GRADLE")"

          echo "Expected:"
          echo "$EXPECTED_GRADLE_SHA"

          echo ""
          echo "Actual:"
          echo "$ACTUAL_GRADLE_SHA"

          test "$ACTUAL_GRADLE_SHA" = "$EXPECTED_GRADLE_SHA"

          grep -Fq \
            'org.maplibre.gl:android-sdk:11.11.0' \
            "$GRADLE"

          echo ""
          echo "PASS: build.gradle baseline"
          echo "PASS: MapLibre 11.11.0"

      # ============================================================
      # 4. JAVA COMPILE
      # ============================================================

      - name: Java compile
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:compileDebugJavaWithJavac

          echo "PASS: Java compile"

      # ============================================================
      # 5. DIRECT APK BUILD
      #
      # IMPORTANT:
      # No external DEX.
      # No DEX injection.
      # No APK rewriting.
      # No build.gradle modification.
      # ============================================================

      - name: Assemble direct APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "========================================"
          echo "DIRECT APK BUILD"
          echo "========================================"

          ls -lh "$APK"

          echo ""
          echo "PASS: Gradle assembleDebug"
          echo "PASS: direct APK created"

      # ============================================================
      # 6. VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "========================================"
          echo "APK SHA256"
          echo "========================================"

          sha256sum "$APK"

          echo ""
          echo "========================================"
          echo "APK DEX"
          echo "========================================"

          unzip -Z1 "$APK" \
            | grep -E '^classes[0-9]*\.dex$' \
            | sort -V

          DEX_COUNT="$(
            unzip -Z1 "$APK" \
              | grep -E '^classes[0-9]*\.dex$' \
              | wc -l \
              | tr -d ' '
          )"

          test "$DEX_COUNT" -ge 1

          echo ""
          echo "DEX count: $DEX_COUNT"
          echo "PASS: normal Gradle-generated DEX"

      # ============================================================
      # 7. VERIFY NOTHING WAS MODIFIED
      # ============================================================

      - name: Verify protected files
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          GRADLE="v10-source/app/build.gradle"

          EXPECTED_NAV_SHA="1600edf884196a146ce5f4233f8de0a8ea282a4e"
          EXPECTED_GRADLE_SHA="4d512337d46324a33a685d8cdb095e4ecacd3ceb"

          test "$(git hash-object "$NAV")" = \
            "$EXPECTED_NAV_SHA"

          test "$(git hash-object "$GRADLE")" = \
            "$EXPECTED_GRADLE_SHA"

          git diff --check

          echo "PASS: NavigationMapView unchanged"
          echo "PASS: build.gradle unchanged"
          echo "PASS: source integrity"

      # ============================================================
      # 8. PACKAGE ARTIFACT
      # ============================================================

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          mkdir -p dist

          cp \
            "$APK" \
            "dist/CarAssistant-V10-Direct.apk"

          sha256sum \
            "dist/CarAssistant-V10-Direct.apk" \
            > \
            "dist/CarAssistant-V10-Direct.sha256"

          echo "========================================"
          echo "FINAL APK"
          echo "========================================"

          cat \
            "dist/CarAssistant-V10-Direct.sha256"

      # ============================================================
      # 9. UPLOAD
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Direct
          path: |
            dist/CarAssistant-V10-Direct.apk
            dist/CarAssistant-V10-Direct.sha256
          if-no-files-found: error

      # ============================================================
      # 10. FINAL PASS
      # ============================================================

      - name: Final PASS
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CARASSISTANT V10 DIRECT APK : PASS"
          echo "============================================================"
          echo "Current source             : PASS"
          echo "Navigation protected       : PASS"
          echo "Gradle protected           : PASS"
          echo "Java compile               : PASS"
          echo "Gradle assembleDebug       : PASS"
          echo "Direct APK                 : PASS"
          echo "External DEX injection     : NOT USED"
          echo "APK repacking              : NOT USED"
          echo "Artifact upload            : PASS"
          echo "============================================================"
