name: Fix zoom va auto follow muot 

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  follow-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify current source baseline
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_COMMIT="3ec3ee76204e945ac820d34ed06a2922729430c2"
          EXPECTED_NAV_SHA="1600edf884196a146ce5f4233f8de0a8ea282a4e"
          EXPECTED_GRADLE_SHA="4d512337d46324a33a685d8cdb095e4ecacd3ceb"

          NAV="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          GRADLE="v10-source/app/build.gradle"

          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse "HEAD:$NAV")" = "$EXPECTED_NAV_SHA"
          test "$(git rev-parse "HEAD:$GRADLE")" = "$EXPECTED_GRADLE_SHA"

          grep -Fq 'import org.maplibre.android.location.modes.CameraMode;' "$NAV"
          ! grep -Fq 'import org.maplibre.android.location.modes.RenderMode;' "$NAV"

          grep -Fq 'private static final double AUTO_FOLLOW_ZOOM = 16.0;' "$NAV"
          grep -Fq '"◎"' "$NAV"
          grep -Fq 'v -> recenter()' "$NAV"
          grep -Fq 'startAutoFollow();' "$NAV"
          grep -Fq 'setCameraMode(' "$NAV"

          grep -Fq "tasks.matching { it.name == 'mergeDexRelease' }.configureEach" "$GRADLE"
          grep -Fq "project.exec {" "$GRADLE"
          grep -Fq "+ [legacyDex.absolutePath])" "$GRADLE"

          echo "PASS: exact baseline verified"

      - name: Validate embedded patch script
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          nav = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          ).read_text(encoding="utf-8")

          gradle = Path(
              "v10-source/app/build.gradle"
          ).read_text(encoding="utf-8")

          required_nav = [
              "import org.maplibre.android.location.modes.CameraMode;",
              "private static final double AUTO_FOLLOW_ZOOM = 16.0;",
              "addControlButton(",
              '"◎",',
              "v -> recenter());",
              "public void zoomIn() {",
              "public void recenter() {",
          ]

          required_gradle = [
              "tasks.matching { it.name == 'mergeDexRelease' }.configureEach",
              "project.exec {",
              "+ [legacyDex.absolutePath])",
          ]

          for item in required_nav:
              if item not in nav:
                  raise SystemExit(
                      f"FAIL: missing NavigationMapView anchor: {item}"
                  )

          for item in required_gradle:
              if item not in gradle:
                  raise SystemExit(
                      f"FAIL: missing build.gradle anchor: {item}"
                  )

          patch_method = [
              "    private void followCurrentLocation() {",
              "",
              "        if (map == null) {",
              "            return;",
              "        }",
              "",
              "        try {",
              "",
              "            Location location =",
              "                    map.getLocationComponent()",
              "                            .getLastKnownLocation();",
              "",
              "            map.getLocationComponent()",
              "                    .setRenderMode(RenderMode.GPS);",
              "",
              "            if (location != null) {",
              "",
              "                LatLng target =",
              "                        new LatLng(",
              "                                location.getLatitude(),",
              "                                location.getLongitude());",
              "",
              "                map.animateCamera(",
              "                        CameraUpdateFactory.newLatLngZoom(",
              "                                target,",
              "                                AUTO_FOLLOW_ZOOM),",
              "                        500);",
              "            }",
              "",
              "            map.getLocationComponent()",
              "                    .setCameraMode(",
              "                            CameraMode.TRACKING,",
              "                            500L,",
              "                            AUTO_FOLLOW_ZOOM,",
              "                            null,",
              "                            0.0,",
              "                            null);",
              "",
              "        } catch (Exception ignored) {",
              "        }",
              "    }",
          ]

          if not all(isinstance(x, str) for x in patch_method):
              raise SystemExit(
                  "FAIL: patch method representation"
              )

          print("PASS: patch anchors parse")
          print("PASS: Python patch data parses")
          PY

      - name: Apply Follow V2 patch
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          nav_path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          )

          text = nav_path.read_text(
              encoding="utf-8"
          )

          def replace_once(old, new, label):
              global text

              count = text.count(old)

              if count != 1:
                  raise SystemExit(
                      f"FAIL: {label}: expected 1 match, found {count}"
                  )

              text = text.replace(
                  old,
                  new,
                  1
              )

          replace_once(
              "import org.maplibre.android.location.modes.CameraMode;",
              "import org.maplibre.android.location.modes.CameraMode;\n"
              "import org.maplibre.android.location.modes.RenderMode;",
              "RenderMode import",
          )

          replace_once(
              "private static final double AUTO_FOLLOW_ZOOM = 16.0;",
              "private static final double AUTO_FOLLOW_ZOOM = 17.0;",
              "AUTO_FOLLOW_ZOOM",
          )

          replace_once(
              '                "◎",\n'
              '                "Recenter and resume auto follow",\n'
              '                v -> recenter());',
              '                "➤",\n'
              '                "Follow current location",\n'
              '                v -> followCurrentLocation());',
              "follow control",
          )

          replace_once(
              "        map.getLocationComponent()\n"
              "                .setLocationComponentEnabled(true);\n\n"
              "        startAutoFollow();",
              "        map.getLocationComponent()\n"
              "                .setLocationComponentEnabled(true);\n\n"
              "        map.getLocationComponent()\n"
              "                .setRenderMode(RenderMode.GPS);\n\n"
              "        startAutoFollow();",
              "RenderMode.GPS enableLocation",
          )

          method = "\n".join([
              "    private void followCurrentLocation() {",
              "",
              "        if (map == null) {",
              "            return;",
              "        }",
              "",
              "        try {",
              "",
              "            Location location =",
              "                    map.getLocationComponent()",
              "                            .getLastKnownLocation();",
              "",
              "            map.getLocationComponent()",
              "                    .setRenderMode(RenderMode.GPS);",
              "",
              "            if (location != null) {",
              "",
              "                LatLng target =",
              "                        new LatLng(",
              "                                location.getLatitude(),",
              "                                location.getLongitude());",
              "",
              "                map.animateCamera(",
              "                        CameraUpdateFactory.newLatLngZoom(",
              "                                target,",
              "                                AUTO_FOLLOW_ZOOM),",
              "                        500);",
              "            }",
              "",
              "            map.getLocationComponent()",
              "                    .setCameraMode(",
              "                            CameraMode.TRACKING,",
              "                            500L,",
              "                            AUTO_FOLLOW_ZOOM,",
              "                            null,",
              "                            0.0,",
              "                            null);",
              "",
              "        } catch (Exception ignored) {",
              "        }",
              "    }",
              "",
          ])

          replace_once(
              "    public void zoomIn() {",
              method + "    public void zoomIn() {",
              "followCurrentLocation insertion",
          )

          recenter_pattern = re.compile(
              r"    public void recenter\(\) \{\n"
              r".*?\n"
              r"    \}\n\n"
              r"    /\*\n"
              r"     \* =========================================================\n"
              r"     \* LIFECYCLE",
              re.DOTALL,
          )

          replacement = (
              "    public void recenter() {\n"
              "\n"
              "        followCurrentLocation();\n"
              "    }\n\n"
              "    /*\n"
              "     * =========================================================\n"
              "     * LIFECYCLE"
          )

          text, count = recenter_pattern.subn(
              replacement,
              text,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  f"FAIL: recenter replacement: {count} matches"
              )

          nav_path.write_text(
              text,
              encoding="utf-8"
          )

          print("PASS: Follow V2 source patch applied")
          PY

      - name: Apply release dex packaging fix
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "v10-source/app/build.gradle"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          start = text.find(
              "tasks.matching { it.name == 'mergeDexRelease' }.configureEach { task ->"
          )

          end = text.find(
              "tasks.register('distRelease', Copy) {"
          )

          if start < 0 or end < 0 or end <= start:
              raise SystemExit(
                  "FAIL: mergeDexRelease block boundaries not found"
              )

          new_block = "\n".join([
              "tasks.matching { it.name == 'mergeDexRelease' }.configureEach { task ->",
              "    task.doLast {",
              "        def legacyDex = rootProject.file('app/libs/aasdk-legacy.dex')",
              "        if (!legacyDex.exists()) {",
              "            throw new GradleException(\"Thiếu app/libs/aasdk-legacy.dex!\")",
              "        }",
              "        def outputDir = task.outputDir.get().asFile",
              "        def dexFilter = { it.isFile() && it.name ==~ /classes\\d*\\.dex/ } as FileFilter",
              "        def appDexes = outputDir.listFiles(dexFilter)?.toList() ?: []",
              "        if (appDexes.isEmpty()) {",
              "            throw new GradleException(\"Không tìm thấy classes*.dex trong \" + outputDir)",
              "        }",
              "",
              "        def usedIndices = appDexes.collect { dex ->",
              "            def matcher = dex.name =~ /^classes(\\d*)\\.dex$/",
              "            if (!matcher.matches()) {",
              "                return 0",
              "            }",
              "            def suffix = matcher.group(1)",
              "            return suffix.isEmpty() ? 1 : Integer.parseInt(suffix)",
              "        }",
              "",
              "        def nextIndex = usedIndices.max() + 1",
              "",
              "        def legacyTarget = new File(",
              "                outputDir,",
              "                nextIndex == 1 ? \"classes.dex\" : \"classes${nextIndex}.dex\")",
              "",
              "        legacyTarget.bytes = legacyDex.bytes",
              "",
              "        println(\"PASS: packaged legacy SDK dex as ${legacyTarget.name}\")",
              "    }",
              "}",
              "",
          ])

          text = (
              text[:start]
              + new_block
              + text[end:]
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "PASS: release dex packaging patch applied"
          )
          PY

      - name: Verify patched source and Java structure
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          GRADLE="v10-source/app/build.gradle"

          grep -Fq 'import org.maplibre.android.location.modes.RenderMode;' "$NAV"
          grep -Fq 'private static final double AUTO_FOLLOW_ZOOM = 17.0;' "$NAV"
          grep -Fq '"➤"' "$NAV"
          grep -Fq '"Follow current location"' "$NAV"
          grep -Fq 'v -> followCurrentLocation());' "$NAV"
          grep -Fq '.setRenderMode(RenderMode.GPS);' "$NAV"
          grep -Fq 'private void followCurrentLocation() {' "$NAV"
          grep -Fq 'public void recenter() {' "$NAV"
          grep -Fq 'followCurrentLocation();' "$NAV"

          ! grep -Fq '"◎"' "$NAV"
          ! grep -Fq 'Recenter and resume auto follow' "$NAV"

          grep -Fq "tasks.matching { it.name == 'mergeDexRelease' }.configureEach" "$GRADLE"
          ! grep -Fq "project.exec {" "$GRADLE"
          ! grep -Fq "+ appDexes*.absolutePath + [legacyDex.absolutePath]" "$GRADLE"
          grep -Fq 'legacyTarget.bytes = legacyDex.bytes' "$GRADLE"

          python3 - <<'PY'
          from pathlib import Path

          source = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          ).read_text(
              encoding="utf-8"
          )

          if source.count(
              "import org.maplibre.android.location.modes.RenderMode;"
          ) != 1:
              raise SystemExit(
                  "FAIL: RenderMode import count"
              )

          if source.count(
              "private void followCurrentLocation() {"
          ) != 1:
              raise SystemExit(
                  "FAIL: followCurrentLocation count"
              )

          if source.count(
              "public void recenter() {"
          ) != 1:
              raise SystemExit(
                  "FAIL: recenter count"
              )

          if source.count(
              "v -> followCurrentLocation());"
          ) != 1:
              raise SystemExit(
                  "FAIL: follow button listener count"
              )

          if source.count(
              ".setRenderMode(RenderMode.GPS);"
          ) != 2:
              raise SystemExit(
                  "FAIL: expected two RenderMode.GPS calls"
              )

          depth = 0
          in_block_comment = False

          for line_no, line in enumerate(
              source.splitlines(),
              1
          ):
              stripped = line.strip()

              if in_block_comment:
                  if "*/" in stripped:
                      in_block_comment = False
                  continue

              if stripped.startswith("/*"):
                  if "*/" not in stripped:
                      in_block_comment = True
                  continue

              if stripped.startswith("//"):
                  continue

              code = line.split(
                  "//",
                  1
              )[0]

              depth += (
                  code.count("{")
                  - code.count("}")
              )

              if depth < 0:
                  raise SystemExit(
                      f"FAIL: Java brace depth negative at line {line_no}"
                  )

          if depth != 0:
              raise SystemExit(
                  f"FAIL: Java brace depth ends at {depth}"
              )

          print(
              "PASS: Java source structure and braces verified"
          )
          PY

          git diff --check

          git diff -- \
            v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java \
            v10-source/app/build.gradle

      - name: Compile release APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          DEX_COUNT="$(
            unzip -Z1 "$APK" \
              | grep -Ec '^classes[0-9]*\.dex$'
          )"

          test "$DEX_COUNT" -ge 2

          echo "PASS: APK exists"
          echo "PASS: APK dex count = $DEX_COUNT"

          sha256sum "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Follow-V2
          path: v10-source/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
