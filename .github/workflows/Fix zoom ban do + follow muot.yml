name: Patch NavigationMapView Follow V3 Safe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-navigation-map-view:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate workflow YAML syntax
        shell: bash
        run: |
          set -euo pipefail

          WORKFLOW=".github/workflows/patch-navigation-map-view-follow-v3-safe.yml"

          test -s "$WORKFLOW"

          ruby -e '
            require "yaml"
            path = ARGV.fetch(0)
            YAML.load_file(path)
            puts "PASS: YAML parse"
          ' "$WORKFLOW"

      - name: Verify current source and protected files
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          GRADLE="v10-source/app/build.gradle"
          LEGACY="v10-source/app/libs/aasdk-legacy.dex"

          EXPECTED_NAV_SHA="1600edf884196a146ce5f4233f8de0a8ea282a4e"
          EXPECTED_GRADLE_SHA="4d512337d46324a33a685d8cdb095e4ecacd3ceb"

          test -s "$NAV"
          test -s "$GRADLE"
          test -s "$LEGACY"

          ACTUAL_NAV_SHA="$(git hash-object "$NAV")"
          ACTUAL_GRADLE_SHA="$(git hash-object "$GRADLE")"

          echo "NavigationMapView SHA:"
          echo "$ACTUAL_NAV_SHA"

          echo "build.gradle SHA:"
          echo "$ACTUAL_GRADLE_SHA"

          test "$ACTUAL_NAV_SHA" = "$EXPECTED_NAV_SHA"
          test "$ACTUAL_GRADLE_SHA" = "$EXPECTED_GRADLE_SHA"

          test -z "$(git status --porcelain -- "$NAV")"
          test -z "$(git status --porcelain -- "$GRADLE")"
          test -z "$(git status --porcelain -- "$LEGACY")"

          echo "PASS: exact NavigationMapView baseline"
          echo "PASS: exact build.gradle baseline"
          echo "PASS: legacy DEX protected"
          echo "PASS: protected files clean"

      - name: Create Python patch script
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/patch_navigation.py <<'PY'
          from pathlib import Path

          NAV = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          )

          EXPECTED_SHA = (
              "1600edf884196a146ce5f4233f8de0a8ea282a4e"
          )

          text = NAV.read_text(encoding="utf-8")

          def require_once(old: str, new: str, label: str) -> None:
              global text

              count = text.count(old)

              if count != 1:
                  raise SystemExit(
                      f"FAIL: expected exactly one occurrence for {label}, got {count}"
                  )

              text = text.replace(old, new, 1)

          require_once(
              "import org.maplibre.android.location.modes.CameraMode;\n",
              "import org.maplibre.android.location.modes.CameraMode;\n"
              "import org.maplibre.android.location.modes.RenderMode;\n",
              "RenderMode import",
          )

          require_once(
              "private static final double AUTO_FOLLOW_ZOOM = 16.0;",
              "private static final double AUTO_FOLLOW_ZOOM = 17.5;",
              "AUTO_FOLLOW_ZOOM",
          )

          require_once(
              """        LocationComponentOptions options =
                  LocationComponentOptions
                          .builder(context)
                          .pulseEnabled(true)
                          .trackingGesturesManagement(true)
                          .build();""",
              """        LocationComponentOptions options =
                  LocationComponentOptions
                          .builder(context)
                          .pulseEnabled(true)
                          .trackingGesturesManagement(true)
                          .compassAnimationEnabled(true)
                          .build();""",
              "LocationComponentOptions",
          )

          require_once(
              """        map.getLocationComponent()
                .setLocationComponentEnabled(true);

        startAutoFollow();""",
              """        map.getLocationComponent()
                .setLocationComponentEnabled(true);

        map.getLocationComponent()
                .setRenderMode(RenderMode.GPS);

        startAutoFollow();""",
              "GPS render mode",
          )

          require_once(
              """                            CameraMode.TRACKING,
                            800L,
                            AUTO_FOLLOW_ZOOM,""",
              """                            CameraMode.TRACKING_GPS,
                            600L,
                            AUTO_FOLLOW_ZOOM,""",
              "auto-follow camera mode",
          )

          require_once(
              """                            CameraMode.TRACKING,
                            500L,
                            AUTO_FOLLOW_ZOOM,""",
              """                            CameraMode.TRACKING_GPS,
                            600L,
                            AUTO_FOLLOW_ZOOM,""",
              "recenter camera mode",
          )

          NAV.write_text(text, encoding="utf-8")

          print("PASS: NavigationMapView patch applied")
          print("PASS: zoom 17.5")
          print("PASS: GPS location render mode")
          print("PASS: GPS camera tracking")
          print("PASS: smooth 600ms follow transition")
          print("PASS: compass animation enabled")
          PY

      - name: Python parse patch script
        shell: bash
        run: |
          set -euo pipefail

          python3 -m py_compile /tmp/patch_navigation.py

          echo "PASS: Python syntax parse"

      - name: Apply NavigationMapView patch
        shell: bash
        run: |
          set -euo pipefail

          python3 /tmp/patch_navigation.py

          echo "PASS: Python patch execution"

      - name: Verify patched source
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          GRADLE="v10-source/app/build.gradle"
          LEGACY="v10-source/app/libs/aasdk-legacy.dex"

          CURRENT_NAV_SHA="$(git hash-object "$NAV")"
          CURRENT_GRADLE_SHA="$(git hash-object "$GRADLE")"

          echo "Patched NavigationMapView SHA:"
          echo "$CURRENT_NAV_SHA"

          echo "build.gradle SHA:"
          echo "$CURRENT_GRADLE_SHA"

          test "$CURRENT_GRADLE_SHA" = \
            "4d512337d46324a33a685d8cdb095e4ecacd3ceb"

          grep -Fq \
            'private static final double AUTO_FOLLOW_ZOOM = 17.5;' \
            "$NAV"

          grep -Fq \
            'import org.maplibre.android.location.modes.RenderMode;' \
            "$NAV"

          grep -Fq \
            '.setRenderMode(RenderMode.GPS);' \
            "$NAV"

          grep -Fq \
            'CameraMode.TRACKING_GPS' \
            "$NAV"

          grep -Fq \
            '.compassAnimationEnabled(true)' \
            "$NAV"

          test "$(grep -Fc 'CameraMode.TRACKING_GPS' "$NAV")" -eq 2
          test "$(grep -Fc 'CameraMode.TRACKING,' "$NAV")" -eq 0

          echo "PASS: patched source structure"
          echo "PASS: GPS render mode"
          echo "PASS: TRACKING_GPS enabled"
          echo "PASS: old TRACKING mode removed"
          echo "PASS: zoom 17.5"
          echo "PASS: protected build.gradle unchanged"

      - name: Verify source diff
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          GRADLE="v10-source/app/build.gradle"
          LEGACY="v10-source/app/libs/aasdk-legacy.dex"

          git diff --check

          test -z "$(git status --porcelain -- "$GRADLE")"
          test -z "$(git status --porcelain -- "$LEGACY")"

          CHANGED_FILES="$(
            git status --porcelain \
              | awk '{print substr($0,4)}'
          )"

          test "$CHANGED_FILES" = "$NAV"

          echo "PASS: exactly one source file changed"
          echo "PASS: build.gradle unchanged"
          echo "PASS: legacy DEX unchanged"
          echo "PASS: git diff --check"

          git diff -- "$NAV"

      - name: Gradle Java compile
        shell: bash
        working-directory: v10-source
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:compileReleaseJavaWithJavac

          echo "PASS: Java syntax / compile"

      - name: Gradle assembleRelease
        shell: bash
        working-directory: v10-source
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease

          APK="app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          echo "PASS: Gradle assembleRelease"
          ls -lh "$APK"

      - name: Verify APK and DEX layout
        shell: bash
        working-directory: v10-source
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          LEGACY="$GITHUB_WORKSPACE/v10-source/app/libs/aasdk-legacy.dex"

          test -s "$APK"
          test -s "$LEGACY"

          mapfile -t DEX_FILES < <(
            unzip -Z1 "$APK" |
              grep -E '^classes[0-9]*\.dex$' |
              sort -V
          )

          test "${#DEX_FILES[@]}" -ge 2

          echo "APK DEX files:"
          printf '%s\n' "${DEX_FILES[@]}"

          echo "PASS: APK contains ${#DEX_FILES[@]} DEX files"
          echo "PASS: legacy DEX packaging preserved"

      - name: Final protected-file verification
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          GRADLE="v10-source/app/build.gradle"
          LEGACY="v10-source/app/libs/aasdk-legacy.dex"

          EXPECTED_GRADLE_SHA="4d512337d46324a33a685d8cdb095e4ecacd3ceb"

          test "$(git hash-object "$GRADLE")" = "$EXPECTED_GRADLE_SHA"
          test -s "$LEGACY"

          test -z "$(git status --porcelain -- "$GRADLE")"
          test -z "$(git status --porcelain -- "$LEGACY")"

          git diff --check -- "$NAV"

          echo "PASS: build.gradle protected"
          echo "PASS: legacy DEX protected"
          echo "PASS: NavigationMapView patch valid"
          echo "PASS: final protected-file verification"

      - name: Commit only NavigationMapView
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "$NAV"

          test -n "$(git diff --cached --name-only)"

          STAGED_FILES="$(
            git diff --cached --name-only
          )"

          test "$STAGED_FILES" = "$NAV"

          git commit \
            -m "Patch NavigationMapView GPS auto follow"

          git push origin HEAD:main

          echo "PASS: committed only NavigationMapView.java"
          echo "PASS: pushed to main"
