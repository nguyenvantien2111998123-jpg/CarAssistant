name: Build Car Assistant V10-6A Persistence-1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore V10-6A source baseline
        shell: bash
        run: |
          set -euo pipefail

          BASELINE="9075636a7d5947c1b0eee49c2bd3fd0e1b6b0cf1"

          echo "Restoring exact V10-6A baseline:"
          echo "$BASELINE"

          git fetch origin "$BASELINE" --depth=1
          git checkout "$BASELINE" -- v10-source

          test -f "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
          test -f "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          test -f "v10-source/app/src/main/java/com/hieptran/aacast/doudou/RootView.java"

          if [ -f "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java" ]; then
            echo "ERROR: V10ProjectionService.java exists."
            echo "V10-8 architecture is NOT allowed."
            exit 1
          fi

          echo "Exact V10-6A baseline restored."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # V10-6A Persistence-1
      # Only change VirtualDisplay / Surface lifecycle.
      # ============================================================

      - name: Patch V10ProjectionSession - Persistence-1
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          text = source.read_text(encoding="utf-8")

          # ----------------------------------------------------------
          # 1. Add targetLaunched field
          # ----------------------------------------------------------

          old_field = """    private boolean destroyed;

          private int contentWidth;"""

          new_field = """    private boolean destroyed;

              /*
               * Persistence-1:
               * Keep the target task alive while the TextureView
               * surface is temporarily destroyed/recreated.
               *
               * The target is launched only once for the current
               * VirtualDisplay.
               */
              private boolean targetLaunched;

          private int contentWidth;"""

          if "private boolean targetLaunched;" not in text:
              if old_field not in text:
                  raise SystemExit(
                      "ERROR: destroyed/contentWidth marker not found."
                  )

              text = text.replace(
                  old_field,
                  new_field,
                  1
              )

          # ----------------------------------------------------------
          # 2. Replace setTarget()
          # ----------------------------------------------------------

          old_set_target = """    public void setTarget(
            ComponentName component) {

        if (component == null) {
            target = null;
            release();
            return;
        }

        boolean changed =
                !component.equals(target);

        target = component;

        if (changed
                && virtualDisplay != null) {
            releaseDisplayOnly();
        }

        ensureDisplay();
    }"""

          new_set_target = """    public void setTarget(
            ComponentName component) {

        if (component == null) {
            target = null;
            release();
            return;
        }

        boolean changed =
                !component.equals(target);

        target = component;

        if (changed
                && virtualDisplay != null) {

            releaseDisplayOnly();

            targetLaunched = false;
        }

        ensureDisplay();
    }"""

          if old_set_target not in text:
              raise SystemExit(
                  "ERROR: Original setTarget() block not found."
              )

          text = text.replace(
              old_set_target,
              new_set_target,
              1
          )

          # ----------------------------------------------------------
          # 3. Replace ensureDisplay()
          # ----------------------------------------------------------

          start = text.find(
              "    private void ensureDisplay() {"
          )

          end = text.find(
              "    private void launchTarget() {",
              start
          )

          if start < 0 or end < 0:
              raise SystemExit(
                  "ERROR: ensureDisplay()/launchTarget() boundaries not found."
              )

          new_ensure = r'''    private void ensureDisplay() {

        if (destroyed
                || target == null
                || textureView == null
                || !textureView.isAvailable()) {
            return;
        }

        /*
         * Persistence-1:
         *
         * The VirtualDisplay is deliberately kept alive when only
         * the TextureView SurfaceTexture disappears.
         *
         * When the SurfaceTexture comes back, attach the new Surface
         * to the SAME VirtualDisplay instead of creating a new one.
         */
        if (virtualDisplay != null
                && display != null) {

            attachCurrentSurface();

            return;
        }

        SurfaceTexture st =
                textureView.getSurfaceTexture();

        if (st == null) {
            return;
        }

        int width =
                textureView.getWidth();

        int height =
                textureView.getHeight();

        if (width < 1 || height < 1) {
            return;
        }

        try {

            st.setDefaultBufferSize(
                    width,
                    height);

            Surface newSurface =
                    new Surface(st);

            DisplayManager manager =
                    (DisplayManager)
                            context.getSystemService(
                                    Context.DISPLAY_SERVICE);

            if (manager == null) {

                newSurface.release();

                throw new IllegalStateException(
                        "DisplayManager unavailable");
            }

            android.hardware.display.VirtualDisplay
                    newVirtualDisplay =
                    manager.createVirtualDisplay(
                            V10Display.nameFor(0),
                            width,
                            height,
                            160,
                            newSurface,
                            10);

            if (newVirtualDisplay == null) {

                newSurface.release();

                throw new IllegalStateException(
                        "Cannot create virtual display");
            }

            Display newDisplay =
                    newVirtualDisplay.getDisplay();

            if (newDisplay == null) {

                newVirtualDisplay.release();
                newSurface.release();

                throw new IllegalStateException(
                        "Virtual display has no Display");
            }

            surface =
                    newSurface;

            virtualDisplay =
                    newVirtualDisplay;

            display =
                    newDisplay;

            contentWidth =
                    width;

            contentHeight =
                    height;

            /*
             * Initial launch only.
             */
            launchTarget();

        } catch (RuntimeException e) {

            release();

            Log.w(
                    TAG,
                    "Display creation failed",
                    e);
        }
    }

    private void attachCurrentSurface() {

        if (virtualDisplay == null
                || textureView == null
                || !textureView.isAvailable()) {
            return;
        }

        SurfaceTexture st =
                textureView.getSurfaceTexture();

        if (st == null) {
            return;
        }

        int width =
                textureView.getWidth();

        int height =
                textureView.getHeight();

        if (width < 1 || height < 1) {
            return;
        }

        try {

            st.setDefaultBufferSize(
                    width,
                    height);

            Surface newSurface =
                    new Surface(st);

            Surface oldSurface =
                    surface;

            surface =
                    newSurface;

            contentWidth =
                    width;

            contentHeight =
                    height;

            /*
             * IMPORTANT:
             * Keep the existing VirtualDisplay.
             * Only replace its rendering Surface.
             */
            virtualDisplay.setSurface(
                    newSurface);

            if (oldSurface != null
                    && oldSurface != newSurface) {

                try {
                    oldSurface.release();
                } catch (Throwable ignored) {
                }
            }

            Log.d(
                    TAG,
                    "Persistence-1: reattached Surface to existing VirtualDisplay");

        } catch (Throwable t) {

            Log.w(
                    TAG,
                    "Persistence-1: Surface reattach failed",
                    t);
        }
    }

'''

          text = (
              text[:start]
              + new_ensure
              + text[end:]
          )

          # ----------------------------------------------------------
          # 4. Replace launchTarget()
          # ----------------------------------------------------------

          start = text.find(
              "    private void launchTarget() {"
          )

          end = text.find(
              "    private float mapX(float x) {",
              start
          )

          if start < 0 or end < 0:
              raise SystemExit(
                  "ERROR: launchTarget()/mapX() boundaries not found."
              )

          new_launch = r'''    private void launchTarget() {

        if (display == null
                || target == null
                || targetLaunched) {
            return;
        }

        final int displayId =
                display.getDisplayId();

        final int userId =
                Process.myUid() / 100000;

        final String flat =
                target.flattenToString()
                        .replace(
                                "'",
                                "'\"'\"'");

        /*
         * Persistence-1:
         *
         * DO NOT force-stop the target application.
         *
         * The existing task is allowed to remain alive.
         * --activity-reorder-to-front brings the existing task back
         * instead of creating a fresh task whenever possible.
         */
        final String command =
                "/system/bin/am start"
                        + " --user "
                        + userId
                        + " --display "
                        + displayId
                        + " --windowingMode 1"
                        + " --activity-reorder-to-front"
                        + " -a android.intent.action.MAIN"
                        + " -c android.intent.category.LAUNCHER"
                        + " -f 0x10000000"
                        + " -n '"
                        + flat
                        + "'";

        targetLaunched = true;

        RootShellSession.EXEC.execute(
                () -> {

                    try {

                        rootShell.run(
                                10,
                                command);

                    } catch (Throwable t) {

                        Log.w(
                                TAG,
                                "Launch failed",
                                t);
                    }
                });
    }

'''

          text = (
              text[:start]
              + new_launch
              + text[end:]
          )

          # ----------------------------------------------------------
          # 5. Replace releaseDisplayOnly()
          # ----------------------------------------------------------

          old_release = """    private void releaseDisplayOnly() {

        if (virtualDisplay != null) {

            try {
                virtualDisplay.release();
            } catch (Throwable ignored) {
            }
        }

        virtualDisplay = null;
        display = null;

        if (surface != null) {

            try {
                surface.release();
            } catch (Throwable ignored) {
            }
        }

        surface = null;
    }"""

          new_release = """    private void releaseDisplayOnly() {

        if (virtualDisplay != null) {

            try {
                virtualDisplay.release();
            } catch (Throwable ignored) {
            }
        }

        virtualDisplay = null;
        display = null;

        if (surface != null) {

            try {
                surface.release();
            } catch (Throwable ignored) {
            }
        }

        surface = null;

        targetLaunched = false;
    }"""

          if old_release not in text:
              raise SystemExit(
                  "ERROR: releaseDisplayOnly() block not found."
              )

          text = text.replace(
              old_release,
              new_release,
              1
          )

          # ----------------------------------------------------------
          # 6. Replace onSurfaceTextureDestroyed()
          # ----------------------------------------------------------

          old_destroy = """    @Override
    public boolean onSurfaceTextureDestroyed(
            SurfaceTexture surface) {

        releaseDisplayOnly();

        return true;
    }"""

          new_destroy = """    @Override
    public boolean onSurfaceTextureDestroyed(
            SurfaceTexture surface) {

        /*
         * Persistence-1:
         *
         * Do NOT release VirtualDisplay here.
         * The projected application's task must remain alive.
         *
         * Detach only the old rendering Surface. The next
         * SurfaceTextureAvailable event will attach a new Surface
         * to the existing VirtualDisplay.
         */
        if (virtualDisplay != null) {

            try {
                virtualDisplay.setSurface(null);
            } catch (Throwable t) {
                Log.w(
                        TAG,
                        "Persistence-1: detach Surface failed",
                        t);
            }
        }

        if (this.surface != null) {

            try {
                this.surface.release();
            } catch (Throwable ignored) {
            }

            this.surface = null;
        }

        return true;
    }"""

          if old_destroy not in text:
              raise SystemExit(
                  "ERROR: onSurfaceTextureDestroyed() block not found."
              )

          text = text.replace(
              old_destroy,
              new_destroy,
              1
          )

          source.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "V10-6A Persistence-1 patch applied successfully."
          )
          PY

      # ============================================================
      # Restore the exact V10-6A floating controls
      # ============================================================

      - name: Patch V10ProjectionSession - display RECENTS
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          cat > /tmp/v10_recents_method.txt <<'EOF'
              public void recents() {
                  if (!isActive()) {
                      return;
                  }

                  final int displayId =
                          display.getDisplayId();

                  final String command =
                          "/system/bin/input -d "
                                  + displayId
                                  + " keyevent 187";

                  RootShellSession.EXEC.execute(
                          () -> {
                              try {
                                  rootShell.run(
                                          5,
                                          command);
                              } catch (Throwable t) {
                                  Log.w(
                                          TAG,
                                          "Recents failed",
                                          t);
                              }
                          });
              }

          EOF

          python3 - "$FILE" /tmp/v10_recents_method.txt <<'PY'
          from pathlib import Path
          import re
          import sys

          source = Path(sys.argv[1])
          method_file = Path(sys.argv[2])

          text = source.read_text(encoding="utf-8")
          method = method_file.read_text(encoding="utf-8")

          if "public void recents()" not in text:
              pattern = re.compile(
                  r"(?m)^[ \t]*public\s+void\s+back\s*\(\s*\)\s*\{"
              )

              match = pattern.search(text)

              if not match:
                  raise SystemExit(
                      "ERROR: V10ProjectionSession.back() was not found."
                  )

              text = (
                  text[:match.start()]
                  + method
                  + text[match.start():]
              )

              source.write_text(
                  text,
                  encoding="utf-8"
              )

          print("RECENTS patch OK.")
          PY

      - name: Patch V10CarActivity - imports
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          text = source.read_text(encoding="utf-8")

          marker = "import android.content.pm.ResolveInfo;"

          imports = [
              "import android.content.SharedPreferences;",
              "import android.os.SystemClock;",
              "import android.view.MotionEvent;",
              "import android.view.ViewConfiguration;",
              "import android.view.ViewGroup;",
          ]

          missing = [
              item for item in imports if item not in text
          ]

          if missing:
              if marker not in text:
                  raise SystemExit(
                      "ERROR: ResolveInfo import marker not found."
                  )

              text = text.replace(
                  marker,
                  marker + "\n" + "\n".join(missing),
                  1
              )

              source.write_text(
                  text,
                  encoding="utf-8"
              )

          print("V10CarActivity imports OK.")
          PY

      - name: Patch V10CarActivity - floating controls
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          text = source.read_text(encoding="utf-8")

          fields = """    private TextView floatingTouchKey;
              private LinearLayout floatingMenu;

              private boolean floatingDragging;
              private float floatingDownRawX;
              private float floatingDownRawY;
              private int floatingStartX;
              private int floatingStartY;
              private long floatingLastTap;
          """

          if "private TextView floatingTouchKey;" not in text:
              marker = "    private V10ProjectionSession session;"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: session field marker not found."
                  )

              text = text.replace(
                  marker,
                  marker + "\n" + fields.rstrip(),
                  1
              )

          if "createFloatingTouchKey();" not in text:
              marker = """        session.attachTextureView(
                textureView);"""

              if marker not in text:
                  raise SystemExit(
                      "ERROR: attachTextureView marker not found."
                  )

              text = text.replace(
                  marker,
                  marker + "\n\n        createFloatingTouchKey();",
                  1
              )

          if "private void createFloatingTouchKey()" not in text:

              methods = r'''    private void createFloatingTouchKey() {
        if (floatingTouchKey != null) {
            return;
        }

        floatingTouchKey = new TextView(this);
        floatingTouchKey.setText("●");
        floatingTouchKey.setTextColor(Color.WHITE);
        floatingTouchKey.setTextSize(22);
        floatingTouchKey.setGravity(Gravity.CENTER);

        GradientDrawable bg =
                new GradientDrawable();

        bg.setShape(GradientDrawable.OVAL);
        bg.setColor(Color.rgb(25, 35, 45));
        bg.setStroke(
                dp(2),
                Color.rgb(80, 170, 230));

        floatingTouchKey.setBackground(bg);
        floatingTouchKey.setElevation(dp(12));

        SharedPreferences prefs =
                getSharedPreferences(
                        "v10_floating_key",
                        MODE_PRIVATE);

        FrameLayout.LayoutParams params =
                new FrameLayout.LayoutParams(
                        dp(58),
                        dp(58),
                        Gravity.TOP | Gravity.END);

        int savedX =
                prefs.getInt("x", dp(18));

        int savedY =
                prefs.getInt("y", dp(120));

        params.setMargins(
                0,
                savedY,
                savedX,
                0);

        projectionLayer.addView(
                floatingTouchKey,
                params);

        floatingTouchKey.setOnTouchListener(
                (view, event) -> {

                    switch (event.getActionMasked()) {

                        case MotionEvent.ACTION_DOWN:
                            floatingDragging = false;
                            floatingDownRawX = event.getRawX();
                            floatingDownRawY = event.getRawY();

                            ViewGroup.LayoutParams lp =
                                    view.getLayoutParams();

                            if (lp instanceof FrameLayout.LayoutParams) {
                                FrameLayout.LayoutParams fp =
                                        (FrameLayout.LayoutParams) lp;

                                floatingStartX =
                                        fp.rightMargin;

                                floatingStartY =
                                        fp.topMargin;
                            }

                            return true;

                        case MotionEvent.ACTION_MOVE:

                            float dx =
                                    event.getRawX()
                                            - floatingDownRawX;

                            float dy =
                                    event.getRawY()
                                            - floatingDownRawY;

                            if (!floatingDragging
                                    && Math.hypot(dx, dy)
                                    > ViewConfiguration
                                            .get(this)
                                            .getScaledTouchSlop()) {
                                floatingDragging = true;
                            }

                            if (floatingDragging) {

                                int width =
                                        projectionLayer.getWidth();

                                int height =
                                        projectionLayer.getHeight();

                                int keySize =
                                        dp(58);

                                int right =
                                        Math.round(
                                                floatingStartX - dx);

                                int top =
                                        Math.round(
                                                floatingStartY + dy);

                                right =
                                        Math.max(
                                                0,
                                                Math.min(
                                                        Math.max(
                                                                0,
                                                                width - keySize),
                                                        right));

                                top =
                                        Math.max(
                                                0,
                                                Math.min(
                                                        Math.max(
                                                                0,
                                                                height - keySize),
                                                        top));

                                FrameLayout.LayoutParams fp =
                                        (FrameLayout.LayoutParams)
                                                view.getLayoutParams();

                                fp.rightMargin = right;
                                fp.topMargin = top;

                                view.setLayoutParams(fp);
                            }

                            return true;

                        case MotionEvent.ACTION_UP:

                            if (floatingDragging) {

                                FrameLayout.LayoutParams fp =
                                        (FrameLayout.LayoutParams)
                                                view.getLayoutParams();

                                prefs.edit()
                                        .putInt(
                                                "x",
                                                fp.rightMargin)
                                        .putInt(
                                                "y",
                                                fp.topMargin)
                                        .apply();

                                floatingDragging = false;

                                return true;
                            }

                            long now =
                                    SystemClock.uptimeMillis();

                            long delta =
                                    now - floatingLastTap;

                            floatingLastTap = now;

                            if (delta > 0 && delta < 320) {
                                handleControlHome();
                                hideFloatingMenu();
                            } else {
                                showFloatingMenu();
                            }

                            view.performClick();

                            return true;

                        case MotionEvent.ACTION_CANCEL:
                            floatingDragging = false;
                            return true;

                        default:
                            return true;
                    }
                });

        floatingTouchKey.bringToFront();
    }

    private void showFloatingMenu() {

        if (floatingMenu != null) {
            hideFloatingMenu();
            return;
        }

        floatingMenu =
                new LinearLayout(this);

        floatingMenu.setOrientation(
                LinearLayout.VERTICAL);

        floatingMenu.setPadding(
                dp(8),
                dp(8),
                dp(8),
                dp(8));

        GradientDrawable menuBg =
                new GradientDrawable();

        menuBg.setColor(Color.rgb(15, 20, 26));
        menuBg.setCornerRadius(dp(16));
        menuBg.setStroke(
                dp(1),
                Color.rgb(65, 85, 105));

        floatingMenu.setBackground(menuBg);
        floatingMenu.setElevation(dp(14));

        addFloatingMenuButton(
                "BACK",
                () -> {
                    handleControlBack();
                    hideFloatingMenu();
                });

        addFloatingMenuButton(
                "RECENTS",
                () -> {
                    if (session != null) {
                        session.recents();
                    }
                    hideFloatingMenu();
                });

        addFloatingMenuButton(
                "2 SCREEN",
                () -> {
                    switchToTwoScreen();
                    hideFloatingMenu();
                });

        addFloatingMenuButton(
                "3 SCREEN",
                () -> {
                    switchToThreeScreen();
                    hideFloatingMenu();
                });

        FrameLayout.LayoutParams params =
                new FrameLayout.LayoutParams(
                        dp(170),
                        -2,
                        Gravity.TOP | Gravity.END);

        params.setMargins(
                0,
                dp(70),
                dp(18),
                0);

        projectionLayer.addView(
                floatingMenu,
                params);

        floatingMenu.bringToFront();
        floatingTouchKey.bringToFront();
    }

    private void addFloatingMenuButton(
            String label,
            Runnable action) {

        TextView button =
                new TextView(this);

        button.setText(label);
        button.setTextColor(Color.WHITE);
        button.setTextSize(14);
        button.setGravity(
                Gravity.CENTER_VERTICAL);

        GradientDrawable bg =
                new GradientDrawable();

        bg.setColor(Color.rgb(28, 38, 48));
        bg.setCornerRadius(dp(10));

        button.setBackground(bg);

        button.setPadding(
                dp(16),
                0,
                dp(16),
                0);

        button.setOnClickListener(
                v -> action.run());

        LinearLayout.LayoutParams params =
                new LinearLayout.LayoutParams(
                        -1,
                        dp(48));

        params.setMargins(
                0,
                dp(3),
                0,
                dp(3));

        floatingMenu.addView(
                button,
                params);
    }

    private void hideFloatingMenu() {

        if (floatingMenu == null) {
            return;
        }

        projectionLayer.removeView(
                floatingMenu);

        floatingMenu = null;
    }

    private void switchToTwoScreen() {

        RootView rootView =
                RootView.getCurrent();

        if (rootView != null) {
            rootView.setLayoutModeExternal(0);
        }
    }

    private void switchToThreeScreen() {

        RootView rootView =
                RootView.getCurrent();

        if (rootView != null) {
            rootView.setLayoutModeExternal(2);
        }
    }

'''

              marker = "    public void handleControlBack()"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: handleControlBack marker not found."
                  )

              text = text.replace(
                  marker,
                  methods + marker,
                  1
              )

          source.write_text(
              text,
              encoding="utf-8"
          )

          print("Floating controls restored.")
          PY

      - name: Patch RootView - external layout mode
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/RootView.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          text = source.read_text(encoding="utf-8")

          if "setLayoutModeExternal(int mode)" not in text:

              method = """    public void setLayoutModeExternal(int mode) {
                  final int targetMode =
                          clamp(mode, 0, 5);

                  handler.post(
                          () -> {
                              if (destroyed) {
                                  return;
                              }

                              layoutMode =
                                      targetMode;

                              loadRatios();

                              prefs.edit()
                                      .putInt(
                                              "layout_mode_v3",
                                              layoutMode)
                                      .apply();

                              applyVisibility();

                              container.requestLayout();
                              container.resizeAll();
                          });
              }

          """

              marker = "    public void reloadSettings()"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: RootView.reloadSettings marker not found."
                  )

              text = text.replace(
                  marker,
                  method + marker,
                  1
              )

              source.write_text(
                  text,
                  encoding="utf-8"
              )

          print("RootView patch OK.")
          PY

      # ============================================================
      # Static verification
      # ============================================================

      - name: Verify V10-6A Persistence-1
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          SESSION="app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
          ACTIVITY="app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          ROOT="app/src/main/java/com/hieptran/aacast/doudou/RootView.java"

          echo "=== Architecture guard ==="

          if [ -f "app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java" ]; then
            echo "ERROR: V10ProjectionService.java detected."
            echo "V10-8 architecture is forbidden."
            exit 1
          fi

          echo "PASS: No V10ProjectionService.java"

          echo "=== Persistence checks ==="

          grep -q "private boolean targetLaunched;" "$SESSION"
          grep -q "virtualDisplay.setSurface(null)" "$SESSION"
          grep -q "virtualDisplay.setSurface(newSurface)" "$SESSION"
          grep -q "targetLaunched" "$SESSION"
          grep -q -- "--activity-reorder-to-front" "$SESSION"

          if grep -q "am force-stop" "$SESSION"; then
            echo "ERROR: force-stop still exists in V10ProjectionSession."
            exit 1
          fi

          if grep -q "releaseDisplayOnly();" "$SESSION" \
             | true; then
            :
          fi

          echo "PASS: VirtualDisplay persistence logic detected."
          echo "PASS: force-stop removed."

          echo "=== V10-6A controls ==="

          grep -q "public void recents()" "$SESSION"
          grep -q "keyevent 187" "$SESSION"
          grep -q "RootShellSession.EXEC.execute" "$SESSION"

          grep -q "createFloatingTouchKey" "$ACTIVITY"
          grep -q '"BACK"' "$ACTIVITY"
          grep -q '"RECENTS"' "$ACTIVITY"
          grep -q '"2 SCREEN"' "$ACTIVITY"
          grep -q '"3 SCREEN"' "$ACTIVITY"

          grep -q "setLayoutModeExternal(int mode)" "$ROOT"

          echo "PASS: V10-6A controls preserved."

          echo "=== Diff check ==="

          git diff --check

          echo "V10-6A Persistence-1 static verification PASSED."

      # ============================================================
      # Build
      # ============================================================

      - name: Compile Java
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            compileDebugJavaWithJavac

      - name: Build V10-6A Persistence-1 APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Locate APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print -quit)"

          test -n "$APK"

          echo "APK=$APK"

      - name: Upload V10-6A Persistence-1 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-6A-Persistence-1
          path: v10-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
