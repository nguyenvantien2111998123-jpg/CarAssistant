name: Build Car Assistant V10-6A Persistence-1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore V10-6A baseline
        run: |
          set -e
          git fetch origin 9075636a7d5947c1b0eee49c2bd3fd0e1b6b0cf1 --depth=1
          git checkout 9075636a7d5947c1b0eee49c2bd3fd0e1b6b0cf1 -- v10-source

          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/RootView.java

          if [ -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java ]; then
            echo "ERROR: V10-8 service detected"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Patch Persistence-1
        working-directory: v10-source
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java")
          s = p.read_text()

          s = s.replace(
              "    private boolean destroyed;\n",
              "    private boolean destroyed;\n    private boolean targetLaunched;\n",
              1
          )

          pattern = r"    private void launchTarget\(\) \{.*?\n    private float mapX"

          new_method = "\n".join([
              "    private void launchTarget() {",
              "        if (display == null || target == null || targetLaunched) {",
              "            return;",
              "        }",
              "",
              "        final int displayId = display.getDisplayId();",
              "        final int userId = Process.myUid() / 100000;",
              "        final String flat = target.flattenToString().replace(\"'\", \"'\\\"'\\\"'\");",
              "",
              "        final String command =",
              "                \"/system/bin/am start\"",
              "                        + \" --user \" + userId",
              "                        + \" --display \" + displayId",
              "                        + \" --windowingMode 1\"",
              "                        + \" --activity-reorder-to-front\"",
              "                        + \" -a android.intent.action.MAIN\"",
              "                        + \" -c android.intent.category.LAUNCHER\"",
              "                        + \" -f 0x10000000\"",
              "                        + \" -n '\" + flat + \"'\";",
              "",
              "        targetLaunched = true;",
              "",
              "        RootShellSession.EXEC.execute(",
              "                () -> {",
              "                    try {",
              "                        rootShell.run(10, command);",
              "                    } catch (Throwable t) {",
              "                        Log.w(TAG, \"Launch failed\", t);",
              "                    }",
              "                });",
              "    }",
              "",
              "    private float mapX"
          ])

          s2, count = re.subn(pattern, new_method, s, count=1, flags=re.S)

          if count != 1:
              raise SystemExit("launchTarget patch failed")

          s = s2

          old = """    @Override
    public void onSurfaceTextureAvailable(
            SurfaceTexture surface,
            int width,
            int height) {
        ensureDisplay();
    }"""

          new = """    @Override
    public void onSurfaceTextureAvailable(
            SurfaceTexture surface,
            int width,
            int height) {

        if (virtualDisplay != null) {
            try {
                surface.setDefaultBufferSize(
                        width,
                        height);

                Surface newSurface =
                        new Surface(surface);

                Surface oldSurface =
                        this.surface;

                this.surface =
                        newSurface;

                contentWidth =
                        width;

                contentHeight =
                        height;

                virtualDisplay.setSurface(
                        newSurface);

                if (oldSurface != null) {
                    oldSurface.release();
                }

                return;

            } catch (Throwable t) {
                Log.w(
                        TAG,
                        "Persistence reattach failed",
                        t);
            }
        }

        ensureDisplay();
    }"""

          if old not in s:
              raise SystemExit("surface available block not found")

          s = s.replace(old, new, 1)

          old = """    @Override
    public boolean onSurfaceTextureDestroyed(
            SurfaceTexture surface) {
        releaseDisplayOnly();
        return true;
    }"""

          new = """    @Override
    public boolean onSurfaceTextureDestroyed(
            SurfaceTexture surface) {

        if (virtualDisplay != null) {
            try {
                virtualDisplay.setSurface(null);
            } catch (Throwable t) {
                Log.w(
                        TAG,
                        "Persistence detach failed",
                        t);
            }
        }

        if (this.surface != null) {
            try {
                this.surface.release();
            } catch (Throwable ignored) {
            }

            this.surface = null;
        }

        return true;
    }"""

          if old not in s:
              raise SystemExit("surface destroyed block not found")

          s = s.replace(old, new, 1)

          s = s.replace(
              "        surface = null;\n    }\n\n    public void release()",
              "        surface = null;\n        targetLaunched = false;\n    }\n\n    public void release()",
              1
          )

          p.write_text(s)
          print("Persistence-1 patch OK")
          PY

      - name: Patch RECENTS
        working-directory: v10-source
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java")
          s = p.read_text()

          if "public void recents()" not in s:
              method = "\n".join([
                  "    public void recents() {",
                  "        if (!isActive()) return;",
                  "        final int displayId = display.getDisplayId();",
                  "        final String command =",
                  "                \"/system/bin/input -d \" + displayId + \" keyevent 187\";",
                  "        RootShellSession.EXEC.execute(",
                  "                () -> {",
                  "                    try {",
                  "                        rootShell.run(5, command);",
                  "                    } catch (Throwable t) {",
                  "                        Log.w(TAG, \"Recents failed\", t);",
                  "                    }",
                  "                });",
                  "    }",
                  ""
              ])

              s = s.replace(
                  "    public void back()",
                  method + "    public void back()",
                  1
              )

          p.write_text(s)
          print("RECENTS OK")
          PY

      - name: Verify Persistence-1
        working-directory: v10-source
        run: |
          set -e

          SESSION="app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          if [ -f app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java ]; then
            echo "ERROR: V10-8 architecture detected"
            exit 1
          fi

          grep -q "targetLaunched" "$SESSION"
          grep -q "virtualDisplay.setSurface(null)" "$SESSION"
          grep -q "virtualDisplay.setSurface(" "$SESSION"
          grep -q "public void recents()" "$SESSION"

          if grep -q "am force-stop" "$SESSION"; then
            echo "ERROR: force-stop still present"
            exit 1
          fi

          git diff --check

          echo "Persistence-1 verification PASSED"

      - name: Compile
        working-directory: v10-source
        run: |
          ./gradlew --no-daemon --stacktrace compileDebugJavaWithJavac

      - name: Build APK
        working-directory: v10-source
        run: |
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Locate APK
        run: |
          find v10-source/app/build/outputs/apk/debug -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-6A-Persistence-1
          path: v10-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
