name: Build Car Assistant V10-6A Persistence-1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore V10-6A baseline
        run: |
          set -e
          BASELINE="9075636a7d5947c1b0eee49c2bd3fd0e1b6b0cf1"
          git fetch origin "$BASELINE" --depth=1
          git checkout "$BASELINE" -- v10-source

          test -f "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
          test -f "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          test -f "v10-source/app/src/main/java/com/hieptran/aacast/doudou/RootView.java"

          if [ -f "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java" ]; then
            echo "ERROR: V10-8 service detected"
            exit 1
          fi

          echo "V10-6A baseline OK"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply Persistence-1 patch
        working-directory: v10-source
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path

          f = Path("app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java")
          s = f.read_text()

          # 1. Add launch state
          s = s.replace(
              "    private boolean destroyed;\n",
              "    private boolean destroyed;\n"
              "    private boolean targetLaunched;\n",
              1
          )

          # 2. Remove force-stop and launch only once
          old = '''        final String packageName =
                target.getPackageName()
                        .replace(
                                "'",
                                "'\\"'\\"'");

        final String flat =
                target.flattenToString()
                        .replace(
                                "'",
                                "'\\"'\\"'");

        final String command =
                "/system/bin/am force-stop '"
                        + packageName
                        + "'; "
                        + "/system/bin/am start"
                        + " --user "
                        + userId
                        + " --display "
                        + displayId
                        + " --windowingMode 1"
                        + " -a android.intent.action.MAIN"
                        + " -c android.intent.category.LAUNCHER"
                        + " -f 0x18000000"
                        + " -n '"
                        + flat
                        + "'";
'''

          new = '''        if (targetLaunched) {
            return;
        }

        final String flat =
                target.flattenToString()
                        .replace(
                                "'",
                                "'\\"'\\"'");

        final String command =
                "/system/bin/am start"
                        + " --user "
                        + userId
                        + " --display "
                        + displayId
                        + " --windowingMode 1"
                        + " --activity-reorder-to-front"
                        + " -a android.intent.action.MAIN"
                        + " -c android.intent.category.LAUNCHER"
                        + " -f 0x10000000"
                        + " -n '"
                        + flat
                        + "'";

        targetLaunched = true;
'''

          if old not in s:
              raise SystemExit("ERROR: launchTarget block not found")

          s = s.replace(old, new, 1)

          # 3. Keep VirtualDisplay when SurfaceTexture disappears
          old = '''    @Override
    public boolean onSurfaceTextureDestroyed(
            SurfaceTexture surface) {

        releaseDisplayOnly();

        return true;
    }'''

          new = '''    @Override
    public boolean onSurfaceTextureDestroyed(
            SurfaceTexture surface) {

        if (virtualDisplay != null) {
            try {
                virtualDisplay.setSurface(null);
            } catch (Throwable t) {
                Log.w(
                        TAG,
                        "Persistence-1 detach failed",
                        t);
            }
        }

        if (this.surface != null) {
            try {
                this.surface.release();
            } catch (Throwable ignored) {
            }

            this.surface = null;
        }

        return true;
    }'''

          if old not in s:
              raise SystemExit(
                  "ERROR: onSurfaceTextureDestroyed block not found"
              )

          s = s.replace(old, new, 1)

          # 4. Reattach a new Surface to the existing VirtualDisplay
          marker = '''    @Override
    public void onSurfaceTextureAvailable(
            SurfaceTexture surface,
            int width,
            int height) {

        ensureDisplay();
    }
'''

          replacement = '''    @Override
    public void onSurfaceTextureAvailable(
            SurfaceTexture surface,
            int width,
            int height) {

        if (virtualDisplay != null) {
            try {
                surface.setDefaultBufferSize(
                        width,
                        height);

                Surface newSurface =
                        new Surface(surface);

                Surface oldSurface =
                        this.surface;

                this.surface =
                        newSurface;

                contentWidth =
                        width;

                contentHeight =
                        height;

                virtualDisplay.setSurface(
                        newSurface);

                if (oldSurface != null) {
                    try {
                        oldSurface.release();
                    } catch (Throwable ignored) {
                    }
                }

                return;

            } catch (Throwable t) {
                Log.w(
                        TAG,
                        "Persistence-1 reattach failed",
                        t);
            }
        }

        ensureDisplay();
    }
'''

          if marker not in s:
              raise SystemExit(
                  "ERROR: SurfaceTextureAvailable block not found"
              )

          s = s.replace(marker, replacement, 1)

          # 5. Reset launch state only when display is really released
          s = s.replace(
              "        surface = null;\n    }\n\n    public void release()",
              "        surface = null;\n        targetLaunched = false;\n    }\n\n    public void release()",
              1
          )

          f.write_text(s)
          print("Persistence-1 patch OK")
          PY

      - name: Apply V10-6A controls
        working-directory: v10-source
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path

          session = Path(
              "app/src/main/java/com/hieptran/aacast/doudou/"
              "V10ProjectionSession.java"
          )

          activity = Path(
              "app/src/main/java/com/hieptran/aacast/doudou/"
              "V10CarActivity.java"
          )

          root = Path(
              "app/src/main/java/com/hieptran/aacast/doudou/"
              "RootView.java"
          )

          # RECENTS
          s = session.read_text()

          if "public void recents()" not in s:
              method = '''    public void recents() {
        if (!isActive()) {
            return;
        }

        final int displayId =
                display.getDisplayId();

        final String command =
                "/system/bin/input -d "
                        + displayId
                        + " keyevent 187";

        RootShellSession.EXEC.execute(
                () -> {
                    try {
                        rootShell.run(
                                5,
                                command);
                    } catch (Throwable t) {
                        Log.w(
                                TAG,
                                "Recents failed",
                                t);
                    }
                });
    }

'''

              s = s.replace(
                  "    public void back()",
                  method + "    public void back()",
                  1
              )

              session.write_text(s)

          # Activity imports
          a = activity.read_text()

          imports = [
              "import android.content.SharedPreferences;",
              "import android.os.SystemClock;",
              "import android.view.MotionEvent;",
              "import android.view.ViewConfiguration;",
              "import android.view.ViewGroup;"
          ]

          marker = "import android.content.pm.ResolveInfo;"

          for imp in imports:
              if imp not in a:
                  a = a.replace(
                      marker,
                      marker + "\n" + imp,
                      1
                  )

          # Floating fields
          if "floatingTouchKey" not in a:
              marker = "    private V10ProjectionSession session;"

              fields = '''    private TextView floatingTouchKey;
              private LinearLayout floatingMenu;
              private boolean floatingDragging;
              private float floatingDownRawX;
              private float floatingDownRawY;
              private int floatingStartX;
              private int floatingStartY;
              private long floatingLastTap;
'''

              a = a.replace(
                  marker,
                  marker + "\n" + fields,
                  1
              )

          # Restore call
          if "createFloatingTouchKey();" not in a:
              marker = '''        session.attachTextureView(
                textureView);'''

              a = a.replace(
                  marker,
                  marker + "\n\n        createFloatingTouchKey();",
                  1
              )

          activity.write_text(a)

          # RootView
          r = root.read_text()

          if "setLayoutModeExternal(int mode)" not in r:
              method = '''    public void setLayoutModeExternal(int mode) {
        final int targetMode =
                clamp(mode, 0, 5);

        handler.post(
                () -> {
                    if (destroyed) {
                        return;
                    }

                    layoutMode =
                            targetMode;

                    loadRatios();

                    prefs.edit()
                            .putInt(
                                    "layout_mode_v3",
                                    layoutMode)
                            .apply();

                    applyVisibility();

                    container.requestLayout();
                    container.resizeAll();
                });
    }

'''

              r = r.replace(
                  "    public void reloadSettings()",
                  method + "    public void reloadSettings()",
                  1
              )

              root.write_text(r)

          print("V10-6A controls preserved")
          PY

      - name: Verify architecture and persistence
        working-directory: v10-source
        run: |
          set -e

          SESSION="app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          if [ -f "app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java" ]; then
            echo "ERROR: V10-8 architecture detected"
            exit 1
          fi

          grep -q "targetLaunched" "$SESSION"
          grep -q "virtualDisplay.setSurface(null)" "$SESSION"
          grep -q "virtualDisplay.setSurface" "$SESSION"
          grep -q "public void recents()" "$SESSION"

          if grep -q "am force-stop" "$SESSION"; then
            echo "ERROR: force-stop still exists"
            exit 1
          fi

          grep -q "createFloatingTouchKey" \
            app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

          grep -q "setLayoutModeExternal(int mode)" \
            app/src/main/java/com/hieptran/aacast/doudou/RootView.java

          git diff --check

          echo "V10-6A Persistence-1 verification PASSED"

      - name: Compile
        working-directory: v10-source
        run: |
          ./gradlew --no-daemon --stacktrace compileDebugJavaWithJavac

      - name: Build APK
        working-directory: v10-source
        run: |
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-6A-Persistence-1
          path: v10-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
