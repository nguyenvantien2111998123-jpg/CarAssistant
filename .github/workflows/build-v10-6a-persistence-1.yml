name: Build Car Assistant V10-6A Persistence 1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore V10-6A source baseline
        shell: bash
        run: |
          set -euo pipefail

          BASELINE="9075636a7d5947c1b0eee49c2bd3fd0e1b6b0cf1"

          git fetch origin "$BASELINE" --depth=1
          git checkout "$BASELINE" -- v10-source

          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/RootView.java

          if [ -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java ]; then
            echo "ERROR: V10ProjectionService.java detected."
            echo "V10-8 architecture must NOT be used."
            exit 1
          fi

          echo "V10-6A baseline restored."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply exact V10-6A PASS patches
        shell: bash
        run: |
          set -euo pipefail

          PASS=".github/workflows/build-v10-6a-floating-key-fix.yml"

          test -f "$PASS"

          ruby <<'RUBY'
          require "yaml"
          require "open3"

          file = ".github/workflows/build-v10-6a-floating-key-fix.yml"
          data = YAML.safe_load(
            File.read(file),
            permitted_classes: [],
            aliases: true
          )

          steps = data.fetch("jobs").fetch("build").fetch("steps")

          selected = steps.select do |step|
            name = step["name"].to_s
            name.start_with?("Patch ")
          end

          abort "ERROR: No V10-6A patch steps found." if selected.empty?

          selected.each do |step|
            run = step["run"]
            next if run.nil?

            dir = step["working-directory"]
            name = step["name"]

            puts ""
            puts "========================================"
            puts name
            puts "========================================"

            if dir
              Dir.chdir(dir) do
                system("bash", "-euo", "pipefail", "-c", run) or
                  abort "ERROR: #{name} failed."
              end
            else
              system("bash", "-euo", "pipefail", "-c", run) or
                abort "ERROR: #{name} failed."
            end
          end

          puts ""
          puts "Exact V10-6A PASS patches applied."
          RUBY

      - name: Patch Persistence 1 - V10ProjectionSession
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          if "private boolean targetLaunched;" not in s:
              marker = "    private boolean destroyed;"
              if marker not in s:
                  raise SystemExit("ERROR: destroyed field marker not found.")

              s = s.replace(
                  marker,
                  marker + "\n\n    private boolean targetLaunched;",
                  1
              )

          old_launch = '''        final String command =
                "/system/bin/am force-stop '"
                        + packageName
                        + "'; "
                        + "/system/bin/am start"
                        + " --user "
                        + userId
                        + " --display "
                        + displayId
                        + " --windowingMode 1"
                        + " -a android.intent.action.MAIN"
                        + " -c android.intent.category.LAUNCHER"
                        + " -f 0x18000000"
                        + " -n '"
                        + flat
                        + "'";'''

          new_launch = '''        if (targetLaunched) {
            return;
        }

        targetLaunched = true;

        final String command =
                "/system/bin/am start"
                        + " --user "
                        + userId
                        + " --display "
                        + displayId
                        + " --windowingMode 1"
                        + " -a android.intent.action.MAIN"
                        + " -c android.intent.category.LAUNCHER"
                        + " -f 0x18000000"
                        + " --activity-reorder-to-front"
                        + " -n '"
                        + flat
                        + "'";'''

          if old_launch in s:
              s = s.replace(old_launch, new_launch, 1)
          elif "targetLaunched = true;" not in s:
              raise SystemExit("ERROR: launchTarget command block not found.")

          old_release = '''        virtualDisplay = null;
        display = null;

        if (surface != null) {'''

          new_release = '''        virtualDisplay = null;
        display = null;
        targetLaunched = false;

        if (surface != null) {'''

          if old_release in s and "targetLaunched = false;" not in s:
              s = s.replace(old_release, new_release, 1)

          old_available = '''    public void onSurfaceTextureAvailable(
            SurfaceTexture surface,
            int width,
            int height) {
        ensureDisplay();
    }'''

          new_available = '''    public void onSurfaceTextureAvailable(
            SurfaceTexture surfaceTexture,
            int width,
            int height) {

        if (destroyed || target == null) {
            return;
        }

        if (virtualDisplay != null) {
            try {
                surfaceTexture.setDefaultBufferSize(
                        width,
                        height);

                Surface newSurface =
                        new Surface(surfaceTexture);

                virtualDisplay.setSurface(
                        newSurface);

                if (surface != null) {
                    try {
                        surface.release();
                    } catch (Throwable ignored) {
                    }
                }

                surface = newSurface;

                contentWidth = width;
                contentHeight = height;

                return;

            } catch (Throwable t) {
                Log.w(
                        TAG,
                        "Surface reattach failed",
                        t);
            }
        }

        ensureDisplay();
    }'''

          if old_available in s:
              s = s.replace(old_available, new_available, 1)
          elif "Surface reattach failed" not in s:
              raise SystemExit("ERROR: onSurfaceTextureAvailable block not found.")

          old_destroyed = '''    @Override
    public boolean onSurfaceTextureDestroyed(
            SurfaceTexture surface) {
        releaseDisplayOnly();
        return true;
    }'''

          new_destroyed = '''    @Override
    public boolean onSurfaceTextureDestroyed(
            SurfaceTexture surfaceTexture) {

        if (virtualDisplay != null) {
            try {
                virtualDisplay.setSurface(null);
            } catch (Throwable ignored) {
            }
        }

        if (surface != null) {
            try {
                surface.release();
            } catch (Throwable ignored) {
            }
        }

        surface = null;

        return true;
    }'''

          if old_destroyed in s:
              s = s.replace(old_destroyed, new_destroyed, 1)
          elif "virtualDisplay.setSurface(null)" not in s:
              raise SystemExit("ERROR: onSurfaceTextureDestroyed block not found.")

          p.write_text(s, encoding="utf-8")

          print("Persistence 1: V10ProjectionSession patched.")
          PY

      - name: Patch Persistence 1 - V10CarActivity lifecycle
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          old = '''        if (session != null) {
            session.release();
        }

        super.onStop();'''

          new = '''        /*
         * Persistence 1:
         * Do NOT release the projection session here.
         *
         * Android Auto may stop/resume this Activity while
         * the projected application should remain alive.
         *
         * Full cleanup is still performed by onDestroy()
         * or explicit HOME / target switching.
         */

        super.onStop();'''

          if old not in s:
              raise SystemExit(
                  "ERROR: V10CarActivity onStop release block not found."
              )

          s = s.replace(old, new, 1)

          p.write_text(s, encoding="utf-8")

          print("Persistence 1: onStop no longer releases session.")
          PY

      - name: Verify Persistence 1
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          SESSION="app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
          ACTIVITY="app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          echo "Checking V10-6A architecture..."

          if [ -f app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java ]; then
            echo "ERROR: V10-8 ProjectionService detected."
            exit 1
          fi

          echo "Checking Persistence 1..."

          grep -q "private boolean targetLaunched;" "$SESSION"
          grep -q "targetLaunched = true;" "$SESSION"
          grep -q "targetLaunched = false;" "$SESSION"
          grep -q "activity-reorder-to-front" "$SESSION"
          grep -q "virtualDisplay.setSurface(null)" "$SESSION"
          grep -q "Surface reattach failed" "$SESSION"

          if grep -q "am force-stop" "$SESSION"; then
            echo "ERROR: force-stop still exists."
            exit 1
          fi

          echo "Checking Activity lifecycle..."

          if grep -A18 "public void onStop()" "$ACTIVITY" | grep -q "session.release()"; then
            echo "ERROR: onStop() still releases session."
            exit 1
          fi

          echo "Checking V10-6A controls..."

          grep -q "createFloatingTouchKey" "$ACTIVITY"
          grep -q 'session.recents()' "$ACTIVITY"
          grep -q '"RECENTS"' "$ACTIVITY"
          grep -q '"2 SCREEN"' "$ACTIVITY"
          grep -q '"3 SCREEN"' "$ACTIVITY"

          echo ""
          echo "========================================"
          echo "V10-6A Persistence 1 verification PASS"
          echo "========================================"

      - name: Compile Java
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            compileDebugJavaWithJavac

      - name: Build APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Locate APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print -quit)"

          test -n "$APK"

          echo "APK=$APK"

      - name: Upload Persistence 1 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-6A-Persistence-1
          path: v10-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
