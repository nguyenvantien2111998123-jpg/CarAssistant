
name: Fix chop den 1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout current main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate workflow YAML and frozen voice integration baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          workflow_path = Path(
              ".github/workflows/build-carassistant-voice-flicker-fix-v1.yml"
          )
          baseline_path = Path(
              ".github/workflows/build-carassistant-voice-integration-v1.yml"
          )

          workflow = yaml.load(
              workflow_path.read_text(encoding="utf-8"),
              Loader=yaml.BaseLoader,
          )
          if not isinstance(workflow, dict):
              raise SystemExit("FAIL: workflow YAML root is not a mapping")
          if "workflow_dispatch" not in workflow.get("on", {}):
              raise SystemExit("FAIL: workflow_dispatch trigger missing")
          if "build" not in workflow.get("jobs", {}):
              raise SystemExit("FAIL: build job missing")
          print("PASS: new workflow YAML parsed")

          expected_baseline_sha = "17f1cd02ce35bbbd66699516eab285ca4aea3a1f"
          actual_baseline_sha = subprocess.check_output(
              ["git", "hash-object", str(baseline_path)], text=True
          ).strip()
          if actual_baseline_sha != expected_baseline_sha:
              raise SystemExit(
                  "FAIL-CLOSED: voice integration workflow changed. "
                  f"Expected {expected_baseline_sha}; got {actual_baseline_sha}"
              )
          print("PASS: frozen Voice Integration V1 workflow SHA")
          PY

      - name: Reuse exact Voice Integration V1 patch and checks
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import yaml

          baseline_path = Path(
              ".github/workflows/build-carassistant-voice-integration-v1.yml"
          )
          data = yaml.load(
              baseline_path.read_text(encoding="utf-8"),
              Loader=yaml.BaseLoader,
          )
          steps = data["jobs"]["build"]["steps"]
          matches = [
              step for step in steps
              if step.get("name") == "Verify baseline and patch Voice button"
          ]
          if len(matches) != 1:
              raise SystemExit(
                  "FAIL-CLOSED: expected exactly one frozen voice patch step; "
                  f"found {len(matches)}"
              )

          script = matches[0].get("run", "")
          required = [
              "61e82df0fd17e7851c7bf1628ac03a9391e48523",
              "e6ffd5005ff0d0f8610c5950f20e17acba5410df",
              "4d512337d46324a33a685d8cdb095e4ecacd3ceb",
              "VOICE_SILENCE_STOP_MS = 4000L",
              "Voice recognition and command handlers",
          ]
          for item in required:
              if item not in script:
                  raise SystemExit(
                      f"FAIL-CLOSED: frozen voice patch step lacks {item!r}"
                  )

          Path("/tmp/carassistant-voice-integration-v1.sh").write_text(
              script, encoding="utf-8"
          )
          print("PASS: exact voice integration step extracted")
          PY

          bash /tmp/carassistant-voice-integration-v1.sh

      - name: Apply isolated onResume duplicate-attach guard
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java"
          )
          java = path.read_text(encoding="utf-8")

          old = (
              "        if (target != null) {\n"
              "            launchProjection(target);\n"
              "        }"
          )
          new = (
              "        if (target != null\n"
              "                && !target.equals(activeTarget)) {\n"
              "            launchProjection(target);\n"
              "        }"
          )

          count = java.count(old)
          if count != 1:
              raise SystemExit(
                  "FAIL-CLOSED: onResume anchor must match exactly once; "
                  f"found {count}"
              )

          if "public void onResume()" not in java:
              raise SystemExit("FAIL-CLOSED: onResume method missing")
          if "private void launchProjection(" not in java:
              raise SystemExit("FAIL-CLOSED: launchProjection method missing")

          java = java.replace(old, new, 1)
          path.write_text(java, encoding="utf-8")
          print("PASS: added same-target guard to onResume only")
          PY

      - name: Verify integrated voice and flicker patch
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          root = Path("v10-source/app/src/main")
          java_path = root / "java/com/carassistant/v10/V10CarActivity.java"
          manifest_path = root / "AndroidManifest.xml"
          gradle_path = Path("v10-source/app/build.gradle")

          java = java_path.read_text(encoding="utf-8")
          manifest_text = manifest_path.read_text(encoding="utf-8")
          gradle = gradle_path.read_text(encoding="utf-8")
          ET.parse(manifest_path)

          required = [
              "private void startVoiceRecognition()",
              "private void processVoiceCommand(String spoken)",
              "private void launchVoiceTarget(String target)",
              "voice.setOnClickListener(v -> startVoiceRecognition())",
              "VOICE_SILENCE_STOP_MS = 4000L",
              'EXTRA_LANGUAGE, "vi-VN"',
              "processVoiceCommand(matches.get(0))",
              "!target.equals(activeTarget)",
              "android.permission.RECORD_AUDIO",
              "org.maplibre.gl:android-sdk:11.11.0",
          ]
          for item in required:
              if item in java or item in manifest_text or item in gradle:
                  print(f"PASS: {item}")
              else:
                  raise SystemExit(f"FAIL: required marker missing: {item}")

          if java.count("private void startVoiceRecognition()") != 1:
              raise SystemExit("FAIL: startVoiceRecognition count is not one")
          if java.count("private void processVoiceCommand(String spoken)") != 1:
              raise SystemExit("FAIL: processVoiceCommand count is not one")
          if java.count("private void launchVoiceTarget(String target)") != 1:
              raise SystemExit("FAIL: launchVoiceTarget count is not one")
          if java.count("VOICE_SILENCE_STOP_MS = 4000L") != 1:
              raise SystemExit("FAIL: voice timeout changed or duplicated")
          if java.count("voice.setOnClickListener(v -> startVoiceRecognition())") != 1:
              raise SystemExit("FAIL: Voice button handler count is not one")
          if "requestPermissions(" in java or "onRequestPermissionsResult(" in java:
              raise SystemExit("FAIL: unsupported runtime permission flow found")
          if "EXTRA_PREFER_OFFLINE" in java:
              raise SystemExit("FAIL: unexpected offline-only recognition flag")

          guard = re.compile(
              r"if\s*\(\s*target\s*!=\s*null\s*"
              r"&&\s*!target\.equals\(\s*activeTarget\s*\)\s*\)\s*\{\s*"
              r"launchProjection\(\s*target\s*\);\s*\}"
          )
          if len(guard.findall(java)) < 2:
              raise SystemExit(
                  "FAIL: expected target guards in onResume and targetPoller"
              )

          resume_start = java.find("public void onResume()")
          build_ui_start = java.find("private void buildUi()", resume_start)
          resume_body = java[resume_start:build_ui_start]
          if not guard.search(resume_body):
              raise SystemExit("FAIL: guarded launch not found inside onResume")

          print("PASS: integrated Java anchors and onResume guard")
          print("PASS: Manifest XML parse")
          PY

      - name: Java compile verification
        shell: bash
        run: |
          set -euo pipefail
          cd v10-source
          gradle --no-daemon --stacktrace compileDebugJavaWithJavac

      - name: Build CarAssistant debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd v10-source
          gradle --no-daemon --stacktrace assembleDebug

      - name: Package APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/CarAssistant-Voice-Flicker-Fix-V1.apk
          sha256sum dist/CarAssistant-Voice-Flicker-Fix-V1.apk \
            > dist/CarAssistant-Voice-Flicker-Fix-V1.sha256
          cat dist/CarAssistant-Voice-Flicker-Fix-V1.sha256

      - name: Upload Voice Flicker Fix V1 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-Voice-Flicker-Fix-V1
          path: |
            dist/CarAssistant-Voice-Flicker-Fix-V1.apk
            dist/CarAssistant-Voice-Flicker-Fix-V1.sha256
          if-no-files-found: error
