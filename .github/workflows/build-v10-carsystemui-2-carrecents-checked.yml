name: Build Car Assistant V10 CarSystemUI 2 - CarRecents (Marker Fix)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check V10 source
        shell: bash
        run: |
          set -euo pipefail

          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/RootShellSession.java

          echo "V10 source files: OK"

      - name: Create CarSystemUI
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/CarSystemUI.java"

          cat > "$FILE" <<'EOF'
          package com.carassistant.v10;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.os.SystemClock;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewConfiguration;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public final class CarSystemUI {

              public interface Callback {
                  void onBack();
                  void onHome();
                  void onRecents();
              }

              private static final String PREFS = "v10_car_system_ui";
              private static final String KEY_X = "key_x";
              private static final String KEY_Y = "key_y";

              private static final int KEY_SIZE_DP = 52;
              private static final int MENU_WIDTH_DP = 190;
              private static final int MENU_BUTTON_HEIGHT_DP = 52;

              private final Context context;
              private final FrameLayout host;
              private final Callback callback;
              private final SharedPreferences prefs;
              private final int touchSlop;

              private View floatingKey;
              private LinearLayout menu;

              private float downRawX;
              private float downRawY;
              private int startX;
              private int startY;
              private long lastTapTime;

              public CarSystemUI(
                      Context context,
                      FrameLayout host,
                      Callback callback) {
                  this.context = context;
                  this.host = host;
                  this.callback = callback;
                  this.prefs = context.getSharedPreferences(
                          PREFS,
                          Context.MODE_PRIVATE);
                  this.touchSlop =
                          ViewConfiguration.get(context).getScaledTouchSlop();
              }

              public void attach() {
                  if (floatingKey != null) {
                      return;
                  }

                  TextView key = new TextView(context);
                  floatingKey = key;

                  key.setText("≡");
                  key.setTextColor(Color.WHITE);
                  key.setTextSize(24f);
                  key.setGravity(Gravity.CENTER);
                  key.setBackground(
                          background(
                                  Color.argb(225, 25, 25, 25),
                                  26));

                  FrameLayout.LayoutParams lp =
                          new FrameLayout.LayoutParams(
                                  dp(KEY_SIZE_DP),
                                  dp(KEY_SIZE_DP));

                  lp.gravity =
                          Gravity.TOP | Gravity.START;

                  lp.leftMargin =
                          prefs.getInt(KEY_X, dp(18));

                  lp.topMargin =
                          prefs.getInt(KEY_Y, dp(18));

                  host.addView(key, lp);

                  key.setOnTouchListener((view, event) -> {
                      FrameLayout.LayoutParams p =
                              (FrameLayout.LayoutParams)
                                      view.getLayoutParams();

                      switch (event.getActionMasked()) {
                          case MotionEvent.ACTION_DOWN:
                              downRawX = event.getRawX();
                              downRawY = event.getRawY();
                              startX = p.leftMargin;
                              startY = p.topMargin;
                              return true;

                          case MotionEvent.ACTION_MOVE:
                              float dx =
                                      event.getRawX() - downRawX;
                              float dy =
                                      event.getRawY() - downRawY;

                              if (Math.abs(dx) > touchSlop
                                      || Math.abs(dy) > touchSlop) {

                                  p.leftMargin =
                                          (int) (startX + dx);

                                  p.topMargin =
                                          (int) (startY + dy);

                                  clampPosition(p);
                                  view.setLayoutParams(p);
                              }

                              return true;

                          case MotionEvent.ACTION_UP:
                              float upDx =
                                      event.getRawX() - downRawX;
                              float upDy =
                                      event.getRawY() - downRawY;

                              if (Math.abs(upDx) <= touchSlop
                                      && Math.abs(upDy) <= touchSlop) {
                                  handleTap();
                              } else {
                                  savePosition(p);
                              }

                              return true;

                          default:
                              return true;
                      }
                  });
              }

              public void detach() {
                  hideMenu();

                  if (floatingKey != null) {
                      host.removeView(floatingKey);
                      floatingKey = null;
                  }
              }

              private void handleTap() {
                  long now =
                          SystemClock.uptimeMillis();

                  if (now - lastTapTime < 350L) {
                      lastTapTime = 0L;
                      hideMenu();

                      if (callback != null) {
                          callback.onHome();
                      }

                      return;
                  }

                  lastTapTime = now;
                  showMenu();
              }

              private void showMenu() {
                  if (menu != null) {
                      hideMenu();
                      return;
                  }

                  menu = new LinearLayout(context);
                  menu.setOrientation(
                          LinearLayout.VERTICAL);

                  menu.setPadding(
                          dp(8),
                          dp(8),
                          dp(8),
                          dp(8));

                  menu.setBackground(
                          background(
                                  Color.argb(
                                          240,
                                          25,
                                          25,
                                          25),
                                  18));

                  FrameLayout.LayoutParams lp =
                          new FrameLayout.LayoutParams(
                                  dp(MENU_WIDTH_DP),
                                  ViewGroup.LayoutParams.WRAP_CONTENT);

                  lp.gravity =
                          Gravity.TOP | Gravity.START;

                  FrameLayout.LayoutParams keyLp =
                          (FrameLayout.LayoutParams)
                                  floatingKey.getLayoutParams();

                  lp.leftMargin =
                          Math.max(
                                  0,
                                  keyLp.leftMargin - dp(10));

                  lp.topMargin =
                          Math.max(
                                  0,
                                  keyLp.topMargin
                                          + dp(KEY_SIZE_DP)
                                          + dp(8));

                  host.addView(menu, lp);

                  addMenuButton(
                          "BACK",
                          () -> {
                              hideMenu();

                              if (callback != null) {
                                  callback.onBack();
                              }
                          });

                  addMenuButton(
                          "RECENTS",
                          () -> {
                              hideMenu();

                              if (callback != null) {
                                  callback.onRecents();
                              }
                          });
              }

              private void addMenuButton(
                      String label,
                      final Runnable action) {

                  TextView button =
                          new TextView(context);

                  button.setText(label);
                  button.setTextColor(Color.WHITE);
                  button.setTextSize(16f);
                  button.setGravity(Gravity.CENTER);

                  button.setBackground(
                          background(
                                  Color.argb(
                                          60,
                                          255,
                                          255,
                                          255),
                                  12));

                  LinearLayout.LayoutParams lp =
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(MENU_BUTTON_HEIGHT_DP));

                  lp.bottomMargin = dp(6);

                  menu.addView(button, lp);

                  button.setOnClickListener(
                          v -> action.run());
              }

              private void hideMenu() {
                  if (menu != null) {
                      host.removeView(menu);
                      menu = null;
                  }
              }

              private void clampPosition(
                      FrameLayout.LayoutParams lp) {

                  int width = host.getWidth();
                  int height = host.getHeight();
                  int size = dp(KEY_SIZE_DP);

                  if (width > 0) {
                      lp.leftMargin =
                              Math.max(
                                      0,
                                      Math.min(
                                              lp.leftMargin,
                                              width - size));
                  }

                  if (height > 0) {
                      lp.topMargin =
                              Math.max(
                                      0,
                                      Math.min(
                                              lp.topMargin,
                                              height - size));
                  }
              }

              private void savePosition(
                      FrameLayout.LayoutParams lp) {

                  prefs.edit()
                          .putInt(
                                  KEY_X,
                                  lp.leftMargin)
                          .putInt(
                                  KEY_Y,
                                  lp.topMargin)
                          .apply();
              }

              private GradientDrawable background(
                      int color,
                      int radiusDp) {

                  GradientDrawable bg =
                          new GradientDrawable();

                  bg.setColor(color);
                  bg.setCornerRadius(dp(radiusDp));

                  return bg;
              }

              private int dp(int value) {
                  return Math.round(
                          value * context
                                  .getResources()
                                  .getDisplayMetrics()
                                  .density);
              }
          }
          EOF

          test -f "$FILE"
          grep -q "class CarSystemUI" "$FILE"

          echo "CarSystemUI: OK"

      - name: Create CarRecents
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/CarRecents.java"

          cat > "$FILE" <<'EOF'
          package com.carassistant.v10;

          import android.content.ComponentName;
          import android.content.Context;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.util.ArrayList;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public final class CarRecents {

              public interface Callback {
                  void onTaskSelected(ComponentName component);
                  void onClose();
              }

              private static final Pattern TASK_ID =
                      Pattern.compile("#(\\d+)");

              private static final Pattern DISPLAY_ID =
                      Pattern.compile("displayId[=:](\\d+)");

              private static final Pattern REAL_ACTIVITY =
                      Pattern.compile(
                              "realActivity=ComponentInfo\\{([^/}]+)/([^}]+)\\}");

              private final Context context;
              private final FrameLayout host;
              private final RootShellSession shell;
              private final int displayId;
              private final String ownPackage;
              private final Callback callback;

              private LinearLayout panel;
              private TextView status;

              public CarRecents(
                      Context context,
                      FrameLayout host,
                      RootShellSession shell,
                      int displayId,
                      String ownPackage,
                      Callback callback) {

                  this.context = context;
                  this.host = host;
                  this.shell = shell;
                  this.displayId = displayId;
                  this.ownPackage = ownPackage;
                  this.callback = callback;
              }

              public void show() {
                  if (panel != null) {
                      return;
                  }

                  panel = new LinearLayout(context);
                  panel.setOrientation(
                          LinearLayout.VERTICAL);

                  panel.setPadding(
                          dp(16),
                          dp(12),
                          dp(16),
                          dp(12));

                  panel.setBackgroundColor(
                          Color.rgb(7, 9, 12));

                  LinearLayout header =
                          new LinearLayout(context);

                  header.setGravity(
                          Gravity.CENTER_VERTICAL);

                  TextView close =
                          button("CLOSE");

                  close.setOnClickListener(v -> {
                      hide();

                      if (callback != null) {
                          callback.onClose();
                      }
                  });

                  header.addView(
                          close,
                          new LinearLayout.LayoutParams(
                                  dp(95),
                                  dp(54)));

                  TextView title =
                          text(
                                  "RECENT APPS",
                                  21,
                                  Color.WHITE);

                  title.setGravity(Gravity.CENTER);

                  header.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(54),
                                  1f));

                  panel.addView(header);

                  status =
                          text(
                                  "Loading…",
                                  14,
                                  Color.LTGRAY);

                  status.setGravity(Gravity.CENTER);

                  panel.addView(
                          status,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(42)));

                  ScrollView scroll =
                          new ScrollView(context);

                  LinearLayout list =
                          new LinearLayout(context);

                  list.setOrientation(
                          LinearLayout.VERTICAL);

                  scroll.addView(list);

                  panel.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1f));

                  host.addView(
                          panel,
                          new FrameLayout.LayoutParams(
                                  -1,
                                  -1));

                  load(list);
              }

              public void destroy() {
                  hide();
                  shell.destroy();
              }

              public void hide() {
                  if (panel != null) {
                      host.removeView(panel);
                      panel = null;
                      status = null;
                  }
              }

              private void load(LinearLayout list) {
                  final String command =
                          "/system/bin/dumpsys activity recents"
                                  + " | /system/bin/grep -E"
                                  + " 'Task\\{|displayId[=:]|realActivity='";

                  RootShellSession.EXEC.execute(() -> {
                      try {
                          String output =
                                  shell.run(
                                          5,
                                          command);

                          List<RecentTask> tasks =
                                  parse(output);

                          host.post(
                                  () -> populate(
                                          list,
                                          tasks));

                      } catch (Throwable t) {
                          host.post(
                                  () -> showError(list));
                      }
                  });
              }

              private void populate(
                      LinearLayout list,
                      List<RecentTask> tasks) {

                  list.removeAllViews();

                  if (tasks.isEmpty()) {
                      status.setText(
                              "No recent task on this display");
                      return;
                  }

                  status.setText(
                          tasks.size()
                                  + " task(s)");

                  for (RecentTask task : tasks) {

                      TextView item =
                              button(task.label);

                      item.setTextSize(16f);
                      item.setGravity(
                              Gravity.CENTER_VERTICAL);

                      LinearLayout.LayoutParams lp =
                              new LinearLayout.LayoutParams(
                                      -1,
                                      dp(66));

                      lp.bottomMargin = dp(8);

                      list.addView(item, lp);

                      item.setOnClickListener(
                              v -> select(task));
                  }
              }

              private void showError(
                      LinearLayout list) {

                  list.removeAllViews();

                  status.setText(
                          "Unable to read recent tasks");
              }

              private void select(
                      RecentTask task) {

                  hide();

                  final String command =
                          "/system/bin/am task "
                                  + task.taskId
                                  + " front";

                  RootShellSession.EXEC.execute(() -> {
                      try {
                          shell.run(
                                  5,
                                  command);
                      } catch (Throwable ignored) {
                      }

                      host.post(() -> {
                          if (callback != null) {
                              callback.onTaskSelected(
                                      task.component);
                          }
                      });
                  });
              }

              private List<RecentTask> parse(
                      String output) {

                  LinkedHashMap<Integer, RecentTask> result =
                          new LinkedHashMap<>();

                  int currentTaskId = -1;
                  boolean currentDisplayMatches = false;
                  ComponentName currentComponent = null;

                  String[] lines =
                          output == null
                                  ? new String[0]
                                  : output.split("\\n");

                  for (String line : lines) {

                      Matcher taskMatcher =
                              TASK_ID.matcher(line);

                      if (line.contains("Task{")
                              && taskMatcher.find()) {

                          currentTaskId =
                                  Integer.parseInt(
                                          taskMatcher.group(1));

                          currentDisplayMatches = false;
                          currentComponent = null;

                          Matcher displayMatcher =
                                  DISPLAY_ID.matcher(line);

                          if (displayMatcher.find()) {
                              currentDisplayMatches =
                                      Integer.parseInt(
                                              displayMatcher.group(1))
                                              == displayId;
                          }

                          continue;
                      }

                      if (currentTaskId < 0) {
                          continue;
                      }

                      Matcher displayMatcher =
                              DISPLAY_ID.matcher(line);

                      if (displayMatcher.find()) {
                          currentDisplayMatches =
                                  Integer.parseInt(
                                          displayMatcher.group(1))
                                          == displayId;
                      }

                      Matcher activityMatcher =
                              REAL_ACTIVITY.matcher(line);

                      if (activityMatcher.find()) {
                          currentComponent =
                                  new ComponentName(
                                          activityMatcher.group(1),
                                          activityMatcher.group(2));
                      }

                      if (currentDisplayMatches
                              && currentComponent != null
                              && !ownPackage.equals(
                                      currentComponent.getPackageName())
                              && !result.containsKey(
                                      currentTaskId)) {

                          result.put(
                                  currentTaskId,
                                  new RecentTask(
                                          currentTaskId,
                                          currentComponent));
                      }
                  }

                  return new ArrayList<>(
                          result.values());
              }

              private static final class RecentTask {

                  final int taskId;
                  final ComponentName component;
                  final String label;

                  RecentTask(
                          int taskId,
                          ComponentName component) {

                      this.taskId = taskId;
                      this.component = component;

                      this.label =
                              component.getPackageName()
                                      + "\nTask #"
                                      + taskId;
                  }
              }

              private TextView button(
                      String value) {

                  TextView view =
                          text(
                                  value,
                                  16,
                                  Color.WHITE);

                  view.setGravity(Gravity.CENTER);

                  GradientDrawable bg =
                          new GradientDrawable();

                  bg.setColor(
                          Color.rgb(22, 27, 33));

                  bg.setCornerRadius(
                          dp(14));

                  view.setBackground(bg);

                  return view;
              }

              private TextView text(
                      String value,
                      int size,
                      int color) {

                  TextView view =
                          new TextView(context);

                  view.setText(value);
                  view.setTextSize(size);
                  view.setTextColor(color);

                  return view;
              }

              private int dp(int value) {
                  return Math.round(
                          value
                                  * context
                                          .getResources()
                                          .getDisplayMetrics()
                                          .density);
              }
          }
          EOF

          test -f "$FILE"
          grep -q "class CarRecents" "$FILE"
          grep -q "dumpsys activity recents" "$FILE"
          grep -q "/system/bin/am task" "$FILE"
          grep -q "displayId" "$FILE"

          echo "CarRecents: OK"

      - name: Patch V10ProjectionSession
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/"
              "V10ProjectionSession.java"
          )

          s = path.read_text()

          if s.count("public int getDisplayId()") == 0:
              marker = "    public boolean isActive() {"

              if s.count(marker) != 1:
                  raise SystemExit(
                      "ERROR: isActive() marker count is not exactly 1"
                  )

              method = """    public int getDisplayId() {
                  return display == null ? -1 : display.getDisplayId();
              }

          """

              s = s.replace(
                  marker,
                  method + marker,
                  1,
              )

          if s.count("public int getDisplayId()") != 1:
              raise SystemExit(
                  "ERROR: getDisplayId() count is not exactly 1"
              )

          path.write_text(s)

          print("V10ProjectionSession patch: OK")
          PY

      - name: Patch V10CarActivity
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/"
              "V10CarActivity.java"
          )

          s = path.read_text()

          # ------------------------------------------------------------
          # 1. Fields
          # ------------------------------------------------------------

          if "private CarSystemUI carSystemUI;" not in s:
              marker = "private V10ProjectionSession session;"

              if s.count(marker) != 1:
                  raise SystemExit(
                      "ERROR: session field marker count is not exactly 1"
                  )

              s = s.replace(
                  marker,
                  marker
                  + "\n    private CarSystemUI carSystemUI;"
                  + "\n    private CarRecents carRecents;",
                  1,
              )

          if s.count("private CarSystemUI carSystemUI;") != 1:
              raise SystemExit(
                  "ERROR: CarSystemUI field count is not exactly 1"
              )

          if s.count("private CarRecents carRecents;") != 1:
              raise SystemExit(
                  "ERROR: CarRecents field count is not exactly 1"
              )

          # ------------------------------------------------------------
          # 2. Touch listener + CarSystemUI injection
          # ------------------------------------------------------------

          if "new CarSystemUI(" not in s:

              pattern = re.compile(
                  r"(?m)^(?P<i>[ \t]*)textureView\s*\n"
                  r"[ \t]*\.setOnTouchListener\(\s*\n"
                  r"[ \t]*inputController\s*\n"
                  r"[ \t]*\.createListener\(\)\s*\);"
              )

              matches = list(pattern.finditer(s))

              if len(matches) != 1:
                  raise SystemExit(
                      "ERROR: expected exactly 1 textureView "
                      "multiline touch-listener block, found "
                      f"{len(matches)}"
                  )

              m = matches[0]
              indent = m.group("i")

              lines = [
                  f"{indent}textureView",
                  f"{indent}        .setOnTouchListener(",
                  f"{indent}                inputController",
                  f"{indent}                        .createListener());",
                  "",
                  f"{indent}carSystemUI = new CarSystemUI(",
                  f"{indent}        this,",
                  f"{indent}        projectionLayer,",
                  f"{indent}        new CarSystemUI.Callback() {{",
                  f"{indent}            @Override",
                  f"{indent}            public void onBack() {{",
                  f"{indent}                handleControlBack();",
                  f"{indent}            }}",
                  "",
                  f"{indent}            @Override",
                  f"{indent}            public void onHome() {{",
                  f"{indent}                handleControlHome();",
                  f"{indent}            }}",
                  "",
                  f"{indent}            @Override",
                  f"{indent}            public void onRecents() {{",
                  f"{indent}                showCarRecents();",
                  f"{indent}            }}",
                  f"{indent}        }});",
                  "",
                  f"{indent}carSystemUI.attach();",
              ]

              replacement = "\n".join(lines)

              s = (
                  s[:m.start()]
                  + replacement
                  + s[m.end():]
              )

          # ------------------------------------------------------------
          # 3. showCarRecents()
          # ------------------------------------------------------------

          show_count = s.count(
              "private void showCarRecents()"
          )

          if show_count == 0:

              # IMPORTANT:
              # Do not assume four spaces.
              # Match private void launchProjection at column 1
              # or with arbitrary indentation and blank lines.
              pattern = re.compile(
                  r"(?m)^[ \t]*private\s+void\s+"
                  r"launchProjection\s*\(\s*"
              )

              matches = list(
                  pattern.finditer(s)
              )

              if len(matches) != 1:
                  raise SystemExit(
                      "ERROR: expected exactly 1 "
                      "launchProjection declaration, found "
                      f"{len(matches)}"
                  )

              match = matches[0]

              method = """    private void showCarRecents() {
                  if (session == null || !session.isActive()) {
                      return;
                  }

                  if (carRecents != null) {
                      carRecents.hide();
                      carRecents = null;
                      return;
                  }

                  carRecents = new CarRecents(
                          this,
                          projectionLayer,
                          new RootShellSession(),
                          session.getDisplayId(),
                          getPackageName(),
                          new CarRecents.Callback() {
                              @Override
                              public void onTaskSelected(
                                      ComponentName component) {
                                  if (carRecents != null) {
                                      carRecents.destroy();
                                      carRecents = null;
                                  }
                              }

                              @Override
                              public void onClose() {
                                  if (carRecents != null) {
                                      carRecents.destroy();
                                      carRecents = null;
                                  }
                              }
                          });

                  carRecents.show();
              }

          """

              s = (
                  s[:match.start()]
                  + method
                  + s[match.start():]
              )

          elif show_count != 1:
              raise SystemExit(
                  "ERROR: showCarRecents() appears more than once"
              )

          # ------------------------------------------------------------
          # 4. onDestroy cleanup
          # ------------------------------------------------------------

          if "carRecents.hide();" not in s or \
             "carSystemUI.detach();" not in s:

              on_destroy_pattern = re.compile(
                  r"(?m)^[ \t]*@Override\s*\n"
                  r"[ \t]*(?:protected|public)\s+void\s+"
                  r"onDestroy\s*\(\s*\)\s*\{"
              )

              matches = list(
                  on_destroy_pattern.finditer(s)
              )

              if len(matches) != 1:
                  raise SystemExit(
                      "ERROR: expected exactly 1 onDestroy() declaration, "
                      f"found {len(matches)}"
                  )

              on_destroy = matches[0]

              super_pos = s.find(
                  "super.onDestroy();",
                  on_destroy.end()
              )

              if super_pos < 0:
                  raise SystemExit(
                      "ERROR: super.onDestroy() not found"
                  )

              cleanup = """        if (carRecents != null) {
                      carRecents.hide();
                      carRecents = null;
                  }

                  if (carSystemUI != null) {
                      carSystemUI.detach();
                      carSystemUI = null;
                  }

          """

              s = (
                  s[:super_pos]
                  + cleanup
                  + s[super_pos:]
              )

          # ------------------------------------------------------------
          # 5. Final source-level assertions
          # ------------------------------------------------------------

          checks = {
              "CarSystemUI field":
                  s.count("private CarSystemUI carSystemUI;") == 1,

              "CarRecents field":
                  s.count("private CarRecents carRecents;") == 1,

              "CarSystemUI creation":
                  s.count("new CarSystemUI(") == 1,

              "CarSystemUI attach":
                  s.count("carSystemUI.attach();") == 1,

              "CarRecents creation":
                  s.count("new CarRecents(") == 1,

              "showCarRecents declaration":
                  s.count("private void showCarRecents()") == 1,

              "launchProjection declaration":
                  len(list(re.finditer(
                      r"(?m)^[ \t]*private\s+void\s+"
                      r"launchProjection\s*\(\s*",
                      s
                  ))) == 1,

              "showCarRecents call":
                  s.count("showCarRecents();") == 1,

              "CarSystemUI detach":
                  s.count("carSystemUI.detach();") == 1,

              "CarRecents hide":
                  s.count("carRecents.hide();") >= 1,
          }

          failed = [
              name
              for name, ok in checks.items()
              if not ok
          ]

          if failed:
              raise SystemExit(
                  "ERROR: source verification failed:\n"
                  + "\n".join(
                      f" - {name}"
                      for name in failed
                  )
              )

          path.write_text(s)

          print("V10CarActivity patch: OK")
          PY

      - name: Verify patched source
        shell: bash
        run: |
          set -euo pipefail

          ACT="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          PROJ="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
          CAR="v10-source/app/src/main/java/com/hieptran/aacast/doudou/CarRecents.java"
          UI="v10-source/app/src/main/java/com/hieptran/aacast/doudou/CarSystemUI.java"

          echo "===== V10CarActivity markers ====="
          grep -nE \
            "CarSystemUI|CarRecents|showCarRecents|launchProjection|onDestroy" \
            "$ACT"

          echo "===== V10ProjectionSession ====="
          grep -nE "getDisplayId|isActive" "$PROJ"

          echo "===== CarSystemUI ====="
          grep -nE "class CarSystemUI|setOnTouchListener|onRecents" "$UI"

          echo "===== CarRecents ====="
          grep -nE \
            "class CarRecents|dumpsys activity recents|am task|displayId" \
            "$CAR"

          test "$(grep -c "private CarSystemUI carSystemUI;" "$ACT")" -eq 1
          test "$(grep -c "private CarRecents carRecents;" "$ACT")" -eq 1
          test "$(grep -c "new CarSystemUI(" "$ACT")" -eq 1
          test "$(grep -c "new CarRecents(" "$ACT")" -eq 1
          test "$(grep -c "private void showCarRecents()" "$ACT")" -eq 1
          test "$(grep -c "public int getDisplayId()" "$PROJ")" -eq 1
          test "$(grep -c "carSystemUI.attach();" "$ACT")" -eq 1
          test "$(grep -c "carSystemUI.detach();" "$ACT")" -eq 1

          if grep -nE \
              "KEYCODE_APP_SWITCH|input keyevent 187" \
              "$ACT" "$CAR"; then
            echo "ERROR: global APP_SWITCH mechanism detected."
            exit 1
          fi

          echo
          echo "========================================"
          echo "PATCH VERIFICATION PASSED"
          echo "========================================"

      - name: Compile Java
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace

      - name: Build APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Locate APK and SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK=$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-CarSystemUI-2-CarRecents-Marker-Fix
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
