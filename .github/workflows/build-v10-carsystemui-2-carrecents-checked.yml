name: Build Car Assistant V10 CarSystemUI 2 - CarRecents
true:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Check V10 source
      shell: bash
      run: 'set -euo pipefail

        test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

        test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java

        test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/RootShellSession.java

        '
    - name: Create CarSystemUI
      shell: bash
      run: "set -euo pipefail\nFILE=\"v10-source/app/src/main/java/com/hieptran/aacast/doudou/CarSystemUI.java\"\ncat > \"\
        $FILE\" <<'EOF'\npackage com.carassistant.v10;\n\nimport android.content.Context;\nimport android.content.SharedPreferences;\n\
        import android.graphics.Color;\nimport android.graphics.drawable.GradientDrawable;\nimport android.os.SystemClock;\n\
        import android.view.Gravity;\nimport android.view.MotionEvent;\nimport android.view.View;\nimport android.view.ViewConfiguration;\n\
        import android.view.ViewGroup;\nimport android.widget.FrameLayout;\nimport android.widget.LinearLayout;\nimport android.widget.TextView;\n\
        \npublic final class CarSystemUI {\n    public interface Callback {\n        void onBack();\n        void onHome();\n\
        \        void onRecents();\n    }\n\n    private static final String PREFS = \"v10_car_system_ui\";\n    private static\
        \ final String KEY_X = \"key_x\";\n    private static final String KEY_Y = \"key_y\";\n    private static final int\
        \ KEY_SIZE_DP = 52;\n    private static final int MENU_WIDTH_DP = 190;\n    private static final int MENU_BUTTON_HEIGHT_DP\
        \ = 52;\n\n    private final Context context;\n    private final FrameLayout host;\n    private final Callback callback;\n\
        \    private final SharedPreferences prefs;\n    private final int touchSlop;\n\n    private View floatingKey;\n \
        \   private LinearLayout menu;\n    private float downRawX;\n    private float downRawY;\n    private int startX;\n\
        \    private int startY;\n    private long lastTapTime;\n\n    public CarSystemUI(Context context, FrameLayout host,\
        \ Callback callback) {\n        this.context = context;\n        this.host = host;\n        this.callback = callback;\n\
        \        this.prefs = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE);\n        this.touchSlop = ViewConfiguration.get(context).getScaledTouchSlop();\n\
        \    }\n\n    public void attach() {\n        if (floatingKey != null) return;\n\n        TextView key = new TextView(context);\n\
        \        floatingKey = key;\n        key.setText(\"≡\");\n        key.setTextColor(Color.WHITE);\n        key.setTextSize(24f);\n\
        \        key.setGravity(Gravity.CENTER);\n        key.setBackground(background(Color.argb(225, 25, 25, 25), 26));\n\
        \n        FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(\n                dp(KEY_SIZE_DP), dp(KEY_SIZE_DP));\n\
        \        lp.gravity = Gravity.TOP | Gravity.START;\n        lp.leftMargin = prefs.getInt(KEY_X, dp(18));\n       \
        \ lp.topMargin = prefs.getInt(KEY_Y, dp(18));\n        host.addView(key, lp);\n\n        key.setOnTouchListener((view,\
        \ event) -> {\n            FrameLayout.LayoutParams p =\n                    (FrameLayout.LayoutParams) view.getLayoutParams();\n\
        \n            switch (event.getActionMasked()) {\n                case MotionEvent.ACTION_DOWN:\n                \
        \    downRawX = event.getRawX();\n                    downRawY = event.getRawY();\n                    startX = p.leftMargin;\n\
        \                    startY = p.topMargin;\n                    return true;\n\n                case MotionEvent.ACTION_MOVE:\n\
        \                    float dx = event.getRawX() - downRawX;\n                    float dy = event.getRawY() - downRawY;\n\
        \                    if (Math.abs(dx) > touchSlop || Math.abs(dy) > touchSlop) {\n                        p.leftMargin\
        \ = (int) (startX + dx);\n                        p.topMargin = (int) (startY + dy);\n                        clampPosition(p);\n\
        \                        view.setLayoutParams(p);\n                    }\n                    return true;\n\n   \
        \             case MotionEvent.ACTION_UP:\n                    float upDx = event.getRawX() - downRawX;\n        \
        \            float upDy = event.getRawY() - downRawY;\n                    if (Math.abs(upDx) <= touchSlop && Math.abs(upDy)\
        \ <= touchSlop) {\n                        handleTap();\n                    } else {\n                        savePosition(p);\n\
        \                    }\n                    return true;\n\n                default:\n                    return true;\n\
        \            }\n        });\n    }\n\n    public void detach() {\n        hideMenu();\n        if (floatingKey !=\
        \ null) {\n            host.removeView(floatingKey);\n            floatingKey = null;\n        }\n    }\n\n    private\
        \ void handleTap() {\n        long now = SystemClock.uptimeMillis();\n        if (now - lastTapTime < 350L) {\n  \
        \          lastTapTime = 0L;\n            hideMenu();\n            if (callback != null) callback.onHome();\n    \
        \        return;\n        }\n        lastTapTime = now;\n        showMenu();\n    }\n\n    private void showMenu()\
        \ {\n        if (menu != null) {\n            hideMenu();\n            return;\n        }\n\n        menu = new LinearLayout(context);\n\
        \        menu.setOrientation(LinearLayout.VERTICAL);\n        menu.setPadding(dp(8), dp(8), dp(8), dp(8));\n     \
        \   menu.setBackground(background(Color.argb(240, 25, 25, 25), 18));\n\n        FrameLayout.LayoutParams lp = new\
        \ FrameLayout.LayoutParams(\n                dp(MENU_WIDTH_DP), ViewGroup.LayoutParams.WRAP_CONTENT);\n        lp.gravity\
        \ = Gravity.TOP | Gravity.START;\n\n        FrameLayout.LayoutParams keyLp =\n                (FrameLayout.LayoutParams)\
        \ floatingKey.getLayoutParams();\n        lp.leftMargin = Math.max(0, keyLp.leftMargin - dp(10));\n        lp.topMargin\
        \ = Math.max(\n                0, keyLp.topMargin + dp(KEY_SIZE_DP) + dp(8));\n\n        host.addView(menu, lp);\n\
        \n        addMenuButton(\"BACK\", () -> {\n            hideMenu();\n            if (callback != null) callback.onBack();\n\
        \        });\n\n        addMenuButton(\"RECENTS\", () -> {\n            hideMenu();\n            if (callback != null)\
        \ callback.onRecents();\n        });\n    }\n\n    private void addMenuButton(String label, final Runnable action)\
        \ {\n        TextView button = new TextView(context);\n        button.setText(label);\n        button.setTextColor(Color.WHITE);\n\
        \        button.setTextSize(16f);\n        button.setGravity(Gravity.CENTER);\n        button.setBackground(background(Color.argb(60,\
        \ 255, 255, 255), 12));\n\n        LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(\n               \
        \ ViewGroup.LayoutParams.MATCH_PARENT, dp(MENU_BUTTON_HEIGHT_DP));\n        lp.bottomMargin = dp(6);\n        menu.addView(button,\
        \ lp);\n        button.setOnClickListener(v -> action.run());\n    }\n\n    private void hideMenu() {\n        if\
        \ (menu != null) {\n            host.removeView(menu);\n            menu = null;\n        }\n    }\n\n    private\
        \ void clampPosition(FrameLayout.LayoutParams lp) {\n        int width = host.getWidth();\n        int height = host.getHeight();\n\
        \        int size = dp(KEY_SIZE_DP);\n\n        if (width > 0) {\n            lp.leftMargin = Math.max(0, Math.min(lp.leftMargin,\
        \ width - size));\n        }\n        if (height > 0) {\n            lp.topMargin = Math.max(0, Math.min(lp.topMargin,\
        \ height - size));\n        }\n    }\n\n    private void savePosition(FrameLayout.LayoutParams lp) {\n        prefs.edit()\n\
        \                .putInt(KEY_X, lp.leftMargin)\n                .putInt(KEY_Y, lp.topMargin)\n                .apply();\n\
        \    }\n\n    private GradientDrawable background(int color, int radiusDp) {\n        GradientDrawable bg = new GradientDrawable();\n\
        \        bg.setColor(color);\n        bg.setCornerRadius(dp(radiusDp));\n        return bg;\n    }\n\n    private\
        \ int dp(int value) {\n        return Math.round(value * context.getResources()\n                .getDisplayMetrics().density);\n\
        \    }\n}\nEOF\n"
    - name: Create CarRecents
      shell: bash
      run: "set -euo pipefail\nFILE=\"v10-source/app/src/main/java/com/hieptran/aacast/doudou/CarRecents.java\"\ncat > \"\
        $FILE\" <<'EOF'\npackage com.carassistant.v10;\n\nimport android.content.ComponentName;\nimport android.content.Context;\n\
        import android.graphics.Color;\nimport android.graphics.drawable.GradientDrawable;\nimport android.view.Gravity;\n\
        import android.widget.FrameLayout;\nimport android.widget.LinearLayout;\nimport android.widget.ScrollView;\nimport\
        \ android.widget.TextView;\n\nimport java.util.ArrayList;\nimport java.util.LinkedHashMap;\nimport java.util.List;\n\
        import java.util.regex.Matcher;\nimport java.util.regex.Pattern;\n\npublic final class CarRecents {\n    public interface\
        \ Callback {\n        void onTaskSelected(ComponentName component);\n        void onClose();\n    }\n\n    private\
        \ static final Pattern TASK_ID =\n            Pattern.compile(\"#(\\\\d+)\");\n    private static final Pattern DISPLAY_ID\
        \ =\n            Pattern.compile(\"displayId[=:](\\\\d+)\");\n    private static final Pattern REAL_ACTIVITY =\n \
        \           Pattern.compile(\n                    \"realActivity=ComponentInfo\\\\{([^/}]+)/([^}]+)\\\\}\");\n\n \
        \   private final Context context;\n    private final FrameLayout host;\n    private final RootShellSession shell;\n\
        \    private final int displayId;\n    private final String ownPackage;\n    private final Callback callback;\n\n\
        \    private LinearLayout panel;\n    private TextView status;\n\n    public CarRecents(\n            Context context,\n\
        \            FrameLayout host,\n            RootShellSession shell,\n            int displayId,\n            String\
        \ ownPackage,\n            Callback callback) {\n        this.context = context;\n        this.host = host;\n    \
        \    this.shell = shell;\n        this.displayId = displayId;\n        this.ownPackage = ownPackage;\n        this.callback\
        \ = callback;\n    }\n\n    public void show() {\n        if (panel != null) return;\n\n        panel = new LinearLayout(context);\n\
        \        panel.setOrientation(LinearLayout.VERTICAL);\n        panel.setPadding(dp(16), dp(12), dp(16), dp(12));\n\
        \        panel.setBackgroundColor(Color.rgb(7, 9, 12));\n\n        LinearLayout header = new LinearLayout(context);\n\
        \        header.setGravity(Gravity.CENTER_VERTICAL);\n\n        TextView close = button(\"CLOSE\");\n        close.setOnClickListener(v\
        \ -> {\n            hide();\n            if (callback != null) callback.onClose();\n        });\n\n        header.addView(close,\
        \ new LinearLayout.LayoutParams(dp(95), dp(54)));\n\n        TextView title = text(\"RECENT APPS\", 21, Color.WHITE);\n\
        \        title.setGravity(Gravity.CENTER);\n        header.addView(title, new LinearLayout.LayoutParams(0, dp(54),\
        \ 1f));\n        panel.addView(header);\n\n        status = text(\"Loading…\", 14, Color.LTGRAY);\n        status.setGravity(Gravity.CENTER);\n\
        \        panel.addView(status, new LinearLayout.LayoutParams(-1, dp(42)));\n\n        ScrollView scroll = new ScrollView(context);\n\
        \        LinearLayout list = new LinearLayout(context);\n        list.setOrientation(LinearLayout.VERTICAL);\n   \
        \     scroll.addView(list);\n\n        panel.addView(scroll, new LinearLayout.LayoutParams(-1, 0, 1f));\n        host.addView(panel,\
        \ new FrameLayout.LayoutParams(-1, -1));\n\n        load(list);\n    }\n\n    public void destroy() {\n        hide();\n\
        \        shell.destroy();\n    }\n\n    public void hide() {\n        if (panel != null) {\n            host.removeView(panel);\n\
        \            panel = null;\n            status = null;\n        }\n    }\n\n    private void load(LinearLayout list)\
        \ {\n        final String command =\n                \"/system/bin/dumpsys activity recents\"\n                  \
        \      + \" | /system/bin/grep -E\"\n                        + \" 'Task\\\\{|displayId[=:]|realActivity='\";\n\n \
        \       RootShellSession.EXEC.execute(() -> {\n            try {\n                String output = shell.run(5, command);\n\
        \                List<RecentTask> tasks = parse(output);\n                host.post(() -> populate(list, tasks));\n\
        \            } catch (Throwable t) {\n                host.post(() -> showError(list));\n            }\n        });\n\
        \    }\n\n    private void populate(LinearLayout list, List<RecentTask> tasks) {\n        list.removeAllViews();\n\
        \n        if (tasks.isEmpty()) {\n            status.setText(\"No recent task on this display\");\n            return;\n\
        \        }\n\n        status.setText(tasks.size() + \" task(s)\");\n\n        for (RecentTask task : tasks) {\n  \
        \          TextView item = button(task.label);\n            item.setTextSize(16f);\n            item.setGravity(Gravity.CENTER_VERTICAL);\n\
        \n            LinearLayout.LayoutParams lp =\n                    new LinearLayout.LayoutParams(-1, dp(66));\n   \
        \         lp.bottomMargin = dp(8);\n            list.addView(item, lp);\n\n            item.setOnClickListener(v ->\
        \ select(task));\n        }\n    }\n\n    private void showError(LinearLayout list) {\n        list.removeAllViews();\n\
        \        status.setText(\"Unable to read recent tasks\");\n    }\n\n    private void select(RecentTask task) {\n \
        \       hide();\n\n        final String command =\n                \"/system/bin/am task \"\n                    \
        \    + task.taskId\n                        + \" front\";\n\n        RootShellSession.EXEC.execute(() -> {\n     \
        \       try {\n                shell.run(5, command);\n            } catch (Throwable ignored) {\n            }\n\n\
        \            host.post(() -> {\n                if (callback != null) {\n                    callback.onTaskSelected(task.component);\n\
        \                }\n            });\n        });\n    }\n\n    private List<RecentTask> parse(String output) {\n \
        \       LinkedHashMap<Integer, RecentTask> result =\n                new LinkedHashMap<>();\n\n        int currentTaskId\
        \ = -1;\n        boolean currentDisplayMatches = false;\n        ComponentName currentComponent = null;\n\n      \
        \  String[] lines = output == null\n                ? new String[0]\n                : output.split(\"\\\\n\");\n\n\
        \        for (String line : lines) {\n            Matcher taskMatcher = TASK_ID.matcher(line);\n\n            if (line.contains(\"\
        Task{\") && taskMatcher.find()) {\n                currentTaskId = Integer.parseInt(taskMatcher.group(1));\n     \
        \           currentDisplayMatches = false;\n                currentComponent = null;\n\n                Matcher displayMatcher\
        \ = DISPLAY_ID.matcher(line);\n                if (displayMatcher.find()) {\n                    currentDisplayMatches\
        \ =\n                            Integer.parseInt(displayMatcher.group(1))\n                                    ==\
        \ displayId;\n                }\n                continue;\n            }\n\n            if (currentTaskId < 0) continue;\n\
        \n            Matcher displayMatcher = DISPLAY_ID.matcher(line);\n            if (displayMatcher.find()) {\n     \
        \           currentDisplayMatches =\n                        Integer.parseInt(displayMatcher.group(1))\n         \
        \                       == displayId;\n            }\n\n            Matcher activityMatcher = REAL_ACTIVITY.matcher(line);\n\
        \            if (activityMatcher.find()) {\n                currentComponent = new ComponentName(\n              \
        \          activityMatcher.group(1),\n                        activityMatcher.group(2));\n            }\n\n      \
        \      if (currentDisplayMatches\n                    && currentComponent != null\n                    && !ownPackage.equals(\n\
        \                            currentComponent.getPackageName())\n                    && !result.containsKey(currentTaskId))\
        \ {\n                result.put(\n                        currentTaskId,\n                        new RecentTask(\n\
        \                                currentTaskId,\n                                currentComponent));\n           \
        \ }\n        }\n\n        return new ArrayList<>(result.values());\n    }\n\n    private static final class RecentTask\
        \ {\n        final int taskId;\n        final ComponentName component;\n        final String label;\n\n        RecentTask(int\
        \ taskId, ComponentName component) {\n            this.taskId = taskId;\n            this.component = component;\n\
        \            this.label = component.getPackageName()\n                    + \"\\nTask #\" + taskId;\n        }\n \
        \   }\n\n    private TextView button(String value) {\n        TextView view = text(value, 16, Color.WHITE);\n    \
        \    view.setGravity(Gravity.CENTER);\n\n        GradientDrawable bg = new GradientDrawable();\n        bg.setColor(Color.rgb(22,\
        \ 27, 33));\n        bg.setCornerRadius(dp(14));\n        view.setBackground(bg);\n        return view;\n    }\n\n\
        \    private TextView text(String value, int size, int color) {\n        TextView view = new TextView(context);\n\
        \        view.setText(value);\n        view.setTextSize(size);\n        view.setTextColor(color);\n        return\
        \ view;\n    }\n\n    private int dp(int value) {\n        return Math.round(value * context.getResources()\n    \
        \            .getDisplayMetrics().density);\n    }\n}\nEOF\n"
    - name: Patch V10ProjectionSession
      shell: bash
      run: 'set -euo pipefail

        echo 
        | base64 --decode | python3

        '
    - name: Patch V10CarActivity
      shell: bash
      run: 'set -euo pipefail

        echo 
        | base64 --decode | python3

        '
    - name: Verify architecture
      shell: bash
      run: "set -euo pipefail\nCAR=\"v10-source/app/src/main/java/com/hieptran/aacast/doudou/CarRecents.java\"\nACT=\"v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java\"\
        \nPROJ=\"v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java\"\n\ntest -f \"$CAR\"\n\
        grep -q \"class CarRecents\" \"$CAR\"\ngrep -q \"dumpsys activity recents\" \"$CAR\"\ngrep -q \"/system/bin/am task\"\
        \ \"$CAR\"\ngrep -q \"displayId\" \"$CAR\"\ngrep -q \"new CarRecents\" \"$ACT\"\ngrep -q \"showCarRecents\" \"$ACT\"\
        \ngrep -q \"getDisplayId()\" \"$PROJ\"\n\nif grep -nE \"KEYCODE_APP_SWITCH|input keyevent 187\" \"$CAR\" \"$ACT\"\
        ; then\n  echo \"ERROR: global APP_SWITCH mechanism detected.\"\n  exit 1\nfi\n\necho \"CarSystemUI-2 CarRecents verification\
        \ PASSED.\"\n"
    - name: Compile Java
      working-directory: v10-source
      shell: bash
      run: 'set -euo pipefail

        chmod +x gradlew

        ./gradlew :app:compileDebugJavaWithJavac --no-daemon --stacktrace

        '
    - name: Build APK
      working-directory: v10-source
      shell: bash
      run: 'set -euo pipefail

        chmod +x gradlew

        ./gradlew :app:assembleDebug --no-daemon --stacktrace

        '
    - name: Locate APK and SHA256
      shell: bash
      run: 'set -euo pipefail

        APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

        test -f "$APK"

        echo "APK=$APK"

        sha256sum "$APK"

        ls -lh "$APK"

        '
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CarAssistant-V10-CarSystemUI-2-CarRecents
        path: v10-source/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
        retention-days: 14
