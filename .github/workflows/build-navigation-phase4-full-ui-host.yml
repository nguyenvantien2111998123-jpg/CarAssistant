name: Phase 4 Android Auto Presentation Hos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      # =========================================================
      # 1. CHECKOUT IMMUTABLE BASELINE
      # =========================================================

      - name: Checkout immutable Navigation baseline
        uses: actions/checkout@v4
        with:
          ref: d69dc922696a4876dbc1000154ce230b220a0ecd
          fetch-depth: 1

      # =========================================================
      # 2. JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # 3. VERIFY BASELINE
      # =========================================================

      - name: Verify immutable baseline
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_COMMIT="d69dc922696a4876dbc1000154ce230b220a0ecd"

          ACTUAL_COMMIT="$(git rev-parse HEAD)"

          if [ "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "ERROR: Wrong baseline commit."
            echo "Expected: $EXPECTED_COMMIT"
            echo "Actual:   $ACTUAL_COMMIT"
            exit 1
          fi

          echo "PASS: Immutable baseline verified."
          echo "Commit: $ACTUAL_COMMIT"

      # =========================================================
      # 4. VERIFY NAVIGATIONMAPVIEW BYTE-IDENTICAL
      # =========================================================

      - name: Verify NavigationMapView baseline SHA
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          EXPECTED_NAV_SHA="f65ed2bbce98b443458c5d9d11b07c1099ecb97e6699dd324875f451f4caf163"

          test -f "$NAV"

          ACTUAL_NAV_SHA="$(sha256sum "$NAV" | awk '{print $1}')"

          echo "Expected NavigationMapView SHA:"
          echo "$EXPECTED_NAV_SHA"

          echo "Actual NavigationMapView SHA:"
          echo "$ACTUAL_NAV_SHA"

          if [ "$ACTUAL_NAV_SHA" != "$EXPECTED_NAV_SHA" ]; then
            echo "ERROR: NavigationMapView baseline SHA mismatch."
            exit 1
          fi

          echo "PASS: NavigationMapView is immutable."

      # =========================================================
      # 5. VERIFY REQUIRED SOURCE FILES
      # =========================================================

      - name: Verify source structure before patch
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          CAR="$SRC/V10CarActivity.java"
          LAUNCHER="$SRC/V10LauncherActivity.java"
          NAV="$SRC/NavigationMapView.java"
          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          test -f "$CAR"
          test -f "$LAUNCHER"
          test -f "$NAV"
          test -f "$MANIFEST"

          echo "PASS: Required source files exist."

          echo ""
          echo "Checking package declarations..."

          grep -Fq \
            "package com.carassistant.v10;" \
            "$CAR"

          grep -Fq \
            "package com.carassistant.v10;" \
            "$LAUNCHER"

          grep -Fq \
            "package com.carassistant.v10;" \
            "$NAV"

          echo "PASS: Package declarations verified."

          echo ""
          echo "Checking AndroidManifest..."

          grep -Fq \
            'com.carassistant.v10.V10LauncherActivity' \
            "$MANIFEST"

          grep -Fq \
            'com.carassistant.v10.V10CarActivity' \
            "$MANIFEST"

          grep -Fq \
            'com.carassistant.v10.AACastCarService' \
            "$MANIFEST"

          grep -Fq \
            'com.google.android.gms.car.category.CATEGORY_PROJECTION' \
            "$MANIFEST"

          grep -Fq \
            'com.google.android.gms.car.category.CATEGORY_PROJECTION_OEM' \
            "$MANIFEST"

          echo "PASS: AndroidManifest verified."

      # =========================================================
      # 6. VERIFY V10CarActivity BASELINE STRUCTURE
      # =========================================================

      - name: Validate V10CarActivity baseline structure
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          check_exact() {
            local label="$1"
            local pattern="$2"

            local count

            count="$(
              grep -F \
                "$pattern" \
                "$FILE" \
                | wc -l \
                | tr -d ' '
            )"

            if [ "$count" -lt 1 ]; then
              echo "ERROR: Missing $label"
              echo "Pattern:"
              echo "$pattern"
              exit 1
            fi

            echo "PASS: $label"
          }

          check_exact \
            "V10CarActivity class" \
            "public final class V10CarActivity"

          check_exact \
            "NavigationMapView field" \
            "private NavigationMapView navigationMap;"

          check_exact \
            "onCreate" \
            "public void onCreate("

          check_exact \
            "onResume" \
            "public void onResume()"

          check_exact \
            "buildUi" \
            "private void buildUi()"

          check_exact \
            "NavigationMapView creation" \
            "navigationMap=new NavigationMapView(this);"

          check_exact \
            "NavigationMapView direct root add" \
            "root.addView("

          check_exact \
            "onPause" \
            "public void onPause()"

          check_exact \
            "onDestroy" \
            "public void onDestroy()"

          check_exact \
            "baseline resume delegation" \
            "navigationMap.onHostResume();"

          check_exact \
            "baseline pause delegation" \
            "navigationMap.onHostPause();"

          check_exact \
            "baseline destroy delegation" \
            "navigationMap.onHostDestroy();"

          echo ""
          echo "PASS: V10CarActivity baseline structure matches expected source."

      # =========================================================
      # 7. CREATE NAVIGATION PRESENTATION HOST
      # =========================================================

      - name: Create NavigationPresentationView
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationPresentationView.java"

          if [ -e "$FILE" ]; then
            echo "ERROR: NavigationPresentationView already exists."
            echo "The workflow expects the immutable baseline to have no"
            echo "NavigationPresentationView.java."
            exit 1
          fi

          cat > "$FILE" <<'JAVA'
          package com.carassistant.v10;

          import android.content.Context;
          import android.graphics.Color;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;

          public final class NavigationPresentationView
                  extends FrameLayout {

              private NavigationMapView navigationMap;

              public NavigationPresentationView(
                      Context context) {

                  super(context);

                  setBackgroundColor(
                          Color.TRANSPARENT);

                  setClipChildren(false);
                  setClipToPadding(false);
              }

              public void setNavigationMap(
                      NavigationMapView map) {

                  if (map == navigationMap) {
                      return;
                  }

                  if (navigationMap != null) {
                      removeView(navigationMap);
                  }

                  navigationMap = map;

                  if (navigationMap == null) {
                      return;
                  }

                  ViewGroup parent =
                          (ViewGroup)
                                  navigationMap
                                          .getParent();

                  if (parent != null) {
                      parent.removeView(
                              navigationMap);
                  }

                  addView(
                          navigationMap,
                          0,
                          new FrameLayout.LayoutParams(
                                  -1,
                                  -1));
              }

              public NavigationMapView
                      getNavigationMap() {

                  return navigationMap;
              }

              public void onHostResume() {

                  if (navigationMap != null) {
                      navigationMap
                              .onHostResume();
                  }
              }

              public void onHostPause() {

                  if (navigationMap != null) {
                      navigationMap
                              .onHostPause();
                  }
              }

              public void onHostDestroy() {

                  if (navigationMap != null) {
                      navigationMap
                              .onHostDestroy();
                  }
              }
          }
          JAVA

          test -s "$FILE"

          grep -Fq \
            "public final class NavigationPresentationView" \
            "$FILE"

          grep -Fq \
            "setNavigationMap(" \
            "$FILE"

          grep -Fq \
            "onHostResume()" \
            "$FILE"

          grep -Fq \
            "onHostPause()" \
            "$FILE"

          grep -Fq \
            "onHostDestroy()" \
            "$FILE"

          echo "PASS: NavigationPresentationView created."

      # =========================================================
      # 8. PATCH ONLY V10CarActivity
      # =========================================================

      - name: Patch V10CarActivity Presentation Host
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          def require_once(
              source,
              pattern,
              replacement,
              label
          ):
              result, count = re.subn(
                  pattern,
                  replacement,
                  source,
                  count=1,
                  flags=re.MULTILINE | re.DOTALL
              )

              if count != 1:
                  raise RuntimeError(
                      f"{label}: expected exactly one match, got {count}"
                  )

              return result

          def require_literal_once(
              source,
              old,
              new,
              label
          ):
              count = source.count(old)

              if count != 1:
                  raise RuntimeError(
                      f"{label}: expected exactly one match, got {count}"
                  )

              return source.replace(
                  old,
                  new,
                  1
              )

          field_pattern = (
              r"(^\s*private NavigationMapView navigationMap;\s*$)"
          )

          field_replacement = (
              r"\1\n"
              r"    private NavigationPresentationView "
              r"navigationPresentation;"
          )

          text = require_once(
              text,
              field_pattern,
              field_replacement,
              "NavigationPresentation field"
          )

          old_map_block = """        navigationMap=new NavigationMapView(this);
                  root.addView(
                          navigationMap,
                          new FrameLayout.LayoutParams(-1,-1));"""

          new_map_block = """        navigationMap = new NavigationMapView(this);

                  navigationPresentation =
                          new NavigationPresentationView(this);

                  navigationPresentation.setNavigationMap(
                          navigationMap);

                  root.addView(
                          navigationPresentation,
                          new FrameLayout.LayoutParams(
                                  -1,
                                  -1));"""

          text = require_literal_once(
              text,
              old_map_block,
              new_map_block,
              "NavigationPresentation root host"
          )

          resume_pattern = (
              r"(^\s*@Override\s+"
              r"public void onResume\(\)\s*\{)"
              r"(.*?)"
              r"(^\s*\}\s*\n\s*\n\s*"
              r"private void buildUi\(\))"
          )

          resume_replacement = """    @Override
              public void onResume() {

                  super.onResume();

                  resumed = true;

                  applyChrome();

                  if (root == null) {
                      buildUi();
                      attachProjection();
                  }

                  if (navigationPresentation != null) {
                      navigationPresentation
                              .onHostResume();
                  }

                  loadApps();
                  rebuildDock();

                  handler.removeCallbacks(
                          clockTicker);

                  handler.removeCallbacks(
                          targetPoller);

                  handler.post(clockTicker);
                  handler.post(targetPoller);

                  ComponentName target =
                          V10SessionStore
                                  .getTarget(this);

                  if (target != null) {
                      launchProjection(target);
                  }
              }


              private void buildUi"""

          text = require_once(
              text,
              resume_pattern,
              resume_replacement,
              "V10CarActivity onResume"
          )

          pause_pattern = (
              r"if\s*\(\s*navigationMap\s*!=\s*null\s*\)"
              r"\s*navigationMap\.onHostPause\(\);"
          )

          pause_replacement = """if (navigationPresentation != null) {
                  navigationPresentation
                          .onHostPause();
              }"""

          text = require_once(
              text,
              pause_pattern,
              pause_replacement,
              "V10CarActivity onPause"
          )

          destroy_pattern = (
              r"if\s*\(\s*navigationMap\s*!=\s*null\s*\)\s*\{\s*"
              r"navigationMap\.onHostDestroy\(\);\s*"
              r"navigationMap\s*=\s*null;\s*\}"
          )

          destroy_replacement = """if (navigationPresentation != null) {
                  navigationPresentation
                          .onHostDestroy();
                  navigationPresentation = null;
              }

              navigationMap = null;"""

          text = require_once(
              text,
              destroy_pattern,
              destroy_replacement,
              "V10CarActivity onDestroy"
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "PASS: V10CarActivity patched."
          )
          PY

      # =========================================================
      # 9. VERIFY PATCHED NAVIGATION ARCHITECTURE
      #
      # FIX:
      # Do not require Java statements to be on one line.
      # Verification is whitespace-tolerant.
      # =========================================================

      - name: Verify patched Navigation architecture
        shell: bash
        run: |
          set -euo pipefail

          CAR="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          PRESENTATION="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationPresentationView.java"

          test -f "$CAR"
          test -f "$PRESENTATION"

          check_fixed() {
            local label="$1"
            local pattern="$2"
            local file="$3"

            if grep -Fq "$pattern" "$file"; then
              echo "PASS: $label"
            else
              echo "ERROR: $label"
              echo "Missing:"
              echo "$pattern"
              echo "File:"
              echo "$file"
              exit 1
            fi
          }

          check_regex() {
            local label="$1"
            local pattern="$2"
            local file="$3"

            if grep -Eq "$pattern" "$file"; then
              echo "PASS: $label"
            else
              echo "ERROR: $label"
              echo "Regex not matched:"
              echo "$pattern"
              echo "File:"
              echo "$file"
              exit 1
            fi
          }

          echo "========================================"
          echo "Checking NavigationPresentationView"
          echo "========================================"

          check_fixed \
            "PresentationView class" \
            "public final class NavigationPresentationView" \
            "$PRESENTATION"

          check_fixed \
            "PresentationView setNavigationMap" \
            "setNavigationMap(" \
            "$PRESENTATION"

          check_fixed \
            "PresentationView resume" \
            "onHostResume()" \
            "$PRESENTATION"

          check_fixed \
            "PresentationView pause" \
            "onHostPause()" \
            "$PRESENTATION"

          check_fixed \
            "PresentationView destroy" \
            "onHostDestroy()" \
            "$PRESENTATION"

          echo ""
          echo "========================================"
          echo "Checking V10CarActivity"
          echo "========================================"

          check_fixed \
            "Presentation field" \
            "private NavigationPresentationView navigationPresentation;" \
            "$CAR"

                    check_regex \
            "Presentation creation" \
            'navigationPresentation[[:space:]]*=[[:space:]]*new[[:space:]]+NavigationPresentationView[[:space:]]*\([[:space:]]*this[[:space:]]*\)[[:space:]]*;' \
            "$CAR"

          check_regex \
            "NavigationMap assigned to Presentation" \
            'navigationPresentation[[:space:]]*\.[[:space:]]*setNavigationMap[[:space:]]*\([[:space:]]*navigationMap[[:space:]]*\)[[:space:]]*;' \
            "$CAR"

          check_regex \
            "Presentation added to root" \
            'root[[:space:]]*\.[[:space:]]*addView[[:space:]]*\([[:space:]]*navigationPresentation[[:space:]]*,' \
            "$CAR"

          check_regex \
            "Resume delegation" \
            'navigationPresentation[[:space:]]*\.[[:space:]]*onHostResume[[:space:]]*\([[:space:]]*\)[[:space:]]*;' \
            "$CAR"

          check_regex \
            "Pause delegation" \
            'navigationPresentation[[:space:]]*\.[[:space:]]*onHostPause[[:space:]]*\([[:space:]]*\)[[:space:]]*;' \
            "$CAR"

          check_regex \
            "Destroy delegation" \
            'navigationPresentation[[:space:]]*\.[[:space:]]*onHostDestroy[[:space:]]*\([[:space:]]*\)[[:space:]]*;' \
            "$CAR"

          echo ""
          echo "========================================"
          echo "Checking lifecycle structure"
          echo "========================================"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          forbidden = [
              r"navigationMap\s*\.\s*onHostResume\s*\(",
              r"navigationMap\s*\.\s*onHostPause\s*\(",
              r"navigationMap\s*\.\s*onHostDestroy\s*\(",
          ]

          for pattern in forbidden:
              if re.search(pattern, text):
                  raise SystemExit(
                      "ERROR: Direct NavigationMapView lifecycle "
                      "call remains: " + pattern
                  )

          required = [
              r"navigationPresentation\s*\.\s*onHostResume\s*\(",
              r"navigationPresentation\s*\.\s*onHostPause\s*\(",
              r"navigationPresentation\s*\.\s*onHostDestroy\s*\(",
          ]

          for pattern in required:
              if not re.search(pattern, text):
                  raise SystemExit(
                      "ERROR: Missing Presentation lifecycle: "
                      + pattern
                  )

          m = re.search(
              r"public\s+void\s+onResume\s*\(\s*\)\s*\{"
              r"(.*?)"
              r"\n\s*\}"
              r"\s*\n\s*\n\s*"
              r"private\s+void\s+buildUi\s*\(",
              text,
              flags=re.S
          )

          if not m:
              raise SystemExit(
                  "ERROR: Could not isolate onResume()."
              )

      # =========================================================
      # 9. VERIFY PATCHED NAVIGATION ARCHITECTURE
      #
      # IMPORTANT:
      # Use Python for Java structural checks.
      # Do NOT use grep for multi-line Java statements.
      # =========================================================

      - name: Verify patched Navigation architecture
        shell: bash
        run: |
          set -euo pipefail

          CAR="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          PRESENTATION="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationPresentationView.java"

          test -f "$CAR"
          test -f "$PRESENTATION"

          echo "========================================"
          echo "Checking NavigationPresentationView"
          echo "========================================"

          grep -Fq \
            "public final class NavigationPresentationView" \
            "$PRESENTATION"

          echo "PASS: PresentationView class"

          grep -Fq \
            "setNavigationMap(" \
            "$PRESENTATION"

          echo "PASS: PresentationView setNavigationMap"

          grep -Fq \
            "onHostResume()" \
            "$PRESENTATION"

          echo "PASS: PresentationView resume"

          grep -Fq \
            "onHostPause()" \
            "$PRESENTATION"

          echo "PASS: PresentationView pause"

          grep -Fq \
            "onHostDestroy()" \
            "$PRESENTATION"

          echo "PASS: PresentationView destroy"

          echo ""
          echo "========================================"
          echo "Checking V10CarActivity"
          echo "========================================"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          def check(label, pattern):
              if not re.search(
                  pattern,
                  text,
                  flags=re.MULTILINE | re.DOTALL
              ):
                  print("")
                  print("ERROR: " + label)
                  print("Regex not matched:")
                  print(pattern)
                  print("")
                  print("Relevant source context:")

                  pos = text.find(
                      "navigationPresentation"
                  )

                  if pos >= 0:
                      start = max(
                          0,
                          pos - 500
                      )
                      end = min(
                          len(text),
                          pos + 1500
                      )
                      print(
                          text[start:end]
                      )
                  else:
                      print(
                          "navigationPresentation not found."
                      )

                  raise SystemExit(1)

              print(
                  "PASS: " + label
              )

          # -----------------------------------------------------
          # Presentation field
          # -----------------------------------------------------

          check(
              "Presentation field",
              r"private\s+NavigationPresentationView"
              r"\s+navigationPresentation\s*;"
          )

          # -----------------------------------------------------
          # Presentation creation
          #
          # This explicitly supports:
          #
          # navigationPresentation =
          #         new NavigationPresentationView(this);
          #
          # and:
          #
          # navigationPresentation = new NavigationPresentationView(this);
          # -----------------------------------------------------

          check(
              "Presentation creation",
              r"navigationPresentation"
              r"\s*=\s*"
              r"new\s+NavigationPresentationView"
              r"\s*\(\s*this\s*\)\s*;"
          )

          # -----------------------------------------------------
          # NavigationMapView -> Presentation
          # -----------------------------------------------------

          check(
              "NavigationMap assigned to Presentation",
              r"navigationPresentation"
              r"\s*\.\s*setNavigationMap"
              r"\s*\(\s*navigationMap\s*\)\s*;"
          )

          # -----------------------------------------------------
          # Presentation -> root
          # -----------------------------------------------------

          check(
              "Presentation added to root",
              r"root"
              r"\s*\.\s*addView"
              r"\s*\(\s*"
              r"navigationPresentation"
              r"\s*,"
          )

          # -----------------------------------------------------
          # Resume delegation
          # -----------------------------------------------------

          check(
              "Resume delegation",
              r"navigationPresentation"
              r"\s*\.\s*onHostResume"
              r"\s*\(\s*\)\s*;"
          )

          # -----------------------------------------------------
          # Pause delegation
          # -----------------------------------------------------

          check(
              "Pause delegation",
              r"navigationPresentation"
              r"\s*\.\s*onHostPause"
              r"\s*\(\s*\)\s*;"
          )

          # -----------------------------------------------------
          # Destroy delegation
          # -----------------------------------------------------

          check(
              "Destroy delegation",
              r"navigationPresentation"
              r"\s*\.\s*onHostDestroy"
              r"\s*\(\s*\)\s*;"
          )

          print("")
          print("========================================")
          print("Checking lifecycle structure")
          print("========================================")

          # -----------------------------------------------------
          # Direct NavigationMapView lifecycle calls must NOT
          # remain in V10CarActivity.
          # -----------------------------------------------------

          forbidden = [
              r"navigationMap"
              r"\s*\.\s*onHostResume"
              r"\s*\(",

              r"navigationMap"
              r"\s*\.\s*onHostPause"
              r"\s*\(",

              r"navigationMap"
              r"\s*\.\s*onHostDestroy"
              r"\s*\(",
          ]

          for pattern in forbidden:
              if re.search(
                  pattern,
                  text,
                  flags=re.MULTILINE | re.DOTALL
              ):
                  raise SystemExit(
                      "ERROR: Direct NavigationMapView "
                      "lifecycle call remains:\n"
                      + pattern
                  )

          print(
              "PASS: Direct NavigationMapView lifecycle calls removed."
          )

          # -----------------------------------------------------
          # Isolate onResume()
          # -----------------------------------------------------

          resume_match = re.search(
              r"public\s+void\s+onResume"
              r"\s*\(\s*\)\s*\{"
              r"(.*?)"
              r"\n\s*\}\s*"
              r"\n\s*\n\s*"
              r"private\s+void\s+buildUi"
              r"\s*\(",
              text,
              flags=re.MULTILINE | re.DOTALL
          )

          if not resume_match:
              raise SystemExit(
                  "ERROR: Could not isolate onResume()."
              )

          resume = resume_match.group(1)

          # -----------------------------------------------------
          # Find root == null block inside onResume().
          # -----------------------------------------------------

          root_match = re.search(
              r"if\s*\(\s*root\s*==\s*null\s*\)\s*\{"
              r"(.*?)"
              r"\n\s*\}",
              resume,
              flags=re.MULTILINE | re.DOTALL
          )

          if not root_match:
              raise SystemExit(
                  "ERROR: Could not isolate root == null block."
              )

          root_block = root_match.group(1)

          # Presentation resume MUST NOT be inside root == null.
          if re.search(
              r"navigationPresentation"
              r"\s*\.\s*onHostResume"
              r"\s*\(",
              root_block,
              flags=re.MULTILINE | re.DOTALL
          ):
              raise SystemExit(
                  "ERROR: navigationPresentation.onHostResume() "
                  "is still inside root == null."
              )

          # Presentation resume MUST exist in onResume().
          if not re.search(
              r"navigationPresentation"
              r"\s*\.\s*onHostResume"
              r"\s*\(\s*\)\s*;",
              resume,
              flags=re.MULTILINE | re.DOTALL
          ):
              raise SystemExit(
                  "ERROR: onResume() does not delegate to "
                  "NavigationPresentationView."
              )

          print(
              "PASS: onHostResume() is outside root == null."
          )

          # -----------------------------------------------------
          # Isolate onPause().
          # -----------------------------------------------------

          pause_match = re.search(
              r"public\s+void\s+onPause"
              r"\s*\(\s*\)\s*\{"
              r"(.*?)"
              r"\n\s*\}\s*"
              r"\n\s*\n\s*"
              r"public\s+void\s+onStop",
              text,
              flags=re.MULTILINE | re.DOTALL
          )

          if not pause_match:
              raise SystemExit(
                  "ERROR: Could not isolate onPause()."
              )

          pause = pause_match.group(1)

          if not re.search(
              r"navigationPresentation"
              r"\s*\.\s*onHostPause"
              r"\s*\(\s*\)\s*;",
              pause,
              flags=re.MULTILINE | re.DOTALL
          ):
              raise SystemExit(
                  "ERROR: onPause() does not delegate to "
                  "NavigationPresentationView."
              )

          print(
              "PASS: onPause() delegates to Presentation."
          )

          # -----------------------------------------------------
          # Isolate onDestroy().
          # -----------------------------------------------------

          destroy_match = re.search(
              r"public\s+void\s+onDestroy"
              r"\s*\(\s*\)\s*\{"
              r"(.*?)"
              r"\n\s*\}\s*",
              text,
              flags=re.MULTILINE | re.DOTALL
          )

          if not destroy_match:
              raise SystemExit(
                  "ERROR: Could not isolate onDestroy()."
              )

          destroy = destroy_match.group(1)

          if not re.search(
              r"navigationPresentation"
              r"\s*\.\s*onHostDestroy"
              r"\s*\(\s*\)\s*;",
              destroy,
              flags=re.MULTILINE | re.DOTALL
          ):
              raise SystemExit(
                  "ERROR: onDestroy() does not delegate to "
                  "NavigationPresentationView."
              )

          if not re.search(
              r"navigationPresentation"
              r"\s*=\s*null\s*;",
              destroy,
              flags=re.MULTILINE | re.DOTALL
          ):
              raise SystemExit(
                  "ERROR: navigationPresentation is not cleared "
                  "in onDestroy()."
              )

          print(
              "PASS: onDestroy() delegates to Presentation."
          )

          print("")
          print("========================================")
          print("PASS: Navigation architecture verified")
          print("========================================")
          PY

