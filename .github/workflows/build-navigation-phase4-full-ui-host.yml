name: CarAssistant V10 - Navigation Phase 4 Full UI Shared Host

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout immutable Navigation baseline
        uses: actions/checkout@v4
        with:
          ref: d69dc922696a4876dbc1000154ce230b220a0ecd
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify NavigationMapView SHA baseline
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_NAV_SHA="f65ed2bbce98b443458c5d9d11b07c1099ecb97e6699dd324875f451f4caf163"
          NAV="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          test -f "$NAV"
          ACTUAL_NAV_SHA="$(sha256sum "$NAV" | awk '{print $1}')"

          if [ "$ACTUAL_NAV_SHA" != "$EXPECTED_NAV_SHA" ]; then
            echo "ERROR: NavigationMapView baseline SHA mismatch."
            exit 1
          fi

          echo "PASS: NavigationMapView baseline verified."

      - name: Create shared NavigationPresentationView host
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationPresentationView.java"

          cat > "$FILE" <<'JAVA'
          package com.carassistant.v10;

          import android.content.Context;
          import android.graphics.Color;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;

          public final class NavigationPresentationView extends FrameLayout {

              private NavigationMapView navigationMap;

              public NavigationPresentationView(Context context) {
                  super(context);
                  setBackgroundColor(Color.TRANSPARENT);
                  setClipChildren(false);
                  setClipToPadding(false);
              }

              public void setNavigationMap(NavigationMapView map) {
                  if (map == navigationMap) {
                      return;
                  }

                  if (navigationMap != null) {
                      removeView(navigationMap);
                  }

                  navigationMap = map;

                  if (navigationMap == null) {
                      return;
                  }

                  ViewGroup parent = (ViewGroup) navigationMap.getParent();
                  if (parent != null) {
                      parent.removeView(navigationMap);
                  }

                  addView(
                          navigationMap,
                          0,
                          new FrameLayout.LayoutParams(-1, -1));
              }

              public NavigationMapView getNavigationMap() {
                  return navigationMap;
              }

              public void onHostResume() {
                  if (navigationMap != null) {
                      navigationMap.onHostResume();
                  }
              }

              public void onHostPause() {
                  if (navigationMap != null) {
                      navigationMap.onHostPause();
                  }
              }

              public void onHostDestroy() {
                  if (navigationMap != null) {
                      navigationMap.onHostDestroy();
                  }
              }
          }
          JAVA

          echo "PASS: NavigationPresentationView host created."

      - name: Patch V10CarActivity (Android Auto Shared Host)
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java")
          s = path.read_text()

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"ERROR: Expected 1 occurrence for {label}, found {count}")
              s = s.replace(old, new)

          # 1. Field
          replace_once(
              "private NavigationMapView navigationMap;",
              "private NavigationMapView navigationMap;\n    private NavigationPresentationView navigationPresentation;",
              "CarActivity field"
          )

          # 2. View creation & host wrapper
          replace_once(
              "        navigationMap=new NavigationMapView(this);\n        root.addView(\n                navigationMap,\n                new FrameLayout.LayoutParams(-1,-1));",
              "        navigationMap = new NavigationMapView(this);\n        navigationPresentation = new NavigationPresentationView(this);\n        navigationPresentation.setNavigationMap(navigationMap);\n        root.addView(\n                navigationPresentation,\n                new FrameLayout.LayoutParams(-1,-1));",
              "CarActivity presentation wrapper"
          )

          # 3. Lifecycle
          replace_once(
              "if (navigationMap != null) navigationMap.onHostResume();",
              "if (navigationPresentation != null) navigationPresentation.onHostResume();",
              "CarActivity resume"
          )

          replace_once(
              "if (navigationMap != null) navigationMap.onHostPause();",
              "if (navigationPresentation != null) navigationPresentation.onHostPause();",
              "CarActivity pause"
          )

          replace_once(
              "if (navigationMap != null) { navigationMap.onHostDestroy(); navigationMap = null; }",
              "if (navigationPresentation != null) {\n            navigationPresentation.onHostDestroy();\n            navigationPresentation = null;\n        }\n        navigationMap = null;",
              "CarActivity destroy"
          )

          path.write_text(s)
          print("PASS: V10CarActivity patched safely.")
          PY

      - name: Patch V10LauncherActivity (Phone FrameLayout & LayoutParams Patch)
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java")
          s = path.read_text()

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"ERROR: Expected 1 occurrence for {label}, found {count}")
              s = s.replace(old, new)

          # 1. Imports
          replace_once(
              "import android.widget.LinearLayout;",
              "import android.widget.LinearLayout;\nimport android.widget.FrameLayout;",
              "Launcher import FrameLayout"
          )

          # 2. Fields
          replace_once(
              "private LinearLayout root;",
              "private FrameLayout root;\n    private NavigationMapView navigationMap;\n    private NavigationPresentationView navigationPresentation;",
              "Launcher fields"
          )

          # 3. Chuyển root sang FrameLayout
          replace_once(
              "root = new LinearLayout(this);",
              "root = new FrameLayout(this);",
              "Launcher FrameLayout root"
          )

          # 4. Patch LayoutParams của dashboard khi add vào root
          replace_once(
              "root.addView(\n                dashboard,\n                new LinearLayout.LayoutParams(\n                        -1,\n                        -1));",
              "root.addView(\n                dashboard,\n                new FrameLayout.LayoutParams(\n                        -1,\n                        -1));",
              "Patch dashboard LayoutParams to FrameLayout.LayoutParams"
          )

          # 5. Patch LayoutParams của appPanel khi add vào root
          replace_once(
              "root.addView(\n                appPanel,\n                new LinearLayout.LayoutParams(\n                        -1,\n                        -1));",
              "root.addView(\n                appPanel,\n                new FrameLayout.LayoutParams(\n                        -1,\n                        -1));",
              "Patch appPanel LayoutParams to FrameLayout.LayoutParams"
          )

          # 6. Gắn NavigationPresentationView vào root sau cùng (Z-Index nằm trên cùng)
          replace_once(
              "setContentView(root);",
              "navigationMap = new NavigationMapView(this);\n        navigationPresentation = new NavigationPresentationView(this);\n        navigationPresentation.setNavigationMap(navigationMap);\n        root.addView(navigationPresentation, new FrameLayout.LayoutParams(-1, -1));\n        setContentView(root);",
              "Launcher attach Navigation Presentation Layer"
          )

          # 7. Lifecycle management cho Phone
          old_destroy_anchor = "@Override\n    protected void onDestroy() {"
          if old_destroy_anchor not in s:
              old_destroy_anchor = "protected void onDestroy() {"

          new_lifecycle_and_destroy = """@Override
    protected void onResume() {
        super.onResume();
        if (navigationPresentation != null) {
            navigationPresentation.onHostResume();
        }
    }

    @Override
    protected void onPause() {
        if (navigationPresentation != null) {
            navigationPresentation.onHostPause();
        }
        super.onPause();
    }

    @Override
    protected void onDestroy() {
        if (navigationPresentation != null) {
            navigationPresentation.onHostDestroy();
            navigationPresentation = null;
        }
        navigationMap = null;"""

          replace_once(
              old_destroy_anchor,
              new_lifecycle_and_destroy,
              "Launcher complete lifecycle insertion"
          )

          path.write_text(s)
          print("PASS: V10LauncherActivity LayoutParams & Layering patched successfully.")
          PY

      - name: Compile Java source
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac --stacktrace

          echo "PASS: Phase 4 Java compile successful."

      - name: Assemble APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --no-daemon :app:assembleDebug --stacktrace

          echo "PASS: Phase 4 APK assemble successful."

      - name: Verify NavigationMapView SHA immutability
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_NAV_SHA="f65ed2bbce98b443458c5d9d11b07c1099ecb97e6699dd324875f451f4caf163"
          NAV="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          ACTUAL_NAV_SHA="$(sha256sum "$NAV" | awk '{print $1}')"

          if [ "$ACTUAL_NAV_SHA" != "$EXPECTED_NAV_SHA" ]; then
            echo "ERROR: NavigationMapView was unexpectedly modified!"
            exit 1
          fi

          echo "PASS: NavigationMapView remains 100% byte-identical."

      - name: Package APK & Artifact
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find v10-source/app/build/outputs/apk -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK output not found."
            exit 1
          fi

          cp "$APK" CarAssistant-Navigation-Phase4-Full-UI-Host.apk
          sha256sum CarAssistant-Navigation-Phase4-Full-UI-Host.apk > CarAssistant-Navigation-Phase4-Full-UI-Host.sha256

          echo "PASS: Phase 4 APK ready."

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-Navigation-Phase4-Full-UI-Host
          path: |
            CarAssistant-Navigation-Phase4-Full-UI-Host.apk
            CarAssistant-Navigation-Phase4-Full-UI-Host.sha256
          if-no-files-found: error
          retention-days: 14
