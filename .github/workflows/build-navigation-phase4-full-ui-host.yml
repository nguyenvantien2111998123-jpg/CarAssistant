name: Phase 4 Full UI Shared Host

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout immutable Navigation baseline
        uses: actions/checkout@v4
        with:
          ref: d69dc922696a4876dbc1000154ce230b220a0ecd
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify NavigationMapView SHA baseline
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_NAV_SHA="f65ed2bbce98b443458c5d9d11b07c1099ecb97e6699dd324875f451f4caf163"
          NAV="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          test -f "$NAV"
          ACTUAL_NAV_SHA="$(sha256sum "$NAV" | awk '{print $1}')"

          if [ "$ACTUAL_NAV_SHA" != "$EXPECTED_NAV_SHA" ]; then
            echo "ERROR: NavigationMapView baseline SHA mismatch."
            exit 1
          fi

          echo "PASS: NavigationMapView baseline verified."

      - name: Create shared NavigationPresentationView host
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationPresentationView.java"

          cat > "$FILE" <<'JAVA'
          package com.carassistant.v10;

          import android.content.Context;
          import android.graphics.Color;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;

          public final class NavigationPresentationView extends FrameLayout {

              private NavigationMapView navigationMap;

              public NavigationPresentationView(Context context) {
                  super(context);
                  setBackgroundColor(Color.TRANSPARENT);
                  setClipChildren(false);
                  setClipToPadding(false);
              }

              public void setNavigationMap(NavigationMapView map) {
                  if (map == navigationMap) {
                      return;
                  }

                  if (navigationMap != null) {
                      removeView(navigationMap);
                  }

                  navigationMap = map;

                  if (navigationMap == null) {
                      return;
                  }

                  ViewGroup parent = (ViewGroup) navigationMap.getParent();
                  if (parent != null) {
                      parent.removeView(navigationMap);
                  }

                  addView(
                          navigationMap,
                          0,
                          new FrameLayout.LayoutParams(-1, -1));
              }

              public NavigationMapView getNavigationMap() {
                  return navigationMap;
              }

              public void onHostResume() {
                  if (navigationMap != null) {
                      navigationMap.onHostResume();
                  }
              }

              public void onHostPause() {
                  if (navigationMap != null) {
                      navigationMap.onHostPause();
                  }
              }

              public void onHostDestroy() {
                  if (navigationMap != null) {
                      navigationMap.onHostDestroy();
                  }
              }
          }
          JAVA

          echo "PASS: NavigationPresentationView host created."

      - name: Patch V10CarActivity (Android Auto Shared Host)
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java")
          s = path.read_text()

          def replace_smart(old_pattern, new_text, label):
              global s
              lines = [line.strip() for line in s.splitlines() if line.strip()]
              full_clean = " ".join(lines)
              clean_old = " ".join([line.strip() for line in old_pattern.splitlines() if line.strip()])
              
              if clean_old not in full_clean:
                  raise SystemExit(f"ERROR: Target block for '{label}' not found in source.")
              
              if old_pattern in s:
                  s = s.replace(old_pattern, new_text, 1)
              else:
                  import re
                  regex = r"\s*".join(map(re.escape, old_pattern.split()))
                  s, count = re.subn(regex, new_text, s, count=1)
                  if count != 1:
                      raise SystemExit(f"ERROR: Failed to replace '{label}' safely.")

          # 1. Field
          replace_smart(
              "private NavigationMapView navigationMap;",
              "private NavigationMapView navigationMap;\n    private NavigationPresentationView navigationPresentation;",
              "CarActivity field"
          )

          # 2. Host creation
          old_wrapper = "\n".join([
              "navigationMap=new NavigationMapView(this);",
              "root.addView(",
              "        navigationMap,",
              "        new FrameLayout.LayoutParams(-1,-1));"
          ])
          new_wrapper = "\n".join([
              "navigationMap = new NavigationMapView(this);",
              "navigationPresentation = new NavigationPresentationView(this);",
              "navigationPresentation.setNavigationMap(navigationMap);",
              "root.addView(",
              "        navigationPresentation,",
              "        new FrameLayout.LayoutParams(-1,-1));"
          ])
          replace_smart(old_wrapper, new_wrapper, "CarActivity wrapper")

          # 3. Lifecycle
          replace_smart(
              "if (navigationMap != null) navigationMap.onHostResume();",
              "if (navigationPresentation != null) navigationPresentation.onHostResume();",
              "CarActivity resume"
          )

          replace_smart(
              "if (navigationMap != null) navigationMap.onHostPause();",
              "if (navigationPresentation != null) navigationPresentation.onHostPause();",
              "CarActivity pause"
          )

          old_destroy = "if (navigationMap != null) { navigationMap.onHostDestroy(); navigationMap = null; }"
          new_destroy = "\n".join([
              "if (navigationPresentation != null) {",
              "    navigationPresentation.onHostDestroy();",
              "    navigationPresentation = null;",
              "}",
              "navigationMap = null;"
          ])
          replace_smart(old_destroy, new_destroy, "CarActivity destroy")

          path.write_text(s)
          print("PASS: V10CarActivity patched safely.")
          PY

      - name: Patch V10LauncherActivity (Phone FrameLayout & LayoutParams Patch)
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java")
          s = path.read_text()

          # 1. Add FrameLayout import
          if "import android.widget.FrameLayout;" not in s:
              s = s.replace(
                  "import android.widget.LinearLayout;",
                  "import android.widget.LinearLayout;\nimport android.widget.FrameLayout;"
              )

          # 2. Add fields
          s = s.replace(
              "private LinearLayout root;",
              "private FrameLayout root;\n    private NavigationMapView navigationMap;\n    private NavigationPresentationView navigationPresentation;"
          )

          # 3. Change root to FrameLayout & patch LayoutParams
          s = s.replace("root = new LinearLayout(this);", "root = new FrameLayout(this);")
          s = s.replace("root = \n new LinearLayout(this);", "root = new FrameLayout(this);")
          
          s = s.replace("new LinearLayout.LayoutParams(-1, -1)", "new FrameLayout.LayoutParams(-1, -1)")
          s = s.replace("new LinearLayout.LayoutParams(\n -1,\n -1)", "new FrameLayout.LayoutParams(-1, -1)")

          # 4. Attach Navigation Presentation Layer before setContentView
          old_set_content = "setContentView(root);"
          new_set_content = "\n".join([
              "navigationMap = new NavigationMapView(this);",
              "navigationPresentation = new NavigationPresentationView(this);",
              "navigationPresentation.setNavigationMap(navigationMap);",
              "root.addView(navigationPresentation, new FrameLayout.LayoutParams(-1, -1));",
              "setContentView(root);"
          ])
          if old_set_content in s:
              s = s.replace(old_set_content, new_set_content, 1)

          # 5. Lifecycle Management (onResume, onPause, onDestroy)
          old_destroy = "protected void onDestroy() {"
          if "@Override\n    protected void onDestroy() {" in s:
              old_destroy = "@Override\n    protected void onDestroy() {"

          new_lifecycles = "\n".join([
              "@Override",
              "protected void onResume() {",
              "    super.onResume();",
              "    if (navigationPresentation != null) {",
              "        navigationPresentation.onHostResume();",
              "    }",
              "}",
              "",
              "@Override",
              "protected void onPause() {",
              "    if (navigationPresentation != null) {",
              "        navigationPresentation.onHostPause();",
              "    }",
              "    super.onPause();",
              "}",
              "",
              "@Override",
              "protected void onDestroy() {",
              "    if (navigationPresentation != null) {",
              "        navigationPresentation.onHostDestroy();",
              "        navigationPresentation = null;",
              "    }",
              "    navigationMap = null;"
          ])

          s = s.replace(old_destroy, new_lifecycles, 1)

          path.write_text(s)
          print("PASS: V10LauncherActivity patched successfully.")
          PY

      - name: Compile Java source
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac --stacktrace

          echo "PASS: Phase 4 Java compile successful."

      - name: Assemble APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --no-daemon :app:assembleDebug --stacktrace

          echo "PASS: Phase 4 APK assemble successful."

      - name: Verify NavigationMapView SHA immutability
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_NAV_SHA="f65ed2bbce98b443458c5d9d11b07c1099ecb97e6699dd324875f451f4caf163"
          NAV="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          ACTUAL_NAV_SHA="$(sha256sum "$NAV" | awk '{print $1}')"

          if [ "$ACTUAL_NAV_SHA" != "$EXPECTED_NAV_SHA" ]; then
            echo "ERROR: NavigationMapView was unexpectedly modified!"
            exit 1
          fi

          echo "PASS: NavigationMapView remains 100% byte-identical."

      - name: Package APK & Artifact
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find v10-source/app/build/outputs/apk -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK output not found."
            exit 1
          fi

          cp "$APK" CarAssistant-Navigation-Phase4-Full-UI-Host.apk
          sha256sum CarAssistant-Navigation-Phase4-Full-UI-Host.apk > CarAssistant-Navigation-Phase4-Full-UI-Host.sha256

          echo "PASS: Phase 4 APK ready."

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-Navigation-Phase4-Full-UI-Host
          path: |
            CarAssistant-Navigation-Phase4-Full-UI-Host.apk
            CarAssistant-Navigation-Phase4-Full-UI-Host.sha256
          if-no-files-found: error
          retention-days: 14
