name: Phase 4 Android Auto Presentation Host

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      # =========================================================
      # 1. CHECKOUT IMMUTABLE BASELINE
      # =========================================================

      - name: Checkout immutable Navigation baseline
        uses: actions/checkout@v4
        with:
          ref: d69dc922696a4876dbc1000154ce230b220a0ecd
          fetch-depth: 1

      # =========================================================
      # 2. JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # 3. VERIFY BASELINE
      # =========================================================

      - name: Verify immutable baseline
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_COMMIT="d69dc922696a4876dbc1000154ce230b220a0ecd"

          ACTUAL_COMMIT="$(git rev-parse HEAD)"

          if [ "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "ERROR: Wrong baseline commit."
            echo "Expected: $EXPECTED_COMMIT"
            echo "Actual:   $ACTUAL_COMMIT"
            exit 1
          fi

          echo "PASS: Immutable baseline verified."
          echo "Commit: $ACTUAL_COMMIT"

      # =========================================================
      # 4. VERIFY NAVIGATIONMAPVIEW BYTE-IDENTICAL
      # =========================================================

      - name: Verify NavigationMapView baseline SHA
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          EXPECTED_NAV_SHA="f65ed2bbce98b443458c5d9d11b07c1099ecb97e6699dd324875f451f4caf163"

          test -f "$NAV"

          ACTUAL_NAV_SHA="$(sha256sum "$NAV" | awk '{print $1}')"

          echo "Expected NavigationMapView SHA:"
          echo "$EXPECTED_NAV_SHA"

          echo "Actual NavigationMapView SHA:"
          echo "$ACTUAL_NAV_SHA"

          if [ "$ACTUAL_NAV_SHA" != "$EXPECTED_NAV_SHA" ]; then
            echo "ERROR: NavigationMapView baseline SHA mismatch."
            exit 1
          fi

          echo "PASS: NavigationMapView is immutable."

      # =========================================================
      # 5. VERIFY REQUIRED SOURCE FILES
      # =========================================================

      - name: Verify source structure before patch
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          CAR="$SRC/V10CarActivity.java"
          LAUNCHER="$SRC/V10LauncherActivity.java"
          NAV="$SRC/NavigationMapView.java"
          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          test -f "$CAR"
          test -f "$LAUNCHER"
          test -f "$NAV"
          test -f "$MANIFEST"

          echo "PASS: Required source files exist."

          echo ""
          echo "Checking package declarations..."

          grep -Fq \
            "package com.carassistant.v10;" \
            "$CAR"

          grep -Fq \
            "package com.carassistant.v10;" \
            "$LAUNCHER"

          grep -Fq \
            "package com.carassistant.v10;" \
            "$NAV"

          echo "PASS: Package declarations verified."

          echo ""
          echo "Checking AndroidManifest..."

          grep -Fq \
            'com.carassistant.v10.V10LauncherActivity' \
            "$MANIFEST"

          grep -Fq \
            'com.carassistant.v10.V10CarActivity' \
            "$MANIFEST"

          grep -Fq \
            'com.carassistant.v10.AACastCarService' \
            "$MANIFEST"

          grep -Fq \
            'com.google.android.gms.car.category.CATEGORY_PROJECTION' \
            "$MANIFEST"

          grep -Fq \
            'com.google.android.gms.car.category.CATEGORY_PROJECTION_OEM' \
            "$MANIFEST"

          echo "PASS: AndroidManifest verified."

      # =========================================================
      # 6. VERIFY V10CarActivity BASELINE STRUCTURE
      #
      # Do NOT guess replacement strings.
      # These checks validate the exact architecture that the
      # following patch expects.
      # =========================================================

      - name: Validate V10CarActivity baseline structure
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          check_exact() {
            local label="$1"
            local pattern="$2"

            local count

            count="$(
              grep -F \
                "$pattern" \
                "$FILE" \
                | wc -l \
                | tr -d ' '
            )"

            if [ "$count" -lt 1 ]; then
              echo "ERROR: Missing $label"
              echo "Pattern:"
              echo "$pattern"
              exit 1
            fi

            echo "PASS: $label"
          }

          check_exact \
            "V10CarActivity class" \
            "public final class V10CarActivity"

          check_exact \
            "NavigationMapView field" \
            "private NavigationMapView navigationMap;"

          check_exact \
            "onCreate" \
            "public void onCreate("

          check_exact \
            "onResume" \
            "public void onResume()"

          check_exact \
            "buildUi" \
            "private void buildUi()"

          check_exact \
            "NavigationMapView creation" \
            "navigationMap=new NavigationMapView(this);"

          check_exact \
            "NavigationMapView direct root add" \
            "root.addView("

          check_exact \
            "onPause" \
            "public void onPause()"

          check_exact \
            "onDestroy" \
            "public void onDestroy()"

          check_exact \
            "baseline resume delegation" \
            "navigationMap.onHostResume();"

          check_exact \
            "baseline pause delegation" \
            "navigationMap.onHostPause();"

          check_exact \
            "baseline destroy delegation" \
            "navigationMap.onHostDestroy();"

          echo ""
          echo "PASS: V10CarActivity baseline structure matches expected source."

      # =========================================================
      # 7. CREATE NAVIGATION PRESENTATION HOST
      # =========================================================

      - name: Create NavigationPresentationView
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationPresentationView.java"

          if [ -e "$FILE" ]; then
            echo "ERROR: NavigationPresentationView already exists."
            echo "The workflow expects the immutable baseline to have no"
            echo "NavigationPresentationView.java."
            exit 1
          fi

          cat > "$FILE" <<'JAVA'
          package com.carassistant.v10;

          import android.content.Context;
          import android.graphics.Color;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;

          public final class NavigationPresentationView
                  extends FrameLayout {

              private NavigationMapView navigationMap;

              public NavigationPresentationView(
                      Context context) {

                  super(context);

                  setBackgroundColor(
                          Color.TRANSPARENT);

                  setClipChildren(false);
                  setClipToPadding(false);
              }

              public void setNavigationMap(
                      NavigationMapView map) {

                  if (map == navigationMap) {
                      return;
                  }

                  if (navigationMap != null) {
                      removeView(navigationMap);
                  }

                  navigationMap = map;

                  if (navigationMap == null) {
                      return;
                  }

                  ViewGroup parent =
                          (ViewGroup)
                                  navigationMap
                                          .getParent();

                  if (parent != null) {
                      parent.removeView(
                              navigationMap);
                  }

                  addView(
                          navigationMap,
                          0,
                          new FrameLayout.LayoutParams(
                                  -1,
                                  -1));
              }

              public NavigationMapView
                      getNavigationMap() {

                  return navigationMap;
              }

              public void onHostResume() {

                  if (navigationMap != null) {
                      navigationMap
                              .onHostResume();
                  }
              }

              public void onHostPause() {

                  if (navigationMap != null) {
                      navigationMap
                              .onHostPause();
                  }
              }

              public void onHostDestroy() {

                  if (navigationMap != null) {
                      navigationMap
                              .onHostDestroy();
                  }
              }
          }
          JAVA

          test -s "$FILE"

          grep -Fq \
            "public final class NavigationPresentationView" \
            "$FILE"

          grep -Fq \
            "setNavigationMap(" \
            "$FILE"

          grep -Fq \
            "onHostResume()" \
            "$FILE"

          grep -Fq \
            "onHostPause()" \
            "$FILE"

          grep -Fq \
            "onHostDestroy()" \
            "$FILE"

          echo "PASS: NavigationPresentationView created."

      # =========================================================
      # 8. PATCH ONLY V10CarActivity
      #
      # Important:
      # - V10LauncherActivity is NOT modified.
      # - NavigationMapView is NOT modified.
      # - onResume is replaced as a whole using actual method
      #   boundaries from the verified source.
      # =========================================================

      - name: Patch V10CarActivity Presentation Host
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          def require_once(
              source,
              pattern,
              replacement,
              label
          ):
              result, count = re.subn(
                  pattern,
                  replacement,
                  source,
                  count=1,
                  flags=re.MULTILINE | re.DOTALL
              )

              if count != 1:
                  raise RuntimeError(
                      f"{label}: expected exactly one match, got {count}"
                  )

              return result

          def require_literal_once(
              source,
              old,
              new,
              label
          ):
              count = source.count(old)

              if count != 1:
                  raise RuntimeError(
                      f"{label}: expected exactly one match, got {count}"
                  )

              return source.replace(
                  old,
                  new,
                  1
              )

          # -----------------------------------------------------
          # 1. Add Presentation field.
          # -----------------------------------------------------

          field_pattern = (
              r"(^\s*private NavigationMapView navigationMap;\s*$)"
          )

          field_replacement = (
              r"\1\n"
              r"    private NavigationPresentationView "
              r"navigationPresentation;"
          )

          text = require_once(
              text,
              field_pattern,
              field_replacement,
              "NavigationPresentation field"
          )

          # -----------------------------------------------------
          # 2. Replace the exact baseline NavigationMapView
          #    root child inside buildUi().
          # -----------------------------------------------------

          old_map_block = """        navigationMap=new NavigationMapView(this);
                  root.addView(
                          navigationMap,
                          new FrameLayout.LayoutParams(-1,-1));"""

          new_map_block = """        navigationMap = new NavigationMapView(this);

                  navigationPresentation =
                          new NavigationPresentationView(this);

                  navigationPresentation.setNavigationMap(
                          navigationMap);

                  root.addView(
                          navigationPresentation,
                          new FrameLayout.LayoutParams(
                                  -1,
                                  -1));"""

          text = require_literal_once(
              text,
              old_map_block,
              new_map_block,
              "NavigationPresentation root host"
          )

          # -----------------------------------------------------
          # 3. Replace the COMPLETE baseline onResume().
          #
          # This is intentional:
          # navigationPresentation.onHostResume() must NOT remain
          # inside if (root == null).
          # -----------------------------------------------------

          resume_pattern = (
              r"(^\s*@Override\s+"
              r"public void onResume\(\)\s*\{)"
              r"(.*?)"
              r"(^\s*\}\s*\n\s*\n\s*"
              r"private void buildUi\(\))"
          )

          resume_replacement = """    @Override
              public void onResume() {

                  super.onResume();

                  resumed = true;

                  applyChrome();

                  if (root == null) {
                      buildUi();
                      attachProjection();
                  }

                  if (navigationPresentation != null) {
                      navigationPresentation
                              .onHostResume();
                  }

                  loadApps();
                  rebuildDock();

                  handler.removeCallbacks(
                          clockTicker);

                  handler.removeCallbacks(
                          targetPoller);

                  handler.post(clockTicker);
                  handler.post(targetPoller);

                  ComponentName target =
                          V10SessionStore
                                  .getTarget(this);

                  if (target != null) {
                      launchProjection(target);
                  }
              }


              private void buildUi()"""

          text = require_once(
              text,
              resume_pattern,
              resume_replacement,
              "V10CarActivity onResume"
          )

          # -----------------------------------------------------
          # 4. Replace pause delegation.
          # -----------------------------------------------------

          pause_pattern = (
              r"if\s*\(\s*navigationMap\s*!=\s*null\s*\)"
              r"\s*navigationMap\.onHostPause\(\);"
          )

          pause_replacement = """if (navigationPresentation != null) {
                  navigationPresentation
                          .onHostPause();
              }"""

          text = require_once(
              text,
              pause_pattern,
              pause_replacement,
              "V10CarActivity onPause"
          )

          # -----------------------------------------------------
          # 5. Replace destroy delegation.
          # -----------------------------------------------------

          destroy_pattern = (
              r"if\s*\(\s*navigationMap\s*!=\s*null\s*\)\s*\{\s*"
              r"navigationMap\.onHostDestroy\(\);\s*"
              r"navigationMap\s*=\s*null;\s*\}"
          )

          destroy_replacement = """if (navigationPresentation != null) {
                  navigationPresentation
                          .onHostDestroy();
                  navigationPresentation = null;
              }

              navigationMap = null;"""

          text = require_once(
              text,
              destroy_pattern,
              destroy_replacement,
              "V10CarActivity onDestroy"
          )

          # -----------------------------------------------------
          # 6. Write patched source.
          # -----------------------------------------------------

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "PASS: V10CarActivity patched."
          )
          PY

      # =========================================================
      # 9. VERIFY PATCHED ARCHITECTURE
      # =========================================================

      - name: Verify patched Navigation architecture
        shell: bash
        run: |
          set -euo pipefail

          CAR="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          PRESENTATION="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationPresentationView.java"

          check() {
            local label="$1"
            local pattern="$2"
            local file="$3"

            if grep -Fq "$pattern" "$file"; then
              echo "PASS: $label"
            else
              echo "ERROR: $label"
              echo "Missing:"
              echo "$pattern"
              echo "File:"
              echo "$file"
              exit 1
            fi
          }

          echo "Checking PresentationView..."

          check \
            "PresentationView class" \
            "public final class NavigationPresentationView" \
            "$PRESENTATION"

          check \
            "PresentationView setNavigationMap" \
            "setNavigationMap(" \
            "$PRESENTATION"

          check \
            "PresentationView resume" \
            "onHostResume()" \
            "$PRESENTATION"

          check \
            "PresentationView pause" \
            "onHostPause()" \
            "$PRESENTATION"

          check \
            "PresentationView destroy" \
            "onHostDestroy()" \
            "$PRESENTATION"

          echo ""
          echo "Checking V10CarActivity..."

          check \
            "Presentation field" \
            "private NavigationPresentationView navigationPresentation;" \
            "$CAR"

          check \
            "Presentation creation" \
            "navigationPresentation = new NavigationPresentationView(this);" \
            "$CAR"

          check \
            "NavigationMap assigned to Presentation" \
            "navigationPresentation.setNavigationMap(" \
            "$CAR"

          check \
            "Presentation added to root" \
            "navigationPresentation," \
            "$CAR"

          check \
            "Resume delegation" \
            "navigationPresentation" \
            "$CAR"

          check \
            "Pause delegation" \
            "onHostPause()" \
            "$CAR"

          check \
            "Destroy delegation" \
            "onHostDestroy()" \
            "$CAR"

          echo ""
          echo "Checking lifecycle structure..."

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          s = p.read_text(
              encoding="utf-8"
          )

          # Direct lifecycle calls from V10CarActivity must be gone.
          forbidden = [
              "navigationMap.onHostResume();",
              "navigationMap.onHostPause();",
              "navigationMap.onHostDestroy();",
          ]

          for item in forbidden:
              if item in s:
                  raise SystemExit(
                      "ERROR: Direct NavigationMapView lifecycle call remains: "
                      + item
                  )

          # Presentation lifecycle calls must exist.
          required = [
              "navigationPresentation",
              "onHostResume()",
              "onHostPause()",
              "onHostDestroy()",
          ]

          for item in required:
              if item not in s:
                  raise SystemExit(
                      "ERROR: Missing Presentation lifecycle item: "
                      + item
                  )

          # Extract onResume only and verify the Presentation resume
          # is outside the root == null block.
          m = re.search(
              r"public void onResume\(\)\s*\{(.*?)"
              r"\n\s*\}\s*\n\s*\n\s*private void buildUi\(\)",
              s,
              flags=re.S
          )

          if not m:
              raise SystemExit(
                  "ERROR: Could not isolate patched onResume()."
              )

          resume = m.group(1)

          root_match = re.search(
              r"if\s*\(\s*root\s*==\s*null\s*\)\s*\{(.*?)\n\s*\}",
              resume,
              flags=re.S
          )

          if not root_match:
              raise SystemExit(
                  "ERROR: Could not isolate root == null block."
              )

          root_block = root_match.group(1)

          if "navigationPresentation" in root_block:
              raise SystemExit(
                  "ERROR: navigationPresentation lifecycle call "
                  "is still inside root == null."
              )

          if "navigationPresentation" not in resume:
              raise SystemExit(
                  "ERROR: onResume does not delegate to Presentation."
              )

          print(
              "PASS: onHostResume() is outside root == null."
          )
          print(
              "PASS: Direct NavigationMapView lifecycle calls removed."
          )
          print(
              "PASS: Presentation lifecycle architecture verified."
          )
          PY

      # =========================================================
      # 10. VERIFY V10LauncherActivity WAS NOT MODIFIED
      # =========================================================

      - name: Verify V10LauncherActivity untouched
        shell: bash
        run: |
          set -euo pipefail

          LAUNCHER="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"

          git diff -- "$LAUNCHER"

          if [ -n "$(git diff -- "$LAUNCHER")" ]; then
            echo "ERROR: V10LauncherActivity was modified."
            exit 1
          fi

          echo "PASS: V10LauncherActivity remains untouched."

      # =========================================================
      # 11. VERIFY NAVIGATIONMAPVIEW STILL IMMUTABLE
      # =========================================================

      - name: Verify NavigationMapView SHA after patch
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          EXPECTED_NAV_SHA="f65ed2bbce98b443458c5d9d11b07c1099ecb97e6699dd324875f451f4caf163"

          ACTUAL_NAV_SHA="$(sha256sum "$NAV" | awk '{print $1}')"

          if [ "$ACTUAL_NAV_SHA" != "$EXPECTED_NAV_SHA" ]; then
            echo "ERROR: NavigationMapView was modified."
            exit 1
          fi

          echo "PASS: NavigationMapView remains byte-identical."

      # =========================================================
      # 12. SHOW EXACT SOURCE DIFF
      # =========================================================

      - name: Review intended source changes
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "INTENDED SOURCE CHANGES"
          echo "========================================"

          git diff -- \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationPresentationView.java

          echo ""
          echo "========================================"
          echo "CHANGED FILES"
          echo "========================================"

          git status --short

      # =========================================================
      # 13. VERIFY GRADLE CONFIGURATION
      # =========================================================

      - name: Verify Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="v10-source/app/build.gradle"

          test -f "$GRADLE"

          grep -Fq \
            "namespace 'com.carassistant.v10'" \
            "$GRADLE"

          grep -Fq \
            'applicationId "com.carassistant.v10"' \
            "$GRADLE"

          grep -Fq \
            "compileSdk 36" \
            "$GRADLE"

          grep -Fq \
            "minSdk 29" \
            "$GRADLE"

          grep -Fq \
            "targetSdk 36" \
            "$GRADLE"

          grep -Fq \
            "JavaVersion.VERSION_17" \
            "$GRADLE"

          grep -Fq \
            "org.maplibre.gl:android-sdk:11.11.0" \
            "$GRADLE"

          echo "PASS: Gradle configuration verified."

      # =========================================================
      # 14. VERIFY GRADLE WRAPPER
      # =========================================================

      - name: Verify Gradle wrapper
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew

          chmod +x ./gradlew

          ./gradlew --version

          echo "PASS: Gradle wrapper verified."

      # =========================================================
      # 15. COMPILE
      # =========================================================

      - name: Compile Navigation Android Auto host
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            :app:compileDebugJavaWithJavac \
            --stacktrace

          echo "PASS: Java compilation successful."

      # =========================================================
      # 16. ASSEMBLE APK
      # =========================================================

      - name: Assemble Debug APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

          echo "PASS: APK assembly successful."

      # =========================================================
      # 17. LOCATE APK
      # =========================================================

      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find \
              v10-source/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: Generated APK not found."

            find \
              v10-source/app/build/outputs \
              -maxdepth 5 \
              -type f \
              -print || true

            exit 1
          fi

          echo "Generated APK:"
          echo "$APK"

          ls -lh "$APK"

          test -s "$APK"

          echo "PASS: APK exists and is non-empty."

      # =========================================================
      # 18. FINAL NAVIGATIONMAPVIEW IMMUTABILITY CHECK
      # =========================================================

      - name: Final immutable NavigationMapView check
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          EXPECTED_NAV_SHA="f65ed2bbce98b443458c5d9d11b07c1099ecb97e6699dd324875f451f4caf163"

          ACTUAL_NAV_SHA="$(sha256sum "$NAV" | awk '{print $1}')"

          if [ "$ACTUAL_NAV_SHA" != "$EXPECTED_NAV_SHA" ]; then
            echo "ERROR: Final NavigationMapView SHA mismatch."
            exit 1
          fi

          echo "PASS: NavigationMapView remained unchanged through build."

      # =========================================================
      # 19. PACKAGE APK
      # =========================================================

      - name: Package APK artifact
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find \
              v10-source/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          cp \
            "$APK" \
            CarAssistant-V3.2-Navigation-AndroidAuto-Presentation.apk

          sha256sum \
            CarAssistant-V3.2-Navigation-AndroidAuto-Presentation.apk \
            > CarAssistant-V3.2-Navigation-AndroidAuto-Presentation.sha256

          test -s \
            CarAssistant-V3.2-Navigation-AndroidAuto-Presentation.apk

          echo ""
          echo "========================================"
          echo "APK READY"
          echo "========================================"

          ls -lh \
            CarAssistant-V3.2-Navigation-AndroidAuto-Presentation.apk

          echo ""
          echo "SHA256:"
          cat \
            CarAssistant-V3.2-Navigation-AndroidAuto-Presentation.sha256

      # =========================================================
      # 20. UPLOAD ARTIFACT
      # =========================================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
