name: Phase 4 Full UI Shared Host

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout immutable Navigation baseline
        uses: actions/checkout@v4
        with:
          ref: d69dc922696a4876dbc1000154ce230b220a0ecd
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify NavigationMapView SHA baseline
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_NAV_SHA="f65ed2bbce98b443458c5d9d11b07c1099ecb97e6699dd324875f451f4caf163"
          NAV="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          test -f "$NAV"

          ACTUAL_NAV_SHA="$(sha256sum "$NAV" | awk '{print $1}')"

          if [ "$ACTUAL_NAV_SHA" != "$EXPECTED_NAV_SHA" ]; then
            echo "ERROR: NavigationMapView baseline SHA mismatch."
            exit 1
          fi

          echo "PASS: NavigationMapView baseline verified."

      - name: Create shared NavigationPresentationView host
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationPresentationView.java"

          cat > "$FILE" <<'JAVA'
          package com.carassistant.v10;

          import android.content.Context;
          import android.graphics.Color;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;

          public final class NavigationPresentationView
                  extends FrameLayout {

              private NavigationMapView navigationMap;

              public NavigationPresentationView(
                      Context context) {

                  super(context);

                  setBackgroundColor(
                          Color.TRANSPARENT);

                  setClipChildren(false);
                  setClipToPadding(false);
              }

              public void setNavigationMap(
                      NavigationMapView map) {

                  if (map == navigationMap) {
                      return;
                  }

                  if (navigationMap != null) {
                      removeView(navigationMap);
                  }

                  navigationMap = map;

                  if (navigationMap == null) {
                      return;
                  }

                  ViewGroup parent =
                          (ViewGroup)
                                  navigationMap
                                          .getParent();

                  if (parent != null) {
                      parent.removeView(
                              navigationMap);
                  }

                  addView(
                          navigationMap,
                          0,
                          new FrameLayout.LayoutParams(
                                  -1,
                                  -1));
              }

              public NavigationMapView
                      getNavigationMap() {

                  return navigationMap;
              }

              public void onHostResume() {

                  if (navigationMap != null) {
                      navigationMap
                              .onHostResume();
                  }
              }

              public void onHostPause() {

                  if (navigationMap != null) {
                      navigationMap
                              .onHostPause();
                  }
              }

              public void onHostDestroy() {

                  if (navigationMap != null) {
                      navigationMap
                              .onHostDestroy();
                  }
              }
          }
          JAVA

          echo "PASS: Shared NavigationPresentationView created."

      - name: Patch V10CarActivity (Android Auto Shared Host)
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          s = path.read_text()

          def replace_once(
              source,
              pattern,
              replacement,
              label
          ):
              result, count = re.subn(
                  pattern,
                  replacement,
                  source,
                  count=1,
                  flags=re.MULTILINE
              )

              if count != 1:
                  raise SystemExit(
                      f"ERROR: Could not patch {label}."
                  )

              return result

          # --------------------------------------------------
          # 1. Add shared Presentation field.
          # --------------------------------------------------

          s = replace_once(
              s,
              r"(\s*private NavigationMapView navigationMap;)",
              r"\1\n"
              r"    private NavigationPresentationView "
              r"navigationPresentation;",
              "V10CarActivity navigationPresentation field"
          )

          # --------------------------------------------------
          # 2. Replace direct NavigationMapView root child
          #    with NavigationPresentationView host.
          # --------------------------------------------------

          old_block = re.escape(
              """navigationMap=new NavigationMapView(this);
          root.addView(
                  navigationMap,
                  new FrameLayout.LayoutParams(-1,-1));"""
          )

          new_block = """navigationMap = new NavigationMapView(this);
          navigationPresentation =
                  new NavigationPresentationView(this);

          navigationPresentation.setNavigationMap(
                  navigationMap);

          root.addView(
                  navigationPresentation,
                  new FrameLayout.LayoutParams(
                          -1,
                          -1));"""

          s = replace_once(
              s,
              old_block,
              new_block,
              "V10CarActivity NavigationPresentation host"
          )

          # --------------------------------------------------
          # 3. Resume lifecycle.
          # --------------------------------------------------

          s = replace_once(
              s,
              r"if \(navigationMap != null\) "
              r"navigationMap\.onHostResume\(\);",
              """if (navigationPresentation != null) {
                      navigationPresentation
                              .onHostResume();
                  }""",
              "V10CarActivity resume"
          )

          # --------------------------------------------------
          # 4. Pause lifecycle.
          # --------------------------------------------------

          s = replace_once(
              s,
              r"if \(navigationMap != null\) "
              r"navigationMap\.onHostPause\(\);",
              """if (navigationPresentation != null) {
                      navigationPresentation
                              .onHostPause();
                  }""",
              "V10CarActivity pause"
          )

          # --------------------------------------------------
          # 5. Destroy lifecycle.
          # --------------------------------------------------

          old_destroy = (
              "if (navigationMap != null) { "
              "navigationMap.onHostDestroy(); "
              "navigationMap = null; }"
          )

          new_destroy = """if (navigationPresentation != null) {
                  navigationPresentation
                          .onHostDestroy();
                  navigationPresentation = null;
              }

              navigationMap = null;"""

          if old_destroy not in s:
              raise SystemExit(
                  "ERROR: V10CarActivity destroy block "
                  "not found."
              )

          s = s.replace(
              old_destroy,
              new_destroy,
              1
          )

          path.write_text(s)

          print(
              "PASS: V10CarActivity patched with "
              "shared NavigationPresentationView."
          )
          PY

      - name: Patch V10LauncherActivity (Preserve LinearLayout Root)
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"
          )

          s = path.read_text()

          # --------------------------------------------------
          # IMPORTANT ARCHITECTURE RULE
          #
          # Keep the existing Launcher root as:
          #
          #     LinearLayout root
          #
          # Do NOT convert it to FrameLayout.
          #
          # A new FrameLayout contentHost is placed outside
          # the existing root so all existing Launcher
          # LinearLayout.LayoutParams remain valid.
          # --------------------------------------------------

          # --------------------------------------------------
          # 1. Add FrameLayout import.
          # --------------------------------------------------

          if "import android.widget.FrameLayout;" not in s:

              marker = (
                  "import android.widget.LinearLayout;"
              )

              if marker not in s:
                  raise SystemExit(
                      "ERROR: LinearLayout import not found."
                  )

              s = s.replace(
                  marker,
                  marker
                  + "\n"
                  + "import android.widget.FrameLayout;",
                  1
              )

          # --------------------------------------------------
          # 2. Add new fields without changing root type.
          # --------------------------------------------------

          field_marker = (
              "    private LinearLayout root;"
          )

          field_replacement = """    private LinearLayout root;

              private FrameLayout contentHost;

              private NavigationMapView navigationMap;

              private NavigationPresentationView
                      navigationPresentation;"""

          if field_marker not in s:
              raise SystemExit(
                  "ERROR: V10LauncherActivity root field "
                  "not found."
              )

          s = s.replace(
              field_marker,
              field_replacement,
              1
          )

          # --------------------------------------------------
          # 3. Keep the existing root exactly as LinearLayout.
          #
          # No root type conversion.
          # No orientation removal.
          # --------------------------------------------------

          expected_root = """root =
                  new LinearLayout(this);

              root.setOrientation(
                  LinearLayout.VERTICAL);"""

          if expected_root not in s:
              raise SystemExit(
                  "ERROR: V10LauncherActivity existing "
                  "LinearLayout root syntax changed. "
                  "Workflow stopped intentionally."
              )

          # --------------------------------------------------
          # 4. Replace only the final setContentView(root)
          #    with an outer FrameLayout host.
          #
          # Existing dashboard/appPanel remain children
          # of the original LinearLayout root.
          # --------------------------------------------------

          old_set_content = (
              "        setContentView(root);"
          )

          new_set_content = """        navigationMap =
                  new NavigationMapView(this);

              navigationPresentation =
                  new NavigationPresentationView(this);

              navigationPresentation.setNavigationMap(
                      navigationMap);

              contentHost =
                  new FrameLayout(this);

              contentHost.setBackgroundColor(
                      Color.TRANSPARENT);

              contentHost.addView(
                      root,
                      new FrameLayout.LayoutParams(
                              -1,
                              -1));

              contentHost.addView(
                      navigationPresentation,
                      new FrameLayout.LayoutParams(
                              -1,
                              -1));

              setContentView(
                      contentHost);"""

          if old_set_content not in s:
              raise SystemExit(
                  "ERROR: V10LauncherActivity "
                  "setContentView(root) not found."
              )

          s = s.replace(
              old_set_content,
              new_set_content,
              1
          )

          # --------------------------------------------------
          # 5. Add lifecycle forwarding before onDestroy().
          #
          # Baseline has no onResume/onPause.
          # --------------------------------------------------

          destroy_marker = """    @Override
              protected void onDestroy() {"""

          lifecycle_block = """    @Override
              protected void onResume() {

                  super.onResume();

                  if (navigationPresentation != null) {
                      navigationPresentation
                              .onHostResume();
                  }
              }

              @Override
              protected void onPause() {

                  if (navigationPresentation != null) {
                      navigationPresentation
                              .onHostPause();
                  }

                  super.onPause();
              }

              @Override
              protected void onDestroy() {"""

          if destroy_marker not in s:
              raise SystemExit(
                  "ERROR: V10LauncherActivity onDestroy "
                  "marker not found."
              )

          s = s.replace(
              destroy_marker,
              lifecycle_block,
              1
          )

          # --------------------------------------------------
          # 6. Extend existing onDestroy cleanup.
          # --------------------------------------------------

          old_destroy_body = """        handler.removeCallbacks(
                  clockTicker);

              super.onDestroy();"""

          new_destroy_body = """        handler.removeCallbacks(
                  clockTicker);

              if (navigationPresentation != null) {
                  navigationPresentation
                          .onHostDestroy();
                  navigationPresentation = null;
              }

              navigationMap = null;
              contentHost = null;

              super.onDestroy();"""

          if old_destroy_body not in s:
              raise SystemExit(
                  "ERROR: V10LauncherActivity onDestroy "
                  "body not found."
              )

          s = s.replace(
              old_destroy_body,
              new_destroy_body,
              1
          )

          path.write_text(s)

          print(
              "PASS: V10LauncherActivity patched safely."
          )
          print(
              "PASS: Existing LinearLayout root preserved."
          )
          print(
              "PASS: Existing Launcher LayoutParams preserved."
          )
          print(
              "PASS: NavigationPresentationView attached "
              "through outer FrameLayout contentHost."
          )
          PY

      - name: Verify patched architecture before compile
        shell: bash
        run: |
          set -euo pipefail

          LAUNCHER="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"
          CAR="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          echo "Checking V10LauncherActivity..."

          grep -q "private LinearLayout root;" "$LAUNCHER"
          grep -q "root =" "$LAUNCHER"
          grep -q "new LinearLayout(this)" "$LAUNCHER"
          grep -q "root.setOrientation" "$LAUNCHER"
          grep -q "private FrameLayout contentHost;" "$LAUNCHER"
          grep -q "private NavigationMapView navigationMap;" "$LAUNCHER"
          grep -q "NavigationPresentationView" "$LAUNCHER"
          grep -q "contentHost.addView" "$LAUNCHER"
          grep -q "setContentView(" "$LAUNCHER"
          grep -q "protected void onResume()" "$LAUNCHER"
          grep -q "protected void onPause()" "$LAUNCHER"
          grep -q "navigationPresentation.onHostResume()" "$LAUNCHER"
          grep -q "navigationPresentation.onHostPause()" "$LAUNCHER"
          grep -q "navigationPresentation.onHostDestroy()" "$LAUNCHER"

          echo "Checking V10CarActivity..."

          grep -q "private NavigationPresentationView navigationPresentation;" "$CAR"
          grep -q "navigationPresentation = new NavigationPresentationView(this);" "$CAR"
          grep -q "navigationPresentation.setNavigationMap(navigationMap);" "$CAR"
          grep -q "navigationPresentation.onHostResume()" "$CAR"
          grep -q "navigationPresentation.onHostPause()" "$CAR"
          grep -q "navigationPresentation.onHostDestroy()" "$CAR"

          echo "PASS: Shared Presentation architecture verified."

      - name: Compile Java source
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            :app:compileDebugJavaWithJavac \
            --stacktrace

          echo "PASS: Phase 4 Java compile successful."

      - name: Assemble APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

          echo "PASS: Phase 4 APK assemble successful."

      - name: Verify NavigationMapView SHA immutability
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_NAV_SHA="f65ed2bbce98b443458c5d9d11b07c1099ecb97e6699dd324875f451f4caf163"

          NAV="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          ACTUAL_NAV_SHA="$(sha256sum "$NAV" | awk '{print $1}')"

          if [ "$ACTUAL_NAV_SHA" != "$EXPECTED_NAV_SHA" ]; then
            echo "ERROR: NavigationMapView was unexpectedly modified."
            exit 1
          fi

          echo "PASS: NavigationMapView remains 100% byte-identical."

      - name: Package APK & Artifact
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find \
              v10-source/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK output not found."
            exit 1
          fi

          cp \
            "$APK" \
            CarAssistant-Navigation-Phase4-Full-UI-Host.apk

          sha256sum \
            CarAssistant-Navigation-Phase4-Full-UI-Host.apk \
            > CarAssistant-Navigation-Phase4-Full-UI-Host.sha256

          echo "PASS: Phase 4 APK ready."

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-Navigation-Phase4-Full-UI-Host
          path: |
            CarAssistant-Navigation-Phase4-Full-UI-Host.apk
            CarAssistant-Navigation-Phase4-Full-UI-Host.sha256
          if-no-files-found: error
          retention-days: 14
