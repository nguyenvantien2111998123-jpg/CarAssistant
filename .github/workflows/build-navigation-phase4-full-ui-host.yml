name: Phase 4 Android Auto Presentation Host - MAIN SOURCE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      # =========================================================
      # 1. CHECKOUT CURRENT MAIN
      # =========================================================

      - name: Checkout current main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      # =========================================================
      # 2. JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # 3. LOCATE CURRENT MAIN SOURCE
      # =========================================================

      - name: Verify current main source
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          CAR="$SRC/V10CarActivity.java"
          LAUNCHER="$SRC/V10LauncherActivity.java"
          NAV="$SRC/NavigationMapView.java"
          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          test -f "$CAR"
          test -f "$LAUNCHER"
          test -f "$NAV"
          test -f "$MANIFEST"

          echo "========================================"
          echo "CURRENT MAIN"
          echo "========================================"

          git rev-parse HEAD

          echo ""
          echo "Required files:"
          echo "$CAR"
          echo "$LAUNCHER"
          echo "$NAV"
          echo "$MANIFEST"

          echo ""
          echo "PASS: Current main source located."

      # =========================================================
      # 4. VERIFY CURRENT SOURCE STRUCTURE
      #
      # IMPORTANT:
      # This step describes the source that exists on main.
      # It does NOT assume the old presentation architecture.
      # =========================================================

      - name: Inspect current V10 navigation architecture
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          CAR="$SRC/V10CarActivity.java"
          NAV="$SRC/NavigationMapView.java"

          echo "========================================"
          echo "V10CarActivity CURRENT STRUCTURE"
          echo "========================================"

          grep -Fq \
            "public final class V10CarActivity" \
            "$CAR"

          grep -Fq \
            "private NavigationMapView navigationMap;" \
            "$CAR"

          grep -Fq \
            "navigationMap=new NavigationMapView(this);" \
            "$CAR"

          grep -Fq \
            "navigationMap.onHostResume();" \
            "$CAR"

          grep -Fq \
            "navigationMap.onHostPause();" \
            "$CAR"

          grep -Fq \
            "navigationMap.onHostDestroy();" \
            "$CAR"

          echo "PASS: Current main contains the expected direct NavigationMapView host."

          echo ""
          echo "========================================"
          echo "NavigationMapView SHA"
          echo "========================================"

          sha256sum "$NAV"

          echo ""
          echo "PASS: NavigationMapView located."

      # =========================================================
      # 5. VERIFY MANIFEST
      # =========================================================

      - name: Verify AndroidManifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          grep -Fq \
            'com.carassistant.v10.V10LauncherActivity' \
            "$MANIFEST"

          grep -Fq \
            'com.carassistant.v10.V10CarActivity' \
            "$MANIFEST"

          grep -Fq \
            'com.carassistant.v10.AACastCarService' \
            "$MANIFEST"

          grep -Fq \
            'com.google.android.gms.car.category.CATEGORY_PROJECTION' \
            "$MANIFEST"

          grep -Fq \
            'com.google.android.gms.car.category.CATEGORY_PROJECTION_OEM' \
            "$MANIFEST"

          echo "PASS: AndroidManifest verified."

      # =========================================================
      # 6. CREATE PRESENTATION HOST
      #
      # Created from the current main source.
      # NavigationMapView itself is not edited.
      # =========================================================

      - name: Create NavigationPresentationView
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationPresentationView.java"

          if [ -e "$FILE" ]; then
            echo "ERROR: NavigationPresentationView already exists on main."
            echo "The workflow expects this feature to be created from the current source."
            exit 1
          fi

          cat > "$FILE" <<'JAVA'
          package com.carassistant.v10;

          import android.content.Context;
          import android.graphics.Color;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;

          public final class NavigationPresentationView
                  extends FrameLayout {

              private NavigationMapView navigationMap;

              public NavigationPresentationView(
                      Context context) {

                  super(context);

                  setBackgroundColor(
                          Color.TRANSPARENT);

                  setClipChildren(false);
                  setClipToPadding(false);
              }

              public void setNavigationMap(
                      NavigationMapView map) {

                  if (map == navigationMap) {
                      return;
                  }

                  if (navigationMap != null) {
                      removeView(navigationMap);
                  }

                  navigationMap = map;

                  if (navigationMap == null) {
                      return;
                  }

                  ViewGroup parent =
                          (ViewGroup)
                                  navigationMap
                                          .getParent();

                  if (parent != null) {
                      parent.removeView(
                              navigationMap);
                  }

                  addView(
                          navigationMap,
                          0,
                          new FrameLayout.LayoutParams(
                                  -1,
                                  -1));
              }

              public NavigationMapView
                      getNavigationMap() {

                  return navigationMap;
              }

              public void onHostResume() {

                  if (navigationMap != null) {
                      navigationMap
                              .onHostResume();
                  }
              }

              public void onHostPause() {

                  if (navigationMap != null) {
                      navigationMap
                              .onHostPause();
                  }
              }

              public void onHostDestroy() {

                  if (navigationMap != null) {
                      navigationMap
                              .onHostDestroy();
                  }
              }
          }
          JAVA

          test -s "$FILE"

          echo "PASS: NavigationPresentationView created."

      # =========================================================
      # 7. PATCH V10CarActivity FROM CURRENT MAIN STRUCTURE
      #
      # No old commit structure is assumed.
      # =========================================================

      - name: Patch V10CarActivity from current main
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          def replace_once(
              source,
              pattern,
              replacement,
              label
          ):
              result, count = re.subn(
                  pattern,
                  replacement,
                  source,
                  count=1,
                  flags=re.MULTILINE | re.DOTALL
              )

              if count != 1:
                  raise RuntimeError(
                      f"{label}: expected 1 match, got {count}"
                  )

              return result

          # -----------------------------------------------------
          # 1. Add Presentation field immediately after the
          #    existing NavigationMapView field.
          # -----------------------------------------------------

          text = replace_once(
              text,
              r"(^[ \t]*private[ \t]+NavigationMapView[ \t]+navigationMap[ \t]*;[ \t]*$)",
              r"\1\n"
              r"    private NavigationPresentationView "
              r"navigationPresentation;",
              "NavigationPresentation field"
          )

          # -----------------------------------------------------
          # 2. Replace the CURRENT main buildUi() Navigation block.
          #
          # Current main source:
          #
          # navigationMap=new NavigationMapView(this);
          # root.addView(
          #         navigationMap,
          #         new FrameLayout.LayoutParams(-1,-1));
          # -----------------------------------------------------

          old_block = """navigationMap=new NavigationMapView(this);
                  root.addView(
                          navigationMap,
                          new FrameLayout.LayoutParams(-1,-1));"""

          new_block = """navigationMap = new NavigationMapView(this);

                  navigationPresentation =
                          new NavigationPresentationView(this);

                  navigationPresentation.setNavigationMap(
                          navigationMap);

                  root.addView(
                          navigationPresentation,
                          new FrameLayout.LayoutParams(
                                  -1,
                                  -1));"""

          if text.count(old_block) != 1:
              raise RuntimeError(
                  "Current main NavigationMapView creation block "
                  "was not found exactly once."
              )

          text = text.replace(
              old_block,
              new_block,
              1
          )

          # -----------------------------------------------------
          # 3. Move onHostResume() OUTSIDE the root == null block.
          #
          # Current main has:
          #
          # if (root == null) {
          #     buildUi();
          #     attachProjection();
          #
          #     if (navigationMap != null)
          #         navigationMap.onHostResume();
          # }
          #
          # New architecture:
          #
          # if (root == null) {
          #     buildUi();
          #     attachProjection();
          # }
          #
          # if (navigationPresentation != null)
          #     navigationPresentation.onHostResume();
          # -----------------------------------------------------

          old_resume = """        if (root == null) {
            buildUi();
            attachProjection();

          if (navigationMap != null) navigationMap.onHostResume();
          }"""

          new_resume = """        if (root == null) {
            buildUi();
            attachProjection();
          }

          if (navigationPresentation != null) {
            navigationPresentation
                    .onHostResume();
          }"""

          if text.count(old_resume) != 1:
              raise RuntimeError(
                  "Current main onResume() block was not found exactly once."
              )

          text = text.replace(
              old_resume,
              new_resume,
              1
          )

          # -----------------------------------------------------
          # 4. Replace direct pause delegation.
          # -----------------------------------------------------

          pause_old = (
              "if (navigationMap != null) "
              "navigationMap.onHostPause();"
          )

          pause_new = """if (navigationPresentation != null) {
            navigationPresentation
                    .onHostPause();
          }"""

          if text.count(pause_old) != 1:
              raise RuntimeError(
                  "Current main onPause() delegation "
                  "was not found exactly once."
              )

          text = text.replace(
              pause_old,
              pause_new,
              1
          )

          # -----------------------------------------------------
          # 5. Replace direct destroy delegation.
          #
          # Do not assume formatting from an old commit.
          # Find the actual statement in current main.
          # -----------------------------------------------------

          destroy_pattern = (
              r"if\s*\(\s*navigationMap\s*!=\s*null\s*\)"
              r"\s*\{\s*"
              r"navigationMap\s*\.\s*onHostDestroy\s*\(\s*\)\s*;"
              r"\s*navigationMap\s*=\s*null\s*;"
              r"\s*\}"
          )

          destroy_replacement = """if (navigationPresentation != null) {
            navigationPresentation
                    .onHostDestroy();
            navigationPresentation = null;
          }

          navigationMap = null;"""

          text = replace_once(
              text,
              destroy_pattern,
              destroy_replacement,
              "NavigationMapView destroy delegation"
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "PASS: V10CarActivity patched from current main source."
          )
          PY

      # =========================================================
      # 8. VERIFY PATCHED ARCHITECTURE
      #
      # Verification reads the source AFTER patch.
      # =========================================================

      - name: Verify patched Navigation architecture
        shell: bash
        run: |
          set -euo pipefail

          CAR="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          PRESENTATION="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationPresentationView.java"

          test -f "$CAR"
          test -f "$PRESENTATION"

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          car = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          ).read_text(encoding="utf-8")

          presentation = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationPresentationView.java"
          ).read_text(encoding="utf-8")

          def check(
              label,
              pattern,
              source
          ):
              if not re.search(
                  pattern,
                  source,
                  re.MULTILINE | re.DOTALL
              ):
                  print("")
                  print("ERROR:", label)
                  print("Pattern:", pattern)
                  sys.exit(1)

              print("PASS:", label)

          print("========================================")
          print("NavigationPresentationView")
          print("========================================")

          check(
              "Presentation class",
              r"public\s+final\s+class\s+NavigationPresentationView",
              presentation
          )

          check(
              "setNavigationMap",
              r"setNavigationMap\s*\(",
              presentation
          )

          check(
              "Presentation resume",
              r"onHostResume\s*\(",
              presentation
          )

          check(
              "Presentation pause",
              r"onHostPause\s*\(",
              presentation
          )

          check(
              "Presentation destroy",
              r"onHostDestroy\s*\(",
              presentation
          )

          print("")
          print("========================================")
          print("V10CarActivity")
          print("========================================")

          check(
              "Presentation field",
              r"private\s+NavigationPresentationView"
              r"\s+navigationPresentation\s*;",
              car
          )

          check(
              "Presentation creation",
              r"navigationPresentation"
              r"\s*=\s*"
              r"new\s+NavigationPresentationView"
              r"\s*\(\s*this\s*\)\s*;",
              car
          )

          check(
              "NavigationMap assigned to Presentation",
              r"navigationPresentation"
              r"\s*\.\s*setNavigationMap"
              r"\s*\(\s*navigationMap\s*\)\s*;",
              car
          )

          check(
              "Presentation added to root",
              r"root"
              r"\s*\.\s*addView"
              r"\s*\(\s*navigationPresentation\s*,",
              car
          )

          check(
              "Resume delegates to Presentation",
              r"navigationPresentation"
              r"\s*\.\s*onHostResume"
              r"\s*\(\s*\)\s*;",
              car
          )

          check(
              "Pause delegates to Presentation",
              r"navigationPresentation"
              r"\s*\.\s*onHostPause"
              r"\s*\(\s*\)\s*;",
              car
          )

          check(
              "Destroy delegates to Presentation",
              r"navigationPresentation"
              r"\s*\.\s*onHostDestroy"
              r"\s*\(\s*\)\s*;",
              car
          )

          print("")
          print("========================================")
          print("Forbidden direct lifecycle calls")
          print("========================================")

          forbidden = [
              r"navigationMap\s*\.\s*onHostResume\s*\(",
              r"navigationMap\s*\.\s*onHostPause\s*\(",
              r"navigationMap\s*\.\s*onHostDestroy\s*\(",
          ]

          for pattern in forbidden:
              if re.search(
                  pattern,
                  car,
                  re.MULTILINE | re.DOTALL
              ):
                  print(
                      "ERROR: Direct NavigationMapView lifecycle "
                      "call remains:",
                      pattern
                  )
                  sys.exit(1)

          print(
              "PASS: No direct NavigationMapView lifecycle calls remain."
          )

          print("")
          print("========================================")
          print("PASS: Navigation architecture verified")
          print("========================================")
          PY

      # =========================================================
      # 9. VERIFY V10LauncherActivity UNCHANGED
      # =========================================================

      - name: Verify V10LauncherActivity unchanged
        shell: bash
        run: |
          set -euo pipefail

          LAUNCHER="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"

          if [ -n "$(git diff -- "$LAUNCHER")" ]; then
            echo "ERROR: V10LauncherActivity was modified."
            git diff -- "$LAUNCHER"
            exit 1
          fi

          echo "PASS: V10LauncherActivity unchanged."

      # =========================================================
      # 10. VERIFY NAVIGATIONMAPVIEW UNCHANGED
      #
      # IMPORTANT:
      # No hard-coded old commit SHA.
      # We capture the SHA from main BEFORE patching.
      # =========================================================

      - name: Verify NavigationMapView unchanged
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          if [ -n "$(git diff -- "$NAV")" ]; then
            echo "ERROR: NavigationMapView was modified."
            git diff -- "$NAV"
            exit 1
          fi

          echo "PASS: NavigationMapView unchanged."

      # =========================================================
      # 11. SHOW EXACT PATCH
      # =========================================================

      - name: Review generated source patch
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CURRENT MAIN -> GENERATED PATCH"
          echo "========================================"

          git diff -- \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationPresentationView.java

          echo ""
          echo "========================================"
          echo "CHANGED FILES"
          echo "========================================"

          git status --short

      # =========================================================
      # 12. VERIFY GRADLE CONFIGURATION
      # =========================================================

      - name: Verify Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="v10-source/app/build.gradle"

          test -f "$GRADLE"

          grep -Fq \
            "namespace 'com.carassistant.v10'" \
            "$GRADLE"

          grep -Fq \
            'applicationId "com.carassistant.v10"' \
            "$GRADLE"

          grep -Fq \
            "compileSdk 36" \
            "$GRADLE"

          grep -Fq \
            "minSdk 29" \
            "$GRADLE"

          grep -Fq \
            "targetSdk 36" \
            "$GRADLE"

          grep -Fq \
            "JavaVersion.VERSION_17" \
            "$GRADLE"

          grep -Fq \
            "org.maplibre.gl:android-sdk:11.11.0" \
            "$GRADLE"

          echo "PASS: Gradle configuration verified."

      # =========================================================
      # 13. VERIFY GRADLE WRAPPER
      # =========================================================

      - name: Verify Gradle wrapper
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew

          chmod +x ./gradlew

          ./gradlew --version

          echo "PASS: Gradle wrapper verified."

      # =========================================================
      # 14. COMPILE
      # =========================================================

      - name: Compile Navigation Android Auto host
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            :app:compileDebugJavaWithJavac \
            --stacktrace

          echo "PASS: Java compilation successful."

      # =========================================================
      # 15. ASSEMBLE APK
      # =========================================================

      - name: Assemble Debug APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

          echo "PASS: APK assembly successful."

      # =========================================================
      # 16. VERIFY APK
      # =========================================================

      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find \
              v10-source/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: Generated APK not found."

            find \
              v10-source/app/build/outputs \
              -maxdepth 5 \
              -type f \
              -print || true

            exit 1
          fi

          echo "Generated APK:"
          echo "$APK"

          ls -lh "$APK"

          test -s "$APK"

          echo "PASS: APK exists and is non-empty."

      # =========================================================
      # 17. FINAL SOURCE INTEGRITY CHECK
      # =========================================================

      - name: Final source integrity check
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"
          LAUNCHER="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"

          if [ -n "$(git diff -- "$NAV")" ]; then
            echo "ERROR: NavigationMapView changed during build."
            exit 1
          fi

          if [ -n "$(git diff -- "$LAUNCHER")" ]; then
            echo "ERROR: V10LauncherActivity changed during build."
            exit 1
          fi

          echo "PASS: Protected navigation source files remain unchanged."

      # =========================================================
      # 18. PACKAGE APK
      # =========================================================

      - name: Package APK artifact
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find \
              v10-source/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          cp \
            "$APK" \
            CarAssistant-V3.2-Navigation-AndroidAuto-Presentation.apk

          sha256sum \
            CarAssistant-V3.2-Navigation-AndroidAuto-Presentation.apk \
            > CarAssistant-V3.2-Navigation-AndroidAuto-Presentation.sha256

          test -s \
            CarAssistant-V3.2-Navigation-AndroidAuto-Presentation.apk

          echo ""
          echo "========================================"
          echo "APK READY"
          echo "========================================"

          ls -lh \
            CarAssistant-V3.2-Navigation-AndroidAuto-Presentation.apk

          echo ""
          echo "SHA256:"
          cat \
            CarAssistant-V3.2-Navigation-AndroidAuto-Presentation.sha256

      # =========================================================
      # 19. UPLOAD APK
      # =========================================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V3.2-Navigation-AndroidAuto-Presentation
          path: |
            CarAssistant-V3.2-Navigation-AndroidAuto-Presentation.apk
            CarAssistant-V3.2-Navigation-AndroidAuto-Presentation.sha256
          if-no-files-found: error
          retention-days: 14
