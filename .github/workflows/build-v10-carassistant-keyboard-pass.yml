name: CarAsistant Build APK (single manual workflow)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mini-access-engine-build170
      - feature/steering-wheel-key-mapper-build201

permissions:
  contents: read

concurrency:
  group: carassistant-build-manual
  cancel-in-progress: false

jobs:
  build-test-apk:
    name: Unit tests and one APK build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout baseline commit
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run unit tests and build APK once
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Label APK with exact source commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          cp "$APK" "dist/CarAsistant-${SHORT_SHA}.apk"
          sha256sum "dist/CarAsistant-${SHORT_SHA}.apk" > dist/SHA256SUMS.txt
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "run_number=${GITHUB_RUN_NUMBER}"
          } > dist/BUILD_INFO.txt
          cat dist/BUILD_INFO.txt
          cat dist/SHA256SUMS.txt

      - name: Upload the single test APK and build identity
        uses: actions/upload-artifact@v4
        with:
          name: CarAsistant-build-${{ github.run_number }}-${{ github.sha }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14
