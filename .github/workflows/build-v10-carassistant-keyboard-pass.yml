name: CarAssistant V10 Keyboard PASS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 1. VERIFY MAIN SOURCE
      # ============================================================

      - name: Verify main source anchors
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/carassistant/v10"

          test -f "$BASE/V10CarActivity.java"
          test -f "$BASE/V10ProjectionSession.java"
          test -f "$BASE/RootShellSession.java"
          test -f "$BASE/NavigationMapView.java"

          grep -Pq '^\s*(?:(?:public|protected|private)\s+)?V10ProjectionSession\s+session;' "$BASE/V10CarActivity.java"
          grep -Pq 'session\.attachTextureView\(' "$BASE/V10CarActivity.java"
          grep -Pq 'createFloatingTouchKey\(\);' "$BASE/V10CarActivity.java"

          grep -Pq '^\s*(?:(?:public|protected|private)\s+)?void\s+launchProjection\(' "$BASE/V10CarActivity.java"

          grep -Pq '^\s*(?:(?:public|protected|private)\s+)?void\s+returnToLauncher\(\)' "$BASE/V10CarActivity.java"

          grep -Pq '^\s*@Override\s+(?:(?:public|protected|private)\s+)?void\s+onPause\(\)' "$BASE/V10CarActivity.java"

          grep -Pq '^\s*@Override\s+(?:(?:public|protected|private)\s+)?void\s+onStop\(\)' "$BASE/V10CarActivity.java"

          grep -Pq '^\s*@Override\s+(?:(?:public|protected|private)\s+)?void\s+onDestroy\(\)' "$BASE/V10CarActivity.java"

          grep -Pq '^\s*(?:(?:public|protected|private)\s+)?(?:final\s+)?int\s+getDisplayId\(\)' "$BASE/V10ProjectionSession.java"

          grep -Pq '^\s*(?:(?:public|protected|private)\s+)?(?:final\s+)?boolean\s+isActive\(\)' "$BASE/V10ProjectionSession.java"

          grep -Pq '^\s*(?:(?:public|protected|private)\s+)?(?:abstract|final\s+)?class\s+RootShellSession' "$BASE/RootShellSession.java"

          grep -Pq '^\s*(?:(?:public|protected|private)\s+)?(?:abstract|final\s+)?class\s+NavigationMapView' "$BASE/NavigationMapView.java"

          echo "PASS: Main source anchors verified."

      # ============================================================
      # 2. V2A - KEYBOARD UI
      # ============================================================

      - name: Create Keyboard V2A
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/carassistant/v10"

          cat > "$BASE/CarAssistantKeyboard.java" <<'EOF'
          package com.carassistant.v10;

          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.util.Locale;

          public final class CarAssistantKeyboard {

              public interface Action {
                  void text(String value);
                  void key(int keyCode);
              }

              private final FrameLayout host;
              private final Action action;

              private LinearLayout panel;
              private boolean visible;

              public CarAssistantKeyboard(
                      FrameLayout host,
                      Action action) {

                  this.host = host;
                  this.action = action;
              }

              public boolean isVisible() {
                  return visible;
              }

              public void show() {

                  if (panel == null) {

                      panel = buildKeyboard();

                      FrameLayout.LayoutParams p =
                              new FrameLayout.LayoutParams(
                                      -1,
                                      dp(270),
                                      Gravity.BOTTOM);

                      p.setMargins(
                              dp(8),
                              0,
                              dp(8),
                              dp(8));

                      host.addView(panel, p);
                  }

                  panel.setVisibility(View.VISIBLE);
                  panel.bringToFront();

                  visible = true;
              }

              public void hide() {

                  if (panel != null) {
                      panel.setVisibility(View.GONE);
                  }

                  visible = false;
              }

              private LinearLayout buildKeyboard() {

                  LinearLayout root =
                          new LinearLayout(host.getContext());

                  root.setOrientation(
                          LinearLayout.VERTICAL);

                  root.setPadding(
                          dp(8),
                          dp(8),
                          dp(8),
                          dp(8));

                  GradientDrawable bg =
                          new GradientDrawable();

                  bg.setColor(
                          Color.rgb(15, 20, 26));

                  bg.setCornerRadius(dp(18));

                  bg.setStroke(
                          dp(1),
                          Color.rgb(65, 85, 105));

                  root.setBackground(bg);
                  root.setElevation(dp(18));

                  addRow(root, "1234567890");
                  addRow(root, "QWERTYUIOP");
                  addRow(root, "ASDFGHJKL");
                  addRow(root, "ZXCVBNM");

                  LinearLayout bottom =
                          new LinearLayout(host.getContext());

                  bottom.setGravity(Gravity.CENTER);

                  addKey(
                          bottom,
                          "⌫",
                          1.35f,
                          () -> action.key(
                                  KeyEvent.KEYCODE_DEL));

                  addKey(
                          bottom,
                          "SPACE",
                          3.8f,
                          () -> action.key(
                                  KeyEvent.KEYCODE_SPACE));

                  addKey(
                          bottom,
                          "ENTER",
                          1.55f,
                          () -> action.key(
                                  KeyEvent.KEYCODE_ENTER));

                  root.addView(
                          bottom,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1f));

                  return root;
              }

              private void addRow(
                      LinearLayout root,
                      String values) {

                  LinearLayout row =
                          new LinearLayout(
                                  host.getContext());

                  row.setGravity(Gravity.CENTER);

                  for (int i = 0;
                       i < values.length();
                       i++) {

                      final String value =
                              String.valueOf(
                                      values.charAt(i))
                                      .toLowerCase(
                                              Locale.ROOT);

                      addKey(
                              row,
                              String.valueOf(
                                      values.charAt(i)),
                              1f,
                              () -> action.text(value));
                  }

                  root.addView(
                          row,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1f));
              }

              private void addKey(
                      LinearLayout row,
                      String label,
                      float weight,
                      Runnable click) {

                  TextView key =
                          new TextView(
                                  host.getContext());

                  key.setText(label);

                  key.setTextColor(Color.WHITE);

                  key.setTextSize(
                          label.length() > 1
                                  ? 13
                                  : 18);

                  key.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD);

                  key.setGravity(Gravity.CENTER);

                  GradientDrawable bg =
                          new GradientDrawable();

                  bg.setColor(
                          Color.rgb(32, 41, 50));

                  bg.setCornerRadius(dp(11));

                  key.setBackground(bg);

                  key.setOnClickListener(
                          v -> click.run());

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(
                                  0,
                                  -1,
                                  weight);

                  p.setMargins(
                          dp(3),
                          dp(3),
                          dp(3),
                          dp(3));

                  row.addView(key, p);
              }

              private int dp(int value) {

                  return Math.round(
                          value *
                          host.getResources()
                              .getDisplayMetrics()
                              .density);
              }
          }
          EOF

          echo "PASS: V2A keyboard UI created."

      # ============================================================
      # 3. V2B - INPUT BRIDGE
      # ============================================================

      - name: Create Keyboard V2B Input Bridge
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/carassistant/v10"

          cat > "$BASE/CarAssistantInputBridge.java" <<'EOF'
          package com.carassistant.v10;

          import android.util.Log;

          public final class CarAssistantInputBridge {

              private static final String TAG =
                      "CarAssistantInputBridge";

              private final V10ProjectionSession session;

              private final RootShellSession rootShell =
                      new RootShellSession();

              public CarAssistantInputBridge(
                      V10ProjectionSession session) {

                  this.session = session;
              }

              public void text(String value) {

                  if (!session.isActive()
                          || value == null
                          || value.length() == 0) {
                      return;
                  }

                  String safe =
                          value
                                  .replace("\\", "\\\\")
                                  .replace("'", "'\\''")
                                  .replace("\n", "")
                                  .replace("\r", "");

                  String command =
                          "/system/bin/input -d "
                          + session.getDisplayId()
                          + " text '"
                          + safe
                          + "'";

                  run(command);
              }

              public void key(int keyCode) {

                  if (!session.isActive()) {
                      return;
                  }

                  run(
                          "/system/bin/input -d "
                          + session.getDisplayId()
                          + " keyevent "
                          + keyCode);
              }

              private void run(String command) {

                  RootShellSession.EXEC.execute(
                          () -> {

                              try {

                                  rootShell.run(
                                          5,
                                          command);

                              } catch (Throwable t) {

                                  Log.w(
                                          TAG,
                                          "input failed",
                                          t);
                              }
                          });
              }

              public void destroy() {
                  // Lifecycle is controlled by V2C.
              }
          }
          EOF

          echo "PASS: V2B input bridge created."

      # ============================================================
      # 4. V2C - CONTROLLER / LIFECYCLE
      # ============================================================

      - name: Create Keyboard V2C Controller
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/carassistant/v10"

          cat > "$BASE/CarAssistantKeyboardController.java" <<'EOF'
          package com.carassistant.v10;

          import android.os.Handler;
          import android.os.Looper;
          import android.util.Log;
          import android.widget.FrameLayout;

          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public final class CarAssistantKeyboardController {

              private static final String TAG =
                      "CarAssistantKeyboard";

              private static final long POLL_MS =
                      800L;

              private static final Pattern SHOWN =
                      Pattern.compile(
                              "mInputShown\\s*=\\s*(true|false)");

              private final V10ProjectionSession session;

              private final CarAssistantKeyboard keyboard;

              private final CarAssistantInputBridge bridge;

              private final Handler handler =
                      new Handler(
                              Looper.getMainLooper());

              private final RootShellSession stateShell =
                      new RootShellSession();

              private boolean started;

              private boolean lastShown;

              private final Runnable poller =
                      new Runnable() {

                  @Override
                  public void run() {

                      if (!started) {
                          return;
                      }

                      if (!session.isActive()) {

                          keyboard.hide();

                          handler.postDelayed(
                                  this,
                                  POLL_MS);

                          return;
                      }

                      RootShellSession.EXEC.execute(
                              () -> {

                          boolean shown = false;

                          try {

                              String out =
                                      stateShell.run(
                                              3,
                                              "dumpsys input_method "
                                              + "| grep -m 1 "
                                              + "mInputShown || true");

                              Matcher m =
                                      SHOWN.matcher(out);

                              if (m.find()) {

                                  shown =
                                          "true".equalsIgnoreCase(
                                                  m.group(1));
                              }

                          } catch (Throwable t) {

                              Log.w(
                                      TAG,
                                      "IME state failed",
                                      t);
                          }

                          final boolean state =
                                  shown;

                          if (state != lastShown) {

                              lastShown = state;

                              handler.post(
                                      () -> {

                                  if (!started
                                          || !session.isActive()) {

                                      keyboard.hide();

                                      return;
                                  }

                                  if (state) {
                                      keyboard.show();
                                  } else {
                                      keyboard.hide();
                                  }
                              });
                          }

                          if (started) {

                              handler.postDelayed(
                                      this,
                                      POLL_MS);
                          }
                      });
                  }
              };

              public CarAssistantKeyboardController(
                      FrameLayout host,
                      V10ProjectionSession session) {

                  this.session = session;

                  bridge =
                          new CarAssistantInputBridge(
                                  session);

                  keyboard =
                          new CarAssistantKeyboard(
                                  host,
                                  new CarAssistantKeyboard.Action() {

                              @Override
                              public void text(
                                      String value) {

                                  bridge.text(value);
                              }

                              @Override
                              public void key(
                                      int keyCode) {

                                  bridge.key(keyCode);
                              }
                          });
              }

              public void start() {

                  if (started) {
                      return;
                  }

                  started = true;

                  lastShown = false;

                  keyboard.hide();

                  handler.removeCallbacks(
                          poller);

                  handler.post(poller);
              }

              public void stop() {

                  started = false;

                  handler.removeCallbacks(
                          poller);

                  keyboard.hide();
              }

              public void hide() {

                  lastShown = false;

                  keyboard.hide();
              }
          }
          EOF

          echo "PASS: V2C controller created."

      # ============================================================
      # 5. INSPECT ACTUAL SOURCE
      # ============================================================

      - name: Inspect actual V10CarActivity source
        shell: bash
        run: |
          set -euo pipefail

          echo "Current git commit:"
          git rev-parse HEAD

          FILE="v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java"

          test -f "$FILE"

          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java"
          )

          content = path.read_text()

          patterns = {
              "launchProjection":
                  r'(?:(?:public|protected|private)\s+)?void\s+launchProjection\s*\([^)]*\)\s*\{[^}]*\}',

              "returnToLauncher":
                  r'(?:(?:public|protected|private)\s+)?void\s+returnToLauncher\s*\([^)]*\)\s*\{[^}]*\}',

              "showApps":
                  r'(?:(?:public|protected|private)\s+)?void\s+showApps\s*\([^)]*\)\s*\{[^}]*\}',

              "onPause":
                  r'@Override\s+(?:(?:public|protected|private)\s+)?void\s+onPause\s*\([^)]*\)\s*\{[^}]*',

              "onDestroy":
                  r'@Override\s+(?:(?:public|protected|private)\s+)?void\s+onDestroy\s*\([^)]*\)\s*\{[^}]*',
          }

          for name, pattern in patterns.items():

              print(f"=== INSPECT: {name} ===")

              match = re.search(
                  pattern,
                  content,
                  re.DOTALL
              )

              if match:
                  print(match.group(0))
              else:
                  print("NOT FOUND")

              print("=" * 50)
          PY

      # ============================================================
      # 6. PATCH V10CarActivity
      # ============================================================

      - name: Patch V10CarActivity
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import re
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java"
          )

          source = path.read_text()

          def replace_regex_once(
                  pattern,
                  replacement,
                  name):

              global source

              matches = list(
                  re.finditer(
                      pattern,
                      source,
                      re.MULTILINE
                  )
              )

              if len(matches) != 1:

                  raise SystemExit(
                      f"{name}: expected exactly 1 match, "
                      f"got {len(matches)}"
                  )

              source = re.sub(
                  pattern,
                  replacement,
                  source,
                  count=1,
                  flags=re.MULTILINE
              )

          # --------------------------------------------------------
          # Keyboard field
          # --------------------------------------------------------

          replace_regex_once(
              r'(\s*(?:(?:public|protected|private)\s+)?V10ProjectionSession\s+session;)',

              r'\1\n'
              r'    private CarAssistantKeyboardController keyboardController;',

              "keyboard field"
          )

          # --------------------------------------------------------
          # Keyboard initialization
          # --------------------------------------------------------

          replace_regex_once(
              r'(session\.attachTextureView\(\s*textureView\);[\s\n]*createFloatingTouchKey\(\);)',

              r'\1\n\n'
              r'        keyboardController =\n'
              r'                new CarAssistantKeyboardController(\n'
              r'                        projectionLayer,\n'
              r'                        session);\n'
              r'        keyboardController.start();',

              "keyboard initialization"
          )

          # --------------------------------------------------------
          # Hide on launchProjection
          # --------------------------------------------------------

          replace_regex_once(
              r'((?:(?:public|protected|private)\s+)?void\s+launchProjection\s*\([^)]*\)\s*\{)',

              r'\1\n'
              r'        if (keyboardController != null) {\n'
              r'            keyboardController.hide();\n'
              r'        }\n',

              "keyboard hide on projection launch"
          )

          # --------------------------------------------------------
          # Hide on returnToLauncher
          # --------------------------------------------------------

          replace_regex_once(
              r'((?:(?:public|protected|private)\s+)?void\s+returnToLauncher\s*\([^)]*\)\s*\{)',

              r'\1\n'
              r'        if (keyboardController != null) {\n'
              r'            keyboardController.hide();\n'
              r'        }\n',

              "keyboard hide on launcher"
          )

          # --------------------------------------------------------
          # Hide on showApps
          # --------------------------------------------------------

          replace_regex_once(
              r'((?:(?:public|protected|private)\s+)?void\s+showApps\s*\([^)]*\)\s*\{)',

              r'\1\n'
              r'        if (keyboardController != null) {\n'
              r'            keyboardController.hide();\n'
              r'        }\n',

              "keyboard hide on app selector"
          )

          # --------------------------------------------------------
          # FIX:
          # actual source uses:
          #
          # @Override
          # public void onPause()
          #
          # --------------------------------------------------------

          replace_regex_once(
              r'(@Override\s+(?:(?:public|protected|private)\s+)?void\s+onPause\s*\([^)]*\)\s*\{)',

              r'\1\n'
              r'        if (keyboardController != null) {\n'
              r'            keyboardController.hide();\n'
              r'        }\n',

              "keyboard hide on pause"
          )

          # --------------------------------------------------------
          # FIX:
          # actual source uses:
          #
          # @Override
          # public void onDestroy()
          #
          # --------------------------------------------------------

          replace_regex_once(
              r'(@Override\s+(?:(?:public|protected|private)\s+)?void\s+onDestroy\s*\([^)]*\)\s*\{)',

              r'\1\n'
              r'        if (keyboardController != null) {\n'
              r'            keyboardController.stop();\n'
              r'            keyboardController = null;\n'
              r'        }\n',

              "keyboard stop on destroy"
          )

          path.write_text(source)

          print(
              "PASS: V10CarActivity patched."
          )
          PY

      # ============================================================
      # 7. VERIFY KEYBOARD PASS
      # ============================================================

      - name: Verify Keyboard PASS
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/carassistant/v10"

          test -f "$BASE/CarAssistantKeyboard.java"
          test -f "$BASE/CarAssistantInputBridge.java"
          test -f "$BASE/CarAssistantKeyboardController.java"

          # V2A

          grep -Fq \
            'addRow(root, "1234567890");' \
            "$BASE/CarAssistantKeyboard.java"

          grep -Fq \
            'addRow(root, "QWERTYUIOP");' \
            "$BASE/CarAssistantKeyboard.java"

          grep -Fq \
            'addRow(root, "ASDFGHJKL");' \
            "$BASE/CarAssistantKeyboard.java"

          grep -Fq \
            'addRow(root, "ZXCVBNM");' \
            "$BASE/CarAssistantKeyboard.java"

          grep -Fq \
            'KeyEvent.KEYCODE_DEL' \
            "$BASE/CarAssistantKeyboard.java"

          grep -Fq \
            'KeyEvent.KEYCODE_SPACE' \
            "$BASE/CarAssistantKeyboard.java"

          grep -Fq \
            'KeyEvent.KEYCODE_ENTER' \
            "$BASE/CarAssistantKeyboard.java"

          # V2B

          grep -Fq \
            '/system/bin/input -d ' \
            "$BASE/CarAssistantInputBridge.java"

          grep -Fq \
            'session.getDisplayId()' \
            "$BASE/CarAssistantInputBridge.java"

          grep -Fq \
            'RootShellSession.EXEC.execute' \
            "$BASE/CarAssistantInputBridge.java"

          # V2C

          grep -Fq \
            'mInputShown' \
            "$BASE/CarAssistantKeyboardController.java"

          grep -Fq \
            'handler.postDelayed' \
            "$BASE/CarAssistantKeyboardController.java"

          grep -Fq \
            'keyboard.show()' \
            "$BASE/CarAssistantKeyboardController.java"

          grep -Fq \
            'keyboard.hide()' \
            "$BASE/CarAssistantKeyboardController.java"

          # Integration

          grep -Fq \
            'private CarAssistantKeyboardController keyboardController;' \
            "$BASE/V10CarActivity.java"

          grep -Fq \
            'new CarAssistantKeyboardController(' \
            "$BASE/V10CarActivity.java"

          grep -Fq \
            'keyboardController.start();' \
            "$BASE/V10CarActivity.java"

          grep -Fq \
            'keyboardController.stop();' \
            "$BASE/V10CarActivity.java"

          HIDE_COUNT=$(
            grep -o \
              'keyboardController\.hide()' \
              "$BASE/V10CarActivity.java" |
            wc -l
          )

          if [ "$HIDE_COUNT" -lt 4 ]; then

            echo \
              "ERROR: Expected at least 4 keyboardController.hide() calls, found $HIDE_COUNT"

            exit 1
          fi

          # Forbidden architecture checks

          if grep -Fq \
              'InputMethodService' \
              "$BASE/CarAssistantKeyboard.java"; then

            echo \
              "ERROR: Keyboard must not be a system IME."

            exit 1
          fi

          if grep -Fq \
              'InputMethodService' \
              "$BASE/CarAssistantKeyboardController.java"; then

            echo \
              "ERROR: Controller must not be a system IME."

            exit 1
          fi

          if grep -Fq \
              'DisplayHooks' \
              "$BASE/CarAssistantKeyboardController.java"; then

            echo \
              "ERROR: Keyboard must not modify DisplayHooks."

            exit 1
          fi

          if grep -Fq \
              'InputHooks' \
              "$BASE/CarAssistantKeyboardController.java"; then

            echo \
              "ERROR: Keyboard must not modify InputHooks."

            exit 1
          fi

          echo "PASS: V2A"
          echo "PASS: V2B"
          echo "PASS: V2C"
          echo "PASS: Keyboard integration"

      # ============================================================
      # 8. NAVIGATION PROTECTION
      # ============================================================

      - name: Verify Navigation remains untouched
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/carassistant/v10"

          grep -Pq \
            '^\s*(?:(?:public|protected|private)\s+)?(?:abstract|final\s+)?class\s+NavigationMapView' \
            "$BASE/NavigationMapView.java"

          grep -Fq \
            'navigationMap=new NavigationMapView(this);' \
            "$BASE/V10CarActivity.java"

          if grep -Fq \
              'NavigationPresentationView' \
              "$BASE/CarAssistantKeyboard.java"; then

            echo \
              "ERROR: Keyboard references NavigationPresentationView."

            exit 1
          fi

          if grep -Fq \
              'NavigationPresentationView' \
              "$BASE/CarAssistantInputBridge.java"; then

            echo \
              "ERROR: Input bridge references NavigationPresentationView."

            exit 1
          fi

          if grep -Fq \
              'NavigationPresentationView' \
              "$BASE/CarAssistantKeyboardController.java"; then

            echo \
              "ERROR: Controller references NavigationPresentationView."

            exit 1
          fi

          echo "PASS: Navigation boundary."

      # ============================================================
      # 9. BUILD
      # ============================================================

      - name: Assemble Keyboard PASS
        shell: bash
        run: |
          set -euo pipefail

          cd v10-source

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ============================================================
      # 10. PACKAGE APK
      # ============================================================

      - name: Package Keyboard PASS APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          mkdir -p dist

          cp \
            "$APK" \
            "dist/CarAssistant-V10-Keyboard-PASS.apk"

          sha256sum \
