name: CarAsistant Integration Build

on:
  workflow_dispatch:
  push:
    branches:
      - tong-hop/android-box
  pull_request:
    branches:
      - tong-hop/android-box

permissions:
  contents: read

concurrency:
  group: carassistant-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-test-apk:
    name: Unit tests and integration APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact feature-branch commit
        uses: actions/checkout@v4
        with:
          # Pull-request workflows normally check out the synthetic merge commit.
          # Build the PR head itself so BUILD_INFO.commit matches the reviewed source.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run unit tests and build APK once
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Label APK with exact source commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SOURCE_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${SOURCE_SHA:0:7}"
          cp "$APK" "dist/CarAsistant-${SHORT_SHA}.apk"
          sha256sum "dist/CarAsistant-${SHORT_SHA}.apk" > dist/SHA256SUMS.txt
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            echo "commit=${SOURCE_SHA}"
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "event=${GITHUB_EVENT_NAME}"
          } > dist/BUILD_INFO.txt
          cat dist/BUILD_INFO.txt
          cat dist/SHA256SUMS.txt

      - name: Upload integration APK and build identity
        uses: actions/upload-artifact@v4
        with:
          name: CarAsistant-integration-${{ github.run_number }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14
