name: V10 Run 12

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Car Assistant V10 Run 12
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. GRADLE 8.13
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # ============================================================
      # 4. FIND V9 SOURCE ZIP
      # ============================================================

      - name: Find V9 source ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for CarAssistant-V9-Source.zip..."

          ZIP=$(find . -type f \
            -name "CarAssistant-V9-Source.zip" \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "::error::CarAssistant-V9-Source.zip was not found."
            exit 1
          fi

          echo "Found:"
          echo "$ZIP"

          cp "$ZIP" "$RUNNER_TEMP/CarAssistant-V9-Source.zip"

      # ============================================================
      # 5. EXTRACT V9
      # ============================================================

      - name: Extract V9 source
        shell: bash
        run: |
          set -e

          rm -rf v9-unpack
          mkdir -p v9-unpack

          unzip -q \
            "$RUNNER_TEMP/CarAssistant-V9-Source.zip" \
            -d v9-unpack

          echo "V9 source extracted."

          find v9-unpack \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -300

      # ============================================================
      # 6. FIND ANDROID PROJECT
      # ============================================================

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT=""

          while IFS= read -r DIR; do

            if [ -d "$DIR/app" ] && \
               { [ -f "$DIR/settings.gradle" ] || \
                 [ -f "$DIR/settings.gradle.kts" ] || \
                 [ -f "$DIR/build.gradle" ] || \
                 [ -f "$DIR/build.gradle.kts" ]; }; then

              PROJECT="$DIR"
              break

            fi

          done < <(find v9-unpack -type d | sort)

          if [ -z "$PROJECT" ]; then
            echo "::error::Android Gradle project was not found."
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT"

      # ============================================================
      # 7. COPY V9 TO V10
      # ============================================================

      - name: Prepare V10 source
        shell: bash
        run: |
          set -e

          rm -rf v10-source

          cp -a "$PROJECT" v10-source

          echo "V10 source directory created."

      # ============================================================
      # 8. INSPECT AACAST SOURCE
      # ============================================================

      - name: Inspect AACast source
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "AACAST JAVA SOURCE"
          echo "========================================"

          find v10-source/app/src/main/java \
            -type f \
            \( -name "*.java" -o -name "*.kt" \) \
            | sort

          echo
          echo "========================================"
          echo "AACAST REFERENCES"
          echo "========================================"

          grep -R \
            -n \
            -E \
            "CarActivityService|createVirtualDisplay|VirtualDisplay|CarActivity" \
            v10-source/app/src/main/java \
            | head -100 || true

      # ============================================================
      # 9. VERIFY AACAST LIBRARIES
      # ============================================================

      - name: Verify AACast libraries
        shell: bash
        run: |
          set -e

          echo "Checking AACast libraries..."

          JAR=$(find v10-source \
            -type f \
            -name "aasdk-legacy.jar" \
            | head -n 1)

          DEX=$(find v10-source \
            -type f \
            -name "aasdk-legacy.dex" \
            | head -n 1)

          XPOSED=$(find v10-source \
            -type f \
            -name "xposed-api-82.jar" \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "::error::aasdk-legacy.jar not found."
            exit 1
          fi

          if [ -z "$DEX" ]; then
            echo "::error::aasdk-legacy.dex not found."
            exit 1
          fi

          if [ -z "$XPOSED" ]; then
            echo "::error::xposed-api-82.jar not found."
            exit 1
          fi

          echo "aasdk-legacy.jar:"
          echo "$JAR"

          echo "aasdk-legacy.dex:"
          echo "$DEX"

          echo "xposed-api-82.jar:"
          echo "$XPOSED"

      # ============================================================
      # 10. VERIFY AACAST ENGINE
      # ============================================================

      - name: Verify AACast engine
        shell: bash
        run: |
          set -e

          echo "Checking createVirtualDisplay..."

          if ! grep -R \
            -q \
            "createVirtualDisplay" \
            v10-source/app/src/main/java; then

            echo "::error::createVirtualDisplay was not found."
            exit 1
          fi

          echo "Checking CarActivityService..."

          if ! grep -R \
            -q \
            "CarActivityService" \
            v10-source/app/src/main/java; then

            echo "::error::CarActivityService was not found."
            exit 1
          fi

          echo "Checking CarActivity..."

          if ! grep -R \
            -q \
            "CarActivity" \
            v10-source/app/src/main/java; then

            echo "::error::CarActivity was not found."
            exit 1
          fi

          echo "Checking VirtualDisplay..."

          if ! grep -R \
            -q \
            "VirtualDisplay" \
            v10-source/app/src/main/java; then

            echo "::error::VirtualDisplay was not found."
            exit 1
          fi

          echo "AACast engine verification PASSED."

      # ============================================================
      # 11. INSPECT MANIFEST
      # ============================================================

      - name: Inspect AndroidManifest
        shell: bash
        run: |
          set -e

          MANIFEST=$(find v10-source/app/src/main \
            -name "AndroidManifest.xml" \
            | head -n 1)

          if [ -z "$MANIFEST" ]; then
            echo "::error::AndroidManifest.xml was not found."
            exit 1
          fi

          echo "Manifest:"
          echo "----------------------------------------"

          cat "$MANIFEST"

          echo "----------------------------------------"

      # ============================================================
      # 12. GENERATE GRADLE WRAPPER
      # ============================================================

      - name: Generate Gradle wrapper
        working-directory: v10-source
        shell: bash
        run: |
          set -e

          gradle wrapper \
            --gradle-version 8.13 \
            --distribution-type bin

          chmod +x gradlew

          echo "Gradle wrapper generated."

      # ============================================================
      # 13. CLEAN
      # ============================================================

      - name: Clean project
        working-directory: v10-source
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            clean

      # ============================================================
      # 14. BUILD DEBUG
      #
      # V10 Run #12 deliberately builds the untouched V9 engine.
      # We will add the V10 launcher only after this baseline passes.
      # ============================================================

      - name: Build debug APK
        working-directory: v10-source
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ============================================================
      # 15. FIND DEBUG APK
      # ============================================================

      - name: Verify debug APK
        shell: bash
        run: |
          set -e

          APK=$(find v10-source/app/build/outputs/apk \
            -type f \
            -name "*debug*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::Debug APK was not produced."
            exit 1
          fi

          echo "Debug APK:"
          echo "$APK"

          echo
          echo "File:"
          ls -lh "$APK"

          echo
          echo "SHA256:"
          sha256sum "$APK"

          echo "DEBUG_APK=$APK" >> "$GITHUB_ENV"

      # ============================================================
      # 16. BUILD RELEASE
      # ============================================================

      - name: Build release APK
        working-directory: v10-source
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease

      # ============================================================
      # 17. FIND RELEASE APK
      # ============================================================

      - name: Verify release APK
        shell: bash
        run: |
          set -e

          APK=$(find v10-source/app/build/outputs/apk \
            -type f \
            -name "*release*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::Release APK was not produced."
            exit 1
          fi

          echo "Release APK:"
          echo "$APK"

          echo
          echo "File:"
          ls -lh "$APK"

          echo
          echo "SHA256:"
          sha256sum "$APK"

          echo "RELEASE_APK=$APK" >> "$GITHUB_ENV"

      # ============================================================
      # 18. PREPARE ARTIFACT
      # ============================================================

      - name: Prepare artifacts
        shell: bash
        run: |
          set -e

          rm -rf v10-artifacts
          mkdir -p v10-artifacts

          cp "$DEBUG_APK" \
            v10-artifacts/CarAssistant-V10-Run12-debug.apk

          cp "$RELEASE_APK" \
            v10-artifacts/CarAssistant-V10-Run12-release.apk

          sha256sum \
            v10-artifacts/*.apk \
            > v10-artifacts/SHA256SUMS.txt

          echo "Artifacts:"
          ls -lh v10-artifacts

      # ============================================================
      # 19. UPLOAD
      # ============================================================

      - name: Upload V10 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Run12
          path: v10-artifacts
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 20. FINAL
      # ============================================================

      - name: Build completed
        shell: bash
        run: |
          echo "========================================"
          echo "CAR ASSISTANT V10 RUN #12"
          echo "========================================"
          echo "V9 AACast baseline preserved."
          echo "Debug APK: BUILD SUCCESS"
          echo "Release APK: BUILD SUCCESS"
          echo "Artifact: CarAssistant-V10-Run12"
          echo "========================================"
