name: V10 Run 12

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Car Assistant V10 Run 12
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. GRADLE 8.13
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # ============================================================
      # 4. FIND OUTER V9 ZIP
      # ============================================================

      - name: Find V9 source ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for CarAssistant-V9-Source.zip..."

          ZIP=$(find . -type f \
            -name "CarAssistant-V9-Source.zip" \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "::error::CarAssistant-V9-Source.zip was not found."
            exit 1
          fi

          echo "Outer ZIP found:"
          echo "$ZIP"

          cp "$ZIP" \
            "$RUNNER_TEMP/CarAssistant-V9-Source.zip"

      # ============================================================
      # 5. EXTRACT OUTER + INNER ZIP
      # ============================================================

      - name: Extract V9 source
        shell: bash
        run: |
          set -e

          rm -rf v9-unpack
          rm -rf v9-source

          mkdir -p v9-unpack
          mkdir -p v9-source

          echo "========================================"
          echo "EXTRACTING OUTER ZIP"
          echo "========================================"

          unzip -q \
            "$RUNNER_TEMP/CarAssistant-V9-Source.zip" \
            -d v9-unpack

          echo
          echo "Outer ZIP contents:"
          find v9-unpack \
            -maxdepth 4 \
            -type f \
            | sort

          # --------------------------------------------------------
          # The repository contains a ZIP inside the ZIP.
          # --------------------------------------------------------

          INNER_ZIP=$(find v9-unpack \
            -type f \
            -name "CarAssistant-V9-source.zip" \
            | head -n 1)

          if [ -z "$INNER_ZIP" ]; then
            echo "::error::Inner CarAssistant-V9-source.zip was not found."
            exit 1
          fi

          echo
          echo "========================================"
          echo "INNER ZIP FOUND"
          echo "========================================"
          echo "$INNER_ZIP"

          echo
          echo "========================================"
          echo "EXTRACTING INNER ZIP"
          echo "========================================"

          unzip -q \
            "$INNER_ZIP" \
            -d v9-source

          echo
          echo "Real V9 source:"
          find v9-source \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -400

      # ============================================================
      # 6. LOCATE REAL ANDROID PROJECT
      # ============================================================

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT=""

          echo "Searching v9-source for Android project..."

          while IFS= read -r DIR; do

            if [ -d "$DIR/app" ] && \
               { [ -f "$DIR/settings.gradle" ] || \
                 [ -f "$DIR/settings.gradle.kts" ] || \
                 [ -f "$DIR/build.gradle" ] || \
                 [ -f "$DIR/build.gradle.kts" ]; }; then

              PROJECT="$DIR"
              break

            fi

          done < <(find v9-source -type d | sort)

          if [ -z "$PROJECT" ]; then
            echo "::error::Android Gradle project was not found."
            echo
            echo "Directories containing app/:"
            find v9-source \
              -type d \
              -name app \
              -print
            exit 1
          fi

          echo "========================================"
          echo "ANDROID PROJECT FOUND"
          echo "========================================"
          echo "$PROJECT"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      # ============================================================
      # 7. COPY V9 -> V10
      # ============================================================

      - name: Prepare V10 source
        shell: bash
        run: |
          set -e

          rm -rf v10-source

          cp -a "$PROJECT" v10-source

          echo "V10 source prepared."

          echo
          echo "V10 root:"
          ls -la v10-source

      # ============================================================
      # 8. INSPECT JAVA SOURCE
      # ============================================================

      - name: Inspect AACast source
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "AACAST JAVA SOURCE"
          echo "========================================"

          find v10-source/app/src/main/java \
            -type f \
            \( -name "*.java" -o -name "*.kt" \) \
            | sort

          echo
          echo "========================================"
          echo "AACAST REFERENCES"
          echo "========================================"

          grep -R \
            -n \
            -E \
            "CarActivityService|createVirtualDisplay|VirtualDisplay|CarActivity" \
            v10-source/app/src/main/java \
            | head -150 || true

      # ============================================================
      # 9. VERIFY AACAST LIBRARIES
      # ============================================================

      - name: Verify AACast libraries
        shell: bash
        run: |
          set -e

          echo "Checking AACast libraries..."

          JAR=$(find v10-source \
            -type f \
            -name "aasdk-legacy.jar" \
            | head -n 1)

          DEX=$(find v10-source \
            -type f \
            -name "aasdk-legacy.dex" \
            | head -n 1)

          XPOSED=$(find v10-source \
            -type f \
            -name "xposed-api-82.jar" \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "::error::aasdk-legacy.jar not found."
            exit 1
          fi

          if [ -z "$DEX" ]; then
            echo "::error::aasdk-legacy.dex not found."
            exit 1
          fi

          if [ -z "$XPOSED" ]; then
            echo "::error::xposed-api-82.jar not found."
            exit 1
          fi

          echo
          echo "aasdk-legacy.jar:"
          echo "$JAR"

          echo
          echo "aasdk-legacy.dex:"
          echo "$DEX"

          echo
          echo "xposed-api-82.jar:"
          echo "$XPOSED"

          echo
          echo "AACast libraries PASSED."

      # ============================================================
      # 10. VERIFY AACAST ENGINE
      # ============================================================

      - name: Verify AACast engine
        shell: bash
        run: |
          set -e

          echo "Checking createVirtualDisplay..."

          if ! grep -R \
            -q \
            "createVirtualDisplay" \
            v10-source/app/src/main/java; then

            echo "::error::createVirtualDisplay not found."
            exit 1
          fi

          echo "createVirtualDisplay: OK"

          echo "Checking CarActivityService..."

          if ! grep -R \
            -q \
            "CarActivityService" \
            v10-source/app/src/main/java; then

            echo "::error::CarActivityService not found."
            exit 1
          fi

          echo "CarActivityService: OK"

          echo "Checking CarActivity..."

          if ! grep -R \
            -q \
            "CarActivity" \
            v10-source/app/src/main/java; then

            echo "::error::CarActivity not found."
            exit 1
          fi

          echo "CarActivity: OK"

          echo "Checking VirtualDisplay..."

          if ! grep -R \
            -q \
            "VirtualDisplay" \
            v10-source/app/src/main/java; then

            echo "::error::VirtualDisplay not found."
            exit 1
          fi

          echo "VirtualDisplay: OK"

          echo
          echo "========================================"
          echo "AACAST ENGINE VERIFICATION PASSED"
          echo "========================================"

      # ============================================================
      # 11. INSPECT MANIFEST
      # ============================================================

      - name: Inspect AndroidManifest
        shell: bash
        run: |
          set -e

          MANIFEST=$(find v10-source/app/src/main \
            -name "AndroidManifest.xml" \
            | head -n 1)

          if [ -z "$MANIFEST" ]; then
            echo "::error::AndroidManifest.xml not found."
            exit 1
          fi

          echo "========================================"
          echo "ANDROID MANIFEST"
          echo "========================================"

          cat "$MANIFEST"

      # ============================================================
      # 12. GENERATE GRADLE WRAPPER
      # ============================================================

      - name: Generate Gradle wrapper
        working-directory: v10-source
        shell: bash
        run: |
          set -e

          gradle wrapper \
            --gradle-version 8.13 \
            --distribution-type bin

          chmod +x gradlew

          echo "Gradle wrapper generated."

      # ============================================================
      # 13. CLEAN
      # ============================================================

      - name: Clean project
        working-directory: v10-source
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            clean

      # ============================================================
      # 14. BUILD DEBUG
      # ============================================================

      - name: Build debug APK
        working-directory: v10-source
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILDING DEBUG APK"
          echo "========================================"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ============================================================
      # 15. VERIFY DEBUG APK
      # ============================================================

      - name: Verify debug APK
        shell: bash
        run: |
          set -e

          APK=$(find v10-source/app/build/outputs/apk \
            -type f \
            -name "*debug*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::Debug APK was not produced."
            exit 1
          fi

          echo "========================================"
          echo "DEBUG APK"
          echo "========================================"

          echo "$APK"

          echo
          ls -lh "$APK"

          echo
          echo "SHA256:"
          sha256sum "$APK"

          echo "DEBUG_APK=$APK" >> "$GITHUB_ENV"

      # ============================================================
      # 16. BUILD RELEASE
      # ============================================================

      - name: Build release APK
        working-directory: v10-source
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILDING RELEASE APK"
          echo "========================================"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease

      # ============================================================
      # 17. VERIFY RELEASE APK
      # ============================================================

      - name: Verify release APK
        shell: bash
        run: |
          set -e

          APK=$(find v10-source/app/build/outputs/apk \
            -type f \
            -name "*release*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::Release APK was not produced."
            exit 1
          fi

          echo "========================================"
          echo "RELEASE APK"
          echo "========================================"

          echo "$APK"

          echo
          ls -lh "$APK"

          echo
          echo "SHA256:"
          sha256sum "$APK"

          echo "RELEASE_APK=$APK" >> "$GITHUB_ENV"

      # ============================================================
      # 18. PREPARE ARTIFACTS
      # ============================================================

      - name: Prepare V10 artifacts
        shell: bash
        run: |
          set -e

          rm -rf v10-artifacts

          mkdir -p v10-artifacts

          cp "$DEBUG_APK" \
            v10-artifacts/CarAssistant-V10-Run12-debug.apk

          cp "$RELEASE_APK" \
            v10-artifacts/CarAssistant-V10-Run12-release.apk

          sha256sum \
            v10-artifacts/*.apk \
            > v10-artifacts/SHA256SUMS.txt

          echo "========================================"
          echo "ARTIFACTS"
          echo "========================================"

          ls -lh v10-artifacts

      # ============================================================
      # 19. UPLOAD
      # ============================================================

      - name: Upload V10 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Run12
          path: v10-artifacts
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 20. FINAL
      # ============================================================

      - name: Final result
        shell: bash
        run: |
          echo
          echo "========================================"
          echo "CAR ASSISTANT V10 RUN #12"
          echo "========================================"
          echo
          echo "V9 AACast source detected."
          echo "V9 AACast engine verified."
          echo "Debug APK built."
          echo "Release APK built."
          echo "Artifacts uploaded."
          echo
          echo "RUN #12 COMPLETE"
          echo "========================================"
