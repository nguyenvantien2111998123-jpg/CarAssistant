name: CarAssistant V10 - Navigation V1 Core

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout exact Foundation
        uses: actions/checkout@v4
        with:
          ref: 2c814a181d00cde9547a446927ae181e18cb9cbb
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Foundation source
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$SRC/V10CarActivity.java"
          test -f "$SRC/V10ProjectionSession.java"
          test -f "$SRC/V10DisplayController.java"
          test -f "$SRC/V10SurfaceManager.java"
          test -f "$SRC/V10TaskSession.java"
          test -f "$SRC/V10SessionStore.java"

          ACTUAL="$(git rev-parse HEAD)"

          if [ "$ACTUAL" != "2c814a181d00cde9547a446927ae181e18cb9cbb" ]; then
            echo "ERROR: Foundation commit mismatch: $ACTUAL"
            exit 1
          fi

          sha256sum \
            "$SRC/V10ProjectionSession.java" \
            "$SRC/V10DisplayController.java" \
            "$SRC/V10SurfaceManager.java" \
            "$SRC/V10TaskSession.java" \
            "$SRC/V10SessionStore.java" \
            > /tmp/core-before.sha256

          echo "PASS: exact Foundation locked."

      - name: Add MapLibre dependency
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="v10-source/app/build.gradle"

          test -f "$GRADLE"

          if ! grep -Fq "org.maplibre.gl:android-sdk:11.11.0" "$GRADLE"; then
            sed -i '/^[[:space:]]*dependencies[[:space:]]*{/a\    implementation "org.maplibre.gl:android-sdk:11.11.0"' "$GRADLE"
          fi

          grep -Fq "org.maplibre.gl:android-sdk:11.11.0" "$GRADLE"

          echo "PASS: MapLibre 11.11.0."

      - name: Add location permissions
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          if ! grep -Fq "android.permission.ACCESS_FINE_LOCATION" "$MANIFEST"; then
            sed -i '/<manifest/r /dev/stdin' "$MANIFEST" <<'EOF'
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          EOF
          fi

          grep -Fq "android.permission.ACCESS_FINE_LOCATION" "$MANIFEST"
          grep -Fq "android.permission.ACCESS_COARSE_LOCATION" "$MANIFEST"

          echo "PASS: location permissions."

      - name: Create NavigationMapView
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"
          FILE="$SRC/NavigationMapView.java"

          cat > "$FILE" <<'EOF'
          package com.carassistant.v10;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.location.Location;
          import android.os.Bundle;
          import android.widget.FrameLayout;

          import org.maplibre.android.MapLibre;
          import org.maplibre.android.camera.CameraUpdateFactory;
          import org.maplibre.android.geometry.LatLng;
          import org.maplibre.android.location.LocationComponentActivationOptions;
          import org.maplibre.android.location.LocationComponentOptions;
          import org.maplibre.android.maps.MapLibreMap;
          import org.maplibre.android.maps.MapView;
          import org.maplibre.android.maps.UiSettings;

          public final class NavigationMapView extends FrameLayout {

              private static final int LOCATION_REQUEST = 4101;

              private final MapView mapView;
              private MapLibreMap map;

              public NavigationMapView(Context context) {
                  super(context);

                  setBackgroundColor(Color.BLACK);

                  MapLibre.getInstance(
                          context.getApplicationContext());

                  mapView = new MapView(context);

                  mapView.onCreate(new Bundle());

                  addView(
                          mapView,
                          new LayoutParams(
                                  LayoutParams.MATCH_PARENT,
                                  LayoutParams.MATCH_PARENT));

                  mapView.getMapAsync(
                          this::onMapReady);
              }

              private void onMapReady(
                      MapLibreMap readyMap) {

                  map = readyMap;

                  UiSettings ui =
                          map.getUiSettings();

                  ui.setCompassEnabled(false);
                  ui.setZoomGesturesEnabled(true);
                  ui.setScrollGesturesEnabled(true);
                  ui.setRotateGesturesEnabled(true);
                  ui.setTiltGesturesEnabled(false);

                  map.setStyle(
                          "https://tiles.openfreemap.org/styles/liberty",
                          style -> enableLocation());
              }

              private void enableLocation() {

                  if (map == null) {
                      return;
                  }

                  Context context = getContext();

                  if (context == null) {
                      return;
                  }

                  if (context.checkSelfPermission(
                          Manifest.permission.ACCESS_FINE_LOCATION)
                          != PackageManager.PERMISSION_GRANTED) {

                      if (context instanceof Activity) {
                          ((Activity) context).requestPermissions(
                                  new String[]{
                                          Manifest.permission.ACCESS_FINE_LOCATION,
                                          Manifest.permission.ACCESS_COARSE_LOCATION
                                  },
                                  LOCATION_REQUEST);
                      }

                      return;
                  }

                  LocationComponentOptions options =
                          LocationComponentOptions
                                  .builder(context)
                                  .pulseEnabled(true)
                                  .build();

                  LocationComponentActivationOptions activation =
                          LocationComponentActivationOptions
                                  .builder(
                                          context,
                                          map.getStyle())
                                  .locationComponentOptions(options)
                                  .build();

                  map.getLocationComponent()
                          .activateLocationComponent(
                                  activation);

                  map.getLocationComponent()
                          .setLocationComponentEnabled(true);
              }

              public void zoomIn() {

                  if (map == null) {
                      return;
                  }

                  double zoom =
                          map.getCameraPosition().zoom;

                  map.animateCamera(
                          CameraUpdateFactory.zoomTo(
                                  Math.min(
                                          20.0,
                                          zoom + 1.0)),
                          250);
              }

              public void zoomOut() {

                  if (map == null) {
                      return;
                  }

                  double zoom =
                          map.getCameraPosition().zoom;

                  map.animateCamera(
                          CameraUpdateFactory.zoomTo(
                                  Math.max(
                                          1.0,
                                          zoom - 1.0)),
                          250);
              }

              public void recenter() {

                  if (map == null) {
                      return;
                  }

                  try {
                      Location location =
                              map.getLocationComponent()
                                      .getLastKnownLocation();

                      if (location == null) {
                          return;
                      }

                      map.animateCamera(
                              CameraUpdateFactory
                                      .newLatLngZoom(
                                              new LatLng(
                                                      location.getLatitude(),
                                                      location.getLongitude()),
                                              16.0),
                              500);

                  } catch (Exception ignored) {
                  }
              }

              public void onHostResume() {
                  mapView.onResume();
              }

              public void onHostPause() {
                  mapView.onPause();
              }

              public void onHostDestroy() {
                  mapView.onDestroy();
              }
          }
          EOF

          test -f "$FILE"
          grep -Fq "class NavigationMapView" "$FILE"
          grep -Fq "https://tiles.openfreemap.org/styles/liberty" "$FILE"

          echo "PASS: NavigationMapView created."

      - name: Patch V10CarActivity for Navigation only
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          def replace_method(source, signature, replacement):
              start = source.find(signature)

              if start < 0:
                  raise RuntimeError(
                      "Method not found: " + signature
                  )

              brace = source.find("{", start)

              if brace < 0:
                  raise RuntimeError(
                      "Opening brace not found: " + signature
                  )

              depth = 0

              for index in range(brace, len(source)):
                  char = source[index]

                  if char == "{":
                      depth += 1

                  elif char == "}":
                      depth -= 1

                      if depth == 0:
                          return (
                              source[:start]
                              + replacement.rstrip()
                              + "\n"
                              + source[index + 1:]
                          )

              raise RuntimeError(
                  "Closing brace not found: " + signature
              )

          required = [
              "public final class V10CarActivity",
              "private void buildUi()",
              "private void attachProjection()",
              "public void onResume()",
              "public void onPause()",
              "public void onDestroy()",
          ]

          for marker in required:
              if marker not in text:
                  raise RuntimeError(
                      "Foundation marker missing: " + marker
                  )

          if "private NavigationMapView navigationMap;" not in text:
              text = text.replace(
                  "    private FrameLayout root;",
                  "    private FrameLayout root;\n"
                  "    private NavigationMapView navigationMap;",
                  1
              )

          build_ui = r'''    private void buildUi() {

              root =
                      new FrameLayout(this);

              root.setBackgroundColor(
                      Color.TRANSPARENT);

              navigationMap =
                      new NavigationMapView(this);

              root.addView(
                      navigationMap,
                      new FrameLayout.LayoutParams(
                              -1,
                              -1));

              /*
               * Projection Core remains part of V10.
               *
               * Home UI V2 is intentionally NOT created
               * by Navigation V1.
               *
               * The Home UI Overlay will be added later
               * by a separate workflow.
               */
              projectionLayer =
                      new FrameLayout(this);

              projectionLayer.setVisibility(
                      View.GONE);

              root.addView(
                      projectionLayer,
                      new FrameLayout.LayoutParams(
                              -1,
                              -1));

              setContentView(root);
          }
          '''

          text = replace_method(
              text,
              "    private void buildUi()",
              build_ui
          )

          old_resume = """        if (root == null) {
            buildUi();
            attachProjection();
        }
          """

          new_resume = """        if (root == null) {
            buildUi();
            attachProjection();
        }

        if (navigationMap != null) {
            navigationMap.onHostResume();
        }
          """

          if old_resume not in text:
              raise RuntimeError(
                  "Expected onResume block not found."
              )

          text = text.replace(
              old_resume,
              new_resume,
              1
          )

          old_pause = """        handler.removeCallbacks(
                targetPoller);

        super.onPause();
          """

          new_pause = """        handler.removeCallbacks(
                targetPoller);

        if (navigationMap != null) {
            navigationMap.onHostPause();
        }

        super.onPause();
          """

          if old_pause not in text:
              raise RuntimeError(
                  "Expected onPause block not found."
              )

          text = text.replace(
              old_pause,
              new_pause,
              1
          )

          old_destroy = """        if (session != null) {

            session.destroy();

            session = null;
        }

        V10SessionStore
                .clearCurrentActivity(
                        this);
          """

          new_destroy = """        if (navigationMap != null) {
            navigationMap.onHostDestroy();
            navigationMap = null;
        }

        if (session != null) {

            session.destroy();

            session = null;
        }

        V10SessionStore
                .clearCurrentActivity(
                        this);
          """

          if old_destroy not in text:
              raise RuntimeError(
                  "Expected onDestroy block not found."
              )

          text = text.replace(
              old_destroy,
              new_destroy,
              1
          )

          path.write_text(
              text.rstrip() + "\n",
              encoding="utf-8"
          )

          print("PASS: V10CarActivity patched.")
          PY

      - name: Verify Navigation architecture
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"
          ACTIVITY="$SRC/V10CarActivity.java"
          MAP="$SRC/NavigationMapView.java"

          grep -Fq "private NavigationMapView navigationMap;" "$ACTIVITY"
          grep -Fq "navigationMap = new NavigationMapView(this);" "$ACTIVITY"
          grep -Fq "navigationMap.onHostResume();" "$ACTIVITY"
          grep -Fq "navigationMap.onHostPause();" "$ACTIVITY"
          grep -Fq "navigationMap.onHostDestroy();" "$ACTIVITY"

          grep -Fq "private FrameLayout projectionLayer;" "$ACTIVITY"
          grep -Fq "private void attachProjection()" "$ACTIVITY"
          grep -Fq "new V10ProjectionSession(" "$ACTIVITY"

          grep -Fq "class NavigationMapView" "$MAP"
          grep -Fq "https://tiles.openfreemap.org/styles/liberty" "$MAP"

          grep -Fq "org.maplibre.gl:android-sdk:11.11.0" \
            v10-source/app/build.gradle

          echo "PASS: Navigation architecture."

      - name: Verify Home UI is absent from Navigation build
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          text = Path(sys.argv[1]).read_text(
              encoding="utf-8"
          )

          start = text.find(
              "    private void buildUi()"
          )

          if start < 0:
              raise SystemExit(
                  "ERROR: buildUi() not found."
              )

          brace = text.find("{", start)
          depth = 0
          end = -1

          for index in range(brace, len(text)):
              if text[index] == "{":
                  depth += 1
              elif text[index] == "}":
                  depth -= 1
                  if depth == 0:
                      end = index + 1
                      break

          if end < 0:
              raise SystemExit(
                  "ERROR: buildUi() end not found."
              )

          block = text[start:end]

          forbidden = [
              "buildDashboard();",
              "buildAppPanel();",
              "launcherLayer =",
              "dashboard =",
              "appPanel =",
              "dock =",
              "APP CHỌN",
              "TASKS",
              "MEDIA",
              "WYN",
          ]

          for marker in forbidden:
              if marker in block:
                  raise SystemExit(
                      "ERROR: Home UI marker found: "
                      + marker
                  )

          print(
              "PASS: Home UI is not constructed by Navigation V1."
          )
          PY

      - name: Verify protected Projection Core
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          sha256sum \
            "$SRC/V10ProjectionSession.java" \
            "$SRC/V10DisplayController.java" \
            "$SRC/V10SurfaceManager.java" \
            "$SRC/V10TaskSession.java" \
            "$SRC/V10SessionStore.java" \
            > /tmp/core-after.sha256

          diff -u \
            /tmp/core-before.sha256 \
            /tmp/core-after.sha256

          echo "PASS: Projection Core unchanged."

      - name: Validate YAML and source formatting
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          echo "PASS: git diff --check."

      - name: Compile Java
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            :app:compileDebugJavaWithJavac \
            --stacktrace

          echo "PASS: Java compile."

      - name: Assemble APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

          echo "PASS: APK assemble."

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find v10-source/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          cp \
            "$APK" \
            CarAssistant-Navigation-V1-Core.apk

          sha256sum \
            CarAssistant-Navigation-V1-Core.apk \
            > CarAssistant-Navigation-V1-Core.sha256

          echo "PASS: APK packaged."

      - name: Upload Navigation V1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-Navigation-V1-Core
          path: |
            CarAssistant-Navigation-V1-Core.apk
            CarAssistant-Navigation-V1-Core.sha256
          if-no-files-found: error
          retention-days: 14
