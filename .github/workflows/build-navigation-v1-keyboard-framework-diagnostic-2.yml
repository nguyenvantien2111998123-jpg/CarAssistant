name: Keyboard Framework Diagnostic 2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout current main Keyboard baseline
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Keyboard Diagnostic baseline
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source"
          BASE="$SRC/app/src/main/java/com/carassistant/v10"

          check_file_exists() {
            local label="$1"
            local path="$2"
            if [ -e "$path" ]; then
              echo "PASS: $label exists"
            else
              echo "FAIL: $label missing ($path)"
              exit 1
            fi
          }

          check_contains() {
            local label="$1"
            local path="$2"
            local pattern="$3"
            if grep -Fq "$pattern" "$path"; then
              echo "PASS: $label exists"
            else
              echo "FAIL: $label ($pattern missing in $path)"
              echo "--- CURRENT FILE CONTENT START ---"
              cat "$path"
              echo "--- CURRENT FILE CONTENT END ---"
              exit 1
            fi
          }

          check_file_exists "V10 source directory" "$SRC"
          check_file_exists "AACastBridge" "$BASE/aabridge/AACastBridge.java"
          check_file_exists "DisplayHooks" "$BASE/hook/DisplayHooks.java"
          check_file_exists "InputHooks" "$BASE/hook/InputHooks.java"
          check_file_exists "V10DisplayController" "$BASE/V10DisplayController.java"
          check_file_exists "AACastDisplay" "$BASE/AACastDisplay.java"
          check_file_exists "V10Display" "$BASE/V10Display.java"

          check_contains "V10 package declaration" "$BASE/V10DisplayController.java" "package com.carassistant.v10"
          check_contains "system_server branch" "$BASE/aabridge/AACastBridge.java" 'if ("android".equals(packageName))'
          check_contains "DisplayHooks.installDisplayFlags" "$BASE/hook/DisplayHooks.java" "installDisplayFlags"
          check_contains "DisplayHooks.installInputPolicy" "$BASE/hook/DisplayHooks.java" "installInputPolicy"
          check_contains "InputHooks.install" "$BASE/hook/InputHooks.java" "install"

      - name: Create framework runtime fingerprint hook
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/carassistant/v10"
          FILE="$BASE/hook/KeyboardFrameworkDiagnostic2.java"

          cat > "$FILE" <<'JAVA'
          package com.carassistant.v10.hook;

          import android.os.Build;
          import android.view.WindowManager;

          import java.lang.reflect.Field;
          import java.lang.reflect.Method;
          import java.lang.reflect.Modifier;
          import java.util.Arrays;
          import java.util.Comparator;

          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedBridge;
          import de.robv.android.xposed.XposedHelpers;

          /**
           * Keyboard Framework Diagnostic 2.
           *
           * Runtime/API fingerprint only.
           *
           * This class MUST NOT:
           * - change IME policy
           * - change display trust
           * - select an IME
           * - inject input
           * - change hook results
           */
          public final class KeyboardFrameworkDiagnostic2 {

              private static final String TAG =
                      "[CarAssistant][KeyboardDiag2]";

              private static final String V10_PREFIX =
                      "Car Assistant V10 ";

              private static volatile boolean runtimeHookInstalled;

              private KeyboardFrameworkDiagnostic2() {
              }

              public static void install(ClassLoader classLoader) {
                  XposedBridge.log(TAG + " INSTALL_BEGIN");

                  logRuntimeIdentity();
                  fingerprintFramework(classLoader);
                  installDisplayContentObservation(classLoader);
                  installWmsPolicyObservation(classLoader);
                  installImsObservation(classLoader);

                  XposedBridge.log(
                          TAG
                                  + " INSTALL_DONE runtimeHookInstalled="
                                  + runtimeHookInstalled);
              }

              private static void logRuntimeIdentity() {
                  try {
                      XposedBridge.log(
                              TAG
                                      + " BUILD"
                                      + " sdk="
                                      + Build.VERSION.SDK_INT
                                      + " release="
                                      + Build.VERSION.RELEASE
                                      + " incremental="
                                      + Build.VERSION.INCREMENTAL
                                      + " display="
                                      + Build.DISPLAY
                                      + " device="
                                      + Build.DEVICE
                                      + " model="
                                      + Build.MODEL
                                      + " product="
                                      + Build.PRODUCT);

                      XposedBridge.log(
                              TAG
                                      + " DISPLAY_IME_POLICY_CONSTANTS"
                                      + " LOCAL="
                                      + WindowManager.DISPLAY_IME_POLICY_LOCAL
                                      + " FALLBACK="
                                      + WindowManager.DISPLAY_IME_POLICY_FALLBACK_DISPLAY
                                      + " HIDE="
                                      + WindowManager.DISPLAY_IME_POLICY_HIDE);

                  } catch (Throwable t) {
                      XposedBridge.log(
                              TAG
                                      + " ERROR runtime_identity="
                                      + t);
                  }
              }

              private static void fingerprintFramework(
                      ClassLoader classLoader) {

                  fingerprintClass(
                          classLoader,
                          "com.android.server.wm.WindowManagerService",
                          new String[] {
                              "getDisplayImePolicy",
                              "setDisplayImePolicy"
                          });

                  fingerprintClass(
                          classLoader,
                          "com.android.server.wm.DisplayContent",
                          new String[] {
                              "isTrusted",
                              "getImePolicy",
                              "isPrivate",
                              "getDisplayId"
                          });

                  fingerprintClass(
                          classLoader,
                          "com.android.server.wm.DisplayWindowSettings",
                          new String[] {
                              "getImePolicyLocked",
                              "setDisplayImePolicy"
                          });

                  fingerprintClass(
                          classLoader,
                          "com.android.server.inputmethod.InputMethodManagerService",
                          new String[] {
                              "startInputOrWindowGainedFocus",
                              "computeImeDisplayIdForTarget"
                          });
              }

              private static void fingerprintClass(
                      ClassLoader classLoader,
                      String className,
                      String[] interestingNames) {

                  try {
                      Class<?> clazz =
                              XposedHelpers.findClass(
                                      className,
                                      classLoader);

                      XposedBridge.log(
                              TAG
                                      + " CLASS_FOUND "
                                      + className
                                      + " loader="
                                      + String.valueOf(
                                              clazz.getClassLoader()));

                      Method[] methods =
                              clazz.getDeclaredMethods();

                      Arrays.sort(
                              methods,
                              Comparator.comparing(Method::getName));

                      for (String interesting : interestingNames) {
                          int count = 0;

                          for (Method method : methods) {
                              if (!interesting.equals(method.getName())) {
                                  continue;
                              }

                              count++;

                              XposedBridge.log(
                                      TAG
                                              + " METHOD "
                                              + className
                                              + "#"
                                              + methodSignature(method));
                          }

                          if (count == 0) {
                              XposedBridge.log(
                                      TAG
                                              + " METHOD_MISSING "
                                              + className
                                              + "#"
                                              + interesting);
                          }
                      }

                      for (Field field :
                              clazz.getDeclaredFields()) {

                          String name =
                                  field.getName();

                          if (name.contains("Ime")
                                  || name.contains("IME")
                                  || name.contains("ime")
                                  || name.contains("Trusted")
                                  || name.contains("trusted")) {

                              XposedBridge.log(
                                      TAG
                                              + " FIELD "
                                              + className
                                              + "#"
                                              + Modifier.toString(
                                                      field.getModifiers())
                                              + " "
                                              + field.getType().getName()
                                              + " "
                                              + name);
                          }
                      }

                  } catch (Throwable t) {
                      XposedBridge.log(
                              TAG
                                      + " CLASS_ERROR "
                                      + className
                                      + " error="
                                      + t);
                  }
              }

              private static String methodSignature(
                      Method method) {

                  StringBuilder out =
                          new StringBuilder();

                  out.append(
                          Modifier.toString(
                                  method.getModifiers()));

                  out.append(" ")
                          .append(
                                  method.getReturnType()
                                          .getName())
                          .append(" ")
                          .append(method.getName())
                          .append("(");

                  Class<?>[] params =
                          method.getParameterTypes();

                  for (int i = 0;
                          i < params.length;
                          i++) {

                      if (i > 0) {
                          out.append(", ");
                      }

                      out.append(
                              params[i].getName());
                  }

                  out.append(")");

                  return out.toString();
              }

              private static void
              installDisplayContentObservation(
                      ClassLoader classLoader) {

                  try {
                      final Class<?> displayContent =
                              XposedHelpers.findClass(
                                      "com.android.server.wm.DisplayContent",
                                      classLoader);

                      final Method imePolicy =
                              findNoArgMethod(
                                      displayContent,
                                      "getImePolicy");

                      final Method trusted =
                              findNoArgMethod(
                                      displayContent,
                                      "isTrusted");

                      if (imePolicy == null) {
                          XposedBridge.log(
                                  TAG
                                          + " OBSERVE_MISSING "
                                          + "DisplayContent#getImePolicy");
                          return;
                      }

                      XposedBridge.hookMethod(
                              imePolicy,
                              new XC_MethodHook() {

                                  @Override
                                  protected void afterHookedMethod(
                                          MethodHookParam param) {

                                      logDisplayContentState(
                                              param.thisObject,
                                              trusted,
                                              param.getResult());
                                  }
                              });

                      runtimeHookInstalled = true;

                      XposedBridge.log(
                              TAG
                                      + " OBSERVE_HOOKED "
                                      + "DisplayContent#getImePolicy");

                  } catch (Throwable t) {
                      XposedBridge.log(
                              TAG
                                      + " OBSERVE_ERROR "
                                      + "DisplayContent#getImePolicy "
                                      + "error="
                                      + t);
                  }
              }

              private static void
              logDisplayContentState(
                      Object displayContent,
                      Method trustedMethod,
                      Object imePolicy) {

                  try {
                      int displayId =
                              readIntMethod(
                                      displayContent,
                                      "getDisplayId",
                                      -1);

                      boolean trustedValue = false;

                      if (trustedMethod != null) {
                          Object result =
                                  trustedMethod.invoke(
                                          displayContent);

                          if (result instanceof Boolean) {
                              trustedValue =
                                      (Boolean) result;
                          }
                      }

                      Object displayInfo =
                              readField(
                                      displayContent,
                                      "mDisplayInfo");

                      String displayName =
                              readStringField(
                                      displayInfo,
                                      "name");

                      String uniqueId =
                              readStringField(
                                      displayInfo,
                                      "uniqueId");

                      int flags =
                              readIntField(
                                      displayInfo,
                                      "flags",
                                      -1);

                      int type =
                              readIntField(
                                      displayInfo,
                                      "type",
                                      -1);

                      int ownerUid =
                              readIntField(
                                      displayInfo,
                                      "ownerUid",
                                      -1);

                      String ownerPackage =
                              readStringField(
                                      displayInfo,
                                      "ownerPackageName");

                      if (displayId >= 0
                              && (displayId == 0
                                  || (displayName != null
                                      && displayName.startsWith(
                                              V10_PREFIX)))) {

                          XposedBridge.log(
                                  TAG
                                          + " DISPLAY_STATE"
                                          + " id="
                                          + displayId
                                          + " name="
                                          + displayName
                                          + " uniqueId="
                                          + uniqueId
                                          + " type="
                                          + type
                                          + " ownerUid="
                                          + ownerUid
                                          + " ownerPackage="
                                          + ownerPackage
                                          + " flags=0x"
                                          + Integer.toHexString(flags)
                                          + " trusted="
                                          + trustedValue
                                          + " imePolicy="
                                          + String.valueOf(
                                                  imePolicy));
                      }

                  } catch (Throwable t) {
                      XposedBridge.log(
                              TAG
                                      + " DISPLAY_STATE_ERROR "
                                      + t);
                  }
              }

              private static void
              installWmsPolicyObservation(
                      ClassLoader classLoader) {

                  try {
                      final Class<?> wms =
                              XposedHelpers.findClass(
                                      "com.android.server.wm.WindowManagerService",
                                      classLoader);

                      Method getter =
                              findMethod(
                                      wms,
                                      "getDisplayImePolicy",
                                      int.class);

                      Method setter =
                              findMethod(
                                      wms,
                                      "setDisplayImePolicy",
                                      int.class,
                                      int.class);

                      if (getter != null) {
                          XposedBridge.hookMethod(
                                  getter,
                                  new XC_MethodHook() {

                                      @Override
                                      protected void afterHookedMethod(
                                              MethodHookParam param) {

                                          XposedBridge.log(
                                                  TAG
                                                          + " WMS_GET_IME_POLICY"
                                                          + " displayId="
                                                          + String.valueOf(
                                                                  param.args[0])
                                                          + " result="
                                                          + String.valueOf(
                                                                  param.getResult()));
                                      }
                                  });
                      }

                      if (setter != null) {
                          XposedBridge.hookMethod(
                                  setter,
                                  new XC_MethodHook() {

                                      @Override
                                      protected void beforeHookedMethod(
                                              MethodHookParam param) {

                                          XposedBridge.log(
                                                  TAG
                                                          + " WMS_SET_IME_POLICY_ATTEMPT"
                                                          + " displayId="
                                                          + String.valueOf(
                                                                  param.args[0])
                                                          + " policy="
                                                          + String.valueOf(
                                                                  param.args[1]));
                                      }
                                  });
                      }

                      XposedBridge.log(
                              TAG
                                      + " WMS_OBSERVATION"
                                      + " getter="
                                      + (getter != null)
                                      + " setter="
                                      + (setter != null));

                  } catch (Throwable t) {
                      XposedBridge.log(
                              TAG
                                      + " WMS_OBSERVE_ERROR "
                                      + t);
                  }
              }

              private static void
              installImsObservation(
                      ClassLoader classLoader) {

                  try {
                      final Class<?> ims =
                              XposedHelpers.findClass(
                                      "com.android.server.inputmethod.InputMethodManagerService",
                                      classLoader);

                      int count = 0;

                      for (Method method :
                              ims.getDeclaredMethods()) {

                          if (!"startInputOrWindowGainedFocus"
                                  .equals(method.getName())) {
                              continue;
                          }

                          count++;

                          final String signature =
                                  methodSignature(method);

                          XposedBridge.hookMethod(
                                  method,
                                  new XC_MethodHook() {

                                      @Override
                                      protected void beforeHookedMethod(
                                              MethodHookParam param) {

                                          XposedBridge.log(
                                                  TAG
                                                          + " IMS_START_INPUT"
                                                          + " sig="
                                                          + signature
                                                          + " argTypes="
                                                          + argumentTypes(
                                                                  param.args));
                                      }
                                  });
                      }

                      XposedBridge.log(
                              TAG
                                      + " IMS_OBSERVATION"
                                      + " startInputMethods="
                                      + count);

                  } catch (Throwable t) {
                      XposedBridge.log(
                              TAG
                                      + " IMS_OBSERVE_ERROR "
                                      + t);
                  }
              }

              private static Method findNoArgMethod(
                      Class<?> clazz,
                      String name) {

                  for (Method method :
                          clazz.getDeclaredMethods()) {

                      if (name.equals(method.getName())
                              && method.getParameterTypes()
                                      .length == 0) {

                          return method;
                      }
                  }

                  return null;
              }

              private static Method findMethod(
                      Class<?> clazz,
                      String name,
                      Class<?>... params) {

                  for (Method method :
                          clazz.getDeclaredMethods()) {

                      if (!name.equals(method.getName())) {
                          continue;
                      }

                      if (Arrays.equals(
                              method.getParameterTypes(),
                              params)) {

                          return method;
                      }
                  }

                  return null;
              }

              private static int readIntMethod(
                      Object target,
                      String methodName,
                      int fallback) {

                  try {
                      Method method =
                              target.getClass()
                                      .getDeclaredMethod(
                                              methodName);

                      method.setAccessible(true);

                      Object result =
                              method.invoke(target);

                      return result instanceof Integer
                              ? (Integer) result
                              : fallback;

                  } catch (Throwable ignored) {
                      return fallback;
                  }
              }

              private static Object readField(
                      Object target,
                      String fieldName) {

                  if (target == null) {
                      return null;
                  }

                  try {
                      Field field =
                              target.getClass()
                                      .getDeclaredField(
                                              fieldName);

                      field.setAccessible(true);

                      return field.get(target);

                  } catch (Throwable ignored) {
                      return null;
                  }
              }

              private static int readIntField(
                      Object target,
                      String fieldName,
                      int fallback) {

                  Object value =
                          readField(
                                  target,
                                  fieldName);

                  return value instanceof Integer
                          ? (Integer) value
                          : fallback;
              }

              private static String readStringField(
                      Object target,
                      String fieldName) {

                  Object value =
                          readField(
                                  target,
                                  fieldName);

                  return value != null
                          ? String.valueOf(value)
                          : "null";
              }

              private static String argumentTypes(
                      Object[] args) {

                  if (args == null) {
                      return "[]";
                  }

                  StringBuilder out =
                          new StringBuilder("[");

                  for (int i = 0;
                          i < args.length;
                          i++) {

                      if (i > 0) {
                          out.append(", ");
                      }

                      Object arg = args[i];

                      out.append(i)
                              .append(":");

                      out.append(
                              arg == null
                                      ? "null"
                                      : arg.getClass()
                                              .getName());
                  }

                  out.append("]");

                  return out.toString();
              }
          }
          JAVA

          if [ -f "$FILE" ]; then
            echo "PASS: Diagnostic 2 source created"
          else
            echo "FAIL: Failed to create Diagnostic 2 source file ($FILE)"
            exit 1
          fi

      - name: Check Java Diagnostic 2 syntax / braces
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/hook/KeyboardFrameworkDiagnostic2.java"

          python3 - "$FILE" <<'PY'
          import sys

          with open(sys.argv[1], 'r', encoding='utf-8') as f:
              code = f.read()

          open_b = code.count('{')
          close_b = code.count('}')

          if open_b != close_b:
              print(f"FAIL: Unbalanced braces. '{open_b}' vs '{close_b}'", file=sys.stderr)
              sys.exit(1)

          try_cnt = code.count('try {')
          catch_cnt = code.count('catch (')
          if try_cnt != catch_cnt:
              print(f"FAIL: Unbalanced try/catch. Try: {try_cnt}, Catch: {catch_cnt}", file=sys.stderr)
              sys.exit(1)

          print("PASS: Java syntax balance check passed.")
          PY

      - name: Patch AACastBridge for Diagnostic 2
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/aabridge/AACastBridge.java"

          python3 - "$FILE" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          imp = (
              "import com.carassistant.v10.hook."
              "KeyboardFrameworkDiagnostic2;\n"
          )

          marker = (
              "import com.carassistant.v10.hook.InputHooks;\n"
          )

          if imp not in text:
              if marker not in text:
                  print("FAIL: InputHooks import marker not found in AACastBridge.java", file=sys.stderr)
                  sys.exit(1)

              text = text.replace(
                  marker,
                  marker + imp,
                  1
              )

          install = (
              "            "
              "KeyboardFrameworkDiagnostic2.install("
              "param.classLoader);\n"
          )

          marker2 = (
              "            "
              "InputHooks.install(param.classLoader);\n"
          )

          if install not in text:
              if marker2 not in text:
                  print("FAIL: InputHooks install marker not found in AACastBridge.java", file=sys.stderr)
                  sys.exit(1)

              text = text.replace(
                  marker2,
                  marker2 + install,
                  1
              )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "PASS: AACastBridge patched for Diagnostic 2."
          )
          PY

      - name: Verify Diagnostic 2 is observation-only
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/carassistant/v10"
          FILE="$BASE/hook/KeyboardFrameworkDiagnostic2.java"

          if grep -Fq 'KeyboardFrameworkDiagnostic2' "$BASE/aabridge/AACastBridge.java"; then
            echo "PASS: AACastBridge references KeyboardFrameworkDiagnostic2"
          else
            echo "FAIL: AACastBridge missing KeyboardFrameworkDiagnostic2 reference"
            exit 1
          fi

          if grep -Fq 'setResult(' "$FILE"; then
            echo "FAIL: Diagnostic 2 mutates a hook result."
            exit 1
          fi

          if grep -Fq 'selectInputMethod' "$FILE"; then
            echo "FAIL: IME selection detected."
            exit 1
          fi

          if grep -Fq 'injectInputEvent' "$FILE"; then
            echo "FAIL: Input injection detected."
            exit 1
          fi

          echo "PASS: Diagnostic 2 is observation-only."

      - name: Verify only intended diagnostic source changes
        shell: bash
        run: |
          set -euo pipefail

          git status --short
          git diff --name-only

          if git diff --name-only | grep -Fxq \
            "v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"; then
            echo "FAIL: NavigationMapView was modified."
            exit 1
          fi

          if git diff --name-only | grep -Fxq \
            "v10-source/app/src/main/java/com/carassistant/v10/V10DisplayController.java"; then
            echo "FAIL: V10DisplayController was modified."
            exit 1
          fi

          echo "PASS: Projection/Navigation source remains untouched."

      - name: Compile Diagnostic 2
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            :app:compileDebugJavaWithJavac \
            --stacktrace

          echo "PASS: Java compile."

      - name: Assemble Diagnostic 2 APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

          echo "PASS: APK assemble."

      - name: Package Diagnostic 2 APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find v10-source/app/build/outputs/apk \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          if [ -n "$APK" ] && [ -s "$APK" ]; then
            echo "PASS: APK generated at $APK"
          else
            echo "FAIL: APK file not found or empty"
            exit 1
          fi

          cp "$APK" \
            CarAssistant-Navigation-V1-Keyboard-Framework-Diagnostic-2.apk

          sha256sum \
            CarAssistant-Navigation-V1-Keyboard-Framework-Diagnostic-2.apk \
            > CarAssistant-Navigation-V1-Keyboard-Framework-Diagnostic-2.sha256

          echo "APK:"
          ls -lh \
            CarAssistant-Navigation-V1-Keyboard-Framework-Diagnostic-2.apk

          echo "SHA256:"
          cat \
            CarAssistant-Navigation-V1-Keyboard-Framework-Diagnostic-2.sha256

      - name: Upload Diagnostic 2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: navigation-v1-keyboard-framework-diagnostic-2
          path: |
            CarAssistant-Navigation-V1-Keyboard-Framework-Diagnostic-2.apk
            CarAssistant-Navigation-V1-Keyboard-Framework-Diagnostic-2.sha256
          if-no-files-found: error
          retention-days: 14
