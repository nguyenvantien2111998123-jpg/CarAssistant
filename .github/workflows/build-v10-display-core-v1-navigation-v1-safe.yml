name: Build V10 Display Core V1 - Navigation V1 Safe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation-v1-safe:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT EXACT LOCKED BASELINE
      # ============================================================

      - name: Checkout Exact Baseline
        uses: actions/checkout@v4
        with:
          ref: 12591049e68259ce5ff40c69974117a2b89a4623
          fetch-depth: 1

      # ============================================================
      # 2. VERIFY EXACT BASELINE
      # ============================================================

      - name: Verify Exact Baseline
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          test -f "$FILE"

          EXPECTED_SHA="d26c2d2f67bd801d9835071ed5c0afe323dd2fa9"
          ACTUAL_SHA="$(git hash-object "$FILE")"

          echo "Expected SHA:"
          echo "$EXPECTED_SHA"

          echo "Actual SHA:"
          echo "$ACTUAL_SHA"

          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

          echo "EXACT BASELINE: PASS"

      # ============================================================
      # 3. VERIFY PROTECTED ARCHITECTURE
      # ============================================================

      - name: Verify Protected Projection Core
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$BASE/V10ProjectionSession.java"
          test -f "$BASE/V10DisplayController.java"
          test -f "$BASE/V10SurfaceManager.java"
          test -f "$BASE/V10TaskSession.java"

          test ! -f "$BASE/V10ProjectionService.java"

          test "$(git hash-object "$BASE/V10ProjectionSession.java")" \
            = "27a9ff439fb450750d49f35a546eab3bc2745b4d"

          test "$(git hash-object "$BASE/V10DisplayController.java")" \
            = "1a35bcaa7db0a5f892e56006f740b4ebf727be8a"

          test "$(git hash-object "$BASE/V10SurfaceManager.java")" \
            = "e3f2a8b74ded29f21e04a95c661672db51d01d1c"

          test "$(git hash-object "$BASE/V10TaskSession.java")" \
            = "fce2f5cf06c5bd10782a87397aace8676493b6b7"

          echo "PROTECTED PROJECTION CORE: PASS"

      # ============================================================
      # 4. PATCH NAVIGATION V1
      #
      # IMPORTANT:
      # No python3 -c with nested shell quotes.
      # The Python program is supplied through a quoted heredoc.
      # ============================================================

      - name: Patch Navigation V1
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 <<'PY'
          from pathlib import Path

          file_path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          source = file_path.read_text()

          # --------------------------------------------------------
          # Add imports
          # --------------------------------------------------------

          if "import android.net.Uri;" not in source:
              source = source.replace(
                  "import android.content.Intent;\n",
                  "import android.content.Intent;\n"
                  "import android.net.Uri;\n",
                  1
              )

          if "import android.widget.EditText;" not in source:
              source = source.replace(
                  "import android.widget.GridLayout;\n",
                  "import android.widget.GridLayout;\n"
                  "import android.widget.EditText;\n",
                  1
              )

          # --------------------------------------------------------
          # Add Navigation panel field
          # --------------------------------------------------------

          field_marker = """    private LinearLayout dock;
    private TextureView textureView;"""

          field_replacement = """    private LinearLayout dock;
    private LinearLayout navigationPanel;
    private TextureView textureView;"""

          if "private LinearLayout navigationPanel;" not in source:
              if field_marker not in source:
                  raise SystemExit(
                      "ERROR: field marker not found"
                  )

              source = source.replace(
                  field_marker,
                  field_replacement,
                  1
              )

          # --------------------------------------------------------
          # Make existing Navigation card clickable
          # --------------------------------------------------------

          click_marker = """        mapText.setGravity(
                Gravity.CENTER);

        map.addView(
                mapText,"""

          click_replacement = """        mapText.setGravity(
                Gravity.CENTER);

        map.setOnClickListener(
                v -> showNavigationPanel());

        map.setClickable(true);

        map.addView(
                mapText,"""

          if "map.setOnClickListener(" not in source:
              if click_marker not in source:
                  raise SystemExit(
                      "ERROR: Navigation card marker not found"
                  )

              source = source.replace(
                  click_marker,
                  click_replacement,
                  1
              )

          # --------------------------------------------------------
          # Add Navigation methods before buildAppPanel()
          # --------------------------------------------------------

          method_marker = """    private void buildAppPanel() {"""

          navigation_methods = r'''    private void showNavigationPanel() {

        if (navigationPanel != null) {
            return;
        }

        navigationPanel =
                new LinearLayout(this);

        navigationPanel.setOrientation(
                LinearLayout.VERTICAL);

        navigationPanel.setPadding(
                dp(18),
                dp(12),
                dp(18),
                dp(12));

        navigationPanel.setBackgroundColor(
                Color.rgb(
                        7,
                        9,
                        12));

        LinearLayout header =
                new LinearLayout(this);

        header.setGravity(
                Gravity.CENTER_VERTICAL);

        TextView back =
                buttonText("BACK");

        back.setOnClickListener(
                v -> hideNavigationPanel());

        header.addView(
                back,
                new LinearLayout.LayoutParams(
                        dp(90),
                        dp(58)));

        TextView title =
                text(
                        "NAVIGATION",
                        21,
                        Color.WHITE);

        title.setGravity(
                Gravity.CENTER);

        header.addView(
                title,
                new LinearLayout.LayoutParams(
                        0,
                        dp(58),
                        1));

        navigationPanel.addView(
                header,
                new LinearLayout.LayoutParams(
                        -1,
                        dp(65)));

        TextView hint =
                text(
                        "Where do you want to go?",
                        16,
                        Color.LTGRAY);

        hint.setGravity(
                Gravity.CENTER_VERTICAL);

        navigationPanel.addView(
                hint,
                new LinearLayout.LayoutParams(
                        -1,
                        dp(48)));

        EditText destination =
                new EditText(this);

        destination.setTextColor(
                Color.WHITE);

        destination.setHintTextColor(
                Color.GRAY);

        destination.setHint(
                "Nhập địa điểm, địa chỉ...");

        destination.setTextSize(18);

        destination.setSingleLine(true);

        GradientDrawable inputBg =
                new GradientDrawable();

        inputBg.setColor(
                Color.rgb(
                        22,
                        27,
                        33));

        inputBg.setCornerRadius(
                dp(16));

        destination.setBackground(
                inputBg);

        destination.setPadding(
                dp(16),
                0,
                dp(16),
                0);

        navigationPanel.addView(
                destination,
                new LinearLayout.LayoutParams(
                        -1,
                        dp(62)));

        TextView navigate =
                buttonText("DẪN ĐƯỜNG");

        navigate.setTextSize(16);

        navigate.setOnClickListener(
                v -> {

                    String query =
                            destination
                                    .getText()
                                    .toString()
                                    .trim();

                    if (!query.isEmpty()) {
                        startNavigationTo(
                                query);
                    }
                });

        LinearLayout.LayoutParams
                navParams =
                new LinearLayout.LayoutParams(
                        -1,
                        dp(62));

        navParams.setMargins(
                0,
                dp(12),
                0,
                dp(8));

        navigationPanel.addView(
                navigate,
                navParams);

        TextView openMap =
                buttonText("MỞ GOOGLE MAPS");

        openMap.setTextSize(15);

        openMap.setOnClickListener(
                v -> openNavigationApp());

        navigationPanel.addView(
                openMap,
                new LinearLayout.LayoutParams(
                        -1,
                        dp(58)));

        TextView info =
                text(
                        "Navigation V1 dùng ứng dụng bản đồ có sẵn trên điện thoại.",
                        12,
                        Color.LTGRAY);

        info.setGravity(
                Gravity.CENTER);

        navigationPanel.addView(
                info,
                new LinearLayout.LayoutParams(
                        -1,
                        dp(50)));

        dashboard.setVisibility(
                View.GONE);

        appPanel.setVisibility(
                View.GONE);

        projectionLayer.setVisibility(
                View.GONE);

        launcherLayer.addView(
                navigationPanel,
                new LinearLayout.LayoutParams(
                        -1,
                        -1));
    }

    private void hideNavigationPanel() {

        if (navigationPanel == null) {
            return;
        }

        launcherLayer.removeView(
                navigationPanel);

        navigationPanel = null;

        dashboard.setVisibility(
                View.VISIBLE);

        appPanel.setVisibility(
                View.GONE);

        projectionLayer.setVisibility(
                View.GONE);
    }

    private void startNavigationTo(
            String query) {

        String encoded =
                Uri.encode(query);

        Intent googleIntent =
                new Intent(
                        Intent.ACTION_VIEW,
                        Uri.parse(
                                "google.navigation:q="
                                + encoded));

        googleIntent.setPackage(
                "com.google.android.apps.maps");

        if (googleIntent.resolveActivity(
                getPackageManager()) != null) {

            startActivity(
                    googleIntent);

            return;
        }

        Intent genericIntent =
                new Intent(
                        Intent.ACTION_VIEW,
                        Uri.parse(
                                "geo:0,0?q="
                                + encoded));

        if (genericIntent.resolveActivity(
                getPackageManager()) != null) {

            startActivity(
                    genericIntent);

            return;
        }

        TextView error =
                text(
                        "Không tìm thấy ứng dụng bản đồ.",
                        16,
                        Color.WHITE);

        error.setGravity(
                Gravity.CENTER);

        navigationPanel.addView(
                error,
                new LinearLayout.LayoutParams(
                        -1,
                        dp(58)));
    }

    private void openNavigationApp() {

        Intent intent =
                new Intent(
                        Intent.ACTION_VIEW,
                        Uri.parse(
                                "geo:0,0"));

        intent.setPackage(
                "com.google.android.apps.maps");

        if (intent.resolveActivity(
                getPackageManager()) != null) {

            startActivity(intent);

            return;
        }

        Intent generic =
                new Intent(
                        Intent.ACTION_VIEW,
                        Uri.parse(
                                "geo:0,0"));

        if (generic.resolveActivity(
                getPackageManager()) != null) {

            startActivity(generic);
        }
    }

'''

          if "private void showNavigationPanel()" not in source:
              if method_marker not in source:
                  raise SystemExit(
                      "ERROR: buildAppPanel marker not found"
                  )

              source = source.replace(
                  method_marker,
                  navigation_methods + method_marker,
                  1
              )

          file_path.write_text(source)

          print("Navigation V1 source patch: PASS")
          PY

      # ============================================================
      # 5. VERIFY PATCH CONTENT
      # ============================================================

      - name: Verify Navigation V1 Patch
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq "import android.net.Uri;" "$FILE"
          grep -Fq "import android.widget.EditText;" "$FILE"
          grep -Fq "private LinearLayout navigationPanel;" "$FILE"
          grep -Fq "map.setOnClickListener(" "$FILE"
          grep -Fq "showNavigationPanel()" "$FILE"
          grep -Fq "hideNavigationPanel()" "$FILE"
          grep -Fq "startNavigationTo(" "$FILE"
          grep -Fq "openNavigationApp()" "$FILE"
          grep -Fq "google.navigation:q=" "$FILE"
          grep -Fq "com.google.android.apps.maps" "$FILE"

          echo "NAVIGATION V1 PATCH: PASS"

      # ============================================================
      # 6. VERIFY ONLY V10CarActivity.java CHANGED
      # ============================================================

      - name: Verify Patch Scope
        shell: bash
        run: |
          set -euo pipefail

          CHANGED="$(git diff --name-only)"

          echo "Changed files:"
          echo "$CHANGED"

          test "$CHANGED" = \
            "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          echo "PATCH SCOPE: PASS"

      # ============================================================
      # 7. VERIFY PROTECTED FILES AFTER PATCH
      # ============================================================

      - name: Verify Projection Core Still Exact
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test "$(git hash-object "$BASE/V10ProjectionSession.java")" \
            = "27a9ff439fb450750d49f35a546eab3bc2745b4d"

          test "$(git hash-object "$BASE/V10DisplayController.java")" \
            = "1a35bcaa7db0a5f892e56006f740b4ebf727be8a"

          test "$(git hash-object "$BASE/V10SurfaceManager.java")" \
            = "e3f2a8b74ded29f21e04a95c661672db51d01d1c"

          test "$(git hash-object "$BASE/V10TaskSession.java")" \
            = "fce2f5cf06c5bd10782a87397aace8676493b6b7"

          test ! -f "$BASE/V10ProjectionService.java"

          echo "PROJECTION CORE: UNCHANGED"

      # ============================================================
      # 8. SETUP JAVA
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 9. PREPARE GRADLE
      # ============================================================

      - name: Prepare Gradle
        shell: bash
        working-directory: v10-source
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          echo "GRADLE PREPARE: PASS"

      # ============================================================
      # 10. COMPILE JAVA
      # ============================================================

      - name: Compile Navigation V1
        shell: bash
        working-directory: v10-source
        run: |
          set -euo pipefail

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace

          echo "JAVA COMPILE: PASS"

      # ============================================================
      # 11. BUILD APK
      # ============================================================

      - name: Assemble Navigation V1 APK
        shell: bash
        working-directory: v10-source
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

          echo "APK ASSEMBLE: PASS"

      # ============================================================
      # 12. PREPARE ARTIFACT
      # ============================================================

      - name: Prepare Navigation V1 Artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/carassistant-navigation-v1
          mkdir -p /tmp/carassistant-navigation-v1

          APK="$(find \
            v10-source/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          test -n "$APK"
          test -f "$APK"

          cp "$APK" \
            /tmp/carassistant-navigation-v1/CarAssistant-V10-Navigation-V1.apk

          sha256sum \
            /tmp/carassistant-navigation-v1/CarAssistant-V10-Navigation-V1.apk \
            | tee \
            /tmp/carassistant-navigation-v1/SHA256SUM.txt

          test -s \
            /tmp/carassistant-navigation-v1/CarAssistant-V10-Navigation-V1.apk

          echo "ARTIFACT PREPARE: PASS"

      # ============================================================
      # 13. UPLOAD APK
      # ============================================================

      - name: Upload Navigation V1 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Navigation-V1
          path: |
            /tmp/carassistant-navigation-v1/CarAssistant-V10-Navigation-V1.apk
            /tmp/carassistant-navigation-v1/SHA256SUM.txt
          if-no-files-found: error

      # ============================================================
      # 14. FINAL PASS
      # ============================================================

      - name: Navigation V1 Final PASS
        shell: bash
        run: |
          set -euo pipefail

          test -s \
            /tmp/carassistant-navigation-v1/CarAssistant-V10-Navigation-V1.apk

          echo ""
          echo "=============================================="
          echo "CARASSISTANT V10 NAVIGATION V1"
          echo "=============================================="
          echo "Baseline: EXACT LOCKED BASELINE"
          echo "Projection Core: UNCHANGED"
          echo "Persistence Core: UNCHANGED"
          echo "Changed Source: V10CarActivity.java ONLY"
          echo "Navigation Card: CLICKABLE"
          echo "Destination Panel: ENABLED"
          echo "Google Maps Intent: ENABLED"
          echo "Generic Map Fallback: ENABLED"
          echo "APK: CREATED"
          echo "=============================================="
          echo "NAVIGATION V1 READY FOR TEST"
          echo "=============================================="
