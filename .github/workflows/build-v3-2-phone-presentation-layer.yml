name: CarAssistant V10 - Navigation V1 + Home UI V2 + Phone Presentation Layer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout current main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify current V10 source
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source"
          JAVA_SRC="$SRC/app/src/main/java/com/hieptran/aacast/doudou"

          echo "Checking current main source..."

          test -d "$SRC"
          test -f "$SRC/settings.gradle"
          test -f "$SRC/build.gradle"
          test -f "$SRC/gradlew"
          test -f "$SRC/app/build.gradle"
          test -f "$SRC/app/src/main/AndroidManifest.xml"

          test -f "$JAVA_SRC/V10CarActivity.java"
          test -f "$JAVA_SRC/V10ProjectionSession.java"
          test -f "$JAVA_SRC/V10DisplayController.java"
          test -f "$JAVA_SRC/V10SurfaceManager.java"
          test -f "$JAVA_SRC/V10TaskSession.java"
          test -f "$JAVA_SRC/V10SessionStore.java"
          test -f "$JAVA_SRC/NavigationMapView.java"

          echo "PASS: v10-source exists."
          echo "PASS: Gradle files exist."
          echo "PASS: AndroidManifest.xml exists."
          echo "PASS: V10 CORE source exists."
          echo "PASS: NavigationMapView.java exists."

      - name: Verify obsolete source directory is absent
        shell: bash
        run: |
          set -euo pipefail

          if [ -e "navigation-v1-source" ]; then
            echo "ERROR: Obsolete source directory exists."
            exit 1
          fi

          echo "PASS: Obsolete source directory is absent."

      - name: Verify current Git revision
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_COMMIT="$(git rev-parse HEAD)"
          OLD_COMMIT="2c814a181d00cde9547a446927ae181e18cb9cbb"

          echo "Current main commit:"
          echo "$CURRENT_COMMIT"

          if [ "$CURRENT_COMMIT" = "$OLD_COMMIT" ]; then
            echo "ERROR: Repository is unexpectedly pointing to the old Foundation commit."
            exit 1
          fi

          echo "PASS: Current main revision is not the old Foundation commit."

      - name: Verify Navigation dependency and permissions
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="v10-source/app/build.gradle"
          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          if grep -Fq "org.maplibre.gl:android-sdk:11.11.0" "$GRADLE"; then
            echo "PASS: MapLibre dependency exists."
          else
            echo "ERROR: MapLibre dependency is missing."
            exit 1
          fi

          if grep -Fq "android.permission.ACCESS_FINE_LOCATION" "$MANIFEST"; then
            echo "PASS: ACCESS_FINE_LOCATION exists."
          else
            echo "ERROR: ACCESS_FINE_LOCATION is missing."
            exit 1
          fi

          if grep -Fq "android.permission.ACCESS_COARSE_LOCATION" "$MANIFEST"; then
            echo "PASS: ACCESS_COARSE_LOCATION exists."
          else
            echo "ERROR: ACCESS_COARSE_LOCATION is missing."
            exit 1
          fi

      - name: Verify NavigationMapView source
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          check() {
            local label="$1"
            local pattern="$2"

            if grep -Fq "$pattern" "$FILE"; then
              echo "PASS: $label"
            else
              echo "ERROR: $label"
              echo "Missing: $pattern"
              exit 1
            fi
          }

          check "NavigationMapView class" "class NavigationMapView"
          check "MapLibre initialization" "MapLibre.getInstance"
          check "MapLibre map view" "new MapView"
          check "Location component" "getLocationComponent"
          check "OpenFreeMap Liberty style" "https://tiles.openfreemap.org/styles/liberty"
          check "Zoom in" "public void zoomIn()"
          check "Zoom out" "public void zoomOut()"
          check "Recenter" "public void recenter()"
          check "Host resume" "public void onHostResume()"
          check "Host pause" "public void onHostPause()"
          check "Host destroy" "public void onHostDestroy()"

          echo "PASS: NavigationMapView source verification."

      - name: Patch Presentation Layer
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"
          )

          text = path.read_text()

          def find_method(src, signature):
              start = src.find(signature)
              if start < 0:
                  raise RuntimeError(
                      "Cannot find method: " + signature
                  )

              brace = src.find("{", start)
              if brace < 0:
                  raise RuntimeError(
                      "Cannot find opening brace: " + signature
                  )

              return start, brace

          def matching_brace(src, opening):
              depth = 0
              in_string = False
              in_char = False
              in_line_comment = False
              in_block_comment = False
              escape = False

              i = opening

              while i < len(src):
                  c = src[i]
                  n = src[i + 1] if i + 1 < len(src) else ""

                  if in_line_comment:
                      if c == "\n":
                          in_line_comment = False
                      i += 1
                      continue

                  if in_block_comment:
                      if c == "*" and n == "/":
                          in_block_comment = False
                          i += 2
                          continue
                      i += 1
                      continue

                  if in_string:
                      if escape:
                          escape = False
                      elif c == "\\":
                          escape = True
                      elif c == '"':
                          in_string = False
                      i += 1
                      continue

                  if in_char:
                      if escape:
                          escape = False
                      elif c == "\\":
                          escape = True
                      elif c == "'":
                          in_char = False
                      i += 1
                      continue

                  if c == "/" and n == "/":
                      in_line_comment = True
                      i += 2
                      continue

                  if c == "/" and n == "*":
                      in_block_comment = True
                      i += 2
                      continue

                  if c == '"':
                      in_string = True
                      i += 1
                      continue

                  if c == "'":
                      in_char = True
                      i += 1
                      continue

                  if c == "{":
                      depth += 1

                  elif c == "}":
                      depth -= 1

                      if depth == 0:
                          return i

                  i += 1

              raise RuntimeError("Unbalanced Java braces")

          # --------------------------------------------------------
          # 1. Add Presentation Layer fields.
          # --------------------------------------------------------

          field_anchor = "private volatile boolean destroyed;"

          fields = """
          private boolean phonePresentationMode;
          private LinearLayout phoneSidebar;
          private LinearLayout phoneBottomDock;
          """

          if "private boolean phonePresentationMode;" not in text:
              if field_anchor not in text:
                  raise RuntimeError(
                      "Presentation field anchor not found"
                  )

              text = text.replace(
                  field_anchor,
                  field_anchor + fields,
                  1
              )

          # --------------------------------------------------------
          # 2. Set phone mode before existing UI construction.
          # --------------------------------------------------------

          constructor_signature = (
              "public NavigationMapView(Context context)"
          )

          start, brace = find_method(
              text,
              constructor_signature
          )

          end = matching_brace(
              text,
              brace
          )

          constructor = text[start:end + 1]

          mode_line = (
              "        phonePresentationMode = "
              "isPhonePresentation();"
          )

          if "phonePresentationMode = isPhonePresentation();" not in constructor:
              anchor = "        buildNavigationControls();"

              if anchor not in constructor:
                  raise RuntimeError(
                      "Constructor presentation anchor not found"
                  )

              constructor = constructor.replace(
                  anchor,
                  mode_line + "\n\n" + anchor,
                  1
              )

              text = (
                  text[:start]
                  + constructor
                  + text[end + 1:]
              )

          # --------------------------------------------------------
          # 3. Add Presentation Layer methods.
          # --------------------------------------------------------

          marker = (
              "    private void buildNavigationControls()"
          )

          if marker not in text:
              raise RuntimeError(
                  "buildNavigationControls() anchor not found"
              )

          presentation = r'''
              /*
               * =====================================================
               * PHONE PRESENTATION LAYER
               *
               * Visual layer only.
               *
               * Large Android Auto / existing presentation remains
               * unchanged.
               * =====================================================
               */

              private boolean isPhonePresentation() {

                  android.util.DisplayMetrics dm =
                          getResources().getDisplayMetrics();

                  float widthDp =
                          dm.widthPixels / dm.density;

                  float heightDp =
                          dm.heightPixels / dm.density;

                  return Math.min(
                          widthDp,
                          heightDp) < 700.0f;
              }

              private void buildPhonePresentationLayer() {

                  if (!phonePresentationMode) {
                      return;
                  }

                  buildPhoneSidebar();
                  buildPhoneBottomDock();
              }

              private void buildPhoneSidebar() {

                  if (phoneSidebar != null) {
                      return;
                  }

                  phoneSidebar =
                          new LinearLayout(getContext());

                  phoneSidebar.setOrientation(
                          LinearLayout.VERTICAL);

                  phoneSidebar.setGravity(
                          Gravity.CENTER);

                  phoneSidebar.setPadding(
                          dp(5),
                          dp(7),
                          dp(5),
                          dp(7));

                  GradientDrawable background =
                          new GradientDrawable();

                  background.setColor(
                          Color.argb(
                                  150,
                                  15,
                                  21,
                                  27));

                  background.setCornerRadius(
                          dp(18));

                  background.setStroke(
                          dp(1),
                          Color.argb(
                                  90,
                                  80,
                                  170,
                                  230));

                  phoneSidebar.setBackground(
                          background);

                  phoneSidebar.setElevation(
                          dp(10));

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  dp(58),
                                  dp(274),
                                  Gravity.START |
                                          Gravity.CENTER_VERTICAL);

                  params.setMargins(
                          dp(10),
                          0,
                          0,
                          0);

                  addPhoneSideButton(
                          phoneSidebar,
                          "⌂",
                          "Màn hình chính",
                          v -> {
                              if (searchResults != null) {
                                  searchResults.setVisibility(
                                          View.GONE);
                              }
                          });

                  addPhoneSideButton(
                          phoneSidebar,
                          "◎",
                          "Vị trí hiện tại",
                          v -> recenter());

                  addPhoneSideButton(
                          phoneSidebar,
                          "🎙",
                          "Tìm kiếm bằng giọng nói",
                          v -> startVoiceSearch());

                  addPhoneSideButton(
                          phoneSidebar,
                          "⌕",
                          "Tìm địa điểm",
                          v -> performSearch());

                  addView(
                          phoneSidebar,
                          params);

                  phoneSidebar.bringToFront();
              }

              private void addPhoneSideButton(
                      LinearLayout parent,
                      String label,
                      String description,
                      View.OnClickListener listener) {

                  TextView button =
                          new TextView(getContext());

                  button.setText(label);

                  button.setTextColor(
                          Color.WHITE);

                  button.setTextSize(21);

                  button.setTypeface(
                          null,
                          Typeface.BOLD);

                  button.setGravity(
                          Gravity.CENTER);

                  button.setContentDescription(
                          description);

                  button.setClickable(true);
                  button.setFocusable(true);

                  button.setElevation(
                          dp(5));

                  GradientDrawable background =
                          new GradientDrawable();

                  background.setColor(
                          Color.argb(
                                  105,
                                  25,
                                  35,
                                  45));

                  background.setCornerRadius(
                          dp(12));

                  background.setStroke(
                          dp(1),
                          Color.argb(
                                  80,
                                  80,
                                  170,
                                  230));

                  button.setBackground(
                          background);

                  button.setOnClickListener(
                          listener);

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  dp(46),
                                  dp(52));

                  params.setMargins(
                          0,
                          dp(3),
                          0,
                          dp(3));

                  parent.addView(
                          button,
                          params);
              }

              private void buildPhoneBottomDock() {

                  if (phoneBottomDock != null) {
                      return;
                  }

                  phoneBottomDock =
                          new LinearLayout(getContext());

                  phoneBottomDock.setOrientation(
                          LinearLayout.HORIZONTAL);

                  phoneBottomDock.setGravity(
                          Gravity.CENTER);

                  GradientDrawable background =
                          new GradientDrawable();

                  background.setColor(
                          Color.argb(
                                  155,
                                  15,
                                  21,
                                  27));

                  background.setCornerRadius(
                          dp(18));

                  background.setStroke(
                          dp(1),
                          Color.argb(
                                  90,
                                  80,
                                  170,
                                  230));

                  phoneBottomDock.setBackground(
                          background);

                  phoneBottomDock.setElevation(
                          dp(9));

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  LayoutParams.MATCH_PARENT,
                                  dp(52),
                                  Gravity.BOTTOM);

                  params.setMargins(
                          dp(78),
                          0,
                          dp(78),
                          dp(10));

                  addPhoneDockLabel(
                          phoneBottomDock,
                          "WYN");

                  addPhoneDockLabel(
                          phoneBottomDock,
                          "NAVIGATION");

                  addPhoneDockLabel(
                          phoneBottomDock,
                          "MEDIA");

                  addView(
                          phoneBottomDock,
                          params);

                  phoneBottomDock.bringToFront();
              }

              private void addPhoneDockLabel(
                      LinearLayout parent,
                      String label) {

                  TextView item =
                          new TextView(getContext());

                  item.setText(label);

                  item.setTextColor(
                          Color.WHITE);

                  item.setTextSize(11);

                  item.setTypeface(
                          null,
                          Typeface.BOLD);

                  item.setGravity(
                          Gravity.CENTER);

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  0,
                                  LayoutParams.MATCH_PARENT,
                                  1.0f);

                  parent.addView(
                          item,
                          params);
              }

          '''

          if (
              "private boolean isPhonePresentation()"
              not in text
          ):
              text = text.replace(
                  marker,
                  presentation + marker,
                  1
              )

          # --------------------------------------------------------
          # 4. Call Presentation Layer after existing search UI.
          # --------------------------------------------------------

          constructor_signature = (
              "public NavigationMapView(Context context)"
          )

          start, brace = find_method(
              text,
              constructor_signature
          )

          end = matching_brace(
              text,
              brace
          )

          constructor = text[start:end + 1]

          call = (
              "        buildPhonePresentationLayer();"
          )

          if "buildPhonePresentationLayer();" not in constructor:

              anchor = (
                  "        buildDestinationSearch();"
              )

              if anchor not in constructor:
                  raise RuntimeError(
                      "Destination search constructor anchor not found"
                  )

              constructor = constructor.replace(
                  anchor,
                  anchor + "\n" + call,
                  1
              )

              text = (
                  text[:start]
                  + constructor
                  + text[end + 1:]
              )

          # --------------------------------------------------------
          # 5. Phone-only search position.
          # --------------------------------------------------------

          old_search = """        searchParams.setMargins(
                dp(112),
                dp(18),
                dp(94),
                0);"""

          new_search = """        if (phonePresentationMode) {
            searchParams.setMargins(
                    dp(78),
                    dp(12),
                    dp(78),
                    0);
          } else {
            searchParams.setMargins(
                    dp(112),
                    dp(18),
                    dp(94),
                    0);
          }"""

          if old_search not in text:
              raise RuntimeError(
                  "Original search margin block not found"
              )

          text = text.replace(
              old_search,
              new_search,
              1
          )

          # --------------------------------------------------------
          # 6. Phone-only result position.
          # --------------------------------------------------------

          old_results = """        resultsParams.setMargins(
                dp(112),
                dp(82),
                dp(94),
                0);"""

          new_results = """        if (phonePresentationMode) {
            resultsParams.setMargins(
                    dp(78),
                    dp(76),
                    dp(78),
                    0);
          } else {
            resultsParams.setMargins(
                    dp(112),
                    dp(82),
                    dp(94),
                    0);
          }"""

          if old_results not in text:
              raise RuntimeError(
                  "Original result margin block not found"
              )

          text = text.replace(
              old_results,
              new_results,
              1
          )

          # --------------------------------------------------------
          # 7. Structural verification.
          # --------------------------------------------------------

          required = [
              "private boolean phonePresentationMode;",
              "private LinearLayout phoneSidebar;",
              "private LinearLayout phoneBottomDock;",
              "private boolean isPhonePresentation()",
              "private void buildPhonePresentationLayer()",
              "private void buildPhoneSidebar()",
              "private void buildPhoneBottomDock()",
              "buildPhonePresentationLayer();",
          ]

          for item in required:
              if item not in text:
                  raise RuntimeError(
                      "PATCH CHECK FAILED: " + item
                  )

          # --------------------------------------------------------
          # 8. Verify existing Navigation functionality is still present.
          # --------------------------------------------------------

          preserved = [
              "MapLibre.getInstance",
              "new MapView",
              "getLocationComponent",
              "https://tiles.openfreemap.org/styles/liberty",
              "nominatim.openstreetmap.org",
              "SpeechRecognizer",
              "RecognizerIntent.LANGUAGE_MODEL_FREE_FORM",
              '"vi-VN"',
              "VOICE_SILENCE_TIMEOUT_MS = 5000L",
              "playVoiceStartTone",
              "selectDestination",
              "destinationMarker",
              "public void zoomIn()",
              "public void zoomOut()",
              "public void recenter()",
              "public void onHostResume()",
              "public void onHostPause()",
              "public void onHostDestroy()",
          ]

          for item in preserved:
              if item not in text:
                  raise RuntimeError(
                      "PRESERVATION CHECK FAILED: " + item
                  )

          # --------------------------------------------------------
          # 9. Brace balance.
          # --------------------------------------------------------

          if text.count("{") != text.count("}"):
              raise RuntimeError(
                  "NavigationMapView braces are unbalanced"
              )

          # --------------------------------------------------------
          # 10. Make sure class remains exactly one class.
          # --------------------------------------------------------

          if text.count(
              "public final class NavigationMapView"
          ) != 1:
              raise RuntimeError(
                  "NavigationMapView class structure changed"
              )

          path.write_text(text)

          print("")
          print("========================================")
          print("PRESENTATION LAYER PATCH: PASS")
          print("========================================")
          print("Phone presentation added.")
          print("Existing navigation logic preserved.")
          print("Java braces balanced.")
          print("NavigationMapView class structure valid.")
          print("========================================")
          PY

      - name: Verify Home UI V2 source
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          check() {
            local label="$1"
            local pattern="$2"

            if grep -Fq "$pattern" "$FILE"; then
              echo "PASS: $label"
            else
              echo "ERROR: $label"
              echo "Missing: $pattern"
              exit 1
            fi
          }

          check "V10CarActivity" "public final class V10CarActivity"
          check "NavigationMapView field" "private NavigationMapView navigationMap;"
          check "NavigationMapView creation" "navigationMap=new NavigationMapView(this);"

          check "Transparent root" "root.setBackgroundColor(Color.TRANSPARENT);"
          check "Transparent launcher layer" "launcherLayer.setBackgroundColor(Color.TRANSPARENT);"
          check "Transparent dashboard" "dashboard.setBackgroundColor(Color.TRANSPARENT);"

          check "APP selector" 'sidebarButton("APP CHỌN")'
          check "TASKS control" '"TASKS"'
          check "MEDIA card" '"MEDIA"'
          check "WYN control" '"WYN"'

          check "Quick launch limit" "Math.min(4,q.size())"
          check "Real application icon" "i.loadIcon(pm)"

          check "Navigation resume" "navigationMap.onHostResume()"
          check "Navigation pause" "navigationMap.onHostPause()"
          check "Navigation destroy" "navigationMap.onHostDestroy()"

          echo "PASS: Home UI V2 source verification."

      - name: Verify Projection Persistence CORE
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$SRC/V10ProjectionSession.java"
          test -f "$SRC/V10DisplayController.java"
          test -f "$SRC/V10SurfaceManager.java"
          test -f "$SRC/V10TaskSession.java"
          test -f "$SRC/V10SessionStore.java"

          sha256sum \
            "$SRC/V10ProjectionSession.java" \
            "$SRC/V10DisplayController.java" \
            "$SRC/V10SurfaceManager.java" \
            "$SRC/V10TaskSession.java" \
            "$SRC/V10SessionStore.java" \
            > /tmp/core.sha256

          echo "Protected CORE files:"
          cat /tmp/core.sha256

          echo "PASS: Projection/Persistence CORE files exist."

      - name: Verify Floating Touch controls
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          check() {
            local label="$1"
            local pattern="$2"

            if grep -Fq "$pattern" "$FILE"; then
              echo "PASS: $label"
            else
              echo "ERROR: $label"
              echo "Missing: $pattern"
              exit 1
            fi
          }

          check "Floating Touch creation" "createFloatingTouchKey()"
          check "Floating Touch timing" "floatingDownTime"
          check "Floating BACK" 'addFloatingMenuButton("BACK"'
          check "Floating HOME" 'addFloatingMenuButton("HOME"'

          echo "PASS: Floating Touch controls."

      - name: Verify Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="v10-source/app/build.gradle"

          echo "Actual application configuration:"
          grep -nE \
            "namespace|applicationId|compileSdk|minSdk|targetSdk|versionCode|versionName|VERSION_17|android-sdk:11.11.0" \
            "$GRADLE" || true

          if grep -Fq "namespace 'com.carassistant.v10'" "$GRADLE"; then
            echo "PASS: Namespace = com.carassistant.v10"
          else
            echo "ERROR: Namespace does not match current source."
            exit 1
          fi

          if grep -Fq 'applicationId "com.carassistant.v10"' "$GRADLE"; then
            echo "PASS: Application ID = com.carassistant.v10"
          else
            echo "ERROR: Application ID does not match current source."
            exit 1
          fi

          if grep -Fq "compileSdk 36" "$GRADLE"; then
            echo "PASS: Compile SDK = 36"
          else
            echo "ERROR: compileSdk 36 is missing."
            exit 1
          fi

          if grep -Fq "minSdk 29" "$GRADLE"; then
            echo "PASS: Min SDK = 29"
          else
            echo "ERROR: minSdk 29 is missing."
            exit 1
          fi

          if grep -Fq "targetSdk 36" "$GRADLE"; then
            echo "PASS: Target SDK = 36"
          else
            echo "ERROR: targetSdk 36 is missing."
            exit 1
          fi

          if grep -Fq "JavaVersion.VERSION_17" "$GRADLE"; then
            echo "PASS: Java 17 configuration."
          else
            echo "ERROR: Java 17 configuration is missing."
            exit 1
          fi

          if grep -Fq "org.maplibre.gl:android-sdk:11.11.0" "$GRADLE"; then
            echo "PASS: MapLibre 11.11.0."
          else
            echo "ERROR: MapLibre 11.11.0 is missing."
            exit 1
          fi

          echo "PASS: Gradle configuration matches current v10-source."

      - name: Verify AndroidManifest components
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          check() {
            local label="$1"
            local pattern="$2"

            if grep -Fq "$pattern" "$MANIFEST"; then
              echo "PASS: $label"
            else
              echo "ERROR: $label"
              echo "Missing: $pattern"
              exit 1
            fi
          }

          check "V10LauncherActivity" 'com.carassistant.v10.V10LauncherActivity'
          check "V10CarActivity" 'com.carassistant.v10.V10CarActivity'
          check "V10ControlReceiver" 'com.carassistant.v10.V10ControlReceiver'
          check "AACastCarService" 'com.carassistant.v10.AACastCarService'
          check "DockStateProvider" 'com.carassistant.v10.DockStateProvider'
          check "Android Auto projection category" 'com.google.android.gms.car.category.CATEGORY_PROJECTION'
          check "Android Auto OEM projection category" 'com.google.android.gms.car.category.CATEGORY_PROJECTION_OEM'

          echo "PASS: AndroidManifest components."

      - name: Verify repository is build-only and source is untouched
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository root:"
          git rev-parse --show-toplevel

          echo "Current commit:"
          git rev-parse HEAD

          echo "Current branch/ref:"
          git branch --show-current || true

          echo "Source directory:"
          ls -la v10-source

          echo "PASS: Repository is ready for source build."

      - name: Verify Gradle wrapper
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew

          chmod +x ./gradlew

          echo "Gradle wrapper version:"
          ./gradlew --version

          echo "PASS: Gradle wrapper is executable."

      - name: Compile current V10 source
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            :app:compileDebugJavaWithJavac \
            --stacktrace

          echo "PASS: Java compile."

      - name: Assemble current V10 APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

          echo "PASS: APK assemble."

      - name: Locate and verify generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find v10-source/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: Generated APK not found."
            echo "APK output directory:"
            find v10-source/app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi

          echo "Generated APK:"
          echo "$APK"

          ls -lh "$APK"

          test -s "$APK"

          echo "PASS: Generated APK exists and is non-empty."

      - name: Package APK for Android Auto testing
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find v10-source/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          cp "$APK" \
            CarAssistant-Navigation-V1-Home-UI-V2-Overlay-Safe.apk

          sha256sum \
            CarAssistant-Navigation-V1-Home-UI-V2-Overlay-Safe.apk \
            > CarAssistant-Navigation-V1-Home-UI-V2-Overlay-Safe.sha256

          test -s \
            CarAssistant-Navigation-V1-Home-UI-V2-Overlay-Safe.apk

          echo ""
          echo "========================================"
          echo "APK READY FOR ANDROID AUTO TEST"
          echo "========================================"

          echo "APK:"
          ls -lh \
            CarAssistant-Navigation-V1-Home-UI-V2-Overlay-Safe.apk

          echo ""
          echo "SHA256:"
          cat \
            CarAssistant-Navigation-V1-Home-UI-V2-Overlay-Safe.sha256

          echo ""
          echo "PASS: APK package ready."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-Navigation-V1-Home-UI-V2-Overlay-Safe
          path: |
            CarAssistant-Navigation-V1-Home-UI-V2-Overlay-Safe.apk
            CarAssistant-Navigation-V1-Home-UI-V2-Overlay-Safe.sha256
          if-no-files-found: error
          retention-days: 14
