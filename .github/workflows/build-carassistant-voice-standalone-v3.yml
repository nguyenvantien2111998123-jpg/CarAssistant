name: Tro ly CarAsistant 3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate standalone Voice V3
        shell: bash
        run: |
          set -euo pipefail

          P="carassistant-voice"
          J="$P/app/src/main/java/com/carassistant/voice"
          mkdir -p "$J"

          cat > "$P/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "CarAssistantVoice"
          include ':app'
          EOF

          cat > "$P/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.13.0' apply false
          }
          EOF

          cat > "$P/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.carassistant.voice'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.carassistant.voice'
                  minSdk 29
                  targetSdk 32
                  versionCode 3
                  versionName '0.3.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > "$P/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:label="CarAssistant Voice"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".FloatingMicService"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          cat > "$J/FloatingMicService.java" <<'EOF'
          package com.carassistant.voice;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.IBinder;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.TextView;

          public final class FloatingMicService extends Service {
              private static final String CHANNEL = "voice_floating_mic";
              private WindowManager windowManager;
              private View bubble;
              private WindowManager.LayoutParams params;

              @Override
              public void onCreate() {
                  super.onCreate();
                  createNotificationChannel();
                  startForeground(301, buildNotification());
                  showBubble();
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                              CHANNEL,
                              "CarAssistant Voice",
                              NotificationManager.IMPORTANCE_LOW);
                      channel.setDescription("Điều khiển mic nổi");
                      NotificationManager manager =
                              getSystemService(NotificationManager.class);
                      if (manager != null) {
                          manager.createNotificationChannel(channel);
                      }
                  }
              }

              private Notification buildNotification() {
                  Intent open = new Intent(this, MainActivity.class);
                  PendingIntent pending = PendingIntent.getActivity(
                          this, 302, open,
                          PendingIntent.FLAG_UPDATE_CURRENT
                                  | PendingIntent.FLAG_IMMUTABLE);

                  Notification.Builder builder;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      builder = new Notification.Builder(this, CHANNEL);
                  } else {
                      builder = new Notification.Builder(this);
                  }

                  return builder
                          .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                          .setContentTitle("CarAssistant Voice")
                          .setContentText("Mic nổi đang bật")
                          .setContentIntent(pending)
                          .setOngoing(true)
                          .build();
              }

              private void showBubble() {
                  if (!Settings.canDrawOverlays(this)) {
                      stopSelf();
                      return;
                  }

                  windowManager = (WindowManager)
                          getSystemService(WINDOW_SERVICE);

                  TextView button = new TextView(this);
                  button.setText("🎙");
                  button.setTextSize(25);
                  button.setTextColor(Color.WHITE);
                  button.setGravity(Gravity.CENTER);

                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.rgb(25, 105, 210));
                  bg.setShape(GradientDrawable.OVAL);
                  bg.setStroke(2, Color.WHITE);
                  button.setBackground(bg);
                  button.setElevation(8);

                  int overlayType;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      overlayType = WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY;
                  } else {
                      overlayType = WindowManager.LayoutParams.TYPE_PHONE;
                  }

                  params = new WindowManager.LayoutParams(
                          dp(58),
                          dp(58),
                          overlayType,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          PixelFormat.TRANSLUCENT);

                  params.gravity = Gravity.TOP | Gravity.START;
                  params.x = dp(18);
                  params.y = dp(180);

                  button.setOnTouchListener(new View.OnTouchListener() {
                      private int downX;
                      private int downY;
                      private float touchX;
                      private float touchY;
                      private boolean moved;

                      @Override
                      public boolean onTouch(View view, MotionEvent event) {
                          switch (event.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  downX = params.x;
                                  downY = params.y;
                                  touchX = event.getRawX();
                                  touchY = event.getRawY();
                                  moved = false;
                                  return true;

                              case MotionEvent.ACTION_MOVE:
                                  int dx = (int) (event.getRawX() - touchX);
                                  int dy = (int) (event.getRawY() - touchY);
                                  if (Math.abs(dx) > dp(5)
                                          || Math.abs(dy) > dp(5)) {
                                      moved = true;
                                  }
                                  params.x = Math.max(0, downX + dx);
                                  params.y = Math.max(0, downY + dy);
                                  try {
                                      windowManager.updateViewLayout(bubble, params);
                                  } catch (RuntimeException ignored) {
                                  }
                                  return true;

                              case MotionEvent.ACTION_UP:
                                  if (!moved) {
                                      openVoiceScreen();
                                  }
                                  return true;

                              default:
                                  return true;
                          }
                      }
                  });

                  bubble = button;
                  try {
                      windowManager.addView(bubble, params);
                  } catch (RuntimeException e) {
                      bubble = null;
                      stopSelf();
                  }
              }

              private void openVoiceScreen() {
                  Intent intent = new Intent(this, MainActivity.class);
                  intent.setAction(MainActivity.ACTION_START_VOICE);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK
                          | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  startActivity(intent);
              }

              private int dp(int value) {
                  return (int) (value * getResources()
                          .getDisplayMetrics().density + 0.5f);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int id) {
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  if (bubble != null && windowManager != null) {
                      try {
                          windowManager.removeView(bubble);
                      } catch (RuntimeException ignored) {
                      }
                      bubble = null;
                  }
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

          cat > "$J/MainActivity.java" <<'EOF'
          package com.carassistant.voice;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.media.AudioManager;
          import android.media.ToneGenerator;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.util.ArrayList;
          import java.util.Locale;

          public final class MainActivity extends Activity {
              public static final String ACTION_START_VOICE =
                      "com.carassistant.voice.START_VOICE";

              private static final int MIC_REQUEST = 41;
              private static final int OVERLAY_REQUEST = 42;
              private static final long SILENCE_MS = 4000L;
              private static final long HIDE_MS = 2500L;

              private final Handler handler = new Handler(Looper.getMainLooper());

              private SpeechRecognizer recognizer;
              private TextView status;
              private TextView transcript;
              private TextView action;
              private Button micButton;
              private Button overlayButton;
              private boolean listening;
              private boolean speechStarted;
              private boolean finalizing;

              private final Runnable silenceRunnable = () -> {
                  if (recognizer == null || !listening
                          || !speechStarted || finalizing) {
                      return;
                  }
                  finalizing = true;
                  status.setText("Đã im lặng 4 giây, đang kết thúc...");
                  try {
                      recognizer.stopListening();
                  } catch (RuntimeException e) {
                      finishWithMessage("Đã dừng nghe.", true);
                  }
              };

              private final Runnable hideRunnable = () -> {
                  if (status != null) {
                      status.setText("Sẵn sàng. Nhấn mic để nói.");
                  }
                  if (transcript != null) {
                      transcript.setText("");
                  }
                  if (action != null) {
                      action.setText("");
                  }
              };

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().setStatusBarColor(Color.rgb(18, 24, 35));
                  getWindow().setNavigationBarColor(Color.rgb(18, 24, 35));
                  buildUi();

                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      status.setText("Không có dịch vụ nhận dạng giọng nói.");
                      micButton.setEnabled(false);
                  } else {
                      status.setText("Sẵn sàng. Nhấn mic và nói tiếng Việt.");
                  }

                  handleStartIntent(getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleStartIntent(intent);
              }

              private void handleStartIntent(Intent intent) {
                  if (intent != null
                          && ACTION_START_VOICE.equals(intent.getAction())) {
                      handler.postDelayed(this::startVoice, 250);
                      intent.setAction(null);
                  }
              }

              private void buildUi() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(24, 28, 24, 24);
                  root.setBackgroundColor(Color.rgb(18, 24, 35));

                  TextView title = makeText("CarAssistant Voice V3", 26);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title);

                  status = makeText("Đang khởi tạo...", 16);
                  status.setPadding(0, 20, 0, 14);
                  root.addView(status);

                  micButton = new Button(this);
                  micButton.setText("BẮT ĐẦU NÓI");
                  root.addView(micButton);

                  overlayButton = new Button(this);
                  overlayButton.setText("BẬT MIC NỔI");
                  root.addView(overlayButton);

                  root.addView(makeText("NỘI DUNG NHẬN DẠNG", 14));
                  transcript = makeText("", 20);
                  transcript.setMinHeight(64);
                  root.addView(transcript);

                  root.addView(makeText("KẾT QUẢ PHÂN TÍCH", 14));
                  action = makeText("", 17);
                  root.addView(action);

                  TextView note = makeText(
                          "Mic nổi cần quyền hiển thị trên ứng dụng khác. " +
                          "Nhận dạng tiếng Việt phụ thuộc dịch vụ giọng nói " +
                          "đã cài trên điện thoại.", 13);
                  note.setPadding(0, 20, 0, 0);
                  root.addView(note);

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(root);
                  setContentView(scroll);

                  micButton.setOnClickListener(v -> startVoice());
                  overlayButton.setOnClickListener(v -> enableOverlay());
              }

              private TextView makeText(String value, int size) {
                  TextView view = new TextView(this);
                  view.setText(value);
                  view.setTextSize(size);
                  view.setTextColor(Color.WHITE);
                  return view;
              }

              private void enableOverlay() {
                  if (!Settings.canDrawOverlays(this)) {
                      Intent intent = new Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName()));
                      startActivityForResult(intent, OVERLAY_REQUEST);
                      status.setText("Hãy bật quyền hiển thị trên ứng dụng khác.");
                      return;
                  }
                  startOverlayService();
              }

              private void startOverlayService() {
                  try {
                      Intent service = new Intent(this, FloatingMicService.class);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(service);
                      } else {
                          startService(service);
                      }
                      status.setText("Mic nổi đã được bật.");
                      overlayButton.setText("MIC NỔI ĐANG BẬT");
                  } catch (RuntimeException e) {
                      status.setText("Không bật được mic nổi: "
                              + e.getClass().getSimpleName());
                  }
              }

              @Override
              protected void onActivityResult(
                      int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == OVERLAY_REQUEST) {
                      if (Settings.canDrawOverlays(this)) {
                          startOverlayService();
                      } else {
                          status.setText("Chưa được cấp quyền mic nổi.");
                      }
                  }
              }

              private void startVoice() {
                  handler.removeCallbacks(hideRunnable);
                  handler.removeCallbacks(silenceRunnable);

                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                              new String[]{Manifest.permission.RECORD_AUDIO},
                              MIC_REQUEST);
                      return;
                  }

                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      status.setText("Không tìm thấy dịch vụ nhận dạng tương thích.");
                      return;
                  }

                  stopRecognizer();
                  speechStarted = false;
                  finalizing = false;
                  listening = true;

                  try {
                      final SpeechRecognizer session =
                              SpeechRecognizer.createSpeechRecognizer(this);
                      recognizer = session;

                      session.setRecognitionListener(new RecognitionListener() {
                          @Override
                          public void onReadyForSpeech(Bundle params) {
                              if (recognizer == session) {
                                  status.setText("Đang nghe...");
                              }
                          }

                          @Override
                          public void onBeginningOfSpeech() {
                              if (recognizer != session) return;
                              speechStarted = true;
                              status.setText("Đang nghe tiếng Việt...");
                              resetSilenceTimer();
                          }

                          @Override
                          public void onRmsChanged(float value) {}

                          @Override
                          public void onBufferReceived(byte[] buffer) {}

                          @Override
                          public void onEndOfSpeech() {
                              if (recognizer == session) {
                                  status.setText("Đang xử lý...");
                              }
                          }

                          @Override
                          public void onError(int error) {
                              if (recognizer != session) return;
                              String message = errorMessage(error);
                              finishWithMessage(message, true);
                          }

                          @Override
                          public void onResults(Bundle results) {
                              if (recognizer != session) return;
                              ArrayList<String> matches = results == null
                                      ? null
                                      : results.getStringArrayList(
                                              SpeechRecognizer.RESULTS_RECOGNITION);

                              if (matches == null || matches.isEmpty()
                                      || matches.get(0).trim().isEmpty()) {
                                  finishWithMessage(
                                          "Không nhận được nội dung. Hãy thử lại.",
                                          true);
                                  return;
                              }

                              String spoken = matches.get(0).trim();
                              transcript.setText(spoken);
                              parseCommand(spoken);
                              finishWithMessage("Đã xử lý xong.", true);
                          }

                          @Override
                          public void onPartialResults(Bundle results) {
                              if (recognizer != session || results == null) return;
                              ArrayList<String> matches = results.getStringArrayList(
                                      SpeechRecognizer.RESULTS_RECOGNITION);
                              if (matches != null && !matches.isEmpty()) {
                                  transcript.setText(matches.get(0));
                                  if (!speechStarted) speechStarted = true;
                                  resetSilenceTimer();
                              }
                          }

                          @Override
                          public void onEvent(int eventType, Bundle params) {}
                      });

                      Intent intent = new Intent(
                              RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                      intent.putExtra(
                              RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                              RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                      intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "vi-VN");
                      intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, "vi-VN");
                      intent.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true);
                      intent.putExtra(
                              RecognizerIntent
                                      .EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS,
                              SILENCE_MS);
                      intent.putExtra(
                              RecognizerIntent
                                      .EXTRA_SPEECH_INPUT_POSSIBLY_COMPLETE_SILENCE_LENGTH_MILLIS,
                              SILENCE_MS);

                      transcript.setText("");
                      action.setText("");
                      status.setText("Chuẩn bị micro...");
                      micButton.setText("ĐANG NGHE...");

                      playBeep(false);
                      session.startListening(intent);

                  } catch (RuntimeException e) {
                      finishWithMessage(
                              "Không khởi động được nhận dạng: "
                                      + e.getClass().getSimpleName(),
                              true);
                  }
              }

              private void resetSilenceTimer() {
                  handler.removeCallbacks(silenceRunnable);
                  if (speechStarted && listening && !finalizing) {
                      handler.postDelayed(silenceRunnable, SILENCE_MS);
                  }
              }

              private void finishWithMessage(String message, boolean beep) {
                  handler.removeCallbacks(silenceRunnable);
                  listening = false;
                  finalizing = true;
                  status.setText(message);
                  micButton.setText("NÓI TIẾP");
                  if (beep) playBeep(true);
                  stopRecognizer();
                  handler.removeCallbacks(hideRunnable);
                  handler.postDelayed(hideRunnable, HIDE_MS);
              }

              private void playBeep(boolean ending) {
                  ToneGenerator tone = null;
                  try {
                      tone = new ToneGenerator(AudioManager.STREAM_NOTIFICATION, 80);
                      tone.startTone(
                              ending ? ToneGenerator.TONE_PROP_ACK
                                     : ToneGenerator.TONE_PROP_BEEP,
                              ending ? 220 : 120);
                  } catch (RuntimeException ignored) {
                  } finally {
                      if (tone != null) tone.release();
                  }
              }

              private void parseCommand(String spoken) {
                  String normalized = spoken.toLowerCase(Locale.forLanguageTag("vi-VN"))
                          .trim()
                          .replaceAll("\\\\s+", " ");

                  String query = normalized;
                  String[] prefixes = {
                      "carassistant", "mở giúp tôi ", "mở ", "tìm kiếm ",
                      "tìm ", "phát giúp tôi ", "phát ", "hãy "
                  };

                  for (String prefix : prefixes) {
                      if (query.startsWith(prefix)) {
                          query = query.substring(prefix.length()).trim();
                          break;
                      }
                  }

                  String[] suffixes = {
                      " trên youtube giúp tôi", " trên youtube nhé",
                      " trên youtube", " giúp tôi", " nhé"
                  };

                  for (String suffix : suffixes) {
                      if (query.endsWith(suffix)) {
                          query = query.substring(
                                  0, query.length() - suffix.length()).trim();
                          break;
                      }
                  }

                  if (query.isEmpty()) {
                      action.setText("Không tìm thấy nội dung trong câu lệnh.");
                      return;
                  }

                  if (normalized.contains("youtube")) {
                      action.setText(
                              "ACTION: SEARCH_YOUTUBE\\nQUERY: " + query
                                      + "\\n\\nĐã phân tích câu lệnh. "
                                      + "Bản độc lập chưa tự điều khiển YouTube.");
                  } else if (normalized.startsWith("tìm ")
                          || normalized.startsWith("tìm kiếm ")
                          || normalized.startsWith("phát ")
                          || normalized.startsWith("mở ")) {
                      action.setText(
                              "ACTION: VOICE_COMMAND\\nQUERY: " + query
                                      + "\\n\\nĐã nhận câu lệnh; "
                                      + "chưa tích hợp điều khiển ứng dụng.");
                  } else {
                      action.setText(
                              "ACTION: UNKNOWN\\nTEXT: " + spoken
                                      + "\\n\\nCâu lệnh này chưa được hỗ trợ.");
                  }
              }

              private String errorMessage(int error) {
                  switch (error) {
                      case SpeechRecognizer.ERROR_AUDIO:
                          return "Lỗi thu âm. Kiểm tra micro.";
                      case SpeechRecognizer.ERROR_NO_MATCH:
                          return "Không nhận ra lời nói. Hãy thử lại.";
                      case SpeechRecognizer.ERROR_SPEECH_TIMEOUT:
                          return "Không nghe thấy lời nói.";
                      case SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS:
                          return "Chưa được cấp quyền micro.";
                      case SpeechRecognizer.ERROR_NETWORK:
                      case SpeechRecognizer.ERROR_NETWORK_TIMEOUT:
                          return "Dịch vụ nhận dạng gặp lỗi mạng.";
                      case SpeechRecognizer.ERROR_RECOGNIZER_BUSY:
                          return "Bộ nhận dạng đang bận.";
                      case SpeechRecognizer.ERROR_CLIENT:
                          return "SpeechRecognizer báo lỗi nội bộ (mã 5).";
                      default:
                          return "Nhận dạng thất bại. Mã lỗi: " + error;
                  }
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(
                          requestCode, permissions, grantResults);
                  if (requestCode == MIC_REQUEST
                          && grantResults.length > 0
                          && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      startVoice();
                  } else if (requestCode == MIC_REQUEST) {
                      status.setText("Bạn cần cấp quyền micro.");
                  }
              }

              private void stopRecognizer() {
                  SpeechRecognizer old = recognizer;
                  recognizer = null;
                  if (old != null) {
                      try {
                          old.cancel();
                      } catch (RuntimeException ignored) {
                      }
                      try {
                          old.destroy();
                      } catch (RuntimeException ignored) {
                      }
                  }
              }

              @Override
              protected void onDestroy() {
                  handler.removeCallbacks(silenceRunnable);
                  handler.removeCallbacks(hideRunnable);
                  stopRecognizer();
                  super.onDestroy();
              }
          }
          EOF

      - name: Validate generated source
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          root = pathlib.Path("carassistant-voice")
          manifest = root / "app/src/main/AndroidManifest.xml"
          main = root / "app/src/main/java/com/carassistant/voice/MainActivity.java"
          overlay = root / "app/src/main/java/com/carassistant/voice/FloatingMicService.java"

          ET.parse(manifest)

          for path in (main, overlay):
              text = path.read_text(encoding="utf-8")
              assert text.strip(), f"Empty source: {path}"
              assert text.count("{") == text.count("}"), \
                  f"Unbalanced braces: {path}"

          java = main.read_text(encoding="utf-8")
          service = overlay.read_text(encoding="utf-8")

          checks = {
              "Vietnamese recognition": '"vi-VN"' in java,
              "4-second silence timer": "SILENCE_MS = 4000L" in java,
              "End beep": "TONE_PROP_ACK" in java,
              "Auto-hide": "HIDE_MS = 2500L" in java,
              "Overlay permission flow": "ACTION_MANAGE_OVERLAY_PERMISSION" in java,
              "Floating overlay window": "TYPE_APPLICATION_OVERLAY" in service,
              "Foreground notification": "startForeground(301" in service,
              "Unknown-command feedback": "ACTION: UNKNOWN" in java,
          }

          for label, passed in checks.items():
              print(("PASS" if passed else "FAIL") + ": " + label)
              assert passed, "Missing feature: " + label

          print("PASS: manifest XML parse")
          print("PASS: Java source structural checks")
          PY

      - name: Build standalone Voice APK
        shell: bash
        run: |
          set -euo pipefail
          cd carassistant-voice
          gradle --no-daemon --stacktrace assembleDebug

      - name: Package APK and checksum
        shell: bash
        run: |
          set -euo pipefail

          APK="carassistant-voice/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          mkdir -p dist
          cp "$APK" dist/CarAssistant-Voice-Standalone-V3.apk

          sha256sum dist/CarAssistant-Voice-Standalone-V3.apk \
            > dist/CarAssistant-Voice-Standalone-V3.sha256

          cat dist/CarAssistant-Voice-Standalone-V3.sha256

      - name: Upload standalone Voice V3
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-Voice-Standalone-V3
          path: |
            dist/CarAssistant-Voice-Standalone-V3.apk
            dist/CarAssistant-Voice-Standalone-V3.sha256
          if-no-files-found: error
