name: Build Car Assistant V4.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v4:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create V4 source from V3
        run: |
          rm -rf v4-source
          cp -R v3-source v4-source

          python3 - <<'PY'
          from pathlib import Path

          root = Path("v4-source")

          # Update version
          gradle = root / "app/build.gradle.kts"
          s = gradle.read_text()
          s = s.replace("versionCode = 1", "versionCode = 4")
          s = s.replace('versionName = "1.0"', 'versionName = "4.1"')
          gradle.write_text(s)

          # Update media service
          service = root / "app/src/main/java/com/carassistant/service/CarMediaService.kt"
          s = service.read_text()

          s = s.replace(
              'if (requested.mediaId == "test-audio") testItem() else requested',
              'if (requested.mediaId == "internet-audio") internetItem() else requested'
          )

          s = s.replace(
              'private fun testItem(): MediaItem = MediaItem.Builder()',
              'private fun internetItem(): MediaItem = MediaItem.Builder()'
          )

          s = s.replace(
              'setMediaId("test-audio")',
              'setMediaId("internet-audio")'
          )

          s = s.replace(
              'setUri(Uri.parse("android.resource://com.carassistant/raw/test_audio"))',
              'setUri(Uri.parse("https://raw.githubusercontent.com/nguyenvantien2111998123-jpg/CarAssistant/main/v3-source/app/src/main/res/raw/test_audio.wav"))'
          )

          s = s.replace(
              'setTitle("Car Assistant Test")',
              'setTitle("Car Assistant Internet Test")'
          )

          s = s.replace(
              'setArtist("Phase A - Offline Test")',
              'setArtist("V4.1 - Internet Audio")'
          )

          service.write_text(s)

          print("V4.1 source prepared")
          PY

      - name: Commit V4 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add v4-source

          if git diff --cached --quiet; then
            echo "No V4 source changes to commit"
          else
            git commit -m "Add Car Assistant V4.1 Internet audio source"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: v4-source
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload V4.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: car-assistant-phase-a-v4-1-debug-apk
          path: v4-source/app/build/outputs/apk/debug/app-debug.apk
