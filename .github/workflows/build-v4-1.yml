name: Build Car Assistant V4.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v4:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create V4 source from V3
        run: |
          rm -rf v4-source
          cp -R v3-source v4-source

          python3 - <<'PY'
          from pathlib import Path

          root = Path("v4-source")

          # Update app version
          gradle = root / "app/build.gradle.kts"
          s = gradle.read_text()

          s = s.replace(
              "versionCode = 1",
              "versionCode = 4"
          )

          s = s.replace(
              'versionName = "1.0"',
              'versionName = "4.1"'
          )

          gradle.write_text(s)

          # Update media service
          service = root / "app/src/main/java/com/carassistant/service/CarMediaService.kt"
          s = service.read_text()

          # Change media ID
          s = s.replace(
              'setMediaId("test-audio")',
              'setMediaId("internet-audio")'
          )

          # Change controller request mapping
          s = s.replace(
              'if (requested.mediaId == "test-audio") testItem() else requested',
              'if (requested.mediaId == "internet-audio") internetItem() else requested'
          )

          # Change library item
          s = s.replace(
              'parentId == "root") ImmutableList.of(testItem())',
              'parentId == "root") ImmutableList.of(internetItem())'
          )

          # Change function name
          s = s.replace(
              'private fun testItem(): MediaItem = MediaItem.Builder()',
