name: Build Navigation V2 MapLibre Dependency Fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout locked Navigation V1 baseline
        uses: actions/checkout@v4
        with:
          ref: 9b2fc5b3f24b32ff4f2ed7ddb6d794cdb5f647f9
          fetch-depth: 1

      - name: Verify baseline
        shell: bash
        run: |
          set -e

          EXPECTED="9b2fc5b3f24b32ff4f2ed7ddb6d794cdb5f647f9"
          ACTUAL="$(git rev-parse HEAD)"

          test "$ACTUAL" = "$EXPECTED"

          echo "Baseline OK: $ACTUAL"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify project
        shell: bash
        run: |
          set -e

          test -f v10-source/settings.gradle
          test -f v10-source/app/build.gradle

          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java

          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java

          echo "Project verification OK"

      - name: Hash protected Projection Core before changes
        shell: bash
        run: |
          set -e

          sha256sum \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java \
            > /tmp/projection-core-before.txt

      - name: Add MapLibre dependency only
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path("v10-source/app/build.gradle")
          source = path.read_text()

          dependency = '    implementation "org.maplibre.gl:android-sdk:11.11.0"'

          if "org.maplibre.gl:android-sdk:" in source:
              raise SystemExit(
                  "MapLibre dependency already exists; refusing to modify anything else"
              )

          marker = "dependencies {"

          if source.count(marker) != 1:
              raise SystemExit(
                  "Expected exactly one dependencies block"
              )

          source = source.replace(
              marker,
              marker + "\n" + dependency,
              1
          )

          path.write_text(source)

          print("MapLibre dependency added:")
          print(dependency)
          PY

      - name: Verify MapLibre dependency only
        shell: bash
        run: |
          set -e

          FILE="v10-source/app/build.gradle"

          COUNT="$(grep -Fc 'implementation "org.maplibre.gl:android-sdk:11.11.0"' "$FILE")"

          test "$COUNT" = "1"

          grep -Fq 'org.maplibre.gl:android-sdk:11.11.0' "$FILE"

          echo "MapLibre dependency verification OK"

      - name: Verify Navigation V2 source unchanged
        shell: bash
        run: |
          set -e

          NAV="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"
          ACTIVITY="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          test -f "$NAV"
          test -f "$ACTIVITY"

          echo "Navigation V2 source files were not patched"

      - name: Verify Navigation card click untouched
        shell: bash
        run: |
          set -e

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          if grep -Fq "map.setOnClickListener(v -> {" "$FILE"; then
              echo "Existing Navigation card click code preserved"
          else
              echo "Navigation card click was not modified by this workflow"
          fi

      - name: Hash protected Projection Core after changes
        shell: bash
        run: |
          set -e

          sha256sum \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java \
            > /tmp/projection-core-after.txt

          diff -u \
            /tmp/projection-core-before.txt \
            /tmp/projection-core-after.txt

          echo "Projection Core unchanged"

      - name: Check source diff
        shell: bash
        run: |
          set -e

          git diff --check

          echo "Changed files:"
          git status --short

          echo "Diff:"
          git diff --stat

          CHANGED="$(git status --short | awk '{print $2}' | sort)"

          EXPECTED="v10-source/app/build.gradle"

          test "$CHANGED" = "$EXPECTED"

          echo "Only app/build.gradle was changed"

      - name: Build APK
        shell: bash
        run: |
          set -e

          chmod +x v10-source/gradlew

          cd v10-source

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          ls -lh "$APK"

          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: carassistant-navigation-v2-maplibre-dependency-fix
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
