name: Verify V10 Clean Baseline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify baseline commit
        run: |
          set -euo pipefail
          BASELINE_COMMIT="e8926fc1609679042d0ba3d59dba4c312062e72c"
          ACTUAL_COMMIT="$(git rev-parse HEAD)"

          echo "Baseline commit: $BASELINE_COMMIT"
          echo "Current commit:  $ACTUAL_COMMIT"

          if ! git merge-base --is-ancestor "$BASELINE_COMMIT" "$ACTUAL_COMMIT"; then
            echo "::error::Current commit $ACTUAL_COMMIT is not based on baseline commit $BASELINE_COMMIT!"
            exit 1
          fi

          echo "Baseline commit ancestor check passed."

      - name: Verify Java source structure
        run: |
          set -euo pipefail
          JAVA_DIR="v10-source/app/src/main/java"

          if [ ! -d "$JAVA_DIR/com/carassistant/v10" ]; then
            echo "::error::Directory $JAVA_DIR/com/carassistant/v10 does not exist!"
            exit 1
          fi

          if [ -d "$JAVA_DIR/com/hieptran" ]; then
            echo "::error::Legacy directory $JAVA_DIR/com/hieptran still exists!"
            exit 1
          fi

          JAVA_COUNT=$(find "$JAVA_DIR/com/carassistant/v10" -type f -name "*.java" | wc -l)
          echo "Found $JAVA_COUNT Java files in com/carassistant/v10."

          if [ "$JAVA_COUNT" -ne 32 ]; then
            echo "::error::Expected 32 Java files, but found $JAVA_COUNT!"
            exit 1
          fi

          echo "Java source structure verification passed."

      - name: Verify package declarations
        run: |
          set -euo pipefail
          JAVA_DIR="v10-source/app/src/main/java"

          INVALID_PACKAGES=$(find "$JAVA_DIR" -type f -name "*.java" -exec grep -Hn "^package " {} + | grep -v "package com\.carassistant\.v10" || true)

          if [ -n "$INVALID_PACKAGES" ]; then
            echo "::error::Found Java files with invalid package declarations:"
            echo "$INVALID_PACKAGES"
            exit 1
          fi

          LEGACY_REFS=$(find "$JAVA_DIR" -type f -name "*.java" -exec grep -Hn "com\.hieptran" {} + || true)

          if [ -n "$LEGACY_REFS" ]; then
            echo "::error::Found legacy package references in Java source:"
            echo "$LEGACY_REFS"
            exit 1
          fi

          echo "Package declarations verified successfully."

      - name: Verify xposed_init
        run: |
          set -euo pipefail
          XPOSED_INIT="v10-source/app/src/main/assets/xposed_init"

          if [ ! -f "$XPOSED_INIT" ]; then
            echo "::error::File $XPOSED_INIT does not exist!"
            exit 1
          fi

          CONTENT=$(cat "$XPOSED_INIT")
          EXPECTED="com.carassistant.v10.aabridge.AACastBridge"

          if [ "$CONTENT" != "$EXPECTED" ]; then
            echo "::error::xposed_init content mismatch! Expected '$EXPECTED', got '$CONTENT'"
            exit 1
          fi

          echo "xposed_init verified successfully."

      - name: Verify Android manifest
        run: |
          set -euo pipefail
          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "::error::File $MANIFEST does not exist!"
            exit 1
          fi

          if grep -q "com\.hieptran" "$MANIFEST"; then
            echo "::error::Legacy package found in AndroidManifest.xml!"
            exit 1
          fi

          REQUIRED_COMPONENTS=(
            "com.carassistant.v10.V10LauncherActivity"
            "com.carassistant.v10.V10CarActivity"
            "com.carassistant.v10.V10ControlReceiver"
            "com.carassistant.v10.AACastCarService"
            "com.carassistant.v10.DockStateProvider"
          )

          for comp in "${REQUIRED_COMPONENTS[@]}"; do
            if ! grep -q "$comp" "$MANIFEST"; then
              echo "::error::Required component $comp not found in AndroidManifest.xml!"
              exit 1
            fi
          done

          echo "AndroidManifest.xml verified successfully."

      - name: Verify ProGuard
        run: |
          set -euo pipefail
          PROGUARD="v10-source/app/proguard-rules.pro"

          if [ ! -f "$PROGUARD" ]; then
            echo "::error::File $PROGUARD does not exist!"
            exit 1
          fi

          if grep -q "com\.hieptran" "$PROGUARD"; then
            echo "::error::Legacy package found in proguard-rules.pro!"
            exit 1
          fi

          if ! grep -q "com\.carassistant\.v10" "$PROGUARD"; then
            echo "::error::New package reference missing from proguard-rules.pro!"
            exit 1
          fi

          echo "ProGuard rules verified successfully."

      - name: Verify workflows and tools
        run: |
          set -euo pipefail
          echo "Verifying workflow files and configurations..."

          # Xây dựng danh sách đường dẫn tồn tại thực tế
          TARGET_PATHS=()
          [ -d ".github" ] && TARGET_PATHS+=(".github")
          [ -d "v10-source" ] && TARGET_PATHS+=("v10-source")
          [ -f "README.md" ] && TARGET_PATHS+=("README.md")
          [ -f "README.vi.md" ] && TARGET_PATHS+=("README.vi.md")
          [ -f "v10-source/README.md" ] && TARGET_PATHS+=("v10-source/README.md")
          [ -f "v10-source/README.vi.md" ] && TARGET_PATHS+=("v10-source/README.vi.md")

          if [ ${#TARGET_PATHS[@]} -eq 0 ]; then
            echo "::error::No target paths found for verification!"
            exit 1
          fi

          # Lấy danh sách file và loại trừ chính xác 2 workflow chứa legacy string cố ý
          CHECK_FILES=$(find "${TARGET_PATHS[@]}" -type f \
            ! -path "./.github/workflows/cleanup-carassistant-v10-source-structure.yml" \
            ! -path "./.github/workflows/verify-v10-clean-baseline.yml" \
            ! -path ".github/workflows/cleanup-carassistant-v10-source-structure.yml" \
            ! -path ".github/workflows/verify-v10-clean-baseline.yml")

          # Thực hiện grep an toàn
          LEGACY_MATCHES=$(echo "$CHECK_FILES" | xargs -r grep -n "com\.hieptran" || true)

          if [ -n "$LEGACY_MATCHES" ]; then
            echo "::error::Legacy package string 'com.hieptran' found in target files:"
            echo "$LEGACY_MATCHES"
            exit 1
          fi

          echo "Workflows and tools verified successfully. No legacy references found."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify Gradle configuration
        run: |
          set -euo pipefail
          cd v10-source
          chmod +x gradlew
          ./gradlew tasks --console=plain

      - name: Compile V10 Java sources
        run: |
          set -euo pipefail
          cd v10-source
          ./gradlew compileDebugJavaWithJavac --console=plain

      - name: Assemble V10 debug APK
        run: |
          set -euo pipefail
          cd v10-source
          ./gradlew assembleDebug --console=plain

      - name: Final baseline verification
        run: |
          set -euo pipefail
          BASELINE_COMMIT="e8926fc1609679042d0ba3d59dba4c312062e72c"
          ACTUAL_COMMIT="$(git rev-parse HEAD)"

          if ! git merge-base --is-ancestor "$BASELINE_COMMIT" "$ACTUAL_COMMIT"; then
            echo "::error::Baseline check failed at final step!"
            exit 1
          fi

          echo "Final baseline check passed."

      - name: Upload V10 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-debug
          path: v10-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
