          python3 - "$FILE" /tmp/home_v1.java <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding='utf-8')
          home = Path(sys.argv[2]).read_text(encoding='utf-8')

          def replace_method(src, signature, replacement):
              start = src.find(signature)
              if start < 0:
                  raise SystemExit('Missing ' + signature)

              brace = src.find('{', start)
              depth = 0
              i = brace
              end = -1

              in_str = False
              esc = False
              line = False
              block = False

              while i < len(src):
                  c = src[i]
                  n = src[i + 1] if i + 1 < len(src) else ''

                  if line:
                      if c == '\n':
                          line = False
                  elif block:
                      if c == '*' and n == '/':
                          block = False
                          i += 1
                  elif in_str:
                      if esc:
                          esc = False
                      elif c == '\\':
                          esc = True
                      elif c == '"':
                          in_str = False
                  else:
                      if c == '/' and n == '/':
                          line = True
                          i += 1
                      elif c == '/' and n == '*':
                          block = True
                          i += 1
                      elif c == '"':
                          in_str = True
                      elif c == '{':
                          depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              break

                  i += 1

              if end < 0:
                  raise SystemExit('Unclosed ' + signature)

              return src[:start] + replacement + src[end:]

          s = replace_method(
              s,
              '    private void buildDashboard()',
              home
          )

          if 'am force-stop' in s:
              raise SystemExit('Forbidden: am force-stop')

          if 'V10ProjectionService' in s:
              raise SystemExit('Forbidden: V10ProjectionService')

          if 'floatingLastTap' in s:
              raise SystemExit('Forbidden: floatingLastTap')

          for marker in [
              '3D DARK MAP',
              'Vị trí hiện tại',
              'addHomeSideButton',
              'addVehicleStat',
              'Chưa phát nhạc'
          ]:
              if marker not in s:
                  raise SystemExit('Missing Home V1 marker: ' + marker)

          p.write_text(s, encoding='utf-8')
          print('Home V1 source patch OK')
          PY
          s=replace_method(s,'    private void buildDashboard()',home)

          # Ensure Core V1 lifecycle is untouched: onStop contains no release().
          start=s.find('    @Override\n    public void onStop()')
          if start<0: raise SystemExit('onStop missing')
          brace=s.find('{',start); depth=0; i=brace; end=-1
          while i<len(s):
              if s[i]=='{': depth+=1
              elif s[i]=='}':
                  depth-=1
                  if depth==0: end=i+1; break
              i+=1
          body=s[brace:end]
          if 'session.release()' in body: raise SystemExit('Home patch touched Core V1 onStop')

          for bad in ['am force-stop','V10ProjectionService','floatingLastTap']:
              if bad in s: raise SystemExit('Forbidden marker: '+bad)
          for good in ['3D DARK MAP','Vị trí hiện tại','addHomeSideButton','addVehicleStat','Chưa phát nhạc']:
              if good not in s: raise SystemExit('Missing Home V1 marker: '+good)
          p.write_text(s,encoding='utf-8')
          print('Home V1 source patch OK')
          PY

      - name: Verify Home V1 boundaries
        shell: bash
        run: |
          set -euo pipefail
          A=v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java
          S=v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java
          D=v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java
          grep -Fq '3D DARK MAP' "$A"
          grep -Fq 'Vị trí hiện tại' "$A"
          grep -Fq 'addHomeSideButton' "$A"
          grep -Fq 'addVehicleStat' "$A"
          grep -Fq 'Chưa phát nhạc' "$A"
          grep -Fq 'createVirtualDisplay' "$D"
          grep -Fq -- '--activity-reorder-to-front' "$D"
          grep -Fq 'session.hideTask()' "$A"
          if grep -Fq 'am force-stop' "$S"; then exit 1; fi
          if grep -Fq 'V10ProjectionService' "$S"; then exit 1; fi
          if grep -Fq 'floatingLastTap' "$A"; then exit 1; fi
          python3 - "$A" <<'PY'
          from pathlib import Path
          import re,sys
          s=Path(sys.argv[1]).read_text(encoding='utf-8')
          m=re.search(r'public void onStop\(\)\s*\{(.*?)\n\s*\}',s,re.S)
          if not m: raise SystemExit('onStop not found')
          if 'session.release()' in m.group(1): raise SystemExit('Core V1 onStop release detected')
          print('onStop Core V1 check OK')
          PY
          echo 'Home V1 architecture verification PASSED.'

      - name: Compile Java
        working-directory: v10-source
        run: ./gradlew --no-daemon --stacktrace compileDebugJavaWithJavac

      - name: Build APK
        working-directory: v10-source
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Locate APK and SHA256
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "APK=$APK"
          sha256sum "$APK"

      - name: Upload Home V1 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Core-V1-Home-V1
          path: v10-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
