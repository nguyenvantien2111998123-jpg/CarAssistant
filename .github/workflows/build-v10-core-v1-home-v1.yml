name: Build Car Assistant V10 Core V1 - Home V1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rebuild exact Display Core V1 independently
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          wf = Path('.github/workflows/build-v10-display-core-v1.yml')
          if not wf.is_file():
              raise SystemExit('Missing build-v10-display-core-v1.yml')

          doc = yaml.safe_load(wf.read_text(encoding='utf-8'))
          steps = doc['jobs']['build']['steps']
          selected = []

          for step in steps:
              if step.get('name') == 'Build V10 Display Core V1':
                  break
              if 'run' in step and not step.get('uses'):
                  selected.append(step)

          if not selected:
              raise SystemExit('Core V1 reconstruction steps not found')

          for step in selected:
              name = step.get('name', 'unnamed')
              print(f'CORE V1 > {name}')
              subprocess.run(
                  ['bash', '-euo', 'pipefail', '-c', step['run']],
                  check=True
              )

          print('Exact Display Core V1 reconstructed.')
          PY

      - name: Apply SAFE Floating Touch directly - no intermediate workflow
        shell: bash
        run: |
          set -euo pipefail
          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding='utf-8')

          def replace_method(src, signature, replacement):
              start = src.find(signature)
              if start < 0:
                  raise SystemExit(f'Missing method: {signature}')
              brace = src.find('{', start)
              if brace < 0:
                  raise SystemExit(f'Missing opening brace: {signature}')
              depth = 0
              i = brace
              in_string = False
              escape = False
              line_comment = False
              block_comment = False
              while i < len(src):
                  c = src[i]
                  n = src[i + 1] if i + 1 < len(src) else ''
                  if line_comment:
                      if c == '\n': line_comment = False
                  elif block_comment:
                      if c == '*' and n == '/': block_comment = False; i += 1
                  elif in_string:
                      if escape: escape = False
                      elif c == '\\': escape = True
                      elif c == '"': in_string = False
                  else:
                      if c == '/' and n == '/': line_comment = True; i += 1
                      elif c == '/' and n == '*': block_comment = True; i += 1
                      elif c == '"': in_string = True
                      elif c == '{': depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              return src[:start] + replacement + src[i + 1:]
                  i += 1
              raise SystemExit(f'Unclosed method: {signature}')

          # Imports used only by this feature.
          anchor = 'import android.content.pm.ResolveInfo;'
          imports = [
              'import android.content.SharedPreferences;',
              'import android.os.SystemClock;',
              'import android.view.MotionEvent;',
              'import android.view.ViewConfiguration;',
              'import android.view.ViewGroup;',
          ]
          if anchor not in s:
              raise SystemExit('ResolveInfo import marker missing')
          for imp in imports:
              if imp not in s:
                  s = s.replace(anchor, anchor + '\n' + imp, 1)

          # Floating Touch state. No task/persistence/display state is added.
          field_anchor = '    private V10ProjectionSession session;'
          fields = '''
              private TextView floatingTouchKey;
              private LinearLayout floatingMenu;
              private boolean floatingDragging;
              private float floatingDownRawX;
              private float floatingDownRawY;
              private int floatingStartX;
              private int floatingStartY;
              private long floatingDownTime;
          '''
          if 'private TextView floatingTouchKey;' not in s:
              if field_anchor not in s:
                  raise SystemExit('Projection session field marker missing')
              s = s.replace(field_anchor, field_anchor + fields.rstrip(), 1)

          # Insert the complete Floating Touch implementation immediately before attachProjection().
          if 'private void createFloatingTouchKey()' not in s:
              marker = '    private void attachProjection()'
              if marker not in s:
                  raise SystemExit('attachProjection marker missing')

              methods = '''    private void createFloatingTouchKey() {
                  if (floatingTouchKey != null) {
                      return;
                  }

                  floatingTouchKey = new TextView(this);
                  floatingTouchKey.setText("●");
                  floatingTouchKey.setTextColor(Color.WHITE);
                  floatingTouchKey.setTextSize(22);
                  floatingTouchKey.setGravity(Gravity.CENTER);

                  GradientDrawable bg = new GradientDrawable();
                  bg.setShape(GradientDrawable.OVAL);
                  bg.setColor(Color.rgb(25, 35, 45));
                  bg.setStroke(dp(2), Color.rgb(80, 170, 230));
                  floatingTouchKey.setBackground(bg);
                  floatingTouchKey.setElevation(dp(12));

                  SharedPreferences prefs =
                          getSharedPreferences("v10_floating_key", MODE_PRIVATE);

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  dp(58),
                                  dp(58),
                                  Gravity.TOP | Gravity.END);

                  params.rightMargin = prefs.getInt("x", dp(18));
                  params.topMargin = prefs.getInt("y", dp(120));

                  projectionLayer.addView(floatingTouchKey, params);

                  floatingTouchKey.setOnTouchListener((view, event) -> {
                      switch (event.getActionMasked()) {
                          case MotionEvent.ACTION_DOWN:
                              floatingDragging = false;
                              floatingDownRawX = event.getRawX();
                              floatingDownRawY = event.getRawY();
                              floatingDownTime = SystemClock.uptimeMillis();

                              ViewGroup.LayoutParams lp = view.getLayoutParams();
                              if (lp instanceof FrameLayout.LayoutParams) {
                                  FrameLayout.LayoutParams fp =
                                          (FrameLayout.LayoutParams) lp;
                                  floatingStartX = fp.rightMargin;
                                  floatingStartY = fp.topMargin;
                              }
                              return true;

                          case MotionEvent.ACTION_MOVE:
                              float dx = event.getRawX() - floatingDownRawX;
                              float dy = event.getRawY() - floatingDownRawY;

                              if (!floatingDragging
                                      && Math.hypot(dx, dy)
                                      > ViewConfiguration.get(this).getScaledTouchSlop()) {
                                  floatingDragging = true;
                              }

                              if (floatingDragging) {
                                  int width = projectionLayer.getWidth();
                                  int height = projectionLayer.getHeight();
                                  int keySize = dp(58);

                                  int right = Math.round(floatingStartX - dx);
                                  int top = Math.round(floatingStartY + dy);

                                  right = Math.max(0,
                                          Math.min(Math.max(0, width - keySize), right));
                                  top = Math.max(0,
                                          Math.min(Math.max(0, height - keySize), top));

                                  FrameLayout.LayoutParams fp =
                                          (FrameLayout.LayoutParams) view.getLayoutParams();
                                  fp.rightMargin = right;
                                  fp.topMargin = top;
                                  view.setLayoutParams(fp);
                              }
                              return true;

                          case MotionEvent.ACTION_UP:
                              if (floatingDragging) {
                                  FrameLayout.LayoutParams fp =
                                          (FrameLayout.LayoutParams) view.getLayoutParams();
                                  prefs.edit()
                                          .putInt("x", fp.rightMargin)
                                          .putInt("y", fp.topMargin)
                                          .apply();
                                  floatingDragging = false;
                                  return true;
                              }

                              long held =
                                      SystemClock.uptimeMillis() - floatingDownTime;

                              if (held >= ViewConfiguration.getLongPressTimeout()) {
                                  handleControlHome();
                                  hideFloatingMenu();
                              } else {
                                  showFloatingMenu();
                              }

                              view.performClick();
                              return true;

                          case MotionEvent.ACTION_CANCEL:
                              floatingDragging = false;
                              return true;

                          default:
                              return true;
                      }
                  });

                  floatingTouchKey.bringToFront();
              }

              private void showFloatingMenu() {
                  if (floatingMenu != null) {
                      hideFloatingMenu();
                      return;
                  }

                  floatingMenu = new LinearLayout(this);
                  floatingMenu.setOrientation(LinearLayout.VERTICAL);
                  floatingMenu.setPadding(dp(8), dp(8), dp(8), dp(8));

                  GradientDrawable menuBg = new GradientDrawable();
                  menuBg.setColor(Color.rgb(15, 20, 26));
                  menuBg.setCornerRadius(dp(16));
                  menuBg.setStroke(dp(1), Color.rgb(65, 85, 105));
                  floatingMenu.setBackground(menuBg);
                  floatingMenu.setElevation(dp(14));

                  addFloatingMenuButton("BACK", () -> {
                      handleControlBack();
                      hideFloatingMenu();
                  });

                  addFloatingMenuButton("HOME", () -> {
                      handleControlHome();
                      hideFloatingMenu();
                  });

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  dp(170),
                                  -2,
                                  Gravity.TOP | Gravity.END);
                  params.setMargins(0, dp(70), dp(18), 0);
                  projectionLayer.addView(floatingMenu, params);
                  floatingMenu.bringToFront();
                  floatingTouchKey.bringToFront();
              }

              private void hideFloatingMenu() {
                  if (floatingMenu != null) {
                      projectionLayer.removeView(floatingMenu);
                      floatingMenu = null;
                  }
              }

              private void addFloatingMenuButton(
                      String label,
                      Runnable action) {
                  TextView button = buttonText(label);
                  button.setTextSize(14);
                  button.setOnClickListener(v -> action.run());
                  floatingMenu.addView(
                          button,
                          new LinearLayout.LayoutParams(dp(154), dp(58)));
              }

          '''
              s = s.replace(marker, methods + marker, 1)

          # Hook the floating key after the complete existing TextureView listener call.
# Parse the real Java call structurally so indentation/line wrapping cannot break the patch.
if 'createFloatingTouchKey();' not in s:
    texture_pos = s.find('textureView')
    if texture_pos < 0:
        raise SystemExit('TextureView marker missing')

    listener_pos = s.find('.setOnTouchListener', texture_pos)
    if listener_pos < 0:
        raise SystemExit('setOnTouchListener marker missing')

    open_paren = s.find('(', listener_pos)
    if open_paren < 0:
        raise SystemExit('setOnTouchListener opening parenthesis missing')

    depth = 0
    i = open_paren
    in_string = False
    escape = False
    line_comment = False
    block_comment = False
    insert_at = -1

    while i < len(s):
        c = s[i]
        n = s[i + 1] if i + 1 < len(s) else ''

        if line_comment:
            if c == '\n':
                line_comment = False
        elif block_comment:
            if c == '*' and n == '/':
                block_comment = False
                i += 1
        elif in_string:
            if escape:
                escape = False
            elif c == '\\':
                escape = True
            elif c == '"':
                in_string = False
        else:
            if c == '/' and n == '/':
                line_comment = True
                i += 1
            elif c == '/' and n == '*':
                block_comment = True
                i += 1
            elif c == '"':
                in_string = True
            elif c == '(':
                depth += 1
            elif c == ')':
                depth -= 1
                if depth == 0:
                    insert_at = i + 1
                    break
        i += 1

    if insert_at < 0:
        raise SystemExit('Could not parse setOnTouchListener call')

    s = s[:insert_at] + '\n\n        createFloatingTouchKey();' + s[insert_at:]

          # Core V1: Activity onStop must not destroy/hide the task.
          onstop = '    @Override\n    public void onStop()'
          if onstop not in s:
              raise SystemExit('onStop marker missing')
          start = s.find(onstop)
          brace = s.find('{', start)
          depth = 0
          end = -1
          i = brace
          while i < len(s):
              if s[i] == '{': depth += 1
              elif s[i] == '}':
                  depth -= 1
                  if depth == 0:
                      end = i
                      break
              i += 1
          if end < 0:
              raise SystemExit('Could not parse onStop()')

          replacement = '''    @Override
              public void onStop() {
                  resumed = false;
                  handler.removeCallbacks(clockTicker);
                  handler.removeCallbacks(targetPoller);
                  super.onStop();
              }'''
          s = s[:start] + replacement + s[end + 1:]

          # Hard guard against accidental legacy Floating Touch features.
          for bad in [
              'floatingLastTap',
              'session.recents()',
              '"RECENTS"',
              '"2 SCREEN"',
              '"3 SCREEN"',
              'setLayoutModeExternal(',
          ]:
              if bad in s:
                  raise SystemExit(f'Forbidden Floating Touch content: {bad}')

          if 'floatingDownTime = SystemClock.uptimeMillis();' not in s:
              raise SystemExit('Long-press timestamp missing')
          if 'ViewConfiguration.getLongPressTimeout()' not in s:
              raise SystemExit('Long-press timeout missing')
          if 'addFloatingMenuButton("BACK"' not in s:
              raise SystemExit('BACK menu missing')
          if 'addFloatingMenuButton("HOME"' not in s:
              raise SystemExit('HOME menu missing')
          if 'session.release();' in s[s.find(onstop):s.find(onstop)+1000]:
              raise SystemExit('session.release() remains inside onStop()')

          p.write_text(s, encoding='utf-8')
          print('SAFE Floating Touch applied directly. No intermediate workflow used.')
          PY

