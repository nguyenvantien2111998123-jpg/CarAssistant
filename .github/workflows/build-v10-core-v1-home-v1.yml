      - name: Verify complete architecture before build
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"
          ACTIVITY="$SRC/V10CarActivity.java"
          SESSION="$SRC/V10ProjectionSession.java"
          DISPLAY="$SRC/V10DisplayController.java"
          TASK="$SRC/V10TaskSession.java"
          SURFACE="$SRC/V10SurfaceManager.java"

          for f in "$ACTIVITY" "$SESSION" "$DISPLAY" "$TASK" "$SURFACE"; do
            test -f "$f"
          done

          # Core V1
          grep -Fq "createVirtualDisplay" "$DISPLAY"
          grep -Fq -- "--activity-reorder-to-front" "$DISPLAY"
          grep -Fq "State.HIDDEN" "$SESSION"
          grep -Fq "session.hideTask()" "$ACTIVITY"
          grep -Fq "class V10TaskSession" "$TASK"
          grep -Fq "class V10SurfaceManager" "$SURFACE"

          # onStop must not release the projection task.
          python3 - "$ACTIVITY" <<'PY'
          from pathlib import Path
          import sys
          s = Path(sys.argv[1]).read_text(encoding='utf-8')
          start = s.find('public void onStop()')
          if start < 0:
              raise SystemExit('onStop() not found')
          brace = s.find('{', start)
          depth = 0
          i = brace
          while i < len(s):
              if s[i] == '{': depth += 1
              elif s[i] == '}':
                  depth -= 1
                  if depth == 0:
                      body = s[brace:i+1]
                      break
              i += 1
          else:
              raise SystemExit('onStop() parse failed')
          if 'session.release()' in body:
              raise SystemExit('ERROR: session.release() remains inside onStop()')
          print('onStop() Core V1 check PASSED')
          PY

          # Floating Touch V1 SAFE
          grep -Fq "private TextView floatingTouchKey;" "$ACTIVITY"
          grep -Fq "private void createFloatingTouchKey()" "$ACTIVITY"
          grep -Fq "floatingDownTime = SystemClock.uptimeMillis();" "$ACTIVITY"
          grep -Fq "ViewConfiguration.getLongPressTimeout()" "$ACTIVITY"
          grep -Fq 'addFloatingMenuButton("BACK"' "$ACTIVITY"
          grep -Fq 'addFloatingMenuButton("HOME"' "$ACTIVITY"
          grep -Fq "floatingDragging" "$ACTIVITY"

          # Home V1
          grep -Fq "3D DARK MAP" "$ACTIVITY"
          grep -Fq "Vị trí hiện tại" "$ACTIVITY"
          grep -Fq 'addHomeSideButton(side, "☰", "MENU"' "$ACTIVITY"
          grep -Fq 'addHomeSideButton(side, "⌖", "MAP"' "$ACTIVITY"
          grep -Fq 'addHomeSideButton(side, "▣", "FILES"' "$ACTIVITY"
          grep -Fq 'addHomeSideButton(side, "⚙", "SETTINGS"' "$ACTIVITY"
          grep -Fq 'addHomeSideButton(side, "⋮", "MORE"' "$ACTIVITY"
          grep -Fq 'addVehicleStat(stats, "DRIVE", "00:00"' "$ACTIVITY"
          grep -Fq 'addVehicleStat(stats, "SPEED", "0 km/h"' "$ACTIVITY"
          grep -Fq 'addVehicleStat(stats, "DIST", "0.0 km"' "$ACTIVITY"
          grep -Fq "♫  Chưa phát nhạc" "$ACTIVITY"

          # Forbidden old feature paths.
          if grep -Fq "floatingLastTap" "$ACTIVITY"; then exit 1; fi
          if grep -Fq '"RECENTS"' "$ACTIVITY"; then exit 1; fi
          if grep -Fq '"2 SCREEN"' "$ACTIVITY"; then exit 1; fi
          if grep -Fq '"3 SCREEN"' "$ACTIVITY"; then exit 1; fi
          if grep -Fq "setLayoutModeExternal(" "$ACTIVITY"; then exit 1; fi
          if grep -Fq "V10ProjectionService" "$SESSION"; then exit 1; fi
          if grep -Fq "am force-stop" "$SESSION"; then exit 1; fi
          if grep -Fq "am force-stop" "$DISPLAY"; then exit 1; fi
          if grep -Fq '\\n    private void createFloatingTouchKey()' "$ACTIVITY"; then exit 1; fi

          echo "CORE V1 + FLOATING TOUCH SAFE + HOME V1 verification PASSED."

      - name: Compile Java
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace compileDebugJavaWithJavac

      - name: Build APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Locate APK and SHA256
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find v10-source/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -f "$APK"
          echo "APK=$APK"
          sha256sum "$APK"

      - name: Upload Home V1 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Core-V1-Home-V1
          path: v10-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
