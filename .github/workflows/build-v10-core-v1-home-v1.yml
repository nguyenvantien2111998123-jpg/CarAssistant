    private void addHomeSideButton(
            LinearLayout parent,
            String glyph,
            String label,
            final Runnable action) {

        TextView button = text(glyph, 25, Color.WHITE);
        button.setGravity(Gravity.CENTER);
        button.setContentDescription(label);

        GradientDrawable bg = new GradientDrawable();
        bg.setColor(Color.rgb(19, 27, 33));
        bg.setCornerRadius(dp(14));
        button.setBackground(bg);

        button.setOnClickListener(v -> {
            if (action != null) {
                action.run();
            }
        });

        LinearLayout.LayoutParams lp =
                new LinearLayout.LayoutParams(dp(52), dp(58));
        lp.setMargins(0, dp(4), 0, dp(4));
        parent.addView(button, lp);
    }

    private void addBottomButton(
            LinearLayout parent,
            String glyph,
            String label) {

        TextView button = text(glyph, 24, Color.WHITE);
        button.setGravity(Gravity.CENTER);
        button.setContentDescription(label);

        GradientDrawable bg = new GradientDrawable();
        bg.setColor(Color.rgb(19, 27, 33));
        bg.setCornerRadius(dp(14));
        button.setBackground(bg);

        parent.addView(
                button,
                new LinearLayout.LayoutParams(dp(62), dp(54)));
    }

    private void addVehicleStat(
            LinearLayout parent,
            String glyph,
            String value,
            String label) {

        LinearLayout item = new LinearLayout(this);
        item.setOrientation(LinearLayout.VERTICAL);
        item.setGravity(Gravity.CENTER);

        TextView top =
                text(glyph + "  " + value, 16, Color.WHITE);
        top.setGravity(Gravity.CENTER);

        TextView bottom =
                text(label, 9, Color.LTGRAY);
        bottom.setGravity(Gravity.CENTER);

        item.addView(top);
        item.addView(bottom);

        parent.addView(
                item,
                new LinearLayout.LayoutParams(0, dp(62), 1f));
    }
