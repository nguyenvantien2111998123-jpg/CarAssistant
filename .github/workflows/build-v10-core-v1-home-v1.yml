name: Build Car Assistant V10 Core V1 - Home V1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rebuild exact frozen Display Core V1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, yaml
          wf = Path('.github/workflows/build-v10-display-core-v1.yml')
          doc = yaml.safe_load(wf.read_text(encoding='utf-8'))
          selected=[]
          for step in doc['jobs']['build']['steps']:
              if 'run' in step and not step.get('uses'):
                  selected.append(step)
              if step.get('name') == 'Build V10 Display Core V1':
                  break
          if not selected:
              raise SystemExit('Core V1 run steps not found')
          for step in selected:
              print('CORE >', step.get('name','unnamed'))
              subprocess.run(['bash','-euo','pipefail','-c',step['run']], check=True)
          PY

      - name: Apply existing SAFE Floating Touch patch unchanged
        shell: bash
        run: |
          set -euo pipefail
          PATCH=.github/workflows/build-v10-display-core-v1-floating-touch-longpress-safe.yml
          test -f "$PATCH"
          python3 - "$PATCH" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml
          doc=yaml.safe_load(Path(sys.argv[1]).read_text(encoding='utf-8'))
          names={'Extract only Floating Touch source patch',
                 'Replace the entire Floating Touch listener with SAFE long-press version'}
          found=[]
          for step in doc['jobs']['build']['steps']:
              if step.get('name') in names:
                  found.append(step)
                  subprocess.run(['bash','-euo','pipefail','-c',step['run']],check=True)
          if len(found)!=2:
              raise SystemExit('Expected both SAFE Floating Touch patch steps')
          PY

      - name: Build real Home V1 UI only
        shell: bash
        run: |
          set -euo pipefail
          FILE=v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java
          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text(encoding='utf-8')

          def replace_method(src, signature, replacement):
              start=src.find(signature)
              if start<0: raise SystemExit('Missing '+signature)
              brace=src.find('{',start)
              depth=0; i=brace; end=-1
              in_str=False; esc=False; line=False; block=False
              while i<len(src):
                  c=src[i]; n=src[i+1] if i+1<len(src) else ''
                  if line:
                      if c=='\n': line=False
                  elif block:
                      if c=='*' and n=='/': block=False; i+=1
                  elif in_str:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': in_str=False
                  else:
                      if c=='/' and n=='/': line=True; i+=1
                      elif c=='/' and n=='*': block=True; i+=1
                      elif c=='"': in_str=True
                      elif c=='{': depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0: end=i+1; break
                  i+=1
              if end<0: raise SystemExit('Unclosed '+signature)
              return src[:start]+replacement+src[end:]

