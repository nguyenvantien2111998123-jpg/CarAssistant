          private void rebuildGridFromPanel() {

              rebuildAppGrid(appGrid);
          }

          private void rebuildAppGrid(
                  GridLayout grid) {

              if (grid == null) {
                  return;
              }

              grid.removeAllViews();

              for (AppInfo app : apps) {

                  LinearLayout tile =
                          appTile(app);

                  GridLayout.LayoutParams params =
                          new GridLayout.LayoutParams();

                  params.width = 0;
                  params.height = dp(105);

                  params.columnSpec =
