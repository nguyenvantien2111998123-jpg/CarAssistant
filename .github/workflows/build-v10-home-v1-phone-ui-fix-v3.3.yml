          sidebar_helpers = r'''
          private LinearLayout buildSidebar() {

              LinearLayout side =
                      new LinearLayout(this);

              side.setOrientation(
                      LinearLayout.VERTICAL);

              side.setGravity(
                      Gravity.CENTER_HORIZONTAL);

              side.setPadding(
                      0,
                      dp(4),
                      0,
                      dp(4));

              side.setBackground(
                      roundBg(
                              Color.rgb(15, 21, 29),
                              dp(14)));

              side.addView(
                      sideButton(
                              "▦",
                              "APPS"));

              List<ComponentName> recents =
                      V10SessionStore.getRecents(
                              this);

              for (int i = 0; i < 3; i++) {

                  ComponentName component =
                          i < recents.size()
                                  ? recents.get(i)
                                  : null;

                  side.addView(
                          recentButton(
                                  component,
                                  i + 1));
              }

              TextView tasks =
                      sideButton(
                              "▤",
                              "TASKS");

              tasks.setOnClickListener(
                      v -> showTasks());

              side.addView(tasks);

              return side;
          }

          private void refreshSidebar() {

              if (sidebar == null) {
                  return;
              }

              ViewGroup parent =
                      (ViewGroup) sidebar.getParent();

              if (parent == null) {
                  return;
              }

              int index =
                      parent.indexOfChild(sidebar);

              parent.removeViewAt(index);

              sidebar =
                      buildSidebar();

              parent.addView(
                      sidebar,
                      index,
                      new LinearLayout.LayoutParams(
                              dp(88),
                              -1));
          }

          private TextView recentButton(
                  ComponentName component,
                  int index) {

              String label;

              if (component == null) {

                  label =
                          "RECENT "
                                  + index
                                  + "\n—";

              } else {

                  label =
                          "RECENT "
                                  + index
                                  + "\n"
                                  + labelFor(component);
              }

              TextView view =
                      sideButton(
                              "●",
                              label);

              if (component != null) {

                  view.setOnClickListener(
                          v -> {

                              V10SessionStore
                                      .setTarget(
                                              this,
                                              component);

                              refreshSidebar();

                              if (status != null) {
                                  status.setText(
                                          "Selected: "
                                                  + labelFor(
                                                          component));
                              }
                          });
              }

              return view;
          }

          private String labelFor(
                  ComponentName component) {

              if (component == null) {
                  return "—";
              }

              try {

                  android.content.pm.ActivityInfo info =
                          getPackageManager()
                                  .getActivityInfo(
                                          component,
                                          0);

                  CharSequence label =
                          info.loadLabel(
                                  getPackageManager());

                  if (label != null &&
                          label.length() > 0) {

                      return label.toString();
                  }

              } catch (Exception ignored) {
              }

              return component.getPackageName();
          }

          private void showTasks() {

              dashboard.setVisibility(
                      View.GONE);

              appPanel.setVisibility(
                      View.VISIBLE);

              rebuildPanel(true);
          }

          private TextView sideButton(
                  String icon,
                  String label) {

              TextView view =
                      text(
                              icon
                                      + "\n"
                                      + label,
                              10,
                              Color.WHITE);

              view.setGravity(
                      Gravity.CENTER);

              view.setPadding(
                      dp(2),
                      dp(3),
                      dp(2),
                      dp(3));

              view.setBackground(
                      roundBg(
                              Color.TRANSPARENT,
                              dp(10)));

              view.setLayoutParams(
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(62)));

              if ("APPS".equals(label)) {

                  view.setOnClickListener(
                          v -> showApps());

              }

              return view;
          }

          private GradientDrawable roundBg(
                  int color,
                  float radius) {

              GradientDrawable bg =
                      new GradientDrawable();

              bg.setColor(color);
              bg.setCornerRadius(radius);

              return bg;
          }

          private LinearLayout card() {

              LinearLayout box =
                      new LinearLayout(this);

              box.setOrientation(
                      LinearLayout.VERTICAL);

              box.setPadding(
                      dp(14),
                      dp(10),
                      dp(14),
                      dp(10));

              box.setBackground(
                      roundBg(
                              Color.rgb(22, 27, 33),
                              dp(18)));

              return box;
          }

          '''

          source = source.replace(
              marker,
              sidebar_helpers + marker,
              1
          )

          # ==================================================
          # MAP BACKGROUND
          # ==================================================

          map_background = r'''
          private final class MapBackground
                  extends View {

              private final Paint grid =
                      new Paint(
                              Paint.ANTI_ALIAS_FLAG);

              private final Paint road =
                      new Paint(
                              Paint.ANTI_ALIAS_FLAG);

              MapBackground(
                      android.content.Context context) {

                  super(context);

                  grid.setColor(
                          Color.rgb(
                                  27,
                                  40,
                                  47));

                  grid.setStrokeWidth(dp(1));

                  road.setColor(
                          Color.rgb(
                                  55,
                                  70,
                                  78));

                  road.setStyle(
                          Paint.Style.STROKE);

                  road.setStrokeWidth(dp(12));

                  road.setStrokeCap(
                          Paint.Cap.ROUND);
              }

              @Override
              protected void onDraw(
                      Canvas canvas) {

                  super.onDraw(canvas);

                  canvas.drawColor(
                          Color.rgb(
                                  9,
                                  17,
                                  23));

                  int width =
                          getWidth();

                  int height =
                          getHeight();

                  int step =
                          dp(36);

                  for (
                          int x = 0;
                          x < width;
                          x += step) {

                      canvas.drawLine(
                              x,
                              0,
                              x,
                              height,
                              grid);
                  }

                  for (
                          int y = 0;
                          y < height;
                          y += step) {

                      canvas.drawLine(
                              0,
                              y,
                              width,
                              y,
                              grid);
                  }

                  Path roadPath =
                          new Path();

                  roadPath.moveTo(
                          0,
                          height * 0.72f);

                  roadPath.cubicTo(
                          width * 0.25f,
                          height * 0.55f,
                          width * 0.55f,
                          height * 0.78f,
                          width,
                          height * 0.32f);

                  canvas.drawPath(
                          roadPath,
                          road);

                  Paint marker =
                          new Paint(
                                  Paint.ANTI_ALIAS_FLAG);

                  marker.setColor(
                          Color.WHITE);

                  canvas.drawCircle(
                          width * 0.52f,
                          height * 0.57f,
                          dp(7),
                          marker);
              }
          }

          '''

          source = source.replace(
              marker,
              map_background + marker,
              1
          )

          # ==================================================
          # REMOVE OLD INITIAL METHOD
          # ==================================================

          if "private String initial(" in source:
              source = replace_method(
                  source,
                  "private String initial(",
                  ""
              )

          # ==================================================
          # APP MODEL
          # ==================================================

          app_model = r'''
          private static final class AppInfo {

              final ComponentName component;

              final String name;

              final Drawable icon;

              AppInfo(
                      ComponentName component,
                      String name,
                      Drawable icon) {

                  this.component =
                          component;

                  this.name =
                          name;

                  this.icon =
                          icon;
              }
          }
          '''

          source = replace_method(
              source,
              "private static final class AppInfo",
              app_model
          )

          if source == original:
              raise RuntimeError(
                  "Patch produced no changes"
              )

          path.write_text(
              source,
              encoding="utf-8"
          )

          print(
              "Home V1 V3.5 patch completed."
          )
          PY

          sed -i 's/[[:space:]]\+$//' "$FILE"

      - name: Verify Home V1 only
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"

          test -f "$FILE"

          # Required V3.5 UI
          grep -Fq 'private LinearLayout sidebar;' "$FILE"
          grep -Fq 'private GridLayout appGrid;' "$FILE"
          grep -Fq '"APPS"' "$FILE"
          grep -Fq '"RECENT "' "$FILE"
          grep -Fq '"TASKS"' "$FILE"
          grep -Fq 'V10SessionStore.getRecents' "$FILE"
          grep -Fq 'private void showTasks()' "$FILE"
          grep -Fq '"WYN"' "$FILE"
          grep -Fq '"CHƯA CÓ CẢNH BÁO"' "$FILE"
          grep -Fq '"Nguồn cảnh báo: WYN"' "$FILE"
          grep -Fq '"◀  LÙI"' "$FILE"
          grep -Fq '"TỚI  ▶"' "$FILE"
          grep -Fq '"♫  MEDIA' "$FILE"

          # Real app icons from V3.4 must remain.
          grep -Fq 'info.loadIcon(' "$FILE"
          grep -Fq 'ImageView icon' "$FILE"
          grep -Fq 'final Drawable icon' "$FILE"

          # Old dashboard cards must be gone.
          if grep -Fq '"SPEED"' "$FILE"; then
            echo "ERROR: SPEED card remains."
            exit 1
          fi

          if grep -Fq '"WEATHER"' "$FILE"; then
            echo "ERROR: WEATHER card remains."
            exit 1
          fi

          # Old APPS bottom-dock behavior must be gone.
          if grep -Fq 'TextView appsButton' "$FILE"; then
            echo "ERROR: old bottom APPS button remains."
            exit 1
          fi

          # Old fake letter icon implementation must be gone.
          if grep -Fq 'initial(app.name)' "$FILE"; then
            echo "ERROR: old initial icon call remains."
            exit 1
          fi

          if grep -Fq 'private String initial(' "$FILE"; then
            echo "ERROR: old initial() method remains."
            exit 1
          fi

          # Exactly one of each critical method.
          test "$(grep -c 'private void buildDashboard()' "$FILE")" = "1"
          test "$(grep -c 'private void buildAppPanel()' "$FILE")" = "1"
          test "$(grep -c 'private void loadApps()' "$FILE")" = "1"
          test "$(grep -c 'private void showTasks()' "$FILE")" = "1"
          test "$(grep -c 'private LinearLayout appTile(' "$FILE")" = "1"
          test "$(grep -c 'private static final class AppInfo' "$FILE")" = "1"

          # Core / Persistence protection.
          git diff --name-only > /tmp/changed.txt

          echo "Changed files:"
          cat /tmp/changed.txt

          test "$(wc -l < /tmp/changed.txt | tr -d ' ')" = "1"
          grep -Fxq \
            "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java" \
            /tmp/changed.txt

          for protected in \
            "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java" \
            "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java" \
            "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java" \
            "v10-source/app/src/main/java/com/hieptran/aacast/doudou/RootView.java" \
            "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java"
          do
            if grep -Fxq "$protected" /tmp/changed.txt; then
              echo "ERROR: Protected file changed: $protected"
              exit 1
            fi
          done

          git diff --check

          echo "========================================"
          echo "HOME V1 V3.5 STATIC CHECK: PASS"
          echo "Only V10LauncherActivity.java changed."
          echo "Core / Projection / Persistence untouched."
          echo "========================================"

      - name: Compile Java
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace

      - name: Assemble debug APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find \
              v10-source/app/build/outputs/apk \
              -type f \
              -name '*.apk' \
              -path '*/debug/*' \
              | head -n 1
          )"

          test -n "$APK"
          test -f "$APK"

          mkdir -p release-apk

          cp \
            "$APK" \
            release-apk/CarAssistant-V10-Home-V1-Phone-UI-V3.5-debug.apk

          sha256sum \
            release-apk/CarAssistant-V10-Home-V1-Phone-UI-V3.5-debug.apk

          ls -lh \
            release-apk/CarAssistant-V10-Home-V1-Phone-UI-V3.5-debug.apk

      - name: Upload V3.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Home-V1-Phone-UI-V3.5-debug
          path: release-apk/CarAssistant-V10-Home-V1-Phone-UI-V3.5-debug.apk
          if-no-files-found: error
          retention-days: 14
