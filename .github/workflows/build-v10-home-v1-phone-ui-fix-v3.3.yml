                          dp(5),
                          dp(5),
                          dp(5));

                  grid.addView(
                          tile,
                          params);
              }
          }

          private LinearLayout appTile(
                  AppInfo app) {

              LinearLayout tile =
                      new LinearLayout(this);

              tile.setOrientation(
                      LinearLayout.VERTICAL);

              tile.setGravity(
                      Gravity.CENTER);

              tile.setPadding(
                      dp(6),
                      dp(6),
                      dp(6),
