name: Build Car Assistant V10 - Home V1 Phone UI V3.6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-v1-phone-ui-v36:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:

      # ==================================================
      # CHECKOUT EXACT BASELINE
      # ==================================================

      - name: Checkout exact Home V1 baseline
        uses: actions/checkout@v4
        with:
          ref: 0634e1f5ced143fdd931022b32bf9a19cbf6e2bd
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==================================================
      # BASELINE VERIFICATION
      # ==================================================

      - name: Verify exact source baseline
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"

          test -f "$FILE"

          COMMIT="$(git rev-parse HEAD)"
          BLOB_SHA="$(git hash-object "$FILE")"

          test "$COMMIT" = "0634e1f5ced143fdd931022b32bf9a19cbf6e2bd"
          test "$BLOB_SHA" = "84d970adbfacc39270838d12ed0a73bc7fa0d645"

          grep -Fq 'package com.carassistant.v10;' "$FILE"
          grep -Fq 'class V10LauncherActivity' "$FILE"
          grep -Fq 'private void buildDashboard()' "$FILE"
          grep -Fq 'private void buildAppPanel()' "$FILE"
          grep -Fq 'private void loadApps()' "$FILE"
          grep -Fq 'private void rebuildGridFromPanel()' "$FILE"
          grep -Fq 'private void rebuildAppGrid(' "$FILE"
          grep -Fq 'private LinearLayout appTile(' "$FILE"
          grep -Fq 'V10SessionStore.setTarget' "$FILE"
          grep -Fq 'initial(app.name)' "$FILE"
          grep -Fq 'private static final class AppInfo' "$FILE"

          echo "========================================"
          echo "BASELINE VERIFIED"
          echo "========================================"
          echo "Commit: $COMMIT"
          echo "Blob:   $BLOB_SHA"

      # ==================================================
      # PATCH PART 1
      # ==================================================

      - name: Patch Home V1 V3.6 - Part 1
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")

          def find_block_end(text, start):
              brace = text.find("{", start)
              if brace < 0:
                  raise RuntimeError("Opening brace not found")

              depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              i = brace

              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ""

                  if line_comment:
                      if c == "\n":
                          line_comment = False

                  elif block_comment:
                      if c == "*" and n == "/":
                          block_comment = False
                          i += 1

                  elif quote is not None:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == quote:
                          quote = None

                  elif c == "/" and n == "/":
                      line_comment = True
                      i += 1

                  elif c == "/" and n == "*":
                      block_comment = True
                      i += 1

                  elif c in ('"', "'"):
                      quote = c

                  elif c == "{":
                      depth += 1

                  elif c == "}":
                      depth -= 1
                      if depth == 0:
                          return i + 1

                  i += 1

              raise RuntimeError("Closing brace not found")

          def replace_method(text, signature, replacement):
              start = text.find(signature)

              if start < 0:
                  raise RuntimeError(
                      "Method not found: " + signature
                  )

              end = find_block_end(text, start)

              return (
                  text[:start]
                  + replacement.strip()
                  + text[end:]
              )

          def replace_once(text, old, new, label):
              count = text.count(old)

              if count != 1:
                  raise RuntimeError(
                      f"{label}: expected 1 match, found {count}"
                  )

              return text.replace(old, new, 1)

          # ------------------------------------------------
          # IMPORTS
          # ------------------------------------------------

          source = replace_once(
              source,
              "import android.graphics.Color;\n",
              "import android.graphics.Canvas;\n"
              "import android.graphics.Color;\n"
              "import android.graphics.Paint;\n"
              "import android.graphics.Path;\n",
              "graphics imports"
          )

          source = replace_once(
              source,
              "import android.graphics.drawable.GradientDrawable;\n",
              "import android.graphics.drawable.Drawable;\n"
              "import android.graphics.drawable.GradientDrawable;\n",
              "drawable import"
          )

          source = replace_once(
              source,
              "import android.view.Gravity;\n",
              "import android.view.Gravity;\n"
              "import android.widget.FrameLayout;\n"
