                                  + V10SessionStore
                                          .getRecents(this)
                                          .size());
              }
          }

          private void showRecentTask(
                  String action) {

              List<ComponentName> recents =
                      V10SessionStore
                              .getRecents(this);

              int index;

              if ("Recent 1".equals(action)) {

                  index = 0;

              } else if ("Recent 2".equals(action)) {

                  index = 1;

              } else {

                  index = 2;
              }

              if (index >= recents.size()) {

                  showApps();

                  if (status != null) {
                      status.setText(
                              "No recent task");
                  }

                  return;
              }

              ComponentName component =
                      recents.get(index);

              V10SessionStore.setTarget(
                      this,
                      component);

              showApps();

              if (status != null) {

                  status.setText(
                          "Recent: "
                                  + component
                                          .getPackageName());
              }
          }

