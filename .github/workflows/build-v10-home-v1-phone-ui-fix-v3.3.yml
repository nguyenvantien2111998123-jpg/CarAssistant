          load_apps = r'''
          private void loadApps() {

              apps.clear();

              Intent intent =
                      new Intent(
                              Intent.ACTION_MAIN);

              intent.addCategory(
                      Intent.CATEGORY_LAUNCHER);

              List<ResolveInfo> result =
                      getPackageManager()
                              .queryIntentActivities(
                                      intent,
                                      0);

              for (ResolveInfo info : result) {

                  if (info == null ||
                          info.activityInfo == null) {
                      continue;
                  }

                  String packageName =
                          info.activityInfo.packageName;

                  if (getPackageName()
                          .equals(packageName)) {
                      continue;
                  }

                  ComponentName component =
                          new ComponentName(
                                  packageName,
                                  info.activityInfo.name);

                  CharSequence label =
                          info.loadLabel(
                                  getPackageManager());

                  String name =
                          label == null
                                  ? packageName
                                  : label.toString();

                  Drawable icon =
                          info.loadIcon(
                                  getPackageManager());

                  apps.add(
                          new AppInfo(
                                  component,
                                  name,
                                  icon));
              }

              Collections.sort(
                      apps,
                      (a, b) ->
                              a.name.compareToIgnoreCase(
                                      b.name));

              rebuildDock();

              rebuildGridFromPanel();
          }
