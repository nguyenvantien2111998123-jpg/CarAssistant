          git diff --name-only | tee changed-files.txt

          test "$(wc -l < changed-files.txt)" = "1"

          grep -Fxq "$FILE" changed-files.txt

          if grep -Eq \
            'V10ProjectionService.java|V10ProjectionSession.java|RootView.java|V10SessionStore.java|V10CarActivity.java' \
            changed-files.txt
          then
            echo "[FAIL] Protected Core/Persistence file changed."
            exit 1
          fi

          echo "[PASS] Only V10LauncherActivity.java changed."
          echo "[PASS] Display Core protected."
          echo "[PASS] Projection Service/Session protected."
          echo "[PASS] RootView protected."
          echo "[PASS] Persistence protected."
          echo "[PASS] V10CarActivity protected."

      - name: Compile Debug
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace

      - name: Assemble Debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: SHA256 APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          sha256sum "$APK"

      - name: Upload V3.7 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Home-V1-Phone-UI-V3.7-debug
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
