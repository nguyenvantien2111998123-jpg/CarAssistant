                      i += 2
                      continue

                  if c == "/" and n == "*":
                      in_block_comment = True
                      i += 2
                      continue

                  if c == '"':
                      in_string = True
                      i += 1
                      continue

                  if c == "'":
                      in_char = True
                      i += 1
                      continue

                  if c == "{":
                      depth += 1
                  elif c == "}":
                      depth -= 1
                      if depth == 0:
                          return i + 1

                  i += 1

              raise RuntimeError("Matching closing brace not found")

          def get_method(text, signature):
              start = text.find(signature)
              if start < 0:
                  raise RuntimeError("Method not found: " + signature)
              end = find_block_end(text, start)
              return start, end

          def replace_method(text, signature, replacement):
              start, end = get_method(text, signature)
              return text[:start] + replacement + text[end:]

          def add_import(text, imp):
              if imp in text:
                  return text

              marker = "import android.view.View;"
              if marker not in text:
                  raise RuntimeError("Import marker not found")

