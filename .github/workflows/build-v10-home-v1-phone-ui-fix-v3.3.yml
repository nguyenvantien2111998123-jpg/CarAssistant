name: Build Car Assistant V10 - Home V1 Phone UI Fix V3.3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-v1-phone-ui-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact baseline
        uses: actions/checkout@v4
        with:
          ref: 0634e1f5ced143fdd931022b32bf9a19cbf6e2bd
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify exact source baseline
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"

          test -f "$FILE"

          COMMIT="$(git rev-parse HEAD)"
          test "$COMMIT" = "0634e1f5ced143fdd931022b32bf9a19cbf6e2bd"

          BLOB_SHA="$(git hash-object "$FILE")"
          test "$BLOB_SHA" = "84d970adbfacc39270838d12ed0a73bc7fa0d645"

          grep -Fq 'package com.carassistant.v10;' "$FILE"
          grep -Fq 'class V10LauncherActivity' "$FILE"
          grep -Fq 'private void buildDashboard()' "$FILE"
          grep -Fq 'private void loadApps()' "$FILE"
          grep -Fq 'private LinearLayout appTile(' "$FILE"
          grep -Fq 'V10SessionStore.setTarget' "$FILE"
          grep -Fq 'initial(app.name)' "$FILE"
          grep -Fq 'private static final class AppInfo' "$FILE"

          echo "========================================"
          echo "BASELINE VERIFIED"
          echo "========================================"
          echo "Commit: $COMMIT"
          echo "Git blob SHA: $BLOB_SHA"
          echo "Source: $FILE"

      - name: Patch Home V1 phone UI
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          original = source

          def find_block_end(text, start):
              brace = text.find("{", start)

              if brace < 0:
                  raise RuntimeError("Opening brace not found")

              depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False

              i = brace

              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ""

                  if line_comment:
                      if c == "\n":
                          line_comment = False

                  elif block_comment:
                      if c == "*" and n == "/":
                          block_comment = False
                          i += 1

                  elif quote is not None:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == quote:
                          quote = None

                  elif c == "/" and n == "/":
                      line_comment = True
                      i += 1

                  elif c == "/" and n == "*":
                      block_comment = True
                      i += 1

                  elif c == '"' or c == "'":
                      quote = c

                  elif c == "{":
                      depth += 1

                  elif c == "}":
                      depth -= 1

                      if depth == 0:
                          return i + 1

                  i += 1

              raise RuntimeError("Closing brace not found")

          def replace_method(text, signature, replacement):
              start = text.find(signature)

              if start < 0:
                  raise RuntimeError(
                      "Method/class not found: " + signature
                  )

              end = find_block_end(text, start)

              return (
                  text[:start]
                  + replacement.strip()
                  + text[end:]
              )

          def replace_once(text, old, new, label):
              count = text.count(old)

              if count != 1:
                  raise RuntimeError(
                      f"{label}: expected 1 match, found {count}"
                  )

              return text.replace(old, new, 1)

          # ==================================================
          # IMPORTS
          # ==================================================

          source = replace_once(
              source,
              "import android.graphics.Color;\n",
              "import android.graphics.Canvas;\n"
              "import android.graphics.Color;\n"
              "import android.graphics.Paint;\n"
              "import android.graphics.Path;\n",
              "graphics imports"
          )

          source = replace_once(
              source,
              "import android.graphics.drawable.GradientDrawable;\n",
              "import android.graphics.drawable.Drawable;\n"
              "import android.graphics.drawable.GradientDrawable;\n",
              "drawable import"
          )

          source = replace_once(
              source,
              "import android.view.Gravity;\n",
              "import android.view.Gravity;\n"
              "import android.widget.FrameLayout;\n"
              "import android.widget.ImageView;\n",
              "widget imports"
          )

          # ==================================================
          # HOME V1 DASHBOARD
          # ==================================================

          dashboard_method = r'''
          private void buildDashboard() {

              dashboard.removeAllViews();

              LinearLayout top =
                      new LinearLayout(this);

              top.setGravity(
                      Gravity.CENTER_VERTICAL);

              top.setPadding(
                      dp(10),
                      dp(6),
                      dp(10),
                      dp(6));

              top.setBackground(
                      roundBg(
                              Color.rgb(18, 24, 32),
                              dp(14)));

              LinearLayout titleBox =
                      new LinearLayout(this);

              titleBox.setOrientation(
                      LinearLayout.VERTICAL);

              TextView title =
                      text(
                              "CAR ASSISTANT",
                              18,
                              Color.WHITE);

              title.setTypeface(
                      Typeface.DEFAULT,
                      Typeface.BOLD);

              titleBox.addView(title);

              date =
                      text(
                              "",
                              11,
                              Color.LTGRAY);

              titleBox.addView(date);

              top.addView(
                      titleBox,
                      new LinearLayout.LayoutParams(
                              0,
                              -2,
                              1f));

              clock =
                      text(
                              "",
                              20,
                              Color.WHITE);

              clock.setGravity(
                      Gravity.CENTER);

              top.addView(
                      clock,
                      new LinearLayout.LayoutParams(
                              dp(100),
                              dp(55)));

              dashboard.addView(
                      top,
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(66)));

              LinearLayout main =
                      new LinearLayout(this);

              main.setOrientation(
                      LinearLayout.HORIZONTAL);

              main.setPadding(
                      0,
                      dp(8),
                      0,
                      dp(8));

              main.addView(
                      buildSidebar(),
                      new LinearLayout.LayoutParams(
                              dp(72),
                              -1));

              LinearLayout content =
                      new LinearLayout(this);

              content.setOrientation(
                      LinearLayout.VERTICAL);

              content.setPadding(
                      dp(8),
                      0,
                      0,
                      0);

              FrameLayout map =
                      new FrameLayout(this);

              map.setBackground(
                      roundBg(
                              Color.rgb(9, 17, 23),
                              dp(16)));

              map.addView(
                      new MapBackground(this),
                      new FrameLayout.LayoutParams(
                              -1,
                              -1));

              TextView mapTitle =
                      text(
                              "MAP",
                              12,
                              Color.WHITE);

              mapTitle.setGravity(
                      Gravity.CENTER);

              mapTitle.setBackground(
                      roundBg(
                              Color.rgb(24, 32, 42),
                              dp(10)));

              FrameLayout.LayoutParams mapParams =
                      new FrameLayout.LayoutParams(
                              dp(70),
                              dp(38));

              mapParams.gravity =
                      Gravity.TOP | Gravity.LEFT;

              mapParams.setMargins(
                      dp(10),
                      dp(10),
                      0,
                      0);

              map.addView(
                      mapTitle,
                      mapParams);

              TextView navigation =
                      text(
                              "Navigation\nReady",
                              12,
                              Color.LTGRAY);

              navigation.setGravity(
                      Gravity.CENTER);

              navigation.setBackground(
                      roundBg(
                              Color.rgb(18, 25, 33),
                              dp(10)));

              FrameLayout.LayoutParams navParams =
                      new FrameLayout.LayoutParams(
                              dp(120),
                              dp(58));

              navParams.gravity =
                      Gravity.BOTTOM | Gravity.LEFT;

              navParams.setMargins(
                      dp(10),
                      0,
                      0,
                      dp(10));

              map.addView(
                      navigation,
                      navParams);

              content.addView(
                      map,
                      new LinearLayout.LayoutParams(
                              -1,
                              0,
                              1f));

              LinearLayout info =
                      new LinearLayout(this);

              info.setOrientation(
                      LinearLayout.HORIZONTAL);

              info.setPadding(
                      0,
                      dp(6),
                      0,
                      0);

              info.addView(
                      infoCard(
                              "SPEED",
                              "0 km/h"),
                      new LinearLayout.LayoutParams(
                              0,
                              dp(54),
                              1f));

              info.addView(
                      infoCard(
                              "WEATHER",
                              "-- °C"),
                      new LinearLayout.LayoutParams(
                              0,
                              dp(54),
                              1f));

              info.addView(
                      infoCard(
                              "MEDIA",
                              "No media"),
                      new LinearLayout.LayoutParams(
                              0,
                              dp(54),
                              1f));

              content.addView(info);

              main.addView(
                      content,
                      new LinearLayout.LayoutParams(
                              0,
                              -1,
                              1f));

              dashboard.addView(
                      main,
                      new LinearLayout.LayoutParams(
                              -1,
                              0,
                              1f));

              LinearLayout bottom =
                      new LinearLayout(this);

              bottom.setGravity(
                      Gravity.CENTER_VERTICAL);

              bottom.setPadding(
                      dp(6),
                      dp(5),
                      dp(6),
                      dp(5));

              bottom.setBackground(
                      roundBg(
                              Color.rgb(18, 24, 32),
                              dp(14)));

              TextView previous =
                      buttonText("◀");

              TextView next =
                      buttonText("▶");

              TextView media =
                      buttonText("♫");

              TextView appsButton =
                      buttonText("▦  APPS");

              bottom.addView(
                      previous,
                      new LinearLayout.LayoutParams(
                              0,
                              dp(48),
                              1f));

              bottom.addView(
                      next,
                      new LinearLayout.LayoutParams(
                              0,
                              dp(48),
                              1f));

              bottom.addView(
                      media,
                      new LinearLayout.LayoutParams(
                              0,
                              dp(48),
                              1f));

              bottom.addView(
                      appsButton,
                      new LinearLayout.LayoutParams(
                              0,
                              dp(48),
                              2f));

              appsButton.setOnClickListener(
                      v -> showApps());

              dashboard.addView(
                      bottom,
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(60)));
          }
          '''

          source = replace_method(
              source,
              "private void buildDashboard()",
              dashboard_method
          )

          # ==================================================
          # LOAD APPS - REPLACE ENTIRE METHOD
          # ==================================================

          load_apps_method = r'''
          private void loadApps() {

              apps.clear();

              Intent intent =
                      new Intent(
                              Intent.ACTION_MAIN);

              intent.addCategory(
                      Intent.CATEGORY_LAUNCHER);

              List<ResolveInfo> result =
                      getPackageManager()
                              .queryIntentActivities(
                                      intent,
                                      0);

              for (ResolveInfo info : result) {

                  if (info == null ||
                          info.activityInfo == null) {
                      continue;
                  }

                  String packageName =
                          info.activityInfo.packageName;

                  if (getPackageName()
                          .equals(packageName)) {
                      continue;
                  }

                  ComponentName component =
                          new ComponentName(
                                  packageName,
                                  info.activityInfo.name);

                  CharSequence label =
                          info.loadLabel(
                                  getPackageManager());

                  String name =
                          label == null
                                  ? packageName
                                  : label.toString();

                  Drawable icon =
                          info.loadIcon(
                                  getPackageManager());

                  apps.add(
                          new AppInfo(
                                  component,
                                  name,
                                  icon));
              }

              Collections.sort(
                      apps,
                      (a, b) ->
                              a.name.compareToIgnoreCase(
                                      b.name));

              rebuildDock();

              rebuildGridFromPanel();
          }
          '''

          source = replace_method(
              source,
              "private void loadApps()",
              load_apps_method
          )

          # ==================================================
          # APP TILE - REAL ICON
          # ==================================================

          app_tile = r'''
          private LinearLayout appTile(
                  AppInfo app) {

              LinearLayout tile =
                      new LinearLayout(this);

              tile.setOrientation(
                      LinearLayout.VERTICAL);

              tile.setGravity(
                      Gravity.CENTER);

              tile.setPadding(
                      dp(6),
                      dp(6),
                      dp(6),
                      dp(6));

              tile.setBackground(
                      roundBg(
                              Color.rgb(22, 28, 35),
                              dp(14)));

              ImageView icon =
                      new ImageView(this);

              if (app.icon != null) {
                  icon.setImageDrawable(
                          app.icon);
              } else {
                  icon.setImageDrawable(
                          getPackageManager()
                                  .getDefaultActivityIcon());
              }

              icon.setScaleType(
                      ImageView.ScaleType.CENTER_INSIDE);

              tile.addView(
                      icon,
                      new LinearLayout.LayoutParams(
                              dp(50),
                              dp(50)));

              TextView name =
                      text(
                              app.name,
                              12,
                              Color.WHITE);

              name.setGravity(
                      Gravity.CENTER);

              name.setMaxLines(2);

              tile.addView(
                      name,
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(40)));

              tile.setOnClickListener(
                      v -> selectApp(app));

              return tile;
          }
          '''

          source = replace_method(
              source,
              "private LinearLayout appTile(",
              app_tile
          )

          # ==================================================
          # REMOVE OLD INITIAL LETTER ICON METHOD
          # ==================================================

          if "private String initial(" in source:
              source = replace_method(
                  source,
                  "private String initial(",
                  ""
              )

          if "initial(app.name)" in source:
              raise RuntimeError(
                  "Old initial-letter icon call remains"
              )

          # ==================================================
          # APP MODEL
          # ==================================================

          app_model = r'''
          private static final class AppInfo {

              final ComponentName component;

              final String name;

              final Drawable icon;

              AppInfo(
                      ComponentName component,
                      String name,
                      Drawable icon) {

                  this.component =
                          component;

                  this.name =
                          name;

                  this.icon =
                          icon;
              }
          }
          '''

          source = replace_method(
              source,
              "private static final class AppInfo",
              app_model
          )

          # ==================================================
          # SIDEBAR + MAP BACKGROUND
          # ==================================================

          marker = (
              "    // ====================================================\n"
              "    // UI HELPERS\n"
          )

          if source.count(marker) != 1:
              raise RuntimeError(
                  "UI HELPERS marker not found exactly once"
              )

          helpers = r'''
          private GradientDrawable roundBg(
                  int color,
                  float radius) {

              GradientDrawable bg =
                      new GradientDrawable();

              bg.setColor(color);

              bg.setCornerRadius(radius);

              return bg;
          }

          private LinearLayout buildSidebar() {

              LinearLayout side =
                      new LinearLayout(this);

              side.setOrientation(
                      LinearLayout.VERTICAL);

              side.setGravity(
                      Gravity.CENTER_HORIZONTAL);

              side.setPadding(
                      0,
                      dp(4),
                      0,
                      dp(4));

              side.setBackground(
                      roundBg(
                              Color.rgb(15, 21, 29),
                              dp(14)));

              side.addView(
                      sideButton(
                              "☰",
                              "Menu"));

              side.addView(
                      sideButton(
                              "⌖",
                              "Map"));

              side.addView(
                      sideButton(
                              "▣",
                              "Files"));

              side.addView(
                      sideButton(
                              "⚙",
                              "Settings"));

              side.addView(
                      sideButton(
                              "⋮",
                              "More"));

              return side;
          }

          private TextView sideButton(
                  String icon,
                  String label) {

              TextView view =
                      text(
                              icon + "\n" + label,
                              10,
                              Color.WHITE);

              view.setGravity(
                      Gravity.CENTER);

              view.setPadding(
                      dp(2),
                      dp(3),
                      dp(2),
                      dp(3));

              view.setBackground(
                      roundBg(
                              Color.TRANSPARENT,
                              dp(10)));

              view.setOnClickListener(
                      v -> {

                          if ("Files".equals(label)) {

                              showApps();

                          } else if (status != null) {

                              status.setText(label);
                          }
                      });

              view.setLayoutParams(
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(62)));

              return view;
          }

          private final class MapBackground
                  extends View {

              private final Paint grid =
                      new Paint(
                              Paint.ANTI_ALIAS_FLAG);

              private final Paint road =
                      new Paint(
                              Paint.ANTI_ALIAS_FLAG);

              MapBackground(
                      android.content.Context context) {

                  super(context);

                  grid.setColor(
                          Color.rgb(
                                  27,
                                  40,
                                  47));

                  grid.setStrokeWidth(
                          dp(1));

                  road.setColor(
                          Color.rgb(
                                  55,
                                  70,
                                  78));

                  road.setStyle(
                          Paint.Style.STROKE);

                  road.setStrokeWidth(
                          dp(12));

                  road.setStrokeCap(
                          Paint.Cap.ROUND);
              }

              @Override
              protected void onDraw(
                      Canvas canvas) {

                  super.onDraw(canvas);

                  canvas.drawColor(
                          Color.rgb(
                                  9,
                                  17,
                                  23));

                  int width =
                          getWidth();

                  int height =
                          getHeight();

                  int step =
                          dp(36);

                  for (
                          int x = 0;
                          x < width;
                          x += step) {

                      canvas.drawLine(
                              x,
                              0,
                              x,
                              height,
                              grid);
                  }

                  for (
                          int y = 0;
                          y < height;
                          y += step) {

                      canvas.drawLine(
                              0,
                              y,
                              width,
                              y,
                              grid);
                  }

                  Path roadPath =
                          new Path();

                  roadPath.moveTo(
                          0,
                          height * 0.72f);

                  roadPath.cubicTo(
                          width * 0.25f,
                          height * 0.55f,
                          width * 0.55f,
                          height * 0.78f,
                          width,
                          height * 0.32f);

                  canvas.drawPath(
                          roadPath,
                          road);

                  Paint marker =
                          new Paint(
                                  Paint.ANTI_ALIAS_FLAG);

                  marker.setColor(
                          Color.WHITE);

                  canvas.drawCircle(
                          width * 0.52f,
                          height * 0.57f,
                          dp(7),
                          marker);
              }
          }

          '''

          source = source.replace(
              marker,
              helpers + marker,
              1
          )

          if source == original:
              raise RuntimeError(
                  "Patch produced no changes"
              )

          path.write_text(
              source,
              encoding="utf-8"
          )

          print(
              "Home V1 phone UI V3.3 patch completed."
          )
          PY

      - name: Verify patched Java source
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"

          test -f "$FILE"

          grep -Fq 'package com.carassistant.v10;' "$FILE"
          grep -Fq 'import android.graphics.Canvas;' "$FILE"
          grep -Fq 'import android.graphics.Paint;' "$FILE"
          grep -Fq 'import android.graphics.Path;' "$FILE"
          grep -Fq 'import android.graphics.drawable.Drawable;' "$FILE"
          grep -Fq 'import android.widget.FrameLayout;' "$FILE"
          grep -Fq 'import android.widget.ImageView;' "$FILE"

          grep -Fq 'private LinearLayout buildSidebar()' "$FILE"
          grep -Fq 'class MapBackground' "$FILE"
          grep -Fq 'private void loadApps()' "$FILE"
          grep -Fq 'info.loadIcon(' "$FILE"
          grep -Fq 'final Drawable icon' "$FILE"
          grep -Fq 'new AppInfo(' "$FILE"
          grep -Fq 'V10SessionStore.setTarget' "$FILE"

          if grep -Fq 'initial(app.name)' "$FILE"; then
              echo "ERROR: old initial(app.name) still exists"
              exit 1
          fi

          if grep -Fq 'private String initial(' "$FILE"; then
              echo "ERROR: old initial() method still exists"
              exit 1
          fi

          APPINFO_COUNT="$(
              grep -c 'private static final class AppInfo' "$FILE"
          )"

          test "$APPINFO_COUNT" = "1"

          APP_TILE_COUNT="$(
              grep -c 'private LinearLayout appTile(' "$FILE"
          )"

          test "$APP_TILE_COUNT" = "1"

          LOAD_APPS_COUNT="$(
              grep -c 'private void loadApps()' "$FILE"
          )"

          test "$LOAD_APPS_COUNT" = "1"

          DASHBOARD_COUNT="$(
              grep -c 'private void buildDashboard()' "$FILE"
          )"

          test "$DASHBOARD_COUNT" = "1"

          grep -Fq 'apps.add(' "$FILE"
          grep -Fq 'component,' "$FILE"
          grep -Fq 'name,' "$FILE"
          grep -Fq 'icon));' "$FILE"

          git diff --check

          echo "========================================"
          echo "PATCH SOURCE CHECK: PASS"
          echo "========================================"

      - name: Compile Java
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace

      - name: Assemble debug APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find \
              v10-source/app/build/outputs/apk \
              -type f \
              -name '*.apk' \
              -path '*/debug/*' \
              | head -n 1
          )"

          test -n "$APK"
          test -f "$APK"

          echo "APK=$APK"

          mkdir -p release-apk

          cp \
            "$APK" \
            release-apk/CarAssistant-V10-Home-V1-Phone-UI-V3.3-debug.apk

          sha256sum \
            release-apk/CarAssistant-V10-Home-V1-Phone-UI-V3.3-debug.apk

          ls -lh \
            release-apk/CarAssistant-V10-Home-V1-Phone-UI-V3.3-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Home-V1-Phone-UI-V3.3-debug
          path: release-apk/CarAssistant-V10-Home-V1-Phone-UI-V3.3-debug.apk
          if-no-files-found: error
          retention-days: 14
