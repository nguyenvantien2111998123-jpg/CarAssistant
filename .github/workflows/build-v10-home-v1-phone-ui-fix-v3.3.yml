name: Build Car Assistant V10 - Home V1 Phone UI V3.7

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v10-home-v1-v3-7:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact Home V1 baseline
        uses: actions/checkout@v4
        with:
          ref: 0634e1f5ced143fdd931022b32bf9a19cbf6e2bd
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify exact baseline
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_COMMIT="0634e1f5ced143fdd931022b32bf9a19cbf6e2bd"
          EXPECTED_BLOB="84d970adbfacc39270838d12ed0a73bc7fa0d645"
          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"

          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          echo "HEAD=$ACTUAL_COMMIT"

          test "$ACTUAL_COMMIT" = "$EXPECTED_COMMIT"

          ACTUAL_BLOB="$(git hash-object "$FILE")"
          echo "V10LauncherActivity.java blob=$ACTUAL_BLOB"

          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"

          echo "Exact baseline verified."

      - name: Patch Home V1 V3.7
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/"
              "V10LauncherActivity.java"
          )

          source = path.read_text(encoding="utf-8")

          def find_block_end(text, start):
              brace = text.find("{", start)
              if brace < 0:
                  raise RuntimeError("Opening brace not found")

              depth = 0
              in_string = False
              in_char = False
              in_line_comment = False
              in_block_comment = False
              escaped = False

              i = brace

              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ""

                  if in_line_comment:
                      if c == "\n":
                          in_line_comment = False
                      i += 1
                      continue

                  if in_block_comment:
                      if c == "*" and n == "/":
                          in_block_comment = False
                          i += 2
                          continue
                      i += 1
                      continue

                  if in_string:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == '"':
                          in_string = False
                      i += 1
                      continue

                  if in_char:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == "'":
                          in_char = False
                      i += 1
                      continue

                  if c == "/" and n == "/":
                      in_line_comment = True
                      i += 2
                      continue

                  if c == "/" and n == "*":
                      in_block_comment = True
                      i += 2
                      continue

                  if c == '"':
                      in_string = True
                      i += 1
                      continue

                  if c == "'":
                      in_char = True
                      i += 1
                      continue

                  if c == "{":
                      depth += 1
                  elif c == "}":
                      depth -= 1
                      if depth == 0:
                          return i + 1

                  i += 1

              raise RuntimeError("Matching closing brace not found")

          def get_method(text, signature):
              start = text.find(signature)
              if start < 0:
                  raise RuntimeError("Method not found: " + signature)
              end = find_block_end(text, start)
              return start, end, text[start:end]

          def replace_method(text, signature, replacement):
              start, end, old = get_method(text, signature)
              return text[:start] + replacement + text[end:], old

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"{label}: expected exactly 1 occurrence, found {count}"
                  )
              return text.replace(old, new, 1)

          # ------------------------------------------------------------
          # Imports
          # ------------------------------------------------------------

          imports = [
              "import android.graphics.Canvas;",
              "import android.graphics.Color;",
              "import android.graphics.Paint;",
              "import android.graphics.Path;",
              "import android.graphics.drawable.Drawable;",
              "import android.graphics.drawable.GradientDrawable;",
              "import android.widget.FrameLayout;",
              "import android.widget.ImageView;",
          ]

          for imp in imports:
              if imp not in source:
                  marker = "import android.view.View;"
                  source = replace_once(
                      source,
                      marker,
                      marker + "\n" + imp,
                      "add import " + imp
                  )

          # ------------------------------------------------------------
          # buildDashboard()
          # ------------------------------------------------------------

          build_dashboard = r'''    private void buildDashboard() {
          dashboard.removeAllViews();

          LinearLayout main = new LinearLayout(this);
          main.setOrientation(LinearLayout.HORIZONTAL);
          main.setPadding(0, dp(4), 0, dp(4));

          main.addView(buildSidebar(),
                  new LinearLayout.LayoutParams(dp(82), -1));

          LinearLayout content = new LinearLayout(this);
          content.setOrientation(LinearLayout.VERTICAL);
          content.setPadding(dp(8), 0, 0, 0);

          FrameLayout map = new FrameLayout(this);
          map.setBackground(roundBg(Color.rgb(9, 17, 23), dp(16)));
          map.addView(new MapBackground(this),
                  new FrameLayout.LayoutParams(-1, -1));

          TextView mapTitle = text("MAP", 12, Color.WHITE);
          mapTitle.setGravity(Gravity.CENTER);
          mapTitle.setBackground(
                  roundBg(Color.rgb(24, 32, 42), dp(10))
          );

          FrameLayout.LayoutParams mt =
                  new FrameLayout.LayoutParams(dp(70), dp(38));
          mt.gravity = Gravity.TOP | Gravity.LEFT;
          mt.setMargins(dp(10), dp(10), 0, 0);
          map.addView(mapTitle, mt);

          TextView navigation =
                  text("Navigation\nReady", 12, Color.LTGRAY);
          navigation.setGravity(Gravity.CENTER);
          navigation.setBackground(
                  roundBg(Color.rgb(18, 25, 33), dp(10))
          );

          FrameLayout.LayoutParams np =
                  new FrameLayout.LayoutParams(dp(120), dp(58));
          np.gravity = Gravity.BOTTOM | Gravity.LEFT;
          np.setMargins(dp(10), 0, 0, dp(10));
          map.addView(navigation, np);

          LinearLayout warning = new LinearLayout(this);
          warning.setOrientation(LinearLayout.VERTICAL);
          warning.setGravity(Gravity.CENTER);
          warning.setPadding(
                  dp(8), dp(5), dp(8), dp(5)
          );
          warning.setBackground(
                  roundBg(
                          Color.argb(190, 30, 34, 39),
                          dp(16)
                  )
          );

          TextView wt = text("⚠ WYN", 13, Color.WHITE);
          wt.setGravity(Gravity.CENTER);

          TextView wm =
                  text("CHƯA CÓ CẢNH BÁO", 9, Color.LTGRAY);
          wm.setGravity(Gravity.CENTER);

          TextView ws =
                  text("Nguồn cảnh báo: WYN", 8, Color.GRAY);
          ws.setGravity(Gravity.CENTER);

          warning.addView(wt);
          warning.addView(wm);
          warning.addView(ws);

          FrameLayout.LayoutParams wp =
                  new FrameLayout.LayoutParams(dp(126), dp(70));
          wp.gravity = Gravity.RIGHT | Gravity.BOTTOM;
          wp.setMargins(0, 0, dp(10), dp(10));
          map.addView(warning, wp);

          content.addView(
                  map,
                  new LinearLayout.LayoutParams(-1, 0, 1f)
          );

          LinearLayout bottom = new LinearLayout(this);
          bottom.setGravity(Gravity.CENTER_VERTICAL);
          bottom.setPadding(
                  dp(4), dp(4), dp(4), dp(4)
          );
          bottom.setBackgroundColor(Color.TRANSPARENT);

          TextView previous = buttonText("◀  LÙI");
          TextView media =
                  buttonText("♫  MEDIA\nNo media");
          TextView next = buttonText("TỚI  ▶");

          previous.setOnClickListener(v -> {
              if (status != null) {
                  status.setText("LÙI");
              }
          });

          next.setOnClickListener(v -> {
              if (status != null) {
                  status.setText("TỚI");
              }
          });

          bottom.addView(
                  previous,
                  new LinearLayout.LayoutParams(
                          0, dp(50), 1f
                  )
          );

          bottom.addView(
                  media,
                  new LinearLayout.LayoutParams(
                          0, dp(50), 2f
                  )
          );

          bottom.addView(
                  next,
                  new LinearLayout.LayoutParams(
                          0, dp(50), 1f
                  )
          );

          content.addView(
                  bottom,
                  new LinearLayout.LayoutParams(-1, dp(58))
          );

          main.addView(
                  content,
                  new LinearLayout.LayoutParams(0, -1, 1f)
          );

          dashboard.addView(
                  main,
                  new LinearLayout.LayoutParams(-1, 0, 1f)
          );
      }'''

          source, _ = replace_method(
              source,
              "    private void buildDashboard()",
              build_dashboard
          )

          # ------------------------------------------------------------
          # loadApps()
          # ------------------------------------------------------------

          load_apps = r'''    private void loadApps() {
          apps.clear();

          Intent intent = new Intent(Intent.ACTION_MAIN);
          intent.addCategory(Intent.CATEGORY_LAUNCHER);

          List<ResolveInfo> result =
                  getPackageManager().queryIntentActivities(
                          intent, 0
                  );

          for (ResolveInfo info : result) {
              if (info == null || info.activityInfo == null) {
                  continue;
              }

              String packageName =
                      info.activityInfo.packageName;

              if (getPackageName().equals(packageName)) {
                  continue;
              }

              ComponentName component =
                      new ComponentName(
                              packageName,
                              info.activityInfo.name
                      );

              CharSequence label =
                      info.loadLabel(getPackageManager());

              String name =
                      label == null
                              ? packageName
                              : label.toString();

              Drawable icon =
                      info.loadIcon(getPackageManager());

              apps.add(
                      new AppInfo(
                              component,
                              name,
                              icon
                      )
              );
          }

          Collections.sort(
                  apps,
                  (a, b) ->
                          a.name.compareToIgnoreCase(b.name)
          );

          rebuildDock();
          rebuildGridFromPanel();
      }'''

          source, _ = replace_method(
              source,
              "    private void loadApps()",
              load_apps
          )

          # ------------------------------------------------------------
          # appTile()
          # ------------------------------------------------------------

          app_tile = r'''    private LinearLayout appTile(AppInfo app) {
          LinearLayout tile = new LinearLayout(this);

          tile.setOrientation(LinearLayout.VERTICAL);
          tile.setGravity(Gravity.CENTER);
          tile.setPadding(
                  dp(6), dp(6), dp(6), dp(6)
          );

          tile.setBackground(
                  roundBg(
                          Color.rgb(22, 28, 35),
                          dp(14)
                  )
          );

          ImageView icon = new ImageView(this);

          if (app.icon != null) {
              icon.setImageDrawable(app.icon);
          } else {
              icon.setImageDrawable(
                      getPackageManager()
                              .getDefaultActivityIcon()
              );
          }

          icon.setScaleType(
                  ImageView.ScaleType.CENTER_INSIDE
          );

          tile.addView(
                  icon,
                  new LinearLayout.LayoutParams(
                          dp(50), dp(50)
                  )
          );

          TextView name =
                  text(app.name, 12, Color.WHITE);

          name.setGravity(Gravity.CENTER);
          name.setMaxLines(2);

          tile.addView(
                  name,
                  new LinearLayout.LayoutParams(
                          -1, dp(40)
                  )
          );

          tile.setOnClickListener(
                  v -> selectApp(app)
          );

          return tile;
      }'''

          source, _ = replace_method(
              source,
              "    private LinearLayout appTile(AppInfo app)",
              app_tile
          )

          # ------------------------------------------------------------
          # AppInfo
          # ------------------------------------------------------------

          app_info = r'''    private static final class AppInfo {
          final ComponentName component;
          final String name;
          final Drawable icon;

          AppInfo(
                  ComponentName component,
                  String name,
                  Drawable icon
          ) {
              this.component = component;
              this.name = name;
              this.icon = icon;
          }
      }'''

          source, _ = replace_method(
              source,
              "    private static final class AppInfo",
              app_info
          )

          # ------------------------------------------------------------
          # Remove obsolete initial() helper if still present.
          # ------------------------------------------------------------

          initial_signature = "    private String initial("
          if initial_signature in source:
              start, end, _ = get_method(
                  source,
                  initial_signature
              )
              source = source[:start] + source[end:]

          # ------------------------------------------------------------
          # Sidebar + WYN map background + recent helpers
          # Insert immediately before card().
          # ------------------------------------------------------------

          helpers = r'''    private LinearLayout buildSidebar() {
          LinearLayout side = new LinearLayout(this);

          side.setOrientation(LinearLayout.VERTICAL);
          side.setGravity(Gravity.CENTER_HORIZONTAL);
          side.setPadding(
                  0, dp(4), 0, dp(4)
          );

          side.setBackgroundColor(Color.TRANSPARENT);

          side.addView(
                  sideButton("APPS", "Apps")
          );
          side.addView(
                  sideButton("RECENT 1", "Recent 1")
          );
          side.addView(
                  sideButton("RECENT 2", "Recent 2")
          );
          side.addView(
                  sideButton("RECENT 3", "Recent 3")
          );
          side.addView(
                  sideButton("TASKS", "Tasks")
          );

          return side;
      }

      private TextView sideButton(
              String title,
              String action
      ) {
          TextView view =
                  text(title, 10, Color.WHITE);

          view.setGravity(Gravity.CENTER);
          view.setPadding(
                  dp(2), dp(3), dp(2), dp(3)
          );

          view.setBackgroundColor(
                  Color.TRANSPARENT
          );

          view.setOnClickListener(v -> {
              if ("Apps".equals(action)) {
                  showApps();
              } else if ("Tasks".equals(action)) {
                  showTasks();
              } else if (
                      action.startsWith("Recent")
              ) {
                  showRecentTask(action);
              }
          });

          view.setLayoutParams(
                  new LinearLayout.LayoutParams(
                          -1, dp(58)
                  )
          );

          return view;
      }

      private void showTasks() {
          showApps();

          if (status != null) {
              status.setText(
                      "TASKS - Recent apps: "
                              + V10SessionStore
                                      .getRecents(this)
                                      .size()
              );
          }
      }

      private void showRecentTask(String action) {
          List<ComponentName> recents =
                  V10SessionStore
                          .getRecents(this);

          int index;

          if ("Recent 1".equals(action)) {
              index = 0;
          } else if (
                  "Recent 2".equals(action)
          ) {
              index = 1;
          } else {
              index = 2;
          }

          if (index >= recents.size()) {
              showApps();

              if (status != null) {
                  status.setText("No recent task");
              }

              return;
          }

          ComponentName component =
                  recents.get(index);

          V10SessionStore.setTarget(
                  this,
                  component
          );

          showApps();

          if (status != null) {
              status.setText(
                      "Recent: "
                              + component.getPackageName()
              );
          }
      }

      private static final class MapBackground
              extends View {

          private final Paint paint =
                  new Paint(Paint.ANTI_ALIAS_FLAG);

          private final Path road =
                  new Path();

          MapBackground(android.content.Context context) {
              super(context);

              paint.setStrokeWidth(2f);
          }

          @Override
          protected void onDraw(Canvas canvas) {
              super.onDraw(canvas);

              int width = getWidth();
              int height = getHeight();

              canvas.drawColor(
                      Color.rgb(9, 17, 23)
              );

              paint.setStyle(Paint.Style.STROKE);
              paint.setStrokeWidth(1f);
              paint.setColor(
                      Color.rgb(24, 39, 48)
              );

              int step = 48;

              for (int x = 0; x < width; x += step) {
                  canvas.drawLine(
                          x, 0, x, height, paint
                  );
              }

              for (int y = 0; y < height; y += step) {
                  canvas.drawLine(
                          0, y, width, y, paint
                  );
              }

              road.reset();

              road.moveTo(
                      width * 0.05f,
                      height * 0.82f
              );

              road.cubicTo(
                      width * 0.25f,
                      height * 0.55f,
                      width * 0.42f,
                      height * 0.76f,
                      width * 0.55f,
                      height * 0.42f
              );

              road.cubicTo(
                      width * 0.67f,
                      height * 0.12f,
                      width * 0.82f,
                      height * 0.30f,
                      width * 0.98f,
                      height * 0.12f
              );

              paint.setStrokeWidth(18f);
              paint.setColor(
                      Color.rgb(33, 47, 56)
              );

              canvas.drawPath(road, paint);

              paint.setStrokeWidth(3f);
              paint.setColor(Color.WHITE);

              canvas.drawPath(road, paint);

              paint.setStyle(Paint.Style.FILL);
              paint.setColor(
                      Color.rgb(255, 255, 255)
              );

              float cx = width * 0.55f;
              float cy = height * 0.42f;

              canvas.drawCircle(
                      cx, cy, 8f, paint
              );
          }
      }

      '''

          marker = "    private LinearLayout card() {"

          if marker not in source:
              raise RuntimeError(
                  "Insertion marker not found: private LinearLayout card()"
              )

          source = source.replace(
              marker,
              helpers + marker,
              1
          )

          path.write_text(
              source,
              encoding="utf-8"
          )

          print("V3.7 patch applied successfully.")
          PY

      - name: Static Safety Check V3.7
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/"
              "V10LauncherActivity.java"
          )

          source = path.read_text(encoding="utf-8")

          def find_block_end(text, start):
              brace = text.find("{", start)
              if brace < 0:
                  raise RuntimeError("opening brace not found")

              depth = 0
              in_string = False
              in_char = False
              in_line_comment = False
              in_block_comment = False
              escaped = False

              i = brace

              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ""

                  if in_line_comment:
                      if c == "\n":
                          in_line_comment = False
                      i += 1
                      continue

                  if in_block_comment:
                      if c == "*" and n == "/":
                          in_block_comment = False
                          i += 2
                          continue
                      i += 1
                      continue

                  if in_string:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == '"':
                          in_string = False
                      i += 1
                      continue

                  if in_char:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == "'":
                          in_char = False
                      i += 1
                      continue

                  if c == "/" and n == "/":
                      in_line_comment = True
                      i += 2
                      continue

                  if c == "/" and n == "*":
                      in_block_comment = True
                      i += 2
                      continue

                  if c == '"':
                      in_string = True
                      i += 1
                      continue

                  if c == "'":
                      in_char = True
                      i += 1
                      continue

                  if c == "{":
                      depth += 1
                  elif c == "}":
                      depth -= 1
                      if depth == 0:
                          return i + 1

                  i += 1

              raise RuntimeError("closing brace not found")

          def block(signature):
              start = source.find(signature)

              if start < 0:
                  raise RuntimeError(
                      "Missing method: " + signature
                  )

              end = find_block_end(source, start)
              return source[start:end]

          def check(condition, label):
              if condition:
                  print("[PASS] " + label)
              else:
                  print("[FAIL] " + label)
                  raise SystemExit(1)

          # ------------------------------------------------------------
          # IMPORTANT:
          # Dashboard checks are intentionally scoped ONLY to
          # buildDashboard().
          # ------------------------------------------------------------

          dash = block(
              "    private void buildDashboard()"
          )

          check(
              "CAR ASSISTANT" not in dash,
              "DASHBOARD no CAR ASSISTANT header"
          )

          check(
              "clock =" not in dash,
              "DASHBOARD no clock field"
          )

          check(
              "date =" not in dash,
              "DASHBOARD no date field"
          )

          check(
              "FrameLayout map =" in dash,
              "DASHBOARD MAP"
          )

          check(
              "⚠ WYN" in dash,
              "DASHBOARD WYN"
          )

          check(
              "Nguồn cảnh báo: WYN" in dash,
              "DASHBOARD WYN source"
          )

          check(
              "Gravity.RIGHT | Gravity.BOTTOM" in dash,
              "DASHBOARD WYN right-bottom"
          )

          check(
              "FrameLayout.LayoutParams(dp(126), dp(70))"
              in dash,
              "DASHBOARD WYN compact box"
          )

          check(
              "bottom.setBackgroundColor(Color.TRANSPARENT)"
              in dash,
              "DASHBOARD transparent bottom"
          )

          # ------------------------------------------------------------
          # Whole-file structural checks.
          # These do NOT judge dashboard header contents.
          # ------------------------------------------------------------

          check(
              "private LinearLayout buildSidebar()" in source,
              "SIDEBAR"
          )

          check(
              'sideButton("APPS", "Apps")' in source,
              "APPS"
          )

          check(
              'sideButton("RECENT 1", "Recent 1")'
              in source,
              "RECENT 1"
          )

          check(
              'sideButton("RECENT 2", "Recent 2")'
              in source,
              "RECENT 2"
          )

          check(
              'sideButton("RECENT 3", "Recent 3")'
              in source,
              "RECENT 3"
          )

          check(
              'sideButton("TASKS", "Tasks")'
              in source,
              "TASKS"
          )

          check(
              "private void showTasks()" in source,
              "SHOW TASKS"
          )

          check(
              "private void showRecentTask("
              in source,
              "RECENT HANDLER"
          )

          check(
              "V10SessionStore" in source
              and "getRecents" in source,
              "RECENTS STORE"
          )

          check(
              "Drawable icon" in source,
              "DRAWABLE MODEL"
          )

          check(
              "ImageView icon" in source,
              "IMAGE VIEW"
          )

          check(
              "info.loadIcon(getPackageManager())"
              in source,
              "REAL ICON"
          )

          check(
              'buttonText("◀  LÙI")' in source,
              "LUI"
          )

          check(
              'buttonText("TỚI  ▶")' in source,
              "TOI"
          )

          check(
              'buttonText("♫  MEDIA\\nNo media")'
              in source,
              "MEDIA"
          )

          check(
              "private static final class MapBackground"
              in source,
              "MAP BACKGROUND"
          )

          check(
              "initial(app.name)" not in source,
              "NO OLD INITIAL ICON CALL"
          )

          check(
              "private String initial(" not in source,
              "NO OLD INITIAL METHOD"
          )

          # Ensure only one buildDashboard remains.
          check(
              source.count(
                  "private void buildDashboard()"
              ) == 1,
              "ONE buildDashboard"
          )

          # Ensure the key patched methods remain unique.
          check(
              source.count(
                  "private void loadApps()"
              ) == 1,
              "ONE loadApps"
          )

          check(
              source.count(
                  "private LinearLayout appTile(AppInfo app)"
              ) == 1,
              "ONE appTile"
          )

          check(
              source.count(
                  "private static final class AppInfo"
              ) == 1,
              "ONE AppInfo"
          )

          print("Static Safety Check V3.7 PASS.")
          PY

      - name: Protected Core and Persistence Check
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"

          git diff --check

          git diff --name-only | tee changed-files.txt

          test "$(wc -l < changed-files.txt)" = "1"

          grep -Fxq "$FILE" changed-files.txt

          if grep -Eq \
            'V10ProjectionService.java|V10ProjectionSession.java|RootView.java|V10SessionStore.java|V10CarActivity.java' \
            changed-files.txt
          then
            echo "[FAIL] Protected Core/Persistence file changed."
            exit 1
          fi

          echo "[PASS] Only V10LauncherActivity.java changed."
          echo "[PASS] Display Core protected."
          echo "[PASS] Projection Service/Session protected."
          echo "[PASS] RootView protected."
          echo "[PASS] Persistence protected."
          echo "[PASS] V10CarActivity protected."

      - name: Compile Debug
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace

      - name: Assemble Debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: SHA256 APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          sha256sum "$APK"

      - name: Upload V3.7 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Home-V1-Phone-UI-V3.7-debug
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
