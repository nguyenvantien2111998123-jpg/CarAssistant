name: Build Car Assistant V10 - Home V1 Phone UI V3.7 FIX PACKAGE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: 0634e1f5ced143fdd931022b32bf9a19cbf6e2bd
          fetch-depth: 0

      - name: Verify Baseline Commit
        run: |
          ACTUAL_COMMIT=$(git rev-parse HEAD)
          EXPECTED_COMMIT="0634e1f5ced143fdd931022b32bf9a19cbf6e2bd"
          echo "Current Commit: $ACTUAL_COMMIT"
          if [ "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "ERROR: Commit mismatch!"
            exit 1
          fi

      - name: Verify Target Java File Hash
        run: |
          TARGET_FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"
          ACTUAL_HASH=$(git hash-object "$TARGET_FILE")
          EXPECTED_HASH="84d970adbfacc39270838d12ed0a73bc7fa0d645"
          echo "File Hash: $ACTUAL_HASH"
          if [ "$ACTUAL_HASH" != "$EXPECTED_HASH" ]; then
            echo "ERROR: File blob hash mismatch!"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Patch V10LauncherActivity.java
        run: |
          python3 -c '
          import os

          target_file = "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"

          java_code = """package com.hieptran.aacast.doudou;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.RectF;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.ArrayAdapter;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ListView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.List;

          public class V10LauncherActivity extends Activity {

              private FrameLayout rootLayout;
              private LinearLayout sidebarLayout;
              private FrameLayout mapContainer;
              private LinearLayout bottomBarLayout;
              private FrameLayout wynBox;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  rootLayout = new FrameLayout(this);
                  rootLayout.setBackgroundColor(Color.BLACK);

                  buildDashboard();
                  setContentView(rootLayout);
              }

              private int dp(int value) {
                  return (int) TypedValue.applyDimension(
                          TypedValue.COMPLEX_UNIT_DIP,
                          value,
                          getResources().getDisplayMetrics()
                  );
              }

              private void buildDashboard() {
                  rootLayout.removeAllViews();

                  LinearLayout mainContainer = new LinearLayout(this);
                  mainContainer.setOrientation(LinearLayout.VERTICAL);
                  FrameLayout.LayoutParams mainParams = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                  );
                  mainContainer.setLayoutParams(mainParams);

                  LinearLayout bodyLayout = new LinearLayout(this);
                  bodyLayout.setOrientation(LinearLayout.HORIZONTAL);
                  LinearLayout.LayoutParams bodyParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1.0f
                  );
                  bodyLayout.setLayoutParams(bodyParams);

                  sidebarLayout = new LinearLayout(this);
                  sidebarLayout.setOrientation(LinearLayout.VERTICAL);
                  sidebarLayout.setBackgroundColor(Color.TRANSPARENT);
                  int sidebarPadding = dp(8);
                  sidebarLayout.setPadding(sidebarPadding, sidebarPadding, sidebarPadding, sidebarPadding);
                  LinearLayout.LayoutParams sidebarParams = new LinearLayout.LayoutParams(
                          dp(120),
                          ViewGroup.LayoutParams.MATCH_PARENT
                  );
                  sidebarLayout.setLayoutParams(sidebarParams);

                  setupSidebarItems();

                  mapContainer = new FrameLayout(this);
                  LinearLayout.LayoutParams mapParams = new LinearLayout.LayoutParams(
                          0,
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          1.0f
                  );
                  mapContainer.setLayoutParams(mapParams);

                  MapBackgroundView mapView = new MapBackgroundView(this);
                  FrameLayout.LayoutParams mapBgParams = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                  );
                  mapContainer.addView(mapView, mapBgParams);

                  wynBox = new FrameLayout(this);
                  GradientDrawable wynBg = new GradientDrawable();
                  wynBg.setColor(0xCC1E232A);
                  wynBg.setCornerRadius(dp(8));
                  wynBox.setBackground(wynBg);

                  int wynPadding = dp(6);
                  wynBox.setPadding(wynPadding, wynPadding, wynPadding, wynPadding);

                  LinearLayout wynContent = new LinearLayout(this);
                  wynContent.setOrientation(LinearLayout.VERTICAL);

                  TextView tvWynTitle = new TextView(this);
                  tvWynTitle.setText("\\u26A0 WYN");
                  tvWynTitle.setTextColor(Color.YELLOW);
                  tvWynTitle.setTextSize(TypedValue.COMPLEX_UNIT_SP, 12);

                  TextView tvWynMsg = new TextView(this);
                  tvWynMsg.setText("CH\\u01AFA C\\u00D3 C\\u1EA2NH B\\u00C1O");
                  tvWynMsg.setTextColor(Color.WHITE);
                  tvWynMsg.setTextSize(TypedValue.COMPLEX_UNIT_SP, 10);

                  TextView tvWynSrc = new TextView(this);
                  tvWynSrc.setText("Ngu\\u1ED3n c\\u1EA3nh b\\u00E1o: WYN");
                  tvWynSrc.setTextColor(Color.LTGRAY);
                  tvWynSrc.setTextSize(TypedValue.COMPLEX_UNIT_SP, 9);

                  wynContent.addView(tvWynTitle);
                  wynContent.addView(tvWynMsg);
                  wynContent.addView(tvWynSrc);

                  FrameLayout.LayoutParams wynBoxParams = new FrameLayout.LayoutParams(
                          dp(126),
                          dp(70)
                  );
                  wynBoxParams.gravity = Gravity.RIGHT | Gravity.BOTTOM;
                  wynBoxParams.rightMargin = dp(12);
                  wynBoxParams.bottomMargin = dp(12);

                  wynBox.addView(wynContent);
                  mapContainer.addView(wynBox, wynBoxParams);

                  bodyLayout.addView(sidebarLayout);
                  bodyLayout.addView(mapContainer);

                  bottomBarLayout = new LinearLayout(this);
                  bottomBarLayout.setOrientation(LinearLayout.HORIZONTAL);
                  bottomBarLayout.setBackgroundColor(Color.TRANSPARENT);
                  bottomBarLayout.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams bottomParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(50)
                  );
                  bottomBarLayout.setLayoutParams(bottomParams);

                  setupBottomBarItems();

                  mainContainer.addView(bodyLayout);
                  mainContainer.addView(bottomBarLayout);

                  rootLayout.addView(mainContainer);
              }

              private void setupSidebarItems() {
                  sidebarLayout.removeAllViews();

                  addSidebarButton("APPS", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          showAppListDialog();
                      }
                  });

                  List<String> recents = V10SessionStore.getRecents(this);
                  for (int i = 0; i < 3; i++) {
                      final int index = i;
                      String title = "RECENT " + (i + 1);
                      if (recents != null && i < recents.size()) {
                          String pkg = recents.get(i);
                          if (pkg != null && !pkg.isEmpty()) {
                              title = getAppNameFromPkg(pkg);
                          }
                      }
                      addSidebarButton(title, new View.OnClickListener() {
                          @Override
                          public void onClick(View v) {
                              if (recents != null && index < recents.size()) {
                                  launchAppPackage(recents.get(index));
                              } else {
                                  Toast.makeText(V10LauncherActivity.this, "Ch\\u01B0a c\\u00F3 \\u0111\\u1ECBa ch\\u1EC9 recent", Toast.LENGTH_SHORT).show();
                              }
                          }
                      });
                  }

                  addSidebarButton("TASKS", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          Toast.makeText(V10LauncherActivity.this, "Tasks", Toast.LENGTH_SHORT).show();
                      }
                  });
              }

              private void addSidebarButton(String text, View.OnClickListener listener) {
                  TextView tv = new TextView(this);
                  tv.setText(text);
                  tv.setTextColor(Color.WHITE);
                  tv.setTextSize(TypedValue.COMPLEX_UNIT_SP, 12);
                  tv.setGravity(Gravity.CENTER);
                  tv.setPadding(dp(4), dp(8), dp(4), dp(8));

                  GradientDrawable btnBg = new GradientDrawable();
                  btnBg.setColor(0x44FFFFFF);
                  btnBg.setCornerRadius(dp(6));
                  tv.setBackground(btnBg);

                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1.0f
                  );
                  lp.setMargins(0, dp(4), 0, dp(4));

                  tv.setOnClickListener(listener);
                  sidebarLayout.addView(tv, lp);
              }

              private void setupBottomBarItems() {
                  bottomBarLayout.removeAllViews();

                  addBottomButton("L\\u00D9I", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          onBackPressed();
                      }
                  });

                  addBottomButton("MEDIA", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          Toast.makeText(V10LauncherActivity.this, "Media Player", Toast.LENGTH_SHORT).show();
                      }
                  });

                  addBottomButton("T\\u1EDA I", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          Toast.makeText(V10LauncherActivity.this, "Next", Toast.LENGTH_SHORT).show();
                      }
                  });
              }

              private void addBottomButton(String text, View.OnClickListener listener) {
                  TextView tv = new TextView(this);
                  tv.setText(text);
                  tv.setTextColor(Color.WHITE);
                  tv.setTextSize(TypedValue.COMPLEX_UNIT_SP, 13);
                  tv.setGravity(Gravity.CENTER);

                  GradientDrawable btnBg = new GradientDrawable();
                  btnBg.setColor(0x33FFFFFF);
                  btnBg.setCornerRadius(dp(16));
                  tv.setBackground(btnBg);

                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          0,
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          1.0f
                  );
                  lp.setMargins(dp(12), dp(6), dp(12), dp(6));

                  tv.setOnClickListener(listener);
                  bottomBarLayout.addView(tv, lp);
              }

              private String getAppNameFromPkg(String pkg) {
                  PackageManager pm = getPackageManager();
                  try {
                      return pm.getApplicationLabel(pm.getApplicationInfo(pkg, 0)).toString();
                  } catch (Exception e) {
                      return pkg;
                  }
              }

              private void launchAppPackage(String pkg) {
                  try {
                      Intent intent = getPackageManager().getLaunchIntentForPackage(pkg);
                      if (intent != null) {
                          startActivity(intent);
                      } else {
                          Toast.makeText(this, "Kh\\u00F4ng th\\u1EC3 m\\u1EDF \\u1EE9ng d\\u1EE5ng này", Toast.LENGTH_SHORT).show();
                      }
                  } catch (Exception e) {
                      Toast.makeText(this, "L\\u1ED7i m\\u1EDF app: " + e.getMessage(), Toast.LENGTH_SHORT).show();
                  }
              }

              private void showAppListDialog() {
                  final PackageManager pm = getPackageManager();
                  Intent mainIntent = new Intent(Intent.ACTION_MAIN, null);
                  mainIntent.addCategory(Intent.CATEGORY_LAUNCHER);
                  final List<ResolveInfo> apps = pm.queryIntentActivities(mainIntent, 0);

                  ListView listView = new ListView(this);
                  ArrayAdapter<ResolveInfo> adapter = new ArrayAdapter<ResolveInfo>(this, android.R.layout.select_dialog_item, apps) {
                      @Override
                      public View getView(int position, View convertView, ViewGroup parent) {
                          View view = super.getView(position, convertView, parent);
                          if (view instanceof TextView) {
                              TextView tv = (TextView) view;
                              ResolveInfo info = getItem(position);
                              tv.setText(info.loadLabel(pm));
                              Drawable icon = info.loadIcon(pm);
                              icon.setBounds(0, 0, dp(32), dp(32));
                              tv.setCompoundDrawables(icon, null, null, null);
                              tv.setCompoundDrawablePadding(dp(12));
                              tv.setTextColor(Color.BLACK);
                          }
                          return view;
                      }
                  };
                  listView.setAdapter(adapter);

                  final android.app.AlertDialog dialog = new android.app.AlertDialog.Builder(this)
                          .setTitle("Danh s\\u00E1ch \\u1EE9ng d\\u1EE5ng")
                          .setView(listView)
                          .create();

                  listView.setOnItemClickListener((parent, view, position, id) -> {
                      ResolveInfo info = apps.get(position);
                      Intent intent = pm.getLaunchIntentForPackage(info.activityInfo.packageName);
                      if (intent != null) {
                          startActivity(intent);
                      }
                      dialog.dismiss();
                  });

                  dialog.show();
              }

              private static class MapBackgroundView extends View {
                  private Paint gridPaint;
                  private Paint roadPaint;
                  private Path roadPath;

                  public MapBackgroundView(Context context) {
                      super(context);
                      init();
                  }

                  private void init() {
                      gridPaint = new Paint();
                      gridPaint.setColor(0xFF1E2631);
                      gridPaint.setStrokeWidth(2f);
                      gridPaint.setStyle(Paint.Style.STROKE);

                      roadPaint = new Paint();
                      roadPaint.setColor(0xFF2C3E50);
                      roadPaint.setStrokeWidth(16f);
                      roadPaint.setStyle(Paint.Style.STROKE);
                      roadPaint.setAntiAlias(true);

                      roadPath = new Path();
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      canvas.drawColor(0xFF12171E);

                      int width = getWidth();
                      int height = getHeight();

                      int step = 60;
                      for (int x = 0; x < width; x += step) {
                          canvas.drawLine(x, 0, x, height, gridPaint);
                      }
                      for (int y = 0; y < height; y += step) {
                          canvas.drawLine(0, y, width, y, gridPaint);
                      }

                      roadPath.reset();
                      roadPath.moveTo(0, height * 0.7f);
                      roadPath.cubicTo(width * 0.3f, height * 0.6f, width * 0.6f, height * 0.9f, width, height * 0.4f);
                      canvas.drawPath(roadPath, roadPaint);

                      roadPath.reset();
                      roadPath.moveTo(width * 0.4f, 0);
                      roadPath.lineTo(width * 0.5f, height);
                      canvas.drawPath(roadPath, roadPaint);
                  }
              }
          }
          """

          with open(target_file, "w", encoding="utf-8") as f:
              f.write(java_code)

          print("Successfully patched V10LauncherActivity.java")
          '

      - name: Verify Git Diff and Protected Files
        run: |
          git diff --check
          echo "Changed files:"
          CHANGED_FILES=$(git diff --name-only)
          echo "$CHANGED_FILES"

          EXPECTED_FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"
          if [ "$CHANGED_FILES" != "$EXPECTED_FILE" ]; then
            echo "ERROR: Protected files modified or unexpected changes!"
            exit 1
          fi

      - name: Static Check UI V3.7 Requirements
        run: |
          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"

          echo "Running Static Checks..."

          if grep -q "CAR ASSISTANT" "$FILE"; then
            echo "FAILED: 'CAR ASSISTANT' still present in code."
            exit 1
          fi

          if grep -q "Clock" "$FILE" || grep -q "TextClock" "$FILE"; then
            echo "FAILED: Clock references found."
            exit 1
          fi

          if grep -i "date" "$FILE" | grep -v "update" | grep -v "candidate"; then
            echo "FAILED: Date display found."
            exit 1
          fi

          grep -q "MapBackgroundView" "$FILE" || { echo "FAILED: MAP missing"; exit 1; }
          
          grep -Fq 'tvWynTitle.setText("\u26A0 WYN");' "$FILE" || grep -Fq 'WYN' "$FILE" || { echo "FAILED: WYN title missing"; exit 1; }
          grep -Fq 'tvWynMsg.setText("CH\u01AFA C\u00D3 C\u1EA2NH B\u00C1O");' "$FILE" || grep -Fq 'C\u1EA2NH B\u00C1O' "$FILE" || { echo "FAILED: WYN message missing"; exit 1; }
          grep -Fq 'tvWynSrc.setText("Ngu\u1ED3n c\u1EA3nh b\u00E1o: WYN");' "$FILE" || grep -Fq 'Ngu\u1ED3n c\u1EA3nh b\u00E1o: WYN' "$FILE" || { echo "FAILED: WYN source missing"; exit 1; }
          
          grep -q "Gravity.RIGHT | Gravity.BOTTOM" "$FILE" || { echo "FAILED: WYN gravity position missing"; exit 1; }
          grep -q "dp(126)" "$FILE" || { echo "FAILED: WYN width 126dp missing"; exit 1; }
          grep -q "dp(70)" "$FILE" || { echo "FAILED: WYN height 70dp missing"; exit 1; }
          grep -q "bottomBarLayout.setBackgroundColor(Color.TRANSPARENT)" "$FILE" || { echo "FAILED: Bottom bar transparent missing"; exit 1; }

          echo "Static Checks Passed Successfully!"

      - name: Compile Debug Java With Javac
        run: |
          cd v10-source
          chmod +x gradlew
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon --stacktrace

      - name: Assemble Debug APK
        run: |
          cd v10-source
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Compute APK SHA256
        run: |
          APK_PATH="v10-source/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "APK generated successfully at $APK_PATH"
            sha256sum "$APK_PATH"
          else
            echo "ERROR: APK file not found!"
            exit 1
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Home-V1-Phone-UI-V3.7-debug-CLEAN
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
