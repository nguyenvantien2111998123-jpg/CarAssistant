name: Build Car Assistant V10 - Home V1 Phone UI V3.7

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v10-home-v1-v3-7:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact Home V1 baseline
        uses: actions/checkout@v4
        with:
          ref: 0634e1f5ced143fdd931022b32bf9a19cbf6e2bd
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify exact baseline
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_COMMIT="0634e1f5ced143fdd931022b32bf9a19cbf6e2bd"
          EXPECTED_BLOB="84d970adbfacc39270838d12ed0a73bc7fa0d645"
          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"

          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          echo "HEAD=$ACTUAL_COMMIT"
          test "$ACTUAL_COMMIT" = "$EXPECTED_COMMIT"

          ACTUAL_BLOB="$(git hash-object "$FILE")"
          echo "V10LauncherActivity.java blob=$ACTUAL_BLOB"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"

          echo "Exact baseline verified."

