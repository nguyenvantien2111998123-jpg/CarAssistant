name: Build Car Assistant V10 - Home V1 Phone UI V3.5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-v1-phone-ui-v35:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact Home V1 baseline
        uses: actions/checkout@v4
        with:
          ref: 0634e1f5ced143fdd931022b32bf9a19cbf6e2bd
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify exact baseline and architecture
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"
          STORE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java"

          test -f "$FILE"
          test -f "$STORE"

          COMMIT="$(git rev-parse HEAD)"
          test "$COMMIT" = "0634e1f5ced143fdd931022b32bf9a19cbf6e2bd"

          BLOB_SHA="$(git hash-object "$FILE")"
          test "$BLOB_SHA" = "84d970adbfacc39270838d12ed0a73bc7fa0d645"

          grep -Fq 'package com.carassistant.v10;' "$FILE"
          grep -Fq 'private void buildDashboard()' "$FILE"
          grep -Fq 'private void buildAppPanel()' "$FILE"
          grep -Fq 'private void loadApps()' "$FILE"
          grep -Fq 'private LinearLayout appTile(' "$FILE"
          grep -Fq 'V10SessionStore.setTarget' "$FILE"

          grep -Fq 'MAX_RECENTS = 4' "$STORE"
          grep -Fq 'getRecents(' "$STORE"
          grep -Fq 'touchRecent(' "$STORE"

          # Core / Persistence files must exist and remain untouched.
          test -f "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          test -f "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
          test -f "v10-source/app/src/main/java/com/hieptran/aacast/doudou/RootView.java"

          echo "========================================"
          echo "BASELINE VERIFIED"
          echo "Commit: $COMMIT"
          echo "Launcher blob: $BLOB_SHA"
          echo "Recent store: MAX_RECENTS=4"
          echo "Core files present"
          echo "========================================"

      - name: Patch Home V1 V3.5
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          original = source

          def find_block_end(text, start):
              brace = text.find("{", start)
              if brace < 0:
                  raise RuntimeError("Opening brace not found")

              depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False

              i = brace

              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ""

                  if line_comment:
                      if c == "\n":
                          line_comment = False

                  elif block_comment:
                      if c == "*" and n == "/":
                          block_comment = False
                          i += 1

                  elif quote is not None:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == quote:
                          quote = None

                  elif c == "/" and n == "/":
                      line_comment = True
                      i += 1

                  elif c == "/" and n == "*":
                      block_comment = True
                      i += 1

                  elif c in ("'", '"'):
                      quote = c

                  elif c == "{":
                      depth += 1

                  elif c == "}":
                      depth -= 1
                      if depth == 0:
                          return i + 1

                  i += 1

              raise RuntimeError("Closing brace not found")

          def replace_method(text, signature, replacement):
              start = text.find(signature)

              if start < 0:
                  raise RuntimeError(
                      "Method/class not found: " + signature
                  )

              end = find_block_end(text, start)

              return (
                  text[:start]
                  + replacement.strip()
                  + text[end:]
              )

          def add_import(text, anchor, imports):
              if anchor not in text:
                  raise RuntimeError(
                      "Import anchor missing: " + anchor
                  )

              for imp in imports:
                  if imp not in text:
                      text = text.replace(
                          anchor,
                          anchor + "\n" + imp,
                          1
                      )

              return text

          # ==================================================
          # IMPORTS
          # ==================================================

          source = add_import(
              source,
              "import android.graphics.Color;",
              [
                  "import android.graphics.Canvas;",
                  "import android.graphics.Paint;",
                  "import android.graphics.Path;"
              ]
          )

