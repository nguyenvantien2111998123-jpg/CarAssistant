          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")

          def find_block_end(text, start):
              brace = text.find("{", start)

              if brace < 0:
                  raise RuntimeError(
                      "Opening brace not found"
                  )

              depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              i = brace

              while i < len(text):
                  c = text[i]
                  n = (
                      text[i + 1]
                      if i + 1 < len(text)
                      else ""
                  )

                  if line_comment:
                      if c == "\n":
                          line_comment = False

                  elif block_comment:
                      if c == "*" and n == "/":
                          block_comment = False
                          i += 1

                  elif quote is not None:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == quote:
                          quote = None

                  elif c == "/" and n == "/":
                      line_comment = True
                      i += 1

                  elif c == "/" and n == "*":
                      block_comment = True
                      i += 1

                  elif c in ('"', "'"):
                      quote = c

                  elif c == "{":
                      depth += 1

                  elif c == "}":
                      depth -= 1

                      if depth == 0:
                          return i + 1

                  i += 1

