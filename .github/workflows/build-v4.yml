name: Build Car Assistant V4.1 Debug

on:
  workflow_dispatch:

jobs:
  build-v4-1-debug:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create V4.1 Debug source
        run: |
          rm -rf v4-source
          cp -R v3-source v4-source

          sed -i 's/versionCode = 1/versionCode = 41/' \
            v4-source/app/build.gradle.kts

          sed -i 's/versionName = "1.0"/versionName = "4.1-debug"/' \
            v4-source/app/build.gradle.kts

          sed -i 's/test-audio/internet-audio/g' \
            v4-source/app/src/main/java/com/carassistant/service/CarMediaService.kt

          sed -i 's#android.resource://com.carassistant/raw/test_audio#https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3#' \
            v4-source/app/src/main/java/com/carassistant/service/CarMediaService.kt

          sed -i 's/Car Assistant Test/Car Assistant Internet Debug/g' \
            v4-source/app/src/main/java/com/carassistant/service/CarMediaService.kt

          sed -i 's/Phase A - Offline Test/V4.1 - Internet Debug/g' \
            v4-source/app/src/main/java/com/carassistant/service/CarMediaService.kt

          sed -i 's/testItem()/internetItem()/g' \
            v4-source/app/src/main/java/com/carassistant/service/CarMediaService.kt

      - name: Add playback error logging
        run: |
          sed -i '/player = ExoPlayer.Builder(this).build()/a\
          player?.addListener(object : androidx.media3.common.Player.Listener { override fun onPlayerError(error: androidx.media3.common.PlaybackException) { android.util.Log.e("CarAssistantV41", "PLAYBACK ERROR: ${error.errorCodeName} - ${error.message}", error) } })' \
            v4-source/app/src/main/java/com/carassistant/service/CarMediaService.kt

      - name: Verify source
        run: |
          echo "===== VERSION ====="
          grep -n "versionCode\|versionName" \
            v4-source/app/build.gradle.kts

          echo "===== INTERNET URL ====="
          grep -n "https://" \
            v4-source/app/src/main/java/com/carassistant/service/CarMediaService.kt

          echo "===== ERROR LISTENER ====="
          grep -n "onPlayerError" \
            v4-source/app/src/main/java/com/carassistant/service/CarMediaService.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: v4-source
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: car-assistant-v4-1-debug-apk
          path: v4-source/app/build/outputs/apk/debug/app-debug.apk
