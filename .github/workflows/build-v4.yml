name: Build Car Assistant V4

on:
  workflow_dispatch:

jobs:
  build-v4:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create V4 source
        run: |
          rm -rf v4-source
          cp -R v3-source v4-source

          sed -i 's/versionCode = 1/versionCode = 4/' v4-source/app/build.gradle.kts
          sed -i 's/versionName = "1.0"/versionName = "4.0"/' v4-source/app/build.gradle.kts

          sed -i 's/test-audio/internet-audio/g' \
            v4-source/app/src/main/java/com/carassistant/service/CarMediaService.kt

          sed -i 's#android.resource://com.carassistant/raw/test_audio#https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3#' \
            v4-source/app/src/main/java/com/carassistant/service/CarMediaService.kt

          sed -i 's/Car Assistant Test/Car Assistant Internet Test/g' \
            v4-source/app/src/main/java/com/carassistant/service/CarMediaService.kt

          sed -i 's/Phase A - Offline Test/V4 - Internet Audio/g' \
            v4-source/app/src/main/java/com/carassistant/service/CarMediaService.kt

          sed -i 's/testItem()/internetItem()/g' \
            v4-source/app/src/main/java/com/carassistant/service/CarMediaService.kt

      - name: Show V4 source
        run: |
          echo "=== VERSION ==="
          grep -n "versionCode\|versionName" v4-source/app/build.gradle.kts

          echo "=== MEDIA SERVICE ==="
          grep -n "internet-audio\|https://\|internetItem" \
            v4-source/app/src/main/java/com/carassistant/service/CarMediaService.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: v4-source
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload V4 APK
        uses: actions/upload-artifact@v4
        with:
          name: car-assistant-v4-debug-apk
          path: v4-source/app/build/outputs/apk/debug/app-debug.apk
