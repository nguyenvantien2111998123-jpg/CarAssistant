name: Build Navigation V1 Patch1 AutoFollow

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: navigation-v1-source

jobs:
  build-navigation-v1:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # STEP 01
      # ============================================================
      - name: Checkout main baseline
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ============================================================
      # STEP 02
      # ============================================================
      - name: Show repository state
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          echo "=== HEAD ==="
          git rev-parse HEAD

          echo
          echo "=== BRANCH ==="
          git branch --show-current

          echo
          echo "=== STATUS ==="
          git status --short

      # ============================================================
      # STEP 03
      # ============================================================
      - name: Verify exact main source
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          git fetch origin main --depth=1

          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="$(git rev-parse origin/main)"

          echo "HEAD=$ACTUAL"
          echo "origin/main=$EXPECTED"

          test "$ACTUAL" = "$EXPECTED"

          test -d navigation-v1-source
          test -f navigation-v1-source/settings.gradle
          test -f navigation-v1-source/build.gradle
          test -f navigation-v1-source/app/build.gradle

          echo "PASS: exact main source verified."

      # ============================================================
      # STEP 04
      # ============================================================
      - name: Verify required source structure
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -d app/src/main/java
          test -d app/src/main/res
          test -d app/libs

          echo "PASS: required Navigation V1 source structure exists."

      # ============================================================
      # STEP 05
      # ============================================================
      - name: Verify Android Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Root build.gradle ==="
          cat build.gradle

          echo
          echo "=== App build.gradle ==="
          cat app/build.gradle

          grep -Fq "com.android.application" build.gradle
          grep -Fq "compileSdk 36" app/build.gradle
          grep -Fq "minSdk 29" app/build.gradle
          grep -Fq "targetSdk 36" app/build.gradle
          grep -Fq "JavaVersion.VERSION_17" app/build.gradle

          echo "PASS: Android Gradle configuration verified."

      # ============================================================
      # STEP 06
      # ============================================================
      - name: Protected checksums
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Protected source inventory ==="

          find app/src/main/java \
            -type f \
            -print \
            | sort

          echo
          echo "PASS: protected source inventory collected."

      # ============================================================
      # STEP 07
      # ============================================================
      - name: Floating Touch checksum
        shell: bash
        run: |
          set -euo pipefail

          if [ -f app/src/main/java/com/carassistant/v10/V10CarActivity.java ]; then
            sha256sum \
              app/src/main/java/com/carassistant/v10/V10CarActivity.java
          fi

          echo "PASS: Floating Touch checksum step completed."

      # ============================================================
      # STEP 08
      # ============================================================
      - name: NavigationMap inspection
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            app/src/main/java/com/carassistant/v10/NavigationMapView.java

          echo "=== NavigationMapView.java ==="

          sed -n '1,260p' \
            app/src/main/java/com/carassistant/v10/NavigationMapView.java

          echo "PASS: NavigationMapView inspected."

      # ============================================================
      # STEP 09
      # ============================================================
      - name: Dashboard cleanup
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Dashboard/source cleanup check ==="

          find app/src/main \
            -type f \
            | sort

          echo
          echo "PASS: dashboard cleanup check completed."

      # ============================================================
      # STEP 10
      # ============================================================
      - name: Cleanup verification
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Verify stale source paths ==="

          if find . \
            -path './.gradle' -prune -o \
            -path './build' -prune -o \
            -type f \
            -print \
            | grep -E 'v10-source|AACast-Doudou/app' ; then

            echo "ERROR: stale source path detected."
            exit 1
          fi

          echo "PASS: no stale source paths detected."

      # ============================================================
      # STEP 11
      # ============================================================
      - name: Navigation core
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            app/src/main/java/com/carassistant/v10/V10CarActivity.java

          test -f \
            app/src/main/java/com/carassistant/v10/V10ProjectionSession.java

          echo "PASS: Navigation core files exist."

      # ============================================================
      # STEP 12
      # ============================================================
      - name: Protected core unchanged
        shell: bash
        run: |
          set -euo pipefail

          git status --short

          echo "PASS: protected core check completed."

      # ============================================================
      # STEP 13
      # ============================================================
      - name: Floating Touch unchanged
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            app/src/main/java/com/carassistant/v10/V10CarActivity.java

          echo "PASS: Floating Touch source exists."

      # ============================================================
      # STEP 14
      # ============================================================
      - name: Source inventory before patch
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          find navigation-v1-source \
            -type f \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            | sort > /tmp/navigation_inventory_before.txt

          echo "=== Inventory before patch ==="
          cat /tmp/navigation_inventory_before.txt

          echo
          echo "File count:"
          wc -l /tmp/navigation_inventory_before.txt

      # ============================================================
      # STEP 15
      # ============================================================
      - name: Source diff
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          git diff -- \
            navigation-v1-source

          echo "PASS: source diff check completed."

      # ============================================================
      # STEP 16
      # ============================================================
      - name: Git diff check
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          git status --short

          echo "PASS: git diff check completed."

      # ============================================================
      # STEP 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # STEP 18
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # ============================================================
      # STEP 19
      # ============================================================
      - name: Accept SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Android SDK licenses processed."

      # ============================================================
      # STEP 20
      # ============================================================
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing platform-tools..."
          sdkmanager "platform-tools"

          echo "Installing Android 36 platform..."
          sdkmanager "platforms;android-36"

          echo "Installing Build Tools 36.0.0..."
          sdkmanager "build-tools;36.0.0"

          echo "Required Android SDK packages installed."

      # ============================================================
      # STEP 21
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "=== sdkmanager location ==="
          command -v sdkmanager

          echo
          echo "=== Android SDK root ==="
          echo "$ANDROID_SDK_ROOT"

          echo
          echo "=== Installed SDK packages ==="

          sdkmanager --list_installed | grep -E \
            'platform-tools|platforms;android-36|build-tools;36.0.0' \
            || true

          echo
          echo "=== Verify Android 36 platform ==="

          test -d "$ANDROID_SDK_ROOT/platforms/android-36"

          echo
          echo "=== Verify Build Tools 36.0.0 ==="

          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"

          echo
          echo "=== Verify Platform Tools ==="

          test -d "$ANDROID_SDK_ROOT/platform-tools"

          echo "Android SDK verification passed."

      # ============================================================
      # STEP 22
      # ============================================================
      - name: Make Gradle executable
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew

          chmod +x ./gradlew

          echo "Gradle wrapper is executable."

      # ============================================================
      # STEP 23
      # ============================================================
      - name: Verify Gradle source before compile
        shell: bash
        run: |
          set -euo pipefail

          echo "=== settings.gradle ==="
          cat settings.gradle

          echo
          echo "=== root build.gradle ==="
          cat build.gradle

          echo
          echo "=== app/build.gradle ==="
          cat app/build.gradle

          echo
          echo "=== legacy DEX ==="

          test -f app/libs/aasdk-legacy.dex

          ls -lh app/libs/aasdk-legacy.dex

          sha256sum app/libs/aasdk-legacy.dex

          echo
          echo "PASS: Gradle source verified before compile."

      # ============================================================
      # STEP 24
      # ============================================================
      - name: Patch legacy DEX task hooks safely
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text(encoding="utf-8")

          old_debug = (
              "tasks.matching {\n"
              "    it.name == 'mergeProjectDexDebug'\n"
              "}.configureEach { task ->"
          )

          new_debug = (
              "project.tasks.configureEach { task ->\n"
              "\n"
              "    if (task.name != 'mergeProjectDexDebug') {\n"
              "        return\n"
              "    }"
          )

          old_release = (
              "tasks.matching {\n"
              "    it.name == 'mergeDexRelease'\n"
              "}.configureEach { task ->"
          )

          new_release = (
              "project.tasks.configureEach { task ->\n"
              "\n"
              "    if (task.name != 'mergeDexRelease') {\n"
              "        return\n"
              "    }"
          )

          debug_count = text.count(old_debug)
          release_count = text.count(old_release)

          print(f"Debug old hook count   = {debug_count}")
          print(f"Release old hook count = {release_count}")

          if debug_count != 1:
              raise SystemExit(
                  "ERROR: Expected exactly 1 Debug legacy DEX hook."
              )

          if release_count != 1:
              raise SystemExit(
                  "ERROR: Expected exactly 1 Release legacy DEX hook."
              )

          text = text.replace(old_debug, new_debug, 1)

          release_start = text.find(old_release)

          if release_start < 0:
              raise SystemExit(
                  "ERROR: Release legacy DEX hook disappeared unexpectedly."
              )

          distribution_marker = (
              "// ============================================================\n"
              "// Distribution APK"
          )

          distribution_start = text.find(
              distribution_marker,
              release_start
          )

          if distribution_start < 0:
              raise SystemExit(
                  "ERROR: Distribution APK marker not found."
              )

          safe_release = """project.tasks.configureEach { task ->

              if (task.name != 'mergeDexRelease') {
                  return
              }

              task.doLast {

                  def legacyDex =
                          rootProject.file('app/libs/aasdk-legacy.dex')

                  if (!legacyDex.exists()) {
                      throw new GradleException(
                              "Thiếu app/libs/aasdk-legacy.dex!"
                      )
                  }

                  def outputDir =
                          task.outputDir.get().asFile

                  def dexFilter = {
                      it.isFile() &&
                      it.name ==~ /classes\\d*\\.dex/
                  } as FileFilter

                  def appDexes =
                          outputDir
                                  .listFiles(dexFilter)
                                  ?.toList() ?: []

                  if (appDexes.isEmpty()) {
                      throw new GradleException(
                              "Không tìm thấy classes*.dex sau mergeDexRelease trong " +
                              outputDir
                      )
                  }

                  def nextIndex = 2

                  while (
                          new File(
                                  outputDir,
                                  "classes" + nextIndex + ".dex"
                          ).exists()
                  ) {
                      nextIndex++
                  }

                  def target =
                          new File(
                                  outputDir,
                                  "classes" + nextIndex + ".dex"
                          )

                  target.bytes = legacyDex.bytes

                  logger.lifecycle(
                          "============================================================"
                  )

                  logger.lifecycle(
                          "AACast-Doudou LEGACY DEX APPEND"
                  )

                  logger.lifecycle(
                          "============================================================"
                  )

                  logger.lifecycle(
                          "AGP app DEX count : " + appDexes.size()
                  )

                  logger.lifecycle(
                          "Legacy DEX        : " + legacyDex.absolutePath
                  )

                  logger.lifecycle(
                          "Appended DEX      : " + target.absolutePath
                  )

                  logger.lifecycle(
                          "PASS: nguyên bản legacy DEX được đóng gói thành DEX riêng."
                  )

                  logger.lifecycle(
                          "PASS: không chạy D8 merge legacy DEX."
                  )

                  logger.lifecycle(
                          "PASS: không lọc hoặc xóa class Android Auto legacy."
                  )
              }
          }

          """

          text = (
              text[:release_start]
              + safe_release
              + text[distribution_start:]
          )

          path.write_text(text, encoding="utf-8")

          print("PASS: Debug hook patched safely.")
          print("PASS: Release hook converted to raw DEX append.")
          print("PASS: legacy DEX will NOT be supplied to D8.")
          print("PASS: aasdk-legacy.dex remains byte-for-byte unchanged.")
          PY

          echo
          echo "=== Release hook after patch ==="

          grep -n -A95 -B5 \
            "AACast-Doudou LEGACY DEX APPEND" \
            app/build.gradle

          echo
          echo "PASS: Step 24 completed."

      # ============================================================
      # STEP 25
      # ============================================================
      - name: Verify safe legacy DEX hooks
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          text = Path("app/build.gradle").read_text(
              encoding="utf-8"
          )

          debug_hook = (
              "project.tasks.configureEach { task ->\n"
              "\n"
              "    if (task.name != 'mergeProjectDexDebug') {\n"
              "        return\n"
              "    }"
          )

          release_hook = (
              "project.tasks.configureEach { task ->\n"
              "\n"
              "    if (task.name != 'mergeDexRelease') {\n"
              "        return\n"
              "    }"
          )

          old_debug = (
              "tasks.matching {\n"
              "    it.name == 'mergeProjectDexDebug'\n"
              "}.configureEach { task ->"
          )

          old_release = (
              "tasks.matching {\n"
              "    it.name == 'mergeDexRelease'\n"
              "}.configureEach { task ->"
          )

          if text.count(debug_hook) != 1:
              raise SystemExit(
                  "ERROR: Debug configureEach hook is not exactly 1."
              )

          if text.count(release_hook) != 1:
              raise SystemExit(
                  "ERROR: Release configureEach hook is not exactly 1."
              )

          if old_debug in text:
              raise SystemExit(
                  "ERROR: old Debug tasks.matching hook remains."
              )

          if old_release in text:
              raise SystemExit(
                  "ERROR: old Release tasks.matching hook remains."
              )

          if "project.exec {" in text:
              raise SystemExit(
                  "ERROR: legacy DEX must not be passed to project.exec/D8."
              )

          if "def d8Tool" in text:
              raise SystemExit(
                  "ERROR: old custom D8 legacy merge remains."
              )

          if "legacyDex.absolutePath" not in text:
              raise SystemExit(
                  "ERROR: legacy DEX reference missing."
              )

          if "target.bytes = legacyDex.bytes" not in text:
              raise SystemExit(
                  "ERROR: raw legacy DEX append is missing."
              )

          print("PASS: Debug hook is safe.")
          print("PASS: Release hook is safe.")
          print("PASS: old tasks.matching hooks are absent.")
          print("PASS: custom D8 legacy merge is absent.")
          print("PASS: raw legacy DEX append is present.")
          print("PASS: legacy DEX is not filtered.")
          PY

      # ============================================================
      # STEP 26
      # ============================================================
      - name: Verify patched Gradle syntax
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew :app:tasks \
            --no-daemon \
            --stacktrace

          echo
          echo "PASS: Gradle task graph parsed successfully."

      # ============================================================
      # STEP 27
      # ============================================================
      - name: Verify release merge task exists
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:tasks \
            --all \
            --no-daemon \
            | grep -F "mergeDexRelease"

          echo
          echo "PASS: mergeDexRelease task exists."

      # ============================================================
      # STEP 28
      # ============================================================
      - name: Resolve and record release dependencies
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:dependencies \
            --configuration releaseRuntimeClasspath \
            --no-daemon \
            > /tmp/releaseRuntimeClasspath.txt

          echo "=== releaseRuntimeClasspath ==="
          cat /tmp/releaseRuntimeClasspath.txt

          echo
          echo "=== AndroidX dependencies ==="

          grep -Ei \
            'androidx|com\.android\.support' \
            /tmp/releaseRuntimeClasspath.txt \
            || true

          echo
          echo "PASS: releaseRuntimeClasspath resolved."

      # ============================================================
      # STEP 29
      # ============================================================
      - name: Merge release DEX without legacy D8 merge
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:mergeDexRelease \
            --no-daemon \
            --stacktrace

          echo
          echo "=== Release DEX files ==="

          find app/build/intermediates/dex/release \
            -type f \
            -name '*.dex' \
            -print \
            | sort

          echo
          echo "PASS: mergeDexRelease completed."

      # ============================================================
      # STEP 30
      # ============================================================
      - name: Analyze exact legacy DEX class overlap
        shell: bash
        run: |
          set -euo pipefail

          DEXDUMP="$ANDROID_SDK_ROOT/build-tools/36.0.0/dexdump"

          test -x "$DEXDUMP"

          LEGACY="app/libs/aasdk-legacy.dex"

          test -f "$LEGACY"

          find app/build/intermediates/dex/release \
            -type f \
            -name '*.dex' \
            -not -path '*/legacy*/*' \
            | sort > /tmp/app_dex_files.txt

          if [ ! -s /tmp/app_dex_files.txt ]; then
            echo "ERROR: no normal app DEX files found."
            exit 1
          fi

          "$DEXDUMP" "$LEGACY" \
            | sed -n \
              "s/.*Class descriptor.*'\(L[^']*;\)'.*/\1/p" \
            | sort -u \
            > /tmp/legacy_classes.txt

          : > /tmp/app_classes.txt

          while IFS= read -r dex; do
            "$DEXDUMP" "$dex" \
              | sed -n \
                "s/.*Class descriptor.*'\(L[^']*;\)'.*/\1/p" \
              >> /tmp/app_classes.txt
          done < /tmp/app_dex_files.txt

          sort -u \
            /tmp/app_classes.txt \
            -o /tmp/app_classes.txt

          comm -12 \
            /tmp/legacy_classes.txt \
            /tmp/app_classes.txt \
            > /tmp/legacy_overlap_classes.txt

          echo "=== LEGACY CLASS COUNT ==="
          wc -l /tmp/legacy_classes.txt

          echo
          echo "=== APP/DEPENDENCY CLASS COUNT ==="
          wc -l /tmp/app_classes.txt

          echo
          echo "=== EXACT OVERLAP COUNT ==="
          wc -l /tmp/legacy_overlap_classes.txt

          echo
          echo "=== EXACT OVERLAP CLASSES ==="

          cat /tmp/legacy_overlap_classes.txt

          echo
          echo "=== ANDROIDX OVERLAP ==="

          grep '^Landroidx/' \
            /tmp/legacy_overlap_classes.txt \
            || true

          echo
          echo "=== ANDROID SUPPORT OVERLAP ==="

          grep '^Landroid/support/' \
            /tmp/legacy_overlap_classes.txt \
            || true

          echo
          echo "=== GOOGLE AUTO / GMS LEGACY CLASSES ==="

          grep -E \
            '^Lcom/google/android/(gms/car|apps/auto)' \
            /tmp/legacy_classes.txt \
            | head -200 \
            || true

          echo
          echo "=== Confirm known duplicate ==="

          if grep -Fxq \
            'Landroidx/core/app/RemoteActionCompatParcelizer;' \
            /tmp/legacy_overlap_classes.txt; then

            echo "CONFIRMED:"
            echo "androidx.core.app.RemoteActionCompatParcelizer"
            echo "is present in both legacy DEX and normal app/dependency DEX."
          else
            echo "WARNING:"
            echo "known RemoteActionCompatParcelizer overlap was not found."
          fi

          echo
          echo "=== Legacy DEX SHA256 ==="
          sha256sum "$LEGACY"

          echo
          echo "PASS: exact DEX class overlap analysis completed."

      # ============================================================
      # STEP 31
      # ============================================================
      - name: Map overlapping classes to resolved dependency JARs
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          overlap = Path(
              "/tmp/legacy_overlap_classes.txt"
          ).read_text(
              encoding="utf-8"
          ).splitlines()

          overlap = {
              x.strip()
              for x in overlap
              if x.strip()
          }

          wanted = {
              x[1:-1] + ".class"
              for x in overlap
          }

          cache = Path.home() / ".gradle" / "caches"

          jars = list(
              cache.rglob("*.jar")
          )

          print(
              f"Gradle cache JAR count = {len(jars)}"
          )

          found = {}

          for jar in jars:
              try:
                  with ZipFile(jar) as z:
                      names = set(z.namelist())

                      hits = wanted.intersection(names)

                      for hit in hits:
                          found.setdefault(
                              hit,
                              []
                          ).append(
                              str(jar)
                          )
              except Exception:
                  continue

          print()
          print("=== OVERLAPPING CLASSES -> RESOLVED JAR ===")

          for cls in sorted(overlap):
              key = cls[1:-1] + ".class"

              print()
              print(cls)

              matches = found.get(key, [])

              if not matches:
                  print(
                      "  No Gradle-cache JAR found "
                      "(may be app-generated or transformed)."
                  )
              else:
                  for jar in matches[:20]:
                      print(
                          "  -> " + jar
                      )

          print()
          print("PASS: dependency JAR attribution completed.")
          PY

      # ============================================================
      # STEP 32
      # ============================================================
      - name: Assemble Release APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace

          echo
          echo "PASS: assembleRelease completed."

      # ============================================================
      # STEP 33 - DEX DIAGNOSTIC
      #
      # CHỈ CHẨN ĐOÁN.
      # KHÔNG SỬA CÁCH ĐÓNG GÓI.
      # KHÔNG SỬA NAVIGATION/PATCH 1.
      # ============================================================
      - name: Diagnose APK DEX before Step 34
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          LEGACY="app/libs/aasdk-legacy.dex"

          test -f "$APK"
          test -s "$APK"
          test -f "$LEGACY"
          test -s "$LEGACY"

          echo "=== APK ==="
          ls -lh "$APK"

          echo
          echo "=== LEGACY DEX ==="
          ls -lh "$LEGACY"

          LEGACY_SHA="$(sha256sum "$LEGACY" | awk '{print $1}')"

          echo
          echo "=== SOURCE LEGACY DEX SHA256 ==="
          echo "$LEGACY_SHA"

          rm -rf /tmp/apk_dex_diagnosis
          mkdir -p /tmp/apk_dex_diagnosis

          unzip -q "$APK" \
            'classes*.dex' \
            -d /tmp/apk_dex_diagnosis

          mapfile -t APK_DEX_FILES < <(
            find /tmp/apk_dex_diagnosis \
              -type f \
              -name 'classes*.dex' \
              -print \
              | sort
          )

          if [ "${#APK_DEX_FILES[@]}" -eq 0 ]; then
            echo "ERROR: no classes*.dex found inside APK."
            exit 1
          fi

          echo
          echo "=== APK DEX FILES ==="

          MATCH_COUNT=0

          for DEX_FILE in "${APK_DEX_FILES[@]}"; do
            DEX_NAME="$(basename "$DEX_FILE")"
            DEX_SHA="$(sha256sum "$DEX_FILE" | awk '{print $1}')"
            DEX_SIZE="$(stat -c '%s' "$DEX_FILE")"

            echo "$DEX_NAME"
            echo "  size = $DEX_SIZE bytes"
            echo "  sha256 = $DEX_SHA"

            if [ "$DEX_SHA" = "$LEGACY_SHA" ]; then
              echo "  >>> EXACT SHA256 MATCH <<<"
              MATCH_COUNT=$((MATCH_COUNT + 1))
            fi

            echo
          done

          echo "=== SUMMARY ==="
          echo "Source legacy SHA256 = $LEGACY_SHA"
          echo "APK DEX count        = ${#APK_DEX_FILES[@]}"
          echo "Exact SHA256 matches = $MATCH_COUNT"

          mkdir -p /tmp/navigation-v1-dex-diagnosis

          cp "$APK" \
            /tmp/navigation-v1-dex-diagnosis/app-release.apk

          cp "$LEGACY" \
            /tmp/navigation-v1-dex-diagnosis/aasdk-legacy.dex

          sha256sum "$APK" \
            > /tmp/navigation-v1-dex-diagnosis/apk.sha256

          sha256sum "$LEGACY" \
            > /tmp/navigation-v1-dex-diagnosis/legacy-dex.sha256

          for DEX_FILE in "${APK_DEX_FILES[@]}"; do
            cp "$DEX_FILE" \
              "/tmp/navigation-v1-dex-diagnosis/$(basename "$DEX_FILE")"
          done

          {
            echo "Source legacy SHA256 = $LEGACY_SHA"
            echo "APK DEX count = ${#APK_DEX_FILES[@]}"
            echo "Exact SHA256 matches = $MATCH_COUNT"
            echo
            echo "=== APK DEX SHA256 ==="

            for DEX_FILE in "${APK_DEX_FILES[@]}"; do
              sha256sum "$DEX_FILE"
            done
          } > /tmp/navigation-v1-dex-diagnosis/dex-report.txt

          echo
          echo "PASS: DEX diagnosis completed."

      # ============================================================
      # STEP 33B - UPLOAD DIAGNOSTIC ARTIFACT
      # ============================================================
      - name: Upload APK DEX diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: navigation-v1-apk-dex-diagnosis
          path: /tmp/navigation-v1-dex-diagnosis
          if-no-files-found: error

      # ============================================================
      # STEP 34
      #
      # GIỮ NGUYÊN.
      # VÒNG NÀY CHƯA SỬA CHECK SHA.
      # ============================================================
      - name: Verify APK and packaged DEX
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          LEGACY="app/libs/aasdk-legacy.dex"

          test -f "$APK"
          test -s "$APK"
          test -f "$LEGACY"
          test -s "$LEGACY"

          echo "=== APK ==="
          ls -lh "$APK"

          echo
          echo "=== APK SHA256 ==="
          sha256sum "$APK"

          echo
          echo "=== APK DEX entries ==="

          unzip -l "$APK" \
            | grep -E 'classes[0-9]*\.dex'

          echo
          echo "=== Source legacy DEX SHA256 ==="

          LEGACY_SHA="$(
            sha256sum "$LEGACY" \
            | awk '{print $1}'
          )"

          echo "Source legacy SHA = $LEGACY_SHA"

          echo
          echo "=== Extract all APK DEX files ==="

          rm -rf /tmp/apk_dex_verify
          mkdir -p /tmp/apk_dex_verify

          unzip -q "$APK" \
            'classes*.dex' \
            -d /tmp/apk_dex_verify

          mapfile -t APK_DEX_FILES < <(
            find /tmp/apk_dex_verify \
              -type f \
              -name 'classes*.dex' \
              -print \
              | sort
          )

          if [ "${#APK_DEX_FILES[@]}" -eq 0 ]; then
            echo "ERROR: no classes*.dex found inside APK."
            exit 1
          fi

          echo
          echo "DEX files found in APK:"
          printf '%s\n' "${APK_DEX_FILES[@]}"

          echo
          echo "=== SHA256 of every APK DEX ==="

          MATCH_COUNT=0
          MATCH_FILE=""

          for DEX_FILE in "${APK_DEX_FILES[@]}"; do

            DEX_SHA="$(
              sha256sum "$DEX_FILE" \
              | awk '{print $1}'
            )"

            DEX_NAME="$(
              basename "$DEX_FILE"
            )"

            echo "$DEX_NAME = $DEX_SHA"

            if [ "$DEX_SHA" = "$LEGACY_SHA" ]; then
              MATCH_COUNT=$((MATCH_COUNT + 1))
              MATCH_FILE="$DEX_FILE"
            fi

          done

          echo
          echo "=== Legacy DEX SHA match result ==="
          echo "Expected SHA : $LEGACY_SHA"
          echo "Match count  : $MATCH_COUNT"

          if [ "$MATCH_COUNT" -ne 1 ]; then
            echo
            echo "ERROR: expected exactly 1 APK DEX"
            echo "with SHA256 identical to aasdk-legacy.dex."
            echo
            echo "This means the original legacy DEX was either"
            echo "not packaged, was packaged more than once,"
            echo "or was modified during packaging."
            exit 1
          fi

          echo
          echo "Matched APK DEX:"
          echo "$MATCH_FILE"

          PACKAGED_SHA="$(
            sha256sum "$MATCH_FILE" \
            | awk '{print $1}'
          )"

          echo
          echo "Source legacy SHA    = $LEGACY_SHA"
          echo "Packaged legacy SHA  = $PACKAGED_SHA"

          test "$LEGACY_SHA" = "$PACKAGED_SHA"

          echo
          echo "=== Byte-for-byte verification ==="

          cmp -s "$LEGACY" "$MATCH_FILE"

          echo
          echo "PASS: exactly one packaged DEX matches aasdk-legacy.dex."
          echo "PASS: legacy DEX is byte-for-byte unchanged."
          echo "PASS: Release APK verified."

      # ============================================================
      # STEP 35
      # ============================================================
      - name: Save diagnostic reports
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/navigation-diagnostics

          cp /tmp/releaseRuntimeClasspath.txt \
            /tmp/navigation-diagnostics/

          cp /tmp/legacy_classes.txt \
            /tmp/navigation-diagnostics/

          cp /tmp/app_classes.txt \
            /tmp/navigation-diagnostics/

          cp /tmp/legacy_overlap_classes.txt \
            /tmp/navigation-diagnostics/

          cp app/build.gradle \
            /tmp/navigation-diagnostics/build.gradle.after-patch

          echo "=== Diagnostic files ==="

          find /tmp/navigation-diagnostics \
            -type f \
            -maxdepth 1 \
            -print \
            | sort

          echo "PASS: diagnostic reports prepared."

      # ============================================================
      # STEP 36
      # ============================================================
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: navigation-v1-patch1-release
          path: navigation-v1-source/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # ============================================================
      # STEP 37
      # ============================================================
      - name: Upload DEX diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: navigation-v1-legacy-dex-diagnostics
          path: |
            /tmp/navigation-diagnostics/releaseRuntimeClasspath.txt
            /tmp/navigation-diagnostics/legacy_classes.txt
            /tmp/navigation-diagnostics/app_classes.txt
            /tmp/navigation-diagnostics/legacy_overlap_classes.txt
            /tmp/navigation-diagnostics/build.gradle.after-patch
          if-no-files-found: error
