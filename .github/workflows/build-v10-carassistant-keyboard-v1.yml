name: Keyboard V1 Independent Overlay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify protected V10 and Navigation baseline
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/carassistant/v10"

          test -f "$BASE/V10CarActivity.java"
          test -f "$BASE/V10ProjectionSession.java"
          test -f "$BASE/V10DisplayController.java"
          test -f "$BASE/V10SurfaceManager.java"
          test -f "$BASE/V10TaskSession.java"
          test -f "$BASE/NavigationMapView.java"
          test -f "v10-source/app/build.gradle"
          test -f "v10-source/app/src/main/AndroidManifest.xml"

          grep -Fq "namespace 'com.carassistant.v10'" \
            v10-source/app/build.gradle

          grep -Fq 'applicationId "com.carassistant.v10"' \
            v10-source/app/build.gradle

          grep -Fq "org.maplibre.gl:android-sdk:11.11.0" \
            v10-source/app/build.gradle

          grep -Fq "class NavigationMapView" \
            "$BASE/NavigationMapView.java"

          grep -Fq "new NavigationMapView(this)" \
            "$BASE/V10CarActivity.java"

          grep -Fq "new V10ProjectionSession" \
            "$BASE/V10CarActivity.java"

          echo "PASS: protected V10 projection/navigation baseline."

      - name: Add CarAssistant Keyboard V1 source
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/carassistant/v10"

          cat > "$BASE/CarAssistantKeyboard.java" <<'EOF'
          package com.carassistant.v10;

          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.util.Locale;

          public final class CarAssistantKeyboard {

              public interface Action {
                  void keyText(String value);
                  void keyEvent(int keyCode);
              }

              private final FrameLayout host;
              private final Action action;

              private LinearLayout keyboard;
              private boolean visible;

              public CarAssistantKeyboard(
                      FrameLayout host,
                      Action action) {

                  this.host = host;
                  this.action = action;
              }

              public boolean isVisible() {
                  return visible && keyboard != null;
              }

              public void show() {

                  if (keyboard == null) {

                      keyboard = buildKeyboard();

                      FrameLayout.LayoutParams params =
                              new FrameLayout.LayoutParams(
                                      -1,
                                      dp(270),
                                      Gravity.BOTTOM);

                      params.setMargins(
                              dp(8),
                              0,
                              dp(8),
                              dp(8));

                      host.addView(
                              keyboard,
                              params);
                  }

                  keyboard.setVisibility(View.VISIBLE);
                  keyboard.bringToFront();

                  visible = true;
              }

              public void hide() {

                  if (keyboard != null) {
                      keyboard.setVisibility(View.GONE);
                  }

                  visible = false;
              }

              private LinearLayout buildKeyboard() {

                  LinearLayout panel =
                          new LinearLayout(
                                  host.getContext());

                  panel.setOrientation(
                          LinearLayout.VERTICAL);

                  panel.setPadding(
                          dp(8),
                          dp(8),
                          dp(8),
                          dp(8));

                  GradientDrawable bg =
                          new GradientDrawable();

                  bg.setColor(
                          Color.rgb(
                                  15,
                                  20,
                                  26));

                  bg.setCornerRadius(
                          dp(18));

                  bg.setStroke(
                          dp(1),
                          Color.rgb(
                                  65,
                                  85,
                                  105));

                  panel.setBackground(bg);
                  panel.setElevation(dp(18));

                  addRow(
                          panel,
                          "QWERTYUIOP");

                  addRow(
                          panel,
                          "ASDFGHJKL");

                  addRow(
                          panel,
                          "ZXCVBNM");

                  LinearLayout bottom =
                          new LinearLayout(
                                  host.getContext());

                  bottom.setGravity(
                          Gravity.CENTER);

                  bottom.setPadding(
                          dp(2),
                          dp(2),
                          dp(2),
                          dp(2));

                  addKey(
                          bottom,
                          "⌫",
                          1.35f,
                          () -> action.keyEvent(
                                  KeyEvent.KEYCODE_DEL));

                  addKey(
                          bottom,
                          "SPACE",
                          3.8f,
                          () -> action.keyEvent(
                                  KeyEvent.KEYCODE_SPACE));

                  addKey(
                          bottom,
                          "ENTER",
                          1.55f,
                          () -> action.keyEvent(
                                  KeyEvent.KEYCODE_ENTER));

                  panel.addView(
                          bottom,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1f));

                  return panel;
              }

              private void addRow(
                      LinearLayout panel,
                      String letters) {

                  LinearLayout row =
                          new LinearLayout(
                                  host.getContext());

                  row.setGravity(
                          Gravity.CENTER);

                  row.setPadding(
                          dp(2),
                          dp(2),
                          dp(2),
                          dp(2));

                  for (int i = 0;
                       i < letters.length();
                       i++) {

                      final String value =
                              String.valueOf(
                                      letters.charAt(i))
                                      .toLowerCase(
                                              Locale.ROOT);

                      addKey(
                              row,
                              value.toUpperCase(
                                      Locale.ROOT),
                              1f,
                              () -> action.keyText(value));
                  }

                  panel.addView(
                          row,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1f));
              }

              private void addKey(
                      LinearLayout row,
                      String label,
                      float weight,
                      Runnable click) {

                  TextView key =
                          new TextView(
                                  host.getContext());

                  key.setText(label);
                  key.setTextColor(Color.WHITE);

                  key.setTextSize(
                          label.length() > 1
                                  ? 13
                                  : 18);

                  key.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD);

                  key.setGravity(
                          Gravity.CENTER);

                  GradientDrawable normal =
                          new GradientDrawable();

                  normal.setColor(
                          Color.rgb(
                                  32,
                                  41,
                                  50));

                  normal.setCornerRadius(
                          dp(11));

                  key.setBackground(normal);

                  key.setOnClickListener(
                          v -> click.run());

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  0,
                                  -1,
                                  weight);

                  params.setMargins(
                          dp(3),
                          dp(3),
                          dp(3),
                          dp(3));

                  row.addView(
                          key,
                          params);
              }

              private int dp(int value) {

                  float density =
                          host.getResources()
                                  .getDisplayMetrics()
                                  .density;

                  return Math.round(
                          value * density);
              }
          }
          EOF

          cat > "$BASE/CarAssistantKeyboardController.java" <<'EOF'
          package com.carassistant.v10;

          import android.os.Handler;
          import android.os.Looper;
          import android.util.Log;
          import android.view.View;
          import android.widget.FrameLayout;

          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public final class CarAssistantKeyboardController {

              private static final String TAG =
                      "CarAssistantKeyboard";

              private static final long POLL_MS =
                      800L;

              private static final Pattern SHOWN =
                      Pattern.compile(
                              "mInputShown\\s*=\\s*(true|false)");

              private final FrameLayout projectionLayer;
              private final V10ProjectionSession session;
              private final RootShellSession rootShell =
                      new RootShellSession();

              private final Handler main =
                      new Handler(
                              Looper.getMainLooper());

              private final CarAssistantKeyboard keyboard;

              private boolean started;
              private boolean lastShown;

              private final Runnable poller =
                      new Runnable() {

                  @Override
                  public void run() {

                      if (!started) {
                          return;
                      }

                      if (!session.isActive()) {

                          hideOnMain();

                          main.postDelayed(
                                  this,
                                  POLL_MS);

                          return;
                      }

                      RootShellSession.EXEC.execute(
                              () -> {

                          boolean shown = false;

                          try {

                              String out =
                                      rootShell.run(
                                              3,
                                              "dumpsys input_method "
                                              + "| grep -m 1 "
                                              + "mInputShown || true");

                              Matcher matcher =
                                      SHOWN.matcher(out);

                              if (matcher.find()) {

                                  shown =
                                          "true".equalsIgnoreCase(
                                                  matcher.group(1));
                              }

                          } catch (Throwable t) {

                              Log.w(
                                      TAG,
                                      "IME state read failed",
                                      t);
                          }

                          final boolean state =
                                  shown;

                          if (state != lastShown) {

                              lastShown = state;

                              main.post(
                                      () -> applyState(
                                              state));
                          }

                          if (started) {

                              main.postDelayed(
                                      this,
                                      POLL_MS);
                          }
                      });
                  }
              };

              public CarAssistantKeyboardController(
                      FrameLayout projectionLayer,
                      V10ProjectionSession session) {

                  this.projectionLayer =
                          projectionLayer;

                  this.session =
                          session;

                  keyboard =
                          new CarAssistantKeyboard(
                                  projectionLayer,
                                  new CarAssistantKeyboard.Action() {

                              @Override
                              public void keyText(
                                      String value) {

                                  sendText(value);
                              }

                              @Override
                              public void keyEvent(
                                      int keyCode) {

                                  sendKeyEvent(keyCode);
                              }
                          });
              }

              public void start() {

                  if (started) {
                      return;
                  }

                  started = true;
                  lastShown = false;

                  keyboard.hide();

                  main.removeCallbacks(
                          poller);

                  main.post(poller);
              }

              public void stop() {

                  started = false;

                  main.removeCallbacks(
                          poller);

                  rootShell.destroy();

                  keyboard.hide();
              }

              public void hide() {

                  lastShown = false;
                  keyboard.hide();
              }

              private void applyState(
                      boolean shown) {

                  if (!started
                          || !session.isActive()) {

                      keyboard.hide();
                      return;
                  }

                  if (shown) {

                      keyboard.show();

                      View floating =
                              projectionLayer
                                      .findViewWithTag(
                                              "V10_FLOATING_KEY");

                      if (floating != null) {
                          floating.bringToFront();
                      }

                  } else {

                      keyboard.hide();
                  }
              }

              private void hideOnMain() {

                  if (keyboard.isVisible()) {
                      keyboard.hide();
                  }
              }

              private void sendText(
                      String value) {

                  if (!session.isActive()) {
                      return;
                  }

                  int displayId =
                          session.getDisplayId();

                  if (displayId <= 0) {
                      return;
                  }

                  String safe =
                          value
                                  .replace(
                                          "\\",
                                          "\\\\")
                                  .replace(
                                          "'",
                                          "'\\''");

                  String command =
                          "/system/bin/input -d "
                          + displayId
                          + " text '"
                          + safe
                          + "'";

                  execute(command);
              }

              private void sendKeyEvent(
                      int keyCode) {

                  if (!session.isActive()) {
                      return;
                  }

                  int displayId =
                          session.getDisplayId();

                  if (displayId <= 0) {
                      return;
                  }

                  execute(
                          "/system/bin/input -d "
                          + displayId
                          + " keyevent "
                          + keyCode);
              }

              private void execute(
                      String command) {

                  RootShellSession.EXEC.execute(
                          () -> {

                      try {

                          rootShell.run(
                                  5,
                                  command);

                      } catch (Throwable t) {

                          Log.w(
                                  TAG,
                                  "Keyboard input failed: "
                                          + command,
                                  t);
                      }
                  });
              }
          }
          EOF

          echo "PASS: Keyboard V1 source created."

      - name: Patch V10CarActivity
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java"
          )

          source = path.read_text()

          def replace_once(old, new, name):
              global source

              count = source.count(old)

              if count != 1:
                  raise SystemExit(
                      f"{name}: expected 1 match, got {count}"
                  )

              source = source.replace(
                  old,
                  new,
                  1
              )

              print("PASS:", name)

          replace_once(
              "    private V10ProjectionSession session;\n",
              "    private V10ProjectionSession session;\n"
              "    private CarAssistantKeyboardController keyboardController;\n",
              "keyboard field"
          )

          replace_once(
              "        session.attachTextureView(\n"
              "                textureView);\n\n"
              "        createFloatingTouchKey();",
              "        session.attachTextureView(\n"
              "                textureView);\n\n"
              "        createFloatingTouchKey();\n\n"
              "        keyboardController =\n"
              "                new CarAssistantKeyboardController(\n"
              "                        projectionLayer,\n"
              "                        session);\n"
              "        keyboardController.start();",
              "keyboard initialization"
          )

          replace_once(
              "        floatingTouchKey.setBackground(bg);\n",
              "        floatingTouchKey.setBackground(bg);\n"
              "        floatingTouchKey.setTag(\"V10_FLOATING_KEY\");\n",
              "floating key tag"
          )

          replace_once(
              "    private void returnToLauncher() {\n\n"
              "        if (session != null",
              "    private void returnToLauncher() {\n\n"
              "        if (keyboardController != null) {\n"
              "            keyboardController.hide();\n"
              "        }\n\n"
              "        if (session != null",
              "hide keyboard on HOME"
          )

          replace_once(
              "        if (navigationMap != null) { navigationMap.onHostDestroy(); navigationMap = null; }\n\n"
              "        handler.removeCallbacks(\n"
              "                clockTicker);",
              "        if (navigationMap != null) { navigationMap.onHostDestroy(); navigationMap = null; }\n\n"
              "        if (keyboardController != null) {\n"
              "            keyboardController.stop();\n"
              "            keyboardController = null;\n"
              "        }\n\n"
              "        handler.removeCallbacks(\n"
              "                clockTicker);",
              "keyboard cleanup"
          )

          path.write_text(source)

          print("PASS: V10CarActivity patched.")
          PY

      - name: Verify Keyboard V1 and Navigation boundaries
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/carassistant/v10"

          test -f "$BASE/CarAssistantKeyboard.java"
          test -f "$BASE/CarAssistantKeyboardController.java"

          grep -Fq \
            "private CarAssistantKeyboardController keyboardController;" \
            "$BASE/V10CarActivity.java"

          grep -Fq \
            "new CarAssistantKeyboardController" \
            "$BASE/V10CarActivity.java"

          grep -Fq \
            'floatingTouchKey.setTag("V10_FLOATING_KEY")' \
            "$BASE/V10CarActivity.java"

          grep -Fq \
            "dumpsys input_method" \
            "$BASE/CarAssistantKeyboardController.java"

          grep -Fq \
            "mInputShown" \
            "$BASE/CarAssistantKeyboardController.java"

          grep -Fq \
            "/system/bin/input -d" \
            "$BASE/CarAssistantKeyboardController.java"

          if grep -Fq \
              "InputMethodService" \
              "$BASE/CarAssistantKeyboardController.java"; then
            echo "ERROR: Keyboard V1 must not implement an IME service."
            exit 1
          fi

          grep -Fq \
            "class NavigationMapView" \
            "$BASE/NavigationMapView.java"

          grep -Fq \
            "MapLibre.getInstance" \
            "$BASE/NavigationMapView.java"

          grep -Fq \
            "new MapView" \
            "$BASE/NavigationMapView.java"

          echo "PASS: Keyboard V1 boundary checks."
          echo "PASS: Navigation source remains untouched."

      - name: Compile debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd v10-source

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          mkdir -p dist

          cp "$APK" \
            "dist/CarAssistant-V10-Keyboard-V1.apk"

          sha256sum \
            "dist/CarAssistant-V10-Keyboard-V1.apk" \
            | tee \
            "dist/CarAssistant-V10-Keyboard-V1.sha256"

      - name: Upload Keyboard V1 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Keyboard-V1
          path: |
            dist/CarAssistant-V10-Keyboard-V1.apk
            dist/CarAssistant-V10-Keyboard-V1.sha256
          if-no-files-found: error
