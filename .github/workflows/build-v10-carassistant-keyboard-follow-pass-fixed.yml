name: Self Fix Navigation Follow Workflow

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  self-fix-navigation-follow:
    runs-on: ubuntu-latest

    steps:
      - name: Check PAT_TOKEN
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${PAT_TOKEN:-}" ]; then
            echo "FAIL: PAT_TOKEN is missing."
            exit 1
          fi

          echo "PASS: PAT_TOKEN is available."

      - name: Checkout main with PAT
        uses: actions/checkout@v4
        with:
          repository: nguyenvantien2111998123-jpg/CarAssistant
          ref: main
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Verify baseline source
        run: |
          set -euo pipefail

          SOURCE="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"

          test -f "$SOURCE"

          echo "PASS: NavigationMapView.java exists."

          grep -n -F 'Recenter and resume auto follow' "$SOURCE"
          grep -n -F 'public void recenter()' "$SOURCE"
          grep -n -F 'getLastKnownLocation()' "$SOURCE"
          grep -n -F 'setLocationComponentEnabled(true)' "$SOURCE"
          grep -n -F 'startAutoFollow();' "$SOURCE"

          if grep -q -F 'forceLocationUpdate(' "$SOURCE"; then
            echo "FAIL: forceLocationUpdate already exists in baseline source."
            exit 1
          fi

          echo "PASS: forceLocationUpdate() is absent from baseline."

      - name: Generate fixed workflow
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          src = Path(
              ".github/workflows/build-v10-carassistant-keyboard-follow-pass.yml"
          )

          dst = Path(
              ".github/workflows/build-v10-carassistant-keyboard-follow-pass-fixed.yml"
          )

          text = src.read_text(encoding="utf-8")

          START = "# 9. NAVIGATION-ONLY PATCH"
          END = "# 10. VERIFY NAVIGATION PATCH"

          # ------------------------------------------------------------
          # IMPORTANT:
          # Do NOT use text.count(START) here.
          #
          # The source workflow contains START/END strings inside
          # Python code as well as the real YAML marker lines.
          #
          # We therefore locate only lines whose stripped content is
          # exactly the marker.
          # ------------------------------------------------------------

          lines = text.splitlines(keepends=True)

          start_candidates = [
              i for i, line in enumerate(lines)
              if line.strip() == START
          ]

          end_candidates = [
              i for i, line in enumerate(lines)
              if line.strip() == END
          ]

          if len(start_candidates) != 1:
              raise SystemExit(
                  f"FAIL: Section 9 actual marker line count = "
                  f"{len(start_candidates)}; expected 1."
              )

          if len(end_candidates) != 1:
              raise SystemExit(
                  f"FAIL: Section 10 actual marker line count = "
                  f"{len(end_candidates)}; expected 1."
              )

          start_line = start_candidates[0]
          end_line = end_candidates[0]

          if end_line <= start_line:
              raise SystemExit(
                  "FAIL: Invalid Section 9 boundaries."
              )

          prefix = "".join(lines[:start_line])
          suffix = "".join(lines[end_line:])

          # Preserve the exact YAML indentation of the real Section 9
          # marker instead of hard-coding it.
          section_indent = (
              lines[start_line]
              [:len(lines[start_line]) - len(lines[start_line].lstrip())]
          )

          if not section_indent:
              raise SystemExit(
                  "FAIL: Could not determine Section 9 YAML indentation."
              )

          # ------------------------------------------------------------
          # Build Section 9 as a list of literal lines.
          #
          # This intentionally avoids nested Python triple-quoted
          # strings, which caused the previous SyntaxError.
          # ------------------------------------------------------------

          section9_lines = [
              section_indent + "# 9. NAVIGATION-ONLY PATCH",
              "          echo \"========================================\"",
              "          echo \"NAVIGATION FOLLOW + GPS ARROW PATCH\"",
              "          echo \"========================================\"",
              "",
              "          SOURCE=\"v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java\"",
              "",
              "          test -f \"$SOURCE\"",
              "",
              "          echo \"NavigationMapView baseline size:\"",
              "          wc -c \"$SOURCE\"",
              "",
              "          python3 - <<'PY2'",
              "          from pathlib import Path",
              "",
              "          path = Path(\"v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java\")",
              "          text = path.read_text(encoding=\"utf-8\")",
              "",
              "          render_import = \"import org.maplibre.android.location.modes.RenderMode;\"",
              "          camera_import = \"import org.maplibre.android.location.modes.CameraMode;\"",
              "",
              "          if text.count(render_import) != 0:",
              "              raise SystemExit(",
              "                  \"FAIL: RenderMode import already exists in baseline source.\"",
              "              )",
              "",
              "          if text.count(camera_import) != 1:",
              "              raise SystemExit(",
              "                  \"FAIL: Expected exactly one CameraMode import.\"",
              "              )",
              "",
              "          text = text.replace(",
              "              camera_import,",
              "              camera_import + \"\\n\" + render_import,",
              "              1",
              "          )",
              "",
              "          print(\"PASS: RenderMode import added.\")",
              "",
              "          old_button = (",
              "              \"        addControlButton(\\n\"",
              "              \"                controls,\\n\"",
              "              \"                \\\"◎\\\",\\n\"",
              "              \"                \\\"Recenter and resume auto follow\\\",\\n\"",
              "              \"                v -> recenter());\"",
              "          )",
              "",
              "          new_button = (",
              "              \"        addControlButton(\\n\"",
              "              \"                controls,\\n\"",
              "              \"                \\\"➤\\\",\\n\"",
              "              \"                \\\"Follow current location and direction\\\",\\n\"",
              "              \"                v -> followCurrentLocation());\"",
              "          )",
              "",
              "          count = text.count(old_button)",
              "",
              "          if count != 1:",
              "              raise SystemExit(",
              "                  f\"FAIL: Existing recenter button count = {count}; expected 1.\"",
              "              )",
              "",
              "          text = text.replace(old_button, new_button, 1)",
              "",
              "          print(\"PASS: Existing recenter button replaced exactly once.\")",
              "",
              "          old_enable = (",
              "              \"        map.getLocationComponent()\\n\"",
              "              \"                .setLocationComponentEnabled(true);\"",
              "          )",
              "",
              "          new_enable = (",
              "              \"        map.getLocationComponent()\\n\"",
              "              \"                .setLocationComponentEnabled(true);\\n\\n\"",
              "              \"        map.getLocationComponent()\\n\"",
              "              \"                .setRenderMode(RenderMode.GPS);\"",
              "          )",
              "",
              "          count = text.count(old_enable)",
              "",
              "          if count != 1:",
              "              raise SystemExit(",
              "                  f\"FAIL: Location enable block count = {count}; expected 1.\"",
              "              )",
              "",
              "          text = text.replace(old_enable, new_enable, 1)",
              "",
              "          print(\"PASS: RenderMode.GPS added.\")",
              "",
              "          old_recenter = (",
              "              \"    public void recenter() {\\n\\n\"",
              "              \"        if (map == null) {\\n\"",
              "              \"            return;\\n\"",
              "              \"        }\\n\\n\"",
              "              \"        try {\\n\\n\"",
              "              \"            Location location =\\n\"",
              "              \"                    map.getLocationComponent()\\n\"",
              "              \"                            .getLastKnownLocation();\\n\\n\"",
              "              \"            if (location == null) {\\n\\n\"",
              "              \"                startAutoFollow();\\n\\n\"",
              "              \"                return;\\n\"",
              "              \"            }\\n\\n\"",
              "              \"            map.getLocationComponent()\\n\"",
              "              \"                    .setCameraMode(\\n\"",
              "              \"                            CameraMode.TRACKING,\\n\"",
              "              \"                            500L,\\n\"",
              "              \"                            AUTO_FOLLOW_ZOOM,\\n\"",
              "              \"                            null,\\n\"",
              "              \"                            0.0,\\n\"",
              "              \"                            null);\\n\\n\"",
              "              \"        } catch (Exception ignored) {\\n\"",
              "              \"        }\\n\"",
              "              \"    }\"",
              "          )",
              "",
              "          new_recenter = (",
              "              \"    private void followCurrentLocation() {\\n\\n\"",
              "              \"        if (map == null) {\\n\"",
              "              \"            return;\\n\"",
              "              \"        }\\n\\n\"",
              "              \"        try {\\n\\n\"",
              "              \"            Location location =\\n\"",
              "              \"                    map.getLocationComponent()\\n\"",
              "              \"                            .getLastKnownLocation();\\n\\n\"",
              "              \"            if (location == null) {\\n\\n\"",
              "              \"                startAutoFollow();\\n\\n\"",
              "              \"                return;\\n\"",
              "              \"            }\\n\\n\"",
              "              \"            map.getLocationComponent()\\n\"",
              "              \"                    .setRenderMode(RenderMode.GPS);\\n\\n\"",
              "              \"            map.animateCamera(\\n\"",
              "              \"                    CameraUpdateFactory.newLatLngZoom(\\n\"",
              "              \"                            new LatLng(\\n\"",
              "              \"                                    location.getLatitude(),\\n\"",
              "              \"                                    location.getLongitude()),\\n\"",
              "              \"                            AUTO_FOLLOW_ZOOM),\\n\"",
              "              \"                    300);\\n\\n\"",
              "              \"            map.getLocationComponent()\\n\"",
              "              \"                    .setCameraMode(\\n\"",
              "              \"                            CameraMode.TRACKING,\\n\"",
              "              \"                            500L,\\n\"",
              "              \"                            AUTO_FOLLOW_ZOOM,\\n\"",
              "              \"                            null,\\n\"",
              "              \"                            0.0,\\n\"",
              "              \"                            null);\\n\\n\"",
              "              \"        } catch (Exception ignored) {\\n\"",
              "              \"        }\\n\"",
              "              \"    }\\n\\n\"",
              "              \"    public void recenter() {\\n\\n\"",
              "              \"        followCurrentLocation();\\n\"",
              "              \"    }\"",
              "          )",
              "",
              "          count = text.count(old_recenter)",
              "",
              "          if count != 1:",
              "              raise SystemExit(",
              "                  f\"FAIL: Existing recenter() count = {count}; expected 1.\"",
              "              )",
              "",
              "          text = text.replace(old_recenter, new_recenter, 1)",
              "",
              "          print(\"PASS: Existing recenter() replaced exactly once.\")",
              "          print(\"PASS: followCurrentLocation() added.\")",
              "",
              "          if \"forceLocationUpdate(\" in text:",
              "              raise SystemExit(",
              "                  \"FAIL: forceLocationUpdate() must not be introduced.\"",
              "              )",
              "",
              "          path.write_text(text, encoding=\"utf-8\")",
              "",
              "          print(\"PASS: Navigation Section 9 source patch completed.\")",
              "          PY2",
              "",
              "          echo \"PASS: Section 9 patch completed.\"",
          ]

          section9 = "\n".join(section9_lines) + "\n"

          generated = prefix + section9 + suffix

          dst.write_text(
              generated,
              encoding="utf-8"
          )

          print("PASS: Fixed workflow written.")

          # ------------------------------------------------------------
          # Verify prefix/suffix are unchanged.
          # ------------------------------------------------------------

          generated_text = dst.read_text(encoding="utf-8")

          if not generated_text.startswith(prefix):
              raise SystemExit(
                  "FAIL: Prefix before Section 9 changed."
              )

          if not generated_text.endswith(suffix):
              raise SystemExit(
                  "FAIL: Suffix after Section 9 changed."
              )

          print("PASS: Prefix preserved exactly.")
          print("PASS: Suffix preserved exactly.")

          # Verify only actual marker lines, not marker strings inside
          # Python code.
          generated_lines = generated_text.splitlines(keepends=True)

          generated_start_candidates = [
              i for i, line in enumerate(generated_lines)
              if line.strip() == START
          ]

          generated_end_candidates = [
              i for i, line in enumerate(generated_lines)
              if line.strip() == END
          ]

          if len(generated_start_candidates) != 1:
              raise SystemExit(
                  "FAIL: Generated Section 9 actual marker line count != 1."
              )

          if len(generated_end_candidates) != 1:
              raise SystemExit(
                  "FAIL: Generated Section 10 actual marker line count != 1."
              )

          print("PASS: Generated workflow structure verified.")
          PY

      - name: Verify generated workflow YAML
        run: |
          set -euo pipefail

          FILE=".github/workflows/build-v10-carassistant-keyboard-follow-pass-fixed.yml"

          test -f "$FILE"

          ruby -e '
            require "yaml"
            YAML.load_file(ARGV[0])
            puts "PASS: YAML syntax valid."
          ' "$FILE"

      - name: Verify generated workflow content
        run: |
          set -euo pipefail

          FILE=".github/workflows/build-v10-carassistant-keyboard-follow-pass-fixed.yml"

          grep -F -q 'RenderMode' "$FILE"
          grep -F -q 'followCurrentLocation()' "$FILE"
          grep -F -q 'CameraUpdateFactory.newLatLngZoom(' "$FILE"
          grep -F -q 'setRenderMode(RenderMode.GPS);' "$FILE"

          if grep -F -q 'forceLocationUpdate(' "$FILE"; then
            echo "FAIL: forceLocationUpdate() found."
            exit 1
          fi

          echo "PASS: Generated workflow content verified."

      - name: Commit and push fixed workflow
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .github/workflows/build-v10-carassistant-keyboard-follow-pass-fixed.yml

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "FAIL: No generated workflow change detected."
            exit 1
          fi

          git commit \
            -m "fix workflow: generate navigation follow patch safely"

          git remote set-url origin \
            "https://x-access-token:${PAT_TOKEN}@github.com/nguyenvantien2111998123-jpg/CarAssistant.git"

          git push origin main

          echo "PASS: Fixed workflow pushed to main."
