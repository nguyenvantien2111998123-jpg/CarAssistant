     - name: Generate fixed workflow
      run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          src = Path(
              ".github/workflows/build-v10-carassistant-keyboard-follow-pass.yml"
          )

          dst = Path(
              ".github/workflows/build-v10-carassistant-keyboard-follow-pass-fixed.yml"
          )

          text = src.read_text(encoding="utf-8")

          START = "# 9. NAVIGATION-ONLY PATCH"
          END = "# 10. VERIFY NAVIGATION PATCH"

          lines = text.splitlines(keepends=True)

          # Tìm dòng chứa marker
          start_candidates = [
              i for i, line in enumerate(lines)
              if START in line
          ]

          end_candidates = [
              i for i, line in enumerate(lines)
              if END in line
          ]

          if len(start_candidates) != 1:
              found = [l.strip() for l in lines if "# 9" in l]
              raise SystemExit(
                  f"FAIL: Section 9 actual marker line count = {len(start_candidates)}; expected 1.\n"
                  f"Lines matching '# 9': {found}"
              )

          if len(end_candidates) != 1:
              found = [l.strip() for l in lines if "# 10" in l]
              raise SystemExit(
                  f"FAIL: Section 10 actual marker line count = {len(end_candidates)}; expected 1.\n"
                  f"Lines matching '# 10': {found}"
              )

          start_line = start_candidates[0]
          end_line = end_candidates[0]

          if end_line <= start_line:
              raise SystemExit("FAIL: Invalid Section 9 boundaries.")

          prefix = "".join(lines[:start_line])
          suffix = "".join(lines[end_line:])

          # Đảm bảo lề YAML chuẩn (10 khoảng trắng cho khối script dưới 'run: |')
          indent = "          "

          section9_lines = [
              indent + "# 9. NAVIGATION-ONLY PATCH",
              indent + "echo \"========================================\"",
              indent + "echo \"NAVIGATION FOLLOW + GPS ARROW PATCH\"",
              indent + "echo \"========================================\"",
              indent + "",
              indent + "SOURCE=\"v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java\"",
              indent + "",
              indent + "test -f \"$SOURCE\"",
              indent + "",
              indent + "echo \"NavigationMapView baseline size:\"",
              indent + "wc -c \"$SOURCE\"",
              indent + "",
              indent + "python3 - <<'PY2'",
              indent + "from pathlib import Path",
              indent + "",
              indent + "path = Path(\"v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java\")",
              indent + "text = path.read_text(encoding=\"utf-8\")",
              indent + "",
              indent + "render_import = \"import org.maplibre.android.location.modes.RenderMode;\"",
              indent + "camera_import = \"import org.maplibre.android.location.modes.CameraMode;\"",
              indent + "",
              indent + "if text.count(render_import) != 0:",
              indent + "    raise SystemExit(",
              indent + "        \"FAIL: RenderMode import already exists in baseline source.\"",
              indent + "    )",
              indent + "",
              indent + "if text.count(camera_import) != 1:",
              indent + "    raise SystemExit(",
              indent + "        \"FAIL: Expected exactly one CameraMode import.\"",
              indent + "    )",
              indent + "",
              indent + "text = text.replace(",
              indent + "    camera_import,",
              indent + "    camera_import + \"\\n\" + render_import,",
              indent + "    1",
              indent + ")",
              indent + "",
              indent + "print(\"PASS: RenderMode import added.\")",
              indent + "",
              indent + "old_button = (",
              indent + "    \"        addControlButton(\\n\"",
              indent + "    \"                controls,\\n\"",
              indent + "    \"                \\\"◎\\\",\\n\"",
              indent + "    \"                \\\"Recenter and resume auto follow\\\",\\n\"",
              indent + "    \"                v -> recenter());\"",
              indent + ")",
              indent + "",
              indent + "new_button = (",
              indent + "    \"        addControlButton(\\n\"",
              indent + "    \"                controls,\\n\"",
              indent + "    \"                \\\"➤\\\",\\n\"",
              indent + "    \"                \\\"Follow current location and direction\\\",\\n\"",
              indent + "    \"                v -> followCurrentLocation());\"",
              indent + ")",
              indent + "",
              indent + "count = text.count(old_button)",
              indent + "",
              indent + "if count != 1:",
              indent + "    raise SystemExit(",
              indent + "        f\"FAIL: Existing recenter button count = {count}; expected 1.\"",
              indent + "    )",
              indent + "",
              indent + "text = text.replace(old_button, new_button, 1)",
              indent + "",
              indent + "print(\"PASS: Existing recenter button replaced exactly once.\")",
              indent + "",
              indent + "old_enable = (",
              indent + "    \"        map.getLocationComponent()\\n\"",
              indent + "    \"                .setLocationComponentEnabled(true);\"",
              indent + ")",
              indent + "",
              indent + "new_enable = (",
              indent + "    \"        map.getLocationComponent()\\n\"",
              indent + "    \"                .setLocationComponentEnabled(true);\\n\\n\"",
              indent + "    \"        map.getLocationComponent()\\n\"",
              indent + "    \"                .setRenderMode(RenderMode.GPS);\"",
              indent + ")",
              indent + "",
              indent + "count = text.count(old_enable)",
              indent + "",
              indent + "if count != 1:",
              indent + "    raise SystemExit(",
              indent + "        f\"FAIL: Location enable block count = {count}; expected 1.\"",
              indent + "    )",
              indent + "",
              indent + "text = text.replace(old_enable, new_enable, 1)",
              indent + "",
              indent + "print(\"PASS: RenderMode.GPS added.\")",
              indent + "",
              indent + "old_recenter = (",
              indent + "    \"    public void recenter() {\\n\\n\"",
              indent + "    \"        if (map == null) {\\n\"",
              indent + "    \"            return;\\n\"",
              indent + "    \"        }\\n\\n\"",
              indent + "    \"        try {\\n\\n\"",
              indent + "    \"            Location location =\\n\"",
              indent + "    \"                    map.getLocationComponent()\\n\"",
              indent + "    \"                            .getLastKnownLocation();\\n\\n\"",
              indent + "    \"            if (location == null) {\\n\\n\"",
              indent + "    \"                startAutoFollow();\\n\\n\"",
              indent + "    \"                return;\\n\"",
              indent + "    \"            }\\n\\n\"",
              indent + "    \"            map.getLocationComponent()\\n\"",
              indent + "    \"                    .setCameraMode(\\n\"",
              indent + "    \"                            CameraMode.TRACKING,\\n\"",
              indent + "    \"                            500L,\\n\"",
              indent + "    \"                            AUTO_FOLLOW_ZOOM,\\n\"",
              indent + "    \"                            null,\\n\"",
              indent + "    \"                            0.0,\\n\"",
              indent + "    \"                            null);\\n\\n\"",
              indent + "    \"        } catch (Exception ignored) {\\n\"",
              indent + "    \"        }\\n\"",
              indent + "    \"    }\"",
              indent + ")",
              indent + "",
              indent + "new_recenter = (",
              indent + "    \"    private void followCurrentLocation() {\\n\\n\"",
              indent + "    \"        if (map == null) {\\n\"",
              indent + "    \"            return;\\n\"",
              indent + "    \"        }\\n\\n\"",
              indent + "    \"        try {\\n\\n\"",
              indent + "    \"            Location location =\\n\"",
              indent + "    \"                    map.getLocationComponent()\\n\"",
              indent + "    \"                            .getLastKnownLocation();\\n\\n\"",
              indent + "    \"            if (location == null) {\\n\\n\"",
              indent + "    \"                startAutoFollow();\\n\\n\"",
              indent + "    \"                return;\\n\"",
              indent + "    \"            }\\n\\n\"",
              indent + "    \"            map.getLocationComponent()\\n\"",
              indent + "    \"                    .setRenderMode(RenderMode.GPS);\\n\\n\"",
              indent + "    \"            map.animateCamera(\\n\"",
              indent + "    \"                    CameraUpdateFactory.newLatLngZoom(\\n\"",
              indent + "    \"                            new LatLng(\\n\"",
              indent + "    \"                                    location.getLatitude(),\\n\"",
              indent + "    \"                                    location.getLongitude()),\\n\"",
              indent + "    \"                            AUTO_FOLLOW_ZOOM),\\n\"",
              indent + "    \"                    300);\\n\\n\"",
              indent + "    \"            map.getLocationComponent()\\n\"",
              indent + "    \"                    .setCameraMode(\\n\"",
              indent + "    \"                            CameraMode.TRACKING,\\n\"",
              indent + "    \"                            500L,\\n\"",
              indent + "    \"                            AUTO_FOLLOW_ZOOM,\\n\"",
              indent + "    \"                            null,\\n\"",
              indent + "    \"                            0.0,\\n\"",
              indent + "    \"                            null);\\n\\n\"",
              indent + "    \"        } catch (Exception ignored) {\\n\"",
              indent + "    \"        }\\n\"",
              indent + "    \"    }\\n\\n\"",
              indent + "    \"    public void recenter() {\\n\\n\"",
              indent + "    \"        followCurrentLocation();\\n\"",
              indent + "    \"    }\"",
              indent + ")",
              indent + "",
              indent + "count = text.count(old_recenter)",
              indent + "",
              indent + "if count != 1:",
              indent + "    raise SystemExit(",
              indent + "        f\"FAIL: Existing recenter() count = {count}; expected 1.\"",
              indent + "    )",
              indent + "",
              indent + "text = text.replace(old_recenter, new_recenter, 1)",
              indent + "",
              indent + "print(\"PASS: Existing recenter() replaced exactly once.\")",
              indent + "print(\"PASS: followCurrentLocation() added.\")",
              indent + "",
              indent + "if \"forceLocationUpdate(\" in text:",
              indent + "    raise SystemExit(",
              indent + "        \"FAIL: forceLocationUpdate() must not be introduced.\"",
              indent + "    )",
              indent + "",
              indent + "path.write_text(text, encoding=\"utf-8\")",
              indent + "",
              indent + "print(\"PASS: Navigation Section 9 source patch completed.\")",
              indent + "PY2",
              indent + "",
              indent + "echo \"PASS: Section 9 patch completed.\"",
          ]

          section9 = "\n".join(section9_lines) + "\n"
          generated = prefix + section9 + suffix

          dst.write_text(generated, encoding="utf-8")
          print("PASS: Fixed workflow written.")
          PY
