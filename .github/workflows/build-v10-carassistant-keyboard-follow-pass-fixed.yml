name: Self Fix Navigation Follow Workflow

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-workflow:
    runs-on: ubuntu-latest

    steps:
      - name: Check PAT_TOKEN availability
        shell: bash
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${PAT_TOKEN:-}" ]; then
            echo "FAIL: PAT_TOKEN secret is not configured."
            echo "This workflow must use a PAT with permission to modify GitHub Actions workflow files."
            exit 1
          fi

          echo "PASS: PAT_TOKEN is available."

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true

      - name: Patch Section 9 and generate fixed workflow
        shell: bash
        run: |
          set -euo pipefail

          SRC=".github/workflows/build-v10-carassistant-keyboard-follow-pass.yml"
          DST=".github/workflows/build-v10-carassistant-keyboard-follow-pass-fixed.yml"

          test -f "$SRC"

          python3 <<'PY'
          from pathlib import Path

          src_path = Path(
              ".github/workflows/build-v10-carassistant-keyboard-follow-pass.yml"
          )

          dst_path = Path(
              ".github/workflows/build-v10-carassistant-keyboard-follow-pass-fixed.yml"
          )

          src_text = src_path.read_text(encoding="utf-8")

          MARKER_9 = "# 9. NAVIGATION-ONLY PATCH"
          MARKER_10 = "# 10. VERIFY NAVIGATION PATCH"

          if src_text.count(MARKER_9) != 1:
              raise SystemExit(
                  "FAIL: Section 9 marker must occur exactly once."
              )

          if src_text.count(MARKER_10) != 1:
              raise SystemExit(
                  "FAIL: Section 10 marker must occur exactly once."
              )

          src_lines = src_text.splitlines(keepends=True)

          idx_9 = next(
              i for i, line in enumerate(src_lines)
              if MARKER_9 in line
          )

          idx_10 = next(
              i for i, line in enumerate(src_lines)
              if MARKER_10 in line
          )

          start_line = idx_9

          if (
              start_line > 0
              and "# =====" in src_lines[start_line - 1]
          ):
              start_line -= 1

          end_line = idx_10

          if (
              end_line > 0
              and "# =====" in src_lines[end_line - 1]
          ):
              end_line -= 1

          if end_line <= start_line:
              raise SystemExit(
                  "FAIL: Invalid Section 9 / Section 10 ordering."
              )

          new_section = r'''      # ============================================================
      # 9. NAVIGATION-ONLY PATCH
      #
      # Structural patch against the verified NavigationMapView.java
      # at the current CarAssistant baseline.
      #
      # IMPORTANT:
      # - No full-file replacement.
      # - No NavigationMapView rewrite.
      # - No navigation engine replacement.
      # - No forceLocationUpdate().
      # - Only targeted Navigation Follow / GPS arrow changes.
      # ============================================================

      - name: Patch Navigation Follow and GPS Arrow
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"

          echo "========================================"
          echo "NAVIGATION FOLLOW + GPS ARROW PATCH"
          echo "========================================"

          test -f "$FILE"

          python3 <<'PY_INNER'
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          )

          source = path.read_text(encoding="utf-8")

          print(
              "NavigationMapView baseline size:",
              len(source),
              "bytes"
          )

          # ==========================================================
          # 1. EXACT BASELINE CHECKS
          # ==========================================================

          camera_import = (
              "import org.maplibre.android.location.modes.CameraMode;"
          )

          render_import = (
              "import org.maplibre.android.location.modes.RenderMode;"
          )

          if source.count(camera_import) != 1:
              raise SystemExit(
                  "FAIL: CameraMode import anchor is not exactly once."
              )

          if render_import not in source:
              source = source.replace(
                  camera_import,
                  camera_import + "\n" + render_import,
                  1
              )
              print("PASS: RenderMode import added.")
          else:
              if source.count(render_import) != 1:
                  raise SystemExit(
                      "FAIL: RenderMode import exists more than once."
                  )

              print(
                  "PASS: RenderMode import already present."
              )

          # ==========================================================
          # 2. PATCH THE REAL EXISTING ◎ RECENTER BUTTON
          #
          # Exact structure verified from NavigationMapView.java
          # at commit 99f336b.
          # ==========================================================

          old_button = '''addControlButton(
                  controls,
                  "◎",
                  "Recenter and resume auto follow",
                  v -> recenter());'''

          new_button = '''addControlButton(
                  controls,
                  "➤",
                  "Follow current location and direction",
                  v -> followCurrentLocation());'''

          button_count = source.count(old_button)

          if button_count == 1:

              source = source.replace(
                  old_button,
                  new_button,
                  1
              )

              print(
                  "PASS: Existing ◎ recenter button patched."
              )

          elif button_count == 0:

              if source.count(new_button) == 1:
                  print(
                      "PASS: Follow button already patched."
                  )
              else:
                  raise SystemExit(
                      "FAIL: Expected exact existing ◎ recenter "
                      "button was not found."
                  )

          else:

              raise SystemExit(
                  "FAIL: Existing ◎ recenter button found "
                  + str(button_count)
                  + " times; expected exactly 1."
              )

          # ==========================================================
          # 3. ENABLE GPS RENDER MODE
          #
          # Exact existing anchor verified from baseline:
          #
          # map.getLocationComponent()
          #         .setLocationComponentEnabled(true);
          # ==========================================================

          old_enable = '''map.getLocationComponent()
                  .setLocationComponentEnabled(true);'''

          new_enable = '''map.getLocationComponent()
                  .setLocationComponentEnabled(true);

              map.getLocationComponent()
                  .setRenderMode(RenderMode.GPS);'''

          enable_count = source.count(old_enable)

          if "setRenderMode(RenderMode.GPS);" in source:

              if source.count(
                  "setRenderMode(RenderMode.GPS);"
              ) != 1:
                  raise SystemExit(
                      "FAIL: RenderMode.GPS exists more than once."
                  )

              print(
                  "PASS: GPS render mode already present."
              )

          elif enable_count == 1:

              source = source.replace(
                  old_enable,
                  new_enable,
                  1
              )

              print(
                  "PASS: GPS render mode added."
              )

          else:

              raise SystemExit(
                  "FAIL: Expected exact "
                  "setLocationComponentEnabled(true) "
                  "anchor was not found exactly once."
              )

          # ==========================================================
          # 4. REPLACE THE REAL EXISTING recenter() METHOD
          #
          # The exact current method was inspected from commit
          # 99f336b before this workflow was written.
          #
          # We deliberately do NOT use forceLocationUpdate().
          # ==========================================================

          old_recenter = '''public void recenter() {

              if (map == null) {
                  return;
              }

              try {

                  Location location =
                          map.getLocationComponent()
                                  .getLastKnownLocation();

                  if (location == null) {

                      startAutoFollow();

                      return;
                  }

                  map.getLocationComponent()
                          .setCameraMode(
                                  CameraMode.TRACKING,
                                  500L,
                                  AUTO_FOLLOW_ZOOM,
                                  null,
                                  0.0,
                                  null);

              } catch (Exception ignored) {
              }
          }'''

          new_follow = '''public void followCurrentLocation() {

              if (map == null) {
                  return;
              }

              try {

                  Location location =
                          map.getLocationComponent()
                                  .getLastKnownLocation();

                  if (location == null) {

                      startAutoFollow();

                      return;
                  }

                  map.getLocationComponent()
                          .setRenderMode(
                                  RenderMode.GPS);

                  map.animateCamera(
                          CameraUpdateFactory.newLatLngZoom(
                                  new LatLng(
                                          location.getLatitude(),
                                          location.getLongitude()),
                                  AUTO_FOLLOW_ZOOM),
                          300);

                  map.getLocationComponent()
                          .setCameraMode(
                                  CameraMode.TRACKING,
                                  500L,
                                  AUTO_FOLLOW_ZOOM,
                                  null,
                                  0.0,
                                  null);

              } catch (Exception ignored) {
              }
          }

          public void recenter() {

              followCurrentLocation();
          }'''

          recenter_count = source.count(old_recenter)

          if recenter_count == 1:

              source = source.replace(
                  old_recenter,
                  new_follow,
                  1
              )

              print(
                  "PASS: Exact existing recenter() replaced."
              )

          elif recenter_count == 0:

              if (
                  source.count(
                      "public void followCurrentLocation()"
                  ) == 1
                  and source.count(
                      "public void recenter()"
                  ) == 1
                  and "followCurrentLocation();" in source
              ):
                  print(
                      "PASS: followCurrentLocation() patch "
                      "already present."
                  )
              else:
                  raise SystemExit(
                      "FAIL: Exact baseline recenter() method "
                      "was not found."
                  )

          else:

              raise SystemExit(
                  "FAIL: Exact baseline recenter() method "
                  "found "
                  + str(recenter_count)
                  + " times; expected exactly 1."
              )

          # ==========================================================
          # 5. FINAL STRUCTURAL VERIFICATION
          # ==========================================================

          required_once = [
              render_import,
              "setRenderMode(RenderMode.GPS);",
              'v -> followCurrentLocation());',
              "public void followCurrentLocation()",
              "CameraUpdateFactory.newLatLngZoom(",
              "location.getLatitude()",
              "location.getLongitude()",
              "CameraMode.TRACKING",
              "public void recenter()",
          ]

          for item in required_once:

              count = source.count(item)

              if count != 1:
                  raise SystemExit(
                      "FAIL: Final structural check failed for: "
                      + item
                      + " ; count="
                      + str(count)
                  )

          if "forceLocationUpdate(" in source:
              raise SystemExit(
                  "FAIL: forceLocationUpdate() must NOT be introduced."
              )

          if source.count(
              'v -> recenter());'
          ) != 0:
              raise SystemExit(
                  "FAIL: Old ◎ recenter button callback still exists."
              )

          if source.count(
              'v -> followCurrentLocation());'
          ) != 1:
              raise SystemExit(
                  "FAIL: Follow button callback is not exactly once."
              )

          if source.count(
              "setLocationComponentEnabled(true);"
          ) != 1:
              raise SystemExit(
                  "FAIL: Location enable call count changed."
              )

          print(
              "PASS: All Navigation Follow structural checks."
          )

          path.write_text(
              source,
              encoding="utf-8"
          )

          print(
              "PASS: NavigationMapView.java structurally patched."
          )

          print(
              "Final NavigationMapView size:",
              len(source),
              "bytes"
          )

          PY_INNER

          echo "PASS: Section 9 patch completed."

      # 10. VERIFY NAVIGATION PATCH
'''

          dst_lines = (
              src_lines[:start_line]
              + new_section.splitlines(keepends=True)
              + src_lines[end_line:]
          )

          dst_path.write_text(
              "".join(dst_lines),
              encoding="utf-8"
          )

          print(
              "PASS: Fixed workflow generated."
          )
          PY

      - name: Verify only Section 9 changed
        shell: bash
        run: |
          set -euo pipefail

          SRC=".github/workflows/build-v10-carassistant-keyboard-follow-pass.yml"
          DST=".github/workflows/build-v10-carassistant-keyboard-follow-pass-fixed.yml"

          test -f "$SRC"
          test -f "$DST"

          python3 <<'PY'
          import hashlib
          from pathlib import Path

          src_text = Path(
              ".github/workflows/build-v10-carassistant-keyboard-follow-pass.yml"
          ).read_text(encoding="utf-8")

          dst_text = Path(
              ".github/workflows/build-v10-carassistant-keyboard-follow-pass-fixed.yml"
          ).read_text(encoding="utf-8")

          MARKER_9 = "# 9. NAVIGATION-ONLY PATCH"
          MARKER_10 = "# 10. VERIFY NAVIGATION PATCH"

          if src_text.count(MARKER_9) != 1:
              raise SystemExit(
                  "FAIL: Source Section 9 marker count is not 1."
              )

          if dst_text.count(MARKER_9) != 1:
              raise SystemExit(
                  "FAIL: Destination Section 9 marker count is not 1."
              )

          if src_text.count(MARKER_10) != 1:
              raise SystemExit(
                  "FAIL: Source Section 10 marker count is not 1."
              )

          if dst_text.count(MARKER_10) != 1:
              raise SystemExit(
                  "FAIL: Destination Section 10 marker count is not 1."
              )

          src_lines = src_text.splitlines(keepends=True)
          dst_lines = dst_text.splitlines(keepends=True)

          idx_9_src = next(
              i for i, line in enumerate(src_lines)
              if MARKER_9 in line
          )

          idx_10_src = next(
              i for i, line in enumerate(src_lines)
              if MARKER_10 in line
          )

          idx_9_dst = next(
              i for i, line in enumerate(dst_lines)
              if MARKER_9 in line
          )

          idx_10_dst = next(
              i for i, line in enumerate(dst_lines)
              if MARKER_10 in line
          )

          start_src = (
              idx_9_src - 1
              if idx_9_src > 0
              and "# =====" in src_lines[idx_9_src - 1]
              else idx_9_src
          )

          end_src = (
              idx_10_src - 1
              if idx_10_src > 0
              and "# =====" in src_lines[idx_10_src - 1]
              else idx_10_src
          )

          start_dst = (
              idx_9_dst - 1
              if idx_9_dst > 0
              and "# =====" in dst_lines[idx_9_dst - 1]
              else idx_9_dst
          )

          end_dst = (
              idx_10_dst - 1
              if idx_10_dst > 0
              and "# =====" in dst_lines[idx_10_dst - 1]
              else idx_10_dst
          )

          prefix_src = "".join(
              src_lines[:start_src]
          ).encode("utf-8")

          prefix_dst = "".join(
              dst_lines[:start_dst]
          ).encode("utf-8")

          suffix_src = "".join(
              src_lines[end_src:]
          ).encode("utf-8")

          suffix_dst = "".join(
              dst_lines[end_dst:]
          ).encode("utf-8")

          section_src = "".join(
              src_lines[start_src:end_src]
          ).encode("utf-8")

          section_dst = "".join(
              dst_lines[start_dst:end_dst]
          ).encode("utf-8")

          print(
              "Prefix SHA256 SRC:",
              hashlib.sha256(prefix_src).hexdigest()
          )

          print(
              "Prefix SHA256 DST:",
              hashlib.sha256(prefix_dst).hexdigest()
          )

          print(
              "Suffix SHA256 SRC:",
              hashlib.sha256(suffix_src).hexdigest()
          )

          print(
              "Suffix SHA256 DST:",
              hashlib.sha256(suffix_dst).hexdigest()
          )

          if prefix_src != prefix_dst:
              raise SystemExit(
                  "FAIL: Prefix before Section 9 changed."
              )

          print(
              "PASS: Prefix identical."
          )

          if suffix_src != suffix_dst:
              raise SystemExit(
                  "FAIL: Suffix after Section 9 changed."
              )

          print(
              "PASS: Suffix identical."
          )

          if section_src == section_dst:
              raise SystemExit(
                  "FAIL: Section 9 was not modified."
              )

          print(
              "PASS: Only Section 9 differs."
          )

          PY

      - name: YAML syntax check
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import yaml

          path = (
              ".github/workflows/"
              "build-v10-carassistant-keyboard-follow-pass-fixed.yml"
          )

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              yaml.safe_load(f)

          print(
              "PASS: Fixed workflow YAML syntax."
          )
          PY

      - name: Commit fixed workflow
        shell: bash
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${PAT_TOKEN:-}" ]; then
            echo "FAIL: PAT_TOKEN is required."
            exit 1
          fi

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .github/workflows/build-v10-carassistant-keyboard-follow-pass-fixed.yml

          git diff --cached --check

          git commit \
            -m "fix workflow: structurally patch Navigation Section 9"

          git remote set-url origin \
            "https://x-access-token:${PAT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push origin main

          echo "PASS: Fixed workflow committed to main."
