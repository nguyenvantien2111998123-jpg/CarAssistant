name: Self Fix Navigation Follow Workflow

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-workflow:
    runs-on: ubuntu-latest

    steps:
      - name: Check PAT_TOKEN availability
        shell: bash
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${PAT_TOKEN:-}" ]; then
            echo "FAIL: PAT_TOKEN secret is not configured."
            exit 1
          fi

          echo "PASS: PAT_TOKEN is available."

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true

      - name: Patch Section 9 and generate fixed workflow
        shell: bash
        run: |
          set -euo pipefail

          SRC=".github/workflows/build-v10-carassistant-keyboard-follow-pass.yml"
          DST=".github/workflows/build-v10-carassistant-keyboard-follow-pass-fixed.yml"

          test -f "$SRC"

          python3 <<'PY'
          from pathlib import Path
          import hashlib

          src_path = Path(
              ".github/workflows/build-v10-carassistant-keyboard-follow-pass.yml"
          )

          dst_path = Path(
              ".github/workflows/build-v10-carassistant-keyboard-follow-pass-fixed.yml"
          )

          src_text = src_path.read_text(encoding="utf-8")

          MARKER_9 = "# 9. NAVIGATION-ONLY PATCH"
          MARKER_10 = "# 10. VERIFY NAVIGATION PATCH"

          if src_text.count(MARKER_9) != 1:
              raise SystemExit(
                  "FAIL: Section 9 marker must occur exactly once."
              )

          if src_text.count(MARKER_10) != 1:
              raise SystemExit(
                  "FAIL: Section 10 marker must occur exactly once."
              )

          src_lines = src_text.splitlines(keepends=True)

          idx_9 = next(
              i for i, line in enumerate(src_lines)
              if MARKER_9 in line
          )

          idx_10 = next(
              i for i, line in enumerate(src_lines)
              if MARKER_10 in line
          )

          if idx_10 <= idx_9:
              raise SystemExit(
                  "FAIL: Section 10 appears before Section 9."
              )

          start_line = idx_9

          if (
              start_line > 0
              and "# =====" in src_lines[start_line - 1]
          ):
              start_line -= 1

          end_line = idx_10

          if (
              end_line > 0
              and "# =====" in src_lines[end_line - 1]
          ):
              end_line -= 1

          prefix = "".join(src_lines[:start_line])
          suffix = "".join(src_lines[end_line:])

          new_section = r'''      # ============================================================
      # 9. NAVIGATION-ONLY PATCH
      #
      # Structural patch against the verified NavigationMapView.java
      # baseline.
      #
      # IMPORTANT:
      # - No full-file replacement.
      # - No NavigationMapView rewrite.
      # - No navigation engine replacement.
      # - No forceLocationUpdate().
      # - Only targeted Navigation Follow / GPS arrow changes.
      # ============================================================

      - name: Patch Navigation Follow and GPS Arrow
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"

          echo "========================================"
          echo "NAVIGATION FOLLOW + GPS ARROW PATCH"
          echo "========================================"

          test -f "$FILE"

          python3 <<'PY_INNER'
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          )

          source = path.read_text(encoding="utf-8")

          print(
              "NavigationMapView baseline size:",
              len(source),
              "bytes"
          )

          # ==========================================================
          # 1. EXACT BASELINE CHECKS
          # ==========================================================

          camera_import = (
              "import org.maplibre.android.location.modes.CameraMode;"
          )

          render_import = (
              "import org.maplibre.android.location.modes.RenderMode;"
          )

          if source.count(camera_import) != 1:
              raise SystemExit(
                  "FAIL: CameraMode import anchor is not exactly once."
              )

          if render_import not in source:

              source = source.replace(
                  camera_import,
                  camera_import + "\n" + render_import,
                  1
              )

              print(
                  "PASS: RenderMode import added."
              )

          else:

              if source.count(render_import) != 1:
                  raise SystemExit(
                      "FAIL: RenderMode import exists more than once."
                  )

              print(
                  "PASS: RenderMode import already present."
              )

          # ==========================================================
          # 2. EXACT EXISTING RECENTER BUTTON
          # ==========================================================

          old_button = '''addControlButton(
                  controls,
                  "◎",
                  "Recenter and resume auto follow",
                  v -> recenter());'''

          new_button = '''addControlButton(
                  controls,
                  "➤",
                  "Follow current location and direction",
                  v -> followCurrentLocation());'''

          button_count = source.count(old_button)

          if button_count == 1:

              source = source.replace(
                  old_button,
                  new_button,
                  1
              )

              print(
                  "PASS: Existing ◎ recenter button patched."
              )

          elif button_count == 0:

              if source.count(new_button) == 1:

                  print(
                      "PASS: Follow button already patched."
                  )

              else:

                  raise SystemExit(
                      "FAIL: Expected exact existing ◎ recenter "
                      "button was not found."
                  )

          else:

              raise SystemExit(
                  "FAIL: Existing ◎ recenter button found "
                  + str(button_count)
                  + " times; expected exactly 1."
              )

          # ==========================================================
          # 3. ENABLE GPS RENDER MODE
          # ==========================================================

          old_enable = '''map.getLocationComponent()
                  .setLocationComponentEnabled(true);'''

          new_enable = '''map.getLocationComponent()
                  .setLocationComponentEnabled(true);

              map.getLocationComponent()
                  .setRenderMode(RenderMode.GPS);'''

          gps_render_count = source.count(
              "setRenderMode(RenderMode.GPS);"
          )

          if gps_render_count == 0:

              enable_count = source.count(old_enable)

              if enable_count != 1:
                  raise SystemExit(
                      "FAIL: Expected exact "
                      "setLocationComponentEnabled(true) "
                      "anchor was not found exactly once."
                  )

              source = source.replace(
                  old_enable,
                  new_enable,
                  1
              )

              print(
                  "PASS: GPS render mode added."
              )

          elif gps_render_count == 1:

              print(
                  "PASS: GPS render mode already present."
              )

          else:

              raise SystemExit(
                  "FAIL: RenderMode.GPS exists more than once."
              )

          # ==========================================================
          # 4. REPLACE EXACT BASELINE recenter()
          # ==========================================================

          old_recenter = '''public void recenter() {

              if (map == null) {
                  return;
              }

              try {

                  Location location =
                          map.getLocationComponent()
                                  .getLastKnownLocation();

                  if (location == null) {

                      startAutoFollow();

                      return;
                  }

                  map.getLocationComponent()
                          .setCameraMode(
                                  CameraMode.TRACKING,
                                  500L,
                                  AUTO_FOLLOW_ZOOM,
                                  null,
                                  0.0,
                                  null);

              } catch (Exception ignored) {
              }
          }'''

          new_follow = '''public void followCurrentLocation() {

              if (map == null) {
                  return;
              }

              try {

                  Location location =
                          map.getLocationComponent()
                                  .getLastKnownLocation();

                  if (location == null) {

                      startAutoFollow();

                      return;
                  }

                  map.getLocationComponent()
                          .setRenderMode(
                                  RenderMode.GPS);

                  map.animateCamera(
                          CameraUpdateFactory.newLatLngZoom(
                                  new LatLng(
                                          location.getLatitude(),
                                          location.getLongitude()),
                                  AUTO_FOLLOW_ZOOM),
                          300);

                  map.getLocationComponent()
                          .setCameraMode(
                                  CameraMode.TRACKING,
                                  500L,
                                  AUTO_FOLLOW_ZOOM,
                                  null,
                                  0.0,
                                  null);

              } catch (Exception ignored) {
              }
          }

          public void recenter() {

              followCurrentLocation();
          }'''

          recenter_count = source.count(old_recenter)

          if recenter_count == 1:

              source = source.replace(
                  old_recenter,
                  new_follow,
                  1
              )

              print(
                  "PASS: Exact existing recenter() replaced."
              )

          elif recenter_count == 0:

              if (
                  source.count(
                      "public void followCurrentLocation()"
                  ) == 1
                  and source.count(
                      "public void recenter()"
                  ) == 1
              ):

                  print(
                      "PASS: followCurrentLocation() patch "
                      "already present."
                  )

              else:

                  raise SystemExit(
                      "FAIL: Exact baseline recenter() method "
                      "was not found."
                  )

          else:

              raise SystemExit(
                  "FAIL: Exact baseline recenter() method found "
                  + str(recenter_count)
                  + " times; expected exactly 1."
              )

          # ==========================================================
          # 5. FINAL STRUCTURAL VERIFICATION
          # ==========================================================

          checks = {
              render_import: 1,
              "setRenderMode(RenderMode.GPS);": 2,
              'v -> followCurrentLocation());': 1,
              "public void followCurrentLocation()": 1,
              "CameraUpdateFactory.newLatLngZoom(": 1,
              "location.getLatitude()": 1,
              "location.getLongitude()": 1,
              "public void recenter()": 1,
          }

          for item, expected in checks.items():

              count = source.count(item)

              if count != expected:

                  raise SystemExit(
                      "FAIL: Structural check failed: "
                      + item
                      + " ; expected="
                      + str(expected)
                      + " ; actual="
                      + str(count)
                  )

          if source.count(
              "CameraMode.TRACKING"
          ) < 2:

              raise SystemExit(
                  "FAIL: CameraMode.TRACKING count is below 2."
              )

          if "forceLocationUpdate(" in source:

              raise SystemExit(
                  "FAIL: forceLocationUpdate() must NOT be introduced."
              )

          if source.count(
              "v -> recenter());"
          ) != 0:

              raise SystemExit(
                  "FAIL: Old ◎ recenter callback still exists."
              )

          if source.count(
              "setLocationComponentEnabled(true);"
          ) != 1:

              raise SystemExit(
                  "FAIL: Location enable call count changed."
              )

          print(
              "PASS: All Navigation Follow structural checks."
          )

          path.write_text(
              source,
              encoding="utf-8"
          )

          print(
              "PASS: NavigationMapView.java structurally patched."
          )

          print(
              "Final NavigationMapView size:",
              len(source),
              "bytes"
          )

          PY_INNER

          echo "PASS: Section 9 patch completed."
          }'''

          # ==========================================================
          # CRITICAL:
          # ACTUALLY WRITE THE GENERATED WORKFLOW.
          # ==========================================================

          generated = (
              prefix
              + new_section
              + suffix
          )

          dst_path.write_text(
              generated,
              encoding="utf-8"
          )

          if not dst_path.exists():
              raise SystemExit(
                  "FAIL: Destination workflow was not created."
              )

          generated_text = dst_path.read_text(
              encoding="utf-8"
          )

          # ==========================================================
          # VERIFY GENERATED FILE STRUCTURE
          # ==========================================================

          if not generated_text.startswith(prefix):
              raise SystemExit(
                  "FAIL: Generated workflow prefix mismatch."
              )

          if not generated_text.endswith(suffix):
              raise SystemExit(
                  "FAIL: Generated workflow suffix mismatch."
              )

          if generated_text.count(MARKER_9) != 1:
              raise SystemExit(
                  "FAIL: Generated Section 9 marker count != 1."
              )

          if generated_text.count(MARKER_10) != 1:
              raise SystemExit(
                  "FAIL: Generated Section 10 marker count != 1."
              )

          if (
              "import org.maplibre.android.location.modes.RenderMode;"
              not in generated_text
          ):
              raise SystemExit(
                  "FAIL: Generated workflow does not contain RenderMode patch."
              )

          print(
              "PASS: Fixed workflow generated."
          )

          print(
              "Generated workflow size:",
              len(generated_text),
              "bytes"
          )

          # ==========================================================
          # PREVIEW HASHES
          # ==========================================================

          print(
              "Source SHA256:",
              hashlib.sha256(
                  src_text.encode("utf-8")
              ).hexdigest()
          )

          print(
              "Generated SHA256:",
              hashlib.sha256(
                  generated_text.encode("utf-8")
              ).hexdigest()
          )

          PY

      - name: Verify only Section 9 changed
        shell: bash
        run: |
          set -euo pipefail

          SRC=".github/workflows/build-v10-carassistant-keyboard-follow-pass.yml"
          DST=".github/workflows/build-v10-carassistant-keyboard-follow-pass-fixed.yml"

          test -f "$SRC"
          test -f "$DST"

          python3 <<'PY'
          from pathlib import Path
          import hashlib

          src_text = Path(
              ".github/workflows/build-v10-carassistant-keyboard-follow-pass.yml"
          ).read_text(encoding="utf-8")

          dst_text = Path(
              ".github/workflows/build-v10-carassistant-keyboard-follow-pass-fixed.yml"
          ).read_text(encoding="utf-8")

          MARKER_9 = "# 9. NAVIGATION-ONLY PATCH"
          MARKER_10 = "# 10. VERIFY NAVIGATION PATCH"

          def split_workflow(text, label):

              if text.count(MARKER_9) != 1:
                  raise SystemExit(
                      f"FAIL: {label} Section 9 marker count != 1."
                  )

              if text.count(MARKER_10) != 1:
                  raise SystemExit(
                      f"FAIL: {label} Section 10 marker count != 1."
                  )

              lines = text.splitlines(keepends=True)

              idx9 = next(
                  i for i, line in enumerate(lines)
                  if MARKER_9 in line
              )

              idx10 = next(
                  i for i, line in enumerate(lines)
                  if MARKER_10 in line
              )

              start = (
                  idx9 - 1
                  if idx9 > 0
                  and "# =====" in lines[idx9 - 1]
                  else idx9
              )

              end = (
                  idx10 - 1
                  if idx10 > 0
                  and "# =====" in lines[idx10 - 1]
                  else idx10
              )

              if end <= start:
                  raise SystemExit(
                      f"FAIL: Invalid Section 9 boundaries in {label}."
                  )

              return (
                  "".join(lines[:start]),
                  "".join(lines[start:end]),
                  "".join(lines[end:])
              )

          src_prefix, src_section, src_suffix = split_workflow(
              src_text,
              "SOURCE"
          )

          dst_prefix, dst_section, dst_suffix = split_workflow(
              dst_text,
              "DESTINATION"
          )

          src_prefix_b = src_prefix.encode("utf-8")
          dst_prefix_b = dst_prefix.encode("utf-8")

          src_suffix_b = src_suffix.encode("utf-8")
          dst_suffix_b = dst_suffix.encode("utf-8")

          print(
              "Prefix SHA256 SRC:",
              hashlib.sha256(src_prefix_b).hexdigest()
          )

          print(
              "Prefix SHA256 DST:",
              hashlib.sha256(dst_prefix_b).hexdigest()
          )

          print(
              "Suffix SHA256 SRC:",
              hashlib.sha256(src_suffix_b).hexdigest()
          )

          print(
              "Suffix SHA256 DST:",
              hashlib.sha256(dst_suffix_b).hexdigest()
          )

          if src_prefix_b != dst_prefix_b:
              raise SystemExit(
                  "FAIL: Prefix before Section 9 changed."
              )

          PY
