name: Build V10 Freeze Tested Source V2 SAFE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install PyYAML
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --quiet pyyaml

      - name: Rebuild exact Display Core V1
        shell: bash
        run: |
          set -euo pipefail

          python3 -c 'from pathlib import Path; import subprocess,yaml; w=Path(".github/workflows/build-v10-display-core-v1.yml"); d=yaml.safe_load(w.read_text(encoding="utf-8")); ss=d["jobs"]["build"]["steps"]; selected=[]; [selected.append(s) or (s.get("name")=="Build V10 Display Core V1" and (_ for _ in ()).throw(StopIteration)) for s in ss if "run" in s and not s.get("uses")];' || true

          python3 -c 'from pathlib import Path; import subprocess,yaml; w=Path(".github/workflows/build-v10-display-core-v1.yml"); d=yaml.safe_load(w.read_text(encoding="utf-8")); ss=d["jobs"]["build"]["steps"]; selected=[]; stop=False; [selected.append(s) for s in ss if "run" in s and not s.get("uses") and not stop]; [globals().__setitem__("stop",True) for s in ss if s.get("name")=="Build V10 Display Core V1"]; print("Core workflow loaded:",len(ss),"steps")'

          python3 -c 'from pathlib import Path; import subprocess,yaml; w=Path(".github/workflows/build-v10-display-core-v1.yml"); d=yaml.safe_load(w.read_text(encoding="utf-8")); ss=d["jobs"]["build"]["steps"]; selected=[]; stop=False; \
          exec("for s in ss:\\n    if stop: break\\n    if \"run\" in s and not s.get(\"uses\"): selected.append(s)\\n    if s.get(\"name\")==\"Build V10 Display Core V1\": stop=True\\n"); \
          print("Running Core V1 steps:",len(selected)); \
          [subprocess.run(["bash","-euo","pipefail","-c",s["run"]],cwd=s.get("working-directory") or None,check=True) for s in selected]'

      - name: Verify Core before Floating Touch
        shell: bash
        run: |
          set -euo pipefail

          test -d v10-source

          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java

          test -f v10-source/app/src/main/java/com/carassistant/v10/V10TaskSession.java
          test -f v10-source/app/src/main/java/com/carassistant/v10/V10DisplayController.java

          if test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java; then
            echo "ERROR: V10ProjectionService.java must not exist"
            exit 1
          fi

          grep -Fq 'DisplayManager' v10-source/app/src/main/java/com/carassistant/v10/V10DisplayController.java
          grep -Fq 'createVirtualDisplay' v10-source/app/src/main/java/com/carassistant/v10/V10DisplayController.java
          grep -Fq 'RootShellSession' v10-source/app/src/main/java/com/carassistant/v10/V10DisplayController.java

          echo "Display Core V1 structure verified."

      - name: Create direct Floating Touch patch helper
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p freeze-tools

          printf '%s\n' \
          'from pathlib import Path' \
          'import sys' \
          '' \
          'p = Path(sys.argv[1])' \
          's = p.read_text(encoding="utf-8")' \
          '' \
          'if "private TextView floatingTouchKey;" not in s:' \
          '    s = s.replace("private TextView", "private TextView", 1)' \
          '' \
          'marker = "private void createFloatingTouchKey()"' \
          'if marker not in s:' \
          '    anchor = "private void showFloatingMenu()"' \
          '    pos = s.find(anchor)' \
          '    if pos < 0:' \
          '        raise SystemExit("Cannot locate V10CarActivity insertion point")' \
          '    fields = "    private TextView floatingTouchKey;\\n    private boolean floatingDragging;\\n    private float floatingDownRawX;\\n    private float floatingDownRawY;\\n    private int floatingStartX;\\n    private int floatingStartY;\\n    private long floatingDownTime;\\n\\n"' \
          '    s = s[:pos] + fields + s[pos:]' \
          '' \
          'if "floatingDragging" not in s:' \
          '    s = s.replace(marker, "private boolean floatingDragging;\\n    private float floatingDownRawX;\\n    private float floatingDownRawY;\\n    private int floatingStartX;\\n    private int floatingStartY;\\n    private long floatingDownTime;\\n\\n    " + marker, 1)' \
          '' \
          'if marker not in s:' \
          '    raise SystemExit("Floating Touch method could not be created")' \
          '' \
          'method = r"""private void createFloatingTouchKey() {' \
          '        floatingTouchKey = new TextView(this);' \
          '        floatingTouchKey.setText("≡");' \
          '        floatingTouchKey.setTextSize(26);' \
          '        floatingTouchKey.setTextColor(Color.WHITE);' \
          '        floatingTouchKey.setGravity(Gravity.CENTER);' \
          '        floatingTouchKey.setBackgroundColor(Color.rgb(25, 30, 36));' \
          '        floatingTouchKey.setElevation(dp(12));' \
          '' \
          '        FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(' \
          '                dp(58), dp(58), Gravity.TOP | Gravity.END);' \
          '        params.rightMargin = prefs.getInt("x", dp(18));' \
          '        params.topMargin = prefs.getInt("y", dp(18));' \
          '        projectionLayer.addView(floatingTouchKey, params);' \
          '' \
          '        floatingTouchKey.setOnTouchListener((view, event) -> {' \
          '            switch (event.getActionMasked()) {' \
          '                case MotionEvent.ACTION_DOWN:' \
          '                    floatingDragging = false;' \
          '                    floatingDownRawX = event.getRawX();' \
          '                    floatingDownRawY = event.getRawY();' \
          '                    floatingDownTime = SystemClock.uptimeMillis();' \
          '                    FrameLayout.LayoutParams fp0 = (FrameLayout.LayoutParams) view.getLayoutParams();' \
          '                    floatingStartX = fp0.rightMargin;' \
          '                    floatingStartY = fp0.topMargin;' \
          '                    return true;' \
          '' \
          '                case MotionEvent.ACTION_MOVE:' \
          '                    float dx = event.getRawX() - floatingDownRawX;' \
          '                    float dy = event.getRawY() - floatingDownRawY;' \
          '                    if (!floatingDragging && Math.hypot(dx, dy) > ViewConfiguration.get(this).getScaledTouchSlop()) {' \
          '                        floatingDragging = true;' \
          '                    }' \
          '                    if (floatingDragging) {' \
          '                        FrameLayout.LayoutParams fp = (FrameLayout.LayoutParams) view.getLayoutParams();' \
          '                        fp.rightMargin = Math.max(0, floatingStartX - Math.round(dx));' \
          '                        fp.topMargin = Math.max(0, floatingStartY + Math.round(dy));' \
          '                        view.setLayoutParams(fp);' \
          '                    }' \
          '                    return true;' \
          '' \
          '                case MotionEvent.ACTION_UP:' \
          '                    if (floatingDragging) {' \
          '                        FrameLayout.LayoutParams fp = (FrameLayout.LayoutParams) view.getLayoutParams();' \
          '                        prefs.edit().putInt("x", fp.rightMargin).putInt("y", fp.topMargin).apply();' \
          '                        floatingDragging = false;' \
          '                        return true;' \
          '                    }' \
          '                    if (SystemClock.uptimeMillis() - floatingDownTime >= ViewConfiguration.getLongPressTimeout()) {' \
          '                        handleControlHome();' \
          '                        hideFloatingMenu();' \
          '                    } else {' \
          '                        showFloatingMenu();' \
          '                    }' \
          '                    view.performClick();' \
          '                    return true;' \
          '' \
          '                case MotionEvent.ACTION_CANCEL:' \
          '                    floatingDragging = false;' \
          '                    return true;' \
          '' \
          '                default:' \
          '                    return true;' \
          '            }' \
          '        });' \
          '    }"""' \
          '' \
          'start = s.find(marker)' \
          'brace = s.find("{", start)' \
          'depth = 0' \
          'end = -1' \
          'for i in range(brace, len(s)):' \
          '    if s[i] == "{": depth += 1' \
          '    elif s[i] == "}":' \
          '        depth -= 1' \
          '        if depth == 0:' \
          '            end = i + 1' \
          '            break' \
          'if end < 0:' \
          '    raise SystemExit("Cannot find end of createFloatingTouchKey")' \
          's = s[:start] + method + s[end:]' \
          '' \
          's = s.replace(r"\n    private void createFloatingTouchKey()", "    private void createFloatingTouchKey()", 1)' \
          '' \
          'p.write_text(s, encoding="utf-8")' \
          'print("Direct Floating Touch patch applied.")' \
          > freeze-tools/patch_floating.py

          python3 freeze-tools/patch_floating.py \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

      - name: Apply SAFE Floating Touch validation
        shell: bash
        run: |
          set -euo pipefail

          FILE=v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

          test -f "$FILE"

          grep -Fq 'private TextView floatingTouchKey;' "$FILE"
          grep -Fq 'private boolean floatingDragging;' "$FILE"
          grep -Fq 'private long floatingDownTime;' "$FILE"
          grep -Fq 'private void createFloatingTouchKey()' "$FILE"
          grep -Fq 'floatingDownTime = SystemClock.uptimeMillis();' "$FILE"
          grep -Fq 'ViewConfiguration.getLongPressTimeout()' "$FILE"
          grep -Fq 'handleControlBack();' "$FILE"
          grep -Fq 'handleControlHome();' "$FILE"

          if grep -Fq 'floatingLastTap' "$FILE"; then
            echo "ERROR: legacy floatingLastTap remains"
            exit 1
          fi

          if grep -Fq 'session.recents()' "$FILE"; then
            echo "ERROR: RECENTS logic remains"
            exit 1
          fi

          if grep -Fq '"RECENTS"' "$FILE"; then
            echo "ERROR: RECENTS menu remains"
            exit 1
          fi

          if grep -Fq '"2 SCREEN"' "$FILE"; then
            echo "ERROR: 2 SCREEN menu remains"
            exit 1
          fi

          if grep -Fq '"3 SCREEN"' "$FILE"; then
            echo "ERROR: 3 SCREEN menu remains"
            exit 1
          fi

          if grep -Fq 'setLayoutModeExternal(' "$FILE"; then
            echo "ERROR: external layout mode logic remains"
            exit 1
          fi

          if grep -Fq 'V10ProjectionService' "$FILE"; then
            echo "ERROR: forbidden ProjectionService reference"
            exit 1
          fi

          if grep -Fq 'am force-stop' "$FILE"; then
            echo "ERROR: force-stop logic detected"
            exit 1
          fi

          if grep -Fq '\n    private void createFloatingTouchKey()' "$FILE"; then
            echo "ERROR: literal backslash-n remains"
            exit 1
          fi

          echo "Floating Touch SAFE validation PASSED."

      - name: Verify Core and Persistence were not replaced
        shell: bash
        run: |
          set -euo pipefail

          SESSION=v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java
          STORE=v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java
          CONTROLLER=v10-source/app/src/main/java/com/carassistant/v10/V10DisplayController.java

          test -f "$SESSION"
          test -f "$STORE"
          test -f "$CONTROLLER"

          grep -Fq 'V10TaskSession' "$SESSION"
          grep -Fq 'V10TaskSession' "$CONTROLLER"
          grep -Fq 'createVirtualDisplay' "$CONTROLLER"
          grep -Fq 'resumeExistingTask' "$CONTROLLER"

          if grep -Fq 'V10ProjectionService' "$SESSION"; then
            exit 1
          fi

          if grep -Fq 'am force-stop' "$SESSION"; then
            exit 1
          fi

          echo "Core/Persistence isolation PASSED."

      - name: Compile Java
        working-directory: v10-source
        shell: bash
        run: ./gradlew --no-daemon --stacktrace compileDebugJavaWithJavac

      - name: Assemble verification APK
        working-directory: v10-source
        shell: bash
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Create freeze manifest
        shell: bash
        run: |
          set -euo pipefail

          rm -rf freeze-output
          mkdir -p freeze-output

          printf '%s\n' \
            'CarAssistant V10 Frozen Tested Source V2' \
            'Purpose: exact reproducible source snapshot from Display Core V1 + SAFE Floating Touch' \
            'Baseline: V10-6A commit 9075636a7d5947c1b0eee49c2bd3fd0e1b6b0cf1' \
            'Build: compileDebugJavaWithJavac + assembleDebug' \
            'Floating Touch: drag + short tap menu + long press HOME' \
            'Forbidden: RECENTS / 2 SCREEN / 3 SCREEN / V10ProjectionService / force-stop' \
            > freeze-output/BASELINE-MANIFEST.txt

          find v10-source -type f \
            ! -path 'v10-source/.gradle/*' \
            ! -path 'v10-source/app/build/*' \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > freeze-output/SOURCE-FILE-SHA256.txt

      - name: Package frozen source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf freeze-package
          mkdir -p freeze-package

          cp -a v10-source freeze-package/CarAssistant-V10-FROZEN-SOURCE

          rm -rf \
            freeze-package/CarAssistant-V10-FROZEN-SOURCE/.gradle \
            freeze-package/CarAssistant-V10-FROZEN-SOURCE/app/build

          cp freeze-output/BASELINE-MANIFEST.txt freeze-package/
          cp freeze-output/SOURCE-FILE-SHA256.txt freeze-package/

          cd freeze-package

          zip -qr ../CarAssistant-V10-FROZEN-TESTED-SOURCE-V2.zip .

          cd ..

          sha256sum \
            CarAssistant-V10-FROZEN-TESTED-SOURCE-V2.zip \
            > freeze-output/FROZEN-SOURCE-ZIP-SHA256.txt

      - name: Calculate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find v10-source/app/build/outputs/apk/debug \
            -type f -name '*.apk' -print -quit)"

          test -n "$APK"

          sha256sum "$APK" > freeze-output/APK-SHA256.txt

          echo "APK: $APK"
          cat freeze-output/APK-SHA256.txt
          cat freeze-output/FROZEN-SOURCE-ZIP-SHA256.txt

      - name: Upload frozen source
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-FROZEN-TESTED-SOURCE-V2
          path: |
            CarAssistant-V10-FROZEN-TESTED-SOURCE-V2.zip
            freeze-output/BASELINE-MANIFEST.txt
            freeze-output/SOURCE-FILE-SHA256.txt
            freeze-output/FROZEN-SOURCE-ZIP-SHA256.txt
            freeze-output/APK-SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload verification APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-FROZEN-TESTED-APK-V2
          path: v10-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
