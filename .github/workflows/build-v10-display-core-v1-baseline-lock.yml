name: Build V10 Display Core V1 - Baseline Lock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-lock:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT EXACT CURRENT BASELINE SOURCE
      # ============================================================

      - name: Checkout Baseline
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      # ============================================================
      # 2. VERIFY BASELINE V10CarActivity
      #
      # This is the exact Home UI V2 source that produced the
      # tested PASS APK.
      # NO PATCH IS PERFORMED.
      # ============================================================

      - name: Verify Baseline V10CarActivity
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          test -f "$FILE"

          EXPECTED_SHA="d26c2d2f67bd801d9835071ed5c0afe323dd2fa9"
          ACTUAL_SHA="$(git hash-object "$FILE")"

          echo "EXPECTED V10CarActivity SHA:"
          echo "$EXPECTED_SHA"

          echo "ACTUAL V10CarActivity SHA:"
          echo "$ACTUAL_SHA"

          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

          echo "Baseline V10CarActivity: PASS"

      # ============================================================
      # 3. VERIFY FOUNDATION ARCHITECTURE
      # ============================================================

      - name: Verify Projection Persistence Architecture
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$BASE/V10ProjectionSession.java"
          test -f "$BASE/V10DisplayController.java"
          test -f "$BASE/V10SurfaceManager.java"
          test -f "$BASE/V10TaskSession.java"

          if [ -f "$BASE/V10ProjectionService.java" ]; then
            echo "ERROR: V10ProjectionService.java must be absent"
            exit 1
          fi

          echo "Projection files: PASS"
          echo "Persistence files: PASS"
          echo "V10ProjectionService absent: PASS"

      # ============================================================
      # 4. VERIFY PROTECTED FILE SHA
      # ============================================================

      - name: Verify Protected File SHA
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test "$(git hash-object "$BASE/V10ProjectionSession.java")" \
            = "27a9ff439fb450750d49f35a546eab3bc2745b4d"

          test "$(git hash-object "$BASE/V10DisplayController.java")" \
            = "1a35bcaa7db0a5f892e56006f740b4ebf727be8a"

          test "$(git hash-object "$BASE/V10SurfaceManager.java")" \
            = "e3f2a8b74ded29f21e04a95c661672db51d01d1c"

          test "$(git hash-object "$BASE/V10TaskSession.java")" \
            = "fce2f5cf06c5bd10782a87397aace8676493b6b7"

          echo "Projection/Persistence exact SHA: PASS"

      # ============================================================
      # 5. VERIFY HOME UI V2 MARKERS
      #
      # Verification only.
      # NO PATCH.
      # ============================================================

      - name: Verify Home UI V2
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq 'sidebarButton("APP' "$FILE"
          grep -Fq '"TASKS"' "$FILE"
          grep -Fq '"MEDIA"' "$FILE"
          grep -Fq '"WYN"' "$FILE"

          grep -Fq "ApplicationInfo" "$FILE"
          grep -Fq "PackageManager" "$FILE"
          grep -Fq "Drawable" "$FILE"
          grep -Fq "ImageView" "$FILE"
          grep -Fq "getRealAppIcon" "$FILE"
          grep -Fq "info.loadIcon(pm)" "$FILE"

          grep -Fq '"com.google.android.apps.maps"' "$FILE"
          grep -Fq '"com.google.android.youtube"' "$FILE"
          grep -Fq '"com.zing.zalo"' "$FILE"
          grep -Fq '"com.spotify.music"' "$FILE"

          grep -Fq "Math.min(4, quickApps.size())" "$FILE"

          echo "Home UI V2: PASS"
          echo "Real app icons: PASS"
          echo "Maps: PASS"
          echo "YouTube: PASS"
          echo "Zalo: PASS"
          echo "Spotify: PASS"
          echo "Maximum 4 quick apps: PASS"

      # ============================================================
      # 6. VERIFY NO PATCH TOOLS / PATCH ARTIFACTS
      # ============================================================

      - name: Verify No Patch Artifacts
        shell: bash
        run: |
          set -euo pipefail

          if find . -path './.git' -prune -o \
              \( -name 'patch_common.py' \
              -o -name 'patch_imports.py' \
              -o -name 'patch_helpers.py' \
              -o -name 'patch_dashboard.py' \
              -o -name 'patch_quick_apps.py' \
              -o -name 'patch_app_grid.py' \) \
              -print | grep -q .; then
            echo "ERROR: patch artifact found in repository"
            exit 1
          fi

          echo "No patch artifacts: PASS"

      # ============================================================
      # 7. VERIFY NO UNCOMMITTED SOURCE MODIFICATION
      # ============================================================

      - name: Verify Clean Source
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          CHANGED="$(git diff --name-only)"

          if [ -n "$CHANGED" ]; then
            echo "ERROR: repository source changed"
            echo "$CHANGED"
            exit 1
          fi

          echo "Source unchanged: PASS"

      # ============================================================
      # 8. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 9. GRADLE
      # ============================================================

      - name: Prepare Gradle
        shell: bash
        working-directory: v10-source
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          echo "Gradle prepared: PASS"

      # ============================================================
      # 10. COMPILE
      #
      # NO PATCH BEFORE COMPILE.
      # ============================================================

      - name: Compile Java
        shell: bash
        working-directory: v10-source
        run: |
          set -euo pipefail

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace

          echo "JAVA COMPILE: PASS"

      # ============================================================
      # 11. ASSEMBLE EXACT BASELINE APK
      # ============================================================

      - name: Assemble Baseline APK
        shell: bash
        working-directory: v10-source
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

          echo "APK ASSEMBLE: PASS"

      # ============================================================
      # 12. COPY APK + SHA256
      # ============================================================

      - name: Create Baseline Release
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/carassistant-baseline-lock
          mkdir -p /tmp/carassistant-baseline-lock

          APK="$(
            find v10-source/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          cp "$APK" \
            /tmp/carassistant-baseline-lock/CarAssistant-V10-Baseline-Lock.apk

          sha256sum \
            /tmp/carassistant-baseline-lock/CarAssistant-V10-Baseline-Lock.apk \
            | tee \
            /tmp/carassistant-baseline-lock/SHA256SUM.txt

          test -s \
            /tmp/carassistant-baseline-lock/CarAssistant-V10-Baseline-Lock.apk

          test -s \
            /tmp/carassistant-baseline-lock/SHA256SUM.txt

          echo "Baseline APK created: PASS"

      # ============================================================
      # 13. UPLOAD BASELINE APK
      # ============================================================

      - name: Upload Baseline Lock APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Baseline-Lock
          path: |
            /tmp/carassistant-baseline-lock/CarAssistant-V10-Baseline-Lock.apk
            /tmp/carassistant-baseline-lock/SHA256SUM.txt
          if-no-files-found: error

      # ============================================================
      # 14. FINAL BASELINE LOCK
      # ============================================================

      - name: Baseline Lock PASS
        shell: bash
        run: |
          set -euo pipefail

          test -s \
            /tmp/carassistant-baseline-lock/CarAssistant-V10-Baseline-Lock.apk

          test -s \
            /tmp/carassistant-baseline-lock/SHA256SUM.txt

          echo ""
          echo "================================================"
          echo "CARASSISTANT V10 - BASELINE LOCK PASS"
          echo "================================================"
          echo ""
          echo "Home UI V2:"
          echo "  LOCKED"
          echo ""
          echo "Projection:"
          echo "  PRESERVED"
          echo ""
          echo "Persistence:"
          echo "  PRESERVED"
          echo ""
          echo "Floating Touch:"
          echo "  PRESERVED"
          echo ""
          echo "BACK / HOME:"
          echo "  PRESERVED"
          echo ""
          echo "Real App Icons:"
          echo "  PRESERVED"
          echo ""
          echo "Quick Apps:"
          echo "  Maps / YouTube / Zalo / Spotify"
          echo ""
          echo "Patch:"
          echo "  NONE"
          echo ""
          echo "Compile:"
          echo "  PASS"
          echo ""
          echo "Assemble:"
          echo "  PASS"
          echo ""
          echo "APK:"
          echo "  CREATED"
          echo ""
          echo "================================================"
          echo "BASELINE IS LOCKED"
          echo "================================================"
