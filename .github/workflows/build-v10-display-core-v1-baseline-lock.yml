name: Build V10 Display Core V1 - Baseline Lock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-lock:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT EXACT HOME UI V2 BASELINE COMMIT
      #
      # IMPORTANT:
      # This is NOT Foundation V1.
      # This is the exact repository commit containing the
      # Home UI V2 source that was tested successfully.
      #
      # NO PATCH IS PERFORMED.
      # ============================================================

      - name: Checkout exact Home UI V2 Baseline
        uses: actions/checkout@v4
        with:
          ref: 12591049e68259ce5ff40c69974117a2b89a4623
          fetch-depth: 1

      # ============================================================
      # 2. VERIFY EXACT BASELINE COMMIT
      # ============================================================

      - name: Verify exact baseline commit
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_COMMIT="12591049e68259ce5ff40c69974117a2b89a4623"
          ACTUAL_COMMIT="$(git rev-parse HEAD)"

          echo "EXPECTED COMMIT:"
          echo "$EXPECTED_COMMIT"

          echo "ACTUAL COMMIT:"
          echo "$ACTUAL_COMMIT"

          test "$ACTUAL_COMMIT" = "$EXPECTED_COMMIT"

          echo "Exact Home UI V2 baseline commit: PASS"

      # ============================================================
      # 3. VERIFY EXACT V10CarActivity SOURCE
      #
      # This is the source that produced the real-device PASS APK.
      # ============================================================

      - name: Verify exact V10CarActivity
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"
          FILE="$BASE/V10CarActivity.java"

          test -f "$FILE"

          EXPECTED_SHA="d26c2d2f67bd801d9835071ed5c0afe323dd2fa9"
          ACTUAL_SHA="$(git hash-object "$FILE")"

          echo "EXPECTED V10CarActivity SHA:"
          echo "$EXPECTED_SHA"

          echo "ACTUAL V10CarActivity SHA:"
          echo "$ACTUAL_SHA"

          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

          echo "Exact V10CarActivity baseline: PASS"

      # ============================================================
      # 4. VERIFY FOUNDATION / PROJECTION / PERSISTENCE FILES
      #
      # These files MUST remain exactly unchanged.
      # ============================================================

      - name: Verify Projection and Persistence architecture
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$BASE/V10ProjectionSession.java"
          test -f "$BASE/V10DisplayController.java"
          test -f "$BASE/V10SurfaceManager.java"
          test -f "$BASE/V10TaskSession.java"

          if [ -f "$BASE/V10ProjectionService.java" ]; then
            echo "ERROR: V10ProjectionService.java must be absent"
            exit 1
          fi

          echo "Projection files: PASS"
          echo "Persistence files: PASS"
          echo "V10ProjectionService absent: PASS"

      # ============================================================
      # 5. VERIFY EXACT PROTECTED FILE SHA
      # ============================================================

      - name: Verify protected file SHA
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          EXPECTED_PROJECTION_SESSION="27a9ff439fb450750d49f35a546eab3bc2745b4d"
          EXPECTED_DISPLAY_CONTROLLER="1a35bcaa7db0a5f892e56006f740b4ebf727be8a"
          EXPECTED_SURFACE_MANAGER="e3f2a8b74ded29f21e04a95c661672db51d01d1c"
          EXPECTED_TASK_SESSION="fce2f5cf06c5bd10782a87397aace8676493b6b7"

          ACTUAL_PROJECTION_SESSION="$(
            git hash-object \
            "$BASE/V10ProjectionSession.java"
          )"

          ACTUAL_DISPLAY_CONTROLLER="$(
            git hash-object \
            "$BASE/V10DisplayController.java"
          )"

          ACTUAL_SURFACE_MANAGER="$(
            git hash-object \
            "$BASE/V10SurfaceManager.java"
          )"

          ACTUAL_TASK_SESSION="$(
            git hash-object \
            "$BASE/V10TaskSession.java"
          )"

          echo "V10ProjectionSession:"
          echo "$ACTUAL_PROJECTION_SESSION"

          echo "V10DisplayController:"
          echo "$ACTUAL_DISPLAY_CONTROLLER"

          echo "V10SurfaceManager:"
          echo "$ACTUAL_SURFACE_MANAGER"

          echo "V10TaskSession:"
          echo "$ACTUAL_TASK_SESSION"

          test "$ACTUAL_PROJECTION_SESSION" = "$EXPECTED_PROJECTION_SESSION"
          test "$ACTUAL_DISPLAY_CONTROLLER" = "$EXPECTED_DISPLAY_CONTROLLER"
          test "$ACTUAL_SURFACE_MANAGER" = "$EXPECTED_SURFACE_MANAGER"
          test "$ACTUAL_TASK_SESSION" = "$EXPECTED_TASK_SESSION"

          echo "Projection/Persistence exact SHA: PASS"

      # ============================================================
      # 6. VERIFY HOME UI V2
      #
      # Verification only.
      # NO PATCH.
      # ============================================================

      - name: Verify Home UI V2 markers
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          echo "Checking Home UI helpers..."

          grep -Fq \
            "private LinearLayout.LayoutParams sidebarButtonParams()" \
            "$FILE"

          grep -Fq \
            "private LinearLayout.LayoutParams sidebarFixedButtonParams()" \
            "$FILE"

          grep -Fq \
            "private LinearLayout.LayoutParams sidebarQuickParams()" \
            "$FILE"

          grep -Fq \
            "private TextView sidebarButton(String value)" \
            "$FILE"

          grep -Fq \
            "private TextView circleButton(String value)" \
            "$FILE"

          echo "Home UI helpers: PASS"

          echo "Checking real application icons..."

          grep -Fq "ApplicationInfo" "$FILE"
          grep -Fq "PackageManager" "$FILE"
          grep -Fq "Drawable" "$FILE"
          grep -Fq "ImageView" "$FILE"
          grep -Fq "getRealAppIcon" "$FILE"
          grep -Fq "info.loadIcon(pm)" "$FILE"

          echo "ApplicationInfo.loadIcon(): PASS"

          echo "Checking four quick-launch apps..."

          grep -Fq \
            '"com.google.android.apps.maps"' \
            "$FILE"

          grep -Fq \
            '"com.google.android.youtube"' \
            "$FILE"

          grep -Fq \
            '"com.zing.zalo"' \
            "$FILE"

          grep -Fq \
            '"com.spotify.music"' \
            "$FILE"

          grep -Fq \
            "Math.min(4, quickApps.size())" \
            "$FILE"

          echo "Maps: PASS"
          echo "YouTube: PASS"
          echo "Zalo: PASS"
          echo "Spotify: PASS"
          echo "Maximum 4 quick apps: PASS"

          echo "Checking Home UI markers..."

          grep -Fq 'sidebarButton("APP' "$FILE"
          grep -Fq '"TASKS"' "$FILE"
          grep -Fq '"MEDIA"' "$FILE"
          grep -Fq '"WYN"' "$FILE"

          echo "Home UI V2 markers: PASS"

      # ============================================================
      # 7. VERIFY PLACEHOLDER FEATURES REMAIN INACTIVE
      #
      # Voice / Tasks / Media / WYN are NOT being implemented yet.
      # ============================================================

      - name: Verify placeholder-only features
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq \
            'voice.setOnClickListener(v -> { });' \
            "$FILE"

          grep -Fq \
            'tasks.setOnClickListener(v -> { });' \
            "$FILE"

          grep -Fq \
            'media.setOnClickListener(v -> { });' \
            "$FILE"

          grep -Fq \
            'wyn.setOnClickListener(v -> { });' \
            "$FILE"

          echo "Voice: PLACEHOLDER ONLY"
          echo "Tasks: PLACEHOLDER ONLY"
          echo "Media: PLACEHOLDER ONLY"
          echo "WYN: PLACEHOLDER ONLY"

      # ============================================================
      # 8. VERIFY OLD HOME UI IS NOT PRESENT
      # ============================================================

      - name: Verify old Home UI is absent
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          if grep -Fq '"CAR ASSISTANT"' "$FILE"; then
            echo "ERROR: old CAR ASSISTANT title remains"
            exit 1
          fi

          if grep -Fq '"SPEED"' "$FILE"; then
            echo "ERROR: old SPEED card remains"
            exit 1
          fi

          if grep -Fq '"WEATHER"' "$FILE"; then
            echo "ERROR: old WEATHER card remains"
            exit 1
          fi

          echo "Old Home UI: ABSENT"

      # ============================================================
      # 9. VERIFY NO PATCH ARTIFACTS
      # ============================================================

      - name: Verify no patch artifacts
        shell: bash
        run: |
          set -euo pipefail

          if find . \
            -path './.git' -prune -o \
            \( \
              -name 'patch_common.py' \
              -o -name 'patch_imports.py' \
              -o -name 'patch_helpers.py' \
              -o -name 'patch_dashboard.py' \
              -o -name 'patch_quick_apps.py' \
              -o -name 'patch_app_grid.py' \
            \) \
            -print | grep -q .; then

            echo "ERROR: patch artifact found"
            exit 1
          fi

          echo "No patch artifacts: PASS"

      # ============================================================
      # 10. VERIFY CLEAN CHECKOUT
      #
      # The baseline must not be modified before compilation.
      # ============================================================

      - name: Verify clean baseline source
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          CHANGED="$(git diff --name-only)"

          if [ -n "$CHANGED" ]; then
            echo "ERROR: baseline source changed"
            echo "$CHANGED"
            exit 1
          fi

          echo "Baseline source clean: PASS"

      # ============================================================
      # 11. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 12. PREPARE GRADLE
      # ============================================================

      - name: Prepare Gradle
        shell: bash
        working-directory: v10-source
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          echo "Gradle prepared: PASS"

      # ============================================================
      # 13. FINAL JAVA COMPILE
      #
      # NO PATCH.
      # ============================================================

      - name: Final Java Compile
        shell: bash
        working-directory: v10-source
        run: |
          set -euo pipefail

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace

          echo "FINAL JAVA COMPILE: PASS"

      # ============================================================
      # 14. ASSEMBLE BASELINE APK
      # ============================================================

      - name: Assemble Baseline APK
        shell: bash
        working-directory: v10-source
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

          echo "APK ASSEMBLE: PASS"

      # ============================================================
      # 15. COPY APK + SHA256
      # ============================================================

      - name: Create Baseline APK release
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/carassistant-baseline-lock
          mkdir -p /tmp/carassistant-baseline-lock

          APK="$(
            find v10-source/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          cp "$APK" \
            /tmp/carassistant-baseline-lock/CarAssistant-V10-Baseline-Lock.apk

          sha256sum \
            /tmp/carassistant-baseline-lock/CarAssistant-V10-Baseline-Lock.apk \
            | tee \
            /tmp/carassistant-baseline-lock/SHA256SUM.txt

          test -s \
            /tmp/carassistant-baseline-lock/CarAssistant-V10-Baseline-Lock.apk

          test -s \
            /tmp/carassistant-baseline-lock/SHA256SUM.txt

          echo ""
          echo "Baseline APK:"
          echo "$APK"
          echo ""

          cat /tmp/carassistant-baseline-lock/SHA256SUM.txt

          echo ""
          echo "Baseline APK creation: PASS"

      # ============================================================
      # 16. UPLOAD BASELINE APK
      # ============================================================

      - name: Upload Baseline Lock APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Baseline-Lock
          path: |
            /tmp/carassistant-baseline-lock/CarAssistant-V10-Baseline-Lock.apk
            /tmp/carassistant-baseline-lock/SHA256SUM.txt
          if-no-files-found: error

      # ============================================================
      # 17. FINAL BASELINE GATE
      # ============================================================

      - name: Final Baseline Lock Gate
        shell: bash
        run: |
          set -euo pipefail

          test -s \
            /tmp/carassistant-baseline-lock/CarAssistant-V10-Baseline-Lock.apk

          test -s \
            /tmp/carassistant-baseline-lock/SHA256SUM.txt

          echo ""
          echo "================================================"
          echo "CARASSISTANT V10 - BASELINE LOCK PASS"
          echo "================================================"
          echo ""
          echo "Baseline commit:"
          echo "12591049e68259ce5ff40c69974117a2b89a4623"
          echo ""
          echo "V10CarActivity:"
          echo "d26c2d2f67bd801d9835071ed5c0afe323dd2fa9"
          echo ""
          echo "Home UI V2:"
          echo "LOCKED"
          echo ""
          echo "Projection:"
          echo "PRESERVED"
          echo ""
          echo "Persistence:"
          echo "PRESERVED"
          echo ""
          echo "Floating Touch:"
          echo "PRESERVED"
          echo ""
          echo "BACK / HOME:"
          echo "PRESERVED"
          echo ""
          echo "Real App Icons:"
          echo "PRESERVED"
          echo ""
          echo "Quick Apps:"
          echo "Maps / YouTube / Zalo / Spotify"
          echo ""
          echo "Maximum Quick Apps:"
          echo "4"
          echo ""
          echo "Voice / Tasks / Media / WYN:"
          echo "PLACEHOLDER ONLY"
          echo ""
          echo "Patch:"
          echo "NONE"
          echo ""
          echo "Java Compile:"
          echo "PASS"
          echo ""
          echo "APK Assemble:"
          echo "PASS"
          echo ""
          echo "SHA256:"
          echo "PASS"
          echo ""
          echo "Artifact:"
          echo "PASS"
          echo ""
          echo "================================================"
          echo "BASELINE IS LOCKED"
          echo "================================================"
