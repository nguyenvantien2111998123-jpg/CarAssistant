name: Build V10 Display Core V1 - Baseline Lock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-lock:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT EXACT BASELINE
      #
      # IMPORTANT:
      # - Exact known baseline commit
      # - NO PATCH
      # - NO HOME UI MODIFICATION
      # - NO SOURCE MODIFICATION
      # ============================================================

      - name: Checkout exact Baseline
        uses: actions/checkout@v4
        with:
          ref: 12591049e68259ce5ff40c69974117a2b89a4623
          fetch-depth: 1

      # ============================================================
      # 2. VERIFY EXACT COMMIT
      # ============================================================

      - name: Verify exact baseline commit
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_COMMIT="12591049e68259ce5ff40c69974117a2b89a4623"
          ACTUAL_COMMIT="$(git rev-parse HEAD)"

          echo "EXPECTED COMMIT:"
          echo "$EXPECTED_COMMIT"

          echo "ACTUAL COMMIT:"
          echo "$ACTUAL_COMMIT"

          test "$ACTUAL_COMMIT" = "$EXPECTED_COMMIT"

          echo "Exact baseline commit: PASS"

      # ============================================================
      # 3. VERIFY EXACT V10CarActivity
      #
      # This verifies the baseline source only.
      # NO PATCH.
      # ============================================================

      - name: Verify exact V10CarActivity
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          test -f "$FILE"

          EXPECTED_SHA="d26c2d2f67bd801d9835071ed5c0afe323dd2fa9"
          ACTUAL_SHA="$(git hash-object "$FILE")"

          echo "EXPECTED V10CarActivity SHA:"
          echo "$EXPECTED_SHA"

          echo "ACTUAL V10CarActivity SHA:"
          echo "$ACTUAL_SHA"

          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

          echo "Exact V10CarActivity baseline: PASS"

      # ============================================================
      # 4. VERIFY BASELINE PROJECTION FILES
      #
      # These are part of the locked baseline.
      # ============================================================

      - name: Verify baseline projection architecture
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$BASE/V10ProjectionSession.java"
          test -f "$BASE/V10DisplayController.java"
          test -f "$BASE/V10SurfaceManager.java"
          test -f "$BASE/V10TaskSession.java"

          if [ -f "$BASE/V10ProjectionService.java" ]; then
            echo "ERROR: V10ProjectionService.java must be absent"
            exit 1
          fi

          echo "V10ProjectionSession: PRESENT"
          echo "V10DisplayController: PRESENT"
          echo "V10SurfaceManager: PRESENT"
          echo "V10TaskSession: PRESENT"
          echo "V10ProjectionService: ABSENT"
          echo "Projection architecture: PASS"

      # ============================================================
      # 5. VERIFY EXACT PROTECTED FILE SHA
      # ============================================================

      - name: Verify protected baseline SHA
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          EXPECTED_PROJECTION_SESSION="27a9ff439fb450750d49f35a546eab3bc2745b4d"
          EXPECTED_DISPLAY_CONTROLLER="1a35bcaa7db0a5f892e56006f740b4ebf727be8a"
          EXPECTED_SURFACE_MANAGER="e3f2a8b74ded29f21e04a95c661672db51d01d1c"
          EXPECTED_TASK_SESSION="fce2f5cf06c5bd10782a87397aace8676493b6b7"

          ACTUAL_PROJECTION_SESSION="$(
            git hash-object \
            "$BASE/V10ProjectionSession.java"
          )"

          ACTUAL_DISPLAY_CONTROLLER="$(
            git hash-object \
            "$BASE/V10DisplayController.java"
          )"

          ACTUAL_SURFACE_MANAGER="$(
            git hash-object \
            "$BASE/V10SurfaceManager.java"
          )"

          ACTUAL_TASK_SESSION="$(
            git hash-object \
            "$BASE/V10TaskSession.java"
          )"

          echo "V10ProjectionSession:"
          echo "$ACTUAL_PROJECTION_SESSION"

          echo "V10DisplayController:"
          echo "$ACTUAL_DISPLAY_CONTROLLER"

          echo "V10SurfaceManager:"
          echo "$ACTUAL_SURFACE_MANAGER"

          echo "V10TaskSession:"
          echo "$ACTUAL_TASK_SESSION"

          test "$ACTUAL_PROJECTION_SESSION" = "$EXPECTED_PROJECTION_SESSION"
          test "$ACTUAL_DISPLAY_CONTROLLER" = "$EXPECTED_DISPLAY_CONTROLLER"
          test "$ACTUAL_SURFACE_MANAGER" = "$EXPECTED_SURFACE_MANAGER"
          test "$ACTUAL_TASK_SESSION" = "$EXPECTED_TASK_SESSION"

          echo "Protected baseline SHA: PASS"

      # ============================================================
      # 6. VERIFY BASELINE SOURCE STRUCTURE
      #
      # Only checks methods that actually exist in the locked
      # baseline. No Home UI V2 assumptions.
      # ============================================================

      - name: Verify baseline source structure
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq "buildUi()" "$FILE"
          grep -Fq "buildDashboard()" "$FILE"
          grep -Fq "buildAppPanel()" "$FILE"
          grep -Fq "rebuildAppGrid" "$FILE"
          grep -Fq "loadApps()" "$FILE"
          grep -Fq "rebuildDock()" "$FILE"
          grep -Fq "appTile(" "$FILE"
          grep -Fq "attachProjection()" "$FILE"
          grep -Fq "launchProjection(" "$FILE"
          grep -Fq "returnToLauncher()" "$FILE"
          grep -Fq "showApps()" "$FILE"
          grep -Fq "hideApps()" "$FILE"
          grep -Fq "createFloatingTouchKey()" "$FILE"
          grep -Fq "handleControlBack()" "$FILE"
          grep -Fq "handleControlHome()" "$FILE"
          grep -Fq "handleControlRecents()" "$FILE"
          grep -Fq "handleControlApps()" "$FILE"

          echo "Baseline V10CarActivity structure: PASS"

      # ============================================================
      # 7. VERIFY NO V10ProjectionService
      # ============================================================

      - name: Verify no V10ProjectionService
        shell: bash
        run: |
          set -euo pipefail

          if find v10-source \
            -type f \
            -name "V10ProjectionService.java" \
            -print \
            | grep -q .; then

            echo "ERROR: V10ProjectionService.java found"
            exit 1
          fi

          echo "V10ProjectionService absent: PASS"

      # ============================================================
      # 8. VERIFY NO PATCH ARTIFACTS
      #
      # Baseline Lock must not depend on patch scripts.
      # ============================================================

      - name: Verify no patch artifacts
        shell: bash
        run: |
          set -euo pipefail

          FOUND="$(
            find . \
              -path './.git' -prune -o \
              \( \
                -name 'patch_common.py' \
                -o -name 'patch_imports.py' \
                -o -name 'patch_helpers.py' \
                -o -name 'patch_dashboard.py' \
                -o -name 'patch_quick_apps.py' \
                -o -name 'patch_app_grid.py' \
                -o -name 'patch_home_ui.py' \
                -o -name '*patch*.py' \
              \) \
              -print
          )"

          if [ -n "$FOUND" ]; then
            echo "ERROR: patch artifact found:"
            echo "$FOUND"
            exit 1
          fi

          echo "No patch artifacts: PASS"

      # ============================================================
      # 9. VERIFY CLEAN CHECKOUT
      #
      # Nothing is allowed to modify the baseline.
      # ============================================================

      - name: Verify clean baseline source
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          CHANGED="$(git diff --name-only)"

          if [ -n "$CHANGED" ]; then
            echo "ERROR: baseline source changed"
            echo "$CHANGED"
            exit 1
          fi

          echo "Baseline source clean: PASS"

      # ============================================================
      # 10. SETUP JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 11. PREPARE GRADLE
      # ============================================================

      - name: Prepare Gradle
        shell: bash
        working-directory: v10-source
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          echo "Gradle prepared: PASS"

      # ============================================================
      # 12. FINAL JAVA COMPILE
      #
      # IMPORTANT:
      # Source is compiled exactly as checked out.
      # ============================================================

      - name: Compile exact baseline
        shell: bash
        working-directory: v10-source
        run: |
          set -euo pipefail

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace

          echo "BASELINE JAVA COMPILE: PASS"

      # ============================================================
      # 13. ASSEMBLE EXACT BASELINE APK
      # ============================================================

      - name: Assemble exact baseline APK
        shell: bash
        working-directory: v10-source
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

          echo "BASELINE APK ASSEMBLE: PASS"

      # ============================================================
      # 14. VERIFY SOURCE STILL CLEAN AFTER BUILD
      #
      # Gradle must not modify tracked source.
      # ============================================================

      - name: Verify source unchanged after build
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          CHANGED="$(git diff --name-only)"

          if [ -n "$CHANGED" ]; then
            echo "ERROR: tracked files changed during build"
            echo "$CHANGED"
            exit 1
          fi

          echo "Source unchanged after build: PASS"

      # ============================================================
      # 15. CREATE BASELINE APK PACKAGE
      # ============================================================

      - name: Create Baseline Lock package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/carassistant-baseline-lock
          mkdir -p /tmp/carassistant-baseline-lock

          APK="$(
            find v10-source/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "Found APK:"
          echo "$APK"

          cp "$APK" \
            /tmp/carassistant-baseline-lock/CarAssistant-V10-Baseline-Lock.apk

          sha256sum \
            /tmp/carassistant-baseline-lock/CarAssistant-V10-Baseline-Lock.apk \
            | tee \
            /tmp/carassistant-baseline-lock/SHA256SUM.txt

          test -s \
            /tmp/carassistant-baseline-lock/CarAssistant-V10-Baseline-Lock.apk

          test -s \
            /tmp/carassistant-baseline-lock/SHA256SUM.txt

          echo "Baseline package creation: PASS"

      # ============================================================
      # 16. UPLOAD BASELINE APK
      # ============================================================

      - name: Upload Baseline Lock APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Baseline-Lock
          path: |
            /tmp/carassistant-baseline-lock/CarAssistant-V10-Baseline-Lock.apk
            /tmp/carassistant-baseline-lock/SHA256SUM.txt
          if-no-files-found: error

      # ============================================================
      # 17. FINAL BASELINE LOCK GATE
      # ============================================================

      - name: Final Baseline Lock Gate
        shell: bash
        run: |
          set -euo pipefail

          test -s \
            /tmp/carassistant-baseline-lock/CarAssistant-V10-Baseline-Lock.apk

          test -s \
            /tmp/carassistant-baseline-lock/SHA256SUM.txt

          echo ""
          echo "================================================"
          echo "CARASSISTANT V10 - BASELINE LOCK PASS"
          echo "================================================"
          echo ""

          echo "Baseline commit:"
          echo "12591049e68259ce5ff40c69974117a2b89a4623"
          echo ""

          echo "V10CarActivity SHA:"
          echo "d26c2d2f67bd801d9835071ed5c0afe323dd2fa9"
          echo ""

          echo "Projection architecture:"
          echo "LOCKED"
          echo ""

          echo "Persistence architecture:"
          echo "LOCKED"
          echo ""

          echo "Floating Touch:"
          echo "BASELINE PRESERVED"
          echo ""

          echo "BACK / HOME:"
          echo "BASELINE PRESERVED"
          echo ""

          echo "Home UI:"
          echo "NO PATCH"
          echo ""

          echo "Real App Icons:"
          echo "NOT PART OF BASELINE LOCK"
          echo ""

          echo "Quick Apps:"
          echo "NOT MODIFIED"
          echo ""

          echo "Voice / Tasks / Media / WYN:"
          echo "NOT MODIFIED"
          echo ""

          echo "Source Patch:"
          echo "NONE"
          echo ""

          echo "Java Compile:"
          echo "PASS"
          echo ""

          echo "APK Assemble:"
          echo "PASS"
          echo ""

          echo "APK SHA256:"
          echo "PASS"
          echo ""

          echo "Artifact:"
          echo "PASS"
          echo ""

          echo "================================================"
          echo "BASELINE IS LOCKED"
          echo "================================================"
