name: Build Car Assistant V10 CarSystemUI 1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 1. Create CarSystemUI
      # ============================================================
      - name: Create CarSystemUI
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/CarSystemUI.java"

          mkdir -p "$(dirname "$FILE")"

          cat > "$FILE" <<'EOF'
          package com.carassistant.v10;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.os.SystemClock;
          import android.view.GestureDetector;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewConfiguration;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          /**
           * CarSystemUI
           *
           * App-owned SystemUI layer for the Car Assistant projection display.
           *
           * Responsibilities in this first version:
           * - Own the floating navigation key.
           * - Handle drag.
           * - Single tap opens the CarSystemUI menu.
           * - Double tap invokes Home.
           * - Back invokes the host activity's Back controller.
           * - Recents is represented by a CarSystemUI-owned action.
           *
           * Important:
           * This class deliberately does NOT send KEYCODE_APP_SWITCH.
           * Android's global Recents/Overview is not treated as the
           * navigation surface for the projection display.
           */
          public final class CarSystemUI {

              public interface Callback {
                  void onBack();
                  void onHome();
                  void onRecents();
              }

              private static final String PREFS = "v10_car_system_ui";

              private static final String KEY_X = "floating_x";
              private static final String KEY_Y = "floating_y";

              private static final int KEY_SIZE_DP = 52;
              private static final int MENU_WIDTH_DP = 190;
              private static final int MENU_BUTTON_HEIGHT_DP = 52;

              private final Context context;
              private final ViewGroup host;
              private final Callback callback;
              private final SharedPreferences prefs;

              private FrameLayout floatingKey;
              private LinearLayout menu;

              private float downRawX;
              private float downRawY;
              private float startX;
              private float startY;

              private long lastTapTime;

              private int touchSlop;

              public CarSystemUI(
                      Context context,
                      ViewGroup host,
                      Callback callback) {
                  this.context = context;
                  this.host = host;
                  this.callback = callback;
                  this.prefs =
                          context.getSharedPreferences(
                                  PREFS,
                                  Context.MODE_PRIVATE);

                  this.touchSlop =
                          ViewConfiguration
                                  .get(context)
                                  .getScaledTouchSlop();
              }

              public void attach() {
                  if (floatingKey != null) {
                      return;
                  }

                  createFloatingKey();
              }

              public void detach() {
                  if (menu != null) {
                      host.removeView(menu);
                      menu = null;
                  }

                  if (floatingKey != null) {
                      host.removeView(floatingKey);
                      floatingKey = null;
                  }
              }

              private int dp(float value) {
                  return (int) (value
                          * context.getResources()
                                  .getDisplayMetrics()
                                  .density
                          + 0.5f);
              }

              private GradientDrawable background(
                      int color,
                      float radius) {

                  GradientDrawable drawable =
                          new GradientDrawable();

                  drawable.setColor(color);
                  drawable.setCornerRadius(dp(radius));

                  return drawable;
              }

              private void createFloatingKey() {
                  floatingKey =
                          new FrameLayout(context);

                  floatingKey.setClickable(true);
                  floatingKey.setFocusable(false);

                  TextView icon =
                          new TextView(context);

                  icon.setText("≡");
                  icon.setTextColor(Color.WHITE);
                  icon.setTextSize(24f);
                  icon.setGravity(Gravity.CENTER);

                  floatingKey.setBackground(
                          background(
                                  Color.argb(225, 25, 25, 25),
                                  26));

                  FrameLayout.LayoutParams iconParams =
                          new FrameLayout.LayoutParams(
                                  dp(KEY_SIZE_DP),
                                  dp(KEY_SIZE_DP));

                  floatingKey.addView(
                          icon,
                          iconParams);

                  int savedX =
                          prefs.getInt(KEY_X, -1);

                  int savedY =
                          prefs.getInt(KEY_Y, -1);

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  dp(KEY_SIZE_DP),
                                  dp(KEY_SIZE_DP));

                  if (savedX >= 0) {
                      params.leftMargin = savedX;
                  } else {
                      params.leftMargin = dp(18);
                  }

                  if (savedY >= 0) {
                      params.topMargin = savedY;
                  } else {
                      params.topMargin = dp(120);
                  }

                  host.addView(
                          floatingKey,
                          params);

                  floatingKey.setOnTouchListener(
                          new View.OnTouchListener() {
                              @Override
                              public boolean onTouch(
                                      View view,
                                      MotionEvent event) {

                                  FrameLayout.LayoutParams lp =
                                          (FrameLayout.LayoutParams)
                                                  view.getLayoutParams();

                                  switch (event.getActionMasked()) {

                                      case MotionEvent.ACTION_DOWN:
                                          downRawX =
                                                  event.getRawX();

                                          downRawY =
                                                  event.getRawY();

                                          startX =
                                                  lp.leftMargin;

                                          startY =
                                                  lp.topMargin;

                                          return true;

                                      case MotionEvent.ACTION_MOVE:

                                          float dx =
                                                  event.getRawX()
                                                          - downRawX;

                                          float dy =
                                                  event.getRawY()
                                                          - downRawY;

                                          if (Math.abs(dx) > touchSlop
                                                  || Math.abs(dy) > touchSlop) {

                                              lp.leftMargin =
                                                      (int) (startX + dx);

                                              lp.topMargin =
                                                      (int) (startY + dy);

                                              clampPosition(lp);

                                              view.setLayoutParams(lp);

                                              return true;
                                          }

                                          return true;

                                      case MotionEvent.ACTION_UP:

                                          float upDx =
                                                  event.getRawX()
                                                          - downRawX;

                                          float upDy =
                                                  event.getRawY()
                                                          - downRawY;

                                          if (Math.abs(upDx) <= touchSlop
                                                  && Math.abs(upDy) <= touchSlop) {

                                              handleTap();
                                          } else {
                                              savePosition(lp);
                                          }

                                          return true;
                                  }

                                  return true;
                              }
                          });
              }

              private void clampPosition(
                      FrameLayout.LayoutParams lp) {

                  int width =
                          host.getWidth();

                  int height =
                          host.getHeight();

                  int size =
                          dp(KEY_SIZE_DP);

                  if (width > 0) {
                      lp.leftMargin =
                              Math.max(
                                      0,
                                      Math.min(
                                              lp.leftMargin,
                                              width - size));
                  }

                  if (height > 0) {
                      lp.topMargin =
                              Math.max(
                                      0,
                                      Math.min(
                                              lp.topMargin,
                                              height - size));
                  }
              }

              private void savePosition(
                      FrameLayout.LayoutParams lp) {

                  prefs.edit()
                          .putInt(KEY_X, lp.leftMargin)
                          .putInt(KEY_Y, lp.topMargin)
                          .apply();
              }

              private void handleTap() {
                  long now =
                          SystemClock.uptimeMillis();

                  if (now - lastTapTime < 350L) {
                      lastTapTime = 0L;

                      hideMenu();

                      if (callback != null) {
                          callback.onHome();
                      }

                      return;
                  }

                  lastTapTime = now;

                  showMenu();
              }

              private void showMenu() {
                  if (menu != null) {
                      hideMenu();
                      return;
                  }

                  menu =
                          new LinearLayout(context);

                  menu.setOrientation(
                          LinearLayout.VERTICAL);

                  menu.setPadding(
                          dp(8),
                          dp(8),
                          dp(8),
                          dp(8));

                  menu.setBackground(
                          background(
                                  Color.argb(
                                          240,
                                          25,
                                          25,
                                          25),
                                  18));

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  dp(MENU_WIDTH_DP),
                                  ViewGroup.LayoutParams.WRAP_CONTENT);

                  params.gravity =
                          Gravity.TOP | Gravity.START;

                  FrameLayout.LayoutParams keyParams =
                          (FrameLayout.LayoutParams)
                                  floatingKey.getLayoutParams();

                  params.leftMargin =
                          Math.max(
                                  0,
                                  keyParams.leftMargin
                                          - dp(10));

                  params.topMargin =
                          Math.max(
                                  0,
                                  keyParams.topMargin
                                          + dp(KEY_SIZE_DP)
                                          + dp(8));

                  host.addView(
                          menu,
                          params);

                  addMenuButton(
                          "BACK",
                          new Runnable() {
                              @Override
                              public void run() {
                                  hideMenu();

                                  if (callback != null) {
                                      callback.onBack();
                                  }
                              }
                          });

                  addMenuButton(
                          "RECENTS",
                          new Runnable() {
                              @Override
                              public void run() {
                                  hideMenu();

                                  if (callback != null) {
                                      callback.onRecents();
                                  }
                              }
                          });
              }

              private void addMenuButton(
                      String label,
                      final Runnable action) {

                  TextView button =
                          new TextView(context);

                  button.setText(label);
                  button.setTextColor(Color.WHITE);
                  button.setTextSize(16f);
                  button.setGravity(Gravity.CENTER);

                  button.setBackground(
                          background(
                                  Color.argb(
                                          60,
                                          255,
                                          255,
                                          255),
                                  12));

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(MENU_BUTTON_HEIGHT_DP));

                  params.bottomMargin =
                          dp(6);

                  menu.addView(
                          button,
                          params);

                  button.setOnClickListener(
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View view) {
                                  action.run();
                              }
                          });
              }

              private void hideMenu() {
                  if (menu != null) {
                      host.removeView(menu);
                      menu = null;
                  }
              }
          }
          EOF

          test -f "$FILE"
          echo "Created: $FILE"

      # ============================================================
      # 2. Patch V10CarActivity
      # ============================================================
      - name: Patch V10CarActivity
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          test -f "$FILE"

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          text = path.read_text()

          # --------------------------------------------------------
          # Add field
          # --------------------------------------------------------
          marker = "private V10ProjectionSession session;"

          if "private CarSystemUI carSystemUI;" not in text:
              if marker not in text:
                  raise SystemExit(
                      "ERROR: V10ProjectionSession field marker not found"
                  )

              text = text.replace(
                  marker,
                  marker + "\n    private CarSystemUI carSystemUI;",
                  1,
              )

          # --------------------------------------------------------
          # Attach CarSystemUI after projection touch listener
          # --------------------------------------------------------
          marker = "textureView.setOnTouchListener(inputController);"

          if "carSystemUI = new CarSystemUI(" not in text:
              if marker not in text:
                  raise SystemExit(
                      "ERROR: textureView touch listener marker not found"
                  )

              injection = r'''
          textureView.setOnTouchListener(inputController);

          carSystemUI =
                  new CarSystemUI(
                          this,
                          projectionLayer,
                          new CarSystemUI.Callback() {
                              @Override
                              public void onBack() {
                                  handleControlBack();
                              }

                              @Override
                              public void onHome() {
                                  handleControlHome();
                              }

                              @Override
                              public void onRecents() {
                                  handleControlRecents();
                              }
                          });

          carSystemUI.attach();
          '''

              text = text.replace(
                  marker,
                  injection.strip(),
                  1,
              )

          # --------------------------------------------------------
          # Detach CarSystemUI in onDestroy
          # --------------------------------------------------------
          marker = "super.onDestroy();"

          if "if (carSystemUI != null)" not in text:
              if marker not in text:
                  raise SystemExit(
                      "ERROR: onDestroy marker not found"
                  )

              injection = r'''
          if (carSystemUI != null) {
              carSystemUI.detach();
              carSystemUI = null;
          }

          super.onDestroy();
          '''

              text = text.replace(
                  marker,
                  injection.strip(),
                  1,
              )

          path.write_text(text)
          print("Patched:", path)
          PY

      # ============================================================
      # 3. Validate architecture
      # ============================================================
      - name: Validate CarSystemUI architecture
        shell: bash
        run: |
          set -euo pipefail

          CAR_SYSTEM_UI="v10-source/app/src/main/java/com/hieptran/aacast/doudou/CarSystemUI.java"
          ACTIVITY="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          test -f "$CAR_SYSTEM_UI"
          test -f "$ACTIVITY"

          grep -q "class CarSystemUI" "$CAR_SYSTEM_UI"
          grep -q "interface Callback" "$CAR_SYSTEM_UI"
          grep -q "void onBack()" "$CAR_SYSTEM_UI"
          grep -q "void onHome()" "$CAR_SYSTEM_UI"
          grep -q "void onRecents()" "$CAR_SYSTEM_UI"

          grep -q "private CarSystemUI carSystemUI;" "$ACTIVITY"
          grep -q "new CarSystemUI" "$ACTIVITY"
          grep -q "carSystemUI.attach()" "$ACTIVITY"
          grep -q "carSystemUI.detach()" "$ACTIVITY"

          # V10-CarSystemUI-1 must NOT fall back to the old
          # global Android Recents key mechanism.
          if grep -nE \
              "KEYCODE_APP_SWITCH|input keyevent 187" \
              "$CAR_SYSTEM_UI" "$ACTIVITY"; then
            echo "ERROR: global APP_SWITCH mechanism detected."
            exit 1
          fi

          echo "CarSystemUI architecture validation PASSED."

      # ============================================================
      # 4. Compile Java
      # ============================================================
      - name: Compile Java
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 5. Build APK
      # ============================================================
      - name: Build APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 6. Locate APK + SHA256
      # ============================================================
      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK=$APK"
          echo "SHA256:"
          sha256sum "$APK"

          ls -lh "$APK"

      # ============================================================
      # 7. Upload APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-CarSystemUI-1
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
