name: Build CarAssistant V10 Home UI V1 Safe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-ui-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install PyYAML
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check PyYAML

      - name: Rebuild exact Stable Base V1 source
        shell: bash
        run: |
          set -euo pipefail

          PAYLOAD=""

          printf '%s' "$PAYLOAD" |
            base64 -d |
            gzip -d > /tmp/rebuild_core.py

          python3 -m py_compile /tmp/rebuild_core.py
          python3 /tmp/rebuild_core.py

          test -d v10-source

      - name: Snapshot Stable Base protected files
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$SRC/V10DisplayController.java"
          test -f "$SRC/V10SurfaceManager.java"
          test -f "$SRC/V10TaskSession.java"
          test -f "$SRC/V10ProjectionSession.java"
          test -f "$SRC/V10SessionStore.java"
          test -f "$SRC/V10CarActivity.java"

          sha256sum \
            "$SRC/V10DisplayController.java" \
            "$SRC/V10SurfaceManager.java" \
            "$SRC/V10TaskSession.java" \
            "$SRC/V10ProjectionSession.java" \
            "$SRC/V10SessionStore.java" \
            > /tmp/stable-core-hashes.txt

          cp "$SRC/V10CarActivity.java" /tmp/V10CarActivity.before-home.java

          echo "Stable Base protected snapshot created."

      - name: Verify Stable Base before Home UI
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          grep -Fq "DisplayManager" "$SRC/V10DisplayController.java"
          grep -Fq "createVirtualDisplay" "$SRC/V10DisplayController.java"
          grep -Fq "virtualDisplay.setSurface(null)" "$SRC/V10DisplayController.java"
          grep -Fq -- "--activity-reorder-to-front" "$SRC/V10DisplayController.java"

          grep -Fq "launchNewTask" "$SRC/V10ProjectionSession.java"
          grep -Fq "resumeExistingTask" "$SRC/V10ProjectionSession.java"
          grep -Fq "RootShellSession" "$SRC/V10ProjectionSession.java"
          grep -Fq "State.HIDDEN" "$SRC/V10ProjectionSession.java"

          grep -Fq "enum State" "$SRC/V10TaskSession.java"
          grep -Fq "ACTIVE" "$SRC/V10TaskSession.java"
          grep -Fq "HIDDEN" "$SRC/V10TaskSession.java"

          grep -Fq "private TextView floatingTouchKey;" "$SRC/V10CarActivity.java"
          grep -Fq "createFloatingTouchKey()" "$SRC/V10CarActivity.java"
          grep -Fq "floatingDownTime" "$SRC/V10CarActivity.java"
          grep -Fq "ViewConfiguration.getLongPressTimeout()" "$SRC/V10CarActivity.java"

          echo "Stable Base V1 verified before Home UI."

      - name: Verify Floating Touch source before Home UI
        shell: bash
        run: |
          set -euo pipefail

          PAYLOAD=""

          printf '%s' "$PAYLOAD" |
            base64 -d |
            gzip -d > /tmp/verify_floating.py

          python3 -m py_compile /tmp/verify_floating.py

          python3 /tmp/verify_floating.py \
            /tmp/V10CarActivity.before-home.java \
            /tmp/V10CarActivity.before-home.java

      - name: Apply isolated Home UI V1 patch
        shell: bash
        run: |
          set -euo pipefail

          PAYLOAD=""

          printf '%s' "$PAYLOAD" |
            base64 -d |
            gzip -d > /tmp/home_patch.py

          python3 -m py_compile /tmp/home_patch.py

          python3 /tmp/home_patch.py \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

      - name: Verify Home UI isolation
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          sha256sum \
            "$SRC/V10DisplayController.java" \
            "$SRC/V10SurfaceManager.java" \
            "$SRC/V10TaskSession.java" \
            "$SRC/V10ProjectionSession.java" \
            "$SRC/V10SessionStore.java" \
            > /tmp/home-core-hashes.txt

          diff -u /tmp/stable-core-hashes.txt /tmp/home-core-hashes.txt

          grep -Fq "private LinearLayout favoriteRow;" "$SRC/V10CarActivity.java"
          grep -Fq "private final ArrayList<ComponentName> homeTasks" "$SRC/V10CarActivity.java"
          grep -Fq "MAP / NAVIGATION" "$SRC/V10CarActivity.java"
          grep -Fq "WYN+ • cảnh báo giao thông" "$SRC/V10CarActivity.java"
          grep -Fq "KEYCODE_MEDIA_PLAY_PAUSE" "$SRC/V10CarActivity.java"
          grep -Fq "TASKS ĐANG CHẠY" "$SRC/V10CarActivity.java"
          grep -Fq "saveFavorite(app.component)" "$SRC/V10CarActivity.java"

          if grep -Fq '"CAR ASSISTANT"' "$SRC/V10CarActivity.java"; then
            echo "ERROR: old Home title remains."
            exit 1
          fi

          if grep -Fq '"SPEED"' "$SRC/V10CarActivity.java"; then
            echo "ERROR: old SPEED quick card remains."
            exit 1
          fi

          if grep -Fq '"WEATHER"' "$SRC/V10CarActivity.java"; then
            echo "ERROR: old WEATHER quick card remains."
            exit 1
          fi

          if grep -Fq 'infoCard(' "$SRC/V10CarActivity.java"; then
            echo "ERROR: old quick-card construction remains."
            exit 1
          fi

          if grep -Fq 'session.recents()' "$SRC/V10CarActivity.java"; then
            echo "ERROR: legacy RECENTS path found."
            exit 1
          fi

          if grep -Fq '"RECENTS"' "$SRC/V10CarActivity.java"; then
            echo "ERROR: legacy RECENTS menu found."
            exit 1
          fi

          if grep -Fq '"2 SCREEN"' "$SRC/V10CarActivity.java"; then
            echo "ERROR: legacy 2 SCREEN menu found."
            exit 1
          fi

          if grep -Fq '"3 SCREEN"' "$SRC/V10CarActivity.java"; then
            echo "ERROR: legacy 3 SCREEN menu found."
            exit 1
          fi

          if grep -Fq 'setLayoutModeExternal(' "$SRC/V10CarActivity.java"; then
            echo "ERROR: legacy layout mode found."
            exit 1
          fi

          echo "Core/Persistence isolation checks PASSED."

      - name: Verify Floating Touch remained byte-for-byte at method level
        shell: bash
        run: |
          set -euo pipefail

          PAYLOAD=""

          printf '%s' "$PAYLOAD" |
            base64 -d |
            gzip -d > /tmp/verify_floating.py

          python3 /tmp/verify_floating.py \
            /tmp/V10CarActivity.before-home.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

      - name: Compile Java
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace compileDebugJavaWithJavac

      - name: Assemble Home UI V1 APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Locate APK and SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find v10-source -type f -path '*/build/outputs/apk/*/*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          cp "$APK" CarAssistant-V10-Home-UI-V1-Safe.apk

          SHA="$(sha256sum CarAssistant-V10-Home-UI-V1-Safe.apk | awk '{print $1}')"

          echo "APK: CarAssistant-V10-Home-UI-V1-Safe.apk"
          echo "SHA256: $SHA"

          printf '%s\n' "$SHA" > CarAssistant-V10-Home-UI-V1-Safe.sha256

      - name: Create Home UI manifest
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\n' \
            'CarAssistant V10 Home UI V1 Safe' \
            '' \
            'SOURCE: Stable Base V1 that passed Android Auto testing.' \
            'NO previous Home UI workflow was reused.' \
            '' \
            'UI CHANGES:' \
            '- Removed top bar / CA / CarAssistant / Clock / Date display.' \
            '- Removed NAV / Media / Home quick cards.' \
            '- Transparent left sidebar.' \
            '- App Menu.' \
            '- Three customizable favorite apps.' \
            '- Voice Assistant button.' \
            '- Tasks button with maximum four tracked projected tasks.' \
            '- Center MAP / NAVIGATION preview.' \
            '- Transparent bottom traffic warning area.' \
            '- WYN+ launcher bridge uses package com.wynauto.wyn.' \
            '- Shared media transport controls.' \
            '' \
            'PROTECTED:' \
            '- V10DisplayController unchanged.' \
            '- V10SurfaceManager unchanged.' \
            '- V10TaskSession unchanged.' \
            '- V10ProjectionSession unchanged.' \
            '- V10SessionStore unchanged.' \
            '- Floating Touch methods unchanged.' \
            '' \
            'IMPORTANT:' \
            'WYN live-data extraction is not guessed or faked in this V1.' \
            'The WYN button opens the installed WYN application safely.' \
            > Home-UI-V1-MANIFEST.txt

      - name: Upload Home UI V1
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Home-UI-V1-Safe
          path: |
            CarAssistant-V10-Home-UI-V1-Safe.apk
            CarAssistant-V10-Home-UI-V1-Safe.sha256
            Home-UI-V1-MANIFEST.txt
          if-no-files-found: error
          retention-days: 14
