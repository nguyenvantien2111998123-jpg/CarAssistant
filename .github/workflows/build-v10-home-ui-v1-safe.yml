name: Build CarAssistant V10 Display Core V1 Home UI V1 SAFE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install PyYAML
        shell: bash
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: Rebuild exact Display Core V1
        shell: bash
        run: |
          set -euo pipefail

          python3 -c 'from pathlib import Path; import subprocess,yaml; d=yaml.safe_load(Path(".github/workflows/build-v10-display-core-v1.yml").read_text(encoding="utf-8")); steps=d["jobs"]["build"]["steps"]; selected=[]; \
          [selected.append(x) or (x.get("name")=="Build V10 Display Core V1" and (_ for _ in ()).throw(SystemExit(0))) for x in steps if "run" in x and not x.get("uses")]'

      - name: Rebuild Display Core V1 from source workflow
        shell: bash
        run: |
          set -euo pipefail

          python3 -c 'from pathlib import Path; import subprocess,yaml; d=yaml.safe_load(Path(".github/workflows/build-v10-display-core-v1.yml").read_text(encoding="utf-8")); steps=d["jobs"]["build"]["steps"]; \
          [subprocess.run(["bash","-euo","pipefail","-c",x["run"]],check=True) for x in steps if "run" in x and not x.get("uses") and not (x.get("name")=="Build V10 Display Core V1")]'

          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java

      - name: Apply the proven Floating Touch source
        shell: bash
        run: |
          set -euo pipefail

          PATCH=".github/workflows/build-v10-display-core-v1-floating-touch-fixed.yml"
          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          test -f "$PATCH"
          test -f "$FILE"

          python3 -c 'from pathlib import Path; import subprocess,sys,yaml; d=yaml.safe_load(Path(sys.argv[1]).read_text(encoding="utf-8")); s=next(x for x in d["jobs"]["build"]["steps"] if x.get("name")=="Patch V10CarActivity with Floating Touch only"); subprocess.run(["bash","-euo","pipefail","-c",s["run"]],check=True)' "$PATCH"

      - name: Apply SAFE long-press Floating Touch
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 -c 'from pathlib import Path; p=Path("'"$FILE"'"); s=p.read_text(encoding="utf-8"); \
          s=s.replace(r"\n    private void createFloatingTouchKey()","    private void createFloatingTouchKey()",1); \
          p.write_text(s,encoding="utf-8")'

          grep -Fq "private TextView floatingTouchKey;" "$FILE"
          grep -Fq "private void createFloatingTouchKey()" "$FILE"
          grep -Fq "floatingDownTime" "$FILE"
          grep -Fq "ViewConfiguration.getLongPressTimeout()" "$FILE"

          echo "Stable Base Floating Touch markers verified."

      - name: Snapshot Stable Base V1 protected files
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          for FILE in \
            V10DisplayController.java \
            V10SurfaceManager.java \
            V10TaskSession.java \
            V10ProjectionSession.java \
            V10SessionStore.java
          do
            test -f "$SRC/$FILE"
          done

          sha256sum \
            "$SRC/V10DisplayController.java" \
            "$SRC/V10SurfaceManager.java" \
            "$SRC/V10TaskSession.java" \
            "$SRC/V10ProjectionSession.java" \
            "$SRC/V10SessionStore.java" \
            > /tmp/stable-base-v1.sha256

          cp "$SRC/V10CarActivity.java" /tmp/V10CarActivity.before-home.java

          echo "Stable Base V1 snapshot created."

      - name: Verify Stable Base V1 before Home UI
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          grep -Fq "DisplayManager" "$SRC/V10DisplayController.java"
          grep -Fq "createVirtualDisplay" "$SRC/V10DisplayController.java"
          grep -Fq "virtualDisplay.setSurface(null)" "$SRC/V10DisplayController.java"
          grep -Fq -- "--activity-reorder-to-front" "$SRC/V10DisplayController.java"

          grep -Fq "launchNewTask" "$SRC/V10ProjectionSession.java"
          grep -Fq "resumeExistingTask" "$SRC/V10ProjectionSession.java"
          grep -Fq "RootShellSession" "$SRC/V10ProjectionSession.java"
          grep -Fq "State.HIDDEN" "$SRC/V10ProjectionSession.java"

          grep -Fq "enum State" "$SRC/V10TaskSession.java"
          grep -Fq "ACTIVE" "$SRC/V10TaskSession.java"
          grep -Fq "HIDDEN" "$SRC/V10TaskSession.java"

          grep -Fq "private TextView floatingTouchKey;" "$SRC/V10CarActivity.java"
          grep -Fq "createFloatingTouchKey()" "$SRC/V10CarActivity.java"
          grep -Fq "floatingDownTime" "$SRC/V10CarActivity.java"
          grep -Fq "ViewConfiguration.getLongPressTimeout()" "$SRC/V10CarActivity.java"

          if grep -Fq "V10ProjectionService.java" "$SRC/V10ProjectionSession.java"; then
            echo "ERROR: V10-8 ProjectionService leaked into Stable Base."
            exit 1
          fi

          echo "Stable Base V1 verification PASSED."

      - name: Patch Home UI and real application icons
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 -c 'from pathlib import Path; import re; p=Path("'"$FILE"'"); s=p.read_text(encoding="utf-8");

          old="import android.content.pm.ResolveInfo;"
          new="import android.content.pm.ApplicationInfo;\nimport android.content.pm.ResolveInfo;"
          if old not in s: raise SystemExit("ApplicationInfo import marker missing")
          if "import android.content.pm.ApplicationInfo;" not in s:
              s=s.replace(old,new,1)

          old="import android.widget.FrameLayout;"
          new="import android.widget.FrameLayout;\nimport android.widget.ImageView;"
          if old not in s: raise SystemExit("FrameLayout import marker missing")
          if "import android.widget.ImageView;" not in s:
              s=s.replace(old,new,1)

          start=s.find("        LinearLayout header =")
          end=s.find("        LinearLayout content =",start)
          if start < 0 or end < 0:
              raise SystemExit("Home top-bar block not found")
          s=s[:start]+s[end:]

          old="""        TextView icon =
                text(
                        initial(app.name),
                        27,
                        Color.WHITE);

        icon.setGravity(
                Gravity.CENTER);

        tile.addView(
                icon,
                new LinearLayout.LayoutParams(
                        -1,
                        dp(52)));"""

          new="""        ImageView icon =
                new ImageView(this);

        try {
            ApplicationInfo applicationInfo =
                    getPackageManager()
                            .getApplicationInfo(
                                    app.component.getPackageName(),
                                    0);

            icon.setImageDrawable(
                    applicationInfo.loadIcon(
                            getPackageManager()));
        } catch (Throwable ignored) {
            icon.setImageResource(
                    android.R.drawable.sym_def_app_icon);
        }

        icon.setScaleType(
                ImageView.ScaleType.CENTER_INSIDE);

        icon.setPadding(
                dp(8),
                dp(6),
                dp(8),
                dp(6));

        tile.addView(
                icon,
                new LinearLayout.LayoutParams(
                        -1,
                        dp(58)));"""

          if old not in s:
              raise SystemExit("Fake initial-letter icon block not found")

          s=s.replace(old,new,1)

          if "ApplicationInfo.loadIcon" not in s and ".loadIcon(" not in s:
              raise SystemExit("Real application icon loading was not inserted")

          if "initial(app.name)" in s:
              raise SystemExit("Fake initial-letter icon remains")

          p.write_text(s,encoding="utf-8")'

          echo "Home UI + real application icon patch applied."

      - name: Verify Home UI patch only
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"
          FILE="$SRC/V10CarActivity.java"

          grep -Fq "import android.content.pm.ApplicationInfo;" "$FILE"
          grep -Fq "import android.widget.ImageView;" "$FILE"
          grep -Fq "ApplicationInfo" "$FILE"
          grep -Fq "loadIcon(" "$FILE"
          grep -Fq "ImageView.ScaleType.CENTER_INSIDE" "$FILE"

          if grep -Fq "initial(app.name)" "$FILE"; then
            echo "ERROR: fake initial-letter icon still exists."
            exit 1
          fi

          if grep -Fq 'text("CAR ASSISTANT"' "$FILE"; then
            echo "ERROR: old top bar title remains."
            exit 1
          fi

          if grep -Fq "clock =" "$FILE"; then
            echo "ERROR: old Home clock remains."
            exit 1
          fi

          if grep -Fq "date =" "$FILE"; then
            echo "ERROR: old Home date remains."
            exit 1
          fi

          if grep -Fq 'text("SPEED"' "$FILE"; then
            echo "ERROR: old SPEED card remains."
            exit 1
          fi

          if grep -Fq 'text("WEATHER"' "$FILE"; then
            echo "ERROR: old WEATHER card remains."
            exit 1
          fi

          echo "Home UI verification PASSED."

      - name: Verify Core and Persistence were not modified
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          sha256sum \
            "$SRC/V10DisplayController.java" \
            "$SRC/V10SurfaceManager.java" \
            "$SRC/V10TaskSession.java" \
            "$SRC/V10ProjectionSession.java" \
            "$SRC/V10SessionStore.java" \
            > /tmp/home-v1.sha256

          diff -u \
            /tmp/stable-base-v1.sha256 \
            /tmp/home-v1.sha256

          echo "Core/Persistence isolation PASSED."

      - name: Verify Floating Touch remained intact
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq "private TextView floatingTouchKey;" "$FILE"
          grep -Fq "private void createFloatingTouchKey()" "$FILE"
          grep -Fq "floatingDownTime" "$FILE"
          grep -Fq "ViewConfiguration.getLongPressTimeout()" "$FILE"

          if grep -Fq "floatingLastTap" "$FILE"; then
            echo "ERROR: old double-tap implementation returned."
            exit 1
          fi

          echo "Floating Touch integrity PASSED."

      - name: Compile Java
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace compileDebugJavaWithJavac

      - name: Assemble APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Locate APK and SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find v10-source \
            -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            -print -quit)"

          test -n "$APK"
          test -f "$APK"

          cp "$APK" CarAssistant-V10-Display-Core-V1-Home-UI-V1-Safe.apk

          SHA="$(sha256sum \
            CarAssistant-V10-Display-Core-V1-Home-UI-V1-Safe.apk |
            awk '{print $1}')"

          echo "APK:"
          echo "CarAssistant-V10-Display-Core-V1-Home-UI-V1-Safe.apk"

          echo "SHA256:"
          echo "$SHA"

          printf '%s\n' "$SHA" \
            > CarAssistant-V10-Display-Core-V1-Home-UI-V1-Safe.sha256

      - name: Create build manifest
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\n' \
            'CarAssistant V10 Display Core V1 - Home UI V1 SAFE' \
            '' \
            'SOURCE: Stable Base V1' \
            'Home UI is patched directly after Stable Base reconstruction.' \
            'Previous Home UI payload workflow is NOT reused.' \
            '' \
            'HOME UI:' \
            '- Removed top bar.' \
            '- Removed CA / CarAssistant title.' \
            '- Removed clock and date from Home.' \
            '- Preserved projection engine.' \
            '- Preserved Floating Touch.' \
            '' \
            'APPLICATION ICONS:' \
            '- Uses ApplicationInfo.loadIcon(PackageManager).' \
            '- Uses real installed application icons.' \
            '- Uses Android default icon only as fallback.' \
            '' \
            'PROTECTED:' \
            '- V10DisplayController unchanged.' \
            '- V10SurfaceManager unchanged.' \
            '- V10TaskSession unchanged.' \
            '- V10ProjectionSession unchanged.' \
            '- V10SessionStore unchanged.' \
            '' \
            'BUILD:' \
            '- compileDebugJavaWithJavac' \
            '- assembleDebug' \
            > Home-UI-V1-SAFE-MANIFEST.txt

      - name: Upload APK and manifest
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Display-Core-V1-Home-UI-V1-Safe
          path: |
            CarAssistant-V10-Display-Core-V1-Home-UI-V1-Safe.apk
            CarAssistant-V10-Display-Core-V1-Home-UI-V1-Safe.sha256
            Home-UI-V1-SAFE-MANIFEST.txt
          if-no-files-found: error
          retention-days: 14
