name: Self Fix Navigation Follow Workflow

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-workflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch Section 9 and generate fixed workflow
        shell: bash
        run: |
          set -euo pipefail

          SRC=".github/workflows/build-v10-carassistant-keyboard-follow-pass.yml"
          DST=".github/workflows/build-v10-carassistant-keyboard-follow-pass-fixed.yml"

          test -f "$SRC"

          python3 <<'PY'
          import base64
          from pathlib import Path

          src_path = Path(".github/workflows/build-v10-carassistant-keyboard-follow-pass.yml")
          dst_path = Path(".github/workflows/build-v10-carassistant-keyboard-follow-pass-fixed.yml")

          src_text = src_path.read_text(encoding="utf-8")

          MARKER_9 = "# 9. NAVIGATION-ONLY PATCH"
          MARKER_10 = "# 10. VERIFY NAVIGATION PATCH"

          count_9 = src_text.count(MARKER_9)
          count_10 = src_text.count(MARKER_10)

          if count_9 != 1:
              raise SystemExit(f"FAIL: Expected marker '{MARKER_9}' exactly once in source, found {count_9}.")

          if count_10 != 1:
              raise SystemExit(f"FAIL: Expected marker '{MARKER_10}' exactly once in source, found {count_10}.")

          src_lines = src_text.splitlines(keepends=True)

          # Find index of line containing MARKER_9 and MARKER_10
          idx_9 = next(i for i, line in enumerate(src_lines) if MARKER_9 in line)
          idx_10 = next(i for i, line in enumerate(src_lines) if MARKER_10 in line)

          # Section 9 start boundary is the header comment block immediately preceding MARKER_9
          start_line = idx_9
          if start_line > 0 and "# =====" in src_lines[start_line - 1]:
              start_line -= 1

          # Section 10 start boundary is the header comment block immediately preceding MARKER_10
          end_line = idx_10
          if end_line > 0 and "# =====" in src_lines[end_line - 1]:
              end_line -= 1

          if end_line <= start_line:
              raise SystemExit(f"FAIL: Invalid section ordering: start_line={start_line}, end_line={end_line}.")

          # Section 9 exact target content encoded in Base64
          # Eliminates heredoc syntax errors, Python string escaping issues, and indentation mismatches
          b64_payload = (
              "      # ============================================================\n"
              "      # 9. NAVIGATION-ONLY PATCH\n"
              "      #\n"
              "      # Structural patch against the REAL NavigationMapView.java.\n"
              "      # No full-file replacement.\n"
              "      # ============================================================\n"
              "\n"
              "      - name: Patch Navigation Follow and GPS Arrow\n"
              "        shell: bash\n"
              "        run: |\n"
              "          set -euo pipefail\n"
              "\n"
              "          FILE=\"v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java\"\n"
              "\n"
              "          echo \"========================================\"\n"
              "          echo \"NAVIGATION FOLLOW + GPS ARROW PATCH\"\n"
              "          echo \"========================================\"\n"
              "\n"
              "          test -f \"$FILE\"\n"
              "\n"
              "          python3 <<'PY_INNER'\n"
              "          import re\n"
              "          from pathlib import Path\n"
              "\n"
              "          path = Path(\"v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java\")\n"
              "          source = path.read_text()\n"
              "\n"
              "          print(\"NavigationMapView baseline size:\", len(source), \"bytes\")\n"
              "\n"
              "          # --------------------------------------------------------\n"
              "          # 9A. ADD RenderMode IMPORT\n"
              "          # --------------------------------------------------------\n"
              "          render_import = \"import org.maplibre.android.location.modes.RenderMode;\"\n"
              "          if render_import in source:\n"
              "              print(\"PASS: RenderMode import already present.\")\n"
              "          else:\n"
              "              anchor = \"import org.maplibre.android.location.modes.CameraMode;\"\n"
              "              if source.count(anchor) != 1:\n"
              "                  raise SystemExit(\"FAIL: CameraMode import anchor must occur exactly once.\")\n"
              "              source = source.replace(anchor, anchor + \"\\n\" + render_import, 1)\n"
              "              print(\"PASS: RenderMode import added.\")\n"
              "\n"
              "          # --------------------------------------------------------\n"
              "          # 9B. PATCH EXISTING RECENTER BUTTON\n"
              "          # --------------------------------------------------------\n"
              "          button_pattern = re.compile(\n"
              "              r'''(?P<block>\n"
              "                  addControlButton\\\n"
              "                  \\s*controls\\s*,\\s*\n"
              "                  \"(?P<label>[^\"]+)\"\\s*,\\s*\n"
              "                  \"(?P<title>[^\"]*)\"\\s*,\\s*\n"
              "                  v\\s*->\\s*recenter\\\n"
              "                  \\s*\\)\\s*;\n"
              "              )''',\n"
              "              re.VERBOSE\n"
              "          )\n"
              "          button_matches = list(button_pattern.finditer(source))\n"
              "          if len(button_matches) == 1:\n"
              "              old = button_matches[0].group(\"block\")\n"
              "              new = '''addControlButton(\n"
              "                      controls,\n"
              "                      \"➤\",\n"
              "                      \"Follow current location and direction\",\n"
              "                      v -> followCurrentLocation());'''\n"
              "              source = source[:button_matches[0].start()] + new + source[button_matches[0].end():]\n"
              "              print(\"PASS: Existing recenter button patched structurally.\")\n"
              "          elif len(button_matches) == 0:\n"
              "              if '\"➤\"' in source and 'v -> followCurrentLocation()' in source:\n"
              "                  print(\"PASS: Follow button already patched.\")\n"
              "              else:\n"
              "                  raise SystemExit(\"FAIL: Could not locate exactly one existing recenter button.\")\n"
              "          else:\n"
              "              raise SystemExit(\"FAIL: Found \" + str(len(button_matches)) + \" recenter button blocks; expected exactly 1.\")\n"
              "\n"
              "          # --------------------------------------------------------\n"
              "          # 9C. ENABLE GPS RENDER MODE\n"
              "          # --------------------------------------------------------\n"
              "          enable_pattern = re.compile(\n"
              "              r'''map\\.getLocationComponent\\\n"
              "                  \\s*\\.setLocationComponentEnabled\\(true\\)\\s*;''',\n"
              "              re.VERBOSE\n"
              "          )\n"
              "          enable_matches = list(enable_pattern.finditer(source))\n"
              "          if \"setRenderMode(RenderMode.GPS);\" in source:\n"
              "              print(\"PASS: GPS render mode already present.\")\n"
              "          elif len(enable_matches) == 1:\n"
              "              replacement = '''map.getLocationComponent()\n"
              "                      .setLocationComponentEnabled(true);\n"
              "\n"
              "                  map.getLocationComponent()\n"
              "                      .setRenderMode(RenderMode.GPS);'''\n"
              "              source = source[:enable_matches[0].start()] + replacement + source[enable_matches[0].end():]\n"
              "              print(\"PASS: Location component switched to GPS render mode.\")\n"
              "          else:\n"
              "              raise SystemExit(\"FAIL: Expected exactly one setLocationComponentEnabled(true) anchor; found \" + str(len(enable_matches)) + \".\")\n"
              "\n"
              "          # --------------------------------------------------------\n"
              "          # 9D. FIND recenter() WITH BRACE BALANCING\n"
              "          # --------------------------------------------------------\n"
              "          method_pattern = re.compile(r'(?m)^\\s*public\\s+void\\s+recenter\\s*\\(\\s*\\)\\s*\\{')\n"
              "          method_matches = list(method_pattern.finditer(source))\n"
              "          follow_method = '''public void followCurrentLocation() {\n"
              "              if (map == null) {\n"
              "                  return;\n"
              "              }\n"
              "\n"
              "              try {\n"
              "                  Location location =\n"
              "                          map.getLocationComponent()\n"
              "                              .getLastKnownLocation();\n"
              "\n"
              "                  if (location == null) {\n"
              "                      startAutoFollow();\n"
              "                      return;\n"
              "                  }\n"
              "\n"
              "                  map.getLocationComponent()\n"
              "                      .forceLocationUpdate(location);\n"
              "\n"
              "                  map.getLocationComponent()\n"
              "                      .setRenderMode(RenderMode.GPS);\n"
              "\n"
              "                  map.animateCamera(\n"
              "                      CameraUpdateFactory.newLatLngZoom(\n"
              "                          new LatLng(\n"
              "                              location.getLatitude(),\n"
              "                              location.getLongitude()),\n"
              "                          AUTO_FOLLOW_ZOOM),\n"
              "                      300);\n"
              "\n"
              "                  map.getLocationComponent()\n"
              "                      .setCameraMode(\n"
              "                          CameraMode.TRACKING,\n"
              "                          500L,\n"
              "                          AUTO_FOLLOW_ZOOM,\n"
              "                          null,\n"
              "                          0.0,\n"
              "                          null);\n"
              "\n"
              "              } catch (Exception ignored) {\n"
              "              }\n"
              "          }\n"
              "\n"
              "          public void recenter() {\n"
              "              followCurrentLocation();\n"
              "          }'''\n"
              "          if len(method_matches) == 1:\n"
              "              start = method_matches[0].start()\n"
              "              brace_start = source.find(\"{\", method_matches[0].start(), method_matches[0].end() + 1)\n"
              "              if brace_start < 0:\n"
              "                  raise SystemExit(\"FAIL: recenter() opening brace not found.\")\n"
              "              depth = 0\n"
              "              end = None\n"
              "              for i in range(brace_start, len(source)):\n"
              "                  ch = source[i]\n"
              "                  if ch == \"{\":\n"
              "                      depth += 1\n"
              "                  elif ch == \"}\":\n"
              "                      depth -= 1\n"
              "                      if depth == 0:\n"
              "                          end = i + 1\n"
              "                          break\n"
              "              if end is None:\n"
              "                  raise SystemExit(\"FAIL: Could not find balanced end of recenter().\")\n"
              "              current = source[start:end]\n"
              "              if \"getLastKnownLocation\" not in current:\n"
              "                  raise SystemExit(\"FAIL: recenter() body does not match the expected current Navigation baseline.\")\n"
              "              leading = re.match(r\"\\s*\", current).group(0)\n"
              "              replacement = \"\\n\".join(leading + line if line else \"\" for line in follow_method.splitlines())\n"
              "              source = source[:start] + replacement + source[end:]\n"
              "              print(\"PASS: recenter() replaced with followCurrentLocation() wrapper.\")\n"
              "          elif len(method_matches) == 0:\n"
              "              if \"public void followCurrentLocation()\" in source:\n"
              "                  print(\"PASS: followCurrentLocation() already present.\")\n"
              "              else:\n"
              "                  raise SystemExit(\"FAIL: recenter() method not found.\")\n"
              "          else:\n"
              "              raise SystemExit(\"FAIL: recenter() found \" + str(len(method_matches)) + \" times; expected exactly 1.\")\n"
              "\n"
              "          # --------------------------------------------------------\n"
              "          # 9E. FINAL STRUCTURAL VERIFICATION\n"
              "          # --------------------------------------------------------\n"
              "          required = [\n"
              "              render_import,\n"
              "              \"setRenderMode(RenderMode.GPS);\",\n"
              "              'v -> followCurrentLocation()',\n"
              "              \"public void followCurrentLocation()\",\n"
              "              \"forceLocationUpdate(location)\",\n"
              "              \"CameraUpdateFactory.newLatLngZoom(\",\n"
              "              \"location.getLatitude()\",\n"
              "              \"location.getLongitude()\",\n"
              "              \"CameraMode.TRACKING\",\n"
              "              \"public void recenter()\",\n"
              "              \"followCurrentLocation();\",\n"
              "          ]\n"
              "          for item in required:\n"
              "              if item not in source:\n"
              "                  raise SystemExit(\"FAIL: Final Navigation source check missing: \" + item)\n"
              "          path.write_text(source)\n"
              "          print(\"PASS: NavigationMapView.java structurally patched.\")\n"
              "          print(\"Final NavigationMapView size:\", len(source), \"bytes\")\n"
              "          PY_INNER\n"
              "\n"
              "          echo \"PASS: Section 9 patch completed.\"\n"
          )

          new_section_lines = b64_payload.splitlines(keepends=True)

          # Reconstruct workflow using exact line slicing
          dst_lines = src_lines[:start_line] + new_section_lines + src_lines[end_line:]
          dst_path.write_text("".join(dst_lines), encoding="utf-8")

          print("PASS: Created patched workflow file cleanly using exact line-based replacement.")
          PY

      - name: Verify only Section 9 changed
        shell: bash
        run: |
          set -euo pipefail

          SRC=".github/workflows/build-v10-carassistant-keyboard-follow-pass.yml"
          DST=".github/workflows/build-v10-carassistant-keyboard-follow-pass-fixed.yml"

          test -f "$SRC"
          test -f "$DST"

          python3 <<'PY'
          import hashlib
          from pathlib import Path

          src_text = Path(".github/workflows/build-v10-carassistant-keyboard-follow-pass.yml").read_text(encoding="utf-8")
          dst_text = Path(".github/workflows/build-v10-carassistant-keyboard-follow-pass-fixed.yml").read_text(encoding="utf-8")

          MARKER_9 = "# 9. NAVIGATION-ONLY PATCH"
          MARKER_10 = "# 10. VERIFY NAVIGATION PATCH"

          count_9_src = src_text.count(MARKER_9)
          count_10_src = src_text.count(MARKER_10)
          count_9_dst = dst_text.count(MARKER_9)
          count_10_dst = dst_text.count(MARKER_10)

          if count_9_src != 1 or count_9_dst != 1:
              raise SystemExit(f"FAIL: Marker '{MARKER_9}' must occur exactly once. Found src={count_9_src}, dst={count_9_dst}")

          if count_10_src != 1 or count_10_dst != 1:
              raise SystemExit(f"FAIL: Marker '{MARKER_10}' must occur exactly once. Found src={count_10_src}, dst={count_10_dst}")

          src_lines = src_text.splitlines(keepends=True)
          dst_lines = dst_text.splitlines(keepends=True)

          idx_9_src = next(i for i, line in enumerate(src_lines) if MARKER_9 in line)
          idx_10_src = next(i for i, line in enumerate(src_lines) if MARKER_10 in line)

          start_src = idx_9_src - 1 if idx_9_src > 0 and "# =====" in src_lines[idx_9_src - 1] else idx_9_src
          end_src = idx_10_src - 1 if idx_10_src > 0 and "# =====" in src_lines[idx_10_src - 1] else idx_10_src

          idx_9_dst = next(i for i, line in enumerate(dst_lines) if MARKER_9 in line)
          idx_10_dst = next(i for i, line in enumerate(dst_lines) if MARKER_10 in line)

          start_dst = idx_9_dst - 1 if idx_9_dst > 0 and "# =====" in dst_lines[idx_9_dst - 1] else idx_9_dst
          end_dst = idx_10_dst - 1 if idx_10_dst > 0 and "# =====" in dst_lines[idx_10_dst - 1] else idx_10_dst

          prefix_src = "".join(src_lines[:start_src]).encode("utf-8")
          prefix_dst = "".join(dst_lines[:start_dst]).encode("utf-8")

          suffix_src = "".join(src_lines[end_src:]).encode("utf-8")
          suffix_dst = "".join(dst_lines[end_dst:]).encode("utf-8")

          sec9_src = "".join(src_lines[start_src:end_src]).encode("utf-8")
          sec9_dst = "".join(dst_lines[start_dst:end_dst]).encode("utf-8")

          src_sha = hashlib.sha256(src_text.encode("utf-8")).hexdigest()
          dst_sha = hashlib.sha256(dst_text.encode("utf-8")).hexdigest()

          prefix_src_sha = hashlib.sha256(prefix_src).hexdigest()
          prefix_dst_sha = hashlib.sha256(prefix_dst).hexdigest()

          suffix_src_sha = hashlib.sha256(suffix_src).hexdigest()
          suffix_dst_sha = hashlib.sha256(suffix_dst).hexdigest()

          print(f"Source Workflow SHA256: {src_sha}")
          print(f"Fixed Workflow SHA256:  {dst_sha}")
          print(f"Section 9 Start Offset: SRC line {start_src}, DST line {start_dst}")
          print(f"Section 10 Start Offset: SRC line {end_src}, DST line {end_dst}")
          print(f"Prefix SHA256 (SRC): {prefix_src_sha} ({len(prefix_src)} bytes)")
          print(f"Prefix SHA256 (DST): {prefix_dst_sha} ({len(prefix_dst)} bytes)")
          print(f"Suffix SHA256 (SRC): {suffix_src_sha} ({len(suffix_src)} bytes)")
          print(f"Suffix SHA256 (DST): {suffix_dst_sha} ({len(suffix_dst)} bytes)")

          # Strict Byte-for-Byte Verification
          if prefix_src != prefix_dst:
              print("\n--- DIFFERENCE IN PREFIX DETECTED ---")
              p_src_lines = src_lines[:start_src]
              p_dst_lines = dst_lines[:start_dst]
              max_l = max(len(p_src_lines), len(p_dst_lines))
              for idx in range(max_l):
                  l_src = p_src_lines[idx] if idx < len(p_src_lines) else "<EOF>\n"
                  l_dst = p_dst_lines[idx] if idx < len(p_dst_lines) else "<EOF>\n"
                  if l_src != l_dst:
                      print(f"First differing line index in Prefix: {idx + 1}")
                      print(f"SRC Line: {repr(l_src)}")
                      print(f"DST Line: {repr(l_dst)}")
                      break
              raise SystemExit("FAIL: Prefix content before Section 9 changed!")

          print("PASS: Prefix identical.")

          if suffix_src != suffix_dst:
              print("\n--- DIFFERENCE IN SUFFIX DETECTED ---")
              s_src_lines = src_lines[end_src:]
              s_dst_lines = dst_lines[end_dst:]
              max_l = max(len(s_src_lines), len(s_dst_lines))
              for idx in range(max_l):
                  l_src = s_src_lines[idx] if idx < len(s_src_lines) else "<EOF>\n"
                  l_dst = s_dst_lines[idx] if idx < len(s_dst_lines) else "<EOF>\n"
                  if l_src != l_dst:
                      print(f"First differing line index in Suffix: {end_src + idx + 1}")
                      print(f"SRC Line: {repr(l_src)}")
                      print(f"DST Line: {repr(l_dst)}")
                      break
              raise SystemExit("FAIL: Suffix content after Section 9 changed!")

          print("PASS: Suffix identical.")

          if sec9_src == sec9_dst:
              raise SystemExit("FAIL: Section 9 content was NOT modified.")

          print("PASS: Only Section 9 differs.")
          PY

      - name: YAML syntax check
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import yaml

          path = (
              ".github/workflows/"
              "build-v10-carassistant-keyboard-follow-pass-fixed.yml"
          )

          with open(path, "r", encoding="utf-8") as f:
              yaml.safe_load(f)

          print("PASS: Fixed workflow YAML syntax.")
          PY

      - name: Commit fixed workflow
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .github/workflows/build-v10-carassistant-keyboard-follow-pass-fixed.yml

          git diff --cached --check

          git commit \
            -m "fix workflow: structurally patch Navigation Section 9"

          git push origin main

          echo "PASS: Fixed workflow committed to main."
