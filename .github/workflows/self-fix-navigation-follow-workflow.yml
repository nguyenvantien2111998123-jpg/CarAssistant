name: Self Fix Navigation Follow Workflow

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-workflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Write Section 9 patch content
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          encoded_section = (
              "      # ============================================================"
              "\n      # 9. NAVIGATION-ONLY PATCH"
              "\n      #"
              "\n      # Structural patch against the REAL NavigationMapView.java."
              "\n      # No full-file replacement."
              "\n      # ============================================================"
              "\n"
              "\n      - name: Patch Navigation Follow and GPS Arrow"
              "\n        shell: bash"
              "\n        run: |"
              "\n          set -euo pipefail"
              "\n"
              "\n          FILE=\"v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java\""
              "\n"
              "\n          echo \"========================================\""
              "\n          echo \"NAVIGATION FOLLOW + GPS ARROW PATCH\""
              "\n          echo \"========================================\""
              "\n"
              "\n          test -f \"$FILE\""
              "\n"
              "\n          python3 <<'PY_INNER'"
              "\n          import re"
              "\n          from pathlib import Path"
              "\n"
              "\n          path = Path("
              "\n              \"v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java\""
              "\n          )"
              "\n"
              "\n          source = path.read_text()"
              "\n"
              "\n          print(\"NavigationMapView baseline size:\", len(source), \"bytes\")"
              "\n"
              "\n          # --------------------------------------------------------"
              "\n          # 9A. ADD RenderMode IMPORT"
              "\n          # --------------------------------------------------------"
              "\n"
              "\n          render_import = ("
              "\n              \"import org.maplibre.android.location.modes.RenderMode;\""
              "\n          )"
              "\n"
              "\n          if render_import in source:"
              "\n              print(\"PASS: RenderMode import already present.\")"
              "\n          else:"
              "\n              anchor = ("
              "\n                  \"import org.maplibre.android.location.modes.CameraMode;\""
              "\n              )"
              "\n"
              "\n              if source.count(anchor) != 1:"
              "\n                  raise SystemExit("
              "\n                      \"FAIL: CameraMode import anchor must occur exactly once.\""
              "\n                  )"
              "\n"
              "\n              source = source.replace("
              "\n                  anchor,"
              "\n                  anchor + \"\\n\" + render_import,"
              "\n                  1"
              "\n              )"
              "\n"
              "\n              print(\"PASS: RenderMode import added.\")"
              "\n"
              "\n          # --------------------------------------------------------"
              "\n          # 9B. PATCH EXISTING RECENTER BUTTON"
              "\n          # --------------------------------------------------------"
              "\n"
              "\n          button_pattern = re.compile("
              "\n              r'''(?P<block>"
              "\n                  addControlButton\\("
              "\n                  \\s*controls\\s*,\\s*"
              "\n                  \"(?P<label>[^\"]+)\"\\s*,\\s*"
              "\n                  \"(?P<title>[^\"]*)\"\\s*,\\s*"
              "\n                  v\\s*->\\s*recenter\\(\\)"
              "\n                  \\s*\\)\\s*;"
              "\n              )''',"
              "\n              re.VERBOSE"
              "\n          )"
              "\n"
              "\n          button_matches = list("
              "\n              button_pattern.finditer(source)"
              "\n          )"
              "\n"
              "\n          if len(button_matches) == 1:"
              "\n"
              "\n              old = button_matches[0].group(\"block\")"
              "\n"
              "\n              new = '''addControlButton("
              "\n                      controls,"
              "\n                      \"➤\","
              "\n                      \"Follow current location and direction\","
              "\n                      v -> followCurrentLocation());'''"
              "\n"
              "\n              source = ("
              "\n                  source[:button_matches[0].start()]"
              "\n                  + new"
              "\n                  + source[button_matches[0].end():]"
              "\n              )"
              "\n"
              "\n              print("
              "\n                  \"PASS: Existing recenter button patched structurally.\""
              "\n              )"
              "\n"
              "\n          elif len(button_matches) == 0:"
              "\n"
              "\n              if ("
              "\n                  '\"➤\"' in source"
              "\n                  and"
              "\n                  'v -> followCurrentLocation()' in source"
              "\n              ):"
              "\n                  print(\"PASS: Follow button already patched.\")"
              "\n              else:"
              "\n                  raise SystemExit("
              "\n                      \"FAIL: Could not locate exactly one existing \""
              "\n                      \"recenter button.\""
              "\n                  )"
              "\n"
              "\n          else:"
              "\n              raise SystemExit("
              "\n                  \"FAIL: Found \""
              "\n                  + str(len(button_matches))"
              "\n                  + \" recenter button blocks; expected exactly 1.\""
              "\n              )"
              "\n"
              "\n          # --------------------------------------------------------"
              "\n          # 9C. ENABLE GPS RENDER MODE"
              "\n          # --------------------------------------------------------"
              "\n"
              "\n          enable_pattern = re.compile("
              "\n              r'''map\\.getLocationComponent\\(\\)"
              "\n                  \\s*\\.setLocationComponentEnabled\\(true\\)\\s*;''',"
              "\n              re.VERBOSE"
              "\n          )"
              "\n"
              "\n          enable_matches = list("
              "\n              enable_pattern.finditer(source)"
              "\n          )"
              "\n"
              "\n          if \"setRenderMode(RenderMode.GPS);\" in source:"
              "\n"
              "\n              print("
              "\n                  \"PASS: GPS render mode already present.\""
              "\n              )"
              "\n"
              "\n          elif len(enable_matches) == 1:"
              "\n"
              "\n              replacement = '''map.getLocationComponent()"
              "\n                      .setLocationComponentEnabled(true);"
              "\n"
              "\n                  map.getLocationComponent()"
              "\n                      .setRenderMode(RenderMode.GPS);'''"
              "\n"
              "\n              source = ("
              "\n                  source[:enable_matches[0].start()]"
              "\n                  + replacement"
              "\n                  + source[enable_matches[0].end():]"
              "\n              )"
              "\n"
              "\n              print("
              "\n                  \"PASS: Location component switched to GPS render mode.\""
              "\n              )"
              "\n"
              "\n          else:"
              "\n              raise SystemExit("
              "\n                  \"FAIL: Expected exactly one \""
              "\n                  \"setLocationComponentEnabled(true) anchor; found \""
              "\n                  + str(len(enable_matches))"
              "\n                  + \".\""
              "\n              )"
              "\n"
              "\n          # --------------------------------------------------------"
              "\n          # 9D. FIND recenter() WITH BRACE BALANCING"
              "\n          # --------------------------------------------------------"
              "\n"
              "\n          method_pattern = re.compile("
              "\n              r'(?m)^\\s*public\\s+void\\s+recenter\\s*\\(\\s*\\)\\s*\\{'"
              "\n          )"
              "\n"
              "\n          method_matches = list("
              "\n              method_pattern.finditer(source)"
              "\n          )"
              "\n"
              "\n          follow_method = '''public void followCurrentLocation() {"
              "\n              if (map == null) {"
              "\n                  return;"
              "\n              }"
              "\n"
              "\n              try {"
              "\n                  Location location ="
              "\n                          map.getLocationComponent()"
              "\n                              .getLastKnownLocation();"
              "\n"
              "\n                  if (location == null) {"
              "\n                      startAutoFollow();"
              "\n                      return;"
              "\n                  }"
              "\n"
              "\n                  map.getLocationComponent()"
              "\n                      .forceLocationUpdate(location);"
              "\n"
              "\n                  map.getLocationComponent()"
              "\n                      .setRenderMode(RenderMode.GPS);"
              "\n"
              "\n                  map.animateCamera("
              "\n                      CameraUpdateFactory.newLatLngZoom("
              "\n                          new LatLng("
              "\n                              location.getLatitude(),"
              "\n                              location.getLongitude()),"
              "\n                          AUTO_FOLLOW_ZOOM),"
              "\n                      300);"
              "\n"
              "\n                  map.getLocationComponent()"
              "\n                      .setCameraMode("
              "\n                          CameraMode.TRACKING,"
              "\n                          500L,"
              "\n                          AUTO_FOLLOW_ZOOM,"
              "\n                          null,"
              "\n                          0.0,"
              "\n                          null);"
              "\n"
              "\n              } catch (Exception ignored) {"
              "\n              }"
              "\n          }"
              "\n"
              "\n          public void recenter() {"
              "\n              followCurrentLocation();"
              "\n          }'''"
              "\n"
              "\n          if len(method_matches) == 1:"
              "\n"
              "\n              start = method_matches[0].start()"
              "\n"
              "\n              brace_start = source.find("
              "\n                  \"{\","
              "\n                  method_matches[0].start(),"
              "\n                  method_matches[0].end() + 1"
              "\n              )"
              "\n"
              "\n              if brace_start < 0:"
              "\n                  raise SystemExit("
              "\n                      \"FAIL: recenter() opening brace not found.\""
              "\n                  )"
              "\n"
              "\n              depth = 0"
              "\n              end = None"
              "\n"
              "\n              for i in range(brace_start, len(source)):"
              "\n"
              "\n                  ch = source[i]"
              "\n"
              "\n                  if ch == \"{\":"
              "\n                      depth += 1"
              "\n"
              "\n                  elif ch == \"}\":"
              "\n                      depth -= 1"
              "\n"
              "\n                      if depth == 0:"
              "\n                          end = i + 1"
              "\n                          break"
              "\n"
              "\n              if end is None:"
              "\n                  raise SystemExit("
              "\n                      \"FAIL: Could not find balanced end of recenter().\""
              "\n                  )"
              "\n"
              "\n              current = source[start:end]"
              "\n"
              "\n              if \"getLastKnownLocation\" not in current:"
              "\n                  raise SystemExit("
              "\n                      \"FAIL: recenter() body does not match \""
              "\n                      \"the expected current Navigation baseline.\""
              "\n                  )"
              "\n"
              "\n              leading = re.match("
              "\n                  r\"\\s*\","
              "\n                  current"
              "\n              ).group(0)"
              "\n"
              "\n              replacement = \"\\n\".join("
              "\n                  leading + line if line else \"\""
              "\n                  for line in follow_method.splitlines()"
              "\n              )"
              "\n"
              "\n              source = ("
              "\n                  source[:start]"
              "\n                  + replacement"
              "\n                  + source[end:]"
              "\n              )"
              "\n"
              "\n              print("
              "\n                  \"PASS: recenter() replaced with \""
              "\n                  \"followCurrentLocation() wrapper.\""
              "\n              )"
              "\n"
              "\n          elif len(method_matches) == 0:"
              "\n"
              "\n              if \"public void followCurrentLocation()\" in source:"
              "\n                  print("
              "\n                      \"PASS: followCurrentLocation() already present.\""
              "\n                  )"
              "\n              else:"
              "\n                  raise SystemExit("
              "\n                      \"FAIL: recenter() method not found.\""
              "\n                  )"
              "\n"
              "\n          else:"
              "\n              raise SystemExit("
              "\n                  \"FAIL: recenter() found \""
              "\n                  + str(len(method_matches))"
              "\n                  + \" times; expected exactly 1.\""
              "\n              )"
              "\n"
              "\n          # --------------------------------------------------------"
              "\n          # 9E. FINAL STRUCTURAL VERIFICATION"
              "\n          # --------------------------------------------------------"
              "\n"
              "\n          required = ["
              "\n              render_import,"
              "\n              \"setRenderMode(RenderMode.GPS);\",\n"
              "\n              'v -> followCurrentLocation()',"
              "\n              \"public void followCurrentLocation()\","
              "\n              \"forceLocationUpdate(location)\","
              "\n              \"CameraUpdateFactory.newLatLngZoom(\","
              "\n              \"location.getLatitude()\","
              "\n              \"location.getLongitude()\","
              "\n              \"CameraMode.TRACKING\","
              "\n              \"public void recenter()\","
              "\n              \"followCurrentLocation();\","
              "\n          ]"
              "\n"
              "\n          for item in required:"
              "\n"
              "\n              if item not in source:"
              "\n                  raise SystemExit("
              "\n                      \"FAIL: Final Navigation source check missing: \""
              "\n                      + item"
              "\n                  )"
              "\n"
              "\n          path.write_text(source)"
              "\n"
              "\n          print("
              "\n              \"PASS: NavigationMapView.java structurally patched.\""
              "\n          )"
              "\n"
              "\n          print("
              "\n              \"Final NavigationMapView size:\","
              "\n              len(source),"
              "\n              \"bytes\""
              "\n          )"
              "\n          PY_INNER"
              "\n"
              "\n          echo \"PASS: Section 9 patch completed.\""
              "\n      # ============================================================"
              "\n"
          )

          Path("/tmp/navigation-section.txt").write_text(encoded_section, encoding="utf-8")
          print("PASS: Written /tmp/navigation-section.txt cleanly via Python.")
          PY

      - name: Patch only Section 9
        shell: bash
        run: |
          set -euo pipefail

          SRC=".github/workflows/build-v10-carassistant-keyboard-follow-pass.yml"
          DST=".github/workflows/build-v10-carassistant-keyboard-follow-pass-fixed.yml"

          test -f "$SRC"
          test -f /tmp/navigation-section.txt

          python3 <<'PY'
          from pathlib import Path

          src_path = Path(
              ".github/workflows/build-v10-carassistant-keyboard-follow-pass.yml"
          )

          dst_path = Path(
              ".github/workflows/build-v10-carassistant-keyboard-follow-pass-fixed.yml"
          )

          section9_path = Path("/tmp/navigation-section.txt")

          source = src_path.read_text()
          new_section = section9_path.read_text()

          START = "      # 9. NAVIGATION-ONLY PATCH"
          END = "      # 10. VERIFY NAVIGATION PATCH"

          start = source.find(START)
          end = source.find(END)

          if start < 0:
              raise SystemExit(
                  "FAIL: Section 9 start marker not found."
              )

          if end < 0:
              raise SystemExit(
                  "FAIL: Section 10 marker not found."
              )

          if end <= start:
              raise SystemExit(
                  "FAIL: Invalid Section 9/10 ordering."
              )

          patched = (
              source[:start]
              + new_section
              + source[end:]
          )

          dst_path.write_text(patched)

          print("PASS: Created:")
          print(dst_path)

          print("PASS: Section 10 and all other workflow sections preserved.")
          PY

      - name: Verify only Section 9 changed
        shell: bash
        run: |
          set -euo pipefail

          SRC=".github/workflows/build-v10-carassistant-keyboard-follow-pass.yml"
          DST=".github/workflows/build-v10-carassistant-keyboard-follow-pass-fixed.yml"

          test -f "$SRC"
          test -f "$DST"

          python3 <<'PY'
          from pathlib import Path

          src = Path(
              ".github/workflows/build-v10-carassistant-keyboard-follow-pass.yml"
          ).read_text()

          dst = Path(
              ".github/workflows/build-v10-carassistant-keyboard-follow-pass-fixed.yml"
          ).read_text()

          START = "      # 9. NAVIGATION-ONLY PATCH"
          END = "      # 10. VERIFY NAVIGATION PATCH"

          def outside_section(text):
              a = text.find(START)
              b = text.find(END)

              if a < 0 or b < 0 or b <= a:
                  raise SystemExit(
                      "FAIL: Section boundaries invalid."
                  )

              return text[:a] + text[b:]

          if outside_section(src) != outside_section(dst):
              raise SystemExit(
                  "FAIL: Content outside Section 9 changed."
              )

          print(
              "PASS: Only Section 9 differs."
          )
          PY

      - name: YAML syntax check
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import yaml

          path = (
              ".github/workflows/"
              "build-v10-carassistant-keyboard-follow-pass-fixed.yml"
          )

          with open(path, "r", encoding="utf-8") as f:
              yaml.safe_load(f)

          print("PASS: Fixed workflow YAML syntax.")
          PY

      - name: Commit fixed workflow
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .github/workflows/build-v10-carassistant-keyboard-follow-pass-fixed.yml

          git diff --cached --check

          git commit \
            -m "fix: patch navigation follow workflow structurally"

          git push origin main

          echo "PASS: Fixed workflow committed to main."
