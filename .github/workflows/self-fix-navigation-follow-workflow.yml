name: Self Fix Navigation Follow Workflow

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-workflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch Section 9 and generate fixed workflow
        shell: bash
        run: |
          set -euo pipefail

          SRC=".github/workflows/build-v10-carassistant-keyboard-follow-pass.yml"
          DST=".github/workflows/build-v10-carassistant-keyboard-follow-pass-fixed.yml"

          test -f "$SRC"

          python3 <<'PY'
          import base64
          from pathlib import Path

          src_path = Path(".github/workflows/build-v10-carassistant-keyboard-follow-pass.yml")
          dst_path = Path(".github/workflows/build-v10-carassistant-keyboard-follow-pass-fixed.yml")

          source = src_path.read_text(encoding="utf-8")

          START = "      # 9. NAVIGATION-ONLY PATCH"
          END = "      # 10. VERIFY NAVIGATION PATCH"

          start_idx = source.find(START)
          end_idx = source.find(END)

          if start_idx < 0:
              raise SystemExit("FAIL: Section 9 start marker not found.")

          if end_idx < 0:
              raise SystemExit("FAIL: Section 10 marker not found.")

          if end_idx <= start_idx:
              raise SystemExit("FAIL: Invalid Section 9/10 ordering.")

          # Base64 encoded payload for Section 9 to eliminate all string/quote/heredoc conflicts
          b64_section = (
              "      # ============================================================\n"
              "      # 9. NAVIGATION-ONLY PATCH\n"
              "      #\n"
              "      # Structural patch against the REAL NavigationMapView.java.\n"
              "      # No full-file replacement.\n"
              "      # ============================================================\n"
              "\n"
              "      - name: Patch Navigation Follow and GPS Arrow\n"
              "        shell: bash\n"
              "        run: |\n"
              "          set -euo pipefail\n"
              "\n"
              "          FILE=\"v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java\"\n"
              "\n"
              "          echo \"========================================\"\n"
              "          echo \"NAVIGATION FOLLOW + GPS ARROW PATCH\"\n"
              "          echo \"========================================\"\n"
              "\n"
              "          test -f \"$FILE\"\n"
              "\n"
              "          python3 - <<'PY_NAV'\n"
              "          import re\n"
              "          from pathlib import Path\n"
              "\n"
              "          path = Path(\"v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java\")\n"
              "          source = path.read_text()\n"
              "\n"
              "          print(\"NavigationMapView baseline size:\", len(source), \"bytes\")\n"
              "\n"
              "          # 9A. ADD RenderMode IMPORT\n"
              "          render_import = \"import org.maplibre.android.location.modes.RenderMode;\"\n"
              "          if render_import in source:\n"
              "              print(\"PASS: RenderMode import already present.\")\n"
              "          else:\n"
              "              anchor = \"import org.maplibre.android.location.modes.CameraMode;\"\n"
              "              if source.count(anchor) != 1:\n"
              "                  raise SystemExit(\"FAIL: CameraMode import anchor must occur exactly once.\")\n"
              "              source = source.replace(anchor, anchor + \"\\n\" + render_import, 1)\n"
              "              print(\"PASS: RenderMode import added.\")\n"
              "\n"
              "          # 9B. PATCH EXISTING RECENTER BUTTON\n"
              "          button_pattern = re.compile(r'(?P<block>addControlButton\\(\\s*controls\\s*,\\s*\"(?P<label>[^\"]+)\"\\s*,\\s*\"(?P<title>[^\"]*)\"\\s*,\\s*v\\s*->\\s*recenter\\(\\)\\s*\\)\\s*;)')\n"
              "          button_matches = list(button_pattern.finditer(source))\n"
              "          if len(button_matches) == 1:\n"
              "              new_btn = 'addControlButton(controls, \"➤\", \"Follow current location and direction\", v -> followCurrentLocation());'\n"
              "              source = source[:button_matches[0].start()] + new_btn + source[button_matches[0].end():]\n"
              "              print(\"PASS: Existing recenter button patched structurally.\")\n"
              "          elif len(button_matches) == 0:\n"
              "              if '\"➤\"' in source and 'v -> followCurrentLocation()' in source:\n"
              "                  print(\"PASS: Follow button already patched.\")\n"
              "              else:\n"
              "                  raise SystemExit(\"FAIL: Could not locate exactly one existing recenter button.\")\n"
              "          else:\n"
              "              raise SystemExit(\"FAIL: Found \" + str(len(button_matches)) + \" recenter button blocks; expected exactly 1.\")\n"
              "\n"
              "          # 9C. ENABLE GPS RENDER MODE\n"
              "          enable_pattern = re.compile(r'map\\.getLocationComponent\\(\\)\\s*\\.setLocationComponentEnabled\\(true\\)\\s*;')\n"
              "          enable_matches = list(enable_pattern.finditer(source))\n"
              "          if \"setRenderMode(RenderMode.GPS);\" in source:\n"
              "              print(\"PASS: GPS render mode already present.\")\n"
              "          elif len(enable_matches) == 1:\n"
              "              replacement = 'map.getLocationComponent().setLocationComponentEnabled(true);\\n\\nmap.getLocationComponent().setRenderMode(RenderMode.GPS);'\n"
              "              source = source[:enable_matches[0].start()] + replacement + source[enable_matches[0].end():]\n"
              "              print(\"PASS: Location component switched to GPS render mode.\")\n"
              "          else:\n"
              "              raise SystemExit(\"FAIL: Expected exactly one setLocationComponentEnabled(true) anchor; found \" + str(len(enable_matches)) + \".\")\n"
              "\n"
              "          # 9D. FIND recenter() WITH BRACE BALANCING\n"
              "          method_pattern = re.compile(r'(?m)^\\s*public\\s+void\\s+recenter\\s*\\(\\s*\\)\\s*\\{')\n"
              "          method_matches = list(method_pattern.finditer(source))\n"
              "          follow_method = '''public void followCurrentLocation() {\\n    if (map == null) {\\n        return;\\n    }\\n\\n    try {\\n        Location location =\\n                map.getLocationComponent()\\n                    .getLastKnownLocation();\\n\\n        if (location == null) {\\n            startAutoFollow();\\n            return;\\n        }\\n\\n        map.getLocationComponent()\\n            .forceLocationUpdate(location);\\n\\n        map.getLocationComponent()\\n            .setRenderMode(RenderMode.GPS);\\n\\n        map.animateCamera(\\n            CameraUpdateFactory.newLatLngZoom(\\n                new LatLng(\\n                    location.getLatitude(),\\n                    location.getLongitude()),\\n                AUTO_FOLLOW_ZOOM),\\n            300);\\n\\n        map.getLocationComponent()\\n            .setCameraMode(\\n                CameraMode.TRACKING,\\n                500L,\\n                AUTO_FOLLOW_ZOOM,\\n                null,\\n                0.0,\\n                null);\\n\\n    } catch (Exception ignored) {\\n    }\\n}\\n\\npublic void recenter() {\\n    followCurrentLocation();\\n}'''\n"
              "          if len(method_matches) == 1:\n"
              "              start = method_matches[0].start()\n"
              "              brace_start = source.find(\"{\", start, method_matches[0].end() + 1)\n"
              "              if brace_start < 0:\n"
              "                  raise SystemExit(\"FAIL: recenter() opening brace not found.\")\n"
              "              depth = 0\n"
              "              end = None\n"
              "              for i in range(brace_start, len(source)):\n"
              "                  if source[i] == \"{\": depth += 1\n"
              "                  elif source[i] == \"}\":\n"
              "                      depth -= 1\n"
              "                      if depth == 0:\n"
              "                          end = i + 1\n"
              "                          break\n"
              "              if end is None:\n"
              "                  raise SystemExit(\"FAIL: Could not find balanced end of recenter().\")\n"
              "              current = source[start:end]\n"
              "              if \"getLastKnownLocation\" not in current:\n"
              "                  raise SystemExit(\"FAIL: recenter() body does not match expected baseline.\")\n"
              "              leading = re.match(r\"\\s*\", current).group(0)\n"
              "              replacement = \"\\n\".join(leading + line if line else \"\" for line in follow_method.splitlines())\n"
              "              source = source[:start] + replacement + source[end:]\n"
              "              print(\"PASS: recenter() replaced with followCurrentLocation() wrapper.\")\n"
              "          elif len(method_matches) == 0:\n"
              "              if \"public void followCurrentLocation()\" in source:\n"
              "                  print(\"PASS: followCurrentLocation() already present.\")\n"
              "              else:\n"
              "                  raise SystemExit(\"FAIL: recenter() method not found.\")\n"
              "          else:\n"
              "              raise SystemExit(\"FAIL: recenter() found \" + str(len(method_matches)) + \" times; expected exactly 1.\")\n"
              "\n"
              "          # 9E. FINAL VERIFICATION\n"
              "          required = [render_import, \"setRenderMode(RenderMode.GPS);\", 'v -> followCurrentLocation()', \"public void followCurrentLocation()\", \"forceLocationUpdate(location)\", \"CameraUpdateFactory.newLatLngZoom(\", \"location.getLatitude()\", \"location.getLongitude()\", \"CameraMode.TRACKING\", \"public void recenter()\", \"followCurrentLocation();\"]\n"
              "          for item in required:\n"
              "              if item not in source:\n"
              "                  raise SystemExit(\"FAIL: Final Navigation source check missing: \" + item)\n"
              "          path.write_text(source)\n"
              "          print(\"PASS: NavigationMapView.java structurally patched.\")\n"
              "          print(\"Final NavigationMapView size:\", len(source), \"bytes\")\n"
              "          PY_NAV\n"
              "\n"
              "          echo \"PASS: Section 9 patch completed.\"\n"
          )

          patched = source[:start_idx] + b64_section + source[end_idx:]
          dst_path.write_text(patched, encoding="utf-8")

          print("PASS: Created patched workflow file cleanly.")
          PY

      - name: Verify only Section 9 changed
        shell: bash
        run: |
          set -euo pipefail

          SRC=".github/workflows/build-v10-carassistant-keyboard-follow-pass.yml"
          DST=".github/workflows/build-v10-carassistant-keyboard-follow-pass-fixed.yml"

          test -f "$SRC"
          test -f "$DST"

          python3 <<'PY'
          from pathlib import Path

          src = Path(".github/workflows/build-v10-carassistant-keyboard-follow-pass.yml").read_text(encoding="utf-8")
          dst = Path(".github/workflows/build-v10-carassistant-keyboard-follow-pass-fixed.yml").read_text(encoding="utf-8")

          START = "      # 9. NAVIGATION-ONLY PATCH"
          END = "      # 10. VERIFY NAVIGATION PATCH"

          start_src = src.find(START)
          end_src = src.find(END)

          start_dst = dst.find(START)
          end_dst = dst.find(END)

          if start_src < 0 or end_src < 0 or end_src <= start_src:
              raise SystemExit("FAIL: Section boundaries invalid in source.")

          if start_dst < 0 or end_dst < 0 or end_dst <= start_dst:
              raise SystemExit("FAIL: Section boundaries invalid in destination.")

          # Verify Prefix match (everything before Section 9)
          if src[:start_src] != dst[:start_dst]:
              raise SystemExit("FAIL: Content BEFORE Section 9 changed.")

          # Verify Suffix match (everything after Section 10)
          if src[end_src:] != dst[end_dst:]:
              raise SystemExit("FAIL: Content AFTER Section 9 changed.")

          print("PASS: Exact byte match for content outside Section 9.")
          PY

      - name: YAML syntax check
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import yaml

          path = (
              ".github/workflows/"
              "build-v10-carassistant-keyboard-follow-pass-fixed.yml"
          )

          with open(path, "r", encoding="utf-8") as f:
              yaml.safe_load(f)

          print("PASS: Fixed workflow YAML syntax.")
          PY

      - name: Commit fixed workflow
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .github/workflows/build-v10-carassistant-keyboard-follow-pass-fixed.yml

          git diff --cached --check

          git commit \
            -m "fix: patch navigation follow workflow structurally"

          git push origin main

          echo "PASS: Fixed workflow committed to main."
