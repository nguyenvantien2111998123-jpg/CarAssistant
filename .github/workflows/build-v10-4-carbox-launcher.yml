name: Build Car Assistant V10.4 CarBox Launcher

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build V10.4 CarBox Launcher
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-disabled: true

      # ============================================================
      # VERIFY EXISTING V10
      # ============================================================

      - name: Verify V10 source
        shell: bash
        run: |
          set -euo pipefail

          test -d v10-source

          test -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

          test -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java

          test -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10InputController.java

          test -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java

          echo "V10 SOURCE OK"

      # ============================================================
      # NORMALIZE PACKAGE
      # ============================================================

      - name: Normalize V10 package
        shell: bash
        run: |
          set -euo pipefail

          find v10-source/app/src/main/java \
            -type f \
            \( -name "*.java" -o -name "*.xml" \) \
            -print0 |
            xargs -0 sed -i \
            's/com\.carassistant\.v9/com.carassistant.v10/g'

          echo "PACKAGE NORMALIZED"

      # ============================================================
      # REMOVE OLD GEARHEAD CONTROL BAR DEPENDENCY
      # ============================================================

      - name: Remove obsolete Gearhead UI dependency
        shell: bash
        run: |
          set -euo pipefail

          BRIDGE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/aabridge/AACastBridge.java"

          if [ -f "$BRIDGE" ]; then

            sed -i \
              '/import com\.carassistant\.v10\.hook\.GearheadControlBar;/d' \
              "$BRIDGE"

            sed -i \
              '/GearheadControlBar[[:space:]]*\.[[:space:]]*install[[:space:]]*();/d' \
              "$BRIDGE"

          fi

          echo "GEARHEAD CONTROL BAR REMOVED FROM BRIDGE"

      # ============================================================
      # WRITE V10.4 CARBOX LAUNCHER
      # ============================================================

      - name: Write V10.4 CarBox Launcher
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          cat > "$FILE" <<'EOF'
          package com.carassistant.v10;

          import android.content.ComponentName;
          import android.content.pm.ResolveInfo;
          import android.graphics.Color;
          import android.graphics.drawable.Drawable;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.TextureView;
          import android.view.View;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.GridLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import com.google.android.apps.auto.sdk.CarActivity;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;

          public final class V10CarActivity
                  extends CarActivity {

              private TextureView textureView;

              private V10ProjectionSession session;

              private FrameLayout content;

              private LinearLayout launcher;

              private LinearLayout controlBar;

              private TextView title;

              private boolean resumed;

              private boolean projectionVisible;

              private final List<ResolveInfo> apps =
                      new ArrayList<>();

              @Override
              public void onCreate(Bundle state) {

                  setTheme(
                          R.style.Theme_AACast);

                  super.onCreate(state);

                  V10SessionStore
                          .setCurrentActivity(this);

                  setIgnoreConfigChanges(-1);

                  applyChrome();

                  buildUi();

                  loadApps();

                  showLauncher();
              }

              private void applyChrome() {

                  try {

                      getCarUiController()
                              .getStatusBarController()
                              .hideAppHeader();

                      getCarUiController()
                              .getMenuController()
                              .hideMenuButton();

                  } catch (RuntimeException ignored) {
                  }
              }

              @Override
              public void onResume() {

                  super.onResume();

                  resumed = true;

                  applyChrome();

                  if (session == null) {

                      session =
                              new V10ProjectionSession(
                                      this);

                      session.attachTextureView(
                              textureView);

                      V10InputController
                              inputController =
                              new V10InputController(
                                      session);

                      textureView.setOnTouchListener(
                              inputController
                                      .createListener());
                  }

                  if (!projectionVisible) {
                      showLauncher();
                  }
              }

              // ====================================================
              // ROOT UI
              // ====================================================

              private void buildUi() {

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL);

                  root.setBackgroundColor(
                          Color.BLACK);

                  // ----------------------------------------------
                  // CONTENT AREA
                  // ----------------------------------------------

                  content =
                          new FrameLayout(this);

                  LinearLayout.LayoutParams
                          contentParams =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  0,
                                  1f);

                  root.addView(
                          content,
                          contentParams);

                  // ----------------------------------------------
                  // TEXTURE VIEW
                  // ----------------------------------------------

                  textureView =
                          new TextureView(this);

                  FrameLayout.LayoutParams
                          textureParams =
                          new FrameLayout.LayoutParams(
                                  FrameLayout.LayoutParams.MATCH_PARENT,
                                  FrameLayout.LayoutParams.MATCH_PARENT);

                  content.addView(
                          textureView,
                          textureParams);

                  // ----------------------------------------------
                  // LAUNCHER
                  // ----------------------------------------------

                  launcher =
                          new LinearLayout(this);

                  launcher.setOrientation(
                          LinearLayout.VERTICAL);

                  launcher.setPadding(
                          dp(18),
                          dp(12),
                          dp(18),
                          dp(12));

                  launcher.setBackgroundColor(
                          Color.rgb(10, 10, 10));

                  content.addView(
                          launcher,
                          new FrameLayout.LayoutParams(
                                  FrameLayout.LayoutParams.MATCH_PARENT,
                                  FrameLayout.LayoutParams.MATCH_PARENT));

                  // ----------------------------------------------
                  // CONTROL BAR
                  // ----------------------------------------------

                  controlBar =
                          new LinearLayout(this);

                  controlBar.setOrientation(
                          LinearLayout.HORIZONTAL);

                  controlBar.setGravity(
                          Gravity.CENTER);

                  controlBar.setPadding(
                          dp(6),
                          dp(4),
                          dp(6),
                          dp(4));

                  controlBar.setBackgroundColor(
                          Color.rgb(24, 24, 24));

                  LinearLayout.LayoutParams
                          barParams =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  dp(58));

                  root.addView(
                          controlBar,
                          barParams);

                  addControlButton(
                          "BACK",
                          v -> handleBack());

                  addControlButton(
                          "APPS",
                          v -> showLauncher());

                  addControlButton(
                          "RECENTS",
                          v -> showRecents());

                  addControlButton(
                          "HOME",
                          v -> handleHome());

                  setContentView(root);
              }

              // ====================================================
              // CARBOX STYLE LAUNCHER
              // ====================================================

              private void buildLauncherHeader() {

                  LinearLayout header =
                          new LinearLayout(this);

                  header.setOrientation(
                          LinearLayout.HORIZONTAL);

                  header.setGravity(
                          Gravity.CENTER_VERTICAL);

                  LinearLayout.LayoutParams
                          headerParams =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  dp(58));

                  title =
                          new TextView(this);

                  title.setText(
                          "CAR ASSISTANT");

                  title.setTextColor(
                          Color.WHITE);

                  title.setTextSize(
                          20);

                  title.setGravity(
                          Gravity.CENTER_VERTICAL);

                  LinearLayout.LayoutParams
                          titleParams =
                          new LinearLayout.LayoutParams(
                                  0,
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  1f);

                  header.addView(
                          title,
                          titleParams);

                  TextView version =
                          new TextView(this);

                  version.setText(
                          "V10");

                  version.setTextColor(
                          Color.LTGRAY);

                  version.setTextSize(
                          13);

                  version.setGravity(
                          Gravity.CENTER_VERTICAL);

                  header.addView(
                          version,
                          new LinearLayout.LayoutParams(
                                  dp(45),
                                  LinearLayout.LayoutParams.MATCH_PARENT));

                  launcher.addView(
                          header,
                          headerParams);
              }

              private void buildAppGrid() {

                  ScrollView scroll =
                          new ScrollView(this);

                  scroll.setFillViewport(
                          true);

                  GridLayout grid =
                          new GridLayout(this);

                  grid.setColumnCount(
                          4);

                  grid.setUseDefaultMargins(
                          false);

                  grid.setPadding(
                          0,
                          dp(8),
                          0,
                          dp(8));

                  for (ResolveInfo info : apps) {

                      addAppCard(
                              grid,
                              info);
                  }

                  scroll.addView(
                          grid,
                          new ScrollView.LayoutParams(
                                  ScrollView.LayoutParams.MATCH_PARENT,
                                  ScrollView.LayoutParams.WRAP_CONTENT));

                  launcher.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  0,
                                  1f));
              }

              private void addAppCard(
                      GridLayout grid,
                      ResolveInfo info) {

                  LinearLayout card =
                          new LinearLayout(this);

                  card.setOrientation(
                          LinearLayout.VERTICAL);

                  card.setGravity(
                          Gravity.CENTER);

                  card.setPadding(
                          dp(6),
                          dp(8),
                          dp(6),
                          dp(8));

                  ImageView icon =
                          new ImageView(this);

                  Drawable drawable =
                          info.loadIcon(
                                  getPackageManager());

                  icon.setImageDrawable(
                          drawable);

                  icon.setScaleType(
                          ImageView.ScaleType.CENTER_INSIDE);

                  card.addView(
                          icon,
                          new LinearLayout.LayoutParams(
                                  dp(58),
                                  dp(58)));

                  TextView name =
                          new TextView(this);

                  CharSequence label =
                          info.loadLabel(
                                  getPackageManager());

                  name.setText(
                          label == null
                                  ? info.activityInfo.packageName
                                  : label);

                  name.setTextColor(
                          Color.WHITE);

                  name.setTextSize(
                          11);

                  name.setGravity(
                          Gravity.CENTER);

                  name.setMaxLines(
                          2);

                  card.addView(
                          name,
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  dp(38)));

                  card.setOnClickListener(
                          v -> launchApp(info));

                  GridLayout.LayoutParams
                          params =
                          new GridLayout.LayoutParams();

                  params.width =
                          0;

                  params.height =
                          dp(118);

                  params.columnSpec =
                          GridLayout.spec(
                                  GridLayout.UNDEFINED,
                                  1f);

                  params.setMargins(
                          dp(4),
                          dp(4),
                          dp(4),
                          dp(4));

                  grid.addView(
                          card,
                          params);
              }

              // ====================================================
              // APP DISCOVERY
              // ====================================================

              private void loadApps() {

                  apps.clear();

                  android.content.Intent intent =
                          new android.content.Intent(
                                  android.content.Intent.ACTION_MAIN);

                  intent.addCategory(
                          android.content.Intent.CATEGORY_LAUNCHER);

                  List<ResolveInfo> resolved =
                          getPackageManager()
                                  .queryIntentActivities(
                                          intent,
                                          0);

                  String self =
                          getPackageName();

                  for (ResolveInfo info : resolved) {

                      if (info == null
                              || info.activityInfo == null) {
                          continue;
                      }

                      if (self.equals(
                              info.activityInfo.packageName)) {
                          continue;
                      }

                      if (!info.activityInfo.enabled) {
                          continue;
                      }

                      apps.add(info);
                  }

                  Collections.sort(
                          apps,
                          new Comparator<ResolveInfo>() {

                              @Override
                              public int compare(
                                      ResolveInfo a,
                                      ResolveInfo b) {

                                  String aa =
                                          String.valueOf(
                                                  a.loadLabel(
                                                          getPackageManager()));

                                  String bb =
                                          String.valueOf(
                                                  b.loadLabel(
                                                          getPackageManager()));

                                  return aa.compareToIgnoreCase(
                                          bb);
                              }
                          });
              }

              // ====================================================
              // SHOW LAUNCHER
              // ====================================================

              private void showLauncher() {

                  projectionVisible = false;

                  if (session != null
                          && session.isActive()) {

                      session.release();
                  }

                  launcher.removeAllViews();

                  buildLauncherHeader();

                  if (apps.isEmpty()) {

                      TextView empty =
                              new TextView(this);

                      empty.setText(
                              "Không tìm thấy ứng dụng");

                      empty.setTextColor(
                              Color.WHITE);

                      empty.setTextSize(
                              18);

                      empty.setGravity(
                              Gravity.CENTER);

                      launcher.addView(
                              empty,
                              new LinearLayout.LayoutParams(
                                      LinearLayout.LayoutParams.MATCH_PARENT,
                                      0,
                                      1f));

                  } else {

                      buildAppGrid();
                  }

                  launcher.setVisibility(
                          View.VISIBLE);

                  textureView.setVisibility(
                          View.INVISIBLE);
              }

              // ====================================================
              // LAUNCH SELECTED APP
              // ====================================================

              private void launchApp(
                      ResolveInfo info) {

                  if (info == null
                          || info.activityInfo == null
                          || session == null) {
                      return;
                  }

                  ComponentName target =
                          new ComponentName(
                                  info.activityInfo.packageName,
                                  info.activityInfo.name);

                  V10SessionStore.setTarget(
                          this,
                          target);

                  projectionVisible = true;

                  launcher.setVisibility(
                          View.GONE);

                  textureView.setVisibility(
                          View.VISIBLE);

                  session.setTarget(
                          target);
              }

              // ====================================================
              // BUTTONS
              // ====================================================

              private void addControlButton(
                      String label,
                      View.OnClickListener listener) {

                  Button button =
                          new Button(this);

                  button.setText(
                          label);

                  button.setTextSize(
                          12);

                  button.setTextColor(
                          Color.WHITE);

                  button.setAllCaps(
                          false);

                  button.setOnClickListener(
                          listener);

                  LinearLayout.LayoutParams
                          params =
                          new LinearLayout.LayoutParams(
                                  0,
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  1f);

                  params.setMargins(
                          dp(3),
                          dp(3),
                          dp(3),
                          dp(3));

                  controlBar.addView(
                          button,
                          params);
              }

              private void handleBack() {

                  if (session != null
                          && session.isActive()) {

                      session.back();

                  } else {

                      showLauncher();
                  }
              }

              private void handleHome() {

                  showLauncher();
              }

              private void showRecents() {

                  showInfo(
                          "RECENTS",
                          "Session Manager sẽ được triển khai ở bước tiếp theo.");
              }

              private void showInfo(
                      String heading,
                      String message) {

                  if (!resumed) {
                      return;
                  }

                  TextView info =
                          new TextView(this);

                  info.setText(
                          heading
                                  + "\n\n"
                                  + message);

                  info.setTextColor(
                          Color.WHITE);

                  info.setTextSize(
                          16);

                  info.setGravity(
                          Gravity.CENTER);

                  info.setBackgroundColor(
                          Color.rgb(32, 32, 32));

                  FrameLayout.LayoutParams
                          params =
                          new FrameLayout.LayoutParams(
                                  FrameLayout.LayoutParams.MATCH_PARENT,
                                  dp(150));

                  params.gravity =
                          Gravity.CENTER;

                  content.addView(
                          info,
                          params);

                  info.bringToFront();

                  info.postDelayed(
                          () -> {

                              if (info.getParent()
                                      != null) {

                                  ((FrameLayout)
                                          info.getParent())
                                          .removeView(info);
                              }

                          },
                          1800);
              }

              // ====================================================
              // LIFECYCLE
              // ====================================================

              @Override
              public void onPause() {

                  resumed = false;

                  super.onPause();
              }

              @Override
              public void onStop() {

                  resumed = false;

                  if (session != null
                          && projectionVisible) {

                      session.release();
                  }

                  super.onStop();
              }

              @Override
              public void onDestroy() {

                  resumed = false;

                  if (session != null) {

                      session.destroy();

                      session = null;
                  }

                  textureView = null;

                  launcher = null;

                  controlBar = null;

                  content = null;

                  V10SessionStore
                          .clearCurrentActivity(this);

                  super.onDestroy();
              }

              @Override
              public void onWindowFocusChanged(
                      boolean hasFocus,
                      boolean touchMode) {

                  super.onWindowFocusChanged(
                          hasFocus,
                          touchMode);

                  if (hasFocus) {
                      applyChrome();
                  }
              }

              private int dp(int value) {

                  float density =
                          getResources()
                                  .getDisplayMetrics()
                                  .density;

                  return Math.max(
                          1,
                          (int) (
                                  value * density
                                          + 0.5f));
              }
          }
          EOF

          echo "V10.4 CARBOX LAUNCHER WRITTEN"

      # ============================================================
      # STATIC VERIFICATION
      # ============================================================

      - name: Verify V10.4 Launcher
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -q \
            "CATEGORY_LAUNCHER" \
            "$FILE"

          grep -q \
            "queryIntentActivities" \
            "$FILE"

          grep -q \
            "GridLayout" \
            "$FILE"

          grep -q \
            "loadIcon" \
            "$FILE"

          grep -q \
            "loadLabel" \
            "$FILE"

          grep -q \
            "V10SessionStore.setTarget" \
            "$FILE"

          grep -q \
            "session.setTarget" \
            "$FILE"

          grep -q \
            "BACK" \
            "$FILE"

          grep -q \
            "APPS" \
            "$FILE"

          grep -q \
            "RECENTS" \
            "$FILE"

          grep -q \
            "HOME" \
            "$FILE"

          if grep -q \
            "WindowManagerGlobal" \
            "$FILE"; then
            echo "ERROR: WindowManagerGlobal must not be used"
            exit 1
          fi

          echo "V10.4 LAUNCHER SOURCE OK"

      # ============================================================
      # VERIFY PROJECTION ENGINE
      # ============================================================

      - name: Verify projection engine
        shell: bash
        run: |
          set -euo pipefail

          SESSION="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          test -f "$SESSION"

          grep -q \
            "createVirtualDisplay" \
            "$SESSION"

          grep -q \
            "setDefaultBufferSize" \
            "$SESSION"

          grep -q \
            "/system/bin/am start" \
            "$SESSION"

          grep -q \
            "input touchscreen" \
            "$SESSION"

          echo "PROJECTION ENGINE OK"

      # ============================================================
      # VERIFY INPUT
      # ============================================================

      - name: Verify input controller
        shell: bash
        run: |
          set -euo pipefail

          INPUT="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10InputController.java"

          test -f "$INPUT"

          grep -q \
            "ACTION_DOWN" \
            "$INPUT"

          grep -q \
            "ACTION_MOVE" \
            "$INPUT"

          grep -q \
            "ACTION_UP" \
            "$INPUT"

          grep -q \
            "session.swipe" \
            "$INPUT"

          echo "INPUT CONTROLLER OK"

      # ============================================================
      # VERIFY BRIDGE
      # ============================================================

      - name: Verify Xposed bridge
        shell: bash
        run: |
          set -euo pipefail

          BRIDGE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/aabridge/AACastBridge.java"

          test -f "$BRIDGE"

          grep -q \
            "InputHooks.install" \
            "$BRIDGE"

          grep -Eq \
            'GearheadAllow[[:space:]]*\.[[:space:]]*install' \
            "$BRIDGE"

          if grep -Eq \
            'GearheadControlBar[[:space:]]*\.[[:space:]]*install' \
            "$BRIDGE"; then

            echo "ERROR: Old GearheadControlBar dependency remains"

            exit 1
          fi

          echo "XPOSED BRIDGE OK"

      # ============================================================
      # VERIFY MANIFEST
      # ============================================================

      - name: Verify manifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          grep -q \
            "com.carassistant.v10.V10CarActivity" \
            "$MANIFEST"

          grep -q \
            "com.carassistant.v10.AACastCarService" \
            "$MANIFEST"

          echo "MANIFEST OK"

      # ============================================================
      # ANDROID 12 CHECK
      # ============================================================

      - name: Verify Android 12 compatibility
        shell: bash
        run: |
          set -euo pipefail

          BUILD="v10-source/app/build.gradle"

          grep -Eq \
            'compileSdk([[:space:]]+|=)31' \
            "$BUILD" || true

          if grep -R \
            "android-12L\|API 32\|android-13" \
            v10-source/app/src/main/java \
            v10-source/app/src/main/AndroidManifest.xml \
            >/dev/null 2>&1; then

            echo "WARNING: Android 12L+ reference detected"

          fi

          echo "ANDROID 12 CHECK COMPLETE"

      # ============================================================
      # CLEAN BUILD
      # ============================================================

      - name: Gradle clean
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            clean \
            --no-daemon

      - name: Build V10.4 debug APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # APK VERIFY
      # ============================================================

      - name: Verify APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo
          echo "========================================"
          echo " CAR ASSISTANT V10.4 BUILD PASSED"
          echo "========================================"

          echo
          echo "APK:"
          ls -lh "$APK"

          echo
          echo "SHA256:"
          sha256sum "$APK"

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload V10.4 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10.4-CarBox-Launcher-debug
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # COMMIT ONLY AFTER BUILD PASSES
      # ============================================================

      - name: Commit V10.4 source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add v10-source

          if git diff --cached --quiet; then

            echo "No V10.4 source changes."

          else

            git commit \
              -m "Build V10.4 CarBox style launcher"

            git push

          fi
