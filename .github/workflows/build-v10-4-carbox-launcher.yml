name: Build Car Assistant V10.4 - Femto Style Launcher Fixed

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build V10.4 Femto Launcher
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-disabled: true

      # ============================================================
      # VERIFY SOURCE
      # ============================================================

      - name: Verify existing V10 source
        shell: bash
        run: |
          set -euo pipefail

          test -d v10-source

          test -f \
            v10-source/app/src/main/AndroidManifest.xml

          test -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java

          test -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10InputController.java

          test -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java

          echo "V10 SOURCE OK"

      # ============================================================
      # REMOVE OLD A2 UI IMPLEMENTATION
      # ============================================================

      - name: Remove obsolete Gearhead control bar
        shell: bash
        run: |
          set -euo pipefail

          find v10-source/app/src/main/java \
            -type f \
            -name "GearheadControlBar.java" \
            -print \
            -delete

          BRIDGE="$(
            find v10-source/app/src/main/java \
              -type f \
              -name "AACastBridge.java" \
              | head -1
          )"

          if [ -n "$BRIDGE" ]; then

            sed -i \
              '/import com\.carassistant\.v10\.hook\.GearheadControlBar;/d' \
              "$BRIDGE"

            sed -i \
              '/GearheadControlBar[[:space:]]*\.[[:space:]]*install[[:space:]]*(/d' \
              "$BRIDGE"

          fi

          echo "OBSOLETE GEARHEAD CONTROL BAR REMOVED"

      # ============================================================
      # WRITE V10.4 FEMTO STYLE ACTIVITY
      # ============================================================

      - name: Write V10.4 Femto launcher
        shell: bash
        run: |
          set -euo pipefail

          cat > \
          v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java \
          <<'EOF'

          package com.carassistant.v10;

          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ResolveInfo;
          import android.graphics.Color;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.view.WindowManager;
          import android.widget.BaseAdapter;
          import android.widget.FrameLayout;
          import android.widget.GridView;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import com.google.android.apps.auto.sdk.CarActivity;

          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;

          public final class V10CarActivity
                  extends CarActivity {

              private FrameLayout root;

              private FrameLayout projectionLayer;

              private TextureHost textureHost;

              private V10ProjectionSession session;

              private V10InputController inputController;

              private LinearLayout launcherLayer;

              private LinearLayout dashboard;

              private LinearLayout appPanel;

              private LinearLayout dock;

              private TextView clock;

              private TextView date;

              private final Handler handler =
                      new Handler(Looper.getMainLooper());

              private final ArrayList<AppInfo> apps =
                      new ArrayList<>();

              private final ArrayList<AppInfo> dockApps =
                      new ArrayList<>();

              private final Runnable clockTicker =
                      new Runnable() {
                          @Override
                          public void run() {

                              updateClock();

                              handler.postDelayed(
                                      this,
                                      1000);
                          }
                      };

              @Override
              protected void onCreate(Bundle bundle) {

                  super.onCreate(bundle);

                  Window window =
                          getWindow();

                  window.setFlags(
                          WindowManager.LayoutParams.FLAG_FULLSCREEN,
                          WindowManager.LayoutParams.FLAG_FULLSCREEN);

                  buildRoot();

                  loadApps();

                  setContentView(root);

                  attachProjection();

                  handler.post(clockTicker);

                  String target =
                          getIntent()
                                  .getStringExtra(
                                          "target");

                  if (target != null) {

                      ComponentName component =
                              ComponentName
                                      .unflattenFromString(
                                              target);

                      if (component != null) {
                          launchProjection(component);
                      }
                  }
              }

              // =====================================================
              // ROOT / LAYERS
              // =====================================================

              private void buildRoot() {

                  root =
                          new FrameLayout(this);

                  root.setBackgroundColor(
                          Color.rgb(7, 9, 12));

                  /*
                   * Layer 1:
                   * projection surface.
                   *
                   * Layer 2:
                   * launcher.
                   *
                   * Launcher is initially ABOVE the projection.
                   * When an app is selected it is hidden and the
                   * projection surface becomes visible.
                   */

                  projectionLayer =
                          new FrameLayout(this);

                  projectionLayer.setVisibility(
                          View.GONE);

                  root.addView(
                          projectionLayer,
                          new FrameLayout.LayoutParams(
                                  -1,
                                  -1));

                  launcherLayer =
                          new LinearLayout(this);

                  launcherLayer.setOrientation(
                          LinearLayout.VERTICAL);

                  root.addView(
                          launcherLayer,
                          new FrameLayout.LayoutParams(
                                  -1,
                                  -1));

                  buildDashboard();

                  buildAppPanel();
              }

              // =====================================================
              // DASHBOARD
              // =====================================================

              private void buildDashboard() {

                  dashboard =
                          new LinearLayout(this);

                  dashboard.setOrientation(
                          LinearLayout.VERTICAL);

                  dashboard.setPadding(
                          dp(18),
                          dp(12),
                          dp(18),
                          dp(8));

                  launcherLayer.addView(
                          dashboard,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  -1));

                  // -------------------------------------------------
                  // HEADER
                  // -------------------------------------------------

                  LinearLayout header =
                          new LinearLayout(this);

                  header.setGravity(
                          Gravity.CENTER_VERTICAL);

                  TextView title =
                          text(
                                  "CAR ASSISTANT",
                                  21,
                                  Color.WHITE);

                  title.setTypeface(
                          null,
                          android.graphics.Typeface.BOLD);

                  LinearLayout titleBox =
                          new LinearLayout(this);

                  titleBox.setOrientation(
                          LinearLayout.VERTICAL);

                  titleBox.addView(title);

                  date =
                          text(
                                  "",
                                  12,
                                  Color.LTGRAY);

                  titleBox.addView(date);

                  header.addView(
                          titleBox,
                          new LinearLayout.LayoutParams(
                                  0,
                                  -2,
                                  1));

                  clock =
                          text(
                                  "",
                                  26,
                                  Color.WHITE);

                  clock.setGravity(
                          Gravity.CENTER);

                  header.addView(
                          clock,
                          new LinearLayout.LayoutParams(
                                  dp(140),
                                  dp(58)));

                  dashboard.addView(
                          header,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(65)));

                  // -------------------------------------------------
                  // MAIN DASHBOARD
                  // -------------------------------------------------

                  LinearLayout content =
                          new LinearLayout(this);

                  content.setOrientation(
                          LinearLayout.VERTICAL);

                  // MAP CARD
                  LinearLayout map =
                          card();

                  map.addView(
                          text(
                                  "MAP",
                                  13,
                                  Color.LTGRAY));

                  TextView mapCenter =
                          text(
                                  "Navigation",
                                  29,
                                  Color.WHITE);

                  mapCenter.setGravity(
                          Gravity.CENTER);

                  map.addView(
                          mapCenter,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1));

                  content.addView(
                          map,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  2));

                  // INFO ROW
                  LinearLayout info =
                          new LinearLayout(this);

                  info.setOrientation(
                          LinearLayout.HORIZONTAL);

                  info.addView(
                          infoCard(
                                  "SPEED",
                                  "0 km/h"),
                          new LinearLayout.LayoutParams(
                                  0,
                                  -1,
                                  1));

                  info.addView(
                          infoCard(
                                  "WEATHER",
                                  "-- °C"),
                          new LinearLayout.LayoutParams(
                                  0,
                                  -1,
                                  1));

                  info.addView(
                          infoCard(
                                  "MEDIA",
                                  "No media"),
                          new LinearLayout.LayoutParams(
                                  0,
                                  -1,
                                  1));

                  content.addView(
                          info,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(125)));

                  dashboard.addView(
                          content,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1));

                  // -------------------------------------------------
                  // DOCK
                  // -------------------------------------------------

                  LinearLayout dockRow =
                          new LinearLayout(this);

                  dockRow.setGravity(
                          Gravity.CENTER_VERTICAL);

                  dock =
                          new LinearLayout(this);

                  dock.setGravity(
                          Gravity.CENTER_VERTICAL);

                  dockRow.addView(
                          dock,
                          new LinearLayout.LayoutParams(
                                  0,
                                  -1,
                                  1));

                  TextView apps =
                          buttonText("APPS");

                  apps.setOnClickListener(
                          v -> showApps());

                  dockRow.addView(
                          apps,
                          new LinearLayout.LayoutParams(
                                  dp(95),
                                  dp(58)));

                  dashboard.addView(
                          dockRow,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(70)));
              }

              // =====================================================
              // APP PANEL
              // =====================================================

              private void buildAppPanel() {

                  appPanel =
                          new LinearLayout(this);

                  appPanel.setOrientation(
                          LinearLayout.VERTICAL);

                  appPanel.setPadding(
                          dp(18),
                          dp(14),
                          dp(18),
                          dp(10));

                  appPanel.setBackgroundColor(
                          Color.rgb(8, 10, 13));

                  appPanel.setVisibility(
                          View.GONE);

                  launcherLayer.addView(
                          appPanel,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  -1));

                  LinearLayout header =
                          new LinearLayout(this);

                  header.setGravity(
                          Gravity.CENTER_VERTICAL);

                  TextView back =
                          buttonText("BACK");

                  back.setOnClickListener(
                          v -> hideApps());

                  header.addView(
                          back,
                          new LinearLayout.LayoutParams(
                                  dp(100),
                                  dp(58)));

                  TextView title =
                          text(
                                  "APPLICATIONS",
                                  21,
                                  Color.WHITE);

                  title.setGravity(
                          Gravity.CENTER);

                  header.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(58),
                                  1));

                  appPanel.addView(header);

                  ScrollView scroll =
                          new ScrollView(this);

                  GridView grid =
                          new GridView(this);

                  grid.setNumColumns(4);

                  grid.setVerticalSpacing(
                          dp(12));

                  grid.setHorizontalSpacing(
                          dp(12));

                  grid.setPadding(
                          dp(4),
                          dp(10),
                          dp(4),
                          dp(10));

                  grid.setAdapter(
                          new AppAdapter());

                  scroll.addView(grid);

                  appPanel.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1));
              }

              // =====================================================
              // APPLICATION DISCOVERY
              // =====================================================

              private void loadApps() {

                  apps.clear();

                  Intent intent =
                          new Intent(
                                  Intent.ACTION_MAIN);

                  intent.addCategory(
                          Intent.CATEGORY_LAUNCHER);

                  List<ResolveInfo> result =
                          getPackageManager()
                                  .queryIntentActivities(
                                          intent,
                                          0);

                  for (ResolveInfo info :
                          result) {

                      String pkg =
                              info.activityInfo.packageName;

                      if (getPackageName()
                              .equals(pkg)) {
                          continue;
                      }

                      ComponentName component =
                              new ComponentName(
                                      info.activityInfo.packageName,
                                      info.activityInfo.name);

                      CharSequence label =
                              info.loadLabel(
                                      getPackageManager());

                      String name =
                              label == null
                                      ? pkg
                                      : label.toString();

                      Drawable icon =
                              info.loadIcon(
                                      getPackageManager());

                      apps.add(
                              new AppInfo(
                                      component,
                                      name,
                                      icon));
                  }

                  Collections.sort(
                          apps,
                          (a, b) ->
                                  a.name.compareToIgnoreCase(
                                          b.name));

                  dockApps.clear();

                  int count =
                          Math.min(
                                  5,
                                  apps.size());

                  for (int i = 0;
                       i < count;
                       i++) {

                      dockApps.add(
                              apps.get(i));
                  }

                  rebuildDock();
              }

              private void rebuildDock() {

                  if (dock == null) {
                      return;
                  }

                  dock.removeAllViews();

                  for (AppInfo app :
                          dockApps) {

                      View item =
                              dockItem(app);

                      dock.addView(
                              item,
                              new LinearLayout.LayoutParams(
                                      0,
                                      -1,
                                      1));
                  }
              }

              private View dockItem(
                      AppInfo app) {

                  LinearLayout box =
                          new LinearLayout(this);

                  box.setOrientation(
                          LinearLayout.VERTICAL);

                  box.setGravity(
                          Gravity.CENTER);

                  ImageView icon =
                          new ImageView(this);

                  icon.setImageDrawable(
                          app.icon);

                  box.addView(
                          icon,
                          new LinearLayout.LayoutParams(
                                  dp(34),
                                  dp(34)));

                  TextView label =
                          text(
                                  app.name,
                                  10,
                                  Color.WHITE);

                  label.setGravity(
                          Gravity.CENTER);

                  label.setMaxLines(1);

                  box.addView(
                          label,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(22)));

                  box.setOnClickListener(
                          v ->
                                  launchProjection(
                                          app.component));

                  return box;
              }

              // =====================================================
              // APP ADAPTER
              // =====================================================

              private final class AppAdapter
                      extends BaseAdapter {

                  @Override
                  public int getCount() {
                      return apps.size();
                  }

                  @Override
                  public Object getItem(int position) {
                      return apps.get(position);
                  }

                  @Override
                  public long getItemId(int position) {
                      return position;
                  }

                  @Override
                  public View getView(
                          int position,
                          View convertView,
                          ViewGroup parent) {

                      AppInfo app =
                              apps.get(position);

                      LinearLayout item =
                              new LinearLayout(
                                      V10CarActivity.this);

                      item.setOrientation(
                              LinearLayout.VERTICAL);

                      item.setGravity(
                              Gravity.CENTER);

                      item.setPadding(
                              dp(5),
                              dp(8),
                              dp(5),
                              dp(8));

                      ImageView icon =
                              new ImageView(
                                      V10CarActivity.this);

                      icon.setImageDrawable(
                              app.icon);

                      item.addView(
                              icon,
                              new LinearLayout.LayoutParams(
                                      dp(58),
                                      dp(58)));

                      TextView name =
                              text(
                                      app.name,
                                      13,
                                      Color.WHITE);

                      name.setGravity(
                              Gravity.CENTER);

                      name.setMaxLines(2);

                      item.addView(
                              name,
                              new LinearLayout.LayoutParams(
                                      -1,
                                      dp(42)));

                      item.setOnClickListener(
                              v -> {

                                  hideApps();

                                  launchProjection(
                                          app.component);
                              });

                      return item;
                  }
              }

              // =====================================================
              // PROJECTION ENGINE CONNECTION
              // =====================================================

              private void attachProjection() {

                  textureHost =
                          new TextureHost(this);

                  textureHost.setOpaque(false);

                  projectionLayer.addView(
                          textureHost,
                          new FrameLayout.LayoutParams(
                                  -1,
                                  -1));

                  session =
                          new V10ProjectionSession(
                                  this);

                  session.attachTextureView(
                          textureHost);

                  inputController =
                          new V10InputController(
                                  session);

                  textureHost.setOnTouchListener(
                          inputController
                                  .createListener());
              }

              private void launchProjection(
                      ComponentName component) {

                  if (component == null) {
                      return;
                  }

                  V10SessionStore.setTarget(
                          this,
                          component);

                  if (session != null) {
                      session.setTarget(
                              component);
                  }

                  /*
                   * Hide launcher only after target
                   * has been successfully requested.
                   */

                  launcherLayer.setVisibility(
                          View.GONE);

                  projectionLayer.setVisibility(
                          View.VISIBLE);
              }

              // =====================================================
              // RETURN TO LAUNCHER
              // =====================================================

              private void returnToLauncher() {

                  if (session != null &&
                          session.isActive()) {

                      session.release();
                  }

                  projectionLayer.setVisibility(
                          View.GONE);

                  launcherLayer.setVisibility(
                          View.VISIBLE);

                  dashboard.setVisibility(
                          View.VISIBLE);

                  appPanel.setVisibility(
                          View.GONE);
              }

              // =====================================================
              // APPS PANEL
              // =====================================================

              private void showApps() {

                  dashboard.setVisibility(
                          View.GONE);

                  appPanel.setVisibility(
                          View.VISIBLE);
              }

              private void hideApps() {

                  appPanel.setVisibility(
                          View.GONE);

                  dashboard.setVisibility(
                          View.VISIBLE);
              }

              // =====================================================
              // BACK
              // =====================================================

              @Override
              public void onBackPressed() {

                  if (appPanel != null &&
                          appPanel.getVisibility()
                                  == View.VISIBLE) {

                      hideApps();

                      return;
                  }

                  if (session != null &&
                          session.isActive()) {

                      session.back();

                      return;
                  }

                  super.onBackPressed();
              }

              // =====================================================
              // CLOCK
              // =====================================================

              private void updateClock() {

                  if (clock == null ||
                          date == null) {
                      return;
                  }

                  Date now =
                          new Date();

                  clock.setText(
                          new SimpleDateFormat(
                                  "HH:mm",
                                  Locale.getDefault())
                                  .format(now));

                  date.setText(
                          new SimpleDateFormat(
                                  "EEEE, dd MMMM",
                                  Locale.getDefault())
                                  .format(now));
              }

              // =====================================================
              // LIFECYCLE
              // =====================================================

              @Override
              protected void onResume() {

                  super.onResume();

                  if (session != null) {
                      session.resume();
                  }

                  handler.post(
                          clockTicker);
              }

              @Override
              protected void onPause() {

                  if (session != null) {
                      session.pause();
                  }

                  handler.removeCallbacks(
                          clockTicker);

                  super.onPause();
              }

              @Override
              protected void onDestroy() {

                  handler.removeCallbacks(
                          clockTicker);

                  if (session != null) {
                      session.destroy();
                  }

                  super.onDestroy();
              }

              // =====================================================
              // UI HELPERS
              // =====================================================

              private LinearLayout card() {

                  LinearLayout box =
                          new LinearLayout(this);

                  box.setOrientation(
                          LinearLayout.VERTICAL);

                  box.setPadding(
                          dp(15),
                          dp(12),
                          dp(15),
                          dp(12));

                  GradientDrawable bg =
                          new GradientDrawable();

                  bg.setColor(
                          Color.rgb(22, 26, 31));

                  bg.setCornerRadius(
                          dp(18));

                  box.setBackground(bg);

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  -1);

                  p.setMargins(
                          dp(4),
                          dp(4),
                          dp(4),
                          dp(4));

                  box.setLayoutParams(p);

                  return box;
              }

              private LinearLayout infoCard(
                      String title,
                      String value) {

                  LinearLayout box =
                          card();

                  box.addView(
                          text(
                                  title,
                                  12,
                                  Color.LTGRAY));

                  TextView valueView =
                          text(
                                  value,
                                  23,
                                  Color.WHITE);

                  valueView.setGravity(
                          Gravity.CENTER);

                  box.addView(
                          valueView,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1));

                  return box;
              }

              private TextView buttonText(
                      String label) {

                  TextView button =
                          text(
                                  label,
                                  13,
                                  Color.WHITE);

                  button.setGravity(
                          Gravity.CENTER);

                  GradientDrawable bg =
                          new GradientDrawable();

                  bg.setColor(
                          Color.rgb(29, 34, 40));

                  bg.setCornerRadius(
                          dp(16));

                  button.setBackground(bg);

                  return button;
              }

              private TextView text(
                      String value,
                      float size,
                      int color) {

                  TextView view =
                          new TextView(this);

                  view.setText(value);

                  view.setTextSize(size);

                  view.setTextColor(color);

                  return view;
              }

              private int dp(float value) {

                  return Math.round(
                          value *
                          getResources()
                                  .getDisplayMetrics()
                                  .density);
              }

              // =====================================================
              // DATA
              // =====================================================

              private static final class AppInfo {

                  final ComponentName component;

                  final String name;

                  final Drawable icon;

                  AppInfo(
                          ComponentName component,
                          String name,
                          Drawable icon) {

                      this.component = component;

                      this.name = name;

                      this.icon = icon;
                  }
              }

              // =====================================================
              // TEXTURE HOST
              // =====================================================

              private static final class TextureHost
                      extends android.view.TextureView {

                  TextureHost(Context context) {
                      super(context);
                  }
              }
          }

          EOF

          echo "V10.4 LAUNCHER WRITTEN"

      # ============================================================
      # VERIFY LAUNCHER
      # ============================================================

      - name: Verify V10.4 launcher
        shell: bash
        run: |
          set -euo pipefail

          ACTIVITY="$(
            find v10-source/app/src/main/java \
              -type f \
              -name "V10CarActivity.java" \
              | head -1
          )"

          test -n "$ACTIVITY"

          grep -q \
            "CAR ASSISTANT" \
            "$ACTIVITY"

          grep -q \
            "APPLICATIONS" \
            "$ACTIVITY"

          grep -q \
            "MAP" \
            "$ACTIVITY"

          grep -q \
            "SPEED" \
            "$ACTIVITY"

          grep -q \
            "WEATHER" \
            "$ACTIVITY"

          grep -q \
            "MEDIA" \
            "$ACTIVITY"

          grep -q \
            "ACTION_MAIN" \
            "$ACTIVITY"

          grep -q \
            "CATEGORY_LAUNCHER" \
            "$ACTIVITY"

          grep -q \
            "V10SessionStore.setTarget" \
            "$ACTIVITY"

          grep -q \
            "session.setTarget" \
            "$ACTIVITY"

          grep -q \
            "session.back" \
            "$ACTIVITY"

          echo "V10.4 LAUNCHER SOURCE OK"

      # ============================================================
      # VERIFY NO V10 GEARHEAD CONTROL BAR
      # ============================================================

      - name: Verify V10 has no GearheadControlBar
        shell: bash
        run: |
          set -euo pipefail

          if find v10-source/app/src/main/java \
            -type f \
            -name "GearheadControlBar.java" \
            | grep -q .; then

            echo "ERROR: GearheadControlBar.java still exists"
            exit 1
          fi

          if grep -R \
            -E \
            "GearheadControlBar" \
            v10-source/app/src/main/java \
            --include="*.java"; then

            echo "ERROR: GearheadControlBar reference remains"
            exit 1
          fi

          echo "GEARHEAD CONTROL BAR REMOVED"

      # ============================================================
      # VERIFY V10 ACTIVITY DOES NOT USE WINDOWMANAGERGLOBAL
      # ============================================================

      - name: Verify V10 activity isolation
        shell: bash
        run: |
          set -euo pipefail

          ACTIVITY="$(
            find v10-source/app/src/main/java \
              -type f \
              -name "V10CarActivity.java" \
              | head -1
          )"

          if grep -q \
            "WindowManagerGlobal" \
            "$ACTIVITY"; then

            echo "ERROR: V10CarActivity uses WindowManagerGlobal"
            exit 1
          fi

          echo "V10 ACTIVITY ISOLATION OK"

      # ============================================================
      # VERIFY PROJECTION
      # ============================================================

      - name: Verify projection engine
        shell: bash
        run: |
          set -euo pipefail

          SESSION="$(
            find v10-source/app/src/main/java \
              -type f \
              -name "V10ProjectionSession.java" \
              | head -1
          )"

          test -n "$SESSION"

          grep -q \
            "createVirtualDisplay" \
            "$SESSION"

          grep -q \
            "/system/bin/am start" \
            "$SESSION"

          grep -q \
            "/system/bin/input -d" \
            "$SESSION"

          grep -q \
            "SurfaceTexture" \
            "$SESSION"

          echo "PROJECTION ENGINE OK"

      # ============================================================
      # VERIFY SWIPE
      # ============================================================

      - name: Verify swipe input
        shell: bash
        run: |
          set -euo pipefail

          INPUT="$(
            find v10-source/app/src/main/java \
              -type f \
              -name "V10InputController.java" \
              | head -1
          )"

          test -n "$INPUT"

          grep -q \
            "ACTION_MOVE" \
            "$INPUT"

          grep -q \
            "session.swipe" \
            "$INPUT"

          echo "SWIPE INPUT OK"

      # ============================================================
      # VERIFY XPOSED
      # ============================================================

      - name: Verify Xposed bridge
        shell: bash
        run: |
          set -euo pipefail

          BRIDGE="$(
            find v10-source/app/src/main/java \
              -type f \
              -name "AACastBridge.java" \
              | head -1
          )"

          test -n "$BRIDGE"

          grep -q \
            "com.google.android.projection.gearhead" \
            "$BRIDGE"

          grep -Eq \
            'InputHooks[[:space:]]*\.[[:space:]]*install' \
            "$BRIDGE"

          grep -Eq \
            'DisplayHooks[[:space:]]*\.[[:space:]]*installDisplayFlags' \
            "$BRIDGE"

          if grep -q \
            "GearheadControlBar" \
            "$BRIDGE"; then

            echo "ERROR: GearheadControlBar still referenced"
            exit 1
          fi

          echo "XPOSED BRIDGE OK"

      # ============================================================
      # ANDROID 12
      # ============================================================

      - name: Verify Android 12 compatibility
        shell: bash
        run: |
          set -euo pipefail

          if grep -R \
            -E \
            "VERSION_CODES\.TIRAMISU|VERSION_CODES\.UPSIDE_DOWN_CAKE|VERSION_CODES\.VANILLA_ICE_CREAM" \
            v10-source/app/src/main/java \
            --include="*.java"; then

            echo "ERROR: Android 13+ API reference found"
            exit 1
          fi

          echo "ANDROID 12 COMPATIBILITY OK"

      # ============================================================
      # CLEAN
      # ============================================================

      - name: Gradle clean
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            clean \
            --no-daemon

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build V10.4 debug
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK:"
          ls -lh "$APK"

          echo
          echo "SHA256:"
          sha256sum "$APK"

          echo
          echo "========================================"
          echo " CAR ASSISTANT V10.4 BUILD PASSED"
          echo "========================================"

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload V10.4 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10.4-Femto-Launcher-Fixed-debug
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit V10.4
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add v10-source

          if git diff --cached --quiet; then

            echo "No changes."

          else

            git commit \
              -m "Build V10.4 Femto style launcher"

            git push

          fi
