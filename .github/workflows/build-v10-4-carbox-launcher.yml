name: Build Car Assistant V10.4 - Femto Style Launcher

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build V10.4 Femto Style Launcher
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-disabled: true

      # ============================================================
      # VERIFY CURRENT V10 SOURCE
      # ============================================================

      - name: Verify V10 source
        shell: bash
        run: |
          set -euo pipefail

          test -d v10-source

          test -f \
            v10-source/app/src/main/AndroidManifest.xml

          test -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

          test -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java

          test -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10InputController.java

          test -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java

          echo "V10 SOURCE OK"

      # ============================================================
      # REMOVE OLD GEARHEAD UI DEPENDENCY
      # ============================================================

      - name: Remove Gearhead control bar dependency
        shell: bash
        run: |
          set -euo pipefail

          BRIDGE="$(
            find v10-source/app/src/main/java \
              -type f \
              -name "AACastBridge.java" \
              | head -1
          )"

          if [ -z "$BRIDGE" ]; then
            echo "AACastBridge.java not found"
            exit 1
          fi

          echo "Bridge: $BRIDGE"

          sed -i \
            '/import com\.carassistant\.v10\.hook\.GearheadControlBar;/d' \
            "$BRIDGE"

          sed -i \
            '/GearheadControlBar[[:space:]]*\.[[:space:]]*install[[:space:]]*(/d' \
            "$BRIDGE"

          echo "Gearhead control bar dependency removed"

          grep -n \
            "GearheadDockPatcher" \
            "$BRIDGE" || true

      # ============================================================
      # WRITE FEMTO STYLE V10 CAR ACTIVITY
      # ============================================================

      - name: Write V10 Femto style launcher
        shell: bash
        run: |
          set -euo pipefail

          cat > \
          v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java \
          <<'EOF'

          package com.carassistant.v10;

          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ResolveInfo;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.view.WindowManager;
          import android.widget.BaseAdapter;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.GridView;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import com.google.android.apps.auto.sdk.CarActivity;

          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;

          public final class V10CarActivity
                  extends CarActivity {

              private FrameLayout root;

              private TextureHost textureHost;

              private V10ProjectionSession session;

              private V10InputController inputController;

              private LinearLayout dashboard;

              private LinearLayout appPanel;

              private LinearLayout dock;

              private TextView clock;

              private TextView date;

              private TextView targetLabel;

              private final Handler handler =
                      new Handler(Looper.getMainLooper());

              private final Runnable clockUpdater =
                      new Runnable() {
                          @Override
                          public void run() {

                              updateClock();

                              handler.postDelayed(
                                      this,
                                      1000);
                          }
                      };

              private final ArrayList<AppInfo> apps =
                      new ArrayList<>();

              private final ArrayList<AppInfo> dockApps =
                      new ArrayList<>();

              @Override
              protected void onCreate(Bundle bundle) {

                  super.onCreate(bundle);

                  Window window =
                          getWindow();

                  window.setFlags(
                          WindowManager.LayoutParams.FLAG_FULLSCREEN,
                          WindowManager.LayoutParams.FLAG_FULLSCREEN);

                  buildUi();

                  loadApps();

                  setContentView(root);

                  handler.post(clockUpdater);

                  attachProjection();
              }

              // =====================================================
              // ROOT UI
              // =====================================================

              private void buildUi() {

                  root =
                          new FrameLayout(this);

                  root.setBackgroundColor(
                          Color.rgb(8, 10, 13));

                  buildDashboard();

                  buildAppPanel();

                  root.addView(
                          dashboard,
                          new FrameLayout.LayoutParams(
                                  -1,
                                  -1));

                  root.addView(
                          appPanel,
                          new FrameLayout.LayoutParams(
                                  -1,
                                  -1));

                  appPanel.setVisibility(
                          View.GONE);
              }

              // =====================================================
              // FEMTO STYLE DASHBOARD
              // =====================================================

              private void buildDashboard() {

                  dashboard =
                          new LinearLayout(this);

                  dashboard.setOrientation(
                          LinearLayout.VERTICAL);

                  dashboard.setPadding(
                          dp(18),
                          dp(12),
                          dp(18),
                          dp(8));

                  // -------------------------------------------------
                  // HEADER
                  // -------------------------------------------------

                  LinearLayout header =
                          new LinearLayout(this);

                  header.setGravity(
                          Gravity.CENTER_VERTICAL);

                  header.setPadding(
                          dp(4),
                          0,
                          dp(4),
                          dp(8));

                  LinearLayout titleBox =
                          new LinearLayout(this);

                  titleBox.setOrientation(
                          LinearLayout.VERTICAL);

                  TextView title =
                          text(
                                  "CAR ASSISTANT",
                                  20,
                                  Color.WHITE);

                  title.setTypeface(
                          null,
                          android.graphics.Typeface.BOLD);

                  date =
                          text(
                                  "",
                                  13,
                                  Color.LTGRAY);

                  titleBox.addView(title);

                  titleBox.addView(
                          date);

                  header.addView(
                          titleBox,
                          new LinearLayout.LayoutParams(
                                  0,
                                  -2,
                                  1));

                  clock =
                          text(
                                  "",
                                  25,
                                  Color.WHITE);

                  clock.setGravity(
                          Gravity.CENTER_VERTICAL |
                          Gravity.RIGHT);

                  header.addView(
                          clock,
                          new LinearLayout.LayoutParams(
                                  dp(150),
                                  dp(55)));

                  dashboard.addView(
                          header);

                  // -------------------------------------------------
                  // MAIN CONTENT
                  // -------------------------------------------------

                  LinearLayout content =
                          new LinearLayout(this);

                  content.setOrientation(
                          LinearLayout.VERTICAL);

                  LinearLayout.LayoutParams contentParams =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1);

                  // MAP
                  LinearLayout mapCard =
                          card();

                  TextView mapTitle =
                          text(
                                  "MAP",
                                  14,
                                  Color.WHITE);

                  mapCard.addView(
                          mapTitle);

                  TextView mapText =
                          text(
                                  "Navigation",
                                  30,
                                  Color.WHITE);

                  mapText.setGravity(
                          Gravity.CENTER);

                  mapCard.addView(
                          mapText,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1));

                  content.addView(
                          mapCard,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  2));

                  // -------------------------------------------------
                  // INFO ROW
                  // -------------------------------------------------

                  LinearLayout info =
                          new LinearLayout(this);

                  info.setOrientation(
                          LinearLayout.HORIZONTAL);

                  // SPEED
                  LinearLayout speed =
                          card();

                  speed.addView(
                          text(
                                  "SPEED",
                                  13,
                                  Color.LTGRAY));

                  TextView speedValue =
                          text(
                                  "0 km/h",
                                  27,
                                  Color.WHITE);

                  speedValue.setGravity(
                          Gravity.CENTER);

                  speed.addView(
                          speedValue,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1));

                  info.addView(
                          speed,
                          new LinearLayout.LayoutParams(
                                  0,
                                  -1,
                                  1));

                  // WEATHER
                  LinearLayout weather =
                          card();

                  weather.addView(
                          text(
                                  "WEATHER",
                                  13,
                                  Color.LTGRAY));

                  TextView weatherValue =
                          text(
                                  "-- °C",
                                  27,
                                  Color.WHITE);

                  weatherValue.setGravity(
                          Gravity.CENTER);

                  weather.addView(
                          weatherValue,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1));

                  info.addView(
                          weather,
                          new LinearLayout.LayoutParams(
                                  0,
                                  -1,
                                  1));

                  // MEDIA
                  LinearLayout media =
                          card();

                  media.addView(
                          text(
                                  "MEDIA",
                                  13,
                                  Color.LTGRAY));

                  TextView mediaValue =
                          text(
                                  "No media",
                                  20,
                                  Color.WHITE);

                  mediaValue.setGravity(
                          Gravity.CENTER);

                  media.addView(
                          mediaValue,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1));

                  info.addView(
                          media,
                          new LinearLayout.LayoutParams(
                                  0,
                                  -1,
                                  1));

                  content.addView(
                          info,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(120)));

                  dashboard.addView(
                          content,
                          contentParams);

                  // -------------------------------------------------
                  // BOTTOM DOCK
                  // -------------------------------------------------

                  LinearLayout dockContainer =
                          new LinearLayout(this);

                  dockContainer.setGravity(
                          Gravity.CENTER_VERTICAL);

                  dockContainer.setPadding(
                          dp(4),
                          dp(6),
                          dp(4),
                          dp(2));

                  dock =
                          new LinearLayout(this);

                  dock.setGravity(
                          Gravity.CENTER_VERTICAL);

                  dockContainer.addView(
                          dock,
                          new LinearLayout.LayoutParams(
                                  0,
                                  -1,
                                  1));

                  Button appsButton =
                          controlButton(
                                  "APPS");

                  appsButton.setOnClickListener(
                          v -> showApps());

                  dockContainer.addView(
                          appsButton,
                          new LinearLayout.LayoutParams(
                                  dp(95),
                                  dp(60)));

                  dashboard.addView(
                          dockContainer,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(68)));
              }

              // =====================================================
              // APPLICATION PANEL
              // =====================================================

              private void buildAppPanel() {

                  appPanel =
                          new LinearLayout(this);

                  appPanel.setOrientation(
                          LinearLayout.VERTICAL);

                  appPanel.setPadding(
                          dp(18),
                          dp(14),
                          dp(18),
                          dp(12));

                  appPanel.setBackgroundColor(
                          Color.rgb(9, 11, 14));

                  LinearLayout top =
                          new LinearLayout(this);

                  top.setGravity(
                          Gravity.CENTER_VERTICAL);

                  Button back =
                          controlButton(
                                  "BACK");

                  back.setOnClickListener(
                          v -> hideApps());

                  top.addView(
                          back,
                          new LinearLayout.LayoutParams(
                                  dp(100),
                                  dp(60)));

                  TextView label =
                          text(
                                  "APPLICATIONS",
                                  21,
                                  Color.WHITE);

                  label.setGravity(
                          Gravity.CENTER);

                  top.addView(
                          label,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(60),
                                  1));

                  appPanel.addView(
                          top);

                  ScrollView scroll =
                          new ScrollView(this);

                  GridView grid =
                          new GridView(this);

                  grid.setNumColumns(4);

                  grid.setVerticalSpacing(
                          dp(12));

                  grid.setHorizontalSpacing(
                          dp(12));

                  grid.setPadding(
                          dp(4),
                          dp(10),
                          dp(4),
                          dp(10));

                  grid.setAdapter(
                          new AppAdapter());

                  scroll.addView(
                          grid);

                  appPanel.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1));
              }

              // =====================================================
              // APP DISCOVERY
              // =====================================================

              private void loadApps() {

                  apps.clear();

                  Intent intent =
                          new Intent(
                                  Intent.ACTION_MAIN);

                  intent.addCategory(
                          Intent.CATEGORY_LAUNCHER);

                  List<ResolveInfo> resolved =
                          getPackageManager()
                                  .queryIntentActivities(
                                          intent,
                                          0);

                  for (ResolveInfo info :
                          resolved) {

                      String packageName =
                              info.activityInfo.packageName;

                      if (packageName.equals(
                              getPackageName())) {
                          continue;
                      }

                      ComponentName component =
                              new ComponentName(
                                      info.activityInfo.packageName,
                                      info.activityInfo.name);

                      CharSequence label =
                              info.loadLabel(
                                      getPackageManager());

                      AppInfo app =
                              new AppInfo(
                                      component,
                                      label == null
                                              ? packageName
                                              : label.toString(),
                                      info.loadIcon(
                                              getPackageManager()));

                      apps.add(app);
                  }

                  Collections.sort(
                          apps,
                          (a, b) ->
                                  a.name.compareToIgnoreCase(
                                          b.name));

                  dockApps.clear();

                  int count =
                          Math.min(
                                  5,
                                  apps.size());

                  for (int i = 0;
                       i < count;
                       i++) {

                      dockApps.add(
                              apps.get(i));
                  }

                  rebuildDock();
              }

              private void rebuildDock() {

                  if (dock == null) {
                      return;
                  }

                  dock.removeAllViews();

                  for (AppInfo app :
                          dockApps) {

                      View item =
                              createDockItem(app);

                      dock.addView(
                              item,
                              new LinearLayout.LayoutParams(
                                      0,
                                      -1,
                                      1));
                  }
              }

              // =====================================================
              // DOCK ITEM
              // =====================================================

              private View createDockItem(
                      AppInfo app) {

                  LinearLayout box =
                          new LinearLayout(this);

                  box.setOrientation(
                          LinearLayout.VERTICAL);

                  box.setGravity(
                          Gravity.CENTER);

                  ImageView icon =
                          new ImageView(this);

                  icon.setImageDrawable(
                          app.icon);

                  box.addView(
                          icon,
                          new LinearLayout.LayoutParams(
                                  dp(34),
                                  dp(34)));

                  TextView label =
                          text(
                                  app.name,
                                  10,
                                  Color.WHITE);

                  label.setGravity(
                          Gravity.CENTER);

                  label.setMaxLines(1);

                  box.addView(
                          label,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(22)));

                  box.setOnClickListener(
                          v -> launchProjection(
                                  app.component));

                  return box;
              }

              // =====================================================
              // APP PANEL
              // =====================================================

              private final class AppAdapter
                      extends BaseAdapter {

                  @Override
                  public int getCount() {
                      return apps.size();
                  }

                  @Override
                  public Object getItem(int position) {
                      return apps.get(position);
                  }

                  @Override
                  public long getItemId(int position) {
                      return position;
                  }

                  @Override
                  public View getView(
                          int position,
                          View convertView,
                          ViewGroup parent) {

                      AppInfo app =
                              apps.get(position);

                      LinearLayout box =
                              new LinearLayout(
                                      V10CarActivity.this);

                      box.setOrientation(
                              LinearLayout.VERTICAL);

                      box.setGravity(
                              Gravity.CENTER);

                      box.setPadding(
                              dp(6),
                              dp(8),
                              dp(6),
                              dp(8));

                      ImageView icon =
                              new ImageView(
                                      V10CarActivity.this);

                      icon.setImageDrawable(
                              app.icon);

                      box.addView(
                              icon,
                              new LinearLayout.LayoutParams(
                                      dp(58),
                                      dp(58)));

                      TextView name =
                              text(
                                      app.name,
                                      13,
                                      Color.WHITE);

                      name.setGravity(
                              Gravity.CENTER);

                      name.setMaxLines(2);

                      box.addView(
                              name,
                              new LinearLayout.LayoutParams(
                                      -1,
                                      dp(42)));

                      box.setOnClickListener(
                              v -> {

                                  hideApps();

                                  launchProjection(
                                          app.component);
                              });

                      return box;
                  }
              }

              // =====================================================
              // PROJECTION
              // =====================================================

              private void attachProjection() {

                  textureHost =
                          new TextureHost(this);

                  textureHost.setBackgroundColor(
                          Color.TRANSPARENT);

                  root.addView(
                          textureHost,
                          new FrameLayout.LayoutParams(
                                  -1,
                                  -1));

                  /*
                   * The dashboard stays visible until an app
                   * projection becomes active.
                   *
                   * TextureHost is transparent while launcher
                   * is active.
                   */

                  session =
                          new V10ProjectionSession(
                                  this);

                  session.attachTextureView(
                          textureHost);

                  inputController =
                          new V10InputController(
                                  session);

                  textureHost.setOnTouchListener(
                          inputController
                                  .createListener());

                  String target =
                          getIntent()
                                  .getStringExtra(
                                          "target");

                  if (target != null) {

                      ComponentName component =
                              ComponentName
                                      .unflattenFromString(
                                              target);

                      if (component != null) {
                          launchProjection(
                                  component);
                      }
                  }
              }

              private void launchProjection(
                      ComponentName component) {

                  if (component == null) {
                      return;
                  }

                  V10SessionStore.setTarget(
                          this,
                          component);

                  if (session != null) {

                      session.setTarget(
                              component);
                  }

                  if (dashboard != null) {
                      dashboard.setVisibility(
                              View.GONE);
                  }

                  if (appPanel != null) {
                      appPanel.setVisibility(
                              View.GONE);
                  }
              }

              // =====================================================
              // APPS
              // =====================================================

              private void showApps() {

                  if (appPanel != null) {
                      appPanel.setVisibility(
                              View.VISIBLE);
                  }

                  if (dashboard != null) {
                      dashboard.setVisibility(
                              View.GONE);
                  }
              }

              private void hideApps() {

                  if (appPanel != null) {
                      appPanel.setVisibility(
                              View.GONE);
                  }

                  if (dashboard != null) {
                      dashboard.setVisibility(
                              View.VISIBLE);
                  }
              }

              // =====================================================
              // CLOCK
              // =====================================================

              private void updateClock() {

                  if (clock == null ||
                          date == null) {
                      return;
                  }

                  Date now =
                          new Date();

                  clock.setText(
                          new SimpleDateFormat(
                                  "HH:mm",
                                  Locale.getDefault())
                                  .format(now));

                  date.setText(
                          new SimpleDateFormat(
                                  "EEEE, dd MMMM",
                                  Locale.getDefault())
                                  .format(now));
              }

              // =====================================================
              // CAR BACK
              // =====================================================

              @Override
              public void onBackPressed() {

                  if (appPanel != null &&
                          appPanel.getVisibility()
                                  == View.VISIBLE) {

                      hideApps();

                      return;
                  }

                  if (session != null &&
                          session.isActive()) {

                      session.back();

                      return;
                  }

                  super.onBackPressed();
              }

              // =====================================================
              // LIFECYCLE
              // =====================================================

              @Override
              protected void onResume() {

                  super.onResume();

                  if (session != null) {
                      session.resume();
                  }

                  handler.post(
                          clockUpdater);
              }

              @Override
              protected void onPause() {

                  if (session != null) {
                      session.pause();
                  }

                  handler.removeCallbacks(
                          clockUpdater);

                  super.onPause();
              }

              @Override
              protected void onDestroy() {

                  handler.removeCallbacks(
                          clockUpdater);

                  if (session != null) {
                      session.destroy();
                  }

                  super.onDestroy();
              }

              // =====================================================
              // UI HELPERS
              // =====================================================

              private LinearLayout card() {

                  LinearLayout box =
                          new LinearLayout(this);

                  box.setOrientation(
                          LinearLayout.VERTICAL);

                  box.setPadding(
                          dp(16),
                          dp(12),
                          dp(16),
                          dp(12));

                  GradientDrawable background =
                          new GradientDrawable();

                  background.setColor(
                          Color.rgb(22, 26, 31));

                  background.setCornerRadius(
                          dp(18));

                  box.setBackground(
                          background);

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  -1);

                  params.setMargins(
                          dp(4),
                          dp(4),
                          dp(4),
                          dp(4));

                  box.setLayoutParams(
                          params);

                  return box;
              }

              private Button controlButton(
                      String label) {

                  Button button =
                          new Button(this);

                  button.setText(label);

                  button.setTextColor(
                          Color.WHITE);

                  button.setTextSize(
                          13);

                  button.setAllCaps(
                          false);

                  GradientDrawable background =
                          new GradientDrawable();

                  background.setColor(
                          Color.rgb(28, 33, 39));

                  background.setCornerRadius(
                          dp(16));

                  button.setBackground(
                          background);

                  return button;
              }

              private TextView text(
                      String value,
                      float size,
                      int color) {

                  TextView view =
                          new TextView(this);

                  view.setText(value);

                  view.setTextSize(size);

                  view.setTextColor(color);

                  return view;
              }

              private int dp(float value) {

                  return Math.round(
                          value *
                          getResources()
                                  .getDisplayMetrics()
                                  .density);
              }

              // =====================================================
              // APP DATA
              // =====================================================

              private static final class AppInfo {

                  final ComponentName component;

                  final String name;

                  final android.graphics.drawable.Drawable icon;

                  AppInfo(
                          ComponentName component,
                          String name,
                          android.graphics.drawable.Drawable icon) {

                      this.component = component;

                      this.name = name;

                      this.icon = icon;
                  }
              }

              // =====================================================
              // TRANSPARENT TEXTURE HOST
              // =====================================================

              private static final class TextureHost
                      extends android.view.TextureView {

                  TextureHost(Context context) {

                      super(context);

                      setOpaque(false);
                  }
              }
          }

          EOF

          echo "V10.4 Femto-style launcher written"

      # ============================================================
      # VERIFY FEMTO STYLE UI
      # ============================================================

      - name: Verify Femto launcher source
        shell: bash
        run: |
          set -euo pipefail

          ACTIVITY="$(
            find v10-source/app/src/main/java \
              -type f \
              -name "V10CarActivity.java" \
              | head -1
          )"

          test -n "$ACTIVITY"

          grep -q \
            "CAR ASSISTANT" \
            "$ACTIVITY"

          grep -q \
            "APPLICATIONS" \
            "$ACTIVITY"

          grep -q \
            "MAP" \
            "$ACTIVITY"

          grep -q \
            "SPEED" \
            "$ACTIVITY"

          grep -q \
            "WEATHER" \
            "$ACTIVITY"

          grep -q \
            "MEDIA" \
            "$ACTIVITY"

          grep -q \
            "ACTION_MAIN" \
            "$ACTIVITY"

          grep -q \
            "CATEGORY_LAUNCHER" \
            "$ACTIVITY"

          grep -q \
            "V10SessionStore.setTarget" \
            "$ACTIVITY"

          grep -q \
            "session.setTarget" \
            "$ACTIVITY"

          grep -q \
            "session.back" \
            "$ACTIVITY"

          echo "FEMTO LAUNCHER SOURCE OK"

      # ============================================================
      # VERIFY NO GEARHEAD UI
      # ============================================================

      - name: Verify no Gearhead UI dependency
        shell: bash
        run: |
          set -euo pipefail

          if grep -R \
            -E \
            "GearheadControlBar|WindowManagerGlobal" \
            v10-source/app/src/main/java \
            --include="*.java"; then

            echo "ERROR: Old Gearhead UI code remains"
            exit 1
          fi

          echo "NO OLD GEARHEAD UI OK"

      # ============================================================
      # VERIFY PROJECTION ENGINE
      # ============================================================

      - name: Verify projection engine
        shell: bash
        run: |
          set -euo pipefail

          SESSION="$(
            find v10-source/app/src/main/java \
              -type f \
              -name "V10ProjectionSession.java" \
              | head -1
          )"

          test -n "$SESSION"

          grep -q \
            "createVirtualDisplay" \
            "$SESSION"

          grep -q \
            "/system/bin/am start" \
            "$SESSION"

          grep -q \
            "/system/bin/input -d" \
            "$SESSION"

          grep -q \
            "SurfaceTexture" \
            "$SESSION"

          echo "PROJECTION ENGINE OK"

      # ============================================================
      # VERIFY SWIPE INPUT
      # ============================================================

      - name: Verify swipe input
        shell: bash
        run: |
          set -euo pipefail

          INPUT="$(
            find v10-source/app/src/main/java \
              -type f \
              -name "V10InputController.java" \
              | head -1
          )"

          test -n "$INPUT"

          grep -q \
            "ACTION_MOVE" \
            "$INPUT"

          grep -q \
            "session.swipe" \
            "$INPUT"

          echo "SWIPE INPUT OK"

      # ============================================================
      # VERIFY XPOSED BRIDGE
      # ============================================================

      - name: Verify Xposed bridge
        shell: bash
        run: |
          set -euo pipefail

          BRIDGE="$(
            find v10-source/app/src/main/java \
              -type f \
              -name "AACastBridge.java" \
              | head -1
          )"

          test -n "$BRIDGE"

          grep -q \
            "com.google.android.projection.gearhead" \
            "$BRIDGE"

          grep -Eq \
            'InputHooks[[:space:]]*\.[[:space:]]*install' \
            "$BRIDGE"

          grep -Eq \
            'DisplayHooks[[:space:]]*\.[[:space:]]*installDisplayFlags' \
            "$BRIDGE"

          echo "XPOSED BRIDGE OK"

      # ============================================================
      # VERIFY ANDROID 12
      # ============================================================

      - name: Verify Android 12 compatibility
        shell: bash
        run: |
          set -euo pipefail

          if grep -R \
            -E \
            "android\.os\.Build\.VERSION_CODES\.TIRAMISU|API 33|minSdk.*33" \
            v10-source/app \
            --include="*.java" \
            --include="*.gradle" \
            --include="*.xml"; then

            echo "ERROR: Android 13-only API reference detected"
            exit 1
          fi

          echo "ANDROID 12 COMPATIBILITY CHECK PASSED"

      # ============================================================
      # GRADLE CLEAN
      # ============================================================

      - name: Gradle clean
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            clean \
            --no-daemon

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build V10.4 debug APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo
          echo "APK:"
          ls -lh "$APK"

          echo
          echo "SHA256:"
          sha256sum "$APK"

          echo
          echo "========================================"
          echo " CAR ASSISTANT V10.4 BUILD PASSED"
          echo "========================================"

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload V10.4 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10.4-Femto-Launcher-debug
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit V10.4 source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add v10-source

          if git diff --cached --quiet; then

            echo "No V10.4 changes."

          else

            git commit \
              -m "Build V10.4 Femto style car launcher"

            git push

          fi
