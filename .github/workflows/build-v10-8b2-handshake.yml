name: Build Car Assistant V10 - 8B2 Startup Handshake Fixed v5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify existing V10
        shell: bash
        run: |
          set -euo pipefail

          ROOT="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          for file in \
            V10ProjectionService.java \
            V10ProjectionSession.java \
            V10CarActivity.java \
            V10SessionStore.java \
            V10InputController.java \
            RootShellSession.java
          do
            test -f "$ROOT/$file"
            echo "PASS: $file"
          done

          grep -Fq 'package com.carassistant.v10;' \
            "$ROOT/V10ProjectionService.java"

          grep -Fq 'package com.carassistant.v10;' \
            "$ROOT/V10ProjectionSession.java"

          grep -Eq 'MAX_RECENTS[[:space:]]*=[[:space:]]*4' \
            "$ROOT/V10SessionStore.java"

          echo "PASS: existing V10"

      - name: Patch V10ProjectionService - safe full method replacement
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/"
              "V10ProjectionService.java"
          )

          text = path.read_text()

          # ------------------------------------------------------------
          # Generic Java method locator.
          #
          # IMPORTANT:
          # The returned start position is the BEGINNING OF THE
          # DECLARATION LINE, not the method name.
          #
          # This prevents:
          #
          # public static void public static void method(...)
          # ------------------------------------------------------------

          def find_method(text, name):
              pattern = re.compile(
                  r'\b' + re.escape(name) + r'\s*\('
              )

              for match in pattern.finditer(text):

                  pos = match.start()

                  before = text[:pos]

                  # Ignore calls such as:
                  # object.method(...)
                  if before.rstrip().endswith("."):
                      continue

                  # Find opening parenthesis.
                  open_paren = text.find("(", pos)

                  if open_paren < 0:
                      continue

                  # Find matching parenthesis.
                  depth = 0
                  i = open_paren
                  state = "normal"

                  close_paren = None

                  while i < len(text):

                      c = text[i]
                      n = text[i + 1] if i + 1 < len(text) else ""

                      if state == "normal":

                          if c == "/" and n == "/":
                              state = "line"
                              i += 2
                              continue

                          if c == "/" and n == "*":
                              state = "block"
                              i += 2
                              continue

                          if c == '"':
                              state = "string"
                              i += 1
                              continue

                          if c == "'":
                              state = "char"
                              i += 1
                              continue

                          if c == "(":
                              depth += 1

                          elif c == ")":
                              depth -= 1

                              if depth == 0:
                                  close_paren = i
                                  break

                      elif state == "line":

                          if c == "\n":
                              state = "normal"

                      elif state == "block":

                          if c == "*" and n == "/":
                              state = "normal"
                              i += 2
                              continue

                      elif state == "string":

                          if c == "\\":
                              i += 2
                              continue

                          if c == '"':
                              state = "normal"

                      elif state == "char":

                          if c == "\\":
                              i += 2
                              continue

                          if c == "'":
                              state = "normal"

                      i += 1

                  if close_paren is None:
                      continue

                  # Locate opening method brace.
                  i = close_paren + 1

                  while i < len(text):

                      if text.startswith("//", i):

                          nl = text.find("\n", i + 2)

                          if nl < 0:
                              i = len(text)
                          else:
                              i = nl + 1

                          continue

                      if text.startswith("/*", i):

                          end = text.find("*/", i + 2)

                          if end < 0:
                              i = len(text)
                          else:
                              i = end + 2

                          continue

                      if text[i].isspace():
                          i += 1
                          continue

                      break

                  if i >= len(text) or text[i] != "{":
                      continue

                  open_brace = i

                  # Find declaration line start.
                  line_start = text.rfind("\n", 0, pos) + 1

                  # Make sure this really looks like a declaration.
                  declaration_prefix = text[
                      line_start:pos
                  ]

                  if not re.search(
                      r'\b(public|private|protected|static)\b',
                      declaration_prefix
                  ):
                      continue

                  # Match method body braces.
                  depth = 0
                  i = open_brace
                  state = "normal"

                  while i < len(text):

                      c = text[i]
                      n = text[i + 1] if i + 1 < len(text) else ""

                      if state == "normal":

                          if c == "/" and n == "/":
                              state = "line"
                              i += 2
                              continue

                          if c == "/" and n == "*":
                              state = "block"
                              i += 2
                              continue

                          if c == '"':
                              state = "string"
                              i += 1
                              continue

                          if c == "'":
                              state = "char"
                              i += 1
                              continue

                          if c == "{":
                              depth += 1

                          elif c == "}":

                              depth -= 1

                              if depth == 0:
                                  return line_start, i + 1

                      elif state == "line":

                          if c == "\n":
                              state = "normal"

                      elif state == "block":

                          if c == "*" and n == "/":
                              state = "normal"
                              i += 2
                              continue

                      elif state == "string":

                          if c == "\\":
                              i += 2
                              continue

                          if c == '"':
                              state = "normal"

                      elif state == "char":

                          if c == "\\":
                              i += 2
                              continue

                          if c == "'":
                              state = "normal"

                      i += 1

              return None

          def replace_method(text, name, replacement):

              found = find_method(text, name)

              if found is None:
                  raise SystemExit(
                      f"ERROR: method {name} not found"
                  )

              start, end = found

              return (
                  text[:start]
                  + replacement
                  + text[end:]
              )

          # ------------------------------------------------------------
          # Add handshake fields exactly once.
          # ------------------------------------------------------------

          if "private static final Object START_LOCK" not in text:

              marker = (
                  "private static volatile "
                  "V10ProjectionService instance;"
              )

              if marker not in text:
                  raise SystemExit(
                      "ERROR: instance marker not found"
                  )

              fields = """
    private static final Object START_LOCK =
            new Object();

    private static ComponentName pendingTarget;

    private static Surface pendingSurface;

    private static int pendingWidth;

    private static int pendingHeight;
"""

              text = text.replace(
                  marker,
                  marker + fields,
                  1
              )

          # ------------------------------------------------------------
          # ensureStarted()
          # ------------------------------------------------------------

          ensure_started = """
    public static void ensureStarted(
            android.content.Context context) {

        if (getInstance() != null) {
            return;
        }

        android.content.Context appContext =
                context.getApplicationContext();

        try {

            Intent intent =
                    new Intent(
                            appContext,
                            V10ProjectionService.class);

            if (Build.VERSION.SDK_INT >= 26) {

                appContext.startForegroundService(
                        intent);

            } else {

                appContext.startService(
                        intent);
            }

        } catch (Throwable error) {

            Log.w(
                    TAG,
                    "Unable to start projection service",
                    error);
        }
    }
"""

          text = replace_method(
              text,
              "ensureStarted",
              ensure_started
          )

          # ------------------------------------------------------------
          # setTarget()
          # ------------------------------------------------------------

          set_target = """
    public static void setTarget(
            android.content.Context context,
            ComponentName component) {

        synchronized (START_LOCK) {

            V10ProjectionService service =
                    getInstance();

            if (service == null) {

                pendingTarget = component;

                ensureStarted(context);

                return;
            }

            service.setTargetInternal(
                    component);
        }
    }
"""

          text = replace_method(
              text,
              "setTarget",
              set_target
          )

          # ------------------------------------------------------------
          # attachSurface()
          # ------------------------------------------------------------

          attach_surface = """
    public static void attachSurface(
            android.content.Context context,
            Surface newSurface,
            int newWidth,
            int newHeight) {

        if (newSurface == null
                || newWidth <= 0
                || newHeight <= 0) {

            return;
        }

        synchronized (START_LOCK) {

            V10ProjectionService service =
                    getInstance();

            if (service == null) {

                if (pendingSurface != null
                        && pendingSurface != newSurface) {

                    try {
                        pendingSurface.release();
                    } catch (Throwable ignored) {
                    }
                }

                pendingSurface = newSurface;
                pendingWidth = newWidth;
                pendingHeight = newHeight;

                ensureStarted(context);

                return;
            }

            service.attachSurfaceInternal(
                    newSurface,
                    newWidth,
                    newHeight);
        }
    }
"""

          text = replace_method(
              text,
              "attachSurface",
              attach_surface
          )

          # ------------------------------------------------------------
          # flushPendingState()
          # ------------------------------------------------------------

          if "private void flushPendingState()" not in text:

              marker = "    private void detachSurfaceInternal"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: detachSurfaceInternal marker not found"
                  )

              flush = """
    private void flushPendingState() {

        synchronized (START_LOCK) {

            if (instance != this || destroyed) {
                return;
            }

            ComponentName pendingT =
                    pendingTarget;

            Surface pendingS =
                    pendingSurface;

            int pendingW =
                    pendingWidth;

            int pendingH =
                    pendingHeight;

            pendingTarget = null;
            pendingSurface = null;
            pendingWidth = 0;
            pendingHeight = 0;

            try {

                if (pendingT != null) {

                    setTargetInternal(
                            pendingT);
                }

                if (pendingS != null) {

                    attachSurfaceInternal(
                            pendingS,
                            pendingW,
                            pendingH);
                }

            } catch (Throwable error) {

                Log.e(
                        TAG,
                        "Pending projection state failed",
                        error);
            }
        }
    }

"""

              text = text.replace(
                  marker,
                  flush + marker,
                  1
              )

          # ------------------------------------------------------------
          # Call flushPendingState() after startForeground().
          # ------------------------------------------------------------

          if "flushPendingState();" not in text:

              marker = (
                  "        startForeground(\n"
                  "                NOTIFICATION_ID,\n"
                  "                notification);"
              )

              if marker not in text:
                  raise SystemExit(
                      "ERROR: startForeground block not found"
                  )

              text = text.replace(
                  marker,
                  marker
                  + "\n\n"
                  + "        flushPendingState();",
                  1
              )

          path.write_text(text)

          print(
              "PASS: V10ProjectionService patched"
          )
          PY

      - name: Patch V10ProjectionSession - constructor only
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/"
              "V10ProjectionSession.java"
          )

          text = path.read_text()

          # Locate the constructor declaration.
          pattern = re.compile(
              r'\bV10ProjectionSession\s*\('
          )

          constructor = None

          for match in pattern.finditer(text):

              pos = match.start()

              before = text[:pos].rstrip()

              if before.endswith("."):
                  continue

              if before.endswith("new"):
                  continue

              open_paren = text.find("(", pos)

              depth = 0
              i = open_paren
              close_paren = None

              while i < len(text):

                  c = text[i]

                  if c == "(":
                      depth += 1

                  elif c == ")":

                      depth -= 1

                      if depth == 0:
                          close_paren = i
                          break

                  i += 1

              if close_paren is None:
                  continue

              i = close_paren + 1

              while i < len(text) and text[i].isspace():
                  i += 1

              if i < len(text) and text[i] == "{":

                  line_start = text.rfind(
                      "\n",
                      0,
                      pos
                  ) + 1

                  constructor = (
                      line_start,
                      i
                  )

                  break

          if constructor is None:
              raise SystemExit(
                  "ERROR: V10ProjectionSession constructor not found"
              )

          start, brace = constructor

          # Find matching constructor brace.
          depth = 0
          i = brace
          end = None

          while i < len(text):

              if text[i] == "{":
                  depth += 1

              elif text[i] == "}":

                  depth -= 1

                  if depth == 0:
                      end = i + 1
                      break

              i += 1

          if end is None:
              raise SystemExit(
                  "ERROR: constructor closing brace not found"
              )

          replacement = """
    public V10ProjectionSession(
            Context context) {

        this.context =
                context.getApplicationContext();
    }"""

          text = (
              text[:start]
              + replacement
              + text[end:]
          )

          path.write_text(text)

          print(
              "PASS: constructor replaced"
          )
          PY

      - name: Verify patched source before build
        shell: bash
        run: |
          set -euo pipefail

          ROOT="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          SERVICE="$ROOT/V10ProjectionService.java"
          SESSION="$ROOT/V10ProjectionSession.java"

          # Critical regression check.
          if grep -nF \
            "public static void public static void" \
            "$SERVICE"; then

            echo "ERROR: duplicated method declaration detected."
            exit 1
          fi

          grep -Fq \
            "private static final Object START_LOCK" \
            "$SERVICE"

          grep -Fq \
            "pendingTarget" \
            "$SERVICE"

          grep -Fq \
            "pendingSurface" \
            "$SERVICE"

          grep -Fq \
            "pendingWidth" \
            "$SERVICE"

          grep -Fq \
            "pendingHeight" \
            "$SERVICE"

          grep -Fq \
            "private void flushPendingState()" \
            "$SERVICE"

          grep -Fq \
            "flushPendingState();" \
            "$SERVICE"

          grep -Fq \
            "public static void ensureStarted" \
            "$SERVICE"

          grep -Fq \
            "public static void setTarget" \
            "$SERVICE"

          grep -Fq \
            "public static void attachSurface" \
            "$SERVICE"

          # Session API must remain intact.
          for symbol in \
            attachTextureView \
            setTarget \
            isActive \
            getDisplayId \
            tap \
            swipe \
            back \
            release \
            destroy
          do
            grep -Fq "$symbol" "$SESSION"
            echo "PASS: session method $symbol"
          done

          # Constructor must not eagerly start service.
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/"
              "V10ProjectionSession.java"
          )

          text = path.read_text()

          m = re.search(
              r'public\s+V10ProjectionSession\s*\([^)]*\)\s*\{',
              text
          )

          if not m:
              raise SystemExit(
                  "ERROR: constructor missing"
              )

          brace = text.find("{", m.start())

          depth = 0
          i = brace

          while i < len(text):

              if text[i] == "{":
                  depth += 1

              elif text[i] == "}":

                  depth -= 1

                  if depth == 0:
                      end = i + 1
                      break

              i += 1

          body = text[brace:end]

          if "ensureStarted" in body:
              raise SystemExit(
                  "ERROR: eager ensureStarted remains "
                  "inside V10ProjectionSession constructor"
              )

          print(
              "PASS: no eager service start in session constructor"
          )
          PY

          echo "PASS: patched source"

      - name: Verify V10 components preserved
        shell: bash
        run: |
          set -euo pipefail

          ROOT="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$ROOT/V10CarActivity.java"
          test -f "$ROOT/V10SessionStore.java"
          test -f "$ROOT/V10InputController.java"
          test -f "$ROOT/RootShellSession.java"

          grep -Eq \
            'MAX_RECENTS[[:space:]]*=[[:space:]]*4' \
            "$ROOT/V10SessionStore.java"

          echo "PASS: existing V10 components preserved"

      - name: Verify no actual force-stop
        shell: bash
        run: |
          set -euo pipefail

          ROOT="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          if grep -RInE \
            '(^|[[:space:];&|])(/system/bin/)?am[[:space:]]+force-stop([[:space:]]|$)' \
            "$ROOT"; then

            echo "ERROR: actual am force-stop detected."
            exit 1
          fi

          echo "PASS: no actual am force-stop"

      - name: Validate Java braces
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          root = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou"
          )

          files = [
              root / "V10ProjectionService.java",
              root / "V10ProjectionSession.java",
              root / "V10CarActivity.java",
              root / "V10SessionStore.java",
              root / "V10InputController.java",
              root / "RootShellSession.java",
          ]

          for path in files:

              text = path.read_text()

              depth = 0
              state = "normal"
              i = 0

              while i < len(text):

                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ""

                  if state == "normal":

                      if c == "/" and n == "/":
                          state = "line"
                          i += 2
                          continue

                      if c == "/" and n == "*":
                          state = "block"
                          i += 2
                          continue

                      if c == '"':
                          state = "string"
                          i += 1
                          continue

                      if c == "'":
                          state = "char"
                          i += 1
                          continue

                      if c == "{":
                          depth += 1

                      elif c == "}":

                          depth -= 1

                          if depth < 0:
                              raise SystemExit(
                                  f"ERROR: negative brace depth: {path}"
                              )

                  elif state == "line":

                      if c == "\n":
                          state = "normal"

                  elif state == "block":

                      if c == "*" and n == "/":
                          state = "normal"
                          i += 2
                          continue

                  elif state == "string":

                      if c == "\\":
                          i += 2
                          continue

                      if c == '"':
                          state = "normal"

                  elif state == "char":

                      if c == "\\":
                          i += 2
                          continue

                      if c == "'":
                          state = "normal"

                  i += 1

              if depth != 0:
                  raise SystemExit(
                      f"ERROR: unbalanced braces: {path}, depth={depth}"
                  )

              print(f"PASS: Java structure {path.name}")

          PY

      - name: Check source diff
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          echo "===== V10ProjectionService diff ====="

          git diff -- \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java

          echo "===== V10ProjectionSession diff ====="

          git diff -- \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java

      - name: Build V10
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          SHA256="$(sha256sum "$APK" | awk '{print $1}')"

          echo "APK: $APK"
          echo "SHA256: $SHA256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-8B2-StartupHandshake-Fixed-v5
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
