name: Build Car Assistant V10 - 8B2 Startup Handshake Fixed v4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify existing V10
        shell: bash
        run: |
          set -euo pipefail

          ROOT="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          FILES=(
            "V10ProjectionService.java"
            "V10ProjectionSession.java"
            "V10CarActivity.java"
            "V10SessionStore.java"
            "V10InputController.java"
            "RootShellSession.java"
          )

          for file in "${FILES[@]}"; do
            test -f "$ROOT/$file"
            echo "PASS: $file"
          done

          grep -Fq 'package com.carassistant.v10;' \
            "$ROOT/V10ProjectionService.java"

          grep -Fq 'package com.carassistant.v10;' \
            "$ROOT/V10ProjectionSession.java"

          grep -Eq 'MAX_RECENTS[[:space:]]*=[[:space:]]*4' \
            "$ROOT/V10SessionStore.java"

          echo "PASS: existing V10"

      # ------------------------------------------------------------
      # 8B2.1 — Projection Service startup handshake
      # ------------------------------------------------------------

      - name: Patch V10ProjectionService - handshake
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/"
              "V10ProjectionService.java"
          )

          text = path.read_text()

          def find_method(text, name):
              """
              Locate a Java method declaration safely.
              Ignores comments, strings and char literals.
              """
              import re

              pattern = re.compile(
                  r'\b' + re.escape(name) + r'\s*\('
              )

              for match in pattern.finditer(text):
                  pos = match.start()

                  # Reject obvious call sites such as:
                  # object.method(
                  # Class.method(
                  before = text[:pos].rstrip()

                  if before.endswith("."):
                      continue

                  brace = text.find("{", match.end())

                  if brace < 0:
                      continue

                  depth = 0
                  i = brace
                  state = "normal"

                  while i < len(text):
                      c = text[i]
                      n = text[i + 1] if i + 1 < len(text) else ""

                      if state == "normal":
                          if c == "/" and n == "/":
                              state = "line_comment"
                              i += 2
                              continue

                          if c == "/" and n == "*":
                              state = "block_comment"
                              i += 2
                              continue

                          if c == '"':
                              state = "string"
                              i += 1
                              continue

                          if c == "'":
                              state = "char"
                              i += 1
                              continue

                          if c == "{":
                              depth += 1

                          elif c == "}":
                              depth -= 1

                              if depth == 0:
                                  return pos, i + 1

                      elif state == "line_comment":
                          if c == "\n":
                              state = "normal"

                      elif state == "block_comment":
                          if c == "*" and n == "/":
                              state = "normal"
                              i += 2
                              continue

                      elif state == "string":
                          if c == "\\":
                              i += 2
                              continue

                          if c == '"':
                              state = "normal"

                      elif state == "char":
                          if c == "\\":
                              i += 2
                              continue

                          if c == "'":
                              state = "normal"

                      i += 1

                  continue

              return None

          def replace_method(text, name, replacement):
              result = find_method(text, name)

              if result is None:
                  raise SystemExit(
                      f"ERROR: method {name} not found"
                  )

              start, end = result

              return (
                  text[:start]
                  + replacement
                  + text[end:]
              )

          # ----------------------------------------------------------
          # Add handshake fields exactly once.
          # ----------------------------------------------------------

          if "private static final Object START_LOCK" not in text:

              marker = (
                  "private static volatile "
                  "V10ProjectionService instance;"
              )

              if marker not in text:
                  raise SystemExit(
                      "ERROR: service instance marker not found"
                  )

              fields = """\
          private static final Object START_LOCK = new Object();
          private static ComponentName pendingTarget;
          private static Surface pendingSurface;
          private static int pendingWidth;
          private static int pendingHeight;
          """

              text = text.replace(
                  marker,
                  marker + "\n" + fields,
                  1
              )

          # ----------------------------------------------------------
          # ensureStarted()
          # ----------------------------------------------------------

          ensure_started = """\
          public static void ensureStarted(Context context) {
              if (getInstance() != null) {
                  return;
              }

              Context appContext =
                      context.getApplicationContext();

              try {
                  Intent intent =
                          new Intent(
                                  appContext,
                                  V10ProjectionService.class);

                  if (Build.VERSION.SDK_INT >=
                          Build.VERSION_CODES.O) {

                      appContext.startForegroundService(intent);

                  } else {

                      appContext.startService(intent);
                  }

              } catch (Throwable error) {

                  Log.w(
                          TAG,
                          "Unable to start projection service",
                          error);
              }
          }\
          """

          text = replace_method(
              text,
              "ensureStarted",
              ensure_started
          )

          # ----------------------------------------------------------
          # setTarget()
          # ----------------------------------------------------------

          set_target = """\
          public static void setTarget(
                  Context context,
                  ComponentName component) {

              synchronized (START_LOCK) {

                  V10ProjectionService service =
                          getInstance();

                  if (service == null) {

                      pendingTarget = component;

                      ensureStarted(context);

                      return;
                  }

                  service.setTargetInternal(component);
              }
          }\
          """

          text = replace_method(
              text,
              "setTarget",
              set_target
          )

          # ----------------------------------------------------------
          # attachSurface()
          # ----------------------------------------------------------

          attach_surface = """\
          public static void attachSurface(
                  Context context,
                  Surface surface,
                  int width,
                  int height) {

              if (surface == null ||
                      width <= 0 ||
                      height <= 0) {

                  return;
              }

              synchronized (START_LOCK) {

                  V10ProjectionService service =
                          getInstance();

                  if (service == null) {

                      if (pendingSurface != null &&
                              pendingSurface != surface) {

                          try {
                              pendingSurface.release();
                          } catch (Throwable ignored) {
                          }
                      }

                      pendingSurface = surface;
                      pendingWidth = width;
                      pendingHeight = height;

                      ensureStarted(context);

                      return;
                  }

                  service.attachSurfaceInternal(
                          surface,
                          width,
                          height);
              }
          }\
          """

          text = replace_method(
              text,
              "attachSurface",
              attach_surface
          )

          # ----------------------------------------------------------
          # Add flushPendingState()
          # ----------------------------------------------------------

          if "private void flushPendingState()" not in text:

              marker = "private void detachSurfaceInternal"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: detachSurfaceInternal not found"
                  )

              flush = """\
          private void flushPendingState() {

              synchronized (START_LOCK) {

                  if (instance != this || destroyed) {
                      return;
                  }

                  ComponentName target =
                          pendingTarget;

                  Surface surface =
                          pendingSurface;

                  int width =
                          pendingWidth;

                  int height =
                          pendingHeight;

                  pendingTarget = null;
                  pendingSurface = null;
                  pendingWidth = 0;
                  pendingHeight = 0;

                  try {

                      if (target != null) {
                          setTargetInternal(target);
                      }

                      if (surface != null) {

                          attachSurfaceInternal(
                                  surface,
                                  width,
                                  height);
                      }

                  } catch (Throwable error) {

                      Log.e(
                              TAG,
                              "Pending projection state failed",
                              error);
                  }
              }
          }

          """

              text = text.replace(
                  marker,
                  flush + marker,
                  1
              )

          # ----------------------------------------------------------
          # Add flush call after startForeground().
          # ----------------------------------------------------------

          if "flushPendingState();" not in text:

              marker = "startForeground("

              pos = text.find(marker)

              if pos < 0:
                  raise SystemExit(
                      "ERROR: startForeground() not found"
                  )

              paren = text.find("(", pos)

              depth = 0
              i = paren
              state = "normal"

              while i < len(text):

                  c = text[i]

                  if state == "normal":

                      if c == '"':
                          state = "string"

                      elif c == "(":
                          depth += 1

                      elif c == ")":

                          depth -= 1

                          if depth == 0:
                              i += 1
                              break

                  elif state == "string":

                      if c == "\\":
                          i += 2
                          continue

                      if c == '"':
                          state = "normal"

                  i += 1

              text = (
                  text[:i]
                  + "\n\n        flushPendingState();"
                  + text[i:]
              )

          path.write_text(text)

          print(
              "PASS: V10ProjectionService handshake patched"
          )
          PY

      # ------------------------------------------------------------
      # 8B.2 — Constructor only
      # ------------------------------------------------------------

      - name: Patch V10ProjectionSession - constructor only
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/"
              "V10ProjectionSession.java"
          )

          text = path.read_text()

          # ----------------------------------------------------------
          # Find constructor by class name.
          #
          # Do NOT require:
          #   public
          #   exact whitespace
          #   exact formatting
          #
          # This fixes the v3 failure.
          # ----------------------------------------------------------

          class_name = "V10ProjectionSession"

          import re

          pattern = re.compile(
              r'\b' + re.escape(class_name) + r'\s*\('
          )

          matches = list(pattern.finditer(text))

          if not matches:
              raise SystemExit(
                  "ERROR: V10ProjectionSession( not found"
              )

          constructor = None

          for match in matches:

              pos = match.start()

              before = text[:pos].rstrip()

              # Ignore calls like:
              # new V10ProjectionSession(
              # some.V10ProjectionSession(
              if before.endswith("."):
                  continue

              if before.endswith("new"):
                  continue

              # Constructor must be inside class source,
              # followed by a parameter list and opening brace.
              paren = text.find("(", pos)

              depth = 0
              i = paren
              state = "normal"

              close_paren = None

              while i < len(text):

                  c = text[i]
                  n = (
                      text[i + 1]
                      if i + 1 < len(text)
                      else ""
                  )

                  if state == "normal":

                      if c == "/" and n == "/":
                          state = "line_comment"
                          i += 2
                          continue

                      if c == "/" and n == "*":
                          state = "block_comment"
                          i += 2
                          continue

                      if c == '"':
                          state = "string"
                          i += 1
                          continue

                      if c == "'":
                          state = "char"
                          i += 1
                          continue

                      if c == "(":
                          depth += 1

                      elif c == ")":

                          depth -= 1

                          if depth == 0:
                              close_paren = i
                              break

                  elif state == "line_comment":

                      if c == "\n":
                          state = "normal"

                  elif state == "block_comment":

                      if c == "*" and n == "/":
                          state = "normal"
                          i += 2
                          continue

                  elif state == "string":

                      if c == "\\":
                          i += 2
                          continue

                      if c == '"':
                          state = "normal"

                  elif state == "char":

                      if c == "\\":
                          i += 2
                          continue

                      if c == "'":
                          state = "normal"

                  i += 1

              if close_paren is None:
                  continue

              # Skip whitespace/comments after ')'
              i = close_paren + 1

              while i < len(text):

                  if text[i].isspace():
                      i += 1
                      continue

                  if text.startswith("//", i):

                      nl = text.find("\n", i + 2)

                      if nl < 0:
                          i = len(text)
                      else:
                          i = nl + 1

                      continue

                  if text.startswith("/*", i):

                      end_comment = text.find(
                          "*/",
                          i + 2
                      )

                      if end_comment < 0:
                          i = len(text)
                      else:
                          i = end_comment + 2

                      continue

                  break

              if i >= len(text) or text[i] != "{":
                  continue

              constructor = (
                  match.start(),
                  i
              )

              break

          if constructor is None:
              raise SystemExit(
                  "ERROR: V10ProjectionSession constructor "
                  "could not be located"
              )

          start, brace = constructor

          # ----------------------------------------------------------
          # Find matching constructor closing brace.
          # ----------------------------------------------------------

          depth = 0
          i = brace
          state = "normal"

          while i < len(text):

              c = text[i]
              n = (
                  text[i + 1]
                  if i + 1 < len(text)
                  else ""
              )

              if state == "normal":

                  if c == "/" and n == "/":
                      state = "line_comment"
                      i += 2
                      continue

                  if c == "/" and n == "*":
                      state = "block_comment"
                      i += 2
                      continue

                  if c == '"':
                      state = "string"
                      i += 1
                      continue

                  if c == "'":
                      state = "char"
                      i += 1
                      continue

                  if c == "{":
                      depth += 1

                  elif c == "}":

                      depth -= 1

                      if depth == 0:
                          end = i + 1
                          break

              elif state == "line_comment":

                  if c == "\n":
                      state = "normal"

              elif state == "block_comment":

                  if c == "*" and n == "/":
                      state = "normal"
                      i += 2
                      continue

              elif state == "string":

                  if c == "\\":
                      i += 2
                      continue

                  if c == '"':
                      state = "normal"

              elif state == "char":

                  if c == "\\":
                      i += 2
                      continue

                  if c == "'":
                      state = "normal"

              i += 1

          else:
              raise SystemExit(
                  "ERROR: constructor closing brace not found"
              )

          # ----------------------------------------------------------
          # Preserve constructor signature.
          # Replace ONLY constructor body.
          # ----------------------------------------------------------

          opening_brace = text.find("{", start, brace + 1)

          replacement = (
              text[:opening_brace]
              + "{\n"
              + "        this.context =\n"
              + "                context.getApplicationContext();\n"
              + "    }"
              + text[end:]
          )

          path.write_text(replacement)

          print(
              "PASS: V10ProjectionSession constructor patched"
          )
          print(
              "PASS: constructor signature preserved"
          )
          print(
              "PASS: all other methods preserved"
          )
          PY

      # ------------------------------------------------------------
      # Regression checks
      # ------------------------------------------------------------

      - name: Verify 8B2 source
        shell: bash
        run: |
          set -euo pipefail

          ROOT="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          SERVICE="$ROOT/V10ProjectionService.java"
          SESSION="$ROOT/V10ProjectionSession.java"

          grep -Fq "START_LOCK" "$SERVICE"
          grep -Fq "pendingTarget" "$SERVICE"
          grep -Fq "pendingSurface" "$SERVICE"
          grep -Fq "pendingWidth" "$SERVICE"
          grep -Fq "pendingHeight" "$SERVICE"
          grep -Fq "flushPendingState();" "$SERVICE"

          grep -Fq "public static void ensureStarted" \
            "$SERVICE"

          grep -Fq "public static void setTarget" \
            "$SERVICE"

          grep -Fq "public static void attachSurface" \
            "$SERVICE"

          # Critical regression check from previous run.
          grep -Fq "attachTextureView" "$SESSION"

          grep -Fq "setTarget" "$SESSION"
          grep -Fq "release" "$SESSION"
          grep -Fq "destroy" "$SESSION"

          # Constructor must NOT eagerly start service.
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/"
              "V10ProjectionSession.java"
          )

          text = path.read_text()

          m = re.search(
              r'V10ProjectionSession\s*\([^)]*\)\s*\{',
              text
          )

          if not m:
              raise SystemExit(
                  "ERROR: constructor missing after patch"
              )

          brace = text.find("{", m.start())

          depth = 0
          i = brace

          while i < len(text):

              if text[i] == "{":
                  depth += 1

              elif text[i] == "}":

                  depth -= 1

                  if depth == 0:
                      end = i + 1
                      break

              i += 1

          body = text[brace:end]

          if "ensureStarted" in body:
              raise SystemExit(
                  "ERROR: eager ensureStarted remains "
                  "inside constructor"
              )

          print(
              "PASS: constructor has no eager ensureStarted"
          )
          PY

          echo "PASS: 8B2 source"

      - name: Verify V10 components preserved
        shell: bash
        run: |
          set -euo pipefail

          ROOT="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$ROOT/V10CarActivity.java"
          test -f "$ROOT/V10SessionStore.java"
          test -f "$ROOT/V10InputController.java"
          test -f "$ROOT/RootShellSession.java"

          grep -Eq \
            'MAX_RECENTS[[:space:]]*=[[:space:]]*4' \
            "$ROOT/V10SessionStore.java"

          echo "PASS: existing V10 components preserved"

      - name: Verify no actual force-stop
        shell: bash
        run: |
          set -euo pipefail

          ROOT="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          if grep -RInE \
            '(^|[[:space:];&|])(/system/bin/)?am[[:space:]]+force-stop([[:space:]]|$)' \
            "$ROOT"; then

            echo "ERROR: actual am force-stop detected."

            exit 1
          fi

          echo "PASS: no actual am force-stop"

      # ------------------------------------------------------------
      # Structural validation
      # ------------------------------------------------------------

      - name: Validate Java structure
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          root = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou"
          )

          files = [
              root / "V10ProjectionService.java",
              root / "V10ProjectionSession.java",
              root / "V10CarActivity.java",
              root / "V10SessionStore.java",
              root / "V10InputController.java",
              root / "RootShellSession.java",
          ]

          for path in files:

              text = path.read_text()

              depth = 0
              state = "normal"
              i = 0

              while i < len(text):

                  c = text[i]
                  n = (
                      text[i + 1]
                      if i + 1 < len(text)
                      else ""
                  )

                  if state == "normal":

                      if c == "/" and n == "/":
                          state = "line_comment"
                          i += 2
                          continue

                      if c == "/" and n == "*":
                          state = "block_comment"
                          i += 2
                          continue

                      if c == '"':
                          state = "string"
                          i += 1
                          continue

                      if c == "'":
                          state = "char"
                          i += 1
                          continue

                      if c == "{":
                          depth += 1

                      elif c == "}":

                          depth -= 1

                          if depth < 0:
                              raise SystemExit(
                                  f"ERROR: negative brace depth: {path}"
                              )

                  elif state == "line_comment":

                      if c == "\n":
                          state = "normal"

                  elif state == "block_comment":

                      if c == "*" and n == "/":
                          state = "normal"
                          i += 2
                          continue

                  elif state == "string":

                      if c == "\\":
                          i += 2
                          continue

                      if c == '"':
                          state = "normal"

                  elif state == "char":

                      if c == "\\":
                          i += 2
                          continue

                      if c == "'":
                          state = "normal"

                  i += 1

              if depth != 0:
                  raise SystemExit(
                      f"ERROR: unbalanced braces: "
                      f"{path} depth={depth}"
                  )

              print(f"PASS: {path}")

          PY

      - name: Check source diff
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          echo "===== V10ProjectionSession diff ====="

          git diff -- \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java

          echo "===== V10ProjectionService diff ====="

          git diff -- \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------

      - name: Build V10
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          SHA256="$(sha256sum "$APK" | awk '{print $1}')"

          echo "APK: $APK"
          echo "SHA256: $SHA256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-8B2-StartupHandshake-Fixed-v4
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
