name: Build Car Assistant V10 - 8B2 Startup Handshake Fixed v3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify existing V10
        shell: bash
        run: |
          set -euo pipefail

          ROOT="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          FILES=(
            "V10ProjectionService.java"
            "V10ProjectionSession.java"
            "V10CarActivity.java"
            "V10SessionStore.java"
            "V10InputController.java"
            "RootShellSession.java"
          )

          for file in "${FILES[@]}"; do
            test -f "$ROOT/$file"
            echo "PASS: $file"
          done

          grep -Fq 'package com.carassistant.v10;' \
            "$ROOT/V10ProjectionService.java"

          grep -Fq 'package com.carassistant.v10;' \
            "$ROOT/V10ProjectionSession.java"

          echo "PASS: V10 package"

          grep -Eq 'MAX_RECENTS[[:space:]]*=[[:space:]]*4' \
            "$ROOT/V10SessionStore.java"

          echo "PASS: MAX_RECENTS = 4"

      - name: Patch V10ProjectionService - brace safe
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java"

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/"
              "V10ProjectionService.java"
          )

          text = path.read_text()

          # ------------------------------------------------------------
          # Java method locator.
          # It ignores comments, strings and character literals.
          # ------------------------------------------------------------

          def find_method(text, name):
              needle = name + "("
              pos = text.find(needle)

              while pos >= 0:
                  brace = text.find("{", pos)
                  if brace < 0:
                      return None

                  depth = 0
                  i = brace
                  state = "normal"

                  while i < len(text):
                      c = text[i]
                      n = text[i + 1] if i + 1 < len(text) else ""

                      if state == "normal":
                          if c == "/" and n == "/":
                              state = "line_comment"
                              i += 2
                              continue

                          if c == "/" and n == "*":
                              state = "block_comment"
                              i += 2
                              continue

                          if c == '"':
                              state = "string"
                              i += 1
                              continue

                          if c == "'":
                              state = "char"
                              i += 1
                              continue

                          if c == "{":
                              depth += 1

                          elif c == "}":
                              depth -= 1
                              if depth == 0:
                                  return pos, i + 1

                      elif state == "line_comment":
                          if c == "\n":
                              state = "normal"

                      elif state == "block_comment":
                          if c == "*" and n == "/":
                              state = "normal"
                              i += 2
                              continue

                      elif state == "string":
                          if c == "\\":
                              i += 2
                              continue
                          if c == '"':
                              state = "normal"

                      elif state == "char":
                          if c == "\\":
                              i += 2
                              continue
                          if c == "'":
                              state = "normal"

                      i += 1

                  return None

              return None

          def replace_method(text, name, replacement):
              result = find_method(text, name)

              if result is None:
                  raise SystemExit(
                      f"ERROR: method {name} not found"
                  )

              start, end = result
              return text[:start] + replacement + text[end:]

          # ------------------------------------------------------------
          # Add startup handshake fields exactly once.
          # ------------------------------------------------------------

          fields = """\
          private static final Object START_LOCK = new Object();
          private static ComponentName pendingTarget;
          private static Surface pendingSurface;
          private static int pendingWidth;
          private static int pendingHeight;
          """

          if "START_LOCK" not in text:
              marker = "private static volatile V10ProjectionService instance;"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: service instance marker not found"
                  )

              text = text.replace(
                  marker,
                  marker + "\n" + fields,
                  1
              )

          # ------------------------------------------------------------
          # Replace ensureStarted().
          # ------------------------------------------------------------

          ensure_started = """\
          public static void ensureStarted(Context context) {
              if (getInstance() != null) {
                  return;
              }

              Context appContext = context.getApplicationContext();

              try {
                  Intent intent =
                          new Intent(appContext, V10ProjectionService.class);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      appContext.startForegroundService(intent);
                  } else {
                      appContext.startService(intent);
                  }
              } catch (Throwable error) {
                  Log.w(TAG, "Unable to start projection service", error);
              }
          }\
          """

          text = replace_method(
              text,
              "ensureStarted",
              ensure_started
          )

          # ------------------------------------------------------------
          # Replace static setTarget().
          # ------------------------------------------------------------

          set_target = """\
          public static void setTarget(
                  Context context,
                  ComponentName component) {

              synchronized (START_LOCK) {
                  V10ProjectionService service = getInstance();

                  if (service == null) {
                      pendingTarget = component;
                      ensureStarted(context);
                      return;
                  }

                  service.setTargetInternal(component);
              }
          }\
          """

          text = replace_method(
              text,
              "setTarget",
              set_target
          )

          # ------------------------------------------------------------
          # Replace static attachSurface().
          # ------------------------------------------------------------

          attach_surface = """\
          public static void attachSurface(
                  Context context,
                  Surface surface,
                  int width,
                  int height) {

              if (surface == null || width <= 0 || height <= 0) {
                  return;
              }

              synchronized (START_LOCK) {
                  V10ProjectionService service = getInstance();

                  if (service == null) {
                      if (pendingSurface != null &&
                              pendingSurface != surface) {
                          try {
                              pendingSurface.release();
                          } catch (Throwable ignored) {
                          }
                      }

                      pendingSurface = surface;
                      pendingWidth = width;
                      pendingHeight = height;

                      ensureStarted(context);
                      return;
                  }

                  service.attachSurfaceInternal(
                          surface,
                          width,
                          height);
              }
          }\
          """

          text = replace_method(
              text,
              "attachSurface",
              attach_surface
          )

          # ------------------------------------------------------------
          # Add flushPendingState() immediately before detachSurfaceInternal.
          # ------------------------------------------------------------

          if "private void flushPendingState()" not in text:
              marker = "private void detachSurfaceInternal()"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: detachSurfaceInternal marker not found"
                  )

              flush = """\
          private void flushPendingState() {
              synchronized (START_LOCK) {
                  if (instance != this || destroyed) {
                      return;
                  }

                  ComponentName target = pendingTarget;
                  Surface surface = pendingSurface;
                  int width = pendingWidth;
                  int height = pendingHeight;

                  pendingTarget = null;
                  pendingSurface = null;
                  pendingWidth = 0;
                  pendingHeight = 0;

                  try {
                      if (target != null) {
                          setTargetInternal(target);
                      }

                      if (surface != null) {
                          attachSurfaceInternal(
                                  surface,
                                  width,
                                  height);
                      }
                  } catch (Throwable error) {
                      Log.e(
                              TAG,
                              "Pending projection state failed",
                              error);
                  }
              }
          }

          """

              text = text.replace(
                  marker,
                  flush + marker,
                  1
              )

          # ------------------------------------------------------------
          # Call flushPendingState() after startForeground().
          # ------------------------------------------------------------

          if "flushPendingState();" not in text:
              marker = "startForeground("

              pos = text.find(marker)

              if pos < 0:
                  raise SystemExit(
                      "ERROR: startForeground() not found"
                  )

              # Find end of the call.
              depth = 0
              paren = text.find("(", pos)
              end = paren
              state = "normal"

              while end < len(text):
                  c = text[end]

                  if state == "normal":
                      if c == '"':
                          state = "string"
                      elif c == "(":
                          depth += 1
                      elif c == ")":
                          depth -= 1
                          if depth == 0:
                              end += 1
                              break

                  elif state == "string":
                      if c == "\\":
                          end += 2
                          continue
                      if c == '"':
                          state = "normal"

                  end += 1

              text = (
                  text[:end]
                  + "\n\n        flushPendingState();"
                  + text[end:]
              )

          path.write_text(text)

          print("PASS: V10ProjectionService handshake patch")

          PY

      - name: Patch V10ProjectionSession - constructor only
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/"
              "V10ProjectionSession.java"
          )

          text = path.read_text()

          # ------------------------------------------------------------
          # Locate the exact constructor using brace counting.
          # ONLY this constructor is replaced.
          # All other methods remain byte-for-byte untouched.
          # ------------------------------------------------------------

          signature = "public V10ProjectionSession(Context context)"

          start = text.find(signature)

          if start < 0:
              raise SystemExit(
                  "ERROR: V10ProjectionSession constructor not found"
              )

          brace = text.find("{", start)

          if brace < 0:
              raise SystemExit(
                  "ERROR: constructor opening brace not found"
              )

          depth = 0
          i = brace
          state = "normal"

          while i < len(text):
              c = text[i]
              n = text[i + 1] if i + 1 < len(text) else ""

              if state == "normal":
                  if c == "/" and n == "/":
                      state = "line_comment"
                      i += 2
                      continue

                  if c == "/" and n == "*":
                      state = "block_comment"
                      i += 2
                      continue

                  if c == '"':
                      state = "string"
                      i += 1
                      continue

                  if c == "'":
                      state = "char"
                      i += 1
                      continue

                  if c == "{":
                      depth += 1

                  elif c == "}":
                      depth -= 1

                      if depth == 0:
                          end = i + 1
                          break

              elif state == "line_comment":
                  if c == "\n":
                      state = "normal"

              elif state == "block_comment":
                  if c == "*" and n == "/":
                      state = "normal"
                      i += 2
                      continue

              elif state == "string":
                  if c == "\\":
                      i += 2
                      continue

                  if c == '"':
                      state = "normal"

              elif state == "char":
                  if c == "\\":
                      i += 2
                      continue

                  if c == "'":
                      state = "normal"

              i += 1

          else:
              raise SystemExit(
                  "ERROR: constructor closing brace not found"
              )

          replacement = """\
          public V10ProjectionSession(Context context) {
              this.context =
                      context.getApplicationContext();
          }\
          """

          text = text[:start] + replacement + text[end:]

          path.write_text(text)

          print(
              "PASS: constructor patched; "
              "all other V10ProjectionSession methods preserved"
          )

          PY

      - name: Verify 8B2 source
        shell: bash
        run: |
          set -euo pipefail

          SERVICE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java"
          SESSION="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          grep -Fq "START_LOCK" "$SERVICE"
          grep -Fq "pendingTarget" "$SERVICE"
          grep -Fq "pendingSurface" "$SERVICE"
          grep -Fq "flushPendingState();" "$SERVICE"

          grep -Fq "public static void ensureStarted" "$SERVICE"
          grep -Fq "public static void setTarget" "$SERVICE"
          grep -Fq "public static void attachSurface" "$SERVICE"

          # Critical regression check.
          grep -Fq "attachTextureView" "$SESSION"

          grep -Fq "setTarget" "$SESSION"
          grep -Fq "release" "$SESSION"
          grep -Fq "destroy" "$SESSION"

          # Constructor must NOT eagerly start the service.
          if grep -A8 -F \
            "public V10ProjectionSession(Context context)" \
            "$SESSION" | grep -Fq "ensureStarted"; then
            echo "ERROR: eager ensureStarted remains in constructor."
            exit 1
          fi

          echo "PASS: 8B2 source"

      - name: Verify V10 components preserved
        shell: bash
        run: |
          set -euo pipefail

          ROOT="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$ROOT/V10CarActivity.java"
          test -f "$ROOT/V10SessionStore.java"
          test -f "$ROOT/V10InputController.java"
          test -f "$ROOT/RootShellSession.java"

          grep -Eq 'MAX_RECENTS[[:space:]]*=[[:space:]]*4' \
            "$ROOT/V10SessionStore.java"

          echo "PASS: existing V10 components preserved"

      - name: Verify no force-stop command
        shell: bash
        run: |
          set -euo pipefail

          ROOT="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          if grep -RInE \
            '(^|[[:space:];&|])(/system/bin/)?am[[:space:]]+force-stop([[:space:]]|$)' \
            "$ROOT"; then
            echo "ERROR: actual am force-stop command detected."
            exit 1
          fi

          echo "PASS: no actual am force-stop command"

      - name: Validate Java structure
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          root = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou"
          )

          files = [
              root / "V10ProjectionService.java",
              root / "V10ProjectionSession.java",
              root / "V10CarActivity.java",
              root / "V10SessionStore.java",
              root / "V10InputController.java",
              root / "RootShellSession.java",
          ]

          for path in files:
              text = path.read_text()

              depth = 0
              state = "normal"
              i = 0

              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ""

                  if state == "normal":
                      if c == "/" and n == "/":
                          state = "line_comment"
                          i += 2
                          continue

                      if c == "/" and n == "*":
                          state = "block_comment"
                          i += 2
                          continue

                      if c == '"':
                          state = "string"
                          i += 1
                          continue

                      if c == "'":
                          state = "char"
                          i += 1
                          continue

                      if c == "{":
                          depth += 1

                      elif c == "}":
                          depth -= 1

                          if depth < 0:
                              raise SystemExit(
                                  f"ERROR: negative brace depth: {path}"
                              )

                  elif state == "line_comment":
                      if c == "\n":
                          state = "normal"

                  elif state == "block_comment":
                      if c == "*" and n == "/":
                          state = "normal"
                          i += 2
                          continue

                  elif state == "string":
                      if c == "\\":
                          i += 2
                          continue

                      if c == '"':
                          state = "normal"

                  elif state == "char":
                      if c == "\\":
                          i += 2
                          continue

                      if c == "'":
                          state = "normal"

                  i += 1

              if depth != 0:
                  raise SystemExit(
                      f"ERROR: unbalanced braces: {path} depth={depth}"
                  )

              print(f"PASS: {path}")

          PY

      - name: Check source diff
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          echo "===== V10ProjectionSession diff ====="
          git diff -- \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java

          echo "===== V10ProjectionService diff ====="
          git diff -- \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java

      - name: Build V10
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          SHA256="$(sha256sum "$APK" | awk '{print $1}')"

          echo "APK: $APK"
          echo "SHA256: $SHA256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-8B2-StartupHandshake-Fixed-v3
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
