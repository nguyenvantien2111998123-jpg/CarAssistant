name: Build Car Assistant V10 - 8B2 Startup Handshake Fixed v8 + Runtime Emulator

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify V10 source
        shell: bash
        run: |
          set -euo pipefail

          ROOT="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          echo "===== VERIFY V10 SOURCE ====="

          test -f "$ROOT/V10CarActivity.java"
          test -f "$ROOT/V10SessionStore.java"
          test -f "$ROOT/V10InputController.java"
          test -f "$ROOT/RootShellSession.java"
          test -f "$ROOT/V10ProjectionService.java"
          test -f "$ROOT/V10ProjectionSession.java"

          grep -q 'package com.carassistant.v10;' \
            "$ROOT/V10ProjectionService.java"

          grep -q 'package com.carassistant.v10;' \
            "$ROOT/V10ProjectionSession.java"

          grep -q 'MAX_RECENTS = 4' \
            "$ROOT/V10SessionStore.java"

          echo "V10 source verification: PASS"

      - name: Patch V10ProjectionService - Startup Handshake
        shell: bash
        run: |
          set -euo pipefail

          SERVICE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java"

          python3 - "$SERVICE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          print("===== PATCH V10ProjectionService =====")
          print("File:", path)

          # ------------------------------------------------------------
          # Helper: replace a Java method by method name.
          #
          # This does NOT depend on the exact line breaks or indentation
          # used in the Java source.
          # ------------------------------------------------------------
          def replace_method(source, method_name, replacement):
              marker = method_name + "("

              start = source.find(marker)

              if start == -1:
                  raise SystemExit(
                      f"Could not find method: {method_name}"
                  )

              # Find the opening brace belonging to this method.
              brace = source.find("{", start)

              if brace == -1:
                  raise SystemExit(
                      f"Could not find opening brace for: {method_name}"
                  )

              depth = 0
              end = None

              for i in range(brace, len(source)):
                  ch = source[i]

                  if ch == "{":
                      depth += 1

                  elif ch == "}":
                      depth -= 1

                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise SystemExit(
                      f"Could not parse method: {method_name}"
                  )

              return source[:start] + replacement + source[end:]


          # ------------------------------------------------------------
          # 1. Verify actual class declaration.
          # ------------------------------------------------------------
          class_marker = (
              "public final class V10ProjectionService extends Service"
          )

          if class_marker not in text:
              raise SystemExit(
                  "Unexpected V10ProjectionService class declaration"
              )

          print("Class declaration: PASS")


          # ------------------------------------------------------------
          # 2. Add startup handshake state.
          # ------------------------------------------------------------
          state_marker = (
              "private static final Object START_LOCK = new Object();"
          )

          if state_marker not in text:

              class_end = text.find("{", text.find(class_marker))

              if class_end == -1:
                  raise SystemExit(
                      "Could not find V10ProjectionService class body"
                  )

              state = r'''

              private static final Object START_LOCK =
                      new Object();

              private static ComponentName pendingTarget;

              private static Surface pendingSurface;

              private static int pendingWidth;

              private static int pendingHeight;

              '''

              text = (
                  text[:class_end + 1]
                  + state
                  + text[class_end + 1:]
              )

              print("Startup state: ADDED")

          else:
              print("Startup state: ALREADY PRESENT")


          # ------------------------------------------------------------
          # 3. Replace ensureStarted().
          # ------------------------------------------------------------
          ensure_started = r'''public static void ensureStarted(
                  android.content.Context context) {

              if (context == null) {
                  return;
              }

              synchronized (START_LOCK) {

                  android.content.Context app =
                          context.getApplicationContext();

                  try {

                      Intent intent =
                              new Intent(
                                      app,
                                      V10ProjectionService.class);

                      if (Build.VERSION.SDK_INT >= 26) {

                          app.startForegroundService(
                                  intent);

                      } else {

                          app.startService(
                                  intent);
                      }

                  } catch (Throwable error) {

                      Log.e(
                              TAG,
                              "ensureStarted failed",
                              error);
                  }
              }
          }'''

          text = replace_method(
              text,
              "public static void ensureStarted",
              ensure_started
          )

          print("ensureStarted(): PATCHED")


          # ------------------------------------------------------------
          # 4. Replace setTarget().
          #
          # IMPORTANT:
          # Actual service method is setTargetInternal(), NOT applyTarget().
          # ------------------------------------------------------------
          set_target = r'''public static void setTarget(
                  android.content.Context context,
                  ComponentName component) {

              if (context == null) {
                  return;
              }

              synchronized (START_LOCK) {

                  pendingTarget = component;

                  if (instance == null) {

                      ensureStarted(context);

                      return;
                  }

                  try {

                      instance.setTargetInternal(
                              component);

                  } catch (Throwable error) {

                      Log.e(
                              TAG,
                              "setTarget failed",
                              error);
                  }
              }
          }'''

          text = replace_method(
              text,
              "public static void setTarget",
              set_target
          )

          print("setTarget(): PATCHED")


          # ------------------------------------------------------------
          # 5. Replace attachSurface().
          #
          # Actual internal method is attachSurfaceInternal().
          # ------------------------------------------------------------
          attach_surface = r'''public static void attachSurface(
                  android.content.Context context,
                  Surface newSurface,
                  int newWidth,
                  int newHeight) {

              if (context == null) {
                  return;
              }

              synchronized (START_LOCK) {

                  pendingSurface = newSurface;

                  pendingWidth = newWidth;

                  pendingHeight = newHeight;

                  if (instance == null) {

                      ensureStarted(context);

                      return;
                  }

                  try {

                      instance.attachSurfaceInternal(
                              newSurface,
                              newWidth,
                              newHeight);

                  } catch (Throwable error) {

                      Log.e(
                              TAG,
                              "attachSurface failed",
                              error);
                  }
              }
          }'''

          text = replace_method(
              text,
              "public static void attachSurface",
              attach_surface
          )

          print("attachSurface(): PATCHED")


          # ------------------------------------------------------------
          # 6. Add flushPendingState().
          #
          # This is executed after the foreground service has been
          # created and instance has been assigned.
          # ------------------------------------------------------------
          flush_marker = "private void flushPendingState()"

          if flush_marker not in text:

              class_pos = text.find(class_marker)

              class_brace = text.find("{", class_pos)

              if class_brace == -1:
                  raise SystemExit(
                      "Could not locate service class body"
                  )

              flush_method = r'''

              private void flushPendingState() {

                  synchronized (START_LOCK) {

                      V10ProjectionService service =
                              instance;

                      if (service == null) {
                          return;
                      }

                      if (pendingTarget != null) {

                          try {

                              service.setTargetInternal(
                                      pendingTarget);

                          } catch (Throwable error) {

                              Log.e(
                                      TAG,
                                      "flush target failed",
                                      error);
                          }
                      }

                      if (pendingSurface != null) {

                          try {

                              service.attachSurfaceInternal(
                                      pendingSurface,
                                      pendingWidth,
                                      pendingHeight);

                          } catch (Throwable error) {

                              Log.e(
                                      TAG,
                                      "flush surface failed",
                                      error);
                          }
                      }
                  }
              }

              '''

              text = (
                  text[:class_brace + 1]
                  + flush_method
                  + text[class_brace + 1:]
              )

              print("flushPendingState(): ADDED")

          else:
              print("flushPendingState(): ALREADY PRESENT")


          # ------------------------------------------------------------
          # 7. Ensure flush occurs after startForeground().
          # ------------------------------------------------------------
          if "flushPendingState();" not in text:

              foreground_pos = text.find(
                  "startForeground("
              )

              if foreground_pos == -1:
                  raise SystemExit(
                      "Could not find startForeground()"
                  )

              foreground_end = text.find(
                  ");",
                  foreground_pos
              )

              if foreground_end == -1:
                  raise SystemExit(
                      "Could not find end of startForeground()"
                  )

              insertion = (
                  "\n\n        flushPendingState();"
              )

              text = (
                  text[:foreground_end + 2]
                  + insertion
                  + text[foreground_end + 2:]
              )

              print(
                  "flushPendingState() call: ADDED"
              )

          else:
              print(
                  "flushPendingState() call: ALREADY PRESENT"
              )


          # ------------------------------------------------------------
          # 8. Prevent accidental duplicate declarations.
          # ------------------------------------------------------------
          text = text.replace(
              "public static void public static void",
              "public static void"
          )


          # ------------------------------------------------------------
          # 9. Write patched source.
          # ------------------------------------------------------------
          path.write_text(text)

          print("V10ProjectionService patch: PASS")
          PY

      - name: Patch V10ProjectionSession
        shell: bash
        run: |
          set -euo pipefail

          SESSION="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          python3 - "$SESSION" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          print("===== PATCH V10ProjectionSession =====")

          # Keep Application Context instead of Activity Context.
          text = text.replace(
              "this.context = context;",
              "this.context = context.getApplicationContext();"
          )

          # Prevent accidental duplicate declaration.
          text = text.replace(
              "public static void public static void",
              "public static void"
          )

          path.write_text(text)

          print("V10ProjectionSession patch: PASS")
          PY

      - name: Verify patched V10 source
        shell: bash
        run: |
          set -euo pipefail

          ROOT="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          SERVICE="$ROOT/V10ProjectionService.java"
          SESSION="$ROOT/V10ProjectionSession.java"

          echo "===== VERIFY PATCH ====="

          echo "Checking service class..."
          grep -q \
            'public final class V10ProjectionService extends Service' \
            "$SERVICE"

          echo "Checking startup lock..."
          grep -q \
            'START_LOCK' \
            "$SERVICE"

          echo "Checking pending target..."
          grep -q \
            'pendingTarget' \
            "$SERVICE"

          echo "Checking pending surface..."
          grep -q \
            'pendingSurface' \
            "$SERVICE"

          echo "Checking pending dimensions..."
          grep -q \
            'pendingWidth' \
            "$SERVICE"

          grep -q \
            'pendingHeight' \
            "$SERVICE"

          echo "Checking flush method..."
          grep -q \
            'flushPendingState' \
            "$SERVICE"

          echo "Checking internal target method..."
          grep -q \
            'setTargetInternal' \
            "$SERVICE"

          echo "Checking internal surface method..."
          grep -q \
            'attachSurfaceInternal' \
            "$SERVICE"

          echo "Checking foreground service..."
          grep -q \
            'startForegroundService' \
            "$SERVICE"

          echo "Checking VirtualDisplay lifecycle..."
          grep -q \
            'VirtualDisplay' \
            "$SERVICE"

          echo "Checking session lifecycle..."
          grep -q \
            'attachTextureView' \
            "$SESSION"

          grep -q \
            'setTarget' \
            "$SESSION"

          grep -q \
            'release' \
            "$SESSION"

          grep -q \
            'destroy' \
            "$SESSION"

          echo "Checking session does not directly start service..."
          if grep -n \
            "V10ProjectionService.ensureStarted" \
            "$SESSION"; then

            echo "ERROR: recursive service startup call found"
            exit 1
          fi

          echo "Checking for accidental force-stop in V10 source..."

          if grep -R -n \
            --exclude-dir=.git \
            "am force-stop" \
            "$ROOT"; then

            echo "ERROR: force-stop found in V10 source"
            exit 1
          fi

          echo "Checking duplicate declaration..."

          if grep -R -n \
            "public static void public static void" \
            "$ROOT"; then

            echo "ERROR: duplicate method declaration found"
            exit 1
          fi

          echo "Running git diff --check..."
          git diff --check

          echo "===== PATCH VERIFICATION: PASS ====="

      - name: Build V10 APK
        shell: bash
        run: |
          set -euo pipefail

          cd v10-source

          chmod +x gradlew

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "===== APK ====="
          ls -lh "$APK"

          echo "===== SHA256 ====="
          sha256sum "$APK"

      - name: Upload V10 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-8B2-StartupHandshake-Fixed-v8
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail

          echo "===== ENABLE KVM ====="

          sudo apt-get update

          sudo apt-get install -y cpu-checker

          if [ -e /dev/kvm ]; then
            echo "/dev/kvm exists"
            ls -l /dev/kvm
          else
            echo "WARNING: /dev/kvm is not available"
          fi

      - name: Boot Android 12 Emulator and capture V10 crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          force-avd-creation: true
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -gpu swiftshader_indirect
            -no-snapshot
            -no-snapshot-save
          disable-animations: true

          script: |
            set -euo pipefail

            DEBUG_DIR="$GITHUB_WORKSPACE/runtime-debug"

            mkdir -p "$DEBUG_DIR"

            APK="$GITHUB_WORKSPACE/v10-source/app/build/outputs/apk/debug/app-debug.apk"

            echo "===== DEVICE ====="

            adb devices

            echo "===== ANDROID VERSION ====="

            adb shell getprop ro.build.version.release

            adb shell getprop ro.build.version.sdk

            echo "===== INSTALL APK ====="

            adb install -r "$APK"

            echo "===== PACKAGE CHECK ====="

            adb shell pm path com.carassistant.v10

            echo "===== CLEAR LOGCAT ====="

            adb logcat -c

            echo "===== START LOGCAT ====="

            adb logcat -v threadtime \
              > "$DEBUG_DIR/logcat-full.txt" 2>&1 &

            LOGCAT_PID=$!

            echo "$LOGCAT_PID" \
              > "$DEBUG_DIR/logcat.pid"

            sleep 2

            echo "===== RESET APP ====="

            adb shell am force-stop \
              com.carassistant.v10 || true

            echo "===== LAUNCH V10 ====="

            adb shell monkey \
              -p com.carassistant.v10 \
              -c android.intent.category.LAUNCHER \
              1 || true

            echo "===== WAIT FOR STARTUP ====="

            sleep 10

            echo "===== ACTIVITY STATE ====="

            adb shell dumpsys activity activities \
              > "$DEBUG_DIR/activity.txt" 2>&1 || true

            echo "===== SERVICE STATE ====="

            adb shell dumpsys activity services \
              > "$DEBUG_DIR/services.txt" 2>&1 || true

            echo "===== PROCESS STATE ====="

            adb shell pidof com.carassistant.v10 \
              > "$DEBUG_DIR/pid.txt" 2>&1 || true

            echo "===== PACKAGE STATE ====="

            adb shell dumpsys package com.carassistant.v10 \
              > "$DEBUG_DIR/package.txt" 2>&1 || true

            echo "===== DROPBOX ====="

            adb shell dumpsys dropbox \
              > "$DEBUG_DIR/dropbox.txt" 2>&1 || true

            echo "===== WAIT FOR FINAL LOGS ====="

            sleep 5

            kill "$LOGCAT_PID" \
              2>/dev/null || true

            wait "$LOGCAT_PID" \
              2>/dev/null || true

            echo "===== FILTERED V10 LOG ====="

            grep -E \
              "FATAL EXCEPTION|AndroidRuntime|com\.carassistant\.v10|V10Projection|V10ProjectionService|V10ProjectionSession|V10CarActivity|V10LauncherActivity|SecurityException|DeadObjectException|RemoteException|VirtualDisplay|MediaProjection|ActivityManager" \
              "$DEBUG_DIR/logcat-full.txt" \
              > "$DEBUG_DIR/v10-crash-filter.txt" || true

            cat \
              "$DEBUG_DIR/v10-crash-filter.txt" \
              || true

            echo "===== PID ====="

            cat \
              "$DEBUG_DIR/pid.txt" \
              || true

            echo "===== RUNTIME DEBUG COMPLETE ====="

      - name: Upload V10 runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V10-8B2-runtime-crash-log
          path: runtime-debug/
          if-no-files-found: warn
