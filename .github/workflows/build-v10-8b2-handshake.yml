name: Build Car Assistant V10 - 8B2 Startup Handshake

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify existing V10
        shell: bash
        run: |
          set -euo pipefail

          ROOT="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$ROOT/V10ProjectionService.java"
          test -f "$ROOT/V10ProjectionSession.java"
          test -f "$ROOT/V10CarActivity.java"
          test -f "$ROOT/V10SessionStore.java"

          grep -q 'package com.carassistant.v10;' \
            "$ROOT/V10ProjectionService.java"

          grep -q 'package com.carassistant.v10;' \
            "$ROOT/V10ProjectionSession.java"

          echo "Existing V10 source confirmed."

      - name: Patch V10ProjectionService
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java"

          cat > /tmp/patch_service.py <<'PY'
          import re
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          anchor = "    private static volatile V10ProjectionService instance;"

          if "START_LOCK" not in s:
              if anchor not in s:
                  raise SystemExit("START_LOCK anchor not found")

              add = "\n".join([
                  "",
                  "    private static final Object START_LOCK = new Object();",
                  "    private static ComponentName pendingTarget;",
                  "    private static Surface pendingSurface;",
                  "    private static int pendingWidth;",
                  "    private static int pendingHeight;",
                  ""
              ])

              s = s.replace(anchor, anchor + add, 1)

          def replace_method(name, pattern, lines):
              global s

              matches = list(re.finditer(pattern, s, re.S))

              if len(matches) != 1:
                  raise SystemExit(
                      name + ": expected 1 match, found "
                      + str(len(matches))
                  )

              replacement = "\n".join(lines)

              m = matches[0]

              s = (
                  s[:m.start()]
                  + replacement
                  + s[m.end():]
              )

          replace_method(
              "ensureStarted",
              r"public\s+static\s+void\s+ensureStarted\s*\(\s*android\.content\.Context\s+context\s*\)\s*\{.*?\n\s*\}",
              [
                  "    public static void ensureStarted(",
                  "            android.content.Context context) {",
                  "",
                  "        if (getInstance() != null) {",
                  "            return;",
                  "        }",
                  "",
                  "        android.content.Context app =",
                  "                context.getApplicationContext();",
                  "",
                  "        Intent intent = new Intent(",
                  "                app,",
                  "                V10ProjectionService.class);",
                  "",
                  "        try {",
                  "            if (Build.VERSION.SDK_INT >= 26) {",
                  "                app.startForegroundService(intent);",
                  "            } else {",
                  "                app.startService(intent);",
                  "            }",
                  "        } catch (Throwable error) {",
                  "            Log.w(TAG,",
                  "                    \"Unable to start projection service\",",
                  "                    error);",
                  "        }",
                  "    }"
              ]
          )

          replace_method(
              "setTarget",
              r"public\s+static\s+void\s+setTarget\s*\(\s*android\.content\.Context\s+context\s*,\s*ComponentName\s+component\s*\)\s*\{.*?\n\s*\}",
              [
                  "    public static void setTarget(",
                  "            android.content.Context context,",
                  "            ComponentName component) {",
                  "",
                  "        if (component == null) {",
                  "            clearTarget();",
                  "            return;",
                  "        }",
                  "",
                  "        synchronized (START_LOCK) {",
                  "            V10ProjectionService service = getInstance();",
                  "",
                  "            if (service == null) {",
                  "                pendingTarget = component;",
                  "                ensureStarted(context);",
                  "                return;",
                  "            }",
                  "",
                  "            service.setTargetInternal(component);",
                  "        }",
                  "    }"
              ]
          )

          replace_method(
              "attachSurface",
              r"public\s+static\s+void\s+attachSurface\s*\(\s*android\.content\.Context\s+context\s*,\s*Surface\s+newSurface\s*,\s*int\s+newWidth\s*,\s*int\s+newHeight\s*\)\s*\{.*?\n\s*\}",
              [
                  "    public static void attachSurface(",
                  "            android.content.Context context,",
                  "            Surface newSurface,",
                  "            int newWidth,",
                  "            int newHeight) {",
                  "",
                  "        if (newSurface == null ||",
                  "                newWidth < 1 || newHeight < 1) {",
                  "            return;",
                  "        }",
                  "",
                  "        synchronized (START_LOCK) {",
                  "            V10ProjectionService service = getInstance();",
                  "",
                  "            if (service == null) {",
                  "                if (pendingSurface != null &&",
                  "                        pendingSurface != newSurface) {",
                  "                    try {",
                  "                        pendingSurface.release();",
                  "                    } catch (Throwable ignored) {",
                  "                    }",
                  "                }",
                  "",
                  "                pendingSurface = newSurface;",
                  "                pendingWidth = newWidth;",
                  "                pendingHeight = newHeight;",
                  "                ensureStarted(context);",
                  "                return;",
                  "            }",
                  "",
                  "            service.attachSurfaceInternal(",
                  "                    newSurface, newWidth, newHeight);",
                  "        }",
                  "    }"
              ]
          )

          marker = "    @Override\n    public void onCreate()"

          if "private void flushPendingState()" not in s:
              if marker not in s:
                  raise SystemExit("onCreate marker not found")

              flush = "\n".join([
                  "    private void flushPendingState() {",
                  "",
                  "        synchronized (START_LOCK) {",
                  "            if (instance != this || destroyed) {",
                  "                return;",
                  "            }",
                  "",
                  "            ComponentName t = pendingTarget;",
                  "            Surface sf = pendingSurface;",
                  "            int w = pendingWidth;",
                  "            int h = pendingHeight;",
                  "",
                  "            pendingTarget = null;",
                  "            pendingSurface = null;",
                  "            pendingWidth = 0;",
                  "            pendingHeight = 0;",
                  "",
                  "            try {",
                  "                if (t != null) {",
                  "                    setTargetInternal(t);",
                  "                }",
                  "                if (sf != null) {",
                  "                    attachSurfaceInternal(sf, w, h);",
                  "                }",
                  "            } catch (Throwable error) {",
                  "                Log.e(TAG,",
                  "                        \"Pending projection state failed\",",
                  "                        error);",
                  "            }",
                  "        }",
                  "    }",
                  ""
              ])

              s = s.replace(marker, flush + marker, 1)

          if "flushPendingState();" not in s:
              fg = "                notification);"

              pos = s.find(fg)

              if pos < 0:
                  raise SystemExit("startForeground marker not found")

              end = pos + len(fg)

              s = (
                  s[:end]
                  + "\n\n        flushPendingState();"
                  + s[end:]
              )

          p.write_text(s)

          print("ProjectionService patched successfully.")
          PY

          python3 /tmp/patch_service.py "$FILE"

      - name: Patch V10ProjectionSession
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          cat > /tmp/patch_session.py <<'PY'
          import re
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          pattern = (
              r"public\s+V10ProjectionSession\s*"
              r"\(\s*Context\s+context\s*\)\s*\{"
              r".*?\n\s*\}"
          )

          matches = list(re.finditer(pattern, s, re.S))

          if len(matches) != 1:
              raise SystemExit(
                  "Expected one V10ProjectionSession constructor, found "
                  + str(len(matches))
              )

          new = "\n".join([
              "public V10ProjectionSession(Context context) {",
              "        this.context =",
              "                context.getApplicationContext();",
              "    }"
          ])

          m = matches[0]

          s = s[:m.start()] + new + s[m.end():]

          if "V10ProjectionService.ensureStarted" in s:
              raise SystemExit(
                  "Session still contains eager service startup"
              )

          p.write_text(s)

          print("ProjectionSession patched successfully.")
          PY

          python3 /tmp/patch_session.py "$FILE"

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail

          SERVICE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java"
          SESSION="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          grep -q "START_LOCK" "$SERVICE"
          grep -q "pendingTarget" "$SERVICE"
          grep -q "pendingSurface" "$SERVICE"
          grep -q "flushPendingState" "$SERVICE"

          grep -q "startForegroundService" "$SERVICE"

          if grep -nE '(^|[[:space:];&|])(/system/bin/)?am[[:space:]]+force-stop([[:space:]]|$)' "$SERVICE"; then
            echo "ERROR: force-stop command detected"
            exit 1
          fi

          if grep -q "V10ProjectionService.ensureStarted" "$SESSION"; then
            echo "ERROR: eager service startup remains"
            exit 1
          fi

          grep -q 'package com.carassistant.v10;' "$SERVICE"
          grep -q 'package com.carassistant.v10;' "$SESSION"

          echo "V10-8B.2 handshake verified."

      - name: Verify V10 components preserved
        shell: bash
        run: |
          set -euo pipefail

          ROOT="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$ROOT/V10CarActivity.java"
          test -f "$ROOT/V10SessionStore.java"
          test -f "$ROOT/V10InputController.java"
          test -f "$ROOT/RootShellSession.java"
          test -f "$ROOT/CarSystemUI.java"
          test -f "$ROOT/CarRecents.java"

          grep -q "MAX_RECENTS = 4" \
            "$ROOT/V10SessionStore.java"

          echo "Existing V10 components preserved."

      - name: Check source diff
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          echo "Modified files:"
          git diff --name-only

      - name: Build V10
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-8B2-StartupHandshake
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
