name: Build Car Assistant V10 - 8B2 Startup Handshake

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout existing V10 source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify existing V10 source
        shell: bash
        run: |
          set -euo pipefail

          ROOT="v10-source"
          SERVICE="$ROOT/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java"
          SESSION="$ROOT/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
          ACTIVITY="$ROOT/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          MANIFEST="$ROOT/app/src/main/AndroidManifest.xml"

          test -f "$SERVICE"
          test -f "$SESSION"
          test -f "$ACTIVITY"
          test -f "$MANIFEST"

          grep -q 'package com.carassistant.v10;' "$SERVICE"
          grep -q 'package com.carassistant.v10;' "$SESSION"
          grep -q 'package com.carassistant.v10;' "$ACTIVITY"

          echo "Existing V10 source confirmed."
          echo "No V10 recreation will be performed."

      - name: Patch V10ProjectionService - startup handshake
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text()

          start = text.index("package com.carassistant.v10;")

          replacement = r'''package com.carassistant.v10;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.Process;
          import android.util.Log;
          import android.view.Display;
          import android.view.Surface;

          public final class V10ProjectionService extends Service {

              private static final String TAG =
                      "CarAssistantV10Service";

              private static final String CHANNEL_ID =
                      "v10_projection";

              private static final int NOTIFICATION_ID =
                      10010;

              private static volatile V10ProjectionService instance;

              /*
               * Startup handshake.
               *
               * Activity/TextureView can call the static API
               * before Android has finished creating this Service.
               *
               * These pending values bridge that asynchronous gap.
               */
              private static final Object START_LOCK =
                      new Object();

              private static ComponentName pendingTarget;

              private static Surface pendingSurface;

              private static int pendingWidth;

              private static int pendingHeight;

              private final Object lock =
                      new Object();

              private ComponentName target;

              private VirtualDisplay virtualDisplay;

              private Display display;

              private Surface surface;

              private int width;

              private int height;

              private boolean destroyed;


              public static void ensureStarted(
                      Context context) {

                  if (getInstance() != null) {
                      return;
                  }

                  Intent intent =
                          new Intent(
                                  context.getApplicationContext(),
                                  V10ProjectionService.class);

                  try {

                      if (Build.VERSION.SDK_INT >= 26) {

                          context.getApplicationContext()
                                  .startForegroundService(intent);

                      } else {

                          context.getApplicationContext()
                                  .startService(intent);
                      }

                  } catch (Throwable error) {

                      /*
                       * Never allow service-start failure to
                       * crash V10CarActivity.
                       */
                      Log.w(
                              TAG,
                              "Unable to start projection service",
                              error);
                  }
              }


              private static V10ProjectionService getInstance() {
                  return instance;
              }


              public static void setTarget(
                      Context context,
                      ComponentName component) {

                  if (component == null) {
                      clearTarget();
                      return;
                  }

                  synchronized (START_LOCK) {

                      V10ProjectionService service =
                              getInstance();

                      if (service == null) {

                          pendingTarget = component;

                          ensureStarted(context);

                          return;
                      }

                      service.setTargetInternal(
                              component);
                  }
              }


              public static void attachSurface(
                      Context context,
                      Surface newSurface,
                      int newWidth,
                      int newHeight) {

                  if (newSurface == null
                          || newWidth < 1
                          || newHeight < 1) {
                      return;
                  }

                  synchronized (START_LOCK) {

                      V10ProjectionService service =
                              getInstance();

                      if (service == null) {

                          /*
                           * Keep the Surface until the service
                           * is ready. Do not release it here.
                           */
                          if (pendingSurface != null
                                  && pendingSurface != newSurface) {

                              try {
                                  pendingSurface.release();
                              } catch (Throwable ignored) {
                              }
                          }

                          pendingSurface = newSurface;
                          pendingWidth = newWidth;
                          pendingHeight = newHeight;

                          ensureStarted(context);

                          return;
                      }

                      service.attachSurfaceInternal(
                              newSurface,
                              newWidth,
                              newHeight);
                  }
              }


              public static void detachSurface() {

                  synchronized (START_LOCK) {

                      if (pendingSurface != null) {

                          try {
                              pendingSurface.release();
                          } catch (Throwable ignored) {
                          }

                          pendingSurface = null;
                          pendingWidth = 0;
                          pendingHeight = 0;
                      }

                      V10ProjectionService service =
                              getInstance();

                      if (service != null) {
                          service.detachSurfaceInternal();
                      }
                  }
              }


              public static int getDisplayId() {

                  V10ProjectionService service =
                          getInstance();

                  if (service == null) {
                      return -1;
                  }

                  return service.getDisplayIdInternal();
              }


              public static boolean isActive() {

                  V10ProjectionService service =
                          getInstance();

                  return service != null
                          && service.isActiveInternal();
              }


              public static void clearTarget() {

                  synchronized (START_LOCK) {

                      pendingTarget = null;

                      V10ProjectionService service =
                              getInstance();

                      if (service != null) {
                          service.clearTargetInternal();
                      }
                  }
              }


              public static void tap(
                      int x,
                      int y) {

                  V10ProjectionService service =
                          getInstance();

                  if (service != null) {

                      service.inputInternal(
                              "tap "
                                      + x
                                      + " "
                                      + y);
                  }
              }


              public static void swipe(
                      int x1,
                      int y1,
                      int x2,
                      int y2,
                      long duration) {

                  V10ProjectionService service =
                          getInstance();

                  if (service != null) {

                      long d =
                              Math.max(
                                      80L,
                                      Math.min(
                                              800L,
                                              duration));

                      service.inputInternal(
                              "swipe "
                                      + x1
                                      + " "
                                      + y1
                                      + " "
                                      + x2
                                      + " "
                                      + y2
                                      + " "
                                      + d);
                  }
              }


              public static void back() {

                  V10ProjectionService service =
                          getInstance();

                  if (service != null) {

                      service.inputInternal(
                              "keyevent 4");
                  }
              }


              @Override
              public void onCreate() {

                  super.onCreate();

                  instance = this;

                  createNotificationChannel();

                  Notification.Builder builder;

                  if (Build.VERSION.SDK_INT >= 26) {

                      builder =
                              new Notification.Builder(
                                      this,
                                      CHANNEL_ID);

                  } else {

                      builder =
                              new Notification.Builder(
                                      this);
                  }

                  Notification notification =
                          builder
                                  .setSmallIcon(
                                          android.R.drawable
                                                  .ic_menu_view)
                                  .setContentTitle(
                                          "Car Assistant V10")
                                  .setContentText(
                                          "Projection engine running")
                                  .setOngoing(true)
                                  .build();

                  try {

                      startForeground(
                              NOTIFICATION_ID,
                              notification);

                  } catch (Throwable error) {

                      Log.e(
                              TAG,
                              "startForeground failed",
                              error);

                      instance = null;

                      stopSelf();

                      return;
                  }

                  flushPendingState();
              }


              @Override
              public int onStartCommand(
                      Intent intent,
                      int flags,
                      int startId) {

                  /*
                   * onCreate normally flushes the state,
                   * but onStartCommand is also a safe retry point.
                   */
                  flushPendingState();

                  return START_STICKY;
              }


              private void flushPendingState() {

                  synchronized (START_LOCK) {

                      if (instance != this
                              || destroyed) {
                          return;
                      }

                      ComponentName nextTarget =
                              pendingTarget;

                      Surface nextSurface =
                              pendingSurface;

                      int nextWidth =
                              pendingWidth;

                      int nextHeight =
                              pendingHeight;

                      pendingTarget = null;
                      pendingSurface = null;
                      pendingWidth = 0;
                      pendingHeight = 0;

                      try {

                          if (nextTarget != null) {

                              setTargetInternal(
                                      nextTarget);
                          }

                          if (nextSurface != null) {

                              attachSurfaceInternal(
                                      nextSurface,
                                      nextWidth,
                                      nextHeight);

                          }

                      } catch (Throwable error) {

                          Log.e(
                                  TAG,
                                  "Pending projection state failed",
                                  error);

                          if (nextSurface != null
                                  && surface != nextSurface) {

                              try {
                                  nextSurface.release();
                              } catch (Throwable ignored) {
                              }
                          }
                      }
                  }
              }


              private void setTargetInternal(
                      ComponentName component) {

                  synchronized (lock) {

                      if (destroyed) {
                          return;
                      }

                      if (component == null) {

                          clearTargetLocked();

                          return;
                      }

                      if (component.equals(target)) {
                          return;
                      }

                      target = component;

                      releaseDisplayLocked();

                      ensureDisplayLocked();
                  }
              }


              private void attachSurfaceInternal(
                      Surface newSurface,
                      int newWidth,
                      int newHeight) {

                  synchronized (lock) {

                      if (destroyed
                              || newSurface == null
                              || newWidth < 1
                              || newHeight < 1) {

                          return;
                      }

                      width = newWidth;
                      height = newHeight;

                      if (surface != null
                              && surface != newSurface) {

                          try {
                              surface.release();
                          } catch (Throwable ignored) {
                          }
                      }

                      surface = newSurface;

                      if (virtualDisplay == null) {

                          ensureDisplayLocked();

                          return;
                      }

                      try {

                          virtualDisplay.setSurface(
                                  newSurface);

                      } catch (Throwable error) {

                          Log.w(
                                  TAG,
                                  "VirtualDisplay.setSurface failed",
                                  error);

                          releaseDisplayLocked();

                          ensureDisplayLocked();
                      }
                  }
              }


              private void detachSurfaceInternal() {

                  synchronized (lock) {

                      if (virtualDisplay != null) {

                          try {

                              virtualDisplay.setSurface(
                                      null);

                          } catch (Throwable error) {

                              Log.w(
                                      TAG,
                                      "VirtualDisplay surface detach failed",
                                      error);
                          }
                      }

                      if (surface != null) {

                          try {
                              surface.release();
                          } catch (Throwable ignored) {
                          }

                          surface = null;
                      }
                  }
              }


              private void ensureDisplayLocked() {

                  if (destroyed
                          || target == null
                          || surface == null
                          || width < 1
                          || height < 1
                          || virtualDisplay != null) {

                      return;
                  }

                  try {

                      DisplayManager manager =
                              (DisplayManager)
                                      getSystemService(
                                              DISPLAY_SERVICE);

                      if (manager == null) {

                          throw new IllegalStateException(
                                  "DisplayManager unavailable");
                      }

                      VirtualDisplay vd =
                              manager.createVirtualDisplay(
                                      V10Display.nameFor(0),
                                      width,
                                      height,
                                      160,
                                      surface,
                                      10);

                      if (vd == null) {

                          throw new IllegalStateException(
                                  "Cannot create virtual display");
                      }

                      Display d =
                              vd.getDisplay();

                      if (d == null) {

                          vd.release();

                          throw new IllegalStateException(
                                  "Virtual display has no Display");
                      }

                      virtualDisplay = vd;
                      display = d;

                      launchTargetLocked();

                  } catch (Throwable error) {

                      Log.e(
                              TAG,
                              "Display creation failed",
                              error);

                      releaseDisplayLocked();
                  }
              }


              private void launchTargetLocked() {

                  if (display == null
                          || target == null) {
                      return;
                  }

                  final int displayId =
                          display.getDisplayId();

                  final int userId =
                          Process.myUid() / 100000;

                  final String flat =
                          target
                                  .flattenToString()
                                  .replace(
                                          "'",
                                          "'\"'\"'");

                  final String command =
                          "/system/bin/am start"
                                  + " --user "
                                  + userId
                                  + " --display "
                                  + displayId
                                  + " --activity-reorder-to-front"
                                  + " -n '"
                                  + flat
                                  + "'";

                  RootShellSession.EXEC.execute(
                          () -> {

                              RootShellSession shell =
                                      new RootShellSession();

                              try {

                                  shell.run(
                                          10,
                                          command);

                              } catch (Throwable error) {

                                  Log.w(
                                          TAG,
                                          "Launch target failed",
                                          error);
                              }
                          });
              }


              private void inputInternal(
                      String arguments) {

                  final int displayId =
                          getDisplayIdInternal();

                  if (displayId < 0) {
                      return;
                  }

                  final String command =
                          "/system/bin/input -d "
                                  + displayId
                                  + " "
                                  + arguments;

                  RootShellSession.EXEC.execute(
                          () -> {

                              RootShellSession shell =
                                      new RootShellSession();

                              try {

                                  shell.run(
                                          5,
                                          command);

                              } catch (Throwable error) {

                                  Log.w(
                                          TAG,
                                          "Input failed",
                                          error);
                              }
                          });
              }


              private int getDisplayIdInternal() {

                  synchronized (lock) {

                      if (display == null) {
                          return -1;
                      }

                      return display.getDisplayId();
                  }
              }


              private boolean isActiveInternal() {

                  synchronized (lock) {

                      return !destroyed
                              && target != null
                              && virtualDisplay != null
                              && display != null;
                  }
              }


              private void clearTargetInternal() {

                  synchronized (lock) {
                      clearTargetLocked();
                  }
              }


              private void clearTargetLocked() {

                  target = null;

                  releaseDisplayLocked();
              }


              private void releaseDisplayLocked() {

                  if (virtualDisplay != null) {

                      try {
                          virtualDisplay.release();
                      } catch (Throwable ignored) {
                      }
                  }

                  virtualDisplay = null;
                  display = null;

                  if (surface != null) {

                      try {
                          surface.release();
                      } catch (Throwable ignored) {
                      }

                      surface = null;
                  }
              }


              @Override
              public void onDestroy() {

                  synchronized (lock) {

                      destroyed = true;

                      target = null;

                      releaseDisplayLocked();
                  }

                  if (instance == this) {
                      instance = null;
                  }

                  super.onDestroy();
              }


              @Override
              public IBinder onBind(
                      Intent intent) {

                  return null;
              }


              private void createNotificationChannel() {

                  if (Build.VERSION.SDK_INT < 26) {
                      return;
                  }

                  NotificationManager manager =
                          (NotificationManager)
                                  getSystemService(
                                          NOTIFICATION_SERVICE);

                  if (manager != null) {

                      NotificationChannel channel =
                              new NotificationChannel(
                                      CHANNEL_ID,
                                      "Car Assistant V10 Projection",
                                      NotificationManager
                                              .IMPORTANCE_LOW);

                      manager.createNotificationChannel(
                              channel);
                  }
              }
          }
          '''

          path.write_text(replacement)
          PY

      - name: Patch V10ProjectionSession startup safety
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          old = """    public V10ProjectionSession(
              Context context) {

          this.context =
                  context.getApplicationContext();

          /*
           * Start the projection owner independently
           * from V10CarActivity.
           */
          V10ProjectionService.ensureStarted(
                  this.context);
      }
      """

          new = """    public V10ProjectionSession(
              Context context) {

          this.context =
                  context.getApplicationContext();

          /*
           * Service startup is asynchronous.
           *
           * V10ProjectionService now keeps pending
           * target/surface state until it is ready.
           */
          V10ProjectionService.ensureStarted(
                  this.context);
      }
      """

          if old in text:
              text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Verify handshake patch
        shell: bash
        run: |
          set -euo pipefail

          SERVICE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java"

          grep -q "START_LOCK" "$SERVICE"
          grep -q "pendingTarget" "$SERVICE"
          grep -q "pendingSurface" "$SERVICE"
          grep -q "flushPendingState" "$SERVICE"
          grep -q "startForegroundService" "$SERVICE"

          # Reject only an actual force-stop command,
          # not comments containing the words "force-stop".
          if grep -nE '(^|[[:space:];&|])(/system/bin/)?am[[:space:]]+force-stop([[:space:]]|$)' "$SERVICE"; then
            echo "ERROR: actual force-stop command detected"
            exit 1
          fi

          echo "Startup handshake verification passed."

      - name: Verify V10 source integrity
        shell: bash
        run: |
          set -euo pipefail

          ROOT="v10-source"

          test -f "$ROOT/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java"
          test -f "$ROOT/app/src/main/java/com/hieptran/aacast/doudou/CarSystemUI.java"
          test -f "$ROOT/app/src/main/java/com/hieptran/aacast/doudou/CarRecents.java"
          test -f "$ROOT/app/src/main/java/com/hieptran/aacast/doudou/V10InputController.java"
          test -f "$ROOT/app/src/main/java/com/hieptran/aacast/doudou/RootShellSession.java"

          grep -q 'MAX_RECENTS = 4' \
            "$ROOT/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java"

          echo "Existing V10 components preserved."

      - name: Make Gradle executable
        shell: bash
        run: |
          set -euo pipefail
          chmod +x v10-source/gradlew

      - name: Compile V10 Java
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew compileDebugJavaWithJavac --no-daemon --stacktrace

      - name: Build V10 APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK:"
          ls -lh "$APK"

          echo "SHA256:"
          sha256sum "$APK"

      - name: Upload V10 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-8B2-StartupHandshake
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
