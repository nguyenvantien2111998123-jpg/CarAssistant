name: Build Car Assistant V10 - 8B2 Startup Handshake Fixed v6

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify existing V10
        shell: bash
        run: |
          set -euo pipefail

          ROOT="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$ROOT/V10ProjectionService.java"
          test -f "$ROOT/V10ProjectionSession.java"
          test -f "$ROOT/V10CarActivity.java"
          test -f "$ROOT/V10SessionStore.java"
          test -f "$ROOT/V10InputController.java"
          test -f "$ROOT/RootShellSession.java"

          grep -Fq 'package com.carassistant.v10;' \
            "$ROOT/V10ProjectionService.java"

          grep -Fq 'package com.carassistant.v10;' \
            "$ROOT/V10ProjectionSession.java"

          grep -Eq 'MAX_RECENTS[[:space:]]*=[[:space:]]*4' \
            "$ROOT/V10SessionStore.java"

          echo "PASS: existing V10"

      - name: Patch V10ProjectionService
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/"
              "V10ProjectionService.java"
          )

          s = p.read_text()

          def method_range(src, name):
              m = re.search(
                  r'(?m)^[ \t]*(?:public|private|protected)[^\n{;]*\b'
                  + re.escape(name)
                  + r'\s*\([^;{]*\)\s*\{',
                  src
              )

              if not m:
                  raise RuntimeError(
                      "method not found: " + name
                  )

              start = m.start()
              brace = src.find("{", m.start())

              depth = 0
              quote = None
              i = brace

              while i < len(src):
                  c = src[i]

                  if quote:
                      if c == "\\":
                          i += 2
                          continue
                      if c == quote:
                          quote = None
                  else:
                      if c in ('"', "'"):
                          quote = c
                      elif c == "{":
                          depth += 1
                      elif c == "}":
                          depth -= 1
                          if depth == 0:
                              return start, i + 1

                  i += 1

              raise RuntimeError(
                  "method brace not closed: " + name
              )

          def replace_method(src, name, body):
              a, b = method_range(src, name)
              return src[:a] + body + src[b:]

          if "private static final Object START_LOCK" not in s:
              marker = (
                  "private static volatile "
                  "V10ProjectionService instance;"
              )

              fields = """
    
    private static final Object START_LOCK =
            new Object();

    private static ComponentName pendingTarget;

    private static Surface pendingSurface;

    private static int pendingWidth;

    private static int pendingHeight;
"""

              if marker not in s:
                  raise RuntimeError(
                      "service instance marker not found"
                  )

              s = s.replace(
                  marker,
                  marker + fields,
                  1
              )

          ensure_started = """    public static void ensureStarted(
            android.content.Context context) {

        if (getInstance() != null) {
            return;
        }

        android.content.Context appContext =
                context.getApplicationContext();

        try {

            Intent intent =
                    new Intent(
                            appContext,
                            V10ProjectionService.class);

            if (Build.VERSION.SDK_INT >= 26) {

                appContext.startForegroundService(
                        intent);

            } else {

                appContext.startService(intent);
            }

        } catch (Throwable error) {

            Log.w(
                    TAG,
                    "Unable to start projection service",
                    error);
        }
    }
"""

          set_target = """    public static void setTarget(
            android.content.Context context,
            ComponentName component) {

        synchronized (START_LOCK) {

            V10ProjectionService service =
                    getInstance();

            if (service == null) {

                pendingTarget = component;

                ensureStarted(context);

                return;
            }

            service.setTargetInternal(component);
        }
    }
"""

          attach_surface = """    public static void attachSurface(
            android.content.Context context,
            Surface newSurface,
            int newWidth,
            int newHeight) {

        if (newSurface == null
                || newWidth <= 0
                || newHeight <= 0) {
            return;
        }

        synchronized (START_LOCK) {

            V10ProjectionService service =
                    getInstance();

            if (service == null) {

                if (pendingSurface != null
                        && pendingSurface != newSurface) {

                    try {
                        pendingSurface.release();
                    } catch (Throwable ignored) {
                    }
                }

                pendingSurface = newSurface;
                pendingWidth = newWidth;
                pendingHeight = newHeight;

                ensureStarted(context);

                return;
            }

            service.attachSurfaceInternal(
                    newSurface,
                    newWidth,
                    newHeight);
        }
    }
"""

          s = replace_method(
              s,
              "ensureStarted",
              ensure_started
          )

          s = replace_method(
              s,
              "setTarget",
              set_target
          )

          s = replace_method(
              s,
              "attachSurface",
              attach_surface
          )

          if "private void flushPendingState()" not in s:
              marker = "    private void detachSurfaceInternal"

              flush = """    private void flushPendingState() {

        synchronized (START_LOCK) {

            if (instance != this || destroyed) {
                return;
            }

            ComponentName t = pendingTarget;
            Surface sf = pendingSurface;
            int w = pendingWidth;
            int h = pendingHeight;

            pendingTarget = null;
            pendingSurface = null;
            pendingWidth = 0;
            pendingHeight = 0;

            try {

                if (t != null) {
                    setTargetInternal(t);
                }

                if (sf != null) {
                    attachSurfaceInternal(
                            sf,
                            w,
                            h);
                }

            } catch (Throwable error) {

                Log.e(
                        TAG,
                        "Pending projection state failed",
                        error);
            }
        }
    }

"""

              if marker not in s:
                  raise RuntimeError(
                      "detachSurfaceInternal marker not found"
                  )

              s = s.replace(
                  marker,
                  flush + marker,
                  1
              )

          if "flushPendingState();" not in s:
              marker = """        startForeground(
                NOTIFICATION_ID,
                notification);"""

              if marker not in s:
                  raise RuntimeError(
                      "startForeground block not found"
                  )

              s = s.replace(
                  marker,
                  marker + "\n\n        flushPendingState();",
                  1
              )

          p.write_text(s)

          print("PASS: service patched")
          PY

      - name: Patch V10ProjectionSession constructor
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/"
              "V10ProjectionSession.java"
          )

          s = p.read_text()

          pattern = re.compile(
              r'(?m)^[ \t]*public\s+V10ProjectionSession\s*'
              r'\(\s*Context\s+context\s*\)\s*\{'
          )

          m = pattern.search(s)

          if not m:
              raise RuntimeError(
                  "V10ProjectionSession constructor not found"
              )

          start = m.start()
          brace = s.find("{", m.start())

          depth = 0
          quote = None
          i = brace

          while i < len(s):
              c = s[i]

              if quote:
                  if c == "\\":
                      i += 2
                      continue
                  if c == quote:
                      quote = None
              else:
                  if c in ('"', "'"):
                      quote = c
                  elif c == "{":
                      depth += 1
                  elif c == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              i += 1
          else:
              raise RuntimeError(
                  "constructor closing brace not found"
              )

          replacement = """    public V10ProjectionSession(
            Context context) {

        this.context =
                context.getApplicationContext();
    }"""

          s = s[:start] + replacement + s[end:]

          p.write_text(s)

          print("PASS: session constructor patched")
          PY

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail

          ROOT="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          SERVICE="$ROOT/V10ProjectionService.java"
          SESSION="$ROOT/V10ProjectionSession.java"

          if grep -Fq \
            "public static void public static void" \
            "$SERVICE"; then
            echo "ERROR: duplicated method declaration"
            exit 1
          fi

          grep -Fq \
            "private static final Object START_LOCK" \
            "$SERVICE"

          grep -Fq "pendingTarget" "$SERVICE"
          grep -Fq "pendingSurface" "$SERVICE"
          grep -Fq "pendingWidth" "$SERVICE"
          grep -Fq "pendingHeight" "$SERVICE"
          grep -Fq "flushPendingState();" "$SERVICE"

          grep -Fq \
            "public static void ensureStarted" \
            "$SERVICE"

          grep -Fq \
            "public static void setTarget" \
            "$SERVICE"

          grep -Fq \
            "public static void attachSurface" \
            "$SERVICE"

          grep -Fq "attachTextureView" "$SESSION"
          grep -Fq "setTarget" "$SESSION"
          grep -Fq "isActive" "$SESSION"
          grep -Fq "getDisplayId" "$SESSION"
          grep -Fq "tap" "$SESSION"
          grep -Fq "swipe" "$SESSION"
          grep -Fq "back" "$SESSION"
          grep -Fq "release" "$SESSION"
          grep -Fq "destroy" "$SESSION"

          if grep -nF \
            "V10ProjectionService.ensureStarted" \
            "$SESSION"; then
            echo "ERROR: eager service start remains"
            exit 1
          fi

          echo "PASS: source verification"

      - name: Verify V10 components
        shell: bash
        run: |
          set -euo pipefail

          ROOT="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$ROOT/V10CarActivity.java"
          test -f "$ROOT/V10SessionStore.java"
          test -f "$ROOT/V10InputController.java"
          test -f "$ROOT/RootShellSession.java"

          grep -Eq \
            'MAX_RECENTS[[:space:]]*=[[:space:]]*4' \
            "$ROOT/V10SessionStore.java"

          echo "PASS: V10 components preserved"

      - name: Verify no force-stop
        shell: bash
        run: |
          set -euo pipefail

          ROOT="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          if grep -RInE \
            '(^|[[:space:];&|])(/system/bin/)?am[[:space:]]+force-stop([[:space:]]|$)' \
            "$ROOT"; then
            echo "ERROR: actual force-stop detected"
            exit 1
          fi

          echo "PASS: no actual force-stop"

      - name: Validate Java braces
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          root = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou"
          )

          files = [
              "V10ProjectionService.java",
              "V10ProjectionSession.java",
              "V10CarActivity.java",
              "V10SessionStore.java",
              "V10InputController.java",
              "RootShellSession.java",
          ]

          for name in files:

              path = root / name
              text = path.read_text()

              depth = 0
              quote = None
              i = 0

              while i < len(text):

                  c = text[i]

                  if quote:
                      if c == "\\":
                          i += 2
                          continue

                      if c == quote:
                          quote = None

                  else:
                      if c in ('"', "'"):
                          quote = c

                      elif c == "{":
                          depth += 1

                      elif c == "}":
                          depth -= 1

                          if depth < 0:
                              raise RuntimeError(
                                  "negative brace depth: " + name
                              )

                  i += 1

              if depth != 0:
                  raise RuntimeError(
                      "unbalanced braces: "
                      + name
                      + " depth="
                      + str(depth)
                  )

              print("PASS: " + name)

          PY

      - name: Check diff
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          echo "===== SERVICE DIFF ====="

          git diff -- \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java

          echo "===== SESSION DIFF ====="

          git diff -- \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java

      - name: Build V10
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          SHA256="$(sha256sum "$APK" | awk '{print $1}')"

          echo "APK: $APK"
          echo "SHA256: $SHA256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-8B2-StartupHandshake-Fixed-v6
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
