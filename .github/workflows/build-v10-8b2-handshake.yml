name: Build Car Assistant V10 - 8B2 Startup Handshake Fixed v8 + Runtime Emulator

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify V10 source
        shell: bash
        run: |
          set -euo pipefail

          ROOT="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          echo "Checking V10 source..."

          test -f "$ROOT/V10CarActivity.java"
          test -f "$ROOT/V10SessionStore.java"
          test -f "$ROOT/V10InputController.java"
          test -f "$ROOT/RootShellSession.java"
          test -f "$ROOT/V10ProjectionService.java"
          test -f "$ROOT/V10ProjectionSession.java"

          grep -q 'package com.carassistant.v10;' \
            "$ROOT/V10ProjectionService.java"

          grep -q 'package com.carassistant.v10;' \
            "$ROOT/V10ProjectionSession.java"

          grep -q 'MAX_RECENTS = 4' \
            "$ROOT/V10SessionStore.java"

          echo "V10 source verification: PASS"

      - name: Patch V10ProjectionService
        shell: bash
        run: |
          set -euo pipefail

          SERVICE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java"

          python3 - "$SERVICE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          # Add startup handshake state if missing.
          marker = "private static final Object START_LOCK = new Object();"

          if marker not in text:
              anchor = "public class V10ProjectionService"
              idx = text.find(anchor)

              if idx == -1:
                  raise SystemExit("Could not find V10ProjectionService class")

              brace = text.find("{", idx)

              if brace == -1:
                  raise SystemExit("Could not find V10ProjectionService class opening brace")

              state = r'''
              private static final Object START_LOCK = new Object();

              private static ComponentName pendingTarget;
              private static Surface pendingSurface;
              private static int pendingWidth;
              private static int pendingHeight;

              '''

              text = text[:brace + 1] + state + text[brace + 1:]

          # Replace ensureStarted implementation.
          start_marker = "public static void ensureStarted(Context context)"

          start_pos = text.find(start_marker)

          if start_pos != -1:
              brace = text.find("{", start_pos)

              if brace == -1:
                  raise SystemExit("Could not locate ensureStarted body")

              depth = 0
              end = None

              for i in range(brace, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise SystemExit("Could not parse ensureStarted body")

              replacement = r'''public static void ensureStarted(Context context) {
                  if (context == null) {
                      return;
                  }

                  synchronized (START_LOCK) {
                      Context app = context.getApplicationContext();

                      try {
                          Intent intent = new Intent(app, V10ProjectionService.class);

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              app.startForegroundService(intent);
                          } else {
                              app.startService(intent);
                          }
                      } catch (Throwable t) {
                          Log.e(TAG, "ensureStarted failed", t);
                      }
                  }
              }'''

              text = text[:start_pos] + replacement + text[end:]

          # Replace setTarget implementation.
          target_marker = "public static void setTarget(Context context, ComponentName target)"

          target_pos = text.find(target_marker)

          if target_pos != -1:
              brace = text.find("{", target_pos)

              if brace == -1:
                  raise SystemExit("Could not locate setTarget body")

              depth = 0
              end = None

              for i in range(brace, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise SystemExit("Could not parse setTarget body")

              replacement = r'''public static void setTarget(Context context, ComponentName target) {
                  if (context == null) {
                      return;
                  }

                  synchronized (START_LOCK) {
                      pendingTarget = target;

                      if (instance == null) {
                          ensureStarted(context);
                          return;
                      }

                      try {
                          instance.applyTarget(target);
                      } catch (Throwable t) {
                          Log.e(TAG, "setTarget failed", t);
                      }
                  }
              }'''

              text = text[:target_pos] + replacement + text[end:]

          # Replace attachSurface implementation.
          surface_marker = "public static void attachSurface(Context context, Surface surface, int width, int height)"

          surface_pos = text.find(surface_marker)

          if surface_pos != -1:
              brace = text.find("{", surface_pos)

              if brace == -1:
                  raise SystemExit("Could not locate attachSurface body")

              depth = 0
              end = None

              for i in range(brace, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise SystemExit("Could not parse attachSurface body")

              replacement = r'''public static void attachSurface(
                      Context context,
                      Surface surface,
                      int width,
                      int height) {

                  if (context == null) {
                      return;
                  }

                  synchronized (START_LOCK) {
                      pendingSurface = surface;
                      pendingWidth = width;
                      pendingHeight = height;

                      if (instance == null) {
                          ensureStarted(context);
                          return;
                      }

                      try {
                          instance.attachSurface(surface, width, height);
                      } catch (Throwable t) {
                          Log.e(TAG, "attachSurface failed", t);
                      }
                  }
              }'''

              text = text[:surface_pos] + replacement + text[end:]

          # Add flushPendingState if missing.
          if "void flushPendingState()" not in text:
              anchor = "private static V10ProjectionService instance"

              idx = text.find(anchor)

              if idx == -1:
                  idx = text.find("public class V10ProjectionService")

              brace = text.find("{", idx)

              method = r'''

              private void flushPendingState() {
                  synchronized (START_LOCK) {
                      if (pendingTarget != null) {
                          try {
                              applyTarget(pendingTarget);
                          } catch (Throwable t) {
                              Log.e(TAG, "flush target failed", t);
                          }
                      }

                      if (pendingSurface != null) {
                          try {
                              attachSurface(
                                      pendingSurface,
                                      pendingWidth,
                                      pendingHeight
                              );
                          } catch (Throwable t) {
                              Log.e(TAG, "flush surface failed", t);
                          }
                      }
                  }
              }
              '''

              text = text[:brace + 1] + method + text[brace + 1:]

          # Flush after foreground startup if the marker exists.
          foreground_marker = "startForeground("

          if "flushPendingState();" not in text and foreground_marker in text:
              pos = text.find(foreground_marker)

              close = text.find(";", pos)

              if close != -1:
                  text = (
                      text[:close + 1]
                      + "\n\n        flushPendingState();"
                      + text[close + 1:]
                  )

          # Protect against accidental duplicate declaration.
          text = text.replace(
              "public static void public static void",
              "public static void"
          )

          path.write_text(text)
          print(f"Patched {path}")
          PY

      - name: Patch V10ProjectionSession
        shell: bash
        run: |
          set -euo pipefail

          SESSION="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          python3 - "$SESSION" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          # Make the session retain the application context.
          text = text.replace(
              "this.context = context;",
              "this.context = context.getApplicationContext();"
          )

          # Protect against accidental duplicate declaration.
          text = text.replace(
              "public static void public static void",
              "public static void"
          )

          path.write_text(text)
          print(f"Patched {path}")
          PY

      - name: Verify patched V10 source
        shell: bash
        run: |
          set -euo pipefail

          ROOT="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          SERVICE="$ROOT/V10ProjectionService.java"
          SESSION="$ROOT/V10ProjectionSession.java"

          echo "Checking duplicate declarations..."
          if grep -R "public static void public static void" "$ROOT"; then
            echo "ERROR: duplicate method declaration found"
            exit 1
          fi

          echo "Checking startup handshake markers..."
          grep -q "START_LOCK" "$SERVICE"
          grep -q "pendingTarget" "$SERVICE"
          grep -q "pendingSurface" "$SERVICE"
          grep -q "flushPendingState" "$SERVICE"

          echo "Checking projection lifecycle..."
          grep -q "attachTextureView" "$SESSION"
          grep -q "setTarget" "$SESSION"
          grep -q "release" "$SESSION"
          grep -q "destroy" "$SESSION"

          echo "Checking session does not recursively start service..."
          if grep -n "V10ProjectionService.ensureStarted" "$SESSION"; then
            echo "ERROR: recursive service startup call found in session"
            exit 1
          fi

          echo "Checking source for accidental am force-stop..."
          if grep -R -n --exclude-dir=.git "am force-stop" "$ROOT"; then
            echo "ERROR: actual force-stop found in V10 source"
            exit 1
          fi

          echo "Running git diff check..."
          git diff --check

          echo "Patched V10 source verification: PASS"

      - name: Build V10 APK
        shell: bash
        run: |
          set -euo pipefail

          cd v10-source

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK:"
          ls -lh "$APK"

          echo "SHA256:"
          sha256sum "$APK"

      - name: Upload V10 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-8B2-StartupHandshake-Fixed-v8
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail

          echo "Enabling KVM..."

          sudo apt-get update
          sudo apt-get install -y cpu-checker

          if [ -e /dev/kvm ]; then
            echo "/dev/kvm exists"
            ls -l /dev/kvm
          else
            echo "WARNING: /dev/kvm is not available"
          fi

      - name: Boot Android 12 Emulator and capture V10 crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          force-avd-creation: true
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -gpu swiftshader_indirect
            -no-snapshot
            -no-snapshot-save
          disable-animations: true
          script: |
            set -euo pipefail

            DEBUG_DIR="$GITHUB_WORKSPACE/runtime-debug"
            mkdir -p "$DEBUG_DIR"

            APK="$GITHUB_WORKSPACE/v10-source/app/build/outputs/apk/debug/app-debug.apk"

            echo "===== DEVICE ====="
            adb devices

            echo "===== ANDROID VERSION ====="
            adb shell getprop ro.build.version.release
            adb shell getprop ro.build.version.sdk

            echo "===== INSTALL APK ====="
            adb install -r "$APK"

            echo "===== PACKAGE CHECK ====="
            adb shell pm path com.carassistant.v10

            echo "===== CLEAR LOGCAT ====="
            adb logcat -c

            echo "===== START LOGCAT ====="
            adb logcat -v threadtime > "$DEBUG_DIR/logcat-full.txt" 2>&1 &
            LOGCAT_PID=$!

            echo "$LOGCAT_PID" > "$DEBUG_DIR/logcat.pid"

            sleep 2

            echo "===== RESET APP ====="
            adb shell am force-stop com.carassistant.v10 || true

            echo "===== LAUNCH V10 ====="
            adb shell monkey \
              -p com.carassistant.v10 \
              -c android.intent.category.LAUNCHER \
              1 || true

            echo "===== WAIT FOR STARTUP ====="
            sleep 10

            echo "===== ACTIVITY STATE ====="
            adb shell dumpsys activity activities \
              > "$DEBUG_DIR/activity.txt" 2>&1 || true

            echo "===== SERVICE STATE ====="
            adb shell dumpsys activity services \
              > "$DEBUG_DIR/services.txt" 2>&1 || true

            echo "===== PROCESS STATE ====="
            adb shell pidof com.carassistant.v10 \
              > "$DEBUG_DIR/pid.txt" 2>&1 || true

            echo "===== PACKAGE STATE ====="
            adb shell dumpsys package com.carassistant.v10 \
              > "$DEBUG_DIR/package.txt" 2>&1 || true

            echo "===== DROPBOX ====="
            adb shell dumpsys dropbox \
              > "$DEBUG_DIR/dropbox.txt" 2>&1 || true

            echo "===== WAIT FOR FINAL LOGS ====="
            sleep 5

            kill "$LOGCAT_PID" 2>/dev/null || true
            wait "$LOGCAT_PID" 2>/dev/null || true

            echo "===== FILTERED V10 CRASH LOG ====="

            grep -E \
              "FATAL EXCEPTION|AndroidRuntime|com\.carassistant\.v10|V10Projection|V10ProjectionService|V10ProjectionSession|V10CarActivity|V10LauncherActivity|SecurityException|DeadObjectException|RemoteException|VirtualDisplay|MediaProjection|ActivityManager" \
              "$DEBUG_DIR/logcat-full.txt" \
              > "$DEBUG_DIR/v10-crash-filter.txt" || true

            cat "$DEBUG_DIR/v10-crash-filter.txt" || true

            echo "===== PID ====="
            cat "$DEBUG_DIR/pid.txt" || true

            echo "===== RUNTIME DEBUG COMPLETE ====="

      - name: Upload V10 runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V10-8B2-runtime-crash-log
          path: runtime-debug/
          if-no-files-found: warn
