name: Build Car Assistant V10 - 8B2 Startup Handshake

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout existing V10 source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify existing V10 source
        shell: bash
        run: |
          set -euo pipefail

          ROOT="v10-source"
          SERVICE="$ROOT/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java"
          SESSION="$ROOT/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
          ACTIVITY="$ROOT/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          MANIFEST="$ROOT/app/src/main/AndroidManifest.xml"

          test -f "$SERVICE"
          test -f "$SESSION"
          test -f "$ACTIVITY"
          test -f "$MANIFEST"

          grep -q 'package com.carassistant.v10;' "$SERVICE"
          grep -q 'package com.carassistant.v10;' "$SESSION"
          grep -q 'package com.carassistant.v10;' "$ACTIVITY"

          echo "Existing V10 source confirmed."

      - name: Patch V10ProjectionService - handshake
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java"

          python3 - "$FILE" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()

          def replace_method(source, signature_regex, new_method, label):
              pattern = re.compile(
                  signature_regex +
                  r'\s*\{.*?\n\s*\}',
                  re.S
              )

              matches = list(pattern.finditer(source))

              if len(matches) != 1:
                  raise SystemExit(
                      f"{label}: expected 1 method, found {len(matches)}"
                  )

              return (
                  source[:matches[0].start()]
                  + new_method
                  + source[matches[0].end():]
              )

          anchor = "    private static volatile V10ProjectionService instance;"

          if "private static final Object START_LOCK" not in text:
              if anchor not in text:
                  raise SystemExit("START_LOCK anchor not found")

              fields = """\
    private static final Object START_LOCK =
            new Object();

    private static ComponentName pendingTarget;

    private static Surface pendingSurface;

    private static int pendingWidth;

    private static int pendingHeight;
"""
              text = text.replace(
                  anchor,
                  anchor + "\n\n" + fields,
                  1
              )

          text = replace_method(
              text,
              r'public\s+static\s+void\s+ensureStarted\s*\(\s*android\.content\.Context\s+context\s*\)',
              """\
    public static void ensureStarted(
            android.content.Context context) {

        if (getInstance() != null) {
            return;
        }

        android.content.Context appContext =
                context.getApplicationContext();

        Intent intent =
                new Intent(
                        appContext,
                        V10ProjectionService.class);

        try {
            if (Build.VERSION.SDK_INT >= 26) {
                appContext.startForegroundService(intent);
            } else {
                appContext.startService(intent);
            }
        } catch (Throwable error) {
            Log.w(
                    TAG,
                    "Unable to start projection service",
                    error);
        }
    }""",
              "ensureStarted"
          )

          text = replace_method(
              text,
              r'public\s+static\s+void\s+setTarget\s*\(\s*android\.content\.Context\s+context\s*,\s*ComponentName\s+component\s*\)',
              """\
    public static void setTarget(
            android.content.Context context,
            ComponentName component) {

        if (component == null) {
            clearTarget();
            return;
        }

        synchronized (START_LOCK) {

            V10ProjectionService service =
                    getInstance();

            if (service == null) {
                pendingTarget = component;
                ensureStarted(context);
                return;
            }

            service.setTargetInternal(component);
        }
    }""",
              "setTarget"
          )

          text = replace_method(
              text,
              r'public\s+static\s+void\s+attachSurface\s*\(\s*android\.content\.Context\s+context\s*,\s*Surface\s+newSurface\s*,\s*int\s+newWidth\s*,\s*int\s+newHeight\s*\)',
              """\
    public static void attachSurface(
            android.content.Context context,
            Surface newSurface,
            int newWidth,
            int newHeight) {

        if (newSurface == null
                || newWidth < 1
                || newHeight < 1) {
            return;
        }

        synchronized (START_LOCK) {

            V10ProjectionService service =
                    getInstance();

            if (service == null) {

                if (pendingSurface != null
                        && pendingSurface != newSurface) {

                    try {
                        pendingSurface.release();
                    } catch (Throwable ignored) {
                    }
                }

                pendingSurface = newSurface;
                pendingWidth = newWidth;
                pendingHeight = newHeight;

                ensureStarted(context);
                return;
            }

            service.attachSurfaceInternal(
                    newSurface,
                    newWidth,
                    newHeight);
        }
    }""",
              "attachSurface"
          )

          text = replace_method(
              text,
              r'public\s+static\s+void\s+detachSurface\s*\(\s*\)',
              """\
    public static void detachSurface() {

        synchronized (START_LOCK) {

            if (pendingSurface != null) {

                try {
                    pendingSurface.release();
                } catch (Throwable ignored) {
                }

                pendingSurface = null;
                pendingWidth = 0;
                pendingHeight = 0;
            }

            V10ProjectionService service =
                    getInstance();

            if (service != null) {
                service.detachSurfaceInternal();
            }
        }
    }""",
              "detachSurface"
          )

          text = replace_method(
              text,
              r'public\s+static\s+void\s+clearTarget\s*\(\s*\)',
              """\
    public static void clearTarget() {

        synchronized (START_LOCK) {

            pendingTarget = null;

            V10ProjectionService service =
                    getInstance();

            if (service != null) {
                service.clearTargetInternal();
            }
        }
    }""",
              "clearTarget"
          )

          flush_method = """\
    private void flushPendingState() {

        synchronized (START_LOCK) {

            if (instance != this || destroyed) {
                return;
            }

            ComponentName nextTarget =
                    pendingTarget;

            Surface nextSurface =
                    pendingSurface;

            int nextWidth =
                    pendingWidth;

            int nextHeight =
                    pendingHeight;

            pendingTarget = null;
            pendingSurface = null;
            pendingWidth = 0;
            pendingHeight = 0;

            try {

                if (nextTarget != null) {
                    setTargetInternal(nextTarget);
                }

                if (nextSurface != null) {
                    attachSurfaceInternal(
                            nextSurface,
                            nextWidth,
                            nextHeight);
                }

            } catch (Throwable error) {

                Log.e(
                        TAG,
                        "Pending projection state failed",
                        error);

                if (nextSurface != null
                        && surface != nextSurface) {

                    try {
                        nextSurface.release();
                    } catch (Throwable ignored) {
                    }
                }
            }
        }
    }

"""

          if "private void flushPendingState()" not in text:
              marker = "    @Override\n    public void onCreate()"
              if marker not in text:
                  raise SystemExit("onCreate marker not found")

              text = text.replace(
                  marker,
                  flush_method + marker,
                  1
              )

          oncreate_pattern = re.compile(
              r'(@Override\s+public\s+void\s+onCreate\s*\(\s*\)\s*\{)'
              r'(.*?)'
              r'(\n\s*\n\s*@Override\s+public\s+int\s+onStartCommand)',
              re.S
          )

          m = oncreate_pattern.search(text)

          if not m:
              raise SystemExit("onCreate block not found")

          body = m.group(2)

          if "flushPendingState();" not in body:
              body = body.rstrip() + """

        flushPendingState();
"""
              text = (
                  text[:m.start(2)]
                  + body
                  + text[m.end(2):]
              )

          path.write_text(text)

          print("V10ProjectionService patched surgically.")
          PY

      - name: Patch V10ProjectionSession - remove eager service start
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          python3 - "$FILE" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()

          pattern = re.compile(
              r'public\s+V10ProjectionSession\s*\(\s*Context\s+context\s*\)'
              r'\s*\{.*?\n\s*\}',
              re.S
          )

          matches = list(pattern.finditer(text))

          if len(matches) != 1:
              raise SystemExit(
                  "Expected exactly one V10ProjectionSession constructor"
              )

          new_constructor = """\
public V10ProjectionSession(
            Context context) {

        this.context =
                context.getApplicationContext();
    }"""

          text = (
              text[:matches[0].start()]
              + new_constructor
              + text[matches[0].end():]
          )

          if "V10ProjectionService.ensureStarted" in text:
              raise SystemExit(
                  "Eager V10ProjectionService.ensureStarted still exists"
              )

          path.write_text(text)

          print("V10ProjectionSession patched.")
          PY

      - name: Verify source patch
        shell: bash
        run: |
          set -euo pipefail

          SERVICE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java"
          SESSION="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          grep -q "START_LOCK" "$SERVICE"
          grep -q "pendingTarget" "$SERVICE"
          grep -q "pendingSurface" "$SERVICE"
          grep -q "flushPendingState" "$SERVICE"

          grep -q "startForegroundService" "$SERVICE"

          if grep -nE '(^|[[:space:];&|])(/system/bin/)?am[[:space:]]+force-stop([[:space:]]|$)' "$SERVICE"; then
            echo "ERROR: actual force-stop command detected"
            exit 1
          fi

          if grep -q "V10ProjectionService.ensureStarted" "$SESSION"; then
            echo "ERROR: Session still eagerly starts service"
            exit 1
          fi

          grep -q 'package com.carassistant.v10;' "$SERVICE"
          grep -q 'package com.carassistant.v10;' "$SESSION"

          echo "Handshake patch verified."

      - name: Verify existing V10 components
        shell: bash
        run: |
          set -euo pipefail

          ROOT="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$ROOT/V10CarActivity.java"
          test -f "$ROOT/V10SessionStore.java"
          test -f "$ROOT/V10InputController.java"
          test -f "$ROOT/RootShellSession.java"
          test -f "$ROOT/CarSystemUI.java"
          test -f "$ROOT/CarRecents.java"

          grep -q "MAX_RECENTS = 4" \
            "$ROOT/V10SessionStore.java"

          echo "Existing V10 architecture preserved."

      - name: Check patch diff
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          echo "Changed V10 source files:"
          git diff --name-only

          echo "V10ProjectionService diff:"
          git diff -- \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java

          echo "V10ProjectionSession diff:"
          git diff -- \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java

      - name: Make Gradle executable
        shell: bash
        run: |
          set -euo pipefail
          chmod +x v10-source/gradlew

      - name: Compile V10 Java
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew compileDebugJavaWithJavac --no-daemon --stacktrace

      - name: Build V10 APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK:"
          ls -lh "$APK"

          echo "SHA256:"
          sha256sum "$APK"

      - name: Upload V10 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-8B2-StartupHandshake
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
