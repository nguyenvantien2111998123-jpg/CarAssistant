name: Build Car Assistant V10.1.3 - Clean Manifest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail

          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle-8.13-bin.zip -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"

      # ============================================================
      # CREATE CLEAN V10 SOURCE FROM PROVEN V9 ENGINE
      # ============================================================

      - name: Create clean V10 source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf v10-source

          cp -R v9-source/android-project/v9-source v10-source

          find v10-source -type f -name '*.java' -print0 | xargs -0 sed -i \
            -e 's/com\.carassistant\.v9/com.carassistant.v10/g' \
            -e 's/Car Assistant V9/Car Assistant V10/g' \
            -e 's/AACast V9/AACast V10/g'

          find v10-source -type f -name '*.xml' -print0 | xargs -0 sed -i \
            -e 's/com\.carassistant\.v9/com.carassistant.v10/g' \
            -e 's/Car Assistant V9/Car Assistant V10/g' \
            -e 's/AACast V9/AACast V10/g'

          find v10-source -type f -name '*.gradle' -print0 | xargs -0 sed -i \
            -e 's/com\.carassistant\.v9/com.carassistant.v10/g'

      # ============================================================
      # REMOVE OLD V9 / PREVIOUS V10 ACTIVITIES
      # ============================================================

      - name: Remove old V9 and V10 activity files
        shell: bash
        run: |
          set -euo pipefail

          find v10-source/app/src/main/java \
            -type f \
            \( \
              -name 'MainActivity.java' \
              -o -name 'AACastCarActivity.java' \
              -o -name 'LeaseTicker.java' \
              -o -name 'V10LauncherActivity.java' \
              -o -name 'V10CarActivity.java' \
              -o -name 'V10ProjectionSession.java' \
              -o -name 'V10InputController.java' \
              -o -name 'V10Display.java' \
              -o -name 'V10SessionStore.java' \
            \) \
            -delete

      # ============================================================
      # V10 SESSION STORE
      # ============================================================

      - name: Write V10SessionStore
        shell: bash
        run: |
          set -euo pipefail

          cat > v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java <<'EOF'
          package com.carassistant.v10;

          import android.content.ComponentName;
          import android.content.Context;
          import android.content.SharedPreferences;

          public final class V10SessionStore {

              private static final String PREFS = "v10_session";
              private static final String TARGET = "target_component";

              private V10SessionStore() {}

              private static SharedPreferences prefs(Context context) {
                  return context.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
              }

              public static void setTarget(Context context, ComponentName component) {
                  SharedPreferences.Editor editor = prefs(context).edit();

                  if (component == null) {
                      editor.remove(TARGET);
                  } else {
                      editor.putString(TARGET, component.flattenToString());
                  }

                  editor.apply();
              }

              public static ComponentName getTarget(Context context) {
                  String value = prefs(context).getString(TARGET, null);

                  if (value == null || value.isEmpty()) {
                      return null;
                  }

                  return ComponentName.unflattenFromString(value);
              }

              public static void clearTarget(Context context) {
                  prefs(context).edit().remove(TARGET).apply();
              }
          }
          EOF

      # ============================================================
      # V10 PHONE LAUNCHER
      # ============================================================

      - name: Write V10LauncherActivity
        shell: bash
        run: |
          set -euo pipefail

          cat > v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java <<'EOF'
          package com.carassistant.v10;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ResolveInfo;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;

          public final class V10LauncherActivity extends Activity {

              private LinearLayout list;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  buildUi();
                  loadApps();
              }

              private void buildUi() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(32, 32, 32, 32);
                  root.setBackgroundColor(Color.BLACK);

                  TextView title = new TextView(this);
                  title.setText("Car Assistant V10");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(26);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0, 0, 0, 24);

                  root.addView(title,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT));

                  Button refresh = new Button(this);
                  refresh.setText("Refresh");
                  refresh.setOnClickListener(v -> loadApps());

                  root.addView(refresh,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT));

                  ScrollView scroll = new ScrollView(this);

                  list = new LinearLayout(this);
                  list.setOrientation(LinearLayout.VERTICAL);
                  list.setPadding(0, 24, 0, 0);

                  scroll.addView(list);

                  root.addView(scroll,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  0,
                                  1f));

                  setContentView(root);
              }

              private void loadApps() {
                  if (list == null) {
                      return;
                  }

                  list.removeAllViews();

                  TextView status = new TextView(this);
                  status.setText("Choose an app for Android Auto");
                  status.setTextColor(Color.LTGRAY);
                  status.setTextSize(16);
                  status.setPadding(0, 0, 0, 20);

                  list.addView(status);

                  Intent intent = new Intent(Intent.ACTION_MAIN);
                  intent.addCategory(Intent.CATEGORY_LAUNCHER);

                  List<ResolveInfo> apps =
                          getPackageManager().queryIntentActivities(intent, 0);

                  List<ResolveInfo> filtered = new ArrayList<>();

                  for (ResolveInfo info : apps) {
                      if (info.activityInfo == null) {
                          continue;
                      }

                      if (getPackageName().equals(
                              info.activityInfo.packageName)) {
                          continue;
                      }

                      filtered.add(info);
                  }

                  Collections.sort(filtered, new Comparator<ResolveInfo>() {
                      @Override
                      public int compare(ResolveInfo a, ResolveInfo b) {
                          String la = String.valueOf(
                                  a.loadLabel(getPackageManager()));

                          String lb = String.valueOf(
                                  b.loadLabel(getPackageManager()));

                          return la.compareToIgnoreCase(lb);
                      }
                  });

                  for (ResolveInfo info : filtered) {
                      ComponentName component = new ComponentName(
                              info.activityInfo.packageName,
                              info.activityInfo.name);

                      Button button = new Button(this);

                      button.setText(
                              String.valueOf(
                                      info.loadLabel(getPackageManager())));

                      button.setOnClickListener(v -> {
                          V10SessionStore.setTarget(
                                  V10LauncherActivity.this,
                                  component);

                          status.setText(
                                  "Selected: "
                                          + component.flattenToShortString());
                      });

                      list.addView(
                              button,
                              new LinearLayout.LayoutParams(
                                      ViewGroup.LayoutParams.MATCH_PARENT,
                                      ViewGroup.LayoutParams.WRAP_CONTENT));
                  }
              }
          }
          EOF

      # ============================================================
      # V10 DISPLAY
      # ============================================================

      - name: Write V10Display
        shell: bash
        run: |
          set -euo pipefail

          cat > v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10Display.java <<'EOF'
          package com.carassistant.v10;

          import android.view.Display;

          public final class V10Display {

              public static final String PACKAGE =
                      "com.carassistant.v10";

              public static final String PREFIX =
                      "Car Assistant V10 ";

              private V10Display() {}

              public static String nameFor(int index) {
                  return PREFIX + (index + 1);
              }

              public static boolean matches(
                      String ownerPackage,
                      String name,
                      int type,
                      int ownerUid) {

                  if (!PACKAGE.equals(ownerPackage)
                          || type != Display.TYPE_VIRTUAL
                          || ownerUid < 10000) {
                      return false;
                  }

                  return (PREFIX + "1").equals(name);
              }
          }
          EOF

      # ============================================================
      # V10 PROJECTION SESSION
      # ============================================================

      - name: Write V10ProjectionSession
        shell: bash
        run: |
          set -euo pipefail

          cat > v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java <<'EOF'
          package com.carassistant.v10;

          import android.content.ComponentName;
          import android.content.Context;
          import android.hardware.display.DisplayManager;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.Process;
          import android.util.Log;
          import android.view.MotionEvent;
          import android.view.Surface;
          import android.view.SurfaceTexture;
          import android.view.TextureView;
          import android.view.Display;

          public final class V10ProjectionSession
                  implements TextureView.SurfaceTextureListener {

              private static final String TAG =
                      "CarAssistantV10Projection";

              private final Context context;
              private final RootShellSession rootShell =
                      new RootShellSession();

              private TextureView textureView;
              private ComponentName target;

              private Display display;
              private android.hardware.display.VirtualDisplay virtualDisplay;
              private Surface surface;

              private boolean destroyed;

              public V10ProjectionSession(Context context) {
                  this.context = context.getApplicationContext();
              }

              public void attachTextureView(TextureView view) {
                  textureView = view;

                  view.setSurfaceTextureListener(this);

                  if (view.isAvailable()) {
                      ensureDisplay();
                  }
              }

              public void setTarget(ComponentName component) {
                  if (component == null) {
                      target = null;
                      release();
                      return;
                  }

                  boolean changed = !component.equals(target);

                  target = component;

                  if (changed && virtualDisplay != null) {
                      releaseDisplayOnly();
                  }

                  ensureDisplay();
              }

              public boolean isActive() {
                  return !destroyed
                          && target != null
                          && virtualDisplay != null
                          && display != null;
              }

              private void ensureDisplay() {
                  if (destroyed
                          || target == null
                          || textureView == null
                          || !textureView.isAvailable()
                          || virtualDisplay != null) {
                      return;
                  }

                  SurfaceTexture st =
                          textureView.getSurfaceTexture();

                  if (st == null) {
                      return;
                  }

                  int width = textureView.getWidth();
                  int height = textureView.getHeight();

                  if (width < 1 || height < 1) {
                      return;
                  }

                  try {
                      st.setDefaultBufferSize(width, height);

                      Surface newSurface = new Surface(st);

                      VirtualDisplayHolder holder =
                              createVirtualDisplay(
                                      newSurface,
                                      width,
                                      height);

                      if (holder.display == null) {
                          newSurface.release();
                          throw new IllegalStateException(
                                  "Cannot create virtual display");
                      }

                      surface = newSurface;
                      virtualDisplay = holder.virtualDisplay;
                      display = holder.display;

                      launchTarget();

                  } catch (RuntimeException e) {
                      release();
                      Log.w(TAG,
                              "Display creation failed",
                              e);
                  }
              }

              private VirtualDisplayHolder createVirtualDisplay(
                      Surface newSurface,
                      int width,
                      int height) {

                  DisplayManager manager =
                          (DisplayManager) context.getSystemService(
                                  Context.DISPLAY_SERVICE);

                  if (manager == null) {
                      throw new IllegalStateException(
                              "DisplayManager unavailable");
                  }

                  android.hardware.display.VirtualDisplay vd =
                          manager.createVirtualDisplay(
                                  V10Display.nameFor(0),
                                  width,
                                  height,
                                  160,
                                  newSurface,
                                  10);

                  if (vd == null) {
                      throw new IllegalStateException(
                              "VirtualDisplay is null");
                  }

                  Display d = vd.getDisplay();

                  return new VirtualDisplayHolder(vd, d);
              }

              private void launchTarget() {
                  if (display == null || target == null) {
                      return;
                  }

                  final int displayId =
                          display.getDisplayId();

                  final int userId =
                          Process.myUid() / 100000;

                  final String packageName =
                          target.getPackageName()
                                  .replace("'", "'\"'\"'");

                  final String flat =
                          target.flattenToString()
                                  .replace("'", "'\"'\"'");

                  final String command =
                          "/system/bin/am force-stop '"
                                  + packageName
                                  + "'; "
                                  + "/system/bin/am start"
                                  + " --user "
                                  + userId
                                  + " --display "
                                  + displayId
                                  + " --windowingMode 1"
                                  + " -a android.intent.action.MAIN"
                                  + " -c android.intent.category.LAUNCHER"
                                  + " -f 0x18000000"
                                  + " -n '"
                                  + flat
                                  + "'";

                  RootShellSession.EXEC.execute(() -> {
                      try {
                          rootShell.run(10, command);
                      } catch (Throwable t) {
                          Log.w(TAG,
                                  "Launch failed",
                                  t);
                      }
                  });
              }

              public void tap(float x, float y) {
                  if (!isActive()) {
                      return;
                  }

                  final int displayId =
                          display.getDisplayId();

                  final int ix = Math.max(0, Math.round(x));
                  final int iy = Math.max(0, Math.round(y));

                  final String command =
                          "/system/bin/input -d "
                                  + displayId
                                  + " tap "
                                  + ix
                                  + " "
                                  + iy;

                  RootShellSession.EXEC.execute(() -> {
                      try {
                          rootShell.run(5, command);
                      } catch (Throwable t) {
                          Log.w(TAG,
                                  "Tap failed",
                                  t);
                      }
                  });
              }

              public void back() {
                  if (!isActive()) {
                      return;
                  }

                  final int displayId =
                          display.getDisplayId();

                  final String command =
                          "/system/bin/input -d "
                                  + displayId
                                  + " keyevent 4";

                  RootShellSession.EXEC.execute(() -> {
                      try {
                          rootShell.run(5, command);
                      } catch (Throwable t) {
                          Log.w(TAG,
                                  "Back failed",
                                  t);
                      }
                  });
              }

              private void releaseDisplayOnly() {
                  if (virtualDisplay != null) {
                      try {
                          virtualDisplay.release();
                      } catch (Throwable ignored) {
                      }
                  }

                  virtualDisplay = null;
                  display = null;

                  if (surface != null) {
                      try {
                          surface.release();
                      } catch (Throwable ignored) {
                      }
                  }

                  surface = null;
              }

              public void release() {
                  releaseDisplayOnly();
              }

              public void destroy() {
                  if (destroyed) {
                      return;
                  }

                  destroyed = true;

                  release();

                  rootShell.destroy();
              }

              @Override
              public void onSurfaceTextureAvailable(
                      SurfaceTexture surface,
                      int width,
                      int height) {

                  ensureDisplay();
              }

              @Override
              public void onSurfaceTextureSizeChanged(
                      SurfaceTexture surface,
                      int width,
                      int height) {
              }

              @Override
              public boolean onSurfaceTextureDestroyed(
                      SurfaceTexture surface) {

                  releaseDisplayOnly();
                  return true;
              }

              @Override
              public void onSurfaceTextureUpdated(
                      SurfaceTexture surface) {
              }

              private static final class VirtualDisplayHolder {

                  final android.hardware.display.VirtualDisplay
                          virtualDisplay;

                  final Display display;

                  VirtualDisplayHolder(
                          android.hardware.display.VirtualDisplay vd,
                          Display display) {

                      this.virtualDisplay = vd;
                      this.display = display;
                  }
              }
          }
          EOF

      # ============================================================
      # V10 CAR ACTIVITY
      # ============================================================

      - name: Write V10CarActivity
        shell: bash
        run: |
          set -euo pipefail

          cat > v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java <<'EOF'
          package com.carassistant.v10;

          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.MotionEvent;
          import android.view.TextureView;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import android.graphics.Color;
          import android.view.Gravity;

          import com.google.android.apps.auto.sdk.CarActivity;

          public final class V10CarActivity extends CarActivity {

              private final Handler handler =
                      new Handler(Looper.getMainLooper());

              private TextureView textureView;
              private V10ProjectionSession session;
              private TextView status;

              private boolean resumed;

              private final Runnable targetPoller =
                      new Runnable() {
                          @Override
                          public void run() {

                              if (!resumed || session == null) {
                                  return;
                              }

                              android.content.ComponentName target =
                                      V10SessionStore.getTarget(
                                              V10CarActivity.this);

                              if (target != null) {
                                  session.setTarget(target);

                                  if (session.isActive()) {
                                      status.setText(
                                              "Car Assistant V10");
                                  } else {
                                      status.setText(
                                              "Starting "
                                                      + target
                                                      .flattenToShortString());
                                  }
                              }

                              handler.postDelayed(
                                      this,
                                      500);
                          }
                      };

              private void applyChrome() {
                  try {
                      getCarUiController()
                              .getStatusBarController()
                              .hideAppHeader();

                      getCarUiController()
                              .getMenuController()
                              .hideMenuButton();
                  } catch (RuntimeException ignored) {
                  }
              }

              @Override
              public void onCreate(Bundle state) {
                  setTheme(R.style.Theme_AACast);

                  super.onCreate(state);

                  setIgnoreConfigChanges(-1);

                  applyChrome();
              }

              @Override
              public void onResume() {
                  super.onResume();

                  resumed = true;

                  applyChrome();

                  if (textureView == null) {

                      FrameLayout root =
                              new FrameLayout(this);

                      root.setBackgroundColor(
                              Color.BLACK);

                      textureView =
                              new TextureView(this);

                      root.addView(
                              textureView,
                              new FrameLayout.LayoutParams(
                                      FrameLayout.LayoutParams.MATCH_PARENT,
                                      FrameLayout.LayoutParams.MATCH_PARENT));

                      status =
                              new TextView(this);

                      status.setText(
                              "Car Assistant V10");

                      status.setTextColor(
                              Color.WHITE);

                      status.setTextSize(16);

                      status.setGravity(
                              Gravity.CENTER);

                      status.setBackgroundColor(
                              0x66000000);

                      FrameLayout.LayoutParams statusParams =
                              new FrameLayout.LayoutParams(
                                      FrameLayout.LayoutParams.WRAP_CONTENT,
                                      FrameLayout.LayoutParams.WRAP_CONTENT);

                      statusParams.gravity =
                              Gravity.CENTER;

                      root.addView(
                              status,
                              statusParams);

                      session =
                              new V10ProjectionSession(this);

                      session.attachTextureView(
                              textureView);

                      textureView.setOnTouchListener(
                              (v, event) -> {

                                  if (event.getAction()
                                          == MotionEvent.ACTION_UP) {

                                      session.tap(
                                              event.getX(),
                                              event.getY());
                                  }

                                  return true;
                              });

                      setContentView(root);
                  }

                  handler.removeCallbacks(
                          targetPoller);

                  handler.post(targetPoller);
              }

              @Override
              public void onPause() {
                  resumed = false;

                  handler.removeCallbacks(
                          targetPoller);

                  super.onPause();
              }

              @Override
              public void onBackPressed() {

                  if (session != null
                          && session.isActive()) {

                      session.back();
                      return;
                  }

                  super.onBackPressed();
              }

              @Override
              public void onStop() {

                  resumed = false;

                  handler.removeCallbacks(
                          targetPoller);

                  if (session != null) {
                      session.release();
                  }

                  super.onStop();
              }

              @Override
              public void onDestroy() {

                  resumed = false;

                  handler.removeCallbacks(
                          targetPoller);

                  if (session != null) {
                      session.destroy();
                      session = null;
                  }

                  textureView = null;

                  super.onDestroy();
              }

              @Override
              public void onWindowFocusChanged(
                      boolean hasFocus,
                      boolean touchMode) {

                  super.onWindowFocusChanged(
                          hasFocus,
                          touchMode);

                  if (hasFocus) {
                      applyChrome();
                  }
              }
          }
          EOF

      # ============================================================
      # ADAPT PROVEN V9 XPOSED INPUT HOOK
      # ============================================================

      - name: Adapt V9 InputHooks
        shell: bash
        run: |
          set -euo pipefail

          HOOK="v10-source/app/src/main/java/com/hieptran/aacast/doudou/hook/InputHooks.java"

          test -f "$HOOK"

          sed -i \
            -e 's/AACastDisplay/V10Display/g' \
            -e 's/\[AACast Input\]/[V10 Input]/g' \
            "$HOOK"

          grep -q 'V10Display.matches' "$HOOK"

      # ============================================================
      # CAR SERVICE
      # ============================================================

      - name: Write AACastCarService
        shell: bash
        run: |
          set -euo pipefail

          cat > v10-source/app/src/main/java/com/hieptran/aacast/doudou/AACastCarService.java <<'EOF'
          package com.carassistant.v10;

          import com.google.android.apps.auto.sdk.CarActivity;
          import com.google.android.apps.auto.sdk.CarActivityService;

          public final class AACastCarService
                  extends CarActivityService {

              @Override
              public Class<? extends CarActivity> getCarActivity() {
                  return V10CarActivity.class;
              }
          }
          EOF

      # ============================================================
      # REBUILD MANIFEST
      # ============================================================

      - name: Rebuild Manifest safely
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          sed -i \
            -e 's/com\.carassistant\.v9/com.carassistant.v10/g' \
            -e 's/Car Assistant V9/Car Assistant V10/g' \
            -e 's/AACast V9/AACast V10/g' \
            "$MANIFEST"

          python3 - "$MANIFEST" <<'PY'
          import re
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          names = [
              "MainActivity",
              "AACastCarActivity",
              "V10LauncherActivity",
              "V10CarActivity",
          ]

          for name in names:
              text = re.sub(
                  r'\s*<activity\b[^>]*android:name="[^"]*'
                  + re.escape(name)
                  + r'"[^>]*(?:/>|>.*?</activity>)',
                  '',
                  text,
                  flags=re.S,
              )

          application_match = re.search(
              r'(<application\b[^>]*>)',
              text,
              flags=re.S,
          )

          if not application_match:
              raise SystemExit(
                  "ERROR: <application> not found"
              )

          activities = r'''
                  <activity
                      android:name="com.carassistant.v10.V10LauncherActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name="com.carassistant.v10.V10CarActivity"
                      android:exported="true" />
          '''

          pos = application_match.end()

          text = text[:pos] + activities + text[pos:]

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

      # ============================================================
      # VERIFY MANIFEST
      # ============================================================

      - name: Verify Manifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          grep -q \
            'com.carassistant.v10.V10LauncherActivity' \
            "$MANIFEST"

          grep -q \
            'com.carassistant.v10.V10CarActivity' \
            "$MANIFEST"

          if grep -q \
              'android:name="[^"]*MainActivity' \
              "$MANIFEST"; then
              echo "ERROR: MainActivity remains in manifest"
              exit 1
          fi

          if grep -q \
              'android:name="[^"]*AACastCarActivity' \
              "$MANIFEST"; then
              echo "ERROR: AACastCarActivity remains in manifest"
              exit 1
          fi

          test "$(grep -c \
            'com.carassistant.v10.V10LauncherActivity' \
            "$MANIFEST")" -eq 1

          test "$(grep -c \
            'com.carassistant.v10.V10CarActivity' \
            "$MANIFEST")" -eq 1

      # ============================================================
      # VERIFY SOURCE
      # ============================================================

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail

          JAVA="v10-source/app/src/main/java"
          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          test "$(find "$JAVA" \
            -name 'V10LauncherActivity.java' | wc -l)" -eq 1

          test "$(find "$JAVA" \
            -name 'V10CarActivity.java' | wc -l)" -eq 1

          test "$(find "$JAVA" \
            -name 'V10ProjectionSession.java' | wc -l)" -eq 1

          test "$(find "$JAVA" \
            -name 'V10Display.java' | wc -l)" -eq 1

          test "$(find "$JAVA" \
            -name 'V10SessionStore.java' | wc -l)" -eq 1

          if grep -R \
              'com.carassistant.v9' \
              "$JAVA" \
              "$MANIFEST" 2>/dev/null; then
              echo "ERROR: V9 package remains"
              exit 1
          fi

          OLD_FILES="$(find "$JAVA" \
            -type f \
            \( \
              -name 'MainActivity.java' \
              -o -name 'AACastCarActivity.java' \
            \))"

          if [ -n "$OLD_FILES" ]; then
              echo "ERROR: Old V9 activity source remains:"
              echo "$OLD_FILES"
              exit 1
          fi

      # ============================================================
      # VERIFY PROVEN V9 PROJECTION INVARIANTS
      # ============================================================

      - name: Verify V9 projection invariants
        shell: bash
        run: |
          set -euo pipefail

          SESSION="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
          HOOK="v10-source/app/src/main/java/com/hieptran/aacast/doudou/hook/InputHooks.java"

          grep -q 'setDefaultBufferSize' "$SESSION"

          grep -q 'new Surface(st)' "$SESSION"

          grep -q 'createVirtualDisplay' "$SESSION"

          grep -q 'V10Display.nameFor(0)' "$SESSION"

          grep -q '160' "$SESSION"

          grep -q '10);' "$SESSION"

          grep -q 'Process.myUid() / 100000' "$SESSION"

          grep -q -- '--display' "$SESSION"

          grep -q -- '--windowingMode 1' "$SESSION"

          grep -q 'input -d' "$SESSION"

          grep -q 'keyevent 4' "$SESSION"

          grep -q 'V10Display.matches' "$HOOK"

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd v10-source

          gradle --version

          gradle assembleDebug --no-daemon --stacktrace

      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          ls -lh "$APK"

          sha256sum "$APK"

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload V10.1.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10.1.3-debug
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ============================================================
      # COMMIT SOURCE
      # ============================================================

      - name: Commit V10.1.3
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add v10-source

          if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
          fi

          git commit \
            -m "Build Car Assistant V10.1.3 clean architecture"

          git push
