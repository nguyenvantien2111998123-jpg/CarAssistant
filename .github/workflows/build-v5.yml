name: Build Car Assistant V5 Search

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare V5 source
        run: |
          rm -rf v5-source
          cp -R v3-source v5-source

          sed -i 's/versionCode = 1/versionCode = 50/' \
            v5-source/app/build.gradle.kts

          sed -i 's/versionName = "1.0"/versionName = "5.0"/' \
            v5-source/app/build.gradle.kts

      - name: Create V5 Search CarMediaService
        run: |
          cat > v5-source/app/src/main/java/com/carassistant/service/CarMediaService.kt <<'EOF'
          package com.carassistant.service

          import android.net.Uri
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MediaMetadata
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.session.LibraryResult
          import androidx.media3.session.MediaLibraryService
          import androidx.media3.session.MediaSession
          import com.google.common.collect.ImmutableList
          import com.google.common.util.concurrent.Futures

          class CarMediaService : MediaLibraryService() {

              private var player: ExoPlayer? = null
              private var session: MediaLibraryService.MediaLibrarySession? = null

              override fun onCreate() {
                  super.onCreate()

                  player = ExoPlayer.Builder(this).build()

                  session = MediaLibraryService.MediaLibrarySession.Builder(
                      this,
                      player!!,
                      LibraryCallback()
                  )
                      .setId("CarAssistantSession")
                      .build()
              }

              override fun onGetSession(
                  controllerInfo: MediaSession.ControllerInfo
              ): MediaLibraryService.MediaLibrarySession? = session

              override fun onDestroy() {
                  session?.release()
                  player?.release()

                  session = null
                  player = null

                  super.onDestroy()
              }

              private class LibraryCallback :
                  MediaLibraryService.MediaLibrarySession.Callback {

                  private fun allItems(): List<MediaItem> =
                      listOf(
                          audioItem(
                              "internet-audio-1",
                              "Internet Audio 1",
                              "SoundHelix Song 1",
                              "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
                          ),
                          audioItem(
                              "internet-audio-2",
                              "Internet Audio 2",
                              "SoundHelix Song 2",
                              "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
                          ),
                          audioItem(
                              "internet-audio-3",
                              "Internet Audio 3",
                              "SoundHelix Song 3",
                              "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
                          )
                      )

                  override fun onGetLibraryRoot(
                      session: MediaLibraryService.MediaLibrarySession,
                      browser: MediaSession.ControllerInfo,
                      params: MediaLibraryService.LibraryParams?
                  ) =
                      Futures.immediateFuture(
                          LibraryResult.ofItem(
                              MediaItem.Builder()
                                  .setMediaId("root")
                                  .setMediaMetadata(
                                      MediaMetadata.Builder()
                                          .setTitle("Car Assistant")
                                          .setIsBrowsable(true)
                                          .setIsPlayable(false)
                                          .build()
                                  )
                                  .build(),
                              params
                          )
                      )

                  override fun onGetChildren(
                      session: MediaLibraryService.MediaLibrarySession,
                      browser: MediaSession.ControllerInfo,
                      parentId: String,
                      page: Int,
                      pageSize: Int,
                      params: MediaLibraryService.LibraryParams?
                  ) =
                      Futures.immediateFuture(
                          LibraryResult.ofItemList(
                              if (parentId == "root") {
                                  ImmutableList.copyOf(allItems())
                              } else {
                                  ImmutableList.of()
                              },
                              params
                          )
                      )

                  override fun onSearch(
                      session: MediaLibraryService.MediaLibrarySession,
                      browser: MediaSession.ControllerInfo,
                      query: String,
                      params: MediaLibraryService.LibraryParams?
                  ) =
                      Futures.immediateFuture(
                          LibraryResult.ofVoid()
                      ).also {
                          val count = searchItems(query).size

                          session.notifySearchResultChanged(
                              browser,
                              query,
                              count,
                              params
                          )
                      }

                  override fun onGetSearchResult(
                      session: MediaLibraryService.MediaLibrarySession,
                      browser: MediaSession.ControllerInfo,
                      query: String,
                      page: Int,
                      pageSize: Int,
                      params: MediaLibraryService.LibraryParams?
                  ) =
                      Futures.immediateFuture(
                          LibraryResult.ofItemList(
                              ImmutableList.copyOf(
                                  searchItems(query)
                              ),
                              params
                          )
                      )

                  override fun onAddMediaItems(
                      mediaSession: MediaSession,
                      controller: MediaSession.ControllerInfo,
                      mediaItems: List<MediaItem>
                  ) =
                      Futures.immediateFuture(
                          mediaItems.map { requested ->
                              allItems().find {
                                  it.mediaId == requested.mediaId
                              } ?: requested
                          }
                      )

                  private fun searchItems(query: String): List<MediaItem> {
                      val q = query.trim()

                      if (q.isEmpty()) {
                          return allItems()
                      }

                      return allItems().filter { item ->
                          val title =
                              item.mediaMetadata.title?.toString() ?: ""

                          val artist =
                              item.mediaMetadata.artist?.toString() ?: ""

                          title.contains(q, ignoreCase = true) ||
                              artist.contains(q, ignoreCase = true) ||
                              item.mediaId.contains(q, ignoreCase = true)
                      }
                  }

                  private fun audioItem(
                      id: String,
                      title: String,
                      artist: String,
                      url: String
                  ): MediaItem =
                      MediaItem.Builder()
                          .setMediaId(id)
                          .setUri(Uri.parse(url))
                          .setMediaMetadata(
                              MediaMetadata.Builder()
                                  .setTitle(title)
                                  .setArtist(artist)
                                  .setIsBrowsable(false)
                                  .setIsPlayable(true)
                                  .build()
                          )
                          .build()
              }
          }
          EOF

      - name: Verify V5 source
        run: |
          echo "===== VERSION ====="
          grep -n "versionCode\|versionName" \
            v5-source/app/build.gradle.kts

          echo "===== SEARCH CALLBACK ====="
          grep -n "onSearch\|onGetSearchResult" \
            v5-source/app/src/main/java/com/carassistant/service/CarMediaService.kt

          echo "===== AUDIO URLS ====="
          grep -n "SoundHelix-Song-" \
            v5-source/app/src/main/java/com/carassistant/service/CarMediaService.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: v5-source
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: car-assistant-v5-search-apk
          path: v5-source/app/build/outputs/apk/debug/app-debug.apk
