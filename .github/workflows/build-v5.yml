name: Build Car Assistant V5.2 Optimized Search

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare V5.2 source
        run: |
          rm -rf v5-2-source
          cp -R v3-source v5-2-source

          sed -i 's/versionCode = 1/versionCode = 52/' \
            v5-2-source/app/build.gradle.kts

          sed -i 's/versionName = "1.0"/versionName = "5.2"/' \
            v5-2-source/app/build.gradle.kts

      - name: Create V5.2 optimized Search service
        run: |
          cat > v5-2-source/app/src/main/java/com/carassistant/service/CarMediaService.kt <<'EOF'
          package com.carassistant.service

          import android.net.Uri
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MediaMetadata
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.session.LibraryResult
          import androidx.media3.session.MediaLibraryService
          import androidx.media3.session.MediaSession
          import com.google.common.collect.ImmutableList
          import com.google.common.util.concurrent.Futures
          import com.google.common.util.concurrent.ListenableFuture
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import java.util.concurrent.ConcurrentHashMap
          import java.util.concurrent.Executors

          class CarMediaService : MediaLibraryService() {

              private var player: ExoPlayer? = null
              private var session:
                  MediaLibraryService.MediaLibrarySession? = null

              override fun onCreate() {
                  super.onCreate()

                  player = ExoPlayer.Builder(this).build()

                  session =
                      MediaLibraryService.MediaLibrarySession.Builder(
                          this,
                          player!!,
                          LibraryCallback()
                      )
                          .setId("CarAssistantSession")
                          .build()
              }

              override fun onGetSession(
                  controllerInfo: MediaSession.ControllerInfo
              ): MediaLibraryService.MediaLibrarySession? = session

              override fun onDestroy() {
                  session?.release()
                  player?.release()

                  session = null
                  player = null

                  super.onDestroy()
              }

              private class LibraryCallback :
                  MediaLibraryService.MediaLibrarySession.Callback {

                  private val searchCache =
                      ConcurrentHashMap<String, List<MediaItem>>()

                  private val executor =
                      Executors.newFixedThreadPool(6)

                  override fun onGetLibraryRoot(
                      session: MediaLibraryService.MediaLibrarySession,
                      browser: MediaSession.ControllerInfo,
                      params: MediaLibraryService.LibraryParams?
                  ) =
                      Futures.immediateFuture(
                          LibraryResult.ofItem(
                              MediaItem.Builder()
                                  .setMediaId("root")
                                  .setMediaMetadata(
                                      MediaMetadata.Builder()
                                          .setTitle("Car Assistant")
                                          .setIsBrowsable(true)
                                          .setIsPlayable(false)
                                          .build()
                                  )
                                  .build(),
                              params
                          )
                      )

                  override fun onGetChildren(
                      session: MediaLibraryService.MediaLibrarySession,
                      browser: MediaSession.ControllerInfo,
                      parentId: String,
                      page: Int,
                      pageSize: Int,
                      params: MediaLibraryService.LibraryParams?
                  ) =
                      Futures.immediateFuture(
                          LibraryResult.ofItemList(
                              ImmutableList.of(),
                              params
                          )
                      )

                  override fun onSearch(
                      session: MediaLibraryService.MediaLibrarySession,
                      browser: MediaSession.ControllerInfo,
                      query: String,
                      params: MediaLibraryService.LibraryParams?
                  ): ListenableFuture<LibraryResult<Void>> {

                      val cleanQuery = query.trim()

                      if (cleanQuery.isEmpty()) {
                          searchCache[cleanQuery] = emptyList()

                          session.notifySearchResultChanged(
                              browser,
                              query,
                              0,
                              params
                          )

                          return Futures.immediateFuture(
                              LibraryResult.ofVoid()
                          )
                      }

                      val cached = searchCache[cleanQuery]

                      if (cached != null) {
                          session.notifySearchResultChanged(
                              browser,
                              query,
                              cached.size,
                              params
                          )

                          return Futures.immediateFuture(
                              LibraryResult.ofVoid()
                          )
                      }

                      executor.execute {
                          val results =
                              try {
                                  searchInternet(cleanQuery)
                              } catch (_: Exception) {
                                  emptyList()
                              }

                          searchCache[cleanQuery] = results

                          session.notifySearchResultChanged(
                              browser,
                              query,
                              results.size,
                              params
                          )
                      }

                      return Futures.immediateFuture(
                          LibraryResult.ofVoid()
                      )
                  }

                  override fun onGetSearchResult(
                      session: MediaLibraryService.MediaLibrarySession,
                      browser: MediaSession.ControllerInfo,
                      query: String,
                      page: Int,
                      pageSize: Int,
                      params: MediaLibraryService.LibraryParams?
                  ): ListenableFuture<
                      LibraryResult<ImmutableList<MediaItem>>
                  > {

                      val results =
                          searchCache[query.trim()]
                              ?: emptyList()

                      if (results.isEmpty()) {
                          return Futures.immediateFuture(
                              LibraryResult.ofItemList(
                                  ImmutableList.of(),
                                  params
                              )
                          )
                      }

                      val actualPageSize =
                          if (pageSize > 0) pageSize else results.size

                      val start =
                          (page * actualPageSize)
                              .coerceAtMost(results.size)

                      val end =
                          (start + actualPageSize)
                              .coerceAtMost(results.size)

                      val pageItems =
                          if (start < end) {
                              results.subList(start, end)
                          } else {
                              emptyList()
                          }

                      return Futures.immediateFuture(
                          LibraryResult.ofItemList(
                              ImmutableList.copyOf(pageItems),
                              params
                          )
                      )
                  }

                  override fun onAddMediaItems(
                      mediaSession: MediaSession,
                      controller: MediaSession.ControllerInfo,
                      mediaItems: List<MediaItem>
                  ) =
                      Futures.immediateFuture(mediaItems)

                  private fun searchInternet(
                      query: String
                  ): List<MediaItem> {

                      val words =
                          query
                              .lowercase()
                              .split(Regex("\\s+"))
                              .map {
                                  it.trim()
                                      .replace(
                                          Regex("[^a-z0-9_-]"),
                                          ""
                                      )
                              }
                              .filter {
                                  it.length >= 2
                              }
                              .distinct()
                              .take(6)

                      if (words.isEmpty()) {
                          return emptyList()
                      }

                      val titleQuery =
                          words.joinToString(" OR ") { word ->
                              "title:($word)"
                          }

                      val q =
                          "mediatype:audio AND ($titleQuery)"

                      val encodedQuery =
                          URLEncoder.encode(
                              q,
                              Charsets.UTF_8.name()
                          )

                      val searchUrl =
                          "https://archive.org/advancedsearch.php" +
                          "?q=$encodedQuery" +
                          "&fl%5B%5D=identifier" +
                          "&fl%5B%5D=title" +
                          "&fl%5B%5D=creator" +
                          "&rows=8" +
                          "&page=1" +
                          "&output=json"

                      val connection =
                          openConnection(searchUrl)

                      val response =
                          connection.inputStream
                              .bufferedReader()
                              .use { it.readText() }

                      connection.disconnect()

                      val root =
                          JSONObject(response)

                      val docs =
                          root.getJSONObject("response")
                              .getJSONArray("docs")

                      val futures =
                          mutableListOf<
                              java.util.concurrent.Future<MediaItem?>
                          >()

                      for (i in 0 until docs.length()) {

                          val doc =
                              docs.getJSONObject(i)

                          futures.add(
                              executor.submit<MediaItem?> {
                                  buildPlayableItem(doc)
                              }
                          )
                      }

                      val results =
                          mutableListOf<MediaItem>()

                      for (future in futures) {
                          try {
                              val item =
                                  future.get()

                              if (item != null) {
                                  results.add(item)
                              }
                          } catch (_: Exception) {
                          }

                          if (results.size >= 5) {
                              break
                          }
                      }

                      return results
                  }

                  private fun buildPlayableItem(
                      doc: JSONObject
                  ): MediaItem? {

                      val identifier =
                          doc.optString("identifier")

                      if (identifier.isBlank()) {
                          return null
                      }

                      val title =
                          doc.optString(
                              "title",
                              "Internet Audio"
                          )

                      val creator =
                          doc.optString(
                              "creator",
                              "Internet Archive"
                          )

                      val audioUrl =
                          findAudioFile(identifier)
                              ?: return null

                      return MediaItem.Builder()
                          .setMediaId(
                              "ia-$identifier"
                          )
                          .setUri(
                              Uri.parse(audioUrl)
                          )
                          .setMediaMetadata(
                              MediaMetadata.Builder()
                                  .setTitle(title)
                                  .setArtist(creator)
                                  .setIsBrowsable(false)
                                  .setIsPlayable(true)
                                  .build()
                          )
                          .build()
                  }

                  private fun findAudioFile(
                      identifier: String
                  ): String? {

                      val encodedIdentifier =
                          URLEncoder.encode(
                              identifier,
                              Charsets.UTF_8.name()
                          )

                      val metadataUrl =
                          "https://archive.org/metadata/" +
                              encodedIdentifier

                      val connection =
                          openConnection(metadataUrl)

                      val response =
                          try {
                              connection.inputStream
                                  .bufferedReader()
                                  .use { it.readText() }
                          } finally {
                              connection.disconnect()
                          }

                      val root =
                          JSONObject(response)

                      val files =
                          root.optJSONArray("files")
                              ?: return null

                      var bestUrl: String? = null

                      for (i in 0 until files.length()) {

                          val file =
                              files.optJSONObject(i)
                                  ?: continue

                          val name =
                              file.optString("name")

                          if (name.isBlank()) {
                              continue
                          }

                          val lower =
                              name.lowercase()

                          if (
                              lower.endsWith(".mp3")
                          ) {
                              bestUrl =
                                  buildDownloadUrl(
                                      identifier,
                                      name
                                  )
                              break
                          }

                          if (
                              bestUrl == null &&
                              lower.endsWith(".m4a")
                          ) {
                              bestUrl =
                                  buildDownloadUrl(
                                      identifier,
                                      name
                                  )
                          }

                          if (
                              bestUrl == null &&
                              lower.endsWith(".ogg")
                          ) {
                              bestUrl =
                                  buildDownloadUrl(
                                      identifier,
                                      name
                                  )
                          }
                      }

                      return bestUrl
                  }

                  private fun buildDownloadUrl(
                      identifier: String,
                      fileName: String
                  ): String =
                      "https://archive.org/download/" +
                          Uri.encode(identifier) +
                          "/" +
                          Uri.encode(fileName)

                  private fun openConnection(
                      url: String
                  ): HttpURLConnection {

                      val connection =
                          URL(url).openConnection()
                              as HttpURLConnection

                      connection.requestMethod = "GET"
                      connection.connectTimeout = 5000
                      connection.readTimeout = 7000
                      connection.instanceFollowRedirects = true

                      connection.setRequestProperty(
                          "User-Agent",
                          "CarAssistant/5.2"
                      )

                      return connection
                  }
              }
          }
          EOF

      - name: Verify V5.2 source
        run: |
          echo "===== VERSION ====="
          grep -n "versionCode\|versionName" \
            v5-2-source/app/build.gradle.kts

          echo "===== SEARCH ====="
          grep -n "onSearch\|onGetSearchResult\|searchInternet" \
            v5-2-source/app/src/main/java/com/carassistant/service/CarMediaService.kt

          echo "===== CACHE ====="
          grep -n "searchCache" \
            v5-2-source/app/src/main/java/com/carassistant/service/CarMediaService.kt

          echo "===== AUDIO URL ====="
          grep -n "archive.org/download" \
            v5-2-source/app/src/main/java/com/carassistant/service/CarMediaService.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: v5-2-source
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: car-assistant-v5-2-optimized-search-apk
          path: v5-2-source/app/build/outputs/apk/debug/app-debug.apk
