

name: TL3 In-App Search
run-name: TL3 In-App Search

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout verified source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify immutable baseline SHAs
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          expected = {
              "v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java":
                  "61e82df0fd17e7851c7bf1628ac03a9391e48523",
              "v10-source/app/src/main/java/com/carassistant/v10/V10ProjectionSession.java":
                  "27a9ff439fb450750d49f35a546eab3bc2745b4d",
              "v10-source/app/src/main/java/com/carassistant/v10/RootShellSession.java":
                  "c1c51bfc7450efa53b725d031a9d2a87dc39f8c9",
              "v10-source/app/src/main/AndroidManifest.xml":
                  "e6ffd5005ff0d0f8610c5950f20e17acba5410df",
              "v10-source/app/build.gradle":
                  "4d512337d46324a33a685d8cdb095e4ecacd3ceb",
              ".github/workflows/TL1.yml":
                  "584797be4490355f6d08c863edf9a57bb5422e90",
              ".github/workflows/TL2.yml":
                  "ec466067f315d85ebb8927472404f196d78a01a0",
              ".github/workflows/build-carassistant-voice-commands-v2.yml":
                  "4ee7f307c2a106a384a33c7b4386f1864c621ff3",
          }

          for name, wanted in expected.items():
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(
                      f"FAIL-CLOSED: missing baseline file: {name}"
                  )

              actual = subprocess.check_output(
                  ["git", "hash-object", str(path)],
                  text=True
              ).strip()

              if actual != wanted:
                  raise SystemExit(
                      f"FAIL-CLOSED: SHA mismatch: {name}; "
                      f"expected={wanted}; actual={actual}"
                  )

              print(f"PASS SHA: {name}")

          print("PASS: all immutable baseline pins verified")
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install workflow parser
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-yaml
          python3 -c "import yaml; print('PASS: PyYAML ready')"

      # Reuse TL2's exact verified TL1 and TL2 patch steps.
      # No source is committed or pushed by these steps.
      - name: Apply verified TL1 and TL2 baseline
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          workflow_path = Path(".github/workflows/TL2.yml")
          workflow = yaml.safe_load(
              workflow_path.read_text(encoding="utf-8")
          )

          steps = workflow.get("jobs", {}).get("build", {}).get("steps", [])

          def run_named_step(name):
              matches = [
                  step for step in steps
                  if step.get("name") == name and step.get("run")
              ]

              if len(matches) != 1:
                  raise SystemExit(
                      f"FAIL-CLOSED: expected exactly one TL2 step "
                      f"{name!r}; found {len(matches)}"
                  )

              print(f"RUN: {name}", flush=True)

              subprocess.run(
                  [
                      "bash", "-e", "-u", "-o", "pipefail",
                      "-c", matches[0]["run"]
                  ],
                  check=True
              )

              print(f"PASS: {name}", flush=True)

          run_named_step("Apply verified TL1 baseline")
          run_named_step("Apply TL2 app-picker selection patch")
          run_named_step("Validate TL2 and protect baseline")

          print("PASS: TL1 + TL2 integrated in workspace")
          PY

      - name: Apply TL3 in-app search controller
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          base = Path(
              "v10-source/app/src/main/java/com/carassistant/v10"
          )
          activity_path = base / "V10CarActivity.java"
          controller_path = base / "InAppSearchController.java"

          if not activity_path.is_file():
              raise SystemExit("FAIL-CLOSED: activity source missing")

          if controller_path.exists():
              raise SystemExit(
                  "FAIL-CLOSED: InAppSearchController already exists; "
                  "refusing to overwrite it"
              )

          source = activity_path.read_text(encoding="utf-8")

          # Fail closed if the expected TL1/TL2 voice implementation
          # is not present exactly once.
          method_anchor = "private boolean handleVoiceMediaSearch("
          if source.count(method_anchor) != 1:
              raise SystemExit(
                  "FAIL-CLOSED: expected exactly one "
                  "handleVoiceMediaSearch method"
              )

          for required in [
              "private void processVoiceCommand(String spoken)",
              "private void launchProjection(",
              "private void selectAppForProjection(AppInfo app)",
              "private void scheduleVoiceSilenceStop(",
              "voiceHandler.postDelayed(pending, 4000L)",
              "private V10ProjectionSession session;",
              "private TextureView textureView;",
          ]:
              if required not in source:
                  raise SystemExit(
                      f"FAIL-CLOSED: required TL1/TL2 anchor missing: "
                      f"{required}"
                  )

          # Isolate one Java method by balancing braces while respecting
          # strings, character literals, and comments.
          start = source.index(method_anchor)
          brace = source.find("{", start)

          if brace < 0:
              raise SystemExit("FAIL-CLOSED: method opening brace missing")

          depth = 0
          in_string = False
          in_char = False
          escaped = False
          line_comment = False
          block_comment = False
          end = None
          i = brace

          while i < len(source):
              ch = source[i]
              nxt = source[i + 1] if i + 1 < len(source) else ""

              if line_comment:
                  if ch == "\n":
                      line_comment = False
                  i += 1
                  continue

              if block_comment:
                  if ch == "*" and nxt == "/":
                      block_comment = False
                      i += 2
                  else:
                      i += 1
                  continue

              if in_string or in_char:
                  if escaped:
                      escaped = False
                  elif ch == "\\":
                      escaped = True
                  elif in_string and ch == '"':
                      in_string = False
                  elif in_char and ch == "'":
                      in_char = False
                  i += 1
                  continue

              if ch == "/" and nxt == "/":
                  line_comment = True
                  i += 2
                  continue

              if ch == "/" and nxt == "*":
                  block_comment = True
                  i += 2
                  continue

              if ch == '"':
                  in_string = True
              elif ch == "'":
                  in_char = True
              elif ch == "{":
                  depth += 1
              elif ch == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break

              i += 1

          if end is None:
              raise SystemExit(
                  "FAIL-CLOSED: could not isolate media search method"
              )

          old_method = source[start:end]

          if (
              "youtube.com/results" not in old_method
              or "music.youtube.com/search" not in old_method
              or "zingmp3.vn/tim-kiem" not in old_method
          ):
              raise SystemExit(
                  "FAIL-CLOSED: original media URL-search method "
                  "does not match the verified baseline"
              )

          new_method = r'''
              private boolean handleVoiceMediaSearch(
                      String original, String normalized) {
                  String query = original.replaceFirst(
                          "(?i)^(hay\\s+)?(mở\\s+)?(nhạc|bài hát|bài|video|phim)\\s*",
                          "");
                  query = query.replaceFirst("(?i)^phát\\s*", "");
                  query = query.replaceFirst("(?i)^tìm\\s*", "");
                  query = query.replaceFirst(
                          "(?i)\\s+trên\\s+.*$", "").trim();

                  String service;
                  String packageName;

                  if (normalized.contains("youtube music")) {
                      service = "YouTube Music";
                      packageName =
                              "com.google.android.apps.youtube.music";
                  } else if (normalized.contains("zing mp3")
                          || normalized.contains("zingmp3")) {
                      service = "Zing MP3";
                      packageName = findAppPackage("zing", "mp3");
                      if (packageName == null || packageName.isEmpty()) {
                          packageName = "com.zing.mp3";
                      }
                  } else if (normalized.contains("youtube")) {
                      service = "YouTube";
                      packageName = "com.google.android.youtube";
                  } else {
                      return false;
                  }

                  if (query.isEmpty()) {
                      Toast.makeText(
                              this,
                              "Bạn hãy nói tên bài hát hoặc video.",
                              Toast.LENGTH_SHORT
                      ).show();
                      return true;
                  }

                  try {
                      Intent launchIntent =
                              getPackageManager()
                                      .getLaunchIntentForPackage(packageName);

                      if (launchIntent == null
                              || launchIntent.getComponent() == null) {
                          Toast.makeText(
                                  this,
                                  "Không tìm thấy ứng dụng " + service
                                          + ". Không mở tìm kiếm bên ngoài.",
                                  Toast.LENGTH_LONG
                          ).show();
                          return true;
                      }

                      updateVoiceStatus(null);

                      // Preserve the existing V10 projection path.
                      launchProjection(launchIntent.getComponent());

                      // Search is handled by the app's own UI.
                      InAppSearchController controller =
                              new InAppSearchController(
                                      this, session, handler, textureView);

                      controller.search(service, query);

                  } catch (RuntimeException e) {
                      Toast.makeText(
                              this,
                              "Không thể mở " + service
                                      + ". Không mở URL tìm kiếm bên ngoài.",
                              Toast.LENGTH_LONG
                      ).show();
                  }

                  return true;
              }
          '''

          source = source[:start] + new_method + source[end:]

          controller = r'''package com.carassistant.v10;

          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.os.Handler;
          import android.view.View;
          import android.widget.Toast;

          /**
           * TL3: search through the selected app's own UI.
           *
           * Coordinates are provisional and must be calibrated on the
           * first real-device test. No external search URLs are used.
           */
          public final class InAppSearchController {
              private static final long DISPLAY_POLL_MS = 250L;
              private static final int MAX_DISPLAY_POLLS = 24;

              // Initial estimates only. Adjust after inspecting the
              // actual projected app UI on the user's device.
              private static final float YOUTUBE_SEARCH_X = 0.94f;
              private static final float YOUTUBE_SEARCH_Y = 0.08f;

              private static final float YOUTUBE_MUSIC_SEARCH_X = 0.12f;
              private static final float YOUTUBE_MUSIC_SEARCH_Y = 0.92f;

              private static final float ZING_SEARCH_X = 0.50f;
              private static final float ZING_SEARCH_Y = 0.08f;

              private final Context context;
              private final V10ProjectionSession session;
              private final Handler handler;
              private final View projectedView;
              private final RootShellSession rootShell =
                      new RootShellSession();

              private boolean finished;

              public InAppSearchController(
                      Context context,
                      V10ProjectionSession session,
                      Handler handler,
                      View projectedView) {
                  this.context = context;
                  this.session = session;
                  this.handler = handler;
                  this.projectedView = projectedView;
              }

              public void search(String service, String query) {
                  if (service == null || service.trim().isEmpty()
                          || query == null || query.trim().isEmpty()) {
                      fail("Thiếu ứng dụng hoặc từ khóa tìm kiếm.");
                      return;
                  }

                  waitForDisplay(service, query.trim(), 0);
              }

              private void waitForDisplay(
                      String service, String query, int attempt) {
                  if (finished) return;

                  if (session == null || projectedView == null) {
                      fail("Phiên chiếu chưa sẵn sàng.");
                      return;
                  }

                  if (!session.isActive()
                          || session.getDisplayId() < 0
                          || projectedView.getWidth() < 1
                          || projectedView.getHeight() < 1) {
                      if (attempt >= MAX_DISPLAY_POLLS) {
                          fail("Màn hình chiếu chưa sẵn sàng. "
                                  + "Không thực hiện tìm kiếm.");
                          return;
                      }

                      handler.postDelayed(
                              () -> waitForDisplay(
                                      service, query, attempt + 1),
                              DISPLAY_POLL_MS);
                      return;
                  }

                  // Allow the app home screen to settle before tapping.
                  handler.postDelayed(
                          () -> tapSearch(service, query),
                          1200L);
              }

              private void tapSearch(String service, String query) {
                  if (finished || session == null
                          || !session.isActive()) {
                      fail("Ứng dụng chưa sẵn sàng.");
                      return;
                  }

                  float fx;
                  float fy;

                  if ("YouTube Music".equals(service)) {
                      fx = YOUTUBE_MUSIC_SEARCH_X;
                      fy = YOUTUBE_MUSIC_SEARCH_Y;
                  } else if ("Zing MP3".equals(service)) {
                      fx = ZING_SEARCH_X;
                      fy = ZING_SEARCH_Y;
                  } else if ("YouTube".equals(service)) {
                      fx = YOUTUBE_SEARCH_X;
                      fy = YOUTUBE_SEARCH_Y;
                  } else {
                      fail("Ứng dụng tìm kiếm không được hỗ trợ.");
                      return;
                  }

                  int width = projectedView.getWidth();
                  int height = projectedView.getHeight();

                  if (width < 1 || height < 1
                          || fx <= 0f || fx >= 1f
                          || fy <= 0f || fy >= 1f) {
                      fail("Tọa độ tìm kiếm không hợp lệ.");
                      return;
                  }

                  // V10ProjectionSession maps these view coordinates to
                  // the virtual display's content dimensions.
                  session.tap(width * fx, height * fy);

                  // Wait for the native search field and keyboard to open.
                  handler.postDelayed(
                          () -> pasteAndSubmit(service, query),
                          1000L);
              }

              private void pasteAndSubmit(String service, String query) {
                  if (finished || session == null
                          || !session.isActive()) {
                      fail("Phiên chiếu đã mất trước khi nhập từ khóa.");
                      return;
                  }

                  try {
                      ClipboardManager clipboard =
                              (ClipboardManager) context.getSystemService(
                                      Context.CLIPBOARD_SERVICE);

                      if (clipboard == null) {
                          fail("Không truy cập được clipboard.");
                          return;
                      }

                      // Clipboard avoids lossy input-text encoding for
                      // Vietnamese diacritics.
                      clipboard.setPrimaryClip(
                              ClipData.newPlainText(
                                      "CarAssistant search", query));

                      int displayId = session.getDisplayId();
                      if (displayId < 0) {
                          fail("Display ID không hợp lệ.");
                          return;
                      }

                      RootShellSession.EXEC.execute(() -> {
                          try {
                              rootShell.run(
                                      5,
                                      "/system/bin/input -d "
                                              + displayId
                                              + " keyevent 279");

                              handler.postDelayed(() ->
                                      RootShellSession.EXEC.execute(() -> {
                                          try {
                                              rootShell.run(
                                                      5,
                                                      "/system/bin/input -d "
                                                              + displayId
                                                              + " keyevent 66");

                                              handler.post(() -> {
                                                  if (finished) return;
                                                  finished = true;
                                                  Toast.makeText(
                                                          context,
                                                          "Đã gửi từ khóa vào "
                                                                  + service
                                                                  + ". Hãy kiểm tra kết quả.",
                                                          Toast.LENGTH_LONG
                                                  ).show();
                                                  rootShell.destroy();
                                              });
                                          } catch (Throwable error) {
                                              handler.post(() -> fail(
                                                      "Không thể xác nhận tìm kiếm. "
                                                              + "Hãy kiểm tra giao diện."));
                                          }
                                      }), 350L);
                          } catch (Throwable error) {
                              handler.post(() -> fail(
                                      "Không thể dán từ khóa. "
                                              + "Không chuyển sang URL bên ngoài."));
                          }
                      });

                  } catch (RuntimeException error) {
                      fail("Không thể chuẩn bị từ khóa tìm kiếm.");
                  }
              }

              private void fail(String message) {
                  if (finished) return;
                  finished = true;

                  try {
                      rootShell.destroy();
                  } catch (RuntimeException ignored) {
                  }

                  handler.post(() -> Toast.makeText(
                          context, message, Toast.LENGTH_LONG).show());
              }
          }
          '''

          # Check that the controller does not use URL search or edit
          # the projection bridge.
          forbidden = [
              "youtube.com/results",
              "music.youtube.com/search",
              "zingmp3.vn/tim-kiem",
              "Intent.ACTION_VIEW",
              "Uri.parse("
          ]

          for item in forbidden:
              if item in new_method:
                  raise SystemExit(
                      f"FAIL-CLOSED: external search remains in method: {item}"
                  )

          if "package com.carassistant.v10;" not in controller:
              raise SystemExit("FAIL-CLOSED: controller package mismatch")

          if "keyevent 279" not in controller:
              raise SystemExit("FAIL-CLOSED: paste operation missing")

          if "keyevent 66" not in controller:
              raise SystemExit("FAIL-CLOSED: Enter operation missing")

          if "youtube.com/results" in controller:
              raise SystemExit("FAIL-CLOSED: external URL in controller")

          # Write the two permitted files only.
          activity_path.write_text(source, encoding="utf-8")
          controller_path.write_text(controller, encoding="utf-8")

          print("PASS: replaced only the media-search method")
          print("PASS: added InAppSearchController.java")
          print("PASS: no external search URL in TL3 media handler")
          PY

      - name: Validate TL3 and protect projection bridge
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import re
          import yaml

          activity_path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/"
              "V10CarActivity.java"
          )
          controller_path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/"
              "InAppSearchController.java"
          )
          session_path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/"
              "V10ProjectionSession.java"
          )
          root_path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/"
              "RootShellSession.java"
          )
          manifest_path = Path("v10-source/app/src/main/AndroidManifest.xml")
          gradle_path = Path("v10-source/app/build.gradle")

          activity = activity_path.read_text(encoding="utf-8")
          controller = controller_path.read_text(encoding="utf-8")

          yaml.safe_load(
              Path(".github/workflows/TL3-InAppSearch.yml")
                  .read_text(encoding="utf-8")
          )

          required_activity = [
              "private boolean handleVoiceMediaSearch(",
              "private void processVoiceCommand(String spoken)",
              "private void launchProjection(",
              "private void selectAppForProjection(AppInfo app)",
              "private void scheduleVoiceSilenceStop(",
              "voiceHandler.postDelayed(pending, 4000L)",
              "new InAppSearchController(",
              "launchProjection(launchIntent.getComponent())",
          ]

          for item in required_activity:
              if item not in activity:
                  raise SystemExit(
                      f"FAIL-CLOSED: missing activity feature: {item}"
                  )
              print(f"PASS: activity feature: {item}")

          required_controller = [
              "YOUTUBE_SEARCH_X",
              "YOUTUBE_MUSIC_SEARCH_X",
              "ZING_SEARCH_X",
              "session.tap(",
              "keyevent 279",
              "keyevent 66",
              "getDisplayId()",
              "Không chuyển sang URL bên ngoài",
          ]

          for item in required_controller:
              if item not in controller:
                  raise SystemExit(
                      f"FAIL-CLOSED: missing controller feature: {item}"
                  )
              print(f"PASS: controller feature: {item}")

          forbidden = [
              "youtube.com/results",
              "music.youtube.com/search",
              "zingmp3.vn/tim-kiem",
          ]

          # Only the new handler and controller must not contain the
          # previous URL-search implementation.
          for item in forbidden:
              if item in controller:
                  raise SystemExit(
                      f"FAIL-CLOSED: external search URL in controller: {item}"
                  )

          start = activity.index("private boolean handleVoiceMediaSearch(")
          brace = activity.find("{", start)
          depth = 0
          end = None

          for i in range(brace, len(activity)):
              if activity[i] == "{":
                  depth += 1
              elif activity[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break

          if end is None:
              raise SystemExit("FAIL-CLOSED: cannot validate media method")

          media_method = activity[start:end]

          for item in forbidden:
              if item in media_method:
                  raise SystemExit(
                      f"FAIL-CLOSED: external search URL remains: {item}"
                  )

          if media_method.count("launchProjection(") != 1:
              raise SystemExit(
                  "FAIL-CLOSED: media handler must use the existing "
                  "projection launch path exactly once"
              )

          if activity.count("private boolean handleVoiceMediaSearch(") != 1:
              raise SystemExit(
                  "FAIL-CLOSED: duplicate media handler"
              )

          if controller.count("public final class InAppSearchController") != 1:
              raise SystemExit(
                  "FAIL-CLOSED: controller class missing or duplicated"
              )

          # Verify bridge, root shell, manifest and Gradle were not changed.
          expected_unchanged = {
              session_path:
                  "27a9ff439fb450750d49f35a546eab3bc2745b4d",
              root_path:
                  "c1c51bfc7450efa53b725d031a9d2a87dc39f8c9",
              manifest_path:
                  "e6ffd5005ff0d0f8610c5950f20e17acba5410df",
              gradle_path:
                  "4d512337d46324a33a685d8cdb095e4ecacd3ceb",
          }

          for path, wanted in expected_unchanged.items():
              actual = subprocess.check_output(
                  ["git", "hash-object", str(path)],
                  text=True
              ).strip()

              if actual != wanted:
                  raise SystemExit(
                      f"FAIL-CLOSED: protected file changed: {path}"
                  )

              print(f"PASS unchanged: {path}")

          # Only V10CarActivity.java and the new controller may be modified
          # or untracked in the build workspace.
          status = subprocess.check_output(
              ["git", "status", "--porcelain", "--untracked-files=all"],
              text=True
          ).splitlines()

          changed = set()
          for line in status:
              if len(line) >= 4:
                  changed.add(line[3:])

          allowed = {
              str(activity_path),
              str(controller_path),
          }

          unexpected = changed - allowed
          missing = allowed - changed

          if unexpected:
              raise SystemExit(
                  "FAIL-CLOSED: unexpected workspace changes: "
                  + ", ".join(sorted(unexpected))
              )

          if missing:
              raise SystemExit(
                  "FAIL-CLOSED: expected TL3 files not changed: "
                  + ", ".join(sorted(missing))
              )

          print("PASS: only the activity and new controller changed")
          print("PASS: bridge, root shell, manifest and Gradle protected")
          print("PASS: TL3 validation complete")
          PY

      - name: Compile integrated TL1 TL2 TL3
        shell: bash
        run: |
          set -euo pipefail
          cd v10-source
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace compileDebugJavaWithJavac

      - name: Build integrated APK
        shell: bash
        run: |
          set -euo pipefail
          cd v10-source
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Package APK and TL3 source
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          mkdir -p dist

          cp "$APK" dist/CarAssistant-TL3-InAppSearch-unsigned.apk

          cp \
            v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java \
            dist/V10CarActivity-TL3.java

          cp \
            v10-source/app/src/main/java/com/carassistant/v10/InAppSearchController.java \
            dist/InAppSearchController.java

          sha256sum \
            dist/CarAssistant-TL3-InAppSearch-unsigned.apk \
            | tee dist/CarAssistant-TL3-InAppSearch.sha256

          echo "PASS: TL3 APK and source packaged"

      - name: Upload TL3 artifacts
        uses: actions/upload-artifact@v4
        with:
