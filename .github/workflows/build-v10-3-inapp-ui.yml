name: Build Car Assistant V10.3 In-App Control UI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # ============================================================
      # 1. Kiểm tra source V10 hiện tại
      # ============================================================
      - name: Verify V10 source
        shell: bash
        run: |
          set -euo pipefail

          ROOT="v10-source"
          SRC="$ROOT/app/src/main/java/com/hieptran/aacast/doudou"

          test -d "$ROOT"
          test -f "$SRC/V10CarActivity.java"
          test -f "$SRC/V10ProjectionSession.java"
          test -f "$SRC/V10InputController.java"
          test -f "$SRC/V10SessionStore.java"

          echo "V10 source found."

      # ============================================================
      # 2. Loại bỏ GearheadControlBar khỏi V10
      #    Không còn phụ thuộc UI nội bộ Android Auto
      # ============================================================
      - name: Remove Gearhead UI dependency
        shell: bash
        run: |
          set -euo pipefail

          BRIDGE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/aabridge/AACastBridge.java"

          test -f "$BRIDGE"

          python3 - "$BRIDGE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          # Remove import.
          text = re.sub(
              r'^\s*import\s+com\.carassistant\.v10\.hook\.GearheadControlBar;\s*\n',
              '',
              text,
              flags=re.MULTILINE
          )

          # Remove the actual call.
          text = re.sub(
              r'^\s*GearheadControlBar\s*\.\s*install\s*\(\s*\)\s*;\s*\n',
              '',
              text,
              flags=re.MULTILINE
          )

          path.write_text(text)
          PY

          if grep -Eq 'GearheadControlBar[[:space:]]*\.[[:space:]]*install' "$BRIDGE"; then
            echo "ERROR: GearheadControlBar call still exists."
            exit 1
          fi

          echo "GearheadControlBar removed from bridge."

      # ============================================================
      # 3. Tạo V10.3 V10CarActivity
      #
      # Layout:
      #
      # ┌─────────────────────────────┐
      # │                             │
      # │       TextureView           │
      # │                             │
      # ├─────────────────────────────┤
      # │ BACK │ APPS │ RECENTS │HOME │
      # └─────────────────────────────┘
      #
      # Projection engine giữ nguyên.
      # ============================================================
      - name: Write V10.3 In-App UI
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          cat > "$FILE" <<'JAVA'
          package com.carassistant.v10;

          import android.content.ComponentName;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.TextureView;
          import android.view.View;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import com.google.android.apps.auto.sdk.CarActivity;

          public final class V10CarActivity
                  extends CarActivity {

              private final Handler handler =
                      new Handler(Looper.getMainLooper());

              private TextureView textureView;

              private V10ProjectionSession session;

              private boolean resumed;

              private LinearLayout controlBar;

              private final Runnable targetPoller =
                      new Runnable() {

                          @Override
                          public void run() {

                              if (!resumed
                                      || session == null) {
                                  return;
                              }

                              ComponentName target =
                                      V10SessionStore.getTarget(
                                              V10CarActivity.this);

                              if (target != null) {
                                  session.setTarget(target);
                              }

                              handler.postDelayed(
                                      this,
                                      500);
                          }
                      };

              private void applyChrome() {
                  try {
                      getCarUiController()
                              .getStatusBarController()
                              .hideAppHeader();

                      getCarUiController()
                              .getMenuController()
                              .hideMenuButton();
                  } catch (RuntimeException ignored) {
                  }
              }

              @Override
              public void onCreate(Bundle state) {

                  setTheme(
                          R.style.Theme_AACast);

                  super.onCreate(state);

                  V10SessionStore.setCurrentActivity(this);

                  setIgnoreConfigChanges(-1);

                  applyChrome();
              }

              @Override
              public void onResume() {

                  super.onResume();

                  resumed = true;

                  applyChrome();

                  if (textureView == null) {

                      buildUi();

                      session =
                              new V10ProjectionSession(
                                      this);

                      session.attachTextureView(
                              textureView);

                      V10InputController
                              inputController =
                              new V10InputController(
                                      session);

                      textureView.setOnTouchListener(
                              inputController
                                      .createListener());
                  }

                  handler.removeCallbacks(
                          targetPoller);

                  handler.post(
                          targetPoller);
              }

              private void buildUi() {

                  FrameLayout root =
                          new FrameLayout(this);

                  root.setBackgroundColor(
                          Color.BLACK);

                  // ==================================================
                  // Projection surface
                  // ==================================================

                  textureView =
                          new TextureView(this);

                  FrameLayout.LayoutParams
                          textureParams =
                          new FrameLayout.LayoutParams(
                                  FrameLayout.LayoutParams.MATCH_PARENT,
                                  FrameLayout.LayoutParams.MATCH_PARENT);

                  textureParams.gravity =
                          Gravity.TOP;

                  root.addView(
                          textureView,
                          textureParams);

                  // ==================================================
                  // Bottom control bar
                  // ==================================================

                  controlBar =
                          new LinearLayout(this);

                  controlBar.setOrientation(
                          LinearLayout.HORIZONTAL);

                  controlBar.setGravity(
                          Gravity.CENTER);

                  controlBar.setPadding(
                          8,
                          4,
                          8,
                          4);

                  controlBar.setBackgroundColor(
                          Color.rgb(24, 24, 24));

                  FrameLayout.LayoutParams
                          barParams =
                          new FrameLayout.LayoutParams(
                                  FrameLayout.LayoutParams.MATCH_PARENT,
                                  dp(58));

                  barParams.gravity =
                          Gravity.BOTTOM;

                  root.addView(
                          controlBar,
                          barParams);

                  // ==================================================
                  // Buttons
                  // ==================================================

                  addControlButton(
                          "BACK",
                          v -> handleControlBack());

                  addControlButton(
                          "APPS",
                          v -> handleControlApps());

                  addControlButton(
                          "RECENTS",
                          v -> handleControlRecents());

                  addControlButton(
                          "HOME",
                          v -> handleControlHome());

                  setContentView(root);
              }

              private void addControlButton(
                      String label,
                      View.OnClickListener listener) {

                  Button button =
                          new Button(this);

                  button.setText(label);

                  button.setTextSize(12);

                  button.setTextColor(
                          Color.WHITE);

                  button.setAllCaps(false);

                  button.setOnClickListener(
                          listener);

                  LinearLayout.LayoutParams
                          params =
                          new LinearLayout.LayoutParams(
                                  0,
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  1f);

                  params.setMargins(
                          4,
                          4,
                          4,
                          4);

                  controlBar.addView(
                          button,
                          params);
              }

              private int dp(int value) {

                  float density =
                          getResources()
                                  .getDisplayMetrics()
                                  .density;

                  return Math.max(
                          1,
                          (int) (value * density + 0.5f));
              }

              @Override
              public void onPause() {

                  resumed = false;

                  handler.removeCallbacks(
                          targetPoller);

                  super.onPause();
              }

              @Override
              public void onBackPressed() {

                  if (session != null
                          && session.isActive()) {

                      session.back();

                      return;
                  }

                  super.onBackPressed();
              }

              @Override
              public void onStop() {

                  resumed = false;

                  handler.removeCallbacks(
                          targetPoller);

                  if (session != null) {
                      session.release();
                  }

                  super.onStop();
              }

              @Override
              public void onDestroy() {

                  resumed = false;

                  handler.removeCallbacks(
                          targetPoller);

                  if (session != null) {

                      session.destroy();

                      session = null;
                  }

                  textureView = null;

                  controlBar = null;

                  V10SessionStore
                          .clearCurrentActivity(this);

                  super.onDestroy();
              }

              @Override
              public void onWindowFocusChanged(
                      boolean hasFocus,
                      boolean touchMode) {

                  super.onWindowFocusChanged(
                          hasFocus,
                          touchMode);

                  if (hasFocus) {
                      applyChrome();
                  }
              }

              public void handleControlBack() {

                  if (session != null
                          && session.isActive()) {

                      session.back();
                  }
              }

              public void handleControlHome() {

                  if (session != null) {
                      session.release();
                  }
              }

              public void handleControlRecents() {

                  // V10.3:
                  // Chưa thay đổi ProjectionSession.
                  // Giữ chỗ cho SessionManager.
                  showInfo(
                          "RECENTS",
                          "Session manager sẽ được thêm ở bước tiếp theo.");
              }

              public void handleControlApps() {

                  // V10.3:
                  // Chưa thay đổi ProjectionSession.
                  // Giữ chỗ cho app selector.
                  showInfo(
                          "APPS",
                          "App selector sẽ được thêm ở bước tiếp theo.");
              }

              private void showInfo(
                      String title,
                      String message) {

                  if (!resumed) {
                      return;
                  }

                  TextView info =
                          new TextView(this);

                  info.setText(
                          title + "\n\n" + message);

                  info.setTextColor(
                          Color.WHITE);

                  info.setTextSize(16);

                  info.setGravity(
                          Gravity.CENTER);

                  info.setBackgroundColor(
                          Color.rgb(32, 32, 32));

                  FrameLayout root =
                          (FrameLayout) textureView.getParent();

                  if (root == null) {
                      return;
                  }

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  FrameLayout.LayoutParams.MATCH_PARENT,
                                  dp(150));

                  params.gravity =
                          Gravity.CENTER;

                  root.addView(
                          info,
                          params);

                  handler.postDelayed(
                          () -> {

                              if (info.getParent() != null) {
                                  ((FrameLayout) info.getParent())
                                          .removeView(info);
                              }

                          },
                          1800);
              }
          }
          JAVA

          echo "V10.3 V10CarActivity written."

      # ============================================================
      # 4. Giữ V10ControlReceiver nhưng kiểm tra tương thích
      # ============================================================
      - name: Verify control receiver
        shell: bash
        run: |
          set -euo pipefail

          RECEIVER="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ControlReceiver.java"

          test -f "$RECEIVER"

          grep -q 'BroadcastReceiver' "$RECEIVER"
          grep -q 'com.carassistant.v10.CONTROL' "$RECEIVER"
          grep -q 'V10SessionStore' "$RECEIVER"

          echo "V10ControlReceiver OK."

      # ============================================================
      # 5. Kiểm tra V10CarActivity
      # ============================================================
      - name: Verify V10.3 UI source
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -q 'class V10CarActivity' "$FILE"
          grep -q 'TextureView' "$FILE"
          grep -q 'V10ProjectionSession' "$FILE"
          grep -q 'V10InputController' "$FILE"

          grep -q '"BACK"' "$FILE"
          grep -q '"APPS"' "$FILE"
          grep -q '"RECENTS"' "$FILE"
          grep -q '"HOME"' "$FILE"

          grep -q 'addControlButton' "$FILE"

          # Không được còn WindowManagerGlobal.
          if grep -Eq 'WindowManagerGlobal[[:space:]]*\.' "$FILE"; then
            echo "ERROR: WindowManagerGlobal found."
            exit 1
          fi

          # Không được gọi GearheadControlBar từ CarActivity.
          if grep -Eq 'GearheadControlBar[[:space:]]*\.' "$FILE"; then
            echo "ERROR: GearheadControlBar found in CarActivity."
            exit 1
          fi

          echo "V10.3 UI source OK."

      # ============================================================
      # 6. Kiểm tra bridge
      # ============================================================
      - name: Verify Xposed bridge
        shell: bash
        run: |
          set -euo pipefail

          BRIDGE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/aabridge/AACastBridge.java"

          grep -q 'DisplayHooks' "$BRIDGE"
          grep -q 'InputHooks' "$BRIDGE"
          grep -q 'GearheadAllow' "$BRIDGE"
          grep -q 'GearheadDockPatcher' "$BRIDGE"

          if grep -Eq 'GearheadControlBar[[:space:]]*\.[[:space:]]*install' "$BRIDGE"; then
            echo "ERROR: GearheadControlBar still installed."
            exit 1
          fi

          echo "Xposed bridge OK."
          cat "$BRIDGE"

      # ============================================================
      # 7. Kiểm tra manifest
      # ============================================================
      - name: Verify manifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          grep -q 'com.carassistant.v10.V10CarActivity' "$MANIFEST"
          grep -q 'com.carassistant.v10.V10LauncherActivity' "$MANIFEST"
          grep -q 'com.carassistant.v10.AACastCarService' "$MANIFEST"
          grep -q 'com.carassistant.v10.V10ControlReceiver' "$MANIFEST"

          grep -q 'android:exported="true"' "$MANIFEST"

          echo "Manifest OK."

      # ============================================================
      # 8. Android 12 / API 31
      # ============================================================
      - name: Verify Android 12 compatibility
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="v10-source/app/build.gradle"

          test -f "$GRADLE_FILE"

          grep -Eq 'compileSdk[[:space:]]+31|compileSdk[[:space:]]*=[[:space:]]*31' "$GRADLE_FILE" \
            || true

          echo "Android 12 compatibility check completed."

      # ============================================================
      # 9. Projection engine không được bị sửa mất
      # ============================================================
      - name: Verify projection engine
        shell: bash
        run: |
          set -euo pipefail

          SESSION="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
          INPUT="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10InputController.java"

          test -f "$SESSION"
          test -f "$INPUT"

          grep -q 'createVirtualDisplay' "$SESSION"
          grep -q 'VirtualDisplay' "$SESSION"
          grep -q 'MotionEvent' "$INPUT"

          echo "Projection engine preserved."

      # ============================================================
      # 10. Clean build
      # ============================================================
      - name: Gradle clean
        working-directory: v10-source
        run: |
          set -euo pipefail
          gradle clean --no-daemon

      - name: Gradle assembleDebug
        working-directory: v10-source
        run: |
          set -euo pipefail
          gradle assembleDebug --no-daemon

      # ============================================================
      # 11. APK verification
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          SIZE=$(stat -c%s "$APK")
          SHA=$(sha256sum "$APK" | awk '{print $1}')

          echo "APK size: $SIZE bytes"
          echo "APK SHA256: $SHA"

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: APK unexpectedly small."
            exit 1
          fi

      # ============================================================
      # 12. Upload artifact
      # ============================================================
      - name: Upload V10.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10.3-InApp-Control-UI-debug
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 13. Commit source chỉ sau khi build thành công
      # ============================================================
      - name: Commit V10.3
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add v10-source

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git commit -m "Build V10.3 In-App Control UI"
          git push origin HEAD:main

          echo "V10.3 committed and pushed."
