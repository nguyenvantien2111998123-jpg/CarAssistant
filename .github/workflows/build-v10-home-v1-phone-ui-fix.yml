name: Build Car Assistant V10 - Home V1 Phone UI Fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-v1-phone-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify current launcher before patch
        shell: bash
        run: |
          set -euo pipefail
          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"
          test -f "$FILE"
          grep -q 'class V10LauncherActivity' "$FILE"
          grep -q 'initial(app.name)' "$FILE"
          grep -q 'V10SessionStore.setTarget' "$FILE"
          echo "CURRENT_MAIN_LAUNCHER_OK"
          sha256sum "$FILE"

      - name: Patch launcher with real Home V1 phone UI
        shell: bash
        run: |
          set -euo pipefail
          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          # 1) Imports: add ImageView/Drawable/Canvas/Paint/Path.
          s = s.replace(
              "import android.graphics.Color;\n",
              "import android.graphics.Canvas;\nimport android.graphics.Color;\nimport android.graphics.Paint;\nimport android.graphics.Path;\n")
          s = s.replace(
              "import android.graphics.drawable.GradientDrawable;\n",
              "import android.graphics.drawable.Drawable;\nimport android.graphics.drawable.GradientDrawable;\n")
          s = s.replace(
              "import android.widget.GridLayout;\n",
              "import android.widget.GridLayout;\nimport android.widget.ImageView;\n")

          # 2) Add state fields used by the visual dashboard.
          old = """    private TextView clock;\n    private TextView date;\n    private TextView status;\n"""
          new = """    private TextView clock;\n    private TextView date;\n    private TextView status;\n    private TextView location;\n    private TextView weather;\n    private TextView speed;\n    private TextView distance;\n    private TextView media;\n"""
          if old not in s:
              raise SystemExit("field marker missing")
          s = s.replace(old, new, 1)

          # 3) Replace the old text-only dashboard with a real phone dashboard.
          start = s.index("    private void buildDashboard() {")
          end = s.index("    // ====================================================\n    // APPLICATIONS PANEL", start)

          dashboard = r'''    private void buildDashboard() {

        LinearLayout top = new LinearLayout(this);
        top.setGravity(Gravity.CENTER_VERTICAL);
        top.setPadding(dp(8), 0, dp(8), 0);
        top.setBackground(roundBg(Color.rgb(15, 20, 26), dp(16)));

        LinearLayout timeBox = new LinearLayout(this);
        timeBox.setOrientation(LinearLayout.VERTICAL);

        clock = text("--:--", 25, Color.WHITE);
        clock.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
        date = text("--/--/----", 12, Color.LTGRAY);
        timeBox.addView(clock);
        timeBox.addView(date);
        top.addView(timeBox, new LinearLayout.LayoutParams(0, dp(58), 1));

        location = text("●  Vị trí hiện tại", 14, Color.WHITE);
        location.setGravity(Gravity.CENTER);
        top.addView(location, new LinearLayout.LayoutParams(0, dp(58), 1));

        weather = text("☁  -- °C", 14, Color.WHITE);
        weather.setGravity(Gravity.CENTER);
        top.addView(weather, new LinearLayout.LayoutParams(0, dp(58), 1));

        dashboard.addView(top, new LinearLayout.LayoutParams(-1, dp(72)));

        LinearLayout body = new LinearLayout(this);
        body.setOrientation(LinearLayout.HORIZONTAL);
        body.setPadding(0, dp(6), 0, dp(6));
        body.addView(buildSidebar(), new LinearLayout.LayoutParams(dp(68), -1));

        LinearLayout center = new LinearLayout(this);
        center.setOrientation(LinearLayout.VERTICAL);
        center.setPadding(dp(6), 0, 0, 0);

        center.addView(new MapBackground(), new LinearLayout.LayoutParams(-1, 0, 1));

        LinearLayout stats = new LinearLayout(this);
        stats.setGravity(Gravity.CENTER_VERTICAL);
        stats.setPadding(dp(4), dp(4), dp(4), dp(4));

        speed = stat("SPEED", "0 km/h");
        TextView drive = stat("DRIVE", "00:00");
        distance = stat("DISTANCE", "0.0 km");
        media = stat("MEDIA", "No media");

        stats.addView(speed, new LinearLayout.LayoutParams(0, dp(78), 1));
        stats.addView(drive, new LinearLayout.LayoutParams(0, dp(78), 1));
        stats.addView(distance, new LinearLayout.LayoutParams(0, dp(78), 1));
        stats.addView(media, new LinearLayout.LayoutParams(0, dp(78), 1));
        center.addView(stats, new LinearLayout.LayoutParams(-1, dp(90)));

        body.addView(center, new LinearLayout.LayoutParams(0, -1, 1));
        dashboard.addView(body, new LinearLayout.LayoutParams(-1, 0, 1));

        LinearLayout bottom = new LinearLayout(this);
        bottom.setGravity(Gravity.CENTER_VERTICAL);
        bottom.setPadding(dp(6), dp(4), dp(6), dp(4));
        bottom.setBackground(roundBg(Color.rgb(15, 20, 26), dp(16)));

        TextView previous = control("◀");
        TextView next = control("▶");
        TextView musicTitle = text("♫  Chưa phát nhạc", 13, Color.WHITE);
        musicTitle.setGravity(Gravity.CENTER_VERTICAL);

        bottom.addView(previous, new LinearLayout.LayoutParams(dp(60), dp(58)));
        bottom.addView(next, new LinearLayout.LayoutParams(dp(60), dp(58)));
        bottom.addView(musicTitle, new LinearLayout.LayoutParams(0, dp(58), 1));

        TextView appsButton = control("▦");
        appsButton.setContentDescription("Applications");
        appsButton.setOnClickListener(v -> showApps());
        bottom.addView(appsButton, new LinearLayout.LayoutParams(dp(64), dp(58)));

        dashboard.addView(bottom, new LinearLayout.LayoutParams(-1, dp(68)));
    }

    private LinearLayout buildSidebar() {
        LinearLayout sidebar = new LinearLayout(this);
        sidebar.setOrientation(LinearLayout.VERTICAL);
        sidebar.setGravity(Gravity.TOP | Gravity.CENTER_HORIZONTAL);
        sidebar.setPadding(dp(4), dp(4), dp(4), dp(4));
        sidebar.setBackground(roundBg(Color.rgb(13, 18, 24), dp(18)));

        addSideButton(sidebar, "☰", "Menu", v -> showApps());
        addSideButton(sidebar, "⌖", "Map", v -> {
            if (location != null) location.setText("●  Vị trí hiện tại");
        });
        addSideButton(sidebar, "▣", "Files", v -> showApps());
        addSideButton(sidebar, "⚙", "Settings", v -> {
            if (status != null) status.setText("Settings");
        });
        addSideButton(sidebar, "⋮", "More", v -> showApps());
        return sidebar;
    }

    private void addSideButton(LinearLayout sidebar, String glyph,
                               String label, View.OnClickListener listener) {
        TextView v = text(glyph, 25, Color.WHITE);
        v.setGravity(Gravity.CENTER);
        v.setContentDescription(label);
        v.setBackground(roundBg(Color.rgb(25, 31, 38), dp(14)));
        v.setOnClickListener(listener);

        LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1, dp(64));
        p.setMargins(0, dp(3), 0, dp(3));
        sidebar.addView(v, p);
    }

    private TextView stat(String title, String value) {
        TextView v = text(title + "\n" + value, 13, Color.WHITE);
        v.setGravity(Gravity.CENTER);
        v.setBackground(roundBg(Color.rgb(22, 29, 36), dp(14)));
        return v;
    }

    private TextView control(String glyph) {
        TextView v = text(glyph, 24, Color.WHITE);
        v.setGravity(Gravity.CENTER);
        v.setBackground(roundBg(Color.rgb(27, 34, 42), dp(15)));
        return v;
    }

'''
          s = s[:start] + dashboard + s[end:]

          # 4) Replace app model so real package icons are used.
          old = """            apps.add(\n                    new AppInfo(\n                            component,\n                            name));\n"""
          new = """            Drawable icon = null;\n            try {\n                icon = info.loadIcon(getPackageManager());\n            } catch (Exception ignored) {\n            }\n\n            apps.add(\n                    new AppInfo(\n                            component,\n                            name,\n                            icon));\n"""
          if old not in s:
              raise SystemExit("AppInfo creation marker missing")
          s = s.replace(old, new, 1)

          # 5) Replace text-letter app icon with ImageView using actual launcher icon.
          start = s.index("    private LinearLayout appTile(")
          end = s.index("    // ====================================================\n    // SELECT APP", start)
          app_tile = r'''    private LinearLayout appTile(AppInfo app) {

        LinearLayout tile = new LinearLayout(this);
        tile.setOrientation(LinearLayout.VERTICAL);
        tile.setGravity(Gravity.CENTER);
        tile.setPadding(dp(8), dp(8), dp(8), dp(6));
        tile.setBackground(roundBg(Color.rgb(20, 27, 34), dp(18)));
        tile.setOnClickListener(v -> selectApp(app));

        ImageView icon = new ImageView(this);
        icon.setScaleType(ImageView.ScaleType.CENTER_INSIDE);
        if (app.icon != null) {
            icon.setImageDrawable(app.icon);
        } else {
            icon.setImageResource(android.R.drawable.sym_def_app_icon);
        }
        tile.addView(icon, new LinearLayout.LayoutParams(-1, dp(76)));

        TextView name = text(app.name, 12, Color.WHITE);
        name.setGravity(Gravity.CENTER);
        name.setMaxLines(2);
        tile.addView(name, new LinearLayout.LayoutParams(-1, dp(36)));
        return tile;
    }

'''
          s = s[:start] + app_tile + s[end:]

          # 6) Add real visual helpers + drawable map background before App model.
          marker = "    // ====================================================\n    // APP MODEL\n"
          if marker not in s:
              raise SystemExit("App model marker missing")

          helpers = r'''    private GradientDrawable roundBg(int color, float radiusDp) {
        GradientDrawable bg = new GradientDrawable();
        bg.setColor(color);
        bg.setCornerRadius(dp(radiusDp));
        bg.setStroke(dp(1), Color.rgb(42, 51, 61));
        return bg;
    }

    private final class MapBackground extends View {
        private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
        private final Path road = new Path();

        MapBackground() {
            super(V10LauncherActivity.this);
            setBackground(roundBg(Color.rgb(8, 18, 20), dp(20)));
        }

        @Override
        protected void onDraw(Canvas canvas) {
            super.onDraw(canvas);

            int w = getWidth();
            int h = getHeight();

            paint.setStyle(Paint.Style.STROKE);
            paint.setStrokeWidth(dp(1));
            paint.setColor(Color.rgb(24, 48, 51));

            for (int x = 0; x < w; x += dp(42)) {
                canvas.drawLine(x, 0, x, h, paint);
            }
            for (int y = 0; y < h; y += dp(42)) {
                canvas.drawLine(0, y, w, y, paint);
            }

            paint.setColor(Color.rgb(45, 79, 82));
            paint.setStrokeWidth(dp(7));
            road.reset();
            road.moveTo(0, h * .72f);
            road.cubicTo(w * .20f, h * .55f, w * .30f, h * .78f,
                    w * .48f, h * .50f);
            road.cubicTo(w * .66f, h * .22f, w * .78f, h * .50f,
                    w, h * .25f);
            canvas.drawPath(road, paint);

            paint.setColor(Color.rgb(90, 125, 128));
            paint.setStrokeWidth(dp(2));
            canvas.drawPath(road, paint);

            paint.setStyle(Paint.Style.FILL);
            paint.setColor(Color.rgb(65, 210, 175));
            canvas.drawCircle(w * .48f, h * .50f, dp(8), paint);

            paint.setColor(Color.WHITE);
            paint.setTypeface(Typeface.DEFAULT_BOLD);
            paint.setTextSize(dp(15));
            canvas.drawText("MAP", dp(18), dp(28), paint);
            paint.setTypeface(Typeface.DEFAULT);
            paint.setTextSize(dp(12));
            canvas.drawText("Navigation", dp(18), dp(48), paint);
        }
    }

'''
          s = s.replace(marker, helpers + marker, 1)

          # 7) Extend AppInfo with the real Drawable icon.
          old = """        final String name;\n\n        AppInfo(\n                ComponentName component,\n                String name) {\n\n            this.component =\n                    component;\n\n            this.name =\n                    name;\n        }\n"""
          new = """        final String name;\n        final Drawable icon;\n\n        AppInfo(\n                ComponentName component,\n                String name,\n                Drawable icon) {\n\n            this.component =\n                    component;\n\n            this.name =\n                    name;\n\n            this.icon =\n                    icon;\n        }\n"""
          if old not in s:
              raise SystemExit("AppInfo class marker missing")
          s = s.replace(old, new, 1)

          # 8) Dock remains functional but uses real icons only in Applications panel.
          # Do not touch projection/session/persistence code from Core V1.
          p.write_text(s, encoding="utf-8")
          print("PHONE_HOME_V1_PATCH_OK")
          PY

      - name: Verify patch before compile
        shell: bash
        run: |
          set -euo pipefail
          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"
          grep -q 'MapBackground' "$FILE"
          grep -q 'buildSidebar' "$FILE"
          grep -q 'ImageView' "$FILE"
          grep -q 'loadIcon' "$FILE"
          grep -q 'final Drawable icon' "$FILE"
          grep -q 'V10SessionStore.setTarget' "$FILE"
          if grep -q 'initial(app.name)' "$FILE"; then
            echo "ERROR: old letter-only icon code remains"
            exit 1
          fi
          echo "HOME_V1_PHONE_UI_PATCH_VERIFIED"
          sha256sum "$FILE"

      - name: Compile Java
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Locate APK and SHA256
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find v10-source/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          sha256sum "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload Home V1 Phone UI APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Home-V1-Phone-UI-Fix
          path: ${{ env.APK }}
          if-no-files-found: error
