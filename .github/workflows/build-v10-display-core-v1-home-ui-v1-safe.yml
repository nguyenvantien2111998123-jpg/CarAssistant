name: Build CarAssistant V10 Display Core V1 Home UI V1 SAFE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:

      # ============================================================
      # 1. CHECKOUT MAIN + SAVE CURRENT HOME UI SOURCE
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Save current main V10CarActivity for Home UI only
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          test -f "$FILE"

          cp "$FILE" /tmp/V10CarActivity.main.java

          echo "Saved current main V10CarActivity:"
          sha256sum /tmp/V10CarActivity.main.java

      # ============================================================
      # 2. JDK 17
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. RESTORE EXACT V10-6A + REBUILD DISPLAY CORE V1
      #
      # We intentionally execute the existing known Display Core V1
      # RUN blocks instead of rewriting them here.
      # This preserves the exact tested architecture.
      # ============================================================
      - name: Restore V10-6A and rebuild exact Display Core V1
        shell: bash
        run: |
          set -euo pipefail

          CORE_WF=".github/workflows/build-v10-display-core-v1.yml"

          test -f "$CORE_WF"

          python3 - "$CORE_WF" <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import yaml

          workflow = Path(sys.argv[1])

          doc = yaml.safe_load(
              workflow.read_text(encoding="utf-8")
          )

          steps = doc["jobs"]["build"]["steps"]

          selected = []

          for step in steps:
              if "run" in step and not step.get("uses"):
                  selected.append(step)

              if step.get("name") == "Build V10 Display Core V1":
                  break

          if not selected:
              raise SystemExit(
                  "ERROR: Display Core V1 run steps not found"
              )

          for step in selected:
              name = step.get("name", "unnamed")

              print("")
              print("=" * 70)
              print("DISPLAY CORE > " + name)
              print("=" * 70)

              subprocess.run(
                  [
                      "bash",
                      "-euo",
                      "pipefail",
                      "-c",
                      step["run"],
                  ],
                  check=True,
              )
          PY

      # ============================================================
      # 4. VERIFY EXACT DISPLAY CORE / PERSISTENCE BASELINE
      # ============================================================
      - name: Verify Display Core V1 before Floating Touch
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          SESSION="$SRC/V10ProjectionSession.java"
          DISPLAY="$SRC/V10DisplayController.java"
          SURFACE="$SRC/V10SurfaceManager.java"
          TASK="$SRC/V10TaskSession.java"
          STORE="$SRC/V10SessionStore.java"
          INPUT="$SRC/V10InputController.java"
          ACTIVITY="$SRC/V10CarActivity.java"

          for f in \
            "$SESSION" \
            "$DISPLAY" \
            "$SURFACE" \
            "$TASK" \
            "$STORE" \
            "$INPUT" \
            "$ACTIVITY"
          do
            test -f "$f"
          done

          grep -Fq "DisplayManager" "$SESSION"
          grep -Fq "createVirtualDisplay" "$DISPLAY"
          grep -Fq "RootShellSession" "$DISPLAY"
          grep -Fq "launchNewTask" "$SESSION"
          grep -Fq "resumeExistingTask" "$SESSION"
          grep -Fq -- "--activity-reorder-to-front" "$DISPLAY"
          grep -Fq "State.HIDDEN" "$SESSION"

          if grep -Fq "V10ProjectionService" "$SESSION"; then
            echo "ERROR: V10ProjectionService detected."
            exit 1
          fi

          echo "Display Core V1 verification PASSED."

      # ============================================================
      # 5. APPLY EXACT HISTORICAL FLOATING TOUCH PATCH
      #
      # The known-good Floating Touch patch was stored at the
      # historical commit below. We fetch that exact workflow and
      # execute ONLY its Floating Touch patch step.
      # ============================================================
      - name: Apply exact known-good Floating Touch patch
        shell: bash
        run: |
          set -euo pipefail

          HISTORICAL_COMMIT="953d6c61664530a94c1813b9335a97d08c212611"

          git fetch origin "$HISTORICAL_COMMIT" --depth=1

          git show \
            "$HISTORICAL_COMMIT:.github/workflows/build-v10-display-core-v1-floating-touch-fixed.yml" \
            > /tmp/floating-touch-fixed.yml

          test -s /tmp/floating-touch-fixed.yml

          python3 /tmp/floating-touch-fixed.yml <<'PY'
          PY
        continue-on-error: false

      # ============================================================
      # 5B. ACTUALLY EXECUTE ONLY THE HISTORICAL PATCH STEP
      # ============================================================
      - name: Execute historical Floating Touch patch only
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          path = Path("/tmp/floating-touch-fixed.yml")

          doc = yaml.safe_load(
              path.read_text(encoding="utf-8")
          )

          target = None

          for step in doc["jobs"]["build"]["steps"]:
              if (
                  step.get("name")
                  == "Patch V10CarActivity with Floating Touch only"
              ):
                  target = step
                  break

          if target is None:
              raise SystemExit(
                  "ERROR: Known-good Floating Touch patch step not found"
              )

          print("Executing exact historical Floating Touch patch.")

          subprocess.run(
              [
                  "bash",
                  "-euo",
                  "pipefail",
                  "-c",
                  target["run"],
              ],
              check=True,
          )
          PY

      # ============================================================
      # 6. APPLY THE SAME SAFE LONG-PRESS IMPLEMENTATION
      #    FROM THE CURRENT KNOWN-WORKING LONGPRESS WORKFLOW
      # ============================================================
      - name: Apply known-good Floating Touch Long Press implementation
        shell: bash
        run: |
          set -euo pipefail

          LONGPRESS_WF=".github/workflows/build-v10-display-core-v1-floating-touch-longpress-safe.yml"

          test -f "$LONGPRESS_WF"

          python3 - "$LONGPRESS_WF" <<'PY'
          from pathlib import Path
          import subprocess
          import yaml
          import sys

          path = Path(sys.argv[1])

          doc = yaml.safe_load(
              path.read_text(encoding="utf-8")
          )

          target = None

          for step in doc["jobs"]["build"]["steps"]:
              if (
                  step.get("name")
                  == "Replace the entire Floating Touch listener with SAFE long-press version"
              ):
                  target = step
                  break

          if target is None:
              raise SystemExit(
                  "ERROR: Known-good SAFE Long Press step not found"
              )

          print(
              "Executing exact SAFE Long Press implementation "
              "from known-working workflow."
          )

          subprocess.run(
              [
                  "bash",
                  "-euo",
                  "pipefail",
                  "-c",
                  target["run"],
              ],
              check=True,
          )
          PY

      # ============================================================
      # 7. VERIFY FLOATING TOUCH + LONG PRESS
      # ============================================================
      - name: Verify Floating Touch and Long Press
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          SESSION="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          grep -Fq "private TextView floatingTouchKey;" "$FILE"
          grep -Fq "private void createFloatingTouchKey()" "$FILE"
          grep -Fq "createFloatingTouchKey();" "$FILE"

          grep -Fq "floatingDragging" "$FILE"
          grep -Fq "floatingDownTime = SystemClock.uptimeMillis();" "$FILE"
          grep -Fq "ViewConfiguration.getLongPressTimeout()" "$FILE"

          grep -Fq 'addFloatingMenuButton("BACK"' "$FILE"
          grep -Fq 'addFloatingMenuButton("HOME"' "$FILE"

          grep -Fq "handleControlBack();" "$FILE"
          grep -Fq "handleControlHome();" "$FILE"

          if grep -Fq "floatingLastTap" "$FILE"; then
            echo "ERROR: legacy floatingLastTap remains."
            exit 1
          fi

          if grep -Fq 'session.recents()' "$FILE"; then
            echo "ERROR: RECENTS feature leaked into this build."
            exit 1
          fi

          if grep -Fq '"RECENTS"' "$FILE"; then
            echo "ERROR: RECENTS menu leaked into this build."
            exit 1
          fi

          if grep -Fq '"2 SCREEN"' "$FILE"; then
            echo "ERROR: 2 SCREEN leaked into this build."
            exit 1
          fi

          if grep -Fq '"3 SCREEN"' "$FILE"; then
            echo "ERROR: 3 SCREEN leaked into this build."
            exit 1
          fi

          if grep -Fq "V10ProjectionService" "$SESSION"; then
            echo "ERROR: V10ProjectionService detected."
            exit 1
          fi

          if grep -Fq "am force-stop" "$SESSION"; then
            echo "ERROR: force-stop detected."
            exit 1
          fi

          echo "Floating Touch + Long Press verification PASSED."

      # ============================================================
      # 8. HASH PROTECTED CORE / PERSISTENCE FILES
      #
      # These files MUST NOT change during Home UI patching.
      # ============================================================
      - name: Freeze Core and Persistence hashes before Home UI
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          mkdir -p /tmp/core-before

          for file in \
            V10ProjectionSession.java \
            V10DisplayController.java \
            V10SurfaceManager.java \
            V10TaskSession.java \
            V10SessionStore.java \
            V10InputController.java
          do
            sha256sum "$SRC/$file" \
              | tee "/tmp/core-before/$file.sha256"
          done

          echo ""
          echo "Protected Core/Persistence hashes frozen."

      # ============================================================
      # 9. PATCH HOME UI ONLY
      #
      # Source comes ONLY from current main V10CarActivity.
      #
      # Allowed:
      #   buildUi()
      #   buildMainLayout()
      #   buildTransparentBottomBar()
      #   sidebarButton()
      #   spacer()
      #   buttonText()
      #   text()
      #   initial()
      #   dp()
      #   bottomBar field
      #
      # NOT touched:
      #   Projection
      #   Task persistence
      #   lifecycle
      #   Display Core
      #   Input Controller
      # ============================================================
      - name: Patch Home UI only
        shell: bash
        run: |
          set -euo pipefail

          TARGET="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          MAIN="/tmp/V10CarActivity.main.java"

          test -f "$TARGET"
          test -f "$MAIN"

          python3 - "$TARGET" "$MAIN" <<'PY'
          from pathlib import Path
          import sys

          target = Path(sys.argv[1])
          source = Path(sys.argv[2])

          base = target.read_text(encoding="utf-8")
          main = source.read_text(encoding="utf-8")

          def find_method(text, signature):
              start = text.find(signature)

              if start < 0:
                  raise SystemExit(
                      f"ERROR: method/field signature not found: {signature}"
                  )

              brace = text.find("{", start)

              if brace < 0:
                  raise SystemExit(
                      f"ERROR: opening brace not found: {signature}"
                  )

              depth = 0
              in_string = False
              escape = False
              line_comment = False
              block_comment = False

              i = brace

              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ""

                  if line_comment:
                      if c == "\n":
                          line_comment = False

                  elif block_comment:
                      if c == "*" and n == "/":
                          block_comment = False
                          i += 1

                  elif in_string:
                      if escape:
                          escape = False
                      elif c == "\\":
                          escape = True
                      elif c == '"':
                          in_string = False

                  else:
                      if c == "/" and n == "/":
                          line_comment = True
                          i += 1
                      elif c == "/" and n == "*":
                          block_comment = True
                          i += 1
                      elif c == '"':
                          in_string = True
                      elif c == "{":
                          depth += 1
                      elif c == "}":
                          depth -= 1

                          if depth == 0:
                              return text[start:i + 1]

                  i += 1

              raise SystemExit(
                  f"ERROR: could not find complete method: {signature}"
              )

          def replace_method(base_text, old_signature, main_signature):
              old = find_method(base_text, old_signature)
              new = find_method(main, main_signature)

              if base_text.count(old) != 1:
                  raise SystemExit(
                      f"ERROR: target occurrence count is not 1: {old_signature}"
                  )

              return base_text.replace(old, new, 1)

          # --------------------------------------------------------
          # 1. Replace buildUi()
          # --------------------------------------------------------
          base = replace_method(
              base,
              "private void buildUi()",
              "private void buildUi()"
          )

          # --------------------------------------------------------
          # 2. Replace UI helper methods
          # --------------------------------------------------------
          for sig in [
              "private TextView sidebarButton(",
              "private View spacer(",
              "private TextView buttonText(",
              "private TextView text(",
              "private String initial(",
              "private int dp(",
          ]:
              base = replace_method(base, sig, sig)

          # --------------------------------------------------------
          # 3. Insert buildMainLayout() and
          #    buildTransparentBottomBar()
          # --------------------------------------------------------
          main_layout = find_method(
              main,
              "private void buildMainLayout()"
          )

          bottom_layout = find_method(
              main,
              "private void buildTransparentBottomBar()"
          )

          if "private void buildMainLayout()" not in base:
              marker = "private void buildAppPanel()"

              pos = base.find(marker)

              if pos < 0:
                  raise SystemExit(
                      "ERROR: buildAppPanel() insertion point not found"
                  )

              insertion = (
                  main_layout
                  + "\n\n"
                  + bottom_layout
                  + "\n\n"
              )

              base = base[:pos] + insertion + base[pos:]

          # --------------------------------------------------------
          # 4. Add bottomBar field ONLY if missing.
          # --------------------------------------------------------
          if "private LinearLayout bottomBar;" not in base:
              marker = "private LinearLayout appPanel;"

              if marker not in base:
                  raise SystemExit(
                      "ERROR: appPanel field insertion point not found"
                  )

              base = base.replace(
                  marker,
                  marker + "\n    private LinearLayout bottomBar;",
                  1
              )

          # --------------------------------------------------------
          # 5. Verify UI methods exist after patch.
          # --------------------------------------------------------
          required = [
              "private void buildUi()",
              "private void buildMainLayout()",
              "private void buildTransparentBottomBar()",
              "private TextView sidebarButton(",
              "private View spacer(",
              "private TextView buttonText(",
              "private TextView text(",
              "private String initial(",
              "private int dp(",
              "private LinearLayout bottomBar;",
          ]

          for item in required:
              if item not in base:
                  raise SystemExit(
                      "ERROR: required Home UI element missing: "
                      + item
                  )

          target.write_text(base, encoding="utf-8")

          print("Home UI patch completed.")
          PY

      # ============================================================
      # 10. PROTECTED FILES MUST BE BYTE-FOR-BYTE IDENTICAL
      # ============================================================
      - name: Verify Core and Persistence were not modified by Home UI
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          for file in \
            V10ProjectionSession.java \
            V10DisplayController.java \
            V10SurfaceManager.java \
            V10TaskSession.java \
            V10SessionStore.java \
            V10InputController.java
          do
            sha256sum "$SRC/$file" > "/tmp/core-after-$file.sha256"

            BEFORE="$(cut -d' ' -f1 "/tmp/core-before/$file.sha256")"
            AFTER="$(cut -d' ' -f1 "/tmp/core-after-$file.sha256")"

            echo "$file"
            echo "  BEFORE: $BEFORE"
            echo "  AFTER : $AFTER"

            if [ "$BEFORE" != "$AFTER" ]; then
              echo ""
              echo "ERROR: PROTECTED FILE CHANGED:"
              echo "$file"
              exit 1
            fi
          done

          echo ""
          echo "=================================================="
          echo "CORE / PERSISTENCE INTEGRITY CHECK PASSED"
          echo "=================================================="

      # ============================================================
      # 11. VERIFY HOME UI DID NOT TOUCH PROJECTION LIFECYCLE
      # ============================================================
      - name: Verify projection and lifecycle remain intact
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq "private void attachProjection()" "$FILE"
          grep -Fq "private void launchProjection(" "$FILE"
          grep -Fq "private void returnToLauncher()" "$FILE"
          grep -Fq "public void handleControlBack()" "$FILE"
          grep -Fq "public void handleControlHome()" "$FILE"
          grep -Fq "public void handleControlRecents()" "$FILE"
          grep -Fq "public void handleControlApps()" "$FILE"
          grep -Fq "public void onBackPressed()" "$FILE"
          grep -Fq "public void onPause()" "$FILE"
          grep -Fq "public void onStop()" "$FILE"
          grep -Fq "public void onDestroy()" "$FILE"

          if grep -Fq "V10ProjectionService" "$FILE"; then
            echo "ERROR: V10ProjectionService found in Activity."
            exit 1
          fi

          if grep -Fq '"2 SCREEN"' "$FILE"; then
            echo "ERROR: 2 SCREEN found."
            exit 1
          fi

          if grep -Fq '"3 SCREEN"' "$FILE"; then
            echo "ERROR: 3 SCREEN found."
            exit 1
          fi

          if grep -Fq '"RECENTS"' "$FILE"; then
            echo "ERROR: RECENTS UI found."
            exit 1
          fi

          if grep -Fq 'session.recents()' "$FILE"; then
            echo "ERROR: session.recents() found."
            exit 1
          fi

          echo "Projection/lifecycle safety checks PASSED."

      # ============================================================
      # 12. COMPILE JAVA ONLY
      # ============================================================
      - name: Compile Java
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            compileDebugJavaWithJavac

      # ============================================================
      # 13. ASSEMBLE APK
      # ============================================================
      - name: Assemble Debug APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ============================================================
      # 14. FIND APK + SHA256
      # ============================================================
      - name: Locate APK and SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find \
            v10-source/app/build/outputs/apk/debug \
            -type f \
            -name '*.apk' \
            -print \
            -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          test -f "$APK"

          echo ""
          echo "=================================================="
          echo "APK"
          echo "=================================================="
          echo "$APK"

          echo ""
          echo "=================================================="
          echo "SHA256"
          echo "=================================================="

          sha256sum "$APK" | tee /tmp/apk-sha256.txt

      # ============================================================
      # 15. UPLOAD APK
      # ============================================================
      - name: Upload APK for Android Auto testing
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Display-Core-V1-Home-UI-SAFE
          path: v10-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 16. FINAL SUMMARY
      # ============================================================
      - name: Final build summary
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find \
            v10-source/app/build/outputs/apk/debug \
            -type f \
            -name '*.apk' \
            -print \
            -quit)"

          echo ""
          echo "=================================================="
          echo "CarAssistant V10 SAFE BUILD COMPLETE"
          echo "=================================================="
          echo "APK: $APK"
          echo ""
          echo "SHA256:"
          sha256sum "$APK"
          echo ""
          echo "Artifact:"
          echo "CarAssistant-V10-Display-Core-V1-Home-UI-SAFE"
          echo ""
          echo "Protected Core/Persistence files:"
          echo "UNCHANGED"
          echo ""
          echo "Display Core V1:"
          echo "RESTORED"
          echo ""
          echo "Floating Touch:"
          echo "APPLIED"
          echo ""
          echo "Long Press:"
          echo "APPLIED"
          echo ""
          echo "Home UI:"
          echo "PATCHED ONLY"
          echo "=================================================="
