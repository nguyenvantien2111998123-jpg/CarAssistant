name: Build CarAssistant V10 Display Core V1 Home UI V1 SAFE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install PyYAML
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check PyYAML

      # ============================================================
      # STEP 1
      # THE ONLY SOURCE OF THE STABLE BASE IS:
      # build-v10-stable-base-freeze-v1.yml
      # ============================================================

      - name: Restore Stable Base V1
        shell: bash
        run: |
          set -euo pipefail

          BASELINE="9075636a7d5947c1b0eee49c2bd3fd0e1b6b0cf1"

          git fetch origin "$BASELINE" --depth=1

          rm -rf v10-source

          git checkout "$BASELINE" -- v10-source

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$SRC/V10ProjectionSession.java"
          test -f "$SRC/V10CarActivity.java"
          test -f "$SRC/V10SessionStore.java"

          if [ -f "$SRC/V10ProjectionService.java" ]; then
            echo "ERROR: V10ProjectionService.java exists."
            exit 1
          fi

          echo "Stable Base source restored."
          echo "BASELINE=$BASELINE"

      # ============================================================
      # STEP 2
      # RECREATE EXACT DISPLAY CORE V1 FROM THE FROZEN WORKFLOW
      # ============================================================

      - name: Rebuild Display Core V1 from Stable Freeze source
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/run_core.py <<'PY'
          from pathlib import Path
          import subprocess
          import yaml
          import sys

          workflow = Path(
              ".github/workflows/build-v10-stable-base-freeze-v1.yml"
          )

          data = yaml.safe_load(
              workflow.read_text(encoding="utf-8")
          )

          steps = data["jobs"]["stable-base"]["steps"]

          start_names = {
              "Create Display Core V1 from exact workflow"
          }

          found = False

          for step in steps:
              name = step.get("name", "")

              if name in start_names:
                  found = True

              if not found:
                  continue

              if name == "Create Display Core V1 from exact workflow":
                  print("Running exact frozen Display Core reconstruction.")
                  subprocess.run(
                      ["bash", "-euo", "pipefail", "-c", step["run"]],
                      check=True
                  )
                  break

          if not found:
              print("ERROR: Stable Freeze Display Core step not found.")
              sys.exit(1)
          PY

          python3 /tmp/run_core.py

      # ============================================================
      # STEP 3
      # RECOVER THE EXACT FLOATING TOUCH + SAFE LONG PRESS
      # FROM THE FROZEN STABLE WORKFLOW
      # ============================================================

      - name: Apply Floating Touch and SAFE Long Press from Stable Freeze
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/apply_stable_patches.py <<'PY'
          from pathlib import Path
          import subprocess
          import yaml
          import sys

          workflow = Path(
              ".github/workflows/build-v10-stable-base-freeze-v1.yml"
          )

          data = yaml.safe_load(
              workflow.read_text(encoding="utf-8")
          )

          wanted = {
              "Recover deleted Floating Touch workflow",
              "Apply historical Floating Touch patch",
              "Extract exact SAFE Long Press patch",
              "Apply exact SAFE Long Press patch",
          }

          for step in data["jobs"]["stable-base"]["steps"]:
              name = step.get("name", "")

              if name not in wanted:
                  continue

              run = step.get("run")

              if not run:
                  print("ERROR: missing run block:", name)
                  sys.exit(1)

              print("STABLE PATCH >", name)

              subprocess.run(
                  ["bash", "-euo", "pipefail", "-c", run],
                  check=True
              )

          print("Exact Stable Freeze Floating Touch/Long Press patches applied.")
          PY

          python3 /tmp/apply_stable_patches.py

      # ============================================================
      # STEP 4
      # FREEZE PROTECTED FILES BEFORE HOME UI PATCH
      # ============================================================

      - name: Freeze protected Core and Persistence files
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          sha256sum \
            "$SRC/V10DisplayController.java" \
            "$SRC/V10SurfaceManager.java" \
            "$SRC/V10TaskSession.java" \
            "$SRC/V10ProjectionSession.java" \
            "$SRC/V10SessionStore.java" \
            > /tmp/protected-before.sha256

          echo "Protected files frozen."

      # ============================================================
      # STEP 5
      # HOME UI ONLY
      #
      # No Display Core modification.
      # No Persistence modification.
      # No ProjectionSession modification.
      #
      # Real icons are loaded with ApplicationInfo.loadIcon().
      # ============================================================

      - name: Patch Home UI V1 with real application icons
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/patch_home_ui.py <<'PY'
          from pathlib import Path
          import sys

          file = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          text = file.read_text(encoding="utf-8")

          # ----------------------------------------------------------
          # Imports
          # ----------------------------------------------------------

          if "import android.content.pm.ApplicationInfo;" not in text:
              marker = "import android.content.pm.ResolveInfo;"
              if marker not in text:
                  raise SystemExit("ResolveInfo import not found.")
              text = text.replace(
                  marker,
                  marker + "\nimport android.content.pm.ApplicationInfo;",
                  1
              )

          if "import android.widget.ImageView;" not in text:
              marker = "import android.widget.FrameLayout;"
              if marker not in text:
                  raise SystemExit("FrameLayout import not found.")
              text = text.replace(
                  marker,
                  marker + "\nimport android.widget.ImageView;",
                  1
              )

          # ----------------------------------------------------------
          # Generic Java method replacement helper
          # ----------------------------------------------------------

          def find_method(source, signature):
              start = source.find(signature)

              if start < 0:
                  raise SystemExit(
                      "Method not found: " + signature
                  )

              brace = source.find("{", start)

              if brace < 0:
                  raise SystemExit(
                      "Opening brace not found: " + signature
                  )

              depth = 0
              in_string = False
              escaped = False
              line_comment = False
              block_comment = False

              i = brace

              while i < len(source):
                  c = source[i]
                  n = source[i + 1] if i + 1 < len(source) else ""

                  if line_comment:
                      if c == "\n":
                          line_comment = False

                  elif block_comment:
                      if c == "*" and n == "/":
                          block_comment = False
                          i += 1

                  elif in_string:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == '"':
                          in_string = False

                  else:
                      if c == "/" and n == "/":
                          line_comment = True
                          i += 1

                      elif c == "/" and n == "*":
                          block_comment = True
                          i += 1

                      elif c == '"':
                          in_string = True

                      elif c == "{":
                          depth += 1

                      elif c == "}":
                          depth -= 1

                          if depth == 0:
                              return start, i + 1

                  i += 1

              raise SystemExit(
                  "Closing brace not found: " + signature
              )

          # ----------------------------------------------------------
          # Remove clock/date fields.
          # ----------------------------------------------------------

          text = text.replace(
              "    private TextView clock;\n",
              ""
          )

          text = text.replace(
              "    private TextView date;\n",
              ""
          )

          # ----------------------------------------------------------
          # Remove clock update call.
          # ----------------------------------------------------------

          text = text.replace(
              "                    updateClock();\n\n",
              ""
          )

          # ----------------------------------------------------------
          # Replace buildDashboard().
          #
          # No logo.
          # No CarAssistant title.
          # No clock.
          # No date.
          # No SPEED.
          # No WEATHER.
          # ----------------------------------------------------------

          start, end = find_method(
              text,
              "private void buildDashboard("
          )

          dashboard = """private void buildDashboard() {
              dashboard =
                      new LinearLayout(this);

              dashboard.setOrientation(
                      LinearLayout.VERTICAL);

              launcherLayer.addView(
                      dashboard,
                      new LinearLayout.LayoutParams(
                              -1,
                              -1));

              LinearLayout content =
                      new LinearLayout(this);

              content.setOrientation(
                      LinearLayout.VERTICAL);

              LinearLayout map =
                      card();

              map.addView(
                      text(
                              "MAP",
                              12,
                              Color.LTGRAY));

              TextView mapText =
                      text(
                              "Navigation",
                              28,
                              Color.WHITE);

              mapText.setGravity(
                      Gravity.CENTER);

              map.addView(
                      mapText,
                      new LinearLayout.LayoutParams(
                              -1,
                              0,
                              1));

              content.addView(
                      map,
                      new LinearLayout.LayoutParams(
                              -1,
                              0,
                              2));

              LinearLayout info =
                      new LinearLayout(this);

              info.setOrientation(
                      LinearLayout.HORIZONTAL);

              info.addView(
                      infoCard(
                              "MEDIA",
                              "No media"),
                      weightParams());

              info.addView(
                      infoCard(
                              "STATUS",
                              "Ready"),
                      weightParams());

              info.addView(
                      infoCard(
                              "APPS",
                              String.valueOf(apps.size())),
                      weightParams());

              content.addView(
                      info,
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(120)));

              dashboard.addView(
                      content,
                      new LinearLayout.LayoutParams(
                              -1,
                              0,
                              1));

              LinearLayout dockRow =
                      new LinearLayout(this);

              dockRow.setGravity(
                      Gravity.CENTER_VERTICAL);

              dock =
                      new LinearLayout(this);

              dock.setGravity(
                      Gravity.CENTER_VERTICAL);

              dockRow.addView(
                      dock,
                      new LinearLayout.LayoutParams(
                              0,
                              -1,
                              1));

              TextView appsButton =
                      buttonText("APPS");

              appsButton.setOnClickListener(
                      v -> showApps());

              dockRow.addView(
                      appsButton,
                      new LinearLayout.LayoutParams(
                              dp(90),
                              dp(58)));

              dashboard.addView(
                      dockRow,
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(70)));
          }"""

          text = text[:start] + dashboard + text[end:]

          # ----------------------------------------------------------
          # Replace rebuildDock().
          #
          # Dock now shows REAL application icons.
          # ----------------------------------------------------------

          start, end = find_method(
              text,
              "private void rebuildDock("
          )

          dock_method = """private void rebuildDock() {
              if (dock == null) {
                  return;
              }

              dock.removeAllViews();

              int count =
                      Math.min(
                              5,
                              apps.size());

              for (int i = 0;
                   i < count;
                   i++) {

                  final AppInfo app =
                          apps.get(i);

                  LinearLayout tile =
                          new LinearLayout(this);

                  tile.setOrientation(
                          LinearLayout.VERTICAL);

                  tile.setGravity(
                          Gravity.CENTER);

                  GradientDrawable bg =
                          new GradientDrawable();

                  bg.setColor(
                          Color.rgb(
                                  29,
                                  35,
                                  42));

                  bg.setCornerRadius(
                          dp(14));

                  tile.setBackground(bg);

                  ImageView icon =
                          new ImageView(this);

                  try {
                      ApplicationInfo applicationInfo =
                              getPackageManager()
                                      .getApplicationInfo(
                                              app.component
                                                      .getPackageName(),
                                              0);

                      icon.setImageDrawable(
                              applicationInfo.loadIcon(
                                      getPackageManager()));
                  } catch (Throwable ignored) {
                      icon.setImageResource(
                              android.R.drawable
                                      .sym_def_app_icon);
                  }

                  icon.setScaleType(
                          ImageView.ScaleType
                                  .CENTER_INSIDE);

                  tile.addView(
                          icon,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(34)));

                  TextView label =
                          text(
                                  app.name,
                                  10,
                                  Color.WHITE);

                  label.setGravity(
                          Gravity.CENTER);

                  label.setMaxLines(1);

                  tile.addView(
                          label,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(20)));

                  tile.setOnClickListener(
                          v ->
                                  launchProjection(
                                          app.component));

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(58),
                                  1f);

                  params.setMargins(
                          dp(3),
                          0,
                          dp(3),
                          0);

                  dock.addView(
                          tile,
                          params);
              }
          }"""

          text = text[:start] + dock_method + text[end:]

          # ----------------------------------------------------------
          # Replace appTile().
          #
          # Application list now uses real icons.
          # ----------------------------------------------------------

          start, end = find_method(
              text,
              "private LinearLayout appTile("
          )

          app_tile = """private LinearLayout appTile(
                  AppInfo app) {

              LinearLayout tile =
                      new LinearLayout(this);

              tile.setOrientation(
                      LinearLayout.VERTICAL);

              tile.setGravity(
                      Gravity.CENTER);

              GradientDrawable bg =
                      new GradientDrawable();

              bg.setColor(
                      Color.rgb(
                              22,
                              27,
                              33));

              bg.setCornerRadius(
                      dp(16));

              tile.setBackground(bg);

              ImageView icon =
                      new ImageView(this);

              try {
                  ApplicationInfo applicationInfo =
                          getPackageManager()
                                  .getApplicationInfo(
                                          app.component
                                                  .getPackageName(),
                                          0);

                  icon.setImageDrawable(
                          applicationInfo.loadIcon(
                                  getPackageManager()));

              } catch (Throwable ignored) {

                  icon.setImageResource(
                          android.R.drawable
                                  .sym_def_app_icon);
              }

              icon.setScaleType(
                      ImageView.ScaleType
                              .CENTER_INSIDE);

              icon.setPadding(
                      dp(8),
                      dp(6),
                      dp(8),
                      dp(6));

              tile.addView(
                      icon,
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(58)));

              TextView name =
                      text(
                              app.name,
                              12,
                              Color.WHITE);

              name.setGravity(
                      Gravity.CENTER);

              name.setMaxLines(2);

              tile.addView(
                      name,
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(42)));

              tile.setOnClickListener(
                      v -> {

                          hideApps();

                          launchProjection(
                                  app.component);
                      });

              return tile;
          }"""

          text = text[:start] + app_tile + text[end:]

          # ----------------------------------------------------------
          # Safety checks against old Home UI.
          # ----------------------------------------------------------

          forbidden = [
              'text(\n                        "CAR ASSISTANT"',
              'text(\n                        "SPEED"',
              'text(\n                        "WEATHER"',
              'initial(app.name)',
              'clock =',
              'date ='
          ]

          for item in forbidden:
              if item in text:
                  raise SystemExit(
                      "Forbidden old Home UI remains: " + item
                  )

          required = [
              "import android.content.pm.ApplicationInfo;",
              "import android.widget.ImageView;",
              "loadIcon(",
              "ImageView.ScaleType.CENTER_INSIDE",
              'buttonText("APPS")'
          ]

          for item in required:
              if item not in text:
                  raise SystemExit(
                      "Required Home UI marker missing: " + item
                  )

          file.write_text(
              text,
              encoding="utf-8"
          )

          print("Home UI V1 SAFE patch completed.")
          PY

          python3 /tmp/patch_home_ui.py

      # ============================================================
      # STEP 6
      # VERIFY HOME UI ONLY
      # ============================================================

      - name: Verify Home UI V1 SAFE
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq "import android.content.pm.ApplicationInfo;" "$FILE"
          grep -Fq "import android.widget.ImageView;" "$FILE"
          grep -Fq "loadIcon(" "$FILE"
          grep -Fq "ImageView.ScaleType.CENTER_INSIDE" "$FILE"
          grep -Fq 'buttonText("APPS")' "$FILE"

          if grep -Fq "CAR ASSISTANT" "$FILE"; then
            echo "ERROR: Old CAR ASSISTANT header remains."
            exit 1
          fi

          if grep -Fq '"SPEED"' "$FILE"; then
            echo "ERROR: Old SPEED card remains."
            exit 1
          fi

          if grep -Fq '"WEATHER"' "$FILE"; then
            echo "ERROR: Old WEATHER card remains."
            exit 1
          fi

          if grep -Fq "clock =" "$FILE"; then
            echo "ERROR: Clock field remains."
            exit 1
          fi

          if grep -Fq "date =" "$FILE"; then
            echo "ERROR: Date field remains."
            exit 1
          fi

          if grep -Fq "initial(app.name)" "$FILE"; then
            echo "ERROR: Letter-based icon remains."
            exit 1
          fi

          echo "Home UI V1 SAFE verification PASSED."

      # ============================================================
      # STEP 7
      # CORE / PERSISTENCE MUST BE BYTE-FOR-BYTE UNCHANGED
      # ============================================================

      - name: Verify Core and Persistence isolation
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          sha256sum \
            "$SRC/V10DisplayController.java" \
            "$SRC/V10SurfaceManager.java" \
            "$SRC/V10TaskSession.java" \
            "$SRC/V10ProjectionSession.java" \
            "$SRC/V10SessionStore.java" \
            > /tmp/protected-after.sha256

          diff -u \
            /tmp/protected-before.sha256 \
            /tmp/protected-after.sha256

          if grep -Fq "V10ProjectionService" \
              "$SRC/V10ProjectionSession.java"; then
            echo "ERROR: V10ProjectionService found."
            exit 1
          fi

          if grep -Fq "am force-stop" \
              "$SRC/V10ProjectionSession.java"; then
            echo "ERROR: am force-stop found."
            exit 1
          fi

          echo "Core/Persistence isolation PASSED."

      # ============================================================
      # STEP 8
      # FLOATING TOUCH MUST REMAIN INTACT
      # ============================================================

      - name: Verify Floating Touch SAFE integrity
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq "floatingTouchKey" "$FILE"
          grep -Fq "createFloatingTouchKey()" "$FILE"
          grep -Fq "floatingDownTime" "$FILE"
          grep -Fq "ViewConfiguration.getLongPressTimeout()" "$FILE"
          grep -Fq 'addFloatingMenuButton("BACK"' "$FILE"
          grep -Fq 'addFloatingMenuButton("HOME"' "$FILE"

          if grep -Fq "floatingLastTap" "$FILE"; then
            echo "ERROR: Old floatingLastTap remains."
            exit 1
          fi

          if grep -Fq 'session.recents()' "$FILE"; then
            echo "ERROR: RECENTS logic remains."
            exit 1
          fi

          if grep -Fq '"RECENTS"' "$FILE"; then
            echo "ERROR: RECENTS menu remains."
            exit 1
          fi

          if grep -Fq '"2 SCREEN"' "$FILE"; then
            echo "ERROR: 2 SCREEN remains."
            exit 1
          fi

          if grep -Fq '"3 SCREEN"' "$FILE"; then
            echo "ERROR: 3 SCREEN remains."
            exit 1
          fi

          echo "Floating Touch SAFE integrity PASSED."

      # ============================================================
      # STEP 9
      # COMPILE
      # ============================================================

      - name: Compile Java
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            compileDebugJavaWithJavac

      # ============================================================
      # STEP 10
      # ASSEMBLE
      # ============================================================

      - name: Assemble APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ============================================================
      # STEP 11
      # APK + SHA256
      # ============================================================

      - name: Locate APK and SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find v10-source \
              -type f \
              -path '*/build/outputs/apk/*/*.apk' \
              -print \
              -quit
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          cp \
            "$APK" \
            CarAssistant-V10-Display-Core-V1-Home-UI-V1-Safe.apk

          SHA="$(
            sha256sum \
              CarAssistant-V10-Display-Core-V1-Home-UI-V1-Safe.apk \
              | awk '{print $1}'
          )"

          printf '%s\n' "$SHA" \
            > CarAssistant-V10-Display-Core-V1-Home-UI-V1-Safe.sha256

          echo "APK:"
          echo "CarAssistant-V10-Display-Core-V1-Home-UI-V1-Safe.apk"

          echo "SHA256:"
          echo "$SHA"

      # ============================================================
      # STEP 12
      # MANIFEST
      # ============================================================

      - name: Create SAFE manifest
        shell: bash
        run: |
          set -euo pipefail

          cat > Home-UI-V1-SAFE-MANIFEST.txt <<'EOF'
          CarAssistant V10 Display Core V1 - Home UI V1 SAFE

          SOURCE
          .github/workflows/build-v10-stable-base-freeze-v1.yml

          BASELINE
          V10-6A:
          9075636a7d5947c1b0eee49c2bd3fd0e1b6b0cf1

          STABLE BASE
          Exact Stable Base Freeze V1.

          DISPLAY CORE
          Kept unchanged after Stable Base reconstruction.

          PERSISTENCE
          V10SessionStore kept unchanged.

          PROJECTION
          V10ProjectionSession kept unchanged.

          FLOATING TOUCH
          Exact Stable Freeze Floating Touch + SAFE Long Press.

          HOME UI
          Presentation-only V1 patch.

          REMOVED FROM HOME
          CA logo/header.
          CarAssistant title.
          Clock.
          Date.
          SPEED.
          WEATHER.

          APPLICATION ICONS
          Real Android application icons.
          ApplicationInfo.loadIcon().
          PackageManager.

          LEGACY NOT ADDED
          No RECENTS.
          No 2 SCREEN.
          No 3 SCREEN.
          No V10ProjectionService.
          No am force-stop.

          PROTECTED FILES
          V10DisplayController.java
          V10SurfaceManager.java
          V10TaskSession.java
          V10ProjectionSession.java
          V10SessionStore.java

          PURPOSE
          Safe isolated Home UI test build.
          EOF

      # ============================================================
      # STEP 13
      # UPLOAD
      # ============================================================

      - name: Upload Safe APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Display-Core-V1-Home-UI-V1-Safe
          path: |
            CarAssistant-V10-Display-Core-V1-Home-UI-V1-Safe.apk
            CarAssistant-V10-Display-Core-V1-Home-UI-V1-Safe.sha256
            Home-UI-V1-SAFE-MANIFEST.txt
          if-no-files-found: error
          retention-days: 14
