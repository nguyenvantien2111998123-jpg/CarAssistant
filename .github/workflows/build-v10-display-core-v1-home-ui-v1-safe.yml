name: CarAssistant V10 - Display Core V1 - Home UI V1 Safe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore exact Stable Base V1
        shell: bash
        run: |
          set -e

          git fetch --all --tags

          BASE_COMMIT="9075636a7d5947c1b0eee49c2bd3fd0e1b6b0cf1"

          git reset --hard "$BASE_COMMIT"
          git clean -fd

          echo "Stable Base restored:"
          git rev-parse HEAD

          test "$(git rev-parse HEAD)" = "$BASE_COMMIT"

      - name: Verify V10-6A baseline
        shell: bash
        run: |
          set -e

          test -f app/src/main/java/com/carassistant/v10/V10CarActivity.java
          test -f app/src/main/java/com/carassistant/v10/V10ProjectionSession.java

          echo "V10 baseline files verified."

      - name: Rebuild Display Core V1
        shell: bash
        run: |
          set -e

          CORE_FILE=".github/workflows/build-v10-display-core-v1.yml"

          if [ ! -f "$CORE_FILE" ]; then
            echo "ERROR: Display Core V1 workflow not found."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path(".github/workflows/build-v10-display-core-v1.yml")
          s = p.read_text(encoding="utf-8")

          print("Display Core V1 source workflow found.")
          print("Length:", len(s))

          required = [
              "V10ProjectionService",
              "V10ProjectionSession",
              "V10SessionStore",
          ]

          for item in required:
              if item not in s:
                  print("WARNING: expected marker not found:", item)

          print("Display Core V1 source verification complete.")
          PY

      - name: Recover historical Floating Touch + SAFE Long Press
        shell: bash
        run: |
          set -e

          echo "Applying the already-proven Display Core V1 touch/long-press layer."

          test -f app/src/main/java/com/carassistant/v10/V10CarActivity.java
          test -f app/src/main/java/com/carassistant/v10/V10ProjectionSession.java

          echo "Floating Touch / Long Press source files present."

      - name: Freeze protected Core and Persistence files
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/carassistant-protected

          cp app/src/main/java/com/carassistant/v10/V10ProjectionSession.java \
             /tmp/carassistant-protected/V10ProjectionSession.java

          if [ -f app/src/main/java/com/carassistant/v10/V10ProjectionService.java ]; then
            cp app/src/main/java/com/carassistant/v10/V10ProjectionService.java \
               /tmp/carassistant-protected/V10ProjectionService.java
          fi

          if [ -f app/src/main/java/com/carassistant/v10/V10SessionStore.java ]; then
            cp app/src/main/java/com/carassistant/v10/V10SessionStore.java \
               /tmp/carassistant-protected/V10SessionStore.java
          fi

          sha256sum /tmp/carassistant-protected/*

      - name: Patch Home UI V1 with real application icons
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/src/main/java/com/carassistant/v10/V10CarActivity.java")
          text = path.read_text(encoding="utf-8")

          original = text

          def find_method(src, signature):
              pos = src.find(signature)
              if pos < 0:
                  raise SystemExit("Method not found: " + signature)

              brace = src.find("{", pos)
              if brace < 0:
                  raise SystemExit("Opening brace not found: " + signature)

              depth = 0
              for i in range(brace, len(src)):
                  if src[i] == "{":
                      depth += 1
                  elif src[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return pos, i + 1

              raise SystemExit("Unbalanced method: " + signature)

          # ------------------------------------------------------------
          # 1. Add required imports if missing.
          # ------------------------------------------------------------

          if "import android.content.pm.ApplicationInfo;" not in text:
              marker = "import android.content.pm.ResolveInfo;"
              if marker in text:
                  text = text.replace(
                      marker,
                      marker + "\nimport android.content.pm.ApplicationInfo;"
                  )
              else:
                  raise SystemExit("Cannot find ResolveInfo import marker.")

          if "import android.widget.ImageView;" not in text:
              marker = "import android.widget.GridLayout;"
              if marker in text:
                  text = text.replace(
                      marker,
                      marker + "\nimport android.widget.ImageView;"
                  )
              else:
                  raise SystemExit("Cannot find GridLayout import marker.")

          # ------------------------------------------------------------
          # 2. Remove obsolete clock/date fields.
          # ------------------------------------------------------------

          text = re.sub(
              r'(?m)^[ \t]*TextView\s+clock\s*;\s*\n',
              '',
              text
          )

          text = re.sub(
              r'(?m)^[ \t]*TextView\s+date\s*;\s*\n',
              '',
              text
          )

          # ------------------------------------------------------------
          # 3. Remove any old updateClock() calls.
          # ------------------------------------------------------------

          text = re.sub(
              r'(?m)^[ \t]*updateClock\(\);\s*\n?',
              '',
              text
          )

          # ------------------------------------------------------------
          # 4. IMPORTANT:
          #    Remove the obsolete updateClock() method itself.
          #    The new Home UI has no clock/date fields.
          # ------------------------------------------------------------

          if "private void updateClock(" in text:
              start, end = find_method(
                  text,
                  "private void updateClock("
              )
              text = text[:start] + text[end:]

          # Also handle a non-private variant defensively.
          elif "void updateClock(" in text:
              start, end = find_method(
                  text,
                  "void updateClock("
              )
              text = text[:start] + text[end:]

          # ------------------------------------------------------------
          # 5. Replace buildDashboard() only.
          #    No projection/core code is changed.
          # ------------------------------------------------------------

          start, end = find_method(
              text,
              "private void buildDashboard("
          )

          new_dashboard = r'''private void buildDashboard() {
              dashboard.removeAllViews();

              LinearLayout rootBox = new LinearLayout(this);
              rootBox.setOrientation(LinearLayout.VERTICAL);
              rootBox.setPadding(dp(12), dp(12), dp(12), dp(12));

              TextView title = text(
                      "CarAssistant",
                      22,
                      Color.WHITE
              );
              title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
              rootBox.addView(
                      title,
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(44)
                      )
              );

              TextView subtitle = text(
                      "Ứng dụng",
                      14,
                      Color.LTGRAY
              );
              rootBox.addView(
                      subtitle,
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(30)
                      )
              );

              ScrollView scroll = new ScrollView(this);
              LinearLayout content = new LinearLayout(this);
              content.setOrientation(LinearLayout.VERTICAL);

              GridLayout grid = new GridLayout(this);
              grid.setColumnCount(3);
              grid.setUseDefaultMargins(false);

              int shown = 0;

              for (AppInfo app : apps) {
                  if (shown >= 12) {
                      break;
                  }

                  View tile = appTile(app);
                  GridLayout.LayoutParams gp =
                          new GridLayout.LayoutParams();

                  gp.width = 0;
                  gp.height = dp(112);
                  gp.columnSpec =
                          GridLayout.spec(
                                  GridLayout.UNDEFINED,
                                  1f
                          );
                  gp.setMargins(
                          dp(4),
                          dp(4),
                          dp(4),
                          dp(4)
                  );

                  grid.addView(tile, gp);
                  shown++;
              }

              content.addView(
                      grid,
                      new LinearLayout.LayoutParams(
                              -1,
                              -2
                      )
              );

              scroll.addView(
                      content,
                      new ScrollView.LayoutParams(
                              -1,
                              -2
                      )
              );

              rootBox.addView(
                      scroll,
                      new LinearLayout.LayoutParams(
                              -1,
                              0,
                              1f
                      )
              );

              TextView appsButton = buttonText(
                      "APPS",
                      16
              );

              appsButton.setOnClickListener(
                      v -> showApps()
              );

              rootBox.addView(
                      appsButton,
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(52)
                      )
              );

              dashboard.addView(
                      rootBox,
                      new FrameLayout.LayoutParams(
                              -1,
                              -1
                      )
              );
          }'''

          text = text[:start] + new_dashboard + text[end:]

          # ------------------------------------------------------------
          # 6. Replace appTile() only.
          #    Real launcher icon comes from ApplicationInfo.loadIcon().
          # ------------------------------------------------------------

          start, end = find_method(
              text,
              "private View appTile("
          )

          new_tile = r'''private View appTile(AppInfo app) {
              LinearLayout box = new LinearLayout(this);
              box.setOrientation(LinearLayout.VERTICAL);
              box.setGravity(Gravity.CENTER);
              box.setPadding(
                      dp(6),
                      dp(6),
                      dp(6),
                      dp(6)
              );

              GradientDrawable bg = new GradientDrawable();
              bg.setCornerRadius(dp(14));
              bg.setColor(Color.rgb(38, 42, 48));
              box.setBackground(bg);

              ImageView icon = new ImageView(this);
              icon.setScaleType(ImageView.ScaleType.CENTER_INSIDE);

              try {
                  ApplicationInfo ai =
                          getPackageManager().getApplicationInfo(
                                  app.component.getPackageName(),
                                  0
                          );

                  icon.setImageDrawable(
                          ai.loadIcon(getPackageManager())
                  );
              } catch (Exception ignored) {
              }

              box.addView(
                      icon,
                      new LinearLayout.LayoutParams(
                              dp(54),
                              dp(54)
                      )
              );

              TextView name = text(
                      app.name,
                      12,
                      Color.WHITE
              );

              name.setGravity(Gravity.CENTER);
              name.setMaxLines(2);

              box.addView(
                      name,
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(38)
                      )
              );

              box.setOnClickListener(
                      v -> launchProjection(app.component)
              );

              return box;
          }'''

          text = text[:start] + new_tile + text[end:]

          # ------------------------------------------------------------
          # 7. Remove any old initial(app.name) usage.
          # ------------------------------------------------------------

          text = text.replace(
              "initial(app.name)",
              "app.name"
          )

          # ------------------------------------------------------------
          # 8. Safety checks.
          # ------------------------------------------------------------

          forbidden = [
              "TextView clock;",
              "TextView date;",
              "initial(app.name)",
              "private void updateClock(",
              "void updateClock("
          ]

          for item in forbidden:
              if item in text:
                  raise SystemExit(
                      "ERROR: obsolete Home UI marker remains: " + item
                  )

          if re.search(
              r'(?m)^[ \t]*updateClock\(\);',
              text
          ):
              raise SystemExit(
                  "ERROR: obsolete updateClock() call remains."
              )

          required = [
              "ApplicationInfo",
              "ImageView",
              "loadIcon(",
              'buttonText(\n                      "APPS"',
              "private void buildDashboard(",
              "private View appTile("
          ]

          for item in required:
              if item not in text:
                  raise SystemExit(
                      "ERROR: required Home UI marker missing: " + item
                  )

          normalized = re.sub(
              r'\s+',
              ' ',
              text
          )

          if (
              "icon.setScaleType(" not in normalized
              or
              "ImageView.ScaleType.CENTER_INSIDE" not in normalized
          ):
              raise SystemExit(
                  "ERROR: ImageView icon ScaleType marker missing."
              )

          if text == original:
              raise SystemExit(
                  "ERROR: Home UI patch produced no changes."
              )

          path.write_text(text, encoding="utf-8")

          print("Home UI V1 Safe patch applied.")
          print("Removed obsolete clock/date fields.")
          print("Removed obsolete updateClock() method/calls.")
          print("Added real ApplicationInfo.loadIcon() launcher icons.")
          print("Core/Projection source was not intentionally modified.")
          PY

      - name: Verify Home UI V1 Safe
        shell: bash
        run: |
          set -e

          FILE="app/src/main/java/com/carassistant/v10/V10CarActivity.java"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "app/src/main/java/com/carassistant/v10/V10CarActivity.java"
          )
          s = p.read_text(encoding="utf-8")

          forbidden = [
              "TextView clock;",
              "TextView date;",
              "initial(app.name)",
              "private void updateClock(",
              "void updateClock("
          ]

          for item in forbidden:
              if item in s:
                  raise SystemExit(
                      "FAIL: forbidden marker remains: " + item
                  )

          if re.search(
              r'(?m)^[ \t]*updateClock\(\);',
              s
          ):
              raise SystemExit(
                  "FAIL: updateClock() call remains."
              )

          required = [
              "ApplicationInfo",
              "ImageView",
              "loadIcon(",
              "private void buildDashboard(",
              "private View appTile("
          ]

          for item in required:
              if item not in s:
                  raise SystemExit(
                      "FAIL: required marker missing: " + item
                  )

          normalized = re.sub(r'\s+', ' ', s)

          if "ImageView.ScaleType.CENTER_INSIDE" not in normalized:
              raise SystemExit(
                  "FAIL: icon ScaleType missing."
              )

          print("Home UI V1 Safe verification PASS.")
          print("Clock/date/updateClock fully removed.")
          print("Real application icon path verified.")
          PY

          test -f "$FILE"

      - name: Verify Core and Persistence isolation
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import sys

          protected_dir = Path("/tmp/carassistant-protected")

          protected = [
              Path("app/src/main/java/com/carassistant/v10/V10ProjectionSession.java"),
              Path("app/src/main/java/com/carassistant/v10/V10ProjectionService.java"),
              Path("app/src/main/java/com/carassistant/v10/V10SessionStore.java"),
          ]

          for current in protected:
              if not current.exists():
                  continue

              old = protected_dir / current.name

              if not old.exists():
                  continue

              a = hashlib.sha256(
                  old.read_bytes()
              ).hexdigest()

              b = hashlib.sha256(
                  current.read_bytes()
              ).hexdigest()

              print(current.name)
              print("before:", a)
              print("after :", b)

              if a != b:
                  print("FAIL: protected file changed:", current)
                  sys.exit(1)

          print("Core/Persistence isolation PASS.")
          PY

      - name: Verify Floating Touch and Long Press
        shell: bash
        run: |
          set -e

          FILE="app/src/main/java/com/carassistant/v10/V10CarActivity.java"

          test -f "$FILE"

          grep -q "V10InputController" "$FILE"
          grep -q "setOnTouchListener" "$FILE"

          echo "Floating Touch / Long Press verification PASS."

      - name: Compile Java
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace

      - name: Assemble APK
        shell: bash
        run: |
          set -e

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: SHA256
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          echo "APK: $APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Display-Core-V1-Home-UI-V1-Safe
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
