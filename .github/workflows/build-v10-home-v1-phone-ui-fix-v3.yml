    private final class MapBackground
            extends View {

        private final Paint gridPaint =
                new Paint(
                        Paint.ANTI_ALIAS_FLAG
                );

        private final Paint roadPaint =
                new Paint(
                        Paint.ANTI_ALIAS_FLAG
                );

        private final Paint markerPaint =
                new Paint(
                        Paint.ANTI_ALIAS_FLAG
                );

        private final Path road =
                new Path();

        MapBackground(
                android.content.Context context) {

            super(context);

            gridPaint.setColor(
                    Color.rgb(28, 42, 48)
            );

            gridPaint.setStrokeWidth(
                    dp(1)
            );

            roadPaint.setColor(
                    Color.rgb(48, 62, 70)
            );

            roadPaint.setStyle(
                    Paint.Style.STROKE
            );

            roadPaint.setStrokeWidth(
                    dp(14)
            );

            roadPaint.setStrokeCap(
                    Paint.Cap.ROUND
            );

            markerPaint.setColor(
                    Color.WHITE
            );

            markerPaint.setStyle(
                    Paint.Style.FILL
            );
        }

        @Override
        protected void onDraw(
                Canvas canvas) {

            super.onDraw(canvas);

            canvas.drawColor(
                    Color.rgb(10, 18, 23)
            );

            int width = getWidth();
            int height = getHeight();

            int step = dp(38);

            for (
                    int x = 0;
                    x < width;
                    x += step
            ) {
                canvas.drawLine(
                        x,
                        0,
                        x,
                        height,
                        gridPaint
                );
            }

            for (
                    int y = 0;
                    y < height;
                    y += step
            ) {
                canvas.drawLine(
                        0,
                        y,
                        width,
                        y,
                        gridPaint
                );
            }

            road.reset();

            road.moveTo(
                    0,
                    height * 0.72f
            );

            road.cubicTo(
                    width * 0.25f,
                    height * 0.55f,
                    width * 0.52f,
                    height * 0.78f,
                    width,
                    height * 0.35f
            );

            roadPaint.setStrokeWidth(
                    dp(14)
            );

            roadPaint.setColor(
                    Color.rgb(48, 62, 70)
            );

            canvas.drawPath(
                    road,
                    roadPaint
            );

            roadPaint.setStrokeWidth(
                    dp(2)
            );

            roadPaint.setColor(
                    Color.rgb(82, 99, 108)
            );

            canvas.drawPath(
                    road,
                    roadPaint
            );

            float markerX =
                    width * 0.52f;

            float markerY =
                    height * 0.58f;

            canvas.drawCircle(
                    markerX,
                    markerY,
                    dp(8),
                    markerPaint
            );

            Paint labelPaint =
                    new Paint(
                            Paint.ANTI_ALIAS_FLAG
                    );

            labelPaint.setColor(
                    Color.rgb(
                            135,
                            151,
                            158
                    )
            );

            labelPaint.setTextSize(
                    dp(10)
            );

            canvas.drawText(
                    "ROAD",
                    width * 0.22f,
                    height * 0.45f,
                    labelPaint
            );

            canvas.drawText(
                    "CITY",
                    width * 0.72f,
                    height * 0.24f,
                    labelPaint
            );
        }
    }

'''

