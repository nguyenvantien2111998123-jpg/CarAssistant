name: Build Car Assistant V10 - Home V1 Phone UI Fix V3.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-v1-phone-ui-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: 0634e1f5ced143fdd931022b32bf9a19cbf6e2bd
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify exact baseline
        shell: bash
        run: |
          set -euo pipefail
          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"

          test -f "$FILE"
          test "$(git rev-parse HEAD)" = "0634e1f5ced143fdd931022b32bf9a19cbf6e2bd"

          SHA="$(sha256sum "$FILE" | cut -d' ' -f1)"
          test "$SHA" = "f2a7c48c8e2d5c0e5a2c6b2a7c4b6d9d7a7e4f8f2c7c1e7b2a0e6c4f8a5d9e1a"

          grep -Fq 'class V10LauncherActivity' "$FILE"
          grep -Fq 'private void buildDashboard()' "$FILE"
          grep -Fq 'private void loadApps()' "$FILE"
          grep -Fq 'private LinearLayout appTile(' "$FILE"
          grep -Fq 'V10SessionStore.setTarget' "$FILE"
          grep -Fq 'initial(app.name)' "$FILE"

          echo "Baseline verified."
          echo "Commit: $(git rev-parse HEAD)"
          echo "File SHA256: $SHA"

      - name: Patch V10LauncherActivity
        shell: bash
        run: |
          set -euo pipefail
          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          original = s

          def method(text, sig, new):
              start = text.find(sig)
              if start < 0:
                  raise SystemExit("METHOD NOT FOUND: " + sig)
              brace = text.find("{", start)
              if brace < 0:
                  raise SystemExit("OPEN BRACE NOT FOUND: " + sig)
              depth = 0
              end = -1
              for i in range(brace, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end < 0:
                  raise SystemExit("CLOSE BRACE NOT FOUND: " + sig)
              return text[:start] + new.strip() + text[end:]

          def once(text, old, new, name):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{name}: expected 1 match, got {n}")
              return text.replace(old, new, 1)

          # Imports
          s = once(
              s,
              "import android.graphics.Color;\n",
              "import android.graphics.Canvas;\n"
              "import android.graphics.Color;\n"
              "import android.graphics.Paint;\n"
              "import android.graphics.Path;\n",
              "graphics imports"
          )

          s = once(
              s,
              "import android.graphics.drawable.GradientDrawable;\n",
              "import android.graphics.drawable.Drawable;\n"
              "import android.graphics.drawable.GradientDrawable;\n",
              "drawable import"
          )

          s = once(
              s,
              "import android.view.Gravity;\n",
              "import android.view.Gravity;\n"
              "import android.widget.FrameLayout;\n"
              "import android.widget.ImageView;\n",
              "view imports"
          )

          # Dashboard
          dashboard = r'''
          private void buildDashboard() {
              dashboard.removeAllViews();

              LinearLayout top = new LinearLayout(this);
              top.setGravity(Gravity.CENTER_VERTICAL);
              top.setPadding(dp(10), dp(6), dp(10), dp(6));
              top.setBackground(roundBg(Color.rgb(18,24,32), dp(14)));

              LinearLayout titleBox = new LinearLayout(this);
              titleBox.setOrientation(LinearLayout.VERTICAL);

              TextView title = text("CAR ASSISTANT", 18, Color.WHITE);
              title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
              titleBox.addView(title);

              date = text("", 11, Color.LTGRAY);
              titleBox.addView(date);

              top.addView(titleBox,
                      new LinearLayout.LayoutParams(0, -2, 1f));

              clock = text("", 20, Color.WHITE);
              clock.setGravity(Gravity.CENTER);
              top.addView(clock,
                      new LinearLayout.LayoutParams(dp(100), dp(55)));

              dashboard.addView(top,
                      new LinearLayout.LayoutParams(-1, dp(66)));

              LinearLayout main = new LinearLayout(this);
              main.setOrientation(LinearLayout.HORIZONTAL);
              main.setPadding(0, dp(8), 0, dp(8));

              main.addView(buildSidebar(),
                      new LinearLayout.LayoutParams(dp(72), -1));

              LinearLayout content = new LinearLayout(this);
              content.setOrientation(LinearLayout.VERTICAL);
              content.setPadding(dp(8), 0, 0, 0);

              FrameLayout map = new FrameLayout(this);
              map.setBackground(roundBg(Color.rgb(9,17,23), dp(16)));
              map.addView(new MapBackground(this),
                      new FrameLayout.LayoutParams(-1, -1));

              TextView mapTitle = text("MAP", 12, Color.WHITE);
              mapTitle.setGravity(Gravity.CENTER);
              mapTitle.setBackground(
                      roundBg(Color.rgb(24,32,42), dp(10)));

              FrameLayout.LayoutParams mp =
                      new FrameLayout.LayoutParams(dp(70), dp(38));
              mp.gravity = Gravity.TOP | Gravity.LEFT;
              mp.setMargins(dp(10), dp(10), 0, 0);
              map.addView(mapTitle, mp);

              TextView nav = text("Navigation\nReady", 12, Color.LTGRAY);
              nav.setGravity(Gravity.CENTER);
              nav.setBackground(
                      roundBg(Color.rgb(18,25,33), dp(10)));

              FrameLayout.LayoutParams np =
                      new FrameLayout.LayoutParams(dp(120), dp(58));
              np.gravity = Gravity.BOTTOM | Gravity.LEFT;
              np.setMargins(dp(10), 0, 0, dp(10));
              map.addView(nav, np);

              content.addView(map,
                      new LinearLayout.LayoutParams(-1, 0, 1f));

              LinearLayout info = new LinearLayout(this);
              info.setOrientation(LinearLayout.HORIZONTAL);
              info.setPadding(0, dp(6), 0, 0);

              info.addView(infoCard("SPEED", "0 km/h"),
                      new LinearLayout.LayoutParams(0, dp(54), 1f));
              info.addView(infoCard("WEATHER", "-- °C"),
                      new LinearLayout.LayoutParams(0, dp(54), 1f));
              info.addView(infoCard("MEDIA", "No media"),
                      new LinearLayout.LayoutParams(0, dp(54), 1f));

              content.addView(info);

              main.addView(content,
                      new LinearLayout.LayoutParams(0, -1, 1f));

              dashboard.addView(main,
                      new LinearLayout.LayoutParams(-1, 0, 1f));

              LinearLayout bottom = new LinearLayout(this);
              bottom.setGravity(Gravity.CENTER_VERTICAL);
              bottom.setPadding(dp(6), dp(5), dp(6), dp(5));
              bottom.setBackground(roundBg(Color.rgb(18,24,32), dp(14)));

              TextView prev = buttonText("◀");
              TextView next = buttonText("▶");
              TextView media = buttonText("♫");
              TextView apps = buttonText("▦  APPS");

              bottom.addView(prev,
                      new LinearLayout.LayoutParams(0, dp(48), 1f));
              bottom.addView(next,
                      new LinearLayout.LayoutParams(0, dp(48), 1f));
              bottom.addView(media,
                      new LinearLayout.LayoutParams(0, dp(48), 1f));
              bottom.addView(apps,
                      new LinearLayout.LayoutParams(0, dp(48), 2f));

              apps.setOnClickListener(v -> showApps());

              dashboard.addView(bottom,
                      new LinearLayout.LayoutParams(-1, dp(60)));
          }
          '''
          s = method(s, "private void buildDashboard()", dashboard)

          # Real application icons
          old = '''            apps.add(
                    new AppInfo(
                            component,
                            name));'''
          new = '''            Drawable icon =
                    info.loadIcon(getPackageManager());

            apps.add(
                    new AppInfo(
                            component,
                            name,
                            icon));'''
          s = once(s, old, new, "real app icons")

          # App tile
          tile = r'''
          private LinearLayout appTile(AppInfo app) {
              LinearLayout tile = new LinearLayout(this);
              tile.setOrientation(LinearLayout.VERTICAL);
              tile.setGravity(Gravity.CENTER);
              tile.setPadding(dp(6), dp(6), dp(6), dp(6));
              tile.setBackground(
                      roundBg(Color.rgb(22,28,35), dp(14)));

              ImageView icon = new ImageView(this);
              if (app.icon != null) {
                  icon.setImageDrawable(app.icon);
              } else {
                  icon.setImageDrawable(
                          getPackageManager().getDefaultActivityIcon());
              }
              icon.setScaleType(ImageView.ScaleType.CENTER_INSIDE);

              tile.addView(icon,
                      new LinearLayout.LayoutParams(dp(50), dp(50)));

              TextView name = text(app.name, 12, Color.WHITE);
              name.setGravity(Gravity.CENTER);
              name.setMaxLines(2);

              tile.addView(name,
                      new LinearLayout.LayoutParams(-1, dp(40)));

              tile.setOnClickListener(v -> selectApp(app));
              return tile;
          }
          '''
          s = method(s, "private LinearLayout appTile(", tile)

          # App model
          model = r'''
          private static final class AppInfo {
              final ComponentName component;
              final String name;
              final Drawable icon;

              AppInfo(ComponentName component, String name, Drawable icon) {
                  this.component = component;
                  this.name = name;
                  this.icon = icon;
              }
          }
          '''
          s = method(s, "private static final class AppInfo", model)

          # Remove old initial() helper
          if "private String initial(" in s:
              s = method(s, "private String initial(", "")

          # Add helpers before UI HELPERS
          marker = "    // ====================================================\n    // UI HELPERS\n"
          if s.count(marker) != 1:
              raise SystemExit("UI HELPERS marker mismatch")

          helpers = r'''
          private GradientDrawable roundBg(int color, float radius) {
              GradientDrawable bg = new GradientDrawable();
              bg.setColor(color);
              bg.setCornerRadius(radius);
              return bg;
          }

          private LinearLayout buildSidebar() {
              LinearLayout side = new LinearLayout(this);
              side.setOrientation(LinearLayout.VERTICAL);
              side.setGravity(Gravity.CENTER_HORIZONTAL);
              side.setPadding(0, dp(4), 0, dp(4));
              side.setBackground(roundBg(Color.rgb(15,21,29), dp(14)));

              side.addView(sideButton("☰", "Menu"));
              side.addView(sideButton("⌖", "Map"));
              side.addView(sideButton("▣", "Files"));
              side.addView(sideButton("⚙", "Settings"));
              side.addView(sideButton("⋮", "More"));
              return side;
          }

          private TextView sideButton(String icon, String label) {
              TextView v = text(icon + "\n" + label, 10, Color.WHITE);
              v.setGravity(Gravity.CENTER);
              v.setPadding(dp(2), dp(3), dp(2), dp(3));
              v.setBackground(roundBg(Color.TRANSPARENT, dp(10)));
              v.setOnClickListener(x -> {
                  if ("Files".equals(label)) {
                      showApps();
                  } else if (status != null) {
                      status.setText(label);
                  }
              });
              LinearLayout.LayoutParams p =
                      new LinearLayout.LayoutParams(-1, dp(62));
              return v;
          }

          private LinearLayout infoCard(String title, String value) {
              LinearLayout box = card();
              box.addView(text(title, 10, Color.LTGRAY));
              TextView val = text(value, 15, Color.WHITE);
              val.setGravity(Gravity.CENTER);
              box.addView(val,
                      new LinearLayout.LayoutParams(-1, 0, 1f));
              return box;
          }

          private final class MapBackground extends View {
              private final Paint grid = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint road = new Paint(Paint.ANTI_ALIAS_FLAG);

              MapBackground(android.content.Context c) {
                  super(c);
                  grid.setColor(Color.rgb(27,40,47));
                  grid.setStrokeWidth(dp(1));
                  road.setColor(Color.rgb(55,70,78));
                  road.setStyle(Paint.Style.STROKE);
                  road.setStrokeWidth(dp(12));
                  road.setStrokeCap(Paint.Cap.ROUND);
              }

              @Override
              protected void onDraw(Canvas c) {
                  super.onDraw(c);
                  c.drawColor(Color.rgb(9,17,23));

                  int w = getWidth();
                  int h = getHeight();
                  int step = dp(36);

                  for (int x = 0; x < w; x += step) {
                      c.drawLine(x, 0, x, h, grid);
                  }
                  for (int y = 0; y < h; y += step) {
                      c.drawLine(0, y, w, y, grid);
                  }

                  Path p = new Path();
                  p.moveTo(0, h * .72f);
                  p.cubicTo(
                          w * .25f, h * .55f,
                          w * .55f, h * .78f,
                          w, h * .32f);
                  c.drawPath(p, road);

                  Paint marker = new Paint(Paint.ANTI_ALIAS_FLAG);
                  marker.setColor(Color.WHITE);
                  c.drawCircle(w * .52f, h * .57f, dp(7), marker);
              }
          }

          '''
          s = s.replace(marker, helpers + marker, 1)

          if s == original:
              raise SystemExit("PATCH MADE NO CHANGES")

          if "initial(app.name)" in s:
              raise SystemExit("OLD INITIAL ICON STILL EXISTS")

          p.write_text(s, encoding="utf-8")
          print("V3.1 patch complete")
          PY

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"

          grep -Fq 'import android.graphics.Canvas;' "$FILE"
          grep -Fq 'import android.graphics.drawable.Drawable;' "$FILE"
          grep -Fq 'import android.widget.ImageView;' "$FILE"
          grep -Fq 'class MapBackground' "$FILE"
          grep -Fq 'private LinearLayout buildSidebar()' "$FILE"
          grep -Fq 'info.loadIcon(getPackageManager())' "$FILE"
          grep -Fq 'final Drawable icon' "$FILE"
          grep -Fq 'V10SessionStore.setTarget' "$FILE"

          if grep -Fq 'initial(app.name)' "$FILE"; then
            echo "ERROR: initial icon remains"
            exit 1
          fi

          if grep -Fq 'private String initial(' "$FILE"; then
            echo "ERROR: initial() remains"
            exit 1
          fi

          git diff --check

          CHANGED="$(git diff --name-only)"

          test "$CHANGED" = "$FILE"

          echo "Only V10LauncherActivity.java changed."
          echo "Patch verification PASS."

      - name: Compile Java
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon --stacktrace

      - name: Assemble APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find v10-source/app/build/outputs/apk \
            -type f -name '*.apk' \
            | grep '/debug/' | head -n 1)"

          test -n "$APK"

          mkdir -p release-apk

          cp "$APK" \
            release-apk/CarAssistant-V10-Home-V1-Phone-UI-V3.1-debug.apk

          sha256sum \
            release-apk/CarAssistant-V10-Home-V1-Phone-UI-V3.1-debug.apk

          ls -lh \
            release-apk/CarAssistant-V10-Home-V1-Phone-UI-V3.1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Home-V1-Phone-UI-V3.1-debug
          path: release-apk/CarAssistant-V10-Home-V1-Phone-UI-V3.1-debug.apk
          if-no-files-found: error
          retention-days: 14
