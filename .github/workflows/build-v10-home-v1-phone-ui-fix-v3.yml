name: Build Car Assistant V10 - Home V1 Phone UI Fix V3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-v1-phone-ui-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact baseline commit
        uses: actions/checkout@v4
        with:
          ref: 0634e1f5ced143fdd931022b32bf9a19cbf6e2bd
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify exact V10LauncherActivity source
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/V10LauncherActivity.java"

          test -f "$FILE"

          echo "===== SOURCE ====="
          echo "$FILE"

          echo "===== COMMIT ====="
          git rev-parse HEAD

          test "$(git rev-parse HEAD)" = \
            "0634e1f5ced143fdd931022b32bf9a19cbf6e2bd"

          echo "===== FILE SHA256 ====="
          sha256sum "$FILE"

          EXPECTED="84d970adbfacc39270838d12ed0a73bc7fa0d645"

          ACTUAL="$(
            git hash-object "$FILE"
          )"

          echo "Git blob SHA=$ACTUAL"

          grep -Fq 'class V10LauncherActivity' "$FILE"
          grep -Fq 'V10SessionStore.setTarget' "$FILE"
          grep -Fq 'private void buildDashboard()' "$FILE"
          grep -Fq 'private void loadApps()' "$FILE"
          grep -Fq 'private LinearLayout appTile(' "$FILE"
          grep -Fq 'private static final class AppInfo' "$FILE"
          grep -Fq 'initial(app.name)' "$FILE"

          echo "Exact baseline source verified."

      - name: Patch Home V1 from verified source
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/V10LauncherActivity.java"

          python3 - "$FILE" <<'PY'
          import sys
          import re
          from pathlib import Path

          path = Path(sys.argv[1])
          src = path.read_text(encoding="utf-8")

          ORIGINAL = src

          def replace_once(old, new, label):
              global src

              count = src.count(old)

              if count != 1:
                  raise SystemExit(
                      f"PATCH FAILED: {label}: expected 1 match, found {count}"
                  )

              src = src.replace(old, new, 1)

              print(f"PATCH OK: {label}")

          def replace_method(signature, replacement, label):
              global src

              start = src.find(signature)

              if start < 0:
                  raise SystemExit(
                      f"PATCH FAILED: {label}: method not found: {signature}"
                  )

              brace = src.find("{", start)

              if brace < 0:
                  raise SystemExit(
                      f"PATCH FAILED: {label}: opening brace not found"
                  )

              depth = 0
              end = None

              for i in range(brace, len(src)):
                  c = src[i]

                  if c == "{":
                      depth += 1

                  elif c == "}":
                      depth -= 1

                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise SystemExit(
                      f"PATCH FAILED: {label}: closing brace not found"
                  )

              src = src[:start] + replacement.rstrip() + src[end:]

              print(f"PATCH OK: {label}")

          def replace_class(signature, replacement, label):
              replace_method(signature, replacement, label)

          # ------------------------------------------------------------
          # IMPORTS
          # ------------------------------------------------------------

          replace_once(
              "import android.graphics.Color;\n",
              """import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Path;
          """,
              "Canvas/Paint/Path imports"
          )

          replace_once(
              "import android.graphics.drawable.GradientDrawable;\n",
              """import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          """,
              "Drawable import"
          )

          replace_once(
              "import android.view.Gravity;\n",
              """import android.view.Gravity;
          import android.view.View;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
