          grep -Fq 'import android.widget.FrameLayout;' "$FILE"
          grep -Fq 'import android.graphics.Canvas;' "$FILE"

          if grep -Fq 'initial(app.name)' "$FILE"; then
            echo "ERROR: initial-letter icon remains."
            exit 1
          fi

          if grep -Fq 'private String initial(' "$FILE"; then
            echo "ERROR: initial() helper remains."
            exit 1
          fi

          echo "===== GIT DIFF CHECK ====="

          git diff --check

          git diff --name-only

          changed="$(git diff --name-only)"

          if [ "$changed" != "$FILE" ]; then
            echo "ERROR: more than V10LauncherActivity.java changed."
            echo "Changed files:"
            printf '%s\n' "$changed"
            exit 1
          fi

          echo "Only V10LauncherActivity.java changed."

          echo "===== DIFF STAT ====="
          git diff --stat

          echo "===== DIFF ====="
          git diff -- "$FILE"

          echo "===== FINAL SOURCE SHA256 ====="
          sha256sum "$FILE"

      - name: Compile Java first
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace

      - name: Assemble debug APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find v10-source/app/build/outputs/apk \
              -type f \
              -name '*.apk' \
              | grep '/debug/' \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: debug APK not found."

            find v10-source/app/build/outputs/apk \
              -type f \
              -print || true

            exit 1
          fi

          echo "APK=$APK"

          mkdir -p release-apk

          cp \
            "$APK" \
            release-apk/CarAssistant-V10-Home-V1-Phone-UI-V3-debug.apk

          echo "===== APK SHA256 ====="

          sha256sum \
            release-apk/CarAssistant-V10-Home-V1-Phone-UI-V3-debug.apk

          echo "===== APK SIZE ====="

          ls -lh \
            release-apk/CarAssistant-V10-Home-V1-Phone-UI-V3-debug.apk

      - name: Upload V3 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Home-V1-Phone-UI-V3-debug
          path: release-apk/CarAssistant-V10-Home-V1-Phone-UI-V3-debug.apk
          if-no-files-found: error
          retention-days: 14
