name: Build Navigation V1 Kotlin No DEX

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: navigation-v1-source

jobs:
  build-navigation-v1-kotlin:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # STEP 01
      # ============================================================
      - name: Checkout main baseline
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ============================================================
      # STEP 02
      # ============================================================
      - name: Verify exact main source
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          git fetch origin main --depth=1

          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="$(git rev-parse origin/main)"

          echo "HEAD=$ACTUAL"
          echo "origin/main=$EXPECTED"

          test "$ACTUAL" = "$EXPECTED"

          test -d navigation-v1-source
          test -f navigation-v1-source/settings.gradle
          test -f navigation-v1-source/build.gradle
          test -f navigation-v1-source/app/build.gradle

          echo
          echo "PASS: exact main source verified."

      # ============================================================
      # STEP 03
      # ============================================================
      - name: Show Navigation V1 source inventory
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          echo "=== Navigation V1 source files ==="

          find navigation-v1-source/app/src/main \
            -type f \
            -print \
            | sort

          echo
          echo "=== Java source count ==="

          find navigation-v1-source/app/src/main/java \
            -type f \
            -name '*.java' \
            | wc -l

          echo
          echo "=== Kotlin source count ==="

          find navigation-v1-source/app/src/main \
            -type f \
            -name '*.kt' \
            | wc -l

      # ============================================================
      # STEP 04
      # ============================================================
      - name: Verify Patch 1 AutoFollow source
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Search AutoFollow references ==="

          grep -RniE \
            'AutoFollow|auto.?follow|NavigationMap' \
            app/src/main/java \
            || true

          echo
          echo "=== NavigationMapView ==="

          test -f \
            app/src/main/java/com/carassistant/v10/NavigationMapView.java

          sed -n '1,320p' \
            app/src/main/java/com/carassistant/v10/NavigationMapView.java

          echo
          echo "PASS: Patch 1 navigation source remains present."

      # ============================================================
      # STEP 05
      # ============================================================
      - name: Verify projection core remains intact
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            app/src/main/java/com/carassistant/v10/V10CarActivity.java

          test -f \
            app/src/main/java/com/carassistant/v10/V10ProjectionSession.java

          test -f \
            app/src/main/java/com/carassistant/v10/AACastCarService.java

          test -f \
            app/src/main/java/com/carassistant/v10/AACastDisplay.java

          test -f \
            app/src/main/java/com/carassistant/v10/V10Display.java

          test -f \
            app/src/main/java/com/carassistant/v10/V10DisplayController.java

          echo "PASS: projection core source files exist."

      # ============================================================
      # STEP 06
      # ============================================================
      - name: Verify legacy DEX is not required
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Search for legacy DEX references ==="

          grep -Rni \
            'aasdk-legacy.dex' \
            . \
            --exclude-dir=.git \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            || true

          echo
          echo "=== Verify legacy DEX file is absent ==="

          if [ -f app/libs/aasdk-legacy.dex ]; then
            echo "ERROR: aasdk-legacy.dex still exists."
            exit 1
          fi

          echo
          echo "PASS: aasdk-legacy.dex is not present."

      # ============================================================
      # STEP 07
      # ============================================================
      - name: Verify legacy DEX packaging hooks are absent
        shell: bash
        run: |
          set -euo pipefail

          if grep -Fq "mergeProjectDexDebug" app/build.gradle; then
            echo "ERROR: legacy Debug DEX hook remains."
            exit 1
          fi

          if grep -Fq "mergeDexRelease" app/build.gradle; then
            echo "ERROR: legacy Release DEX hook remains."
            exit 1
          fi

          if grep -Fq "legacyDex" app/build.gradle; then
            echo "ERROR: legacyDex Gradle logic remains."
            exit 1
          fi

          if grep -Fq "d8Tool" app/build.gradle; then
            echo "ERROR: custom D8 legacy merge remains."
            exit 1
          fi

          if grep -Fq "project.exec" app/build.gradle; then
            echo "ERROR: custom D8 execution remains."
            exit 1
          fi

          echo
          echo "PASS: no legacy DEX packaging hook remains."

      # ============================================================
      # STEP 08
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # STEP 09
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ============================================================
      # STEP 10
      # ============================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses \
            >/dev/null 2>&1 \
            || true

          echo "Android SDK licenses processed."

      # ============================================================
      # STEP 11
      # ============================================================
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

          echo
          echo "PASS: required Android SDK packages installed."

      # ============================================================
      # STEP 12
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          command -v sdkmanager

          test -d \
            "$ANDROID_SDK_ROOT/platforms/android-36"

          test -d \
            "$ANDROID_SDK_ROOT/build-tools/36.0.0"

          test -d \
            "$ANDROID_SDK_ROOT/platform-tools"

          echo
          echo "PASS: Android SDK verified."

      # ============================================================
      # STEP 13
      # ============================================================
      - name: Verify Kotlin toolchain availability
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Gradle version ==="

          ./gradlew --version \
            --no-daemon

          echo
          echo "=== Kotlin references in project ==="

          grep -Rni \
            'kotlin' \
            . \
            --exclude-dir=.git \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            || true

          echo
          echo "PASS: Kotlin toolchain inspection completed."

      # ============================================================
      # STEP 14
      # ============================================================
      - name: Make Gradle executable
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew

          chmod +x ./gradlew

          echo "PASS: Gradle wrapper is executable."

      # ============================================================
      # STEP 15
      # ============================================================
      - name: Verify current Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "=== settings.gradle ==="
          cat settings.gradle

          echo
          echo "=== root build.gradle ==="
          cat build.gradle

          echo
          echo "=== app/build.gradle ==="
          cat app/build.gradle

          echo
          echo "PASS: current Gradle configuration displayed."

      # ============================================================
      # STEP 16
      # ============================================================
      - name: Verify required Android configuration
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq \
            "com.android.application" \
            build.gradle

          grep -Fq \
            "compileSdk 36" \
            app/build.gradle

          grep -Fq \
            "minSdk 29" \
            app/build.gradle

          grep -Fq \
            "targetSdk 36" \
            app/build.gradle

          grep -Fq \
            "JavaVersion.VERSION_17" \
            app/build.gradle

          echo
          echo "PASS: Android configuration verified."

      # ============================================================
      # STEP 17
      # ============================================================
      - name: Verify dependencies
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq \
            'org.maplibre.gl:android-sdk:11.11.0' \
            app/build.gradle

          grep -Fq \
            "libs/xposed-api-82.jar" \
            app/build.gradle

          echo
          echo "PASS: required current dependencies verified."

      # ============================================================
      # STEP 18
      # ============================================================
      - name: Resolve release dependencies
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:dependencies \
            --configuration releaseRuntimeClasspath \
            --no-daemon \
            > /tmp/releaseRuntimeClasspath.txt

          echo "=== AndroidX dependencies ==="

          grep -Ei \
            'androidx|com\.android\.support' \
            /tmp/releaseRuntimeClasspath.txt \
            || true

          echo
          echo "PASS: release dependencies resolved."

      # ============================================================
      # STEP 19
      # ============================================================
      - name: Parse Gradle task graph
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:tasks \
            --no-daemon \
            --stacktrace

          echo
          echo "PASS: Gradle task graph parsed."

      # ============================================================
      # STEP 20
      # ============================================================
      - name: Compile Navigation V1 without legacy DEX
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

          echo
          echo "PASS: Debug APK compiled without legacy DEX packaging."

      # ============================================================
      # STEP 21
      # ============================================================
      - name: Assemble Navigation V1 Release
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace

          echo
          echo "PASS: Release APK assembled without legacy DEX packaging."

      # ============================================================
      # STEP 22
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"
          test -s "$APK"

          echo "=== APK ==="

          ls -lh "$APK"

          echo
          echo "=== APK SHA256 ==="

          sha256sum "$APK"

          echo
          echo "=== APK DEX entries ==="

          unzip -l "$APK" \
            | grep -E 'classes[0-9]*\.dex'

          echo
          echo "PASS: Release APK exists and contains normal application DEX."

      # ============================================================
      # STEP 23
      # ============================================================
      - name: Verify APK contains no legacy DEX asset
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          if unzip -l "$APK" \
            | grep -Fq "aasdk-legacy.dex"; then
            echo "ERROR: legacy DEX is still packaged in APK."
            exit 1
          fi

          echo
          echo "PASS: APK contains no aasdk-legacy.dex."

      # ============================================================
      # STEP 24
      # ============================================================
      - name: Verify source contains no legacy DEX
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          if find navigation-v1-source \
            -type f \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print0 \
            | xargs -0 grep -Il \
              'aasdk-legacy.dex' \
              2>/dev/null; then

            echo
            echo "ERROR: source still references aasdk-legacy.dex."
            exit 1
          fi

          echo
          echo "PASS: source tree contains no legacy DEX reference."

      # ============================================================
      # STEP 25
      # ============================================================
      - name: Kotlin migration report
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          echo "============================================================"
          echo "KOTLIN MIGRATION REPORT"
          echo "============================================================"

          echo
          echo "Java source files:"
          find navigation-v1-source/app/src/main \
            -type f \
            -name '*.java' \
            | sort

          echo
          echo "Java source count:"
          find navigation-v1-source/app/src/main \
            -type f \
            -name '*.java' \
            | wc -l

          echo
          echo "Kotlin source files:"
          find navigation-v1-source/app/src/main \
            -type f \
            -name '*.kt' \
            | sort

          echo
          echo "Kotlin source count:"
          find navigation-v1-source/app/src/main \
            -type f \
            -name '*.kt' \
            | wc -l

          echo
          echo "============================================================"
          echo "IMPORTANT"
          echo "============================================================"
          echo "This build intentionally keeps the current Java source."
          echo "The legacy DEX packaging mechanism has been removed."
          echo "Kotlin migration will be performed class-by-class next."
          echo "Patch 1 AutoFollow source is preserved."
          echo "============================================================"

      # ============================================================
      # STEP 26
      # ============================================================
      - name: Upload Navigation V1 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: navigation-v1-kotlin-no-dex-release
          path: navigation-v1-source/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # ============================================================
      # STEP 27
      # ============================================================
      - name: Upload Kotlin migration report
        uses: actions/upload-artifact@v4
        with:
          name: navigation-v1-kotlin-migration-report
          path: |
            /tmp/releaseRuntimeClasspath.txt
          if-no-files-found: error
