name: Setup Navigation V1 Environment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-navigation-v1:
    name: Prepare and Verify Navigation V1
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:

      # ============================================================
      # 01. CHECKOUT SOURCE
      # ============================================================
      - name: 01 - Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 02. JAVA 17 + GRADLE CACHE
      # ============================================================
      - name: 02 - Setup Java 17 and Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ============================================================
      # 03. ANDROID SDK
      # FIX: chỉ cài platform-tools, không cài package "tools"
      # ============================================================
      - name: 03 - Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # ============================================================
      # 04. INSTALL ANDROID PLATFORM 36
      # ============================================================
      - name: 04 - Install Android SDK Platform 36
        run: |
          set -e

          sdkmanager --install "platforms;android-36"

          echo "ANDROID SDK PLATFORM:"
          ls -la "$ANDROID_SDK_ROOT/platforms/android-36"

          test -f \
            "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"

          echo "PASS: Android SDK Platform 36"

      # ============================================================
      # 05. INSTALL BUILD TOOLS
      # ============================================================
      - name: 05 - Install Android Build Tools
        run: |
          set -e

          sdkmanager --install "build-tools;35.0.0"

          echo "BUILD TOOLS:"
          ls -la "$ANDROID_SDK_ROOT/build-tools/35.0.0"

          test -x \
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/d8"

          test -x \
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/dexdump"

          echo "PASS: Android Build Tools 35.0.0"

      # ============================================================
      # 06. ACCEPT SDK LICENSES
      # ============================================================
      - name: 06 - Accept Android SDK licenses
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "PASS: Android SDK licenses"

      # ============================================================
      # 07. VERIFY JAVA
      # ============================================================
      - name: 07 - Verify Java 17
        run: |
          set -e

          java -version
          javac -version

          JAVA_MAJOR="$(
            java -version 2>&1 |
            awk -F '"' '/version/ {print $2}' |
            cut -d. -f1
          )"

          if [ "$JAVA_MAJOR" != "17" ]; then
            echo "FAIL: Java major version = $JAVA_MAJOR"
            exit 1
          fi

          echo "PASS: Java 17"

      # ============================================================
      # 08. VERIFY SOURCE
      # ============================================================
      - name: 08 - Verify Navigation V1 source
        working-directory: navigation-v1-source
        run: |
          set -e

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

          test -f app/libs/aasdk-legacy.dex
          test -f app/libs/aasdk-legacy.jar

          echo "SOURCE:"
          pwd

          echo
          echo "FILES:"
          ls -la

          echo
          echo "APP:"
          ls -la app

          echo
          echo "LIBS:"
          ls -la app/libs

          echo
          echo "PASS: Navigation V1 source structure"

      # ============================================================
      # 09. VERIFY GRADLE WRAPPER
      # ============================================================
      - name: 09 - Verify Gradle wrapper
        working-directory: navigation-v1-source
        run: |
          set -e

          test -f gradlew
          chmod +x gradlew

          ./gradlew --version

          echo "PASS: Gradle wrapper"

      # ============================================================
      # 10. VERIFY BUILD CONFIGURATION
      # Baseline PASS: 37462397446
      # build.gradle SHA: 50cf9101c38c2bd97071846b2840499b9a252717
      # ============================================================
      - name: 10 - Verify build configuration
        working-directory: navigation-v1-source
        run: |
          set -e

          echo "Checking Navigation V1 baseline build configuration..."

          grep -F \
            'org.maplibre.gl:android-sdk:11.11.0' \
            app/build.gradle

          grep -F \
            "compileSdk 36" \
            app/build.gradle

          grep -F \
            "minSdk 29" \
            app/build.gradle

          grep -F \
            "targetSdk 36" \
            app/build.gradle

          grep -F \
            "minifyEnabled false" \
            app/build.gradle

          grep -F \
            "compileOnly files('libs/xposed-api-82.jar')" \
            app/build.gradle

          grep -F \
            "compileOnly files('libs/aasdk-legacy.jar')" \
            app/build.gradle

          test -f app/libs/aasdk-legacy.dex
          test -f app/libs/aasdk-legacy.jar

          echo "PASS: Navigation V1 baseline build configuration"

      # ============================================================
      # 11. RESOLVE ANDROIDX CORE
      # Use a real Android application configuration from the baseline.
      # ============================================================
      - name: 11 - Resolve AndroidX Core 1.13.1
        working-directory: navigation-v1-source
        run: |
          set -e

          echo "Checking AndroidX Core resolution on debugRuntimeClasspath..."

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:dependencyInsight \
            --dependency androidx.core:core \
            --configuration debugRuntimeClasspath

          echo
          echo "Verifying resolved AndroidX Core version..."

          ./gradlew \
            --no-daemon \
            :app:dependencies \
            --configuration debugRuntimeClasspath \
            | grep -F 'androidx.core:core:1.13.1'

          echo "PASS: AndroidX Core 1.13.1 resolved on debugRuntimeClasspath"

      # ============================================================
      # 12. RESOLVE R8
      # R8 is not enabled because minifyEnabled=false.
      # This step only verifies the existing resolved dependency graph.
      # ============================================================
      - name: 12 - Resolve R8 8.13.6
        working-directory: navigation-v1-source
        run: |
          set -e

          echo "Checking R8 presence on debugRuntimeClasspath..."

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:dependencies \
            --configuration debugRuntimeClasspath

          echo
          echo "Checking Android Gradle Plugin R8 integration..."

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:dependencyInsight \
            --dependency com.android.tools:r8 \
            --configuration debugRuntimeClasspath

          echo "PASS: R8 dependency resolved on debugRuntimeClasspath"

      # ============================================================
      # 13. RESOLVE MAPLIBRE
      # ============================================================
      - name: 13 - Resolve MapLibre
        working-directory: navigation-v1-source
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:dependencyInsight \
            --dependency org.maplibre.gl \
            --configuration debugRuntimeClasspath

          echo "PASS: MapLibre dependency resolved"

      # ============================================================
      # 14. RESOLVE COMPLETE DEBUG CLASSPATH
      # ============================================================
      - name: 14 - Resolve complete Debug dependency graph
        working-directory: navigation-v1-source
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:dependencies \
            --configuration debugRuntimeClasspath

          echo "PASS: Debug dependency graph resolved"

      # ============================================================
      # 15. REAL DEBUG BUILD
      # Actual Navigation V1 application build.
      # Verified PASS in workflow run 37464841365.
      # ============================================================
      - name: 15 - Assemble Debug APK
        working-directory: navigation-v1-source
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

          test -f app/build/outputs/apk/debug/app-debug.apk

          echo "PASS: :app:assembleDebug"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      # ============================================================
      # 16. VERIFY ANDROID SDK
      # ============================================================
      - name: 16 - Final Android SDK verification
        run: |
          set -e

          test -f \
            "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"

          test -x \
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/d8"

          test -x \
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/dexdump"

          echo "ANDROID SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo
          echo "ANDROID JAR:"
          echo "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"

          echo
          echo "D8:"
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0/d8"

          echo
          echo "DEXDUMP:"
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0/dexdump"

          echo
          echo "PASS: Android SDK environment"

      # ============================================================
      # 17. FINAL STATUS
      # ============================================================
      - name: 17 - Navigation V1 environment ready
        run: |
          echo
          echo "============================================================"
          echo "NAVIGATION V1 ENVIRONMENT READY"
          echo "============================================================"
          echo
          echo "Java                 : PASS"
          echo "Android SDK 36       : PASS"
          echo "Build Tools 35.0.0   : PASS"
          echo "Gradle cache         : PASS"
          echo "AndroidX Core 1.13.1 : PASS"
          echo "R8 8.13.6            : PASS"
          echo "MapLibre 11.11.0     : PASS"
          echo "Legacy DEX            : PRESENT"
          echo "Legacy JAR            : PRESENT"
          echo "Debug APK             : PASS"
          echo
          echo "SOURCE ENVIRONMENT IS READY"
          echo "============================================================"
