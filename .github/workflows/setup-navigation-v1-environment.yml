name: Setup Navigation V1 Environment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-navigation-v1:
    name: Prepare and Verify Navigation V1
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:

      # ============================================================
      # 01. CHECKOUT SOURCE
      # ============================================================
      - name: 01 - Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 02. JAVA 17 + GRADLE CACHE
      # ============================================================
      - name: 02 - Setup Java 17 and Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ============================================================
      # 03. ANDROID SDK
      # FIX: chỉ cài platform-tools, không cài package "tools"
      # ============================================================
      - name: 03 - Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # ============================================================
      # 04. INSTALL ANDROID PLATFORM 36
      # ============================================================
      - name: 04 - Install Android SDK Platform 36
        run: |
          set -e

          sdkmanager --install "platforms;android-36"

          echo "ANDROID SDK PLATFORM:"
          ls -la "$ANDROID_SDK_ROOT/platforms/android-36"

          test -f \
            "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"

          echo "PASS: Android SDK Platform 36"

      # ============================================================
      # 05. INSTALL BUILD TOOLS
      # ============================================================
      - name: 05 - Install Android Build Tools
        run: |
          set -e

          sdkmanager --install "build-tools;35.0.0"

          echo "BUILD TOOLS:"
          ls -la "$ANDROID_SDK_ROOT/build-tools/35.0.0"

          test -x \
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/d8"

          test -x \
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/dexdump"

          echo "PASS: Android Build Tools 35.0.0"

      # ============================================================
      # 06. ACCEPT SDK LICENSES
      # ============================================================
      - name: 06 - Accept Android SDK licenses
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "PASS: Android SDK licenses"

      # ============================================================
      # 07. VERIFY JAVA
      # ============================================================
      - name: 07 - Verify Java 17
        run: |
          set -e

          java -version
          javac -version

          JAVA_MAJOR="$(
            java -version 2>&1 |
            awk -F '"' '/version/ {print $2}' |
            cut -d. -f1
          )"

          if [ "$JAVA_MAJOR" != "17" ]; then
            echo "FAIL: Java major version = $JAVA_MAJOR"
            exit 1
          fi

          echo "PASS: Java 17"

      # ============================================================
      # 08. VERIFY SOURCE
      # ============================================================
      - name: 08 - Verify Navigation V1 source
        working-directory: navigation-v1-source
        run: |
          set -e

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

          test -f app/libs/aasdk-legacy.dex
          test -f app/libs/aasdk-legacy.jar

          echo "SOURCE:"
          pwd

          echo
          echo "FILES:"
          ls -la

          echo
          echo "APP:"
          ls -la app

          echo
          echo "LIBS:"
          ls -la app/libs

          echo
          echo "PASS: Navigation V1 source structure"

      # ============================================================
      # 09. VERIFY GRADLE WRAPPER
      # ============================================================
      - name: 09 - Verify Gradle wrapper
        working-directory: navigation-v1-source
        run: |
          set -e

          test -f gradlew
          chmod +x gradlew

          ./gradlew --version

          echo "PASS: Gradle wrapper"

      # ============================================================
      # 10. VERIFY BUILD CONFIGURATION
      # ============================================================
      - name: 10 - Verify build configuration
        working-directory: navigation-v1-source
        run: |
          set -e

          echo "Checking required configuration..."

          grep -F \
            'androidx.core:core:1.13.1' \
            app/build.gradle

          grep -F \
            'com.android.tools:r8:8.13.6' \
            app/build.gradle

          grep -F \
            'org.maplibre.gl:android-sdk:11.11.0' \
            app/build.gradle

          grep -F \
            "compileSdk 36" \
            app/build.gradle

          grep -F \
            "minSdk 29" \
            app/build.gradle

          echo "PASS: Required build configuration"

      # ============================================================
      # 11. RESOLVE ANDROIDX CORE
      # ============================================================
      - name: 11 - Resolve AndroidX Core 1.13.1
        working-directory: navigation-v1-source
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            dependencies

          echo
          echo "Checking AndroidX Core resolution..."

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:dependencyInsight \
            --dependency androidx.core \
            --configuration androidxCoreTool

          echo "PASS: AndroidX Core dependency resolved"

      # ============================================================
      # 12. RESOLVE R8
      # ============================================================
      - name: 12 - Resolve R8 8.13.6
        working-directory: navigation-v1-source
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:dependencies

          echo
          echo "Checking R8 configuration..."

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:dependencyInsight \
            --dependency com.android.tools.r8 \
            --configuration r8Tool

          echo "PASS: R8 dependency resolved"

      # ============================================================
      # 13. RESOLVE MAPLIBRE
      # ============================================================
      - name: 13 - Resolve MapLibre
        working-directory: navigation-v1-source
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:dependencyInsight \
            --dependency org.maplibre.gl \
            --configuration debugRuntimeClasspath

          echo "PASS: MapLibre dependency resolved"

      # ============================================================
      # 14. RESOLVE COMPLETE DEBUG CLASSPATH
      # ============================================================
      - name: 14 - Resolve complete Debug dependency graph
        working-directory: navigation-v1-source
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:dependencies \
            --configuration debugRuntimeClasspath

          echo "PASS: Debug dependency graph resolved"

      # ============================================================
      # 15. RUN SANITIZE LEGACY DEX
      #
      # FIX:
      # Không gọi :app:sanitizeLegacyDex vì task cũ đưa
      # aasdk-legacy.dex trực tiếp vào R8.
      #
      # R8 không hỗ trợ compile DEX input theo cơ chế cũ.
      #
      # Cơ chế mới:
      #   aasdk-legacy.jar
      #          |
      #          v
      #        R8 8.13.6
      #          |
      #          v
      # sanitized classes.dex
      #
      # Sau đó dùng dexdump để xác minh:
      #   - 5 AndroidX class mục tiêu không còn
      #   - com.google.android.apps.auto.sdk vẫn còn
      # ============================================================
      # ============================================================
      # 15. RUN SANITIZE LEGACY DEX
      #
      # FIX V2:
      # - Giữ nguyên Steps 01-14.
      # - Không sửa build.gradle.
      # - Không đưa aasdk-legacy.dex trực tiếp vào R8.
      # - Loại toàn bộ androidx/** khỏi legacy JAR trước khi chạy R8.
      # - Giữ toàn bộ com.google.android.apps.auto.sdk/**.
      # - Sau đó dùng R8 8.13.6 để tạo sanitized classes.dex.
      # - Cuối cùng dùng dexdump để xác minh:
      #     + Không còn androidx/
      #     + Android Auto SDK vẫn còn.
      # ============================================================
      - name: 15 - Run sanitizeLegacyDex
        working-directory: navigation-v1-source
        run: |
          set -e

          echo "============================================================"
          echo "SANITIZE LEGACY DEX - FILTER ANDROIDX THEN R8"
          echo "============================================================"

          LEGACY_DEX="app/libs/aasdk-legacy.dex"
          LEGACY_JAR="app/libs/aasdk-legacy.jar"

          OUTPUT_ROOT="app/build/intermediates/sanitized-legacy-dex"
          OUTPUT_DIR="$OUTPUT_ROOT/release"
          OUTPUT_DEX="$OUTPUT_DIR/classes.dex"

          FILTERED_JAR="$OUTPUT_ROOT/aasdk-legacy-filtered.jar"
          FILTERED_LIST="$OUTPUT_ROOT/filtered-jar-contents.txt"

          RULES_FILE="$OUTPUT_ROOT/legacy-r8-rules.pro"
          DUMP_FILE="$OUTPUT_ROOT/sanitized-dexdump.txt"

          ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          DEXDUMP="$ANDROID_SDK_ROOT/build-tools/35.0.0/dexdump"

          # ------------------------------------------------------------
          # 15.1 VERIFY INPUTS
          # ------------------------------------------------------------
          test -f "$LEGACY_DEX"
          test -s "$LEGACY_DEX"

          test -f "$LEGACY_JAR"
          test -s "$LEGACY_JAR"

          test -f "$ANDROID_JAR"
          test -x "$DEXDUMP"

          rm -rf "$OUTPUT_ROOT"
          mkdir -p "$OUTPUT_DIR"

          echo
          echo "INPUT DEX:"
          ls -lh "$LEGACY_DEX"

          echo
          echo "INPUT JAR:"
          ls -lh "$LEGACY_JAR"

          # ------------------------------------------------------------
          # 15.2 INSPECT ORIGINAL JAR
          # ------------------------------------------------------------
          echo
          echo "============================================================"
          echo "ORIGINAL LEGACY JAR"
          echo "============================================================"

          ORIGINAL_LIST="$OUTPUT_ROOT/original-jar-contents.txt"

          jar tf "$LEGACY_JAR" > "$ORIGINAL_LIST"

          ORIGINAL_CLASS_COUNT="$(
            grep -c '\.class$' "$ORIGINAL_LIST" || true
          )"

          echo "Original class count:"
          echo "$ORIGINAL_CLASS_COUNT"

          echo
          echo "AndroidX classes in original JAR:"
          grep -E '^androidx/.+\.class$' \
            "$ORIGINAL_LIST" \
            | head -n 100 || true

          # ------------------------------------------------------------
          # 15.3 CREATE FILTERED JAR
          #
          # Chỉ loại androidx/**.
          #
          # Không loại:
          #   com/google/android/apps/auto/sdk/**
          #   các package legacy khác.
          # ------------------------------------------------------------
          echo
          echo "============================================================"
          echo "FILTERING androidx/** FROM LEGACY JAR"
          echo "============================================================"

          FILTER_WORK="$OUTPUT_ROOT/filter-work"

          rm -rf "$FILTER_WORK"
          mkdir -p "$FILTER_WORK"

          (
            cd "$FILTER_WORK"

            jar xf "$OLDPWD/$LEGACY_JAR"

            find androidx \
              -type f \
              -print \
              -delete \
              2>/dev/null || true

            find androidx \
              -type d \
              -empty \
              -delete \
              2>/dev/null || true

            jar cf "$OLDPWD/$FILTERED_JAR" .
          )

          test -f "$FILTERED_JAR"
          test -s "$FILTERED_JAR"

          jar tf "$FILTERED_JAR" > "$FILTERED_LIST"

          echo
          echo "Filtered JAR:"
          ls -lh "$FILTERED_JAR"

          echo
          echo "Filtered class count:"
          grep -c '\.class$' "$FILTERED_LIST" || true

          # ------------------------------------------------------------
          # 15.4 HARD VERIFY: NO ANDROIDX IN FILTERED JAR
          # ------------------------------------------------------------
          echo
          echo "Checking filtered JAR for androidx/**..."

          REMAINING_FILTERED_ANDROIDX="$(
            grep -E '^androidx/' "$FILTERED_LIST" || true
          )"

          if [ -n "$REMAINING_FILTERED_ANDROIDX" ]; then
            echo "FAIL: androidx/** still exists in filtered JAR:"
            echo "$REMAINING_FILTERED_ANDROIDX"
            exit 1
          fi

          echo "PASS: No androidx/** in filtered JAR"

          # ------------------------------------------------------------
          # 15.5 VERIFY ANDROID AUTO SDK REMAINS
          # ------------------------------------------------------------
          echo
          echo "Checking Android Auto SDK in filtered JAR..."

          if ! grep -Fq \
            "com/google/android/apps/auto/sdk/" \
            "$FILTERED_LIST"
          then
            echo "FAIL: Android Auto SDK disappeared from filtered JAR"
            exit 1
          fi

          echo "PASS: com/google/android/apps/auto/sdk/** remains"

          # ------------------------------------------------------------
          # 15.6 CREATE R8 RULES
          # ------------------------------------------------------------
          echo
          echo "============================================================"
          echo "CREATING R8 RULES"
          echo "============================================================"

          cat > "$RULES_FILE" <<'R8RULES'
          -dontobfuscate
          -dontoptimize
          -dontwarn **

          -keep class com.google.android.apps.auto.sdk.** { *; }
          R8RULES

          echo
          echo "R8 RULES:"
          cat "$RULES_FILE"

          # ------------------------------------------------------------
          # 15.7 RESOLVE R8 8.13.6
          # ------------------------------------------------------------
          echo
          echo "============================================================"
          echo "RESOLVING R8 8.13.6"
          echo "============================================================"

          cat > ci-print-r8.gradle <<'GRADLE_INIT'
          allprojects {
              if (project.path == ":app") {
                  tasks.register("ciPrintR8Jar") {
                      doLast {
                          def files = configurations.r8Tool.resolve().findAll {
                              it.exists() &&
                              it.isFile() &&
                              it.name == "r8-8.13.6.jar"
                          }

                          if (files.isEmpty()) {
                              throw new GradleException(
                                  "Không resolve được r8-8.13.6.jar"
                              )
                          }

                          println("CI_R8_JAR=" + files[0].absolutePath)
                      }
                  }
              }
          }
          GRADLE_INIT

          R8_JAR="$(
            ./gradlew \
              --no-daemon \
              --quiet \
              -I ci-print-r8.gradle \
              :app:ciPrintR8Jar \
              | grep '^CI_R8_JAR=' \
              | head -n 1 \
              | cut -d= -f2-
          )"

          rm -f ci-print-r8.gradle

          if [ -z "$R8_JAR" ]; then
            echo "FAIL: Không lấy được R8 8.13.6 từ Gradle configuration"
            exit 1
          fi

          test -f "$R8_JAR"

          echo "R8:"
          echo "$R8_JAR"

          # ------------------------------------------------------------
          # 15.8 RUN R8 ON FILTERED JAR
          # ------------------------------------------------------------
          echo
          echo "============================================================"
          echo "RUNNING R8 ON FILTERED JAR"
          echo "============================================================"

          java \
            -cp "$R8_JAR" \
            com.android.tools.r8.R8 \
            --release \
            --min-api 29 \
            --output "$OUTPUT_DIR" \
            --lib "$ANDROID_JAR" \
            --pg-conf "$RULES_FILE" \
            "$FILTERED_JAR"

          if [ ! -f "$OUTPUT_DEX" ]; then
            echo "FAIL: R8 không tạo được sanitized classes.dex"
            echo
            echo "OUTPUT DIRECTORY:"
            find "$OUTPUT_ROOT" -maxdepth 4 -type f -print
            exit 1
          fi

          test -s "$OUTPUT_DEX"

          echo
          echo "PASS: R8 created sanitized classes.dex"
          ls -lh "$OUTPUT_DEX"

          # ------------------------------------------------------------
          # 15.9 RUN DEXDUMP
          # ------------------------------------------------------------
          echo
          echo "============================================================"
          echo "RUNNING DEXDUMP"
          echo "============================================================"

          "$DEXDUMP" "$OUTPUT_DEX" > "$DUMP_FILE"

          test -s "$DUMP_FILE"

          echo "PASS: dexdump generated"

          # ------------------------------------------------------------
          # 15.10 VERIFY NO ANDROIDX
          # ------------------------------------------------------------
          echo
          echo "============================================================"
          echo "VERIFYING NO ANDROIDX IN SANITIZED DEX"
          echo "============================================================"

          REMAINING_ANDROIDX="$(
            grep -F "androidx/" "$DUMP_FILE" || true
          )"

          if [ -n "$REMAINING_ANDROIDX" ]; then
            echo "FAIL: Sanitized DEX still contains androidx/:"
            echo
            echo "$REMAINING_ANDROIDX"
            exit 1
          fi

          echo "PASS: No androidx/ classes remain"

          # ------------------------------------------------------------
          # 15.11 VERIFY ANDROID AUTO SDK
          # ------------------------------------------------------------
          echo
          echo "============================================================"
          echo "VERIFYING ANDROID AUTO SDK"
          echo "============================================================"

          if ! grep -Fq \
            "com/google/android/apps/auto/sdk" \
            "$DUMP_FILE"
          then
            echo "FAIL: Sanitized DEX không còn"
            echo "com/google/android/apps/auto/sdk"
            exit 1
          fi

          echo "PASS: com.google.android.apps.auto.sdk remains"

          # ------------------------------------------------------------
          # 15.12 FINAL SANITIZE RESULT
          # ------------------------------------------------------------
          echo
          echo "============================================================"
          echo "SANITIZE LEGACY DEX: PASS"
          echo "============================================================"

          echo
          echo "Input legacy JAR : $LEGACY_JAR"
          echo "Filtered JAR     : $FILTERED_JAR"
          echo "Sanitized DEX    : $OUTPUT_DEX"
          echo "R8               : 8.13.6"
          echo "Min SDK          : 29"
          echo
          echo "AndroidX         : REMOVED"
          echo "Android Auto SDK : PRESENT"
          echo
          echo "============================================================"
                                    

      # ============================================================
      # 16. VERIFY SANITIZED DEX
      # ============================================================
      - name: 16 - Verify sanitized legacy DEX
        working-directory: navigation-v1-source
        run: |
          set -e

          SANITIZED_DEX="$(
            find \
              app/build/intermediates/sanitized-legacy-dex \
              -type f \
              -name "classes.dex" \
              | head -n 1
          )"

          if [ -z "$SANITIZED_DEX" ]; then
            echo "FAIL: Sanitized classes.dex not found"
            exit 1
          fi

          echo "SANITIZED DEX:"
          echo "$SANITIZED_DEX"

          test -s "$SANITIZED_DEX"

          echo "PASS: Sanitized legacy DEX exists"

      # ============================================================
      # 17. VERIFY ANDROID SDK
      # ============================================================
      - name: 17 - Final Android SDK verification
        run: |
          set -e

          test -f \
            "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"

          test -x \
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/d8"

          test -x \
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/dexdump"

          echo "ANDROID SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo
          echo "ANDROID JAR:"
          echo "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"

          echo
          echo "D8:"
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0/d8"

          echo
          echo "DEXDUMP:"
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0/dexdump"

          echo
          echo "PASS: Android SDK environment"

      # ============================================================
      # 18. FINAL STATUS
      # ============================================================
      - name: 18 - Navigation V1 environment ready
        run: |
          echo
          echo "============================================================"
          echo "NAVIGATION V1 ENVIRONMENT READY"
          echo "============================================================"
          echo
          echo "Java                 : PASS"
          echo "Android SDK 36       : PASS"
          echo "Build Tools 35.0.0   : PASS"
          echo "Gradle cache         : PASS"
          echo "AndroidX Core 1.13.1 : PASS"
          echo "R8 8.13.6            : PASS"
          echo "MapLibre 11.11.0     : PASS"
          echo "Legacy DEX            : PASS"
          echo "Legacy JAR            : PASS"
          echo "sanitizeLegacyDex     : PASS"
          echo
          echo "SOURCE ENVIRONMENT IS READY"
          echo "============================================================"
