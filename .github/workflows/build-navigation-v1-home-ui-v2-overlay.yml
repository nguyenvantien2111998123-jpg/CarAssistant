name: CarAssistant V10 - Navigation V1 + Home UI V2 Transparent Overlay Safe

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
timeout-minutes: 40

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Restore Navigation V1 Foundation
    shell: bash
    run: |
      set -euo pipefail

      BASELINE="2c814a181d00cde9547a446927ae181e18cb9cbb"

      git fetch origin "$BASELINE" --depth=1

      rm -rf v10-source
      git checkout "$BASELINE" -- v10-source

      SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

      test -f "$SRC/V10CarActivity.java"
      test -f "$SRC/V10ProjectionSession.java"
      test -f "$SRC/V10DisplayController.java"
      test -f "$SRC/V10SurfaceManager.java"
      test -f "$SRC/V10TaskSession.java"
      test -f "$SRC/V10SessionStore.java"

      echo "Foundation source PASS."
      echo "BASELINE=$BASELINE"

  - name: Protect Foundation Core
    shell: bash
    run: |
      set -euo pipefail

      SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

      sha256sum \
        "$SRC/V10ProjectionSession.java" \
        "$SRC/V10DisplayController.java" \
        "$SRC/V10SurfaceManager.java" \
        "$SRC/V10TaskSession.java" \
        "$SRC/V10SessionStore.java" \
        > /tmp/core-before.sha256

  - name: Add MapLibre dependency
    shell: bash
    run: |
      set -euo pipefail

      FILE="v10-source/app/build.gradle"

      test -f "$FILE"

      grep -Fq "dependencies" "$FILE"

      if ! grep -Fq "org.maplibre.gl:android-sdk:11.11.0" "$FILE"; then
        sed -i '/dependencies[[:space:]]*{/a\
implementation "org.maplibre.gl:android-sdk:11.11.0"' "$FILE"
      fi

      grep -Fq \
        'org.maplibre.gl:android-sdk:11.11.0' \
        "$FILE"

      echo "MapLibre dependency PASS."

  - name: Add Navigation location permissions
    shell: bash
    run: |
      set -euo pipefail

      FILE="v10-source/app/src/main/AndroidManifest.xml"

      test -f "$FILE"

      if ! grep -Fq \
        'android.permission.ACCESS_FINE_LOCATION' \
        "$FILE"; then
        sed -i '/<manifest/a\
<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\
<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' "$FILE"
      fi

      grep -Fq \
        'android.permission.ACCESS_FINE_LOCATION' \
        "$FILE"

      grep -Fq \
        'android.permission.ACCESS_COARSE_LOCATION' \
        "$FILE"

      echo "Location permissions PASS."

  - name: Create NavigationMapView
    shell: bash
    run: |
      set -euo pipefail

      SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

      cat > "$SRC/NavigationMapView.java" <<'EOF'
      package com.carassistant.v10;

      import android.Manifest;
      import android.app.Activity;
      import android.content.Context;
      import android.content.pm.PackageManager;
      import android.graphics.Color;
      import android.location.Location;
      import android.os.Bundle;
      import android.widget.FrameLayout;

      import org.maplibre.android.MapLibre;
      import org.maplibre.android.camera.CameraUpdateFactory;
      import org.maplibre.android.geometry.LatLng;
      import org.maplibre.android.location.LocationComponentActivationOptions;
      import org.maplibre.android.location.LocationComponentOptions;
      import org.maplibre.android.maps.MapLibreMap;
      import org.maplibre.android.maps.MapView;
      import org.maplibre.android.maps.UiSettings;

      public final class NavigationMapView extends FrameLayout {

          private static final int LOCATION_REQUEST = 4101;

          private final MapView mapView;
          private MapLibreMap map;

          public NavigationMapView(Context context) {
              super(context);

              setBackgroundColor(Color.BLACK);

              MapLibre.getInstance(
                      context.getApplicationContext());

              mapView = new MapView(context);
              mapView.onCreate(new Bundle());

              LayoutParams params =
                      new LayoutParams(
                              LayoutParams.MATCH_PARENT,
                              LayoutParams.MATCH_PARENT);

              addView(mapView, params);

              mapView.getMapAsync(
                      this::onMapReady);
          }

          private void onMapReady(
                  MapLibreMap readyMap) {

              map = readyMap;

              UiSettings ui =
                      map.getUiSettings();

              ui.setCompassEnabled(false);
              ui.setZoomGesturesEnabled(true);
              ui.setScrollGesturesEnabled(true);
              ui.setRotateGesturesEnabled(true);
              ui.setTiltGesturesEnabled(false);

              map.setStyle(
                      "https://tiles.openfreemap.org/styles/liberty",
                      style -> enableLocation());
          }

          private void enableLocation() {

              if (map == null) {
                  return;
              }

              Context context = getContext();

              if (context == null) {
                  return;
              }

              if (context.checkSelfPermission(
                      Manifest.permission.ACCESS_FINE_LOCATION)
                      != PackageManager.PERMISSION_GRANTED) {

                  if (context instanceof Activity) {
                      ((Activity) context).requestPermissions(
                              new String[]{
                                      Manifest.permission.ACCESS_FINE_LOCATION,
                                      Manifest.permission.ACCESS_COARSE_LOCATION},
                              LOCATION_REQUEST);
                  }

                  return;
              }

              LocationComponentOptions options =
                      LocationComponentOptions.builder(context)
                              .pulseEnabled(true)
                              .build();

              LocationComponentActivationOptions activation =
                      LocationComponentActivationOptions.builder(
                              context,
                              map.getStyle())
                              .locationComponentOptions(options)
                              .build();

              map.getLocationComponent()
                      .activateLocationComponent(
                              activation);

              map.getLocationComponent()
                      .setLocationComponentEnabled(true);
          }

          public void zoomIn() {

              if (map == null) {
                  return;
              }

              double zoom =
                      map.getCameraPosition().zoom;

              map.animateCamera(
                      CameraUpdateFactory.zoomTo(
                              Math.min(20.0, zoom + 1.0)),
                      250);
          }

          public void zoomOut() {

              if (map == null) {
                  return;
              }

              double zoom =
                      map.getCameraPosition().zoom;

              map.animateCamera(
                      CameraUpdateFactory.zoomTo(
                              Math.max(1.0, zoom - 1.0)),
                      250);
          }

          public void recenter() {

              if (map == null) {
                  return;
              }

              try {
                  Location location =
                          map.getLocationComponent()
                                  .getLastKnownLocation();

                  if (location == null) {
                      return;
                  }

                  LatLng target =
                          new LatLng(
                                  location.getLatitude(),
                                  location.getLongitude());

                  map.animateCamera(
                          CameraUpdateFactory.newLatLngZoom(
                                  target,
                                  16.0),
                          500);

              } catch (Exception ignored) {
              }
          }

          public void onHostResume() {
              mapView.onResume();
          }

          public void onHostPause() {
              mapView.onPause();
          }

          public void onHostDestroy() {
              mapView.onDestroy();
          }
      }
      EOF

      test -s "$SRC/NavigationMapView.java"

      grep -Fq \
        'https://tiles.openfreemap.org/styles/liberty' \
        "$SRC/NavigationMapView.java"

      echo "NavigationMapView created."

  - name: Patch V10CarActivity to Navigation background + transparent Home overlay
    shell: bash
    run: |
      set -euo pipefail

      FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

      test -f "$FILE"

      python3 - <<'PY'
      from pathlib import Path

      file = Path(
          "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
      )

      text = file.read_text(encoding="utf-8")

      def method(source, signature):
          start = source.find(signature)

          if start < 0:
              raise SystemExit(
                  "METHOD NOT FOUND: " + signature
              )

          brace = source.find("{", start)

          if brace < 0:
              raise SystemExit(
                  "OPENING BRACE NOT FOUND: " + signature
              )

          depth = 0
          quote = False
          escape = False
          line_comment = False
          block_comment = False

          i = brace

          while i < len(source):
              c = source[i]
              n = source[i + 1] if i + 1 < len(source) else ""

              if line_comment:
                  if c == "\n":
                      line_comment = False

              elif block_comment:
                  if c == "*" and n == "/":
                      block_comment = False
                      i += 1

              elif quote:
                  if escape:
                      escape = False
                  elif c == "\\":
                      escape = True
                  elif c == '"':
                      quote = False

              else:
                  if c == "/" and n == "/":
                      line_comment = True
                      i += 1
                  elif c == "/" and n == "*":
                      block_comment = True
                      i += 1
                  elif c == '"':
                      quote = True
                  elif c == "{":
                      depth += 1
                  elif c == "}":
                      depth -= 1
                      if depth == 0:
                          return start, i + 1

              i += 1

          raise SystemExit(
              "CLOSING BRACE NOT FOUND: " + signature
          )

      # ----------------------------------------------------------
      # IMPORTS
      # ----------------------------------------------------------

      if "import android.content.pm.ApplicationInfo;" not in text:
          text = text.replace(
              "import android.content.pm.ResolveInfo;",
              "import android.content.pm.ResolveInfo;\n"
              "import android.content.pm.ApplicationInfo;",
              1
          )

      if "import android.widget.ImageView;" not in text:
          text = text.replace(
              "import android.widget.FrameLayout;",
              "import android.widget.FrameLayout;\n"
              "import android.widget.ImageView;",
              1
          )

      # ----------------------------------------------------------
      # FIELD
      # ----------------------------------------------------------

      if "private NavigationMapView navigationMap;" not in text:
          marker = "private FrameLayout projectionLayer;"

          text = text.replace(
              marker,
              marker
              + "\n"
              + "    private NavigationMapView navigationMap;",
              1
          )

      # ----------------------------------------------------------
      # BUILD UI
      #
      # FrameLayout order:
      #
      #   0 = Navigation full-screen
      #   1 = Home UI transparent overlay
      #   2 = Projection layer when needed
      #
      # ----------------------------------------------------------

      start, end = method(
          text,
          "private void buildUi("
      )

      build_ui = r'''private void buildUi() {

          root =
                  new FrameLayout(this);

          root.setBackgroundColor(
                  Color.TRANSPARENT);

          // ----------------------------------------------------
          // NAVIGATION = FULL SCREEN BACKGROUND
          // ----------------------------------------------------

          navigationMap =
                  new NavigationMapView(this);

          FrameLayout.LayoutParams
                  navigationParams =
                  new FrameLayout.LayoutParams(
                          -1,
                          -1);

          root.addView(
                  navigationMap,
                  navigationParams);

          // ----------------------------------------------------
          // EXISTING PROJECTION LAYER
          // ----------------------------------------------------

          projectionLayer =
                  new FrameLayout(this);

          projectionLayer.setVisibility(
                  View.GONE);

          root.addView(
                  projectionLayer,
                  new FrameLayout.LayoutParams(
                          -1,
                          -1));

          // ----------------------------------------------------
          // HOME UI V2 = TRANSPARENT OVERLAY
          // ----------------------------------------------------

          launcherLayer =
                  new LinearLayout(this);

          launcherLayer.setOrientation(
                  LinearLayout.VERTICAL);

          launcherLayer.setPadding(
                  dp(18),
                  dp(12),
                  dp(18),
                  dp(8));

          launcherLayer.setBackgroundColor(
                  Color.TRANSPARENT);

          FrameLayout.LayoutParams
                  overlayParams =
                  new FrameLayout.LayoutParams(
                          -1,
                          -1);

          root.addView(
                  launcherLayer,
                  overlayParams);

          buildDashboard();
          buildAppPanel();

          setContentView(root);
      }'''

      text = text[:start] + build_ui + text[end:]

      # ----------------------------------------------------------
      # BUILD DASHBOARD
      #
      # No MAP card.
      # No opaque Home background.
      # Navigation is underneath this view.
      # ----------------------------------------------------------

      start, end = method(
          text,
          "private void buildDashboard("
      )

      dashboard = r'''private void buildDashboard() {

          dashboard =
                  new LinearLayout(this);

          dashboard.setOrientation(
                  LinearLayout.HORIZONTAL);

          dashboard.setBackgroundColor(
                  Color.TRANSPARENT);

          launcherLayer.addView(
                  dashboard,
                  new LinearLayout.LayoutParams(
                          -1,
                          -1));

          // ----------------------------------------------------
          // LEFT TRANSPARENT SIDEBAR
          // ----------------------------------------------------

          LinearLayout sideBar =
                  new LinearLayout(this);

          sideBar.setOrientation(
                  LinearLayout.VERTICAL);

          sideBar.setGravity(
                  Gravity.CENTER_HORIZONTAL);

          sideBar.setBackgroundColor(
                  Color.TRANSPARENT);

          dashboard.addView(
                  sideBar,
                  new LinearLayout.LayoutParams(
                          dp(96),
                          -1));

          TextView appsButton =
                  buttonText("CHỌN APP");

          appsButton.setOnClickListener(
                  v -> showApps());

          sideBar.addView(
                  appsButton,
                  new LinearLayout.LayoutParams(
                          -1,
                          dp(62)));

          // ----------------------------------------------------
          // QUICK APP DOCK
          // ----------------------------------------------------

          dock =
                  new LinearLayout(this);

          dock.setOrientation(
                  LinearLayout.VERTICAL);

          dock.setGravity(
                  Gravity.TOP);

          dock.setBackgroundColor(
                  Color.TRANSPARENT);

          sideBar.addView(
                  dock,
                  new LinearLayout.LayoutParams(
                          -1,
                          0,
                          1f));

          TextView voiceButton =
                  buttonText("VOICE");

          voiceButton.setOnClickListener(
                  v -> {});

          sideBar.addView(
                  voiceButton,
                  new LinearLayout.LayoutParams(
                          -1,
                          dp(62)));

          TextView tasksButton =
                  buttonText("TASKS");

          tasksButton.setOnClickListener(
                  v -> {});

          sideBar.addView(
                  tasksButton,
                  new LinearLayout.LayoutParams(
                          -1,
                          dp(62)));

          // ----------------------------------------------------
          // MAIN TRANSPARENT AREA
          //
          // Deliberately contains NO MAP CARD.
          // NavigationMapView is underneath the whole UI.
          // ----------------------------------------------------

          LinearLayout main =
                  new LinearLayout(this);

          main.setOrientation(
                  LinearLayout.VERTICAL);

          main.setBackgroundColor(
                  Color.TRANSPARENT);

          dashboard.addView(
                  main,
                  new LinearLayout.LayoutParams(
                          0,
                          -1,
                          1f));

          SpaceHolder spacer =
                  new SpaceHolder(this);

          main.addView(
                  spacer,
                  new LinearLayout.LayoutParams(
                          -1,
                          0,
                          1f));

          // ----------------------------------------------------
          // BOTTOM FLOATING STATUS BAR
          // ----------------------------------------------------

          LinearLayout bottomBar =
                  new LinearLayout(this);

          bottomBar.setOrientation(
                  LinearLayout.HORIZONTAL);

          bottomBar.setGravity(
                  Gravity.CENTER_VERTICAL);

          bottomBar.setPadding(
                  dp(6),
                  dp(4),
                  dp(6),
                  dp(4));

          bottomBar.setBackgroundColor(
                  Color.TRANSPARENT);

          TextView wyn =
                  circleButton("WYN");

          bottomBar.addView(
                  wyn,
                  new LinearLayout.LayoutParams(
                          dp(62),
                          dp(62)));

          TextView media =
                  buttonText("MEDIA");

          bottomBar.addView(
                  media,
                  new LinearLayout.LayoutParams(
                          dp(110),
                          dp(52)));

          main.addView(
                  bottomBar,
                  new LinearLayout.LayoutParams(
                          -1,
                          dp(76)));

          // Keep placeholders transparent.
          // No MediaSession or API is introduced here.
      }'''

      # SpaceHolder is replaced later with plain View.
      dashboard = dashboard.replace(
          "SpaceHolder spacer =\n                      new SpaceHolder(this);",
          "View spacer = new View(this);"
      )

      text = text[:start] + dashboard + text[end:]

      # ----------------------------------------------------------
      # QUICK APPS
      # ----------------------------------------------------------

      start, end = method(
          text,
          "private void rebuildDock("
      )

      dock_method = r'''private void rebuildDock() {

          if (dock == null) {
              return;
          }

          dock.removeAllViews();

          int count =
                  Math.min(
                          4,
                          apps.size());

          for (int i = 0;
               i < count;
               i++) {

              final AppInfo app =
                      apps.get(i);

              LinearLayout tile =
                      new LinearLayout(this);

              tile.setOrientation(
                      LinearLayout.VERTICAL);

              tile.setGravity(
                      Gravity.CENTER);

              GradientDrawable bg =
                      new GradientDrawable();

              bg.setColor(
                      Color.rgb(
                              29,
                              35,
                              42));

              bg.setCornerRadius(
                      dp(12));

              tile.setBackground(bg);

              ImageView icon =
                      new ImageView(this);

              try {
                  ApplicationInfo info =
                          getPackageManager()
                                  .getApplicationInfo(
                                          app.component
                                                  .getPackageName(),
                                          0);

                  icon.setImageDrawable(
                          info.loadIcon(
                                  getPackageManager()));

              } catch (Throwable ignored) {

                  icon.setImageResource(
                          android.R.drawable
                                  .sym_def_app_icon);
              }

              icon.setScaleType(
                      ImageView.ScaleType.CENTER_INSIDE);

              tile.addView(
                      icon,
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(40)));

              TextView label =
                      text(
                              app.name,
                              9,
                              Color.WHITE);

              label.setGravity(
                      Gravity.CENTER);

              label.setMaxLines(1);

              tile.addView(
                      label,
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(18)));

              tile.setOnClickListener(
                      v ->
                              launchProjection(
                                      app.component));

              LinearLayout.LayoutParams params =
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(66));

              params.setMargins(
                      dp(2),
                      dp(3),
                      dp(2),
                      dp(3));

              dock.addView(
                      tile,
                      params);
          }
      }'''

      text = text[:start] + dock_method + text[end:]

      # ----------------------------------------------------------
      # APP TILE WITH REAL ICON
      # ----------------------------------------------------------

      start, end = method(
          text,
          "private LinearLayout appTile("
      )

      app_tile = r'''private LinearLayout appTile(
              AppInfo app) {

          LinearLayout tile =
                  new LinearLayout(this);

          tile.setOrientation(
                  LinearLayout.VERTICAL);

          tile.setGravity(
                  Gravity.CENTER);

          GradientDrawable bg =
                  new GradientDrawable();

          bg.setColor(
                  Color.rgb(
                          22,
                          27,
                          33));

          bg.setCornerRadius(
                  dp(16));

          tile.setBackground(bg);

          ImageView icon =
                  new ImageView(this);

          try {
              ApplicationInfo info =
                      getPackageManager()
                              .getApplicationInfo(
                                      app.component
                                              .getPackageName(),
                                      0);

              icon.setImageDrawable(
                      info.loadIcon(
                              getPackageManager()));

          } catch (Throwable ignored) {

              icon.setImageResource(
                      android.R.drawable
                              .sym_def_app_icon);
          }

          icon.setScaleType(
                  ImageView.ScaleType.CENTER_INSIDE);

          icon.setPadding(
                  dp(8),
                  dp(6),
                  dp(8),
                  dp(6));

          tile.addView(
                  icon,
                  new LinearLayout.LayoutParams(
                          -1,
                          dp(58)));

          TextView name =
                  text(
                          app.name,
                          12,
                          Color.WHITE);

          name.setGravity(
                  Gravity.CENTER);

          name.setMaxLines(2);

          tile.addView(
                  name,
                  new LinearLayout.LayoutParams(
                          -1,
                          dp(42)));

          tile.setOnClickListener(
                  v -> {

                      hideApps();

                      launchProjection(
                              app.component);
                  });

          return tile;
      }'''

      text = text[:start] + app_tile + text[end:]

      # ----------------------------------------------------------
      # LAUNCH PROJECTION
      #
      # Navigation remains background when Home is visible.
      # Projection still takes over only when an app is selected.
      # ----------------------------------------------------------

      start, end = method(
          text,
          "private void launchProjection("
      )

      launch = r'''private void launchProjection(
              ComponentName component) {

          if (component == null
                  || session == null) {

              return;
          }

          if (activeTarget != null
                  && !activeTarget.equals(component)) {

              session.release();
          }

          activeTarget =
                  component;

          V10SessionStore
                  .setTarget(
                          this,
                          component);

          launcherLayer
                  .setVisibility(
                          View.GONE);

          appPanel
                  .setVisibility(
                          View.GONE);

          projectionLayer
                  .setVisibility(
                          View.VISIBLE);

          session.setTarget(
                  component);
      }'''

      text = text[:start] + launch + text[end:]

      # ----------------------------------------------------------
      # RETURN TO HOME
      # ----------------------------------------------------------

      start, end = method(
          text,
          "private void returnToLauncher("
      )

      ret = r'''private void returnToLauncher() {

          if (session != null
                  && session.isActive()) {

              session.hideTask();
          }

          projectionLayer
                  .setVisibility(
                          View.GONE);

          launcherLayer
                  .setVisibility(
                          View.VISIBLE);

          dashboard
                  .setVisibility(
                          View.VISIBLE);

          appPanel
                  .setVisibility(
                          View.GONE);
      }'''

      text = text[:start] + ret + text[end:]

      # ----------------------------------------------------------
      # APP PANEL
      # ----------------------------------------------------------

      text = text.replace(
          "appPanel.setBackgroundColor(\n                Color.rgb(\n                        7,\n                        9,\n                        12));",
          "appPanel.setBackgroundColor(\n                Color.TRANSPARENT);"
      )

      # ----------------------------------------------------------
      # REQUIRED CHECKS
      # ----------------------------------------------------------

      required = [
          "private NavigationMapView navigationMap;",
          "navigationMap =",
          "new NavigationMapView(this)",
          "Color.TRANSPARENT",
          "Math.min(",
          "ApplicationInfo",
          "ImageView",
          "loadIcon(",
          'buttonText("CHỌN APP")',
          'buttonText("VOICE")',
          'buttonText("TASKS")',
          '"WYN"',
          '"MEDIA"',
          "private void buildUi()",
          "private void buildDashboard()",
          "private void rebuildDock()",
          "private LinearLayout appTile(",
          "private void launchProjection(",
          "private void returnToLauncher("
      ]

      for marker in required:
          if marker not in text:
              raise SystemExit(
                  "REQUIRED MARKER MISSING: "
                  + marker
              )

      # Old Home MAP card must not exist.
      if '"Navigation"' in text:
          raise SystemExit(
              "ERROR: old Navigation Home card remains."
          )

      if 'text("MAP"' in text:
          raise SystemExit(
              "ERROR: old MAP card remains."
          )

      if "infoCard(" in text:
          raise SystemExit(
              "ERROR: old information cards remain."
          )

      if "initial(app.name)" in text:
          raise SystemExit(
              "ERROR: old letter icons remain."
          )

      file.write_text(
          text,
          encoding="utf-8"
      )

      print(
          "Navigation background + transparent Home overlay patch PASS."
      )
      PY

      grep -Fq \
        "private NavigationMapView navigationMap;" \
        "$FILE"

      grep -Fq \
        "new NavigationMapView(this)" \
        "$FILE"

      grep -Fq \
        "Color.TRANSPARENT" \
        "$FILE"

      if grep -Fq \
        'text("MAP"' \
        "$FILE"; then
        echo "ERROR: MAP card still exists."
        exit 1
      fi

      if grep -Fq \
        'initial(app.name)' \
        "$FILE"; then
        echo "ERROR: letter icon still exists."
        exit 1
      fi

      echo "CarActivity architecture patch PASS."

  - name: Add Navigation lifecycle
    shell: bash
    run: |
      set -euo pipefail

      FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

      grep -Fq \
        "public void onPause()" \
        "$FILE"

      grep -Fq \
        "public void onDestroy()" \
        "$FILE"

      python3 - <<'PY'
      from pathlib import Path

      p = Path(
          "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
      )

      s = p.read_text(encoding="utf-8")

      pause = s.find(
          "public void onPause()"
      )

      if pause < 0:
          raise SystemExit(
              "onPause not found"
          )

      brace = s.find("{", pause)

      depth = 0
      end = -1

      for i in range(brace, len(s)):
          if s[i] == "{":
              depth += 1
          elif s[i] == "}":
              depth -= 1
              if depth == 0:
                  end = i + 1
                  break

      if end < 0:
          raise SystemExit(
              "onPause end not found"
          )

      block = s[pause:end]

      if "navigationMap.onHostPause();" not in block:
          block = block.replace(
              "super.onPause();",
              "if (navigationMap != null) {\n"
              "            navigationMap.onHostPause();\n"
              "        }\n\n"
              "        super.onPause();",
              1
          )

      s = s[:pause] + block + s[end:]

      destroy = s.find(
          "public void onDestroy()"
      )

      if destroy < 0:
          raise SystemExit(
              "onDestroy not found"
          )

      brace = s.find("{", destroy)

      depth = 0
      end = -1

      for i in range(brace, len(s)):
          if s[i] == "{":
              depth += 1
          elif s[i] == "}":
              depth -= 1
              if depth == 0:
                  end = i + 1
                  break

      if end < 0:
          raise SystemExit(
              "onDestroy end not found"
          )

      block = s[destroy:end]

      if "navigationMap.onHostDestroy();" not in block:
          block = block.replace(
              "if (session != null) {",
              "if (navigationMap != null) {\n"
              "            navigationMap.onHostDestroy();\n"
              "            navigationMap = null;\n"
              "        }\n\n"
              "        if (session != null) {",
              1
          )

      s = s[:destroy] + block + s[end:]

      p.write_text(
          s,
          encoding="utf-8"
      )

      print(
          "Navigation lifecycle PASS."
      )
      PY

