name: CarAssistant V10 - Navigation V1 + Home UI V2 Transparent Overlay Safe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout current main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify current V10 source
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source"
          JAVA_SRC="$SRC/app/src/main/java/com/hieptran/aacast/doudou"

          echo "Checking current main source..."

          test -d "$SRC"
          test -f "$SRC/settings.gradle"
          test -f "$SRC/build.gradle"
          test -f "$SRC/gradlew"
          test -f "$SRC/app/build.gradle"
          test -f "$SRC/app/src/main/AndroidManifest.xml"

          test -f "$JAVA_SRC/V10CarActivity.java"
          test -f "$JAVA_SRC/V10ProjectionSession.java"
          test -f "$JAVA_SRC/V10DisplayController.java"
          test -f "$JAVA_SRC/V10SurfaceManager.java"
          test -f "$JAVA_SRC/V10TaskSession.java"
          test -f "$JAVA_SRC/V10SessionStore.java"
          test -f "$JAVA_SRC/NavigationMapView.java"

          echo "PASS: v10-source exists."
          echo "PASS: Gradle files exist."
          echo "PASS: AndroidManifest.xml exists."
          echo "PASS: V10 core source exists."
          echo "PASS: NavigationMapView.java exists."

      - name: Verify Navigation dependency and permissions
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="v10-source/app/build.gradle"
          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          if grep -Fq \
            "org.maplibre.gl:android-sdk:11.11.0" \
            "$GRADLE"; then
            echo "PASS: MapLibre dependency exists."
          else
            echo "ERROR: MapLibre dependency is missing."
            exit 1
          fi

          if grep -Fq \
            "android.permission.ACCESS_FINE_LOCATION" \
            "$MANIFEST"; then
            echo "PASS: ACCESS_FINE_LOCATION exists."
          else
            echo "ERROR: ACCESS_FINE_LOCATION is missing."
            exit 1
          fi

          if grep -Fq \
            "android.permission.ACCESS_COARSE_LOCATION" \
            "$MANIFEST"; then
            echo "PASS: ACCESS_COARSE_LOCATION exists."
          else
            echo "ERROR: ACCESS_COARSE_LOCATION is missing."
            exit 1
          fi

      - name: Verify NavigationMapView source
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          check() {
            local label="$1"
            local pattern="$2"

            if grep -Fq "$pattern" "$FILE"; then
              echo "PASS: $label"
            else
              echo "ERROR: $label"
              echo "Missing: $pattern"
              exit 1
            fi
          }

          check \
            "NavigationMapView class" \
            "class NavigationMapView"

          check \
            "MapLibre initialization" \
            "MapLibre.getInstance"

          check \
            "MapLibre map view" \
            "new MapView"

          check \
            "Location component" \
            "getLocationComponent"

          check \
            "OpenFreeMap Liberty style" \
            "https://tiles.openfreemap.org/styles/liberty"

          check \
            "Zoom in" \
            "public void zoomIn()"

          check \
            "Zoom out" \
            "public void zoomOut()"

          check \
            "Recenter" \
            "public void recenter()"

          check \
            "Host resume" \
            "public void onHostResume()"

          check \
            "Host pause" \
            "public void onHostPause()"

          check \
            "Host destroy" \
            "public void onHostDestroy()"

          echo "PASS: NavigationMapView source verification."

      - name: Verify Home UI V2 source
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          check() {
            local label="$1"
            local pattern="$2"

            if grep -Fq "$pattern" "$FILE"; then
              echo "PASS: $label"
            else
              echo "ERROR: $label"
              echo "Missing: $pattern"
              exit 1
            fi
          }

          check \
            "V10CarActivity" \
            "public final class V10CarActivity"

          check \
            "NavigationMapView field" \
            "private NavigationMapView navigationMap;"

          check \
            "NavigationMapView creation" \
            "navigationMap=new NavigationMapView(this);"

          check \
            "Transparent root" \
            "root.setBackgroundColor(Color.TRANSPARENT);"

          check \
            "Transparent launcher layer" \
            "launcherLayer.setBackgroundColor(Color.TRANSPARENT);"

          check \
            "Transparent dashboard" \
            "dashboard.setBackgroundColor(Color.TRANSPARENT);"

          check \
            "APP selector" \
            'sidebarButton("APP CHỌN")'

          check \
            "TASKS control" \
            '"TASKS"'

          check \
            "MEDIA card" \
            '"MEDIA"'

          check \
            "WYN control" \
            '"WYN"'

          check \
            "Quick launch limit" \
            "Math.min(4,q.size())"

          check \
            "Real application icon" \
            "i.loadIcon(pm)"

          check \
            "Navigation resume" \
            "navigationMap.onHostResume()"

          check \
            "Navigation pause" \
            "navigationMap.onHostPause()"

          check \
            "Navigation destroy" \
            "navigationMap.onHostDestroy()"

          echo "PASS: Home UI V2 source verification."

      - name: Verify Projection Persistence CORE
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$SRC/V10ProjectionSession.java"
          test -f "$SRC/V10DisplayController.java"
          test -f "$SRC/V10SurfaceManager.java"
          test -f "$SRC/V10TaskSession.java"
          test -f "$SRC/V10SessionStore.java"

          sha256sum \
            "$SRC/V10ProjectionSession.java" \
            "$SRC/V10DisplayController.java" \
            "$SRC/V10SurfaceManager.java" \
            "$SRC/V10TaskSession.java" \
            "$SRC/V10SessionStore.java" \
            > /tmp/core.sha256

          echo "Protected CORE files:"
          cat /tmp/core.sha256

          echo "PASS: Projection/Persistence CORE files exist."

      - name: Verify Floating Touch controls
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          check() {
            local label="$1"
            local pattern="$2"

            if grep -Fq "$pattern" "$FILE"; then
              echo "PASS: $label"
            else
              echo "ERROR: $label"
              echo "Missing: $pattern"
              exit 1
            fi
          }

          check \
            "Floating Touch creation" \
            "createFloatingTouchKey()"

          check \
            "Floating Touch timing" \
            "floatingDownTime"

          check \
            "Floating BACK" \
            'addFloatingMenuButton("BACK"'

          check \
            "Floating HOME" \
            'addFloatingMenuButton("HOME"'

          echo "PASS: Floating Touch controls."

      - name: Verify Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="v10-source/app/build.gradle"

          check() {
            local label="$1"
            local pattern="$2"

            if grep -Fq "$pattern" "$GRADLE"; then
              echo "PASS: $label"
            else
              echo "ERROR: $label"
              echo "Missing: $pattern"
              exit 1
            fi
          }

          check \
            "Namespace" \
            "namespace 'com.carassistant.v10'"

          check \
            "Application ID" \
            "applicationId 'com.carassistant.v10'"

          check \
            "Compile SDK" \
            "compileSdk 36"

          check \
            "Min SDK" \
            "minSdk 29"

          check \
            "Target SDK" \
            "targetSdk 36"

          check \
            "Java 17 source compatibility" \
            "JavaVersion.VERSION_17"

          check \
            "MapLibre dependency" \
            "org.maplibre.gl:android-sdk:11.11.0"

          echo "PASS: Gradle configuration."

      - name: Verify no stale navigation source path
        shell: bash
        run: |
          set -euo pipefail

          if grep -RIn \
            "navigation-v1-source" \
            .github/workflows/build-navigation-v1-home-ui-v2-overlay.yml \
            >/tmp/stale-paths.txt 2>/dev/null; then

            echo "ERROR: Stale navigation-v1-source path found:"
            cat /tmp/stale-paths.txt
            exit 1
          fi

          echo "PASS: Workflow contains no navigation-v1-source path."

      - name: Verify no old Foundation commit lock
        shell: bash
        run: |
          set -euo pipefail

          OLD_COMMIT="2c814a181d00cde9547a446927ae181e18cb9cbb"
          WORKFLOW=".github/workflows/build-navigation-v1-home-ui-v2-overlay.yml"

          if grep -Fq "$OLD_COMMIT" "$WORKFLOW"; then
            echo "ERROR: Old Foundation commit is still referenced."
            exit 1
          fi

          echo "PASS: Old Foundation commit is not referenced."

      - name: Git diff safety
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          echo "PASS: git diff --check."

      - name: Compile current V10 source
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            :app:compileDebugJavaWithJavac \
            --stacktrace

          echo "PASS: Java compile."

      - name: Assemble current V10 APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

          echo "PASS: APK assemble."

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find v10-source/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          echo "APK: $APK"

          cp \
            "$APK" \
            CarAssistant-Navigation-V1-Home-UI-V2-Overlay-Safe.apk

          sha256sum \
            CarAssistant-Navigation-V1-Home-UI-V2-Overlay-Safe.apk \
            > CarAssistant-Navigation-V1-Home-UI-V2-Overlay-Safe.sha256

          test -s \
            CarAssistant-Navigation-V1-Home-UI-V2-Overlay-Safe.apk

          echo "SHA256:"
          cat CarAssistant-Navigation-V1-Home-UI-V2-Overlay-Safe.sha256

          echo "PASS: APK package."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-Navigation-V1-Home-UI-V2-Overlay-Safe
          path: |
            CarAssistant-Navigation-V1-Home-UI-V2-Overlay-Safe.apk
            CarAssistant-Navigation-V1-Home-UI-V2-Overlay-Safe.sha256
          if-no-files-found: error
          retention-days: 14
