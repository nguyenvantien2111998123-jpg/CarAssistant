name: CarAsistant Unit Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - projection-background-settings-v1
      - voice-assistant-v1
# Run unit tests and build an installable debug APK; device validation is performed manually.
concurrency:
  group: carassistant-unit-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-unit-test:
    name: Build APK and run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run JUnit unit tests
        working-directory: v10-source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Assemble debug APK
        working-directory: v10-source
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK for physical-device testing
        uses: actions/upload-artifact@v4
        with:
          name: carassistant-debug-apk
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carassistant-unit-test-report
          path: |
            v10-source/app/build/reports/tests/testDebugUnitTest/
            v10-source/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

