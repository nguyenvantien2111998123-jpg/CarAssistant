              "                                    + directConnection",
              "                                            .getResponseMessage();",
              "",
              "                    Log.d(",
              '                            "CarAssistant-Nominatim",',
              '                            "DIRECT IP RESULT "',
              "                                    + directIpTest);",
              "",
              "                    directConnection.disconnect();",
