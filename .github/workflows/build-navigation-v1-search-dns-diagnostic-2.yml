              re.MULTILINE
          )

          end_pattern = re.compile(
              r'^\s*private\s+void\s+postSearchResults\s*\(',
              re.MULTILINE
          )

          start_match = start_pattern.search(text)
          end_match = end_pattern.search(text)

          if not start_match:
              raise SystemExit(
                  "ERROR: searchNominatim() method signature was not found."
              )

          if not end_match:
              raise SystemExit(
                  "ERROR: postSearchResults() boundary was not found."
              )

          start = start_match.start()
          end = end_match.start()

          new_method_lines = [
              "    private void searchNominatim(String query) {",
              '        final String host = "nominatim.openstreetmap.org";',
              "",
              '        String systemDns = "NOT_TESTED";',
              '        String dohDns = "NOT_TESTED";',
              '        String directIpTest = "NOT_TESTED";',
              '        String stage = "START";',
              "",
              "        try {",
              "            /*",
              "             * =====================================================",
              "             * TEST 1 — ANDROID / SYSTEM DNS",
              "             * =====================================================",
              "             */",
              '            stage = "SYSTEM_DNS";',
              "",
              "            try {",
              "                java.net.InetAddress[] addresses =",
              "                        java.net.InetAddress.getAllByName(host);",
              "",
              "                StringBuilder resolved =",
              "                        new StringBuilder();",
              "",
              "                for (java.net.InetAddress address : addresses) {",
              "                    if (resolved.length() > 0) {",
              '                        resolved.append(", ");',
              "                    }",
              "                    resolved.append(",
              "                            address.getHostAddress());",
              "                }",
              "                systemDns =",
              "                        resolved.toString();",
              "",
              "                Log.d(",
              '                        "CarAssistant-Nominatim",',
              '                        "SYSTEM DNS OK host="',
              "                                + host",
              '                                + " addresses="',
              "                                + systemDns);",
              "",
              "            } catch (Exception dnsException) {",
              "                systemDns =",
              "                        dnsException.getClass()",
              "                                .getSimpleName()",
              '                                + ": "',
              "                                + String.valueOf(",
              "                                        dnsException.getMessage());",
              "",
              "                Log.e(",
              '                        "CarAssistant-Nominatim",',
              '                        "SYSTEM DNS FAILED "',
              "                                + systemDns,",
              "                                dnsException);",
              "            }",
              "",
              "            /*",
              "             * =====================================================",
              "             * TEST 2 — DNS OVER HTTPS",
              "             *",
              "             * Không dùng Android/System DNS để hỏi hostname.",
              "             * Kết nối trực tiếp tới Cloudflare 1.1.1.1.",
              "             * =====================================================",
              "             */",
              '            stage = "DNS_OVER_HTTPS";',
              "",
              "            String dohUrl =",
              '                    "https://1.1.1.1/dns-query"',
              '                            + "?name="',
              "                            + URLEncoder.encode(",
              "                                    host,",
              '                                    "UTF-8")',
              '                            + "&type=A";',
              "",
              "            javax.net.ssl.HttpsURLConnection dohConnection =",
              "                    (javax.net.ssl.HttpsURLConnection)",
              "                            new URL(dohUrl).openConnection();",
              "",
              '            dohConnection.setRequestMethod("GET");',
              "            dohConnection.setConnectTimeout(8000);",
              "            dohConnection.setReadTimeout(8000);",
              "            dohConnection.setUseCaches(false);",
              "",
              "            dohConnection.setRequestProperty(",
              '                    "Accept",',
              '                    "application/dns-json");',
              "",
              "            dohConnection.setRequestProperty(",
              '                    "Host",',
              '                    "cloudflare-dns.com");',
              "",
              "            dohConnection.setHostnameVerifier(",
              "                    (hostname, session) -> true);",
              "",
              "            int dohCode =",
              "                    dohConnection.getResponseCode();",
              "",
              '            String dohBody = "";',
              "",
              "            InputStream dohInput =",
              "                    dohCode == 200",
              "                            ? dohConnection.getInputStream()",
              "                            : dohConnection.getErrorStream();",
              "",
              "            if (dohInput != null) {",
              "                BufferedReader dohReader =",
              "                        new BufferedReader(",
              "                                new InputStreamReader(",
              "                                        dohInput,",
