          start_pattern = re.compile(
              r'^\s*private\s+void\s+searchNominatim\s*\(',
              re.MULTILINE
          )
          end_pattern = re.compile(
              r'^\s*private\s+void\s+postSearchResults\s*\(',
              re.MULTILINE
          )

          start_match = start_pattern.search(text)
          end_match = end_pattern.search(text)

          if not start_match:
              raise SystemExit("ERROR: searchNominatim() method signature was not found.")

          if not end_match:
              raise SystemExit("ERROR: postSearchResults() boundary was not found.")

          start = start_match.start()
          end = end_match.start()

          new_method_lines = [
