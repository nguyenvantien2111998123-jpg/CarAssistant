name: "CarAssistant V10 - Navigation V1 Search DNS Diagnostic 2"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout current main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify current V10 source
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source"
          JAVA_SRC="$SRC/app/src/main/java/com/hieptran/aacast/doudou"

          echo "Checking current main source..."

          test -d "$SRC"
          test -f "$SRC/settings.gradle"
          test -f "$SRC/build.gradle"
          test -f "$SRC/gradlew"
          test -f "$SRC/app/build.gradle"
          test -f "$SRC/app/src/main/AndroidManifest.xml"

          test -f "$JAVA_SRC/V10CarActivity.java"
          test -f "$JAVA_SRC/V10ProjectionSession.java"
          test -f "$JAVA_SRC/V10DisplayController.java"
          test -f "$JAVA_SRC/V10SurfaceManager.java"
          test -f "$JAVA_SRC/V10TaskSession.java"
          test -f "$JAVA_SRC/V10SessionStore.java"
          test -f "$JAVA_SRC/NavigationMapView.java"

          echo "PASS: v10-source exists."
          echo "PASS: Gradle files exist."
          echo "PASS: AndroidManifest.xml exists."
          echo "PASS: V10 CORE source exists."
          echo "PASS: NavigationMapView.java exists."

      - name: Verify obsolete source directory is absent
        shell: bash
        run: |
          set -euo pipefail

          if [ -e "navigation-v1-source" ]; then
            echo "ERROR: Obsolete source directory exists."
            exit 1
          fi

          echo "PASS: Obsolete source directory is absent."

      - name: Verify current Git revision
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_COMMIT="$(git rev-parse HEAD)"
          OLD_COMMIT="2c814a181d00cde9547a446927ae181e18cb9cbb"

          echo "Current main commit:"
          echo "$CURRENT_COMMIT"

          if [ "$CURRENT_COMMIT" = "$OLD_COMMIT" ]; then
            echo "ERROR: Repository is unexpectedly pointing to the old Foundation commit."
            exit 1
          fi

          echo "PASS: Current main revision is not the old Foundation commit."

      - name: Verify Navigation dependency and permissions
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="v10-source/app/build.gradle"
          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          if grep -Fq "org.maplibre.gl:android-sdk:11.11.0" "$GRADLE"; then
            echo "PASS: MapLibre dependency exists."
          else
            echo "ERROR: MapLibre dependency is missing."
            exit 1
          fi

          if grep -Fq "android.permission.ACCESS_FINE_LOCATION" "$MANIFEST"; then
            echo "PASS: ACCESS_FINE_LOCATION exists."
          else
            echo "ERROR: ACCESS_FINE_LOCATION is missing."
            exit 1
          fi

          if grep -Fq "android.permission.ACCESS_COARSE_LOCATION" "$MANIFEST"; then
            echo "PASS: ACCESS_COARSE_LOCATION exists."
          else
            echo "ERROR: ACCESS_COARSE_LOCATION is missing."
            exit 1
          fi

      - name: Verify NavigationMapView source
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          check() {
            local label="$1"
            local pattern="$2"

            if grep -Fq "$pattern" "$FILE"; then
              echo "PASS: $label"
            else
              echo "ERROR: $label"
              echo "Missing: $pattern"
              exit 1
            fi
          }

          check "NavigationMapView class" "class NavigationMapView"
          check "MapLibre initialization" "MapLibre.getInstance"
          check "MapLibre map view" "new MapView"
          check "Location component" "getLocationComponent"
          check "OpenFreeMap Liberty style" "https://tiles.openfreemap.org/styles/liberty"
          check "Zoom in" "public void zoomIn()"
          check "Zoom out" "public void zoomOut()"
          check "Recenter" "public void recenter()"
          check "Host resume" "public void onHostResume()"
          check "Host pause" "public void onHostPause()"
          check "Host destroy" "public void onHostDestroy()"

          echo "PASS: NavigationMapView source verification."

      - name: Patch ONLY searchNominatim DNS Diagnostic 2
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          python3 <<'PY'
          import re
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/"
              "com/hieptran/aacast/doudou/NavigationMapView.java"
          )

          text = path.read_text(encoding="utf-8")

          start_pattern = re.compile(
              r'^\s*private\s+void\s+searchNominatim\s*\(',
              re.MULTILINE
          )

          end_pattern = re.compile(
              r'^\s*private\s+void\s+postSearchResults\s*\(',
              re.MULTILINE
          )

          start_match = start_pattern.search(text)
          end_match = end_pattern.search(text)

          if not start_match:
              raise SystemExit(
                  "ERROR: searchNominatim() method signature was not found."
              )

          if not end_match:
              raise SystemExit(
                  "ERROR: postSearchResults() boundary was not found."
              )

          start = start_match.start()
          end = end_match.start()

          new_method_lines = [
              "    private void searchNominatim(String query) {",
              '        final String host = "nominatim.openstreetmap.org";',
              "",
              '        String systemDns = "NOT_TESTED";',
              '        String dohDns = "NOT_TESTED";',
              '        String directIpTest = "NOT_TESTED";',
              '        String stage = "START";',
              "",
              "        try {",
              "            /*",
              "             * =====================================================",
              "             * TEST 1 — ANDROID / SYSTEM DNS",
              "             * =====================================================",
              "             */",
              '            stage = "SYSTEM_DNS";',
              "",
              "            try {",
              "                java.net.InetAddress[] addresses =",
              "                        java.net.InetAddress.getAllByName(host);",
              "",
              "                StringBuilder resolved =",
              "                        new StringBuilder();",
              "",
              "                for (java.net.InetAddress address : addresses) {",
              "                    if (resolved.length() > 0) {",
              '                        resolved.append(", ");',
              "                    }",
              "                    resolved.append(",
              "                            address.getHostAddress());",
              "                }",
              "                systemDns =",
              "                        resolved.toString();",
              "",
              "                Log.d(",
              '                        "CarAssistant-Nominatim",',
              '                        "SYSTEM DNS OK host="',
              "                                + host",
              '                                + " addresses="',
              "                                + systemDns);",
              "",
              "            } catch (Exception dnsException) {",
              "                systemDns =",
              "                        dnsException.getClass()",
              "                                .getSimpleName()",
              '                                + ": "',
              "                                + String.valueOf(",
              "                                        dnsException.getMessage());",
              "",
              "                Log.e(",
              '                        "CarAssistant-Nominatim",',
              '                        "SYSTEM DNS FAILED "',
              "                                + systemDns,",
              "                                dnsException);",
              "            }",
              "",
              "            /*",
              "             * =====================================================",
              "             * TEST 2 — DNS OVER HTTPS",
              "             *",
              "             * Không dùng Android/System DNS để hỏi hostname.",
              "             * Kết nối trực tiếp tới Cloudflare 1.1.1.1.",
              "             * =====================================================",
              "             */",
              '            stage = "DNS_OVER_HTTPS";',
              "",
              "            String dohUrl =",
              '                    "https://1.1.1.1/dns-query"',
              '                            + "?name="',
              "                            + URLEncoder.encode(",
              "                                    host,",
              '                                    "UTF-8")',
              '                            + "&type=A";',
              "",
              "            javax.net.ssl.HttpsURLConnection dohConnection =",
              "                    (javax.net.ssl.HttpsURLConnection)",
              "                            new URL(dohUrl).openConnection();",
              "",
              '            dohConnection.setRequestMethod("GET");',
              "            dohConnection.setConnectTimeout(8000);",
              "            dohConnection.setReadTimeout(8000);",
              "            dohConnection.setUseCaches(false);",
              "",
              "            dohConnection.setRequestProperty(",
              '                    "Accept",',
              '                    "application/dns-json");',
              "",
              "            dohConnection.setRequestProperty(",
              '                    "Host",',
              '                    "cloudflare-dns.com");',
              "",
              "            dohConnection.setHostnameVerifier(",
              "                    (hostname, session) -> true);",
              "",
              "            int dohCode =",
              "                    dohConnection.getResponseCode();",
              "",
              '            String dohBody = "";',
              "",
              "            InputStream dohInput =",
              "                    dohCode == 200",
              "                            ? dohConnection.getInputStream()",
              "                            : dohConnection.getErrorStream();",
              "",
              "            if (dohInput != null) {",
              "                BufferedReader dohReader =",
              "                        new BufferedReader(",
              "                                new InputStreamReader(",
              "                                        dohInput,",
              '                                        "UTF-8"));',
              "",
              "                StringBuilder dohText =",
              "                        new StringBuilder();",
              "",
              "                String dohLine;",
              "",
              "                while ((dohLine =",
              "                        dohReader.readLine()) != null) {",
              "                    dohText.append(dohLine);",
              "                }",
              "                dohReader.close();",
              "                dohBody = dohText.toString();",
              "            }",
              "",
              '            String dohResolvedIp = "";',
              "",
              "            if (dohCode == 200",
              "                    && !dohBody.isEmpty()) {",
              "",
              "                JSONObject dohJson =",
              "                        new JSONObject(dohBody);",
              "",
              "                int dnsStatus =",
              "                        dohJson.optInt(",
              '                                "Status",',
              "                                -1);",
              "",
              "                JSONArray answers =",
              "                        dohJson.optJSONArray(",
              '                                "Answer");',
              "",
              "                StringBuilder addresses =",
              "                        new StringBuilder();",
              "",
              "                if (answers != null) {",
              "                    for (int i = 0;",
              "                         i < answers.length();",
              "                         i++) {",
              "                        JSONObject answer =",
              "                                answers.optJSONObject(i);",
              "",
              "                        if (answer == null) {",
              "                            continue;",
              "                        }",
              "                        if (answer.optInt(",
              '                                "type",',
              "                                -1) != 1) {",
              "                            continue;",
              "                        }",
              "                        String data =",
              "                                answer.optString(",
              '                                        "data",',
              '                                        "");',
              "                        if (data.isEmpty()) {",
              "                            continue;",
              "                        }",
              "                        if (addresses.length() > 0) {",
              '                            addresses.append(", ");',
              "                        }",
              "                        addresses.append(data);",
              "                        if (dohResolvedIp.isEmpty()) {",
              "                            dohResolvedIp = data;",
              "                        }",
              "                    }",
              "                }",
              "",
              "                dohDns =",
              '                        "HTTP "',
              "                                + dohCode",
              '                                + ", Status="',
              "                                + dnsStatus",
              '                                + ", A="',
              "                                + (addresses.length() == 0",
              '                                        ? "NONE"',
              "                                        : addresses.toString());",
              "",
              "            } else {",
              "                dohDns =",
              '                        "HTTP "',
              "                                + dohCode",
              '                                + ", BODY="',
              "                                + (dohBody.isEmpty()",
              '                                        ? "(empty)"',
              "                                        : dohBody);",
              "            }",
              "            dohConnection.disconnect();",
              "",
              "            Log.d(",
              '                    "CarAssistant-Nominatim",',
              '                    "DOH RESULT "',
              "                            + dohDns);",
              "",
              "            /*",
              "             * =====================================================",
              "             * TEST 3 — HTTPS TRỰC TIẾP TỚI IP",
              "             * =====================================================",
              "             */",
              "            if (!dohResolvedIp.isEmpty()) {",
              '                stage = "DIRECT_IP";',
              "                try {",
              "                    String encoded =",
              "                            URLEncoder.encode(",
              "                                    query,",
              '                                    "UTF-8");',
              "",
              "                    URL directUrl =",
              "                            new URL(",
              '                                    "https://"',
              "                                            + dohResolvedIp",
              '                                            + "/search"',
              '                                            + "?format=jsonv2"',
              '                                            + "&limit=5"',
              '                                            + "&accept-language=vi"',
              '                                            + "&q="',
              "                                            + encoded);",
              "",
              "                    javax.net.ssl.HttpsURLConnection",
              "                            directConnection =",
              "                            (javax.net.ssl.HttpsURLConnection)",
              "                                    directUrl.openConnection();",
              "",
              "                    directConnection.setRequestMethod(",
              '                            "GET");',
              "                    directConnection.setConnectTimeout(",
              "                            8000);",
              "                    directConnection.setReadTimeout(",
              "                            10000);",
              "                    directConnection.setUseCaches(",
              "                            false);",
              "",
              "                    directConnection.setRequestProperty(",
              '                            "Host",',
              "                            host);",
              "                    directConnection.setRequestProperty(",
              '                            "User-Agent",',
              '                            "CarAssistant-NavigationV3/1.0");',
              "                    directConnection.setRequestProperty(",
              '                            "Accept",',
              '                            "application/json");',
              "                    directConnection.setRequestProperty(",
              '                            "Accept-Language",',
              '                            "vi-VN,vi;q=0.9");',
              "                    directConnection.setHostnameVerifier(",
              "                            (hostname, session) -> true);",
              "",
              "                    int directCode =",
              "                            directConnection",
              "                                    .getResponseCode();",
              "",
              "                    directIpTest =",
              '                            "HTTPS IP="',
              "                                    + dohResolvedIp",
              '                                    + " HTTP="',
              "                                    + directCode",
              '                                    + " "',
              "                                    + directConnection",
              "                                            .getResponseMessage();",
              "",
              "                    Log.d(",
              '                            "CarAssistant-Nominatim",',
              '                            "DIRECT IP RESULT "',
              "                                    + directIpTest);",
              "",
              "                    directConnection.disconnect();",
              "",
              "                } catch (Exception directException) {",
              "                    directIpTest =",
              '                            "HTTPS IP="',
              "                                    + dohResolvedIp",
              '                                    + " FAILED "',
              "                                    + directException",
              "                                            .getClass()",
              "                                            .getSimpleName()",
              '                                    + ": "',
              "                                    + String.valueOf(",
              "                                            directException",
              "                                                    .getMessage());",
              "",
              "                    Log.e(",
              '                            "CarAssistant-Nominatim",',
              '                            "DIRECT IP FAILED "',
              "                                    + directIpTest,",
              "                                    directException);",
              "                }",
              "            } else {",
              "                directIpTest =",
              '                        "SKIPPED: DoH returned no IPv4";',
              "            }",
              "",
              "            /*",
              "             * =====================================================",
              "             * HIỂN THỊ KẾT QUẢ CHẨN ĐOÁN",
              "             * =====================================================",
              "             */",
              "            String diagnostic =",
              '                    "NOMINATIM DNS DIAGNOSTIC 2\\n"',
              '                            + "SYSTEM DNS: "',
              "                            + systemDns",
              '                            + "\\n"',
              '                            + "DNS-OVER-HTTPS: "',
              "                            + dohDns",
              '                            + "\\n"',
              '                            + "DIRECT HTTPS IP: "',
              "                            + directIpTest",
              '                            + "\\n"',
              '                            + "HOST: "',
              "                            + host;",
              "",
              "            Log.e(",
              '                    "CarAssistant-Nominatim",',
              "                    diagnostic);",
              "",
              "            postSearchMessage(",
              "                    diagnostic);",
              "",
              "        } catch (Exception e) {",
              "            String diagnostic =",
              '                    "NOMINATIM DNS DIAGNOSTIC 2\\n"',
              '                            + "STAGE: "',
              "                            + stage",
              '                            + "\\n"',
              '                            + "SYSTEM DNS: "',
              "                            + systemDns",
              '                            + "\\n"',
              '                            + "DNS-OVER-HTTPS: "',
              "                            + dohDns",
              '                            + "\\n"',
              '                            + "DIRECT HTTPS IP: "',
              "                            + directIpTest",
              '                            + "\\n"',
              '                            + "EXCEPTION: "',
              "                            + e.getClass()",
              "                                    .getSimpleName()",
              '                            + "\\n"',
              '                            + "MESSAGE: "',
              "                            + String.valueOf(",
              "                                    e.getMessage());",
              "",
              "            Log.e(",
              '                    "CarAssistant-Nominatim",',
              "                    diagnostic,",
              "                    e);",
              "",
              "            postSearchMessage(",
              "                    diagnostic);",
              "        }",
              "    }\n\n"
          ]

          new_method = "\n".join(new_method_lines)

          patched = (
              text[:start] + new_method + text[end:]
          )

          path.write_text(
              patched,
              encoding="utf-8"
          )

          print(
              "PASS: Only searchNominatim() replaced "
              "with DNS Diagnostic 2."
          )
          PY

      - name: Verify diagnostic patch scope
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          check() {
            local label="$1"
            local pattern="$2"

            if grep -Fq "$pattern" "$FILE"; then
              echo "PASS: $label"
            else
              echo "ERROR: $label"
              echo "Missing: $pattern"
              exit 1
            fi
          }

          check "System DNS diagnostic" "getAllByName"
          check "DoH diagnostic" "1.1.1.1/dns-query"
          check "Direct IP diagnostic" "dohResolvedIp"
          check "Hostname verifier" "setHostnameVerifier"
          check "Runtime Log tag" "CarAssistant-Nominatim"

          check "MapLibre initialization preserved" "MapLibre.getInstance"
          check "OpenFreeMap preserved" "https://tiles.openfreemap.org/styles/liberty"
          check "Location component preserved" "getLocationComponent"
          check "Navigation class preserved" "class NavigationMapView"

          echo "PASS: Diagnostic patch scope verified."
          echo "PASS: Only searchNominatim() diagnostic was added."

      - name: Verify Home UI V2 source
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          check() {
            local label="$1"
            local pattern="$2"

            if grep -Fq "$pattern" "$FILE"; then
              echo "PASS: $label"
            else
              echo "ERROR: $label"
              echo "Missing: $pattern"
              exit 1
            fi
          }

          check "V10CarActivity" "public final class V10CarActivity"
          check "NavigationMapView field" "private NavigationMapView navigationMap;"
          check "NavigationMapView creation" "navigationMap=new NavigationMapView(this);"

          check "Transparent root" "root.setBackgroundColor(Color.TRANSPARENT);"
          check "Transparent launcher layer" "launcherLayer.setBackgroundColor(Color.TRANSPARENT);"
          check "Transparent dashboard" "dashboard.setBackgroundColor(Color.TRANSPARENT);"

          check "APP selector" 'sidebarButton("APP CHỌN")'
          check "TASKS control" '"TASKS"'
          check "MEDIA card" '"MEDIA"'
          check "WYN control" '"WYN"'

          check "Quick launch limit" "Math.min(4,q.size())"
          check "Real application icon" "i.loadIcon(pm)"

          check "Navigation resume" "navigationMap.onHostResume()"
          check "Navigation pause" "navigationMap.onHostPause()"
          check "Navigation destroy" "navigationMap.onHostDestroy()"

          echo "PASS: Home UI V2 source verification."

      - name: Verify Projection Persistence CORE
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$SRC/V10ProjectionSession.java"
          test -f "$SRC/V10DisplayController.java"
          test -f "$SRC/V10SurfaceManager.java"
          test -f "$SRC/V10TaskSession.java"
          test -f "$SRC/V10SessionStore.java"

          sha256sum \
            "$SRC/V10ProjectionSession.java" \
            "$SRC/V10DisplayController.java" \
            "$SRC/V10SurfaceManager.java" \
            "$SRC/V10TaskSession.java" \
            "$SRC/V10SessionStore.java" \
            > /tmp/core.sha256

          echo "Protected CORE files:"
          cat /tmp/core.sha256

          echo "PASS: Projection/Persistence CORE files exist."

      - name: Verify Floating Touch controls
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          check() {
            local label="$1"
            local pattern="$2"

            if grep -Fq "$pattern" "$FILE"; then
              echo "PASS: $label"
            else
              echo "ERROR: $label"
              echo "Missing: $pattern"
              exit 1
            fi
          }

          check "Floating Touch creation" "createFloatingTouchKey()"
          check "Floating Touch timing" "floatingDownTime"
          check "Floating BACK" 'addFloatingMenuButton("BACK"'
          check "Floating HOME" 'addFloatingMenuButton("HOME"'

          echo "PASS: Floating Touch controls."

      - name: Verify Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="v10-source/app/build.gradle"

          echo "Actual application configuration:"
          grep -nE \
            "namespace|applicationId|compileSdk|minSdk|targetSdk|versionCode|versionName|VERSION_17|android-sdk:11.11.0" \
            "$GRADLE" || true

          if grep -Fq "namespace 'com.carassistant.v10'" "$GRADLE"; then
            echo "PASS: Namespace = com.carassistant.v10"
          else
            echo "ERROR: Namespace does not match current source."
            exit 1
          fi

          if grep -Fq 'applicationId "com.carassistant.v10"' "$GRADLE"; then
            echo "PASS: Application ID = com.carassistant.v10"
          else
            echo "ERROR: Application ID does not match current source."
            exit 1
          fi

          if grep -Fq "compileSdk 36" "$GRADLE"; then
            echo "PASS: Compile SDK = 36"
          else
            echo "ERROR: compileSdk 36 is missing."
            exit 1
          fi

          if grep -Fq "minSdk 29" "$GRADLE"; then
            echo "PASS: Min SDK = 29"
          else
            echo "ERROR: minSdk 29 is missing."
            exit 1
          fi

          if grep -Fq "targetSdk 36" "$GRADLE"; then
            echo "PASS: Target SDK = 36"
          else
            echo "ERROR: targetSdk 36 is missing."
            exit 1
          fi

          if grep -Fq "JavaVersion.VERSION_17" "$GRADLE"; then
            echo "PASS: Java 17 configuration."
          else
            echo "ERROR: Java 17 configuration is missing."
            exit 1
          fi

          if grep -Fq "org.maplibre.gl:android-sdk:11.11.0" "$GRADLE"; then
            echo "PASS: MapLibre 11.11.0."
          else
            echo "ERROR: MapLibre 11.11.0 is missing."
            exit 1
          fi

          echo "PASS: Gradle configuration matches current v10-source."

      - name: Verify AndroidManifest components
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          check() {
            local label="$1"
            local pattern="$2"

            if grep -Fq "$pattern" "$MANIFEST"; then
              echo "PASS: $label"
            else
              echo "ERROR: $label"
              echo "Missing: $pattern"
              exit 1
            fi
          }

          check "V10LauncherActivity" 'com.carassistant.v10.V10LauncherActivity'
          check "V10CarActivity" 'com.carassistant.v10.V10CarActivity'
          check "V10ControlReceiver" 'com.carassistant.v10.V10ControlReceiver'
          check "AACastCarService" 'com.carassistant.v10.AACastCarService'
          check "DockStateProvider" 'com.carassistant.v10.DockStateProvider'
          check "Android Auto projection category" 'com.google.android.gms.car.category.CATEGORY_PROJECTION'
          check "Android Auto OEM projection category" 'com.google.android.gms.car.category.CATEGORY_PROJECTION_OEM'

          echo "PASS: AndroidManifest components."

      - name: Verify repository is build-only and source is untouched
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository root:"
          git rev-parse --show-toplevel

          echo "Current commit:"
          git rev-parse HEAD

          echo "Current branch/ref:"
          git branch --show-current || true

          echo "Source directory:"
          ls -la v10-source

          echo "PASS: Repository is ready for source build."

      - name: Verify Gradle wrapper
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew

          chmod +x ./gradlew

          echo "Gradle wrapper version:"
          ./gradlew --version

          echo "PASS: Gradle wrapper is executable."

      - name: Compile current V10 source
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            :app:compileDebugJavaWithJavac \
            --stacktrace

          echo "PASS: Java compile."

      - name: Assemble current V10 APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

          echo "PASS: APK assemble."

      - name: Locate and verify generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find v10-source/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: Generated APK not found."
            echo "APK output directory:"
            find v10-source/app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi

          echo "Generated APK:"
          echo "$APK"

          ls -lh "$APK"

          test -s "$APK"

          echo "PASS: Generated APK exists and is non-empty."

      - name: Package APK for Android Auto testing
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find v10-source/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          cp "$APK" \
            CarAssistant-Navigation-V1-Search-DNS-Diagnostic-2.apk

          sha256sum \
            CarAssistant-Navigation-V1-Search-DNS-Diagnostic-2.apk \
            > CarAssistant-Navigation-V1-Search-DNS-Diagnostic-2.sha256

          test -s \
            CarAssistant-Navigation-V1-Search-DNS-Diagnostic-2.apk

          echo ""
          echo "========================================"
          echo "SEARCH DNS DIAGNOSTIC 2 APK READY"
          echo "========================================"

          echo "APK:"
          ls -lh \
            CarAssistant-Navigation-V1-Search-DNS-Diagnostic-2.apk

          echo ""
          echo "SHA256:"
          cat \
            CarAssistant-Navigation-V1-Search-DNS-Diagnostic-2.sha256

          echo ""
          echo "PASS: Diagnostic APK package ready."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-Navigation-V1-Search-DNS-Diagnostic-2
          path: |
            CarAssistant-Navigation-V1-Search-DNS-Diagnostic-2.apk
            CarAssistant-Navigation-V1-Search-DNS-Diagnostic-2.sha256
          if-no-files-found: error
          retention-days: 14
