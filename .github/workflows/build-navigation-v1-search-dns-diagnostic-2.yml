    - name: Patch ONLY searchNominatim DNS Diagnostic 2
     shell: bash
     run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          python3 <<'PY'
