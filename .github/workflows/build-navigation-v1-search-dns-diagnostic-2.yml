              "            String diagnostic =",
              '                    "NOMINATIM DNS DIAGNOSTIC 2\\n"',
              '                            + "STAGE: "',
              "                            + stage",
              '                            + "\\n"',
              '                            + "SYSTEM DNS: "',
              "                            + systemDns",
              '                            + "\\n"',
              '                            + "DNS-OVER-HTTPS: "',
              "                            + dohDns",
              '                            + "\\n"',
              '                            + "DIRECT HTTPS IP: "',
