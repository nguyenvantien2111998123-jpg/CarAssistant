name: Patch Search Nominatim Diagnostic

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Patch ONLY searchNominatim with Java Brace Matching
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          python3 <<'PY'
          import sys
          from pathlib import Path

          path = Path("v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java")
          if not path.is_file():
              print("ERROR: NavigationMapView.java not found.")
              sys.exit(1)

          text = path.read_text(encoding="utf-8")

          # 1. Bổ sung các import an toàn (chỉ thêm nếu chưa có)
          required_imports = [
              "import java.net.HttpURLConnection;",
              "import java.net.URL;",
              "import java.net.URLEncoder;",
              "import java.io.InputStream;",
              "import java.io.InputStreamReader;",
              "import java.io.BufferedReader;",
              "import javax.net.ssl.HttpsURLConnection;",
              "import javax.net.ssl.HostnameVerifier;",
              "import javax.net.ssl.SSLSession;",
              "import org.json.JSONArray;",
              "import org.json.JSONObject;"
          ]

          for imp in required_imports:
              if imp not in text:
                  text = imp + "\n" + text

          # 2. Định vị bắt đầu phương thức searchNominatim
          target_sig = "private void searchNominatim("
          start_idx = text.find(target_sig)
          if start_idx == -1:
              print("ERROR: Could not find method signature 'private void searchNominatim('")
              sys.exit(1)

          # Tìm ngoặc nhọn mở '{' đầu tiên của hàm
          brace_start = text.find("{", start_idx)
          if brace_start == -1:
              print("ERROR: Could not find opening brace '{' for searchNominatim.")
              sys.exit(1)

          # 3. Thuật toán Java Brace Matching xác định chính xác ngoặc nhọn đóng '}' của hàm
          brace_count = 0
          end_idx = -1
          for i in range(brace_start, len(text)):
              if text[i] == '{':
                  brace_count += 1
              elif text[i] == '}':
                  brace_count -= 1
                  if brace_count == 0:
                      end_idx = i + 1
                      break

          if end_idx == -1 or brace_count != 0:
              print("ERROR: Java brace matching failed. Could not find closing brace for searchNominatim.")
              sys.exit(1)

          # Lấy khoảng lùi đầu dòng
          line_start = text.rfind("\n", 0, start_idx)
          line_start = 0 if line_start == -1 else line_start + 1

          # 4. Nội dung hàm chẩn đoán mới (xung đột tên biến được cô lập 100%)
          new_method_lines = [
              "    private void searchNominatim(String query) {",
              '        String diagHost = "nominatim.openstreetmap.org";',
              "        StringBuilder diagnostic = new StringBuilder();",
              "        String resolvedIp = null;",
              "",
              '        diagnostic.append("NOMINATIM DNS DIAGNOSTIC 2\\n\\n");',
              "",
              "        // TEST 1 — SYSTEM DNS",
              '        diagnostic.append("TEST 1 — SYSTEM DNS\\n");',
              "        try {",
              "            java.net.InetAddress[] addresses = java.net.InetAddress.getAllByName(diagHost);",
              "            if (addresses.length == 0) {",
              '                diagnostic.append("FAIL: no address returned\\n");',
              "            } else {",
              '                diagnostic.append("PASS: ");',
              "                for (int i = 0; i < addresses.length; i++) {",
              '                    if (i > 0) diagnostic.append(", ");',
              "                    diagnostic.append(addresses[i].getHostAddress());",
              "                }",
              '                diagnostic.append("\\n");',
              "            }",
              "        } catch (Exception e) {",
              '            diagnostic.append("FAIL: ")',
              "                    .append(e.getClass().getSimpleName())",
              '                    .append(": ")',
              "                    .append(String.valueOf(e.getMessage()))",
              '                    .append("\\n");',
              "        }",
              '        diagnostic.append("\\n");',
              "",
              "        // TEST 2 — DNS OVER HTTPS",
              '        diagnostic.append("TEST 2 — DNS OVER HTTPS\\n");',
              "        try {",
              '            URL dohUrl = new URL("https://1.1.1.1/dns-query?name=" + URLEncoder.encode(diagHost, "UTF-8") + "&type=A");',
              "            HttpURLConnection doh = (HttpURLConnection) dohUrl.openConnection();",
              '            doh.setRequestMethod("GET");',
              "            doh.setConnectTimeout(8000);",
              "            doh.setReadTimeout(8000);",
              "            doh.setUseCaches(false);",
              '            doh.setRequestProperty("Accept", "application/dns-json");',
              '            doh.setRequestProperty("User-Agent", "CarAssistant-NavigationV3/1.0");',
              "",
              "            int dohCode = doh.getResponseCode();",
              "            if (dohCode != HttpURLConnection.HTTP_OK) {",
              '                diagnostic.append("FAIL: HTTP ").append(dohCode).append("\\n");',
              "                doh.disconnect();",
              "            } else {",
              "                InputStream dohInput = doh.getInputStream();",
              '                BufferedReader dohReader = new BufferedReader(new InputStreamReader(dohInput, "UTF-8"));',
              "                StringBuilder dohBody = new StringBuilder();",
              "                String dohLine;",
              "                while ((dohLine = dohReader.readLine()) != null) {",
              "                    dohBody.append(dohLine);",
              "                }",
              "                dohReader.close();",
              "                doh.disconnect();",
              "",
              "                JSONObject dohJson = new JSONObject(dohBody.toString());",
              '                JSONArray answer = dohJson.optJSONArray("Answer");',
              "                if (answer == null || answer.length() == 0) {",
              '                    diagnostic.append("FAIL: no A record returned\\n");',
              "                } else {",
              "                    for (int i = 0; i < answer.length(); i++) {",
              "                        JSONObject record = answer.getJSONObject(i);",
              '                        if (record.optInt("type", 0) == 1) {',
              '                            String data = record.optString("data", "");',
              "                            if (!data.isEmpty()) {",
              "                                if (resolvedIp == null) resolvedIp = data;",
              '                                diagnostic.append("PASS: IP=").append(data).append("\\n");',
              "                            }",
              "                        }",
              "                    }",
              "                    if (resolvedIp == null) {",
              '                        diagnostic.append("FAIL: no IPv4 A record returned\\n");',
              "                    }",
              "                }",
              "            }",
              "        } catch (Exception e) {",
              '            diagnostic.append("FAIL: ")',
              "                    .append(e.getClass().getSimpleName())",
              '                    .append(": ")',
              "                    .append(String.valueOf(e.getMessage()))",
              '                    .append("\\n");',
              "        }",
              '        diagnostic.append("\\n");',
              "",
              "        // TEST 3 — HTTPS TO IP",
              '        diagnostic.append("TEST 3 — HTTPS TO IP\\n");',
              "        if (resolvedIp == null || resolvedIp.trim().isEmpty()) {",
              '            diagnostic.append("SKIPPED: no IP from DNS OVER HTTPS\\n");',
              "        } else {",
              "            HttpsURLConnection https = null;",
              "            try {",
              '                URL ipUrl = new URL("https://" + resolvedIp + "/search");',
              "                https = (HttpsURLConnection) ipUrl.openConnection();",
              '                https.setRequestMethod("GET");',
              "                https.setConnectTimeout(8000);",
              "                https.setReadTimeout(8000);",
              "                https.setUseCaches(false);",
              '                https.setRequestProperty("Host", diagHost);',
              '                https.setRequestProperty("User-Agent", "CarAssistant-NavigationV3/1.0");',
              '                https.setRequestProperty("Accept", "application/json");',
              "                https.setHostnameVerifier(new HostnameVerifier() {",
              "                    @Override",
              "                    public boolean verify(String hostname, SSLSession session) {",
              "                        return true;",
              "                    }",
              "                });",
              "                int httpsCode = https.getResponseCode();",
              '                diagnostic.append("PASS: HTTP ").append(httpsCode).append("\\n");',
              "            } catch (Exception e) {",
              '                diagnostic.append("FAIL: ")',
              "                        .append(e.getClass().getSimpleName())",
              '                        .append(": ")',
              "                        .append(String.valueOf(e.getMessage()))",
              '                        .append("\\n");',
              "            } finally {",
              "                if (https != null) https.disconnect();",
              "            }",
              "        }",
              "",
              '        diagnostic.append("\\nCONCLUSION\\n");',
              '        diagnostic.append("System DNS, DoH and HTTPS-to-IP results recorded above.\\n");',
              '        Log.d("CarAssistant-Nominatim", diagnostic.toString());',
              "        postSearchMessage(diagnostic.toString());",
              "    }"
          ]

          new_method = "\n".join(new_method_lines)

          # Thực hiện thay thế
          patched = text[:line_start] + new_method + text[end_idx:]

          # Kiểm tra tính toàn vẹn cơ bản trước khi ghi file
          if "private void searchNominatim(" not in patched:
              print("ERROR: Patch verification failed, method searchNominatim is missing.")
              sys.exit(1)

          path.write_text(patched, encoding="utf-8")
          print("PASS: searchNominatim patched isolated and cleanly via Brace Matching.")
          PY
