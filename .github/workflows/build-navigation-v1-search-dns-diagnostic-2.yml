              "",
              "                    javax.net.ssl.HttpsURLConnection",
              "                            directConnection =",
              "                            (javax.net.ssl.HttpsURLConnection)",
              "                                    directUrl.openConnection();",
              "",
              "                    directConnection.setRequestMethod(",
              '                            "GET");',
              "                    directConnection.setConnectTimeout(",
              "                            8000);",
              "                    directConnection.setReadTimeout(",
              "                            10000);",
              "                    directConnection.setUseCaches(",
              "                            false);",
              "",
              "                    directConnection.setRequestProperty(",
              '                            "Host",',
              "                            host);",
              "                    directConnection.setRequestProperty(",
              '                            "User-Agent",',
              '                            "CarAssistant-NavigationV3/1.0");',
              "                    directConnection.setRequestProperty(",
              '                            "Accept",',
              '                            "application/json");',
              "                    directConnection.setRequestProperty(",
              '                            "Accept-Language",',
              '                            "vi-VN,vi;q=0.9");',
              "                    directConnection.setHostnameVerifier(",
              "                            (hostname, session) -> true);",
              "",
              "                    int directCode =",
              "                            directConnection",
              "                                    .getResponseCode();",
              "",
              "                    directIpTest =",
              '                            "HTTPS IP="',
              "                                    + dohResolvedIp",
