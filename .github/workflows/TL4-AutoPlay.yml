
name: TL4 AutoPlay
run-name: TL4 AutoPlay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout verified source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify immutable baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          expected = {
              "v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java":
                  "61e82df0fd17e7851c7bf1628ac03a9391e48523",
              "v10-source/app/src/main/java/com/carassistant/v10/V10ProjectionSession.java":
                  "27a9ff439fb450750d49f35a546eab3bc2745b4d",
              "v10-source/app/src/main/java/com/carassistant/v10/RootShellSession.java":
                  "c1c51bfc7450efa53b725d031a9d2a87dc39f8c9",
              "v10-source/app/src/main/AndroidManifest.xml":
                  "e6ffd5005ff0d0f8610c5950f20e17acba5410df",
              "v10-source/app/build.gradle":
                  "4d512337d46324a33a685d8cdb095e4ecacd3ceb",
              ".github/workflows/TL1.yml":
                  "584797be4490355f6d08c863edf9a57bb5422e90",
              ".github/workflows/TL2.yml":
                  "ec466067f315d85ebb8927472404f196d78a01a0",
              ".github/workflows/TL3-InAppSearch.yml":
                  "6fecb01106d3ef3b336d59712c5daa7c193c4eb7",
              ".github/workflows/build-carassistant-voice-commands-v2.yml":
                  "4ee7f307c2a106a384a33c7b4386f1864c621ff3",
          }

          for name, wanted in expected.items():
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(f"FAIL-CLOSED: missing {name}")
              actual = subprocess.check_output(
                  ["git", "hash-object", str(path)], text=True
              ).strip()
              if actual != wanted:
                  raise SystemExit(
                      f"FAIL-CLOSED: SHA mismatch {name}: "
                      f"expected={wanted}, actual={actual}"
                  )
              print(f"PASS SHA: {name}")
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install workflow parser
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-yaml

      - name: Apply verified TL1 TL2 and TL3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          workflow = yaml.safe_load(
              Path(".github/workflows/TL3-InAppSearch.yml")
              .read_text(encoding="utf-8")
          )
          steps = workflow["jobs"]["build"]["steps"]

          required = [
              "Apply verified TL1 and TL2 baseline",
              "Apply TL3 in-app search controller",
          ]

          for name in required:
              matches = [
                  step for step in steps
                  if step.get("name") == name and step.get("run")
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"FAIL-CLOSED: TL3 step {name!r} "
                      f"found {len(matches)} times"
                  )
              subprocess.run(
                  [
                      "bash", "-e", "-u", "-o", "pipefail",
                      "-c", matches[0]["run"]
                  ],
                  check=True,
              )
              print(f"PASS: {name}")
          PY

      - name: Apply Patch 4 AutoPlay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          base = Path(
              "v10-source/app/src/main/java/com/carassistant/v10"
          )
          search_path = base / "InAppSearchController.java"
          autoplay_path = base / "AutoPlayController.java"

          if not search_path.is_file():
              raise SystemExit("FAIL-CLOSED: TL3 controller missing")
          if autoplay_path.exists():
              raise SystemExit(
                  "FAIL-CLOSED: AutoPlayController already exists"
              )

          source = search_path.read_text(encoding="utf-8")

          # Hook autoplay only after TL3 has pasted the query and pressed Enter.
          pattern = re.compile(
              r'handler\.post\(\(\) -> \{\s*'
              r'if \(finished\) return;\s*'
              r'finished = true;\s*'
              r'Toast\.makeText\([\s\S]*?'
              r'rootShell\.destroy\(\);\s*'
              r'\}\);'
          )
          matches = list(pattern.finditer(source))
          if len(matches) != 1:
              raise SystemExit(
                  "FAIL-CLOSED: expected exactly one TL3 search-complete "
                  f"callback; found {len(matches)}"
              )

          
          replacement = """handler.post(() -> {
                                                  if (finished) return;
                                                  finished = true;
                                                  rootShell.destroy();
                                                  AutoPlayController.start(
                                                          context, session, handler,
                                                          projectedView, service);
                                              });"""

          )
          source = pattern.sub(lambda _: replacement, source, count=1)

          if "AutoPlayController.start(" not in source:
              raise SystemExit("FAIL-CLOSED: autoplay hook missing")

          search_path.write_text(source, encoding="utf-8")

          java = r'''package com.carassistant.v10;

          import android.content.Context;
          import android.os.Handler;
          import android.view.View;
          import android.widget.Toast;

          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          /**
           * TL4: select the first visible duration node belonging to the
           * requested media app. Never tap a guessed result coordinate.
           */
          public final class AutoPlayController {
              private static final int MAX_ATTEMPTS = 7;
              private static final long RETRY_MS = 1000L;
              private static final long FIRST_WAIT_MS = 2200L;

              
          private static final Pattern NODE =
                  Pattern.compile("<node\\b([^>]*)>");
          private static final Pattern ATTRIBUTE =
                  Pattern.compile("([\\w:-]+)=\"([^\"]*)\"");
          private static final Pattern BOUNDS =
                  Pattern.compile("\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\]");
          private static final Pattern CLOCK_DURATION =
                  Pattern.compile("^(?:\\d{1,2}:)?\\d{1,2}:\\d{2}$");
          private static final Pattern WORD_DURATION =
                  Pattern.compile(
                      "(?i).*(?:\\d+\\s*(?:hours?|hrs?|minutes?|mins?|seconds?|secs?|giờ|phút|giây)).*");


              private final Context context;
              private final V10ProjectionSession session;
              private final Handler handler;
              private final View view;
              private final String service;
              private final String packageName;
              private final RootShellSession shell = new RootShellSession();

              private int attempts;
              private boolean done;

              private AutoPlayController(
                      Context context,
                      V10ProjectionSession session,
                      Handler handler,
                      View view,
                      String service) {
                  this.context = context.getApplicationContext();
                  this.session = session;
                  this.handler = handler;
                  this.view = view;
                  this.service = service;
                  this.packageName = packageFor(service);
              }

              public static void start(
                      Context context,
                      V10ProjectionSession session,
                      Handler handler,
                      View view,
                      String service) {
                  AutoPlayController controller = new AutoPlayController(
                          context, session, handler, view, service);

                  if (controller.packageName == null) {
                      controller.fail(
                          "Patch 4: ứng dụng không được hỗ trợ; "
                          + "không tự bấm kết quả.");
                      return;
                  }

                  if (session == null || !session.isActive()
                          || view == null || view.getWidth() <= 0
                          || view.getHeight() <= 0) {
                      controller.fail(
                          "Patch 4: phiên chiếu chưa sẵn sàng.");
                      return;
                  }

                  handler.postDelayed(controller::scan, FIRST_WAIT_MS);
              }

              private static String packageFor(String service) {
                  if ("YouTube".equals(service)) {
                      return "com.google.android.youtube";
                  }
                  if ("YouTube Music".equals(service)) {
                      return "com.google.android.apps.youtube.music";
                  }
                  if ("Zing MP3".equals(service)) {
                      return "com.zing.mp3";
                  }
                  return null;
              }

              private void scan() {
                  if (done) return;
                  if (session == null || !session.isActive()
                          || session.getDisplayId() < 0) {
                      fail("Patch 4: phiên chiếu đã mất.");
                      return;
                  }

                  attempts++;
                  final int displayId = session.getDisplayId();

                  RootShellSession.EXEC.execute(() -> {
                      String xml = null;
                      String size = null;
                      String error = null;
                      try {
                          // UIAutomator output is read only. If the target app's
                          // duration node is absent, this patch does not tap.
                          String path = "/sdcard/ca_tl4_hierarchy.xml";
                          shell.run(
                              10,
                              "/system/bin/uiautomator dump "
                                  + path + " >/dev/null 2>&1; "
                                  + "cat " + path + "; rm -f " + path);
                          xml = shell.run(
                              5,
                              "/system/bin/wm size -d " + displayId);
                          // The hierarchy command above has already run.
                          // Re-run it to capture the XML separately.
                          String xmlPath = "/sdcard/ca_tl4_nodes.xml";
                          xml = shell.run(
                              10,
                              "/system/bin/uiautomator dump "
                                  + xmlPath + " >/dev/null 2>&1; "
                                  + "cat " + xmlPath + "; rm -f " + xmlPath);
                          size = shell.run(
                              5,
                              "/system/bin/wm size -d " + displayId);
                      } catch (Throwable t) {
                          error = t.getMessage();
                      }

                      final String resultXml = xml;
                      final String resultSize = size;
                      final String resultError = error;

                      handler.post(() -> {
                          if (done) return;

                          if (resultError != null
                                  || resultXml == null
                                  || resultXml.isEmpty()
                                  || resultSize == null) {
                              retryOrStop(
                                  "Không đọc được giao diện kết quả.");
                              return;
                          }

                          int[] displaySize = parseDisplaySize(resultSize);
                          if (displaySize == null) {
                              retryOrStop(
                                  "Không xác định được kích thước màn hình chiếu.");
                              return;
                          }

                          int[] bounds = findFirstDurationBounds(resultXml);
                          if (bounds == null) {
                              retryOrStop(
                                  "Chưa thấy nhãn thời lượng của "
                                      + service + "; không bấm kết quả mò.");
                              return;
                          }

                          float centerX = (bounds[0] + bounds[2]) / 2f;
                          float centerY = (bounds[1] + bounds[3]) / 2f;

                          float tapX = centerX * view.getWidth()
                                  / displaySize[0];
                          float tapY = centerY * view.getHeight()
                                  / displaySize[1];

                          if (tapX < 0 || tapY < 0
                                  || tapX >= view.getWidth()
                                  || tapY >= view.getHeight()) {
                              fail("Patch 4: tọa độ kết quả ngoài màn hình.");
                              return;
                          }

                          // Click the actual duration label bounds, not
                          // a hard-coded first-row coordinate.
                          session.tap(tapX, tapY);
                          done = true;

                          handler.postDelayed(() -> verifyPlayback(0), 2200L);
                      });
                  });
              }

              private void retryOrStop(String message) {
                  if (attempts < MAX_ATTEMPTS) {
                      handler.postDelayed(this::scan, RETRY_MS);
                  } else {
                      fail(message + " Tự động phát đã dừng an toàn.");
                  }
              }

              private void verifyPlayback(int check) {
                  if (done && check < 0) return;

                  RootShellSession.EXEC.execute(() -> {
                      String xml = null;
                      try {
                          String path = "/sdcard/ca_tl4_verify.xml";
                          xml = shell.run(
                              10,
                              "/system/bin/uiautomator dump "
                                  + path + " >/dev/null 2>&1; "
                                  + "cat " + path + "; rm -f " + path);
                      } catch (Throwable ignored) {
                      }

                      final String snapshot = xml;
                      handler.post(() -> {
                          boolean playing = snapshot != null
                                  && hasPlaybackIndicator(snapshot);

                          if (playing) {
                              Toast.makeText(
                                  context,
                                  "Patch 4: đã chọn kết quả có thời lượng; "
                                      + "giao diện cho thấy trạng thái phát.",
                                  Toast.LENGTH_LONG).show();
                          } else {
                              Toast.makeText(
                                  context,
                                  "Patch 4: đã bấm kết quả có thời lượng, "
                                      + "nhưng chưa xác nhận được trạng thái phát.",
                                  Toast.LENGTH_LONG).show();
                          }
                          shell.destroy();
                      });
                  });
              }

              private int[] findFirstDurationBounds(String xml) {
                  Matcher nodes = NODE.matcher(xml);
                  while (nodes.find()) {
                      String raw = nodes.group(1);
                      String pkg = attr(raw, "package");
                      if (!packageName.equals(pkg)) continue;

                      String visible = attr(raw, "visible-to-user");
                      if ("false".equalsIgnoreCase(visible)) continue;

                      String text = decode(attr(raw, "text")).trim();
                      String desc = decode(attr(raw, "content-desc")).trim();

                      boolean duration =
                              CLOCK_DURATION.matcher(text).matches()
                              || CLOCK_DURATION.matcher(desc).matches()
                              || WORD_DURATION.matcher(desc).matches();

                      if (!duration) continue;

                      Matcher boundsMatcher =
                              BOUNDS.matcher(attr(raw, "bounds"));
                      if (!boundsMatcher.matches()) continue;

                      int left = Integer.parseInt(boundsMatcher.group(1));
                      int top = Integer.parseInt(boundsMatcher.group(2));
                      int right = Integer.parseInt(boundsMatcher.group(3));
                      int bottom = Integer.parseInt(boundsMatcher.group(4));

                      if (right <= left || bottom <= top) continue;
                      return new int[] {left, top, right, bottom};
                  }
                  return null;
              }

              private boolean hasPlaybackIndicator(String xml) {
                  Matcher nodes = NODE.matcher(xml);
                  while (nodes.find()) {
                      String raw = nodes.group(1);
                      if (!packageName.equals(attr(raw, "package"))) continue;

                      String value = (
                          decode(attr(raw, "text")) + " "
                          + decode(attr(raw, "content-desc")) + " "
                          + attr(raw, "resource-id")
                      ).toLowerCase(java.util.Locale.ROOT);

                      if (value.contains("pause")
                              || value.contains("tạm dừng")
                              || value.contains("đang phát")
                              || value.contains("player_pause")
                              || value.contains("playback_pause")) {
                          return true;
                      }
                  }
                  return false;
              }

              private static String attr(String raw, String name) {
                  Matcher matcher = ATTRIBUTE.matcher(raw);
                  while (matcher.find()) {
                      if (name.equals(matcher.group(1))) {
                          return matcher.group(2);
                      }
                  }
                  return "";
              }

              
              private static String decode(String value) {
                  return value.replace("&amp;", "&")
                          .replace("&quot;", "\"")
                          .replace("&apos;", "'")
                          .replace("&lt;", "<")
                          .replace("&gt;", ">");
              }


              
              private static int[] parseDisplaySize(String output) {
                  Matcher matcher = Pattern.compile(
                      "(?:Physical|Override) size:\\s*(\\d+)x(\\d+)"
                  ).matcher(output);

                  int width = -1;
                  int height = -1;
                  while (matcher.find()) {
                      width = Integer.parseInt(matcher.group(1));
                      height = Integer.parseInt(matcher.group(2));
                  }
                  if (width < 1 || height < 1) return null;
                  return new int[] {width, height};
              }


              private void fail(String message) {
                  if (done) return;
                  done = true;
                  try {
                      shell.destroy();
                  } catch (RuntimeException ignored) {
                  }
                  handler.post(() -> Toast.makeText(
                      context, message, Toast.LENGTH_LONG).show());
              }
          }
          '''

          autoplay_path.write_text(java, encoding="utf-8")
          print("PASS: TL4 autoplay hook installed")
          print("PASS: AutoPlayController.java added")
          PY

      - name: Validate Patch 4 and protect bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          base = Path(
              "v10-source/app/src/main/java/com/carassistant/v10"
          )
          activity = base / "V10CarActivity.java"
          search = base / "InAppSearchController.java"
          autoplay = base / "AutoPlayController.java"

          for path in [activity, search, autoplay]:
              if not path.is_file():
                  raise SystemExit(f"FAIL-CLOSED: missing {path}")

          a = activity.read_text(encoding="utf-8")
          s = search.read_text(encoding="utf-8")
          p = autoplay.read_text(encoding="utf-8")

          yaml.safe_load(
              Path(".github/workflows/TL4-AutoPlay.yml")
              .read_text(encoding="utf-8")
          )

          checks = [
              (s, "AutoPlayController.start(", "TL4 search hook"),
              (p, "findFirstDurationBounds(", "duration node detection"),
              (p, "session.tap(tapX, tapY)", "coordinate from actual bounds"),
              (p, "packageName.equals(pkg)", "target package validation"),
              (p, "MAX_ATTEMPTS", "bounded retries"),
              (p, "Tự động phát đã dừng an toàn", "fail-closed timeout"),
              (a, "private void processVoiceCommand(String spoken)",
               "existing voice assistant"),
              (a, "private boolean handleVoiceMediaSearch(",
               "existing media command handler"),
          ]

          for source, anchor, label in checks:
              if anchor not in source:
                  raise SystemExit(f"FAIL-CLOSED: missing {label}")
              print(f"PASS: {label}")

          protected = {
              base / "V10ProjectionSession.java":
                  "27a9ff439fb450750d49f35a546eab3bc2745b4d",
              base / "RootShellSession.java":
                  "c1c51bfc7450efa53b725d031a9d2a87dc39f8c9",
              Path("v10-source/app/src/main/AndroidManifest.xml"):
                  "e6ffd5005ff0d0f8610c5950f20e17acba5410df",
              Path("v10-source/app/build.gradle"):
                  "4d512337d46324a33a685d8cdb095e4ecacd3ceb",
          }

          for path, wanted in protected.items():
              actual = subprocess.check_output(
                  ["git", "hash-object", str(path)], text=True
              ).strip()
              if actual != wanted:
                  raise SystemExit(
                      f"FAIL-CLOSED: protected file changed: {path}"
                  )
              print(f"PASS unchanged: {path}")

          status = subprocess.check_output(
              ["git", "status", "--porcelain", "--untracked-files=all"],
              text=True
          ).splitlines()

          changed = {line[3:] for line in status if len(line) >= 4}
          allowed = {
              str(activity),
              str(search),
              str(autoplay),
          }

          if changed != allowed:
              raise SystemExit(
                  "FAIL-CLOSED: unexpected changed files: "
                  + repr(sorted(changed))
              )

          print("PASS: only TL3 activity/controller and TL4 controller changed")
          PY

      - name: Compile integrated TL1 TL2 TL3 TL4
        shell: bash
        run: |
          set -euo pipefail
          cd v10-source
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace compileDebugJavaWithJavac

      - name: Build integrated APK
        shell: bash
        run: |
          set -euo pipefail
          cd v10-source
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Package Patch 4 artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p dist

          cp "$APK" dist/CarAssistant-TL4-AutoPlay-unsigned.apk
          cp v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java \
            dist/V10CarActivity-TL4.java
          cp v10-source/app/src/main/java/com/carassistant/v10/InAppSearchController.java \
            dist/InAppSearchController-TL4.java
          cp v10-source/app/src/main/java/com/carassistant/v10/AutoPlayController.java \
            dist/AutoPlayController.java

          sha256sum dist/CarAssistant-TL4-AutoPlay-unsigned.apk \
            | tee dist/CarAssistant-TL4-AutoPlay.sha256

      - name: Upload Patch 4 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-TL4-AutoPlay
          path: |
            dist/CarAssistant-TL4-AutoPlay-unsigned.apk
            dist/CarAssistant-TL4-AutoPlay.sha256
            dist/V10CarActivity-TL4.java
            dist/InAppSearchController-TL4.java
            dist/AutoPlayController.java
          if-no-files-found: error
          retention-days: 30
