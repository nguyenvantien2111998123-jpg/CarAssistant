name: CarAssistant V10 Promote Tested Foundation V1 to Main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Record main safety checkpoint
        shell: bash
        run: |
          set -euo pipefail

          BEFORE="$(git rev-parse HEAD)"

          echo "BEFORE=$BEFORE" >> "$GITHUB_ENV"

          echo "Current main: $BEFORE"

      - name: Download exact tested Foundation artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "11329025191"
        run: |
          set -euo pipefail

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" \
            -o /tmp/foundation-artifact.zip

          test -s /tmp/foundation-artifact.zip

          unzip -q \
            /tmp/foundation-artifact.zip \
            -d /tmp/foundation-artifact

          test -s \
            /tmp/foundation-artifact/CarAssistant-V10-Source-Foundation-V1.apk

          test -s \
            /tmp/foundation-artifact/CarAssistant-V10-Source-Foundation-V1.sha256

          test -s \
            /tmp/foundation-artifact/CarAssistant-V10-Source-Foundation-V1-source.zip

      - name: Verify exact tested APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="0d4aa2cd39848f425886c85a812ad74e98d64973b2ac7e2e2fb2174e5521939e"

          ACTUAL="$(
            sha256sum \
              /tmp/foundation-artifact/CarAssistant-V10-Source-Foundation-V1.apk \
              | awk '{print $1}'
          )"

          test "$ACTUAL" = "$EXPECTED"

          echo "Tested Foundation APK SHA256: $ACTUAL"
          echo "APK SHA256 verification: PASS"

      - name: Extract exact tested Foundation source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/foundation-source
          mkdir -p /tmp/foundation-source

          unzip -q \
            /tmp/foundation-artifact/CarAssistant-V10-Source-Foundation-V1-source.zip \
            -d /tmp/foundation-source

          test -d /tmp/foundation-source/v10-source

          test -f \
            /tmp/foundation-source/v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

      - name: Replace main V10 source with tested Foundation V1
        shell: bash
        run: |
          set -euo pipefail

          rm -rf v10-source

          cp -a \
            /tmp/foundation-source/v10-source \
            ./v10-source

          # Remove generated build outputs and Gradle caches.
          rm -rf \
            v10-source/build \
            v10-source/.gradle \
            v10-source/app/build

          test -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

          test -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java

          test -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java

          test -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java

          test -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java

      - name: Clean exact Foundation V1 whitespace findings
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          test -f "$FILE"

          # Fix only the four whitespace findings reported
          # by the failed Foundation V1 promotion.
          sed -i '769s/[[:space:]]*$//' "$FILE"
          sed -i '855s/[[:space:]]*$//' "$FILE"
          sed -i '904s/[[:space:]]*$//' "$FILE"

          # Remove the final blank line at EOF.
          sed -i '${/^$/d;}' "$FILE"

          echo "Cleaned V10CarActivity.java whitespace findings:"
          echo "  - line 769 trailing whitespace"
          echo "  - line 855 trailing whitespace"
          echo "  - line 904 trailing whitespace"
          echo "  - final blank line at EOF"

      - name: Verify Foundation V1 architecture before commit
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test ! -f "$SRC/V10ProjectionService.java"

          grep -Fq "DisplayManager" \
            "$SRC/V10DisplayController.java"

          grep -Fq "createVirtualDisplay" \
            "$SRC/V10DisplayController.java"

          grep -Fq "launchNewTask" \
            "$SRC/V10ProjectionSession.java"

          grep -Fq "resumeExistingTask" \
            "$SRC/V10ProjectionSession.java"

          grep -Fq "floatingTouchKey" \
            "$SRC/V10CarActivity.java"

          grep -Fq "createFloatingTouchKey()" \
            "$SRC/V10CarActivity.java"

          grep -Fq "handleControlBack()" \
            "$SRC/V10CarActivity.java"

          grep -Fq "handleControlHome()" \
            "$SRC/V10CarActivity.java"

          grep -Fq "ViewConfiguration.getLongPressTimeout()" \
            "$SRC/V10CarActivity.java"

          if grep -Fq "am force-stop" \
            "$SRC/V10ProjectionSession.java"; then
            echo "ERROR: forbidden force-stop found."
            exit 1
          fi

          if grep -Fq "am force-stop" \
            "$SRC/V10DisplayController.java"; then
            echo "ERROR: forbidden force-stop found."
            exit 1
          fi

          echo "Foundation V1 architecture verification: PASS"

      - name: Verify only V10 source is being promoted
        shell: bash
        run: |
          set -euo pipefail

          git add -A v10-source

          if git diff --cached --quiet -- v10-source; then
            echo "ERROR: No V10 source changes detected."
            exit 1
          fi

          echo "Staged V10 source changes:"
          git diff --cached --stat -- v10-source

          if git diff --cached --name-only | grep -v '^v10-source/'; then
            echo "ERROR: A path outside v10-source is staged."
            exit 1
          fi

          # Keep this as the final whitespace safety gate.
          git diff --cached --check

      - name: Commit tested Foundation V1 to main
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "chore: establish V10 Source Foundation V1 baseline"

      - name: Push Foundation V1 to main safely
        shell: bash
        run: |
          set -euo pipefail

          git push origin HEAD:main

          echo "Foundation V1 is now the V10 source baseline on main."
          echo "Previous main: $BEFORE"
          echo "New main: $(git rev-parse HEAD)"

      - name: Final promotion gate
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse --abbrev-ref HEAD)" = "main"

          echo "========================================"
          echo "FOUNDATION V1 PROMOTION: PASS"
          echo "========================================"
          echo "Tested APK SHA256:"
          echo "0d4aa2cd39848f425886c85a812ad74e98d64973b2ac7e2e2fb2174e5521939"
          echo "Main now contains the tested Foundation V1 source."
          echo "Home UI V2 was NOT added."
          echo "========================================"
