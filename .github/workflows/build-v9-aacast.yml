name: Build Car Assistant V9-AACast

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_VERSION: "8.7"
      AACAST_REPO: "https://github.com/xuanthanhtn96/AACast-Doudou.git"
      AACAST_REF: "main"

    steps:

      # ================================================================
      # CHECKOUT
      # ================================================================

      - name: Checkout CarAssistant
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ================================================================
      # GET AACAST SOURCE
      # ================================================================

      - name: Download AACast-Doudou source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf aacast-upstream
          rm -rf v9-aacast-source

          git clone \
            --depth 1 \
            --branch "$AACAST_REF" \
            "$AACAST_REPO" \
            aacast-upstream

          test -d aacast-upstream/app
          test -s aacast-upstream/app/build.gradle
          test -s aacast-upstream/app/libs/aasdk-legacy.jar
          test -s aacast-upstream/app/libs/aasdk-legacy.dex
          test -s aacast-upstream/app/libs/xposed-api-82.jar

          cp -a aacast-upstream v9-aacast-source

          echo "=================================================="
          echo "AACAST SOURCE"
          echo "=================================================="

          git -C v9-aacast-source log -1 --oneline

          echo "=================================================="
          echo "LEGACY SDK"
          echo "=================================================="

          ls -lh \
            v9-aacast-source/app/libs/aasdk-legacy.jar \
            v9-aacast-source/app/libs/aasdk-legacy.dex \
            v9-aacast-source/app/libs/xposed-api-82.jar

      # ================================================================
      # CONVERT AACAST -> CAR ASSISTANT V9
      # ================================================================

      - name: Transform AACast into Car Assistant V9
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          # ------------------------------------------------------------
          # PACKAGE
          # ------------------------------------------------------------

          find app/src/main -type f \
            \( -name "*.java" -o -name "*.xml" -o -name "*.txt" \
               -o -name "*.properties" -o -name "*.md" \) \
            -print0 |
          xargs -0 sed -i \
            's/com\.hieptran\.aacast\.doudou/com\.carassistant\.v9/g'

          # ------------------------------------------------------------
          # APPLICATION ID / NAMESPACE
          # ------------------------------------------------------------

          sed -i \
            's/namespace '\''com\.hieptran\.aacast\.doudou'\''/namespace '\''com.carassistant.v9'\''/' \
            app/build.gradle

          sed -i \
            's/applicationId "com\.hieptran\.aacast\.doudou"/applicationId "com.carassistant.v9"/' \
            app/build.gradle

          # ------------------------------------------------------------
          # VERSION
          # ------------------------------------------------------------

          sed -i \
            's/versionCode 3/versionCode 900/' \
            app/build.gradle

          sed -i \
            's/versionName "1\.0\.0"/versionName "9.0-AACast"/' \
            app/build.gradle

          # ------------------------------------------------------------
          # DISPLAY NAME
          # ------------------------------------------------------------

          find app/src/main -type f \
            \( -name "*.java" -o -name "*.xml" \) \
            -print0 |
          xargs -0 sed -i \
            's/AACast Doudou /Car Assistant V9 /g'

          find app/src/main -type f \
            \( -name "*.java" -o -name "*.xml" \) \
            -print0 |
          xargs -0 sed -i \
            's/AACast-Doudou/CarAssistant-V9/g'

          find app/src/main -type f \
            \( -name "*.xml" -o -name "*.java" \) \
            -print0 |
          xargs -0 sed -i \
            's/AACast Doudou/Car Assistant V9/g'

          # ------------------------------------------------------------
          # DISABLE R8 / MINIFY
          # ------------------------------------------------------------

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          s = s.replace(
              "minifyEnabled true",
              "minifyEnabled false"
          )

          s = s.replace(
              "shrinkResources true",
              "shrinkResources false"
          )

          if "minifyEnabled false" not in s:
              raise SystemExit(
                  "ERROR: minifyEnabled false not present"
              )

          p.write_text(s)
          PY

          # ------------------------------------------------------------
          # XPOSED ENTRY POINT
          # ------------------------------------------------------------

          mkdir -p app/src/main/assets

          cat > app/src/main/assets/xposed_init <<'EOF'
          com.carassistant.v9.aabridge.AACastBridge
          EOF

          # ------------------------------------------------------------
          # FORCE V9 DISPLAY CONSTANTS
          # ------------------------------------------------------------

          python3 - <<'PY'
          from pathlib import Path

          root = Path("app/src/main")

          for p in root.rglob("*.java"):
              s = p.read_text(errors="ignore")

              s = s.replace(
                  '"AACast Doudou "',
                  '"Car Assistant V9 "'
              )

              s = s.replace(
                  '"AACast-Doudou"',
                  '"CarAssistant-V9"'
              )

              p.write_text(s)
          PY

          # ------------------------------------------------------------
          # V9 RESOURCE
          # ------------------------------------------------------------

          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/carassistant_v9.xml <<'EOF'
          <resources>

              <string name="carassistant_v9_name">
                  Car Assistant V9-AACast
              </string>

              <string name="carassistant_v9_description">
                  Car Assistant V9 AACast Android Auto VirtualDisplay System
              </string>

          </resources>
          EOF

          # ------------------------------------------------------------
          # APP LABEL
          # ------------------------------------------------------------

          if [ -f app/src/main/res/values/strings.xml ]; then
            sed -i \
              's/AACast Doudou/Car Assistant V9-AACast/g' \
              app/src/main/res/values/strings.xml
          fi

          echo "=================================================="
          echo "V9 GRADLE CONFIG"
          echo "=================================================="

          grep -n \
            -E \
            'namespace|applicationId|versionCode|versionName|minifyEnabled|shrinkResources' \
            app/build.gradle

      # ================================================================
      # VERIFY AACAST ARCHITECTURE
      # ================================================================

      - name: Verify V9 source architecture
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          echo "=================================================="
          echo "CHECK LEGACY SDK"
          echo "=================================================="

          test -s app/libs/aasdk-legacy.jar
          test -s app/libs/aasdk-legacy.dex
          test -s app/libs/xposed-api-82.jar

          echo "Legacy SDK files OK."

          echo "=================================================="
          echo "CHECK CAR ACTIVITY"
          echo "=================================================="

          grep -R -q \
            'extends CarActivityService' \
            app/src/main/java

          grep -R -q \
            'extends CarActivity' \
            app/src/main/java

          grep -R -q \
            'getCarActivity()' \
            app/src/main/java

          echo "CarActivity architecture OK."

          echo "=================================================="
          echo "CHECK VIRTUAL DISPLAY"
          echo "=================================================="

          grep -R -q \
            'createVirtualDisplay' \
            app/src/main/java

          grep -R -q \
            'VirtualDisplay' \
            app/src/main/java

          # AACast-Doudou uses:
          #
          #   createVirtualDisplay(..., 10)
          #
          # 10 = PRESENTATION (2) | OWN_CONTENT_ONLY (8)
          #
          # Do NOT require the literal string OWN_CONTENT_ONLY because
          # the upstream source passes the numeric flag value 10.

          if grep -R -q \
            'OWN_CONTENT_ONLY' \
            app/src/main/java; then

            echo "OWN_CONTENT_ONLY constant found."

          elif grep -R -q \
            'createVirtualDisplay' \
            app/src/main/java && \
               grep -R -q \
            ', 10)' \
            app/src/main/java; then

            echo "VirtualDisplay flag value 10 found."
            echo "10 = PRESENTATION | OWN_CONTENT_ONLY"

          else

            echo "ERROR: VirtualDisplay flags not verified."
            exit 1

          fi

          echo "VirtualDisplay architecture OK."

          echo "=================================================="
          echo "CHECK ROOT DISPLAY LAUNCH"
          echo "=================================================="

          grep -R -q \
            -- '--display' \
            app/src/main/java

          grep -R -q \
            'su' \
            app/src/main/java

          echo "Root display launch OK."

          echo "=================================================="
          echo "CHECK XPOSED"
          echo "=================================================="

          test -s \
            app/src/main/assets/xposed_init

          grep -R -q \
            'IXposedHookLoadPackage' \
            app/src/main/java

          grep -R -q \
            'com.google.android.projection.gearhead' \
            app/src/main/java

          grep -R -q \
            '"android"' \
            app/src/main/java

          echo "Xposed architecture OK."

          echo "=================================================="
          echo "CHECK DISPLAY HOOK"
          echo "=================================================="

          grep -R -q \
            'VirtualDisplayDevice' \
            app/src/main/java

          echo "Display hook OK."

          echo "=================================================="
          echo "CHECK INPUT HOOK"
          echo "=================================================="

          grep -R -q \
            'InputManagerService' \
            app/src/main/java

          echo "Input hook OK."

          echo "=================================================="
          echo "CHECK NO ANDROIDX CARAPP SERVICE"
          echo "=================================================="

          if grep -R -q \
            'androidx.car.app.CarAppService' \
            app/src/main/java; then

            echo "ERROR: V9 still contains androidx.car.app.CarAppService"
            exit 1
          fi

          echo "No AndroidX CarAppService found."

          echo "=================================================="
          echo "ARCHITECTURE VERIFICATION PASSED"
          echo "=================================================="

      # ================================================================
      # VERIFY PACKAGE TRANSFORMATION
      # ================================================================

      - name: Verify V9 package transformation
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          echo "=================================================="
          echo "OLD PACKAGE CHECK"
          echo "=================================================="

          if grep -R -q \
            'com.hieptran.aacast.doudou' \
            app/src/main \
            --exclude='*.dex' \
            --exclude='*.jar'; then

            echo "ERROR: old AACast package remains"

            grep -R \
              -n \
              'com.hieptran.aacast.doudou' \
              app/src/main \
              --exclude='*.dex' \
              --exclude='*.jar' \
              || true

            exit 1
          fi

          echo "Old package removed."

          echo "=================================================="
          echo "NEW PACKAGE"
          echo "=================================================="

          grep -R -q \
            'com.carassistant.v9' \
            app/src/main

          echo "New package verified."

          echo "=================================================="
          echo "XPOSED INIT"
          echo "=================================================="

          cat \
            app/src/main/assets/xposed_init

          grep -q \
            '^com.carassistant.v9.aabridge.AACastBridge$' \
            app/src/main/assets/xposed_init

          echo "Xposed entry verified."

      # ================================================================
      # VERIFY BUILD CONFIG
      # ================================================================

      - name: Verify build configuration
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          echo "=================================================="
          echo "MINIFY / R8"
          echo "=================================================="

          grep -n \
            'minifyEnabled' \
            app/build.gradle

          if grep -q \
            'minifyEnabled true' \
            app/build.gradle; then

            echo "ERROR: R8/minify enabled"
            exit 1
          fi

          if grep -q \
            'shrinkResources true' \
            app/build.gradle; then

            echo "ERROR: shrinkResources enabled"
            exit 1
          fi

          echo "R8/minify disabled."

      # ================================================================
      # GENERATE GRADLE WRAPPER
      # ================================================================

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          gradle wrapper \
            --gradle-version "$GRADLE_VERSION" \
            --distribution-type bin

          chmod +x gradlew

          ./gradlew --version

      # ================================================================
      # CLEAN
      # ================================================================

      - name: Clean V9 build
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          ./gradlew \
            --no-daemon \
            clean

      # ================================================================
      # BUILD DEBUG
      # ================================================================

      - name: Build V9 debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ================================================================
      # VERIFY DEBUG APK
      # ================================================================

      - name: Verify V9 debug APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v9-aacast-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          test -s "$APK"

          echo "=================================================="
          echo "DEBUG APK"
          echo "=================================================="

          ls -lh "$APK"

          echo "=================================================="
          echo "SHA256"
          echo "=================================================="

          sha256sum "$APK"

          echo "=================================================="
          echo "APK CONTENTS"
          echo "=================================================="

          unzip -l "$APK" |
            grep -E \
              'classes[0-9]*\.dex|assets/xposed_init|AndroidManifest.xml'

          echo "=================================================="
          echo "XPOSED INIT"
          echo "=================================================="

          unzip -p \
            "$APK" \
            assets/xposed_init

          echo

          unzip -p \
            "$APK" \
            assets/xposed_init |
            grep -q \
              'com.carassistant.v9.aabridge.AACastBridge'

          echo "Xposed entry inside APK verified."

      # ================================================================
      # VERIFY LEGACY DEX
      # ================================================================

      - name: Verify legacy Android Auto SDK in APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v9-aacast-source/app/build/outputs/apk/debug/app-debug.apk"

          rm -rf /tmp/v9-apk
          mkdir -p /tmp/v9-apk

          unzip -q \
            "$APK" \
            -d /tmp/v9-apk

          echo "=================================================="
          echo "DEX FILES"
          echo "=================================================="

          find /tmp/v9-apk \
            -maxdepth 1 \
            -type f \
            -name 'classes*.dex' \
            -printf '%f %s bytes\n' |
            sort

          DEX_COUNT=$(
            find /tmp/v9-apk \
              -maxdepth 1 \
              -type f \
              -name 'classes*.dex' |
              wc -l
          )

          if [ "$DEX_COUNT" -lt 2 ]; then
            echo "ERROR: Expected multiple dex files."
            echo "Legacy AACast SDK may not have been merged."
            exit 1
          fi

          echo "DEX count: $DEX_COUNT"

          echo "=================================================="
          echo "SEARCH LEGACY SDK"
          echo "=================================================="

          found=0

          for dex in /tmp/v9-apk/classes*.dex; do

            if strings "$dex" |
              grep -q \
                'com/google/android/apps/auto/sdk/CarActivityService'; then

              echo "Found CarActivityService in $dex"
              found=1

            fi

          done

          if [ "$found" -ne 1 ]; then
            echo "ERROR: CarActivityService not found in APK DEX."
            exit 1
          fi

          echo "Legacy Android Auto SDK verified."

      # ================================================================
      # VERIFY MANIFEST
      # ================================================================

      - name: Verify Android Auto service and manifest
        shell: bash
        run: |
          set -euo pipefail

          APK="v9-aacast-source/app/build/outputs/apk/debug/app-debug.apk"

          echo "=================================================="
          echo "SOURCE MANIFEST"
          echo "=================================================="

          cat \
            v9-aacast-source/app/src/main/AndroidManifest.xml

          echo "=================================================="
          echo "SERVICE CHECK"
          echo "=================================================="

          grep -q \
            'CarActivityService' \
            v9-aacast-source/app/src/main/AndroidManifest.xml

          echo "CarActivityService declaration found."

          echo "=================================================="
          echo "PROJECTION CATEGORY CHECK"
          echo "=================================================="

          grep -q \
            'CATEGORY_PROJECTION' \
            v9-aacast-source/app/src/main/AndroidManifest.xml

          echo "CATEGORY_PROJECTION found."

          echo "=================================================="
          echo "AUTOMOTIVE METADATA CHECK"
          echo "=================================================="

          grep -q \
            'com.google.android.gms.car.application' \
            v9-aacast-source/app/src/main/AndroidManifest.xml

          echo "Android Auto application metadata found."

          echo "=================================================="
          echo "APK MANIFEST BASIC CHECK"
          echo "=================================================="

          test -s "$APK"

          echo "APK exists and is non-empty."

      # ================================================================
      # BUILD RELEASE
      # ================================================================

      - name: Build V9 release APK
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease

      # ================================================================
      # VERIFY RELEASE
      # ================================================================

      - name: Verify V9 release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v9-aacast-source/app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"
          test -s "$APK"

          echo "=================================================="
          echo "RELEASE APK"
          echo "=================================================="

          ls -lh "$APK"

          echo "=================================================="
          echo "SHA256"
          echo "=================================================="

          sha256sum "$APK"

          echo "=================================================="
          echo "XPOSED ENTRY"
          echo "=================================================="

          unzip -p \
            "$APK" \
            assets/xposed_init

          echo

          unzip -p \
            "$APK" \
            assets/xposed_init |
            grep -q \
              'com.carassistant.v9.aabridge.AACastBridge'

          echo "Xposed entry OK."

          echo "=================================================="
          echo "DEX"
          echo "=================================================="

          unzip -l "$APK" |
            grep -E \
              'classes[0-9]*\.dex'

          echo "=================================================="
          echo "LEGACY SDK"
          echo "=================================================="

          rm -rf /tmp/v9-release
          mkdir -p /tmp/v9-release

          unzip -q \
            "$APK" \
            -d /tmp/v9-release

          found=0

          for dex in /tmp/v9-release/classes*.dex; do

            if strings "$dex" |
              grep -q \
                'com/google/android/apps/auto/sdk/CarActivityService'; then

              echo "CarActivityService found in $dex"
              found=1

            fi

          done

          if [ "$found" -ne 1 ]; then
            echo "ERROR: Legacy SDK missing from release APK."
            exit 1
          fi

          echo "Release legacy SDK verified."

      # ================================================================
      # PACKAGE
      # ================================================================

      - name: Package V9 release
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          cp \
            v9-aacast-source/app/build/outputs/apk/debug/app-debug.apk \
            release/CarAssistant-V9-AACast-debug.apk

          cp \
            v9-aacast-source/app/build/outputs/apk/release/app-release.apk \
            release/CarAssistant-V9-AACast-release.apk

          sha256sum \
            release/CarAssistant-V9-AACast-debug.apk \
            > release/CarAssistant-V9-AACast-debug.sha256

          sha256sum \
            release/CarAssistant-V9-AACast-release.apk \
            > release/CarAssistant-V9-AACast-release.sha256

          cd release

          zip -9 \
            CarAssistant-V9-AACast.zip \
            CarAssistant-V9-AACast-debug.apk \
            CarAssistant-V9-AACast-release.apk \
            CarAssistant-V9-AACast-debug.sha256 \
            CarAssistant-V9-AACast-release.sha256

          echo "=================================================="
          echo "RELEASE CONTENTS"
          echo "=================================================="

          ls -lh

      # ================================================================
      # FINAL VERIFICATION
      # ================================================================

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail

          APK="release/CarAssistant-V9-AACast-release.apk"

          test -f "$APK"
          test -s "$APK"

          echo
          echo "=================================================="
          echo "CAR ASSISTANT V9 AACAST BUILD COMPLETE"
          echo "=================================================="

          echo
          echo "APK:"
          ls -lh "$APK"

          echo
          echo "SHA256:"
          sha256sum "$APK"

          echo
          echo "Package:"
          echo "com.carassistant.v9"

          echo
          echo "Version:"
          echo "9.0-AACast"

          echo
          echo "Architecture:"
          echo "CarActivityService"
          echo "CarActivity"
          echo "RootView"
          echo "PaneView"
          echo "TextureView"
          echo "VirtualDisplay"
          echo "RootShell"
          echo "Xposed Android hook"
          echo "Xposed Gearhead hook"
          echo "Legacy Android Auto SDK"

          echo
          echo "VirtualDisplay flags:"
          echo "10 = PRESENTATION | OWN_CONTENT_ONLY"

          echo
          echo "R8/minify:"
          echo "DISABLED"

      # ================================================================
      # UPLOAD
      # ================================================================

      - name: Upload V9 AACast artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V9-AACast
          path: |
            release/CarAssistant-V9-AACast.zip
            release/CarAssistant-V9-AACast-debug.apk
            release/CarAssistant-V9-AACast-release.apk
            release/CarAssistant-V9-AACast-debug.sha256
            release/CarAssistant-V9-AACast-release.sha256
          if-no-files-found: error
