name: Build Car Assistant V9-AACast

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.13"
  AACAST_REPO: "https://github.com/xuanthanhtn96/AACast-Doudou.git"
  AACAST_REF: "main"

jobs:
  build:
    name: Build V9 AACast
    runs-on: ubuntu-latest

    steps:

      - name: Checkout CarAssistant
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-disabled: true

      - name: Verify Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "GRADLE VERSION"
          echo "=================================================="

          which gradle
          gradle --version

          gradle --version | grep -q "Gradle 8.13"

          echo "Gradle 8.13 verified."

      - name: Download AACast-Doudou source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf aacast-upstream
          rm -rf v9-aacast-source

          git clone \
            --depth 1 \
            --branch "$AACAST_REF" \
            "$AACAST_REPO" \
            aacast-upstream

          cp -a aacast-upstream v9-aacast-source

          cd v9-aacast-source

          echo "=================================================="
          echo "VERIFY LEGACY SDK"
          echo "=================================================="

          test -f app/libs/aasdk-legacy.jar
          test -f app/libs/aasdk-legacy.dex
          test -f app/libs/xposed-api-82.jar

          echo "aasdk-legacy.jar OK"
          echo "aasdk-legacy.dex OK"
          echo "xposed-api-82.jar OK"

      - name: Transform AACast into Car Assistant V9
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          echo "=================================================="
          echo "TRANSFORM PACKAGE"
          echo "=================================================="

          find . -type f \
            \( \
              -name "*.java" \
              -o -name "*.xml" \
              -o -name "*.gradle" \
              -o -name "*.properties" \
              -o -name "*.txt" \
              -o -name "*.md" \
              -o -name "xposed_init" \
            \) \
            -print0 |
          xargs -0 sed -i \
            's/com\.hieptran\.aacast\.doudou/com.carassistant.v9/g'

          echo "=================================================="
          echo "APPLICATION ID / NAMESPACE"
          echo "=================================================="

          sed -i \
            's/applicationId "com\.hieptran\.aacast\.doudou"/applicationId "com.carassistant.v9"/g' \
            app/build.gradle

          sed -i \
            "s/namespace 'com\.hieptran\.aacast\.doudou'/namespace 'com.carassistant.v9'/g" \
            app/build.gradle

          echo "=================================================="
          echo "VERSION"
          echo "=================================================="

          sed -i 's/versionCode 3/versionCode 900/g' app/build.gradle
          sed -i 's/versionName "1\.0\.0"/versionName "9.0-AACast"/g' app/build.gradle

          echo "VersionName: 9.0-AACast"
          echo "VersionCode: 900"

          echo "=================================================="
          echo "DISPLAY NAME"
          echo "=================================================="

          grep -RIl "AACast Doudou" app/src/main 2>/dev/null |
          xargs -r sed -i 's/AACast Doudou/Car Assistant V9/g'

          echo "=================================================="
          echo "XPOSED INIT"
          echo "=================================================="

          mkdir -p app/src/main/assets

          printf '%s\n' \
            'com.carassistant.v9.aabridge.AACastBridge' \
            > app/src/main/assets/xposed_init

          cat app/src/main/assets/xposed_init

      - name: Verify V9 source architecture
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          echo "=================================================="
          echo "CHECK CARACTIVITY SERVICE"
          echo "=================================================="

          grep -R -q \
            'extends CarActivityService' \
            app/src/main/java

          grep -R -q \
            'getCarActivity()' \
            app/src/main/java

          echo "CarActivityService architecture OK."

          echo "=================================================="
          echo "CHECK CARACTIVITY"
          echo "=================================================="

          grep -R -q \
            'extends CarActivity' \
            app/src/main/java

          echo "CarActivity architecture OK."

          echo "=================================================="
          echo "CHECK VIRTUAL DISPLAY"
          echo "=================================================="

          grep -R -q \
            'createVirtualDisplay' \
            app/src/main/java

          grep -R -q \
            'VirtualDisplay' \
            app/src/main/java

          if grep -R -q 'OWN_CONTENT_ONLY' app/src/main/java; then
            echo "OWN_CONTENT_ONLY constant found."

          elif grep -R -q 'createVirtualDisplay' app/src/main/java &&
               grep -R -q ', 10)' app/src/main/java; then

            echo "VirtualDisplay flag value 10 found."
            echo "10 = PRESENTATION | OWN_CONTENT_ONLY"

          else
            echo "ERROR: VirtualDisplay flags not verified."
            exit 1
          fi

          echo "VirtualDisplay architecture OK."

          echo "=================================================="
          echo "CHECK ROOT DISPLAY LAUNCH"
          echo "=================================================="

          grep -R -q -- '--display' app/src/main/java
          grep -R -q 'su' app/src/main/java

          echo "Root display launch OK."

          echo "=================================================="
          echo "CHECK XPOSED"
          echo "=================================================="

          grep -R -q \
            'IXposedHookLoadPackage' \
            app/src/main/java

          grep -R -q \
            'com.google.android.projection.gearhead' \
            app/src/main/java

          echo "Xposed architecture OK."

          echo "=================================================="
          echo "CHECK DISPLAY HOOK"
          echo "=================================================="

          grep -R -q \
            'getDisplayDeviceInfoLocked' \
            app/src/main/java

          echo "Display hook OK."

          echo "=================================================="
          echo "CHECK INPUT HOOK"
          echo "=================================================="

          grep -R -q \
            'injectInputEventToTarget' \
            app/src/main/java

          echo "Input hook OK."

          echo "=================================================="
          echo "CHECK NO ANDROIDX CARAPP SERVICE"
          echo "=================================================="

          if grep -R -q \
            'androidx.car.app.CarAppService' \
            app/src/main/java; then

            echo "ERROR: AndroidX CarAppService found."
            exit 1
          fi

          echo "No AndroidX CarAppService found."

          echo "=================================================="
          echo "ARCHITECTURE VERIFICATION PASSED"
          echo "=================================================="

      - name: Verify V9 package transformation
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          echo "=================================================="
          echo "OLD PACKAGE CHECK"
          echo "=================================================="

          if grep -R -q \
            'com.hieptran.aacast.doudou' \
            app/src/main \
            --exclude='*.dex' \
            --exclude='*.jar'; then

            echo "ERROR: old AACast package remains."

            grep -R -n \
              'com.hieptran.aacast.doudou' \
              app/src/main \
              --exclude='*.dex' \
              --exclude='*.jar' || true

            exit 1
          fi

          echo "Old package removed."

          echo "=================================================="
          echo "NEW PACKAGE"
          echo "=================================================="

          grep -R -q \
            'com.carassistant.v9' \
            app/src/main

          echo "New package verified."

          echo "=================================================="
          echo "XPOSED INIT"
          echo "=================================================="

          cat app/src/main/assets/xposed_init

          grep -q \
            '^com.carassistant.v9.aabridge.AACastBridge$' \
            app/src/main/assets/xposed_init

          echo "Xposed entry verified."

      - name: Verify build configuration
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          echo "=================================================="
          echo "MINIFY / R8"
          echo "=================================================="

          grep -n 'minifyEnabled' app/build.gradle

          if grep -q 'minifyEnabled true' app/build.gradle; then
            echo "ERROR: R8/minify enabled."
            exit 1
          fi

          if grep -q 'shrinkResources true' app/build.gradle; then
            echo "ERROR: shrinkResources enabled."
            exit 1
          fi

          echo "R8/minify disabled."

          echo "=================================================="
          echo "ANDROID GRADLE PLUGIN"
          echo "=================================================="

          grep -R -n \
            'com.android.application' \
            build.gradle \
            settings.gradle \
            app/build.gradle \
            2>/dev/null || true

          echo "=================================================="
          echo "JAVA"
          echo "=================================================="

          java -version

          echo "Build configuration verified."

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          echo "=================================================="
          echo "GENERATE GRADLE WRAPPER 8.13"
          echo "=================================================="

          gradle wrapper \
            --gradle-version "$GRADLE_VERSION" \
            --distribution-type bin

          chmod +x gradlew

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          echo "=================================================="
          echo "WRAPPER PROPERTIES"
          echo "=================================================="

          cat gradle/wrapper/gradle-wrapper.properties

          echo "=================================================="
          echo "VERIFY WRAPPER"
          echo "=================================================="

          ./gradlew --version

          ./gradlew --version | grep -q "Gradle 8.13"

          echo "Gradle wrapper 8.13 verified."

      - name: Clean V9 build
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          ./gradlew clean --no-daemon

      - name: Build V9 debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify V9 debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "=================================================="
          echo "DEBUG APK"
          echo "=================================================="

          test -f "$APK"

          ls -lh "$APK"

          echo "Debug APK exists."

      - name: Verify legacy Android Auto SDK in debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          APK="app/build/outputs/apk/debug/app-debug.apk"

          rm -rf /tmp/v9-debug-dex
          mkdir -p /tmp/v9-debug-dex

          unzip -oq \
            "$APK" \
            'classes*.dex' \
            -d /tmp/v9-debug-dex

          FOUND=0

          for dex in /tmp/v9-debug-dex/classes*.dex; do

            STRINGS_FILE="/tmp/v9-debug-strings.txt"

            strings "$dex" > "$STRINGS_FILE"

            if grep -q \
              'com/google/android/apps/auto/sdk/CarActivityService' \
              "$STRINGS_FILE"; then

              echo "Legacy CarActivityService found in:"
              echo "$dex"

              FOUND=1
              break
            fi

          done

          if [ "$FOUND" -ne 1 ]; then
            echo "ERROR: legacy CarActivityService not found."
            exit 1
          fi

          echo "Legacy Android Auto SDK verified."

      - name: Verify Android Auto source manifest
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          echo "=================================================="
          echo "VERIFY CARACTIVITY SERVICE"
          echo "=================================================="

          grep -R -q \
            'AACastCarService' \
            app/src/main/AndroidManifest.xml

          echo "AACastCarService found."

          echo "=================================================="
          echo "VERIFY PROJECTION"
          echo "=================================================="

          grep -R -q \
            'CATEGORY_PROJECTION' \
            app/src/main/AndroidManifest.xml

          echo "CATEGORY_PROJECTION verified."

          echo "=================================================="
          echo "VERIFY AUTOMOTIVE APP"
          echo "=================================================="

          grep -R -q \
            'com.google.android.gms.car.application' \
            app/src/main/AndroidManifest.xml

          echo "Android Auto metadata verified."

      - name: Build V9 release APK
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Locate V9 release APK
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          RELEASE_DIR="app/build/outputs/apk/release"

          echo "=================================================="
          echo "RELEASE OUTPUT"
          echo "=================================================="

          test -d "$RELEASE_DIR"

          find "$RELEASE_DIR" \
            -maxdepth 2 \
            -type f \
            -print

          echo "=================================================="
          echo "FIND APK"
          echo "=================================================="

          mapfile -t RELEASE_APKS < <(
            find "$RELEASE_DIR" \
              -maxdepth 2 \
              -type f \
              -name "*.apk" \
              -print
          )

          if [ "${#RELEASE_APKS[@]}" -eq 0 ]; then
            echo "ERROR: No release APK found."
            exit 1
          fi

          echo "Found ${#RELEASE_APKS[@]} APK(s):"

          printf '%s\n' "${RELEASE_APKS[@]}"

          if [ "${#RELEASE_APKS[@]}" -eq 1 ]; then
            SELECTED_APK="${RELEASE_APKS[0]}"

          else
            SELECTED_APK=""

            for apk in "${RELEASE_APKS[@]}"; do
              filename="$(basename "$apk")"

              case "$filename" in
                *-universal.apk)
                  continue
                  ;;
                *-arm64-v8a.apk)
                  continue
                  ;;
                *-armeabi-v7a.apk)
                  continue
                  ;;
                *-x86.apk)
                  continue
                  ;;
                *-x86_64.apk)
                  continue
                  ;;
                *)
                  if [ -z "$SELECTED_APK" ]; then
                    SELECTED_APK="$apk"
                  else
                    echo "ERROR: Multiple non-split APKs found."
                    printf '%s\n' "${RELEASE_APKS[@]}"
                    exit 1
                  fi
                  ;;
              esac
            done

            if [ -z "$SELECTED_APK" ]; then
              echo "ERROR: Only split APKs found."
              printf '%s\n' "${RELEASE_APKS[@]}"
              exit 1
            fi
          fi

          echo "=================================================="
          echo "SELECTED RELEASE APK"
          echo "=================================================="

          echo "$SELECTED_APK"

          test -f "$SELECTED_APK"

          echo "RELEASE_APK=$SELECTED_APK" >> "$GITHUB_ENV"

          echo "Release APK located successfully."

      - name: Verify V9 release APK
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          APK="$RELEASE_APK"

          echo "=================================================="
          echo "RELEASE APK"
          echo "=================================================="

          echo "APK: $APK"

          test -f "$APK"

          ls -lh "$APK"

          echo "Release APK exists."

          echo "=================================================="
          echo "VERIFY LEGACY SDK"
          echo "=================================================="

          rm -rf /tmp/v9-release-dex
          mkdir -p /tmp/v9-release-dex

          unzip -oq \
            "$APK" \
            'classes*.dex' \
            -d /tmp/v9-release-dex

          FOUND=0

          for dex in /tmp/v9-release-dex/classes*.dex; do

            STRINGS_FILE="/tmp/v9-release-strings.txt"

            strings "$dex" > "$STRINGS_FILE"

            if grep -q \
              'com/google/android/apps/auto/sdk/CarActivityService' \
              "$STRINGS_FILE"; then

              echo "Legacy CarActivityService found in:"
              echo "$dex"

              FOUND=1
              break
            fi

          done

          if [ "$FOUND" -ne 1 ]; then
            echo "ERROR: legacy CarActivityService missing."
            exit 1
          fi

          echo "Release legacy SDK verified."

      - name: Verify V9 release manifest
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          APK="$RELEASE_APK"

          echo "=================================================="
          echo "RELEASE MANIFEST"
          echo "=================================================="

          test -f "$APK"

          grep -R -q \
            'AACastCarService' \
            app/src/main/AndroidManifest.xml

          grep -R -q \
            'CATEGORY_PROJECTION' \
            app/src/main/AndroidManifest.xml

          grep -R -q \
            'com.google.android.gms.car.application' \
            app/src/main/AndroidManifest.xml

          echo "Release manifest source verified."

      - name: Package V9 release
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          echo "=================================================="
          echo "PACKAGE"
          echo "=================================================="

          mkdir -p release

          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$DEBUG_APK"
          test -f "$RELEASE_APK"

          cp \
            "$DEBUG_APK" \
            release/CarAssistant-V9-AACast-debug.apk

          cp \
            "$RELEASE_APK" \
            release/CarAssistant-V9-AACast-release.apk

          cd release

          echo "=================================================="
          echo "SHA256"
          echo "=================================================="

          sha256sum \
            CarAssistant-V9-AACast-debug.apk \
            > CarAssistant-V9-AACast-debug.apk.sha256

          sha256sum \
            CarAssistant-V9-AACast-release.apk \
            > CarAssistant-V9-AACast-release.apk.sha256

          echo "=================================================="
          echo "ZIP"
          echo "=================================================="

          zip -9 \
            CarAssistant-V9-AACast.zip \
            CarAssistant-V9-AACast-debug.apk \
            CarAssistant-V9-AACast-release.apk \
            CarAssistant-V9-AACast-debug.apk.sha256 \
            CarAssistant-V9-AACast-release.apk.sha256

          echo "=================================================="
          echo "PACKAGE CONTENT"
          echo "=================================================="

          ls -lh

          unzip -l \
            CarAssistant-V9-AACast.zip

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          echo "=================================================="
          echo "FINAL VERIFICATION"
          echo "=================================================="

          test -f \
            release/CarAssistant-V9-AACast-debug.apk

          test -f \
            release/CarAssistant-V9-AACast-release.apk

          test -f \
            release/CarAssistant-V9-AACast-debug.apk.sha256

          test -f \
            release/CarAssistant-V9-AACast-release.apk.sha256

          test -f \
            release/CarAssistant-V9-AACast.zip

          echo "=================================================="
          echo "SHA256"
          echo "=================================================="

          cat \
            release/CarAssistant-V9-AACast-debug.apk.sha256

          cat \
            release/CarAssistant-V9-AACast-release.apk.sha256

          echo "=================================================="
          echo "FINAL FILES"
          echo "=================================================="

          ls -lh release

          echo "=================================================="
          echo "V9 AACAST BUILD READY"
          echo "=================================================="

      - name: Upload V9 AACast artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V9-AACast
          path: |
            v9-aacast-source/release/CarAssistant-V9-AACast-debug.apk
            v9-aacast-source/release/CarAssistant-V9-AACast-release.apk
            v9-aacast-source/release/CarAssistant-V9-AACast-debug.apk.sha256
            v9-aacast-source/release/CarAssistant-V9-AACast-release.apk.sha256
            v9-aacast-source/release/CarAssistant-V9-AACast.zip
          if-no-files-found: error
          retention-days: 90
