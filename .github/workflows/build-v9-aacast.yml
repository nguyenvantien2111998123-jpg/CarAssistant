name: Build Car Assistant V9-AACast

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_VERSION: "8.7"
      AACAST_REPO: "https://github.com/xuanthanhtn96/AACast-Doudou.git"
      AACAST_REF: "main"

    steps:

      # ================================================================
      # CHECKOUT
      # ================================================================

      - name: Checkout CarAssistant
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ================================================================
      # GET AACAST SOURCE
      # ================================================================

      - name: Download AACast-Doudou source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf aacast-upstream
          rm -rf v9-aacast-source

          git clone \
            --depth 1 \
            --branch "$AACAST_REF" \
            "$AACAST_REPO" \
            aacast-upstream

          test -d aacast-upstream/app
          test -s aacast-upstream/app/build.gradle
          test -s aacast-upstream/app/libs/aasdk-legacy.jar
          test -s aacast-upstream/app/libs/aasdk-legacy.dex
          test -s aacast-upstream/app/libs/xposed-api-82.jar

          cp -a aacast-upstream v9-aacast-source

          echo "=================================================="
          echo "AACAST SOURCE"
          echo "=================================================="

          git -C v9-aacast-source log -1 --oneline

          echo "=================================================="
          echo "LEGACY SDK"
          echo "=================================================="

          ls -lh \
            v9-aacast-source/app/libs/aasdk-legacy.jar \
            v9-aacast-source/app/libs/aasdk-legacy.dex \
            v9-aacast-source/app/libs/xposed-api-82.jar

      # ================================================================
      # CONVERT AACAST -> CAR ASSISTANT V9
      # ================================================================

      - name: Transform AACast into Car Assistant V9
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          # ------------------------------------------------------------
          # PACKAGE
          # ------------------------------------------------------------

          find app/src/main -type f \
            \( -name "*.java" -o -name "*.xml" -o -name "*.txt" \
               -o -name "*.properties" -o -name "*.md" \) \
            -print0 |
          xargs -0 sed -i \
            's/com\.hieptran\.aacast\.doudou/com\.carassistant\.v9/g'

          # ------------------------------------------------------------
          # APPLICATION ID / NAMESPACE
          # ------------------------------------------------------------

          sed -i \
            's/namespace '\''com\.hieptran\.aacast\.doudou'\''/namespace '\''com.carassistant.v9'\''/' \
            app/build.gradle

          sed -i \
            's/applicationId "com\.hieptran\.aacast\.doudou"/applicationId "com.carassistant.v9"/' \
            app/build.gradle

          # ------------------------------------------------------------
          # VERSION
          # ------------------------------------------------------------

          sed -i \
            's/versionCode 3/versionCode 900/' \
            app/build.gradle

          sed -i \
            's/versionName "1\.0\.0"/versionName "9.0-AACast"/' \
            app/build.gradle

          # ------------------------------------------------------------
          # DISPLAY PACKAGE / DISPLAY PREFIX
          # ------------------------------------------------------------

          find app/src/main -type f \
            \( -name "*.java" -o -name "*.xml" \) \
            -print0 |
          xargs -0 sed -i \
            's/AACast Doudou /Car Assistant V9 /g'

          find app/src/main -type f \
            \( -name "*.java" -o -name "*.xml" \) \
            -print0 |
          xargs -0 sed -i \
            's/AACast-Doudou/CarAssistant-V9/g'

          # ------------------------------------------------------------
          # APP LABEL
          # ------------------------------------------------------------

          find app/src/main -type f \
            \( -name "*.xml" -o -name "*.java" \) \
            -print0 |
          xargs -0 sed -i \
            's/AACast Doudou/Car Assistant V9/g'

          # ------------------------------------------------------------
          # DO NOT ENABLE R8 / MINIFY
          # ------------------------------------------------------------

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          s = s.replace(
              'minifyEnabled true',
              'minifyEnabled false'
          )

          s = s.replace(
              'minifyEnabled false',
              'minifyEnabled false'
          )

          if 'minifyEnabled false' not in s:
              raise SystemExit(
                  "ERROR: minifyEnabled false not present"
              )

          p.write_text(s)
          PY

          # ------------------------------------------------------------
          # REWRITE XPOSED ENTRY POINT
          # ------------------------------------------------------------

          cat > app/src/main/assets/xposed_init <<'EOF'
          com.carassistant.v9.aabridge.AACastBridge
          EOF

          # ------------------------------------------------------------
          # FORCE V9 DISPLAY CONSTANTS
          # ------------------------------------------------------------

          python3 - <<'PY'
          from pathlib import Path

          root = Path("app/src/main")

          for p in root.rglob("*.java"):
              s = p.read_text(errors="ignore")

              s = s.replace(
                  'private static final String PACKAGE = '
                  '"com.carassistant.v9";',
                  'private static final String PACKAGE = '
                  '"com.carassistant.v9";'
              )

              s = s.replace(
                  '"AACast Doudou "',
                  '"Car Assistant V9 "'
              )

              s = s.replace(
                  '"AACast-Doudou"',
                  '"CarAssistant-V9"'
              )

              p.write_text(s)
          PY

          # ------------------------------------------------------------
          # ADD V9 VERSION RESOURCE
          # ------------------------------------------------------------

          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/carassistant_v9.xml <<'EOF'
          <resources>

              <string name="carassistant_v9_name">
                  Car Assistant V9-AACast
              </string>

              <string name="carassistant_v9_description">
                  Car Assistant V9 AACast Android Auto VirtualDisplay System
              </string>

          </resources>
          EOF

          # ------------------------------------------------------------
          # UPDATE APP LABEL IF strings.xml EXISTS
          # ------------------------------------------------------------

          if [ -f app/src/main/res/values/strings.xml ]; then
            sed -i \
              's/AACast Doudou/Car Assistant V9-AACast/g' \
              app/src/main/res/values/strings.xml
          fi

          echo "=================================================="
          echo "V9 GRADLE"
          echo "=================================================="

          grep -n \
            -E \
            'namespace|applicationId|versionCode|versionName|minifyEnabled' \
            app/build.gradle

      # ================================================================
      # VERIFY AACAST ARCHITECTURE
      # ================================================================

      - name: Verify V9 source architecture
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          echo "=================================================="
          echo "CHECK LEGACY SDK"
          echo "=================================================="

          test -s app/libs/aasdk-legacy.jar
          test -s app/libs/aasdk-legacy.dex
          test -s app/libs/xposed-api-82.jar

          echo "=================================================="
          echo "CHECK CAR ACTIVITY"
          echo "=================================================="

          grep -R -q \
            'extends CarActivityService' \
            app/src/main/java

          grep -R -q \
            'extends CarActivity' \
            app/src/main/java

          grep -R -q \
            'getCarActivity()' \
            app/src/main/java

          echo "=================================================="
          echo "CHECK VIRTUAL DISPLAY"
          echo "=================================================="

          grep -R -q \
            'createVirtualDisplay' \
            app/src/main/java

          grep -R -q \
            'VirtualDisplay' \
            app/src/main/java

          echo "=================================================="
echo "CHECK VIRTUAL DISPLAY"
echo "=================================================="

grep -R -q \
  'createVirtualDisplay' \
  app/src/main/java

grep -R -q \
  'VirtualDisplay' \
  app/src/main/java

# AACast-Doudou uses flag value 10:
# PRESENTATION (2) | OWN_CONTENT_ONLY (8) = 10
if grep -R -q 'OWN_CONTENT_ONLY' app/src/main/java; then
  echo "OWN_CONTENT_ONLY constant found."
elif grep -R -q 'createVirtualDisplay' app/src/main/java && \
     grep -R -q ', 10)' app/src/main/java; then
  echo "VirtualDisplay flags=10 found."
  echo "10 = PRESENTATION | OWN_CONTENT_ONLY"
else
  echo "ERROR: VirtualDisplay flags not verified."
  exit 1
fi

          echo "=================================================="
          echo "CHECK ROOT DISPLAY LAUNCH"
          echo "=================================================="

          grep -R -q \
            -- '--display' \
            app/src/main/java

          grep -R -q \
            'su' \
            app/src/main/java

          echo "=================================================="
          echo "CHECK XPOSED"
          echo "=================================================="

          test -s app/src/main/assets/xposed_init

          grep -R -q \
            'IXposedHookLoadPackage' \
            app/src/main/java

          grep -R -q \
            'com.google.android.projection.gearhead' \
            app/src/main/java

          grep -R -q \
            '"android"' \
            app/src/main/java

          echo "=================================================="
          echo "CHECK DISPLAY HOOK"
          echo "=================================================="

          grep -R -q \
            'VirtualDisplayDevice' \
            app/src/main/java

          echo "=================================================="
          echo "CHECK INPUT HOOK"
          echo "=================================================="

          grep -R -q \
            'InputManagerService' \
            app/src/main/java

          echo "=================================================="
          echo "CHECK NO ANDROIDX CARAPP SERVICE"
          echo "=================================================="

          if grep -R -q \
            'androidx.car.app.CarAppService' \
            app/src/main/java; then

            echo "ERROR: V9 still contains androidx.car.app.CarAppService"
            exit 1
          fi

          echo "V9 architecture verification passed."

      # ================================================================
      # VERIFY PACKAGE TRANSFORMATION
      # ================================================================

      - name: Verify V9 package transformation
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          echo "=================================================="
          echo "OLD PACKAGE CHECK"
          echo "=================================================="

          if grep -R -q \
            'com.hieptran.aacast.doudou' \
            app/src/main \
            --exclude='*.dex' \
            --exclude='*.jar'; then

            echo "ERROR: old AACast package remains"
            grep -R \
              -n \
              'com.hieptran.aacast.doudou' \
              app/src/main \
              --exclude='*.dex' \
              --exclude='*.jar' \
              || true

            exit 1
          fi

          echo "=================================================="
          echo "NEW PACKAGE"
          echo "=================================================="

          grep -R -q \
            'com.carassistant.v9' \
            app/src/main

          echo "=================================================="
          echo "XPOSED INIT"
          echo "=================================================="

          cat app/src/main/assets/xposed_init

          grep -q \
            '^com.carassistant.v9.aabridge.AACastBridge$' \
            app/src/main/assets/xposed_init

      # ================================================================
      # VERIFY BUILD CONFIG
      # ================================================================

      - name: Verify build configuration
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          echo "=================================================="
          echo "BUILD TYPES"
          echo "=================================================="

          grep -n \
            'minifyEnabled' \
            app/build.gradle

          if grep -q \
            'minifyEnabled true' \
            app/build.gradle; then

            echo "ERROR: R8/minify enabled"
            exit 1
          fi

          if grep -q \
            'shrinkResources true' \
            app/build.gradle; then

            echo "ERROR: shrinkResources enabled"
            exit 1
          fi

          echo "R8/minify disabled."

      # ================================================================
      # GENERATE GRADLE WRAPPER
      # ================================================================

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          gradle wrapper \
            --gradle-version "$GRADLE_VERSION" \
            --distribution-type bin

          chmod +x gradlew

          ./gradlew \
            --version

      # ================================================================
      # CLEAN
      # ================================================================

      - name: Clean V9 build
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          ./gradlew \
            --no-daemon \
            clean

      # ================================================================
      # BUILD DEBUG
      # ================================================================

      - name: Build V9 debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ================================================================
      # VERIFY DEBUG APK
      # ================================================================

      - name: Verify V9 debug APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v9-aacast-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          test -s "$APK"

          echo "=================================================="
          echo "APK"
          echo "=================================================="

          ls -lh "$APK"

          echo "=================================================="
          echo "SHA256"
          echo "=================================================="

          sha256sum "$APK"

          echo "=================================================="
          echo "APK CONTENTS"
          echo "=================================================="

          unzip -l "$APK" |
            grep -E \
              'classes[0-9]*\.dex|assets/xposed_init|AndroidManifest.xml'

          echo "=================================================="
          echo "XPOSED INIT"
          echo "=================================================="

          unzip -p \
            "$APK" \
            assets/xposed_init

          echo

          grep -q \
            'com.carassistant.v9.aabridge.AACastBridge' \
            <(
              unzip -p \
                "$APK" \
                assets/xposed_init
            )

      # ================================================================
      # VERIFY LEGACY DEX IS IN APK
      # ================================================================

      - name: Verify legacy Android Auto SDK in APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v9-aacast-source/app/build/outputs/apk/debug/app-debug.apk"

          mkdir -p /tmp/v9-apk

          unzip -q \
            "$APK" \
            -d /tmp/v9-apk

          echo "=================================================="
          echo "DEX FILES"
          echo "=================================================="

          find /tmp/v9-apk \
            -maxdepth 1 \
            -type f \
            -name 'classes*.dex' \
            -printf '%f %s bytes\n' |
            sort

          DEX_COUNT=$(
            find /tmp/v9-apk \
              -maxdepth 1 \
              -type f \
              -name 'classes*.dex' |
              wc -l
          )

          if [ "$DEX_COUNT" -lt 2 ]; then
            echo "ERROR: Expected multiple dex files."
            echo "Legacy AACast SDK may not have been merged."
            exit 1
          fi

          echo "DEX count: $DEX_COUNT"

          echo "=================================================="
          echo "SEARCH LEGACY SDK CLASSES"
          echo "=================================================="

          found=0

          for dex in /tmp/v9-apk/classes*.dex; do
            if strings "$dex" |
              grep -q \
                'com/google/android/apps/auto/sdk/CarActivityService'; then

              echo "Found CarActivityService in $dex"
              found=1
            fi
          done

          if [ "$found" -ne 1 ]; then
            echo "ERROR: CarActivityService not found in APK DEX."
            exit 1
          fi

          echo "Legacy Android Auto SDK verified."

      # ================================================================
      # VERIFY CAR ACTIVITY SERVICE
      # ================================================================

      - name: Verify Android Auto service and manifest
        shell: bash
        run: |
          set -euo pipefail

          APK="v9-aacast-source/app/build/outputs/apk/debug/app-debug.apk"

          echo "=================================================="
          echo "MANIFEST STRINGS"
          echo "=================================================="

          strings "$APK" |
            grep -E \
              'com.google.android.gms.car.application|CATEGORY_PROJECTION|CarActivityService|com.carassistant.v9' \
              || true

          echo "=================================================="
          echo "SOURCE MANIFEST"
          echo "=================================================="

          cat \
            v9-aacast-source/app/src/main/AndroidManifest.xml

          echo "=================================================="
          echo "CHECK SERVICE"
          echo "=================================================="

          grep -q \
            'CarActivityService' \
            v9-aacast-source/app/src/main/AndroidManifest.xml

          echo "Android Auto service declaration found."

      # ================================================================
      # BUILD RELEASE
      # ================================================================

      - name: Build V9 release APK
        shell: bash
        run: |
          set -euo pipefail

          cd v9-aacast-source

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease

      # ================================================================
      # VERIFY RELEASE
      # ================================================================

      - name: Verify V9 release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v9-aacast-source/app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"
          test -s "$APK"

          echo "=================================================="
          echo "RELEASE APK"
          echo "=================================================="

          ls -lh "$APK"

          echo "=================================================="
          echo "SHA256"
          echo "=================================================="

          sha256sum "$APK"

          echo "=================================================="
          echo "XPOSED ENTRY"
          echo "=================================================="

          unzip -p \
            "$APK" \
            assets/xposed_init

          echo

          echo "=================================================="
          echo "DEX"
          echo "=================================================="

          unzip -l "$APK" |
            grep -E \
              'classes[0-9]*\.dex'

          echo "=================================================="
          echo "LEGACY SDK"
          echo "=================================================="

          mkdir -p /tmp/v9-release

          unzip -q \
            "$APK" \
            -d /tmp/v9-release

          found=0

          for dex in /tmp/v9-release/classes*.dex; do
            if strings "$dex" |
              grep -q \
                'com/google/android/apps/auto/sdk/CarActivityService'; then

              echo "CarActivityService found in $dex"
              found=1
            fi
          done

          if [ "$found" -ne 1 ]; then
            echo "ERROR: Legacy SDK missing from release APK."
            exit 1
          fi

      # ================================================================
      # PACKAGE
      # ================================================================

      - name: Package V9 release
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          cp \
            v9-aacast-source/app/build/outputs/apk/debug/app-debug.apk \
            release/CarAssistant-V9-AACast-debug.apk

          cp \
            v9-aacast-source/app/build/outputs/apk/release/app-release.apk \
            release/CarAssistant-V9-AACast-release.apk

          sha256sum \
            release/CarAssistant-V9-AACast-debug.apk \
            > release/CarAssistant-V9-AACast-debug.sha256

          sha256sum \
            release/CarAssistant-V9-AACast-release.apk \
            > release/CarAssistant-V9-AACast-release.sha256

          cd release

          zip -9 \
            CarAssistant-V9-AACast.zip \
            CarAssistant-V9-AACast-debug.apk \
            CarAssistant-V9-AACast-release.apk \
            CarAssistant-V9-AACast-debug.sha256 \
            CarAssistant-V9-AACast-release.sha256

          echo "=================================================="
          echo "RELEASE CONTENTS"
          echo "=================================================="

          ls -lh

      # ================================================================
      # FINAL SUMMARY
      # ================================================================

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail

          APK="release/CarAssistant-V9-AACast-release.apk"

          echo
          echo "=================================================="
          echo "CAR ASSISTANT V9 AACAST BUILD COMPLETE"
          echo "=================================================="

          echo
          echo "APK:"
          ls -lh "$APK"

          echo
          echo "SHA256:"
          sha256sum "$APK"

          echo
          echo "Package expected:"
          echo "com.carassistant.v9"

          echo
          echo "Architecture:"
          echo "CarActivityService"
          echo "CarActivity"
          echo "RootView"
          echo "PaneView"
          echo "TextureView"
          echo "VirtualDisplay"
          echo "RootShell"
          echo "Xposed android hook"
          echo "Xposed Gearhead hook"
          echo "Legacy Android Auto SDK"

          echo
          echo "R8/minify:"
          echo "DISABLED"

      # ================================================================
      # UPLOAD
      # ================================================================

      - name: Upload V9 AACast artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V9-AACast
          path: |
            release/CarAssistant-V9-AACast.zip
            release/CarAssistant-V9-AACast-debug.apk
            release/CarAssistant-V9-AACast-release.apk
            release/CarAssistant-V9-AACast-debug.sha256
            release/CarAssistant-V9-AACast-release.sha256
          if-no-files-found: error
