                Color.rgb(
                        22,
                        27,
                        33));

        background.setCornerRadius(
                dp(16));

        tile.setBackground(background);

        ImageView icon =
                new ImageView(this);

        Drawable drawable =
                getRealAppIcon(
                        app.component.getPackageName());

        if (drawable != null) {
            icon.setImageDrawable(drawable);
        }

        icon.setScaleType(
                ImageView.ScaleType.CENTER_INSIDE);

        tile.addView(
                icon,
                new LinearLayout.LayoutParams(
                        -1,
                        dp(64)));

        TextView name =
                text(
                        app.name,
                        12,
                        Color.WHITE);

        name.setGravity(
                Gravity.CENTER);

        name.setMaxLines(2);

        tile.addView(
                name,
                new LinearLayout.LayoutParams(
                        -1,
                        dp(38)));

        tile.setOnClickListener(
                v -> {

                    hideApps();

                    launchProjection(
                            app.component);
                });

        return tile;
    }

    private Drawable getRealAppIcon(
            String packageName) {

        try {

            PackageManager pm =
                    getPackageManager();

            ApplicationInfo info =
                    pm.getApplicationInfo(
                            packageName,
                            0);

            return info.loadIcon(pm);

        } catch (Exception ignored) {

            return null;
        }
    }
