      - name: Verify Home UI V2 source
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -q 'private Drawable getRealAppIcon' "$FILE"
          grep -q 'ApplicationInfo' "$FILE"
          grep -q 'PackageManager' "$FILE"
          grep -q 'ImageView' "$FILE"
          grep -q 'getQuickLaunchApps' "$FILE"
          grep -q '"TASKS"' "$FILE"
          grep -q '"MEDIA"' "$FILE"
          grep -q '"WYN"' "$FILE"
          grep -q 'APP\\nCHỌN' "$FILE"

          if grep -q '"CAR ASSISTANT"' "$FILE"; then
            echo "ERROR: old Home title remains"
            exit 1
          fi

          if grep -q '"SPEED"' "$FILE"; then
            echo "ERROR: old SPEED card remains"
            exit 1
          fi

          if grep -q '"WEATHER"' "$FILE"; then
            echo "ERROR: old WEATHER card remains"
            exit 1
          fi

          if grep -q 'Navigation' "$FILE"; then
            echo "ERROR: old Navigation card remains"
            exit 1
          fi

          if grep -q 'Math.min(.*5' "$FILE"; then
            echo "ERROR: old five-app dock remains"
            exit 1
          fi

          echo "Home UI V2 source verification: PASS"

      - name: Verify projection and persistence code unchanged
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -q 'V10SessionStore' "$FILE"
          grep -q 'session.setTarget' "$FILE"
          grep -q 'session.release' "$FILE"
          grep -q 'session.hideTask' "$FILE"
          grep -q 'createFloatingTouchKey' "$FILE"
          grep -q 'handleControlBack' "$FILE"
          grep -q 'handleControlHome' "$FILE"

          for f in \
            "V10ProjectionSession.java" \
            "V10DisplayController.java" \
            "V10SurfaceManager.java" \
            "V10TaskSession.java"
          do
            test -f "v10-source/app/src/main/java/com/hieptran/aacast/doudou/$f"
          done

          if test -f \
            "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java"
          then
            echo "ERROR: forbidden V10ProjectionService.java exists"
            exit 1
          fi

          echo "Projection/Persistence protection markers: PASS"

      - name: Verify only V10CarActivity changed
        shell: bash
        run: |
          set -euo pipefail

          git status --short

          CHANGED="$(
            git status --short |
            awk '{print substr($0,4)}'
          )"

          if [ -z "$CHANGED" ]; then
            echo "ERROR: no source change detected"
            exit 1
          fi

          BAD=0

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            if [ "$file" != "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java" ]; then
              echo "ERROR: unexpected changed file: $file"
              BAD=1
            fi
          done <<< "$CHANGED"

          if [ "$BAD" -ne 0 ]; then
            exit 1
          fi

          echo "Only V10CarActivity.java changed: PASS"

      - name: Verify protected Foundation hashes
        shell: bash
        run: |
          set -euo pipefail

          cd v10-source

          sha256sum \
            app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java \
            > ../foundation-protected/hashes-after.txt

          diff -u \
            ../foundation-protected/hashes-before.txt \
            ../foundation-protected/hashes-after.txt

          cd ..

          echo "Protected Foundation hashes: PASS"

      - name: Verify V10CarActivity changed only for Home UI V2
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -q 'private void buildDashboard()' "$FILE"
          grep -q 'private void rebuildDock()' "$FILE"
          grep -q 'private LinearLayout appTile(' "$FILE"
          grep -q 'private Drawable getRealAppIcon(' "$FILE"
          grep -q 'private void launchProjection(' "$FILE"
          grep -q 'private void createFloatingTouchKey()' "$FILE"

          echo "Home UI V2 structural verification: PASS"

      - name: Git diff check
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          echo "Git diff check: PASS"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile Java
        shell: bash
        working-directory: v10-source
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace

      - name: Assemble Debug APK
        shell: bash
        working-directory: v10-source
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Locate APK and calculate SHA256
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          APK="$(
            find v10-source/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          test -n "$APK"
          test -f "$APK"

          cp "$APK" \
            "release/CarAssistant-V10-Home-UI-V2.apk"

          sha256sum \
            "release/CarAssistant-V10-Home-UI-V2.apk" \
            | tee "release/SHA256SUM.txt"

          echo "APK=$APK"

      - name: Upload Home UI V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Home-UI-V2
          path: |
            release/CarAssistant-V10-Home-UI-V2.apk
            release/SHA256SUM.txt
          if-no-files-found: error

      - name: Final Home UI V2 gate
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            "release/CarAssistant-V10-Home-UI-V2.apk"

          test -s \
            "release/CarAssistant-V10-Home-UI-V2.apk"

          test -f \
            "release/SHA256SUM.txt"

          echo "=============================================="
          echo "HOME UI V2 LAYOUT SAFE: PASS"
          echo "Foundation V1 preserved."
          echo "Real ApplicationInfo icons added."
          echo "Four real quick-launch apps added."
          echo "Old Home UI removed."
          echo "Voice/Tasks/Wyn/Media are placeholders only."
          echo "Display Core / Projection / Persistence preserved."
          echo "=============================================="
