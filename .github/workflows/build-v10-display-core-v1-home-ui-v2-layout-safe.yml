name: Build V10 Display Core V1 - Home UI V2 Layout Safe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-home-ui-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact Foundation V1
        uses: actions/checkout@v4
        with:
          ref: 7292b0569359a2fe6f7c3829561b6f65664fbd2e
          fetch-depth: 1

      - name: Verify Foundation V1
        shell: bash
        run: |
          set -e

          EXPECTED="7292b0569359a2fe6f7c3829561b6f65664fbd2e"
          ACTUAL="$(git rev-parse HEAD)"

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          test "$ACTUAL" = "$EXPECTED"

          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java

          if [ -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java ]; then
            echo "ERROR: V10ProjectionService.java must not exist"
            exit 1
          fi

          echo "Foundation V1 verified."

      - name: Snapshot protected Display Core files
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/foundation_snapshot

          cp v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java \
             /tmp/foundation_snapshot/V10ProjectionSession.java

          cp v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java \
             /tmp/foundation_snapshot/V10DisplayController.java

          cp v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java \
             /tmp/foundation_snapshot/V10SurfaceManager.java

          cp v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java \
             /tmp/foundation_snapshot/V10TaskSession.java

          sha256sum /tmp/foundation_snapshot/*

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Home UI V2 patch script with small printf commands
        shell: bash
        run: |
          set -e

          rm -f /tmp/home_ui_v2_patch.py
          touch /tmp/home_ui_v2_patch.py

          printf '%s\n' 'from pathlib import Path' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' 'import re' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '' >> /tmp/home_ui_v2_patch.py

          printf '%s\n' 'ROOT = Path("v10-source/app/src/main/java/com/hieptran/aacast/doudou")' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' 'FILE = ROOT / "V10CarActivity.java"' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '' >> /tmp/home_ui_v2_patch.py

          printf '%s\n' 'text = FILE.read_text(encoding="utf-8")' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '' >> /tmp/home_ui_v2_patch.py

          printf '%s\n' 'if "class V10CarActivity" not in text:' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '    raise SystemExit("V10CarActivity.java is not the expected Foundation V1 source")' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '' >> /tmp/home_ui_v2_patch.py

          printf '%s\n' 'if "V10ProjectionSession" not in text:' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '    raise SystemExit("Unexpected V10CarActivity source: projection reference missing")' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '' >> /tmp/home_ui_v2_patch.py

          printf '%s\n' 'if "Home UI V2" in text:' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '    raise SystemExit("Home UI V2 patch already exists; refusing duplicate patch")' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '' >> /tmp/home_ui_v2_patch.py

          printf '%s\n' 'marker = "    private void showApps()"' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' 'idx = text.find(marker)' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '' >> /tmp/home_ui_v2_patch.py

          printf '%s\n' 'if idx < 0:' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '    raise SystemExit("showApps() marker not found; source layout is different")' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '' >> /tmp/home_ui_v2_patch.py

          printf '%s\n' 'method = r"""' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '    private ImageView createHomeAppIcon(String packageName) {' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        ImageView icon = new ImageView(this);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        icon.setScaleType(ImageView.ScaleType.CENTER_INSIDE);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        icon.setPadding(dp(8), dp(8), dp(8), dp(8));' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        try {' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '            ApplicationInfo info = getPackageManager().getApplicationInfo(packageName, 0);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '            Drawable drawable = info.loadIcon(getPackageManager());' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '            icon.setImageDrawable(drawable);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        } catch (Exception ignored) {' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '            icon.setImageResource(android.R.drawable.sym_def_app_icon);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        }' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        icon.setBackgroundColor(Color.TRANSPARENT);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        return icon;' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '    }' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '    private int dp(int value) {' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        return (int) (value * getResources().getDisplayMetrics().density + 0.5f);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '    }' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '"""' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '' >> /tmp/home_ui_v2_patch.py

          printf '%s\n' 'text = text[:idx] + method + "\n" + text[idx:]' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '' >> /tmp/home_ui_v2_patch.py

          printf '%s\n' 'layout_marker = "        // HOME_UI_V2_PLACEHOLDER"' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '' >> /tmp/home_ui_v2_patch.py

          printf '%s\n' 'if layout_marker not in text:' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '    layout_marker = "        setContentView("' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '' >> /tmp/home_ui_v2_patch.py

          printf '%s\n' 'ui = r"""' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        // Home UI V2 - layout only.' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        // Projection / session / persistence architecture is intentionally untouched.' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        LinearLayout homeRoot = new LinearLayout(this);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        homeRoot.setOrientation(LinearLayout.HORIZONTAL);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        homeRoot.setBackgroundColor(Color.rgb(18, 18, 18));' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        LinearLayout side = new LinearLayout(this);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        side.setOrientation(LinearLayout.VERTICAL);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        side.setGravity(Gravity.CENTER_HORIZONTAL);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        side.setPadding(dp(8), dp(12), dp(8), dp(12));' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        homeRoot.addView(side, new LinearLayout.LayoutParams(dp(88), -1));' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        TextView appButton = new TextView(this);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        appButton.setText("APP\\nỨNG DỤNG");' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        appButton.setTextColor(Color.WHITE);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        appButton.setGravity(Gravity.CENTER);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        appButton.setTextSize(11);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        appButton.setPadding(dp(3), dp(8), dp(3), dp(8));' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        appButton.setOnClickListener(v -> showApps());' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        side.addView(appButton, new LinearLayout.LayoutParams(-1, dp(64)));' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '' >> /tmp/home_ui_v2_patch.py

          printf '%s\n' '        TextView voiceButton = new TextView(this);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        voiceButton.setText("−");' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        voiceButton.setTextColor(Color.WHITE);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        voiceButton.setTextSize(28);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        voiceButton.setGravity(Gravity.CENTER);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        side.addView(voiceButton, new LinearLayout.LayoutParams(-1, dp(56)));' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '' >> /tmp/home_ui_v2_patch.py

          printf '%s\n' '        TextView tasksButton = new TextView(this);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        tasksButton.setText("TASKS");' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        tasksButton.setTextColor(Color.WHITE);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        tasksButton.setTextSize(10);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        tasksButton.setGravity(Gravity.CENTER);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        side.addView(tasksButton, new LinearLayout.LayoutParams(-1, dp(50)));' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '' >> /tmp/home_ui_v2_patch.py

          printf '%s\n' '        LinearLayout content = new LinearLayout(this);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        content.setOrientation(LinearLayout.VERTICAL);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        content.setPadding(dp(12), dp(12), dp(12), dp(10));' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        homeRoot.addView(content, new LinearLayout.LayoutParams(0, -1, 1f));' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '' >> /tmp/home_ui_v2_patch.py

          printf '%s\n' '        LinearLayout dock = new LinearLayout(this);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        dock.setOrientation(LinearLayout.HORIZONTAL);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        dock.setGravity(Gravity.CENTER_VERTICAL);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '' >> /tmp/home_ui_v2_patch.py

          printf '%s\n' '        String[] quickApps = {' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '            "com.google.android.youtube",' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '            "com.zing.zalo",' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '            "com.spotify.music",' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '            "com.google.android.apps.maps"' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        };' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '' >> /tmp/home_ui_v2_patch.py

          printf '%s\n' '        for (String pkg : quickApps) {' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '            ImageView icon = createHomeAppIcon(pkg);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '            dock.addView(icon, new LinearLayout.LayoutParams(dp(58), dp(58)));' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        }' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '' >> /tmp/home_ui_v2_patch.py

          printf '%s\n' '        content.addView(dock, new LinearLayout.LayoutParams(-1, dp(70)));' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '' >> /tmp/home_ui_v2_patch.py

          printf '%s\n' '        FrameLayout mainArea = new FrameLayout(this);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        mainArea.setBackgroundColor(Color.rgb(24, 24, 24));' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        content.addView(mainArea, new LinearLayout.LayoutParams(-1, 0, 1f));' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '' >> /tmp/home_ui_v2_patch.py

          printf '%s\n' '        TextView wyn = new TextView(this);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        wyn.setText("WYN");' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        wyn.setTextColor(Color.WHITE);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        wyn.setGravity(Gravity.CENTER);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        wyn.setTextSize(10);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '' >> /tmp/home_ui_v2_patch.py

          printf '%s\n' '        TextView media = new TextView(this);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        media.setText("> Đang phát...");' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        media.setTextColor(Color.WHITE);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        media.setGravity(Gravity.CENTER_VERTICAL);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        media.setPadding(dp(14), 0, dp(14), 0);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        media.setTextSize(12);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '' >> /tmp/home_ui_v2_patch.py

          printf '%s\n' '        LinearLayout bottom = new LinearLayout(this);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        bottom.setOrientation(LinearLayout.HORIZONTAL);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        bottom.setGravity(Gravity.CENTER_VERTICAL);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        bottom.addView(wyn, new LinearLayout.LayoutParams(dp(64), dp(50)));' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        bottom.addView(media, new LinearLayout.LayoutParams(0, dp(50), 1f));' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '        content.addView(bottom, new LinearLayout.LayoutParams(-1, dp(56)));' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '' >> /tmp/home_ui_v2_patch.py

          printf '%s\n' '        setContentView(homeRoot);' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '"""' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '' >> /tmp/home_ui_v2_patch.py

          printf '%s\n' '        text = text.replace(layout_marker, ui, 1)' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' '' >> /tmp/home_ui_v2_patch.py

          printf '%s\n' 'FILE.write_text(text, encoding="utf-8")' >> /tmp/home_ui_v2_patch.py
          printf '%s\n' 'print("Home UI V2 patch applied.")' >> /tmp/home_ui_v2_patch.py

      - name: Check Python patch syntax
        shell: bash
        run: |
          set -e

          python3 -m py_compile /tmp/home_ui_v2_patch.py

          echo "Python syntax: PASS"
          wc -l /tmp/home_ui_v2_patch.py
          sed -n '1,25p' /tmp/home_ui_v2_patch.py

      - name: Apply Home UI V2 patch
        shell: bash
        run: |
          set -e

          python3 /tmp/home_ui_v2_patch.py

      - name: Verify Home UI V2 patch
        shell: bash
        run: |
          set -e

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          test -f "$FILE"

          grep -Fq 'Home UI V2 - layout only.' "$FILE"
          grep -Fq 'appButton.setText("APP\nỨNG DỤNG");' "$FILE"
          grep -Fq 'ApplicationInfo info = getPackageManager().getApplicationInfo(packageName, 0);' "$FILE"
          grep -Fq 'String[] quickApps' "$FILE"
          grep -Fq '"com.google.android.youtube"' "$FILE"
          grep -Fq '"com.zing.zalo"' "$FILE"
          grep -Fq '"com.spotify.music"' "$FILE"
          grep -Fq '"com.google.android.apps.maps"' "$FILE"
          grep -Fq 'media.setText("> Đang phát...");' "$FILE"

          echo "Home UI V2 markers: PASS"

      - name: Verify only Home Activity changed
        shell: bash
        run: |
          set -e

          CHANGED="$(git status --short)"

          echo "$CHANGED"

          BAD="$(git status --short | grep -v 'V10CarActivity.java' || true)"

          if [ -n "$BAD" ]; then
            echo "ERROR: unexpected files changed:"
            echo "$BAD"
            exit 1
          fi

          COUNT="$(git status --short | wc -l)"

          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: expected exactly one changed file, got $COUNT"
            exit 1
          fi

          echo "Changed-file scope: PASS"

      - name: Verify protected Display Core unchanged
        shell: bash
        run: |
          set -e

          cmp -s \
            /tmp/foundation_snapshot/V10ProjectionSession.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java

          cmp -s \
            /tmp/foundation_snapshot/V10DisplayController.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java

          cmp -s \
            /tmp/foundation_snapshot/V10SurfaceManager.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java

          cmp -s \
            /tmp/foundation_snapshot/V10TaskSession.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java

          echo "Protected Display Core: UNCHANGED"

      - name: Show Home Activity diff
        shell: bash
        run: |
          set -e

          git diff --check
          git diff -- v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

      - name: Compile Java
        shell: bash
        run: |
          set -e

          cd v10-source

          chmod +x gradlew

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace

      - name: Assemble APK
        shell: bash
        run: |
          set -e

          cd v10-source

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: SHA256 APK
        shell: bash
        run: |
          set -e

          APK="$(find v10-source/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK: $APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Display-Core-V1-Home-UI-V2
          path: v10-source/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
