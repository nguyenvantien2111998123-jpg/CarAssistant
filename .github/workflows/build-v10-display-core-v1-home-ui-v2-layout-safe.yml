name: CarAssistant V10 - Display Core V1 - Home UI V2 Layout Safe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install PyYAML
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check PyYAML

      - name: Restore V1 Safe baseline
        shell: bash
        run: |
          set -euo pipefail

          BASELINE="9075636a7d5947c1b0eee49c2bd3fd0e1b6b0cf1"

          git fetch origin "$BASELINE" --depth=1

          rm -rf v10-source

          git checkout "$BASELINE" -- v10-source

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$SRC/V10CarActivity.java"
          test -f "$SRC/V10ProjectionSession.java"
          test -f "$SRC/V10SessionStore.java"

          if [ -f "$SRC/V10ProjectionService.java" ]; then
            echo "ERROR: V10ProjectionService.java exists."
            exit 1
          fi

          echo "V1 Safe source baseline restored."

      - name: Rebuild Display Core V1 from Stable Freeze source
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/run_core.py <<'PY'
          from pathlib import Path
          import subprocess
          import yaml
          import sys

          workflow = Path(
              ".github/workflows/build-v10-stable-base-freeze-v1.yml"
          )

          data = yaml.safe_load(
              workflow.read_text(encoding="utf-8")
          )

          steps = data["jobs"]["stable-base"]["steps"]

          found = False

          for step in steps:
              name = step.get("name", "")

              if name == "Create Display Core V1 from exact workflow":
                  found = True

                  subprocess.run(
                      [
                          "bash",
                          "-euo",
                          "pipefail",
                          "-c",
                          step["run"]
                      ],
                      check=True
                  )

                  break

          if not found:
              print(
                  "ERROR: Stable Freeze Display Core step not found."
              )
              sys.exit(1)
          PY

          python3 /tmp/run_core.py

      - name: Apply Floating Touch and SAFE Long Press from Stable Freeze
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/apply_stable_patches.py <<'PY'
          from pathlib import Path
          import subprocess
          import yaml
          import sys

          workflow = Path(
              ".github/workflows/build-v10-stable-base-freeze-v1.yml"
          )

          data = yaml.safe_load(
              workflow.read_text(encoding="utf-8")
          )

          wanted = {
              "Recover deleted Floating Touch workflow",
              "Apply historical Floating Touch patch",
              "Extract exact SAFE Long Press patch",
              "Apply exact SAFE Long Press patch",
          }

          found = set()

          for step in data["jobs"]["stable-base"]["steps"]:
              name = step.get("name", "")

              if name not in wanted:
                  continue

              run = step.get("run")

              if not run:
                  print("ERROR: missing run block:", name)
                  sys.exit(1)

              subprocess.run(
                  [
                      "bash",
                      "-euo",
                      "pipefail",
                      "-c",
                      run
                  ],
                  check=True
              )

              found.add(name)

          missing = wanted - found

          if missing:
              print(
                  "ERROR: missing Stable Freeze steps:"
              )
              for item in sorted(missing):
                  print(item)
              sys.exit(1)

          print(
              "Stable Freeze Floating Touch + SAFE Long Press applied."
          )
          PY

          python3 /tmp/apply_stable_patches.py

      - name: Verify V1 Safe Home baseline
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          test -f "$FILE"

          grep -Fq "private TextView clock;" "$FILE"
          grep -Fq "private TextView date;" "$FILE"
          grep -Fq "private void updateClock()" "$FILE"

          grep -Fq \
            "import android.content.pm.ApplicationInfo;" \
            "$FILE"

          grep -Fq \
            "import android.widget.ImageView;" \
            "$FILE"

          grep -Fq \
            "loadIcon(" \
            "$FILE"

          grep -Fq \
            "ImageView.ScaleType.CENTER_INSIDE" \
            "$FILE"

          if grep -Fq "CAR ASSISTANT" "$FILE"; then
            echo "ERROR: old header remains."
            exit 1
          fi

          if grep -Fq '"SPEED"' "$FILE"; then
            echo "ERROR: old SPEED card remains."
            exit 1
          fi

          if grep -Fq '"WEATHER"' "$FILE"; then
            echo "ERROR: old WEATHER card remains."
            exit 1
          fi

          if grep -Fq "initial(app.name)" "$FILE"; then
            echo "ERROR: old letter icon remains."
            exit 1
          fi

          if grep -Fq 'clock = text(' "$FILE"; then
            echo "ERROR: old clock UI remains."
            exit 1
          fi

          if grep -Fq 'date = text(' "$FILE"; then
            echo "ERROR: old date UI remains."
            exit 1
          fi

          echo "V1 Safe Home baseline verification PASS."

      - name: Freeze protected Core and Persistence files
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          sha256sum \
            "$SRC/V10DisplayController.java" \
            "$SRC/V10SurfaceManager.java" \
            "$SRC/V10TaskSession.java" \
            "$SRC/V10ProjectionSession.java" \
            "$SRC/V10SessionStore.java" \
            > /tmp/protected-before.sha256

      - name: Patch Home UI V2 Layout Safe
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/patch_home_v2.py <<'PY'
          from pathlib import Path
          import sys

          file = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          text = file.read_text(encoding="utf-8")
          original = text

          def find_method(source, signature):
              start = source.find(signature)

              if start < 0:
                  raise SystemExit(
                      "Method not found: " + signature
                  )

              brace = source.find("{", start)

              if brace < 0:
                  raise SystemExit(
                      "Opening brace not found: " + signature
                  )

              depth = 0
              in_string = False
              escaped = False
              line_comment = False
              block_comment = False

              i = brace

              while i < len(source):
                  c = source[i]
                  n = (
                      source[i + 1]
                      if i + 1 < len(source)
                      else ""
                  )

                  if line_comment:
                      if c == "\n":
                          line_comment = False

                  elif block_comment:
                      if c == "*" and n == "/":
                          block_comment = False
                          i += 1

                  elif in_string:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == '"':
                          in_string = False

                  else:
                      if c == "/" and n == "/":
                          line_comment = True
                          i += 1

                      elif c == "/" and n == "*":
                          block_comment = True
                          i += 1

                      elif c == '"':
                          in_string = True

                      elif c == "{":
                          depth += 1

                      elif c == "}":
                          depth -= 1

                          if depth == 0:
                              return start, i + 1

                  i += 1

              raise SystemExit(
                  "Closing brace not found: " + signature
              )

          required_imports = [
              "import android.content.pm.ApplicationInfo;",
              "import android.widget.ImageView;",
          ]

          for item in required_imports:
              if item not in text:
                  raise SystemExit(
                      "Required import missing: " + item
                  )

          required_markers = [
              "private TextView clock;",
              "private TextView date;",
              "private void updateClock()",
              "ApplicationInfo",
              "loadIcon(",
              "ImageView.ScaleType.CENTER_INSIDE",
          ]

          for item in required_markers:
              if item not in text:
                  raise SystemExit(
                      "Required V1 marker missing: " + item
                  )

          if "private void buildMainLayout(" not in text:
              raise SystemExit(
                  "buildMainLayout() not found."
              )

          start, end = find_method(
              text,
              "private void buildMainLayout("
          )

          new_layout = """private void buildMainLayout() {

              dashboard =
                      new LinearLayout(this);

              dashboard.setOrientation(
                      LinearLayout.HORIZONTAL);

              dashboard.setBackgroundColor(
                      Color.TRANSPARENT);

              dashboard.setPadding(
                      0,
                      0,
                      0,
                      0);

              launcherLayer.addView(
                      dashboard,
                      new LinearLayout.LayoutParams(
                              -1,
                              -1));

              // --------------------------------------------------
              // LEFT VERTICAL SIDEBAR
              // --------------------------------------------------

              LinearLayout sidebar =
                      new LinearLayout(this);

              sidebar.setOrientation(
                      LinearLayout.VERTICAL);

              sidebar.setGravity(
                      Gravity.CENTER_HORIZONTAL);

              sidebar.setPadding(
                      dp(7),
                      dp(7),
                      dp(7),
                      dp(7));

              GradientDrawable sideBg =
                      new GradientDrawable();

              sideBg.setColor(
                      Color.argb(
                              115,
                              18,
                              24,
                              31));

              sideBg.setCornerRadius(
                      dp(18));

              sidebar.setBackground(
                      sideBg);

              // Select app to project
              TextView menuAppsBtn =
                      sidebarButton("📱");

              menuAppsBtn.setContentDescription(
                      "Select app to project");

              menuAppsBtn.setOnClickListener(
                      v -> showApps());

              sidebar.addView(
                      menuAppsBtn,
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(50)));

              sidebar.addView(
                      spacer(dp(6)),
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(6)));

              // --------------------------------------------------
              // FOUR QUICK APPS
              //
              // V2 layout only:
              // first four available apps are displayed.
              // User customization is intentionally deferred.
              // --------------------------------------------------

              int quickCount =
                      Math.min(
                              4,
                              apps.size());

              for (int i = 0;
                   i < 4;
                   i++) {

                  final int index = i;

                  if (i < quickCount) {

                      final AppInfo quickApp =
                              apps.get(i);

                      LinearLayout quickTile =
                              quickAppTile(
                                      quickApp);

                      quickTile.setOnClickListener(
                              v ->
                                      launchProjection(
                                              quickApp.component));

                      sidebar.addView(
                              quickTile,
                              new LinearLayout.LayoutParams(
                                      -1,
                                      dp(58)));

                  } else {

                      TextView emptyQuick =
                              sidebarButton("＋");

                      emptyQuick.setContentDescription(
                              "Quick app slot "
                              + (i + 1));

                      sidebar.addView(
                              emptyQuick,
                              new LinearLayout.LayoutParams(
                                      -1,
                                      dp(58)));
                  }

                  sidebar.addView(
                          spacer(dp(5)),
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(5)));
              }

              sidebar.addView(
                      spacer(dp(5)),
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(5)));

              // --------------------------------------------------
              // VOICE PLACEHOLDER
              // No assistant logic.
              // --------------------------------------------------

              TextView voiceBtn =
                      sidebarButton("🎤");

              voiceBtn.setContentDescription(
                      "Voice assistant placeholder");

              voiceBtn.setOnClickListener(
                      v -> {
                          // V2 placeholder only.
                      });

              sidebar.addView(
                      voiceBtn,
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(50)));

              sidebar.addView(
                      spacer(dp(7)),
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(7)));

              // --------------------------------------------------
              // RUNNING APPS PLACEHOLDER
              // No task-management logic.
              // --------------------------------------------------

              TextView tasksBtn =
                      sidebarButton("▣");

              tasksBtn.setContentDescription(
                      "Running apps placeholder");

              tasksBtn.setOnClickListener(
                      v -> {
                          // V2 placeholder only.
                      });

              sidebar.addView(
                      tasksBtn,
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(50)));

              dashboard.addView(
                      sidebar,
                      new LinearLayout.LayoutParams(
                              dp(78),
                              -1));

              // --------------------------------------------------
              // CENTER HOME AREA
              // --------------------------------------------------

              LinearLayout centerStage =
                      new LinearLayout(this);

              centerStage.setOrientation(
                      LinearLayout.VERTICAL);

              centerStage.setGravity(
                      Gravity.CENTER);

              centerStage.setPadding(
                      dp(10),
                      dp(10),
                      dp(10),
                      dp(4));

              LinearLayout homeArea =
                      new LinearLayout(this);

              homeArea.setOrientation(
                      LinearLayout.VERTICAL);

              homeArea.setGravity(
                      Gravity.CENTER);

              GradientDrawable homeBg =
                      new GradientDrawable();

              homeBg.setColor(
                      Color.TRANSPARENT);

              homeArea.setBackground(
                      homeBg);

              TextView homeHint =
                      text(
                              "CARASSISTANT",
                              18,
                              Color.argb(
                                      0,
                                      255,
                                      255,
                                      255));

              homeHint.setGravity(
                      Gravity.CENTER);

              homeArea.addView(
                      homeHint,
                      new LinearLayout.LayoutParams(
                              -1,
                              -1));

              centerStage.addView(
                      homeArea,
                      new LinearLayout.LayoutParams(
                              -1,
                              0,
                              1));

              dashboard.addView(
                      centerStage,
                      new LinearLayout.LayoutParams(
                              0,
                              -1,
                              1));

              // --------------------------------------------------
              // BOTTOM CENTER AREA
              //
              // Wyn + Media are visual placeholders only.
              // No Wyn or Media functionality is added.
              // --------------------------------------------------

              LinearLayout bottomArea =
                      new LinearLayout(this);

              bottomArea.setOrientation(
                      LinearLayout.HORIZONTAL);

              bottomArea.setGravity(
                      Gravity.CENTER);

              bottomArea.setPadding(
                      dp(8),
                      dp(4),
                      dp(8),
                      dp(8));

              bottomArea.addView(
                      buildWynPlaceholder(),
                      new LinearLayout.LayoutParams(
                              dp(72),
                              dp(72)));

              bottomArea.addView(
                      spacer(dp(18)),
                      new LinearLayout.LayoutParams(
                              dp(18),
                              -1));

              bottomArea.addView(
                      buildMediaPlaceholder(),
                      new LinearLayout.LayoutParams(
                              dp(250),
                              dp(72)));

              launcherLayer.addView(
                      bottomArea,
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(88)));
          }"""

          text = (
              text[:start]
              + new_layout
              + text[end:]
          )

          # --------------------------------------------------
          # Add helper methods immediately before attachProjection.
          # --------------------------------------------------

          marker = "    private void attachProjection() {"

          if marker not in text:
              raise SystemExit(
                  "attachProjection() marker not found."
              )

          helpers = """    private LinearLayout quickAppTile(
                  AppInfo app) {

              LinearLayout tile =
                      new LinearLayout(this);

              tile.setOrientation(
                      LinearLayout.VERTICAL);

              tile.setGravity(
                      Gravity.CENTER);

              GradientDrawable bg =
                      new GradientDrawable();

              bg.setColor(
                      Color.argb(
                              155,
                              30,
                              40,
                              52));

              bg.setCornerRadius(
                      dp(13));

              tile.setBackground(bg);

              ImageView icon =
                      new ImageView(this);

              try {

                  ApplicationInfo applicationInfo =
                          getPackageManager()
                                  .getApplicationInfo(
                                          app.component
                                                  .getPackageName(),
                                          0);

                  icon.setImageDrawable(
                          applicationInfo.loadIcon(
                                  getPackageManager()));

              } catch (Throwable ignored) {

                  icon.setImageResource(
                          android.R.drawable
                                  .sym_def_app_icon);
              }

              icon.setScaleType(
                      ImageView.ScaleType.CENTER_INSIDE);

              icon.setPadding(
                      dp(5),
                      dp(5),
                      dp(5),
                      dp(5));

              tile.addView(
                      icon,
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(38)));

              TextView label =
                      text(
                              app.name,
                              8,
                              Color.WHITE);

              label.setGravity(
                      Gravity.CENTER);

              label.setMaxLines(1);

              tile.addView(
                      label,
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(17)));

              return tile;
          }

          private LinearLayout buildWynPlaceholder() {

              LinearLayout box =
                      new LinearLayout(this);

              box.setGravity(
                      Gravity.CENTER);

              GradientDrawable bg =
                      new GradientDrawable();

              bg.setColor(
                      Color.argb(
                              145,
                              30,
                              40,
                              52));

              bg.setShape(
                      GradientDrawable.OVAL);

              box.setBackground(bg);

              TextView icon =
                      text(
                              "W",
                              21,
                              Color.WHITE);

              icon.setGravity(
                      Gravity.CENTER);

              icon.setTypeface(
                      Typeface.DEFAULT_BOLD);

              box.addView(
                      icon,
                      new LinearLayout.LayoutParams(
                              -1,
                              -1));

              return box;
          }

          private LinearLayout buildMediaPlaceholder() {

              LinearLayout box =
                      new LinearLayout(this);

              box.setOrientation(
                      LinearLayout.VERTICAL);

              box.setGravity(
                      Gravity.CENTER);

              GradientDrawable bg =
                      new GradientDrawable();

              bg.setColor(
                      Color.argb(
                              135,
                              24,
                              31,
                              39));

              bg.setCornerRadius(
                      dp(16));

              box.setBackground(bg);

              TextView mediaIcon =
                      text(
                              "◀  ▶  ⏸  ▶",
                              15,
                              Color.WHITE);

              mediaIcon.setGravity(
                      Gravity.CENTER);

              box.addView(
                      mediaIcon,
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(40)));

              TextView mediaText =
                      text(
                              "Now playing",
                              8,
                              Color.LTGRAY);

              mediaText.setGravity(
                      Gravity.CENTER);

              mediaText.setMaxLines(1);

              mediaText.setEllipsize(
                      android.text.TextUtils.TruncateAt.END);

              box.addView(
                      mediaText,
                      new LinearLayout.LayoutParams(
                              -1,
                              dp(20)));

              return box;
          }

"""

          text = text.replace(
              marker,
              helpers + marker,
              1
          )

          # --------------------------------------------------
          # Remove old V1 bottom bar call if present.
          # buildMainLayout() must not use the old dock bar.
          # --------------------------------------------------

          if "buildTransparentBottomBar();" in text:
              text = text.replace(
                  "        buildTransparentBottomBar();\n",
                  "",
                  1
              )

          # --------------------------------------------------
          # Safety checks
          # --------------------------------------------------

          required_after = [
              "quickAppTile(",
              "buildWynPlaceholder()",
              "buildMediaPlaceholder()",
              "ApplicationInfo",
              "loadIcon(",
              "ImageView.ScaleType.CENTER_INSIDE",
              'sidebarButton("📱")',
              'sidebarButton("🎤")',
              'sidebarButton("▣")',
              'text("Now playing"',
          ]

          for item in required_after:
              if item not in text:
                  raise SystemExit(
                      "V2 marker missing: " + item
                  )

          if "buildTransparentBottomBar();" in text:
              raise SystemExit(
                  "ERROR: old bottom bar is still called."
              )

          if 'buttonText("APPS")' in text:
              raise SystemExit(
                  "ERROR: old horizontal APPS dock remains."
              )

          if "initial(app.name)" in text:
              raise SystemExit(
                  "ERROR: letter icon logic remains."
              )

          if '"SPEED"' in text:
              raise SystemExit(
                  "ERROR: SPEED card returned."
              )

          if '"WEATHER"' in text:
              raise SystemExit(
                  "ERROR: WEATHER card returned."
              )

          if "CAR ASSISTANT" in text:
              raise SystemExit(
                  "ERROR: old CAR ASSISTANT header returned."
              )

          if 'clock = text(' in text:
              raise SystemExit(
                  "ERROR: old clock UI returned."
              )

          if 'date = text(' in text:
              raise SystemExit(
                  "ERROR: old date UI returned."
              )

          # These must NOT appear as implemented functionality.
          forbidden_logic = [
              "startVoiceAssistant",
              "openVoiceAssistant",
              "getRunningTasks",
              "ActivityManager",
              "MediaSession",
              "MediaController",
              "WynApi",
              "WynClient",
          ]

          for item in forbidden_logic:
              if item in text:
                  raise SystemExit(
                      "ERROR: future feature logic detected: "
                      + item
                  )

          if "private TextView clock;" not in text:
              raise SystemExit(
                  "ERROR: clock declaration disappeared."
              )

          if "private TextView date;" not in text:
              raise SystemExit(
                  "ERROR: date declaration disappeared."
              )

          if text == original:
              raise SystemExit(
                  "ERROR: V2 patch made no changes."
              )

          file.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "Home UI V2 Layout Safe patch applied."
          )
          print(
              "Sidebar: select app + 4 quick apps + voice + running apps."
          )
          print(
              "Bottom center: Wyn placeholder + Media placeholder."
          )
          print(
              "No Voice/Running Apps/Media/Wyn functionality added."
          )
          print(
              "Projection code was not patched."
          )
          PY

          python3 /tmp/patch_home_v2.py

      - name: Verify Home UI V2 Layout
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq \
            "private void buildMainLayout()" \
            "$FILE"

          grep -Fq \
            "quickAppTile(" \
            "$FILE"

          grep -Fq \
            "buildWynPlaceholder()" \
            "$FILE"

          grep -Fq \
            "buildMediaPlaceholder()" \
            "$FILE"

          grep -Fq \
            'sidebarButton("📱")' \
            "$FILE"

          grep -Fq \
            'sidebarButton("🎤")' \
            "$FILE"

          grep -Fq \
            'sidebarButton("▣")' \
            "$FILE"

          grep -Fq \
            "loadIcon(" \
            "$FILE"

          grep -Fq \
            "ImageView.ScaleType.CENTER_INSIDE" \
            "$FILE"

          grep -Fq \
            'text("Now playing"' \
            "$FILE"

          if grep -Fq \
              "buildTransparentBottomBar();" \
              "$FILE"; then
            echo "ERROR: old bottom bar call remains."
            exit 1
          fi

          if grep -Fq \
              'buttonText("APPS")' \
              "$FILE"; then
            echo "ERROR: old horizontal APPS button remains."
            exit 1
          fi

          if grep -Fq \
              "initial(app.name)" \
              "$FILE"; then
            echo "ERROR: letter app icon remains."
            exit 1
          fi

          if grep -Fq \
              '"SPEED"' \
              "$FILE"; then
            echo "ERROR: SPEED card remains."
            exit 1
          fi

          if grep -Fq \
              '"WEATHER"' \
              "$FILE"; then
            echo "ERROR: WEATHER card remains."
            exit 1
          fi

          if grep -Fq \
              "CAR ASSISTANT" \
              "$FILE"; then
            echo "ERROR: old header remains."
            exit 1
          fi

          if grep -Fq \
              'clock = text(' \
              "$FILE"; then
            echo "ERROR: old clock UI remains."
            exit 1
          fi

          if grep -Fq \
              'date = text(' \
              "$FILE"; then
            echo "ERROR: old date UI remains."
            exit 1
          fi

          echo "Home UI V2 Layout verification PASS."

      - name: Verify Core and Persistence isolation
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          sha256sum \
            "$SRC/V10DisplayController.java" \
            "$SRC/V10SurfaceManager.java" \
            "$SRC/V10TaskSession.java" \
            "$SRC/V10ProjectionSession.java" \
            "$SRC/V10SessionStore.java" \
            > /tmp/protected-after.sha256

          diff -u \
            /tmp/protected-before.sha256 \
            /tmp/protected-after.sha256

          if grep -Fq \
              "V10ProjectionService" \
              "$SRC/V10ProjectionSession.java"; then
            echo "ERROR: V10ProjectionService found."
            exit 1
          fi

          if grep -Fq \
              "am force-stop" \
              "$SRC/V10ProjectionSession.java"; then
            echo "ERROR: am force-stop found."
            exit 1
          fi

          echo "Core/Persistence isolation PASS."

      - name: Verify Floating Touch SAFE integrity
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq \
            "floatingTouchKey" \
            "$FILE"

          grep -Fq \
            "createFloatingTouchKey()" \
            "$FILE"

          grep -Fq \
            "floatingDownTime" \
            "$FILE"

          grep -Fq \
            "ViewConfiguration.getLongPressTimeout()" \
            "$FILE"

          grep -Fq \
            'addFloatingMenuButton("BACK"' \
            "$FILE"

          grep -Fq \
            'addFloatingMenuButton("HOME"' \
            "$FILE"

          if grep -Fq \
              "floatingLastTap" \
              "$FILE"; then
            echo "ERROR: old floatingLastTap remains."
            exit 1
          fi

          if grep -Fq \
              'session.recents()' \
              "$FILE"; then
            echo "ERROR: RECENTS logic remains."
            exit 1
          fi

          if grep -Fq \
              '"RECENTS"' \
              "$FILE"; then
            echo "ERROR: RECENTS menu remains."
            exit 1
          fi

          if grep -Fq \
              '"2 SCREEN"' \
              "$FILE"; then
            echo "ERROR: 2 SCREEN remains."
            exit 1
          fi

          if grep -Fq \
              '"3 SCREEN"' \
              "$FILE"; then
            echo "ERROR: 3 SCREEN remains."
            exit 1
          fi

          echo "Floating Touch SAFE integrity PASS."

      - name: Compile Java
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            compileDebugJavaWithJavac

      - name: Assemble APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Locate APK and SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find v10-source \
              -type f \
              -path '*/build/outputs/apk/*/*.apk' \
              -print \
              -quit
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          cp \
            "$APK" \
            CarAssistant-V10-Display-Core-V1-Home-UI-V2-Layout-Safe.apk

          SHA="$(
            sha256sum \
              CarAssistant-V10-Display-Core-V1-Home-UI-V2-Layout-Safe.apk \
              | awk '{print $1}'
          )"

          printf '%s\n' "$SHA" \
            > CarAssistant-V10-Display-Core-V1-Home-UI-V2-Layout-Safe.sha256

          echo "APK:"
          echo "CarAssistant-V10-Display-Core-V1-Home-UI-V2-Layout-Safe.apk"

          echo "SHA256:"
          echo "$SHA"

      - name: Create V2 Layout manifest
        shell: bash
        run: |
          set -euo pipefail

          cat > Home-UI-V2-LAYOUT-SAFE-MANIFEST.txt <<'EOF'
          CarAssistant V10
          Display Core V1
          Home UI V2 Layout Safe

          BASELINE
          V10-6A:
          9075636a7d5947c1b0eee49c2bd3fd0e1b6b0cf1

          HOME UI V2
          Left vertical sidebar.
          Select app to project.
          Four quick-app slots.
          Voice placeholder.
          Running-apps placeholder.

          BOTTOM CENTER
          Wyn visual placeholder.
          Media visual placeholder.
          Now playing text placeholder.

          QUICK APPS
          First four available applications are shown.
          User customization is intentionally not implemented.

          REAL ICONS
          ApplicationInfo.loadIcon().
          Real Android application icons preserved.

          NOT IMPLEMENTED
          No Voice assistant functionality.
          No running-app/task manager functionality.
          No MediaSession functionality.
          No real media controls.
          No Wyn API.
          No Wyn traffic data.

          PROTECTED
          V10DisplayController unchanged.
          V10SurfaceManager unchanged.
          V10TaskSession unchanged.
          V10ProjectionSession unchanged.
          V10SessionStore unchanged.

          FLOATING TOUCH
          Stable Freeze Floating Touch preserved.
          SAFE Long Press preserved.

          NOT ADDED
          No RECENTS.
          No 2 SCREEN.
          No 3 SCREEN.
          No V10ProjectionService.
          No am force-stop.

          PURPOSE
          Layout-only Home UI V2.
          Projection engine remains unchanged.
          Core and Persistence remain isolated.
          EOF

      - name: Upload V2 Layout APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Display-Core-V1-Home-UI-V2-Layout-Safe
          path: |
            CarAssistant-V10-Display-Core-V1-Home-UI-V2-Layout-Safe.apk
            CarAssistant-V10-Display-Core-V1-Home-UI-V2-Layout-Safe.sha256
            Home-UI-V2-LAYOUT-SAFE-MANIFEST.txt
          if-no-files-found: error
          retention-days: 14
