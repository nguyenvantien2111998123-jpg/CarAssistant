name: Build V10 Display Core V1 - Home UI V2 Layout Safe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-home-ui-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact Foundation V1
        uses: actions/checkout@v4
        with:
          ref: 7292b0569359a2fe6f7c3829561b6f65664fbd2e
          fetch-depth: 1

      - name: Verify exact Foundation V1 commit
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="7292b0569359a2fe6f7c3829561b6f65664fbd2e"
          ACTUAL="$(git rev-parse HEAD)"

          test "$ACTUAL" = "$EXPECTED"

          echo "Foundation V1 commit: PASS"
          echo "HEAD=$ACTUAL"

      - name: Verify Foundation V1 architecture
        shell: bash
        run: |
          set -euo pipefail

          test -f "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          test -f "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
          test -f "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java"
          test -f "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java"
          test -f "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java"

          if test -f "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java"; then
            echo "ERROR: V10ProjectionService.java must not exist"
            exit 1
          fi

          echo "Foundation V1 architecture: PASS"

      - name: Snapshot protected Foundation files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p foundation-protected

          cd v10-source

          sha256sum \
            app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java \
            > ../foundation-protected/hashes-before.txt

          cp \
            app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java \
            ../foundation-protected/V10CarActivity.before.java

          cd ..

          echo "Protected Foundation snapshot: PASS"

      - name: Replace Home UI with V2 and add real app icons
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          source = path.read_text(encoding="utf-8")

          required = [
              "class V10CarActivity",
              "private void buildDashboard()",
              "private void buildAppPanel()",
              "private void loadApps()",
              "private void rebuildDock()",
              "private LinearLayout appTile(",
              "private void attachProjection()",
              "private void launchProjection(",
              "private void returnToLauncher()",
              "private void showApps()",
              "private void hideApps()",
              "private void createFloatingTouchKey()",
              "public void handleControlBack()",
              "public void handleControlHome()",
              "public void handleControlRecents()",
              "public void handleControlApps()",
              "private static final class AppInfo"
          ]

          for item in required:
              if item not in source:
                  raise SystemExit("Missing expected Foundation V1 source marker: " + item)

          if "private void buildHomeUiV2()" in source:
              raise SystemExit("Home UI V2 already appears to be present")

          # ------------------------------------------------------------
          # Add imports needed for real ApplicationInfo icons and ImageView.
          # ------------------------------------------------------------

          source = source.replace(
              "import android.content.pm.ResolveInfo;\n",
              "import android.content.pm.ResolveInfo;\n"
              "import android.content.pm.ApplicationInfo;\n"
              "import android.content.pm.PackageManager;\n"
          )

          source = source.replace(
              "import android.graphics.drawable.GradientDrawable;\n",
              "import android.graphics.drawable.GradientDrawable;\n"
              "import android.graphics.drawable.Drawable;\n"
          )

          source = source.replace(
              "import android.widget.GridLayout;\n",
              "import android.widget.GridLayout;\n"
              "import android.widget.ImageView;\n"
          )

          # ------------------------------------------------------------
          # Replace buildUi().
          # ------------------------------------------------------------

