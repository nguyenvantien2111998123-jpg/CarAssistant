name: Build V10 Display Core V1 - Home UI V2 Layout Safe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-home-ui-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact Foundation V1
        uses: actions/checkout@v4
        with:
          ref: 12591049e68259ce5ff40c69974117a2b89a4623
          fetch-depth: 0

      - name: Verify exact Foundation V1
        shell: bash
        run: |
          set -e

          test -f app/src/main/java/*/*/*/V10CarActivity.java 2>/dev/null || true

          FILE="$(find app -name V10CarActivity.java -type f | head -n 1)"

          if [ -z "$FILE" ]; then
            echo "ERROR: V10CarActivity.java not found"
            exit 1
          fi

          echo "V10CarActivity: $FILE"

          SHA="$(sha256sum "$FILE" | awk '{print $1}')"
          echo "SHA256=$SHA"

          test "$SHA" = "d26c2d2f67bd801d9835071ed5c0afe323dd2fa9"

      - name: Verify Foundation V1 structure
        shell: bash
        run: |
          set -e

          FILE="$(find app -name V10CarActivity.java -type f | head -n 1)"

          grep -q "private void buildUi()" "$FILE"
          grep -q "private void buildDashboard()" "$FILE"
          grep -q "private void buildAppPanel()" "$FILE"
          grep -q "private void rebuildAppGrid" "$FILE"
          grep -q "private void loadApps()" "$FILE"
          grep -q "private void rebuildDock()" "$FILE"
          grep -q "private void attachProjection()" "$FILE"
          grep -q "private void launchProjection" "$FILE"
          grep -q "private void returnToLauncher()" "$FILE"
          grep -q "private void showApps()" "$FILE"
          grep -q "private void hideApps()" "$FILE"
          grep -q "private void createFloatingTouchKey()" "$FILE"
          grep -q "private void handleControlBack()" "$FILE"
          grep -q "private void handleControlHome()" "$FILE"
          grep -q "private void handleControlRecents()" "$FILE"
          grep -q "private void handleControlApps()" "$FILE"

          test ! -f "$(find app -name V10ProjectionService.java -type f | head -n 1)"

      - name: Save protected source hashes
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/carassistant-protected

          for name in \
            V10ProjectionSession.java \
            V10DisplayController.java \
            V10SurfaceManager.java \
            V10TaskSession.java
          do
            FILE="$(find app -name "$name" -type f | head -n 1)"

            if [ -z "$FILE" ]; then
              echo "ERROR: protected file missing: $name"
              exit 1
            fi

            sha256sum "$FILE" > "/tmp/carassistant-protected/$name.sha"
            echo "$name -> $FILE"
          done

      - name: Prepare safe patch directory
        shell: bash
        run: |
          set -e
          rm -rf /tmp/carassistant-home-v2
          mkdir -p /tmp/carassistant-home-v2

      - name: Patch imports safely
        shell: bash
        run: |
          set -e

          FILE="$(find app -name V10CarActivity.java -type f | head -n 1)"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          additions = [
              "import android.content.pm.ApplicationInfo;",
              "import android.content.pm.PackageManager;",
              "import android.graphics.drawable.Drawable;",
              "import android.widget.ImageView;",
              "import android.widget.Space;"
          ]

          lines = s.splitlines()

          for item in additions:
              if item not in lines:
                  pos = 0
                  while pos < len(lines) and lines[pos].startswith("package "):
                      pos += 1
                  lines.insert(pos + 1, item)

          p.write_text("\n".join(lines) + "\n")
          PY

      - name: Add quick apps field
        shell: bash
        run: |
          set -e

          FILE="$(find app -name V10CarActivity.java -type f | head -n 1)"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          marker = "public class V10CarActivity"

          if "private LinearLayout quickAppsContainer;" not in s:
              i = s.index(marker)
              j = s.index("{", i) + 1
              s = s[:j] + "\n\n    private LinearLayout quickAppsContainer;\n" + s[j:]

          p.write_text(s)
          PY

      - name: Replace dashboard only
        shell: bash
        run: |
          set -e

          FILE="$(find app -name V10CarActivity.java -type f | head -n 1)"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          start = s.index("    private void buildDashboard()")
          end = s.index("    private void buildAppPanel()", start)

          new_method = r'''    private void buildDashboard() {
          LinearLayout root = new LinearLayout(this);
          root.setOrientation(LinearLayout.VERTICAL);
          root.setBackgroundColor(Color.rgb(18, 18, 18));
          root.setPadding(18, 18, 18, 18);

          LinearLayout content = new LinearLayout(this);
          content.setOrientation(LinearLayout.HORIZONTAL);
          content.setGravity(Gravity.CENTER_VERTICAL);

          LinearLayout sidebar = new LinearLayout(this);
          sidebar.setOrientation(LinearLayout.VERTICAL);
          sidebar.setGravity(Gravity.TOP | Gravity.CENTER_HORIZONTAL);
          sidebar.setPadding(8, 8, 8, 8);
          sidebar.setBackgroundColor(Color.rgb(28, 28, 28));

          sidebar.addView(
              sidebarButton("CHỌN APP"),
              new LinearLayout.LayoutParams(
                  150,
                  72
              )
          );

          sidebar.addView(
              sidebarButton("VOICE"),
              new LinearLayout.LayoutParams(
                  150,
                  64
              )
          );

          sidebar.addView(
              sidebarButton("TASKS"),
              new LinearLayout.LayoutParams(
                  150,
                  64
              )
          );

          content.addView(
              sidebar,
              new LinearLayout.LayoutParams(
                  166,
                  -1
              )
          );

          LinearLayout center = new LinearLayout(this);
          center.setOrientation(LinearLayout.VERTICAL);
          center.setPadding(18, 8, 18, 8);

          quickAppsContainer = new LinearLayout(this);
          quickAppsContainer.setOrientation(LinearLayout.HORIZONTAL);
          quickAppsContainer.setGravity(Gravity.CENTER_VERTICAL);

          center.addView(
              quickAppsContainer,
              new LinearLayout.LayoutParams(
                  -1,
                  112
              )
          );

          Space topSpace = new Space(this);
          center.addView(
              topSpace,
              new LinearLayout.LayoutParams(
                  1,
                  0,
                  1f
              )
          );

          LinearLayout bottom = new LinearLayout(this);
          bottom.setOrientation(LinearLayout.HORIZONTAL);
          bottom.setGravity(Gravity.CENTER_VERTICAL);

          TextView w = circleButton("W");
          bottom.addView(
              w,
              new LinearLayout.LayoutParams(
                  78,
                  78
              )
          );

          TextView media = circleButton("MEDIA");
          LinearLayout.LayoutParams mediaLp =
              new LinearLayout.LayoutParams(130, 78);
          mediaLp.setMargins(18, 0, 0, 0);
          bottom.addView(media, mediaLp);

          TextView mediaText = new TextView(this);
          mediaText.setText("  ‹   ▶   ›   ");
          mediaText.setTextColor(Color.WHITE);
          mediaText.setTextSize(22);
          mediaText.setGravity(Gravity.CENTER);

          LinearLayout.LayoutParams controlsLp =
              new LinearLayout.LayoutParams(
                  170,
                  78
              );
          controlsLp.setMargins(12, 0, 0, 0);
          bottom.addView(mediaText, controlsLp);

          TextView nowPlaying = new TextView(this);
          nowPlaying.setText("Nội dung đang phát");
          nowPlaying.setTextColor(Color.LTGRAY);
          nowPlaying.setTextSize(15);
          nowPlaying.setGravity(Gravity.CENTER_VERTICAL);

          LinearLayout.LayoutParams nowLp =
              new LinearLayout.LayoutParams(
                  0,
                  78,
                  1f
              );
          nowLp.setMargins(18, 0, 0, 0);
          bottom.addView(nowPlaying, nowLp);

          center.addView(
              bottom,
              new LinearLayout.LayoutParams(
                  -1,
                  90
              )
          );

          content.addView(
              center,
              new LinearLayout.LayoutParams(
                  0,
                  -1,
                  1f
              )
          );

          root.addView(
              content,
              new LinearLayout.LayoutParams(
                  -1,
                  0,
                  1f
              )
          );

          setContentView(root);

          rebuildQuickApps();
      }

      private void rebuildQuickApps() {
          if (quickAppsContainer == null) {
              return;
          }

          quickAppsContainer.removeAllViews();

          for (AppInfo app : getQuickApps()) {
              quickAppsContainer.addView(
                  quickAppTile(app),
                  new LinearLayout.LayoutParams(
                      92,
                      104
                  )
              );
          }
      }

      private java.util.List<AppInfo> getQuickApps() {
          java.util.List<AppInfo> result = new java.util.ArrayList<>();

          String[] preferred = new String[] {
              "com.google.android.apps.maps",
              "com.google.android.youtube",
              "com.zing.zalo",
              "com.spotify.music"
          };

          for (String pkg : preferred) {
              for (AppInfo app : apps) {
                  if (pkg.equals(app.packageName)) {
                      result.add(app);
                      break;
                  }
              }
          }

          if (result.size() < 4) {
              for (AppInfo app : apps) {
                  if (result.size() >= 4) {
                      break;
                  }

                  boolean exists = false;

                  for (AppInfo selected : result) {
                      if (selected.packageName.equals(app.packageName)) {
                          exists = true;
                          break;
                      }
                  }

                  if (!exists) {
                      result.add(app);
                  }
              }
          }

          return result;
      }

      private TextView quickAppTile(AppInfo app) {
          LinearLayout box = new LinearLayout(this);
          box.setOrientation(LinearLayout.VERTICAL);
          box.setGravity(Gravity.CENTER);
          box.setPadding(6, 6, 6, 6);
          box.setBackgroundColor(Color.rgb(38, 38, 38));

          ImageView icon = new ImageView(this);
          Drawable drawable = getRealAppIcon(app);

          if (drawable != null) {
              icon.setImageDrawable(drawable);
          }

          box.addView(
              icon,
              new LinearLayout.LayoutParams(
                  54,
                  54
              )
          );

          TextView name = new TextView(this);
          name.setText(app.label);
          name.setTextColor(Color.WHITE);
          name.setTextSize(11);
          name.setGravity(Gravity.CENTER);
          name.setSingleLine(true);

          box.addView(
              name,
              new LinearLayout.LayoutParams(
                  -1,
                  32
              )
          );

          box.setOnClickListener(v -> launchProjection(app));

          TextView wrapper = new TextView(this);
          wrapper.setText("");
          wrapper.setBackground(box.getBackground());
          wrapper.setOnClickListener(v -> launchProjection(app));

          wrapper.setTag(box);

          return wrapper;
      }

      private TextView sidebarButton(String value) {
          TextView button = new TextView(this);
          button.setText(value);
          button.setTextColor(Color.WHITE);
          button.setTextSize(14);
          button.setGravity(Gravity.CENTER);
          button.setPadding(8, 8, 8, 8);
          button.setBackgroundColor(Color.rgb(45, 45, 45));
          return button;
      }

      private TextView circleButton(String value) {
          TextView button = new TextView(this);
          button.setText(value);
          button.setTextColor(Color.WHITE);
          button.setTextSize(16);
          button.setGravity(Gravity.CENTER);
          button.setBackgroundColor(Color.rgb(45, 45, 45));
          return button;
      }

      private Drawable getRealAppIcon(AppInfo app) {
          try {
              PackageManager pm = getPackageManager();
              ApplicationInfo info =
                  pm.getApplicationInfo(
                      app.packageName,
                      PackageManager.GET_META_DATA
                  );
              return info.loadIcon(pm);
          } catch (Exception e) {
              return null;
          }
      }

'''

          s = s[:start] + new_method + s[end:]
          p.write_text(s)
          PY

      - name: Connect Home UI to existing app loader
        shell: bash
        run: |
          set -e

          FILE="$(find app -name V10CarActivity.java -type f | head -n 1)"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          old = "loadApps();\n        rebuildDock();"

          if old in s:
              s = s.replace(
                  old,
                  "loadApps();\n        rebuildDock();\n        rebuildQuickApps();",
                  1
              )
          elif "rebuildQuickApps();" not in s:
              raise SystemExit("ERROR: existing loadApps/rebuildDock hook not found")

          p.write_text(s)
          PY

      - name: Verify Home UI V2 source
        shell: bash
        run: |
          set -e

          FILE="$(find app -name V10CarActivity.java -type f | head -n 1)"

          grep -q "quickAppsContainer" "$FILE"
          grep -q "rebuildQuickApps" "$FILE"
          grep -q "getQuickApps" "$FILE"
          grep -q "quickAppTile" "$FILE"
          grep -q "sidebarButton" "$FILE"
          grep -q "circleButton" "$FILE"
          grep -q "getRealAppIcon" "$FILE"
          grep -q "ApplicationInfo" "$FILE"
          grep -q "PackageManager" "$FILE"
          grep -q "Drawable" "$FILE"
          grep -q "ImageView" "$FILE"
          grep -q "com.google.android.apps.maps" "$FILE"
          grep -q "com.google.android.youtube" "$FILE"
          grep -q "com.zing.zalo" "$FILE"
          grep -q "com.spotify.music" "$FILE"
          grep -q "Nội dung đang phát" "$FILE"

      - name: Verify old dashboard markers are gone
        shell: bash
        run: |
          set -e

          FILE="$(find app -name V10CarActivity.java -type f | head -n 1)"

          ! grep -q '"CAR ASSISTANT"' "$FILE"
          ! grep -q '"MAP"' "$FILE"
          ! grep -q '"SPEED"' "$FILE"
          ! grep -q '"WEATHER"' "$FILE"
          ! grep -q '"No media"' "$FILE"

      - name: Verify projection architecture untouched
        shell: bash
        run: |
          set -e

          FILE="$(find app -name V10CarActivity.java -type f | head -n 1)"

          grep -q "attachProjection()" "$FILE"
          grep -q "launchProjection" "$FILE"
          grep -q "returnToLauncher" "$FILE"
          grep -q "createFloatingTouchKey" "$FILE"
          grep -q "handleControlBack" "$FILE"
          grep -q "handleControlHome" "$FILE"
          grep -q "handleControlRecents" "$FILE"

          for name in \
            V10ProjectionSession.java \
            V10DisplayController.java \
            V10SurfaceManager.java \
            V10TaskSession.java
          do
            FILE2="$(find app -name "$name" -type f | head -n 1)"
            OLD="/tmp/carassistant-protected/$name.sha"
            NOW="$(sha256sum "$FILE2")"

            test "$NOW" = "$(cat "$OLD")"
          done

          test -z "$(find app -name V10ProjectionService.java -type f -print -quit)"

      - name: Verify only intended source changed
        shell: bash
        run: |
          set -e

          FILE="$(find app -name V10CarActivity.java -type f | head -n 1)"

          git status --short

          CHANGED="$(git status --short | awk '{print $2}' | grep -v '^app/src/main/java/.*/V10CarActivity.java$' || true)"

          if [ -n "$CHANGED" ]; then
            echo "Unexpected changed files:"
            echo "$CHANGED"
            exit 1
          fi

      - name: Git diff check
        shell: bash
        run: |
          set -e
          git diff --check

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant Gradle permission
        shell: bash
        run: |
          set -e
          chmod +x ./gradlew

      - name: Compile
        shell: bash
        run: |
          set -e
          ./gradlew compileDebugJavaWithJavac --stacktrace

      - name: Assemble APK
        shell: bash
        run: |
          set -e
          ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -e

          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK=$APK"

          cp "$APK" "CarAssistant-V10-Home-UI-V2.apk"

          sha256sum "CarAssistant-V10-Home-UI-V2.apk" \
            | tee "CarAssistant-V10-Home-UI-V2.apk.sha256"

      - name: Final safety gate
        shell: bash
        run: |
          set -e

          FILE="$(find app -name V10CarActivity.java -type f | head -n 1)"

          grep -q "rebuildQuickApps" "$FILE"
          grep -q "getRealAppIcon" "$FILE"

          for name in \
            V10ProjectionSession.java \
            V10DisplayController.java \
            V10SurfaceManager.java \
            V10TaskSession.java
          do
            FILE2="$(find app -name "$name" -type f | head -n 1)"
            test "$(sha256sum "$FILE2")" = "$(cat "/tmp/carassistant-protected/$name.sha")"
          done

          test ! -f "$(find app -name V10ProjectionService.java -type f | head -n 1)"

          test -s "CarAssistant-V10-Home-UI-V2.apk"

          echo "======================================"
          echo "HOME UI V2 SAFE BUILD: PASS"
          echo "BASELINE: 12591049e68259ce5ff40c69974117a2b89a4623"
          echo "======================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Home-UI-V2
          path: |
            CarAssistant-V10-Home-UI-V2.apk
            CarAssistant-V10-Home-UI-V2.apk.sha256
          if-no-files-found: error
