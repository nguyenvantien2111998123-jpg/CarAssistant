      # 23. UPLOAD APK
      # ============================================================

      - name: Upload Home UI V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Home-UI-V2
          path: |
            /tmp/carassistant-home-ui-v2/CarAssistant-V10-Home-UI-V2.apk
            /tmp/carassistant-home-ui-v2/SHA256SUM.txt
