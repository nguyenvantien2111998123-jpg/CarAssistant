name: Build V10 Display Core V1 - Home UI V2 Layout Safe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-home-ui-v2:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT EXACT LOCKED BASELINE
      # ============================================================

      - name: Checkout Exact Baseline
        uses: actions/checkout@v4
        with:
          ref: 12591049e68259ce5ff40c69974117a2b89a4623
          fetch-depth: 1

      # ============================================================
      # 2. VERIFY EXACT BASELINE
      # ============================================================

      - name: Verify Exact Baseline
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_COMMIT="12591049e68259ce5ff40c69974117a2b89a4623"
          ACTUAL_COMMIT="$(git rev-parse HEAD)"

          echo "Expected commit:"
          echo "$EXPECTED_COMMIT"

          echo "Actual commit:"
          echo "$ACTUAL_COMMIT"

          test "$ACTUAL_COMMIT" = "$EXPECTED_COMMIT"

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          EXPECTED_SHA="d26c2d2f67bd801d9835071ed5c0afe323dd2fa9"
          ACTUAL_SHA="$(git hash-object "$FILE")"

          echo "Expected baseline V10CarActivity SHA:"
          echo "$EXPECTED_SHA"

          echo "Actual baseline V10CarActivity SHA:"
          echo "$ACTUAL_SHA"

          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

          echo "Exact baseline: PASS"

      # ============================================================
      # 3. SAVE BASELINE PROTECTED SHAS
      # ============================================================

      - name: Save Protected Baseline SHAs
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test "$(git hash-object "$BASE/V10ProjectionSession.java")" \
            = "27a9ff439fb450750d49f35a546eab3bc2745b4d"

          test "$(git hash-object "$BASE/V10DisplayController.java")" \
            = "1a35bcaa7db0a5f892e56006f740b4ebf727be8a"

          test "$(git hash-object "$BASE/V10SurfaceManager.java")" \
            = "e3f2a8b74ded29f21e04a95c661672db51d01d1c"

          test "$(git hash-object "$BASE/V10TaskSession.java")" \
            = "fce2f5cf06c5bd10782a87397aace8676493b6b7"

          if [ -f "$BASE/V10ProjectionService.java" ]; then
            echo "ERROR: unexpected V10ProjectionService.java"
            exit 1
          fi

          echo "Protected baseline architecture: PASS"

      # ============================================================
      # 4. CREATE SAFE PATCH FILES
      #
      # No long Base64.
      # No long Python heredoc.
      # Each generated patch file is made from small printf lines.
      # ============================================================

      - name: Create Home UI V2 Patch Files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/carassistant-home-v2
          mkdir -p /tmp/carassistant-home-v2

          printf '%s\n' \
          '    private void buildDashboard() {' \
          '' \
          '        dashboard = new LinearLayout(this);' \
          '        dashboard.setOrientation(LinearLayout.HORIZONTAL);' \
          '        dashboard.setBackgroundColor(Color.rgb(7, 9, 12));' \
          '' \
          '        launcherLayer.addView(' \
          '                dashboard,' \
          '                new LinearLayout.LayoutParams(-1, -1));' \
          '' \
          '        LinearLayout sidebar = new LinearLayout(this);' \
          '        sidebar.setOrientation(LinearLayout.VERTICAL);' \
          '        sidebar.setGravity(Gravity.TOP | Gravity.CENTER_HORIZONTAL);' \
          '        sidebar.setPadding(dp(5), dp(5), dp(5), dp(5));' \
          '' \
          '        GradientDrawable sidebarBg = new GradientDrawable();' \
          '        sidebarBg.setColor(Color.rgb(15, 19, 24));' \
          '        sidebarBg.setCornerRadius(dp(18));' \
          '        sidebar.setBackground(sidebarBg);' \
          '' \
          '        dashboard.addView(' \
          '                sidebar,' \
          '                new LinearLayout.LayoutParams(dp(92), -1));' \
          '' \
          '        TextView selectApp = sidebarButton("CHỌN APP");' \
          '        selectApp.setOnClickListener(v -> showApps());' \
          '        sidebar.addView(selectApp,' \
          '                new LinearLayout.LayoutParams(-1, dp(58)));' \
          '' \
          '        quickAppsContainer = new LinearLayout(this);' \
          '        quickAppsContainer.setOrientation(LinearLayout.VERTICAL);' \
          '        quickAppsContainer.setGravity(Gravity.TOP | Gravity.CENTER_HORIZONTAL);' \
          '        sidebar.addView(quickAppsContainer,' \
          '                new LinearLayout.LayoutParams(-1, 0, 1f));' \
          '' \
          '        TextView voice = sidebarButton("🎙\nVOICE");' \
          '        voice.setContentDescription("Voice placeholder");' \
          '        sidebar.addView(voice,' \
          '                new LinearLayout.LayoutParams(-1, dp(58)));' \
          '' \
          '        TextView tasks = sidebarButton("◉\nTASKS");' \
          '        tasks.setContentDescription("Running Apps placeholder");' \
          '        sidebar.addView(tasks,' \
          '                new LinearLayout.LayoutParams(-1, dp(58)));' \
          '' \
          '        LinearLayout main = new LinearLayout(this);' \
          '        main.setOrientation(LinearLayout.VERTICAL);' \
          '        main.setPadding(dp(8), dp(5), dp(5), dp(5));' \
          '' \
          '        dashboard.addView(main,' \
          '                new LinearLayout.LayoutParams(0, -1, 1f));' \
          '' \
          '        Space empty = new Space(this);' \
          '        main.addView(empty,' \
          '                new LinearLayout.LayoutParams(-1, 0, 1f));' \
          '' \
          '        LinearLayout bottom = new LinearLayout(this);' \
          '        bottom.setOrientation(LinearLayout.HORIZONTAL);' \
          '        bottom.setGravity(Gravity.CENTER_VERTICAL | Gravity.CENTER_HORIZONTAL);' \
          '        bottom.setPadding(dp(8), dp(4), dp(8), dp(4));' \
          '' \
          '        TextView wyn = circleButton("W");' \
          '        wyn.setContentDescription("WYN placeholder");' \
          '        bottom.addView(wyn,' \
          '                new LinearLayout.LayoutParams(dp(66), dp(66)));' \
          '' \
          '        LinearLayout media = new LinearLayout(this);' \
          '        media.setOrientation(LinearLayout.VERTICAL);' \
          '        media.setGravity(Gravity.CENTER_VERTICAL);' \
          '        media.setPadding(dp(16), dp(7), dp(16), dp(7));' \
          '' \
          '        GradientDrawable mediaBg = new GradientDrawable();' \
          '        mediaBg.setColor(Color.rgb(22, 27, 33));' \
          '        mediaBg.setCornerRadius(dp(18));' \
          '        media.setBackground(mediaBg);' \
          '' \
          '        TextView mediaTitle = text("MEDIA", 13, Color.WHITE);' \
          '        mediaTitle.setTypeface(Typeface.DEFAULT, Typeface.BOLD);' \
          '        media.addView(mediaTitle,' \
          '                new LinearLayout.LayoutParams(-1, dp(22)));' \
          '' \
          '        TextView mediaControls = text("◀    ▶    ⏸    ▶", 15, Color.WHITE);' \
          '        mediaControls.setGravity(Gravity.CENTER);' \
          '        media.addView(mediaControls,' \
          '                new LinearLayout.LayoutParams(-1, dp(28)));' \
          '' \
          '        TextView mediaNow = text("Nội dung đang phát", 10, Color.LTGRAY);' \
          '        mediaNow.setGravity(Gravity.CENTER_VERTICAL);' \
          '        media.addView(mediaNow,' \
          '                new LinearLayout.LayoutParams(-1, dp(20)));' \
          '' \
          '        LinearLayout.LayoutParams mediaParams =' \
          '                new LinearLayout.LayoutParams(dp(330), dp(76));' \
          '        mediaParams.setMargins(dp(10), 0, dp(10), 0);' \
          '        bottom.addView(media, mediaParams);' \
          '' \
          '        main.addView(bottom,' \
          '                new LinearLayout.LayoutParams(-1, dp(88)));' \
          '    }' \
          > /tmp/carassistant-home-v2/dashboard.txt

          printf '%s\n' \
          '    private LinearLayout quickAppsContainer;' \
          > /tmp/carassistant-home-v2/field.txt

          printf '%s\n' \
          '    private void rebuildQuickApps() {' \
          '' \
          '        if (quickAppsContainer == null) {' \
          '            return;' \
          '        }' \
          '' \
          '        quickAppsContainer.removeAllViews();' \
          '' \
          '        ArrayList<AppInfo> quickApps = getQuickApps();' \
          '' \
          '        for (int i = 0; i < quickApps.size() && i < 4; i++) {' \
          '' \
          '            final AppInfo app = quickApps.get(i);' \
          '            LinearLayout tile = quickAppTile(app);' \
          '' \
          '            quickAppsContainer.addView(' \
          '                    tile,' \
          '                    new LinearLayout.LayoutParams(-1, dp(67)));' \
          '        }' \
          '    }' \
          '' \
          '    private ArrayList<AppInfo> getQuickApps() {' \
          '' \
          '        ArrayList<AppInfo> quickApps = new ArrayList<>();' \
          '' \
          '        String[] preferred = new String[] {' \
          '                "com.google.android.apps.maps",' \
          '                "com.google.android.youtube",' \
          '                "com.zing.zalo",' \
          '                "com.spotify.music"' \
          '        };' \
          '' \
          '        for (String packageName : preferred) {' \
          '            for (AppInfo app : apps) {' \
          '                if (packageName.equals(' \
          '                        app.component.getPackageName())) {' \
          '                    if (!quickApps.contains(app)) {' \
          '                        quickApps.add(app);' \
          '                    }' \
          '                    break;' \
          '                }' \
          '            }' \
          '        }' \
          '' \
          '        for (AppInfo app : apps) {' \
          '            if (quickApps.size() >= 4) {' \
          '                break;' \
          '            }' \
          '            if (!quickApps.contains(app)) {' \
          '                quickApps.add(app);' \
          '            }' \
          '        }' \
          '' \
          '        return quickApps;' \
          '    }' \
          '' \
          '    private LinearLayout quickAppTile(AppInfo app) {' \
          '' \
          '        LinearLayout tile = new LinearLayout(this);' \
          '        tile.setOrientation(LinearLayout.VERTICAL);' \
          '        tile.setGravity(Gravity.CENTER);' \
          '        tile.setPadding(dp(2), dp(2), dp(2), dp(2));' \
          '' \
          '        Drawable drawable = getRealAppIcon(app);' \
          '' \
          '        if (drawable != null) {' \
          '            ImageView icon = new ImageView(this);' \
          '            icon.setImageDrawable(drawable);' \
          '            icon.setScaleType(ImageView.ScaleType.CENTER_INSIDE);' \
          '            tile.addView(icon,' \
          '                    new LinearLayout.LayoutParams(-1, dp(40)));' \
          '        } else {' \
          '            TextView icon = text(initial(app.name), 20, Color.WHITE);' \
          '            icon.setGravity(Gravity.CENTER);' \
          '            tile.addView(icon,' \
          '                    new LinearLayout.LayoutParams(-1, dp(40)));' \
          '        }' \
          '' \
          '        TextView label = text(app.name, 8, Color.WHITE);' \
          '        label.setGravity(Gravity.CENTER);' \
          '        label.setSingleLine(true);' \
          '        label.setEllipsize(android.text.TextUtils.TruncateAt.END);' \
          '        tile.addView(label,' \
          '                new LinearLayout.LayoutParams(-1, dp(20)));' \
          '' \
          '        tile.setOnClickListener(' \
          '                v -> launchProjection(app.component));' \
          '' \
          '        return tile;' \
          '    }' \
          '' \
          '    private TextView sidebarButton(String value) {' \
          '' \
          '        TextView view = text(value, 10, Color.WHITE);' \
          '        view.setGravity(Gravity.CENTER);' \
          '        view.setMaxLines(2);' \
          '        view.setTypeface(Typeface.DEFAULT, Typeface.BOLD);' \
          '' \
          '        GradientDrawable bg = new GradientDrawable();' \
          '        bg.setColor(Color.rgb(29, 35, 42));' \
          '        bg.setCornerRadius(dp(14));' \
          '        view.setBackground(bg);' \
          '' \
          '        return view;' \
          '    }' \
          '' \
          '    private TextView circleButton(String value) {' \
          '' \
          '        TextView view = text(value, 23, Color.WHITE);' \
          '        view.setGravity(Gravity.CENTER);' \
          '' \
          '        GradientDrawable bg = new GradientDrawable();' \
          '        bg.setShape(GradientDrawable.OVAL);' \
          '        bg.setColor(Color.rgb(29, 35, 42));' \
          '        bg.setStroke(dp(1), Color.rgb(65, 85, 105));' \
          '        view.setBackground(bg);' \
          '' \
          '        return view;' \
          '    }' \
          '' \
          '    private Drawable getRealAppIcon(AppInfo app) {' \
          '' \
          '        try {' \
          '            PackageManager pm = getPackageManager();' \
          '            ApplicationInfo info = pm.getApplicationInfo(' \
          '                    app.component.getPackageName(), 0);' \
          '            return info.loadIcon(pm);' \
          '        } catch (RuntimeException ignored) {' \
          '            return null;' \
          '        }' \
          '    }' \
          > /tmp/carassistant-home-v2/helpers.txt

          printf '%s\n' \
          '    private LinearLayout appTile(AppInfo app) {' \
          '' \
          '        LinearLayout tile = new LinearLayout(this);' \
          '        tile.setOrientation(LinearLayout.VERTICAL);' \
          '        tile.setGravity(Gravity.CENTER);' \
          '' \
          '        GradientDrawable bg = new GradientDrawable();' \
          '        bg.setColor(Color.rgb(22, 27, 33));' \
          '        bg.setCornerRadius(dp(16));' \
          '        tile.setBackground(bg);' \
          '' \
          '        Drawable drawable = getRealAppIcon(app);' \
          '' \
          '        if (drawable != null) {' \
          '            ImageView icon = new ImageView(this);' \
          '            icon.setImageDrawable(drawable);' \
          '            icon.setScaleType(ImageView.ScaleType.CENTER_INSIDE);' \
          '            tile.addView(icon,' \
          '                    new LinearLayout.LayoutParams(-1, dp(58)));' \
          '        } else {' \
          '            TextView icon = text(initial(app.name), 27, Color.WHITE);' \
          '            icon.setGravity(Gravity.CENTER);' \
          '            tile.addView(icon,' \
          '                    new LinearLayout.LayoutParams(-1, dp(58)));' \
          '        }' \
          '' \
          '        TextView name = text(app.name, 12, Color.WHITE);' \
          '        name.setGravity(Gravity.CENTER);' \
          '        name.setMaxLines(2);' \
          '' \
          '        tile.addView(name,' \
          '                new LinearLayout.LayoutParams(-1, dp(42)));' \
          '' \
          '        tile.setOnClickListener(v -> {' \
          '            hideApps();' \
          '            launchProjection(app.component);' \
          '        });' \
          '' \
          '        return tile;' \
          '    }' \
          > /tmp/carassistant-home-v2/apptile.txt

          echo "Patch files created: PASS"

      # ============================================================
      # 5. APPLY IMPORT PATCH
      # ============================================================

      - name: Patch Imports Safely
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 -c "from pathlib import Path; p=Path('$FILE'); s=p.read_text(); s=s.replace('import android.content.pm.ResolveInfo;','import android.content.pm.ResolveInfo;\nimport android.content.pm.ApplicationInfo;\nimport android.content.pm.PackageManager;'); s=s.replace('import android.graphics.drawable.GradientDrawable;','import android.graphics.drawable.GradientDrawable;\nimport android.graphics.drawable.Drawable;'); s=s.replace('import android.widget.GridLayout;','import android.widget.GridLayout;\nimport android.widget.ImageView;\nimport android.widget.Space;'); p.write_text(s)"

          echo "Imports patched: PASS"

      # ============================================================
      # 6. ADD QUICK APP CONTAINER FIELD
      # ============================================================

      - name: Add Quick App Container Field
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 -c "from pathlib import Path; p=Path('$FILE'); s=p.read_text(); f=Path('/tmp/carassistant-home-v2/field.txt').read_text().rstrip(); marker='    private LinearLayout dock;'; test marker in s; s=s.replace(marker, marker+'\n'+f,1); p.write_text(s)"

          echo "Quick app field: PASS"

      # ============================================================
      # 7. REPLACE ONLY BUILD DASHBOARD
      # ============================================================

      - name: Replace Dashboard With Home UI V2
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 -c "from pathlib import Path; p=Path('$FILE'); s=p.read_text(); n=Path('/tmp/carassistant-home-v2/dashboard.txt').read_text().rstrip(); a=s.index('    private void buildDashboard()'); b=s.index('    private void buildAppPanel()',a); p.write_text(s[:a]+n+'\n\n'+s[b:])"

          echo "Dashboard replacement: PASS"

      # ============================================================
      # 8. INSERT HOME UI V2 HELPERS
      # ============================================================

      - name: Insert Home UI V2 Helpers
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 -c "from pathlib import Path; p=Path('$FILE'); s=p.read_text(); n=Path('/tmp/carassistant-home-v2/helpers.txt').read_text().rstrip(); marker='    private void attachProjection()'; a=s.index(marker); p.write_text(s[:a]+n+'\n\n'+s[a:])"

          echo "Home UI V2 helpers: PASS"

      # ============================================================
      # 9. REPLACE APP TILE WITH REAL ICON VERSION
      # ============================================================

      - name: Replace App Grid Tile
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 -c "from pathlib import Path; p=Path('$FILE'); s=p.read_text(); n=Path('/tmp/carassistant-home-v2/apptile.txt').read_text().rstrip(); a=s.index('    private LinearLayout appTile('); b=s.index('    private void attachProjection()',a); block=s[a:b]; old=s[a:a+len(block)]; p.write_text(s[:a]+n+'\n\n'+s[b:])"

          echo "Real app grid icon patch: PASS"

      # ============================================================
      # 10. REBUILD QUICK APPS AFTER LOAD
      # ============================================================

      - name: Connect Quick Apps To App Loader
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 -c "from pathlib import Path; p=Path('$FILE'); s=p.read_text(); old='        loadApps();\n        rebuildDock();'; new='        loadApps();\n        rebuildQuickApps();'; test old in s; s=s.replace(old,new,1); p.write_text(s)"

          echo "Quick app rebuild hook: PASS"

      # ============================================================
      # 11. REMOVE OLD CLOCK UI BEHAVIOR FROM DASHBOARD
      #
      # buildDashboard no longer creates clock/date.
      # Existing clock ticker safely does nothing because fields
      # remain null. Projection architecture is untouched.
      # ============================================================

      - name: Verify Old Dashboard Is Gone
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          if grep -Fq '"CAR ASSISTANT"' "$FILE"; then
            echo "ERROR: old CAR ASSISTANT title still exists"
            exit 1
          fi

          if grep -Fq '"MAP"' "$FILE"; then
            echo "ERROR: old MAP dashboard still exists"
            exit 1
          fi

          if grep -Fq '"SPEED"' "$FILE"; then
            echo "ERROR: old SPEED card still exists"
            exit 1
          fi

          if grep -Fq '"WEATHER"' "$FILE"; then
            echo "ERROR: old WEATHER card still exists"
            exit 1
          fi

          if grep -Fq '"No media"' "$FILE"; then
            echo "ERROR: old MEDIA card still exists"
            exit 1
          fi

          echo "Old dashboard removed: PASS"

      # ============================================================
      # 12. VERIFY HOME UI V2 SOURCE
      # ============================================================

      - name: Verify Home UI V2 Source
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq 'sidebarButton("CHỌN APP")' "$FILE"
          grep -Fq '"VOICE"' "$FILE"
          grep -Fq '"TASKS"' "$FILE"
          grep -Fq '"MEDIA"' "$FILE"
          grep -Fq '"Nội dung đang phát"' "$FILE"
          grep -Fq 'circleButton("W")' "$FILE"

          grep -Fq 'ApplicationInfo' "$FILE"
          grep -Fq 'PackageManager' "$FILE"
          grep -Fq 'Drawable' "$FILE"
          grep -Fq 'ImageView' "$FILE"
          grep -Fq 'getRealAppIcon' "$FILE"
          grep -Fq 'info.loadIcon(pm)' "$FILE"

          grep -Fq '"com.google.android.apps.maps"' "$FILE"
          grep -Fq '"com.google.android.youtube"' "$FILE"
          grep -Fq '"com.zing.zalo"' "$FILE"
          grep -Fq '"com.spotify.music"' "$FILE"

          grep -Fq 'i < 4' "$FILE"

          echo "Home UI V2 source: PASS"
          echo "CHỌN APP: PASS"
          echo "4 quick apps: PASS"
          echo "VOICE placeholder: PASS"
          echo "TASKS placeholder: PASS"
          echo "WYN placeholder: PASS"
          echo "MEDIA placeholder: PASS"
          echo "Real icons: PASS"
          echo "Maps priority: PASS"
          echo "YouTube priority: PASS"
          echo "Zalo priority: PASS"
          echo "Spotify priority: PASS"

      # ============================================================
      # 13. VERIFY PROJECTION / PERSISTENCE WAS NOT TOUCHED
      # ============================================================

      - name: Verify Projection Persistence Source
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test "$(git hash-object "$BASE/V10ProjectionSession.java")" \
            = "27a9ff439fb450750d49f35a546eab3bc2745b4d"

          test "$(git hash-object "$BASE/V10DisplayController.java")" \
            = "1a35bcaa7db0a5f892e56006f740b4ebf727be8a"

          test "$(git hash-object "$BASE/V10SurfaceManager.java")" \
            = "e3f2a8b74ded29f21e04a95c661672db51d01d1c"

          test "$(git hash-object "$BASE/V10TaskSession.java")" \
            = "fce2f5cf06c5bd10782a87397aace8676493b6b7"

          if [ -f "$BASE/V10ProjectionService.java" ]; then
            echo "ERROR: V10ProjectionService.java appeared"
            exit 1
          fi

          grep -Fq 'session.setTarget(' "$BASE/V10CarActivity.java"
          grep -Fq 'V10SessionStore' "$BASE/V10CarActivity.java"
          grep -Fq 'createFloatingTouchKey' "$BASE/V10CarActivity.java"
          grep -Fq 'handleControlBack' "$BASE/V10CarActivity.java"
          grep -Fq 'handleControlHome' "$BASE/V10CarActivity.java"

          echo "Projection/Persistence preserved: PASS"
          echo "Floating Touch preserved: PASS"
          echo "BACK preserved: PASS"
          echo "HOME preserved: PASS"

      # ============================================================
      # 14. VERIFY ONLY V10CarActivity CHANGED
      # ============================================================

      - name: Verify Only V10CarActivity Changed
        shell: bash
        run: |
          set -euo pipefail

          CHANGED="$(git diff --name-only)"

          echo "Changed files:"
          echo "$CHANGED"

          COUNT="$(printf '%s\n' "$CHANGED" | sed '/^$/d' | wc -l)"

          test "$COUNT" = "1"

          test "$CHANGED" = \
            "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          echo "Only V10CarActivity.java changed: PASS"

      # ============================================================
      # 15. VERIFY NO PROTECTED FILE DIFF
      # ============================================================

      - name: Verify No Protected File Diff
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          for FILE in \
            "$BASE/V10ProjectionSession.java" \
            "$BASE/V10DisplayController.java" \
            "$BASE/V10SurfaceManager.java" \
            "$BASE/V10TaskSession.java"
          do
            if git diff --quiet -- "$FILE"; then
              echo "Protected file unchanged: $FILE"
            else
              echo "ERROR: protected file changed: $FILE"
              exit 1
            fi
          done

          echo "Protected files unchanged: PASS"

      # ============================================================
      # 16. DIFF CHECK
      # ============================================================

      - name: Validate Java Diff
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          git diff --stat

          echo "Git diff validation: PASS"

      # ============================================================
      # 17. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 18. PREPARE GRADLE
      # ============================================================

      - name: Prepare Gradle
        shell: bash
        working-directory: v10-source
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          echo "Gradle prepared: PASS"

      # ============================================================
      # 19. COMPILE
      # ============================================================

      - name: Compile Home UI V2
        shell: bash
        working-directory: v10-source
        run: |
          set -euo pipefail

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace

          echo "JAVA COMPILE: PASS"

      # ============================================================
      # 20. ASSEMBLE APK
      # ============================================================

      - name: Assemble Home UI V2 APK
        shell: bash
        working-directory: v10-source
        run: |
          set -euo pipefail

