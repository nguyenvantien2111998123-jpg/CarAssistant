            --no-daemon \
            --stacktrace

          echo "APK ASSEMBLE: PASS"

      # ============================================================
      # 21. VERIFY SOURCE AFTER BUILD
      # ============================================================

      - name: Verify Protected Files After Build
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test "$(git hash-object "$BASE/V10ProjectionSession.java")" \
            = "27a9ff439fb450750d49f35a546eab3bc2745b4d"

          test "$(git hash-object "$BASE/V10DisplayController.java")" \
            = "1a35bcaa7db0a5f892e56006f740b4ebf727be8a"

          test "$(git hash-object "$BASE/V10SurfaceManager.java")" \
            = "e3f2a8b74ded29f21e04a95c661672db51d01d1c"

          test "$(git hash-object "$BASE/V10TaskSession.java")" \
            = "fce2f5cf06c5bd10782a87397aace8676493b6b7"

          echo "Protected files after build: PASS"

      # ============================================================
      # 22. CREATE APK PACKAGE
      # ============================================================

      - name: Create Home UI V2 Release
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/carassistant-home-ui-v2
          mkdir -p /tmp/carassistant-home-ui-v2

          APK="$(
            find v10-source/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          cp "$APK" \
            /tmp/carassistant-home-ui-v2/CarAssistant-V10-Home-UI-V2.apk

          sha256sum \
            /tmp/carassistant-home-ui-v2/CarAssistant-V10-Home-UI-V2.apk \
            | tee \
            /tmp/carassistant-home-ui-v2/SHA256SUM.txt

          test -s \
            /tmp/carassistant-home-ui-v2/CarAssistant-V10-Home-UI-V2.apk

          test -s \
            /tmp/carassistant-home-ui-v2/SHA256SUM.txt

          echo "Home UI V2 APK created: PASS"

