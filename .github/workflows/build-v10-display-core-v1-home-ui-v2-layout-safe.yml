name: Build V10 Display Core V1 - Home UI V2 Layout Safe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-home-ui-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact Foundation V1
        uses: actions/checkout@v4
        with:
          ref: 7292b0569359a2fe6f7c3829561b6f65664fbd2e
          fetch-depth: 1

      - name: Verify exact Foundation V1
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="7292b0569359a2fe6f7c3829561b6f65664fbd2e"
          ACTUAL="$(git rev-parse HEAD)"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: wrong Foundation V1 commit"
            echo "EXPECTED=$EXPECTED"
            echo "ACTUAL=$ACTUAL"
            exit 1
          fi

          echo "Foundation V1 commit: PASS"

      - name: Verify Foundation V1 architecture
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$BASE/V10CarActivity.java"
          test -f "$BASE/V10ProjectionSession.java"
          test -f "$BASE/V10DisplayController.java"
          test -f "$BASE/V10SurfaceManager.java"
          test -f "$BASE/V10TaskSession.java"

          if [ -f "$BASE/V10ProjectionService.java" ]; then
            echo "ERROR: forbidden V10ProjectionService.java exists"
            exit 1
          fi

          echo "Foundation V1 architecture: PASS"

      - name: Snapshot protected files
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          mkdir -p foundation-protected

          sha256sum \
            "$BASE/V10ProjectionSession.java" \
            "$BASE/V10DisplayController.java" \
            "$BASE/V10SurfaceManager.java" \
            "$BASE/V10TaskSession.java" \
            > foundation-protected/hashes-before.txt

          cp \
            "$BASE/V10CarActivity.java" \
            foundation-protected/V10CarActivity-before.java

          echo "Protected snapshot: PASS"

      - name: Apply Home UI V2 only
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          source = path.read_text(encoding="utf-8")

          def replace_method(text, signature, replacement):
              start = text.find(signature)

              if start < 0:
                  raise SystemExit(
                      "Method not found: " + signature
                  )

              brace = text.find("{", start)

              if brace < 0:
                  raise SystemExit(
                      "Opening brace not found: " + signature
                  )

              depth = 0
              end = None

              for i in range(brace, len(text)):
                  ch = text[i]

                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1

                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise SystemExit(
                      "Closing brace not found: " + signature
                  )

              return (
                  text[:start]
                  + replacement.rstrip()
                  + "\n"
                  + text[end:]
              )

          required = [
              "class V10CarActivity",
              "private void buildUi()",
              "private void buildDashboard()",
              "private void buildAppPanel()",
              "private void loadApps()",
              "private void rebuildDock()",
              "private LinearLayout appTile(",
              "private void attachProjection()",
              "private void launchProjection(",
              "private void returnToLauncher()",
              "private void showApps()",
              "private void hideApps()",
              "private void createFloatingTouchKey()",
              "public void handleControlBack()",
              "public void handleControlHome()",
              "public void handleControlRecents()",
              "public void handleControlApps()",
              "private static final class AppInfo"
          ]

          for marker in required:
              if marker not in source:
                  raise SystemExit(
                      "Missing Foundation marker: " + marker
                  )

          # ------------------------------------------------------------
          # Add only imports required by Home UI V2.
          # ------------------------------------------------------------

          if "import android.content.pm.ApplicationInfo;" not in source:
              source = source.replace(
                  "import android.content.pm.ResolveInfo;\n",
                  "import android.content.pm.ResolveInfo;\n"
                  "import android.content.pm.ApplicationInfo;\n"
                  "import android.content.pm.PackageManager;\n"
              )

          if "import android.graphics.drawable.Drawable;" not in source:
              source = source.replace(
                  "import android.graphics.drawable.GradientDrawable;\n",
                  "import android.graphics.drawable.GradientDrawable;\n"
                  "import android.graphics.drawable.Drawable;\n"
              )

          if "import android.widget.ImageView;" not in source:
              source = source.replace(
                  "import android.widget.GridLayout;\n",
                  "import android.widget.GridLayout;\n"
                  "import android.widget.ImageView;\n"
              )

          # ------------------------------------------------------------
          # Home UI V2 dashboard.
          # Only visual Home layer is replaced.
          # ------------------------------------------------------------

          dashboard = r'''
    private void buildDashboard() {

        dashboard =
                new LinearLayout(this);

        dashboard.setOrientation(
                LinearLayout.HORIZONTAL);

        dashboard.setPadding(
                0,
                0,
                0,
                0);

        launcherLayer.addView(
                dashboard,
                new LinearLayout.LayoutParams(
                        -1,
                        -1));

        /*
         * LEFT SIDEBAR
         *
         * 1. APP CHỌN
         * 2. Four real quick-launch applications
         * 3. Voice placeholder
         * 4. Tasks placeholder
         */
        LinearLayout sidebar =
                new LinearLayout(this);

        sidebar.setOrientation(
                LinearLayout.VERTICAL);

        sidebar.setGravity(
                Gravity.TOP | Gravity.CENTER_HORIZONTAL);

        sidebar.setPadding(
                dp(3),
                dp(3),
                dp(3),
                dp(3));

        dashboard.addView(
                sidebar,
                new LinearLayout.LayoutParams(
                        dp(88),
                        -1));

        TextView choose =
                sidebarButton(
                        "APP\nCHỌN");

        choose.setOnClickListener(
                v -> showApps());

        sidebar.addView(
                choose,
                sidebarButtonParams());

        dock =
                new LinearLayout(this);

        dock.setOrientation(
                LinearLayout.VERTICAL);

        dock.setGravity(
                Gravity.TOP | Gravity.CENTER_HORIZONTAL);

        sidebar.addView(
                dock,
                new LinearLayout.LayoutParams(
                        -1,
                        0,
                        1f));

        TextView voice =
                sidebarButton(
                        "🎙");

        voice.setTextSize(20);

        /*
         * Placeholder only.
         * Voice functionality is not implemented here.
         */
        voice.setOnClickListener(
                v -> { });

        sidebar.addView(
                voice,
                sidebarFixedButtonParams());

        TextView tasks =
                sidebarButton(
                        "TASKS");

        /*
         * Placeholder only.
         * Running-task functionality is not implemented here.
         */
        tasks.setOnClickListener(
                v -> { });

        sidebar.addView(
                tasks,
                sidebarFixedButtonParams());

        /*
         * MAIN HOME AREA
         */
        FrameLayout main =
                new FrameLayout(this);

        dashboard.addView(
                main,
                new LinearLayout.LayoutParams(
                        0,
                        -1,
                        1f));

        /*
         * Bottom status/media area.
         */
        LinearLayout bottom =
                new LinearLayout(this);

        bottom.setOrientation(
                LinearLayout.HORIZONTAL);

        bottom.setGravity(
                Gravity.CENTER_VERTICAL);

        bottom.setPadding(
                dp(8),
                dp(8),
                dp(8),
                dp(8));

        FrameLayout.LayoutParams bottomParams =
                new FrameLayout.LayoutParams(
                        -1,
                        dp(88),
                        Gravity.BOTTOM);

        main.addView(
                bottom,
                bottomParams);

        /*
         * WYN placeholder.
         */
        TextView wyn =
                circleButton(
                        "WYN");

        wyn.setOnClickListener(
                v -> { });

        bottom.addView(
                wyn,
                new LinearLayout.LayoutParams(
                        dp(78),
                        dp(78)));

        /*
         * MEDIA placeholder.
         */
        LinearLayout media =
                card();

        media.setPadding(
                dp(14),
                dp(7),
                dp(14),
                dp(7));

        TextView mediaTitle =
                text(
                        "MEDIA",
                        12,
                        Color.LTGRAY);

        TextView mediaLine =
                text(
                        "▶  Đang phát...",
                        17,
                        Color.WHITE);

        media.addView(
                mediaTitle,
                new LinearLayout.LayoutParams(
                        -1,
                        dp(25)));

        media.addView(
                mediaLine,
                new LinearLayout.LayoutParams(
                        -1,
                        dp(35)));

        media.setOnClickListener(
                v -> { });

        LinearLayout.LayoutParams mediaParams =
                new LinearLayout.LayoutParams(
                        0,
                        dp(78),
                        1f);

        mediaParams.setMargins(
                dp(12),
                0,
                0,
                0);

        bottom.addView(
                media,
                mediaParams);
    }
          '''

          source = replace_method(
              source,
              "    private void buildDashboard()",
              dashboard
          )

          # ------------------------------------------------------------
          # Four real quick-launch apps.
          # ------------------------------------------------------------

          dock = r'''
    private void rebuildDock() {

        if (dock == null) {
            return;
        }

        dock.removeAllViews();

        ArrayList<AppInfo> quickApps =
                getQuickLaunchApps();

        int count =
                Math.min(
                        4,
                        quickApps.size());

        for (int i = 0;
             i < count;
             i++) {

            final AppInfo app =
                    quickApps.get(i);

            dock.addView(
                    quickLaunchTile(app),
                    sidebarQuickParams());
        }
    }

    private ArrayList<AppInfo> getQuickLaunchApps() {

        ArrayList<AppInfo> selected =
                new ArrayList<>();

        String[] preferredPackages = {
                "com.google.android.apps.maps",
                "com.google.android.youtube",
                "com.zing.zalo",
                "com.spotify.music"
        };

        /*
         * First use preferred applications
         * when actually installed.
         */
        for (String packageName :
                preferredPackages) {

            for (AppInfo app : apps) {

                if (selected.size() >= 4) {
                    break;
                }

                if (packageName.equals(
                        app.component.getPackageName())) {

                    boolean duplicate = false;

                    for (AppInfo existing :
                            selected) {

                        if (existing.component.equals(
                                app.component)) {

                            duplicate = true;
                            break;
                        }
                    }

                    if (!duplicate) {
                        selected.add(app);
                    }
                }
            }
        }

        /*
         * Fill unused positions with other real
         * installed launcher applications.
         */
        if (selected.size() < 4) {

            for (AppInfo app : apps) {

                if (selected.size() >= 4) {
                    break;
                }

                boolean duplicate = false;

                for (AppInfo existing :
                        selected) {

                    if (existing.component.equals(
                            app.component)) {

                        duplicate = true;
                        break;
                    }
                }

                if (!duplicate) {
                    selected.add(app);
                }
            }
        }

        return selected;
    }

    private LinearLayout quickLaunchTile(
            AppInfo app) {

        LinearLayout tile =
                new LinearLayout(this);

        tile.setOrientation(
                LinearLayout.VERTICAL);

        tile.setGravity(
                Gravity.CENTER);

        GradientDrawable background =
                new GradientDrawable();

        background.setColor(
                Color.rgb(
                        22,
                        27,
                        33));

        background.setCornerRadius(
                dp(14));

        tile.setBackground(background);

        ImageView icon =
                new ImageView(this);

        Drawable drawable =
                getRealAppIcon(
                        app.component.getPackageName());

        if (drawable != null) {
            icon.setImageDrawable(drawable);
        }

        icon.setScaleType(
                ImageView.ScaleType.CENTER_INSIDE);

        tile.addView(
                icon,
                new LinearLayout.LayoutParams(
                        dp(44),
                        dp(44)));

        TextView name =
                text(
                        app.name,
                        8,
                        Color.WHITE);

        name.setGravity(
                Gravity.CENTER);

        name.setMaxLines(1);

        tile.addView(
                name,
                new LinearLayout.LayoutParams(
                        -1,
                        dp(20)));

        tile.setOnClickListener(
                v -> launchProjection(
                        app.component));

        return tile;
    }
          '''

          source = replace_method(
              source,
              "    private void rebuildDock()",
              dock
          )

          # ------------------------------------------------------------
          # Real application icon in APP CHỌN grid.
          # ------------------------------------------------------------

          app_tile = r'''
    private LinearLayout appTile(
            AppInfo app) {

        LinearLayout tile =
                new LinearLayout(this);

        tile.setOrientation(
                LinearLayout.VERTICAL);

        tile.setGravity(
                Gravity.CENTER);

        GradientDrawable background =
                new GradientDrawable();

        background.setColor(
                Color.rgb(
                        22,
                        27,
                        33));

        background.setCornerRadius(
                dp(16));

        tile.setBackground(background);

        ImageView icon =
                new ImageView(this);

        Drawable drawable =
                getRealAppIcon(
                        app.component.getPackageName());

        if (drawable != null) {
            icon.setImageDrawable(drawable);
        }

        icon.setScaleType(
                ImageView.ScaleType.CENTER_INSIDE);

        tile.addView(
                icon,
                new LinearLayout.LayoutParams(
                        -1,
                        dp(64)));

        TextView name =
                text(
                        app.name,
                        12,
                        Color.WHITE);

        name.setGravity(
                Gravity.CENTER);

        name.setMaxLines(2);

        tile.addView(
                name,
                new LinearLayout.LayoutParams(
                        -1,
                        dp(38)));

        tile.setOnClickListener(
                v -> {

                    hideApps();

                    launchProjection(
                            app.component);
                });

        return tile;
    }

    private Drawable getRealAppIcon(
            String packageName) {

        try {

            PackageManager pm =
                    getPackageManager();

            ApplicationInfo info =
                    pm.getApplicationInfo(
                            packageName,
                            0);

            return info.loadIcon(pm);

        } catch (Exception ignored) {

            return null;
        }
    }
          '''

          source = replace_method(
              source,
              "    private LinearLayout appTile(",
              app_tile
          )

          # ------------------------------------------------------------
          # Sidebar helper methods.
          # ------------------------------------------------------------

          helper_marker = "    private LinearLayout card()"

          if helper_marker not in source:
              raise SystemExit(
                  "card() helper not found"
              )

          helpers = r'''
    private LinearLayout.LayoutParams
            sidebarButtonParams() {

        LinearLayout.LayoutParams params =
                new LinearLayout.LayoutParams(
                        -1,
                        dp(62));

        params.setMargins(
                dp(1),
                dp(2),
                dp(1),
                dp(2));

        return params;
    }

    private LinearLayout.LayoutParams
            sidebarFixedButtonParams() {

        LinearLayout.LayoutParams params =
                new LinearLayout.LayoutParams(
                        -1,
                        dp(62));

        params.setMargins(
                dp(1),
                dp(2),
                dp(1),
                dp(2));

        return params;
    }

    private LinearLayout.LayoutParams
            sidebarQuickParams() {

        LinearLayout.LayoutParams params =
                new LinearLayout.LayoutParams(
                        -1,
                        dp(66));

        params.setMargins(
                dp(1),
                dp(2),
                dp(1),
                dp(2));

        return params;
    }

    private TextView sidebarButton(
            String value) {

        TextView view =
                buttonText(value);

        view.setTextSize(11);

        view.setGravity(
                Gravity.CENTER);

        return view;
    }

    private TextView circleButton(
            String value) {

        TextView view =
                text(
                        value,
                        15,
                        Color.WHITE);

        view.setGravity(
                Gravity.CENTER);

        GradientDrawable background =
                new GradientDrawable();

        background.setShape(
                GradientDrawable.OVAL);

        background.setColor(
                Color.rgb(
                        22,
                        27,
                        33));

        background.setStroke(
                dp(2),
                Color.rgb(
                        70,
                        150,
                        210));

        view.setBackground(
                background);

        return view;
    }

          '''

          source = source.replace(
              helper_marker,
              helpers + helper_marker,
              1
          )

          # ------------------------------------------------------------
          # Remove the old fake initial() helper if it exists.
          # ------------------------------------------------------------

          initial_start = source.find(
              "    private String initial("
          )

          if initial_start >= 0:

              initial_end = source.find(
                  "    private int dp(",
                  initial_start
              )

              if initial_end < 0:
                  raise SystemExit(
                      "Could not locate end of initial()"
                  )

              source = (
                  source[:initial_start]
                  + source[initial_end:]
              )

          # ------------------------------------------------------------
          # The old infoCard() belongs only to the old Home UI.
          # Remove it if present.
          # ------------------------------------------------------------

          info_start = source.find(
              "    private LinearLayout infoCard("
          )

          if info_start >= 0:

              info_end = source.find(
                  "    private TextView buttonText(",
                  info_start
              )

              if info_end < 0:
                  raise SystemExit(
                      "Could not locate end of infoCard()"
                  )

              source = (
                  source[:info_start]
                  + source[info_end:]
              )

          # ------------------------------------------------------------
          # Final source markers.
          # ------------------------------------------------------------

          required_after = [
              "private Drawable getRealAppIcon(",
              "ApplicationInfo",
              "PackageManager",
              "ImageView",
              "getQuickLaunchApps()",
              "Math.min(",
              '"TASKS"',
              '"MEDIA"',
              '"WYN"',
              "launchProjection("
          ]

          for marker in required_after:
              if marker not in source:
                  raise SystemExit(
                      "Required V2 marker missing: "
                      + marker
                  )

          # ------------------------------------------------------------
          # Old Home UI must be absent.
          # ------------------------------------------------------------

          forbidden = [
              '"CAR ASSISTANT"',
              '"SPEED"',
              '"WEATHER"',
              'initial(app.name)'
          ]

          for marker in forbidden:
              if marker in source:
                  raise SystemExit(
                      "Old Home UI marker remains: "
                      + marker
                  )

          # ------------------------------------------------------------
          # The actual projection/persistence methods must still exist.
          # We deliberately check semantic markers, not whitespace.
          # ------------------------------------------------------------

          protected_activity_markers = [
              "V10SessionStore",
              "setTarget(this, component)",
              "session.setTarget(component)",
              "session.release()",
              "createFloatingTouchKey",
              "handleControlBack",
              "handleControlHome"
          ]

          for marker in protected_activity_markers:
              if marker not in source:
                  raise SystemExit(
                      "Protected activity marker missing: "
                      + marker
                  )

          path.write_text(
              source.rstrip() + "\n",
              encoding="utf-8"
          )

          print("Home UI V2 patch: PASS")
          PY

      - name: Verify only Home UI source changed
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -q 'ApplicationInfo' "$FILE"
          grep -q 'PackageManager' "$FILE"
          grep -q 'ImageView' "$FILE"
          grep -q 'getRealAppIcon' "$FILE"
          grep -q 'getQuickLaunchApps' "$FILE"
          grep -q '"TASKS"' "$FILE"
          grep -q '"MEDIA"' "$FILE"
          grep -q '"WYN"' "$FILE"

          if grep -q '"CAR ASSISTANT"' "$FILE"; then
            echo "ERROR: old CAR ASSISTANT title remains"
            exit 1
          fi

          if grep -q '"SPEED"' "$FILE"; then
            echo "ERROR: old SPEED card remains"
            exit 1
          fi

          if grep -q '"WEATHER"' "$FILE"; then
            echo "ERROR: old WEATHER card remains"
            exit 1
          fi

          if grep -q 'initial(app.name)' "$FILE"; then
            echo "ERROR: fake app icon remains"
            exit 1
          fi

          echo "Home UI source verification: PASS"

      - name: Verify protected Projection and Persistence files
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          for f in \
            V10ProjectionSession.java \
            V10DisplayController.java \
            V10SurfaceManager.java \
            V10TaskSession.java
          do
            test -f "$BASE/$f"
          done

          if [ -f "$BASE/V10ProjectionService.java" ]; then
            echo "ERROR: V10ProjectionService.java exists"
            exit 1
          fi

          sha256sum \
            "$BASE/V10ProjectionSession.java" \
            "$BASE/V10DisplayController.java" \
            "$BASE/V10SurfaceManager.java" \
            "$BASE/V10TaskSession.java" \
            > foundation-protected/hashes-after.txt

          diff -u \
            foundation-protected/hashes-before.txt \
            foundation-protected/hashes-after.txt

          echo "Projection/Persistence protection: PASS"

      - name: Verify changed files
        shell: bash
        run: |
          set -euo pipefail

          git status --short

          CHANGED="$(
            git status --short |
            awk '{print substr($0,4)}'
          )"

          if [ -z "$CHANGED" ]; then
            echo "ERROR: no source change detected"
            exit 1
          fi

          BAD=0

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            if [ "$file" != "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java" ]; then
              echo "ERROR: unexpected changed file: $file"
              BAD=1
            fi
          done <<< "$CHANGED"

          if [ "$BAD" -ne 0 ]; then
            exit 1
          fi

          echo "Only V10CarActivity.java changed: PASS"

      - name: Git diff check
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          echo "Git diff check: PASS"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile Java
        shell: bash
        working-directory: v10-source
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace

      - name: Assemble Debug APK
        shell: bash
        working-directory: v10-source
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Locate APK and SHA256
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          APK="$(
            find v10-source/app/build/outputs/apk \
              -type f \
              -name "*.apk" |
            head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          cp "$APK" \
            release/CarAssistant-V10-Home-UI-V2.apk

          sha256sum \
            release/CarAssistant-V10-Home-UI-V2.apk \
            | tee release/SHA256SUM.txt

          echo "APK located successfully"

      - name: Upload Home UI V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Home-UI-V2
          path: |
            release/CarAssistant-V10-Home-UI-V2.apk
            release/SHA256SUM.txt
          if-no-files-found: error

      - name: Final Home UI V2 gate
        shell: bash
        run: |
          set -euo pipefail

          test -s \
            release/CarAssistant-V10-Home-UI-V2.apk

          test -s \
            release/SHA256SUM.txt

          echo "=============================================="
          echo "HOME UI V2 LAYOUT SAFE: PASS"
          echo "Foundation V1 preserved."
          echo "Real ApplicationInfo icons added."
          echo "Four real quick-launch apps added."
          echo "APP CHON opens real app chooser."
          echo "Voice/Tasks/Wyn/Media are placeholders only."
          echo "Display Core preserved."
          echo "Projection preserved."
          echo "Persistence preserved."
          echo "=============================================="
