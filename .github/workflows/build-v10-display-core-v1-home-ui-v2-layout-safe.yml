                    hideApps();

                    launchProjection(
                            app.component);
                });

        return tile;
    }

    private Drawable getRealAppIcon(
            String packageName) {

        try {

            PackageManager pm =
                    getPackageManager();

            ApplicationInfo info =
                    pm.getApplicationInfo(
                            packageName,
                            0);

            return info.loadIcon(pm);

        } catch (Exception ignored) {

            return null;
        }
    }

