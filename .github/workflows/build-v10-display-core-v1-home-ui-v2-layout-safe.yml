name: Build V10 Display Core V1 - Home UI V2 Layout Safe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-home-ui-v2:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout exact Foundation V1
        uses: actions/checkout@v4
        with:
          ref: 7292b0569359a2fe6f7c3829561b6f65664fbd2e
          fetch-depth: 1

      - name: Verify exact Foundation V1
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="7292b0569359a2fe6f7c3829561b6f65664fbd2e"
          ACTUAL="$(git rev-parse HEAD)"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: wrong Foundation V1 commit"
            echo "EXPECTED=$EXPECTED"
            echo "ACTUAL=$ACTUAL"
            exit 1
          fi

          echo "Foundation V1 commit: PASS"

      - name: Verify Foundation V1 architecture
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$BASE/V10CarActivity.java"
          test -f "$BASE/V10ProjectionSession.java"
          test -f "$BASE/V10DisplayController.java"
          test -f "$BASE/V10SurfaceManager.java"
          test -f "$BASE/V10TaskSession.java"

          if [ -f "$BASE/V10ProjectionService.java" ]; then
            echo "ERROR: forbidden V10ProjectionService.java exists"
            exit 1
          fi

          echo "Foundation V1 architecture: PASS"

      - name: Snapshot Foundation V1 protected files
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          mkdir -p foundation-protected

          sha256sum \
            "$BASE/V10ProjectionSession.java" \
            "$BASE/V10DisplayController.java" \
            "$BASE/V10SurfaceManager.java" \
            "$BASE/V10TaskSession.java" \
            > foundation-protected/hashes-before.txt

          cp \
            "$BASE/V10CarActivity.java" \
            foundation-protected/V10CarActivity-before.java

          echo "Foundation V1 protected snapshot: PASS"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Home UI V2 patch script
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/home_ui_v2_patch.py <<'PY'
          from pathlib import Path

          FILE = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/"
              "V10CarActivity.java"
          )

          source = FILE.read_text(encoding="utf-8")

          def replace_method(text, signature, replacement):
              start = text.find(signature)

              if start < 0:
                  raise RuntimeError(
                      "Missing method signature: " + signature
                  )

              brace = text.find("{", start)

              if brace < 0:
                  raise RuntimeError(
                      "Missing opening brace: " + signature
                  )

              depth = 0
              end = None

              for i in range(brace, len(text)):
                  ch = text[i]

                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1

                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise RuntimeError(
                      "Could not find end of method: " + signature
                  )

              return text[:start] + replacement.rstrip() + text[end:]

          def ensure_import(text, import_line):
              if import_line in text:
                  return text

              marker = "import android.content.pm.ResolveInfo;\n"

              if marker not in text:
                  raise RuntimeError(
                      "Import insertion marker not found"
                  )

              return text.replace(
                  marker,
                  marker + import_line,
                  1
              )

          # ------------------------------------------------------------
          # Required imports for real Android application icons.
          # ------------------------------------------------------------

          source = ensure_import(
              source,
              "import android.content.pm.ApplicationInfo;\n"
          )

          source = ensure_import(
              source,
              "import android.graphics.drawable.Drawable;\n"
          )

          source = ensure_import(
              source,
              "import android.widget.ImageView;\n"
          )

          # ------------------------------------------------------------
          # Home UI V2 dashboard.
          #
          # IMPORTANT:
          # Only V10CarActivity.java is modified.
          # Projection/session/persistence architecture is untouched.
          # ------------------------------------------------------------

          new_build_dashboard = r'''    private void buildDashboard() {

        dashboard =
                new LinearLayout(this);

        dashboard.setOrientation(
                LinearLayout.HORIZONTAL);

        dashboard.setPadding(
                0,
                0,
                0,
                0);

        launcherLayer.addView(
                dashboard,
                new LinearLayout.LayoutParams(
                        -1,
                        -1));

        LinearLayout sidebar =
                new LinearLayout(this);

        sidebar.setOrientation(
                LinearLayout.VERTICAL);

        sidebar.setGravity(
                Gravity.TOP |
                Gravity.CENTER_HORIZONTAL);

        sidebar.setPadding(
                dp(3),
                dp(3),
                dp(3),
                dp(3));

        dashboard.addView(
                sidebar,
                new LinearLayout.LayoutParams(
                        dp(88),
                        -1));

        TextView choose =
                sidebarButton(
                        "APP\nỨNG DỤNG");

        choose.setOnClickListener(
                v -> showApps());

        sidebar.addView(
                choose,
                sidebarButtonParams());

        dock =
                new LinearLayout(this);

        dock.setOrientation(
                LinearLayout.VERTICAL);

        dock.setGravity(
                Gravity.TOP |
                Gravity.CENTER_HORIZONTAL);

        sidebar.addView(
                dock,
                new LinearLayout.LayoutParams(
                        -1,
                        0,
                        1f));

        TextView voice =
                sidebarButton("−");

        voice.setTextSize(20);

        voice.setOnClickListener(
                v -> {
                    // Voice is intentionally a placeholder in Home UI V2.
                });

        sidebar.addView(
                voice,
                sidebarFixedButtonParams());

        TextView tasks =
                sidebarButton("TASKS");

        tasks.setOnClickListener(
                v -> {
                    // Tasks is intentionally a placeholder in Home UI V2.
                });

        sidebar.addView(
                tasks,
                sidebarFixedButtonParams());

        FrameLayout main =
                new FrameLayout(this);

        dashboard.addView(
                main,
                new LinearLayout.LayoutParams(
                        0,
                        -1,
                        1f));

        LinearLayout bottom =
                new LinearLayout(this);

        bottom.setOrientation(
                LinearLayout.HORIZONTAL);

        bottom.setGravity(
                Gravity.CENTER_VERTICAL);

        bottom.setPadding(
                dp(8),
                dp(8),
                dp(8),
                dp(8));

        FrameLayout.LayoutParams bottomParams =
                new FrameLayout.LayoutParams(
                        -1,
                        dp(88),
                        Gravity.BOTTOM);

        main.addView(
                bottom,
                bottomParams);

        TextView wyn =
                circleButton("WYN");

        wyn.setOnClickListener(
                v -> {
                    // Weather is intentionally a placeholder in Home UI V2.
                });

        bottom.addView(
                wyn,
                new LinearLayout.LayoutParams(
                        dp(78),
                        dp(78)));

        LinearLayout media =
                card();

        media.setPadding(
                dp(14),
                dp(7),
                dp(14),
                dp(7));

        media.addView(
                text(
                        "MEDIA",
                        12,
                        Color.LTGRAY),
                new LinearLayout.LayoutParams(
                        -1,
                        dp(25)));

        media.addView(
                text(
                        "> Đang phát...",
                        17,
                        Color.WHITE));

        media.setOnClickListener(
                v -> {
                    // Media is intentionally a placeholder in Home UI V2.
                });

        LinearLayout.LayoutParams mediaParams =
                new LinearLayout.LayoutParams(
                        0,
                        dp(78),
                        1f);

        mediaParams.setMargins(
                dp(12),
                0,
                0,
                0);

        bottom.addView(
                media,
                mediaParams);
    }'''

          source = replace_method(
              source,
              "    private void buildDashboard()",
              new_build_dashboard
          )

          # ------------------------------------------------------------
          # Real quick-launch icons.
          # onResume() already calls rebuildDock(), therefore this method
          # must also be replaced rather than leaving the old text dock.
          # ------------------------------------------------------------

          new_rebuild_dock = r'''    private void rebuildDock() {

        if (dock == null) {
            return;
        }

        dock.removeAllViews();

        List<AppInfo> quickApps =
                getQuickLaunchApps();

        for (AppInfo app : quickApps) {

            LinearLayout tile =
                    new LinearLayout(this);

            tile.setOrientation(
                    LinearLayout.VERTICAL);

            tile.setGravity(
                    Gravity.CENTER);

            GradientDrawable bg =
                    new GradientDrawable();

            bg.setColor(
                    Color.rgb(
                            22,
                            27,
                            33));

            bg.setCornerRadius(
                    dp(13));

            tile.setBackground(bg);

            ImageView icon =
                    new ImageView(this);

            Drawable drawable =
                    getRealAppIcon(
                            app);

            if (drawable != null) {
                icon.setImageDrawable(drawable);
            }

            icon.setScaleType(
                    ImageView.ScaleType.CENTER_INSIDE);

            tile.addView(
                    icon,
                    new LinearLayout.LayoutParams(
                            dp(38),
                            dp(38)));

            TextView name =
                    text(
                            app.name,
                            9,
                            Color.WHITE);

            name.setGravity(
                    Gravity.CENTER);

            name.setMaxLines(1);

            tile.addView(
                    name,
                    new LinearLayout.LayoutParams(
                            -1,
                            dp(22)));

            tile.setOnClickListener(
                    v ->
                            launchProjection(
                                    app.component));

            LinearLayout.LayoutParams params =
                    new LinearLayout.LayoutParams(
                            -1,
                            dp(70));

            params.setMargins(
                    dp(1),
                    dp(3),
                    dp(1),
                    dp(3));

            dock.addView(
                    tile,
                    params);
        }
    }

    private List<AppInfo> getQuickLaunchApps() {

        int count =
                Math.min(
                        4,
                        apps.size());

        if (count <= 0) {
            return new ArrayList<>();
        }

        return new ArrayList<>(
                apps.subList(
                        0,
                        count));
    }

    private Drawable getRealAppIcon(
            AppInfo app) {

        if (app == null
                || app.component == null) {
            return null;
        }

        try {
            ApplicationInfo info =
                    getPackageManager()
                            .getApplicationInfo(
                                    app.component
                                            .getPackageName(),
                                    0);

            return info.loadIcon(
                    getPackageManager());

        } catch (RuntimeException ignored) {
            return null;
        }
    }'''

          source = replace_method(
              source,
              "    private void rebuildDock()",
              new_rebuild_dock
          )

          # ------------------------------------------------------------
          # Real icon in Applications grid.
          # Removes the old fake initial-letter icon.
          # ------------------------------------------------------------

          new_app_tile = r'''    private LinearLayout appTile(
            AppInfo app) {

        LinearLayout tile =
                new LinearLayout(this);

        tile.setOrientation(
                LinearLayout.VERTICAL);

        tile.setGravity(
                Gravity.CENTER);

        GradientDrawable bg =
                new GradientDrawable();

        bg.setColor(
                Color.rgb(
                        22,
                        27,
                        33));

        bg.setCornerRadius(
                dp(16));

        tile.setBackground(bg);

        ImageView icon =
                new ImageView(this);

        Drawable drawable =
                getRealAppIcon(
                        app);

        if (drawable != null) {
            icon.setImageDrawable(drawable);
        }

        icon.setScaleType(
                ImageView.ScaleType.CENTER_INSIDE);

        tile.addView(
                icon,
                new LinearLayout.LayoutParams(
                        -1,
                        dp(58)));

        TextView name =
                text(
                        app.name,
                        12,
                        Color.WHITE);

        name.setGravity(
                Gravity.CENTER);

        name.setMaxLines(2);

        tile.addView(
                name,
                new LinearLayout.LayoutParams(
                        -1,
                        dp(36)));

        tile.setOnClickListener(
                v -> {

                    hideApps();

                    launchProjection(
                            app.component);
                });

        return tile;
    }'''

          source = replace_method(
              source,
              "    private LinearLayout appTile(",
              new_app_tile
          )

          # ------------------------------------------------------------
          # Safety checks against accidental architecture changes.
          # ------------------------------------------------------------

          if "V10ProjectionService.java" in source:
              raise RuntimeError(
                  "Forbidden V10ProjectionService reference detected"
              )

          if "session.setTarget" not in source:
              raise RuntimeError(
                  "Projection session call unexpectedly missing"
              )

          if "V10SessionStore" not in source:
              raise RuntimeError(
                  "V10SessionStore unexpectedly missing"
              )

          if "createFloatingTouchKey" not in source:
              raise RuntimeError(
                  "Floating Touch unexpectedly missing"
              )

          FILE.write_text(
              source,
              encoding="utf-8"
          )

          print("Home UI V2 patch script: PASS")
          print("Modified file:")
          print(FILE)
          PY

      - name: Python syntax check
        shell: bash
        run: |
          set -euo pipefail

          python3 -m py_compile \
            /tmp/home_ui_v2_patch.py

          echo "Python syntax check: PASS"

      - name: Apply Home UI V2 patch
        shell: bash
        run: |
          set -euo pipefail

          python3 /tmp/home_ui_v2_patch.py

          echo "Home UI V2 patch applied: PASS"

      - name: Verify Home UI V2 source
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -q "ApplicationInfo" "$FILE"
          grep -q "Drawable" "$FILE"
          grep -q "ImageView" "$FILE"
          grep -q "getRealAppIcon" "$FILE"
          grep -q "getQuickLaunchApps" "$FILE"

          grep -q '"APP\\nỨNG DỤNG"' "$FILE"
          grep -q '"TASKS"' "$FILE"
          grep -q '"MEDIA"' "$FILE"
          grep -q '"WYN"' "$FILE"

          grep -q "V10SessionStore" "$FILE"
          grep -q "session.setTarget" "$FILE"
          grep -q "createFloatingTouchKey" "$FILE"
          grep -q "handleControlBack" "$FILE"
          grep -q "handleControlHome" "$FILE"

          if grep -q '"CAR ASSISTANT"' "$FILE"; then
            echo "ERROR: old CAR ASSISTANT dashboard title remains"
            exit 1
          fi

          if grep -q '"SPEED"' "$FILE"; then
            echo "ERROR: old SPEED card remains"
            exit 1
          fi

          if grep -q '"WEATHER"' "$FILE"; then
            echo "ERROR: old WEATHER card remains"
            exit 1
          fi

          if grep -q 'initial(app.name)' "$FILE"; then
            echo "ERROR: fake app icon remains"
            exit 1
          fi

          echo "Home UI V2 source verification: PASS"

      - name: Verify protected Projection and Persistence
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          sha256sum \
            "$BASE/V10ProjectionSession.java" \
            "$BASE/V10DisplayController.java" \
            "$BASE/V10SurfaceManager.java" \
            "$BASE/V10TaskSession.java" \
            > foundation-protected/hashes-after.txt

          diff -u \
            foundation-protected/hashes-before.txt \
            foundation-protected/hashes-after.txt

          if [ -f "$BASE/V10ProjectionService.java" ]; then
            echo "ERROR: forbidden V10ProjectionService.java exists"
            exit 1
          fi

          echo "Projection/Persistence protection: PASS"

      - name: Verify only Home Activity changed
        shell: bash
        run: |
          set -euo pipefail

          git status --short

          CHANGED="$(
            git status --short |
            awk '{print substr($0,4)}'
          )"

          if [ -z "$CHANGED" ]; then
            echo "ERROR: no changed file detected"
            exit 1
          fi

          BAD=0

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            if [ "$file" != "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java" ]; then
              echo "ERROR: unexpected changed file: $file"
              BAD=1
            fi
          done <<< "$CHANGED"

          if [ "$BAD" -ne 0 ]; then
            exit 1
          fi

          echo "Only V10CarActivity.java changed: PASS"

      - name: Verify Home Activity diff is limited
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          git diff --check

          git diff -- "$FILE" > /tmp/home-ui-v2.diff

          grep -q "buildDashboard" /tmp/home-ui-v2.diff
          grep -q "getRealAppIcon" /tmp/home-ui-v2.diff
          grep -q "getQuickLaunchApps" /tmp/home-ui-v2.diff
          grep -q "ImageView" /tmp/home-ui-v2.diff

          echo "Home Activity diff scope: PASS"

      - name: Compile Java
        shell: bash
        working-directory: v10-source
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace

      - name: Assemble Debug APK
        shell: bash
        working-directory: v10-source
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Locate APK and SHA256
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          APK="$(
            find v10-source/app/build/outputs/apk \
              -type f \
              -name "*.apk" |
            head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          cp "$APK" \
            release/CarAssistant-V10-Home-UI-V2.apk

          sha256sum \
            release/CarAssistant-V10-Home-UI-V2.apk \
            | tee release/SHA256SUM.txt

      - name: Upload Home UI V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Home-UI-V2
          path: |
            release/CarAssistant-V10-Home-UI-V2.apk
            release/SHA256SUM.txt
          if-no-files-found: error

      - name: Final Home UI V2 Gate
        shell: bash
        run: |
          set -euo pipefail

          test -s release/CarAssistant-V10-Home-UI-V2.apk
          test -s release/SHA256SUM.txt

          echo "=============================================="
          echo "HOME UI V2 LAYOUT SAFE: PASS"
          echo "Foundation V1: 7292b0569359a2fe6f7c3829561b6f65664fbd2e"
          echo "Display Core preserved."
          echo "Projection Core preserved."
          echo "Persistence preserved."
          echo "Floating Touch preserved."
          echo "Real application icons enabled."
          echo "Maximum 4 quick-launch applications."
          echo "APP / ỨNG DỤNG selector preserved."
          echo "Voice remains placeholder."
          echo "TASKS remains placeholder."
          echo "WYN remains placeholder."
          echo "MEDIA remains placeholder."
          echo "=============================================="
