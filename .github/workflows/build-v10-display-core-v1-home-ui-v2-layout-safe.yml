          source = source[:start] + new_dashboard + source[end:]

          # ------------------------------------------------------------
          # Replace rebuildDock() with four real quick-launch icons.
          # ------------------------------------------------------------

          start = source.index("    private void rebuildDock() {")
          end = source.index("    private LinearLayout appTile(", start)

          new_dock = r'''    private void rebuildDock() {

        if (dock == null) {
            return;
        }

        dock.removeAllViews();

        ArrayList<AppInfo> quickApps =
                getQuickLaunchApps();

        int count =
                Math.min(
                        4,
                        quickApps.size());

        for (int i = 0;
             i < count;
             i++) {

            final AppInfo app =
                    quickApps.get(i);

            LinearLayout tile =
                    quickLaunchTile(app);

            dock.addView(
                    tile,
                    sidebarQuickParams());
        }
    }

    private ArrayList<AppInfo> getQuickLaunchApps() {

        ArrayList<AppInfo> selected =
                new ArrayList<>();

        /*
         * Preferred real applications.
         *
         * If an application is not installed, it is
         * simply skipped and another installed launcher
         * app fills the position.
         */
        String[] preferredPackages = {
                "com.google.android.apps.maps",
                "com.google.android.youtube",
                "com.zing.zalo",
                "com.spotify.music"
        };

        for (String packageName :
                preferredPackages) {

            for (AppInfo app : apps) {

                if (selected.size() >= 4) {
                    break;
                }

                if (app.component
                        .getPackageName()
                        .equals(packageName)) {

                    boolean duplicate = false;

                    for (AppInfo existing :
                            selected) {

                        if (existing.component
                                .equals(app.component)) {

                            duplicate = true;
                            break;
                        }
                    }

                    if (!duplicate) {
                        selected.add(app);
                    }
                }
            }
        }

        /*
         * Fill remaining slots with real installed
         * launcher applications.
         */
        if (selected.size() < 4) {

            for (AppInfo app : apps) {

                if (selected.size() >= 4) {
                    break;
                }

                boolean duplicate = false;

                for (AppInfo existing :
                        selected) {

                    if (existing.component
                            .equals(app.component)) {

                        duplicate = true;
                        break;
                    }
                }

                if (!duplicate) {
                    selected.add(app);
                }
            }
        }

        return selected;
    }

    private LinearLayout quickLaunchTile(
            AppInfo app) {

        LinearLayout tile =
                new LinearLayout(this);

        tile.setOrientation(
                LinearLayout.VERTICAL);

        tile.setGravity(
                Gravity.CENTER);

        GradientDrawable bg =
                new GradientDrawable();

        bg.setColor(
                Color.rgb(
                        22,
                        27,
                        33));

        bg.setCornerRadius(
                dp(14));

        tile.setBackground(bg);

        ImageView icon =
                new ImageView(this);

        Drawable drawable =
                getRealAppIcon(
                        app.component
                                .getPackageName());

        if (drawable != null) {
            icon.setImageDrawable(drawable);
        }

        icon.setScaleType(
                ImageView.ScaleType.CENTER_INSIDE);

        tile.addView(
                icon,
                new LinearLayout.LayoutParams(
                        dp(48),
                        dp(48)));

        TextView name =
                text(
                        app.name,
                        9,
                        Color.WHITE);

        name.setGravity(
                Gravity.CENTER);

        name.setMaxLines(1);

        tile.addView(
                name,
                new LinearLayout.LayoutParams(
                        -1,
                        dp(22)));

        tile.setOnClickListener(
                v ->
                        launchProjection(
                                app.component));

        return tile;
    }

