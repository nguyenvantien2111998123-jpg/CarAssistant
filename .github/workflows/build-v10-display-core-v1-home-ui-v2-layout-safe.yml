          '''

          source = replace_method(
              source,
              "    private void buildDashboard()",
              dashboard
          )

          rebuild_dock = r'''
    private void rebuildDock() {

        if (dock == null) {
            return;
        }

        dock.removeAllViews();

        ArrayList<AppInfo> quickApps =
                getQuickLaunchApps();

        int count =
                Math.min(
                        4,
                        quickApps.size());

        for (int i = 0;
             i < count;
             i++) {

            final AppInfo app =
                    quickApps.get(i);

            dock.addView(
                    quickLaunchTile(app),
                    sidebarQuickParams());
        }
    }

    private ArrayList<AppInfo> getQuickLaunchApps() {

        ArrayList<AppInfo> selected =
                new ArrayList<>();

        String[] preferredPackages = {
                "com.google.android.apps.maps",
                "com.google.android.youtube",
                "com.zing.zalo",
                "com.spotify.music"
        };

        for (String packageName :
                preferredPackages) {

            if (selected.size() >= 4) {
                break;
            }

            for (AppInfo app : apps) {

                if (packageName.equals(
                        app.component.getPackageName())) {

                    boolean duplicate = false;

                    for (AppInfo existing :
                            selected) {

                        if (existing.component.equals(
                                app.component)) {

                            duplicate = true;
                            break;
                        }
                    }

                    if (!duplicate) {
                        selected.add(app);
                    }

                    break;
                }
            }
        }

        if (selected.size() < 4) {

            for (AppInfo app : apps) {

                if (selected.size() >= 4) {
                    break;
                }

                boolean duplicate = false;

                for (AppInfo existing :
                        selected) {

                    if (existing.component.equals(
                            app.component)) {

                        duplicate = true;
                        break;
                    }
                }

                if (!duplicate) {
                    selected.add(app);
                }
            }
        }

        return selected;
    }

    private LinearLayout quickLaunchTile(
            AppInfo app) {

        LinearLayout tile =
                new LinearLayout(this);

        tile.setOrientation(
                LinearLayout.VERTICAL);

        tile.setGravity(
                Gravity.CENTER);

        GradientDrawable background =
                new GradientDrawable();

        background.setColor(
                Color.rgb(
                        22,
                        27,
                        33));

        background.setCornerRadius(
                dp(14));

        tile.setBackground(background);

        ImageView icon =
                new ImageView(this);

        Drawable drawable =
                getRealAppIcon(
                        app.component.getPackageName());

        if (drawable != null) {
            icon.setImageDrawable(drawable);
        }

        icon.setScaleType(
                ImageView.ScaleType.CENTER_INSIDE);

        tile.addView(
                icon,
                new LinearLayout.LayoutParams(
                        dp(42),
                        dp(42)));

        TextView name =
                text(
                        app.name,
                        8,
                        Color.WHITE);

        name.setGravity(
                Gravity.CENTER);

        name.setMaxLines(1);

        tile.addView(
                name,
                new LinearLayout.LayoutParams(
                        -1,
                        dp(18)));

        tile.setOnClickListener(
                v -> launchProjection(
                        app.component));

        return tile;
    }
          '''

          source = replace_method(
              source,
              "    private void rebuildDock()",
              rebuild_dock
          )

          app_tile = r'''
    private LinearLayout appTile(
            AppInfo app) {

        LinearLayout tile =
                new LinearLayout(this);

        tile.setOrientation(
                LinearLayout.VERTICAL);

        tile.setGravity(
                Gravity.CENTER);

        GradientDrawable background =
                new GradientDrawable();

