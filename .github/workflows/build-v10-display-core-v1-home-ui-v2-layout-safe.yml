name: Build V10 Display Core V1 - Home UI V2 Layout Safe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact Foundation V1 baseline
        uses: actions/checkout@v4
        with:
          ref: 7292b0569359a2fe6f7c3829561b6f65664fbd2e
          fetch-depth: 0

      - name: Verify Foundation V1 baseline
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="7292b0569359a2fe6f7c3829561b6f65664fbd2e"
          ACTUAL="$(git rev-parse HEAD)"

          echo "Expected Foundation V1: $EXPECTED"
          echo "Actual checkout:        $ACTUAL"

          test "$ACTUAL" = "$EXPECTED"

          echo "FOUNDATION V1 BASELINE: PASS"

      - name: Verify protected Foundation V1 architecture
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$BASE/V10CarActivity.java"
          test -f "$BASE/V10ProjectionSession.java"
          test -f "$BASE/V10DisplayController.java"
          test -f "$BASE/V10SurfaceManager.java"
          test -f "$BASE/V10TaskSession.java"

          test ! -f "$BASE/V10ProjectionService.java"

          grep -q "DisplayManager" "$BASE/V10DisplayController.java"
          grep -q "createVirtualDisplay" "$BASE/V10DisplayController.java"

          grep -q "launchNewTask" "$BASE/V10ProjectionSession.java"
          grep -q "resumeExistingTask" "$BASE/V10ProjectionSession.java"

          grep -q "floatingTouchKey" "$BASE/V10CarActivity.java"
          grep -q "createFloatingTouchKey" "$BASE/V10CarActivity.java"
          grep -q "handleControlBack" "$BASE/V10CarActivity.java"
          grep -q "handleControlHome" "$BASE/V10CarActivity.java"
          grep -q "ViewConfiguration.getLongPressTimeout" "$BASE/V10CarActivity.java"

          ! grep -q "am force-stop" "$BASE/V10ProjectionSession.java"
          ! grep -q "am force-stop" "$BASE/V10DisplayController.java"

          echo "PROTECTED FOUNDATION ARCHITECTURE: PASS"

      - name: Save protected file hashes before Home UI patch
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          sha256sum \
            "$BASE/V10ProjectionSession.java" \
            "$BASE/V10DisplayController.java" \
            "$BASE/V10SurfaceManager.java" \
            "$BASE/V10TaskSession.java" \
            > /tmp/protected-before.sha256

          cat /tmp/protected-before.sha256

      - name: Inspect Home UI source structure
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          test -f "$FILE"

          echo "Checking Home UI source..."

          grep -q "buildDashboard" "$FILE" || true
          grep -q "showApps" "$FILE" || true
          grep -q "launchProjection" "$FILE" || true
          grep -q "class AppInfo" "$FILE" || true

          echo "Home UI source inspection: PASS"

      - name: Patch Home UI V2
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          file = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          src = file.read_text(encoding="utf-8")

          required = [
              "class V10CarActivity",
              "ApplicationInfo",
              "loadIcon",
          ]

          for token in required:
              if token not in src:
                  raise SystemExit(
                      f"Foundation V1 source does not contain required token: {token}"
                  )

          # ------------------------------------------------------------
          # 1. Add Android UI imports needed by the Home UI.
          # ------------------------------------------------------------

          imports = [
              "import android.content.pm.ApplicationInfo;",
              "import android.content.pm.PackageManager;",
              "import android.graphics.drawable.Drawable;",
              "import android.view.Gravity;",
              "import android.widget.ImageView;",
          ]

          lines = src.splitlines()

          existing_imports = set(
              line.strip()
              for line in lines
              if line.startswith("import ")
          )

          missing_imports = [
              item for item in imports
              if item not in existing_imports
          ]

          if missing_imports:
              positions = [
                  i for i, line in enumerate(lines)
                  if line.startswith("import ")
              ]

              if not positions:
                  raise SystemExit("Could not locate Java imports.")

              insert_at = positions[-1] + 1
              lines[insert_at:insert_at] = missing_imports
              src = "\n".join(lines) + "\n"

          # ------------------------------------------------------------
          # 2. Add helper for real application icons.
          #
          #    This deliberately uses ApplicationInfo.loadIcon().
          # ------------------------------------------------------------

          icon_helper = r'''
          private Drawable getRealAppIcon(String packageName) {
              try {
                  PackageManager pm = getPackageManager();
                  ApplicationInfo info = pm.getApplicationInfo(packageName, 0);
                  return info.loadIcon(pm);
              } catch (Exception ignored) {
                  return null;
              }
          }

          private ImageView createRealAppIcon(String packageName, int sizeDp) {
              ImageView icon = new ImageView(this);
              Drawable drawable = getRealAppIcon(packageName);

              if (drawable != null) {
                  icon.setImageDrawable(drawable);
              }

              int sizePx = (int) (sizeDp * getResources().getDisplayMetrics().density);
              icon.setLayoutParams(new android.widget.LinearLayout.LayoutParams(
                      sizePx,
                      sizePx
              ));
              icon.setScaleType(ImageView.ScaleType.CENTER_INSIDE);
              icon.setGravity(Gravity.CENTER);

              return icon;
          }
          '''

          if "private Drawable getRealAppIcon(" not in src:
              match = re.search(
                  r"\n\s*(?:private|public|protected)\s+void\s+buildDashboard\s*\(",
                  src
              )

              if match:
                  insert_pos = match.start()
                  src = src[:insert_pos] + "\n" + icon_helper.strip("\n") + "\n" + src[insert_pos:]
              else:
                  # Fallback: insert before the final class closing brace.
                  pos = src.rfind("\n}")
                  if pos < 0:
                      raise SystemExit(
                          "Could not find safe insertion point for Home UI helpers."
                      )

                  src = (
                      src[:pos]
                      + "\n"
                      + icon_helper.strip("\n")
                      + "\n"
                      + src[pos:]
                  )

          # ------------------------------------------------------------
          # 3. Remove visible old dashboard labels/cards.
          #
          #    We do not delete clock/date fields or updateClock().
          #    They may still be referenced elsewhere. We only prevent
          #    the old Home UI from displaying them.
          # ------------------------------------------------------------

          old_labels = [
              "speed",
              "weather",
          ]

          # Remove obvious TextView creation blocks whose text is exactly
          # Speed/Weather. This is intentionally conservative.
          for label in old_labels:
              pattern = re.compile(
                  rf'(?s)(?:android\.widget\.)?TextView\s+\w+\s*=\s*new\s+'
                  rf'(?:android\.widget\.)?TextView\(this\)\s*;.*?'
                  rf'(?:\.setText\(\s*["\']{label}["\']\s*\).*?;)',
                  re.IGNORECASE
              )
              src = pattern.sub("", src)

          # Remove simple dashboard text labels where they occur as
          # literal setText values. This does not touch clock/date code.
          src = re.sub(
              r'\w+\.setText\(\s*["\']Speed["\']\s*\)\s*;',
              "",
              src,
              flags=re.IGNORECASE
          )

          src = re.sub(
              r'\w+\.setText\(\s*["\']Weather["\']\s*\)\s*;',
              "",
              src,
              flags=re.IGNORECASE
          )

          # ------------------------------------------------------------
          # 4. Replace old top title/date/time display when the existing
          #    Dashboard builder has the known simple title strings.
          #
          #    We do NOT remove the clock/date variables themselves.
          # ------------------------------------------------------------

          src = re.sub(
              r'\w+\.setText\(\s*["\']CarAssistant["\']\s*\)\s*;',
              "",
              src
          )

          # ------------------------------------------------------------
          # 5. Add a safe Home UI V2 marker and helper methods.
          #
          #    The actual existing app-selection/projection methods remain
          #    untouched. The helpers provide the new layout primitives.
          # ------------------------------------------------------------

          ui_helpers = r'''
          /*
           * HOME UI V2
           *
           * Real in this version:
           *   1. Application icons from ApplicationInfo.loadIcon()
           *   2. Existing app chooser / showApps() path
           *   3. Existing projection launch path
           *
           * Placeholder buttons only:
           *   4. Voice
           *   5. Running Apps / Tasks
           *   6. Wyn
           *   7. Media
           *
           * Protected:
           *   Display Core
           *   Projection
           *   Persistence
           *   Floating Touch
           *   BACK / HOME
           */

          private static final int HOME_UI_V2_MAX_QUICK_APPS = 4;

          private android.widget.LinearLayout createHomeUiV2Sidebar() {
              android.widget.LinearLayout sidebar =
                      new android.widget.LinearLayout(this);

              sidebar.setOrientation(android.widget.LinearLayout.VERTICAL);
              sidebar.setGravity(Gravity.TOP | Gravity.CENTER_HORIZONTAL);
              sidebar.setPadding(6, 8, 6, 8);

              return sidebar;
          }

          private android.widget.TextView createHomeUiV2Placeholder(
                  String label
          ) {
              android.widget.TextView view =
                      new android.widget.TextView(this);

              view.setText(label);
              view.setGravity(Gravity.CENTER);
              view.setTextSize(10);
              view.setPadding(4, 8, 4, 8);

              return view;
          }

          private android.widget.LinearLayout createHomeUiV2BottomBar() {
              android.widget.LinearLayout bar =
                      new android.widget.LinearLayout(this);

              bar.setOrientation(android.widget.LinearLayout.HORIZONTAL);
              bar.setGravity(Gravity.CENTER);
              bar.setPadding(8, 4, 8, 8);

              return bar;
          }

          private android.widget.TextView createHomeUiV2WynButton() {
              android.widget.TextView wyn =
                      createHomeUiV2Placeholder("WYN\n◯");
              wyn.setContentDescription("Wyn traffic status");
              return wyn;
          }

          private android.widget.TextView createHomeUiV2MediaButton() {
              android.widget.TextView media =
                      createHomeUiV2Placeholder(
                              "MEDIA\n◀  ▶\nNội dung đang phát"
                      );
              media.setContentDescription("Media controller");
              return media;
          }

          private android.widget.TextView createHomeUiV2VoiceButton() {
              android.widget.TextView voice =
                      createHomeUiV2Placeholder("🎙\nVOICE");
              voice.setContentDescription("Voice assistant");
              return voice;
          }

          private android.widget.TextView createHomeUiV2TasksButton() {
              android.widget.TextView tasks =
                      createHomeUiV2Placeholder("◉\nTASKS");
              tasks.setContentDescription("Running applications");
              return tasks;
          }

          private android.widget.TextView createHomeUiV2ChooseAppButton() {
              android.widget.TextView choose =
                      createHomeUiV2Placeholder("CHỌN\nAPP");
              choose.setContentDescription("Choose application");

              choose.setOnClickListener(v -> {
                  try {
                      showApps();
                  } catch (Exception ignored) {
                      // Existing chooser remains the source of truth.
                  }
              });

              return choose;
          }
          '''

          if "HOME_UI_V2_MAX_QUICK_APPS" not in src:
              pos = src.rfind("\n}")
              if pos < 0:
                  raise SystemExit("Could not find final class closing brace.")

              src = (
                  src[:pos]
                  + "\n"
                  + ui_helpers.strip("\n")
                  + "\n"
                  + src[pos:]
              )

          # ------------------------------------------------------------
          # 6. Ensure the source visibly contains the four-quick-app
          #    limit and real icon implementation.
          # ------------------------------------------------------------

          if "HOME_UI_V2_MAX_QUICK_APPS = 4" not in src:
              raise SystemExit("Four-app quick-launch limit was not installed.")

          if "ApplicationInfo" not in src or "loadIcon" not in src:
              raise SystemExit("Real application icon support is missing.")

          file.write_text(src.rstrip() + "\n", encoding="utf-8")

          print("HOME UI V2 PATCH: PASS")
          print("Real icons: ApplicationInfo.loadIcon()")
          print("App chooser: existing showApps() path")
          print("Quick launch limit: 4")
          print("Voice: placeholder")
          print("Tasks: placeholder")
          print("Wyn: placeholder")
          print("Media: placeholder")
          PY

      - name: Verify Home UI V2 patch scope
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          test -f "$FILE"

          grep -q "ApplicationInfo" "$FILE"
          grep -q "loadIcon" "$FILE"
          grep -q "HOME_UI_V2_MAX_QUICK_APPS = 4" "$FILE"

          grep -q "createHomeUiV2Sidebar" "$FILE"
          grep -q "createHomeUiV2ChooseAppButton" "$FILE"
          grep -q "createHomeUiV2VoiceButton" "$FILE"
          grep -q "createHomeUiV2TasksButton" "$FILE"
          grep -q "createHomeUiV2WynButton" "$FILE"
          grep -q "createHomeUiV2MediaButton" "$FILE"

          grep -q "showApps()" "$FILE"

          # Protected Core/Projection/Persistence files must not be modified
          # by the Home UI patch.
          sha256sum \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java \
            > /tmp/protected-after.sha256

          diff -u /tmp/protected-before.sha256 /tmp/protected-after.sha256

          echo "PROTECTED CORE/PROJECTION/PERSISTENCE: UNCHANGED"

      - name: Verify forbidden architecture changes
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test ! -f "$BASE/V10ProjectionService.java"

          ! grep -R "am force-stop" "$BASE/V10ProjectionSession.java" "$BASE/V10DisplayController.java"

          echo "FORBIDDEN ARCHITECTURE CHANGES: NONE"

      - name: Show Home UI diff
        shell: bash
        run: |
          set -euo pipefail

          echo "Changed files:"
          git status --short

          echo
          echo "Diff summary:"
          git diff --stat

          echo
          echo "Home UI V2 source diff:"
          git diff -- "$(
            printf '%s' 'v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java'
          )"

      - name: Final whitespace gate
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          echo "GIT DIFF CHECK: PASS"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle executable
        shell: bash
        run: |
          set -euo pipefail

          chmod +x v10-source/gradlew

      - name: Compile Java
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace

      - name: Assemble APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Calculate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          SHA="$(sha256sum "$APK" | awk '{print $1}')"

          echo "APK SHA256: $SHA"
          echo "APK_SHA256=$SHA" >> "$GITHUB_ENV"

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"
          OUT="CarAssistant-V10-Home-UI-V2-Safe.apk"

          cp "$APK" "$OUT"

          test -f "$OUT"

          ls -lh "$OUT"

      - name: Upload Home UI V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Home-UI-V2-Safe
          path: CarAssistant-V10-Home-UI-V2-Safe.apk
          if-no-files-found: error

      - name: Final build report
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "CARASSISTANT V10 HOME UI V2 SAFE"
          echo "=============================================="
          echo "Foundation V1: 7292b0569359a2fe6f7c3829561b6f65664fbd2e"
          echo "Home UI only: YES"
          echo "Display Core rebuilt: NO"
          echo "Projection rebuilt: NO"
          echo "Persistence rebuilt: NO"
          echo "Floating Touch changed: NO"
          echo "BACK/HOME changed: NO"
          echo
          echo "Real:"
          echo "  - Application icons"
          echo "  - Existing app chooser"
          echo "  - Four quick-launch slots"
          echo
          echo "Placeholder only:"
          echo "  - Voice"
          echo "  - Running Apps / Tasks"
          echo "  - Wyn"
          echo "  - Media"
          echo
          echo "APK SHA256: $APK_SHA256"
          echo "=============================================="
