name: Build Car Assistant V10 Launcher

on:
  workflow_dispatch:

env:
  GRADLE_VERSION: "8.13"

jobs:
  build:
    name: Build V10 Launcher
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================

      - name: Checkout CarAssistant
        uses: actions/checkout@v4


      # ==================================================
      # 2. JAVA 17
      # ==================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==================================================
      # 3. GRADLE 8.13
      # ==================================================

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-disabled: true


      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "GRADLE"
          echo "=================================================="

          gradle --version

          gradle --version | grep -q "Gradle 8.13"


      # ==================================================
      # 4. EXTRACT INTERNAL V9 SOURCE
      # ==================================================

      - name: Extract internal V9 source
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "EXTRACT INTERNAL V9 SOURCE"
          echo "=================================================="

          test -f "CarAssistant-V9-Source.zip"

          rm -rf v9-source
          rm -rf v9-extract

          mkdir -p v9-extract

          unzip -q "CarAssistant-V9-Source.zip" \
            -d v9-extract

          if [ -d "v9-extract/v9-source" ]; then
            mv v9-extract/v9-source v9-source
          else
            echo "ERROR: v9-source directory not found inside ZIP."
            find v9-extract -maxdepth 3 -type f | sort
            exit 1
          fi

          rm -rf v9-extract

          echo ""
          echo "V9 source extracted:"
          find v9-source -maxdepth 2 -type f | sort | head -100


      # ==================================================
      # 5. VERIFY INTERNAL V9 SOURCE
      # ==================================================

      - name: Verify internal V9 source
        shell: bash
        run: |
          set -e

          cd v9-source

          echo "=================================================="
          echo "VERIFY V9 SOURCE"
          echo "=================================================="

          test -f build.gradle
          test -f settings.gradle

          test -f app/build.gradle

          test -f app/libs/aasdk-legacy.dex
          test -f app/libs/aasdk-legacy.jar
          test -f app/libs/xposed-api-82.jar

          test -f app/src/main/assets/xposed_init

          grep -R -q \
            'com.google.android.apps.auto.sdk.CarActivityService' \
            app/src/main/java

          grep -R -q \
            'com.google.android.apps.auto.sdk.CarActivity' \
            app/src/main/java

          grep -R -q \
            'createVirtualDisplay' \
            app/src/main/java

          grep -q \
            'com.carassistant.v9.aabridge.AACastBridge' \
            app/src/main/assets/xposed_init

          if grep -R -q \
            'androidx.car.app.CarAppService' \
            app/src/main/java; then
            echo "ERROR: AndroidX CarAppService detected."
            exit 1
          fi

          echo "Internal V9 source OK."


      # ==================================================
      # 6. ADD V10 LAUNCHER
      # ==================================================

      - name: Add V10 launcher source
        shell: bash
        run: |
          set -e

          cd v9-source

          echo "=================================================="
          echo "ADD V10 LAUNCHER"
          echo "=================================================="

          mkdir -p app/src/main/java/com/carassistant/v9

          cat > app/src/main/java/com/carassistant/v9/CarAssistantLauncherView.java <<'JAVA'
package com.carassistant.v9;

import android.content.ComponentName;
import android.content.Context;
import android.content.Intent;
import android.content.pm.ActivityInfo;
import android.content.pm.PackageManager;
import android.content.pm.ResolveInfo;
import android.graphics.Color;
import android.graphics.Typeface;
import android.os.Handler;
import android.os.Looper;
import android.view.Gravity;
import android.view.View;
import android.widget.Button;
import android.widget.FrameLayout;
import android.widget.GridLayout;
import android.widget.ImageButton;
import android.widget.ImageView;
import android.widget.LinearLayout;
import android.widget.TextView;

import java.util.ArrayList;
import java.util.Collections;
import java.util.Comparator;
import java.util.List;

public final class CarAssistantLauncherView extends FrameLayout {

    public interface Callback {
        void openV9();
    }

    private final Callback callback;
    private final GridLayout grid;
    private final Handler handler = new Handler(Looper.getMainLooper());

    public CarAssistantLauncherView(
            Context context,
            Callback callback
    ) {
        super(context);

        this.callback = callback;

        setBackgroundColor(Color.BLACK);

        LinearLayout root = new LinearLayout(context);
        root.setOrientation(LinearLayout.VERTICAL);
        root.setPadding(24, 20, 24, 24);

        LayoutParams rootParams =
                new LayoutParams(
                        LayoutParams.MATCH_PARENT,
                        LayoutParams.MATCH_PARENT
                );

        addView(root, rootParams);

        LinearLayout header =
                new LinearLayout(context);

        header.setGravity(Gravity.CENTER_VERTICAL);
        header.setPadding(4, 0, 4, 16);

        TextView title =
                new TextView(context);

        title.setText("Car Assistant");
        title.setTextColor(Color.WHITE);
        title.setTextSize(24);
        title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);

        LinearLayout.LayoutParams titleParams =
                new LinearLayout.LayoutParams(
                        0,
                        LayoutParams.WRAP_CONTENT,
                        1
                );

        header.addView(title, titleParams);

        Button refresh =
                new Button(context);

        refresh.setText("↻");

        refresh.setOnClickListener(
                v -> reloadApps()
        );

        header.addView(
                refresh,
                new LinearLayout.LayoutParams(
                        64,
                        64
                )
        );

        root.addView(header);

        grid =
                new GridLayout(context);

        grid.setColumnCount(4);
        grid.setUseDefaultMargins(false);

        root.addView(
                grid,
                new LinearLayout.LayoutParams(
                        LayoutParams.MATCH_PARENT,
                        0,
                        1
                )
        );

        reloadApps();

        createFloatingV9Button();
    }

    private void createFloatingV9Button() {

        Button v9 =
                new Button(getContext());

        v9.setText("V9");
        v9.setTextColor(Color.WHITE);
        v9.setTextSize(13);
        v9.setTypeface(Typeface.DEFAULT, Typeface.BOLD);

        v9.setOnClickListener(
                v -> {
                    if (callback != null) {
                        callback.openV9();
                    }
                }
        );

        LayoutParams params =
                new LayoutParams(
                        92,
                        92,
                        Gravity.RIGHT | Gravity.BOTTOM
                );

        params.setMargins(0, 0, 20, 20);

        addView(v9, params);
    }

    private void reloadApps() {

        grid.removeAllViews();

        PackageManager pm =
                getContext().getPackageManager();

        Intent intent =
                new Intent(Intent.ACTION_MAIN);

        intent.addCategory(
                Intent.CATEGORY_LAUNCHER
        );

        List<ResolveInfo> apps =
                pm.queryIntentActivities(
                        intent,
                        PackageManager.MATCH_ALL
                );

        Collections.sort(
                apps,
                new Comparator<ResolveInfo>() {
                    @Override
                    public int compare(
                            ResolveInfo a,
                            ResolveInfo b
                    ) {
                        String aa =
                                String.valueOf(
                                        a.loadLabel(pm)
                                );

                        String bb =
                                String.valueOf(
                                        b.loadLabel(pm)
                                );

                        return aa.compareToIgnoreCase(bb);
                    }
                }
        );

        for (ResolveInfo info : apps) {

            ActivityInfo activity =
                    info.activityInfo;

            if (activity == null) {
                continue;
            }

            if (getContext()
                    .getPackageName()
                    .equals(activity.packageName)) {
                continue;
            }

            addApp(
                    pm,
                    info
            );
        }
    }

    private void addApp(
            PackageManager pm,
            ResolveInfo info
    ) {

        ActivityInfo activity =
                info.activityInfo;

        LinearLayout item =
                new LinearLayout(getContext());

        item.setOrientation(
                LinearLayout.VERTICAL
        );

        item.setGravity(
                Gravity.CENTER
        );

        item.setPadding(
                8,
                8,
                8,
                8
        );

        ImageView icon =
                new ImageView(getContext());

        icon.setImageDrawable(
                info.loadIcon(pm)
        );

        item.addView(
                icon,
                new LinearLayout.LayoutParams(
                        76,
                        76
                )
        );

        TextView label =
                new TextView(getContext());

        label.setText(
                info.loadLabel(pm)
        );

        label.setTextColor(
                Color.WHITE
        );

        label.setTextSize(12);

        label.setGravity(
                Gravity.CENTER
        );

        label.setMaxLines(2);

        item.addView(
                label,
                new LinearLayout.LayoutParams(
                        LayoutParams.MATCH_PARENT,
                        48
                )
        );

        item.setOnClickListener(
                v -> launchPhoneApp(
                        activity.packageName,
                        activity.name
                )
        );

        GridLayout.LayoutParams params =
                new GridLayout.LayoutParams();

        params.width = 0;
        params.height =
                LayoutParams.WRAP_CONTENT;

        params.columnSpec =
                GridLayout.spec(
                        GridLayout.UNDEFINED,
                        1f
                );

        params.setMargins(
                4,
                4,
                4,
                4
        );

        grid.addView(
                item,
                params
        );
    }

    private void launchPhoneApp(
            String packageName,
            String activityName
    ) {

        String component =
                packageName +
                "/" +
                activityName;

        String command =
                "am start --display 0 -n " +
                shellQuote(component);

        try {

            Process process =
                    Runtime.getRuntime().exec(
                            new String[]{
                                    "su",
                                    "-c",
                                    command
                            }
                    );

            handler.postDelayed(
                    () -> {
                        try {
                            process.destroy();
                        } catch (Throwable ignored) {
                        }
                    },
                    3000
            );

        } catch (Throwable ignored) {
        }
    }

    private static String shellQuote(
            String value
    ) {

        return "'" +
                value.replace(
                        "'",
                        "'\\''"
                ) +
                "'";
    }
}
JAVA


      # ==================================================
      # 7. REPLACE AACAST CAR ACTIVITY
      # ==================================================

      - name: Replace AACast CarActivity with V10 controller
        shell: bash
        run: |
          set -e

          cd v9-source

          echo "=================================================="
          echo "REPLACE CAR ACTIVITY"
          echo "=================================================="

          find app/src/main/java \
            -type f \
            -name "AACastCarActivity.java" \
            -delete

          mkdir -p app/src/main/java/com/carassistant/v9

          cat > app/src/main/java/com/carassistant/v9/AACastCarActivity.java <<'JAVA'
package com.carassistant.v9;

import android.os.Bundle;
import android.os.Handler;
import android.os.Looper;

import com.google.android.apps.auto.sdk.CarActivity;

public final class AACastCarActivity extends CarActivity {

    public final Handler handler =
            new Handler(Looper.getMainLooper());

    private RootView root;
    private CarAssistantLauncherView launcher;

    private boolean resumed;
    private boolean showingV9;

    private final Runnable leaseTicker =
            new LeaseTicker(this);

    private void applyChrome() {

        try {
            getCarUiController()
                    .getStatusBarController()
                    .hideAppHeader();

            getCarUiController()
                    .getMenuController()
                    .hideMenuButton();

        } catch (RuntimeException ignored) {
        }

        if (root != null) {
            AppCatalog.immersive(root);
        }
    }

    private void stopLease() {

        resumed = false;

        handler.removeCallbacks(
                leaseTicker
        );

        DockStateProvider.visibleUntil = 0L;
    }

    @Override
    public void onCreate(Bundle bundle) {

        setTheme(
                R.style.Theme_AACast
        );

        super.onCreate(bundle);

        setIgnoreConfigChanges(-1);

        applyChrome();
    }

    @Override
    public void onResume() {

        super.onResume();

        resumed = true;

        if (showingV9) {
            showV9();
        } else {
            showLauncher();
        }
    }

    private void showLauncher() {

        showingV9 = false;

        if (root != null) {
            root.destroy();
            root = null;
        }

        launcher =
                new CarAssistantLauncherView(
                        this,
                        this::showV9
                );

        setContentView(launcher);
    }

    private void showV9() {

        showingV9 = true;

        if (launcher != null) {
            launcher = null;
        }

        if (root == null ||
                root.destroyed) {

            root =
                    new RootView(this);

            root.exitToAuto =
                    this::showLauncher;

            setContentView(root);
        } else {
            setContentView(root);
        }

        applyChrome();

        handler.removeCallbacks(
                leaseTicker
        );

        leaseTicker.run();
    }

    private void leaveCarActivity() {

        stopLease();

        super.onBackPressed();
    }

    @Override
    public void onPause() {

        stopLease();

        super.onPause();
    }

    @Override
    public void onStop() {

        stopLease();

        if (root != null) {
            root.destroy();
            root = null;
        }

        super.onStop();
    }

    @Override
    public void onDestroy() {

        stopLease();

        if (root != null) {
            root.destroy();
            root = null;
        }

        super.onDestroy();
    }

    @Override
    public void onBackPressed() {

        if (showingV9) {

            showLauncher();

            return;
        }

        if (root != null &&
                root.dismissOverlay()) {

            return;
        }

        leaveCarActivity();
    }

    @Override
    public void onWindowFocusChanged(
            boolean hasFocus,
            boolean touchMode
    ) {

        super.onWindowFocusChanged(
                hasFocus,
                touchMode
        );

        if (hasFocus &&
                resumed) {

            applyChrome();
        }
    }
}
JAVA


      # ==================================================
      # 8. ANDROID PACKAGE VISIBILITY
      # ==================================================

      - name: Add launcher package visibility
        shell: bash
        run: |
          set -e

          cd v9-source

          echo "=================================================="
          echo "PACKAGE VISIBILITY"
          echo "=================================================="

          python3 <<'PY'
from pathlib import Path

path = Path("app/src/main/AndroidManifest.xml")
text = path.read_text()

if "<queries>" not in text:
    block = """    <queries>
        <intent>
            <action android:name="android.intent.action.MAIN" />
            <category android:name="android.intent.category.LAUNCHER" />
        </intent>
    </queries>

"""

    marker = "<application"

    if marker not in text:
        raise SystemExit(
            "AndroidManifest.xml: <application> not found"
        )

    text = text.replace(
        marker,
        block + marker,
        1
    )

    path.write_text(text)
PY

          grep -q '<queries>' \
            app/src/main/AndroidManifest.xml

          grep -q \
            'android.intent.action.MAIN' \
            app/src/main/AndroidManifest.xml

          grep -q \
            'android.intent.category.LAUNCHER' \
            app/src/main/AndroidManifest.xml

          echo "Package visibility OK."


      # ==================================================
      # 9. VERIFY V10 SOURCE
      # ==================================================

      - name: Verify V10 launcher source
        shell: bash
        run: |
          set -e

          cd v9-source

          echo "=================================================="
          echo "VERIFY V10 SOURCE"
          echo "=================================================="

          test -f \
            app/src/main/java/com/carassistant/v9/CarAssistantLauncherView.java

          test -f \
            app/src/main/java/com/carassistant/v9/AACastCarActivity.java

          grep -q \
            'class CarAssistantLauncherView' \
            app/src/main/java/com/carassistant/v9/CarAssistantLauncherView.java

          grep -q \
            'queryIntentActivities' \
            app/src/main/java/com/carassistant/v9/CarAssistantLauncherView.java

          grep -q \
            'am start --display 0' \
            app/src/main/java/com/carassistant/v9/CarAssistantLauncherView.java

          grep -q \
            'openV9' \
            app/src/main/java/com/carassistant/v9/CarAssistantLauncherView.java

          grep -q \
            'showLauncher' \
            app/src/main/java/com/carassistant/v9/AACastCarActivity.java

          grep -q \
            'showV9' \
            app/src/main/java/com/carassistant/v9/AACastCarActivity.java

          echo "V10 source verification PASSED."


      # ==================================================
      # 10. VERIFY NO DUPLICATE CAR ACTIVITY
      # ==================================================

      - name: Verify no duplicate AACastCarActivity
        shell: bash
        run: |
          set -e

          cd v9-source

          COUNT=$(
            grep -R -l \
              'class AACastCarActivity' \
              app/src/main/java \
              --include='*.java' \
            | wc -l
          )

          echo "AACastCarActivity definitions: $COUNT"

          test "$COUNT" -eq 1


      # ==================================================
      # 11. VERIFY BUILD CONFIG
      # ==================================================

      - name: Verify build configuration
        shell: bash
        run: |
          set -e

          cd v9-source

          grep -q \
            'com.android.application' \
            build.gradle

          grep -q \
            '8.13.0' \
            build.gradle

          grep -q \
            'com.carassistant.v9' \
            app/build.gradle

          grep -q \
            'minifyEnabled false' \
            app/build.gradle

          grep -q \
            'aasdk-legacy.dex' \
            app/build.gradle

          echo "Build configuration OK."


      # ==================================================
      # 12. GENERATE GRADLE WRAPPER
      # ==================================================

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -e

          cd v9-source

          rm -rf gradle/wrapper

          gradle wrapper \
            --gradle-version "$GRADLE_VERSION" \
            --distribution-type bin

          chmod +x gradlew

          ./gradlew --version


      # ==================================================
      # 13. CLEAN
      # ==================================================

      - name: Clean V10 build
        shell: bash
        run: |
          set -e

          cd v9-source

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ==================================================
      # 14. DEBUG BUILD
      # ==================================================

      - name: Build V10 debug APK
        shell: bash
        run: |
          set -e

          cd v9-source

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace


      # ==================================================
      # 15. VERIFY DEBUG APK
      # ==================================================

      - name: Verify V10 debug APK
        shell: bash
        run: |
          set -e

          cd v9-source

          APK=$(find \
            app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -1)

          test -n "$APK"
          test -f "$APK"

          echo "Debug APK:"
          echo "$APK"

          echo "APK size:"
          ls -lh "$APK"

          DEX_COUNT=$(
            unzip -l "$APK" |
            grep -E 'classes[0-9]*\.dex' |
            wc -l
          )

          echo "DEX count: $DEX_COUNT"

          test "$DEX_COUNT" -ge 2


      # ==================================================
      # 16. VERIFY LEGACY SDK
      # ==================================================

      - name: Verify legacy Android Auto SDK
        shell: bash
        run: |
          set -e

          cd v9-source

          APK=$(find \
            app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -1)

          rm -rf /tmp/v10-debug-dex
          mkdir -p /tmp/v10-debug-dex

          unzip -q "$APK" \
            'classes*.dex' \
            -d /tmp/v10-debug-dex

          FOUND=0

          for dex in /tmp/v10-debug-dex/classes*.dex; do

            strings "$dex" \
              > /tmp/v10-dex-strings.txt

            if grep -q \
              'com/google/android/apps/auto/sdk/CarActivityService' \
              /tmp/v10-dex-strings.txt; then

              FOUND=1
              break
            fi

          done

          test "$FOUND" -eq 1

          echo "Legacy CarActivityService found."


      # ==================================================
      # 17. VERIFY MANIFEST
      # ==================================================

      - name: Verify Android Auto manifest
        shell: bash
        run: |
          set -e

          cd v9-source

          grep -q \
            'com.google.android.gms.car.application' \
            app/src/main/AndroidManifest.xml

          grep -q \
            'CATEGORY_PROJECTION' \
            app/src/main/AndroidManifest.xml

          grep -q \
            'AACastCarService' \
            app/src/main/AndroidManifest.xml

          echo "Android Auto manifest OK."


      # ==================================================
      # 18. RELEASE BUILD
      # ==================================================

      - name: Build V10 release APK
        shell: bash
        run: |
          set -e

          cd v9-source

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace


      # ==================================================
      # 19. LOCATE RELEASE APK
      # ==================================================

      - name: Locate V10 release APK
        shell: bash
        run: |
          set -e

          cd v9-source

          APK=$(find \
            app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."

            find \
              app/build/outputs \
              -type f \
              | sort

            exit 1
          fi

          echo "Release APK:"
          echo "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/CarAssistant-V10-Launcher.apk"


      # ==================================================
      # 20. VERIFY RELEASE APK
      # ==================================================

      - name: Verify V10 release APK
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/CarAssistant-V10-Launcher.apk"

          test -f "$APK"

          echo "=================================================="
          echo "V10 RELEASE APK"
          echo "=================================================="

          ls -lh "$APK"

          DEX_COUNT=$(
            unzip -l "$APK" |
            grep -E 'classes[0-9]*\.dex' |
            wc -l
          )

          echo "DEX count: $DEX_COUNT"

          test "$DEX_COUNT" -ge 2

          unzip -l "$APK" |
            grep -q 'assets/xposed_init'

          unzip -p "$APK" \
            assets/xposed_init |
            grep -q \
              'com.carassistant.v9.aabridge.AACastBridge'


      # ==================================================
      # 21. VERIFY V10 APK CONTENT
      # ==================================================

      - name: Verify V10 launcher in APK
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/CarAssistant-V10-Launcher.apk"

          rm -rf /tmp/v10-release-dex
          mkdir -p /tmp/v10-release-dex

          unzip -q "$APK" \
            'classes*.dex' \
            -d /tmp/v10-release-dex

          FOUND_LAUNCHER=0
          FOUND_CAR_ACTIVITY=0

          for dex in /tmp/v10-release-dex/classes*.dex; do

            strings "$dex" \
              > /tmp/v10-release-strings.txt

            if grep -q \
              'com/carassistant/v9/CarAssistantLauncherView' \
              /tmp/v10-release-strings.txt; then
              FOUND_LAUNCHER=1
            fi

            if grep -q \
              'com/google/android/apps/auto/sdk/CarActivityService' \
              /tmp/v10-release-strings.txt; then
              FOUND_CAR_ACTIVITY=1
            fi

          done

          test "$FOUND_LAUNCHER" -eq 1
          test "$FOUND_CAR_ACTIVITY" -eq 1

          echo "V10 launcher class found."
          echo "Legacy CarActivityService found."


      # ==================================================
      # 22. SHA256
      # ==================================================

      - name: SHA256
        shell: bash
        run: |
          set -e

          sha256sum \
            CarAssistant-V10-Launcher.apk \
            > CarAssistant-V10-Launcher.apk.sha256

          cat CarAssistant-V10-Launcher.apk.sha256


      # ==================================================
      # 23. PACKAGE
      # ==================================================

      - name: Package V10 release
        shell: bash
        run: |
          set -e

          rm -rf v10-release
          mkdir -p v10-release

          cp \
            CarAssistant-V10-Launcher.apk \
            v10-release/

          cp \
            CarAssistant-V10-Launcher.apk.sha256 \
