name: Build Car Assistant V8-AACast Android Auto

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_VERSION: "8.7"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate V8 Android Auto source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf carapp
          mkdir -p \
            carapp/src/main/java/com/carassistant/v8/car \
            carapp/src/main/res/values \
            carapp/src/main/res/xml

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "CarAssistantV8"
          include(":carapp")
          include(":system")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > carapp/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.carassistant.v8.car'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.carassistant.v8'
                  minSdk 28
                  targetSdk 35
                  versionCode 801
                  versionName '8.0-AACast-AndroidAuto'
              }
          }

          dependencies {
              implementation 'androidx.car.app:app:1.7.0'
          }
          EOF

          cat > carapp/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Car Assistant V8-AACast</string>
          </resources>
          EOF

          cat > carapp/src/main/res/xml/automotive_app_desc.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <automotiveApp>
              <uses name="template" />
          </automotiveApp>
          EOF

          cat > carapp/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="androidx.car.app.ACCESS_SURFACE" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <!-- Android Auto declaration -->
                  <meta-data
                      android:name="com.google.android.gms.car.application"
                      android:resource="@xml/automotive_app_desc" />

                  <!-- Android Auto Car App Service -->
                  <service
                      android:name=".V8CarAppService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="androidx.car.app.CarAppService">

                      <intent-filter>

                          <action
                              android:name="androidx.car.app.CarAppService" />

                          <category
                              android:name="androidx.car.app.category.NAVIGATION" />

                      </intent-filter>

                      <meta-data
                          android:name="androidx.car.app.minCarApiLevel"
                          android:value="1" />

                  </service>

              </application>

          </manifest>
          EOF

          cat > carapp/src/main/java/com/carassistant/v8/car/V8CarAppService.kt <<'EOF'
          package com.carassistant.v8.car

          import androidx.car.app.CarAppService
          import androidx.car.app.Session
          import androidx.car.app.validation.HostValidator

          class V8CarAppService : CarAppService() {

              override fun createHostValidator(): HostValidator {
                  return HostValidator.ALLOW_ALL_HOSTS_VALIDATOR
              }

              override fun onCreateSession(): Session {
                  return V8Session()
              }
          }
          EOF

          cat > carapp/src/main/java/com/carassistant/v8/car/V8Session.kt <<'EOF'
          package com.carassistant.v8.car

          import android.content.Intent
          import androidx.car.app.CarContext
          import androidx.car.app.Screen
          import androidx.car.app.Session
          import androidx.car.app.model.Action
          import androidx.car.app.model.Pane
          import androidx.car.app.model.PaneTemplate
          import androidx.car.app.model.Row
          import androidx.car.app.model.Template

          class V8Session : Session() {

              override fun onCreateScreen(intent: Intent): Screen {
                  return V8Screen(carContext)
              }
          }

          private class V8Screen(
              context: CarContext
          ) : Screen(context) {

              override fun onGetTemplate(): Template {

                  val row = Row.Builder()
                      .setTitle("Car Assistant V8-AACast")
                      .addText("Android Auto + AACast")
                      .build()

                  val pane = Pane.Builder()
                      .addRow(row)
                      .build()

                  return PaneTemplate.Builder(pane)
                      .setTitle("Car Assistant")
                      .setHeaderAction(Action.APP_ICON)
                      .build()
              }
          }
          EOF

          echo "======================================"
          echo "ANDROID AUTO DECLARATION"
          echo "======================================"

          grep -R -n -E \
            'com.google.android.gms.car.application|automotive_app_desc|androidx.car.app.category.NAVIGATION|androidx.car.app.CarAppService' \
            carapp/src/main

          echo "======================================"
          echo "V8 SOURCE GENERATED"
          echo "======================================"

      # ---------------------------------------------------------
      # SYSTEM MODULE
      # ---------------------------------------------------------
      #
      # QUAN TRỌNG:
      # Giữ nguyên phần system/Xposed của workflow V7-AACast
      # đang build thành công.
      #
      # Không thay đổi logic AACastSystemHook của V7 ở đây.
      #
      # ---------------------------------------------------------

      - name: Verify existing system module
        shell: bash
        run: |
          set -euo pipefail

          test -d system

          echo "System module:"
          find system -maxdepth 4 -type f | sort

          echo "Xposed init:"
          if [ -f system/src/main/assets/xposed_init ]; then
            cat system/src/main/assets/xposed_init
          fi

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /tmp/gradle

          /tmp/gradle/gradle-${GRADLE_VERSION}/bin/gradle \
            wrapper \
            --gradle-version "${GRADLE_VERSION}"

      - name: Build V8
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APKs
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Car APK ==="
          test -s carapp/build/outputs/apk/debug/carapp-debug.apk
          ls -lh carapp/build/outputs/apk/debug/carapp-debug.apk

          echo "=== System APK ==="
          test -s system/build/outputs/apk/debug/system-debug.apk
          ls -lh system/build/outputs/apk/debug/system-debug.apk

      - name: Verify Android Auto manifest
        shell: bash
        run: |
          set -euo pipefail

          APK="carapp/build/outputs/apk/debug/carapp-debug.apk"

          echo "Checking APK:"
          echo "$APK"

          if command -v aapt2 >/dev/null 2>&1; then
            aapt2 dump xmltree "$APK" AndroidManifest.xml \
              | grep -E \
              'com.google.android.gms.car.application|automotive_app_desc|androidx.car.app.category.NAVIGATION|androidx.car.app.CarAppService' \
              || true
          else
            echo "aapt2 not available; Gradle build already verified APK."
          fi

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          cp \
            carapp/build/outputs/apk/debug/carapp-debug.apk \
            release/CarAssistant-V8-AACast-AndroidAuto-carapp-debug.apk

          cp \
            system/build/outputs/apk/debug/system-debug.apk \
            release/CarAssistant-V8-AACast-AndroidAuto-system-debug.apk

          cd release

          sha256sum *.apk > SHA256SUMS.txt

          zip -9 \
            CarAssistant-V8-AACast-AndroidAuto-debug.zip \
            *.apk \
            SHA256SUMS.txt

      - name: Upload V8 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V8-AACast-AndroidAuto
          path: release/*
          if-no-files-found: error
