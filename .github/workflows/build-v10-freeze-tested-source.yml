name: Freeze CarAssistant V10 Tested Source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install PyYAML
        shell: bash
        run: python3 -m pip install --quiet pyyaml

      - name: Reproduce exact tested build source
        shell: bash
        env:
          SOURCE_WORKFLOW: .github/workflows/build-v10-display-core-v1-floating-touch-longpress-safe.yml
        run: |
          set -euo pipefail

          python3 -c '
          from pathlib import Path
          import os
          import subprocess
          import yaml

          workflow = Path(os.environ["SOURCE_WORKFLOW"])
          data = yaml.safe_load(workflow.read_text(encoding="utf-8"))

          steps = data["jobs"]["build"]["steps"]

          for number, step in enumerate(steps, 1):
              name = step.get("name", "unnamed")
              command = step.get("run")

              if not command:
                  print(f"SKIP {number}: {name}")
                  continue

              workdir = step.get("working-directory")
              print(f"RUN {number}: {name}")

              if workdir:
                  subprocess.run(
                      ["bash", "-euo", "pipefail", "-c", command],
                      cwd=workdir,
                      check=True
                  )
              else:
                  subprocess.run(
                      ["bash", "-euo", "pipefail", "-c", command],
                      check=True
                  )
          '

      - name: Verify frozen source structure
        shell: bash
        run: |
          set -euo pipefail

          SRC=v10-source
          JAVA="$SRC/app/src/main/java/com/hieptran/aacast/doudou"

          test -d "$SRC"
          test -f "$JAVA/V10CarActivity.java"
          test -f "$JAVA/V10ProjectionSession.java"
          test -f "$JAVA/V10SessionStore.java"
          test -f "$JAVA/V10TaskSession.java"
          test -f "$JAVA/V10DisplayController.java"
          test -f "$JAVA/V10SurfaceManager.java"

          if [ -f "$JAVA/V10ProjectionService.java" ]; then
            echo "ERROR: V10ProjectionService.java must not exist."
            exit 1
          fi

          grep -Fq 'private TextView floatingTouchKey;' \
            "$JAVA/V10CarActivity.java"

          grep -Fq 'private void createFloatingTouchKey()' \
            "$JAVA/V10CarActivity.java"

          grep -Fq 'floatingDownTime = SystemClock.uptimeMillis();' \
            "$JAVA/V10CarActivity.java"

          grep -Fq 'ViewConfiguration.getLongPressTimeout()' \
            "$JAVA/V10CarActivity.java"

          grep -Fq 'addFloatingMenuButton("BACK"' \
            "$JAVA/V10CarActivity.java"

          grep -Fq 'addFloatingMenuButton("HOME"' \
            "$JAVA/V10CarActivity.java"

          grep -Fq 'handleControlBack();' \
            "$JAVA/V10CarActivity.java"

          grep -Fq 'handleControlHome();' \
            "$JAVA/V10CarActivity.java"

          if grep -Fq 'floatingLastTap' \
            "$JAVA/V10CarActivity.java"; then
            echo "ERROR: legacy floatingLastTap remains."
            exit 1
          fi

          if grep -Fq 'session.recents()' \
            "$JAVA/V10CarActivity.java"; then
            echo "ERROR: RECENTS logic detected."
            exit 1
          fi

          if grep -Fq '"RECENTS"' \
            "$JAVA/V10CarActivity.java"; then
            echo "ERROR: RECENTS menu detected."
            exit 1
          fi

          if grep -Fq '"2 SCREEN"' \
            "$JAVA/V10CarActivity.java"; then
            echo "ERROR: 2 SCREEN logic detected."
            exit 1
          fi

          if grep -Fq '"3 SCREEN"' \
            "$JAVA/V10CarActivity.java"; then
            echo "ERROR: 3 SCREEN logic detected."
            exit 1
          fi

          if grep -Fq 'setLayoutModeExternal(' \
            "$JAVA/V10CarActivity.java"; then
            echo "ERROR: external layout mode logic detected."
            exit 1
          fi

          if grep -Fq 'V10ProjectionService' \
            "$JAVA/V10ProjectionSession.java"; then
            echo "ERROR: ProjectionService reference detected."
            exit 1
          fi

          if grep -Fq 'am force-stop' \
            "$JAVA/V10ProjectionSession.java"; then
            echo "ERROR: force-stop command detected."
            exit 1
          fi

          echo "Frozen source structure verification PASSED."

      - name: Compile frozen source
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace compileDebugJavaWithJavac

      - name: Build verification APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Create source manifest and hashes
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p freeze-output

          find v10-source \
            -type f \
            -not -path '*/build/*' \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > freeze-output/SOURCE-FILE-SHA256.txt

          git rev-parse HEAD > freeze-output/REPOSITORY-COMMIT.txt

          printf '%s\n' \
            'CarAssistant V10 Frozen Tested Source' \
            '=====================================' \
            'Source basis: build-v10-display-core-v1-floating-touch-longpress-safe.yml' \
            'Architecture: V10-6A + Display Core V1 + Floating Touch + Long Press SAFE' \
            'This source is the new baseline for future development.' \
            > freeze-output/BASELINE-MANIFEST.txt

          APK="$(find v10-source/app/build/outputs/apk/debug \
            -type f -name '*.apk' -print -quit)"

          test -n "$APK"

          sha256sum "$APK" > freeze-output/APK-SHA256.txt

      - name: Create frozen source ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf freeze-package
          mkdir -p freeze-package

          cp -a v10-source freeze-package/v10-source
          cp -a freeze-output freeze-package/

          rm -rf freeze-package/v10-source/.gradle
          rm -rf freeze-package/v10-source/app/build

          cd freeze-package

          zip -qr ../CarAssistant-V10-FROZEN-TESTED-SOURCE.zip \
            v10-source \
            freeze-output

          cd ..

          sha256sum \
            CarAssistant-V10-FROZEN-TESTED-SOURCE.zip \
            > CarAssistant-V10-FROZEN-TESTED-SOURCE.zip.sha256

      - name: Upload frozen source
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-FROZEN-TESTED-SOURCE
          path: |
            CarAssistant-V10-FROZEN-TESTED-SOURCE.zip
            CarAssistant-V10-FROZEN-TESTED-SOURCE.zip.sha256
            freeze-output/BASELINE-MANIFEST.txt
            freeze-output/SOURCE-FILE-SHA256.txt
            freeze-output/APK-SHA256.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload verification APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-FROZEN-TESTED-APK
          path: v10-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90
