name: CarAssistant Navigation V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Navigation V1 Baseline
        uses: actions/checkout@v4
        with:
          ref: 3f6f007dfbf0144cf01c2dc989fe686a7b0b3491
          fetch-depth: 1

      - name: Verify exact Navigation V1 baseline
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="3f6f007dfbf0144cf01c2dc989fe686a7b0b3491"
          ACTUAL="$(git rev-parse HEAD)"

          echo "EXPECTED=$EXPECTED"
          echo "ACTUAL=$ACTUAL"

          test "$ACTUAL" = "$EXPECTED"

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f v10-source/gradlew
          test -f v10-source/app/build.gradle
          test -f v10-source/app/src/main/AndroidManifest.xml
          test -f "$SRC/NavigationMapView.java"
          test -f "$SRC/V10CarActivity.java"

          grep -Fq \
            'org.maplibre.gl:android-sdk:11.11.0' \
            v10-source/app/build.gradle

          grep -Fq \
            'package com.carassistant.v10;' \
            "$SRC/NavigationMapView.java"

          echo "NAVIGATION V1 BASELINE: PASS"

      - name: Capture protected Core hashes
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          sha256sum \
            "$SRC/V10ProjectionSession.java" \
            "$SRC/V10DisplayController.java" \
            "$SRC/V10SurfaceManager.java" \
            "$SRC/V10TaskSession.java" \
            "$SRC/V10SessionStore.java" \
            > /tmp/core-before.sha256

          sha256sum \
            "$SRC/V10CarActivity.java" \
            > /tmp/activity-before.sha256

          echo "PROTECTED HASHES: CAPTURED"

      - name: Apply Patch 1 + Patch 2
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          cat > "$FILE" <<'JAVA'
          package com.carassistant.v10;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.inputmethod.InputMethodManager;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import org.maplibre.android.MapLibre;
          import org.maplibre.android.camera.CameraUpdateFactory;
          import org.maplibre.android.geometry.LatLng;

          import org.maplibre.android.location.LocationComponentActivationOptions;
          import org.maplibre.android.location.LocationComponentOptions;
          import org.maplibre.android.location.modes.CameraMode;

          import org.maplibre.android.maps.MapLibreMap;
          import org.maplibre.android.maps.MapView;

          import org.maplibre.android.style.layers.CircleLayer;
          import org.maplibre.android.style.layers.PropertyFactory;
          import org.maplibre.android.style.sources.GeoJsonSource;

          import org.maplibre.geojson.Feature;
          import org.maplibre.geojson.Point;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;

          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;

          import java.nio.charset.StandardCharsets;

          import java.util.ArrayList;
          import java.util.List;

          public final class NavigationMapView extends FrameLayout {

              private static final int LOCATION_REQUEST = 4101;

              private static final String DESTINATION_SOURCE =
                      "carassistant-navigation-v2-destination-source";

              private static final String DESTINATION_LAYER =
                      "carassistant-navigation-v2-destination-layer";

              private final MapView mapView;

              private final android.os.Handler mainHandler =
                      new android.os.Handler(
                              android.os.Looper.getMainLooper());

              private MapLibreMap map;

              private TextView recenterButton;

              private EditText searchInput;

              private TextView searchStatus;

              private LinearLayout resultsPanel;

              private LinearLayout resultsList;

              private GeoJsonSource destinationSource;

              public NavigationMapView(Context context) {
                  super(context);

                  setBackgroundColor(Color.BLACK);

                  MapLibre.getInstance(
                          context.getApplicationContext());

                  mapView = new MapView(context);

                  mapView.onCreate(
                          new Bundle());

                  addView(
                          mapView,
                          new LayoutParams(
                                  -1,
                                  -1));

                  mapView.getMapAsync(
                          this::onMapReady);
              }

              private void onMapReady(
                      MapLibreMap readyMap) {

                  map = readyMap;

                  map.getUiSettings()
                          .setCompassEnabled(false);

                  map.getUiSettings()
                          .setZoomGesturesEnabled(true);

                  map.getUiSettings()
                          .setScrollGesturesEnabled(true);

                  map.getUiSettings()
                          .setRotateGesturesEnabled(true);

                  map.getUiSettings()
                          .setTiltGesturesEnabled(false);

                  map.setStyle(
                          "https://tiles.openfreemap.org/styles/liberty",
                          style -> {

                              enableLocation();

                              createDestinationLayer();

                              createSearchUi();

                              createRecenterButton();
                          });
              }

              /*
               * ==========================================================
               * PATCH 1
               * AutoFollow + Recenter
               * ==========================================================
               */

              private void enableLocation() {

                  Context context = getContext();

                  if (context == null || map == null) {
                      return;
                  }

                  if (context.checkSelfPermission(
                          Manifest.permission.ACCESS_FINE_LOCATION)
                          != PackageManager.PERMISSION_GRANTED) {

                      if (context instanceof Activity) {

                          ((Activity) context)
                                  .requestPermissions(
                                          new String[]{
                                                  Manifest.permission.ACCESS_FINE_LOCATION,
                                                  Manifest.permission.ACCESS_COARSE_LOCATION
                                          },
                                          LOCATION_REQUEST);
                      }

                      return;
                  }

                  LocationComponentOptions options =
                          LocationComponentOptions
                                  .builder(context)
                                  .pulseEnabled(true)
                                  .trackingGesturesManagement(true)
                                  .build();

                  LocationComponentActivationOptions activation =
                          LocationComponentActivationOptions
                                  .builder(
                                          context,
                                          map.getStyle())
                                  .locationComponentOptions(
                                          options)
                                  .build();

                  map.getLocationComponent()
                          .activateLocationComponent(
                                  activation);

                  map.getLocationComponent()
                          .setLocationComponentEnabled(true);

                  /*
                   * PATCH 1:
                   * Navigation opens in AutoFollow mode.
                   */
                  map.getLocationComponent()
                          .setCameraMode(
                                  CameraMode.TRACKING_GPS);
              }

              private void createRecenterButton() {

                  if (recenterButton != null) {
                      return;
                  }

                  recenterButton =
                          new TextView(getContext());

                  recenterButton.setText("◎");

                  recenterButton.setTextSize(28);

                  recenterButton.setTextColor(
                          Color.WHITE);

                  recenterButton.setGravity(
                          Gravity.CENTER);

                  GradientDrawable background =
                          new GradientDrawable();

                  background.setColor(
                          Color.rgb(
                                  29,
                                  35,
                                  42));

                  background.setCornerRadius(
                          50f);

                  recenterButton.setBackground(
                          background);

                  recenterButton.setElevation(
                          12f);

                  recenterButton.setOnClickListener(
                          v -> recenter());

                  LayoutParams params =
                          new LayoutParams(
                                  dp(58),
                                  dp(58),
                                  Gravity.END
                                          | Gravity.BOTTOM);

                  params.setMargins(
                          0,
                          0,
                          dp(18),
                          dp(18));

                  addView(
                          recenterButton,
                          params);
              }

              public void recenter() {

                  if (map == null) {
                      return;
                  }

                  try {

                      if (!map.getLocationComponent()
                              .isLocationComponentEnabled()) {
                          return;
                      }

                      /*
                       * PATCH 1:
                       * Recenter re-enables AutoFollow.
                       */
                      map.getLocationComponent()
                              .setCameraMode(
                                      CameraMode.TRACKING_GPS);

                      map.getLocationComponent()
                              .zoomWhileTracking(
                                      16.0);

                  } catch (Exception ignored) {
                  }
              }

              /*
               * ==========================================================
               * PATCH 2
               * Search + Select Destination
               * ==========================================================
               */

              private void createSearchUi() {

                  if (searchInput != null) {
                      return;
                  }

                  LinearLayout box =
                          new LinearLayout(getContext());

                  box.setOrientation(
                          LinearLayout.VERTICAL);

                  box.setPadding(
                          dp(10),
                          dp(10),
                          dp(10),
                          dp(10));

                  GradientDrawable boxBackground =
                          new GradientDrawable();

                  boxBackground.setColor(
                          Color.rgb(
                                  15,
                                  20,
                                  26));

                  boxBackground.setCornerRadius(
                          dp(16));

                  box.setBackground(
                          boxBackground);

                  searchInput =
                          new EditText(getContext());

                  searchInput.setSingleLine(true);

                  searchInput.setTextColor(
                          Color.WHITE);

                  searchInput.setHintTextColor(
                          Color.LTGRAY);

                  searchInput.setHint(
                          "Tìm địa điểm...");

                  searchInput.setTextSize(15);

                  box.addView(
                          searchInput,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(50)));

                  LinearLayout row =
                          new LinearLayout(getContext());

                  TextView searchButton =
                          createButton("TÌM");

                  searchButton.setOnClickListener(
                          v -> startSearch());

                  row.addView(
                          searchButton,
                          new LinearLayout.LayoutParams(
                                  dp(80),
                                  dp(46)));

                  searchStatus =
                          new TextView(getContext());

                  searchStatus.setTextColor(
                          Color.LTGRAY);

                  searchStatus.setGravity(
                          Gravity.CENTER_VERTICAL);

                  searchStatus.setPadding(
                          dp(10),
                          0,
                          0,
                          0);

                  row.addView(
                          searchStatus,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(46),
                                  1));

                  box.addView(row);

                  resultsPanel =
                          new LinearLayout(
                                  getContext());

                  resultsPanel.setOrientation(
                          LinearLayout.VERTICAL);

                  resultsPanel.setVisibility(
                          View.GONE);

                  resultsList =
                          new LinearLayout(
                                  getContext());

                  resultsList.setOrientation(
                          LinearLayout.VERTICAL);

                  ScrollView scroll =
                          new ScrollView(
                                  getContext());

                  scroll.addView(
                          resultsList);

                  resultsPanel.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(250)));

                  box.addView(
                          resultsPanel);

                  LayoutParams params =
                          new LayoutParams(
                                  dp(430),
                                  -2,
                                  Gravity.TOP
                                          | Gravity.START);

                  params.setMargins(
                          dp(18),
                          dp(18),
                          dp(18),
                          0);

                  addView(
                          box,
                          params);

                  searchInput.setOnEditorActionListener(
                          (v, actionId, event) -> {

                              startSearch();

                              return true;
                          });
              }

              private TextView createButton(
                      String text) {

                  TextView button =
                          new TextView(getContext());

                  button.setText(text);

                  button.setTextColor(
                          Color.WHITE);

                  button.setGravity(
                          Gravity.CENTER);

                  GradientDrawable background =
                          new GradientDrawable();

                  background.setColor(
                          Color.rgb(
                                  35,
                                  55,
                                  70));

                  background.setCornerRadius(
                          dp(10));

                  button.setBackground(
                          background);

                  return button;
              }

              private void startSearch() {

                  String query =
                          searchInput
                                  .getText()
                                  .toString()
                                  .trim();

                  if (query.isEmpty()) {

                      searchStatus.setText(
                              "Nhập địa điểm cần tìm");

                      return;
                  }

                  hideKeyboard();

                  searchStatus.setText(
                          "Đang tìm...");

                  resultsPanel.setVisibility(
                          View.VISIBLE);

                  resultsList.removeAllViews();

                  new Thread(
                          () -> performSearch(query),
                          "CarAssistant-Navigation-V2-Search")
                          .start();
              }

              private void performSearch(
                      String query) {

                  HttpURLConnection connection =
                          null;

                  try {

                      String encoded =
                              URLEncoder.encode(
                                      query,
                                      StandardCharsets.UTF_8.name());

                      String endpoint =
                              "https://nominatim.openstreetmap.org/search"
                              + "?format=json"
                              + "&limit=6"
                              + "&q="
                              + encoded;

                      connection =
                              (HttpURLConnection)
                                      new URL(endpoint)
                                              .openConnection();

                      connection.setRequestMethod(
                              "GET");

                      connection.setConnectTimeout(
                              10000);

                      connection.setReadTimeout(
                              10000);

                      connection.setRequestProperty(
                              "User-Agent",
                              "CarAssistant-Navigation-V2/1.0");

                      int code =
                              connection.getResponseCode();

                      if (code !=
                              HttpURLConnection.HTTP_OK) {

                          throw new Exception(
                                  "HTTP " + code);
                      }

                      String json =
                              readStream(
                                      connection
                                              .getInputStream());

                      JSONArray array =
                              new JSONArray(json);

                      List<SearchResult> results =
                              new ArrayList<>();

                      for (int i = 0;
                           i < array.length();
                           i++) {

                          JSONObject item =
                                  array.getJSONObject(i);

                          String name =
                                  item.optString(
                                          "display_name",
                                          "Địa điểm");

                          double latitude =
                                  Double.parseDouble(
                                          item.getString(
                                                  "lat"));

                          double longitude =
                                  Double.parseDouble(
                                          item.getString(
                                                  "lon"));

                          results.add(
                                  new SearchResult(
                                          name,
                                          latitude,
                                          longitude));
                      }

                      mainHandler.post(
                              () -> showResults(
                                      results));

                  } catch (Exception error) {

                      mainHandler.post(
                              this::showSearchError);

                  } finally {

                      if (connection != null) {
                          connection.disconnect();
                      }
                  }
              }

              private String readStream(
                      InputStream stream)
                      throws Exception {

                  BufferedReader reader =
                          new BufferedReader(
                                  new InputStreamReader(
                                          stream,
                                          StandardCharsets.UTF_8));

                  StringBuilder builder =
                          new StringBuilder();

                  String line;

                  while ((line =
                          reader.readLine()) != null) {

                      builder.append(line);
                  }

                  reader.close();

                  return builder.toString();
              }

              private void showResults(
                      List<SearchResult> results) {

                  resultsList.removeAllViews();

                  if (results.isEmpty()) {

                      searchStatus.setText(
                              "Không có kết quả");

                      return;
                  }

                  searchStatus.setText(
                          results.size()
                                  + " kết quả");

                  for (SearchResult result :
                          results) {

                      TextView item =
                              new TextView(
                                      getContext());

                      item.setText(
                              result.name);

                      item.setTextColor(
                              Color.WHITE);

                      item.setTextSize(13);

                      item.setGravity(
                              Gravity.CENTER_VERTICAL);

                      item.setPadding(
                              dp(12),
                              dp(8),
                              dp(12),
                              dp(8));

                      item.setOnClickListener(
                              v -> selectDestination(
                                      result));

                      resultsList.addView(
                              item,
                              new LinearLayout.LayoutParams(
                                      -1,
                                      dp(60)));
                  }
              }

              private void showSearchError() {

                  resultsList.removeAllViews();

                  searchStatus.setText(
                          "Không tìm được địa điểm");
              }

              private void selectDestination(
                      SearchResult result) {

                  if (map == null) {
                      return;
                  }

                  /*
                   * Khi chọn điểm đến, tạm rời AutoFollow
                   * để camera giữ tại điểm được chọn.
                   */
                  try {

                      if (map.getLocationComponent()
                              .isLocationComponentEnabled()) {

                          map.getLocationComponent()
                                  .setCameraMode(
                                          CameraMode.NONE);
                      }

                  } catch (Exception ignored) {
                  }

                  LatLng target =
                          new LatLng(
                                  result.latitude,
                                  result.longitude);

                  map.animateCamera(
                          CameraUpdateFactory
                                  .newLatLngZoom(
                                          target,
                                          15.0),
                          700);

                  showDestinationMarker(
                          result.latitude,
                          result.longitude);

                  searchStatus.setText(
                          "Đã chọn điểm đến");

                  resultsPanel.setVisibility(
                          View.GONE);
              }

              private void createDestinationLayer() {

                  if (map == null
                          || map.getStyle() == null) {
                      return;
                  }

                  try {

                      destinationSource =
                              new GeoJsonSource(
                                      DESTINATION_SOURCE);

                      map.getStyle()
                              .addSource(
                                      destinationSource);

                      CircleLayer layer =
                              new CircleLayer(
                                      DESTINATION_LAYER,
                                      DESTINATION_SOURCE);

                      layer.withProperties(
                              PropertyFactory
                                      .circleRadius(9f),

                              PropertyFactory
                                      .circleColor(
                                              Color.rgb(
                                                      220,
                                                      60,
                                                      60)),

                              PropertyFactory
                                      .circleStrokeColor(
                                              Color.WHITE),

                              PropertyFactory
                                      .circleStrokeWidth(
                                              3f));

                      map.getStyle()
                              .addLayer(layer);

                  } catch (Exception ignored) {
                  }
              }

              private void showDestinationMarker(
                      double latitude,
                      double longitude) {

                  if (destinationSource == null) {
                      return;
                  }

                  try {

                      Point point =
                              Point.fromLngLat(
                                      longitude,
                                      latitude);

                      destinationSource.setGeoJson(
                              Feature.fromGeometry(
                                      point));

                  } catch (Exception ignored) {
                  }
              }

              private void hideKeyboard() {

                  if (searchInput == null) {
                      return;
                  }

                  InputMethodManager manager =
                          (InputMethodManager)
                                  getContext()
                                          .getSystemService(
                                                  Context.INPUT_METHOD_SERVICE);

                  if (manager != null) {

                      manager.hideSoftInputFromWindow(
                              searchInput
                                      .getWindowToken(),
                              0);
                  }
              }

              public void zoomIn() {

                  if (map == null) {
                      return;
                  }

                  double zoom =
                          map.getCameraPosition()
                                  .zoom;

                  map.animateCamera(
                          CameraUpdateFactory
                                  .zoomTo(
                                          Math.min(
                                                  20.0,
                                                  zoom + 1.0)),
                          250);
              }

              public void zoomOut() {

                  if (map == null) {
                      return;
                  }

                  double zoom =
                          map.getCameraPosition()
                                  .zoom;

                  map.animateCamera(
                          CameraUpdateFactory
                                  .zoomTo(
                                          Math.max(
                                                  1.0,
                                                  zoom - 1.0)),
                          250);
              }

              public void onHostResume() {
                  mapView.onResume();
              }

              public void onHostPause() {
                  mapView.onPause();
              }

              public void onHostDestroy() {
                  mapView.onDestroy();
              }

              private int dp(float value) {

                  return Math.round(
                          value
                                  * getResources()
                                          .getDisplayMetrics()
                                          .density);
              }

              private static final class SearchResult {

                  final String name;

                  final double latitude;

                  final double longitude;

                  SearchResult(
                          String name,
                          double latitude,
                          double longitude) {

                      this.name = name;

                      this.latitude =
                              latitude;

                      this.longitude =
                              longitude;
                  }
              }
          }
          JAVA

          test -f "$FILE"

          echo "PATCH 1 CHECKS"

          grep -Fq \
            'CameraMode.TRACKING_GPS' \
            "$FILE"

          grep -Fq \
            'trackingGesturesManagement(true)' \
            "$FILE"

          grep -Fq \
            'public void recenter()' \
            "$FILE"

          echo "PATCH 1: PASS"

          echo "PATCH 2 CHECKS"

          grep -Fq \
            'nominatim.openstreetmap.org/search' \
            "$FILE"

          grep -Fq \
            'selectDestination(' \
            "$FILE"

          grep -Fq \
            'GeoJsonSource' \
            "$FILE"

          grep -Fq \
            'CircleLayer' \
            "$FILE"

          grep -Fq \
            'newLatLngZoom' \
            "$FILE"

          echo "PATCH 2: PASS"

          echo "ROUTE EXCLUSION CHECKS"

          ! grep -Fq \
            'OSRM' \
            "$FILE"

          ! grep -Fq \
            'NavigationRouteController' \
            "$FILE"

          ! grep -Fq \
            'NavigationRouteRenderer' \
            "$FILE"

          echo "ROUTE: NOT INCLUDED"

          echo "COMBINED NAVIGATION V2 SOURCE: PASS"

      - name: Add INTERNET permission
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/AndroidManifest.xml"

          if ! grep -Fq \
            'android.permission.INTERNET' \
            "$FILE"; then

            sed -i \
              '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' \
              "$FILE"
          fi

          grep -Fq \
            'android.permission.INTERNET' \
            "$FILE"

          grep -Fq \
            'android.permission.ACCESS_FINE_LOCATION' \
            "$FILE"

          grep -Fq \
            'android.permission.ACCESS_COARSE_LOCATION' \
            "$FILE"

          echo "INTERNET PERMISSION: PASS"
          echo "LOCATION PERMISSIONS: PRESERVED"

      - name: Verify exact V2 change scope
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          CHANGED="$(git diff --name-only)"

          echo "Changed files:"
          echo "$CHANGED"

          echo "$CHANGED" | grep -Fxq \
            "v10-source/app/src/main/AndroidManifest.xml"

          echo "$CHANGED" | grep -Fxq \
            "v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          COUNT="$(
            printf '%s\n' "$CHANGED" |
            sed '/^$/d' |
            wc -l
          )"

          test "$COUNT" -eq 2

          echo "CHANGE SCOPE: PASS"
          echo "ONLY MANIFEST + NavigationMapView.java CHANGED"

      - name: Verify Projection Core unchanged
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          sha256sum \
            "$SRC/V10ProjectionSession.java" \
            "$SRC/V10DisplayController.java" \
            "$SRC/V10SurfaceManager.java" \
            "$SRC/V10TaskSession.java" \
            "$SRC/V10SessionStore.java" \
            > /tmp/core-after.sha256

          cmp \
            /tmp/core-before.sha256 \
            /tmp/core-after.sha256

          echo "PROJECTION CORE: UNCHANGED"

      - name: Verify V10CarActivity unchanged
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          sha256sum \
            "$SRC/V10CarActivity.java" \
            > /tmp/activity-after.sha256

          cmp \
            /tmp/activity-before.sha256 \
            /tmp/activity-after.sha256

          echo "V10CarActivity: UNCHANGED"

      - name: Verify Navigation V2 architecture
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          grep -Fq \
            'CameraMode.TRACKING_GPS' \
            "$FILE"

          grep -Fq \
            'trackingGesturesManagement(true)' \
            "$FILE"

          grep -Fq \
            'public void recenter()' \
            "$FILE"

          grep -Fq \
            'nominatim.openstreetmap.org/search' \
            "$FILE"

          grep -Fq \
            'selectDestination(' \
            "$FILE"

          grep -Fq \
            'GeoJsonSource' \
            "$FILE"

          grep -Fq \
            'CircleLayer' \
            "$FILE"

          ! grep -Fq \
            'OSRM' \
            "$FILE"

