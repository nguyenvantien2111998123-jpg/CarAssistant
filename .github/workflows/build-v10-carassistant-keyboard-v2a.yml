name: Keyboard V2A Input Bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify current V10 source
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/carassistant/v10"

          test -f "$BASE/V10CarActivity.java"
          test -f "$BASE/V10ProjectionSession.java"
          test -f "$BASE/RootShellSession.java"
          test -f "$BASE/NavigationMapView.java"

          grep -Fq "new V10ProjectionSession" \
            "$BASE/V10CarActivity.java"

          grep -Fq "session.attachTextureView" \
            "$BASE/V10CarActivity.java"

          grep -Fq "createFloatingTouchKey();" \
            "$BASE/V10CarActivity.java"

          grep -Fq "private void returnToLauncher()" \
            "$BASE/V10CarActivity.java"

          grep -Fq \
            "if (navigationMap != null) { navigationMap.onHostDestroy(); navigationMap = null; }" \
            "$BASE/V10CarActivity.java"

          grep -Fq "int getDisplayId()" \
            "$BASE/V10ProjectionSession.java"

          grep -Fq "class RootShellSession" \
            "$BASE/RootShellSession.java"

          echo "PASS: Current main source verified."
          echo "PASS: Patch anchors exist in actual source."

      - name: Create Keyboard V2A sources
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/carassistant/v10"

          cat > "$BASE/CarAssistantInputBridge.java" <<'EOF'
          package com.carassistant.v10;

          import android.util.Log;

          public final class CarAssistantInputBridge {

              private static final String TAG =
                      "CarAssistantInputBridge";

              private final V10ProjectionSession session;
              private final RootShellSession rootShell =
                      new RootShellSession();

              public CarAssistantInputBridge(
                      V10ProjectionSession session) {

                  this.session = session;
              }

              public void text(String value) {

                  if (!session.isActive()
                          || value == null
                          || value.length() == 0) {
                      return;
                  }

                  String safe =
                          value
                                  .replace("\\", "\\\\")
                                  .replace("'", "'\\''");

                  execute(
                          "/system/bin/input -d "
                          + session.getDisplayId()
                          + " text '"
                          + safe
                          + "'");
              }

              public void key(int keyCode) {

                  if (!session.isActive()) {
                      return;
                  }

                  execute(
                          "/system/bin/input -d "
                          + session.getDisplayId()
                          + " keyevent "
                          + keyCode);
              }

              private void execute(String command) {

                  RootShellSession.EXEC.execute(
                          () -> {
                              try {
                                  rootShell.run(
                                          5,
                                          command);
                              } catch (Throwable t) {
                                  Log.w(
                                          TAG,
                                          "Input bridge failed",
                                          t);
                              }
                          });
              }

              public void destroy() {
                  rootShell.destroy();
              }
          }
          EOF

          cat > "$BASE/CarAssistantKeyboard.java" <<'EOF'
          package com.carassistant.v10;

          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.util.Locale;

          public final class CarAssistantKeyboard {

              public interface Action {
                  void text(String value);
                  void key(int keyCode);
              }

              private final FrameLayout host;
              private final Action action;

              private LinearLayout panel;
              private boolean visible;

              public CarAssistantKeyboard(
                      FrameLayout host,
                      Action action) {

                  this.host = host;
                  this.action = action;
              }

              public boolean isVisible() {
                  return visible && panel != null;
              }

              public void show() {

                  if (panel == null) {

                      panel = buildKeyboard();

                      FrameLayout.LayoutParams params =
                              new FrameLayout.LayoutParams(
                                      -1,
                                      dp(270),
                                      Gravity.BOTTOM);

                      params.setMargins(
                              dp(8),
                              0,
                              dp(8),
                              dp(8));

                      host.addView(
                              panel,
                              params);
                  }

                  panel.setVisibility(View.VISIBLE);
                  panel.bringToFront();
                  visible = true;
              }

              public void hide() {

                  if (panel != null) {
                      panel.setVisibility(View.GONE);
                  }

                  visible = false;
              }

              private LinearLayout buildKeyboard() {

                  LinearLayout root =
                          new LinearLayout(
                                  host.getContext());

                  root.setOrientation(
                          LinearLayout.VERTICAL);

                  root.setPadding(
                          dp(8),
                          dp(8),
                          dp(8),
                          dp(8));

                  GradientDrawable bg =
                          new GradientDrawable();

                  bg.setColor(
                          Color.rgb(15, 20, 26));

                  bg.setCornerRadius(
                          dp(18));

                  bg.setStroke(
                          dp(1),
                          Color.rgb(65, 85, 105));

                  root.setBackground(bg);
                  root.setElevation(dp(18));

                  addRow(root, "1234567890");
                  addRow(root, "QWERTYUIOP");
                  addRow(root, "ASDFGHJKL");
                  addRow(root, "ZXCVBNM");

                  LinearLayout bottom =
                          new LinearLayout(
                                  host.getContext());

                  bottom.setGravity(Gravity.CENTER);

                  addKey(
                          bottom,
                          "⌫",
                          1.35f,
                          () -> action.key(
                                  KeyEvent.KEYCODE_DEL));

                  addKey(
                          bottom,
                          "SPACE",
                          3.8f,
                          () -> action.key(
                                  KeyEvent.KEYCODE_SPACE));

                  addKey(
                          bottom,
                          "ENTER",
                          1.55f,
                          () -> action.key(
                                  KeyEvent.KEYCODE_ENTER));

                  root.addView(
                          bottom,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1f));

                  return root;
              }

              private void addRow(
                      LinearLayout root,
                      String values) {

                  LinearLayout row =
                          new LinearLayout(
                                  host.getContext());

                  row.setGravity(Gravity.CENTER);

                  for (int i = 0;
                       i < values.length();
                       i++) {

                      final String value =
                              String.valueOf(
                                      values.charAt(i))
                                      .toLowerCase(
                                              Locale.ROOT);

                      addKey(
                              row,
                              String.valueOf(
                                      values.charAt(i)),
                              1f,
                              () -> action.text(value));
                  }

                  root.addView(
                          row,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1f));
              }

              private void addKey(
                      LinearLayout row,
                      String label,
                      float weight,
                      Runnable click) {

                  TextView key =
                          new TextView(
                                  host.getContext());

                  key.setText(label);
                  key.setTextColor(Color.WHITE);
                  key.setTextSize(
                          label.length() > 1
                                  ? 13
                                  : 18);

                  key.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD);

                  key.setGravity(Gravity.CENTER);

                  GradientDrawable bg =
                          new GradientDrawable();

                  bg.setColor(
                          Color.rgb(32, 41, 50));

                  bg.setCornerRadius(dp(11));

                  key.setBackground(bg);
                  key.setOnClickListener(
                          v -> click.run());

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  0,
                                  -1,
                                  weight);

                  params.setMargins(
                          dp(3),
                          dp(3),
                          dp(3),
                          dp(3));

                  row.addView(key, params);
              }

              private int dp(int value) {

                  return Math.round(
                          value
                          * host.getResources()
                                  .getDisplayMetrics()
                                  .density);
              }
          }
          EOF

          cat > "$BASE/CarAssistantKeyboardController.java" <<'EOF'
          package com.carassistant.v10;

          import android.os.Handler;
          import android.os.Looper;
          import android.util.Log;
          import android.widget.FrameLayout;

          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public final class CarAssistantKeyboardController {

              private static final String TAG =
                      "CarAssistantKeyboard";

              private static final long POLL_MS =
                      800L;

              private static final Pattern SHOWN =
                      Pattern.compile(
                              "mInputShown\\s*=\\s*(true|false)");

              private final V10ProjectionSession session;
              private final CarAssistantInputBridge bridge;

              private final Handler main =
                      new Handler(
                              Looper.getMainLooper());

              private final CarAssistantKeyboard keyboard;

              private boolean started;
              private boolean lastShown;

              private final RootShellSession stateShell =
                      new RootShellSession();

              private final Runnable poller =
                      new Runnable() {

                  @Override
                  public void run() {

                      if (!started) {
                          return;
                      }

                      if (!session.isActive()) {
                          keyboard.hide();

                          main.postDelayed(
                                  this,
                                  POLL_MS);

                          return;
                      }

                      RootShellSession.EXEC.execute(
                              () -> {

                          boolean shown = false;

                          try {

                              String out =
                                      stateShell.run(
                                              3,
                                              "dumpsys input_method "
                                              + "| grep -m 1 "
                                              + "mInputShown || true");

                              Matcher matcher =
                                      SHOWN.matcher(out);

                              if (matcher.find()) {
                                  shown =
                                      "true".equalsIgnoreCase(
                                          matcher.group(1));
                              }

                          } catch (Throwable t) {

                              Log.w(
                                      TAG,
                                      "IME state read failed",
                                      t);
                          }

                          final boolean state = shown;

                          if (state != lastShown) {

                              lastShown = state;

                              main.post(
                                      () -> applyState(state));
                          }

                          if (started) {
                              main.postDelayed(
                                      this,
                                      POLL_MS);
                          }
                      });
                  }
              };

              public CarAssistantKeyboardController(
                      FrameLayout host,
                      V10ProjectionSession session) {

                  this.session = session;

                  bridge =
                          new CarAssistantInputBridge(
                                  session);

                  keyboard =
                          new CarAssistantKeyboard(
                                  host,
                                  new CarAssistantKeyboard.Action() {

                              @Override
                              public void text(
                                      String value) {
                                  bridge.text(value);
                              }

                              @Override
                              public void key(
                                      int keyCode) {
                                  bridge.key(keyCode);
                              }
                          });
              }

              public void start() {

                  if (started) {
                      return;
                  }

                  started = true;
                  lastShown = false;

                  keyboard.hide();

                  main.removeCallbacks(poller);
                  main.post(poller);
              }

              public void stop() {

                  started = false;

                  main.removeCallbacks(poller);

                  keyboard.hide();
                  bridge.destroy();
                  stateShell.destroy();
              }

              public void hide() {

                  lastShown = false;
                  keyboard.hide();
              }

              private void applyState(
                      boolean shown) {

                  if (!started
                          || !session.isActive()) {

                      keyboard.hide();
                      return;
                  }

                  if (shown) {
                      keyboard.show();
                  } else {
                      keyboard.hide();
                  }
              }
          }
          EOF

          echo "PASS: Keyboard V2A sources created."

      - name: Patch V10CarActivity
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java"
          )

          source = path.read_text()

          def replace_once(old, new, name):
              count = source.count(old)

              if count != 1:
                  raise SystemExit(
                      f"{name}: expected 1 match, got {count}"
                  )

              return source.replace(old, new, 1)

          source = replace_once(
              "    private V10ProjectionSession session;\n",
              "    private V10ProjectionSession session;\n"
              "    private CarAssistantKeyboardController keyboardController;\n",
              "keyboard field"
          )

          source = replace_once(
              "        session.attachTextureView(\n"
              "                textureView);\n\n"
              "        createFloatingTouchKey();",
              "        session.attachTextureView(\n"
              "                textureView);\n\n"
              "        createFloatingTouchKey();\n\n"
              "        keyboardController =\n"
              "                new CarAssistantKeyboardController(\n"
              "                        projectionLayer,\n"
              "                        session);\n"
              "        keyboardController.start();",
              "keyboard initialization"
          )

          source = replace_once(
              "    private void returnToLauncher() {\n\n"
              "        if (session != null",
              "    private void returnToLauncher() {\n\n"
              "        if (keyboardController != null) {\n"
              "            keyboardController.hide();\n"
              "        }\n\n"
              "        if (session != null",
              "hide keyboard on HOME"
          )

          source = replace_once(
              "        if (navigationMap != null) { navigationMap.onHostDestroy(); navigationMap = null; }\n\n"
              "        handler.removeCallbacks(\n"
              "                clockTicker);",
              "        if (navigationMap != null) { navigationMap.onHostDestroy(); navigationMap = null; }\n\n"
              "        if (keyboardController != null) {\n"
              "            keyboardController.stop();\n"
              "            keyboardController = null;\n"
              "        }\n\n"
              "        handler.removeCallbacks(\n"
              "                clockTicker);",
              "keyboard cleanup"
          )

          path.write_text(source)

          print("PASS: V10CarActivity patched from verified main anchors.")
          PY

      - name: Verify V2A boundaries
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/carassistant/v10"

          test -f "$BASE/CarAssistantKeyboard.java"
          test -f "$BASE/CarAssistantKeyboardController.java"
          test -f "$BASE/CarAssistantInputBridge.java"

          grep -Fq \
            "private CarAssistantKeyboardController keyboardController;" \
            "$BASE/V10CarActivity.java"

          grep -Fq \
            "new CarAssistantKeyboardController" \
            "$BASE/V10CarActivity.java"

          grep -Fq \
            'addRow(root, "1234567890");' \
            "$BASE/CarAssistantKeyboard.java"

          grep -Fq \
            "/system/bin/input -d" \
            "$BASE/CarAssistantInputBridge.java"

          grep -Fq \
            "getDisplayId()" \
            "$BASE/CarAssistantInputBridge.java"

          grep -Fq \
            "mInputShown" \
            "$BASE/CarAssistantKeyboardController.java"

          if grep -Fq \
              "InputMethodService" \
              "$BASE/CarAssistantKeyboard.java"; then
            echo "ERROR: V2A must not implement an IME service."
            exit 1
          fi

          if grep -Fq \
              "InputMethodService" \
              "$BASE/CarAssistantKeyboardController.java"; then
            echo "ERROR: V2A controller must not implement an IME service."
            exit 1
          fi

          if grep -Fq \
              "DisplayHooks" \
              "$BASE/CarAssistantInputBridge.java"; then
            echo "ERROR: V2A must not modify DisplayHooks."
            exit 1
          fi

          if grep -Fq \
              "NavigationPresentationView" \
              "$BASE/CarAssistantInputBridge.java"; then
            echo "ERROR: V2A must not touch NavigationPresentationView."
            exit 1
          fi

          grep -Fq \
            "class NavigationMapView" \
            "$BASE/NavigationMapView.java"

          grep -Fq \
            "new NavigationMapView(this)" \
            "$BASE/V10CarActivity.java"

          echo "PASS: Keyboard V2A boundary checks."
          echo "PASS: Navigation source remains protected."

      - name: Compile debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd v10-source

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          mkdir -p dist

          cp "$APK" \
            "dist/CarAssistant-V10-Keyboard-V2A.apk"

          sha256sum \
            "dist/CarAssistant-V10-Keyboard-V2A.apk" \
            | tee \
            "dist/CarAssistant-V10-Keyboard-V2A.sha256"

      - name: Upload Keyboard V2A APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Keyboard-V2A
          path: |
            dist/CarAssistant-V10-Keyboard-V2A.apk
            dist/CarAssistant-V10-Keyboard-V2A.sha256
          if-no-files-found: error
