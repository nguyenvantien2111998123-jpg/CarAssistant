name: CarAssistant V3.2 - Commit Beep Fix to Main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit-beep-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify source structure before patch
        shell: bash
        run: |
          set -e

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          if [ ! -f "$FILE" ]; then
            echo "FAIL: NavigationMapView.java not found"
            exit 1
          fi

          echo "PASS: Found NavigationMapView.java"

          grep -q '^package com\.carassistant\.v10;' "$FILE"
          grep -q '^import android\.content\.Context;' "$FILE"
          grep -q '^import android\.media\.AudioManager;' "$FILE"
          grep -q '^import android\.media\.ToneGenerator;' "$FILE"
          grep -q 'SpeechRecognizer' "$FILE"
          grep -q 'vi-VN' "$FILE"
          grep -q 'VOICE_SILENCE_TIMEOUT_MS = 5000L' "$FILE"
          grep -q 'private final Handler voiceHandler' "$FILE"
          grep -q '^    private void playVoiceStartTone() {' "$FILE"

          echo "PASS: Current main source structure matches expected Navigation V3.2 source."

      - name: Patch beep only
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          file = Path(
              "v10-source/app/src/main/java/"
              "com/hieptran/aacast/doudou/NavigationMapView.java"
          )

          text = file.read_text(encoding="utf-8")

          # ------------------------------------------------------------
          # Safety guard: do not patch twice.
          # ------------------------------------------------------------
          if 'VOICE_TONE_TAG = "CarAssistantVoice"' in text:
              print("PASS: Beep patch is already present.")
              raise SystemExit(0)

          # ------------------------------------------------------------
          # Verify required source symbols before modifying anything.
          # ------------------------------------------------------------
          required_symbols = [
              "import android.content.Context;",
              "import android.media.AudioManager;",
              "import android.media.ToneGenerator;",
              "private final Handler voiceHandler",
              "SpeechRecognizer",
              '"vi-VN"',
              "VOICE_SILENCE_TIMEOUT_MS = 5000L",
          ]

          for symbol in required_symbols:
              if symbol not in text:
                  raise SystemExit(
                      f"FAIL: Required source symbol not found: {symbol}"
                  )

          # ------------------------------------------------------------
          # Add Log import only if it is not already present.
          # ------------------------------------------------------------
          if "import android.util.Log;" not in text:
              anchor = "import android.media.ToneGenerator;"

              if anchor not in text:
                  raise SystemExit(
                      "FAIL: Could not find ToneGenerator import anchor."
                  )

              text = text.replace(
                  anchor,
                  anchor + "\nimport android.util.Log;",
                  1
              )

          # ------------------------------------------------------------
          # EXACT current method from main.
          #
          # IMPORTANT:
          # The method declaration has FOUR leading spaces because
          # it is inside NavigationMapView.
          # ------------------------------------------------------------
          old_method = """    private void playVoiceStartTone() {

        try {

            if (toneGenerator != null) {

                toneGenerator.release();

                toneGenerator = null;
            }

            toneGenerator =
                    new ToneGenerator(
                            AudioManager.STREAM_NOTIFICATION,
                            80);

            toneGenerator.startTone(
                    ToneGenerator.TONE_PROP_BEEP,
                    120);

        } catch (Exception ignored) {
        }
    }"""

          # ------------------------------------------------------------
          # Replacement method.
          # Indentation intentionally matches the existing Java source.
          # ------------------------------------------------------------
          new_method = """    private void playVoiceStartTone() {

        final String VOICE_TONE_TAG = "CarAssistantVoice";

        try {

            if (toneGenerator != null) {

                toneGenerator.release();

                toneGenerator = null;
            }

            AudioManager audioManager =
                    (AudioManager) getContext().getSystemService(
                            Context.AUDIO_SERVICE);

            if (audioManager != null) {

                int musicVolume =
                        audioManager.getStreamVolume(
                                AudioManager.STREAM_MUSIC);

                int notificationVolume =
                        audioManager.getStreamVolume(
                                AudioManager.STREAM_NOTIFICATION);

                Log.d(
                        VOICE_TONE_TAG,
                        "STREAM_MUSIC volume=" + musicVolume
                                + ", STREAM_NOTIFICATION volume="
                                + notificationVolume);
            }

            try {

                toneGenerator =
                        new ToneGenerator(
                                AudioManager.STREAM_MUSIC,
                                100);

                boolean started =
                        toneGenerator.startTone(
                                ToneGenerator.TONE_PROP_BEEP,
                                180);

                if (!started) {

                    toneGenerator.release();

                    toneGenerator = null;

                    toneGenerator =
                            new ToneGenerator(
                                    AudioManager.STREAM_NOTIFICATION,
                                    100);

                    toneGenerator.startTone(
                            ToneGenerator.TONE_PROP_BEEP,
                            180);
                }

            } catch (Exception musicException) {

                Log.e(
                        VOICE_TONE_TAG,
                        "STREAM_MUSIC beep failed",
                        musicException);

                if (toneGenerator != null) {

                    try {
                        toneGenerator.release();
                    } catch (Exception ignored) {
                    }

                    toneGenerator = null;
                }

                toneGenerator =
                        new ToneGenerator(
                                AudioManager.STREAM_NOTIFICATION,
                                100);

                toneGenerator.startTone(
                        ToneGenerator.TONE_PROP_BEEP,
                        180);
            }

            voiceHandler.postDelayed(
                    new Runnable() {
                        @Override
                        public void run() {

                            if (toneGenerator != null) {

                                try {
                                    toneGenerator.release();
                                } catch (Exception ignored) {
                                }

                                toneGenerator = null;
                            }
                        }
                    },
                    350L);

        } catch (Exception e) {

            Log.e(
                    VOICE_TONE_TAG,
                    "Voice start beep failed",
                    e);
        }
    }"""

          # ------------------------------------------------------------
          # Refuse unsafe patch if the exact current method is absent.
          # ------------------------------------------------------------
          if old_method not in text:
              raise SystemExit(
                  "FAIL: Exact current playVoiceStartTone() method "
                  "was not found in main. Refusing unsafe patch."
              )

          # Ensure the method occurs exactly once.
          occurrences = text.count(old_method)

          if occurrences != 1:
              raise SystemExit(
                  f"FAIL: Expected exactly 1 old method, found {occurrences}."
              )

          # ------------------------------------------------------------
          # Replace exactly one method.
          # ------------------------------------------------------------
          text = text.replace(
              old_method,
              new_method,
              1
          )

          file.write_text(
              text,
              encoding="utf-8"
          )

          print("PASS: NavigationMapView.java patched.")

      - name: Verify patched source structure
        shell: bash
        run: |
          set -e

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          echo "========== Verify imports =========="

          grep -q '^import android\.util\.Log;' "$FILE"
          grep -q '^import android\.content\.Context;' "$FILE"
          grep -q '^import android\.media\.AudioManager;' "$FILE"
          grep -q '^import android\.media\.ToneGenerator;' "$FILE"

          echo "PASS: Required imports present."

          echo
          echo "========== Verify beep implementation =========="

          grep -q 'VOICE_TONE_TAG = "CarAssistantVoice"' "$FILE"
          grep -q 'AudioManager.STREAM_MUSIC' "$FILE"
          grep -q 'AudioManager.STREAM_NOTIFICATION' "$FILE"
          grep -q 'ToneGenerator.TONE_PROP_BEEP' "$FILE"
          grep -q '180' "$FILE"
          grep -q '350L' "$FILE"
          grep -q 'voiceHandler.postDelayed' "$FILE"

          echo "PASS: New beep implementation present."

          echo
          echo "========== Verify existing V3.2 voice logic =========="

          grep -q 'SpeechRecognizer' "$FILE"
          grep -q '"vi-VN"' "$FILE"
          grep -q 'VOICE_SILENCE_TIMEOUT_MS = 5000L' "$FILE"
          grep -q 'EXTRA_PARTIAL_RESULTS' "$FILE"

          echo "PASS: Existing V3.2 voice-search logic preserved."

          echo
          echo "========== Verify method count =========="

          COUNT=$(grep -c 'private void playVoiceStartTone()' "$FILE")

          if [ "$COUNT" -ne 1 ]; then
            echo "FAIL: Expected exactly one playVoiceStartTone() method."
            exit 1
          fi

          echo "PASS: Exactly one playVoiceStartTone() method."

      - name: Verify git diff - ONLY NavigationMapView.java may change
        shell: bash
        run: |
          set -e

          EXPECTED="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          echo "========== git status =========="
          git status --short

          echo
          echo "========== changed files =========="

          git diff --name-only

          COUNT=$(git diff --name-only | wc -l | tr -d ' ')

          if [ "$COUNT" -ne 1 ]; then
            echo "FAIL: Expected exactly 1 changed file, found $COUNT"
            exit 1
          fi

          ACTUAL=$(git diff --name-only)

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: Unexpected file changed:"
            echo "$ACTUAL"
            exit 1
          fi

          echo
          echo "PASS: Exactly one file changed:"
          echo "$EXPECTED"

      - name: Verify diff content and whitespace
        shell: bash
        run: |
          set -e

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          echo "========== git diff --check =========="

          git diff --check

          echo
          echo "PASS: No whitespace errors."

          echo
          echo "========== Verify only beep method and Log import changed =========="

          git diff -- "$FILE"

      - name: Final safety check before commit
        shell: bash
        run: |
          set -e

          EXPECTED="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          CHANGED_FILES="$(git diff --name-only)"

          if [ "$CHANGED_FILES" != "$EXPECTED" ]; then
            echo "FAIL: Final safety check detected unexpected file changes."
            echo "$CHANGED_FILES"
            exit 1
          fi

          if git diff --quiet; then
            echo "FAIL: No source change detected."
            exit 1
          fi

          echo "PASS: Final safety check."
          echo "Only NavigationMapView.java will be committed."

      - name: Commit and push to main
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java

          STAGED_FILES="$(git diff --cached --name-only)"

          EXPECTED="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          if [ "$STAGED_FILES" != "$EXPECTED" ]; then
            echo "FAIL: Staged files are not exactly NavigationMapView.java"
            echo "$STAGED_FILES"
            exit 1
          fi

          git commit -m "fix: improve voice start beep audio routing"

          git push origin HEAD:main

          echo "PASS: Beep patch committed to main."
