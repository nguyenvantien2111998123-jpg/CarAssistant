name: Build V10 Display Core V1 - App Icon Foundation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-app-icon-foundation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact Foundation V1
        uses: actions/checkout@v4
        with:
          ref: 7292b0569359a2fe6f7c3829561b6f65664fbd2e
          fetch-depth: 1

      - name: Verify exact Foundation V1 commit
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="7292b0569359a2fe6f7c3829561b6f65664fbd2e"
          ACTUAL="$(git rev-parse HEAD)"

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          test "$ACTUAL" = "$EXPECTED"

          echo "Foundation V1 baseline: PASS"

      - name: Verify Foundation V1 source
        shell: bash
        run: |
          set -euo pipefail

          ACTIVITY="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          DISPLAY="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java"
          SESSION="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          test -f "$ACTIVITY"
          test -f "$DISPLAY"
          test -f "$SESSION"

          grep -Fq "class V10CarActivity" "$ACTIVITY"
          grep -Fq "DisplayManager" "$DISPLAY"
          grep -Fq "createVirtualDisplay" "$DISPLAY"
          grep -Fq "launchNewTask" "$SESSION"
          grep -Fq "resumeExistingTask" "$SESSION"
          grep -Fq "floatingTouchKey" "$ACTIVITY"
          grep -Fq "createFloatingTouchKey" "$ACTIVITY"
          grep -Fq "handleControlBack" "$ACTIVITY"
          grep -Fq "handleControlHome" "$ACTIVITY"
          grep -Fq "ViewConfiguration.getLongPressTimeout" "$ACTIVITY"

          if grep -Fq "am force-stop" "$DISPLAY"; then
            echo "ERROR: forbidden am force-stop found in Display Core"
            exit 1
          fi

          if grep -Fq "am force-stop" "$SESSION"; then
            echo "ERROR: forbidden am force-stop found in Projection Session"
            exit 1
          fi

          if test -f "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java"; then
            echo "ERROR: V10ProjectionService.java must not exist in Foundation V1"
            exit 1
          fi

          echo "Foundation V1 architecture: PASS"

      - name: Snapshot protected Foundation files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p foundation-protected

          sha256sum \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java \
            > foundation-protected/hashes-before.txt

          cp \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java \
            foundation-protected/V10CarActivity.before.java

          echo "Protected Foundation snapshot: PASS"

      - name: Add App Icon API only
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          imports = [
              "import android.content.pm.ApplicationInfo;",
              "import android.content.pm.PackageManager;",
              "import android.graphics.drawable.Drawable;",
          ]

          for imp in imports:
              if imp not in text:
                  marker = "import android.content."
                  if marker in text:
                      pos = text.find(marker)
                      text = text[:pos] + imp + "\n" + text[pos:]
                  else:
                      text = imp + "\n" + text

          helper = r'''
              private Drawable getRealAppIcon(String packageName) {
                  try {
                      PackageManager pm = getPackageManager();
                      ApplicationInfo info = pm.getApplicationInfo(packageName, 0);
                      return info.loadIcon(pm);
                  } catch (Exception ignored) {
                      return null;
                  }
              }

          '''

          if "private Drawable getRealAppIcon(String packageName)" not in text:
              class_end = text.rfind("}")
              if class_end < 0:
                  raise SystemExit("Could not locate V10CarActivity class end")
              text = text[:class_end] + helper + text[class_end:]

          path.write_text(text, encoding="utf-8")
          PY

          echo "ApplicationInfo + PackageManager + loadIcon API added."

      - name: Verify App Icon API
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq "import android.content.pm.ApplicationInfo;" "$FILE"
          grep -Fq "import android.content.pm.PackageManager;" "$FILE"
          grep -Fq "import android.graphics.drawable.Drawable;" "$FILE"
          grep -Fq "private Drawable getRealAppIcon(String packageName)" "$FILE"
          grep -Fq "ApplicationInfo info = pm.getApplicationInfo(packageName, 0);" "$FILE"
          grep -Fq "return info.loadIcon(pm);" "$FILE"

          echo "ApplicationInfo: PASS"
          echo "PackageManager: PASS"
          echo "loadIcon(): PASS"

      - name: Verify only allowed source file changed
        shell: bash
        run: |
          set -euo pipefail

          CHANGED="$(git status --porcelain -- v10-source)"

          echo "Changed files:"
          printf '%s\n' "$CHANGED"

          if printf '%s\n' "$CHANGED" | grep -v '^$' | grep -v 'V10CarActivity.java'; then
            echo "ERROR: Files outside V10CarActivity.java were modified."
            exit 1
          fi

          echo "Change scope: PASS"

      - name: Verify protected Foundation files unchanged
        shell: bash
        run: |
          set -euo pipefail

          cd v10-source

          sha256sum \
            app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java \
            > ../foundation-protected/hashes-after.txt

          cd ..

          diff -u \
            foundation-protected/hashes-before.txt \
            foundation-protected/hashes-after.txt

          cmp -s \
            foundation-protected/V10CarActivity.before.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java \
            && {
              echo "ERROR: V10CarActivity was not changed."
              exit 1
            }

          echo "Display Core / Projection / Surface / Task files unchanged: PASS"
          echo "V10CarActivity changed only for App Icon Foundation."

      - name: Verify no forbidden architecture changes
        shell: bash
        run: |
          set -euo pipefail

          DISPLAY="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java"
          SESSION="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
          ACTIVITY="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq "DisplayManager" "$DISPLAY"
          grep -Fq "createVirtualDisplay" "$DISPLAY"
          grep -Fq "launchNewTask" "$SESSION"
          grep -Fq "resumeExistingTask" "$SESSION"
          grep -Fq "floatingTouchKey" "$ACTIVITY"
          grep -Fq "createFloatingTouchKey" "$ACTIVITY"
          grep -Fq "handleControlBack" "$ACTIVITY"
          grep -Fq "handleControlHome" "$ACTIVITY"

          if grep -Rqs "am force-stop" \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java; then
            echo "ERROR: forbidden force-stop detected."
            exit 1
          fi

          echo "Architecture safety gate: PASS"

      - name: Git diff check
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          echo "Whitespace check: PASS"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile Java
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace

      - name: Assemble Debug APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Locate APK and calculate SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find v10-source/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"

          test -n "$APK"
          test -f "$APK"

          mkdir -p release

          cp "$APK" release/CarAssistant-V10-App-Icon-Foundation.apk

          sha256sum release/CarAssistant-V10-App-Icon-Foundation.apk \
            | tee release/SHA256SUM.txt

          echo "APK:"
          ls -lh release/CarAssistant-V10-App-Icon-Foundation.apk

      - name: Upload App Icon Foundation APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-App-Icon-Foundation
          path: |
            release/CarAssistant-V10-App-Icon-Foundation.apk
            release/SHA256SUM.txt
          if-no-files-found: error
          retention-days: 14

      - name: Final App Icon Foundation gate
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "APP ICON FOUNDATION: PASS"
          echo "=========================================="
          echo "Baseline: Foundation V1 7292b0569359a2fe6f7c3829561b6f65664fbd2e"
          echo "Added: ApplicationInfo"
          echo "Added: PackageManager"
          echo "Added: Drawable"
          echo "Added: getRealAppIcon() using loadIcon()"
          echo "Home UI V2: NOT ADDED"
          echo "Display Core: protected"
          echo "Projection: protected"
          echo "Persistence/Task: protected"
          echo "Floating Touch/BACK/HOME: protected"
          echo "=========================================="
