
name: Fix tro ly giong noi 3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify baseline SHA and XML
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install PyYAML

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import xml.etree.ElementTree as ET

          base = Path("v10-source/app/src/main/java/com/carassistant/v10")
          files = {
              base / "V10CarActivity.java":
                  "61e82df0fd17e7851c7bf1628ac03a9391e48523",
              base / "NavigationMapView.java":
                  "1600edf884196a146ce5f4233f8de0a8ea282a4e",
              Path("v10-source/app/src/main/AndroidManifest.xml"):
                  "e6ffd5005ff0d0f8610c5950f20e17acba5410df",
              Path("v10-source/app/build.gradle"):
                  "4d512337d46324a33a685d8cdb095e4ecacd3ceb",
              Path(".github/workflows/build-carassistant-voice-commands-v2.yml"):
                  "4ee7f307c2a106a384a33c7b4386f1864c621ff3",
          }

          for path, expected in files.items():
              if not path.is_file():
                  raise SystemExit(f"FAIL-CLOSED: missing {path}")
              actual = subprocess.check_output(
                  ["git", "hash-object", str(path)], text=True
              ).strip()
              if actual != expected:
                  raise SystemExit(
                      f"FAIL-CLOSED: SHA mismatch {path}: "
                      f"expected {expected}, got {actual}"
                  )
              print(f"PASS SHA: {path}")

          ET.parse("v10-source/app/src/main/AndroidManifest.xml")
          print("PASS: Manifest XML")
          PY

      - name: Apply existing verified voice baseline
        shell: bash
        run: |
          set -euo pipefail

          # Reuse the existing V2 voice implementation instead of
          # rewriting the already-tested recognition and command logic.
          python3 - <<'PY'
          import subprocess
          import yaml

          path = ".github/workflows/build-carassistant-voice-commands-v2.yml"

          with open(path, encoding="utf-8") as f:
              workflow = yaml.safe_load(f)

          steps = workflow["jobs"]["build"]["steps"]
          matches = [
              step for step in steps
              if step.get("name") ==
              "Verify baseline and patch voice recognition"
          ]

          if len(matches) != 1 or not matches[0].get("run"):
              raise SystemExit(
                  "FAIL-CLOSED: cannot find unique V2 voice patch step"
              )

          subprocess.run(
              ["bash", "-c", matches[0]["run"]],
              check=True
          )
          print("PASS: existing V2 voice baseline applied")

      - name: Apply V3 floating mic and auto-hide patch
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/"
              "V10CarActivity.java"
          )
          java = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global java
              count = java.count(old)
              if count != 1:
                  raise SystemExit(
                      f"FAIL-CLOSED: {label}; expected 1 anchor, "
                      f"found {count}"
                  )
              java = java.replace(old, new, 1)
              print("PASS: " + label)

          # Dedicated state; do not reuse the BACK/HOME floating control.
          replace_once(
              "    private TextView voiceStatus;\n",
              "    private TextView voiceStatus;\n"
              "    private TextView projectionMicButton;\n"
              "    private Runnable voiceStatusHideRunnable;\n",
              "V3 independent mic and status timer fields"
          )

          # Add the mic only to the projected-app layer.
          replace_once(
              "        createFloatingTouchKey();\n",
              "        createFloatingTouchKey();\n"
              "        createProjectionMicButton();\n",
              "attach mic to projection layer"
          )

          # Every new status cancels any previous pending hide timer.
          replace_once(
              "              private void updateVoiceStatus(String value) {\n"
              "                  if (voiceStatus == null) return;\n"
              "                  voiceStatus.setText(value == null ? \"\" : value);\n"
              "                  voiceStatus.setVisibility(\n"
              "                          value == null || value.trim().isEmpty()\n"
              "                                  ? View.GONE : View.VISIBLE);\n"
              "              }\n",
              "              private void updateVoiceStatus(String value) {\n"
              "                  Runnable old = voiceStatusHideRunnable;\n"
              "                  voiceStatusHideRunnable = null;\n"
              "                  if (old != null) voiceHandler.removeCallbacks(old);\n"
              "                  if (voiceStatus == null) return;\n"
              "                  voiceStatus.setText(value == null ? \"\" : value);\n"
              "                  voiceStatus.setVisibility(\n"
              "                          value == null || value.trim().isEmpty()\n"
              "                                  ? View.GONE : View.VISIBLE);\n"
              "              }\n\n"
              "              private void scheduleVoiceStatusHide() {\n"
              "                  final Runnable[] holder = new Runnable[1];\n"
              "                  Runnable pending = () -> {\n"
              "                      if (voiceStatusHideRunnable != holder[0]) return;\n"
              "                      voiceStatusHideRunnable = null;\n"
              "                      updateVoiceStatus(null);\n"
              "                  };\n"
              "                  holder[0] = pending;\n"
              "                  voiceStatusHideRunnable = pending;\n"
              "                  voiceHandler.postDelayed(pending, 2500L);\n"
              "              }\n",
              "status timer cancels stale callbacks and hides after 2.5 seconds"
          )

          mic_method = (
              "              private void createProjectionMicButton() {\n"
              "                  if (projectionMicButton != null || projectionLayer == null) return;\n"
              "                  projectionMicButton = new TextView(this);\n"
              "                  projectionMicButton.setText(\"🎙\");\n"
              "                  projectionMicButton.setTextColor(Color.WHITE);\n"
              "                  projectionMicButton.setTextSize(24);\n"
              "                  projectionMicButton.setGravity(Gravity.CENTER);\n"
              "                  GradientDrawable bg = new GradientDrawable();\n"
              "                  bg.setShape(GradientDrawable.OVAL);\n"
              "                  bg.setColor(Color.rgb(25, 118, 210));\n"
              "                  bg.setStroke(dp(2), Color.rgb(130, 200, 255));\n"
              "                  projectionMicButton.setBackground(bg);\n"
              "                  projectionMicButton.setElevation(dp(16));\n"
              "                  FrameLayout.LayoutParams params =\n"
              "                          new FrameLayout.LayoutParams(dp(58), dp(58),\n"
              "                                  Gravity.BOTTOM | Gravity.END);\n"
              "                  params.setMargins(0, 0, dp(22), dp(92));\n"
              "                  projectionLayer.addView(projectionMicButton, params);\n"
              "                  projectionMicButton.setOnClickListener(v -> {\n"
              "                      if (voiceRecognizer != null) {\n"
              "                          stopVoiceRecognition();\n"
              "                      } else {\n"
              "                          startVoiceRecognition();\n"
              "                      }\n"
              "                  });\n"
              "                  projectionMicButton.bringToFront();\n"
              "              }\n\n"
          )

          replace_once(
              "              private String normalizeVoiceText(String value) {\n",
              mic_method +
              "              private String normalizeVoiceText(String value) {\n",
              "add blue mic directly to projectionLayer"
          )

          # Schedule auto-hide after a recognised command is processed.
          replace_once(
              "                              processVoiceCommand(spoken);\n",
              "                              processVoiceCommand(spoken);\n"
              "                              scheduleVoiceStatusHide();\n",
              "schedule status auto-hide after command processing"
          )

          # Show a stop icon while recognition is active.
          replace_once(
              "                  updateVoiceStatus(\"Đang chuẩn bị nghe…\");\n",
              "                  updateVoiceStatus(\"Đang chuẩn bị nghe…\");\n"
              "                  if (projectionMicButton != null) "
              "projectionMicButton.setText(\"■\");\n",
              "show active listening state"
          )

          # Restore the microphone icon when a session ends.
          replace_once(
              "                  if (voiceRecognizer == session) {\n"
              "                      voiceRecognizer = null;\n"
              "                  }\n",
              "                  if (voiceRecognizer == session) {\n"
              "                      voiceRecognizer = null;\n"
              "                  }\n"
              "                  if (voiceRecognizer == null && "
              "projectionMicButton != null) {\n"
              "                      projectionMicButton.setText(\"🎙\");\n"
              "                  }\n",
              "restore idle mic icon"
          )

          # Cancel pending hide when the user cancels listening.
          replace_once(
              "              private void stopVoiceRecognition() {\n"
              "                  cancelVoiceSilenceStop();\n",
              "              private void stopVoiceRecognition() {\n"
              "                  Runnable hidePending = voiceStatusHideRunnable;\n"
              "                  voiceStatusHideRunnable = null;\n"
              "                  if (hidePending != null) "
              "voiceHandler.removeCallbacks(hidePending);\n"
              "                  cancelVoiceSilenceStop();\n",
              "cancel hide timer when listening is cancelled"
          )

          # Clear callbacks when the activity is destroyed.
          replace_once(
              "        stopVoiceRecognition();\n"
              "        if (voiceTone != null) {\n",
              "        stopVoiceRecognition();\n"
              "        Runnable hidePending = voiceStatusHideRunnable;\n"
              "        voiceStatusHideRunnable = null;\n"
              "        if (hidePending != null) "
              "voiceHandler.removeCallbacks(hidePending);\n"
              "        if (voiceTone != null) {\n",
              "cleanup timer on destroy"
          )

          path.write_text(java, encoding="utf-8")
          print("PASS: V3 patch applied")
          PY

      - name: Validate Java XML and required features
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          base = Path("v10-source/app/src/main/java/com/carassistant/v10")
          java = (base / "V10CarActivity.java").read_text(encoding="utf-8")
          manifest = Path("v10-source/app/src/main/AndroidManifest.xml")
          gradle = Path("v10-source/app/build.gradle").read_text(encoding="utf-8")

          ET.parse(manifest)

          required = [
              "private void startVoiceRecognition()",
              "private void stopVoiceRecognition()",
              "private void processVoiceCommand(String spoken)",
              "private void createProjectionMicButton()",
              "projectionLayer.addView(projectionMicButton, params)",
              "voiceHandler.postDelayed(pending, 2500L)",
              "scheduleVoiceStatusHide();",
              "voiceHandler.removeCallbacks(old)",
              "projectionMicButton.setText(\"■\")",
              "projectionMicButton.setText(\"🎙\")",
          ]

          for item in required:
              if item not in java:
                  raise SystemExit("FAIL-CLOSED: missing feature: " + item)

          for method in (
              "private void startVoiceRecognition()",
              "private void stopVoiceRecognition()",
              "private void processVoiceCommand(String spoken)",
              "private void createProjectionMicButton()",
          ):
              if java.count(method) != 1:
                  raise SystemExit("FAIL-CLOSED: duplicate/missing " + method)

          if "org.maplibre.gl:android-sdk:11.11.0" not in gradle:
              raise SystemExit("FAIL-CLOSED: MapLibre version changed")

          ns = "{http://schemas.android.com/apk/res/android}"
          root = ET.parse(manifest).getroot()
          permissions = {
              node.get(ns + "name")
              for node in root.findall("uses-permission")
          }
          if "android.permission.RECORD_AUDIO" not in permissions:
              raise SystemExit("FAIL-CLOSED: RECORD_AUDIO permission missing")

          print("PASS: Java feature checks")
          print("PASS: Manifest XML and microphone permission")
          print("PASS: MapLibre 11.11.0 unchanged")
          PY

          git diff --check
          git diff --exit-code -- \
            v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java \
            v10-source/app/src/main/AndroidManifest.xml \
            v10-source/app/build.gradle

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd v10-source
          gradle --no-daemon --stacktrace assembleDebug

      - name: Package APK and SHA-256
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          mkdir -p dist
          cp "$APK" dist/CarAssistant-Voice-Commands-V3-Floating-Mic.apk

          sha256sum \
            dist/CarAssistant-Voice-Commands-V3-Floating-Mic.apk \
            > dist/CarAssistant-Voice-Commands-V3-Floating-Mic.sha256

          cat dist/CarAssistant-Voice-Commands-V3-Floating-Mic.sha256

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-Voice-Commands-V3-Floating-Mic
          path: |
            dist/CarAssistant-Voice-Commands-V3-Floating-Mic.apk
            dist/CarAssistant-Voice-Commands-V3-Floating-Mic.sha256
          if-no-files-found: error
