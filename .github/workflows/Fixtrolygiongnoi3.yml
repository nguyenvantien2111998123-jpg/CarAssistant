name: Fix tro ly giong noi 3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify baseline SHA and XML
        shell: bash
        run: |
          set -euo pipefail

          verify_sha() {
            local file="$1"
            local expected="$2"
            local actual

            actual="$(git hash-object "$file")"

            if [ "$actual" != "$expected" ]; then
              echo "FAIL-CLOSED: SHA mismatch: $file"
              echo "Expected: $expected"
              echo "Actual:   $actual"
              exit 1
            fi

            echo "PASS: $file"
          }

          verify_sha \
            "v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java" \
            "61e82df0fd17e7851c7bf1628ac03a9391e48523"

          verify_sha \
            "v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java" \
            "1600edf884196a146ce5f4233f8de0a8ea282a4e"

          verify_sha \
            "v10-source/app/src/main/AndroidManifest.xml" \
            "e6ffd5005ff0d0f8610c5950f20e17acba5410df"

          verify_sha \
            "v10-source/app/build.gradle" \
            "4d512337d46324a33a685d8cdb095e4ecacd3ceb"

          verify_sha \
            ".github/workflows/build-carassistant-voice-commands-v2.yml" \
            "4ee7f307c2a106a384a33c7b4386f1864c621ff3"

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest = Path(
              "v10-source/app/src/main/AndroidManifest.xml"
          )
          ET.parse(manifest)

          gradle = Path(
              "v10-source/app/build.gradle"
          ).read_text(encoding="utf-8")

          if "org.maplibre.gl:android-sdk:11.11.0" not in gradle:
              raise SystemExit(
                  "FAIL-CLOSED: unexpected MapLibre dependency"
              )

          print("PASS: Manifest XML and MapLibre 11.11.0")
          PY

      - name: Install workflow parser
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-yaml
          python3 -c "import yaml; print('PASS: PyYAML', yaml.__version__)"

      - name: Apply existing verified voice baseline
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import subprocess
          import yaml
          from pathlib import Path

          path = Path(
              ".github/workflows/build-carassistant-voice-commands-v2.yml"
          )

          workflow = yaml.safe_load(
              path.read_text(encoding="utf-8")
          )

          steps = workflow["jobs"]["build"]["steps"]

          matches = [
              step for step in steps
              if step.get("name")
              == "Verify baseline and patch voice recognition"
              and step.get("run")
          ]

          if len(matches) != 1:
              raise SystemExit(
                  "FAIL-CLOSED: expected exactly one verified V2 patch step; "
                  f"found {len(matches)}"
              )

          print("Applying verified V2 voice patch...")

          subprocess.run(
              [
                  "bash",
                  "-e",
                  "-u",
                  "-o",
                  "pipefail",
                  "-c",
                  matches[0]["run"],
              ],
              check=True,
          )

          print("PASS: existing V2 voice baseline applied")
          PY

      - name: Apply V3 floating mic and auto-hide patch
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java"
          )

          java = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global java

              count = java.count(old)

              if count != 1:
                  raise SystemExit(
                      f"FAIL-CLOSED: {label}; "
                      f"expected 1 anchor, found {count}"
                  )

              java = java.replace(old, new, 1)
              print("PASS:", label)

          # Add independent microphone and status timer fields.
          replace_once(
              "    private TextView voiceStatus;\n",
              "    private TextView voiceStatus;\n"
              "    private TextView projectionMicButton;\n"
              "    private Runnable voiceStatusHideRunnable;\n",
              "add independent mic and status timer fields"
          )

          # Attach the microphone to the existing projection layer.
          replace_once(
              "        createFloatingTouchKey();\n",
              "        createFloatingTouchKey();\n"
              "        createProjectionMicButton();\n",
              "attach microphone to projection layer"
          )

          # Replace the status method without relying on whitespace.
          pattern = re.compile(
              r"(?ms)^([ \t]*)private void updateVoiceStatus"
              r"\(String value\) \{.*?"
              r"(?=^[ \t]*private void playVoiceTone\(\))"
          )

          matches = list(pattern.finditer(java))

          if len(matches) != 1:
              raise SystemExit(
                  "FAIL-CLOSED: updateVoiceStatus method boundary; "
                  f"expected 1 method, found {len(matches)}"
              )

          indent = matches[0].group(1)

          replacement = (
              f"{indent}private void updateVoiceStatus(String value) {{\n"
              f"{indent}    Runnable old = voiceStatusHideRunnable;\n"
              f"{indent}    voiceStatusHideRunnable = null;\n"
              f"{indent}    if (old != null) voiceHandler.removeCallbacks(old);\n"
              f"{indent}    if (voiceStatus == null) return;\n"
              f"{indent}    voiceStatus.setText(value == null ? \"\" : value);\n"
              f"{indent}    voiceStatus.setVisibility(\n"
              f"{indent}            value == null || value.trim().isEmpty()\n"
              f"{indent}                    ? View.GONE : View.VISIBLE);\n"
              f"{indent}}}\n\n"
              f"{indent}private void scheduleVoiceStatusHide() {{\n"
              f"{indent}    if (voiceStatus == null) return;\n"
              f"{indent}    Runnable old = voiceStatusHideRunnable;\n"
              f"{indent}    voiceStatusHideRunnable = null;\n"
              f"{indent}    if (old != null) voiceHandler.removeCallbacks(old);\n"
              f"{indent}    final Runnable[] holder = new Runnable[1];\n"
              f"{indent}    Runnable pending = () -> {{\n"
              f"{indent}        if (voiceStatusHideRunnable != holder[0]) return;\n"
              f"{indent}        voiceStatusHideRunnable = null;\n"
              f"{indent}        updateVoiceStatus(null);\n"
              f"{indent}    }};\n"
              f"{indent}    holder[0] = pending;\n"
              f"{indent}    voiceStatusHideRunnable = pending;\n"
              f"{indent}    voiceHandler.postDelayed(pending, 2500L);\n"
              f"{indent}}}\n\n"
          )

          java, count = pattern.subn(
              lambda _: replacement,
              java,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "FAIL-CLOSED: could not replace status method"
              )

          print("PASS: whitespace-independent status method replacement")

          # FIX: find processVoiceCommand(spoken) regardless of indentation.
          # The status is refreshed after command processing in case the
          # command handler cleared or replaced the recognized text.
          spoken_pattern = re.compile(
              r"(?m)^([ \t]*)processVoiceCommand\(spoken\);[ \t]*$"
          )

          spoken_matches = list(spoken_pattern.finditer(java))

          if len(spoken_matches) != 1:
              raise SystemExit(
                  "FAIL-CLOSED: processVoiceCommand(spoken) anchor; "
                  f"expected 1, found {len(spoken_matches)}"
              )

          def add_status_after_command(match):
              indent = match.group(1)
              return (
                  f"{indent}processVoiceCommand(spoken);\n"
                  f"{indent}updateVoiceStatus(spoken);\n"
                  f"{indent}scheduleVoiceStatusHide();"
              )

          java, count = spoken_pattern.subn(
              add_status_after_command,
              java,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "FAIL-CLOSED: could not patch recognized voice command"
              )

          print(
              "PASS: show recognized command and schedule status auto-hide"
          )

          # Add a separate blue microphone button to the projected app.
          mic_method = r'''
              private void createProjectionMicButton() {
                  if (projectionMicButton != null
                          || projectionLayer == null) {
                      return;
                  }

                  projectionMicButton = new TextView(this);
                  projectionMicButton.setText("🎙");
                  projectionMicButton.setTextColor(Color.WHITE);
                  projectionMicButton.setTextSize(24);
                  projectionMicButton.setGravity(Gravity.CENTER);
                  projectionMicButton.setContentDescription(
                          "CarAssistant voice input");

                  GradientDrawable background = new GradientDrawable();
                  background.setShape(GradientDrawable.OVAL);
                  background.setColor(Color.rgb(66, 133, 244));
                  background.setStroke(dp(2), Color.WHITE);

                  projectionMicButton.setBackground(background);
                  projectionMicButton.setElevation(dp(16));

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  dp(58),
                                  dp(58),
                                  Gravity.BOTTOM | Gravity.END);

                  params.setMargins(0, 0, dp(18), dp(88));

                  projectionLayer.addView(
                          projectionMicButton,
                          params);

                  projectionMicButton.setOnClickListener(v -> {
                      if (voiceRecognizer != null) {
                          stopVoiceRecognition();
                          projectionMicButton.setText("🎙");
                      } else {
                          projectionMicButton.setText("■");
                          startVoiceRecognition();

                          if (voiceRecognizer == null) {
                              projectionMicButton.setText("🎙");
                          }
                      }
                  });
              }

          '''

          replace_once(
              "              private String normalizeVoiceText(",
              mic_method
              + "              private String normalizeVoiceText(",
              "insert independent floating microphone method"
          )

          # Cancel pending UI callbacks when the Activity is destroyed.
          replace_once(
              "    public void onDestroy() {\n"
              "        stopVoiceRecognition();\n",
              "    public void onDestroy() {\n"
              "        if (voiceStatusHideRunnable != null) {\n"
              "            voiceHandler.removeCallbacks(voiceStatusHideRunnable);\n"
              "            voiceStatusHideRunnable = null;\n"
              "        }\n"
              "        stopVoiceRecognition();\n",
              "clean up status timer on destroy"
          )

          required = [
              "private void createProjectionMicButton()",
              "projectionLayer.addView(",
              "private void scheduleVoiceStatusHide()",
              "voiceHandler.postDelayed(pending, 2500L)",
              "updateVoiceStatus(spoken);",
              "scheduleVoiceStatusHide();",
              "private void startVoiceRecognition()",
              "private void stopVoiceRecognition()",
              "private void processVoiceCommand(String spoken)",
              "ToneGenerator.TONE_PROP_BEEP",
          ]

          for item in required:
              if item not in java:
                  raise SystemExit(
                      "FAIL-CLOSED: missing required feature: " + item
                  )

          for method in [
              "private void createProjectionMicButton()",
              "private void scheduleVoiceStatusHide()",
              "private void startVoiceRecognition()",
              "private void processVoiceCommand(String spoken)",
          ]:
              if java.count(method) != 1:
                  raise SystemExit(
                      "FAIL-CLOSED: duplicate or missing method: " + method
                  )

          path.write_text(java, encoding="utf-8")
          print("PASS: V3 floating mic and auto-hide patch")
          PY

      - name: Validate Java XML and required features
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          java_path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java"
          )

          java = java_path.read_text(encoding="utf-8")

          ET.parse(
              Path("v10-source/app/src/main/AndroidManifest.xml")
          )

          required = [
              "private void createProjectionMicButton()",
              "private void scheduleVoiceStatusHide()",
              "voiceHandler.postDelayed(pending, 2500L)",
              "projectionLayer.addView(",
              "updateVoiceStatus(spoken);",
              "scheduleVoiceStatusHide();",
              "private void startVoiceRecognition()",
              "private void stopVoiceRecognition()",
              "private void processVoiceCommand(String spoken)",
              "EXTRA_PARTIAL_RESULTS, true",
              "ToneGenerator.TONE_PROP_BEEP",
          ]

          for item in required:
              if item not in java:
                  raise SystemExit("FAIL: missing feature: " + item)

          for method in [
              "private void createProjectionMicButton()",
              "private void scheduleVoiceStatusHide()",
              "private void startVoiceRecognition()",
              "private void processVoiceCommand(String spoken)",
          ]:
              if java.count(method) != 1:
                  raise SystemExit(
                      "FAIL: duplicate or missing method: " + method
                  )

          if "package com.carassistant.v10;" not in java:
              raise SystemExit("FAIL: unexpected Java package")

          print("PASS: Java anchors and Manifest XML")
          PY

          git diff --check

          git diff --exit-code -- \
            v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java \
            v10-source/app/src/main/AndroidManifest.xml \
            v10-source/app/build.gradle

          echo "PASS: NavigationMapView, Manifest and Gradle unchanged"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd v10-source
          gradle --no-daemon --stacktrace assembleDebug

      - name: Package APK and SHA-256
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          mkdir -p dist

          cp "$APK" \
            dist/CarAssistant-Voice-Commands-V3-Floating-Mic.apk

          sha256sum \
            dist/CarAssistant-Voice-Commands-V3-Floating-Mic.apk \
            > dist/CarAssistant-Voice-Commands-V3-Floating-Mic.sha256

          cat dist/CarAssistant-Voice-Commands-V3-Floating-Mic.sha256

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-Voice-Commands-V3-Floating-Mic
          path: |
            dist/CarAssistant-Voice-Commands-V3-Floating-Mic.apk
            dist/CarAssistant-Voice-Commands-V3-Floating-Mic.sha256
          if-no-files-found: error
