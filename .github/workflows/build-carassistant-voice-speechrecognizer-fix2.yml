
name: Tro ly CarAssistant fix 2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate workflow YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml

          python3 - <<'PY'
          import pathlib
          import yaml

          path = pathlib.Path(
              ".github/workflows/build-carassistant-voice-speechrecognizer-fix2.yml"
          )
          data = yaml.load(
              path.read_text(encoding="utf-8"),
              Loader=yaml.BaseLoader
          )

          assert isinstance(data, dict), "Workflow YAML root is invalid"
          assert "jobs" in data and "build" in data["jobs"]
          assert "workflow_dispatch" in data.get("on", {})

          print("PASS: workflow YAML parse")
          print("PASS: manual trigger and build job")
          PY

      - name: Create project from Fix1 baseline
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import pathlib
          import yaml

          base_path = pathlib.Path(
              ".github/workflows/build-carassistant-voice-speechrecognizer-fix1.yml"
          )
          data = yaml.load(
              base_path.read_text(encoding="utf-8"),
              Loader=yaml.BaseLoader
          )

          steps = data["jobs"]["build"]["steps"]
          source_step = next(
              step for step in steps
              if step.get("name") == "Create standalone Voice project"
          )

          script = source_step["run"]
          pathlib.Path("/tmp/create-voice-project.sh").write_text(
              script, encoding="utf-8"
          )

          print("PASS: Fix1 project-generation step found")
          PY

          bash /tmp/create-voice-project.sh

      - name: Apply isolated 4-second silence-stop patch
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import pathlib

          java_path = pathlib.Path(
              "carassistant-voice/app/src/main/java/com/carassistant/voice/MainActivity.java"
          )
          gradle_path = pathlib.Path("carassistant-voice/app/build.gradle")

          java = java_path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global java
              count = java.count(old)
              assert count == 1, (
                  f"FAIL: expected exactly one match for {label}; found {count}"
              )
              java = java.replace(old, new, 1)
              print(f"PASS: patch {label}")

          replace_once(
              "import android.os.Bundle;\n"
              "import android.speech.RecognitionListener;",
              "import android.os.Bundle;\n"
              "import android.os.Handler;\n"
              "import android.os.Looper;\n"
              "import android.speech.RecognitionListener;",
              "Handler imports"
          )

          replace_once(
              "private static final int MIC_REQUEST = 41;\n\n"
              "    private SpeechRecognizer recognizer;",
              "private static final int MIC_REQUEST = 41;\n"
              "    private static final long SILENCE_STOP_DELAY_MS = 4000L;\n\n"
              "    private final Handler mainHandler =\n"
              "            new Handler(Looper.getMainLooper());\n"
              "    private Runnable silenceStopRunnable;\n"
              "    private SpeechRecognizer recognizer;",
              "4-second timer state"
          )

          replace_once(
              "if (recognizer != session) {\n"
              "                    return;\n"
              "                }\n\n"
              "                status.setText(errorMessage(error));",
              "if (recognizer != session) {\n"
              "                    return;\n"
              "                }\n\n"
              "                cancelSilenceStop();\n"
              "                status.setText(errorMessage(error));",
              "cancel timer on error"
          )

          replace_once(
              "if (recognizer != session) {\n"
              "                    return;\n"
              "                }\n\n"
              "                showResults(results, false, session);",
              "if (recognizer != session) {\n"
              "                    return;\n"
              "                }\n\n"
              "                cancelSilenceStop();\n"
              "                showResults(results, false, session);",
              "cancel timer on final result"
          )

          replace_once(
              "showResults(results, true, session);\n"
              "            }",
              "showResults(results, true, session);\n"
              "                scheduleSilenceStop(session);\n"
              "            }",
              "schedule timer after partial result"
          )

          replace_once(
              "private void parseCommand(String spoken) {",
              "private void scheduleSilenceStop(\n"
              "            final SpeechRecognizer session) {\n"
              "        cancelSilenceStop();\n\n"
              "        Runnable pending = () -> {\n"
              "            if (recognizer != session) {\n"
              "                return;\n"
              "            }\n\n"
              "            silenceStopRunnable = null;\n"
              "            status.setText(\"Đang hoàn tất câu nói...\");\n"
              "            try {\n"
              "                session.stopListening();\n"
              "            } catch (RuntimeException e) {\n"
              "                status.setText(\n"
              "                        \"Không thể kết thúc phiên nghe an toàn.\");\n"
              "            }\n"
              "        };\n\n"
              "        silenceStopRunnable = pending;\n"
              "        mainHandler.postDelayed(pending, SILENCE_STOP_DELAY_MS);\n"
              "    }\n\n"
              "    private void cancelSilenceStop() {\n"
              "        Runnable pending = silenceStopRunnable;\n"
              "        silenceStopRunnable = null;\n"
              "        if (pending != null) {\n"
              "            mainHandler.removeCallbacks(pending);\n"
              "        }\n"
              "    }\n\n"
              "    private void parseCommand(String spoken) {",
              "silence timer helpers"
          )

          replace_once(
              "private void stopRecognizer() {\n"
              "        SpeechRecognizer previous = recognizer;",
              "private void stopRecognizer() {\n"
              "        cancelSilenceStop();\n"
              "        SpeechRecognizer previous = recognizer;",
              "timer cleanup"
          )

          java_path.write_text(java, encoding="utf-8")

          gradle = gradle_path.read_text(encoding="utf-8")
          assert "versionCode 2" in gradle
          assert "versionName '0.2.0'" in gradle
          gradle = gradle.replace("versionCode 2", "versionCode 3", 1)
          gradle = gradle.replace(
              "versionName '0.2.0'", "versionName '0.3.0'", 1
          )
          gradle_path.write_text(gradle, encoding="utf-8")

          print("PASS: Fix1 baseline preserved with isolated patch")
          print("PASS: version advanced to 0.3.0")
          PY

      - name: Verify manifest and Java patch
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          root = pathlib.Path("carassistant-voice")
          manifest = root / "app/src/main/AndroidManifest.xml"
          source = root / "app/src/main/java/com/carassistant/voice/MainActivity.java"

          ET.parse(manifest)
          java = source.read_text(encoding="utf-8")

          required = [
              "SILENCE_STOP_DELAY_MS = 4000L",
              "scheduleSilenceStop(session)",
              "session.stopListening()",
              "mainHandler.removeCallbacks(pending)",
              "SpeechRecognizer.ERROR_CLIENT",
              '"vi-VN"',
              "showResults(results, false, session)"
          ]

          for item in required:
              assert item in java, f"Missing required Java logic: {item}"

          assert "EXTRA_PREFER_OFFLINE" not in java
          assert "package com.carassistant.voice;" in java

          print("PASS: manifest XML parse")
          print("PASS: Java source assertions")
          print("PASS: 4-second silence-stop logic")
          print("PASS: Vietnamese recognition preserved")
          PY

      - name: Build standalone Voice APK
        shell: bash
        run: |
          set -euo pipefail
          cd carassistant-voice
          gradle --no-daemon --stacktrace assembleDebug

      - name: Package APK and checksum
        shell: bash
        run: |
          set -euo pipefail

          APK="carassistant-voice/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          mkdir -p dist
          cp "$APK" dist/CarAssistant-Voice-SpeechRecognizer-Fix2.apk

          sha256sum \
            dist/CarAssistant-Voice-SpeechRecognizer-Fix2.apk \
            > dist/CarAssistant-Voice-SpeechRecognizer-Fix2.sha256

          cat dist/CarAssistant-Voice-SpeechRecognizer-Fix2.sha256

      - name: Upload standalone Voice Fix2 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-Voice-SpeechRecognizer-Fix2
          path: |
            dist/CarAssistant-Voice-SpeechRecognizer-Fix2.apk
            dist/CarAssistant-Voice-SpeechRecognizer-Fix2.sha256
          if-no-files-found: error
