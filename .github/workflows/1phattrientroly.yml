        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-1-PhatTrienTroLy
          path: |
            dist/CarAssistant-1-PhatTrienTroLy.apk
            dist/CarAssistant-1-PhatTrienTroLy.sha256
          if-no-files-found: error
