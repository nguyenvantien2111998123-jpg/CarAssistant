      - name: Package APK and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "dist/CarAssistant-1-PhatTrienTroLy.apk"
          sha256sum "dist/CarAssistant-1-PhatTrienTroLy.apk" \
            > "dist/CarAssistant-1-PhatTrienTroLy.sha256"
          cat "dist/CarAssistant-1-PhatTrienTroLy.sha256"

