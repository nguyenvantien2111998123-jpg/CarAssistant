          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          base = Path("v10-source/app/src/main/java/com/carassistant/v10")
          activity = (base / "V10CarActivity.java").read_text(encoding="utf-8")
          session = (base / "V10ProjectionSession.java").read_text(encoding="utf-8")
          controller = (base / "V10DisplayController.java").read_text(encoding="utf-8")
          ET.parse(Path("v10-source/app/src/main/AndroidManifest.xml"))

          required = [
              "private void startVoiceRecognition()",
              "private void processVoiceCommand(String spoken)",
              "private boolean handleVoiceMediaSearch(",
              "private void chooseDefaultMediaApp()",
              "private AppInfo findExplicitMediaApp(",
              "private AppInfo findBrowserApp()",
              "private String extractMediaQuery(",
              "public void openViewUri(String uri, String packageName)",
              "public synchronized void openViewUri(String uri, String packageName)",
              "EXTRA_PARTIAL_RESULTS, true",
          ]
          combined = activity + "\n" + session + "\n" + controller
          for item in required:
              if item not in combined:
                  raise SystemExit("FAIL: missing feature: " + item)
          for method in [
              "private boolean handleVoiceMediaSearch(",
              "private void chooseDefaultMediaApp()",
              "private AppInfo findBrowserApp()",
              "private String extractMediaQuery(",
          ]:
              if activity.count(method) != 1:
                  raise SystemExit("FAIL: duplicate or missing method: " + method)
          if "package com.carassistant.v10;" not in activity:
              raise SystemExit("FAIL: unexpected Java package")
          print("PASS: voice, settings, app routing and projected URL checks")
          PY

          git diff --check
          git diff --exit-code -- \
