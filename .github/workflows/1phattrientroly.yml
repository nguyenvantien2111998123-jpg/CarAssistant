              String url;
              if (pkg.equals("com.google.android.youtube")
                      || pkg.equals("app.revanced.android.youtube")
                      || pkg.equals("app.morphe.android.youtube")) {
                  url = "https://www.youtube.com/results?search_query="
                          + Uri.encode(query);
              } else if (pkg.equals("com.google.android.apps.youtube.music")
                      || pkg.equals("app.revanced.android.apps.youtube.music")
                      || pkg.equals("app.morphe.android.apps.youtube.music")) {
                  url = "https://music.youtube.com/search?q=" + Uri.encode(query);
              } else if (pkg.equals("com.zing.mp3")) {
                  url = "https://zingmp3.vn/tim-kiem/tat-ca?q=" + Uri.encode(query);
              } else if (pkg.equals("com.spotify.music")) {
                  url = "https://open.spotify.com/search/" + Uri.encode(query);
              } else {
                  Toast.makeText(this,
                          "Ứng dụng đã chọn không được hỗ trợ tìm kiếm.",
                          Toast.LENGTH_LONG).show();
                  return true;
              }

              Intent probe = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
              probe.setPackage(pkg);
              if (probe.resolveActivity(getPackageManager()) == null) {
                  Toast.makeText(this,
                          "Ứng dụng được chọn không nhận liên kết tìm kiếm; không tự chuyển sang trình duyệt.",
                          Toast.LENGTH_LONG).show();
                  return true;
              }

              updateVoiceStatus(null);
              launchMediaSearchOnProjection(target, url, pkg);
              Toast.makeText(this, "Đang tìm kiếm trong ứng dụng được chọn.",
                      Toast.LENGTH_SHORT).show();
              return true;
          }
          """
          source = replace_method(
              source, "handleVoiceMediaSearch", "findAppPackage", handler
