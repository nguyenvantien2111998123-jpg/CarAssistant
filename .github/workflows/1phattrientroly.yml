          }

          private boolean handleVoiceMediaSearch(
                  String original, String normalized) {
              String command = normalizeVoiceText(original);

              boolean openExact = command.matches(
                      "^mo\\s+(youtube|youtube morphe|youtube revanced|"
                      + "youtube music|youtube music morphe|"
                      + "youtube music revanced|morphe youtube|"
                      + "revanced youtube|spotify|zing\\s*mp3)$");

              boolean explicitApp = command.contains("youtube")
                      || command.contains("morphe youtube")
                      || command.contains("revanced youtube")
                      || command.contains("zing mp3")
                      || command.contains("zingmp3")
                      || command.contains("spotify");

              if (openExact) {
                  AppInfo target = findExplicitMediaApp(command);
                  if (target == null) {
                      Toast.makeText(this,
                              "Ứng dụng được yêu cầu chưa cài đặt hoặc không khả dụng.",
                              Toast.LENGTH_LONG).show();
                      return true;
                  }
                  launchProjection(target.component);
                  return true;
              }

              String query = extractMediaQuery(original);
              if (query.isEmpty()) {
                  Toast.makeText(this, "Bạn hãy nói nội dung cần tìm.",
                          Toast.LENGTH_SHORT).show();
                  return true;
              }

              AppInfo target;
              if (explicitApp) {
                  target = findExplicitMediaApp(command);
                  if (target == null) {
                      Toast.makeText(this,
                              "Ứng dụng được yêu cầu chưa cài đặt hoặc không khả dụng.",
                              Toast.LENGTH_LONG).show();
                      return true;
                  }
