          )

          resolver = r"""
          private AppInfo findExplicitMediaApp(String normalized) {
              String pkg = null;

              if (normalized.contains("youtube music morphe")) {
                  pkg = "app.morphe.android.apps.youtube.music";
              } else if (normalized.contains("youtube music revanced")) {
                  pkg = "app.revanced.android.apps.youtube.music";
              } else if (normalized.contains("youtube music")) {
                  pkg = "com.google.android.apps.youtube.music";
              } else if (normalized.contains("youtube morphe")
                      || normalized.contains("morphe youtube")) {
                  pkg = "app.morphe.android.youtube";
              } else if (normalized.contains("youtube revanced")
                      || normalized.contains("revanced youtube")) {
                  pkg = "app.revanced.android.youtube";
              } else if (normalized.contains("youtube")) {
                  pkg = "com.google.android.youtube";
              } else if (normalized.contains("zing mp3")
                      || normalized.contains("zingmp3")) {
                  pkg = "com.zing.mp3";
