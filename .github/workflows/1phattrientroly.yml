                      command.contains("nhac") || command.contains("bai hat")
                      || command.contains("youtube music")
                      || command.contains("spotify")
                      || command.contains("zing mp3")
                      || command.contains("zingmp3");

              boolean mentionsApp =
                      command.contains("youtube")
                      || command.contains("revanced")
                      || command.contains("morphe")
                      || command.contains("spotify")
                      || command.contains("zing mp3")
                      || command.contains("zingmp3");

              AppInfo target = null;

              if (mentionsApp) {
                  target = findExplicitMediaApp(command);
                  if (target == null) {
                      Toast.makeText(this,
                              "Ứng dụng được yêu cầu chưa cài đặt "
                                      + "hoặc không có Activity khởi chạy.",
                              Toast.LENGTH_LONG).show();
                      return true;
                  }
              } else {
                  String category;
                  if (video) {
                      category = "video";
                  } else if (music) {
                      category = "music";
                  } else {
                      Toast.makeText(this,
                              "Hãy nói rõ mở video, mở nhạc hoặc tên ứng dụng.",
                              Toast.LENGTH_LONG).show();
                      return true;
                  }

                  SharedPreferences prefs = getSharedPreferences(
                          "carassistant_command_dispatch", MODE_PRIVATE);

                  target = findAppByComponent(prefs.getString(
                          "default_" + category + "_component", ""));

                  if (target == null) {
                      target = findAppByPackage(prefs.getString(
                              "default_" + category + "_package", ""));
                  }

                  // Compatibility with the old single-default preference.
                  if (target == null) {
                      target = findAppByComponent(
                              prefs.getString("default_component", ""));
                  }

                  if (target == null) {
                      Toast.makeText(this,
                              "Chưa chọn ứng dụng mặc định cho "
                                      + (video ? "VIDEO" : "NHẠC")
                                      + ". Mở ⚙ APP để chọn.",
                              Toast.LENGTH_LONG).show();
                      return true;
                  }
              }

              // No explicit search request: open the selected app on the
              // existing Android Auto projection display. Do not search.
              if (!searchRequested) {
                  updateVoiceStatus(null);
                  launchProjection(target.component);
                  Toast.makeText(this,
                          "Đang mở " + target.name + " trên màn hình chiếu.",
                          Toast.LENGTH_SHORT).show();
                  return true;
              }

              String query = extractMediaQuery(original);
              if (query.isEmpty()) {
                  Toast.makeText(this,
                          "Bạn hãy nói nội dung cần tìm.",
                          Toast.LENGTH_SHORT).show();
                  return true;
              }

              String pkg = target.component.getPackageName();
              String url;

              if (pkg.equals("com.google.android.youtube")
                      || pkg.equals("app.revanced.android.youtube")
                      || pkg.equals("app.morphe.android.youtube")) {
                  url = "https://www.youtube.com/results?search_query="
                          + Uri.encode(query);
              } else if (pkg.equals("com.google.android.apps.youtube.music")
                      || pkg.equals("app.revanced.android.apps.youtube.music")
                      || pkg.equals("app.morphe.android.apps.youtube.music")) {
                  url = "https://music.youtube.com/search?q="
                          + Uri.encode(query);
              } else if (pkg.equals("com.zing.mp3")) {
                  url = "https://zingmp3.vn/tim-kiem/tat-ca?q="
                          + Uri.encode(query);
              } else if (pkg.equals("com.spotify.music")) {
                  url = "https://open.spotify.com/search/"
                          + Uri.encode(query);
              } else {
                  Toast.makeText(this,
                          "Ứng dụng này chưa được hỗ trợ tìm kiếm.",
                          Toast.LENGTH_LONG).show();
                  return true;
              }

              updateVoiceStatus(null);
              launchMediaSearchOnProjection(target, url, pkg);
              Toast.makeText(this,
                      "Đang gửi tìm kiếm đến " + target.name
                              + " trên màn hình chiếu.",
                      Toast.LENGTH_SHORT).show();
              return true;
          }
          """
          activity = replace_method(
              activity, "handleVoiceMediaSearch", "findAppPackage", handler
          )

          # 4. Force URL intents to use the exact virtual display and package.
          #    MULTIPLE_TASK avoids reusing the same app task on the phone.
          controller_pattern = re.compile(
              r"(?ms)^([ \t]*)public synchronized void openViewUri\("
              r".*?(?=^[ \t]*private void execute\()"
          )
          matches = list(controller_pattern.finditer(controller))
          if len(matches) != 1:
              raise SystemExit(
                  "FAIL-CLOSED: expected one openViewUri before execute; found "
                  + str(len(matches))
              )

          controller_method = r"""
          public synchronized void openViewUri(String uri, String packageName) {
              if (!isReady()
                      || uri == null || uri.trim().isEmpty()
                      || packageName == null || packageName.trim().isEmpty()) {
                  Log.w(TAG, "Reject projected URI: display or package unavailable");
                  return;
              }

              final int displayId = display.getDisplayId();
              final int userId = Process.myUid() / 100000;

              String command = "/system/bin/am start"
                      + " --user " + userId
                      + " --display " + displayId
                      + " --windowingMode 1"
                      + " -f 0x18000000"
                      + " -a android.intent.action.VIEW"
                      + " -d " + shellQuote(uri)
                      + " -p " + shellQuote(packageName);

              Log.i(TAG, "Projected URI launch: display=" + displayId
                      + ", package=" + packageName);
              execute(command, "Projected URL launch failed");
          }

          """
          indent = matches[0].group(1)
          body = "\n".join(
              indent + line if line else ""
              for line in controller_method.strip("\n").splitlines()
          ) + "\n\n"
          controller = (
              controller[:matches[0].start()]
              + body
              + controller[matches[0].end():]
          )

          # 5. Fail closed if expected methods or strict-routing safeguards
          #    are missing. Do not touch keyboard code in this step.
          required_activity = [
              "private AppInfo findAppByPackage(",
              'getLaunchIntentForPackage(packageName)',
              'default_video_component',
              'default_music_component',
              "private boolean isMediaCommand(",
              "private boolean handleVoiceMediaSearch(",
              "if (!searchRequested)",
              "launchMediaSearchOnProjection(target, url, pkg)",
          ]
          for item in required_activity:
              if item not in activity:
                  raise SystemExit("FAIL-CLOSED: missing Activity feature: " + item)

          if activity.count("private boolean handleVoiceMediaSearch(") != 1:
              raise SystemExit("FAIL-CLOSED: duplicate media handler")

          if controller.count("public synchronized void openViewUri(") != 1:
              raise SystemExit("FAIL-CLOSED: duplicate/missing openViewUri")

          if "-f 0x18000000" not in controller:
              raise SystemExit("FAIL-CLOSED: missing MULTIPLE_TASK launch flag")

          if " --display " not in controller:
              raise SystemExit("FAIL-CLOSED: missing explicit display routing")

          activity_path.write_text(activity, encoding="utf-8")
          controller_path.write_text(controller, encoding="utf-8")
          print("PASS: voice classifier and display routing patched")
          PY
      - name: Restore known-good keyboard V2A-V2C integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          import yaml

          workflow_path = Path(
              ".github/workflows/build-v10-carassistant-keyboard-pass.yml"
          )
          expected_sha = "668362096c408b425d12429e987af4a293bb1667"
          actual_sha = subprocess.check_output(
              ["git", "hash-object", str(workflow_path)],
              text=True
          ).strip()

          if actual_sha != expected_sha:
              raise SystemExit(
                  "FAIL-CLOSED: keyboard workflow SHA mismatch: " + actual_sha
              )

          workflow = yaml.safe_load(
              workflow_path.read_text(encoding="utf-8")
          )
          steps = workflow["jobs"]["build"]["steps"]

          required_names = [
              "Create Keyboard V2A",
              "Create Keyboard V2B Input Bridge",
              "Create Keyboard V2C Controller",
              "Patch V10CarActivity",
              "Verify Keyboard PASS",
          ]

          for name in required_names:
              matches = [
                  step for step in steps
                  if step.get("name") == name and step.get("run")
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      "FAIL-CLOSED: expected one keyboard step: " + name
                  )

              print("RUN verified keyboard step:", name)
              subprocess.run(
                  [
                      "bash", "-e", "-u", "-o", "pipefail", "-c",
                      matches[0]["run"]
                  ],
                  check=True,
              )

          print("PASS: keyboard V2A/V2B/V2C integrated")
          PY
      - name: Verify CarAssistant keyboard
        shell: bash
        run: |
          set -euo pipefail
          ACTIVITY="v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java"
          BASE="v10-source/app/src/main/java/com/carassistant/v10"

          test -f "$ACTIVITY" || {
          echo "::error::Không tìm thấy V10CarActivity.java"
          exit 1
          }

          for file in \
          "CarAssistantKeyboard.java" \
          "CarAssistantInputBridge.java" \
          "CarAssistantKeyboardController.java"; do
          test -f "$BASE/$file" || {
          echo "::error::Thiếu lớp bàn phím: $file"
          exit 1
          }
          done

          grep -Fq "private CarAssistantKeyboardController keyboardController;" "$ACTIVITY" || {
          echo "::error::V10CarActivity chưa khai báo keyboardController"
          exit 1
          }

          grep -Fq "keyboardController.start();" "$ACTIVITY" || {
          echo "::error::Chưa khởi động bộ điều khiển bàn phím"
          exit 1
          }

          grep -Fq "keyboardController.stop();" "$ACTIVITY" || {
          echo "::error::Chưa dừng bộ điều khiển bàn phím khi huỷ Activity"
          exit 1
          }

          grep -Fq "RootShellSession" "$BASE/CarAssistantInputBridge.java" || {
          echo "::error::Input bridge chưa dùng RootShellSession"
          exit 1
          }

          grep -Fq "mInputShown" "$BASE/CarAssistantKeyboardController.java" || {
          echo "::error::Controller chưa kiểm tra trạng thái bàn phím hệ thống"
          exit 1
          }

          echo "PASS: Đủ 3 lớp bàn phím, Activity đã nối controller, có input bridge và kiểm tra trạng thái IME."

      - name: Validate patch and protect passing files
        shell: bash
        run: |
