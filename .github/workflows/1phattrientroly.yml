      - name: Fix voice command routing and Android Auto display launch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          base = Path("v10-source/app/src/main/java/com/carassistant/v10")
          activity_path = base / "V10CarActivity.java"
          controller_path = base / "V10DisplayController.java"

          activity = activity_path.read_text(encoding="utf-8")
          controller = controller_path.read_text(encoding="utf-8")

          def replace_method(source, name, next_name, replacement):
              pattern = re.compile(
                  r"(?ms)^([ \t]*)private (?:void|boolean|String|AppInfo) "
                  + re.escape(name)
                  + r"\b.*?(?=^[ \t]*private (?:void|boolean|String|AppInfo) "
                  + re.escape(next_name) + r"\b)"
              )
              matches = list(pattern.finditer(source))
              if len(matches) != 1:
                  raise SystemExit(
                      "FAIL-CLOSED: method boundary "
                      + name + " -> " + next_name
                      + "; found " + str(len(matches))
                  )
              indent = matches[0].group(1)
              body = "\n".join(
                  indent + line if line else ""
                  for line in replacement.strip("\n").splitlines()
              ) + "\n\n"
              return (
                  source[:matches[0].start()]
                  + body
                  + source[matches[0].end():]
              )

          # 1. Resolve packages even when they are not already in the
          #    launcher's cached list. Never substitute another app.
          find_package = r"""
          private AppInfo findAppByPackage(String packageName) {
              if (packageName == null || packageName.trim().isEmpty()) {
                  return null;
              }

              for (AppInfo app : apps) {
                  if (packageName.equals(app.component.getPackageName())) {
                      return app;
                  }
              }

              Intent launch =
                      getPackageManager().getLaunchIntentForPackage(packageName);
              if (launch == null || launch.getComponent() == null) {
                  return null;
              }

              String label = packageName;
              try {
                  CharSequence appLabel = getPackageManager().getApplicationLabel(
                          getPackageManager().getApplicationInfo(packageName, 0));
                  if (appLabel != null) label = appLabel.toString();
              } catch (PackageManager.NameNotFoundException ignored) {
              }

              return new AppInfo(launch.getComponent(), label);
          }
          """
          activity = replace_method(
              activity, "findAppByPackage", "findAppByComponent", find_package
          )

          # 2. Save independent defaults for VIDEO and MUSIC.
          #    Keep legacy keys for compatibility with older code.
          picker = r"""
          private void addPickerPackage(
                  LinearLayout choices, String label, String packageName) {
              AppInfo app = findAppByPackage(packageName);
              if (app == null) {
                  TextView unavailable = text(
                          label + " — chưa cài hoặc không khả dụng",
                          13, Color.LTGRAY);
                  choices.addView(unavailable,
                          new LinearLayout.LayoutParams(-1, dp(44)));
                  return;
              }

              TextView option = sidebarButton(label);
              option.setGravity(Gravity.CENTER_VERTICAL | Gravity.START);
              option.setMaxLines(2);

              LinearLayout.LayoutParams params =
                      new LinearLayout.LayoutParams(-1, dp(48));
              params.setMargins(0, dp(2), 0, dp(2));
              choices.addView(option, params);

              option.setOnClickListener(v -> {
                  boolean video =
                          packageName.equals("com.google.android.youtube")
                          || packageName.equals("app.revanced.android.youtube")
                          || packageName.equals("app.morphe.android.youtube");

                  String category = video ? "video" : "music";
                  String componentKey = "default_" + category + "_component";
                  String packageKey = "default_" + category + "_package";
                  String labelKey = "default_" + category + "_label";

                  SharedPreferences prefs = getSharedPreferences(
                          "carassistant_command_dispatch", MODE_PRIVATE);

                  prefs.edit()
                          .putString(componentKey,
                                  app.component.flattenToString())
                          .putString(packageKey, packageName)
                          .putString(labelKey, label)
                          .putString("default_component",
                                  app.component.flattenToString())
                          .putString("default_package", packageName)
                          .putString("default_label", label)
                          .apply();

                  Toast.makeText(this,
                          "Đã lưu mặc định " + (video ? "VIDEO: " : "NHẠC: ")
                                  + label,
                          Toast.LENGTH_SHORT).show();
              });
          }
          """
          activity = replace_method(
              activity, "addPickerPackage", "closeDefaultAppPicker", picker
          )

          # 3. Classify media commands. Search only when the user explicitly
          #    says "tìm" or "search". "Mở video/nhạc" launches an app only.
          classifier = r"""
          private boolean isMediaCommand(String original, String normalized) {
              String c = normalizeVoiceText(original);

              boolean media =
                      c.contains("video") || c.contains("phim")
                      || c.contains("nhac") || c.contains("bai hat")
                      || c.contains("youtube") || c.contains("spotify")
                      || c.contains("zing mp3") || c.contains("zingmp3")
                      || c.contains("revanced") || c.contains("morphe");

              boolean action =
                      c.matches(".*\\b(tim|search)\\b.*")
                      || c.contains("mo ")
                      || c.startsWith("phat ")
