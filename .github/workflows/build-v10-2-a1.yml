name: Build Car Assistant V10.2-A1 Input

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # GRADLE 8.13
      # ============================================================

      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            https://services.gradle.org/distributions/gradle-8.13-bin.zip

          unzip -q \
            gradle-8.13-bin.zip \
            -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-8.13/bin" \
            >> "$GITHUB_PATH"

      # ============================================================
      # PREPARE FROM V10.1.3 SOURCE
      # ============================================================

      - name: Prepare V10.2 source
        shell: bash
        run: |
          set -euo pipefail

          test -d "v9-source/android-project/v9-source"

          rm -rf v10-source

          cp -R \
            v9-source/android-project/v9-source \
            v10-source

          find v10-source \
            -type f \
            -name '*.java' \
            -print0 | xargs -0 sed -i \
              -e 's/com\.carassistant\.v9/com.carassistant.v10/g' \
              -e 's/Car Assistant V9/Car Assistant V10/g' \
              -e 's/AACast V9/AACast V10/g'

          find v10-source \
            -type f \
            -name '*.xml' \
            -print0 | xargs -0 sed -i \
              -e 's/com\.carassistant\.v9/com.carassistant.v10/g' \
              -e 's/Car Assistant V9/Car Assistant V10/g' \
              -e 's/AACast V9/AACast V10/g'

          find v10-source \
            -type f \
            -name '*.gradle' \
            -print0 | xargs -0 sed -i \
              -e 's/com\.carassistant\.v9/com.carassistant.v10/g'

      # ============================================================
      # REMOVE OLD ACTIVITIES / OLD V10
      # ============================================================

      - name: Remove old files
        shell: bash
        run: |
          set -euo pipefail

          JAVA="v10-source/app/src/main/java"

          find "$JAVA" \
            -type f \
            \( \
              -name 'MainActivity.java' \
              -o -name 'AACastCarActivity.java' \
              -o -name 'LeaseTicker.java' \
              -o -name 'V10LauncherActivity.java' \
              -o -name 'V10CarActivity.java' \
              -o -name 'V10ProjectionSession.java' \
              -o -name 'V10InputController.java' \
              -o -name 'V10Display.java' \
              -o -name 'V10SessionStore.java' \
            \) \
            -delete

      # ============================================================
      # V10 SESSION STORE
      # ============================================================

      - name: Write V10SessionStore
        shell: bash
        run: |
          set -euo pipefail

          cat > v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java <<'EOF'
          package com.carassistant.v10;

          import android.content.ComponentName;
          import android.content.Context;
          import android.content.SharedPreferences;

          public final class V10SessionStore {

              private static final String PREFS = "v10_session";
              private static final String TARGET = "target_component";

              private V10SessionStore() {
              }

              private static SharedPreferences prefs(
                      Context context) {

                  return context.getSharedPreferences(
                          PREFS,
                          Context.MODE_PRIVATE);
              }

              public static void setTarget(
                      Context context,
                      ComponentName component) {

                  SharedPreferences.Editor editor =
                          prefs(context).edit();

                  if (component == null) {
                      editor.remove(TARGET);
                  } else {
                      editor.putString(
                              TARGET,
                              component.flattenToString());
                  }

                  editor.apply();
              }

              public static ComponentName getTarget(
                      Context context) {

                  String value =
                          prefs(context).getString(
                                  TARGET,
                                  null);

                  if (value == null || value.isEmpty()) {
                      return null;
                  }

                  return ComponentName.unflattenFromString(
                          value);
              }

              public static void clearTarget(
                      Context context) {

                  prefs(context)
                          .edit()
                          .remove(TARGET)
                          .apply();
              }
          }
          EOF

      # ============================================================
      # V10 DISPLAY
      # ============================================================

      - name: Write V10Display
        shell: bash
        run: |
          set -euo pipefail

          cat > v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10Display.java <<'EOF'
          package com.carassistant.v10;

          public final class V10Display {

              public static final String PACKAGE =
                      "com.carassistant.v10";

              public static final String PREFIX =
                      "Car Assistant V10 ";

              private V10Display() {
              }

              public static String nameFor(int index) {
                  return PREFIX + (index + 1);
              }

              public static boolean matches(
                      String ownerPackage,
                      String name,
                      int type,
                      int ownerUid) {

                  if (!PACKAGE.equals(ownerPackage)
                          || type != 5
                          || ownerUid < 10000) {
                      return false;
                  }

                  return (PREFIX + "1").equals(name);
              }
          }
          EOF

      # ============================================================
      # V10 PROJECTION SESSION
      # ============================================================

      - name: Write V10ProjectionSession
        shell: bash
        run: |
          set -euo pipefail

          cat > v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java <<'EOF'
          package com.carassistant.v10;

          import android.content.ComponentName;
          import android.content.Context;
          import android.graphics.SurfaceTexture;
          import android.hardware.display.DisplayManager;
          import android.os.Process;
          import android.util.Log;
          import android.view.Display;
          import android.view.Surface;
          import android.view.TextureView;

          public final class V10ProjectionSession
                  implements TextureView.SurfaceTextureListener {

              private static final String TAG =
                      "CarAssistantV10Projection";

              private final Context context;

              private final RootShellSession rootShell =
                      new RootShellSession();

              private TextureView textureView;
              private ComponentName target;

              private Display display;

              private android.hardware.display.VirtualDisplay
                      virtualDisplay;

              private Surface surface;

              private boolean destroyed;

              private int contentWidth;
              private int contentHeight;

              public V10ProjectionSession(
                      Context context) {

                  this.context =
                          context.getApplicationContext();
              }

              public void attachTextureView(
                      TextureView view) {

                  textureView = view;

                  view.setSurfaceTextureListener(this);

                  if (view.isAvailable()) {
                      ensureDisplay();
                  }
              }

              public void setTarget(
                      ComponentName component) {

                  if (component == null) {

                      target = null;
                      release();

                      return;
                  }

                  boolean changed =
                          !component.equals(target);

                  target = component;

                  if (changed
                          && virtualDisplay != null) {

                      releaseDisplayOnly();
                  }

                  ensureDisplay();
              }

              public boolean isActive() {

                  return !destroyed
                          && target != null
                          && virtualDisplay != null
                          && display != null;
              }

              private void ensureDisplay() {

                  if (destroyed
                          || target == null
                          || textureView == null
                          || !textureView.isAvailable()
                          || virtualDisplay != null) {

                      return;
                  }

                  SurfaceTexture st =
                          textureView.getSurfaceTexture();

                  if (st == null) {
                      return;
                  }

                  int width =
                          textureView.getWidth();

                  int height =
                          textureView.getHeight();

                  if (width < 1 || height < 1) {
                      return;
                  }

                  try {

                      contentWidth = width;
                      contentHeight = height;

                      st.setDefaultBufferSize(
                              width,
                              height);

                      Surface newSurface =
                              new Surface(st);

                      DisplayManager manager =
                              (DisplayManager)
                                      context.getSystemService(
                                              Context.DISPLAY_SERVICE);

                      if (manager == null) {

                          newSurface.release();

                          throw new IllegalStateException(
                                  "DisplayManager unavailable");
                      }

                      android.hardware.display.VirtualDisplay
                              newVirtualDisplay =
                              manager.createVirtualDisplay(
                                      V10Display.nameFor(0),
                                      width,
                                      height,
                                      160,
                                      newSurface,
                                      10);

                      if (newVirtualDisplay == null) {

                          newSurface.release();

                          throw new IllegalStateException(
                                  "Cannot create virtual display");
                      }

                      Display newDisplay =
                              newVirtualDisplay.getDisplay();

                      if (newDisplay == null) {

                          newVirtualDisplay.release();
                          newSurface.release();

                          throw new IllegalStateException(
                                  "Virtual display has no Display");
                      }

                      surface = newSurface;
                      virtualDisplay = newVirtualDisplay;
                      display = newDisplay;

                      launchTarget();

                  } catch (RuntimeException e) {

                      release();

                      Log.w(
                              TAG,
                              "Display creation failed",
                              e);
                  }
              }

              private void launchTarget() {

                  if (display == null
                          || target == null) {
                      return;
                  }

                  final int displayId =
                          display.getDisplayId();

                  final int userId =
                          Process.myUid() / 100000;

                  final String packageName =
                          target.getPackageName()
                                  .replace(
                                          "'",
                                          "'\"'\"'");

                  final String flat =
                          target.flattenToString()
                                  .replace(
                                          "'",
                                          "'\"'\"'");

                  final String command =
                          "/system/bin/am force-stop '"
                                  + packageName
                                  + "'; "
                                  + "/system/bin/am start"
                                  + " --user "
                                  + userId
                                  + " --display "
                                  + displayId
                                  + " --windowingMode 1"
                                  + " -a android.intent.action.MAIN"
                                  + " -c android.intent.category.LAUNCHER"
                                  + " -f 0x18000000"
                                  + " -n '"
                                  + flat
                                  + "'";

                  RootShellSession.EXEC.execute(
                          () -> {

                              try {

                                  rootShell.run(
                                          10,
                                          command);

                              } catch (Throwable t) {

                                  Log.w(
                                          TAG,
                                          "Launch failed",
                                          t);
                              }
                          });
              }

              private float mapX(float x) {

                  if (textureView == null
                          || contentWidth <= 0) {
                      return x;
                  }

                  float viewWidth =
                          textureView.getWidth();

                  if (viewWidth <= 0) {
                      return x;
                  }

                  return clamp(
                          x * contentWidth / viewWidth,
                          0,
                          contentWidth - 1);
              }

              private float mapY(float y) {

                  if (textureView == null
                          || contentHeight <= 0) {
                      return y;
                  }

                  float viewHeight =
                          textureView.getHeight();

                  if (viewHeight <= 0) {
                      return y;
                  }

                  return clamp(
                          y * contentHeight / viewHeight,
                          0,
                          contentHeight - 1);
              }

              private static float clamp(
                      float value,
                      float min,
                      float max) {

                  return Math.max(
                          min,
                          Math.min(
                                  max,
                                  value));
              }

              public void tap(
                      float x,
                      float y) {

                  if (!isActive()) {
                      return;
                  }

                  final int displayId =
                          display.getDisplayId();

                  final int ix =
                          Math.round(mapX(x));

                  final int iy =
                          Math.round(mapY(y));

                  final String command =
                          "/system/bin/input -d "
                                  + displayId
                                  + " tap "
                                  + ix
                                  + " "
                                  + iy;

                  RootShellSession.EXEC.execute(
                          () -> {

                              try {

                                  rootShell.run(
                                          5,
                                          command);

                              } catch (Throwable t) {

                                  Log.w(
                                          TAG,
                                          "Tap failed",
                                          t);
                              }
                          });
              }

              public void swipe(
                      float startX,
                      float startY,
                      float endX,
                      float endY,
                      long duration) {

                  if (!isActive()) {
                      return;
                  }

                  final int displayId =
                          display.getDisplayId();

                  final int x1 =
                          Math.round(mapX(startX));

                  final int y1 =
                          Math.round(mapY(startY));

                  final int x2 =
                          Math.round(mapX(endX));

                  final int y2 =
                          Math.round(mapY(endY));

                  final long safeDuration =
                          Math.max(
                                  80L,
                                  Math.min(
                                          800L,
                                          duration));

                  final String command =
                          "/system/bin/input -d "
                                  + displayId
                                  + " swipe "
                                  + x1
                                  + " "
                                  + y1
                                  + " "
                                  + x2
                                  + " "
                                  + y2
                                  + " "
                                  + safeDuration;

                  RootShellSession.EXEC.execute(
                          () -> {

                              try {

                                  rootShell.run(
                                          5,
                                          command);

                              } catch (Throwable t) {

                                  Log.w(
                                          TAG,
                                          "Swipe failed",
                                          t);
                              }
                          });
              }

              public void back() {

                  if (!isActive()) {
                      return;
                  }

                  final int displayId =
                          display.getDisplayId();

                  final String command =
                          "/system/bin/input -d "
                                  + displayId
                                  + " keyevent 4";

                  RootShellSession.EXEC.execute(
                          () -> {

                              try {

                                  rootShell.run(
                                          5,
                                          command);

                              } catch (Throwable t) {

                                  Log.w(
                                          TAG,
                                          "Back failed",
                                          t);
                              }
                          });
              }

              private void releaseDisplayOnly() {

                  if (virtualDisplay != null) {

                      try {
                          virtualDisplay.release();
                      } catch (Throwable ignored) {
                      }
                  }

                  virtualDisplay = null;
                  display = null;

                  if (surface != null) {

                      try {
                          surface.release();
                      } catch (Throwable ignored) {
                      }
                  }

                  surface = null;
              }

              public void release() {
                  releaseDisplayOnly();
              }

              public void destroy() {

                  if (destroyed) {
                      return;
                  }

                  destroyed = true;

                  release();

                  rootShell.destroy();
              }

              @Override
              public void onSurfaceTextureAvailable(
                      SurfaceTexture surface,
                      int width,
                      int height) {

                  ensureDisplay();
              }

              @Override
              public void onSurfaceTextureSizeChanged(
                      SurfaceTexture surface,
                      int width,
                      int height) {

                  contentWidth = width;
                  contentHeight = height;
              }

              @Override
              public boolean onSurfaceTextureDestroyed(
                      SurfaceTexture surface) {

                  releaseDisplayOnly();

                  return true;
              }

              @Override
              public void onSurfaceTextureUpdated(
                      SurfaceTexture surface) {
              }
          }
          EOF

      # ============================================================
      # V10 INPUT CONTROLLER
      # ============================================================

      - name: Write V10InputController
        shell: bash
        run: |
          set -euo pipefail

          cat > v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10InputController.java <<'EOF'
          package com.carassistant.v10;

          import android.content.Context;
          import android.view.MotionEvent;
          import android.view.View;

          public final class V10InputController {

              private final V10ProjectionSession session;

              private float downX;
              private float downY;
              private long downTime;
              private boolean moved;

              private static final float MOVE_SLOP = 12f;

              private static final long
                      SWIPE_MIN_DURATION = 80L;

              private static final long
                      SWIPE_MAX_DURATION = 800L;

              public V10InputController(
                      Context context,
                      V10ProjectionSession session) {

                  this.session = session;
              }

              public View.OnTouchListener
                      createListener() {

                  return (view, event) -> {

                      switch (
                              event.getActionMasked()) {

                          case MotionEvent.ACTION_DOWN:

                              downX = event.getX();
                              downY = event.getY();

                              downTime =
                                      event.getEventTime();

                              moved = false;

                              return true;

                          case MotionEvent.ACTION_MOVE:

                              if (event.getPointerCount()
                                      == 1) {

                                  float dx =
                                          event.getX()
                                                  - downX;

                                  float dy =
                                          event.getY()
                                                  - downY;

                                  if (Math.abs(dx)
                                              > MOVE_SLOP
                                          || Math.abs(dy)
                                              > MOVE_SLOP) {

                                      moved = true;
                                  }
                              }

                              return true;

                          case MotionEvent.ACTION_UP:

                              float upX =
                                      event.getX();

                              float upY =
                                      event.getY();

                              long duration =
                                      event.getEventTime()
                                              - downTime;

                              if (!moved) {

                                  session.tap(
                                          upX,
                                          upY);

                              } else {

                                  duration =
                                          Math.max(
                                                  SWIPE_MIN_DURATION,
                                                  Math.min(
                                                          SWIPE_MAX_DURATION,
                                                          duration));

                                  session.swipe(
                                          downX,
                                          downY,
                                          upX,
                                          upY,
                                          duration);
                              }

                              return true;

                          case MotionEvent.ACTION_CANCEL:

                              moved = false;

                              return true;

                          default:

                              return true;
                      }
                  };
              }
          }
          EOF

      # ============================================================
      # V10 CAR ACTIVITY
      # ============================================================

      - name: Write V10CarActivity
        shell: bash
        run: |
          set -euo pipefail

          cat > v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java <<'EOF'
          package com.carassistant.v10;

          import android.content.ComponentName;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.TextureView;
          import android.widget.FrameLayout;

          import com.google.android.apps.auto.sdk.CarActivity;

          public final class V10CarActivity
                  extends CarActivity {

              private final Handler handler =
                      new Handler(
                              Looper.getMainLooper());

              private TextureView textureView;

              private V10ProjectionSession session;

              private V10InputController
                      inputController;

              private boolean resumed;

              private final Runnable targetPoller =
                      new Runnable() {

                          @Override
                          public void run() {

                              if (!resumed
                                      || session == null) {
                                  return;
                              }

                              ComponentName target =
                                      V10SessionStore
                                              .getTarget(
                                                      V10CarActivity.this);

                              if (target != null) {

                                  session.setTarget(
                                          target);
                              }

                              handler.postDelayed(
                                      this,
                                      500);
                          }
                      };

              private void applyChrome() {

                  try {

                      getCarUiController()
                              .getStatusBarController()
                              .hideAppHeader();

                      getCarUiController()
                              .getMenuController()
                              .hideMenuButton();

                  } catch (RuntimeException ignored) {
                  }
              }

              @Override
              public void onCreate(
                      Bundle state) {

                  setTheme(
                          R.style.Theme_AACast);

                  super.onCreate(state);

                  setIgnoreConfigChanges(-1);

                  applyChrome();
              }

              @Override
              public void onResume() {

                  super.onResume();

                  resumed = true;

                  applyChrome();

                  if (textureView == null) {

                      FrameLayout root =
                              new FrameLayout(this);

                      root.setBackgroundColor(
                              Color.BLACK);

                      textureView =
                              new TextureView(this);

                      root.addView(
                              textureView,
                              new FrameLayout.LayoutParams(
                                      FrameLayout.LayoutParams.MATCH_PARENT,
                                      FrameLayout.LayoutParams.MATCH_PARENT));

                      session =
                              new V10ProjectionSession(
                                      this);

                      session.attachTextureView(
                              textureView);

                      inputController =
                              new V10InputController(
                                      this,
                                      session);

                      textureView.setOnTouchListener(
                              inputController
                                      .createListener());

                      setContentView(root);
                  }

                  handler.removeCallbacks(
                          targetPoller);

                  handler.post(
                          targetPoller);
              }

              @Override
              public void onPause() {

                  resumed = false;

                  handler.removeCallbacks(
                          targetPoller);

                  super.onPause();
              }

              @Override
              public void onBackPressed() {

                  if (session != null
                          && session.isActive()) {

                      session.back();

                      return;
                  }

                  super.onBackPressed();
              }

              @Override
              public void onStop() {

                  resumed = false;

                  handler.removeCallbacks(
                          targetPoller);

                  if (session != null) {
                      session.release();
                  }

                  super.onStop();
              }

              @Override
              public void onDestroy() {

                  resumed = false;

                  handler.removeCallbacks(
                          targetPoller);

                  if (session != null) {

                      session.destroy();

                      session = null;
                  }

                  textureView = null;
                  inputController = null;

                  super.onDestroy();
              }

              @Override
              public void onWindowFocusChanged(
                      boolean hasFocus,
                      boolean touchMode) {

                  super.onWindowFocusChanged(
                          hasFocus,
                          touchMode);

                  if (hasFocus) {
                      applyChrome();
                  }
              }
          }
          EOF

      # ============================================================
      # ADAPT INPUT HOOKS
      # ============================================================

      - name: Adapt V10 InputHooks
        shell: bash
        run: |
          set -euo pipefail

          HOOK="v10-source/app/src/main/java/com/hieptran/aacast/doudou/hook/InputHooks.java"

          sed -i \
            -e 's/AACastDisplay/V10Display/g' \
            -e 's/\[AACast Input\]/[V10 Input]/g' \
            "$HOOK"

          grep -q \
            'V10Display.matches' \
            "$HOOK"

      # ============================================================
      # CAR SERVICE
      # ============================================================

      - name: Write AACastCarService
        shell: bash
        run: |
          set -euo pipefail

          cat > v10-source/app/src/main/java/com/hieptran/aacast/doudou/AACastCarService.java <<'EOF'
          package com.carassistant.v10;

          import com.google.android.apps.auto.sdk.CarActivity;
          import com.google.android.apps.auto.sdk.CarActivityService;

          public final class AACastCarService
                  extends CarActivityService {

              @Override
              public Class<? extends CarActivity>
                      getCarActivity() {

                  return V10CarActivity.class;
              }
          }
          EOF

      # ============================================================
      # REBUILD MANIFEST
      # ============================================================

      - name: Rebuild Manifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          sed -i \
            -e 's/com\.carassistant\.v9/com.carassistant.v10/g' \
            -e 's/Car Assistant V9/Car Assistant V10/g' \
            -e 's/AACast V9/AACast V10/g' \
            "$MANIFEST"

          python3 - "$MANIFEST" <<'PY'
          import re
          import sys

          path = sys.argv[1]

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              text = f.read()

          names = [
              "MainActivity",
              "AACastCarActivity",
              "V10LauncherActivity",
              "V10CarActivity",
          ]

          for name in names:

              pattern = (
                  r'\s*<activity\b'
                  r'[^>]*android:name="[^"]*'
                  + re.escape(name)
                  + r'"[^>]*'
                  r'(?:/>|>.*?</activity>)'
              )

              text = re.sub(
                  pattern,
                  '',
                  text,
                  flags=re.S,
              )

          application_match = re.search(
              r'(<application\b[^>]*>)',
              text,
              flags=re.S,
          )

          if not application_match:
              raise SystemExit(
                  "ERROR: <application> not found"
              )

          activities = r'''
                  <activity
                      android:name="com.carassistant.v10.V10LauncherActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name="com.carassistant.v10.V10CarActivity"
                      android:exported="true" />
          '''

          pos = application_match.end()

          text = (
              text[:pos]
              + activities
              + text[pos:]
          )

          with open(
              path,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(text)
          PY

      # ============================================================
      # VERIFY MANIFEST
      # ============================================================

      - name: Verify Manifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          grep -q \
            'com.carassistant.v10.V10LauncherActivity' \
            "$MANIFEST"

          grep -q \
            'com.carassistant.v10.V10CarActivity' \
            "$MANIFEST"

          if grep -q \
              'android:name="[^"]*MainActivity' \
              "$MANIFEST"; then

              echo "ERROR: MainActivity remains"
              exit 1
          fi

          if grep -q \
              'android:name="[^"]*AACastCarActivity' \
              "$MANIFEST"; then

              echo "ERROR: AACastCarActivity remains"
              exit 1
          fi

          test "$(grep -c \
            'com.carassistant.v10.V10LauncherActivity' \
            "$MANIFEST")" -eq 1

          test "$(grep -c \
            'com.carassistant.v10.V10CarActivity' \
            "$MANIFEST")" -eq 1

      # ============================================================
      # VERIFY SOURCE
      # ============================================================

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail

          JAVA="v10-source/app/src/main/java"
          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          test "$(find "$JAVA" \
            -name 'V10LauncherActivity.java' \
            | wc -l)" -eq 1

          test "$(find "$JAVA" \
            -name 'V10CarActivity.java' \
            | wc -l)" -eq 1

          test "$(find "$JAVA" \
            -name 'V10ProjectionSession.java' \
            | wc -l)" -eq 1

          test "$(find "$JAVA" \
            -name 'V10InputController.java' \
            | wc -l)" -eq 1

          test "$(find "$JAVA" \
            -name 'V10Display.java' \
            | wc -l)" -eq 1

          test "$(find "$JAVA" \
            -name 'V10SessionStore.java' \
            | wc -l)" -eq 1

          if grep -R \
              'com.carassistant.v9' \
              "$JAVA" \
              "$MANIFEST" \
              2>/dev/null; then

              echo "ERROR: V9 package remains"
              exit 1
          fi

          OLD_FILES="$(find "$JAVA" \
            -type f \
            \( \
              -name 'MainActivity.java' \
              -o -name 'AACastCarActivity.java' \
            \))"

          if [ -n "$OLD_FILES" ]; then

              echo "ERROR: Old V9 activity source remains:"
              echo "$OLD_FILES"
              exit 1
          fi

      # ============================================================
      # VERIFY INPUT
      # ============================================================

      - name: Verify Input Engine
        shell: bash
        run: |
          set -euo pipefail

          INPUT="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10InputController.java"
          SESSION="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          grep -q 'ACTION_DOWN' "$INPUT"
          grep -q 'ACTION_MOVE' "$INPUT"
          grep -q 'ACTION_UP' "$INPUT"
          grep -q 'session.swipe' "$INPUT"

          grep -q 'swipe ' "$SESSION"
          grep -q 'input -d' "$SESSION"
          grep -q 'keyevent 4' "$SESSION"

          if grep -q \
              'status.setText' \
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"; then

              echo "ERROR: Debug status TextView remains"
              exit 1
          fi

      # ============================================================
      # VERIFY PROJECTION INVARIANTS
      # ============================================================

      - name: Verify V9 projection invariants
        shell: bash
        run: |
          set -euo pipefail

          SESSION="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
          HOOK="v10-source/app/src/main/java/com/hieptran/aacast/doudou/hook/InputHooks.java"

          grep -q 'setDefaultBufferSize' "$SESSION"
          grep -q 'new Surface(st)' "$SESSION"
          grep -q 'createVirtualDisplay' "$SESSION"
          grep -q 'V10Display.nameFor(0)' "$SESSION"
          grep -q '160' "$SESSION"
          grep -q '10);' "$SESSION"
          grep -q 'Process.myUid() / 100000' "$SESSION"
          grep -q -- '--display' "$SESSION"
          grep -q -- '--windowingMode 1' "$SESSION"
          grep -q 'input -d' "$SESSION"
          grep -q 'V10Display.matches' "$HOOK"

      # ============================================================
      # BUILD
      # ============================================================

      - name: Gradle version
        shell: bash
        run: |
          set -euo pipefail
          gradle --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd v10-source

          gradle \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          sha256sum "$APK"

          ls -lh "$APK"

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload V10.2-A1 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10.2-A1-debug
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit V10.2-A1
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .github/workflows/build-v10-2-a1.yml

          git commit \
            -m "Build Car Assistant V10.2-A1 Input Engine" \
            || echo "Nothing to commit"

          git push
