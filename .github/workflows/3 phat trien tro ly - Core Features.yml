          indent = matches[0].group(1)
          helper = r'''
          private void launchProjectionWithUri(
                  ComponentName component, String uri, String packageName) {
              if (component == null || session == null) return;
            
              if (activeTarget != null && !activeTarget.equals(component)) {
              android.util.Log.i("CarAssistantV10Projection",
            "[TARGET_SWITCH] from=" + activeTarget.flattenToString()
