          activity = activity_path.read_text(encoding="utf-8")
          session = session_path.read_text(encoding="utf-8")
          controller = controller_path.read_text(encoding="utf-8")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      "FAIL-CLOSED: " + label
                      + "; expected 1 anchor, got " + str(count)
                  )
              print("PASS anchor:", label)
              return text.replace(old, new, 1)
          
          # Preserve the projection surface during normal target switching.
          activity = replace_once(
              activity,
              "        session.release();",
              (
                  '        android.util.Log.i("CarAssistantV10Projection", '
                  '"[TARGET_SWITCH] surface=KEEP_ATTACHED");'
              ),
              "preserve surface during normal target switch"
          )

          # 1. Add a single-intent launcher to the existing display controller.
          controller = replace_once(
              controller,
              "    private void execute(String command, String message) {",
              r'''    public synchronized void launchNewTaskWithUri(
                  ComponentName component, String uri, String packageName) {
                  if (!isReady() || component == null
                          || uri == null || uri.trim().isEmpty()) {
                      return;
                  }

                  target = component;
                  launched = true;

                  final int displayId = display.getDisplayId();
                  final int userId = Process.myUid() / 100000;

                  String command = "/system/bin/am start"
                          + " --user " + userId
                          + " --display " + displayId
                          + " --windowingMode 1"
                          + " -a android.intent.action.VIEW"
                          + " -d " + shellQuote(uri)
                          + " -f 0x10000000";

                  if (packageName != null && !packageName.trim().isEmpty()) {
                      command += " -p " + shellQuote(packageName);
                  }

                  execute(command, "Projected URI launch failed");
          }

          private static String shellQuote(String value) {
              return "'" + value.replace("'", "'\"'\"'") + "'";
          }

          private void execute(String command, String message) {

          # Verify the URI launcher and shell-quoting helper.
          if controller.count("private static String shellQuote(") != 1:
          raise SystemExit(
              "FAIL-CLOSED: shellQuote helper missing or duplicated"
          )
          if controller.count("public synchronized void launchNewTaskWithUri(") != 1:
          raise SystemExit(
              "FAIL-CLOSED: direct URI launcher missing or duplicated"
          )
          if " --display " not in controller:
          raise SystemExit(
              "FAIL-CLOSED: display-targeted launch missing"
          )

          # 2. Let the projection session queue the URI before launching
          #    a newly selected target. Reuse openViewUri for an already
          #    active matching target.
          session = replace_once(
              session,
              "    private ComponentName target;\n",
              "    private ComponentName target;\n"
              "    private String pendingLaunchUri;\n"
              "    private String pendingLaunchPackage;\n",
              "session pending URI fields"
          )

          session = replace_once(
              session,
              "    public boolean isActive() {",
              r'''    public void setTargetAndOpenUri(
              ComponentName component, String uri, String packageName) {
          if (destroyed || component == null
                  || uri == null || uri.trim().isEmpty()) {
              return;
          }

          if (target != null && target.equals(component)
                  && displayController.isReady()
                  && displayController.isLaunched()
                  && component.equals(displayController.getTarget())) {
              pendingLaunchUri = null;
          pendingLaunchPackage = null;
          displayController.launchNewTaskWithUri(
                  component, uri, packageName);
          taskSession.active();
          return;
          }

          boolean changed = target == null || !component.equals(target);
          target = component;
          pendingLaunchUri = uri;
          pendingLaunchPackage = packageName;

          if (changed) {
              taskSession.setTarget(component);
              if (displayController.isLaunched()) {
                  displayController.markNotLaunched();
              }
          }

          attachCurrentSurface();
          }

          public boolean isActive() {''',
              "session URI entry point"
          )

          session = replace_once(
              session,
              "    private void attachCurrentSurface() {",
              r'''    private boolean launchPendingUriIfAny() {
          if (pendingLaunchUri == null || pendingLaunchUri.trim().isEmpty()) {
              return false;
          }

          String uri = pendingLaunchUri;
          String packageName = pendingLaunchPackage;
          pendingLaunchUri = null;
