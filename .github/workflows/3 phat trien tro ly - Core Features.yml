              activeTarget = component;
              V10SessionStore.setTarget(this, component);

              launcherLayer.setVisibility(View.GONE);
              appPanel.setVisibility(View.GONE);
              dashboard.setVisibility(View.GONE);
              projectionLayer.setVisibility(View.VISIBLE);

              session.setTargetAndOpenUri(component, uri, packageName);
          }

          '''
          helper = "\n".join(
              indent + line if line else ""
              for line in helper.strip("\n").splitlines()
          ) + "\n\n"

          activity = (
              activity[:matches[0].start()]
              + helper
              + activity[matches[0].start():]
          )

          # Replace the old two-stage sequence with the single entry point.
          old_launch = re.compile(
              r"launchProjection\(target\.component\);"
              r"\s*handler\.postDelayed\("
              r"\s*\(\) -> openUriWhenReady\(url, requestedPackage, 8\),"
              r"\s*250L\);"
          )
          matches = list(old_launch.finditer(activity))
          if len(matches) != 1:
              raise SystemExit(
                  "FAIL-CLOSED: old two-stage launch sequence mismatch"
              )

          activity = old_launch.sub(
              "launchProjectionWithUri("
              "target.component, url, requestedPackage);",
              activity,
              count=1,
          )

          # 4. Verify all critical paths before writing any source file.
          checks = [
              (controller, "launchNewTaskWithUri(", "controller direct URI"),
              (session, "setTargetAndOpenUri(", "session URI entry point"),
              (session, "launchPendingUriIfAny()", "pending URI dispatch"),
              (activity, "launchProjectionWithUri(", "activity URI entry point"),
              (
                  activity,
                  "target.component, url, requestedPackage",
                  "voice media call site",
              ),
          ]
          for source, needle, label in checks:
              if needle not in source:
                  raise SystemExit(
                      "FAIL-CLOSED: verification failed: " + label
                  )

          # Save only after every anchor and verification succeeds.
          controller_path.write_text(controller, encoding="utf-8")
          session_path.write_text(session, encoding="utf-8")
          activity_path.write_text(activity, encoding="utf-8")

          print("PASS: projected voice search uses one launch intent")
          print("PASS: normal tap-selected app launch path is preserved")
          print("PASS: keyboard workflow and unrelated source files untouched")
          PY
