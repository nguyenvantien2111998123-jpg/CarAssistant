
name: 3 phat trien tro ly - Core Features

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout verified source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify workflow 2 source
        shell: bash
        run: |
          set -euo pipefail
          FILE=".github/workflows/2phattrientroly.yml"
          EXPECTED="94788a14b175df66cdb96c41b4cbbae4e05dedf2"
          test -s "$FILE"
          ACTUAL="$(git hash-object "$FILE")"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Workflow 2 SHA mismatch"
            echo "Expected: $EXPECTED"
            echo "Actual: $ACTUAL"
            exit 1
          fi
          echo "PASS: workflow 2 source verified"

      - name: Install YAML parser
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-yaml

      - name: Run verified workflow 2 preparation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          path = Path(".github/workflows/2phattrientroly.yml")
          workflow = yaml.safe_load(path.read_text(encoding="utf-8"))
          steps = workflow["jobs"]["build"]["steps"]

          start = "Verify original workflow and required steps"
          stop = "Validate, build and package APK"
          names = [step.get("name") for step in steps]

          if names.count(start) != 1 or names.count(stop) != 1:
              raise SystemExit("FAIL-CLOSED: workflow 2 anchors mismatch")

          first = names.index(start)
          last = names.index(stop)
          if first >= last:
              raise SystemExit("FAIL-CLOSED: invalid workflow step order")

          for step in steps[first:last]:
              script = step.get("run")
              if not script:
                  continue
              name = step.get("name", "(unnamed)")
              print("RUN:", name, flush=True)
              subprocess.run(
                  ["bash", "-e", "-u", "-o", "pipefail", "-c", script],
                  check=True,
              )

          print("PASS: workflow 2 preparation completed")
          PY

      - name: Apply isolated navigation and media intent patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/"
              "V10CarActivity.java"
          )
          if not path.is_file():
              raise SystemExit("FAIL-CLOSED: Activity source missing")

          activity = path.read_text(encoding="utf-8")
          original = activity

          # Add navigation handling before media command handling.
          anchor = re.compile(
              r"(?m)^([ \t]*)if \(isMediaCommand\(original, command\)\) \{"
          )
          matches = list(anchor.finditer(activity))
          if len(matches) != 1:
              raise SystemExit(
                  "FAIL-CLOSED: media dispatch anchor mismatch"
              )

          indent = matches[0].group(1)
          replacement = (
              indent
              + "if (handleNavigationVoiceCommand(original, command)) return;\n"
              + matches[0].group(0)
          )
          activity = anchor.sub(lambda _: replacement, activity, count=1)

          # Install a navigation handler before the media classifier.
          classifier_anchor = re.compile(
              r"(?m)^([ \t]*)private boolean isMediaCommand\("
          )
          matches = list(classifier_anchor.finditer(activity))
          if len(matches) != 1:
              raise SystemExit(
                  "FAIL-CLOSED: media classifier anchor mismatch"
              )

          indent = matches[0].group(1)
          nav_method = r'''
          private boolean handleNavigationVoiceCommand(
                  String original, String normalized) {
              String command = normalizeVoiceText(original);

              boolean navigation =
                      command.contains("chi duong")
                      || command.contains("duong di")
                      || command.contains("tim duong");

              if (!navigation) return false;

              if (command.contains("ve nha")
                      || command.contains("den nha")
                      || command.contains("toi nha")
                      || command.contains("den co quan")
                      || command.contains("toi co quan")) {
                  Toast.makeText(this,
                          "Bạn cần cấu hình địa chỉ nhà/cơ quan trước.",
                          Toast.LENGTH_LONG).show();
                  return true;
              }

              String destination = original == null ? "" : original.trim();
              destination = destination.replaceFirst(
                      "(?i)^\\s*(chỉ đường đến|chi duong den|"
                      + "chỉ đường tới|chi duong toi|"
                      + "đường đi đến|duong di den|"
                      + "đường đi tới|duong di toi|"
                      + "tìm đường đến|tim duong den|"
                      + "tìm đường tới|tim duong toi)\\s*", "");
              destination = destination.replaceFirst(
                      "(?i)\\s+(trên|tren|bằng|bang)\\s+"
                      + "(google maps|maps).*$", "");
              destination = destination.trim();

              if (destination.isEmpty()) {
                  Toast.makeText(this,
                          "Bạn hãy nói rõ địa điểm cần đến.",
                          Toast.LENGTH_LONG).show();
                  return true;
              }

              AppInfo maps = findAppByPackage(
                      "com.google.android.apps.maps");
              if (maps == null) {
                  Toast.makeText(this,
                          "Chưa tìm thấy Google Maps trên điện thoại.",
                          Toast.LENGTH_LONG).show();
                  return true;
              }

              String url = "https://www.google.com/maps/dir/?api=1"
                      + "&destination=" + Uri.encode(destination);

              updateVoiceStatus(null);
              launchMediaSearchOnProjection(
                      maps, url, "com.google.android.apps.maps");
              Toast.makeText(this,
                      "Đang mở chỉ đường đến " + destination,
                      Toast.LENGTH_SHORT).show();
              return true;
          }

          '''
          nav_method = "\n".join(
              indent + line if line else ""
              for line in nav_method.strip("\n").splitlines()
          ) + "\n\n"

          activity = (
              activity[:matches[0].start()]
              + nav_method
              + activity[matches[0].start():]
          )

          # Broaden media intent detection while preserving ordinary app launch.
          classifier = re.compile(
              r"(?ms)^([ \t]*)private boolean isMediaCommand\(.*?"
              r"(?=^[ \t]*private boolean handleVoiceMediaSearch\()"
          )
          matches = list(classifier.finditer(activity))
          if len(matches) != 1:
              raise SystemExit(
                  "FAIL-CLOSED: classifier method boundary mismatch"
              )

          indent = matches[0].group(1)
          new_classifier = r'''
          private boolean isMediaCommand(String original, String normalized) {
              String c = normalizeVoiceText(original);

              boolean media =
                      c.contains("video") || c.contains("clip")
                      || c.contains("phim") || c.contains("playlist")
                      || c.contains("nhac") || c.contains("bai hat")
                      || c.contains("youtube") || c.contains("spotify")
                      || c.contains("zing mp3") || c.contains("zingmp3")
                      || c.contains("revanced") || c.contains("morphe");

              boolean action =
                      c.matches(".*\\\\b(tim|search|xem)\\\\b.*")
                      || c.contains("mo ")
                      || c.startsWith("phat ")
                      || c.startsWith("play ");

              return media && action;
          }

          '''
          new_classifier = "\n".join(
              indent + line if line else ""
              for line in new_classifier.strip("\n").splitlines()
          ) + "\n\n"

          activity = classifier.sub(
              lambda _: new_classifier,
              activity,
              count=1,
          )

          # Let "mở nhạc/video/playlist ..." trigger a search.
          search_pattern = re.compile(
              r'boolean searchRequested\s*=\s*'
              r'command\.matches\("[^"\n]*"\);'
          )

          matches = list(search_pattern.finditer(activity))
          if len(matches) != 1:
              raise SystemExit(
                  "FAIL-CLOSED: search intent pattern mismatch"
              )

          new_search = (
              'boolean explicitSearch =\n'
              '                      command.matches(".*\\\\b(tim|search)\\\\b.*");\n'
              '              boolean contentSearch =\n'
              '                      (command.contains("nhac")\n'
              '                      || command.contains("bai hat")\n'
              '                      || command.contains("playlist")\n'
              '                      || command.contains("video")\n'
              '                      || command.contains("clip")\n'
              '                      || command.contains("phim"))\n'
              '                      && (command.contains("mo ")\n'
              '                      || command.startsWith("phat ")\n'
              '                      || command.startsWith("play ")\n'
              '                      || command.startsWith("xem "));\n'
              '              boolean searchRequested = explicitSearch || contentSearch;'
          )

          activity = search_pattern.sub(
              lambda _: new_search, activity, count=1
          )

          # Teach the existing query extractor to remove playlist/clip labels.
          activity = activity.replace(
              "bài hát|bai hat|bài|bai|video|phim)",
              "bài hát|bai hat|bài|bai|video|phim|playlist|clip)",
          )

          required = [
              "private boolean handleNavigationVoiceCommand(",
              "com.google.android.apps.maps",
              "boolean explicitSearch",
              "boolean contentSearch",
              "launchMediaSearchOnProjection(target, url, pkg)",
          ]
          for item in required:
              if item not in activity:
                  raise SystemExit(
                      "FAIL-CLOSED: patch verification missing: " + item
                  )

          if activity.count("private boolean handleNavigationVoiceCommand(") != 1:
              raise SystemExit("FAIL-CLOSED: duplicate navigation handler")

          if activity == original:
              raise SystemExit("FAIL-CLOSED: no source changes applied")

          path.write_text(activity, encoding="utf-8")
          print("PASS: navigation/media intent patch applied")
          print("PASS: voice, mic, timeout and keyboard code left untouched")
          PY
      
      - name: Fix media defaults and category routing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/"
              "V10CarActivity.java"
          )
          if not path.is_file():
              raise SystemExit("FAIL-CLOSED: Activity source missing")

          source = path.read_text(encoding="utf-8")

          def replace_once(text, pattern, replacement, label):
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(
                      "FAIL-CLOSED: " + label
                      + "; expected 1 match, got "
                      + str(len(matches))
                  )
              return pattern.sub(lambda _: replacement, text, count=1)

          # 1. Remove the unwanted Music ReVanced entry from the picker.
          revanced_picker = re.compile(
              r'(?m)^[ \t]*addPickerPackage\(choices, '
              r'"YouTube Music ReVanced",\n'
              r'[ \t]*"app\.revanced\.android\.apps\.youtube\.music"\);\n'
          )
          source = replace_once(
              source, revanced_picker, "", "Music ReVanced picker entry"
          )

          # 2. Replace the picker row method with separate defaults,
          #    visible package names, and a check mark for the selection.
          picker_pattern = re.compile(
              r"(?ms)^([ \t]*)private void addPickerPackage\(.*?"
              r"(?=^[ \t]*private void closeDefaultAppPicker\()"
          )
          matches = list(picker_pattern.finditer(source))
          if len(matches) != 1:
              raise SystemExit(
                  "FAIL-CLOSED: addPickerPackage boundary mismatch"
              )

          indent = matches[0].group(1)
          picker_method = r'''
          private void addPickerPackage(
                  LinearLayout choices, String label, String packageName) {
              boolean isVideoPackage =
                      packageName.equals("com.google.android.youtube")
                      || packageName.equals("app.revanced.android.youtube")
                      || packageName.equals("app.morphe.android.youtube");

              String category = isVideoPackage ? "video" : "music";
              String selectedPackage = getSharedPreferences(
                      "carassistant_command_dispatch", MODE_PRIVATE)
                      .getString("default_" + category + "_package", "");

              boolean selected = packageName.equals(selectedPackage);
              AppInfo app = findAppByPackage(packageName);

              String shownLabel = (selected ? "✓ " : "○ ") + label
                      + "\n" + packageName;
              if (app == null) shownLabel += "\n(chưa cài hoặc không khả dụng)";

              TextView option = sidebarButton(shownLabel);
              option.setGravity(Gravity.CENTER_VERTICAL | Gravity.START);
              option.setMaxLines(3);

              LinearLayout.LayoutParams params =
                      new LinearLayout.LayoutParams(-1, dp(60));
              params.setMargins(0, dp(2), 0, dp(2));
              choices.addView(option, params);

              if (app == null) {
                  option.setEnabled(false);
                  option.setAlpha(0.55f);
                  return;
              }

              option.setOnClickListener(v -> {
                  SharedPreferences prefs = getSharedPreferences(
                          "carassistant_command_dispatch", MODE_PRIVATE);

                  prefs.edit()
                          .putString("default_" + category + "_component",
                                  app.component.flattenToString())
                          .putString("default_" + category + "_package",
                                  packageName)
                          .putString("default_" + category + "_label", label)
                          // Keep legacy values for unrelated older code.
                          .putString("default_component",
                                  app.component.flattenToString())
                          .putString("default_package", packageName)
                          .putString("default_label", label)
                          .apply();

                  chooseDefaultMediaApp();
                  Toast.makeText(this,
                          "Đã lưu mặc định " + category.toUpperCase()
                                  + ": " + label,
                          Toast.LENGTH_SHORT).show();
              });
          }
          '''
          picker_method = "\n".join(
              indent + line if line else ""
              for line in picker_method.strip("\n").splitlines()
          ) + "\n\n"

          source = (
              source[:matches[0].start()]
              + picker_method
              + source[matches[0].end():]
          )

          # 3. Treat "Mở YouTube" as the Video default, not as an
          #    instruction to force the official YouTube package.
          video_pattern = re.compile(
              r'boolean video\s*=\s*command\.contains\("video"\)'
              r'\s*\|\|\s*command\.contains\("phim"\);'
          )
          source = replace_once(
              source,
              video_pattern,
              r'boolean video = command.contains("video")'
              r' || command.contains("phim")'
              r' || command.matches("^mo\\s+youtube$");',
              "video command classification"
          )

          # Explicit services/mods override defaults; plain YouTube does
          # so only when it is named as the provider of a search.
          mentions_pattern = re.compile(
              r"(?ms)^([ \t]*)boolean mentionsApp =.*?;"
          )
          matches = list(mentions_pattern.finditer(source))
          if len(matches) != 1:
              raise SystemExit(
                  "FAIL-CLOSED: mentionsApp boundary mismatch"
              )

          indent = matches[0].group(1)
          mentions = r'''
          boolean mentionsApp =
                  command.contains("youtube music")
                  || command.contains("revanced")
                  || command.contains("morphe")
                  || command.contains("spotify")
                  || command.contains("zing mp3")
                  || command.contains("zingmp3")
                  || (command.contains("tren youtube")
                      && !command.matches("^mo\\s+youtube$"));
          '''
          mentions = "\n".join(
              indent + line if line else ""
              for line in mentions.strip("\n").splitlines()
          )
          source = mentions_pattern.sub(
              lambda _: mentions, source, count=1
          )

          # 4. Never use the old global default if the category default
          #    is missing. Video and Music must remain independent.
          legacy_fallback = re.compile(
              r"(?ms)^[ \t]*// Compatibility with the old "
              r"single-default preference\.\n"
              r"[ \t]*if \(target == null\) \{\n"
              r".*?\n[ \t]*\}\n"
          )
          source = replace_once(
              source,
              legacy_fallback,
              "",
              "legacy cross-category default fallback"
          )

          # 5. A bare "Mở nhạc/video" opens the chosen app; adding a title
          #    such as "Sơn Tùng" or "Anh Sai Rồi" triggers a search.
          search_assignment = re.compile(
              r'boolean searchRequested = explicitSearch \|\| contentSearch;'
          )
          source = replace_once(
              source,
              search_assignment,
              r'boolean searchRequested = explicitSearch'
              r' || (contentSearch && !command.matches('
              r'"^mo\\s+(nhac|video|phim|bai hat)$"));',
              "search/open intent decision"
          )

          # Final fail-closed checks before saving the patched source.
          for item in [
              'addPickerSection(choices, "VIDEO")',
              'addPickerSection(choices, "NHẠC")',
              '"com.google.android.youtube"',
              '"app.revanced.android.youtube"',
              '"app.morphe.android.youtube"',
              '"com.google.android.apps.youtube.music"',
              '"app.morphe.android.apps.youtube.music"',
              '"com.zing.mp3"',
              '"com.spotify.music"',
              'private boolean handleVoiceMediaSearch(',
              'private String extractMediaQuery(',
              'launchMediaSearchOnProjection(target, url, pkg)',
          ]:
              if item not in source:
                  raise SystemExit(
                      "FAIL-CLOSED: missing expected feature: " + item
                  )

          if 'addPickerPackage(choices, "YouTube Music ReVanced"' in source:
              raise SystemExit(
                  "FAIL-CLOSED: unwanted Music ReVanced picker remains"
              )

          if "Compatibility with the old single-default preference." in source:
              raise SystemExit(
                  "FAIL-CLOSED: cross-category fallback remains"
              )

          if source.count("private boolean handleVoiceMediaSearch(") != 1:
              raise SystemExit(
                  "FAIL-CLOSED: duplicate/missing media handler"
              )

          path.write_text(source, encoding="utf-8")
          print("PASS: Video/Music defaults are independent")
          print("PASS: picker displays package names and selected marker")
          print("PASS: generic YouTube opens Video default")
          print("PASS: search/open intent routing checks passed")
          PY
      - name: Fix voice search launch on projection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          base = Path(
              "v10-source/app/src/main/java/com/carassistant/v10"
          )
          activity_path = base / "V10CarActivity.java"
          session_path = base / "V10ProjectionSession.java"
          controller_path = base / "V10DisplayController.java"

          for path in (activity_path, session_path, controller_path):
              if not path.is_file():
                  raise SystemExit(
                      "FAIL-CLOSED: missing source: " + str(path)
