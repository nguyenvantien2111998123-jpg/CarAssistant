name: Build Car Assistant V10.4 - V4.2.1 Control Bar Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-disabled: true

      # ============================================================
      # LOCATE V10 SOURCE
      # ============================================================

      - name: Verify current V10 source
        shell: bash
        run: |
          set -euo pipefail

          test -d v10-source

          test -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

          test -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java

          test -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10InputController.java

          test -f \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/RootShellSession.java

          echo "CURRENT V10 SOURCE OK"

      # ============================================================
      # VERIFY V10.3 CONTROL BAR BASE
      # ============================================================

      - name: Verify V10.3 control bar base
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -q "handleControlBack" "$FILE"
          grep -q "handleControlHome" "$FILE"
          grep -q "handleControlApps" "$FILE"
          grep -q "handleControlRecents" "$FILE"

          grep -q "controlBar" "$FILE"

          echo "V10.3 CONTROL BAR VERIFIED"

      # ============================================================
      # BACKUP ACTIVITY
      # ============================================================

      - name: Backup V10CarActivity
        shell: bash
        run: |
          set -euo pipefail

          cp \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java \
            /tmp/V10CarActivity.before.java

      # ============================================================
      # PATCH V10CarActivity
      #
      # IMPORTANT:
      # Do not touch:
      # - V10ProjectionSession
      # - V10InputController
      # - RootShellSession
      #
      # Only restore/merge UI behavior.
      # ============================================================

      - name: Patch V10CarActivity
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          s = path.read_text()

          # --------------------------------------------------------
          # Helper: find Java method by name and replace complete body
          # --------------------------------------------------------

          def replace_method(src, method_name, new_method):
              marker = method_name + "("
              pos = src.find(marker)

              if pos < 0:
                  raise SystemExit(
                      f"Method not found: {method_name}"
                  )

              brace = src.find("{", pos)

              if brace < 0:
                  raise SystemExit(
                      f"Opening brace not found: {method_name}"
                  )

              depth = 0
              end = None

              for i in range(brace, len(src)):
                  c = src[i]

                  if c == "{":
                      depth += 1

                  elif c == "}":
                      depth -= 1

                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise SystemExit(
                      f"Closing brace not found: {method_name}"
                  )

              return src[:pos] + new_method.rstrip() + src[end:]

          # --------------------------------------------------------
          # Ensure imports
          # --------------------------------------------------------

          imports = [
              "import android.graphics.Color;",
              "import android.view.Gravity;",
              "import android.widget.LinearLayout;",
          ]

          for imp in imports:
              if imp not in s:
                  anchor = "import android.os.Bundle;"
                  if anchor in s:
                      s = s.replace(
                          anchor,
                          anchor + "\n" + imp,
                          1
                      )

          # --------------------------------------------------------
          # Ensure controlBar field
          # --------------------------------------------------------

          if "private LinearLayout controlBar;" not in s:
              marker = "private boolean resumed;"

              if marker in s:
                  s = s.replace(
                      marker,
                      marker + "\n    private LinearLayout controlBar;",
                      1
                  )
              else:
                  raise SystemExit(
                      "Could not find resumed field"
                  )

          # --------------------------------------------------------
          # Replace buildUi()
          # --------------------------------------------------------

          build_ui = r'''
          private void buildUi() {
              FrameLayout root = new FrameLayout(this);

              root.setBackgroundColor(Color.BLACK);

              projectionLayer = new FrameLayout(this);

              textureView = new TextureView(this);

              projectionLayer.addView(
                      textureView,
                      new FrameLayout.LayoutParams(
                              -1,
                              -1));

              root.addView(
                      projectionLayer,
                      new FrameLayout.LayoutParams(
                              -1,
                              -1));

              launcherLayer = new FrameLayout(this);

              buildDashboard();
              buildAppPanel();

              root.addView(
                      launcherLayer,
                      new FrameLayout.LayoutParams(
                              -1,
                              -1));

              launcherLayer.setVisibility(View.VISIBLE);

              controlBar = new LinearLayout(this);

              controlBar.setOrientation(
                      LinearLayout.HORIZONTAL);

              controlBar.setGravity(
                      Gravity.CENTER);

              controlBar.setPadding(
                      dp(8),
                      dp(4),
                      dp(8),
                      dp(4));

              controlBar.setBackgroundColor(
                      Color.rgb(24, 24, 24));

              FrameLayout.LayoutParams barParams =
                      new FrameLayout.LayoutParams(
                              -1,
                              dp(58));

              barParams.gravity =
                      Gravity.BOTTOM;

              root.addView(
                      controlBar,
                      barParams);

              addControlButton(
                      "BACK",
                      this::handleControlBack);

              addControlButton(
                      "APPS",
                      this::handleControlApps);

              addControlButton(
                      "RECENTS",
                      this::handleControlRecents);

              addControlButton(
                      "HOME",
                      this::handleControlHome);

              setContentView(root);
          }
          '''

          s = replace_method(
              s,
              "private void buildUi",
              build_ui
          )

          # --------------------------------------------------------
          # Replace launchProjection()
          # --------------------------------------------------------

          launch_projection = r'''
          private void launchProjection(
                  ComponentName component) {

              if (component == null) {
                  return;
              }

              if (session == null) {
                  return;
              }

              if (activeTarget != null
                      && !activeTarget.equals(component)) {

                  session.release();
              }

              activeTarget = component;

              V10SessionStore.setTarget(
                      this,
                      component);

              if (dashboard != null) {
                  dashboard.setVisibility(
                          View.GONE);
              }

              if (appPanel != null) {
                  appPanel.setVisibility(
                          View.GONE);
              }

              if (launcherLayer != null) {
                  launcherLayer.setVisibility(
                          View.GONE);
              }

              if (projectionLayer != null) {
                  projectionLayer.setVisibility(
                          View.VISIBLE);
              }

              if (controlBar != null) {
                  controlBar.setVisibility(
                          View.VISIBLE);
              }

              session.setTarget(component);
          }
          '''

          s = replace_method(
              s,
              "private void launchProjection",
              launch_projection
          )

          # --------------------------------------------------------
          # Replace showApps()
          # --------------------------------------------------------

          show_apps = r'''
          private void showApps() {

              if (projectionLayer != null) {
                  projectionLayer.setVisibility(
                          View.GONE);
              }

              if (launcherLayer != null) {
                  launcherLayer.setVisibility(
                          View.VISIBLE);
              }

              if (dashboard != null) {
                  dashboard.setVisibility(
                          View.GONE);
              }

              if (appPanel != null) {
                  appPanel.setVisibility(
                          View.VISIBLE);
              }

              if (controlBar != null) {
                  controlBar.setVisibility(
                          View.VISIBLE);
              }

              loadApps();
          }
          '''

          s = replace_method(
              s,
              "private void showApps",
              show_apps
          )

          # --------------------------------------------------------
          # Replace hideApps()
          # --------------------------------------------------------

          hide_apps = r'''
          private void hideApps() {

              if (appPanel != null) {
                  appPanel.setVisibility(
                          View.GONE);
              }

              if (launcherLayer != null) {
                  launcherLayer.setVisibility(
                          View.VISIBLE);
              }

              if (dashboard != null) {
                  dashboard.setVisibility(
                          View.VISIBLE);
              }

              if (projectionLayer != null) {
                  projectionLayer.setVisibility(
                          View.GONE);
              }

              if (controlBar != null) {
                  controlBar.setVisibility(
                          View.VISIBLE);
              }
          }
          '''

          s = replace_method(
              s,
              "private void hideApps",
              hide_apps
          )

          # --------------------------------------------------------
          # Replace returnToLauncher()
          # --------------------------------------------------------

          return_launcher = r'''
          private void returnToLauncher() {

              if (session != null) {
                  session.release();
              }

              activeTarget = null;

              V10SessionStore.clearTarget(
                      this);

              if (projectionLayer != null) {
                  projectionLayer.setVisibility(
                          View.GONE);
              }

              if (launcherLayer != null) {
                  launcherLayer.setVisibility(
                          View.VISIBLE);
              }

              if (appPanel != null) {
                  appPanel.setVisibility(
                          View.GONE);
              }

              if (dashboard != null) {
                  dashboard.setVisibility(
                          View.VISIBLE);
              }

              if (controlBar != null) {
                  controlBar.setVisibility(
                          View.VISIBLE);
              }
          }
          '''

          s = replace_method(
              s,
              "private void returnToLauncher",
              return_launcher
          )

          # --------------------------------------------------------
          # Replace BACK
          # --------------------------------------------------------

          back_method = r'''
          public void handleControlBack() {

              if (appPanel != null
                      && appPanel.getVisibility()
                      == View.VISIBLE) {

                  hideApps();
                  return;
              }

              if (session != null
                      && session.isActive()) {

                  session.back();
                  return;
              }

              super.onBackPressed();
          }
          '''

          s = replace_method(
              s,
              "public void handleControlBack",
              back_method
          )

          # --------------------------------------------------------
          # Replace HOME
          # --------------------------------------------------------

          home_method = r'''
          public void handleControlHome() {
              returnToLauncher();
          }
          '''

          s = replace_method(
              s,
              "public void handleControlHome",
              home_method
          )

          # --------------------------------------------------------
          # Replace APPS
          # --------------------------------------------------------

          apps_method = r'''
          public void handleControlApps() {

              if (appPanel != null
                      && appPanel.getVisibility()
                      == View.VISIBLE) {

                  hideApps();

              } else {

                  showApps();
              }
          }
          '''

          s = replace_method(
              s,
              "public void handleControlApps",
              apps_method
          )

          # --------------------------------------------------------
          # Keep RECENTS non-destructive for now.
          # --------------------------------------------------------

          recents_method = r'''
          public void handleControlRecents() {

              showInfo(
                      "RECENTS",
                      "Session manager sẽ được thêm ở bước tiếp theo.");
          }
          '''

          s = replace_method(
              s,
              "public void handleControlRecents",
              recents_method
          )

          path.write_text(s)

          print("V10CarActivity patched successfully.")
          PY

      # ============================================================
      # VERIFY CONTROL BAR
      # ============================================================

      - name: Verify control bar
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -q "private LinearLayout controlBar" "$FILE"

          grep -q "addControlButton" "$FILE"

          grep -q '"BACK"' "$FILE"
          grep -q '"APPS"' "$FILE"
          grep -q '"RECENTS"' "$FILE"
          grep -q '"HOME"' "$FILE"

          grep -q "handleControlBack" "$FILE"
          grep -q "handleControlHome" "$FILE"
          grep -q "handleControlApps" "$FILE"
          grep -q "handleControlRecents" "$FILE"

          echo "CONTROL BAR VERIFIED"

      # ============================================================
      # VERIFY APP SELECTOR
      # ============================================================

      - name: Verify app selector
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -q "ACTION_MAIN" "$FILE"
          grep -q "CATEGORY_LAUNCHER" "$FILE"

          grep -q "V10SessionStore.setTarget" "$FILE"
          grep -q "session.setTarget" "$FILE"

          grep -q "showApps" "$FILE"
          grep -q "hideApps" "$FILE"
          grep -q "launchProjection" "$FILE"

          echo "APP SELECTOR VERIFIED"

      # ============================================================
      # VERIFY PROJECTION ENGINE
      # ============================================================

      - name: Verify projection engine
        shell: bash
        run: |
          set -euo pipefail

          ROOT="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          SESSION="$ROOT/V10ProjectionSession.java"
          INPUT="$ROOT/V10InputController.java"
          SHELL="$ROOT/RootShellSession.java"
          DISPLAY="$ROOT/V10Display.java"

          test -f "$SESSION"
          test -f "$INPUT"
          test -f "$SHELL"
          test -f "$DISPLAY"

          grep -q "createVirtualDisplay" "$SESSION"

          grep -q -- "--display" "$SESSION"
          grep -q -- "--windowingMode 1" "$SESSION"

          grep -q "/system/bin/am start" "$SESSION"

          grep -q "/system/bin/input" "$INPUT"

          grep -q "ProcessBuilder" "$SHELL"
          grep -q "su" "$SHELL"

          grep -q "V10Display.nameFor" "$SESSION"

          grep -q "V10Display" "$DISPLAY"

          echo "PROJECTION ENGINE VERIFIED"

      # ============================================================
      # VERIFY INPUT
      # ============================================================

      - name: Verify input engine
        shell: bash
        run: |
          set -euo pipefail

          INPUT="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10InputController.java"

          grep -q "ACTION_DOWN" "$INPUT"
          grep -q "ACTION_MOVE" "$INPUT"
          grep -q "ACTION_UP" "$INPUT"

          grep -q "sendTap" "$INPUT"
          grep -q "sendSwipe" "$INPUT"

          echo "INPUT ENGINE VERIFIED"

      # ============================================================
      # VERIFY DISPLAY IDENTITY
      # ============================================================

      - name: Verify V10 display identity
        shell: bash
        run: |
          set -euo pipefail

          DISPLAY="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10Display.java"

          grep -q "com.carassistant.v10" "$DISPLAY"
          grep -q "Car Assistant V10" "$DISPLAY"
          grep -q "type != 5" "$DISPLAY"

          echo "DISPLAY IDENTITY VERIFIED"

      # ============================================================
      # VERIFY NO GEARHEAD CONTROL BAR
      # ============================================================

      - name: Verify no Gearhead control bar
        shell: bash
        run: |
          set -euo pipefail

          if grep -R \
            "GearheadControlBar" \
            v10-source/app/src/main/java; then

            echo "ERROR: GearheadControlBar still exists."

            exit 1
          fi

          echo "NO GEARHEAD CONTROL BAR"

      # ============================================================
      # VERIFY ANDROID 12
      # ============================================================

      - name: Verify Android 12 compatibility
        shell: bash
        run: |
          set -euo pipefail

          grep -R \
            "compileSdk" \
            v10-source/app/build.gradle || true

          grep -R \
            "minSdk" \
            v10-source/app/build.gradle || true

          echo "ANDROID 12 COMPATIBILITY CHECK COMPLETE"

      # ============================================================
      # VERIFY JAVA BRACES
      # ============================================================

      - name: Verify Java structure
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path(
                  "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
              ),
              Path(
                  "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
              ),
              Path(
                  "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10InputController.java"
              ),
          ]

          for p in files:
              s = p.read_text()

              depth = 0
              in_string = False
              escape = False
              in_line_comment = False
              in_block_comment = False

              i = 0

              while i < len(s):
                  c = s[i]
                  n = s[i + 1] if i + 1 < len(s) else ""

                  if in_line_comment:
                      if c == "\n":
                          in_line_comment = False

                  elif in_block_comment:
                      if c == "*" and n == "/":
                          in_block_comment = False
                          i += 1

                  elif in_string:
                      if escape:
                          escape = False
                      elif c == "\\":
                          escape = True
                      elif c == '"':
                          in_string = False

                  else:
                      if c == "/" and n == "/":
                          in_line_comment = True
                          i += 1
                      elif c == "/" and n == "*":
                          in_block_comment = True
                          i += 1
                      elif c == '"':
                          in_string = True
                      elif c == "{":
                          depth += 1
                      elif c == "}":
                          depth -= 1

                          if depth < 0:
                              raise SystemExit(
                                  f"Brace underflow: {p}"
                              )

                  i += 1

              if depth != 0:
                  raise SystemExit(
                      f"Unbalanced braces: {p} depth={depth}"
                  )

              print(f"JAVA STRUCTURE OK: {p}")

          PY

      # ============================================================
      # GRADLE CLEAN
      # ============================================================

      - name: Gradle clean
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            clean \
            --no-daemon

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build V10.4 V4.2.1 debug APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo
          echo "APK:"
          ls -lh "$APK"

          echo
          echo "SHA256:"
          sha256sum "$APK"

          echo
          echo "========================================"
          echo " CAR ASSISTANT V10.4 V4.2.1 BUILD PASSED"
          echo "========================================"

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10.4-Femto-Launcher-V4.2.1-Control-Bar
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit V4.2.1 source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add v10-source

          if git diff --cached --quiet; then
            echo "No source changes."
          else
            git commit \
              -m "Fix V10.4 V4.2.1 control bar"

            git push
          fi
