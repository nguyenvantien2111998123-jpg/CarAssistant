name: Build Car Assistant V10.4 - V4.2.1 Control Bar Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # ============================================================
      # VERIFY V4 BASE
      # ============================================================

      - name: Verify V10.4 V4 base
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          test -f "$FILE"

          grep -Fq "V10SessionStore" "$FILE"
          grep -Fq "launchProjection" "$FILE"
          grep -Fq "showApps" "$FILE"
          grep -Fq "hideApps" "$FILE"
          grep -Fq "APPLICATIONS" "$FILE"
          grep -Fq "ACTION_MAIN" "$FILE"
          grep -Fq "CATEGORY_LAUNCHER" "$FILE"
          grep -Fq "queryIntentActivities" "$FILE"

          echo "V10.4 V4 BASE VERIFIED"

      # ============================================================
      # BACKUP
      # ============================================================

      - name: Backup V10CarActivity
        shell: bash
        run: |
          set -euo pipefail

          cp \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java \
            /tmp/V10CarActivity.v4.java

          echo "BACKUP CREATED"

      # ============================================================
      # MERGE CONTROL BAR
      # ============================================================

      - name: Merge V10.3 control bar
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text()

          def find_method(text, signature):
              start = text.find(signature)

              if start < 0:
                  raise RuntimeError(
                      "Method not found: " + signature
                  )

              brace = text.find("{", start)

              if brace < 0:
                  raise RuntimeError(
                      "Opening brace not found: " + signature
                  )

              depth = 0
              i = brace

              in_string = False
              in_char = False
              in_line_comment = False
              in_block_comment = False
              escaped = False

              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ""

                  if in_line_comment:
                      if c == "\n":
                          in_line_comment = False
                      i += 1
                      continue

                  if in_block_comment:
                      if c == "*" and n == "/":
                          in_block_comment = False
                          i += 2
                          continue
                      i += 1
                      continue

                  if in_string:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == '"':
                          in_string = False
                      i += 1
                      continue

                  if in_char:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == "'":
                          in_char = False
                      i += 1
                      continue

                  if c == "/" and n == "/":
                      in_line_comment = True
                      i += 2
                      continue

                  if c == "/" and n == "*":
                      in_block_comment = True
                      i += 2
                      continue

                  if c == '"':
                      in_string = True
                      i += 1
                      continue

                  if c == "'":
                      in_char = True
                      i += 1
                      continue

                  if c == "{":
                      depth += 1

                  elif c == "}":
                      depth -= 1

                      if depth == 0:
                          return start, i + 1

                  i += 1

              raise RuntimeError(
                  "Unbalanced method: " + signature
              )

          def replace_method(text, signature, replacement):
              start, end = find_method(text, signature)
              return text[:start] + replacement + text[end:]

          # --------------------------------------------------------
          # IMPORT BUTTON
          # --------------------------------------------------------

          if "import android.widget.Button;" not in source:
              marker = "import android.widget.FrameLayout;"

              if marker not in source:
                  raise RuntimeError(
                      "FrameLayout import not found"
                  )

              source = source.replace(
                  marker,
                  marker + "\nimport android.widget.Button;",
                  1
              )

          # --------------------------------------------------------
          # CONTROL BAR FIELD
          # --------------------------------------------------------

          if "private LinearLayout controlBar;" not in source:
              marker = "private LinearLayout dock;"

              if marker not in source:
                  raise RuntimeError(
                      "dock field not found"
                  )

              source = source.replace(
                  marker,
                  marker + "\n    private LinearLayout controlBar;",
                  1
              )

          # --------------------------------------------------------
          # BUTTON HELPER
          # --------------------------------------------------------

          if "private void addControlButton(" not in source:

              helper = """
              private void addControlButton(
                      String label,
                      View.OnClickListener listener) {

                  Button button = new Button(this);

                  button.setText(label);
                  button.setTextSize(12);
                  button.setTextColor(Color.WHITE);
                  button.setAllCaps(false);
                  button.setOnClickListener(listener);

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  0,
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  1f);

                  params.setMargins(
                          dp(4),
                          dp(4),
                          dp(4),
                          dp(4));

                  controlBar.addView(
                          button,
                          params);
              }

              """

              build_start, _ = find_method(
                  source,
                  "private void buildUi("
              )

              source = (
                  source[:build_start]
                  + helper
                  + source[build_start:]
              )

          # --------------------------------------------------------
          # CONTROL BAR VISIBILITY HELPER
          # --------------------------------------------------------

          if "private void keepControlBarVisible()" not in source:

              helper = """
              private void keepControlBarVisible() {

                  if (controlBar == null) {
                      return;
                  }

                  controlBar.setVisibility(
                          View.VISIBLE);

                  controlBar.bringToFront();
              }

              """

              build_start, _ = find_method(
                  source,
                  "private void buildUi("
              )

              source = (
                  source[:build_start]
                  + helper
                  + source[build_start:]
              )

          # --------------------------------------------------------
          # BUILD UI
          # --------------------------------------------------------

          build_start, build_end = find_method(
              source,
              "private void buildUi("
          )

          build_method = source[build_start:build_end]

          if "controlBar =" not in build_method:

              marker = "setContentView(root);"

              if marker not in build_method:
                  raise RuntimeError(
                      "setContentView(root) not found"
                  )

              control_bar = """
                  // ==================================================
                  // V10.3 CONTROL BAR
                  // ==================================================

                  controlBar =
                          new LinearLayout(this);

                  controlBar.setOrientation(
                          LinearLayout.HORIZONTAL);

                  controlBar.setGravity(
                          Gravity.CENTER);

                  controlBar.setPadding(
                          dp(8),
                          dp(4),
                          dp(8),
                          dp(4));

                  controlBar.setBackgroundColor(
                          Color.rgb(24, 24, 24));

                  FrameLayout.LayoutParams controlParams =
                          new FrameLayout.LayoutParams(
                                  FrameLayout.LayoutParams.MATCH_PARENT,
                                  dp(58));

                  controlParams.gravity =
                          Gravity.BOTTOM;

                  root.addView(
                          controlBar,
                          controlParams);

                  addControlButton(
                          "BACK",
                          v -> handleControlBack());

                  addControlButton(
                          "APPS",
                          v -> handleControlApps());

                  addControlButton(
                          "RECENTS",
                          v -> handleControlRecents());

                  addControlButton(
                          "HOME",
                          v -> handleControlHome());

                  controlBar.bringToFront();
              """

              build_method = build_method.replace(
                  marker,
                  control_bar + "\n\n        " + marker,
                  1
              )

              source = (
                  source[:build_start]
                  + build_method
                  + source[build_end:]
              )

          # --------------------------------------------------------
          # LAUNCH PROJECTION
          # --------------------------------------------------------

          launch_projection = """
          private void launchProjection(
                  ComponentName component) {

              if (component == null
                      || session == null) {

                  return;
              }

              if (activeTarget != null
                      && !activeTarget.equals(component)) {

                  session.release();
              }

              activeTarget = component;

              V10SessionStore.setTarget(
                      this,
                      component);

              launcherLayer.setVisibility(
                      View.GONE);

              appPanel.setVisibility(
                      View.GONE);

              dashboard.setVisibility(
                      View.GONE);

              projectionLayer.setVisibility(
                      View.VISIBLE);

              session.setTarget(
                      component);

              keepControlBarVisible();
          }
          """

          source = replace_method(
              source,
              "private void launchProjection(",
              launch_projection
          )

          # --------------------------------------------------------
          # RETURN TO LAUNCHER
          # --------------------------------------------------------

          return_launcher = """
          private void returnToLauncher() {

              activeTarget = null;

              V10SessionStore.clearTarget(
                      this);

              if (session != null) {
                  session.release();
              }

              projectionLayer.setVisibility(
                      View.GONE);

              launcherLayer.setVisibility(
                      View.VISIBLE);

              dashboard.setVisibility(
                      View.VISIBLE);

              appPanel.setVisibility(
                      View.GONE);

              keepControlBarVisible();
          }
          """

          source = replace_method(
              source,
              "private void returnToLauncher()",
              return_launcher
          )

          # --------------------------------------------------------
          # SHOW APPS
          # --------------------------------------------------------

          show_apps = """
          private void showApps() {

              if (launcherLayer == null
                      || appPanel == null
                      || dashboard == null) {

                  return;
              }

              projectionLayer.setVisibility(
                      View.GONE);

              launcherLayer.setVisibility(
                      View.VISIBLE);

              dashboard.setVisibility(
                      View.GONE);

              appPanel.setVisibility(
                      View.VISIBLE);

              loadApps();

              keepControlBarVisible();
          }
          """

          source = replace_method(
              source,
              "private void showApps()",
              show_apps
          )

          # --------------------------------------------------------
          # HIDE APPS
          # --------------------------------------------------------

          hide_apps = """
          private void hideApps() {

              if (appPanel == null
                      || dashboard == null
                      || launcherLayer == null) {

                  return;
              }

              appPanel.setVisibility(
                      View.GONE);

              dashboard.setVisibility(
                      View.VISIBLE);

              launcherLayer.setVisibility(
                      View.VISIBLE);

              projectionLayer.setVisibility(
                      View.GONE);

              keepControlBarVisible();
          }
          """

          source = replace_method(
              source,
              "private void hideApps()",
              hide_apps
          )

          # --------------------------------------------------------
          # BACK
          # --------------------------------------------------------

          back_method = """
          public void handleControlBack() {

              if (appPanel != null
                      && appPanel.getVisibility()
                              == View.VISIBLE) {

                  hideApps();
                  return;
              }

              if (session != null
                      && session.isActive()) {

                  session.back();
                  return;
              }

              returnToLauncher();
          }
          """

          source = replace_method(
              source,
              "public void handleControlBack()",
              back_method
          )

          # --------------------------------------------------------
          # HOME
          # --------------------------------------------------------

          home_method = """
          public void handleControlHome() {

              returnToLauncher();
          }
          """

          source = replace_method(
              source,
              "public void handleControlHome()",
              home_method
          )

          # --------------------------------------------------------
          # APPS
          # --------------------------------------------------------

          apps_method = """
          public void handleControlApps() {

              if (appPanel != null
                      && appPanel.getVisibility()
                              == View.VISIBLE) {

                  hideApps();

              } else {

                  showApps();
              }
          }
          """

          source = replace_method(
              source,
              "public void handleControlApps()",
              apps_method
          )

          # --------------------------------------------------------
          # RECENTS
          # --------------------------------------------------------

          recents_method = """
          public void handleControlRecents() {

              showApps();
          }
          """

          source = replace_method(
              source,
              "public void handleControlRecents()",
              recents_method
          )

          path.write_text(source)

          print("==============================================")
          print(" CONTROL BAR MERGE COMPLETE")
          print(" V4 SELECTOR PRESERVED")
          print(" V10 PROJECTION PRESERVED")
          print("==============================================")
          PY

      # ============================================================
      # VERIFY CONTROL BAR
      # ============================================================

      - name: Verify control bar
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq "import android.widget.Button;" "$FILE"
          grep -Fq "private LinearLayout controlBar;" "$FILE"
          grep -Fq "private void addControlButton(" "$FILE"
          grep -Fq "private void keepControlBarVisible()" "$FILE"

          grep -Fq '"BACK"' "$FILE"
          grep -Fq '"APPS"' "$FILE"
          grep -Fq '"RECENTS"' "$FILE"
          grep -Fq '"HOME"' "$FILE"

          grep -Fq "handleControlBack" "$FILE"
          grep -Fq "handleControlApps" "$FILE"
          grep -Fq "handleControlRecents" "$FILE"
          grep -Fq "handleControlHome" "$FILE"

          grep -Fq "controlBar.bringToFront()" "$FILE"

          echo "CONTROL BAR VERIFIED"

      # ============================================================
      # VERIFY APPLICATION SELECTOR
      # ============================================================

      - name: Verify V4 application selector
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq "APPLICATIONS" "$FILE"
          grep -Fq "GridLayout" "$FILE"
          grep -Fq "setColumnCount" "$FILE"
          grep -Fq "ACTION_MAIN" "$FILE"
          grep -Fq "CATEGORY_LAUNCHER" "$FILE"
          grep -Fq "queryIntentActivities" "$FILE"
          grep -Fq "launchProjection" "$FILE"
          grep -Fq "V10SessionStore" "$FILE"

          echo "V4 APPLICATION SELECTOR VERIFIED"

      # ============================================================
      # VERIFY CONTROL FLOW
      # ============================================================

      - name: Verify control flow
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq "returnToLauncher" "$FILE"
          grep -Fq "showApps" "$FILE"
          grep -Fq "hideApps" "$FILE"
          grep -Fq "session.back" "$FILE"
          grep -Fq "session.release" "$FILE"

          echo "CONTROL FLOW VERIFIED"

      # ============================================================
      # VERIFY PROJECTION ENGINE
      # ============================================================

      - name: Verify V10 projection engine
        shell: bash
        run: |
          set -euo pipefail

          SESSION="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
          INPUT="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10InputController.java"
          SHELL_FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/RootShellSession.java"
          DISPLAY="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10Display.java"

          test -f "$SESSION"
          test -f "$INPUT"
          test -f "$SHELL_FILE"
          test -f "$DISPLAY"

          grep -Fq "createVirtualDisplay" "$SESSION"
          grep -Fq -- "--display" "$SESSION"
          grep -Fq -- "--windowingMode 1" "$SESSION"
          grep -Fq "/system/bin/am start" "$SESSION"

          grep -Fq "ProcessBuilder" "$SHELL_FILE"
          grep -Fq '"su"' "$SHELL_FILE"

          grep -Fq "/system/bin/input" "$INPUT"

          grep -Fq "V10Display.nameFor" "$SESSION"

          grep -Fq "PACKAGE" "$DISPLAY"
          grep -Fq "PREFIX" "$DISPLAY"
          grep -Fq "nameFor" "$DISPLAY"
          grep -Fq "Car Assistant V10" "$DISPLAY"

          echo "PROJECTION ENGINE VERIFIED"

      # ============================================================
      # VERIFY DISPLAY IDENTITY
      # ============================================================

      - name: Verify V10 display identity
        shell: bash
        run: |
          set -euo pipefail

          DISPLAY="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10Display.java"

          grep -Fq "com.carassistant.v10" "$DISPLAY"
          grep -Fq "Car Assistant V10" "$DISPLAY"
          grep -Fq "type != 5" "$DISPLAY"
          grep -Fq "ownerUid < 10000" "$DISPLAY"

          echo "V10 DISPLAY IDENTITY VERIFIED"

      # ============================================================
      # ANDROID 12 CHECK
      # ============================================================

      - name: Verify Android 12 compatibility
        shell: bash
        run: |
          set -euo pipefail

          if grep -R \
            -E \
            "androidx\.compose|compose\.material3|Build\.VERSION_CODES\.TIRAMISU|API 33|minSdk.*33" \
            v10-source/app/src/main \
            >/dev/null 2>&1; then

            echo "Android 13/Femto-only code detected."
            exit 1
          fi

          echo "ANDROID 12 COMPATIBILITY VERIFIED"

      # ============================================================
      # NO GEARHEAD CONTROL BAR
      # ============================================================

      - name: Verify no Gearhead control bar
        shell: bash
        run: |
          set -euo pipefail

          if grep -R \
            "GearheadControlBar" \
            v10-source/app/src/main/java \
            >/dev/null 2>&1; then

            echo "GearheadControlBar detected."
            exit 1
          fi

          echo "NO GEARHEAD CONTROL BAR"

      # ============================================================
      # NO V9 UI REGRESSION
      # ============================================================

      - name: Verify no V9 UI regression
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          if grep -Fq "AACastCarActivity" "$FILE"; then
            echo "AACastCarActivity reference detected."
            exit 1
          fi

          if grep -Fq "AACastDisplay" "$FILE"; then
            echo "AACastDisplay reference detected."
            exit 1
          fi

          echo "V9 UI REGRESSION CHECK PASSED"

      # ============================================================
      # JAVA STRUCTURE CHECK
      # ============================================================

      - name: Java source sanity check
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          root = Path(
              "v10-source/app/src/main/java"
          )

          for path in root.rglob("*.java"):

              text = path.read_text()

              depth = 0
              in_string = False
              in_char = False
              in_line = False
              in_block = False
              escaped = False

              i = 0

              while i < len(text):

                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ""

                  if in_line:
                      if c == "\n":
                          in_line = False
                      i += 1
                      continue

                  if in_block:
                      if c == "*" and n == "/":
                          in_block = False
                          i += 2
                          continue
                      i += 1
                      continue

                  if in_string:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == '"':
                          in_string = False
                      i += 1
                      continue

                  if in_char:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == "'":
                          in_char = False
                      i += 1
                      continue

                  if c == "/" and n == "/":
                      in_line = True
                      i += 2
                      continue

                  if c == "/" and n == "*":
                      in_block = True
                      i += 2
                      continue

                  if c == '"':
                      in_string = True
                      i += 1
                      continue

                  if c == "'":
                      in_char = True
                      i += 1
                      continue

                  if c == "{":
                      depth += 1

                  elif c == "}":
                      depth -= 1

                      if depth < 0:
                          raise SystemExit(
                              f"Brace underflow: {path}"
                          )

                  i += 1

              if depth != 0:
                  raise SystemExit(
                      f"Unbalanced braces: {path}: {depth}"
                  )

          print("JAVA STRUCTURE OK")
          PY

      # ============================================================
      # DUPLICATE CHECK
      # ============================================================

      - name: Verify no duplicate control bar
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          FIELD_COUNT=$(grep -Fc \
            "private LinearLayout controlBar;" \
            "$FILE")

          if [ "$FIELD_COUNT" -ne 1 ]; then
            echo "Invalid controlBar field count: $FIELD_COUNT"
            exit 1
          fi

          HELPER_COUNT=$(grep -Fc \
            "private void addControlButton(" \
            "$FILE")

          if [ "$HELPER_COUNT" -ne 1 ]; then
            echo "Invalid addControlButton count: $HELPER_COUNT"
            exit 1
          fi

          KEEP_COUNT=$(grep -Fc \
            "private void keepControlBarVisible()" \
            "$FILE")

          if [ "$KEEP_COUNT" -ne 1 ]; then
            echo "Invalid keepControlBarVisible count: $KEEP_COUNT"
            exit 1
          fi

          echo "NO DUPLICATE CONTROL BAR"

      # ============================================================
      # GRADLE CLEAN
      # ============================================================

      - name: Gradle clean
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean --no-daemon

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build Car Assistant V10.4 V4.2.1
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # APK VERIFY
      # ============================================================

      - name: Verify APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK OK"
          echo
          echo "SHA256:"
          sha256sum "$APK"

          echo
          echo "APK SIZE:"
          du -h "$APK"

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload V10.4 V4.2.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10.4-Femto-Launcher-V4.2.1-Control-Bar
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit V10.4 V4.2.1 source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add v10-source

          if git diff --cached --quiet; then
            echo "No source changes."
          else
            git commit \
              -m "Fix V10.4 V4.2.1 control bar"

            git push
          fi

      # ============================================================
      # COMPLETE
      # ============================================================

      - name: Complete
        shell: bash
        run: |
          echo
          echo "=============================================="
          echo " CAR ASSISTANT V10.4 V4.2.1 BUILD PASSED"
          echo "=============================================="
          echo "CONTROL BAR: BACK / APPS / RECENTS / HOME"
          echo "V4 SELECTOR: APPLICATIONS"
          echo "PROJECTION ENGINE: PRESERVED"
          echo "INPUT ENGINE: PRESERVED"
          echo "ANDROID 12: SUPPORTED"
          echo "GEARHEAD CONTROL BAR: NOT USED"
          echo "=============================================="
