name: Build Car Assistant V10.4 - V4.2.1 Control Bar Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # ============================================================
      # VERIFY V4 BASE
      # ============================================================

      - name: Verify V10.4 V4 base
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          test -f "$FILE"

          grep -Fq "V10SessionStore" "$FILE"
          grep -Fq "launchProjection" "$FILE"
          grep -Fq "showApps" "$FILE"
          grep -Fq "hideApps" "$FILE"
          grep -Fq "APPLICATIONS" "$FILE"
          grep -Fq "ACTION_MAIN" "$FILE"
          grep -Fq "CATEGORY_LAUNCHER" "$FILE"
          grep -Fq "queryIntentActivities" "$FILE"

          echo "V4 BASE VERIFIED"

      # ============================================================
      # BACKUP V4 SOURCE
      # ============================================================

      - name: Backup V10CarActivity
        shell: bash
        run: |
          set -euo pipefail

          cp \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java \
            /tmp/V10CarActivity.v4.java

      # ============================================================
      # MERGE V10.3 CONTROL BAR
      #
      # IMPORTANT:
      # - V4 selector is preserved.
      # - Projection engine is untouched.
      # - Control bar is added as a ROOT overlay.
      # - No Gearhead UI injection.
      # ============================================================

      - name: Merge V10.3 control bar with V4 selector
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          s = path.read_text()

          # ========================================================
          # ROBUST JAVA METHOD LOCATOR
          # ========================================================

          def find_method(text, signature):
              pos = text.find(signature)

              if pos < 0:
                  raise SystemExit(
                      f"Method/signature not found: {signature}"
                  )

              brace = text.find("{", pos)

              if brace < 0:
                  raise SystemExit(
                      f"Opening brace not found: {signature}"
                  )

              depth = 0
              i = brace

              in_string = False
              in_char = False
              in_line_comment = False
              in_block_comment = False
              escaped = False

              while i < len(text):

                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ""

                  if in_line_comment:
                      if c == "\n":
                          in_line_comment = False
                      i += 1
                      continue

                  if in_block_comment:
                      if c == "*" and n == "/":
                          in_block_comment = False
                          i += 2
                          continue
                      i += 1
                      continue

                  if in_string:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == '"':
                          in_string = False
                      i += 1
                      continue

                  if in_char:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == "'":
                          in_char = False
                      i += 1
                      continue

                  if c == "/" and n == "/":
                      in_line_comment = True
                      i += 2
                      continue

                  if c == "/" and n == "*":
                      in_block_comment = True
                      i += 2
                      continue

                  if c == '"':
                      in_string = True
                      i += 1
                      continue

                  if c == "'":
                      in_char = True
                      i += 1
                      continue

                  if c == "{":
                      depth += 1

                  elif c == "}":
                      depth -= 1

                      if depth == 0:
                          return pos, i + 1

                  i += 1

              raise SystemExit(
                  f"Unbalanced method: {signature}"
              )

          def replace_method(text, signature, replacement):
              a, b = find_method(text, signature)
              return text[:a] + replacement + text[b:]

          # ========================================================
          # VERIFY ORIGINAL V4 STRUCTURE
          # ========================================================

          required = [
              "private FrameLayout root;",
              "private FrameLayout projectionLayer;",
              "private LinearLayout launcherLayer;",
              "private LinearLayout dashboard;",
              "private LinearLayout appPanel;",
              "private LinearLayout dock;",
              "private TextureView textureView;",
              "private V10ProjectionSession session;",
              "private ComponentName activeTarget;",
          ]

          for item in required:
              if item not in s:
                  raise SystemExit(
                      f"Required V4 source element missing: {item}"
                  )

          # ========================================================
          # IMPORT BUTTON
          # ========================================================

          if "import android.widget.Button;" not in s:

              marker = "import android.widget.FrameLayout;"

              if marker not in s:
                  raise SystemExit(
                      "FrameLayout import not found"
                  )

              s = s.replace(
                  marker,
                  marker
                  + "\nimport android.widget.Button;",
                  1
              )

          # ========================================================
          # CONTROL BAR FIELD
          # ========================================================

          if "private LinearLayout controlBar;" not in s:

              marker = "private LinearLayout dock;"

              if marker not in s:
                  raise SystemExit(
                      "dock field not found"
                  )

              s = s.replace(
                  marker,
                  marker
                  + "\n    private LinearLayout controlBar;",
                  1
              )

          # ========================================================
          # CONTROL BUTTON HELPER
          # ========================================================

          if "private void addControlButton(" not in s:

              helper = r'''
              private void addControlButton(
                      String label,
                      View.OnClickListener listener) {

                  Button button =
                          new Button(this);

                  button.setText(label);

                  button.setTextSize(12);

                  button.setTextColor(
                          Color.WHITE);

                  button.setAllCaps(false);

                  button.setOnClickListener(
                          listener);

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  0,
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  1f);

                  params.setMargins(
                          dp(4),
                          dp(4),
                          dp(4),
                          dp(4));

                  controlBar.addView(
                          button,
                          params);
              }

              '''

              build_start, _ = find_method(
                  s,
                  "private void buildUi("
              )

              s = (
                  s[:build_start]
                  + helper
                  + s[build_start:]
              )

          # ========================================================
          # ADD CONTROL BAR TO ROOT
          #
          # This is the important part.
          #
          # root:
          #   projectionLayer
          #   launcherLayer
          #   controlBar  <-- always on top
          # ========================================================

          build_start, build_end = find_method(
              s,
              "private void buildUi("
          )

          build = s[build_start:build_end]

          if "controlBar =" not in build:

              marker = "setContentView(root);"

              if marker not in build:
                  raise SystemExit(
                      "setContentView(root) not found in buildUi"
                  )

              control_bar = r'''

                  // ==================================================
                  // V10.3 PROVEN CONTROL BAR
                  // ==================================================

                  controlBar =
                          new LinearLayout(this);

                  controlBar.setOrientation(
                          LinearLayout.HORIZONTAL);

                  controlBar.setGravity(
                          Gravity.CENTER);

                  controlBar.setPadding(
                          dp(8),
                          dp(4),
                          dp(8),
                          dp(4));

                  controlBar.setBackgroundColor(
                          Color.rgb(
                                  24,
                                  24,
                                  24));

                  FrameLayout.LayoutParams controlParams =
                          new FrameLayout.LayoutParams(
                                  FrameLayout.LayoutParams.MATCH_PARENT,
                                  dp(58));

                  controlParams.gravity =
                          Gravity.BOTTOM;

                  root.addView(
                          controlBar,
                          controlParams);

                  addControlButton(
                          "BACK",
                          v -> handleControlBack());

                  addControlButton(
                          "APPS",
                          v -> handleControlApps());

                  addControlButton(
                          "RECENTS",
                          v -> handleControlRecents());

                  addControlButton(
                          "HOME",
                          v -> handleControlHome());

                  controlBar.bringToFront();
              '''

              build = build.replace(
                  marker,
                  control_bar
                  + "\n\n        "
                  + marker,
                  1
              )

              s = (
                  s[:build_start]
                  + build
                  + s[build_end:]
              )

          # ========================================================
          # CONTROL BAR VISIBILITY HELPER
          #
          # Insert before buildUi so every UI state can call it.
          # ========================================================

          if "private void keepControlBarVisible()" not in s:

              helper = r'''
              private void keepControlBarVisible() {

                  if (controlBar == null) {
                      return;
                  }

                  controlBar.setVisibility(
                          View.VISIBLE);

                  controlBar.bringToFront();
              }

              '''

              build_start, _ = find_method(
                  s,
                  "private void buildUi("
              )

              s = (
                  s[:build_start]
                  + helper
                  + s[build_start:]
              )

          # ========================================================
          # LAUNCH PROJECTION
          #
          # Preserve V4 projection logic.
          # Only ensure control bar remains visible.
          # ========================================================

          launch_projection = r'''private void launchProjection(
        ComponentName component) {

    if (component == null
            || session == null) {

        return;
    }

    /*
     * If another application is selected while
     * an application is already projected,
     * release the old virtual display first.
     */
    if (activeTarget != null
            && !activeTarget.equals(component)) {

        session.release();
    }

    activeTarget =
            component;

    /*
     * Preserve V4 session persistence.
     */
    V10SessionStore
            .setTarget(
                    this,
                    component);

    /*
     * Hide launcher content.
     *
     * The control bar is NOT part of launcherLayer,
     * therefore it remains visible.
     */
    launcherLayer
            .setVisibility(
                    View.GONE);

    appPanel
            .setVisibility(
                    View.GONE);

    dashboard
            .setVisibility(
                    View.GONE);

    projectionLayer
            .setVisibility(
                    View.VISIBLE);

    /*
     * Existing proven V10 projection engine.
     */
    session.setTarget(
            component);

    keepControlBarVisible();
}'''

          s = replace_method(
              s,
              "private void launchProjection(",
              launch_projection
          )

          # ========================================================
          # RETURN TO LAUNCHER
          # ========================================================

          return_launcher = r'''private void returnToLauncher() {

    activeTarget = null;

    V10SessionStore
            .clearTarget(this);

    if (session != null) {
        session.release();
    }

    projectionLayer
            .setVisibility(
                    View.GONE);

    launcherLayer
            .setVisibility(
                    View.VISIBLE);

    dashboard
            .setVisibility(
                    View.VISIBLE);

    appPanel
            .setVisibility(
                    View.GONE);

    keepControlBarVisible();
}'''

          s = replace_method(
              s,
              "private void returnToLauncher()",
              return_launcher
          )

          # ========================================================
          # SHOW APPS
          # ========================================================

          show_apps = r'''private void showApps() {

    if (launcherLayer == null
            || appPanel == null
            || dashboard == null) {

        return;
    }

    /*
     * Hide projection while the Applications panel
     * is displayed.
     *
     * The existing V10 session remains intact until
     * another application is selected.
     */
    projectionLayer
            .setVisibility(
                    View.GONE);

    launcherLayer
            .setVisibility(
                    View.VISIBLE);

    dashboard
            .setVisibility(
                    View.GONE);

    appPanel
            .setVisibility(
                    View.VISIBLE);

    loadApps();

    keepControlBarVisible();
}'''

          s = replace_method(
              s,
              "private void showApps()",
              show_apps
          )

          # ========================================================
          # HIDE APPS
          # ========================================================

          hide_apps = r'''private void hideApps() {

    if (appPanel == null
            || dashboard == null
            || launcherLayer == null) {

        return;
    }

    appPanel
            .setVisibility(
                    View.GONE);

    dashboard
            .setVisibility(
                    View.VISIBLE);

    launcherLayer
            .setVisibility(
                    View.VISIBLE);

    projectionLayer
            .setVisibility(
                    View.GONE);

    keepControlBarVisible();
}'''

          s = replace_method(
              s,
              "private void hideApps()",
              hide_apps
          )

          # ========================================================
          # BACK BUTTON
          # ========================================================

          back_method = r'''public void handleControlBack() {

    if (appPanel != null
            && appPanel.getVisibility()
                    == View.VISIBLE) {

        hideApps();

        return;
    }

    if (session != null
            && session.isActive()) {

        session.back();

        return;
    }

    returnToLauncher();
}'''

          s = replace_method(
              s,
              "public void handleControlBack()",
              back_method
          )

          # ========================================================
          # HOME BUTTON
          # ========================================================

          home_method = r'''public void handleControlHome() {

    returnToLauncher();
}'''

          s = replace_method(
              s,
              "public void handleControlHome()",
              home_method
          )

          # ========================================================
          # APPS BUTTON
          # ========================================================

          apps_method = r'''public void handleControlApps() {

    if (appPanel != null
            && appPanel.getVisibility()
                    == View.VISIBLE) {

        hideApps();

    } else {

        showApps();
    }
}'''

          s = replace_method(
              s,
              "public void handleControlApps()",
              apps_method
          )

          # ========================================================
          # RECENTS BUTTON
          #
          # V4.2.1 keeps the existing behavior:
          # open application selector.
          # ========================================================

          recents_method = r'''public void handleControlRecents() {

    showApps();
}'''

          s = replace_method(
              s,
              "public void handleControlRecents()",
              recents_method
          )

          # ========================================================
          # JAVA WRITE
          # ========================================================

          path.write_text(s)

          print("V10.3 CONTROL BAR MERGED INTO V4")
          print("V4 SELECTOR PRESERVED")
          print("V10 PROJECTION ENGINE PRESERVED")
          PY

      # ============================================================
      # VERIFY CONTROL BAR
      # ============================================================

      - name: Verify V10.3 control bar
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          test -f "$FILE"

          grep -Fq "import android.widget.Button;" "$FILE"
          grep -Fq "private LinearLayout controlBar;" "$FILE"
          grep -Fq "private void addControlButton(" "$FILE"
          grep -Fq "private void keepControlBarVisible()" "$FILE"

          grep -Fq '"BACK"' "$FILE"
          grep -Fq '"APPS"' "$FILE"
          grep -Fq '"RECENTS"' "$FILE"
          grep -Fq '"HOME"' "$FILE"

          grep -Fq "handleControlBack" "$FILE"
          grep -Fq "handleControlApps" "$FILE"
          grep -Fq "handleControlRecents" "$FILE"
          grep -Fq "handleControlHome" "$FILE"

          grep -Fq "controlBar.bringToFront()" "$FILE"

          echo "CONTROL BAR VERIFIED"

      # ============================================================
      # VERIFY V4 APPLICATION SELECTOR
      # ============================================================

      - name: Verify V4 application selector
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq "APPLICATIONS" "$FILE"
          grep -Fq "GridLayout" "$FILE"
          grep -Fq "setColumnCount" "$FILE"
          grep -Fq "ACTION_MAIN" "$FILE"
          grep -Fq "CATEGORY_LAUNCHER" "$FILE"
          grep -Fq "queryIntentActivities" "$FILE"
          grep -Fq "launchProjection" "$FILE"
          grep -Fq "V10SessionStore" "$FILE"

          echo "V4 SELECTOR VERIFIED"

      # ============================================================
      # VERIFY CONTROL FLOW
      # ============================================================

      - name: Verify control flow
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq "returnToLauncher" "$FILE"
          grep -Fq "showApps" "$FILE"
          grep -Fq "hideApps" "$FILE"
          grep -Fq "session.back" "$FILE"
          grep -Fq "session.release" "$FILE"

          echo "CONTROL FLOW VERIFIED"

      # ============================================================
      # VERIFY PROJECTION ENGINE
      #
      # IMPORTANT:
      # Do NOT test formatting-dependent strings.
      # Test actual executable mechanisms instead.
      # ============================================================

      - name: Verify existing V10 projection engine
        shell: bash
        run: |
          set -euo pipefail

          SESSION="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
          INPUT="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10InputController.java"
          SHELL="v10-source/app/src/main/java/com/hieptran/aacast/doudou/RootShellSession.java"
          DISPLAY="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10Display.java"

          test -f "$SESSION"
          test -f "$INPUT"
          test -f "$SHELL"
          test -f "$DISPLAY"

          # Virtual display
          grep -Fq "createVirtualDisplay" "$SESSION"

          # Proven V9/V10 launch mechanism
          grep -Fq -- "--display" "$SESSION"
          grep -Fq -- "--windowingMode 1" "$SESSION"
          grep -Fq "/system/bin/am start" "$SESSION"

          # Proven root shell
          grep -Fq "ProcessBuilder" "$SHELL"
          grep -Fq '"su"' "$SHELL"

          # Input bridge
          grep -Fq "/system/bin/input" "$INPUT"

          # V10 display identity
          grep -Fq "V10Display.nameFor" "$SESSION"
          grep -Fq 'PACKAGE' "$DISPLAY"
          grep -Fq 'PREFIX' "$DISPLAY"
          grep -Fq 'nameFor' "$DISPLAY"
          grep -Fq 'Car Assistant V10' "$DISPLAY"

          echo "PROJECTION ENGINE VERIFIED"

      # ============================================================
      # VERIFY V10 DISPLAY IDENTITY EXACTLY
      # ============================================================

      - name: Verify V10 display identity
        shell: bash
        run: |
          set -euo pipefail

          DISPLAY="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10Display.java"

          grep -Fq 'com.carassistant.v10' "$DISPLAY"
          grep -Fq 'Car Assistant V10' "$DISPLAY"
          grep -Fq 'type != 5' "$DISPLAY"
          grep -Fq 'ownerUid < 10000' "$DISPLAY"

          echo "V10 DISPLAY IDENTITY VERIFIED"

      # ============================================================
      # VERIFY ANDROID 12
      # ============================================================

      - name: Verify Android 12 compatibility
        shell: bash
        run: |
          set -euo pipefail

          if grep -R \
            -E \
            "androidx\.compose|compose\.material3|Build\.VERSION_CODES\.TIRAMISU|API 33|minSdk.*33" \
            v10-source/app/src/main \
            >/dev/null 2>&1; then

            echo "Android 13/Femto-only dependency detected."
            exit 1
          fi

          echo "ANDROID 12 VERIFIED"

      # ============================================================
      # NO GEARHEAD CONTROL BAR
      # ============================================================

      - name: Verify no Gearhead control bar
        shell: bash
        run: |
          set -euo pipefail

          if grep -R \
            "GearheadControlBar" \
            v10-source/app/src/main/java \
            >/dev/null 2>&1; then

            echo "GearheadControlBar dependency found."
            exit 1
          fi

          echo "NO GEARHEAD CONTROL BAR"

      # ============================================================
      # VERIFY NO V9 UI REGRESSION
      # ============================================================

      - name: Verify V9 UI was not copied back
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          if grep -Fq "AACastCarActivity" "$FILE"; then
            echo "V9 AACastCarActivity reference detected."
            exit 1
          fi

          if grep -Fq "AACastDisplay" "$FILE"; then
            echo "V9 AACastDisplay reference detected."
            exit 1
          fi

          echo "V9 UI REGRESSION CHECK PASSED"

      # ============================================================
      # JAVA STRUCTURE CHECK
      #
      # Catches exactly the type of accidental class-level
      # statement that the previous merge could create.
      # ============================================================

      - name: Java source sanity check
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          root = Path(
              "v10-source/app/src/main/java"
          )

          for path in root.rglob("*.java"):

              s = path.read_text()

              depth = 0
              in_string = False
              in_char = False
              in_line = False
              in_block = False
              escaped = False

              i = 0

              while i < len(s):

                  c = s[i]
                  n = s[i + 1] if i + 1 < len(s) else ""

                  if in_line:
                      if c == "\n":
                          in_line = False
                      i += 1
                      continue

                  if in_block:
                      if c == "*" and n == "/":
                          in_block = False
                          i += 2
                          continue
                      i += 1
                      continue

                  if in_string:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == '"':
                          in_string = False
                      i += 1
                      continue

                  if in_char:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == "'":
                          in_char = False
                      i += 1
                      continue

                  if c == "/" and n == "/":
                      in_line = True
                      i += 2
                      continue

                  if c == "/" and n == "*":
                      in_block = True
                      i += 2
                      continue

                  if c == '"':
                      in_string = True
                      i += 1
                      continue

                  if c == "'":
                      in_char = True
                      i += 1
                      continue

                  if c == "{":
                      depth += 1

                  elif c == "}":
                      depth -= 1

                      if depth < 0:
                          raise SystemExit(
                              f"Brace underflow: {path}"
                          )

                  i += 1

              if depth != 0:
                  raise SystemExit(
                      f"Unbalanced braces: {path}: {depth}"
                  )

          print("JAVA STRUCTURE OK")
          PY

      # ============================================================
      # VERIFY V10CarActivity HAS ONE CONTROL BAR
      # ============================================================

      - name: Verify no duplicate control bar definitions
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          COUNT_FIELD=$(grep -Fc "private LinearLayout controlBar;" "$FILE")

          if [ "$COUNT_FIELD" -ne 1 ]; then
            echo "Expected exactly one controlBar field, found $COUNT_FIELD"
            exit 1
          fi

          COUNT_HELPER=$(grep -Fc "private void addControlButton(" "$FILE")

          if [ "$COUNT_HELPER" -ne 1 ]; then
            echo "Expected exactly one addControlButton method, found $COUNT_HELPER"
            exit 1
          fi

          echo "NO DUPLICATE CONTROL BAR DEFINITIONS"

      # ============================================================
      # GRADLE CLEAN
      # ============================================================

      - name: Gradle clean
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean --no-daemon

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build Car Assistant V10.4 V4.2.1
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK OK"

          echo "SHA256:"
          sha256sum "$APK"

          echo "APK SIZE:"
          du -h "$APK"

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload V10.4 V4.2.1 APK
        uses: actions/upload-artifact@v4
        with:
