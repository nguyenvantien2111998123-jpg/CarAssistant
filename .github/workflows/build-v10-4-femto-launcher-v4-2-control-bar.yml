name: Build Car Assistant V10.4 - V4.2.1 Control Bar Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # ============================================================
      # VERIFY V4 BASE
      # ============================================================

      - name: Verify V10.4 V4 base
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          test -f "$FILE"

          grep -q "V10SessionStore" "$FILE"
          grep -q "launchProjection" "$FILE"
          grep -q "showApps" "$FILE"
          grep -q "hideApps" "$FILE"
          grep -q "APPLICATIONS" "$FILE"
          grep -q "ACTION_MAIN" "$FILE"
          grep -q "CATEGORY_LAUNCHER" "$FILE"

          echo "V4 BASE VERIFIED"

      # ============================================================
      # BACKUP
      # ============================================================

      - name: Backup V10CarActivity
        shell: bash
        run: |
          set -euo pipefail

          cp \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java \
            /tmp/V10CarActivity.v4.java

      # ============================================================
      # MERGE V10.3 CONTROL BAR
      # ============================================================

      - name: Merge V10.3 control bar with V4 selector
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          s = path.read_text()

          # ========================================================
          # ROBUST JAVA METHOD FINDER
          # ========================================================

          def find_method(text, name):
              pos = 0

              while True:
                  pos = text.find(name + "(", pos)

                  if pos < 0:
                      raise SystemExit(
                          f"Method not found: {name}"
                      )

                  # Make sure this is not part of another identifier.
                  if pos == 0 or not (
                      text[pos - 1].isalnum()
                      or text[pos - 1] == "_"
                  ):
                      break

                  pos += len(name) + 1

              brace = text.find("{", pos)

              if brace < 0:
                  raise SystemExit(
                      f"Opening brace not found: {name}"
                  )

              depth = 0
              i = brace

              in_string = False
              in_char = False
              in_line_comment = False
              in_block_comment = False
              escaped = False

              while i < len(text):

                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ""

                  if in_line_comment:
                      if c == "\n":
                          in_line_comment = False
                      i += 1
                      continue

                  if in_block_comment:
                      if c == "*" and n == "/":
                          in_block_comment = False
                          i += 2
                          continue
                      i += 1
                      continue

                  if in_string:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == '"':
                          in_string = False
                      i += 1
                      continue

                  if in_char:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == "'":
                          in_char = False
                      i += 1
                      continue

                  if c == "/" and n == "/":
                      in_line_comment = True
                      i += 2
                      continue

                  if c == "/" and n == "*":
                      in_block_comment = True
                      i += 2
                      continue

                  if c == '"':
                      in_string = True
                      i += 1
                      continue

                  if c == "'":
                      in_char = True
                      i += 1
                      continue

                  if c == "{":
                      depth += 1

                  elif c == "}":
                      depth -= 1

                      if depth == 0:
                          return pos, i + 1

                  i += 1

              raise SystemExit(
                  f"Unbalanced method: {name}"
              )

          def replace_method(text, name, replacement):
              a, b = find_method(text, name)
              return text[:a] + replacement + text[b:]

          # ========================================================
          # IMPORTS
          # ========================================================

          if "import android.widget.Button;" not in s:

              marker = "import android.widget.FrameLayout;"

              if marker not in s:
                  raise SystemExit(
                      "FrameLayout import not found"
                  )

              s = s.replace(
                  marker,
                  "import android.widget.Button;\n"
                  + marker,
                  1
              )

          # ========================================================
          # FIELD
          # ========================================================

          if "private LinearLayout controlBar;" not in s:

              candidates = [
                  "private LinearLayout dock;",
                  "private LinearLayout launcherLayer;",
                  "private LinearLayout dashboard;"
              ]

              marker = None

              for candidate in candidates:
                  if candidate in s:
                      marker = candidate
                      break

              if marker is None:
                  raise SystemExit(
                      "Could not find UI field for controlBar insertion"
                  )

              s = s.replace(
                  marker,
                  marker
                  + "\n    private LinearLayout controlBar;",
                  1
              )

          # ========================================================
          # CONTROL BUTTON HELPER
          # ========================================================

          if "private void addControlButton(" not in s:

              helper = r'''
              private void addControlButton(
                      String label,
                      View.OnClickListener listener) {

                  Button button =
                          new Button(this);

                  button.setText(label);

                  button.setTextSize(12);

                  button.setTextColor(
                          Color.WHITE);

                  button.setAllCaps(false);

                  button.setOnClickListener(
                          listener);

                  LinearLayout.LayoutParams
                          params =
                          new LinearLayout.LayoutParams(
                                  0,
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  1f);

                  params.setMargins(
                          dp(4),
                          dp(4),
                          dp(4),
                          dp(4));

                  controlBar.addView(
                          button,
                          params);
              }

              '''

              # Put helper immediately before buildUi().
              build_start, _ = find_method(
                  s,
                  "private void buildUi"
              )

              s = (
                  s[:build_start]
                  + helper
                  + s[build_start:]
              )

          # ========================================================
          # BUILD UI
          #
          # Add the control bar as the FINAL root child.
          # Therefore it stays above projection/app selector.
          # ========================================================

          build_start, build_end = find_method(
              s,
              "private void buildUi"
          )

          build = s[build_start:build_end]

          if "controlBar =" not in build:

              # Find the end of setContentView(root).
              marker = "setContentView(root);"

              if marker not in build:
                  raise SystemExit(
                      "setContentView(root) not found in buildUi"
                  )

              control = r'''

                  // ==================================================
                  // V10.3 PROVEN CONTROL BAR
                  // ==================================================

                  controlBar =
                          new LinearLayout(this);

                  controlBar.setOrientation(
                          LinearLayout.HORIZONTAL);

                  controlBar.setGravity(
                          Gravity.CENTER);

                  controlBar.setPadding(
                          dp(8),
                          dp(4),
                          dp(8),
                          dp(4));

                  controlBar.setBackgroundColor(
                          Color.rgb(24, 24, 24));

                  FrameLayout.LayoutParams
                          controlParams =
                          new FrameLayout.LayoutParams(
                                  FrameLayout.LayoutParams.MATCH_PARENT,
                                  dp(58));

                  controlParams.gravity =
                          Gravity.BOTTOM;

                  root.addView(
                          controlBar,
                          controlParams);

                  addControlButton(
                          "BACK",
                          v -> handleControlBack());

                  addControlButton(
                          "APPS",
                          v -> handleControlApps());

                  addControlButton(
                          "RECENTS",
                          v -> handleControlRecents());

                  addControlButton(
                          "HOME",
                          v -> handleControlHome());

                  controlBar.bringToFront();
              '''

              # IMPORTANT:
              # Insert BEFORE setContentView().
              build = build.replace(
                  marker,
                  control
                  + "\n\n        "
                  + marker,
                  1
              )

              s = (
                  s[:build_start]
                  + build
                  + s[build_end:]
              )

          # ========================================================
          # launchProjection()
          #
          # DO NOT REWRITE V4 LOGIC.
          # Just guarantee the control bar remains visible.
          # ========================================================

          start, end = find_method(
              s,
              "private void launchProjection"
          )

          method = s[start:end]

          if "controlBar.bringToFront();" not in method:

              method += r'''

                  if (controlBar != null) {
                      controlBar.setVisibility(
                              View.VISIBLE);
                      controlBar.bringToFront();
                  }
              '''

              s = s[:start] + method + s[end:]

          # ========================================================
          # showApps()
          # ========================================================

          start, end = find_method(
              s,
              "private void showApps"
          )

          method = s[start:end]

          if "controlBar.bringToFront();" not in method:

              method += r'''

                  if (controlBar != null) {
                      controlBar.setVisibility(
                              View.VISIBLE);
                      controlBar.bringToFront();
                  }
              '''

              s = s[:start] + method + s[end:]

          # ========================================================
          # hideApps()
          # ========================================================

          start, end = find_method(
              s,
              "private void hideApps"
          )

          method = s[start:end]

          if "controlBar.bringToFront();" not in method:

              method += r'''

                  if (controlBar != null) {
                      controlBar.setVisibility(
                              View.VISIBLE);
                      controlBar.bringToFront();
                  }
              '''

              s = s[:start] + method + s[end:]

          # ========================================================
          # RETURN TO LAUNCHER
          # ========================================================

          start, end = find_method(
              s,
              "private void returnToLauncher"
          )

          method = s[start:end]

          if "controlBar.bringToFront();" not in method:

              method += r'''

                  if (controlBar != null) {
                      controlBar.setVisibility(
                              View.VISIBLE);
                      controlBar.bringToFront();
                  }
              '''

              s = s[:start] + method + s[end:]

          # ========================================================
          # BACK
          # ========================================================

          start, end = find_method(
              s,
              "public void handleControlBack"
          )

          back_method = r'''public void handleControlBack() {

              if (appPanel != null
                      && appPanel.getVisibility()
                              == View.VISIBLE) {

                  hideApps();

                  return;
              }

              if (session != null
                      && session.isActive()) {

                  session.back();

                  return;
              }

              returnToLauncher();
          }'''

          s = s[:start] + back_method + s[end:]

          # ========================================================
          # HOME
          # ========================================================

          start, end = find_method(
              s,
              "public void handleControlHome"
          )

          home_method = r'''public void handleControlHome() {

              returnToLauncher();
          }'''

          s = s[:start] + home_method + s[end:]

          # ========================================================
          # APPS
          # ========================================================

          start, end = find_method(
              s,
              "public void handleControlApps"
          )

          apps_method = r'''public void handleControlApps() {

              if (appPanel != null
                      && appPanel.getVisibility()
                              == View.VISIBLE) {

                  hideApps();

              } else {

                  showApps();
              }
          }'''

          s = s[:start] + apps_method + s[end:]

          # ========================================================
          # RECENTS
          # ========================================================

          start, end = find_method(
              s,
              "public void handleControlRecents"
          )

          recents_method = r'''public void handleControlRecents() {

              showInfo(
                      "RECENTS",
                      "Session manager sẽ được thêm ở bước tiếp theo.");
          }'''

          s = s[:start] + recents_method + s[end:]

          path.write_text(s)

          print("CONTROL BAR MERGE COMPLETE")
          PY

      # ============================================================
      # VERIFY CONTROL BAR
      # ============================================================

      - name: Verify V10.3 control bar
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -q "import android.widget.Button;" "$FILE"
          grep -q "private LinearLayout controlBar;" "$FILE"
          grep -q "private void addControlButton" "$FILE"
          grep -q "controlBar =" "$FILE"

          grep -q '"BACK"' "$FILE"
          grep -q '"APPS"' "$FILE"
          grep -q '"RECENTS"' "$FILE"
          grep -q '"HOME"' "$FILE"

          grep -q "handleControlBack" "$FILE"
          grep -q "handleControlHome" "$FILE"
          grep -q "handleControlApps" "$FILE"
          grep -q "handleControlRecents" "$FILE"

          grep -q "controlBar.bringToFront" "$FILE"

          echo "CONTROL BAR VERIFIED"

      # ============================================================
      # VERIFY V4 SELECTOR
      # ============================================================

      - name: Verify V4 application selector
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -q "APPLICATIONS" "$FILE"
          grep -q "GridLayout" "$FILE"
          grep -q "setColumnCount" "$FILE"
          grep -q "ACTION_MAIN" "$FILE"
          grep -q "CATEGORY_LAUNCHER" "$FILE"
          grep -q "queryIntentActivities" "$FILE"
          grep -q "launchProjection" "$FILE"
          grep -q "V10SessionStore" "$FILE"

          echo "V4 SELECTOR VERIFIED"

      # ============================================================
      # VERIFY CONTROL FLOW
      # ============================================================

      - name: Verify control flow
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -q "returnToLauncher" "$FILE"
          grep -q "showApps" "$FILE"
          grep -q "hideApps" "$FILE"
          grep -q "session.back" "$FILE"
          grep -q "session.release" "$FILE"

          echo "CONTROL FLOW VERIFIED"

      # ============================================================
      # VERIFY PROJECTION ENGINE
      # ============================================================

      - name: Verify existing V10 projection engine
        shell: bash
        run: |
          set -euo pipefail

          SESSION="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
          INPUT="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10InputController.java"
          SHELL="v10-source/app/src/main/java/com/hieptran/aacast/doudou/RootShellSession.java"
          DISPLAY="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10Display.java"

          test -f "$SESSION"
          test -f "$INPUT"
          test -f "$SHELL"
          test -f "$DISPLAY"

          grep -q "createVirtualDisplay" "$SESSION"
          grep -q -- "--display" "$SESSION"
          grep -q -- "--windowingMode 1" "$SESSION"
          grep -q "/system/bin/am start" "$SESSION"

          grep -q "/system/bin/input" "$INPUT"

          grep -q "ProcessBuilder" "$SHELL"
          grep -q "su" "$SHELL"

          grep -q "V10Display.nameFor" "$SESSION"

          grep -q "Car Assistant V10" "$DISPLAY"

          echo "PROJECTION ENGINE VERIFIED"

      # ============================================================
      # VERIFY ANDROID 12
      # ============================================================

      - name: Verify Android 12 compatibility
        shell: bash
        run: |
          set -euo pipefail

          if grep -R \
            -E \
            "androidx\.compose|compose\.material3|Build\.VERSION_CODES\.TIRAMISU|API 33|minSdk.*33" \
            v10-source/app/src/main \
            >/dev/null 2>&1; then

            echo "Android 13/Femto-only dependency detected."
            exit 1
          fi

          echo "ANDROID 12 VERIFIED"

      # ============================================================
      # NO GEARHEAD CONTROL BAR
      # ============================================================

      - name: Verify no Gearhead control bar
        shell: bash
        run: |
          set -euo pipefail

          if grep -R \
            "GearheadControlBar" \
            v10-source/app/src/main/java \
            >/dev/null 2>&1; then

            echo "GearheadControlBar dependency found."
            exit 1
          fi

          echo "NO GEARHEAD CONTROL BAR"

      # ============================================================
      # JAVA SANITY
      # ============================================================

      - name: Java source sanity check
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          root = Path(
              "v10-source/app/src/main/java"
          )

          for path in root.rglob("*.java"):

              s = path.read_text()

              depth = 0
              in_string = False
              in_char = False
              in_line = False
              in_block = False
              escaped = False

              i = 0

              while i < len(s):

                  c = s[i]
                  n = s[i + 1] if i + 1 < len(s) else ""

                  if in_line:
                      if c == "\n":
                          in_line = False
                      i += 1
                      continue

                  if in_block:
                      if c == "*" and n == "/":
                          in_block = False
                          i += 2
                          continue
                      i += 1
                      continue

                  if in_string:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == '"':
                          in_string = False
                      i += 1
                      continue

                  if in_char:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == "'":
                          in_char = False
                      i += 1
                      continue

                  if c == "/" and n == "/":
                      in_line = True
                      i += 2
                      continue

                  if c == "/" and n == "*":
                      in_block = True
                      i += 2
                      continue

                  if c == '"':
                      in_string = True
                      i += 1
                      continue

                  if c == "'":
                      in_char = True
                      i += 1
                      continue

                  if c == "{":
                      depth += 1

                  elif c == "}":
                      depth -= 1

                      if depth < 0:
                          raise SystemExit(
                              f"Brace underflow: {path}"
                          )

                  i += 1

              if depth != 0:
                  raise SystemExit(
                      f"Unbalanced braces: {path}: {depth}"
                  )

          print("JAVA STRUCTURE OK")
          PY

      # ============================================================
      # BUILD
      # ============================================================

      - name: Gradle clean
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean --no-daemon

      - name: Build Car Assistant V10.4 V4.2.1
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK OK"
          sha256sum "$APK"

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload V10.4 V4.2.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10.4-Femto-Launcher-V4.2.1-Control-Bar
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit V10.4 V4.2.1 source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add v10-source

          if git diff --cached --quiet; then
            echo "No source changes."
          else
            git commit \
              -m "Fix V10.4 V4.2.1 control bar"
            git push
          fi

      # ============================================================
      # DONE
      # ============================================================

      - name: Complete
        shell: bash
        run: |
          echo
          echo "=============================================="
          echo " CAR ASSISTANT V10.4 V4.2.1 BUILD PASSED"
          echo "=============================================="
          echo "V10.3 CONTROL BAR: BACK / APPS / RECENTS / HOME"
          echo "V4 APP SELECTOR: APPLICATIONS"
          echo "V10 PROJECTION ENGINE: PRESERVED"
          echo "ANDROID 12: SUPPORTED"
          echo "=============================================="
