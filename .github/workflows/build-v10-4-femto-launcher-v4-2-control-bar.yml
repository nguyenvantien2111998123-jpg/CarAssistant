name: Build Car Assistant V10.4 - V4.2.1 Control Bar Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # ============================================================
      # VERIFY V4 BASE
      # ============================================================

      - name: Verify V10.4 V4 base
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          test -f "$FILE"

          grep -Fq "V10SessionStore" "$FILE"
          grep -Fq "launchProjection" "$FILE"
          grep -Fq "showApps" "$FILE"
          grep -Fq "hideApps" "$FILE"
          grep -Fq "returnToLauncher" "$FILE"
          grep -Fq "APPLICATIONS" "$FILE"
          grep -Fq "ACTION_MAIN" "$FILE"
          grep -Fq "CATEGORY_LAUNCHER" "$FILE"
          grep -Fq "queryIntentActivities" "$FILE"

          echo "V10.4 V4 BASE VERIFIED"

      # ============================================================
      # BACKUP
      # ============================================================

      - name: Backup V10CarActivity
        shell: bash
        run: |
          set -euo pipefail

          cp \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java \
            /tmp/V10CarActivity.v4.java

          echo "BACKUP CREATED"

      # ============================================================
      # ADD CONTROL BAR
      # ============================================================

      - name: Add V10.3 control bar safely
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text()

          # --------------------------------------------------------
          # IMPORT
          # --------------------------------------------------------

          if "import android.widget.Button;" not in source:

              marker = "import android.widget.FrameLayout;"

              if marker not in source:
                  raise SystemExit(
                      "ERROR: FrameLayout import not found"
                  )

              source = source.replace(
                  marker,
                  marker + "\nimport android.widget.Button;",
                  1
              )

          # --------------------------------------------------------
          # FIELD
          # --------------------------------------------------------

          if "private LinearLayout controlBar;" not in source:

              marker = "private LinearLayout dock;"

              if marker not in source:
                  raise SystemExit(
                      "ERROR: dock field not found"
                  )

              source = source.replace(
                  marker,
                  marker + "\n    private LinearLayout controlBar;",
                  1
              )

          # --------------------------------------------------------
          # HELPER
          # --------------------------------------------------------

          if "private void addControlButton(" not in source:

              marker = "    private void buildUi()"

              if marker not in source:
                  raise SystemExit(
                      "ERROR: buildUi() not found"
                  )

              helper = (
                  "    private void addControlButton("
                  "String label, View.OnClickListener listener) {\n"
                  "\n"
                  "        Button button = new Button(this);\n"
                  "        button.setText(label);\n"
                  "        button.setTextSize(12);\n"
                  "        button.setTextColor(Color.WHITE);\n"
                  "        button.setAllCaps(false);\n"
                  "        button.setOnClickListener(listener);\n"
                  "\n"
                  "        LinearLayout.LayoutParams params =\n"
                  "                new LinearLayout.LayoutParams(\n"
                  "                        0,\n"
                  "                        LinearLayout.LayoutParams.MATCH_PARENT,\n"
                  "                        1f);\n"
                  "\n"
                  "        params.setMargins(\n"
                  "                dp(4),\n"
                  "                dp(4),\n"
                  "                dp(4),\n"
                  "                dp(4));\n"
                  "\n"
                  "        controlBar.addView(\n"
                  "                button,\n"
                  "                params);\n"
                  "    }\n"
                  "\n"
              )

              source = source.replace(
                  marker,
                  helper + marker,
                  1
              )

          # --------------------------------------------------------
          # CONTROL BAR
          # --------------------------------------------------------

          if "V10.3 CONTROL BAR" not in source:

              marker = "        setContentView(root);"

              if marker not in source:
                  raise SystemExit(
                      "ERROR: setContentView(root) not found"
                  )

              control = (
                  "        // V10.3 CONTROL BAR\n"
                  "\n"
                  "        controlBar =\n"
                  "                new LinearLayout(this);\n"
                  "\n"
                  "        controlBar.setOrientation(\n"
                  "                LinearLayout.HORIZONTAL);\n"
                  "\n"
                  "        controlBar.setGravity(\n"
                  "                Gravity.CENTER);\n"
                  "\n"
                  "        controlBar.setPadding(\n"
                  "                dp(8),\n"
                  "                dp(4),\n"
                  "                dp(8),\n"
                  "                dp(4));\n"
                  "\n"
                  "        controlBar.setBackgroundColor(\n"
                  "                Color.rgb(24, 24, 24));\n"
                  "\n"
                  "        FrameLayout.LayoutParams controlParams =\n"
                  "                new FrameLayout.LayoutParams(\n"
                  "                        FrameLayout.LayoutParams.MATCH_PARENT,\n"
                  "                        dp(58));\n"
                  "\n"
                  "        controlParams.gravity =\n"
                  "                Gravity.BOTTOM;\n"
                  "\n"
                  "        root.addView(\n"
                  "                controlBar,\n"
                  "                controlParams);\n"
                  "\n"
                  "        addControlButton(\n"
                  "                \"BACK\",\n"
                  "                v -> handleControlBack());\n"
                  "\n"
                  "        addControlButton(\n"
                  "                \"APPS\",\n"
                  "                v -> handleControlApps());\n"
                  "\n"
                  "        addControlButton(\n"
                  "                \"RECENTS\",\n"
                  "                v -> handleControlRecents());\n"
                  "\n"
                  "        addControlButton(\n"
                  "                \"HOME\",\n"
                  "                v -> handleControlHome());\n"
                  "\n"
                  "        controlBar.bringToFront();\n"
                  "\n"
              )

              source = source.replace(
                  marker,
                  control + marker,
                  1
              )

          path.write_text(source)

          print("CONTROL BAR ADDED SAFELY")
          PY

      # ============================================================
      # VERIFY CONTROL BAR
      # ============================================================

      - name: Verify control bar
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq "import android.widget.Button;" "$FILE"
          grep -Fq "private LinearLayout controlBar;" "$FILE"
          grep -Fq "private void addControlButton(" "$FILE"
          grep -Fq "V10.3 CONTROL BAR" "$FILE"

          grep -Fq '"BACK"' "$FILE"
          grep -Fq '"APPS"' "$FILE"
          grep -Fq '"RECENTS"' "$FILE"
          grep -Fq '"HOME"' "$FILE"

          grep -Fq "handleControlBack" "$FILE"
          grep -Fq "handleControlApps" "$FILE"
          grep -Fq "handleControlRecents" "$FILE"
          grep -Fq "handleControlHome" "$FILE"

          echo "CONTROL BAR VERIFIED"

      # ============================================================
      # DUPLICATE CHECK
      # ============================================================

      - name: Verify no duplicate control bar
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          FIELD_COUNT=$(grep -Fc \
            "private LinearLayout controlBar;" \
            "$FILE")

          IMPORT_COUNT=$(grep -Fc \
            "import android.widget.Button;" \
            "$FILE")

          HELPER_COUNT=$(grep -Fc \
            "private void addControlButton(" \
            "$FILE")

          MARKER_COUNT=$(grep -Fc \
            "V10.3 CONTROL BAR" \
            "$FILE")

          [ "$FIELD_COUNT" -eq 1 ]
          [ "$IMPORT_COUNT" -eq 1 ]
          [ "$HELPER_COUNT" -eq 1 ]
          [ "$MARKER_COUNT" -eq 1 ]

          echo "NO DUPLICATE CONTROL BAR"

      # ============================================================
      # VERIFY V4 SELECTOR
      # ============================================================

      - name: Verify V4 application selector
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq "APPLICATIONS" "$FILE"
          grep -Fq "GridLayout" "$FILE"
          grep -Fq "setColumnCount" "$FILE"
          grep -Fq "ACTION_MAIN" "$FILE"
          grep -Fq "CATEGORY_LAUNCHER" "$FILE"
          grep -Fq "queryIntentActivities" "$FILE"
          grep -Fq "launchProjection" "$FILE"
          grep -Fq "V10SessionStore" "$FILE"

          echo "V4 SELECTOR VERIFIED"

      # ============================================================
      # VERIFY V4 CONTROL FLOW
      # ============================================================

      - name: Verify V4 control flow
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq "returnToLauncher" "$FILE"
          grep -Fq "showApps" "$FILE"
          grep -Fq "hideApps" "$FILE"
          grep -Fq "session.back" "$FILE"
          grep -Fq "session.release" "$FILE"

          echo "V4 CONTROL FLOW VERIFIED"

      # ============================================================
      # VERIFY PROJECTION ENGINE
      #
      # KHÔNG kiểm tra các chuỗi dễ lỗi format bằng grep.
      # Chỉ kiểm tra file + API cốt lõi.
      # ============================================================

      - name: Verify V10 projection engine
        shell: bash
        run: |
          set -euo pipefail

          SESSION="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
          INPUT="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10InputController.java"
          SHELL_FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/RootShellSession.java"
          DISPLAY="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10Display.java"

          test -f "$SESSION"
          test -f "$INPUT"
          test -f "$SHELL_FILE"
          test -f "$DISPLAY"

          # Projection API
          grep -Fq "VirtualDisplay" "$SESSION"
          grep -Fq "DisplayManager" "$SESSION"
          grep -Fq "createVirtualDisplay" "$SESSION"
          grep -Fq "SurfaceTexture" "$SESSION"
          grep -Fq "Surface" "$SESSION"

          # Launch bridge
          grep -Fq "/system/bin/am start" "$SESSION"
          grep -Fq "V10Display.nameFor" "$SESSION"

          # Root shell
          grep -Fq "ProcessBuilder" "$SHELL_FILE"
          grep -Fq '"su"' "$SHELL_FILE"

          # Input
          grep -Fq "/system/bin/input" "$INPUT"

          # Display identity symbols
          grep -Fq "PACKAGE" "$DISPLAY"
          grep -Fq "PREFIX" "$DISPLAY"
          grep -Fq "nameFor" "$DISPLAY"
          grep -Fq "matches" "$DISPLAY"

          echo "PROJECTION ENGINE VERIFIED"

      # ============================================================
      # VERIFY DISPLAY IDENTITY
      # ============================================================

      - name: Verify V10 display identity
        shell: bash
        run: |
          set -euo pipefail

          DISPLAY="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10Display.java"

          grep -Fq '"com.carassistant.v10"' "$DISPLAY"
          grep -Fq '"Car Assistant V10 "' "$DISPLAY"

          echo "V10 DISPLAY IDENTITY VERIFIED"

      # ============================================================
      # ANDROID 12
      # ============================================================

      - name: Verify Android 12 compatibility
        shell: bash
        run: |
          set -euo pipefail

          if grep -R \
            -E \
            "androidx\.compose|compose\.material3|Build\.VERSION_CODES\.TIRAMISU|API 33|minSdk.*33" \
            v10-source/app/src/main \
            >/dev/null 2>&1; then

            echo "Android 13/Femto-only code detected."
            exit 1
          fi

          echo "ANDROID 12 COMPATIBILITY VERIFIED"

      # ============================================================
      # NO GEARHEAD CONTROL BAR
      # ============================================================

      - name: Verify no Gearhead control bar
        shell: bash
        run: |
          set -euo pipefail

          if grep -R \
            "GearheadControlBar" \
            v10-source/app/src/main/java \
            >/dev/null 2>&1; then

            echo "GearheadControlBar detected."
            exit 1
          fi

          echo "NO GEARHEAD CONTROL BAR"

      # ============================================================
      # NO V9 UI REGRESSION
      # ============================================================

      - name: Verify no V9 UI regression
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          if grep -Fq "AACastCarActivity" "$FILE"; then
            echo "AACastCarActivity detected."
            exit 1
          fi

          if grep -Fq "AACastDisplay" "$FILE"; then
            echo "AACastDisplay detected."
            exit 1
          fi

          echo "V9 UI REGRESSION CHECK PASSED"

      # ============================================================
      # JAVA STRUCTURE
      # ============================================================

      - name: Java source sanity check
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          root = Path(
              "v10-source/app/src/main/java"
          )

          for path in root.rglob("*.java"):

              text = path.read_text()

              depth = 0
              in_string = False
              in_char = False
              in_line = False
              in_block = False
              escaped = False

              i = 0

              while i < len(text):

                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ""

                  if in_line:
                      if c == "\n":
                          in_line = False
                      i += 1
                      continue

                  if in_block:
                      if c == "*" and n == "/":
                          in_block = False
                          i += 2
                          continue
                      i += 1
                      continue

                  if in_string:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == '"':
                          in_string = False
                      i += 1
                      continue

                  if in_char:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == "'":
                          in_char = False
                      i += 1
                      continue

                  if c == "/" and n == "/":
                      in_line = True
                      i += 2
                      continue

                  if c == "/" and n == "*":
                      in_block = True
                      i += 2
                      continue

                  if c == '"':
                      in_string = True
                      i += 1
                      continue

                  if c == "'":
                      in_char = True
                      i += 1
                      continue

                  if c == "{":
                      depth += 1

                  elif c == "}":
                      depth -= 1

                      if depth < 0:
                          raise SystemExit(
                              f"Brace underflow: {path}"
                          )

                  i += 1

              if depth != 0:
                  raise SystemExit(
                      f"Unbalanced braces: {path}: {depth}"
                  )

          print("JAVA STRUCTURE OK")
          PY

      # ============================================================
      # BUILD
      # ============================================================

      - name: Gradle clean
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean --no-daemon

      - name: Build Car Assistant V10.4 V4.2.1
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # APK
      # ============================================================

      - name: Verify APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK OK"
          sha256sum "$APK"
          du -h "$APK"

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload V10.4 V4.2.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10.4-Femto-Launcher-V4.2.1-Control-Bar
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # COMMIT
      # Build không phụ thuộc quyền push.
      # ============================================================

      - name: Commit V10.4 V4.2.1 source
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add v10-source

          if git diff --cached --quiet; then
            echo "No source changes."
            exit 0
          fi

          git commit \
            -m "Fix V10.4 V4.2.1 control bar"

          git push

      # ============================================================
      # COMPLETE
      # ============================================================

      - name: Complete
        shell: bash
        run: |
          echo
          echo "=============================================="
          echo " CAR ASSISTANT V10.4 V4.2.1 BUILD PASSED"
          echo "=============================================="
          echo "CONTROL BAR: BACK / APPS / RECENTS / HOME"
          echo "V4 SELECTOR: APPLICATIONS"
          echo "PROJECTION ENGINE: PRESERVED"
          echo "INPUT ENGINE: PRESERVED"
          echo "ANDROID 12: SUPPORTED"
          echo "GEARHEAD CONTROL BAR: NOT USED"
          echo "=============================================="
