name: Build Car Assistant V10.4 - V4.2.1 Control Bar Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # ============================================================
      # VERIFY V10.4 V4 BASE
      # ============================================================

      - name: Verify V10.4 V4 base
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          test -f "$FILE"

          grep -q "V10SessionStore" "$FILE"
          grep -q "launchProjection" "$FILE"
          grep -q "showApps" "$FILE"
          grep -q "hideApps" "$FILE"
          grep -q "APPLICATIONS" "$FILE"
          grep -q "ACTION_MAIN" "$FILE"
          grep -q "CATEGORY_LAUNCHER" "$FILE"

          echo "V10.4 V4 BASE VERIFIED"

      # ============================================================
      # BACKUP
      # ============================================================

      - name: Backup V10CarActivity
        shell: bash
        run: |
          set -euo pipefail

          cp \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java \
            /tmp/V10CarActivity.v4.java

          echo "Backup created."

      # ============================================================
      # RESTORE V10.3 CONTROL BAR INTO V4
      #
      # Keep the V4 application selector.
      # Add back the exact V10.3 in-app control bar architecture.
      # ============================================================

      - name: Merge V10.3 control bar with V4 selector
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          s = path.read_text()

          # --------------------------------------------------------
          # 1. Add Button import
          # --------------------------------------------------------

          if "import android.widget.Button;" not in s:
              marker = "import android.widget.FrameLayout;"
              if marker not in s:
                  raise SystemExit("FrameLayout import not found")

              s = s.replace(
                  marker,
                  "import android.widget.Button;\n" + marker,
                  1
              )

          # --------------------------------------------------------
          # 2. Add controlBar field
          # --------------------------------------------------------

          if "private LinearLayout controlBar;" not in s:
              marker = "private LinearLayout dock;"
              if marker not in s:
                  raise SystemExit("dock field not found")

              s = s.replace(
                  marker,
                  marker + "\n    private LinearLayout controlBar;",
                  1
              )

          # --------------------------------------------------------
          # Helper: find method by name and balanced braces.
          # Handles comments and Java strings.
          # --------------------------------------------------------

          def find_method(text, method_name):
              needle = method_name + "("
              start = text.find(needle)

              if start < 0:
                  raise SystemExit(
                      f"Method not found: {method_name}"
                  )

              # Find opening brace after signature.
              brace = text.find("{", start)

              if brace < 0:
                  raise SystemExit(
                      f"Opening brace not found: {method_name}"
                  )

              depth = 0
              i = brace
              in_string = False
              in_char = False
              in_line_comment = False
              in_block_comment = False
              escaped = False

              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ""

                  if in_line_comment:
                      if c == "\n":
                          in_line_comment = False
                      i += 1
                      continue

                  if in_block_comment:
                      if c == "*" and n == "/":
                          in_block_comment = False
                          i += 2
                          continue
                      i += 1
                      continue

                  if in_string:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == '"':
                          in_string = False
                      i += 1
                      continue

                  if in_char:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == "'":
                          in_char = False
                      i += 1
                      continue

                  if c == "/" and n == "/":
                      in_line_comment = True
                      i += 2
                      continue

                  if c == "/" and n == "*":
                      in_block_comment = True
                      i += 2
                      continue

                  if c == '"':
                      in_string = True
                      i += 1
                      continue

                  if c == "'":
                      in_char = True
                      i += 1
                      continue

                  if c == "{":
                      depth += 1

                  elif c == "}":
                      depth -= 1

                      if depth == 0:
                          return start, i + 1

                  i += 1

              raise SystemExit(
                  f"Unbalanced method: {method_name}"
              )

          def replace_method(text, method_name, replacement):
              a, b = find_method(text, method_name)
              return text[:a] + replacement + text[b:]

          # --------------------------------------------------------
          # 3. Add exact V10.3 control-bar builder.
          # --------------------------------------------------------

          if "private void addControlButton(" not in s:
              marker = "    private void buildDashboard()"
              if marker not in s:
                  raise SystemExit(
                      "buildDashboard marker not found"
                  )

              helper = r'''
              private void addControlButton(
                      String label,
                      View.OnClickListener listener) {

                  Button button =
                          new Button(this);

                  button.setText(label);

                  button.setTextSize(12);

                  button.setTextColor(
                          Color.WHITE);

                  button.setAllCaps(false);

                  button.setOnClickListener(
                          listener);

                  LinearLayout.LayoutParams
                          params =
                          new LinearLayout.LayoutParams(
                                  0,
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  1f);

                  params.setMargins(
                          dp(4),
                          dp(4),
                          dp(4),
                          dp(4));

                  controlBar.addView(
                          button,
                          params);
              }

              '''

              s = s.replace(
                  marker,
                  helper + marker,
                  1
              )

          # --------------------------------------------------------
          # 4. Patch buildUi().
          #
          # Existing V4 dashboard + app selector stays untouched.
          # Control bar is added LAST so it remains above everything.
          # --------------------------------------------------------

          build_ui_start, build_ui_end = find_method(
              s,
              "private void buildUi"
          )

          build_ui = s[build_ui_start:build_ui_end]

          if "controlBar =" not in build_ui:

              marker = "        buildAppPanel();"

              if marker not in build_ui:
                  raise SystemExit(
                      "buildAppPanel call not found in buildUi"
                  )

              control = r'''

                  // ==================================================
                  // V10.3 CONTROL BAR
                  // ==================================================

                  controlBar =
                          new LinearLayout(this);

                  controlBar.setOrientation(
                          LinearLayout.HORIZONTAL);

                  controlBar.setGravity(
                          Gravity.CENTER);

                  controlBar.setPadding(
                          dp(8),
                          dp(4),
                          dp(8),
                          dp(4));

                  controlBar.setBackgroundColor(
                          Color.rgb(24, 24, 24));

                  FrameLayout.LayoutParams
                          barParams =
                          new FrameLayout.LayoutParams(
                                  FrameLayout.LayoutParams.MATCH_PARENT,
                                  dp(58));

                  barParams.gravity =
                          Gravity.BOTTOM;

                  root.addView(
                          controlBar,
                          barParams);

                  addControlButton(
                          "BACK",
                          v -> handleControlBack());

                  addControlButton(
                          "APPS",
                          v -> handleControlApps());

                  addControlButton(
                          "RECENTS",
                          v -> handleControlRecents());

                  addControlButton(
                          "HOME",
                          v -> handleControlHome());

                  controlBar.bringToFront();
              '''

              build_ui = build_ui.replace(
                  marker,
                  marker + control,
                  1
              )

              s = (
                  s[:build_ui_start]
                  + build_ui
                  + s[build_ui_end:]
              )

          # --------------------------------------------------------
          # 5. launchProjection()
          #
          # Keep V4 selector logic.
          # Control bar stays visible.
          # --------------------------------------------------------

          start, end = find_method(
              s,
              "private void launchProjection"
          )

          launch = s[start:end]

          if "controlBar.bringToFront();" not in launch:
              marker = "        session.setTarget(\n                component);"

              if marker not in launch:
                  marker = "        session.setTarget(component);"

              if marker not in launch:
                  raise SystemExit(
                      "session.setTarget marker not found"
                  )

              launch = launch.replace(
                  marker,
                  marker
                  + "\n\n        if (controlBar != null) {\n"
                  + "            controlBar.setVisibility(View.VISIBLE);\n"
                  + "            controlBar.bringToFront();\n"
                  + "        }",
                  1
              )

              s = (
                  s[:start]
                  + launch
                  + s[end:]
              )

          # --------------------------------------------------------
          # 6. returnToLauncher()
          # --------------------------------------------------------

          start, end = find_method(
              s,
              "private void returnToLauncher"
          )

          method = s[start:end]

          if "controlBar.bringToFront();" not in method:
              method += r'''

                  if (controlBar != null) {
                      controlBar.setVisibility(
                              View.VISIBLE);
                      controlBar.bringToFront();
                  }
              '''

              s = s[:start] + method + s[end:]

          # --------------------------------------------------------
          # 7. showApps()
          # --------------------------------------------------------

          start, end = find_method(
              s,
              "private void showApps"
          )

          method = s[start:end]

          if "controlBar.bringToFront();" not in method:
              method += r'''

                  if (controlBar != null) {
                      controlBar.setVisibility(
                              View.VISIBLE);
                      controlBar.bringToFront();
                  }
              '''

              s = s[:start] + method + s[end:]

          # --------------------------------------------------------
          # 8. hideApps()
          # --------------------------------------------------------

          start, end = find_method(
              s,
              "private void hideApps"
          )

          method = s[start:end]

          if "controlBar.bringToFront();" not in method:
              method += r'''

                  if (controlBar != null) {
                      controlBar.setVisibility(
                              View.VISIBLE);
                      controlBar.bringToFront();
                  }
              '''

              s = s[:start] + method + s[end:]

          # --------------------------------------------------------
          # 9. Control handlers.
          #
          # BACK:
          #   - close Applications
          #   - otherwise send Back to projected app
          #   - otherwise return launcher
          #
          # HOME:
          #   - dashboard
          #
          # APPS:
          #   - toggle Applications
          #
          # RECENTS:
          #   - keep existing placeholder behavior
          # --------------------------------------------------------

          start, end = find_method(
              s,
              "public void handleControlBack"
          )

          replacement = r'''public void handleControlBack() {

              if (appPanel != null
                      && appPanel.getVisibility()
                              == View.VISIBLE) {

                  hideApps();

                  return;
              }

              if (session != null
                      && session.isActive()) {

                  session.back();

                  return;
              }

              returnToLauncher();
          }'''

          s = s[:start] + replacement + s[end:]

          start, end = find_method(
              s,
              "public void handleControlHome"
          )

          replacement = r'''public void handleControlHome() {

              returnToLauncher();
          }'''

          s = s[:start] + replacement + s[end:]

          start, end = find_method(
              s,
              "public void handleControlRecents"
          )

          replacement = r'''public void handleControlRecents() {

              showInfo(
                      "RECENTS",
                      "Session manager sẽ được thêm ở bước tiếp theo.");
          }'''

          s = s[:start] + replacement + s[end:]

          start, end = find_method(
              s,
              "public void handleControlApps"
          )

          replacement = r'''public void handleControlApps() {

              if (appPanel != null
                      && appPanel.getVisibility()
                              == View.VISIBLE) {

                  hideApps();

              } else {

                  showApps();
              }
          }'''

          s = s[:start] + replacement + s[end:]

          # --------------------------------------------------------
          # 10. onDestroy cleanup
          # --------------------------------------------------------

          marker = "        dock = null;"

          if marker in s and "controlBar = null;" not in s:
              s = s.replace(
                  marker,
                  marker
                  + "\n        controlBar = null;",
                  1
              )

          path.write_text(s)

          print("V10.3 CONTROL BAR MERGED INTO V10.4 V4")
          PY

      # ============================================================
      # VERIFY CONTROL BAR
      # ============================================================

      - name: Verify V10.3 control bar
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -q "import android.widget.Button;" "$FILE"
          grep -q "private LinearLayout controlBar;" "$FILE"
          grep -q "private void addControlButton" "$FILE"
          grep -q "controlBar =" "$FILE"

          grep -q '"BACK"' "$FILE"
          grep -q '"APPS"' "$FILE"
          grep -q '"RECENTS"' "$FILE"
          grep -q '"HOME"' "$FILE"

          grep -q "handleControlBack" "$FILE"
          grep -q "handleControlHome" "$FILE"
          grep -q "handleControlApps" "$FILE"
          grep -q "handleControlRecents" "$FILE"

          grep -q "controlBar.bringToFront" "$FILE"

          echo "V10.3 CONTROL BAR VERIFIED"

      # ============================================================
      # VERIFY V4 APP SELECTOR
      # ============================================================

      - name: Verify V4 app selector
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -q "APPLICATIONS" "$FILE"
          grep -q "GridLayout" "$FILE"
          grep -q "setColumnCount" "$FILE"
          grep -q "ACTION_MAIN" "$FILE"
          grep -q "CATEGORY_LAUNCHER" "$FILE"
          grep -q "queryIntentActivities" "$FILE"
          grep -q "launchProjection" "$FILE"
          grep -q "V10SessionStore" "$FILE"

          echo "V4 APP SELECTOR VERIFIED"

      # ============================================================
      # VERIFY CONTROL FLOW
      # ============================================================

      - name: Verify V10 control flow
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -q "returnToLauncher" "$FILE"
          grep -q "showApps" "$FILE"
          grep -q "hideApps" "$FILE"
          grep -q "session.back" "$FILE"
          grep -q "session.release" "$FILE"

          echo "CONTROL FLOW VERIFIED"

      # ============================================================
      # VERIFY PROJECTION ENGINE
      # ============================================================

      - name: Verify existing V10 projection engine
        shell: bash
        run: |
          set -euo pipefail

          SESSION="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
          INPUT="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10InputController.java"
          SHELL="v10-source/app/src/main/java/com/hieptran/aacast/doudou/RootShellSession.java"
          DISPLAY="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10Display.java"

          test -f "$SESSION"
          test -f "$INPUT"
          test -f "$SHELL"
          test -f "$DISPLAY"

          grep -q "createVirtualDisplay" "$SESSION"
          grep -q -- "--display" "$SESSION"
          grep -q -- "--windowingMode 1" "$SESSION"
          grep -q "/system/bin/am start" "$SESSION"

          grep -q "/system/bin/input" "$INPUT"

          grep -q "ProcessBuilder" "$SHELL"
          grep -q "su" "$SHELL"

          grep -q "V10Display.nameFor" "$SESSION"

          grep -q "Car Assistant V10" "$DISPLAY"

          echo "PROJECTION ENGINE VERIFIED"

      # ============================================================
      # VERIFY ANDROID 12
      # ============================================================

      - name: Verify Android 12 compatibility
        shell: bash
        run: |
          set -euo pipefail

          if grep -R \
            -E \
            "androidx\.compose|compose\.material3|Build\.VERSION_CODES\.TIRAMISU|API 33|minSdk.*33" \
            v10-source/app/src/main \
            >/dev/null 2>&1; then

            echo "Unexpected Android 13/Femto-only dependency found."
            exit 1
          fi

          echo "ANDROID 12 COMPATIBILITY VERIFIED"

      # ============================================================
      # VERIFY NO GEARHEAD CONTROL BAR
      # ============================================================

      - name: Verify no Gearhead control bar dependency
        shell: bash
        run: |
          set -euo pipefail

          if grep -R \
            "GearheadControlBar" \
            v10-source/app/src/main/java \
            >/dev/null 2>&1; then

            echo "GearheadControlBar dependency still exists."
            exit 1
          fi

          echo "NO GEARHEAD CONTROL BAR DEPENDENCY"

      # ============================================================
      # VERIFY JAVA BRACES
      # ============================================================

      - name: Java source sanity check
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          root = Path(
              "v10-source/app/src/main/java"
          )

          for path in root.rglob("*.java"):

              s = path.read_text()

              depth = 0
              in_string = False
              in_char = False
              in_line = False
              in_block = False
              escaped = False

              i = 0

              while i < len(s):

                  c = s[i]
                  n = s[i + 1] if i + 1 < len(s) else ""

                  if in_line:
                      if c == "\n":
                          in_line = False
                      i += 1
                      continue

                  if in_block:
                      if c == "*" and n == "/":
                          in_block = False
                          i += 2
                          continue
                      i += 1
                      continue

                  if in_string:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == '"':
                          in_string = False
                      i += 1
                      continue

                  if in_char:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == "'":
                          in_char = False
                      i += 1
                      continue

                  if c == "/" and n == "/":
                      in_line = True
                      i += 2
                      continue

                  if c == "/" and n == "*":
                      in_block = True
                      i += 2
                      continue

                  if c == '"':
                      in_string = True
                      i += 1
                      continue

                  if c == "'":
                      in_char = True
                      i += 1
                      continue

                  if c == "{":
                      depth += 1

                  elif c == "}":
                      depth -= 1

                      if depth < 0:
                          raise SystemExit(
                              f"Brace underflow: {path}"
                          )

                  i += 1

              if depth != 0:
                  raise SystemExit(
                      f"Unbalanced braces: {path}: {depth}"
                  )

          print("JAVA STRUCTURE OK")
          PY

      # ============================================================
      # GRADLE CLEAN
      # ============================================================

      - name: Gradle clean
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            clean \
            --no-daemon

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build Car Assistant V10.4 V4.2.1
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK OK"

          sha256sum "$APK"

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload V10.4 V4.2.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10.4-Femto-Launcher-V4.2.1-Control-Bar
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit V10.4 V4.2.1 source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add v10-source

          if git diff --cached --quiet; then

            echo "No source changes."

          else

            git commit \
              -m "Fix V10.4 V4.2.1 control bar"

            git push

          fi

      # ============================================================
      # COMPLETE
      # ============================================================

      - name: Complete
        shell: bash
        run: |
          echo
          echo "=============================================="
          echo " CAR ASSISTANT V10.4 V4.2.1 BUILD PASSED"
          echo "=============================================="
          echo
          echo "V10.3 CONTROL BAR: BACK / APPS / RECENTS / HOME"
          echo "V4 APP SELECTOR: APPLICATIONS"
          echo "V10 PROJECTION ENGINE: PRESERVED"
          echo "ANDROID 12: SUPPORTED"
          echo
