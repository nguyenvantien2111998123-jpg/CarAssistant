name: Build Car Assistant V10.4 - V4.2 Restore V10.3 Control Bar

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build V10.4 V4.2
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # ============================================================
      # VERIFY CURRENT V4 SOURCE
      # ============================================================

      - name: Verify current V4 source
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$SRC/V10CarActivity.java"
          test -f "$SRC/V10ProjectionSession.java"
          test -f "$SRC/V10InputController.java"
          test -f "$SRC/V10SessionStore.java"
          test -f "$SRC/V10ControlReceiver.java"
          test -f "$SRC/RootShellSession.java"
          test -f "$SRC/V10Display.java"

          echo "CURRENT V4 SOURCE OK"

      # ============================================================
      # PATCH ONLY THE CONTROL BAR
      #
      # Không thay projection engine.
      # Không thay app selector.
      # Không thay RootShell.
      # ============================================================

      - name: Restore V10.3 control bar
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          text = path.read_text()

          # ========================================================
          # GENERIC METHOD REPLACER
          #
          # Không phụ thuộc khoảng trắng / xuống dòng.
          # ========================================================

          def find_method(text, name):

              pattern = re.compile(
                  r'(?m)^[ \t]*'
                  r'(?:public|private|protected)'
                  r'\s+'
                  r'(?:static\s+)?'
                  r'(?:final\s+)?'
                  r'[\w<>\[\], ?]+'
                  r'\s+'
                  + re.escape(name)
                  + r'\s*\('
              )

              match = pattern.search(text)

              if not match:
                  raise SystemExit(
                      "Method not found: " + name
                  )

              start = match.start()

              brace = text.find(
                  "{",
                  match.end()
              )

              if brace < 0:
                  raise SystemExit(
                      "Opening brace not found: " + name
                  )

              depth = 0
              in_string = False
              in_char = False
              escape = False
              line_comment = False
              block_comment = False

              i = brace

              while i < len(text):

                  ch = text[i]

                  if line_comment:

                      if ch == "\n":
                          line_comment = False

                      i += 1
                      continue

                  if block_comment:

                      if (
                          ch == "*"
                          and i + 1 < len(text)
                          and text[i + 1] == "/"
                      ):
                          block_comment = False
                          i += 2
                          continue

                      i += 1
                      continue

                  if in_string:

                      if escape:
                          escape = False

                      elif ch == "\\":
                          escape = True

                      elif ch == '"':
                          in_string = False

                      i += 1
                      continue

                  if in_char:

                      if escape:
                          escape = False

                      elif ch == "\\":
                          escape = True

                      elif ch == "'":
                          in_char = False

                      i += 1
                      continue

                  if (
                      ch == "/"
                      and i + 1 < len(text)
                  ):

                      if text[i + 1] == "/":
                          line_comment = True
                          i += 2
                          continue

                      if text[i + 1] == "*":
                          block_comment = True
                          i += 2
                          continue

                  if ch == '"':
                      in_string = True
                      i += 1
                      continue

                  if ch == "'":
                      in_char = True
                      i += 1
                      continue

                  if ch == "{":
                      depth += 1

                  elif ch == "}":

                      depth -= 1

                      if depth == 0:
                          return start, i + 1

                  i += 1

              raise SystemExit(
                  "Could not find end of method: " + name
              )

          def replace_method(
              text,
              name,
              replacement
          ):

              start, end = find_method(
                  text,
                  name
              )

              return (
                  text[:start]
                  + replacement.rstrip()
                  + "\n"
                  + text[end:]
              )

          # ========================================================
          # 1. ADD CONTROL BAR FIELD
          # ========================================================

          if "private LinearLayout controlBar;" not in text:

              marker = (
                  "    private LinearLayout dock;"
              )

              if marker not in text:
                  raise SystemExit(
                      "dock field not found"
                  )

              text = text.replace(
                  marker,
                  marker
                  + "\n"
                  + "    private LinearLayout controlBar;",
                  1
              )

          # ========================================================
          # 2. PATCH buildUi()
          #
          # Control bar được add LAST.
          # Vì vậy nó luôn nằm trên TextureView.
          # ========================================================

          build_ui = r'''
          private void buildUi() {

              root =
                      new FrameLayout(this);

              root.setBackgroundColor(
                      Color.rgb(
                              7,
                              9,
                              12));

              projectionLayer =
                      new FrameLayout(this);

              projectionLayer.setVisibility(
                      View.GONE);

              root.addView(
                      projectionLayer,
                      new FrameLayout.LayoutParams(
                              -1,
                              -1));

              launcherLayer =
                      new LinearLayout(this);

              launcherLayer.setOrientation(
                      LinearLayout.VERTICAL);

              launcherLayer.setPadding(
                      dp(18),
                      dp(12),
                      dp(18),
                      dp(8));

              root.addView(
                      launcherLayer,
                      new FrameLayout.LayoutParams(
                              -1,
                              -1));

              buildDashboard();

              buildAppPanel();

              /*
               * V10.3 CONTROL BAR
               *
               * Add LAST => always above projection.
               */
              buildControlBar();

              setContentView(root);
          }
          '''

          text = replace_method(
              text,
              "buildUi",
              build_ui
          )

          # ========================================================
          # 3. INSERT EXACT V10.3-STYLE CONTROL BAR
          #
          # BACK / APPS / RECENTS / HOME
          # ========================================================

          if "private void buildControlBar()" not in text:

              marker = (
                  "    private void buildDashboard()"
              )

              if marker not in text:
                  raise SystemExit(
                      "buildDashboard marker not found"
                  )

              control_bar = r'''
          private void buildControlBar() {

              controlBar =
                      new LinearLayout(this);

              controlBar.setOrientation(
                      LinearLayout.HORIZONTAL);

              controlBar.setGravity(
                      Gravity.CENTER);

              controlBar.setPadding(
                      8,
                      4,
                      8,
                      4);

              controlBar.setBackgroundColor(
                      Color.rgb(
                              24,
                              24,
                              24));

              FrameLayout.LayoutParams
                      barParams =
                      new FrameLayout.LayoutParams(
                              FrameLayout.LayoutParams.MATCH_PARENT,
                              dp(58));

              barParams.gravity =
                      Gravity.BOTTOM;

              root.addView(
                      controlBar,
                      barParams);

              /*
               * EXACT V10.3 ORDER
               *
               * BACK
               * APPS
               * RECENTS
               * HOME
               */

              addControlButton(
                      "BACK",
                      v -> handleControlBack());

              addControlButton(
                      "APPS",
                      v -> handleControlApps());

              addControlButton(
                      "RECENTS",
                      v -> handleControlRecents());

              addControlButton(
                      "HOME",
                      v -> handleControlHome());
          }

          private void addControlButton(
                  String label,
                  View.OnClickListener listener) {

              TextView button =
                      buttonText(label);

              button.setTextSize(12);

              button.setOnClickListener(
                      listener);

              LinearLayout.LayoutParams
                      params =
                      new LinearLayout.LayoutParams(
                              0,
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              1f);

              params.setMargins(
                      4,
                      4,
                      4,
                      4);

              controlBar.addView(
                      button,
                      params);
          }

          '''

              text = text.replace(
                  marker,
                  control_bar + marker,
                  1
              )

          # ========================================================
          # 4. launchProjection()
          #
          # KHÔNG ẨN CONTROL BAR.
          # ========================================================

          launch_projection = r'''
          private void launchProjection(
                  ComponentName component) {

              if (component == null
                      || session == null) {

                  return;
              }

              if (activeTarget != null
                      && !activeTarget.equals(
                              component)) {

                  session.release();
              }

              activeTarget =
                      component;

              V10SessionStore
                      .setTarget(
                              this,
                              component);

              launcherLayer
                      .setVisibility(
                              View.GONE);

              appPanel
                      .setVisibility(
                              View.GONE);

              dashboard
                      .setVisibility(
                              View.GONE);

              projectionLayer
                      .setVisibility(
                              View.VISIBLE);

              /*
               * IMPORTANT:
               *
               * controlBar stays visible.
               *
               * This is the behavior proven by V10.3.
               */
              if (controlBar != null) {

                  controlBar.setVisibility(
                          View.VISIBLE);
              }

              session.setTarget(
                      component);
          }
          '''

          text = replace_method(
              text,
              "launchProjection",
              launch_projection
          )

          # ========================================================
          # 5. returnToLauncher()
          # ========================================================

          return_launcher = r'''
          private void returnToLauncher() {

              activeTarget = null;

              V10SessionStore
                      .clearTarget(
                              this);

              if (session != null) {
                  session.release();
              }

              projectionLayer
                      .setVisibility(
                              View.GONE);

              launcherLayer
                      .setVisibility(
                              View.VISIBLE);

              dashboard
                      .setVisibility(
                              View.VISIBLE);

              appPanel
                      .setVisibility(
                              View.GONE);

              if (controlBar != null) {

                  controlBar.setVisibility(
                          View.VISIBLE);
              }
          }
          '''

          text = replace_method(
              text,
              "returnToLauncher",
              return_launcher
          )

          # ========================================================
          # 6. showApps()
          #
          # APPS từ projection:
          # - projection ẩn
          # - Applications hiện
          # - control bar vẫn hiện
          # ========================================================

          show_apps = r'''
          private void showApps() {

              if (launcherLayer == null
                      || appPanel == null
                      || dashboard == null) {

                  return;
              }

              projectionLayer
                      .setVisibility(
                              View.GONE);

              launcherLayer
                      .setVisibility(
                              View.VISIBLE);

              dashboard
                      .setVisibility(
                              View.GONE);

              appPanel
                      .setVisibility(
                              View.VISIBLE);

              if (controlBar != null) {

                  controlBar.setVisibility(
                          View.VISIBLE);
              }

              loadApps();
          }
          '''

          text = replace_method(
              text,
              "showApps",
              show_apps
          )

          # ========================================================
          # 7. hideApps()
          # ========================================================

          hide_apps = r'''
          private void hideApps() {

              if (appPanel == null
                      || dashboard == null
                      || launcherLayer == null) {

                  return;
              }

              appPanel
                      .setVisibility(
                              View.GONE);

              dashboard
                      .setVisibility(
                              View.VISIBLE);

              launcherLayer
                      .setVisibility(
                              View.VISIBLE);

              projectionLayer
                      .setVisibility(
                              View.GONE);

              if (controlBar != null) {

                  controlBar.setVisibility(
                          View.VISIBLE);
              }
          }
          '''

          text = replace_method(
              text,
              "hideApps",
              hide_apps
          )

          # ========================================================
          # 8. CLEANUP
          # ========================================================

          if "controlBar = null;" not in text:

              marker = (
                  "        dock = null;"
              )

              if marker not in text:
                  raise SystemExit(
                      "dock cleanup marker not found"
                  )

              text = text.replace(
                  marker,
                  marker
                  + "\n"
                  + "        controlBar = null;",
                  1
              )

          path.write_text(text)

          print(
              "V10.4 V4.2 control bar patch completed."
          )
          PY

      # ============================================================
      # VERIFY CONTROL BAR
      # ============================================================

      - name: Verify V10.3 control bar
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -q \
            "private LinearLayout controlBar;" \
            "$FILE"

          grep -q \
            "private void buildControlBar()" \
            "$FILE"

          grep -q \
            "private void addControlButton(" \
            "$FILE"

          grep -q \
            '"BACK"' \
            "$FILE"

          grep -q \
            '"APPS"' \
            "$FILE"

          grep -q \
            '"RECENTS"' \
            "$FILE"

          grep -q \
            '"HOME"' \
            "$FILE"

          grep -q \
            "handleControlBack()" \
            "$FILE"

          grep -q \
            "handleControlApps()" \
            "$FILE"

          grep -q \
            "handleControlRecents()" \
            "$FILE"

          grep -q \
            "handleControlHome()" \
            "$FILE"

          echo "V10.3 CONTROL BAR VERIFIED"

      # ============================================================
      # VERIFY APP SELECTOR
      # ============================================================

      - name: Verify Android Auto app selector
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -q \
            "APPLICATIONS" \
            "$FILE"

          grep -q \
            "ACTION_MAIN" \
            "$FILE"

          grep -q \
            "CATEGORY_LAUNCHER" \
            "$FILE"

          grep -q \
            "rebuildAppGrid" \
            "$FILE"

          grep -q \
            "launchProjection" \
            "$FILE"

          echo "APP SELECTOR VERIFIED"

      # ============================================================
      # VERIFY PROJECTION ENGINE
      # ============================================================

      - name: Verify projection engine
        shell: bash
        run: |
          set -euo pipefail

          SESSION="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
          INPUT="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10InputController.java"
          ROOT="v10-source/app/src/main/java/com/hieptran/aacast/doudou/RootShellSession.java"

          grep -q \
            "createVirtualDisplay" \
            "$SESSION"

          grep -q \
            "setDefaultBufferSize" \
            "$SESSION"

          grep -q \
            "V10Display.nameFor" \
            "$SESSION"

          grep -q \
            "/system/bin/am start" \
            "$SESSION"

          grep -q \
            -- "--display" \
            "$SESSION"

          grep -q \
            -- "--windowingMode 1" \
            "$SESSION"

          grep -q \
            "input touchscreen" \
            "$INPUT"

          grep -q \
            "swipe" \
            "$INPUT"

          grep -q \
            'ProcessBuilder("su")' \
            "$ROOT"

          echo "PROJECTION ENGINE VERIFIED"

      # ============================================================
      # VERIFY DISPLAY
      # ============================================================

      - name: Verify V10 display identity
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10Display.java"

          grep -q \
            'com.carassistant.v10' \
            "$FILE"

          grep -q \
            'Car Assistant V10' \
            "$FILE"

          grep -q \
            'type != 5' \
            "$FILE"

          echo "DISPLAY IDENTITY VERIFIED"

      # ============================================================
      # VERIFY CONTROL RECEIVER
      # ============================================================

      - name: Verify control receiver
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ControlReceiver.java"

          test -f "$FILE"

          grep -q \
            'com.carassistant.v10.CONTROL' \
            "$FILE"

          grep -q \
            'handleControlBack' \
            "$FILE"

          grep -q \
            'handleControlHome' \
            "$FILE"

          grep -q \
            'handleControlApps' \
            "$FILE"

          echo "CONTROL RECEIVER VERIFIED"

      # ============================================================
      # VERIFY NO GEARHEAD CONTROL BAR
      # ============================================================

      - name: Verify no GearheadControlBar
        shell: bash
        run: |
          set -euo pipefail

          if grep -R \
            "GearheadControlBar" \
            v10-source/app/src/main/java \
            >/dev/null 2>&1; then

            echo "ERROR: GearheadControlBar remains."

            exit 1
          fi

          echo "NO GEARHEAD CONTROL BAR"

      # ============================================================
      # JAVA BRACE SANITY
      # ============================================================

      - name: Verify Java balance
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          text = path.read_text()

          depth = 0
          in_string = False
          in_char = False
          escape = False
          line_comment = False
          block_comment = False

          i = 0

          while i < len(text):

              ch = text[i]

              if line_comment:

                  if ch == "\n":
                      line_comment = False

                  i += 1
                  continue

              if block_comment:

                  if (
                      ch == "*"
                      and i + 1 < len(text)
                      and text[i + 1] == "/"
                  ):
                      block_comment = False
                      i += 2
                      continue

                  i += 1
                  continue

              if in_string:

                  if escape:
                      escape = False

                  elif ch == "\\":
                      escape = True

                  elif ch == '"':
                      in_string = False

                  i += 1
                  continue

              if in_char:

                  if escape:
                      escape = False

                  elif ch == "\\":
                      escape = True

                  elif ch == "'":
                      in_char = False

                  i += 1
                  continue

              if (
                  ch == "/"
                  and i + 1 < len(text)
              ):

                  if text[i + 1] == "/":
                      line_comment = True
                      i += 2
                      continue

                  if text[i + 1] == "*":
                      block_comment = True
                      i += 2
                      continue

              if ch == '"':
                  in_string = True

              elif ch == "'":
                  in_char = True

              elif ch == "{":
                  depth += 1

              elif ch == "}":
                  depth -= 1

                  if depth < 0:
                      raise SystemExit(
                          "Negative brace depth"
                      )

              i += 1

          if depth != 0:
              raise SystemExit(
                  f"Brace balance failed: {depth}"
              )

          print(
              "V10CarActivity brace balance OK"
          )
          PY

      # ============================================================
      # BUILD
      # ============================================================

      - name: Gradle clean
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            clean \
            --no-daemon

      - name: Build V10.4 V4.2
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo
          echo "========================================"
          echo " CAR ASSISTANT V10.4 V4.2"
          echo " BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh "$APK"

          echo
          echo "SHA256:"
          sha256sum "$APK"

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload V4.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10.4-Femto-Launcher-V4.2-Control-Bar
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit V4.2 source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

          if git diff --cached --quiet; then

            echo "No V4.2 source changes."

          else

            git commit \
              -m "Restore V10.3 control bar in V10.4"

            git push

          fi

      # ============================================================
      # COMPLETE
      # ============================================================

      - name: Complete
        shell: bash
        run: |
          echo
          echo "========================================"
          echo " V10.4 V4.2 COMPLETE"
          echo "========================================"
          echo
          echo "BACK     : RESTORED"
          echo "APPS     : RESTORED"
          echo "RECENTS  : RESTORED"
          echo "HOME     : RESTORED"
          echo "APP LIST : PRESERVED"
          echo "PROJECTION ENGINE : UNCHANGED"
          echo
