name: Build Car Assistant V10 Home V1 UI SAFE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rebuild exact locked Display Core V1 baseline
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --disable-pip-version-check -q pyyaml

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          wf = Path(
              ".github/workflows/"
              "build-v10-display-core-v1.yml"
          )

          doc = yaml.safe_load(
              wf.read_text(encoding="utf-8")
          )

          for step in doc["jobs"]["build"]["steps"]:
              if step.get("name") == "Build V10 Display Core V1":
                  break

              if "run" in step and not step.get("uses"):
                  print(
                      "CORE >",
                      step.get("name", "unnamed")
                  )

                  subprocess.run(
                      [
                          "bash",
                          "-euo",
                          "pipefail",
                          "-c",
                          step["run"],
                      ],
                      check=True,
                  )
          PY

      - name: Restore proven SAFE Floating Touch patch
        shell: bash
        run: |
          set -euo pipefail

          FIXED_COMMIT="f8abedfc4491205028f6d75456fe2fda80f232ff"

          git fetch origin "$FIXED_COMMIT" --depth=1

          git show \
            "$FIXED_COMMIT:.github/workflows/build-v10-display-core-v1-floating-touch-fixed.yml" \
            > /tmp/floating-touch-fixed.yml

          test -s /tmp/floating-touch-fixed.yml

          python3 /tmp/floating-touch-fixed.yml <<'PY'
          PY

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          path = Path(
              "/tmp/floating-touch-fixed.yml"
          )

          doc = yaml.safe_load(
              path.read_text(encoding="utf-8")
          )

          step = next(
              (
                  x
                  for x in doc["jobs"]["build"]["steps"]
                  if x.get("name")
                  == "Patch V10CarActivity with Floating Touch only"
              ),
              None,
          )

          if step is None:
              raise SystemExit(
                  "Historical Floating Touch patch step not found"
              )

          subprocess.run(
              [
                  "bash",
                  "-euo",
                  "pipefail",
                  "-c",
                  step["run"],
              ],
              check=True,
          )
          PY

      - name: Apply SAFE long-press Floating Touch
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          s = s.replace(
              r"\n    private void createFloatingTouchKey()",
              "    private void createFloatingTouchKey()",
              1,
          )

          if "private TextView floatingTouchKey;" not in s:
              raise SystemExit(
                  "Floating Touch field missing"
              )

          start = s.find(
              "floatingTouchKey.setOnTouchListener("
          )

          if start < 0:
              raise SystemExit(
                  "Floating Touch listener missing"
              )

          paren = s.find("(", start)

          depth = 0
          quote = False
          escape = False
          line = False
          block = False
          close = -1

          i = paren

          while i < len(s):
              c = s[i]
              n = (
                  s[i + 1]
                  if i + 1 < len(s)
                  else ""
              )

              if line:
                  if c == "\n":
                      line = False

              elif block:
                  if c == "*" and n == "/":
                      block = False
                      i += 1

              elif quote:
                  if escape:
                      escape = False
                  elif c == "\\":
                      escape = True
                  elif c == '"':
                      quote = False

              else:
                  if c == "/" and n == "/":
                      line = True
                      i += 1

                  elif c == "/" and n == "*":
                      block = True
                      i += 1

                  elif c == '"':
                      quote = True

                  elif c == "(":
                      depth += 1

                  elif c == ")":
                      depth -= 1

                      if depth == 0:
                          close = i
                          break

              i += 1

          if close < 0:
              raise SystemExit(
                  "Floating Touch listener end not found"
              )

          listener = '''floatingTouchKey.setOnTouchListener(
                  (view, event) -> {
                      switch (event.getActionMasked()) {
                          case MotionEvent.ACTION_DOWN:
                              floatingDragging = false;
                              floatingDownRawX = event.getRawX();
                              floatingDownRawY = event.getRawY();
                              floatingDownTime =
                                      SystemClock.uptimeMillis();

                              ViewGroup.LayoutParams lp =
                                      view.getLayoutParams();

                              if (lp instanceof FrameLayout.LayoutParams) {
                                  FrameLayout.LayoutParams fp =
                                          (FrameLayout.LayoutParams) lp;

                                  floatingStartX =
                                          fp.rightMargin;

                                  floatingStartY =
                                          fp.topMargin;
                              }

                              return true;

                          case MotionEvent.ACTION_MOVE:
                              float dx =
                                      event.getRawX()
                                      - floatingDownRawX;

                              float dy =
                                      event.getRawY()
                                      - floatingDownRawY;

                              if (!floatingDragging
                                      && Math.hypot(dx, dy)
                                      > ViewConfiguration
                                          .get(this)
                                          .getScaledTouchSlop()) {

                                  floatingDragging = true;
                              }

                              if (floatingDragging) {
                                  int width =
                                          projectionLayer.getWidth();

                                  int height =
                                          projectionLayer.getHeight();

                                  int keySize = dp(58);

                                  int right =
                                          Math.round(
                                              floatingStartX - dx);

                                  int top =
                                          Math.round(
                                              floatingStartY + dy);

                                  right =
                                      Math.max(
                                          0,
                                          Math.min(
                                              Math.max(
                                                  0,
                                                  width - keySize
                                              ),
                                              right
                                          )
                                      );

                                  top =
                                      Math.max(
                                          0,
                                          Math.min(
                                              Math.max(
                                                  0,
                                                  height - keySize
                                              ),
                                              top
                                          )
                                      );

                                  FrameLayout.LayoutParams fp =
                                          (FrameLayout.LayoutParams)
                                                  view.getLayoutParams();

                                  fp.rightMargin = right;
                                  fp.topMargin = top;

                                  view.setLayoutParams(fp);
                              }

                              return true;

                          case MotionEvent.ACTION_UP:
                              if (floatingDragging) {
                                  FrameLayout.LayoutParams fp =
                                          (FrameLayout.LayoutParams)
                                                  view.getLayoutParams();

                                  prefs.edit()
                                          .putInt(
                                              "x",
                                              fp.rightMargin
                                          )
                                          .putInt(
                                              "y",
                                              fp.topMargin
                                          )
                                          .apply();

                                  floatingDragging = false;

                                  return true;
                              }

                              long held =
                                      SystemClock.uptimeMillis()
                                      - floatingDownTime;

                              if (
                                  held
                                  >= ViewConfiguration
                                      .getLongPressTimeout()
                              ) {
                                  handleControlHome();
                                  hideFloatingMenu();
                              } else {
                                  showFloatingMenu();
                              }

                              view.performClick();

                              return true;

                          case MotionEvent.ACTION_CANCEL:
                              floatingDragging = false;
                              return true;

                          default:
                              return true;
                      }
                  });'''

          s = (
              s[:start]
              + listener
              + s[close + 1:]
          )

          s = s.replace(
              "private long floatingLastTap;",
              "private long floatingDownTime;",
              1,
          )

          menu_start = s.find(
              "private void showFloatingMenu()"
          )

          if menu_start < 0:
              raise SystemExit(
                  "showFloatingMenu() missing"
              )

          brace = s.find("{", menu_start)

          depth = 0
          quote = False
          escape = False
          line = False
          block = False
          end = -1

          i = brace

          while i < len(s):
              c = s[i]
              n = (
                  s[i + 1]
                  if i + 1 < len(s)
                  else ""
              )

              if line:
                  if c == "\n":
                      line = False

              elif block:
                  if c == "*" and n == "/":
                      block = False
                      i += 1

              elif quote:
                  if escape:
                      escape = False
                  elif c == "\\":
                      escape = True
                  elif c == '"':
                      quote = False

              else:
                  if c == "/" and n == "/":
                      line = True
                      i += 1

                  elif c == "/" and n == "*":
                      block = True
                      i += 1

                  elif c == '"':
                      quote = True

                  elif c == "{":
                      depth += 1

                  elif c == "}":
                      depth -= 1

                      if depth == 0:
                          end = i
                          break

              i += 1

          if end < 0:
              raise SystemExit(
                  "showFloatingMenu() end not found"
              )

          menu = '''private void showFloatingMenu() {
          if (floatingMenu != null) {
              hideFloatingMenu();
              return;
          }

          floatingMenu = new LinearLayout(this);
          floatingMenu.setOrientation(
                  LinearLayout.VERTICAL
          );

          floatingMenu.setPadding(
                  dp(8),
                  dp(8),
                  dp(8),
                  dp(8)
          );

          GradientDrawable bg =
                  new GradientDrawable();

          bg.setColor(
                  Color.rgb(
                          15,
                          20,
                          26
                  )
          );

          bg.setCornerRadius(dp(16));

          bg.setStroke(
                  dp(1),
                  Color.rgb(
                          65,
                          85,
                          105
                  )
          );

          floatingMenu.setBackground(bg);
          floatingMenu.setElevation(dp(14));

          addFloatingMenuButton(
                  "BACK",
                  () -> {
                      handleControlBack();
                      hideFloatingMenu();
                  }
          );

          addFloatingMenuButton(
                  "HOME",
                  () -> {
                      handleControlHome();
                      hideFloatingMenu();
                  }
          );

          FrameLayout.LayoutParams params =
                  new FrameLayout.LayoutParams(
                          dp(170),
                          -2,
                          Gravity.TOP | Gravity.END
                  );

          params.setMargins(
                  0,
                  dp(70),
                  dp(18),
                  0
          );

          projectionLayer.addView(
                  floatingMenu,
                  params
          );

          floatingMenu.bringToFront();
          floatingTouchKey.bringToFront();
      }'''

          s = (
              s[:menu_start]
              + menu
              + s[end + 1:]
          )

          s = s.replace(
              "    private long floatingLastTap;\n",
              "",
          )

          p.write_text(
              s,
              encoding="utf-8"
          )
          PY

