name: Build Car Assistant V10 Home V1 UI SAFE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rebuild exact locked Display Core V1 Floating Touch Long Press baseline
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --disable-pip-version-check -q pyyaml

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          wf = Path(
              ".github/workflows/"
              "build-v10-display-core-v1-floating-touch-longpress-safe.yml"
          )

          if not wf.is_file():
              raise SystemExit(
                  "Locked baseline workflow not found"
              )

          doc = yaml.safe_load(
              wf.read_text(encoding="utf-8")
          )

          steps = doc["jobs"]["build"]["steps"]

          selected = []

          for step in steps:
              if (
                  "run" in step
                  and not step.get("uses")
              ):
                  selected.append(step)

              if step.get("name") == "Compile Java":
                  break

          if not selected:
              raise SystemExit(
                  "Locked baseline run steps not found"
              )

          for step in selected:
              name = step.get(
                  "name",
                  "unnamed"
              )

              print(
                  f"BASELINE > {name}"
              )

              subprocess.run(
                  [
                      "bash",
                      "-euo",
                      "pipefail",
                      "-c",
                      step["run"],
                  ],
                  check=True,
              )
          PY

      - name: Verify locked baseline before Home patch
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          ACTIVITY="$SRC/V10CarActivity.java"
          SESSION="$SRC/V10ProjectionSession.java"
          DISPLAY="$SRC/V10DisplayController.java"
          TASK="$SRC/V10TaskSession.java"
          SURFACE="$SRC/V10SurfaceManager.java"

          for f in \
            "$ACTIVITY" \
            "$SESSION" \
            "$DISPLAY" \
            "$TASK" \
            "$SURFACE"
          do
            test -f "$f"
          done

          grep -Fq \
            "private void buildDashboard()" \
            "$ACTIVITY"

          grep -Fq \
            "private TextView floatingTouchKey;" \
            "$ACTIVITY"

          grep -Fq \
            "createFloatingTouchKey();" \
            "$ACTIVITY"

          grep -Fq \
            "ViewConfiguration.getLongPressTimeout()" \
            "$ACTIVITY"

          grep -Fq \
            "floatingDownTime = SystemClock.uptimeMillis();" \
            "$ACTIVITY"

          grep -Fq \
            "class V10TaskSession" \
            "$TASK"

          grep -Fq \
            "class V10SurfaceManager" \
            "$SURFACE"

          grep -Fq \
            "createVirtualDisplay" \
            "$DISPLAY"

          grep -Fq \
            "--activity-reorder-to-front" \
            "$DISPLAY"

          if grep -Fq \
            "V10ProjectionService" \
            "$SESSION"
          then
            echo \
              "ERROR: V10ProjectionService found"
            exit 1
          fi

          if grep -Fq \
            "am force-stop" \
            "$SESSION"
          then
            echo \
              "ERROR: force-stop found"
            exit 1
          fi

          if grep -Fq \
            "am force-stop" \
            "$DISPLAY"
          then
            echo \
              "ERROR: force-stop found"
            exit 1
          fi

          echo \
            "Locked baseline verification PASSED."

      - name: Patch Home V1 visual UI only
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          start = s.find(
              "private void buildDashboard()"
          )

          if start < 0:
              raise SystemExit(
                  "buildDashboard() not found"
              )

          brace = s.find("{", start)

          if brace < 0:
              raise SystemExit(
                  "buildDashboard() opening brace not found"
              )

          depth = 0
          quote = False
          escape = False
          line_comment = False
          block_comment = False
          end = -1

          i = brace

          while i < len(s):
              c = s[i]
              n = (
                  s[i + 1]
                  if i + 1 < len(s)
                  else ""
              )

              if line_comment:
                  if c == "\n":
                      line_comment = False

              elif block_comment:
                  if c == "*" and n == "/":
                      block_comment = False
                      i += 1

              elif quote:
                  if escape:
                      escape = False
                  elif c == "\\":
                      escape = True
                  elif c == '"':
                      quote = False

              else:
                  if c == "/" and n == "/":
                      line_comment = True
                      i += 1

                  elif c == "/" and n == "*":
                      block_comment = True
                      i += 1

                  elif c == '"':
                      quote = True

                  elif c == "{":
                      depth += 1

                  elif c == "}":
                      depth -= 1

                      if depth == 0:
                          end = i
                          break

              i += 1

          if end < 0:
              raise SystemExit(
                  "buildDashboard() closing brace not found"
              )

