      - name: Verify Home V1 SAFE architecture
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          ACTIVITY="$SRC/V10CarActivity.java"
          SESSION="$SRC/V10ProjectionSession.java"
          DISPLAY="$SRC/V10DisplayController.java"
          TASK="$SRC/V10TaskSession.java"
          SURFACE="$SRC/V10SurfaceManager.java"

          test -f "$ACTIVITY"
          test -f "$SESSION"
          test -f "$DISPLAY"
          test -f "$TASK"
          test -f "$SURFACE"

          grep -Fq \
            "private void buildDashboard()" \
            "$ACTIVITY"

          grep -Fq \
            "private void addHomeSideButton(" \
            "$ACTIVITY"

          grep -Fq \
            'TextView logo =' \
            "$ACTIVITY"

          grep -Fq \
            '"CA"' \
            "$ACTIVITY"

          grep -Fq \
            '"▦\\nAPPS"' \
            "$ACTIVITY"

          grep -Fq \
            'appsButton.setOnClickListener(' \
            "$ACTIVITY"

          grep -Fq \
            'v -> showApps()' \
            "$ACTIVITY"

          grep -Fq \
            '"◉\\nVOICE"' \
            "$ACTIVITY"

          grep -Fq \
            '"▤\\nTASKS"' \
            "$ACTIVITY"

          grep -Fq \
            'GIAO THÔNG' \
            "$ACTIVITY"

          grep -Fq \
            'Waze • cảnh báo' \
            "$ACTIVITY"

          grep -Fq \
            'YouTube / Zing / YouTube Music' \
            "$ACTIVITY"

          grep -Fq \
            'createVirtualDisplay' \
            "$DISPLAY"

          grep -Fq \
            '--activity-reorder-to-front' \
            "$DISPLAY"

          grep -Fq \
            'class V10TaskSession' \
            "$TASK"

          grep -Fq \
            'class V10SurfaceManager' \
            "$SURFACE"

          grep -Fq \
            'private TextView floatingTouchKey;' \
            "$ACTIVITY"

          grep -Fq \
            'floatingDownTime = SystemClock.uptimeMillis();' \
            "$ACTIVITY"

          grep -Fq \
            'ViewConfiguration.getLongPressTimeout()' \
            "$ACTIVITY"

          if grep -Fq \
            'startActivity(' \
            "$ACTIVITY"
          then
            echo \
              "ERROR: direct startActivity() found in V10CarActivity"
            exit 1
          fi

          if grep -Fq \
            'V10ProjectionService' \
            "$SESSION"
          then
            echo \
              "ERROR: V10ProjectionService found"
            exit 1
          fi

          if grep -Fq \
            'am force-stop' \
            "$SESSION"
          then
            echo \
              "ERROR: force-stop found in session"
            exit 1
          fi

          if grep -Fq \
            'am force-stop' \
            "$DISPLAY"
          then
            echo \
              "ERROR: force-stop found in display controller"
            exit 1
          fi

          if grep -Fq \
            'floatingLastTap' \
            "$ACTIVITY"
          then
            echo \
              "ERROR: legacy floatingLastTap found"
            exit 1
          fi

          python3 - "$ACTIVITY" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(
              encoding="utf-8"
          )

          method = re.search(
              r"public void onStop\(\)\s*\{(.*?)\n\s*\}",
              source,
              re.S
          )

          if not method:
              raise SystemExit(
                  "onStop() not found"
              )

          if "session.release()" in method.group(1):
              raise SystemExit(
                  "ERROR: session.release() remains in onStop()"
              )

          print(
              "onStop() persistence verification PASSED."
          )
          PY

          python3 - "$ACTIVITY" <<'PY'
          from pathlib import Path
          import sys

          source = Path(
              sys.argv[1]
          ).read_text(
              encoding="utf-8"
          )

          if source.count(
              "private void buildDashboard()"
          ) != 1:
              raise SystemExit(
                  "ERROR: buildDashboard() count is not exactly 1"
              )

          if source.count(
              "private void addHomeSideButton("
          ) != 1:
              raise SystemExit(
                  "ERROR: addHomeSideButton() count is not exactly 1"
              )

          print(
              "Java Home method structure verification PASSED."
          )
          PY

          echo \
            "HOME V1 SAFE architecture verification PASSED."

      - name: Compile Java
        working-directory: v10-source
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            compileDebugJavaWithJavac

      - name: Build APK
        working-directory: v10-source
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Locate APK and SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find \
              v10-source/app/build/outputs/apk/debug \
              -type f \
              -name '*.apk' \
              -print \
              -quit
          )"

          test -n "$APK"

          echo \
            "APK=$APK"

          sha256sum "$APK"

      - name: Upload Home V1 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Home-V1-UI-SAFE
          path: |
            v10-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
