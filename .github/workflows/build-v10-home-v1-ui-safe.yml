          PY

      - name: Verify Home 1 SAFE architecture
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          ACTIVITY="$SRC/V10CarActivity.java"
          SESSION="$SRC/V10ProjectionSession.java"
          DISPLAY="$SRC/V10DisplayController.java"
          TASK="$SRC/V10TaskSession.java"
          SURFACE="$SRC/V10SurfaceManager.java"

          for f in \
            "$ACTIVITY" \
            "$SESSION" \
            "$DISPLAY" \
            "$TASK" \
            "$SURFACE"
          do
            test -f "$f"
          done

          grep -Fq \
            "private void buildDashboard()" \
            "$ACTIVITY"

          grep -Fq \
            'appsButton.setOnClickListener(' \
            "$ACTIVITY"

          grep -Fq \
            'v -> showApps()' \
            "$ACTIVITY"

          grep -Fq \
            'TextView logo = text(' \
            "$ACTIVITY"

          grep -Fq \
            'GIAO THÔNG' \
            "$ACTIVITY"

          grep -Fq \
            'YouTube / Zing / YouTube Music' \
            "$ACTIVITY"

          grep -Fq \
            'createVirtualDisplay' \
            "$DISPLAY"

          grep -Fq \
            -- '--activity-reorder-to-front' \
            "$DISPLAY"

          grep -Fq \
            'State.HIDDEN' \
            "$SESSION"

          grep -Fq \
            'class V10TaskSession' \
            "$TASK"

          grep -Fq \
            'class V10SurfaceManager' \
            "$SURFACE"

          grep -Fq \
            'floatingTouchKey' \
            "$ACTIVITY"

          grep -Fq \
            'ViewConfiguration.getLongPressTimeout()' \
            "$ACTIVITY"

          if grep -Fq \
            'startActivity(' \
            "$ACTIVITY"
          then
            echo \
              "ERROR: Home 1 added direct startActivity()"
            exit 1
          fi

          if grep -Fq \
            'V10ProjectionService' \
            "$SESSION"
          then
            echo \
              "ERROR: V10ProjectionService leaked"
            exit 1
          fi

          if grep -Fq \
            'am force-stop' \
            "$SESSION"
          then
            echo \
              "ERROR: force-stop leaked"
            exit 1
          fi

          if grep -Fq \
            'am force-stop' \
            "$DISPLAY"
          then
            echo \
              "ERROR: force-stop leaked"
            exit 1
          fi

          if grep -Fq \
            'floatingLastTap' \
            "$ACTIVITY"
          then
            echo \
              "ERROR: old double-tap code remains"
            exit 1
          fi

          python3 - "$ACTIVITY" <<'PY'
          from pathlib import Path
          import re
          import sys

          s = Path(
              sys.argv[1]
          ).read_text(
              encoding="utf-8"
          )

          m = re.search(
              r"public void onStop\(\)\s*\{(.*?)\n\s*\}",
              s,
              re.S,
          )

          if not m:
              raise SystemExit(
                  "onStop() not found"
              )

          if "session.release()" in m.group(1):
              raise SystemExit(
                  "ERROR: session.release() "
                  "remains in onStop()"
              )

          print(
              "onStop() persistence check PASSED"
          )
          PY

          echo \
            "Home 1 SAFE architecture verification PASSED."

      - name: Compile Java
        working-directory: v10-source
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            compileDebugJavaWithJavac

      - name: Build APK
        working-directory: v10-source
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Locate APK and SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find \
              v10-source/app/build/outputs/apk/debug \
              -type f \
              -name '*.apk' \
              -print \
              -quit
          )"

          test -n "$APK"

          echo "APK=$APK"

          sha256sum "$APK"

      - name: Upload Home 1 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Home-V1-UI-SAFE
          path: |
            v10-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
