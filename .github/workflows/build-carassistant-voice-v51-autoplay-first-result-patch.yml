name: Tro ly CarAssistant V5.2 YouTube AutoPlay

on:
 workflow_dispatch:

permissions:
 contents: read

jobs:
 build:
  runs-on: ubuntu-latest
  timeout-minutes: 30

  steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Verify immutable source workflows
    shell: bash
    run: |
      set -euo pipefail

      python3 - <<'PY'
      from pathlib import Path
      import hashlib

      expected = {
          ".github/workflows/build-carassistant-voice-standalone-v5.yml":
              "c75feb842cf9cf03c75f4d33d3014abeb4f2672d",
          ".github/workflows/build-carassistant-voice-standalone-v5-app-picker-patch.yml":
              "9028dfa690a8c31e89a50ce342c3cee7e6c50be3",
      }

      for name, wanted in expected.items():
          path = Path(name)
          if not path.is_file():
              raise SystemExit(f"FAIL: missing source {name}")

          data = path.read_bytes()
          actual = hashlib.sha1(
              b"blob " + str(len(data)).encode() + b"\0" + data
          ).hexdigest()

          if actual != wanted:
              raise SystemExit(
                  f"FAIL: source changed: {name}; "
                  f"expected {wanted}, got {actual}"
              )

          print(f"PASS: immutable source verified: {name}")
      PY

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.13'

  - name: Rebuild isolated V5 plus app picker
    shell: bash
    run: |
      set -euo pipefail
      python3 -m pip install --quiet pyyaml

      python3 - <<'PY'
      from pathlib import Path
      import yaml

      v5_path = Path(
          ".github/workflows/build-carassistant-voice-standalone-v5.yml"
      )
      picker_path = Path(
          ".github/workflows/build-carassistant-voice-standalone-v5-app-picker-patch.yml"
      )

      v5 = yaml.safe_load(v5_path.read_text(encoding="utf-8"))
      picker = yaml.safe_load(picker_path.read_text(encoding="utf-8"))

      def extract(data, step_name, source):
          steps = data.get("jobs", {}).get("build", {}).get("steps", [])
          matches = [
              step for step in steps
              if step.get("name") == step_name
          ]

          if len(matches) != 1:
              raise SystemExit(
                  f"FAIL: {source}: expected exactly one "
                  f"{step_name}; found {len(matches)}"
              )

          script = matches[0].get("run", "")
          if not script.strip():
              raise SystemExit(f"FAIL: empty script: {step_name}")

          return script.rstrip() + "\n"

      generator = extract(
          v5, "Generate isolated V5 project", str(v5_path)
      )
      picker_script = extract(
          picker,
          "Apply isolated installed-app picker patch",
          str(picker_path),
      )

      Path("/tmp/v52-generate-source.sh").write_text(
          generator, encoding="utf-8"
      )
      Path("/tmp/v52-picker-source.sh").write_text(
          picker_script, encoding="utf-8"
      )

      print("PASS: extracted original V5 generator")
      print("PASS: extracted existing app picker patch")
      PY

      bash -n /tmp/v52-generate-source.sh
      bash -n /tmp/v52-picker-source.sh

      bash /tmp/v52-generate-source.sh
      bash /tmp/v52-picker-source.sh

      test -s carassistant-voice/app/src/main/java/com/carassistant/voice/MainActivity.java
      test -s carassistant-voice/app/src/main/java/com/carassistant/voice/FloatingMicService.java
      test -s carassistant-voice/app/build.gradle
      test -s carassistant-voice/app/src/main/AndroidManifest.xml

      echo "PASS: isolated V5 project and picker generated"

  - name: Apply YouTube and YouTube Music resolver patch
    shell: bash
    run: |
      set -euo pipefail

      python3 - <<'PY'
      from pathlib import Path
      import re
      import xml.etree.ElementTree as ET

      root = Path("carassistant-voice")
      main = root / "app/src/main/java/com/carassistant/voice/MainActivity.java"
      manifest = root / "app/src/main/AndroidManifest.xml"

      java = main.read_text(encoding="utf-8")

      imports = [
          "import java.io.BufferedReader;",
          "import java.io.InputStreamReader;",
          "import java.net.HttpURLConnection;",
          "import java.net.URL;",
          "import java.nio.charset.StandardCharsets;",
          "import java.util.regex.Matcher;",
          "import java.util.regex.Pattern;",
      ]

      anchor = "import java.util.ArrayList;"
      if anchor not in java:
          raise SystemExit("FAIL: Java import anchor missing")

      missing = [item for item in imports if item not in java]
      if missing:
          java = java.replace(
              anchor, anchor + "\n" + "\n".join(missing), 1
          )

      methods = r'''
          private String fetchYouTubeSearchPage(String address) {
              HttpURLConnection connection = null;

              try {
                  connection =
                          (HttpURLConnection) new URL(address).openConnection();

                  connection.setRequestMethod("GET");
                  connection.setConnectTimeout(8000);
                  connection.setReadTimeout(8000);
                  connection.setInstanceFollowRedirects(true);
                  connection.setRequestProperty(
                          "User-Agent",
                          "Mozilla/5.0 (Linux; Android 12) "
                          + "AppleWebKit/537.36 "
                          + "(KHTML, like Gecko) Chrome/126.0 Mobile Safari/537.36");
                  connection.setRequestProperty(
                          "Accept-Language", "vi-VN,vi;q=0.9,en;q=0.7");

                  int code = connection.getResponseCode();
                  if (code < 200 || code >= 300) {
                      return null;
                  }

                  StringBuilder body = new StringBuilder();

                  try (BufferedReader reader = new BufferedReader(
                          new InputStreamReader(
                                  connection.getInputStream(),
                                  StandardCharsets.UTF_8))) {
                      String line;
                      int total = 0;

                      while ((line = reader.readLine()) != null
                              && total < 2000000) {
                          body.append(line).append('\n');
                          total += line.length();
                      }
                  }

                  return body.toString();

              } catch (Exception e) {
                  return null;
              } finally {
                  if (connection != null) {
                      connection.disconnect();
                  }
              }
          }

          private String firstYouTubeMatch(
                  String data, String expression) {
              if (data == null || data.isEmpty()) {
                  return null;
              }

              Matcher matcher = Pattern.compile(
                      expression,
                      Pattern.CASE_INSENSITIVE | Pattern.DOTALL)
                      .matcher(data);

              return matcher.find() ? matcher.group(1) : null;
          }

          private String resolveYouTubeFirstResult(
                  String target, String query) {
              String encoded = Uri.encode(query);
              String pageUrl;
              String html;

              if ("youtube".equals(target)) {
                  pageUrl =
                          "https://www.youtube.com/results?search_query="
                          + encoded;
              } else if ("ytmusic".equals(target)) {
                  pageUrl =
                          "https://music.youtube.com/search?q=" + encoded;
              } else {
                  return null;
              }

              html = fetchYouTubeSearchPage(pageUrl);
              if (html == null || html.isEmpty()) {
                  return null;
              }

              String videoId = null;

              if ("youtube".equals(target)) {
                  videoId = firstYouTubeMatch(
                          html,
                          "\\x22videoRenderer\\x22\\s*:\\s*\\{.{0,20000}?"
                          + "\\x22videoId\\x22\\s*:\\s*"
                          + "\\x22([A-Za-z0-9_-]{11})\\x22");

                  if (videoId == null) {
                      videoId = firstYouTubeMatch(
                              html,
                              "\\x22videoId\\x22\\s*:\\s*"
                              + "\\x22([A-Za-z0-9_-]{11})\\x22");
                  }

                  return videoId == null
                          ? null
                          : "https://www.youtube.com/watch?v="
                              + videoId + "&autoplay=1";
              }

              videoId = firstYouTubeMatch(
                      html,
                      "\\x22musicResponsiveListItemRenderer\\x22"
                      + ".{0,30000}?\\x22videoId\\x22\\s*:\\s*"
                      + "\\x22([A-Za-z0-9_-]{11})\\x22");

              if (videoId == null) {
                  videoId = firstYouTubeMatch(
                          html,
                          "\\x22playlistItemData\\x22.{0,3000}?"
                          + "\\x22videoId\\x22\\s*:\\s*"
                          + "\\x22([A-Za-z0-9_-]{11})\\x22");
              }

              if (videoId == null) {
                  videoId = firstYouTubeMatch(
                          html,
                          "\\x22videoId\\x22\\s*:\\s*"
                          + "\\x22([A-Za-z0-9_-]{11})\\x22");
              }

              return videoId == null
                      ? null
                      : "https://music.youtube.com/watch?v="
                          + videoId + "&autoplay=1";
          }

          private void resolveAndOpenYouTubeFirstResult(
                  String target, String query) {
              action.setText(
                      "Đang tìm kết quả đầu tiên trên "
                      + ("ytmusic".equals(target)
                          ? "YouTube Music…" : "YouTube…"));

              new Thread(() -> {
                  String resolved =
                          resolveYouTubeFirstResult(target, query);

                  runOnUiThread(() -> {
                      if (resolved == null || resolved.trim().isEmpty()) {
                          action.setText(
                                  "Không lấy được ID kết quả đầu tiên. "
                                  + "Không mở trang tìm kiếm thay thế. "
                                  + "Hãy kiểm tra mạng hoặc thử câu lệnh khác.");
                          return;
                      }

                      try {
                          openTarget(target, resolved);
                          action.setText(
                                  "Đã gửi liên kết nội dung cụ thể đến "
                                  + ("ytmusic".equals(target)
                                      ? "YouTube Music." : "YouTube.")
                                  + " Nếu ứng dụng không tự phát, "
                                  + "kiểm tra phiên bản ứng dụng và trạng thái đăng nhập.");
                      } catch (RuntimeException e) {
                          action.setText(
                                  "Không mở được nội dung trong ứng dụng đã chọn: "
                                  + e.getClass().getSimpleName());
                      }
                  });
              }, "voice-youtube-first-result").start();
          }
      '''

      marker = "private void parseCommand(String spoken) {"
      if java.count(marker) != 1:
          raise SystemExit(
              "FAIL: expected exactly one parseCommand method"
          )

      if (
          "resolveAndOpenYouTubeFirstResult(String target, String query)"
          not in java
      ):
          java = java.replace(
              marker,
              methods + "\n              " + marker,
              1,
          )

      old_tail = r'''String url = searchUrl(target, query);
          action.setText("Đích: " + target + "\nNội dung: " + query
                  + "\nĐang gửi yêu cầu mở tìm kiếm. "
                  + "Ứng dụng có thể hiển thị kết quả thay vì tự phát.");
          openTarget(target, url);'''

      if old_tail not in java:
          raise SystemExit(
              "FAIL: exact V5 parseCommand search block not found"
          )

      new_tail = r'''if ("youtube".equals(target)
                  || "ytmusic".equals(target)) {
              resolveAndOpenYouTubeFirstResult(target, query);
          } else {
              String url = searchUrl(target, query);
              action.setText("Đích: " + target + "\nNội dung: " + query);
              openTarget(target, url);
          }'''

      java = java.replace(old_tail, new_tail, 1)
      main.write_text(java, encoding="utf-8")

      xml = manifest.read_text(encoding="utf-8")
      if "android.permission.INTERNET" not in xml:
          xml, count = re.subn(
              r"(<manifest[^>]*>)",
              r'\1\n    <uses-permission android:name="android.permission.INTERNET" />',
              xml,
              count=1,
          )
          if count != 1:
              raise SystemExit("FAIL: could not add INTERNET permission")

      manifest.write_text(xml, encoding="utf-8")
      ET.parse(manifest)

      print("PASS: YouTube first-result resolver inserted")
      print("PASS: YouTube Music first-result resolver inserted")
      print("PASS: Zing and Spotify command path preserved")
      print("PASS: INTERNET permission and manifest XML")
      PY

  - name: Validate patch and preserved voice features
    shell: bash
    run: |
      set -euo pipefail

      python3 - <<'PY'
      from pathlib import Path
      import xml.etree.ElementTree as ET

      root = Path("carassistant-voice")
      main = root / "app/src/main/java/com/carassistant/voice/MainActivity.java"
      service = root / "app/src/main/java/com/carassistant/voice/FloatingMicService.java"
      manifest = root / "app/src/main/AndroidManifest.xml"
      gradle = root / "app/build.gradle"

      java = main.read_text(encoding="utf-8")
      overlay = service.read_text(encoding="utf-8")
      xml = manifest.read_text(encoding="utf-8")
      build = gradle.read_text(encoding="utf-8")

      ET.parse(manifest)

      checks = {
          "V5 version unchanged":
              "versionCode 5" in build
              and "versionName '0.5.0'" in build,
          "YouTube package choices":
              '"com.google.android.youtube"' in java
              and '"app.revanced.android.youtube"' in java,
          "YouTube Music package choices":
              '"com.google.android.apps.youtube.music"' in java
              and '"com.google.android.apps.youtube.music.morphe"' in java,
          "Zing package retained": '"com.zing.mp3"' in java,
          "Spotify package retained": '"com.spotify.music"' in java,
          "Vietnamese speech recognition": '"vi-VN"' in java,
          "Partial speech results": "onPartialResults" in java,
          "Four-second silence": "SILENCE_MS = 4000L" in java,
          "End beep": "TONE_PROP_ACK" in java,
          "Auto-hide": "HIDE_MS = 2500L" in java,
          "Floating mic": "TYPE_APPLICATION_OVERLAY" in overlay,
          "YouTube watch URL": "www.youtube.com/watch?v=" in java,
          "YouTube Music watch URL": "music.youtube.com/watch?v=" in java,
          "Autoplay requested": '"&autoplay=1"' in java,
          "No search fallback in resolver":
              "Không mở trang tìm kiếm thay thế" in java,
          "Internet permission":
              'android:name="android.permission.INTERNET"' in xml,
      }

      for label, passed in checks.items():
          print(("PASS" if passed else "FAIL") + ": " + label)
          if not passed:
              raise SystemExit("Missing required feature: " + label)

      print("PASS: manifest XML")
      PY

  - name: Build APK
    shell: bash
    run: |
      set -euo pipefail
      cd carassistant-voice
      gradle --no-daemon --stacktrace assembleDebug

  - name: Package APK and SHA256
    shell: bash
    run: |
      set -euo pipefail

      APK="carassistant-voice/app/build/outputs/apk/debug/app-debug.apk"
      test -s "$APK"

      mkdir -p dist
      cp "$APK" dist/CarAssistant-Voice-V52-YouTube-AutoPlay-PATCH.apk
      sha256sum dist/CarAssistant-Voice-V52-YouTube-AutoPlay-PATCH.apk \
        > dist/CarAssistant-Voice-V52-YouTube-AutoPlay-PATCH.sha256

      cat dist/CarAssistant-Voice-V52-YouTube-AutoPlay-PATCH.sha256

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: CarAssistant-Voice-V52-YouTube-AutoPlay-PATCH
      path: |
        dist/CarAssistant-Voice-V52-YouTube-AutoPlay-PATCH.apk
        dist/CarAssistant-Voice-V52-YouTube-AutoPlay-PATCH.sha256
      if-no-files-found: error
