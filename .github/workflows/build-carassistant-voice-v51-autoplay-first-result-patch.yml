name: Tro ly CarAsistant 6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify immutable V5.1 baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE=".github/workflows/build-carassistant-voice-standalone-v5-app-picker-patch.yml"
          test -s "$BASE"
          test -s ".github/workflows/build-carassistant-voice-standalone-v5.yml"
          echo "PASS: V5.1 baseline exists; this workflow does not modify it."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Rebuild exact isolated V5.1 baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml

          python3 - <<'PY'
          from pathlib import Path
          import yaml

          baseline = Path(
              ".github/workflows/build-carassistant-voice-standalone-v5-app-picker-patch.yml"
          )
          data = yaml.safe_load(baseline.read_text(encoding="utf-8"))
          steps = data["jobs"]["build"]["steps"]

          wanted = {
              "Generate isolated V5 project from current workflow":
                  "/tmp/generate-v5.sh",
              "Apply isolated installed-app picker patch":
                  "/tmp/app-picker-patch.sh",
          }

          for name, output in wanted.items():
              matches = [
                  step for step in steps
                  if step.get("name") == name
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      "FAIL: expected exactly one baseline step: " + name
                  )

              script = matches[0].get("run", "")
              if not script.strip():
                  raise SystemExit("FAIL: empty baseline step: " + name)

              Path(output).write_text(script + "\n", encoding="utf-8")
              print("PASS: extracted baseline step: " + name)

          print("PASS: baseline workflow was read only")
          PY

          bash /tmp/generate-v5.sh
          bash /tmp/app-picker-patch.sh

      - name: Apply isolated first-result resolver patch
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          root = Path("carassistant-voice")
          main = root / "app/src/main/java/com/carassistant/voice/MainActivity.java"
          manifest = root / "app/src/main/AndroidManifest.xml"

          java = main.read_text(encoding="utf-8")

          additions = [
              "import java.io.BufferedReader;",
              "import java.io.InputStreamReader;",
              "import java.net.HttpURLConnection;",
              "import java.net.URL;",
              "import java.nio.charset.StandardCharsets;",
              "import java.util.regex.Matcher;",
              "import java.util.regex.Pattern;",
          ]

          anchor = "import java.util.ArrayList;"
          if anchor not in java:
              raise SystemExit("FAIL: Java import anchor not found")

          missing = [item for item in additions if item not in java]
          if missing:
              java = java.replace(
                  anchor,
                  anchor + "\n" + "\n".join(missing),
                  1,
              )

          methods = r'''
              private String fetchSearchPage(String address) {
                  HttpURLConnection connection = null;

                  try {
                      connection =
                              (HttpURLConnection) new URL(address).openConnection();

                      connection.setRequestMethod("GET");
                      connection.setConnectTimeout(7000);
                      connection.setReadTimeout(7000);
                      connection.setInstanceFollowRedirects(true);
                      connection.setRequestProperty(
                              "User-Agent",
                              "Mozilla/5.0 (Linux; Android 12) "
                              + "AppleWebKit/537.36 "
                              + "(KHTML, like Gecko) Chrome/126.0 Mobile Safari/537.36");
                      connection.setRequestProperty(
                              "Accept-Language", "vi-VN,vi;q=0.9,en;q=0.7");

                      int code = connection.getResponseCode();
                      if (code < 200 || code >= 300) {
                          return null;
                      }

                      StringBuilder body = new StringBuilder();

                      try (BufferedReader reader = new BufferedReader(
                              new InputStreamReader(
                                      connection.getInputStream(),
                                      StandardCharsets.UTF_8))) {
                          String line;
                          int total = 0;

                          while ((line = reader.readLine()) != null
                                  && total < 1500000) {
                              body.append(line).append('\n');
                              total += line.length();
                          }
                      }

                      return body.toString();

                  } catch (Exception e) {
                      return null;
                  } finally {
                      if (connection != null) {
                          connection.disconnect();
                      }
                  }
              }

              private String firstMatch(
                      String text, String expression, int group) {
                  if (text == null) {
                      return null;
                  }

                  Matcher matcher = Pattern.compile(
                          expression,
                          Pattern.CASE_INSENSITIVE | Pattern.DOTALL)
                          .matcher(text);

                  return matcher.find() ? matcher.group(group) : null;
              }

              private String resolveFirstResult(
                      String target, String query) {
                  String encoded = Uri.encode(query);
                  String pageUrl;
                  String html;

                  switch (target) {
                      case "youtube": {
                          pageUrl =
                                  "https://www.youtube.com/results?search_query="
                                  + encoded;
                          html = fetchSearchPage(pageUrl);

                          String videoId = firstMatch(
                                  html,
                                  "\"videoId\"\\s*:\\s*\"([A-Za-z0-9_-]{11})\"",
                                  1);

                          return videoId == null
                                  ? null
                                  : "https://www.youtube.com/watch?v=" + videoId;
                      }

                      case "ytmusic": {
                          pageUrl =
                                  "https://music.youtube.com/search?q=" + encoded;
                          html = fetchSearchPage(pageUrl);

                          String musicId = firstMatch(
                                  html,
                                  "\"videoId\"\\s*:\\s*\"([A-Za-z0-9_-]{11})\"",
                                  1);

                          if (musicId == null) {
                              musicId = firstMatch(
                                      html,
                                      "\"playlistItemData\".*?\"videoId\""
                                      + "\\s*:\\s*\"([A-Za-z0-9_-]{11})\"",
                                      1);
                          }

                          return musicId == null
                                  ? null
                                  : "https://music.youtube.com/watch?v=" + musicId;
                      }

                      case "zing": {
                          pageUrl =
                                  "https://zingmp3.vn/tim-kiem/tat-ca?q=" + encoded;
                          html = fetchSearchPage(pageUrl);

                          String zingPath = firstMatch(
                                  html,
                                  "href=\"((?:https?://zingmp3\\.vn)?"
                                  + "/bai-hat/[^\"\\s<>]+)",
                                  1);

                          if (zingPath == null) {
                              return null;
                          }

                          if (zingPath.startsWith("/")) {
                              return "https://zingmp3.vn" + zingPath;
                          }

                          return zingPath;
                      }

                      case "spotify": {
                          pageUrl =
                                  "https://open.spotify.com/search/" + encoded;
                          html = fetchSearchPage(pageUrl);

                          String trackUrl = firstMatch(
                                  html,
                                  "https?://open\\.spotify\\.com/track/"
                                  + "[A-Za-z0-9]+",
                                  0);

                          if (trackUrl != null) {
                              return trackUrl;
                          }

                          String trackId = firstMatch(
                                  html,
                                  "\"uri\"\\s*:\\s*"
                                  + "\"spotify:track:([A-Za-z0-9]+)\"",
                                  1);

                          return trackId == null
                                  ? null
                                  : "https://open.spotify.com/track/" + trackId;
                      }

                      default:
                          return null;
                  }
              }

              private void resolveAndOpenFirstResult(
                      String target, String query) {
                  action.setText(
                          "Đang phân giải kết quả đầu tiên cho "
                          + target + "…");

                  new Thread(() -> {
                      String resolved = resolveFirstResult(target, query);

                      runOnUiThread(() -> {
                          if (resolved == null || resolved.trim().isEmpty()) {
                              String search = searchUrl(target, query);

                              action.setText(
                                      "Chưa phân giải được liên kết nội dung cụ thể cho "
                                      + target
                                      + ". Đang thử mở trang tìm kiếm; "
                                      + "chưa xác nhận phát tự động.");

                              openTarget(target, search);

                              action.setText(
                                      "Không xác định được kết quả đầu tiên. "
                                      + "Đã thử mở trang tìm kiếm; "
                                      + "chưa xác nhận phát.");
                              return;
                          }

                          openTarget(target, resolved);

                          if ("spotify".equals(target)) {
                              action.setText(
                                      "Đã gửi yêu cầu mở track Spotify cụ thể. "
                                      + "Chưa xác minh trạng thái đang phát. "
                                      + "Nếu ứng dụng yêu cầu đăng nhập, quyền "
                                      + "hoặc không tự phát, hãy kiểm tra Spotify.");
                          } else {
                              action.setText(
                                      "Đã gửi yêu cầu mở nội dung cụ thể: "
                                      + resolved
                                      + ". Chưa xác minh âm thanh đã phát.");
                          }
                      });
                  }, "voice-first-result-resolver").start();
              }

          '''

          marker = "private void parseCommand(String spoken) {"

          if java.count(marker) != 1:
              raise SystemExit(
                  "FAIL: expected exactly one parseCommand anchor"
              )

          if "resolveAndOpenFirstResult(String target, String query)" not in java:
              java = java.replace(
                  marker,
                  methods + "\n              " + marker,
                  1,
              )

          old_tail = r'''String url = searchUrl(target, query);
                  action.setText("Đích: " + target + "\nNội dung: " + query
                          + "\nĐang gửi yêu cầu mở tìm kiếm. "
                          + "Ứng dụng có thể hiển thị kết quả thay vì tự phát.");
                  openTarget(target, url);'''

          if old_tail not in java:
              raise SystemExit(
                  "FAIL: expected V5.1 parseCommand search block not found"
              )

          java = java.replace(
              old_tail,
              "resolveAndOpenFirstResult(target, query);",
              1,
          )

          main.write_text(java, encoding="utf-8")

          # INTERNET permission is required for the resolver's HTTP requests.
          xml = manifest.read_text(encoding="utf-8")

          if "android.permission.INTERNET" not in xml:
              xml, count = re.subn(
                  r"(<manifest[^>]*>)",
                  r'\1\n    <uses-permission android:name="android.permission.INTERNET" />',
                  xml,
                  count=1,
              )

              if count != 1:
                  raise SystemExit(
                      "FAIL: could not add INTERNET permission"
                  )

          manifest.write_text(xml, encoding="utf-8")
          ET.parse(manifest)

          print("PASS: isolated resolver patch applied")
          print("PASS: Android Manifest XML")
          PY

      - name: Validate preserved features and resolver
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path("carassistant-voice")
          main = root / "app/src/main/java/com/carassistant/voice/MainActivity.java"
          service = root / "app/src/main/java/com/carassistant/voice/FloatingMicService.java"
          manifest = root / "app/src/main/AndroidManifest.xml"
          gradle = root / "app/build.gradle"

          java = main.read_text(encoding="utf-8")
          overlay = service.read_text(encoding="utf-8")
          xml = manifest.read_text(encoding="utf-8")
          build = gradle.read_text(encoding="utf-8")

          ET.parse(manifest)

          checks = {
              "V5 version unchanged":
                  "versionCode 5" in build
                  and "versionName '0.5.0'" in build,

              "YouTube and ReVanced picker":
                  '"com.google.android.youtube"' in java
                  and '"app.revanced.android.youtube"' in java,

              "YouTube Music and Morphe picker":
                  '"com.google.android.apps.youtube.music"' in java
                  and '"com.google.android.apps.youtube.music.morphe"' in java,

              "Zing and Spotify picker":
                  '"com.zing.mp3"' in java
                  and '"com.spotify.music"' in java,

              "Partial transcript callback":
                  "onPartialResults" in java,

              "Four-second silence":
                  "SILENCE_MS = 4000L" in java,

              "End beep":
                  "TONE_PROP_ACK" in java,

              "Auto-hide":
                  "HIDE_MS = 2500L" in java,

              "Floating mic":
                  "TYPE_APPLICATION_OVERLAY" in overlay,

              "YouTube video URL":
                  "www.youtube.com/watch?v=" in java,

              "YouTube Music item URL":
                  "music.youtube.com/watch?v=" in java,

              "Zing song link inspection":
                  "/bai-hat/" in java,

              "Spotify track URL and URI":
                  "spotify:track:" in java
                  and "open.spotify.com/track/" in java,

              "Spotify playback not falsely confirmed":
                  "Chưa xác minh trạng thái đang phát" in java,

              "Network permission":
                  "android.permission.INTERNET" in xml,

              "Bounded network timeouts":
                  "setConnectTimeout(7000)" in java
                  and "setReadTimeout(7000)" in java,
          }

          for label, passed in checks.items():
              print(("PASS" if passed else "FAIL") + ": " + label)
              if not passed:
                  raise SystemExit("Missing requirement: " + label)

          print("PASS: all mandatory feature checks")
          PY

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd carassistant-voice
          gradle --no-daemon --stacktrace assembleDebug

      - name: Package APK and SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="carassistant-voice/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          mkdir -p dist
          cp "$APK" \
            dist/CarAssistant-Voice-V51-AutoPlay-First-Result-PATCH.apk

          sha256sum \
            dist/CarAssistant-Voice-V51-AutoPlay-First-Result-PATCH.apk \
            > dist/CarAssistant-Voice-V51-AutoPlay-First-Result-PATCH.sha256

          cat dist/CarAssistant-Voice-V51-AutoPlay-First-Result-PATCH.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-Voice-V51-AutoPlay-First-Result-PATCH
          path: |
            dist/CarAssistant-Voice-V51-AutoPlay-First-Result-PATCH.apk
            dist/CarAssistant-Voice-V51-AutoPlay-First-Result-PATCH.sha256
          if-no-files-found: error
