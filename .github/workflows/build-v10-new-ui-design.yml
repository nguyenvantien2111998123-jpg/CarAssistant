name: Build Car Assistant V10 New UI Design Fixed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore exact V10-6A baseline
        shell: bash
        run: |
          set -euo pipefail

          BASELINE="9075636a7d5947c1b0eee49c2bd3fd0e1b6b0cf1"

          git fetch origin "$BASELINE" --depth=1

          rm -rf v10-source

          git checkout "$BASELINE" -- v10-source

          test -f "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
          test -f "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          test -f "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java"

          if [ -f "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java" ]; then
            echo "ERROR: V10ProjectionService.java exists after baseline restore."
            exit 1
          fi

          echo "Exact V10-6A baseline restored:"
          echo "$BASELINE"

      - name: Verify V10-6A baseline
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          SESSION="$SRC/V10ProjectionSession.java"
          ACTIVITY="$SRC/V10CarActivity.java"

          grep -Fq "DisplayManager" "$SESSION"
          grep -Fq "createVirtualDisplay" "$SESSION"
          grep -Fq "RootShellSession" "$SESSION"
          grep -Fq "am force-stop" "$SESSION"

          grep -Fq "public void onStop()" "$ACTIVITY"
          grep -Fq "session.release()" "$ACTIVITY"

          echo "V10-6A baseline markers OK."

      - name: Create V10 Display Core Task Session
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          cat > "$SRC/V10TaskSession.java" <<'EOF'
          package com.carassistant.v10;

          import android.content.ComponentName;

          public final class V10TaskSession {

              public enum State {
                  NEW,
                  ACTIVE,
                  HIDDEN,
                  CLOSED
              }

              private ComponentName target;
              private State state = State.NEW;
              private long lastActiveTime;

              public synchronized boolean setTarget(ComponentName component) {
                  if (component == null) {
                      return false;
                  }

                  boolean changed =
                          target == null
                                  || !component.equals(target);

                  if (changed) {
                      target = component;
                      state = State.NEW;
                  }

                  return changed;
              }

              public synchronized ComponentName getTarget() {
                  return target;
              }

              public synchronized State getState() {
                  return state;
              }

              public synchronized boolean hasTarget() {
                  return target != null;
              }

              public synchronized void active() {
                  state = State.ACTIVE;
                  lastActiveTime = System.currentTimeMillis();
              }

              public synchronized void hidden() {
                  if (target != null) {
                      state = State.HIDDEN;
                  }
              }

              public synchronized void closed() {
                  state = State.CLOSED;
              }

              public synchronized long getLastActiveTime() {
                  return lastActiveTime;
              }

              public synchronized void clear() {
                  target = null;
                  state = State.CLOSED;
                  lastActiveTime = 0L;
              }
          }
          EOF

          echo "V10TaskSession.java created."

      - name: Create V10 Display Controller
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          cat > "$SRC/V10DisplayController.java" <<'EOF'
          package com.carassistant.v10;

          import android.content.ComponentName;
          import android.content.Context;
          import android.graphics.SurfaceTexture;
          import android.hardware.display.DisplayManager;
          import android.os.Process;
          import android.util.Log;
          import android.view.Display;
          import android.view.Surface;

          public final class V10DisplayController {

              private static final String TAG =
                      "CarAssistantV10DisplayCore";

              private static V10DisplayController instance;

              private final Context context;

              private final RootShellSession rootShell =
                      new RootShellSession();

              private android.hardware.display.VirtualDisplay virtualDisplay;
              private Display display;
              private Surface surface;

              private ComponentName target;

              private boolean launched;
              private boolean destroyed;

              private V10DisplayController(Context context) {
                  this.context =
                          context.getApplicationContext();
              }

              public static synchronized V10DisplayController get(
                      Context context) {

                  if (instance == null) {
                      instance =
                              new V10DisplayController(context);
                  }

                  return instance;
              }

              public synchronized boolean ensureDisplay(
                      SurfaceTexture texture,
                      int width,
                      int height) {

                  if (destroyed
                          || texture == null
                          || width < 1
                          || height < 1) {
                      return false;
                  }

                  if (virtualDisplay != null
                          && display != null) {

                      attachSurface(
                              texture,
                              width,
                              height);

                      return true;
                  }

                  try {
                      texture.setDefaultBufferSize(
                              width,
                              height);

                      Surface newSurface =
                              new Surface(texture);

                      DisplayManager manager =
                              (DisplayManager)
                                      context.getSystemService(
                                              Context.DISPLAY_SERVICE);

                      if (manager == null) {
                          newSurface.release();
                          throw new IllegalStateException(
                                  "DisplayManager unavailable");
                      }

                      android.hardware.display.VirtualDisplay created =
                              manager.createVirtualDisplay(
                                      V10Display.nameFor(0),
                                      width,
                                      height,
                                      160,
                                      newSurface,
                                      10);

                      if (created == null) {
                          newSurface.release();
                          throw new IllegalStateException(
                                  "Cannot create virtual display");
                      }

                      Display createdDisplay =
                              created.getDisplay();

                      if (createdDisplay == null) {
                          created.release();
                          newSurface.release();
                          throw new IllegalStateException(
                                  "Virtual display has no Display");
                      }

                      virtualDisplay = created;
                      display = createdDisplay;

                      replaceSurface(newSurface);

                      return true;

                  } catch (RuntimeException e) {

                      Log.w(
                              TAG,
                              "Display creation failed",
                              e);

                      return false;
                  }
              }

              public synchronized void attachSurface(
                      SurfaceTexture texture,
                      int width,
                      int height) {

                  if (destroyed
                          || virtualDisplay == null
                          || texture == null) {
                      return;
                  }

                  texture.setDefaultBufferSize(
                          width,
                          height);

                  Surface newSurface =
                          new Surface(texture);

                  replaceSurface(newSurface);

                  virtualDisplay.setSurface(
                          newSurface);
              }

              public synchronized void detachSurface() {

                  if (virtualDisplay != null) {
                      try {
                          virtualDisplay.setSurface(null);
                      } catch (Throwable t) {
                          Log.w(
                                  TAG,
                                  "Display surface detach failed",
                                  t);
                      }
                  }

                  releaseSurfaceOnly();
              }

              private void replaceSurface(
                      Surface newSurface) {

                  releaseSurfaceOnly();

                  surface = newSurface;
              }

              private void releaseSurfaceOnly() {

                  if (surface != null) {
                      try {
                          surface.release();
                      } catch (Throwable ignored) {
                      }
                  }

                  surface = null;
              }

              public synchronized int getDisplayId() {

                  return display == null
                          ? -1
                          : display.getDisplayId();
              }

              public synchronized boolean isReady() {

                  return !destroyed
                          && virtualDisplay != null
                          && display != null;
              }

              public synchronized boolean isLaunched() {
                  return launched;
              }

              public synchronized ComponentName getTarget() {
                  return target;
              }

              public synchronized void launchNewTask(
                      ComponentName component) {

                  if (!isReady()
                          || component == null) {
                      return;
                  }

                  target = component;
                  launched = true;

                  final int displayId =
                          display.getDisplayId();

                  final int userId =
                          Process.myUid() / 100000;

                  final String flat =
                          component
                                  .flattenToString()
                                  .replace(
                                          "'",
                                          "'\"'\"'");

                  final String command =
                          "/system/bin/am start"
                                  + " --user " + userId
                                  + " --display " + displayId
                                  + " --windowingMode 1"
                                  + " -a android.intent.action.MAIN"
                                  + " -c android.intent.category.LAUNCHER"
                                  + " -f 0x10000000"
                                  + " -n '"
                                  + flat
                                  + "'";

                  execute(
                          command,
                          "Launch failed");
              }

              public synchronized void resumeExistingTask(
                      ComponentName component) {

                  if (!isReady()
                          || component == null) {
                      return;
                  }

                  target = component;

                  final int displayId =
                          display.getDisplayId();

                  final int userId =
                          Process.myUid() / 100000;

                  final String flat =
                          component
                                  .flattenToString()
                                  .replace(
                                          "'",
                                          "'\"'\"'");

                  final String command =
                          "/system/bin/am start"
                                  + " --user " + userId
                                  + " --display " + displayId
                                  + " --windowingMode 1"
                                  + " --activity-reorder-to-front"
                                  + " -f 0x10000000"
                                  + " -n '"
                                  + flat
                                  + "'";

                  execute(
                          command,
                          "Resume failed");
              }

              private void execute(
                      String command,
                      String message) {

                  RootShellSession.EXEC.execute(
                          () -> {
                              try {
                                  rootShell.run(
                                          10,
                                          command);
                              } catch (Throwable t) {
                                  Log.w(
                                          TAG,
                                          message,
                                          t);
                              }
                          });
              }

              public synchronized void markNotLaunched() {

                  launched = false;
                  target = null;
              }

              public synchronized void destroy() {

                  if (destroyed) {
                      return;
                  }

                  destroyed = true;

                  if (virtualDisplay != null) {
                      try {
                          virtualDisplay.release();
                      } catch (Throwable ignored) {
                      }
                  }

                  virtualDisplay = null;
                  display = null;

                  releaseSurfaceOnly();

                  rootShell.destroy();

                  if (instance == this) {
                      instance = null;
                  }
              }
          }
          EOF

          echo "V10DisplayController.java created."

      - name: Create V10 Surface Manager
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          cat > "$SRC/V10SurfaceManager.java" <<'EOF'
          package com.carassistant.v10;

          import android.graphics.SurfaceTexture;

          public final class V10SurfaceManager {

              private final V10DisplayController displayController;

              public V10SurfaceManager(
                      V10DisplayController displayController) {

                  this.displayController =
                          displayController;
              }

              public boolean attach(
                      SurfaceTexture texture,
                      int width,
                      int height) {

                  if (!displayController.isReady()) {

                      return displayController.ensureDisplay(
                              texture,
                              width,
                              height);
                  }

                  displayController.attachSurface(
                          texture,
                          width,
                          height);

                  return true;
              }

              public void detach() {
                  displayController.detachSurface();
              }
          }
          EOF

          echo "V10SurfaceManager.java created."

      - name: Replace V10ProjectionSession with Core V1 bridge
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          cat > "$SRC/V10ProjectionSession.java" <<'EOF'
          package com.carassistant.v10;

          import android.content.ComponentName;
          import android.content.Context;
          import android.graphics.SurfaceTexture;
          import android.util.Log;
          import android.view.TextureView;

          public final class V10ProjectionSession
                  implements TextureView.SurfaceTextureListener {

              private static final String TAG =
                      "CarAssistantV10Projection";

              private final V10DisplayController displayController;
              private final V10SurfaceManager surfaceManager;
              private final V10TaskSession taskSession =
                      new V10TaskSession();
              private final RootShellSession rootShell =
                      new RootShellSession();

              private TextureView textureView;
              private ComponentName target;

              private boolean destroyed;

              private int contentWidth;
              private int contentHeight;

              public V10ProjectionSession(
                      Context context) {

                  Context app =
                          context.getApplicationContext();

                  displayController =
                          V10DisplayController.get(app);

                  surfaceManager =
                          new V10SurfaceManager(
                                  displayController);
              }

              public void attachTextureView(
                      TextureView view) {

                  textureView = view;

                  view.setSurfaceTextureListener(
                          this);

                  if (view.isAvailable()) {
                      attachCurrentSurface();
                  }
              }

              public void setTarget(
                      ComponentName component) {

                  if (destroyed) {
                      return;
                  }

                  if (component == null) {

                      target = null;
                      taskSession.clear();

                      return;
                  }

                  boolean changed =
                          target == null
                                  || !component.equals(
                                          target);

                  target = component;

                  if (changed) {

                      taskSession.setTarget(
                              component);

                      if (displayController.isLaunched()) {
                          displayController.markNotLaunched();
                      }
                  }

                  attachCurrentSurface();
              }

              public boolean isActive() {

                  return !destroyed
                          && target != null
                          && displayController.isReady();
              }

              public int getDisplayId() {
                  return displayController.getDisplayId();
              }

              public void tap(
                      float x,
                      float y) {

                  if (!isActive()) {
                      return;
                  }

                  execute(
                          "/system/bin/input -d "
                                  + displayController.getDisplayId()
                                  + " tap "
                                  + Math.round(mapX(x))
                                  + " "
                                  + Math.round(mapY(y)),
                          "Tap failed",
                          5);
              }

              public void swipe(
                      float startX,
                      float startY,
                      float endX,
                      float endY,
                      long duration) {

                  if (!isActive()) {
                      return;
                  }

                  long safe =
                          Math.max(
                                  80L,
                                  Math.min(
                                          800L,
                                          duration));

                  execute(
                          "/system/bin/input -d "
                                  + displayController.getDisplayId()
                                  + " swipe "
                                  + Math.round(mapX(startX))
                                  + " "
                                  + Math.round(mapY(startY))
                                  + " "
                                  + Math.round(mapX(endX))
                                  + " "
                                  + Math.round(mapY(endY))
                                  + " "
                                  + safe,
                          "Swipe failed",
                          5);
              }

              public void back() {

                  if (!isActive()) {
                      return;
                  }

                  execute(
                          "/system/bin/input -d "
                                  + displayController.getDisplayId()
                                  + " keyevent 4",
                          "Back failed",
                          5);
              }

              private void attachCurrentSurface() {

                  if (destroyed
                          || target == null
                          || textureView == null
                          || !textureView.isAvailable()) {
                      return;
                  }

                  SurfaceTexture st =
                          textureView.getSurfaceTexture();

                  if (st == null) {
                      return;
                  }

                  int width =
                          textureView.getWidth();

                  int height =
                          textureView.getHeight();

                  if (width < 1
                          || height < 1) {
                      return;
                  }

                  contentWidth = width;
                  contentHeight = height;

                  boolean wasReady =
                          displayController.isReady();

                  boolean wasLaunched =
                          displayController.isLaunched();

                  ComponentName displayTarget =
                          displayController.getTarget();

                  surfaceManager.attach(
                          st,
                          width,
                          height);

                  if (!wasReady) {

                      displayController.launchNewTask(
                              target);

                      taskSession.active();

                      Log.d(
                              TAG,
                              "[CREATE] display="
                                      + displayController.getDisplayId());

                      Log.d(
                              TAG,
                              "[CREATE] task="
                                      + target.flattenToString());

                      Log.d(
                              TAG,
                              "[ACTIVE] task="
                                      + target.flattenToString());

                  } else if (!wasLaunched) {

                      displayController.launchNewTask(
                              target);

                      taskSession.active();

                      Log.d(
                              TAG,
                              "[LAUNCH] task="
                                      + target.flattenToString());

                  } else if (
                          taskSession.getState()
                                  == V10TaskSession.State.HIDDEN
                                  || displayTarget == null
                                  || !target.equals(displayTarget)) {

                      displayController.resumeExistingTask(
                              target);

                      taskSession.active();

                      Log.d(
                              TAG,
                              "[RESUME] task="
                                      + target.flattenToString());

                  } else {

                      taskSession.active();
                  }
              }

              public void hideTask() {

                  if (target == null
                          || !displayController.isReady()) {
                      return;
                  }

                  taskSession.hidden();

                  surfaceManager.detach();

                  Log.d(
                          TAG,
                          "[HIDE] task="
                                  + target.flattenToString());

                  Log.d(
                          TAG,
                          "[DETACH] surface");
              }

              public void release() {
                  hideTask();
              }

              public void destroy() {

                  if (destroyed) {
                      return;
                  }

                  destroyed = true;

                  surfaceManager.detach();

                  rootShell.destroy();
              }

              private float mapX(float x) {

                  if (textureView == null
                          || contentWidth < 1) {
                      return x;
                  }

                  float width =
                          textureView.getWidth();

                  if (width <= 0) {
                      return x;
                  }

                  return clamp(
                          x * contentWidth / width,
                          0,
                          contentWidth - 1);
              }

              private float mapY(float y) {

                  if (textureView == null
                          || contentHeight < 1) {
                      return y;
                  }

                  float height =
                          textureView.getHeight();

                  if (height <= 0) {
                      return y;
                  }

                  return clamp(
                          y * contentHeight / height,
                          0,
                          contentHeight - 1);
              }

              private static float clamp(
                      float value,
                      float min,
                      float max) {

                  return Math.max(
                          min,
                          Math.min(
                                  max,
                                  value));
              }

              private void execute(
                      String command,
                      String message,
                      int timeout) {

                  RootShellSession.EXEC.execute(
                          () -> {
                              try {
                                  rootShell.run(
                                          timeout,
                                          command);
                              } catch (Throwable t) {
                                  Log.w(
                                          TAG,
                                          message,
                                          t);
                              }
                          });
              }

              @Override
              public void onSurfaceTextureAvailable(
                      SurfaceTexture surface,
                      int width,
                      int height) {

                  attachCurrentSurface();
              }

              @Override
              public void onSurfaceTextureSizeChanged(
                      SurfaceTexture surface,
                      int width,
                      int height) {

                  contentWidth = width;
                  contentHeight = height;
              }

              @Override
              public boolean onSurfaceTextureDestroyed(
                      SurfaceTexture surface) {

                  taskSession.hidden();

                  surfaceManager.detach();

                  Log.d(
                          TAG,
                          "[DETACH] surface");

                  return true;
              }

              @Override
              public void onSurfaceTextureUpdated(
                      SurfaceTexture surface) {
              }
          }
          EOF

          echo "V10ProjectionSession Core V1 installed."

      - name: Patch V10CarActivity lifecycle for persistence
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          old = """    @Override
              public void onStop() {

                  resumed = false;

                  handler.removeCallbacks(
                          clockTicker);

                  handler.removeCallbacks(
                          targetPoller);

                  if (session != null) {
                      session.release();
                  }

                  super.onStop();
              }"""

          new = """    @Override
              public void onStop() {

                  resumed = false;

                  handler.removeCallbacks(
                          clockTicker);

                  handler.removeCallbacks(
                          targetPoller);

                  /*
                   * Display Core V1:
                   * Activity stop must not close the projected task.
                   */
                  super.onStop();
              }"""

          if old in text:
              text = text.replace(old, new, 1)
          else:
              old2 = """    @Override
              public void onStop() {

                  resumed = false;

                  handler.removeCallbacks(
                          clockTicker);

                  handler.removeCallbacks(
                          targetPoller);

                  if (session != null) {
                      session.release();
                  }

                  super.onStop();
              }
          """

              if old2 in text:
                  text = text.replace(old2, new, 1)
              else:
                  print("WARNING: original onStop block not found; leaving file unchanged.")

          path.write_text(text)
          PY

          echo "Lifecycle patch completed."

      - name: Restore new UI source from current main
        shell: bash
        run: |
          set -euo pipefail

          UI_FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivityNew.java"

          echo "Restoring UI source from current repository HEAD."

          git show "HEAD:v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivityNew.java" > "$UI_FILE"

          test -s "$UI_FILE"

          grep -Fq "public final class V10CarActivityNew" "$UI_FILE"
          grep -Fq "buildTransparentBottomBar" "$UI_FILE"
          grep -Fq "buildMainLayout" "$UI_FILE"
          grep -Fq "buildAppPanel" "$UI_FILE"

          echo "V10CarActivityNew.java restored successfully."
          wc -c "$UI_FILE"

      - name: Replace V10CarActivity with new UI source
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          OLD="$SRC/V10CarActivity.java"
          NEW="$SRC/V10CarActivityNew.java"
          TEMP="$SRC/V10CarActivity.fixed.java"

          test -f "$OLD"
          test -f "$NEW"

          cp "$NEW" "$TEMP"

          sed -i \
            's/public final class V10CarActivityNew/public final class V10CarActivity/' \
            "$TEMP"

          sed -i \
            's/V10CarActivityNew\.this/V10CarActivity.this/g' \
            "$TEMP"

          grep -Fq "public final class V10CarActivity" "$TEMP"
          grep -Fq "buildTransparentBottomBar" "$TEMP"
          grep -Fq "buildMainLayout" "$TEMP"
          grep -Fq "buildAppPanel" "$TEMP"

          mv "$TEMP" "$OLD"

          rm -f "$NEW"

          echo "New UI source installed as V10CarActivity.java."

      - name: Restore persistence lifecycle guard after UI replacement
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          pattern = re.compile(
              r'@Override\s+'
              r'public void onStop\(\)\s*\{'
              r'.*?'
              r'\n\s*\}',
              re.S
          )

          matches = list(pattern.finditer(text))

          if not matches:
              raise SystemExit("ERROR: onStop() not found.")

          match = matches[-1]
          block = match.group(0)

          if "session.release()" in block:
              replacement = """@Override
              public void onStop() {

                  resumed = false;

                  handler.removeCallbacks(
                          clockTicker);

                  handler.removeCallbacks(
                          targetPoller);

                  /*
                   * Display Core V1:
                   * Do not release projection task on Activity stop.
                   */
                  super.onStop();
              }"""

              text = (
                  text[:match.start()]
                  + replacement
                  + text[match.end():]
              )

          path.write_text(text)
          PY

          echo "Persistence lifecycle guard checked."

      - name: Verify UI and Display Core markers
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          ACTIVITY="$SRC/V10CarActivity.java"
          SESSION="$SRC/V10ProjectionSession.java"
          DISPLAY="$SRC/V10DisplayController.java"
          SURFACE="$SRC/V10SurfaceManager.java"
          TASK="$SRC/V10TaskSession.java"

          test -f "$ACTIVITY"
          test -f "$SESSION"
          test -f "$DISPLAY"
          test -f "$SURFACE"
          test -f "$TASK"

          echo "Checking UI..."

          grep -Fq "public final class V10CarActivity" "$ACTIVITY"
          grep -Fq "buildUi()" "$ACTIVITY"
          grep -Fq "buildMainLayout()" "$ACTIVITY"
          grep -Fq "buildTransparentBottomBar()" "$ACTIVITY"
          grep -Fq "buildAppPanel()" "$ACTIVITY"
          grep -Fq "loadApps()" "$ACTIVITY"
          grep -Fq "handleControlBack()" "$ACTIVITY"
          grep -Fq "handleControlHome()" "$ACTIVITY"
          grep -Fq "handleControlRecents()" "$ACTIVITY"

          echo "Checking Display Core..."

          grep -Fq "createVirtualDisplay" "$DISPLAY"
          grep -Fq "virtualDisplay.setSurface(null)" "$DISPLAY"
          grep -Fq -- "--activity-reorder-to-front" "$DISPLAY"

          grep -Fq "launchNewTask" "$SESSION"
          grep -Fq "resumeExistingTask" "$SESSION"
          grep -Fq "State.HIDDEN" "$SESSION"

          grep -Fq "class V10TaskSession" "$TASK"
          grep -Fq "class V10SurfaceManager" "$SURFACE"

          echo "Checking forbidden force-stop..."

          if grep -Fq "am force-stop" "$SESSION"; then
            echo "ERROR: am force-stop remains in V10ProjectionSession.java"
            exit 1
          fi

          if grep -Fq "am force-stop" "$DISPLAY"; then
            echo "ERROR: am force-stop remains in V10DisplayController.java"
            exit 1
          fi

          echo "Checking Activity onStop persistence..."

          python3 - "$ACTIVITY" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          match = re.search(
              r'public void onStop\(\)\s*\{(.*?)\n\s*\}',
              text,
              re.S
          )

          if not match:
              raise SystemExit("ERROR: onStop() not found.")

          body = match.group(1)

          if "session.release()" in body:
              raise SystemExit(
                  "ERROR: session.release() remains in onStop()."
              )

          print("onStop() persistence check OK.")
          PY

          echo "All UI and Display Core markers OK."

      - name: Check Java source syntax structure
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          for file in \
            "$SRC/V10CarActivity.java" \
            "$SRC/V10ProjectionSession.java" \
            "$SRC/V10DisplayController.java" \
            "$SRC/V10SurfaceManager.java" \
            "$SRC/V10TaskSession.java"
          do
            echo "Checking: $file"
            test -s "$file"
          done

          python3 - "$SRC/V10CarActivity.java" <<'PY'
          from pathlib import Path
          import sys

          text = Path(sys.argv[1]).read_text()

          if text.count("{") != text.count("}"):
              raise SystemExit(
                  "ERROR: brace count mismatch in V10CarActivity.java"
              )

          if text.count("(") != text.count(")"):
              raise SystemExit(
                  "ERROR: parenthesis count mismatch in V10CarActivity.java"
              )

          print("V10CarActivity.java basic structure OK.")
          PY

      - name: Compile Java sources
        shell: bash
        run: |
          set -euo pipefail

          cd v10-source

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            compileDebugJavaWithJavac

      - name: Assemble debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd v10-source

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Locate APK and SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find v10-source \
              -type f \
              -path '*/build/outputs/apk/*/*.apk' \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          test -f "$APK"

          echo "APK=$APK"

          sha256sum "$APK"

      - name: Upload V10 New UI APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-New-UI-Design-Fixed
          path: v10-source/**/build/outputs/apk/*/*.apk
          if-no-files-found: error
          retention-days: 7
