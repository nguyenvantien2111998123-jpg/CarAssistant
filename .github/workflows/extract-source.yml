name: Extract Car Assistant Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          rm -rf /tmp/car-source
          mkdir -p /tmp/car-source

          unzip -o "CarAssistant-PhaseA-v2-offline-audio.zip" -d /tmp/car-source

          echo "=== Extracted ==="
          find /tmp/car-source -maxdepth 3 -type f | head -100

      - name: Prepare v3-source
        run: |
          rm -rf v3-source
          mkdir -p v3-source

          ROOTS=$(find /tmp/car-source -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$ROOTS" -eq 1 ] && [ -d "$(find /tmp/car-source -mindepth 1 -maxdepth 1)" ]; then
            cp -a "$(find /tmp/car-source -mindepth 1 -maxdepth 1)/." v3-source/
          else
            cp -a /tmp/car-source/. v3-source/
          fi

          echo "=== v3-source ==="
          find v3-source -maxdepth 3 -type f | sort | head -200

      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add v3-source

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "build: extract Phase A v2 source"
            git push origin HEAD:main
          fi
