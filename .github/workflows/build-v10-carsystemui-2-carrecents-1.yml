name: Build Car Assistant V10 CarSystemUI 2 - CarRecents

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check V10 source
        shell: bash
        run: |
          set -euo pipefail
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/RootShellSession.java

      - name: Create CarSystemUI
        shell: bash
        run: |
          set -euo pipefail
          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/CarSystemUI.java"
          cat > "$FILE" <<'EOF'
          package com.carassistant.v10;
          
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.os.SystemClock;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewConfiguration;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          
          public final class CarSystemUI {
              public interface Callback {
                  void onBack();
                  void onHome();
                  void onRecents();
              }
          
              private static final String PREFS = "v10_car_system_ui";
              private static final String KEY_X = "key_x";
              private static final String KEY_Y = "key_y";
              private static final int KEY_SIZE_DP = 52;
              private static final int MENU_WIDTH_DP = 190;
              private static final int MENU_BUTTON_HEIGHT_DP = 52;
          
              private final Context context;
              private final FrameLayout host;
              private final Callback callback;
              private final SharedPreferences prefs;
              private final int touchSlop;
          
              private View floatingKey;
              private LinearLayout menu;
              private float downRawX;
              private float downRawY;
              private int startX;
              private int startY;
              private long lastTapTime;
          
              public CarSystemUI(Context context, FrameLayout host, Callback callback) {
                  this.context = context;
                  this.host = host;
                  this.callback = callback;
                  this.prefs = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                  this.touchSlop = ViewConfiguration.get(context).getScaledTouchSlop();
              }
          
              public void attach() {
                  if (floatingKey != null) return;
          
                  TextView key = new TextView(context);
                  floatingKey = key;
                  key.setText("≡");
                  key.setTextColor(Color.WHITE);
                  key.setTextSize(24f);
                  key.setGravity(Gravity.CENTER);
                  key.setBackground(background(Color.argb(225, 25, 25, 25), 26));
          
                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(
                          dp(KEY_SIZE_DP), dp(KEY_SIZE_DP));
                  lp.gravity = Gravity.TOP | Gravity.START;
                  lp.leftMargin = prefs.getInt(KEY_X, dp(18));
                  lp.topMargin = prefs.getInt(KEY_Y, dp(18));
                  host.addView(key, lp);
          
                  key.setOnTouchListener((view, event) -> {
                      FrameLayout.LayoutParams p =
                              (FrameLayout.LayoutParams) view.getLayoutParams();
          
                      switch (event.getActionMasked()) {
                          case MotionEvent.ACTION_DOWN:
                              downRawX = event.getRawX();
                              downRawY = event.getRawY();
                              startX = p.leftMargin;
                              startY = p.topMargin;
                              return true;
          
                          case MotionEvent.ACTION_MOVE:
                              float dx = event.getRawX() - downRawX;
                              float dy = event.getRawY() - downRawY;
                              if (Math.abs(dx) > touchSlop || Math.abs(dy) > touchSlop) {
                                  p.leftMargin = (int) (startX + dx);
                                  p.topMargin = (int) (startY + dy);
                                  clampPosition(p);
                                  view.setLayoutParams(p);
                              }
                              return true;
          
                          case MotionEvent.ACTION_UP:
                              float upDx = event.getRawX() - downRawX;
                              float upDy = event.getRawY() - downRawY;
                              if (Math.abs(upDx) <= touchSlop && Math.abs(upDy) <= touchSlop) {
                                  handleTap();
                              } else {
                                  savePosition(p);
                              }
                              return true;
          
                          default:
                              return true;
                      }
                  });
              }
          
              public void detach() {
                  hideMenu();
                  if (floatingKey != null) {
                      host.removeView(floatingKey);
                      floatingKey = null;
                  }
              }
          
              private void handleTap() {
                  long now = SystemClock.uptimeMillis();
                  if (now - lastTapTime < 350L) {
                      lastTapTime = 0L;
                      hideMenu();
                      if (callback != null) callback.onHome();
                      return;
                  }
                  lastTapTime = now;
                  showMenu();
              }
          
              private void showMenu() {
                  if (menu != null) {
                      hideMenu();
                      return;
                  }
          
                  menu = new LinearLayout(context);
                  menu.setOrientation(LinearLayout.VERTICAL);
                  menu.setPadding(dp(8), dp(8), dp(8), dp(8));
                  menu.setBackground(background(Color.argb(240, 25, 25, 25), 18));
          
                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(
                          dp(MENU_WIDTH_DP), ViewGroup.LayoutParams.WRAP_CONTENT);
                  lp.gravity = Gravity.TOP | Gravity.START;
          
                  FrameLayout.LayoutParams keyLp =
                          (FrameLayout.LayoutParams) floatingKey.getLayoutParams();
                  lp.leftMargin = Math.max(0, keyLp.leftMargin - dp(10));
                  lp.topMargin = Math.max(
                          0, keyLp.topMargin + dp(KEY_SIZE_DP) + dp(8));
          
                  host.addView(menu, lp);
          
                  addMenuButton("BACK", () -> {
                      hideMenu();
                      if (callback != null) callback.onBack();
                  });
          
                  addMenuButton("RECENTS", () -> {
                      hideMenu();
                      if (callback != null) callback.onRecents();
                  });
              }
          
              private void addMenuButton(String label, final Runnable action) {
                  TextView button = new TextView(context);
                  button.setText(label);
                  button.setTextColor(Color.WHITE);
                  button.setTextSize(16f);
                  button.setGravity(Gravity.CENTER);
                  button.setBackground(background(Color.argb(60, 255, 255, 255), 12));
          
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(MENU_BUTTON_HEIGHT_DP));
                  lp.bottomMargin = dp(6);
                  menu.addView(button, lp);
                  button.setOnClickListener(v -> action.run());
              }
          
              private void hideMenu() {
                  if (menu != null) {
                      host.removeView(menu);
                      menu = null;
                  }
              }
          
              private void clampPosition(FrameLayout.LayoutParams lp) {
                  int width = host.getWidth();
                  int height = host.getHeight();
                  int size = dp(KEY_SIZE_DP);
          
                  if (width > 0) {
                      lp.leftMargin = Math.max(0, Math.min(lp.leftMargin, width - size));
                  }
                  if (height > 0) {
                      lp.topMargin = Math.max(0, Math.min(lp.topMargin, height - size));
                  }
              }
          
              private void savePosition(FrameLayout.LayoutParams lp) {
                  prefs.edit()
                          .putInt(KEY_X, lp.leftMargin)
                          .putInt(KEY_Y, lp.topMargin)
                          .apply();
              }
          
              private GradientDrawable background(int color, int radiusDp) {
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(color);
                  bg.setCornerRadius(dp(radiusDp));
                  return bg;
              }
          
              private int dp(int value) {
                  return Math.round(value * context.getResources()
                          .getDisplayMetrics().density);
              }
          }
          EOF

      - name: Create CarRecents
        shell: bash
        run: |
          set -euo pipefail
          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/CarRecents.java"
          cat > "$FILE" <<'EOF'
          package com.carassistant.v10;
          
          import android.content.ComponentName;
          import android.content.Context;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          
          import java.util.ArrayList;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          
          public final class CarRecents {
              public interface Callback {
                  void onTaskSelected(ComponentName component);
                  void onClose();
              }
          
              private static final Pattern TASK_ID =
                      Pattern.compile("#(\\d+)");
              private static final Pattern DISPLAY_ID =
                      Pattern.compile("displayId[=:](\\d+)");
              private static final Pattern REAL_ACTIVITY =
                      Pattern.compile(
                              "realActivity=ComponentInfo\\{([^/}]+)/([^}]+)\\}");
          
              private final Context context;
              private final FrameLayout host;
              private final RootShellSession shell;
              private final int displayId;
              private final String ownPackage;
              private final Callback callback;
          
              private LinearLayout panel;
              private TextView status;
          
              public CarRecents(
                      Context context,
                      FrameLayout host,
                      RootShellSession shell,
                      int displayId,
                      String ownPackage,
                      Callback callback) {
                  this.context = context;
                  this.host = host;
                  this.shell = shell;
                  this.displayId = displayId;
                  this.ownPackage = ownPackage;
                  this.callback = callback;
              }
          
              public void show() {
                  if (panel != null) return;
          
                  panel = new LinearLayout(context);
                  panel.setOrientation(LinearLayout.VERTICAL);
                  panel.setPadding(dp(16), dp(12), dp(16), dp(12));
                  panel.setBackgroundColor(Color.rgb(7, 9, 12));
          
                  LinearLayout header = new LinearLayout(context);
                  header.setGravity(Gravity.CENTER_VERTICAL);
          
                  TextView close = button("CLOSE");
                  close.setOnClickListener(v -> {
                      hide();
                      if (callback != null) callback.onClose();
                  });
          
                  header.addView(close, new LinearLayout.LayoutParams(dp(95), dp(54)));
          
                  TextView title = text("RECENT APPS", 21, Color.WHITE);
                  title.setGravity(Gravity.CENTER);
                  header.addView(title, new LinearLayout.LayoutParams(0, dp(54), 1f));
                  panel.addView(header);
          
                  status = text("Loading…", 14, Color.LTGRAY);
                  status.setGravity(Gravity.CENTER);
                  panel.addView(status, new LinearLayout.LayoutParams(-1, dp(42)));
          
                  ScrollView scroll = new ScrollView(context);
                  LinearLayout list = new LinearLayout(context);
                  list.setOrientation(LinearLayout.VERTICAL);
                  scroll.addView(list);
          
                  panel.addView(scroll, new LinearLayout.LayoutParams(-1, 0, 1f));
                  host.addView(panel, new FrameLayout.LayoutParams(-1, -1));
          
                  load(list);
              }
          
              public void hide() {
                  if (panel != null) {
                      host.removeView(panel);
                      panel = null;
                      status = null;
                  }
              }
          
              private void load(LinearLayout list) {
                  final String command =
                          "/system/bin/dumpsys activity recents"
                                  + " | /system/bin/grep -E"
                                  + " 'Task\\\\{|displayId[=:]|realActivity='";
          
                  RootShellSession.EXEC.execute(() -> {
                      try {
                          String output = shell.run(5, command);
                          List<RecentTask> tasks = parse(output);
                          host.post(() -> populate(list, tasks));
                      } catch (Throwable t) {
                          host.post(() -> showError(list));
                      }
                  });
              }
          
              private void populate(LinearLayout list, List<RecentTask> tasks) {
                  list.removeAllViews();
          
                  if (tasks.isEmpty()) {
                      status.setText("No recent task on this display");
                      return;
                  }
          
                  status.setText(tasks.size() + " task(s)");
          
                  for (RecentTask task : tasks) {
                      TextView item = button(task.label);
                      item.setTextSize(16f);
                      item.setGravity(Gravity.CENTER_VERTICAL);
          
                      LinearLayout.LayoutParams lp =
                              new LinearLayout.LayoutParams(-1, dp(66));
                      lp.bottomMargin = dp(8);
                      list.addView(item, lp);
          
                      item.setOnClickListener(v -> select(task));
                  }
              }
          
              private void showError(LinearLayout list) {
                  list.removeAllViews();
                  status.setText("Unable to read recent tasks");
              }
          
              private void select(RecentTask task) {
                  hide();
          
                  final String command =
                          "/system/bin/am task "
                                  + task.taskId
                                  + " front";
          
                  RootShellSession.EXEC.execute(() -> {
                      try {
                          shell.run(5, command);
                      } catch (Throwable ignored) {
                      }
          
                      host.post(() -> {
                          if (callback != null) {
                              callback.onTaskSelected(task.component);
                          }
                      });
                  });
              }
          
              private List<RecentTask> parse(String output) {
                  LinkedHashMap<Integer, RecentTask> result =
                          new LinkedHashMap<>();
          
                  int currentTaskId = -1;
                  boolean currentDisplayMatches = false;
                  ComponentName currentComponent = null;
          
                  String[] lines = output == null
                          ? new String[0]
                          : output.split("\\n");
          
                  for (String line : lines) {
                      Matcher taskMatcher = TASK_ID.matcher(line);
          
                      if (line.contains("Task{") && taskMatcher.find()) {
                          currentTaskId = Integer.parseInt(taskMatcher.group(1));
                          currentDisplayMatches = false;
                          currentComponent = null;
          
                          Matcher displayMatcher = DISPLAY_ID.matcher(line);
                          if (displayMatcher.find()) {
                              currentDisplayMatches =
                                      Integer.parseInt(displayMatcher.group(1))
                                              == displayId;
                          }
                          continue;
                      }
          
                      if (currentTaskId < 0) continue;
          
                      Matcher displayMatcher = DISPLAY_ID.matcher(line);
                      if (displayMatcher.find()) {
                          currentDisplayMatches =
                                  Integer.parseInt(displayMatcher.group(1))
                                          == displayId;
                      }
          
                      Matcher activityMatcher = REAL_ACTIVITY.matcher(line);
                      if (activityMatcher.find()) {
                          currentComponent = new ComponentName(
                                  activityMatcher.group(1),
                                  activityMatcher.group(2));
                      }
          
                      if (currentDisplayMatches
                              && currentComponent != null
                              && !ownPackage.equals(
                                      currentComponent.getPackageName())
                              && !result.containsKey(currentTaskId)) {
                          result.put(
                                  currentTaskId,
                                  new RecentTask(
                                          currentTaskId,
                                          currentComponent));
                      }
                  }
          
                  return new ArrayList<>(result.values());
              }
          
              private static final class RecentTask {
                  final int taskId;
                  final ComponentName component;
                  final String label;
          
                  RecentTask(int taskId, ComponentName component) {
                      this.taskId = taskId;
                      this.component = component;
                      this.label = component.getPackageName()
                              + "\nTask #" + taskId;
                  }
              }
          
              private TextView button(String value) {
                  TextView view = text(value, 16, Color.WHITE);
                  view.setGravity(Gravity.CENTER);
          
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.rgb(22, 27, 33));
                  bg.setCornerRadius(dp(14));
                  view.setBackground(bg);
                  return view;
              }
          
              private TextView text(String value, int size, int color) {
                  TextView view = new TextView(context);
                  view.setText(value);
                  view.setTextSize(size);
                  view.setTextColor(color);
                  return view;
              }
          
              private int dp(int value) {
                  return Math.round(value * context.getResources()
                          .getDisplayMetrics().density);
              }
          }
          EOF

      - name: Patch V10ProjectionSession
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java")
          s=p.read_text()
          if "public int getDisplayId()" not in s:
              marker="    public boolean isActive() {"
              if marker not in s:
                  raise SystemExit("ERROR: isActive marker not found")
              method="""    public int getDisplayId() {
        return display == null ? -1 : display.getDisplayId();
    }

"""
              s=s.replace(marker, method+marker, 1)
              p.write_text(s)
          PY

      - name: Patch V10CarActivity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path("v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java")
          s=p.read_text()

          if "private CarSystemUI carSystemUI;" not in s:
              s=s.replace(
                  "private V10ProjectionSession session;",
                  "private V10ProjectionSession session;\n    private CarSystemUI carSystemUI;\n    private CarRecents carRecents;",
                  1)

          if "new CarSystemUI(" not in s:
              pattern=(r'(?m)^(?P<i>\s*)textureView\s*\n'
                       r'\s*\.setOnTouchListener\(\s*\n'
                       r'\s*inputController\s*\n'
                       r'\s*\.createListener\(\)\s*\);')
              m=re.search(pattern,s)
              if not m:
                  raise SystemExit("ERROR: textureView listener regex marker not found")
              i=m.group("i")
              injection=f"""{i}textureView
{i}        .setOnTouchListener(
{i}                inputController
{i}                        .createListener());

{i}carSystemUI = new CarSystemUI(
{i}        this,
{i}        projectionLayer,
{i}        new CarSystemUI.Callback() {{
{i}            @Override
{i}            public void onBack() {{
{i}                handleControlBack();
{i}            }}

{i}            @Override
{i}            public void onHome() {{
{i}                handleControlHome();
{i}            }}

{i}            @Override
{i}            public void onRecents() {{
{i}                showCarRecents();
{i}            }}
{i}        }});

{i}carSystemUI.attach();"""
              s=s[:m.start()]+injection+s[m.end():]

          if "private void showCarRecents()" not in s:
              marker="    private void launchProjection("
              if marker not in s:
                  raise SystemExit("ERROR: launchProjection marker not found")
              method="""    private void showCarRecents() {
        if (session == null || !session.isActive()) {
            return;
        }

        if (carRecents != null) {
            carRecents.hide();
            carRecents = null;
            return;
        }

        carRecents = new CarRecents(
                this,
                projectionLayer,
                new RootShellSession(),
                session.getDisplayId(),
                getPackageName(),
                new CarRecents.Callback() {
                    @Override
                    public void onTaskSelected(ComponentName component) {
                        carRecents = null;
                    }

                    @Override
                    public void onClose() {
                        carRecents = null;
                    }
                });

        carRecents.show();
    }

"""
              s=s.replace(marker,method+marker,1)

          if "carRecents.hide();" not in s:
              on_destroy=s.find("    @Override\n    public void onDestroy()")
              if on_destroy < 0:
                  on_destroy=s.find("    @Override\n    protected void onDestroy()")
              if on_destroy < 0:
                  raise SystemExit("ERROR: onDestroy marker not found")

              tail=s[on_destroy:]
              pos=tail.find("super.onDestroy();")
              if pos < 0:
                  raise SystemExit("ERROR: super.onDestroy marker not found")

              abspos=on_destroy+pos
              inject="""if (carRecents != null) {
            carRecents.hide();
            carRecents = null;
        }

        if (carSystemUI != null) {
            carSystemUI.detach();
            carSystemUI = null;
        }

        """
              s=s[:abspos]+inject+s[abspos:]

          p.write_text(s)
          PY

      - name: Verify architecture
        shell: bash
        run: |
          set -euo pipefail
          CAR="v10-source/app/src/main/java/com/hieptran/aacast/doudou/CarRecents.java"
          ACT="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          PROJ="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          test -f "$CAR"
          grep -q "class CarRecents" "$CAR"
          grep -q "dumpsys activity recents" "$CAR"
          grep -q "/system/bin/am task" "$CAR"
          grep -q "displayId" "$CAR"
          grep -q "new CarRecents" "$ACT"
          grep -q "showCarRecents" "$ACT"
          grep -q "getDisplayId()" "$PROJ"

          if grep -nE "KEYCODE_APP_SWITCH|input keyevent 187" "$CAR" "$ACT"; then
            echo "ERROR: global APP_SWITCH mechanism detected."
            exit 1
          fi

          echo "CarSystemUI-2 CarRecents verification PASSED."

      - name: Compile Java
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon --stacktrace

      - name: Build APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Locate APK and SHA256
        shell: bash
        run: |
          set -euo pipefail
          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "APK=$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-CarSystemUI-2-CarRecents
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
