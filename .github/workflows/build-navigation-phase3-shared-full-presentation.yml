name: Phase 3 - Shared Full Presentation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-navigation-phase3-shared-full-presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      # ============================================================
      # 1. CHECKOUT IMMUTABLE NAVIGATION BASELINE
      # ============================================================
      - name: Checkout immutable Navigation baseline 37607447583
        uses: actions/checkout@v4
        with:
          ref: d69dc922696a4876dbc1000154ce230b220a0ecd
          fetch-depth: 1

      - name: Verify immutable baseline
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="d69dc922696a4876dbc1000154ce230b220a0ecd"
          ACTUAL="$(git rev-parse HEAD)"

          echo "Expected baseline: $EXPECTED"
          echo "Actual baseline:   $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Wrong baseline."
            exit 1
          fi

          echo "PASS: Baseline = run 37607447583."
          echo "PASS: Commit = $ACTUAL."

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. VERIFY BASELINE SOURCE
      # ============================================================
      - name: Verify baseline Navigation source
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source"
          JAVA_SRC="$SRC/app/src/main/java/com/hieptran/aacast/doudou"

          test -d "$SRC"
          test -f "$SRC/gradlew"
          test -f "$SRC/app/build.gradle"
          test -f "$SRC/app/src/main/AndroidManifest.xml"

          test -f "$JAVA_SRC/NavigationMapView.java"
          test -f "$JAVA_SRC/V10CarActivity.java"
          test -f "$JAVA_SRC/V10LauncherActivity.java"

          echo "PASS: V10 source exists."
          echo "PASS: NavigationMapView exists."
          echo "PASS: V10CarActivity exists."
          echo "PASS: V10LauncherActivity exists."

      # ============================================================
      # 4. LOCK NAVIGATION CORE
      # ============================================================
      - name: Lock NavigationMapView CORE
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          BEFORE="$(sha256sum "$FILE" | awk '{print $1}')"

          EXPECTED_CORE="f65ed2bbce98b443458c5d9d11b07c1099ecb97e6699dd324875f451f4caf163"

          echo "NavigationMapView actual SHA256:"
          echo "$BEFORE"

          if [ "$BEFORE" != "$EXPECTED_CORE" ]; then
            echo "ERROR: NavigationMapView is not the immutable baseline version."
            exit 1
          fi

          echo "$BEFORE  $FILE" > /tmp/navigation_core.sha256

          grep -Fq "class NavigationMapView" "$FILE"
          grep -Fq "MapLibre.getInstance" "$FILE"
          grep -Fq "https://tiles.openfreemap.org/styles/liberty" "$FILE"
          grep -Fq "nominatim.openstreetmap.org" "$FILE"
          grep -Fq "SpeechRecognizer" "$FILE"
          grep -Fq '"vi-VN"' "$FILE"

          grep -Fq "public void zoomIn()" "$FILE"
          grep -Fq "public void zoomOut()" "$FILE"
          grep -Fq "public void recenter()" "$FILE"

          grep -Fq "public void onHostResume()" "$FILE"
          grep -Fq "public void onHostPause()" "$FILE"
          grep -Fq "public void onHostDestroy()" "$FILE"

          echo "PASS: Navigation CORE SHA locked."
          echo "PASS: Navigation CORE API verified."

      # ============================================================
      # 5. VERIFY ANDROID AUTO HOST
      # ============================================================
      - name: Verify Android Auto host before patch
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq "public final class V10CarActivity" "$FILE"
          grep -Fq "extends CarActivity" "$FILE"
          grep -Fq "private NavigationMapView navigationMap;" "$FILE"

          echo "PASS: V10CarActivity is Android Auto host."

      # ============================================================
      # 6. VERIFY PHONE HOST
      # ============================================================
      - name: Verify Phone host before patch
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"

          grep -Fq "public final class V10LauncherActivity" "$FILE"
          grep -Fq "extends Activity" "$FILE"

          echo "PASS: V10LauncherActivity is Phone host."

      # ============================================================
      # 7. CREATE SHARED FULL PRESENTATION
      #
      # IMPORTANT:
      # - One Presentation class.
      # - No PHONE_SUBSET.
      # - No Android Auto-specific UI copy.
      # - No Phone-specific UI copy.
      # - Navigation CORE remains NavigationMapView.
      # ============================================================
      - name: Create Shared Full Navigation Presentation
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationPresentationView.java"

          cat > "$FILE" <<'JAVA'
          package com.carassistant.v10;

          import android.content.Context;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          /**
           * Shared Full Navigation Presentation.
           *
           * This is the SINGLE canonical Navigation UI.
           *
           * Android Auto and Phone both host this same class.
           *
           * NavigationMapView remains the Navigation CORE.
           *
           * No Navigation engine/provider is duplicated here.
           */
          public final class NavigationPresentationView
                  extends FrameLayout {

              private NavigationMapView navigationMap;

              private TextView routeStatus;
              private TextView gpsStatus;

              private TextView title;

              private LinearLayout topBar;
              private LinearLayout controls;
              private LinearLayout bottomBar;

              public NavigationPresentationView(
                      Context context) {

                  super(context);

                  setClickable(false);
                  setFocusable(false);

                  buildPresentation();
              }

              /**
               * Bind the shared Navigation CORE.
               */
              public void setNavigationMap(
                      NavigationMapView map) {

                  navigationMap = map;
              }

              /**
               * Shared route state.
               */
              public void setRouteStatus(
                      String status) {

                  if (routeStatus == null) {
                      return;
                  }

                  routeStatus.setText(
                          status == null
                                  ? ""
                                  : status);
              }

              /**
               * Shared GPS state.
               */
              public void setGpsStatus(
                      String status) {

                  if (gpsStatus == null) {
                      return;
                  }

                  gpsStatus.setText(
                          status == null
                                  ? ""
                                  : status);
              }

              /**
               * Build the COMPLETE Presentation once.
               *
               * Both hosts use this exact UI.
               */
              private void buildPresentation() {

                  // ==================================================
                  // TOP BAR
                  // ==================================================

                  topBar =
                          new LinearLayout(getContext());

                  topBar.setOrientation(
                          LinearLayout.HORIZONTAL);

                  topBar.setGravity(
                          Gravity.CENTER_VERTICAL);

                  topBar.setPadding(
                          dp(16),
                          dp(8),
                          dp(16),
                          dp(8));

                  topBar.setBackground(
                          background(
                                  Color.argb(
                                          205,
                                          10,
                                          16,
                                          22),
                                  dp(16)));

                  title =
                          text(
                                  "CAR ASSISTANT",
                                  16,
                                  Color.WHITE);

                  title.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD);

                  topBar.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  0,
                                  -1,
                                  1f));

                  gpsStatus =
                          text(
                                  "GPS",
                                  12,
                                  Color.WHITE);

                  gpsStatus.setGravity(
                          Gravity.CENTER);

                  topBar.addView(
                          gpsStatus,
                          new LinearLayout.LayoutParams(
                                  dp(70),
                                  -1));

                  FrameLayout.LayoutParams topParams =
                          new FrameLayout.LayoutParams(
                                  -1,
                                  dp(54),
                                  Gravity.TOP);

                  topParams.setMargins(
                          dp(18),
                          dp(14),
                          dp(18),
                          0);

                  addView(
                          topBar,
                          topParams);

                  // ==================================================
                  // RIGHT NAVIGATION CONTROLS
                  // ==================================================

                  controls =
                          new LinearLayout(getContext());

                  controls.setOrientation(
                          LinearLayout.VERTICAL);

                  controls.setGravity(
                          Gravity.CENTER);

                  addControl(
                          controls,
                          "+",
                          "Zoom in",
                          v -> {

                              if (navigationMap != null) {
                                  navigationMap.zoomIn();
                              }
                          });

                  addControl(
                          controls,
                          "−",
                          "Zoom out",
                          v -> {

                              if (navigationMap != null) {
                                  navigationMap.zoomOut();
                              }
                          });

                  addControl(
                          controls,
                          "◎",
                          "Recenter",
                          v -> {

                              if (navigationMap != null) {
                                  navigationMap.recenter();
                              }
                          });

                  FrameLayout.LayoutParams controlParams =
                          new FrameLayout.LayoutParams(
                                  dp(62),
                                  -2,
                                  Gravity.TOP | Gravity.END);

                  controlParams.setMargins(
                          0,
                          dp(82),
                          dp(18),
                          0);

                  addView(
                          controls,
                          controlParams);

                  // ==================================================
                  // BOTTOM ROUTE STATUS
                  // ==================================================

                  bottomBar =
                          new LinearLayout(getContext());

                  bottomBar.setOrientation(
                          LinearLayout.VERTICAL);

                  bottomBar.setGravity(
                          Gravity.CENTER_VERTICAL);

                  bottomBar.setPadding(
                          dp(16),
                          dp(8),
                          dp(16),
                          dp(8));

                  bottomBar.setBackground(
                          background(
                                  Color.argb(
                                          205,
                                          10,
                                          16,
                                          22),
                                  dp(16)));

                  routeStatus =
                          text(
                                  "Sẵn sàng dẫn đường",
                                  14,
                                  Color.WHITE);

                  routeStatus.setGravity(
                          Gravity.CENTER_VERTICAL);

                  bottomBar.addView(
                          routeStatus,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(36)));

                  FrameLayout.LayoutParams bottomParams =
                          new FrameLayout.LayoutParams(
                                  -1,
                                  dp(58),
                                  Gravity.BOTTOM);

                  bottomParams.setMargins(
                          dp(18),
                          0,
                          dp(18),
                          dp(16));

                  addView(
                          bottomBar,
                          bottomParams);
              }

              private void addControl(
                      LinearLayout parent,
                      String label,
                      String description,
                      View.OnClickListener listener) {

                  TextView button =
                          text(
                                  label,
                                  25,
                                  Color.WHITE);

                  button.setGravity(
                          Gravity.CENTER);

                  button.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD);

                  button.setContentDescription(
                          description);

                  button.setClickable(true);
                  button.setFocusable(true);

                  GradientDrawable bg =
                          background(
                                  Color.argb(
                                          190,
                                          20,
                                          30,
                                          40),
                                  dp(14));

                  bg.setStroke(
                          dp(1),
                          Color.argb(
                                  150,
                                  80,
                                  170,
                                  230));

                  button.setBackground(bg);

                  button.setOnClickListener(
                          listener);

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  dp(58),
                                  dp(58));

                  params.setMargins(
                          0,
                          dp(3),
                          0,
                          dp(3));

                  parent.addView(
                          button,
                          params);
              }

              private TextView text(
                      String value,
                      float size,
                      int color) {

                  TextView view =
                          new TextView(getContext());

                  view.setText(value);
                  view.setTextSize(size);
                  view.setTextColor(color);

                  return view;
              }

              private GradientDrawable background(
                      int color,
                      float radius) {

                  GradientDrawable drawable =
                          new GradientDrawable();

                  drawable.setColor(color);
                  drawable.setCornerRadius(radius);

                  return drawable;
              }

              private int dp(float value) {

                  return Math.round(
                          value
                                  * getResources()
                                          .getDisplayMetrics()
                                          .density);
              }
          }
          JAVA

          test -s "$FILE"

          if grep -Fq "PHONE_SUBSET" "$FILE"; then
            echo "ERROR: PHONE_SUBSET must not exist."
            exit 1
          fi

          if grep -Fq "Mode" "$FILE"; then
            echo "ERROR: Host-specific Presentation mode detected."
            exit 1
          fi

          echo "PASS: Shared Full Presentation created."
          echo "PASS: No PHONE_SUBSET."
          echo "PASS: No host-specific Presentation mode."

      # ============================================================
      # 8. PATCH ANDROID AUTO HOST
      # ============================================================
      - name: Attach Shared Presentation to Android Auto
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          s = path.read_text(encoding="utf-8")

          # --------------------------------------------------------
          # 1. Add Presentation field
          # --------------------------------------------------------
          if "private NavigationPresentationView navigationPresentation;" not in s:

              anchor = re.compile(
                  r"(\s*private\s+NavigationMapView\s+navigationMap\s*;)"
              )

              m = anchor.search(s)

              if not m:
                  raise SystemExit(
                      "ERROR: Android Auto NavigationMapView field anchor not found."
                  )

              s = (
                  s[:m.end()]
                  + "\n    private NavigationPresentationView navigationPresentation;"
                  + s[m.end():]
              )

          # --------------------------------------------------------
          # 2. Add Presentation into existing dashboard main
          # --------------------------------------------------------
          if "navigationPresentation.setNavigationMap(navigationMap);" not in s:

              anchor = re.compile(
                  r"(FrameLayout\s+main\s*=\s*new\s+FrameLayout\s*\(\s*this\s*\)\s*;\s*"
                  r"dashboard\.addView\s*\(\s*main\s*,\s*new\s+LinearLayout\.LayoutParams\s*\(\s*0\s*,\s*-1\s*,\s*1f\s*\)\s*\)\s*;)",
                  re.DOTALL
              )

              m = anchor.search(s)

              if not m:
                  raise SystemExit(
                      "ERROR: Android Auto dashboard main anchor not found."
                  )

              replacement = (
                  m.group(1)
                  + "\n\n"
                  + "        navigationPresentation = new NavigationPresentationView(this);"
                  + "\n"
                  + "        navigationPresentation.setNavigationMap(navigationMap);"
                  + "\n"
                  + "        main.addView("
                  + "navigationPresentation,"
                  + " new FrameLayout.LayoutParams(-1, -1));"
              )

              s = (
                  s[:m.start()]
                  + replacement
                  + s[m.end():]
              )

          path.write_text(
              s,
              encoding="utf-8"
          )
          PY

          grep -Fq \
            "private NavigationPresentationView navigationPresentation;" \
            "$FILE"

          grep -Fq \
            "navigationPresentation.setNavigationMap(navigationMap);" \
            "$FILE"

          grep -Fq \
            "new NavigationPresentationView(this)" \
            "$FILE"

          echo "PASS: Android Auto uses Shared Full Presentation."

      # ============================================================
      # 9. PATCH PHONE HOST
      #
      # Phone uses THE SAME Presentation class.
      #
      # No NavigationPresentationPhone.java.
      # No Phone subset.
      # No duplicate Navigation UI.
      # ============================================================
      - name: Attach Shared Presentation to Phone
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"
          )

          s = path.read_text(encoding="utf-8")

          # --------------------------------------------------------
          # 1. Add Navigation fields
          # --------------------------------------------------------
          if "private NavigationMapView navigationMap;" not in s:

              anchor = re.compile(
                  r"(\s*private\s+LinearLayout\s+dock\s*;)"
              )

              m = anchor.search(s)

              if not m:
                  raise SystemExit(
                      "ERROR: Phone dock field anchor not found."
                  )

              addition = (
                  "\n"
                  "    private NavigationMapView navigationMap;\n"
                  "    private NavigationPresentationView navigationPresentation;"
              )

              s = (
                  s[:m.end()]
                  + addition
                  + s[m.end():]
              )

          # --------------------------------------------------------
          # 2. Create Navigation CORE + Shared Presentation
          #
          # Add after root is created and before dashboard UI.
          # --------------------------------------------------------
          if "new NavigationPresentationView(this)" not in s:

              anchor = re.compile(
                  r"(root\.setBackgroundColor\s*\(\s*Color\.rgb\s*\(\s*7\s*,\s*9\s*,\s*12\s*\)\s*\)\s*;)",
                  re.DOTALL
              )

              m = anchor.search(s)

              if not m:
                  raise SystemExit(
                      "ERROR: Phone root background anchor not found."
                  )

              addition = (
                  "\n\n"
                  "        navigationMap = new NavigationMapView(this);"
                  "\n"
                  "        navigationPresentation = new NavigationPresentationView(this);"
                  "\n"
                  "        navigationPresentation.setNavigationMap(navigationMap);"
              )

              s = (
                  s[:m.end()]
                  + addition
                  + s[m.end():]
              )

          # --------------------------------------------------------
          # 3. Add Presentation as the final Phone Navigation host.
          #
          # It is added after dashboard/app panel construction so
          # the canonical Navigation Presentation is the visible
          # Phone Navigation surface.
          # --------------------------------------------------------
          if "root.addView(navigationPresentation" not in s:

              anchor = re.compile(
                  r"(buildDashboard\s*\(\s*\)\s*;\s*"
                  r"buildAppPanel\s*\(\s*\)\s*;\s*"
                  r"setContentView\s*\(\s*root\s*\)\s*;)",
                  re.DOTALL
              )

              m = anchor.search(s)

              if not m:
                  raise SystemExit(
                      "ERROR: Phone buildUi final anchor not found."
                  )

              replacement = (
                  "buildDashboard();"
                  "\n"
                  "        buildAppPanel();"
                  "\n\n"
                  "        root.addView("
                  "\n"
                  "                navigationMap,"
                  "\n"
                  "                new android.widget.FrameLayout.LayoutParams("
                  "\n"
                  "                        -1,"
                  "\n"
                  "                        -1));"
                  "\n\n"
                  "        root.addView("
                  "\n"
                  "                navigationPresentation,"
                  "\n"
                  "                new android.widget.FrameLayout.LayoutParams("
                  "\n"
                  "                        -1,"
                  "\n"
                  "                        -1));"
                  "\n\n"
                  "        setContentView(root);"
              )

              s = (
                  s[:m.start()]
                  + replacement
                  + s[m.end():]
              )

          # --------------------------------------------------------
          # 4. Add Phone lifecycle
          # --------------------------------------------------------
          if "navigationMap.onHostResume();" not in s:

              anchor = re.compile(
                  r"(\s*handler\.post\(\s*clockTicker\s*\)\s*;)"
              )

              m = anchor.search(s)

              if not m:
                  raise SystemExit(
                      "ERROR: Phone onCreate lifecycle anchor not found."
                  )

              s = (
                  s[:m.end()]
                  + "\n\n"
                  "        if (navigationMap != null) {"
                  "\n"
                  "            navigationMap.onHostResume();"
                  "\n"
                  "        }"
                  + s[m.end():]
              )

          if "protected void onPause()" not in s:

              anchor = re.compile(
                  r"(\s*@Override\s*\n\s*protected\s+void\s+onDestroy\s*\(\s*\)\s*\{)"
              )

              m = anchor.search(s)

              if not m:
                  raise SystemExit(
                      "ERROR: Phone onDestroy anchor not found."
                  )

              pause_block = (
                  "\n"
                  "    @Override\n"
                  "    protected void onPause() {\n"
                  "\n"
                  "        if (navigationMap != null) {\n"
                  "            navigationMap.onHostPause();\n"
                  "        }\n"
                  "\n"
                  "        super.onPause();\n"
                  "    }\n"
                  "\n"
              )

              s = (
                  s[:m.start()]
                  + pause_block
                  + s[m.start():]
              )

          if "navigationMap.onHostDestroy();" not in s:

              anchor = re.compile(
                  r"(\s*handler\.removeCallbacks\(\s*clockTicker\s*\)\s*;)"
              )

              m = anchor.search(s)

              if not m:
                  raise SystemExit(
                      "ERROR: Phone onDestroy handler anchor not found."
                  )

              s = (
                  s[:m.end()]
                  + "\n\n"
                  "        if (navigationMap != null) {"
                  "\n"
                  "            navigationMap.onHostDestroy();"
                  "\n"
                  "        }"
                  + s[m.end():]
              )

          path.write_text(
              s,
              encoding="utf-8"
          )
          PY

          grep -Fq \
            "private NavigationMapView navigationMap;" \
            "$FILE"

          grep -Fq \
            "private NavigationPresentationView navigationPresentation;" \
            "$FILE"

          grep -Fq \
            "new NavigationPresentationView(this)" \
            "$FILE"

          grep -Fq \
            "navigationPresentation.setNavigationMap(navigationMap);" \
            "$FILE"

          grep -Fq \
            "navigationMap.onHostResume();" \
            "$FILE"

          grep -Fq \
            "navigationMap.onHostPause();" \
            "$FILE"

          grep -Fq \
            "navigationMap.onHostDestroy();" \
            "$FILE"

          echo "PASS: Phone uses the SAME Shared Full Presentation."
          echo "PASS: Phone uses the SAME Navigation CORE."

      # ============================================================
      # 10. VERIFY NO PHONE-SPECIFIC PRESENTATION
      # ============================================================
      - name: Verify one Presentation architecture
        shell: bash
        run: |
          set -euo pipefail

          JAVA_SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$JAVA_SRC/NavigationPresentationView.java"

          if find "$JAVA_SRC" -maxdepth 1 -type f \
              \( -name '*Phone*Presentation*.java' \
              -o -name '*Phone*Navigation*.java' \) \
              | grep -q .; then

            echo "ERROR: Phone-specific Navigation Presentation detected."
            exit 1
          fi

          if grep -R -Fq "PHONE_SUBSET" "$JAVA_SRC"; then
            echo "ERROR: PHONE_SUBSET architecture still exists."
            exit 1
          fi

          echo "PASS: Exactly one Navigation Presentation architecture."
          echo "PASS: No Phone-specific Presentation."
          echo "PASS: No PHONE_SUBSET."

      # ============================================================
      # 11. VERIFY PRESENTATION CONTAINS UI ONLY
      # ============================================================
      - name: Verify Presentation does not duplicate Navigation CORE
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationPresentationView.java"

          if grep -Eq \
            "MapLibre|SpeechRecognizer|LocationManager|FusedLocation|Nominatim|OkHttp|Retrofit|HttpURLConnection" \
            "$FILE"; then

            echo "ERROR: Presentation contains Navigation engine/provider code."
            exit 1
          fi

          grep -Fq "NavigationMapView" "$FILE"
          grep -Fq "navigationMap.zoomIn()" "$FILE"
          grep -Fq "navigationMap.zoomOut()" "$FILE"
          grep -Fq "navigationMap.recenter()" "$FILE"

          echo "PASS: Presentation depends only on Navigation CORE APIs."
          echo "PASS: No duplicated Navigation engine/provider."

      # ============================================================
      # 12. VERIFY BOTH HOSTS USE SAME PRESENTATION CLASS
      # ============================================================
      - name: Verify Android Auto and Phone share Presentation
        shell: bash
        run: |
          set -euo pipefail

          AA="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          PHONE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"

          grep -Fq \
            "new NavigationPresentationView(this)" \
            "$AA"

          grep -Fq \
            "new NavigationPresentationView(this)" \
            "$PHONE"

          grep -Fq \
            "navigationPresentation.setNavigationMap(navigationMap);" \
            "$AA"

          grep -Fq \
            "navigationPresentation.setNavigationMap(navigationMap);" \
            "$PHONE"

          echo "PASS: Android Auto uses NavigationPresentationView."
          echo "PASS: Phone uses NavigationPresentationView."
          echo "PASS: Both hosts bind the same Navigation CORE API."
          echo "PASS: UI source-of-truth is shared."

      # ============================================================
      # 13. VERIFY NAVIGATION CORE BYTE-IDENTICAL
      # ============================================================
      - name: Verify NavigationMapView remains byte-identical
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          AFTER="$(sha256sum "$FILE" | awk '{print $1}')"
          BEFORE="$(awk '{print $1}' /tmp/navigation_core.sha256)"

          echo "NavigationMapView BEFORE: $BEFORE"
          echo "NavigationMapView AFTER:  $AFTER"

          if [ "$BEFORE" != "$AFTER" ]; then
            echo "ERROR: NavigationMapView changed."
            exit 1
          fi

          echo "PASS: NavigationMapView is byte-identical."

