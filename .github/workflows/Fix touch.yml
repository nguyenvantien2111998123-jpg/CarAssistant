
name: fix touch
run-name: fix touch V2 - multi-touch forwarding

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix-touch:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout immutable baseline
        uses: actions/checkout@v4
        with:
          ref: b3528959d71cc33024db0ba0cc4fc65d1aa7d631
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify baseline SHA
        shell: bash
        run: |
          set -euo pipefail

          verify_sha() {
            local file="$1"
            local expected="$2"
            local actual

            test -f "$file"
            actual="$(git hash-object "$file")"

            echo "$file"
            echo "Expected: $expected"
            echo "Actual:   $actual"

            if [ "$actual" != "$expected" ]; then
              echo "FAIL: baseline SHA mismatch; refusing to patch"
              exit 1
            fi
          }

          verify_sha \
            ".github/workflows/build-v10-carassistant-keyboard-pass.yml" \
            "668362096c408b425d12429e987af4a293bb1667"

          verify_sha \
            "v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java" \
            "61e82df0fd17e7851c7bf1628ac03a9391e48523"

          verify_sha \
            "v10-source/app/src/main/java/com/carassistant/v10/V10ProjectionSession.java" \
            "27a9ff439fb450750d49f35a546eab3bc2745b4d"

          verify_sha \
            "v10-source/app/src/main/java/com/carassistant/v10/V10InputController.java" \
            "6638fd6152fcad460f9f98c9e9f62ae80bb20bfe"

          verify_sha \
            "v10-source/app/src/main/java/com/carassistant/v10/hook/InputHooks.java" \
            "d99683ce631b1d7210327bcb23a9b2f41753f359"

          verify_sha \
            "v10-source/app/src/main/java/com/carassistant/v10/V10DisplayController.java" \
            "1a35bcaa7db0a5f892e56006f740b4ebf727be8a"

          echo "PASS: immutable baseline verified"

      - name: Patch multi-touch controller and session
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          base = Path(
              "v10-source/app/src/main/java/com/carassistant/v10"
          )

          controller = base / "V10InputController.java"

          controller_source = r'''package com.carassistant.v10;

          import android.view.MotionEvent;
          import android.view.View;

          public final class V10InputController {

              private final V10ProjectionSession session;

              private float downX;
              private float downY;
              private long downTime;

              private boolean moved;
              private boolean multiTouch;

              private static final float MOVE_SLOP = 12f;
              private static final long SWIPE_MIN_DURATION = 80L;
              private static final long SWIPE_MAX_DURATION = 800L;

              public V10InputController(V10ProjectionSession session) {
                  this.session = session;
              }

              public View.OnTouchListener createListener() {
                  return (view, event) -> {
                      switch (event.getActionMasked()) {
                          case MotionEvent.ACTION_DOWN:
                              downX = event.getX(0);
                              downY = event.getY(0);
                              downTime = event.getEventTime();
                              moved = false;
                              multiTouch = false;
                              return true;

                          case MotionEvent.ACTION_POINTER_DOWN:
                              if (!multiTouch) {
                                  multiTouch = true;

                                  MotionEvent firstDown = MotionEvent.obtain(
                                      event.getDownTime(),
                                      event.getEventTime(),
                                      MotionEvent.ACTION_DOWN,
                                      event.getX(0),
                                      event.getY(0),
                                      event.getMetaState()
                                  );

                                  try {
                                      firstDown.setSource(event.getSource());
                                      session.injectTouchEvent(firstDown);
                                  } finally {
                                      firstDown.recycle();
                                  }
                              }

                              session.injectTouchEvent(event);
                              return true;

                          case MotionEvent.ACTION_MOVE:
                              if (multiTouch) {
                                  session.injectTouchEvent(event);
                                  return true;
                              }

                              if (event.getPointerCount() == 1) {
                                  float dx = event.getX(0) - downX;
                                  float dy = event.getY(0) - downY;

                                  if (Math.abs(dx) > MOVE_SLOP
                                          || Math.abs(dy) > MOVE_SLOP) {
                                      moved = true;
                                  }
                              }
                              return true;

                          case MotionEvent.ACTION_POINTER_UP:
                              if (multiTouch) {
                                  session.injectTouchEvent(event);
                              }
                              return true;

                          case MotionEvent.ACTION_UP:
                              if (multiTouch) {
                                  session.injectTouchEvent(event);
                                  multiTouch = false;
                                  moved = false;
                                  return true;
                              }

                              float upX = event.getX(0);
                              float upY = event.getY(0);
                              long duration = event.getEventTime() - downTime;

                              if (!moved) {
                                  session.tap(upX, upY);
                              } else {
                                  duration = Math.max(
                                      SWIPE_MIN_DURATION,
                                      Math.min(SWIPE_MAX_DURATION, duration)
                                  );

                                  session.swipe(
                                      downX, downY, upX, upY, duration
                                  );
                              }
                              return true;

                          case MotionEvent.ACTION_CANCEL:
                              if (multiTouch) {
                                  session.injectTouchEvent(event);
                              }
                              multiTouch = false;
                              moved = false;
                              return true;

                          default:
                              return true;
                      }
                  };
              }
          }
          '''

          controller.write_text(controller_source, encoding="utf-8")

          session = base / "V10ProjectionSession.java"
          source = session.read_text(encoding="utf-8")

          import_anchor = "import android.content.Context;\n"
          import_addition = (
              "import android.hardware.input.InputManager;\n"
              "import android.view.InputEvent;\n"
              "import android.view.MotionEvent;\n"
              "import java.lang.reflect.Method;\n"
          )

          if source.count(import_anchor) != 1:
              raise SystemExit("FAIL: Context import anchor mismatch")

          for line in import_addition.splitlines():
              if line not in source:
                  source = source.replace(
                      import_anchor,
                      import_anchor + line + "\n",
                      1
                  )

          method_anchor = (
              "    public int getDisplayId() "
              "{ return displayController.getDisplayId(); }\n"
          )

          method_addition = r'''
              /**
               * Forward all pointers to the projected virtual display.
               * InputHooks resolves the target display when event displayId
               * is zero, then validates and injects a cloned event.
               */
              public void injectTouchEvent(MotionEvent source) {
                  if (!isActive() || source == null || textureView == null) {
                      return;
                  }

                  MotionEvent mapped = null;

                  try {
                      int count = source.getPointerCount();

                      MotionEvent.PointerProperties[] properties =
                          new MotionEvent.PointerProperties[count];

                      MotionEvent.PointerCoords[] coords =
                          new MotionEvent.PointerCoords[count];

                      for (int i = 0; i < count; i++) {
                          properties[i] = new MotionEvent.PointerProperties();
                          coords[i] = new MotionEvent.PointerCoords();

                          source.getPointerProperties(i, properties[i]);
                          source.getPointerCoords(i, coords[i]);

                          coords[i].x = mapX(coords[i].x);
                          coords[i].y = mapY(coords[i].y);
                      }

                      mapped = MotionEvent.obtain(
                          source.getDownTime(),
                          source.getEventTime(),
                          source.getAction(),
                          count,
                          properties,
                          coords,
                          source.getMetaState(),
                          source.getButtonState(),
                          source.getXPrecision(),
                          source.getYPrecision(),
                          source.getDeviceId(),
                          source.getEdgeFlags(),
                          source.getSource(),
                          source.getFlags()
                      );

                      InputManager manager = (InputManager)
                          textureView.getContext().getSystemService(
                              Context.INPUT_SERVICE
                          );

                      if (manager == null) {
                          throw new IllegalStateException(
                              "InputManager unavailable"
                          );
                      }

                      Method inject = InputManager.class.getDeclaredMethod(
                          "injectInputEvent",
                          InputEvent.class,
                          int.class
                      );

                      inject.setAccessible(true);
                      Object result = inject.invoke(manager, mapped, 0);

                      Log.d(
                          TAG,
                          "[MULTITOUCH] action="
                              + source.getActionMasked()
                              + " pointers=" + count
                              + " display=" + displayController.getDisplayId()
                              + " result=" + result
                      );

                  } catch (Throwable t) {
                      Log.w(TAG, "[MULTITOUCH] Injection failed", t);
                  } finally {
                      if (mapped != null) {
                          mapped.recycle();
                      }
                  }
              }

          '''

          if source.count(method_anchor) != 1:
              raise SystemExit("FAIL: getDisplayId anchor mismatch")

          source = source.replace(
              method_anchor,
              method_anchor + method_addition,
              1
          )

          session.write_text(source, encoding="utf-8")
          print("PASS: controller and session patched")
          PY
      - name: Patch system input hook
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import textwrap

          path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/hook/InputHooks.java"
          )
          source = path.read_text(encoding="utf-8")

          old_guard = (
              "if (Binder.getCallingUid() != 0 || mode < 0 "
              "|| mode > 2 || targetUid != -1) {"
          )
          new_guard = (
              "if (mode < 0 || mode > 2 || targetUid != -1) {"
          )

          if source.count(old_guard) != 1:
              raise SystemExit(
                  "FAIL: caller guard anchor mismatch; refusing patch"
              )

          source = source.replace(old_guard, new_guard, 1)

          pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)'
              r'int displayId = \(Integer\) '
              r'XposedHelpers\.callMethod\(event, "getDisplayId"\);'
              r'\s*if \(displayId <= 0\) \{\s*return;\s*\}'
              r'\s*try \{'
              r'\s*android\.content\.Context context = '
              r'\(android\.content\.Context\)'
              r'\s*XposedHelpers\.getObjectField\(param\.thisObject, "mContext"\);'
              r'\s*DisplayManager displayManager = \(DisplayManager\)'
              r'\s*context\.getSystemService\(android\.content\.Context\.DISPLAY_SERVICE\);'
              r'\s*Display display = displayManager == null \? null : '
              r'displayManager\.getDisplay\(displayId\);'
              r'\s*if \(display == null \|\| '
              r'display\.getState\(\) != Display\.STATE_ON'
              r'\s*\|\| !V10Display\.matches\(DisplayReflect\.ownerPackage\(display\),'
              r'\s*display\.getName\(\), DisplayReflect\.type\(display\),'
              r'\s*DisplayReflect\.ownerUid\(display\)\)\) \{\s*return;\s*\}'
          )

          replacement_body = textwrap.dedent("""
              int requestedDisplayId = (Integer)
                      XposedHelpers.callMethod(event, "getDisplayId");
              try {
                  android.content.Context context = (android.content.Context)
                          XposedHelpers.getObjectField(param.thisObject, "mContext");
                  DisplayManager displayManager = (DisplayManager)
                          context.getSystemService(android.content.Context.DISPLAY_SERVICE);

                  if (displayManager == null) {
                      return;
                  }

                  Display display = requestedDisplayId > 0
                          ? displayManager.getDisplay(requestedDisplayId)
                          : null;

                  if (requestedDisplayId <= 0) {
                      for (Display candidate : displayManager.getDisplays()) {
                          if (candidate == null
                                  || candidate.getState() != Display.STATE_ON) {
                              continue;
                          }

                          if (V10Display.matches(
                                  DisplayReflect.ownerPackage(candidate),
                                  candidate.getName(),
                                  DisplayReflect.type(candidate),
                                  DisplayReflect.ownerUid(candidate))) {
                              if (display != null) {
                                  XposedBridge.log(TAG_INPUT
                                          + " Ambiguous CarAssistant display");
                                  return;
                              }
                              display = candidate;
                          }
                      }
                  }

                  if (display == null
                          || display.getState() != Display.STATE_ON
                          || !V10Display.matches(
                                  DisplayReflect.ownerPackage(display),
                                  display.getName(),
                                  DisplayReflect.type(display),
                                  DisplayReflect.ownerUid(display))) {
                      return;
                  }

                  int displayId = display.getDisplayId();
                  int callerUid = Binder.getCallingUid();
                  int ownerUid = DisplayReflect.ownerUid(display);

                  if (callerUid != 0 && callerUid != ownerUid) {
                      XposedBridge.log(TAG_INPUT
                              + " Rejected caller uid=" + callerUid
                              + " ownerUid=" + ownerUid);
                      return;
                  }
          """).strip("\n")

          match = pattern.search(source)
          if not match:
              raise SystemExit(
                  "FAIL: display block not found; source unchanged"
              )

          if len(pattern.findall(source)) != 1:
              raise SystemExit(
                  "FAIL: expected exactly one display block; source unchanged"
              )

          indent = match.group("indent")
          replacement = textwrap.indent(replacement_body, indent)

          source = source[:match.start()] + replacement + source[match.end():]

          old_log = (
              'XposedBridge.log(TAG_INPUT + " display=" + displayId\n'
              '                                                + " nativeResult=" + result);'
          )
          new_log = (
              'XposedBridge.log(TAG_INPUT + " display=" + displayId\n'
              '                                                + " action=" + copy.getActionMasked()\n'
              '                                                + " pointers=" + copy.getPointerCount()\n'
              '                                                + " nativeResult=" + result);'
          )

          if source.count(old_log) != 1:
              raise SystemExit(
                  "FAIL: injection log anchor mismatch; source unchanged"
              )

          source = source.replace(old_log, new_log, 1)
          path.write_text(source, encoding="utf-8")
          print("PASS: system input hook patched")
          PY
      
      - name: Add app-origin injection hook
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/hook/InputHooks.java"
          )
          source = path.read_text(encoding="utf-8")

          call_anchor = (
              'XposedBridge.log(TAG_INPUT + " Root pane injection hook installed");'
          )
          helper_anchor = '    /** Clone event và gán displayId. */'

          if source.count(call_anchor) != 1:
              raise SystemExit("FAIL: install anchor mismatch")
          if source.count(helper_anchor) != 1:
              raise SystemExit("FAIL: clone helper anchor mismatch")

          source = source.replace(
              call_anchor,
              'installAppMultiTouchHook(classLoader);\n            '
              + call_anchor,
              1
          )

          helper = r'''
              private static void installAppMultiTouchHook(
                      ClassLoader classLoader) {
                  try {
                      XposedHelpers.findAndHookMethod(
                              XposedHelpers.findClass(
                                      "com.android.server.input.InputManagerService",
                                      classLoader),
                              "injectInputEvent",
                              InputEvent.class,
                              int.class,
                              new XC_MethodHook() {
                                  @Override
                                  protected void beforeHookedMethod(
                                          MethodHookParam param) {
                                      if (!(param.args[0] instanceof MotionEvent)) {
                                          return;
                                      }

                                      int mode = (Integer) param.args[1];
                                      if (mode < 0 || mode > 2) {
                                          return;
                                      }

                                      int callerUid = Binder.getCallingUid();
                                      if (callerUid == 0) {
                                          return;
                                      }

                                      MotionEvent event =
                                              (MotionEvent) param.args[0];
                                      MotionEvent copy = null;

                                      try {
                                          android.content.Context context =
                                                  (android.content.Context)
                                                  XposedHelpers.getObjectField(
                                                          param.thisObject,
                                                          "mContext");

                                          DisplayManager dm = (DisplayManager)
                                                  context.getSystemService(
                                                          android.content.Context
                                                                  .DISPLAY_SERVICE);
                                          if (dm == null) {
                                              return;
                                          }

                                          int requestedId = event.getDisplayId();
                                          Display display = requestedId > 0
                                                  ? dm.getDisplay(requestedId)
                                                  : null;

                                          if (requestedId <= 0) {
                                              for (Display candidate
                                                      : dm.getDisplays()) {
                                                  if (candidate == null
                                                          || candidate.getState()
                                                          != Display.STATE_ON
                                                          || !V10Display.matches(
                                                                  DisplayReflect
                                                                          .ownerPackage(candidate),
                                                                  candidate.getName(),
                                                                  DisplayReflect
                                                                          .type(candidate),
                                                                  DisplayReflect
                                                                          .ownerUid(candidate))) {
                                                      continue;
                                                  }

                                                  if (display != null) {
                                                      XposedBridge.log(TAG_INPUT
                                                              + " Ambiguous display");
                                                      return;
                                                  }
                                                  display = candidate;
                                              }
                                          }

                                          if (display == null
                                                  || display.getState()
                                                  != Display.STATE_ON
                                                  || !V10Display.matches(
                                                          DisplayReflect
                                                                  .ownerPackage(display),
                                                          display.getName(),
                                                          DisplayReflect.type(display),
                                                          DisplayReflect
                                                                  .ownerUid(display))) {
                                              return;
                                          }

                                          int displayId = display.getDisplayId();
                                          int ownerUid =
                                                  DisplayReflect.ownerUid(display);

                                          if (callerUid != ownerUid) {
                                              XposedBridge.log(TAG_INPUT
                                                      + " Rejected caller="
                                                      + callerUid
                                                      + " owner=" + ownerUid);
                                              return;
                                          }

                                          copy = cloneWithDisplay(event, displayId);

                                          Object nativeManager =
                                                  XposedHelpers.getObjectField(
                                                          param.thisObject,
                                                          "mNative");

                                          long token = Binder.clearCallingIdentity();
                                          try {
                                              int result = (Integer)
                                                      XposedHelpers.callMethod(
                                                              nativeManager,
                                                              "injectInputEvent",
                                                              copy,
                                                              Boolean.FALSE,
                                                              -1,
                                                              mode,
                                                              INJECT_TIMEOUT,
                                                              POLICY_FLAGS);

                                              param.setResult(result == 0);

                                              XposedBridge.log(TAG_INPUT
                                                      + " app-inject display="
                                                      + displayId
                                                      + " action="
                                                      + copy.getActionMasked()
                                                      + " pointers="
                                                      + copy.getPointerCount()
                                                      + " result=" + result);
                                          } finally {
                                              Binder.restoreCallingIdentity(token);
                                          }
                                      } catch (Throwable t) {
                                          XposedBridge.log(TAG_INPUT
                                                  + " app-inject failed: " + t);
                                      } finally {
                                          if (copy != null) {
                                              copy.recycle();
                                          }
                                      }
                                  }
                              });

                      XposedBridge.log(TAG_INPUT
                              + " App-origin multi-touch hook installed");
                  } catch (Throwable t) {
                      XposedBridge.log(TAG_INPUT
                              + " App-origin hook unavailable: " + t);
                  }
              }

          '''

          source = source.replace(
              helper_anchor,
              helper + helper_anchor,
              1
          )

          path.write_text(source, encoding="utf-8")
          print("PASS: app-origin injection hook added")
          PY

      - name: Verify patch scope
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          python3 <<'PY'
          import subprocess

          expected = {
              "v10-source/app/src/main/java/com/carassistant/v10/V10InputController.java",
              "v10-source/app/src/main/java/com/carassistant/v10/V10ProjectionSession.java",
              "v10-source/app/src/main/java/com/carassistant/v10/hook/InputHooks.java",
          }

          actual = set(subprocess.check_output(
              ["git", "diff", "--name-only"],
              text=True
          ).splitlines())

          print("Changed files:")
          for name in sorted(actual):
              print(name)

          if actual != expected:
              raise SystemExit(
                  "FAIL: unexpected changed files\n"
                  f"Expected: {sorted(expected)}\n"
                  f"Actual: {sorted(actual)}"
              )

          print("PASS: only the three touch files changed")
          PY

          echo "=== Multi-touch symbols ==="
          grep -nE \
            'ACTION_POINTER_DOWN|ACTION_POINTER_UP|injectTouchEvent|MULTITOUCH|requestedDisplayId|ownerUid' \
            v10-source/app/src/main/java/com/carassistant/v10/V10InputController.java \
            v10-source/app/src/main/java/com/carassistant/v10/V10ProjectionSession.java \
            v10-source/app/src/main/java/com/carassistant/v10/hook/InputHooks.java

      - name: Compile Java
        shell: bash
        run: |
          set -euo pipefail
          cd v10-source
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace compileDebugJavaWithJavac

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd v10-source
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Package APK and SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          mkdir -p dist
          cp "$APK" "dist/CarAssistant-Fix-Touch-V2.apk"

          sha256sum \
            "dist/CarAssistant-Fix-Touch-V2.apk" \
            > "dist/CarAssistant-Fix-Touch-V2.sha256"

          cat "dist/CarAssistant-Fix-Touch-V2.sha256"

      - name: Upload Fix Touch V2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-Fix-Touch-V2
          path: |
            dist/CarAssistant-Fix-Touch-V2.apk
            dist/CarAssistant-Fix-Touch-V2.sha256
          if-no-files-found: error
