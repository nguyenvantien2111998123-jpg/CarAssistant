

name: fix touch
run-name: fix touch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix-touch:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout selected immutable baseline
        uses: actions/checkout@v4
        with:
          ref: b3528959d71cc33024db0ba0cc4fc65d1aa7d631
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify baseline files and SHA
        shell: bash
        run: |
          set -euo pipefail

          verify_sha() {
            local file="$1"
            local expected="$2"

            if [ ! -f "$file" ]; then
              echo "FAIL: missing file: $file"
              exit 1
            fi

            local actual
            actual="$(git hash-object "$file")"

            echo "$file"
            echo "Expected: $expected"
            echo "Actual:   $actual"

            if [ "$actual" != "$expected" ]; then
              echo "FAIL: source SHA mismatch. Refusing to patch."
              exit 1
            fi

            echo "PASS: exact source verified"
          }

          verify_sha \
            ".github/workflows/build-v10-carassistant-keyboard-pass.yml" \
            "668362096c408b425d12429e987af4a293bb1667"

          verify_sha \
            "v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java" \
            "61e82df0fd17e7851c7bf1628ac03a9391e48523"

          verify_sha \
            "v10-source/app/src/main/java/com/carassistant/v10/V10ProjectionSession.java" \
            "27a9ff439fb450750d49f35a546eab3bc2745b4d"

          verify_sha \
            "v10-source/app/src/main/java/com/carassistant/v10/V10InputController.java" \
            "6638fd6152fcad460f9f98c9e9f62ae80bb20bfe"

          verify_sha \
            "v10-source/app/src/main/java/com/carassistant/v10/hook/InputHooks.java" \
            "d99683ce631b1d7210327bcb23a9b2f41753f359"

          verify_sha \
            "v10-source/app/src/main/java/com/carassistant/v10/V10DisplayController.java" \
            "1a35bcaa7db0a5f892e56006f740b4ebf727be8a"

          echo "PASS: immutable baseline verified"

      - name: Apply isolated multi-touch patch
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          base = Path(
              "v10-source/app/src/main/java/com/carassistant/v10"
          )

          controller = base / "V10InputController.java"

          controller_source = r'''package com.carassistant.v10;

          import android.view.MotionEvent;
          import android.view.View;

          public final class V10InputController {

              private final V10ProjectionSession session;

              private float downX;
              private float downY;
              private long downTime;

              private boolean moved;
              private boolean multiTouch;

              private static final float MOVE_SLOP = 12f;
              private static final long SWIPE_MIN_DURATION = 80L;
              private static final long SWIPE_MAX_DURATION = 800L;

              public V10InputController(V10ProjectionSession session) {
                  this.session = session;
              }

              public View.OnTouchListener createListener() {
                  return (view, event) -> {
                      switch (event.getActionMasked()) {
                          case MotionEvent.ACTION_DOWN:
                              downX = event.getX(0);
                              downY = event.getY(0);
                              downTime = event.getEventTime();
                              moved = false;
                              multiTouch = false;
                              return true;

                          case MotionEvent.ACTION_POINTER_DOWN:
                              if (!multiTouch) {
                                  multiTouch = true;

                                  MotionEvent firstDown = MotionEvent.obtain(
                                      event.getDownTime(),
                                      event.getEventTime(),
                                      MotionEvent.ACTION_DOWN,
                                      event.getX(0),
                                      event.getY(0),
                                      event.getMetaState()
                                  );

                                  try {
                                      firstDown.setSource(event.getSource());
                                      session.injectTouchEvent(firstDown);
                                  } finally {
                                      firstDown.recycle();
                                  }
                              }

                              session.injectTouchEvent(event);
                              return true;

                          case MotionEvent.ACTION_MOVE:
                              if (multiTouch) {
                                  session.injectTouchEvent(event);
                                  return true;
                              }

                              if (event.getPointerCount() == 1) {
                                  float dx = event.getX(0) - downX;
                                  float dy = event.getY(0) - downY;

                                  if (Math.abs(dx) > MOVE_SLOP
                                          || Math.abs(dy) > MOVE_SLOP) {
                                      moved = true;
                                  }
                              }
                              return true;

                          case MotionEvent.ACTION_POINTER_UP:
                              if (multiTouch) {
                                  session.injectTouchEvent(event);
                              }
                              return true;

                          case MotionEvent.ACTION_UP:
                              if (multiTouch) {
                                  session.injectTouchEvent(event);
                                  multiTouch = false;
                                  moved = false;
                                  return true;
                              }

                              float upX = event.getX(0);
                              float upY = event.getY(0);

                              long duration =
                                  event.getEventTime() - downTime;

                              if (!moved) {
                                  session.tap(upX, upY);
                              } else {
                                  duration = Math.max(
                                      SWIPE_MIN_DURATION,
                                      Math.min(
                                          SWIPE_MAX_DURATION,
                                          duration
                                      )
                                  );

                                  session.swipe(
                                      downX,
                                      downY,
                                      upX,
                                      upY,
                                      duration
                                  );
                              }

                              return true;

                          case MotionEvent.ACTION_CANCEL:
                              if (multiTouch) {
                                  session.injectTouchEvent(event);
                              }

                              multiTouch = false;
                              moved = false;
                              return true;

                          default:
                              return true;
                      }
                  };
              }
          }
          '''

          controller.write_text(controller_source, encoding="utf-8")

          session = base / "V10ProjectionSession.java"
          source = session.read_text(encoding="utf-8")

          import_anchor = "import android.content.Context;\n"
          import_addition = (
              "import android.hardware.input.InputManager;\n"
              "import android.view.InputEvent;\n"
              "import android.view.MotionEvent;\n"
              "import java.lang.reflect.Method;\n"
          )

          if source.count(import_anchor) != 1:
              raise SystemExit(
                  "FAIL: Context import anchor is not unique"
              )

          source = source.replace(
              import_anchor,
              import_anchor + import_addition,
              1
          )

          method_anchor = (
              "    public int getDisplayId() "
              "{ return displayController.getDisplayId(); }\n"
          )

          method_addition = r'''
              /**
               * Inject a complete MotionEvent, retaining all pointers.
               * Coordinates are mapped to the projection content size.
               */
              public void injectTouchEvent(MotionEvent source) {
                  if (!isActive() || source == null || textureView == null) {
                      return;
                  }

                  MotionEvent mapped = null;

                  try {
                      int count = source.getPointerCount();

                      MotionEvent.PointerProperties[] properties =
                          new MotionEvent.PointerProperties[count];

                      MotionEvent.PointerCoords[] coords =
                          new MotionEvent.PointerCoords[count];

                      for (int i = 0; i < count; i++) {
                          properties[i] = new MotionEvent.PointerProperties();
                          coords[i] = new MotionEvent.PointerCoords();

                          source.getPointerProperties(i, properties[i]);
                          source.getPointerCoords(i, coords[i]);

                          coords[i].x = mapX(coords[i].x);
                          coords[i].y = mapY(coords[i].y);
                      }

                      mapped = MotionEvent.obtain(
                          source.getDownTime(),
                          source.getEventTime(),
                          source.getAction(),
                          count,
                          properties,
                          coords,
                          source.getMetaState(),
                          source.getButtonState(),
                          source.getXPrecision(),
                          source.getYPrecision(),
                          source.getDeviceId(),
                          source.getEdgeFlags(),
                          source.getSource(),
                          source.getFlags()
                      );

                      InputEvent.class
                          .getDeclaredMethod("setDisplayId", int.class)
                          .invoke(mapped, displayController.getDisplayId());

                      InputManager manager = (InputManager)
                          textureView.getContext().getSystemService(
                              Context.INPUT_SERVICE
                          );

                      if (manager == null) {
                          throw new IllegalStateException(
                              "InputManager unavailable"
                          );
                      }

                      Method inject = InputManager.class.getDeclaredMethod(
                          "injectInputEvent",
                          InputEvent.class,
                          int.class
                      );

                      inject.setAccessible(true);
                      inject.invoke(manager, mapped, 0);

                  } catch (Throwable t) {
                      Log.w(TAG, "Multi-touch injection failed", t);
                  } finally {
                      if (mapped != null) {
                          mapped.recycle();
                      }
                  }
              }

          '''

          if source.count(method_anchor) != 1:
              raise SystemExit(
                  "FAIL: getDisplayId anchor is not unique"
              )

          source = source.replace(
              method_anchor,
              method_anchor + method_addition,
              1
          )

          session.write_text(source, encoding="utf-8")

          hooks = base / "hook" / "InputHooks.java"
          source = hooks.read_text(encoding="utf-8")

          old_guard = (
              "if (Binder.getCallingUid() != 0 || mode < 0 "
              "|| mode > 2 || targetUid != -1) {"
          )

          new_guard = (
              "if (mode < 0 || mode > 2 || targetUid != -1) {"
          )

          if source.count(old_guard) != 1:
              raise SystemExit(
                  "FAIL: InputHooks caller guard is not unique"
              )

          source = source.replace(old_guard, new_guard, 1)

          display_anchor = (
              "                                        display.getName(), "
              "DisplayReflect.type(display),\n"
              "                                        DisplayReflect.ownerUid(display))) {\n"
              "                                    return;\n"
              "                                }\n"
          )

          display_addition = (
              "                                int callerUid = Binder.getCallingUid();\n"
              "                                int ownerUid = DisplayReflect.ownerUid(display);\n"
              "                                if (callerUid != 0 && callerUid != ownerUid) {\n"
              "                                    return;\n"
              "                                }\n"
          )

          if source.count(display_anchor) != 1:
              raise SystemExit(
                  "FAIL: InputHooks display-validation anchor is not unique"
              )

          source = source.replace(
              display_anchor,
              display_anchor + display_addition,
              1
          )

          hooks.write_text(source, encoding="utf-8")

          print("PASS: isolated touch patch applied")
          PY

      - name: Verify patch scope and whitespace
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          echo "Changed files:"
          git diff --name-only

          python3 <<'PY'
          import subprocess

          expected = {
              "v10-source/app/src/main/java/com/carassistant/v10/V10InputController.java",
              "v10-source/app/src/main/java/com/carassistant/v10/V10ProjectionSession.java",
              "v10-source/app/src/main/java/com/carassistant/v10/hook/InputHooks.java",
          }

          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only"],
                  text=True
              ).splitlines()
          )

          if changed != expected:
              raise SystemExit(
                  "FAIL: unexpected patch scope\n"
                  f"Expected: {sorted(expected)}\n"
                  f"Actual: {sorted(changed)}"
              )

          print("PASS: only the three touch-path files changed")
          PY

          git diff -- \
            v10-source/app/src/main/java/com/carassistant/v10/V10InputController.java \
            v10-source/app/src/main/java/com/carassistant/v10/V10ProjectionSession.java \
            v10-source/app/src/main/java/com/carassistant/v10/hook/InputHooks.java

      - name: Compile Java
        shell: bash
        run: |
          set -euo pipefail

          cd v10-source
          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            compileDebugJavaWithJavac

      - name: Build installable debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd v10-source
          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Package APK and SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"
          mkdir -p dist

          cp "$APK" "dist/CarAssistant-Fix-Touch.apk"

          sha256sum \
            "dist/CarAssistant-Fix-Touch.apk" \
            > "dist/CarAssistant-Fix-Touch.sha256"

          echo "APK SHA256:"
          cat "dist/CarAssistant-Fix-Touch.sha256"

      - name: Upload Fix Touch artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-Fix-Touch
          path: |
            dist/CarAssistant-Fix-Touch.apk
            dist/CarAssistant-Fix-Touch.sha256
          if-no-files-found: error
