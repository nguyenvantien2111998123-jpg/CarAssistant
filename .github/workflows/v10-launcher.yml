name: Build Car Assistant V10 Launcher - Run

on:
  workflow_dispatch:

env:
  GRADLE_VERSION: "8.13"

jobs:
  build:
    name: Build V10 Launcher
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================
      - name: Checkout CarAssistant
        uses: actions/checkout@v4

      # ==================================================
      # 2. JDK 17
      # ==================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==================================================
      # 3. GRADLE 8.13
      # ==================================================
      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-disabled: true

      - name: Verify Gradle
        run: |
          gradle --version

          VERSION="$(gradle --version | awk '/^Gradle / {print $2}')"

          echo "Gradle version: $VERSION"

          test "$VERSION" = "8.13"

      # ==================================================
      # 4. CHECK V9 SOURCE ZIP
      # ==================================================
      - name: Check V9 source ZIP
        run: |
          echo "Checking CarAssistant-V9-Source.zip"

          test -f "CarAssistant-V9-Source.zip"

          ls -lh "CarAssistant-V9-Source.zip"

      # ==================================================
      # 5. EXTRACT OUTER ZIP
      # ==================================================
      - name: Extract outer V9 ZIP
        run: |
          rm -rf /tmp/v9-work

          mkdir -p /tmp/v9-work/outer
          mkdir -p /tmp/v9-work/source

          unzip -q \
            "CarAssistant-V9-Source.zip" \
            -d /tmp/v9-work/outer

          echo "Outer ZIP contents:"

          find /tmp/v9-work/outer \
            -maxdepth 4 \
            -type f \
            -print

      # ==================================================
      # 6. FIND INNER ZIP
      # ==================================================
      - name: Find inner V9 ZIP
        run: |
          INNER_ZIP="$(
            find /tmp/v9-work/outer \
              -type f \
              -name '*.zip' \
              | head -n 1
          )"

          if [ -z "$INNER_ZIP" ]; then
            echo "ERROR: Inner V9 ZIP not found."
            exit 1
          fi

          echo "Inner ZIP:"
          echo "$INNER_ZIP"

          echo "INNER_ZIP=$INNER_ZIP" >> "$GITHUB_ENV"

      # ==================================================
      # 7. EXTRACT REAL SOURCE
      # ==================================================
      - name: Extract real V9 source
        run: |
          unzip -q \
            "$INNER_ZIP" \
            -d /tmp/v9-work/source

          echo "Extracted files:"

          find /tmp/v9-work/source \
            -maxdepth 5 \
            -type f \
            | head -300

      # ==================================================
      # 8. LOCATE SOURCE ROOT
      # ==================================================
      - name: Locate V9 source root
        run: |
          SOURCE_ROOT=""

          while IFS= read -r DIR; do

            if [ -d "$DIR/app" ] && \
               { [ -f "$DIR/build.gradle" ] || \
                 [ -f "$DIR/build.gradle.kts" ]; }; then

              SOURCE_ROOT="$DIR"
              break

            fi

          done < <(
            find /tmp/v9-work/source \
              -type d
          )

          if [ -z "$SOURCE_ROOT" ]; then
            echo "ERROR: V9 source root not found."

            find /tmp/v9-work/source \
              -maxdepth 7 \
              -print

            exit 1
          fi

          echo "V9 source root:"
          echo "$SOURCE_ROOT"

          echo "SOURCE_ROOT=$SOURCE_ROOT" >> "$GITHUB_ENV"

      # ==================================================
      # 9. CREATE V10 SOURCE
      # ==================================================
      - name: Create V10 source
        run: |
          rm -rf v10-source

          cp -a \
            "$SOURCE_ROOT" \
            v10-source

          rm -rf \
            v10-source/.git \
            v10-source/.gradle \
            v10-source/build \
            v10-source/app/build

          echo "V10 source created."

          ls -la v10-source

      # ==================================================
      # 10. NORMALIZE PACKAGE
      # ==================================================
      - name: Normalize V9 package
        run: |
          cd v10-source

          OLD_PACKAGE="com.hieptran.aacast.doudou"
          NEW_PACKAGE="com.carassistant.v9"

          echo "Normalizing package..."

          grep -RIl \
            "$OLD_PACKAGE" \
            app/src/main \
            2>/dev/null |
          while IFS= read -r FILE; do

            sed -i \
              "s/${OLD_PACKAGE}/${NEW_PACKAGE}/g" \
              "$FILE"

          done

          if [ -f app/build.gradle ]; then

            sed -i \
              's/applicationId[[:space:]]*"[^"]*"/applicationId "com.carassistant.v9"/' \
              app/build.gradle

            sed -i \
              's/namespace[[:space:]]*"[^"]*"/namespace "com.carassistant.v9"/' \
              app/build.gradle

          fi

          if [ -f app/build.gradle.kts ]; then

            sed -i \
              's/applicationId[[:space:]]*=[[:space:]]*"[^"]*"/applicationId = "com.carassistant.v9"/' \
              app/build.gradle.kts

            sed -i \
              's/namespace[[:space:]]*=[[:space:]]*"[^"]*"/namespace = "com.carassistant.v9"/' \
              app/build.gradle.kts

          fi

          mkdir -p app/src/main/assets

          printf '%s\n' \
            'com.carassistant.v9.aabridge.AACastBridge' \
            > app/src/main/assets/xposed_init

          echo "Package normalization complete."

      # ==================================================
      # 11. VERIFY AACAST ENGINE
      # ==================================================
      - name: Verify V9 AACast engine
        run: |
          cd v10-source

          test -f app/libs/aasdk-legacy.jar
          test -f app/libs/aasdk-legacy.dex
          test -f app/libs/xposed-api-82.jar

          grep -R -q \
            "CarActivityService" \
            app/src/main/java

          grep -R -q \
            "CarActivity" \
            app/src/main/java

          grep -R -q \
            "createVirtualDisplay" \
            app/src/main/java

          echo "AACast engine verified."

      # ==================================================
      # 12. REMOVE ORIGINAL CAR ACTIVITY
      # ==================================================
      - name: Remove original AACastCarActivity
        run: |
          cd v10-source

          find app/src/main/java \
            -type f \
            -name "AACastCarActivity.java" \
            -delete

          echo "Original AACastCarActivity removed."

      # ==================================================
      # 13. CREATE V10 LAUNCHER
      # ==================================================
      - name: Add V10 Launcher
        run: |
          cd v10-source

          mkdir -p \
            app/src/main/java/com/carassistant/v9

          cat > \
            app/src/main/java/com/carassistant/v9/CarAssistantLauncherView.java \
            <<'JAVA'
package com.carassistant.v9;

import android.content.Context;
import android.content.Intent;
import android.content.pm.PackageManager;
import android.content.pm.ResolveInfo;
import android.graphics.Color;
import android.graphics.Typeface;
import android.graphics.drawable.GradientDrawable;
import android.os.Handler;
import android.os.Looper;
import android.view.Gravity;
import android.view.View;
import android.widget.Button;
import android.widget.GridLayout;
import android.widget.ImageView;
import android.widget.LinearLayout;
import android.widget.ScrollView;
import android.widget.TextView;

import java.text.SimpleDateFormat;
import java.util.ArrayList;
import java.util.Collections;
import java.util.Comparator;
import java.util.Date;
import java.util.List;
import java.util.Locale;

public final class CarAssistantLauncherView extends LinearLayout {

    public interface Callback {
        void openV9();
    }

    private final Callback callback;
    private final GridLayout appGrid;
    private final TextView clock;
    private final TextView date;
    private final TextView pageTitle;

    private final Handler handler =
            new Handler(Looper.getMainLooper());

    private boolean allApps = false;

    private final Runnable clockTick = new Runnable() {
        @Override
        public void run() {

            Date now = new Date();

            clock.setText(
                    new SimpleDateFormat(
                            "HH:mm",
                            Locale.getDefault()
                    ).format(now)
            );

            date.setText(
                    new SimpleDateFormat(
                            "EEE, dd MMM",
                            Locale.getDefault()
                    ).format(now)
            );

            handler.postDelayed(this, 30000L);
        }
    };

    public CarAssistantLauncherView(
            Context context,
            Callback callback
    ) {
        super(context);

        this.callback = callback;

        setOrientation(VERTICAL);

        setPadding(
                28,
                18,
                28,
                20
        );

        setBackground(
                makeBackground()
        );

        // ==================================================
        // TOP BAR
        // ==================================================

        LinearLayout top =
                new LinearLayout(context);

        top.setGravity(
                Gravity.CENTER_VERTICAL
        );

        top.setPadding(
                8,
                0,
                8,
                8
        );

        LinearLayout brand =
                new LinearLayout(context);

        brand.setOrientation(
                VERTICAL
        );

        TextView title =
                text(
                        "CAR ASSISTANT",
                        17,
                        Color.WHITE,
                        Typeface.BOLD
                );

        TextView subtitle =
                text(
                        "Android Auto Desktop",
                        11,
                        0xffaeb6c4,
                        Typeface.NORMAL
                );

        brand.addView(title);
        brand.addView(subtitle);

        top.addView(
                brand,
                new LayoutParams(
                        0,
                        62,
                        1f
                )
        );

        clock =
                text(
                        "",
                        28,
                        Color.WHITE,
                        Typeface.BOLD
                );

        clock.setGravity(
                Gravity.CENTER
        );

        top.addView(
                clock,
                new LayoutParams(
                        105,
                        62
                )
        );

        date =
                text(
                        "",
                        11,
                        0xffaeb6c4,
                        Typeface.NORMAL
                );

        date.setGravity(
                Gravity.CENTER_VERTICAL |
                Gravity.RIGHT
        );

        top.addView(
                date,
                new LayoutParams(
                        125,
                        62
                )
        );

        addView(
                top,
                new LayoutParams(
                        LayoutParams.MATCH_PARENT,
                        70
                )
        );

        // ==================================================
        // PAGE TITLE
        // ==================================================

        pageTitle =
                text(
                        "HOME",
                        12,
                        0xffdce3ed,
                        Typeface.BOLD
                );

        pageTitle.setPadding(
                8,
                2,
                8,
                4
        );

        addView(
                pageTitle,
                new LayoutParams(
                        LayoutParams.MATCH_PARENT,
                        28
                )
        );

        // ==================================================
        // APP GRID
        // ==================================================

        ScrollView scroll =
                new ScrollView(context);

        scroll.setFillViewport(true);

        scroll.setClipToPadding(false);

        appGrid =
                new GridLayout(context);

        appGrid.setColumnCount(5);

        appGrid.setUseDefaultMargins(false);

        appGrid.setAlignmentMode(
                GridLayout.ALIGN_BOUNDS
        );

        scroll.addView(
                appGrid,
                new ScrollView.LayoutParams(
                        LayoutParams.MATCH_PARENT,
                        LayoutParams.WRAP_CONTENT
                )
        );

        addView(
                scroll,
                new LayoutParams(
                        LayoutParams.MATCH_PARENT,
                        0,
                        1f
                )
        );

        // ==================================================
        // DOCK
        // ==================================================

        LinearLayout dock =
                new LinearLayout(context);

        dock.setGravity(
                Gravity.CENTER
        );

        dock.setPadding(
                8,
                12,
                8,
                0
        );

        Button apps =
                pillButton(
                        context,
                        "ALL APPS"
                );

        apps.setOnClickListener(
                v -> {

                    allApps = !allApps;

                    pageTitle.setText(
                            allApps
                                    ? "ALL APPS"
                                    : "HOME"
                    );

                    loadApps();
                }
        );

        dock.addView(
                apps,
                new LayoutParams(
                        120,
                        56
                )
        );

        Button cast =
                pillButton(
                        context,
                        "CAST"
                );

        cast.setOnClickListener(
                v -> {

                    if (callback != null) {
                        callback.openV9();
                    }

                }
        );

        dock.addView(
                cast,
                new LayoutParams(
                        120,
                        56
                )
        );

        Button refresh =
                pillButton(
                        context,
                        "REFRESH"
                );

        refresh.setOnClickListener(
                v -> loadApps()
        );

        dock.addView(
                refresh,
                new LayoutParams(
                        120,
                        56
                )
        );

        addView(
                dock,
                new LayoutParams(
                        LayoutParams.MATCH_PARENT,
                        68
                )
        );

        loadApps();

        clockTick.run();
    }

    private TextView text(
            String value,
            float size,
            int color,
            int style
    ) {

        TextView t =
                new TextView(
                        getContext()
                );

        t.setText(value);

        t.setTextSize(size);

        t.setTextColor(color);

        t.setTypeface(
                Typeface.DEFAULT,
                style
        );

        return t;
    }

    private Button pillButton(
            Context context,
            String label
    ) {

        Button b =
                new Button(context);

        b.setText(label);

        b.setTextSize(11);

        b.setTextColor(
                Color.WHITE
        );

        b.setAllCaps(false);

        b.setGravity(
                Gravity.CENTER
        );

        b.setBackground(
                round(
                        0xff252c37,
                        18
                )
        );

        return b;
    }

    private GradientDrawable round(
            int color,
            float radius
    ) {

        GradientDrawable g =
                new GradientDrawable();

        g.setColor(color);

        g.setCornerRadius(radius);

        g.setStroke(
                1,
                0xff3b4655
        );

        return g;
    }

    private GradientDrawable makeBackground() {

        return new GradientDrawable(
                GradientDrawable.Orientation.TL_BR,
                new int[]{
                        0xff0a0d12,
                        0xff111722,
                        0xff080a0f
                }
        );
    }

    private void loadApps() {

        appGrid.removeAllViews();

        PackageManager pm =
                getContext()
                        .getPackageManager();

        Intent intent =
                new Intent(
                        Intent.ACTION_MAIN
                );

        intent.addCategory(
                Intent.CATEGORY_LAUNCHER
        );

        List<ResolveInfo> apps =
                new ArrayList<>(
                        pm.queryIntentActivities(
                                intent,
                                0
                        )
                );

        Collections.sort(
                apps,
                Comparator.comparing(
                        a ->
                                a.loadLabel(pm)
                                        .toString(),
                        String.CASE_INSENSITIVE_ORDER
                )
        );

        int shown = 0;

        for (ResolveInfo info : apps) {

            String packageName =
                    info.activityInfo.packageName;

            if (packageName.equals(
                    getContext().getPackageName()
            )) {
                continue;
            }

            if (!allApps && shown >= 15) {
                break;
            }

            appGrid.addView(
                    createAppItem(
                            pm,
                            info,
                            packageName,
                            info.activityInfo.name
                    ),
                    gridParams()
            );

            shown++;
        }

        if (shown == 0) {

            TextView empty =
                    text(
                            "No launchable apps found",
                            15,
                            0xffaeb6c4,
                            Typeface.NORMAL
                    );

            empty.setGravity(
                    Gravity.CENTER
            );

            appGrid.addView(
                    empty,
                    gridParams()
            );
        }
    }

    private GridLayout.LayoutParams gridParams() {

        GridLayout.LayoutParams p =
                new GridLayout.LayoutParams();

        p.width = 0;

        p.height = 142;

        p.columnSpec =
                GridLayout.spec(
                        GridLayout.UNDEFINED,
                        1,
                        1f
                );

        p.setMargins(
                7,
                7,
                7,
                7
        );

        return p;
    }

    private View createAppItem(
            PackageManager pm,
            ResolveInfo info,
            String packageName,
            String className
    ) {

        LinearLayout card =
                new LinearLayout(
                        getContext()
                );

        card.setOrientation(
                VERTICAL
        );

        card.setGravity(
                Gravity.CENTER
        );

        card.setPadding(
                8,
                9,
                8,
                7
        );

        card.setBackground(
                round(
                        0x182a3340,
                        18
                )
        );

        ImageView icon =
                new ImageView(
                        getContext()
                );

        icon.setImageDrawable(
                info.loadIcon(pm)
        );

        card.addView(
                icon,
                new LayoutParams(
                        62,
                        62
                )
        );

        TextView name =
                text(
                        info.loadLabel(pm)
                                .toString(),
                        11,
                        Color.WHITE,
                        Typeface.NORMAL
                );

        name.setGravity(
                Gravity.CENTER
        );

        name.setMaxLines(2);

        card.addView(
                name,
                new LayoutParams(
                        LayoutParams.MATCH_PARENT,
                        42
                )
        );

        card.setOnClickListener(
                v ->
                        launchOnCarDisplay(
                                packageName,
                                className
                        )
        );

        return card;
    }

    private void launchOnCarDisplay(
            String packageName,
            String className
    ) {

        try {

            String component =
                    packageName +
                    "/" +
                    className;

            String command =
                    "am start --display 0 -n " +
                    component;

            Runtime.getRuntime().exec(
                    new String[]{
                            "su",
                            "-c",
                            command
                    }
            );

        } catch (Exception ignored) {
        }
    }

    @Override
    protected void onAttachedToWindow() {

        super.onAttachedToWindow();

        handler.removeCallbacks(
                clockTick
        );

        clockTick.run();
    }

    @Override
    protected void onDetachedFromWindow() {

        handler.removeCallbacks(
                clockTick
        );

        super.onDetachedFromWindow();
    }
}
JAVA

      # ==================================================
      # 14. CREATE V10 CAR ACTIVITY
      # ==================================================
      - name: Add V10 CarActivity controller
        run: |
          cd v10-source

          mkdir -p \
            app/src/main/java/com/carassistant/v9

          cat > \
            app/src/main/java/com/carassistant/v9/AACastCarActivity.java \
            <<'JAVA'
package com.carassistant.v9;

import android.os.Bundle;
import android.os.Handler;
import android.os.Looper;

import com.google.android.apps.auto.sdk.CarActivity;

public final class AACastCarActivity
        extends CarActivity {

    public final Handler handler =
            new Handler(
                    Looper.getMainLooper()
            );

    private RootView root;
    private CarAssistantLauncherView launcher;

    private boolean resumed;
    private boolean showingV9;

    private final Runnable leaseTicker =
            new LeaseTicker(this);

    private void applyChrome() {

        try {

            getCarUiController()
                    .getStatusBarController()
                    .hideAppHeader();

            getCarUiController()
                    .getMenuController()
                    .hideMenuButton();

        } catch (RuntimeException ignored) {
        }

        if (root != null) {
            AppCatalog.immersive(root);
        }
    }

    private void stopLease() {

        resumed = false;

        handler.removeCallbacks(
                leaseTicker
        );

        DockStateProvider.visibleUntil =
                0L;
    }

    private void showLauncher() {

        showingV9 = false;

        if (root != null) {

            root.destroy();
            root = null;
        }

        launcher =
                new CarAssistantLauncherView(
                        this,
                        this::showV9
                );

        setContentView(launcher);
    }

    private void showV9() {

        showingV9 = true;
        launcher = null;

        if (root == null ||
            root.destroyed) {

            root =
                    new RootView(this);
        }

        root.exitToAuto =
                this::showLauncher;

        setContentView(root);

        applyChrome();

        handler.removeCallbacks(
                leaseTicker
        );

        leaseTicker.run();
    }

    @Override
    public void onCreate(
            Bundle bundle
    ) {

        setTheme(
                R.style.Theme_AACast
        );

        super.onCreate(bundle);

        setIgnoreConfigChanges(-1);

        applyChrome();
    }

    @Override
    public void onResume() {

        super.onResume();

        resumed = true;

        if (showingV9) {
            showV9();
        } else {
            showLauncher();
        }
    }

    @Override
    public void onPause() {

        stopLease();

        super.onPause();
    }

    @Override
    public void onStop() {

        stopLease();

        if (root != null) {
            root.destroy();
        }

        super.onStop();
    }

    @Override
    public void onDestroy() {

        stopLease();

        if (root != null) {
            root.destroy();
        }

        super.onDestroy();
    }

    @Override
    public void onBackPressed() {

        if (showingV9) {

            showLauncher();
            return;
        }

        if (root != null &&
            root.dismissOverlay()) {

            return;
        }

        super.onBackPressed();
    }

    @Override
    public void onWindowFocusChanged(
            boolean hasFocus,
            boolean touchMode
    ) {

        super.onWindowFocusChanged(
                hasFocus,
                touchMode
        );

        if (hasFocus && resumed) {
            applyChrome();
        }
    }
}
JAVA

      # ==================================================
      # 15. PACKAGE VISIBILITY
      # ==================================================
      - name: Configure package visibility
        run: |
          cd v10-source

          MANIFEST="app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          if grep -q "<queries>" "$MANIFEST"; then

            echo "queries already exists."

          else

            python3 - <<'PY'
from pathlib import Path

p = Path(
    "app/src/main/AndroidManifest.xml"
)

s = p.read_text()

queries = """
    <queries>
        <intent>
            <action android:name="android.intent.action.MAIN" />
            <category android:name="android.intent.category.LAUNCHER" />
        </intent>
    </queries>
"""

s = s.replace(
    "</manifest>",
    queries + "\n</manifest>"
)

p.write_text(s)
PY

          fi

          grep -q "<queries>" "$MANIFEST"

          grep -q \
            "android.intent.action.MAIN" \
            "$MANIFEST"

          grep -q \
            "android.intent.category.LAUNCHER" \
            "$MANIFEST"

          echo "Package visibility OK."

      # ==================================================
      # 16. VERIFY V10 SOURCE
      # ==================================================
      - name: Verify V10 source
        run: |
          cd v10-source

          test -f \
            app/src/main/java/com/carassistant/v9/AACastCarActivity.java

          test -f \
            app/src/main/java/com/carassistant/v9/CarAssistantLauncherView.java

          grep -q \
            "class CarAssistantLauncherView" \
            app/src/main/java/com/carassistant/v9/CarAssistantLauncherView.java

          grep -q \
            "class AACastCarActivity" \
            app/src/main/java/com/carassistant/v9/AACastCarActivity.java

          grep -q \
            "showV9" \
            app/src/main/java/com/carassistant/v9/AACastCarActivity.java

          grep -R -q \
            "CarActivityService" \
            app/src/main/java

          grep -R -q \
            "CarActivity" \
            app/src/main/java

          grep -R -q \
            "createVirtualDisplay" \
            app/src/main/java

          test -f \
            app/libs/aasdk-legacy.dex

          test -f \
            app/libs/aasdk-legacy.jar

          test -f \
            app/src/main/assets/xposed_init

          echo "========================================"
          echo "V10 SOURCE VERIFIED"
          echo "========================================"

      # ==================================================
      # 17. GENERATE GRADLE WRAPPER
      # ==================================================
      - name: Generate Gradle wrapper
        run: |
          cd v10-source

          gradle wrapper \
            --gradle-version 8.13 \
            --distribution-type bin

      # ==================================================
      # 18. CLEAN
      # ==================================================
      - name: Clean V10 build
        run: |
          cd v10-source

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # ==================================================
      # 19. BUILD DEBUG
      # ==================================================
      - name: Build V10 debug APK
        run: |
          cd v10-source

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # ==================================================
      # 20. VERIFY DEBUG
      # ==================================================
      - name: Verify V10 debug APK
        run: |
          DEBUG_APK="$(
            find v10-source/app/build/outputs/apk/debug \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          if [ -z "$DEBUG_APK" ]; then

            echo "ERROR: Debug APK not found."

            find v10-source/app/build/outputs \
              -type f \
              -print

            exit 1

          fi

          echo "DEBUG APK:"
          echo "$DEBUG_APK"

          ls -lh "$DEBUG_APK"

          echo "DEBUG_APK=$DEBUG_APK" >> "$GITHUB_ENV"

      # ==================================================
      # 21. BUILD RELEASE
      # ==================================================
      - name: Build V10 release APK
        run: |
          cd v10-source

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      # ==================================================
      # 22. LOCATE RELEASE
      # ==================================================
      - name: Locate V10 release APK
        run: |
          RELEASE_APK="$(
            find v10-source/app/build/outputs/apk/release \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          if [ -z "$RELEASE_APK" ]; then

            echo "ERROR: Release APK not found."

            find v10-source/app/build/outputs \
              -type f \
              -print

            exit 1

          fi

          echo "RELEASE APK:"
          echo "$RELEASE_APK"

          ls -lh "$RELEASE_APK"

          echo "RELEASE_APK=$RELEASE_APK" >> "$GITHUB_ENV"

      # ==================================================
      # 23. VERIFY RELEASE
      # ==================================================
      - name: Verify V10 release APK
        run: |
          test -f "$RELEASE_APK"

          echo "Release APK verified."

          ls -lh "$RELEASE_APK"

      # ==================================================
      # 24. VERIFY APK CONTENT
      # ==================================================
      - name: Verify V10 APK content
        run: |
          echo "Checking release APK..."

          unzip -l "$RELEASE_APK" \
            | grep -q "AndroidManifest.xml"

          unzip -l "$RELEASE_APK" \
            | grep -q "classes.dex"

          unzip -l "$RELEASE_APK" \
            | grep -q "assets/xposed_init"

          echo "APK content verified."

      # ==================================================
      # 25. PACKAGE
      # ==================================================
      - name: Package V10 release
        run: |
          rm -rf dist
          mkdir -p dist

          cp "$RELEASE_APK" \
            dist/CarAssistant-V10-Launcher-release.apk

          cp "$DEBUG_APK" \
            dist/CarAssistant-V10-Launcher-debug.apk

          sha256sum \
            dist/*.apk \
            > dist/SHA256SUMS.txt

          echo "========================================"
          echo "V10 ARTIFACTS"
          echo "========================================"

          ls -lh dist

          cat dist/SHA256SUMS.txt

      # ==================================================
      # 26. FINAL VERIFICATION
      # ==================================================
      - name: Final verification
        run: |
          test -f \
            dist/CarAssistant-V10-Launcher-release.apk

          test -f \
            dist/CarAssistant-V10-Launcher-debug.apk

          test -f \
            dist/SHA256SUMS.txt

          echo "========================================"
          echo "CAR ASSISTANT V10 BUILD SUCCESS"
          echo "========================================"

      # ==================================================
      # 27. UPLOAD APK
      # ==================================================
      - name: Upload V10 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Launcher
          path: dist/
          if-no-files-found: error
          retention-days: 90
