name: Build Car Assistant V6.0-A.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create V6-A2 source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf v6-a2-source
          mkdir -p v6-a2-source
          cd v6-a2-source

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://api.xposed.info") }
              }
          }

          rootProject.name = "CarAssistantV6A2"

          include(":carapp")
          include(":system")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.6.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # ============================================================
          # CAR APP
          # ============================================================

          mkdir -p \
            carapp/src/main/java/com/carassistant/v6/carapp \
            carapp/src/main/java/com/carassistant/v6 \
            carapp/src/main/res/xml \
            carapp/src/main/res/values

          cat > carapp/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.carassistant.v6"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.carassistant.v6"
                  minSdk = 28
                  targetSdk = 35
                  versionCode = 602
                  versionName = "6.0-A.2"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.car.app:app:1.7.0")
          }
          EOF

          cat > carapp/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Car Assistant V6</string>
          </resources>
          EOF

          cat > carapp/src/main/res/xml/automotive_app_desc.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <automotiveApp>
              <uses name="template" />
          </automotiveApp>
          EOF

          cat > carapp/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="androidx.car.app.ACCESS_SURFACE" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name">

                  <meta-data
                      android:name="com.google.android.gms.car.application"
                      android:resource="@xml/automotive_app_desc" />

                  <service
                      android:name=".carapp.V6CarAppService"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="androidx.car.app.CarAppService" />
                          <category android:name="androidx.car.app.category.NAVIGATION" />
                      </intent-filter>

                  </service>

                  <activity
                      android:name=".LauncherActivity"
                      android:exported="true" />

              </application>

          </manifest>
          EOF

          cat > carapp/src/main/java/com/carassistant/v6/carapp/V6CarAppService.kt <<'EOF'
          package com.carassistant.v6.carapp

          import androidx.car.app.CarAppService
          import androidx.car.app.Session
          import androidx.car.app.validation.HostValidator

          class V6CarAppService : CarAppService() {

              override fun createHostValidator(): HostValidator {
                  return HostValidator.ALLOW_ALL_HOSTS_VALIDATOR
              }

              override fun onCreateSession(): Session {
                  return V6CarSession()
              }
          }
          EOF

          cat > carapp/src/main/java/com/carassistant/v6/carapp/V6CarSession.kt <<'EOF'
          package com.carassistant.v6.carapp

          import android.content.Intent
          import android.graphics.Rect
          import android.util.Log

          import androidx.car.app.AppManager
          import androidx.car.app.CarContext
          import androidx.car.app.Session
          import androidx.car.app.SurfaceCallback
          import androidx.car.app.SurfaceContainer

          import androidx.car.app.model.Action
          import androidx.car.app.model.Pane
          import androidx.car.app.model.PaneTemplate
          import androidx.car.app.model.Row
          import androidx.car.app.model.Template

          import androidx.car.app.screen.Screen

          class V6CarSession : Session() {

              override fun onCreateScreen(intent: Intent): Screen {
                  val screen = V6Screen(carContext)

                  carContext
                      .getCarService(AppManager::class.java)
                      .setSurfaceCallback(screen.surfaceCallback)

                  return screen
              }

              private class V6Screen(
                  context: CarContext
              ) : Screen(context) {

                  val surfaceCallback = object : SurfaceCallback {

                      override fun onSurfaceAvailable(
                          surfaceContainer: SurfaceContainer
                      ) {
                          Log.i(
                              TAG,
                              "Surface available: " +
                                  "${surfaceContainer.width}x" +
                                  "${surfaceContainer.height}, " +
                                  "dpi=${surfaceContainer.dpi}"
                          )

                          V6VirtualDisplayBridge.create(
                              surfaceContainer.surface,
                              surfaceContainer.width,
                              surfaceContainer.height,
                              surfaceContainer.dpi
                          )
                      }

                      override fun onSurfaceDestroyed(
                          surfaceContainer: SurfaceContainer
                      ) {
                          Log.i(TAG, "Surface destroyed")
                          V6VirtualDisplayBridge.release()
                      }

                      override fun onVisibleAreaChanged(
                          visibleArea: Rect
                      ) {
                      }

                      override fun onStableAreaChanged(
                          stableArea: Rect
                      ) {
                      }
                  }

                  override fun onGetTemplate(): Template {
                      return PaneTemplate.Builder(
                          Pane.Builder()
                              .addRow(
                                  Row.Builder()
                                      .setTitle("Car Assistant V6-A2")
                                      .addText("VirtualDisplay test")
                                      .build()
                              )
                              .build()
                      )
                          .setTitle("Car Assistant")
                          .setHeaderAction(Action.APP_ICON)
                          .build()
                  }
              }

              companion object {
                  private const val TAG = "CarAssistant-V6"
              }
          }
          EOF

          cat > carapp/src/main/java/com/carassistant/v6/carapp/V6VirtualDisplayBridge.kt <<'EOF'
          package com.carassistant.v6.carapp

          import android.os.IBinder
          import android.os.Parcel
          import android.util.Log
          import android.view.Surface

          object V6VirtualDisplayBridge {

              private const val TAG = "CarAssistant-V6"

              private const val SERVICE_NAME =
                  "v60a_vd_service"

              private const val DESCRIPTOR =
                  "com.v60a.virtualdisplay.ipc.IVirtualDisplayService"

              private const val TRANSACTION_CREATE = 1
              private const val TRANSACTION_RELEASE = 2

              fun create(
                  surface: Surface,
                  width: Int,
                  height: Int,
                  dpi: Int
              ) {
                  transact(TRANSACTION_CREATE) { data ->
                      data.writeInt(1)
                      surface.writeToParcel(data, 0)
                      data.writeInt(width)
                      data.writeInt(height)
                      data.writeInt(dpi)
                  }
              }

              fun release() {
                  transact(TRANSACTION_RELEASE) {
                  }
              }

              private fun transact(
                  code: Int,
                  writer: (Parcel) -> Unit
              ) {
                  var data: Parcel? = null
                  var reply: Parcel? = null

                  try {
                      val binder = getServiceBinder()

                      if (binder == null) {
                          Log.e(
                              TAG,
                              "System service not available: $SERVICE_NAME"
                          )
                          return
                      }

                      data = Parcel.obtain()
                      reply = Parcel.obtain()

                      data.writeInterfaceToken(DESCRIPTOR)

                      writer(data)

                      binder.transact(
                          code,
                          data,
                          reply,
                          0
                      )

                      reply.readException()

                      if (code == TRANSACTION_CREATE) {
                          val displayId = reply.readInt()

                          Log.i(
                              TAG,
                              "VirtualDisplay ID = $displayId"
                          )
                      }

                  } catch (t: Throwable) {
                      Log.e(
                          TAG,
                          "Binder transaction failed",
                          t
                      )
                  } finally {
                      reply?.recycle()
                      data?.recycle()
                  }
              }

              private fun getServiceBinder(): IBinder? {
                  return try {
                      val clazz =
                          Class.forName("android.os.ServiceManager")

                      val method =
                          clazz.getDeclaredMethod(
                              "getService",
                              String::class.java
                          )

                      method.isAccessible = true

                      method.invoke(
                          null,
                          SERVICE_NAME
                      ) as? IBinder

                  } catch (t: Throwable) {
                      Log.e(
                          TAG,
                          "Cannot access ServiceManager",
                          t
                      )

                      null
                  }
              }
          }
          EOF

          cat > carapp/src/main/java/com/carassistant/v6/LauncherActivity.kt <<'EOF'
          package com.carassistant.v6

          import android.app.Activity
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.TextView

          class LauncherActivity : Activity() {

              override fun onCreate(
                  state: Bundle?
              ) {
                  super.onCreate(state)

                  val view = TextView(this)

                  view.text =
                      "CAR ASSISTANT V6-A2\n\n" +
                      "VirtualDisplay PASS"

                  view.textSize = 28f
                  view.gravity = Gravity.CENTER
                  view.setTextColor(Color.WHITE)
                  view.setBackgroundColor(Color.BLACK)

                  setContentView(view)
              }
          }
          EOF

          # ============================================================
          # SYSTEM / LSPOSED MODULE
          # ============================================================

          mkdir -p \
            system/src/main/java/com/carassistant/v6/system \
            system/src/main/assets

          cat > system/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.carassistant.v6.system"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.carassistant.v6.system"
                  minSdk = 28
                  targetSdk = 35
                  versionCode = 602
                  versionName = "6.0-A.2"
              }
          }

          dependencies {
              compileOnly("de.robv.android.xposed:api:82")
          }
          EOF

          cat > system/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="Car Assistant System">

                  <meta-data
                      android:name="xposedmodule"
                      android:value="true" />

                  <meta-data
                      android:name="xposeddescription"
                      android:value="Car Assistant V6-A2 System VirtualDisplay" />

                  <meta-data
                      android:name="xposedminversion"
                      android:value="93" />

              </application>

          </manifest>
          EOF

          cat > system/src/main/assets/xposed_init <<'EOF'
          com.carassistant.v6.system.SystemServerHook
          EOF

          cat > system/src/main/java/com/carassistant/v6/system/SystemServerHook.java <<'EOF'
          package com.carassistant.v6.system;

          import android.app.Activity;
          import android.app.ActivityOptions;
          import android.content.Context;
          import android.content.Intent;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.os.Binder;
          import android.os.IBinder;
          import android.os.Parcel;
          import android.os.UserHandle;
          import android.view.Surface;

          import java.lang.reflect.Method;

          import de.robv.android.xposed.IXposedHookLoadPackage;
          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedBridge;
          import de.robv.android.xposed.XposedHelpers;

          public class SystemServerHook
                  implements IXposedHookLoadPackage {

              private static final String TAG =
                      "CarAssistant-V6";

              private static final String SERVICE_NAME =
                      "v60a_vd_service";

              private static final String DESCRIPTOR =
                      "com.v60a.virtualdisplay.ipc.IVirtualDisplayService";

              private static final String LAUNCHER_PACKAGE =
                      "com.carassistant.v6";

              private static final String LAUNCHER_CLASS =
                      "com.carassistant.v6.LauncherActivity";

              @Override
              public void handleLoadPackage(
                      XC_MethodHook.LoadPackageParam lpparam)
                      throws Throwable {

                  if (!"android".equals(
                          lpparam.packageName)) {
                      return;
                  }

                  Class<?> systemServer =
                          XposedHelpers.findClass(
                                  "com.android.server.SystemServer",
                                  lpparam.classLoader
                          );

                  /*
                   * Android 12:
                   *
                   * startOtherServices(
                   *     TimingsTraceAndSlog
                   * )
                   */

                  XposedHelpers.findAndHookMethod(
                          systemServer,
                          "startOtherServices",
                          "com.android.server.utils.TimingsTraceAndSlog",
                          new XC_MethodHook() {

                              @Override
                              protected void afterHookedMethod(
                                      MethodHookParam param) {

                                  try {
                                      Context context =
                                              (Context)
                                                      XposedHelpers
                                                          .getObjectField(
                                                              param.thisObject,
                                                              "mSystemContext"
                                                          );

                                      publishService(context);

                                  } catch (Throwable t) {
                                      XposedBridge.log(
                                              TAG +
                                              ": publish failed: " +
                                              t
                                      );
                                  }
                              }
                          }
                  );

                  XposedBridge.log(
                          TAG +
                          ": SystemServer hook installed"
                  );
              }

              private static void publishService(
                      Context context) {

                  try {
                      IBinder existing =
                              getService(
                                  SERVICE_NAME
                              );

                      if (existing != null) {
                          XposedBridge.log(
                                  TAG +
                                  ": service already exists"
                          );
                          return;
                      }

                      V6Binder binder =
                              new V6Binder(context);

                      addService(
                              SERVICE_NAME,
                              binder
                      );

                      XposedBridge.log(
                              TAG +
                              ": service published"
                      );

                  } catch (Throwable t) {
                      XposedBridge.log(
                              TAG +
                              ": addService failed: " +
                              t
                      );
                  }
              }

              private static IBinder getService(
                      String name)
                      throws Throwable {

                  Class<?> clazz =
                          Class.forName(
                              "android.os.ServiceManager"
                          );

                  Method method =
                          clazz.getDeclaredMethod(
                              "getService",
                              String.class
                          );

                  method.setAccessible(true);

                  return (IBinder)
                          method.invoke(
                              null,
                              name
                          );
              }

              private static void addService(
                      String name,
                      IBinder binder)
                      throws Throwable {

                  Class<?> clazz =
                          Class.forName(
                              "android.os.ServiceManager"
                          );

                  Method method =
                          clazz.getDeclaredMethod(
                              "addService",
                              String.class,
                              IBinder.class,
                              boolean.class,
                              int.class
                          );

                  method.setAccessible(true);

                  method.invoke(
                          null,
                          name,
                          binder,
                          false,
                          8
                  );
              }

              private static final class V6Binder
                      extends Binder {

                  private final Context context;

                  private VirtualDisplay virtualDisplay;

                  V6Binder(Context context) {
                      this.context = context;

                      attachInterface(
                              null,
                              DESCRIPTOR
                      );
                  }

                  @Override
                  protected boolean onTransact(
                          int code,
                          Parcel data,
                          Parcel reply,
                          int flags)
                          throws android.os.RemoteException {

                      data.enforceInterface(
                              DESCRIPTOR
                      );

                      if (code == 1) {
                          return createDisplay(
                                  data,
                                  reply
                          );
                      }

                      if (code == 2) {
                          releaseDisplay(
                                  reply
                          );

                          return true;
                      }

                      return super.onTransact(
                              code,
                              data,
                              reply,
                              flags
                      );
                  }

                  private boolean createDisplay(
                          Parcel data,
                          Parcel reply) {

                      try {
                          data.readInt();

                          Surface surface =
                                  Surface.CREATOR
                                      .createFromParcel(
                                          data
                                      );

                          int width =
                                  data.readInt();

                          int height =
                                  data.readInt();

                          int dpi =
                                  data.readInt();

                          releaseExisting();

                          DisplayManager dm =
                                  context.getSystemService(
                                      DisplayManager.class
                                  );

                          int displayFlags =
                                  DisplayManager
                                      .VIRTUAL_DISPLAY_FLAG_PUBLIC
                                  |
                                  DisplayManager
                                      .VIRTUAL_DISPLAY_FLAG_PRESENTATION
                                  |
                                  DisplayManager
                                      .VIRTUAL_DISPLAY_FLAG_OWN_CONTENT_ONLY;

                          virtualDisplay =
                                  dm.createVirtualDisplay(
                                      "CarAssistant-V6-A2",
                                      width,
                                      height,
                                      dpi,
                                      surface,
                                      displayFlags
                                  );

                          int displayId = -1;

                          if (virtualDisplay != null &&
                              virtualDisplay.getDisplay() != null) {

                              displayId =
                                  virtualDisplay
                                      .getDisplay()
                                      .getDisplayId();
                          }

                          reply.writeNoException();
                          reply.writeInt(
                              displayId
                          );

                          XposedBridge.log(
                              TAG +
                              ": VirtualDisplay created id=" +
                              displayId
                          );

                          if (displayId >= 0) {
                              launchLauncher(
                                  displayId
                              );
                          }

                          return true;

                      } catch (Throwable t) {

                          XposedBridge.log(
                              TAG +
                              ": createDisplay failed: " +
                              t
                          );

                          reply.writeNoException();
                          reply.writeInt(-1);

                          return true;
                      }
                  }

                  private void releaseDisplay(
                          Parcel reply) {

                      try {
                          releaseExisting();

                          reply.writeNoException();

                      } catch (Throwable t) {

                          XposedBridge.log(
                              TAG +
                              ": release failed: " +
                              t
                          );

                          reply.writeNoException();
                      }
                  }

                  private void releaseExisting() {

                      if (virtualDisplay != null) {
                          try {
                              virtualDisplay.release();
                          } catch (Throwable ignored) {
                          }

                          virtualDisplay = null;
                      }
                  }

                  private void launchLauncher(
                          int displayId) {

                      try {
                          Intent intent =
                              new Intent();

                          intent.setClassName(
                              LAUNCHER_PACKAGE,
                              LAUNCHER_CLASS
                          );

                          intent.addFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK |
                              Intent.FLAG_ACTIVITY_CLEAR_TOP |
                              Intent.FLAG_ACTIVITY_SINGLE_TOP
                          );

                          ActivityOptions options =
                              ActivityOptions.makeBasic();

                          options.setLaunchDisplayId(
                              displayId
                          );

                          context.startActivityAsUser(
                              intent,
                              UserHandle.SYSTEM,
                              options.toBundle()
                          );

                          XposedBridge.log(
                              TAG +
                              ": Launcher started on display " +
                              displayId
                          );

                      } catch (Throwable t) {

                          XposedBridge.log(
                              TAG +
                              ": launcher start failed: " +
                              t
                          );
                      }
                  }
              }
          }
          EOF

          # ============================================================
          # CREATE WRAPPER - IMPORTANT: WE ARE INSIDE v6-a2-source
          # ============================================================

          gradle wrapper \
              --gradle-version 8.7 \
              --distribution-type bin

      - name: Build V6-A2
        shell: bash
        run: |
          set -o pipefail

          cd v6-a2-source

          ./gradlew \
              :carapp:assembleDebug \
              :system:assembleDebug \
              --stacktrace \
              --info \
              2>&1 | tee ../v6-a2-build.log

      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          echo "===== APK FILES ====="

          find v6-a2-source \
              -type f \
              -name "*.apk" \
              -print || true

          echo
          echo "===== COMPILER ERRORS ====="

          grep -E \
              "^(e:|.*error:|FAILURE:)" \
              v6-a2-build.log \
              | head -300 || true

      - name: Upload V6-A2 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: car-assistant-v6-0-a2
          path: |
            v6-a2-source/carapp/build/outputs/apk/**/*.apk
            v6-a2-source/system/build/outputs/apk/**/*.apk
            v6-a2-build.log
          if-no-files-found: warn
