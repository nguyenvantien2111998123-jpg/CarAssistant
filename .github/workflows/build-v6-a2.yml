name: Build Car Assistant V6.0-A.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create V6-A2 project
        shell: bash
        run: |
          set -e

          rm -rf v6-a2-source
          mkdir -p v6-a2-source
          cd v6-a2-source

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "CarAssistantV6A2"
          include(":carapp")
          include(":system")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.6.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # ------------------------------------------------------------
          # CAR APP MODULE
          # ------------------------------------------------------------

          mkdir -p carapp/src/main/java/com/carassistant/v6/carapp
          mkdir -p carapp/src/main/res/xml
          mkdir -p carapp/src/main/res/values

          cat > carapp/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.carassistant.v6.carapp"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.carassistant.v6"
                  minSdk = 28
                  targetSdk = 35
                  versionCode = 602
                  versionName = "6.0-A.2"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.car.app:app:1.7.0")
          }
          EOF

          cat > carapp/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Car Assistant V6</string>
          </resources>
          EOF

          cat > carapp/src/main/res/xml/automotive_app_desc.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <automotiveApp>
              <uses name="template" />
          </automotiveApp>
          EOF

          cat > carapp/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="androidx.car.app.ACCESS_SURFACE" />
              <uses-permission android:name="androidx.car.app.NAVIGATION_TEMPLATES" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true">

                  <meta-data
                      android:name="com.google.android.gms.car.application"
                      android:resource="@xml/automotive_app_desc" />

                  <service
                      android:name=".V6CarAppService"
                      android:exported="true"
                      android:label="@string/app_name">
                      <intent-filter>
                          <action android:name="androidx.car.app.CarAppService" />
                          <category android:name="androidx.car.app.category.NAVIGATION" />
                      </intent-filter>
                  </service>

              </application>
          </manifest>
          EOF

          cat > carapp/src/main/java/com/carassistant/v6/carapp/V6CarAppService.kt <<'EOF'
          package com.carassistant.v6.carapp

          import android.content.Intent
          import androidx.car.app.CarAppService
          import androidx.car.app.Session
          import androidx.car.app.validation.HostValidator

          class V6CarAppService : CarAppService() {

              override fun createHostValidator(): HostValidator {
                  return HostValidator.ALLOW_ALL_HOSTS_VALIDATOR
              }

              override fun onCreateSession(): Session {
                  return V6CarSession()
              }
          }
          EOF

          cat > carapp/src/main/java/com/carassistant/v6/carapp/V6CarSession.kt <<'EOF'
          package com.carassistant.v6.carapp

          import android.content.Intent
          import android.util.Log
          import android.view.Surface
          import androidx.car.app.AppManager
          import androidx.car.app.CarContext
          import androidx.car.app.Session
          import androidx.car.app.SurfaceCallback
          import androidx.car.app.SurfaceContainer
          import androidx.car.app.model.Action
          import androidx.car.app.model.Pane
          import androidx.car.app.model.PaneTemplate
          import androidx.car.app.model.Row
          import androidx.car.app.model.Template
          import androidx.car.app.screen.Screen

          class V6CarSession : Session() {

              private var screen: V6Screen? = null

              override fun onCreateScreen(intent: Intent): Screen {
                  val newScreen = V6Screen(carContext)
                  screen = newScreen

                  carContext.getCarService(AppManager::class.java)
                      .setSurfaceCallback(newScreen.surfaceCallback)

                  Log.i(TAG, "V6-A2 SurfaceCallback registered")

                  return newScreen
              }

              private class V6Screen(
                  carContext: CarContext
              ) : Screen(carContext) {

                  val surfaceCallback = object : SurfaceCallback {

                      override fun onSurfaceAvailable(
                          surfaceContainer: SurfaceContainer
                      ) {
                          Log.i(
                              TAG,
                              "Surface available: " +
                                  "${surfaceContainer.width}x" +
                                  "${surfaceContainer.height}, " +
                                  "dpi=${surfaceContainer.dpi}"
                          )

                          V6VirtualDisplayBridge.create(
                              carContext,
                              surfaceContainer.surface,
                              surfaceContainer.width,
                              surfaceContainer.height,
                              surfaceContainer.dpi
                          )
                      }

                      override fun onSurfaceDestroyed(
                          surfaceContainer: SurfaceContainer
                      ) {
                          Log.i(TAG, "Surface destroyed")

                          V6VirtualDisplayBridge.release(carContext)
                      }

                      override fun onVisibleAreaChanged(
                          visibleArea: android.graphics.Rect
                      ) {
                      }

                      override fun onStableAreaChanged(
                          stableArea: android.graphics.Rect
                      ) {
                      }
                  }

                  override fun onGetTemplate(): Template {
                      return PaneTemplate.Builder(
                          Pane.Builder()
                              .addRow(
                                  Row.Builder()
                                      .setTitle("Car Assistant V6-A2")
                                      .addText("VirtualDisplay test")
                                      .build()
                              )
                              .build()
                      )
                          .setTitle("Car Assistant")
                          .setHeaderAction(Action.APP_ICON)
                          .build()
                  }
              }

              companion object {
                  private const val TAG = "CarAssistant-V6"
              }
          }
          EOF

          cat > carapp/src/main/java/com/carassistant/v6/carapp/V6VirtualDisplayBridge.kt <<'EOF'
          package com.carassistant.v6.carapp

          import android.content.Context
          import android.os.IBinder
          import android.os.Parcel
          import android.os.ServiceManager
          import android.util.Log
          import android.view.Surface

          object V6VirtualDisplayBridge {

              private const val TAG = "CarAssistant-V6"
              private const val SERVICE_NAME = "v60a_vd_service"

              fun create(
                  context: Context,
                  surface: Surface,
                  width: Int,
                  height: Int,
                  dpi: Int
              ) {
                  try {
                      val binder = ServiceManager.getService(SERVICE_NAME)

                      if (binder == null) {
                          Log.e(TAG, "System service not available: $SERVICE_NAME")
                          return
                      }

                      val data = Parcel.obtain()
                      val reply = Parcel.obtain()

                      try {
                          data.writeInterfaceToken(DESCRIPTOR)
                          data.writeInt(1)
                          surface.writeToParcel(data, 0)
                          data.writeInt(width)
                          data.writeInt(height)
                          data.writeInt(dpi)

                          binder.transact(
                              TRANSACTION_CREATE,
                              data,
                              reply,
                              0
                          )

                          val result = reply.readInt()
                          Log.i(TAG, "System VirtualDisplay result=$result")
                      } finally {
                          reply.recycle()
                          data.recycle()
                      }

                  } catch (t: Throwable) {
                      Log.e(TAG, "createSystemVirtualDisplay failed", t)
                  }
              }

              fun release(context: Context) {
                  try {
                      val binder = ServiceManager.getService(SERVICE_NAME)
                          ?: return

                      val data = Parcel.obtain()
                      val reply = Parcel.obtain()

                      try {
                          data.writeInterfaceToken(DESCRIPTOR)

                          binder.transact(
                              TRANSACTION_RELEASE,
                              data,
                              reply,
                              0
                          )
                      } finally {
                          reply.recycle()
                          data.recycle()
                      }
                  } catch (t: Throwable) {
                      Log.e(TAG, "release failed", t)
                  }
              }

              private const val DESCRIPTOR =
                  "com.v60a.virtualdisplay.ipc.IVirtualDisplayService"

              private const val TRANSACTION_CREATE = 1
              private const val TRANSACTION_RELEASE = 2
          }
          EOF

          # ------------------------------------------------------------
          # SYSTEM / LSPOSED MODULE
          # ------------------------------------------------------------

          mkdir -p system/src/main/java/com/carassistant/v6/system
          mkdir -p system/src/main/assets

          cat > system/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.carassistant.v6.system"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.carassistant.v6.system"
                  minSdk = 28
                  targetSdk = 35
                  versionCode = 602
                  versionName = "6.0-A.2"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              compileOnly("de.robv.android.xposed:api:82")
          }
          EOF

          cat > system/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="Car Assistant System">

                  <meta-data
                      android:name="xposedmodule"
                      android:value="true" />

                  <meta-data
                      android:name="xposeddescription"
                      android:value="Car Assistant V6-A2 System VirtualDisplay" />

                  <meta-data
                      android:name="xposedminversion"
                      android:value="93" />

              </application>
          </manifest>
          EOF

          cat > system/src/main/assets/xposed_init <<'EOF'
          com.carassistant.v6.system.SystemServerHook
          EOF

          cat > system/src/main/java/com/carassistant/v6/system/SystemServerHook.java <<'EOF'
          package com.carassistant.v6.system;

          import android.content.Context;
          import android.content.Intent;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.os.IBinder;
          import android.os.ServiceManager;
          import android.os.UserHandle;
          import android.view.Surface;

          import android.app.ActivityOptions;

          import de.robv.android.xposed.IXposedHookLoadPackage;
          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedBridge;
          import de.robv.android.xposed.XposedHelpers;

          public class SystemServerHook implements IXposedHookLoadPackage {

              private static final String SERVICE_NAME = "v60a_vd_service";
              private static final String TAG = "CarAssistant-V6";

              private static VirtualDisplay virtualDisplay;
              private static int displayId = -1;

              @Override
              public void handleLoadPackage(
                      XC_MethodHook.LoadPackageParam lpparam
              ) throws Throwable {

                  if (!"android".equals(lpparam.packageName)) {
                      return;
                  }

                  XposedBridge.log(TAG + ": system_server loaded");

                  Class<?> systemServerClass =
                          XposedHelpers.findClass(
                                  "com.android.server.SystemServer",
                                  lpparam.classLoader
                          );

                  XposedHelpers.findAndHookMethod(
                          systemServerClass,
                          "startOtherServices",
                          new XC_MethodHook() {

                              @Override
                              protected void afterHookedMethod(
                                      MethodHookParam param
                              ) throws Throwable {

                                  Context context =
                                          (Context) XposedHelpers.getObjectField(
                                                  param.thisObject,
                                                  "mSystemContext"
                                          );

                                  publishService(context);

                                  XposedBridge.log(
                                          TAG + ": V6-A2 service published"
                                  );
                              }
                          }
                  );
              }

              private static void publishService(Context context) {

                  IBinder binder = new V6Binder(context);

                  try {
                      ServiceManager.addService(
                              SERVICE_NAME,
                              binder,
                              false,
                              8
                      );
                  } catch (Throwable t) {
                      XposedBridge.log(
                              TAG + ": addService failed: " + t
                      );
                  }
              }

              private static class V6Binder extends android.os.Binder {

                  private final Context context;

                  V6Binder(Context context) {
                      this.context = context;

                      attachInterface(
                              null,
                              "com.v60a.virtualdisplay.ipc.IVirtualDisplayService"
                      );
                  }

                  @Override
                  protected boolean onTransact(
                          int code,
                          android.os.Parcel data,
                          android.os.Parcel reply,
                          int flags
                  ) throws android.os.RemoteException {

                      final String descriptor =
                              "com.v60a.virtualdisplay.ipc.IVirtualDisplayService";

                      if (code == 1) {
                          data.enforceInterface(descriptor);

                          data.readInt();

                          Surface surface =
                                  Surface.CREATOR.createFromParcel(data);

                          int width = data.readInt();
                          int height = data.readInt();
                          int dpi = data.readInt();

                          int result = createDisplay(
                                  surface,
                                  width,
                                  height,
                                  dpi
                          );

                          reply.writeNoException();
                          reply.writeInt(result);
                          return true;
                      }

                      if (code == 2) {
                          data.enforceInterface(descriptor);

                          releaseDisplay();

                          reply.writeNoException();
                          return true;
                      }

                      return super.onTransact(
                              code,
                              data,
                              reply,
                              flags
                      );
                  }

                  private int createDisplay(
                          Surface surface,
                          int width,
                          int height,
                          int dpi
                  ) {

                      releaseDisplay();

                      try {
                          DisplayManager dm =
                                  context.getSystemService(
                                          DisplayManager.class
                                  );

                          virtualDisplay =
                                  dm.createVirtualDisplay(
                                          "CarAssistant-V6-A2",
                                          width,
                                          height,
                                          dpi,
                                          surface,
                                          DisplayManager.VIRTUAL_DISPLAY_FLAG_PUBLIC
                                                  | DisplayManager.VIRTUAL_DISPLAY_FLAG_PRESENTATION
                                                  | DisplayManager.VIRTUAL_DISPLAY_FLAG_OWN_CONTENT_ONLY
                                  );

                          if (virtualDisplay == null) {
                              XposedBridge.log(
                                      TAG + ": createVirtualDisplay returned null"
                              );
                              return -1;
                          }

                          displayId =
                                  virtualDisplay.getDisplay().getDisplayId();

                          XposedBridge.log(
                                  TAG + ": VirtualDisplay created id="
                                          + displayId
                          );

                          launchLauncher(displayId);

                          return displayId;

                      } catch (Throwable t) {
                          XposedBridge.log(
                                  TAG + ": createDisplay failed: " + t
                          );
                          return -1;
                      }
                  }

                  private void launchLauncher(int id) {

                      try {
                          Intent intent = new Intent();
                          intent.setClassName(
                                  "com.carassistant.v6",
                                  "com.carassistant.v6.LauncherActivity"
                          );
                          intent.addFlags(
                                  Intent.FLAG_ACTIVITY_NEW_TASK
                          );

                          ActivityOptions options =
                                  ActivityOptions.makeBasic();

                          options.setLaunchDisplayId(id);

                          context.startActivityAsUser(
                                  intent,
                                  UserHandle.CURRENT,
                                  options.toBundle()
                          );

                      } catch (Throwable t) {
                          XposedBridge.log(
                                  TAG + ": launcher start failed: " + t
                          );
                      }
                  }

                  private void releaseDisplay() {

                      try {
                          if (virtualDisplay != null) {
                              virtualDisplay.release();
                              virtualDisplay = null;
                          }
                      } catch (Throwable ignored) {
                      }

                      displayId = -1;
                  }
              }
          }
          EOF

          # ------------------------------------------------------------
          # SIMPLE LAUNCHER ACTIVITY
          # ------------------------------------------------------------

          mkdir -p carapp/src/main/java/com/carassistant/v6

          cat > carapp/src/main/java/com/carassistant/v6/LauncherActivity.kt <<'EOF'
          package com.carassistant.v6

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.view.Gravity
          import android.widget.TextView

          class LauncherActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val view = TextView(this)

                  view.text =
                      "CAR ASSISTANT V6-A2\n\nVirtualDisplay PASS"

                  view.textSize = 28f
                  view.gravity = Gravity.CENTER
                  view.setTextColor(Color.WHITE)
                  view.setBackgroundColor(Color.BLACK)

                  setContentView(view)
              }
          }
          EOF

          # Add launcher activity to manifest
          python3 - <<'PY'
          p = "carapp/src/main/AndroidManifest.xml"
          s = open(p).read()
          s = s.replace(
              "</application>",
              """
                  <activity
                      android:name=".LauncherActivity"
                      android:exported="false" />
              </application>
              """
          )
          open(p, "w").write(s)
          PY

          # ------------------------------------------------------------
          # GRADLE WRAPPER
          # ------------------------------------------------------------

          cd ..

          gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Build V6-A2
        shell: bash
        run: |
          set -o pipefail

          cd v6-a2-source

          ./gradlew \
            :carapp:assembleDebug \
            :system:assembleDebug \
            --stacktrace \
            --info \
            2>&1 | tee ../v6-a2-build.log

      - name: Show generated APKs
        if: always()
        shell: bash
        run: |
          echo "===== APK FILES ====="
          find v6-a2-source -type f -name "*.apk" -print || true

          echo
          echo "===== KOTLIN/GRADLE ERRORS ====="
          grep -E "^(e:|FAILURE:|.*error:)" v6-a2-build.log | head -200 || true

      - name: Upload V6-A2 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: car-assistant-v6-0-a2
          path: |
            v6-a2-source/carapp/build/outputs/apk/**/*.apk
            v6-a2-source/system/build/outputs/apk/**/*.apk
            v6-a2-build.log
          if-no-files-found: warn
