name: Build Car Assistant V6.0-A.2

on:
  workflow_dispatch:

jobs:
  build-v6-a2:
    runs-on: ubuntu-latest

    steps:

      # ================================================================
      # CHECKOUT
      # ================================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ================================================================
      # JAVA 17
      # ================================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ================================================================
      # CREATE SOURCE
      # ================================================================

      - name: Create V6-A2 source
        shell: bash
        run: |
          set -e

          rm -rf v6-a2-source

          mkdir -p v6-a2-source/libs

          mkdir -p \
            v6-a2-source/carapp/src/main/java/com/carassistant/v6 \
            v6-a2-source/carapp/src/main/res/xml \
            v6-a2-source/carapp/src/main/res/values

          mkdir -p \
            v6-a2-source/system/src/main/java/com/carassistant/v6/system \
            v6-a2-source/system/src/main/assets

          cd v6-a2-source

          # ============================================================
          # ROOT GRADLE
          # ============================================================

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "CarAssistantV6A2"

          include(":carapp")
          include(":system")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.6.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # ============================================================
          # XPOSED API 82
          # ============================================================

          curl -fL \
            "https://repository-cdn.liferay.com/nexus/content/repositories/gradle-plugins/de/robv/android/xposed/api/82/api-82.jar" \
            -o libs/api-82.jar

          test -s libs/api-82.jar

          echo "=== XPOSED API 82 ==="
          ls -lh libs/api-82.jar

          # ============================================================
          # CARAPP MODULE
          # ============================================================

          cat > carapp/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.carassistant.v6"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.carassistant.v6"
                  minSdk = 28
                  targetSdk = 35
                  versionCode = 602
                  versionName = "6.0-A.2"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.car.app:app:1.7.0")
              implementation("androidx.core:core-ktx:1.15.0")
          }
          EOF

          # ============================================================
          # CARAPP RESOURCES
          # ============================================================

          cat > carapp/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Car Assistant V6</string>
          </resources>
          EOF

          cat > carapp/src/main/res/xml/automotive_app_desc.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <automotiveApp>
              <uses name="template" />
          </automotiveApp>
          EOF

          # ============================================================
          # CARAPP MANIFEST
          # ============================================================

          cat > carapp/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="androidx.car.app.ACCESS_SURFACE" />

              <uses-permission
                  android:name="androidx.car.app.NAVIGATION_TEMPLATES" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true">

                  <meta-data
                      android:name="com.google.android.gms.car.application"
                      android:resource="@xml/automotive_app_desc" />

                  <service
                      android:name=".V6CarAppService"
                      android:exported="true">

                      <intent-filter>
                          <action
                              android:name="androidx.car.app.CarAppService" />

                          <category
                              android:name="androidx.car.app.category.NAVIGATION" />
                      </intent-filter>

                      <meta-data
                          android:name="androidx.car.app.theme"
                          android:resource="@android:style/Theme.DeviceDefault.NoActionBar" />

                  </service>

                  <activity
                      android:name=".LauncherActivity"
                      android:exported="true"
                      android:theme="@android:style/Theme.DeviceDefault.NoActionBar" />

              </application>

          </manifest>
          EOF

          # ============================================================
          # CARAPP SERVICE
          # ============================================================

          cat > carapp/src/main/java/com/carassistant/v6/V6CarAppService.kt <<'EOF'
          package com.carassistant.v6

          import androidx.car.app.CarAppService
          import androidx.car.app.Session
          import androidx.car.app.validation.HostValidator

          class V6CarAppService : CarAppService() {

              override fun createHostValidator(): HostValidator {
                  return HostValidator.ALLOW_ALL_HOSTS_VALIDATOR
              }

              override fun onCreateSession(): Session {
                  return V6CarSession()
              }
          }
          EOF

          # ============================================================
          # CAR SESSION
          # ============================================================

          cat > carapp/src/main/java/com/carassistant/v6/V6CarSession.kt <<'EOF'
          package com.carassistant.v6

          import android.content.Intent
          import android.graphics.Rect
          import android.view.Surface
          import androidx.car.app.AppManager
          import androidx.car.app.CarContext
          import androidx.car.app.Screen
          import androidx.car.app.Session
          import androidx.car.app.SurfaceCallback
          import androidx.car.app.SurfaceContainer
          import androidx.car.app.model.Pane
          import androidx.car.app.model.PaneTemplate
          import androidx.car.app.model.Row
          import androidx.car.app.model.Template

          class V6CarSession : Session() {

              private var surface: Surface? = null
              private var bridge: V6VirtualDisplayBridge? = null

              override fun onCreateScreen(
                  intent: Intent
              ): Screen {
                  return V6Screen(carContext)
              }

              private inner class V6Screen(
                  carContext: CarContext
              ) : Screen(carContext), SurfaceCallback {

                  init {
                      carContext
                          .getCarService(
                              AppManager::class.java
                          )
                          .setSurfaceCallback(this)
                  }

                  override fun onGetTemplate(): Template {
                      return PaneTemplate.Builder(
                          Pane.Builder()
                              .addRow(
                                  Row.Builder()
                                      .setTitle(
                                          "Car Assistant V6"
                                      )
                                      .addText(
                                          "Virtual Display initialization..."
                                      )
                                      .build()
                              )
                              .build()
                      )
                          .setTitle("Car Assistant V6")
                          .build()
                  }

                  override fun onSurfaceAvailable(
                      surfaceContainer: SurfaceContainer
                  ) {
                      surface =
                          surfaceContainer.surface

                      bridge =
                          V6VirtualDisplayBridge(
                              width =
                                  surfaceContainer.width,
                              height =
                                  surfaceContainer.height,
                              dpi =
                                  surfaceContainer.dpi
                          )

                      bridge?.create(
                          surfaceContainer.surface
                      )
                  }

                  override fun onSurfaceDestroyed(
                      surfaceContainer: SurfaceContainer
                  ) {
                      bridge?.release()
                      bridge = null
                      surface = null
                  }

                  override fun onVisibleAreaChanged(
                      visibleArea: Rect
                  ) {
                  }

                  override fun onStableAreaChanged(
                      stableArea: Rect
                  ) {
                  }
              }
          }
          EOF

          # ============================================================
          # VIRTUAL DISPLAY BRIDGE
          #
          # IMPORTANT:
          # android.os.ServiceManager is NOT imported.
          # It is accessed only through reflection at runtime.
          # ============================================================

          cat > carapp/src/main/java/com/carassistant/v6/V6VirtualDisplayBridge.kt <<'EOF'
          package com.carassistant.v6

          import android.os.IBinder
          import android.os.Parcel
          import android.view.Surface

          class V6VirtualDisplayBridge(
              private val width: Int,
              private val height: Int,
              private val dpi: Int
          ) {

              companion object {

                  private const val SERVICE_NAME =
                      "v60a_vd_service"

                  private const val DESCRIPTOR =
                      "com.v60a.virtualdisplay.ipc.IVirtualDisplayService"

                  private const val TRANSACTION_CREATE =
                      IBinder.FIRST_CALL_TRANSACTION

                  private const val TRANSACTION_RELEASE =
                      IBinder.FIRST_CALL_TRANSACTION + 1
              }

              private var binder: IBinder? = null

              fun create(
                  surface: Surface
              ): Int {

                  val service =
                      getService()
                          ?: throw IllegalStateException(
                              "v60a_vd_service not available"
                          )

                  val data =
                      Parcel.obtain()

                  val reply =
                      Parcel.obtain()

                  try {

                      data.writeInterfaceToken(
                          DESCRIPTOR
                      )

                      data.writeInt(1)

                      surface.writeToParcel(
                          data,
                          0
                      )

                      data.writeInt(width)
                      data.writeInt(height)
                      data.writeInt(dpi)

                      service.transact(
                          TRANSACTION_CREATE,
                          data,
                          reply,
                          0
                      )

                      reply.readException()

                      return reply.readInt()

                  } finally {

                      data.recycle()
                      reply.recycle()
                  }
              }

              fun release() {

                  val service =
                      binder ?: return

                  val data =
                      Parcel.obtain()

                  val reply =
                      Parcel.obtain()

                  try {

                      data.writeInterfaceToken(
                          DESCRIPTOR
                      )

                      service.transact(
                          TRANSACTION_RELEASE,
                          data,
                          reply,
                          0
                      )

                      reply.readException()

                  } catch (_: Throwable) {

                      // Service may already be gone.

                  } finally {

                      data.recycle()
                      reply.recycle()
                  }

                  binder = null
              }

              private fun getService(): IBinder? {

                  if (binder != null) {
                      return binder
                  }

                  return try {

                      val clazz =
                          Class.forName(
                              "android.os.ServiceManager"
                          )

                      val method =
                          clazz.getDeclaredMethod(
                              "getService",
                              String::class.java
                          )

                      val result =
                          method.invoke(
                              null,
                              SERVICE_NAME
                          )

                      val service =
                          result as? IBinder

                      binder = service

                      service

                  } catch (t: Throwable) {

                      throw IllegalStateException(
                          "Cannot access ServiceManager: " +
                              t.message,
                          t
                      )
                  }
              }
          }
          EOF

          # ============================================================
          # LAUNCHER
          # ============================================================

          cat > carapp/src/main/java/com/carassistant/v6/LauncherActivity.kt <<'EOF'
          package com.carassistant.v6

          import android.app.Activity
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.LinearLayout
          import android.widget.TextView

          class LauncherActivity : Activity() {

              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {
                  super.onCreate(
                      savedInstanceState
                  )

                  val root =
                      LinearLayout(this).apply {

                          orientation =
                              LinearLayout.VERTICAL

                          gravity =
                              Gravity.CENTER

                          setBackgroundColor(
                              Color.BLACK
                          )
                      }

                  val title =
                      TextView(this).apply {

                          text =
                              "CAR ASSISTANT"

                          textSize = 32f

                          setTextColor(
                              Color.WHITE
                          )

                          gravity =
                              Gravity.CENTER
                      }

                  val subtitle =
                      TextView(this).apply {

                          text =
                              "V6.0-A.2\nVirtual Display"

                          textSize = 18f

                          setTextColor(
                              Color.WHITE
                          )

                          gravity =
                              Gravity.CENTER
                      }

                  root.addView(
                      title,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )

                  root.addView(
                      subtitle,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )

                  setContentView(root)
              }
          }
          EOF

          # ============================================================
          # SYSTEM MODULE
          # ============================================================

          cat > system/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.carassistant.v6.system"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.carassistant.v6.system"
                  minSdk = 28
                  targetSdk = 35
                  versionCode = 602
                  versionName = "6.0-A.2"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          dependencies {
              compileOnly(
                  files("../libs/api-82.jar")
              )
          }
          EOF

          cat > system/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="Car Assistant V6 System" />

          </manifest>
          EOF

          # ============================================================
          # SYSTEM SERVER HOOK
          #
          # IMPORTANT:
          #
          # 1. NO android.os.ServiceManager import.
          # 2. NO UserHandle.CURRENT.
          # 3. ServiceManager is resolved through reflection.
          # 4. UserHandle.of(0) is used.
          # 5. Throwable is converted to Exception before
          #    Parcel.writeException().
          # ============================================================

          cat > system/src/main/java/com/carassistant/v6/system/SystemServerHook.java <<'EOF'
          package com.carassistant.v6.system;

          import android.app.ActivityOptions;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.os.IBinder;
          import android.os.Parcel;
          import android.os.UserHandle;
          import android.view.Display;
          import android.view.Surface;

          import java.lang.reflect.Method;

          import de.robv.android.xposed.IXposedHookLoadPackage;
          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedBridge;
          import de.robv.android.xposed.XposedHelpers;
          import de.robv.android.xposed.callbacks.XC_LoadPackage;

          public class SystemServerHook
                  implements IXposedHookLoadPackage {

              private static final String TAG =
                      "CarAssistantV6-A2";

              private static final String SERVICE_NAME =
                      "v60a_vd_service";

              private static final String DESCRIPTOR =
                      "com.v60a.virtualdisplay.ipc.IVirtualDisplayService";

              private static final int TRANSACTION_CREATE =
                      IBinder.FIRST_CALL_TRANSACTION;

              private static final int TRANSACTION_RELEASE =
                      IBinder.FIRST_CALL_TRANSACTION + 1;

              private static volatile VirtualDisplay virtualDisplay;

              private static volatile int displayId =
                      Display.DEFAULT_DISPLAY;

              @Override
              public void handleLoadPackage(
                      XC_LoadPackage.LoadPackageParam lpparam)
                      throws Throwable {

                  if (!"android".equals(
                          lpparam.packageName)) {
                      return;
                  }

                  XposedBridge.log(
                          TAG +
                              ": SystemServer loaded"
                  );

                  Class<?> systemServer =
                          XposedHelpers.findClass(
                              "com.android.server.SystemServer",
                              lpparam.classLoader
                          );

                  XposedHelpers.findAndHookMethod(
                          systemServer,
                          "startOtherServices",
                          "com.android.server.utils.TimingsTraceAndSlog",
                          new XC_MethodHook() {

                              @Override
                              protected void afterHookedMethod(
                                      MethodHookParam param) {

                                  try {

                                      Context context =
                                          (Context)
                                              XposedHelpers
                                                  .getObjectField(
                                                      param.thisObject,
                                                      "mSystemContext"
                                                  );

                                      publishService(
                                          context
                                      );

                                      XposedBridge.log(
                                          TAG +
                                              ": Binder service published"
                                      );

                                  } catch (Throwable t) {

                                      XposedBridge.log(
                                          TAG +
                                              ": publishService failed: " +
                                              t
                                      );
                                  }
                              }
                          }
                  );
              }

              # =========================================================
              # SERVICE MANAGER REFLECTION
              # =========================================================

              private static Class<?> getServiceManagerClass()
                      throws ClassNotFoundException {

                  return Class.forName(
                      "android.os.ServiceManager"
                  );
              }

              private static IBinder getSystemServiceBinder(
                      String name)
                      throws Throwable {

                  Class<?> clazz =
                      getServiceManagerClass();

                  Method method =
                      clazz.getDeclaredMethod(
                          "getService",
                          String.class
                      );

                  Object result =
                      method.invoke(
                          null,
                          name
                      );

                  return (IBinder) result;
              }

              private static void addSystemService(
                      String name,
                      IBinder binder)
                      throws Throwable {

                  Class<?> clazz =
                      getServiceManagerClass();

                  Method selected =
                      null;

                  for (Method method :
                          clazz.getDeclaredMethods()) {

                      if (!"addService".equals(
                              method.getName())) {
                          continue;
                      }

                      Class<?>[] types =
                          method.getParameterTypes();

                      if (types.length >= 2
                              && types[0] ==
                                  String.class
                              && IBinder.class
                                  .isAssignableFrom(
                                      types[1])) {

                          selected = method;
                          break;
                      }
                  }

                  if (selected == null) {
                      throw new NoSuchMethodException(
                          "ServiceManager.addService not found"
                      );
                  }

                  selected.setAccessible(true);

                  Class<?>[] types =
                      selected.getParameterTypes();

                  Object[] args =
                      new Object[types.length];

                  args[0] = name;
                  args[1] = binder;

                  for (int i = 2;
                       i < types.length;
                       i++) {

                      Class<?> type =
                          types[i];

                      if (type ==
                          boolean.class) {

                          args[i] = false;

                      } else if (
                          type == int.class) {

                          args[i] = 0;

                      } else {

                          args[i] = null;
                      }
                  }

                  selected.invoke(
                      null,
                      args
                  );
              }

              private static void publishService(
                      Context context)
                      throws Throwable {

                  ServiceBinder binder =
                      new ServiceBinder(
                          context
                      );

                  addSystemService(
                      SERVICE_NAME,
                      binder
                  );
              }

              # =========================================================
              # VIRTUAL DISPLAY
              # =========================================================

              private static synchronized int createDisplay(
                      Context context,
                      Surface surface,
                      int width,
                      int height,
                      int dpi) {

                  if (surface == null) {

                      throw new IllegalArgumentException(
                          "Surface is null"
                      );
                  }

                  releaseDisplay();

                  DisplayManager dm =
                      (DisplayManager)
                          context.getSystemService(
                              Context.DISPLAY_SERVICE
                          );

                  if (dm == null) {

                      throw new IllegalStateException(
                          "DisplayManager unavailable"
                      );
                  }

                  int flags =
                      DisplayManager
                          .VIRTUAL_DISPLAY_FLAG_PUBLIC
                      |
                      DisplayManager
                          .VIRTUAL_DISPLAY_FLAG_PRESENTATION
                      |
                      DisplayManager
                          .VIRTUAL_DISPLAY_FLAG_OWN_CONTENT_ONLY;

                  virtualDisplay =
                      dm.createVirtualDisplay(
                          "CarAssistantV6",
                          width,
                          height,
                          dpi,
                          surface,
                          flags
                      );

                  if (virtualDisplay == null) {

                      throw new IllegalStateException(
                          "createVirtualDisplay returned null"
                      );
                  }

                  displayId =
                      virtualDisplay
                          .getDisplay()
                          .getDisplayId();

                  XposedBridge.log(
                      TAG +
                          ": VirtualDisplay created id=" +
                          displayId +
                          " " +
                          width +
                          "x" +
                          height +
                          " dpi=" +
                          dpi
                  );

                  launchLauncher(
                      context,
                      displayId
                  );

                  return displayId;
              }

              # =========================================================
              # LAUNCH LAUNCHER
              # =========================================================

              private static void launchLauncher(
                      Context context,
                      int displayId) {

                  try {

                      Intent intent =
                          new Intent();

                      intent.setComponent(
                          new ComponentName(
                              "com.carassistant.v6",
                              "com.carassistant.v6.LauncherActivity"
                          )
                      );

                      intent.addFlags(
                          Intent.FLAG_ACTIVITY_NEW_TASK
                          |
                          Intent.FLAG_ACTIVITY_CLEAR_TOP
                          |
                          Intent.FLAG_ACTIVITY_SINGLE_TOP
                      );

                      ActivityOptions options =
                          ActivityOptions.makeBasic();

                      options.setLaunchDisplayId(
                          displayId
                      );

                      UserHandle user =
                          UserHandle.of(0);

                      context.startActivityAsUser(
                          intent,
                          user,
                          options.toBundle()
                      );

                      XposedBridge.log(
                          TAG +
                              ": Launcher requested on display " +
                              displayId
                      );

                  } catch (Throwable t) {

                      XposedBridge.log(
                          TAG +
                              ": launchLauncher failed: " +
                              t
                      );
                  }
              }

              # =========================================================
              # RELEASE DISPLAY
              # =========================================================

              private static synchronized void releaseDisplay() {

                  if (virtualDisplay != null) {

                      try {
                          virtualDisplay.release();
                      } catch (Throwable ignored) {
                      }
                  }

                  virtualDisplay = null;

                  displayId =
                      Display.DEFAULT_DISPLAY;
              }

              # =========================================================
              # BINDER SERVICE
              # =========================================================

              private static final class ServiceBinder
                      extends android.os.Binder {

                  private final Context context;

                  ServiceBinder(
                          Context context) {

                      this.context =
                          context;

                      attachInterface(
                          null,
                          DESCRIPTOR
                      );
                  }

                  @Override
                  protected boolean onTransact(
                          int code,
                          Parcel data,
                          Parcel reply,
                          int flags)
                          throws android.os.RemoteException {

                      if (code ==
                          INTERFACE_TRANSACTION) {

                          reply.writeString(
                              DESCRIPTOR
                          );

                          return true;
                      }

                      data.enforceInterface(
                          DESCRIPTOR
                      );

                      try {

                          if (code ==
                              TRANSACTION_CREATE) {

                              int hasSurface =
                                  data.readInt();

                              Surface surface =
                                  null;

                              if (hasSurface != 0) {

                                  surface =
                                      Surface.CREATOR
                                          .createFromParcel(
                                              data
                                          );
                              }

                              int width =
                                  data.readInt();

                              int height =
                                  data.readInt();

                              int dpi =
                                  data.readInt();

                              int id =
                                  createDisplay(
                                      context,
                                      surface,
                                      width,
                                      height,
                                      dpi
                                  );

                              reply.writeNoException();

                              reply.writeInt(
                                  id
                              );

                              return true;
                          }

                          if (code ==
                              TRANSACTION_RELEASE) {

                              releaseDisplay();

                              reply.writeNoException();

                              return true;
                          }

                          return super.onTransact(
                              code,
                              data,
                              reply,
                              flags
                          );

                      } catch (Throwable t) {

                          Exception exception;

                          if (t instanceof Exception) {

                              exception =
                                  (Exception) t;

                          } else {

                              exception =
                                  new RuntimeException(
                                      t
                                  );
                          }

                          reply.writeException(
                              exception
                          );

                          XposedBridge.log(
                              TAG +
                                  ": Binder transaction failed: " +
                                  t
                          );

                          return true;
                      }
                  }
              }
          }
          EOF

          # ============================================================
          # XPOSED ENTRY
          # ============================================================

          cat > system/src/main/assets/xposed_init <<'EOF'
          com.carassistant.v6.system.SystemServerHook
          EOF

          # ============================================================
          # STATIC CHECKS BEFORE BUILD
          # ============================================================

          echo "=== CHECK: NO ServiceManager IMPORT ==="

          if grep -R \
              'import android.os.ServiceManager' \
              system/src/main \
              >/dev/null 2>&1; then

              echo "ERROR: ServiceManager import still exists"
              exit 1
          fi

          echo "OK"

          echo "=== CHECK: NO UserHandle.CURRENT ==="

          if grep -R \
              'UserHandle.CURRENT' \
              system/src/main \
              >/dev/null 2>&1; then

              echo "ERROR: UserHandle.CURRENT still exists"
              exit 1
          fi

          echo "OK"

          echo "=== CHECK: XPOSED JAR ==="

          test -f libs/api-82.jar
          test -s libs/api-82.jar

          ls -lh libs/api-82.jar

          echo "=== CHECK: SOURCE TREE ==="

          find . \
            -maxdepth 6 \
            -type f |
            sort

          # ============================================================
          # GRADLE WRAPPER
          # ============================================================

          gradle wrapper \
            --gradle-version 8.7 \
            --distribution-type bin

      # ================================================================
      # BUILD
      # ================================================================

      - name: Build V6-A2
        shell: bash
        run: |
          set -e

          cd v6-a2-source

          chmod +x gradlew

          echo "=== GRADLE VERSION ==="

          ./gradlew --version

          echo "=== BUILD CARAPP + SYSTEM ==="

          ./gradlew \
            :carapp:assembleDebug \
            :system:assembleDebug \
            --stacktrace \
            --info

      # ================================================================
      # DIAGNOSTICS
      # ================================================================

      - name: Diagnostics
        if: always()
        shell: bash
        run: |

          echo "================================================"
          echo "GIT STATUS"
          echo "================================================"

          git status --short || true

          echo "================================================"
          echo "XPOSED JAR"
          echo "================================================"

          ls -lh \
            v6-a2-source/libs/api-82.jar \
            2>/dev/null || true

          echo "================================================"
          echo "APK OUTPUTS"
          echo "================================================"

          find v6-a2-source \
            -type f \
            \( \
              -name "*.apk" \
              -o \
              -name "*.aab" \
            \) \
            -print \
            2>/dev/null || true

          echo "================================================"
          echo "JAVA SOURCE CHECK"
          echo "================================================"

          grep -R \
            'ServiceManager\|UserHandle.CURRENT\|writeException' \
            v6-a2-source/system/src/main/java \
            2>/dev/null || true

      # ================================================================
      # ARTIFACTS
      # ================================================================

      - name: Upload V6-A2 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: car-assistant-v6-a2
          path: |
            v6-a2-source/carapp/build/outputs/apk/debug/*.apk
            v6-a2-source/system/build/outputs/apk/debug/*.apk
            v6-a2-source/libs/api-82.jar
          if-no-files-found: warn
