name: Build Car Assistant V6.0-A.2

on:
  workflow_dispatch:

jobs:
  build-v6-a2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create V6-A2 source
        shell: bash
        run: |
          set -e

          rm -rf v6-a2-source

          mkdir -p v6-a2-source/libs
          mkdir -p v6-a2-source/carapp/src/main/java/com/carassistant/v6/carapp
          mkdir -p v6-a2-source/carapp/src/main/res/xml
          mkdir -p v6-a2-source/system/src/main/java/com/carassistant/v6/system
          mkdir -p v6-a2-source/system/src/main/aidl
          mkdir -p v6-a2-source/system/src/main/resources
          mkdir -p v6-a2-source/carapp/src/main/res/values
          mkdir -p v6-a2-source/carapp/src/main/res/mipmap-hdpi

          cd v6-a2-source

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "CarAssistantV6A2"
          include(":carapp")
          include(":system")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.6.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # Download original Xposed API 82 into the SAME project tree
          # that Gradle expects.
          curl -fL \
            "https://repository-cdn.liferay.com/nexus/content/repositories/gradle-plugins/de/robv/android/xposed/api/82/api-82.jar" \
            -o libs/api-82.jar

          test -s libs/api-82.jar

          echo "=== XPOSED JAR ==="
          ls -lh libs/api-82.jar

          # ------------------------------------------------------------
          # CAR APP MODULE
          # ------------------------------------------------------------

          cat > carapp/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.carassistant.v6"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.carassistant.v6"
                  minSdk = 28
                  targetSdk = 35
                  versionCode = 602
                  versionName = "6.0-A.2"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.car.app:app:1.7.0")
              implementation("androidx.core:core-ktx:1.15.0")
          }
          EOF

          cat > carapp/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Car Assistant V6</string>
          </resources>
          EOF

          cat > carapp/src/main/res/xml/automotive_app_desc.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <automotiveApp>
              <uses name="template" />
          </automotiveApp>
          EOF

          cat > carapp/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="androidx.car.app.ACCESS_SURFACE" />
              <uses-permission android:name="androidx.car.app.NAVIGATION_TEMPLATES" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true">

                  <meta-data
                      android:name="com.google.android.gms.car.application"
                      android:resource="@xml/automotive_app_desc" />

                  <service
                      android:name=".V6CarAppService"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="androidx.car.app.CarAppService" />
                          <category android:name="androidx.car.app.category.NAVIGATION" />
                      </intent-filter>

                      <meta-data
                          android:name="androidx.car.app.theme"
                          android:resource="@android:style/Theme.DeviceDefault.NoActionBar" />

                  </service>

                  <activity
                      android:name=".LauncherActivity"
                      android:exported="true"
                      android:theme="@android:style/Theme.DeviceDefault.NoActionBar" />

              </application>
          </manifest>
          EOF

          cat > carapp/src/main/java/com/carassistant/v6/carapp/V6CarAppService.kt <<'EOF'
          package com.carassistant.v6

          import android.content.Intent
          import androidx.car.app.CarAppService
          import androidx.car.app.Session
          import androidx.car.app.validation.HostValidator

          class V6CarAppService : CarAppService() {

              override fun createHostValidator(): HostValidator {
                  return HostValidator.ALLOW_ALL_HOSTS_VALIDATOR
              }

              override fun onCreateSession(): Session {
                  return V6CarSession()
              }
          }
          EOF

          cat > carapp/src/main/java/com/carassistant/v6/carapp/V6CarSession.kt <<'EOF'
          package com.carassistant.v6

          import android.view.Surface
          import androidx.car.app.AppManager
          import androidx.car.app.CarContext
          import androidx.car.app.Session
          import androidx.car.app.SurfaceCallback
          import androidx.car.app.SurfaceContainer
          import androidx.car.app.Screen
          import androidx.car.app.model.Pane
          import androidx.car.app.model.PaneTemplate
          import androidx.car.app.model.Row
          import androidx.car.app.model.Template

          class V6CarSession : Session() {

              private var surface: Surface? = null
              private var bridge: V6VirtualDisplayBridge? = null

              override fun onCreateScreen(intent: android.content.Intent): Screen {
                  return V6Screen(carContext)
              }

              override fun onNewIntent(intent: android.content.Intent) {
                  super.onNewIntent(intent)
              }

              private inner class V6Screen(
                  carContext: CarContext
              ) : Screen(carContext), SurfaceCallback {

                  init {
                      carContext
                          .getCarService(AppManager::class.java)
                          .setSurfaceCallback(this)
                  }

                  override fun onGetTemplate(): Template {
                      return PaneTemplate.Builder(
                          Pane.Builder()
                              .addRow(
                                  Row.Builder()
                                      .setTitle("Car Assistant V6")
                                      .addText("Waiting for Android Auto surface...")
                                      .build()
                              )
                              .build()
                      )
                          .setTitle("Car Assistant V6")
                          .build()
                  }

                  override fun onSurfaceAvailable(surfaceContainer: SurfaceContainer) {
                      surface = surfaceContainer.surface

                      bridge = V6VirtualDisplayBridge(
                          width = surfaceContainer.width,
                          height = surfaceContainer.height,
                          dpi = surfaceContainer.dpi
                      )

                      bridge?.create(surfaceContainer.surface)
                  }

                  override fun onSurfaceDestroyed(surfaceContainer: SurfaceContainer) {
                      bridge?.release()
                      bridge = null
                      surface = null
                  }

                  override fun onVisibleAreaChanged(
                      visibleArea: android.graphics.Rect
                  ) {
                  }

                  override fun onStableAreaChanged(
                      stableArea: android.graphics.Rect
                  ) {
                  }
              }
          }
          EOF

          cat > carapp/src/main/java/com/carassistant/v6/carapp/V6VirtualDisplayBridge.kt <<'EOF'
          package com.carassistant.v6

          import android.os.IBinder
          import android.os.Parcel
          import android.os.ServiceManager
          import android.view.Surface

          class V6VirtualDisplayBridge(
              private val width: Int,
              private val height: Int,
              private val dpi: Int
          ) {

              companion object {
                  private const val SERVICE_NAME = "v60a_vd_service"
                  private const val DESCRIPTOR =
                      "com.v60a.virtualdisplay.ipc.IVirtualDisplayService"

                  private const val TRANSACTION_CREATE = IBinder.FIRST_CALL_TRANSACTION
                  private const val TRANSACTION_RELEASE =
                      IBinder.FIRST_CALL_TRANSACTION + 1
              }

              private var binder: IBinder? = null

              fun create(surface: Surface): Int {
                  val service = getService()
                      ?: throw IllegalStateException(
                          "v60a_vd_service not available"
                      )

                  val data = Parcel.obtain()
                  val reply = Parcel.obtain()

                  try {
                      data.writeInterfaceToken(DESCRIPTOR)
                      data.writeInt(1)
                      surface.writeToParcel(data, 0)
                      data.writeInt(width)
                      data.writeInt(height)
                      data.writeInt(dpi)

                      service.transact(
                          TRANSACTION_CREATE,
                          data,
                          reply,
                          0
                      )

                      reply.readException()

                      return reply.readInt()
                  } finally {
                      data.recycle()
                      reply.recycle()
                  }
              }

              fun release() {
                  val service = binder ?: return

                  val data = Parcel.obtain()
                  val reply = Parcel.obtain()

                  try {
                      data.writeInterfaceToken(DESCRIPTOR)

                      service.transact(
                          TRANSACTION_RELEASE,
                          data,
                          reply,
                          0
                      )

                      reply.readException()
                  } catch (_: Throwable) {
                  } finally {
                      data.recycle()
                      reply.recycle()
                  }

                  binder = null
              }

              private fun getService(): IBinder? {
                  if (binder != null) {
                      return binder
                  }

                  val service = ServiceManager.getService(SERVICE_NAME)
                  binder = service
                  return service
              }
          }
          EOF

          cat > carapp/src/main/java/com/carassistant/v6/LauncherActivity.kt <<'EOF'
          package com.carassistant.v6

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.view.Gravity
          import android.widget.LinearLayout
          import android.widget.TextView

          class LauncherActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.BLACK)
                  }

                  val title = TextView(this).apply {
                      text = "CAR ASSISTANT"
                      textSize = 32f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                  }

                  val subtitle = TextView(this).apply {
                      text = "V6.0-A.2\nVirtual Display PASS"
                      textSize = 18f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                  }

                  root.addView(
                      title,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )

                  root.addView(
                      subtitle,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )

                  setContentView(root)
              }
          }
          EOF

          # ------------------------------------------------------------
          # SYSTEM MODULE
          # ------------------------------------------------------------

          cat > system/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.carassistant.v6.system"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.carassistant.v6.system"
                  minSdk = 28
                  targetSdk = 35
                  versionCode = 602
                  versionName = "6.0-A.2"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          dependencies {
              compileOnly(files("../libs/api-82.jar"))
          }
          EOF

          cat > system/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:label="Car Assistant V6 System"
                  android:allowBackup="false" />

          </manifest>
          EOF

          cat > system/src/main/java/com/carassistant/v6/system/SystemServerHook.java <<'EOF'
          package com.carassistant.v6.system;

          import android.app.ActivityOptions;
          import android.content.Context;
          import android.content.Intent;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.os.IBinder;
          import android.os.Parcel;
          import android.os.ServiceManager;
          import android.os.UserHandle;
          import android.view.Display;
          import android.view.Surface;

          import java.lang.reflect.Method;

          import de.robv.android.xposed.IXposedHookLoadPackage;
          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedBridge;
          import de.robv.android.xposed.XposedHelpers;
          import de.robv.android.xposed.callbacks.XC_LoadPackage;

          public class SystemServerHook implements IXposedHookLoadPackage {

              private static final String TAG = "CarAssistantV6-A2";
              private static final String SERVICE_NAME = "v60a_vd_service";
              private static final String DESCRIPTOR =
                      "com.v60a.virtualdisplay.ipc.IVirtualDisplayService";

              private static final int TRANSACTION_CREATE =
                      IBinder.FIRST_CALL_TRANSACTION;

              private static final int TRANSACTION_RELEASE =
                      IBinder.FIRST_CALL_TRANSACTION + 1;

              private static volatile VirtualDisplay virtualDisplay;
              private static volatile int displayId = Display.DEFAULT_DISPLAY;

              @Override
              public void handleLoadPackage(
                      XC_LoadPackage.LoadPackageParam lpparam) throws Throwable {

                  if (!"android".equals(lpparam.packageName)) {
                      return;
                  }

                  XposedBridge.log(TAG + ": SystemServer loaded");

                  Class<?> systemServer =
                          XposedHelpers.findClass(
                                  "com.android.server.SystemServer",
                                  lpparam.classLoader
                          );

                  XposedHelpers.findAndHookMethod(
                          systemServer,
                          "startOtherServices",
                          "com.android.server.utils.TimingsTraceAndSlog",
                          new XC_MethodHook() {

                              @Override
                              protected void afterHookedMethod(
                                      MethodHookParam param) {

                                  try {
                                      Context context =
                                              (Context) XposedHelpers.getObjectField(
                                                      param.thisObject,
                                                      "mSystemContext"
                                              );

                                      publishService(context);

                                      XposedBridge.log(
                                              TAG + ": Binder service published"
                                      );

                                  } catch (Throwable t) {
                                      XposedBridge.log(
                                              TAG + ": publishService failed: "
                                                      + t
                                  );
                                  }
                              }
                          }
                  );
              }

              private static void publishService(Context context)
                      throws Throwable {

                  ServiceBinder serviceBinder =
                          new ServiceBinder(context);

                  ServiceManager.addService(
                          SERVICE_NAME,
                          serviceBinder
                  );
              }

              private static synchronized int createDisplay(
                      Context context,
                      Surface surface,
                      int width,
                      int height,
                      int dpi) {

                  if (surface == null) {
                      throw new IllegalArgumentException(
                              "Surface is null"
                      );
                  }

                  releaseDisplay();

                  DisplayManager dm =
                          (DisplayManager) context.getSystemService(
                                  Context.DISPLAY_SERVICE
                          );

                  if (dm == null) {
                      throw new IllegalStateException(
                              "DisplayManager unavailable"
                      );
                  }

                  int flags =
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_PUBLIC
                                  | DisplayManager.VIRTUAL_DISPLAY_FLAG_PRESENTATION
                                  | DisplayManager.VIRTUAL_DISPLAY_FLAG_OWN_CONTENT_ONLY;

                  virtualDisplay = dm.createVirtualDisplay(
                          "CarAssistantV6",
                          width,
                          height,
                          dpi,
                          surface,
                          flags
                  );

                  if (virtualDisplay == null) {
                      throw new IllegalStateException(
                              "createVirtualDisplay returned null"
                      );
                  }

                  displayId = virtualDisplay.getDisplay().getDisplayId();

                  launchLauncher(context, displayId);

                  XposedBridge.log(
                          TAG + ": VirtualDisplay created id="
                                  + displayId
                                  + " "
                                  + width
                                  + "x"
                                  + height
                                  + " dpi="
                                  + dpi
                  );

                  return displayId;
              }

              private static void launchLauncher(
                      Context context,
                      int displayId) {

                  try {
                      Intent intent = new Intent();
                      intent.setComponent(
                              new android.content.ComponentName(
                                      "com.carassistant.v6",
                                      "com.carassistant.v6.LauncherActivity"
                              )
                      );
                      intent.addFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK
                                      | Intent.FLAG_ACTIVITY_CLEAR_TOP
                                      | Intent.FLAG_ACTIVITY_SINGLE_TOP
                      );

                      ActivityOptions options =
                              ActivityOptions.makeBasic();

                      options.setLaunchDisplayId(displayId);

                      context.startActivityAsUser(
                              intent,
                              UserHandle.CURRENT,
                              options.toBundle()
                      );

                      XposedBridge.log(
                              TAG + ": Launcher requested on display "
                                      + displayId
                      );

                  } catch (Throwable t) {
                      XposedBridge.log(
                              TAG + ": launchLauncher failed: "
                                      + t
                      );
                  }
              }

              private static synchronized void releaseDisplay() {

                  if (virtualDisplay != null) {
                      try {
                          virtualDisplay.release();
                      } catch (Throwable ignored) {
                      }
                  }

                  virtualDisplay = null;
                  displayId = Display.DEFAULT_DISPLAY;
              }

              private static final class ServiceBinder
                      extends android.os.Binder {

                  private final Context context;

                  ServiceBinder(Context context) {
                      this.context = context;

                      attachInterface(
                              null,
                              DESCRIPTOR
                      );
                  }

                  @Override
                  protected boolean onTransact(
                          int code,
                          Parcel data,
                          Parcel reply,
                          int flags) throws android.os.RemoteException {

                      if (code == INTERFACE_TRANSACTION) {
                          reply.writeString(DESCRIPTOR);
                          return true;
                      }

                      data.enforceInterface(DESCRIPTOR);

                      try {
                          if (code == TRANSACTION_CREATE) {

                              int hasSurface = data.readInt();

                              Surface surface = null;

                              if (hasSurface != 0) {
                                  surface =
                                          Surface.CREATOR.createFromParcel(data);
                              }

                              int width = data.readInt();
                              int height = data.readInt();
                              int dpi = data.readInt();

                              int id = createDisplay(
                                      context,
                                      surface,
                                      width,
                                      height,
                                      dpi
                              );

                              reply.writeNoException();
                              reply.writeInt(id);

                              return true;
                          }

                          if (code == TRANSACTION_RELEASE) {

                              releaseDisplay();

                              reply.writeNoException();

                              return true;
                          }

                          return super.onTransact(
                                  code,
                                  data,
                                  reply,
                                  flags
                          );

                      } catch (Throwable t) {

                          reply.writeException(t);

                          XposedBridge.log(
                                  TAG + ": Binder transaction failed: "
                                          + t
                          );

                          return true;
                      }
                  }
              }
          }
          EOF

          # ------------------------------------------------------------
          # XPOSED MODULE ENTRY
          # ------------------------------------------------------------

          mkdir -p system/src/main/assets

          cat > system/src/main/assets/xposed_init <<'EOF'
          com.carassistant.v6.system.SystemServerHook
          EOF

          echo "=== SOURCE TREE ==="
          find . -maxdepth 4 -type f | sort

          echo "=== XPOSED JAR CHECK ==="
          ls -lh libs/api-82.jar

          echo "=== VERIFY DEPENDENCY PATH ==="
          test -f system/../libs/api-82.jar
          echo "OK: system/../libs/api-82.jar exists"

          # Create Gradle wrapper INSIDE the actual project.
          gradle wrapper \
            --gradle-version 8.7 \
            --distribution-type bin

      - name: Build V6-A2
        shell: bash
        run: |
          set -e

          cd v6-a2-source

          chmod +x gradlew

          ./gradlew --version

          ./gradlew \
            :carapp:assembleDebug \
            :system:assembleDebug \
            --stacktrace \
            --info

      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          echo "=== WORKFLOW STATUS ==="
          git status --short || true

          echo "=== V6-A2 FILES ==="
          find v6-a2-source -maxdepth 5 -type f 2>/dev/null | sort || true

          echo "=== XPOSED JAR ==="
          ls -lh \
            v6-a2-source/libs/api-82.jar \
            2>/dev/null || true

          echo "=== APK OUTPUTS ==="
          find v6-a2-source \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print \
            2>/dev/null || true

          echo "=== BUILD LOG TAIL ==="
          find v6-a2-source \
            -type f \
            \( -name "*.log" -o -name "*.txt" \) \
            -print \
            2>/dev/null | head -20 || true

      - name: Upload V6-A2 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: car-assistant-v6-a2
          path: |
            v6-a2-source/carapp/build/outputs/apk/debug/*.apk
            v6-a2-source/system/build/outputs/apk/debug/*.apk
            v6-a2-source/libs/api-82.jar
          if-no-files-found: warn
