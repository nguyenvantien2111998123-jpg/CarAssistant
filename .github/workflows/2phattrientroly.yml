name: 2 phat trien tro ly

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout verified source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify original workflow and required steps
        shell: bash
        run: |
          set -euo pipefail

          FILE=".github/workflows/1phattrientroly.yml"
          EXPECTED="b9ccec46c734ea2865077b12b6543626b11f6db3"

          test -s "$FILE"
          ACTUAL="$(git hash-object "$FILE")"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Source workflow SHA mismatch."
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi

          echo "PASS: original workflow SHA verified"

      - name: Install YAML parser
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-yaml
          python3 -c "import yaml; print('PASS: PyYAML ready')"

      - name: Apply verified original patches
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          path = Path(".github/workflows/1phattrientroly.yml")
          workflow = yaml.safe_load(path.read_text(encoding="utf-8"))
          steps = workflow["jobs"]["build"]["steps"]

          stop_names = {
              "Validate patch and protect passing files",
              "Build APK",
              "Package APK and SHA-256",
              "Upload APK and checksum",
          }

          required = [
              "Verify source SHA, manifest and dependencies",
              "Install workflow parser",
              "Apply existing verified voice baseline",
              "Apply proven V3 floating mic and status auto-hide",
              "Apply command dispatcher, app settings and projected search",
              "Fix app picker and strict projected media routing",
              "Fix voice command routing and Android Auto display launch",
              "Restore known-good keyboard V2A-V2C integration",
              "Verify CarAssistant keyboard",
              "Validate patch and protect passing files",
              "Build APK",
              "Package APK and SHA-256",
          ]

          names = [step.get("name") for step in steps]
          for name in required:
              if names.count(name) != 1:
                  raise SystemExit(
                      "FAIL-CLOSED: expected exactly one step: " + name
                  )

          validate_index = names.index(
              "Validate patch and protect passing files"
          )

          for step in steps[:validate_index]:
              script = step.get("run")
              if not script:
                  continue

              name = step.get("name", "(unnamed step)")
              print("RUN original step:", name, flush=True)

              subprocess.run(
                  ["bash", "-e", "-u", "-o", "pipefail", "-c", script],
                  check=True,
              )

          print("PASS: original source patches applied")
          PY

      - name: Add Voice Input and Command Dispatcher modules
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          base = Path(
              "v10-source/app/src/main/java/com/carassistant/v10"
          )
          activity_path = base / "V10CarActivity.java"
          voice_path = base / "CarAssistantVoiceInput.java"
          dispatcher_path = base / "CarAssistantCommandDispatcher.java"

          if not activity_path.is_file():
              raise SystemExit("FAIL-CLOSED: V10CarActivity.java missing")

          if voice_path.exists() or dispatcher_path.exists():
              raise SystemExit(
                  "FAIL-CLOSED: a new module already exists; refusing overwrite"
              )

          activity = activity_path.read_text(encoding="utf-8")

          old_available = "SpeechRecognizer.isRecognitionAvailable(this)"
          new_available = "CarAssistantVoiceInput.isAvailable(this)"
          old_create = "SpeechRecognizer.createSpeechRecognizer(this)"
          new_create = "CarAssistantVoiceInput.create(this)"

          if activity.count(old_available) != 1:
              raise SystemExit(
                  "FAIL-CLOSED: recognition availability anchor mismatch"
              )

          if activity.count(old_create) != 1:
              raise SystemExit(
                  "FAIL-CLOSED: recognizer creation anchor mismatch"
              )

          activity = activity.replace(old_available, new_available, 1)
          activity = activity.replace(old_create, new_create, 1)

          declaration = re.compile(
              r"(?m)^([ \t]*)private void processVoiceCommand"
              r"\(String spoken\) \{[ \t]*$"
          )
          matches = list(declaration.finditer(activity))

          if len(matches) != 1:
              raise SystemExit(
                  "FAIL-CLOSED: processVoiceCommand declaration mismatch"
              )

          indent = matches[0].group(1)
          wrapper = (
              indent + "private void processVoiceCommand(String spoken) {\n"
              + indent + "    CarAssistantCommandDispatcher.dispatch(\n"
              + indent + "            spoken, this::processVoiceCommandLegacy);\n"
              + indent + "}\n\n"
              + indent + "private void processVoiceCommandLegacy(String spoken) {"
          )

          activity, count = declaration.subn(
              lambda _: wrapper, activity, count=1
          )
          if count != 1:
              raise SystemExit(
                  "FAIL-CLOSED: unable to install command dispatcher"
              )

          voice_source = """package com.carassistant.v10;

          import android.content.Context;
          import android.speech.SpeechRecognizer;

          /**
           * CarAssistant entry point for Android speech recognition.
           * Recognition lifecycle remains with the existing Activity in V1.
           */
          public final class CarAssistantVoiceInput {
              private CarAssistantVoiceInput() {}

              public static boolean isAvailable(Context context) {
                  return context != null
                          && SpeechRecognizer.isRecognitionAvailable(context);
              }

              public static SpeechRecognizer create(Context context) {
                  if (context == null) {
                      throw new IllegalArgumentException("Context is required");
                  }
                  return SpeechRecognizer.createSpeechRecognizer(context);
              }
          }
          """

          dispatcher_source = """package com.carassistant.v10;

          /**
           * Shared entry point for voice commands and future steering-wheel input.
           * The existing command implementation is retained behind CommandSink.
           */
          public final class CarAssistantCommandDispatcher {
              public interface CommandSink {
                  void onCommand(String spoken);
              }

              private CarAssistantCommandDispatcher() {}

              public static void dispatch(String spoken, CommandSink sink) {
                  if (sink == null || spoken == null) return;

                  String command = spoken.trim();
                  if (command.isEmpty()) return;

                  sink.onCommand(command);
              }
          }
          """

          voice_path.write_text(voice_source, encoding="utf-8")
          dispatcher_path.write_text(dispatcher_source, encoding="utf-8")
          activity_path.write_text(activity, encoding="utf-8")

          # Verify module wiring before compiling.
          checks = [
              (voice_path, "SpeechRecognizer.isRecognitionAvailable(context)"),
              (voice_path, "SpeechRecognizer.createSpeechRecognizer(context)"),
              (dispatcher_path, "public static void dispatch("),
              (activity_path, "CarAssistantCommandDispatcher.dispatch("),
              (activity_path, "private void processVoiceCommandLegacy(String spoken)"),
              (activity_path, "CarAssistantVoiceInput.isAvailable(this)"),
              (activity_path, "CarAssistantVoiceInput.create(this)"),
          ]

          for file, required_text in checks:
              content = file.read_text(encoding="utf-8")
              if required_text not in content:
                  raise SystemExit(
                      "FAIL-CLOSED: missing module wiring: "
                      + file.name + " -> " + required_text
                  )

          if activity.count("private void processVoiceCommand(String spoken)") != 1:
              raise SystemExit("FAIL-CLOSED: dispatcher entry point count mismatch")

          print("PASS: Voice Input and Command Dispatcher modules created")
          print("PASS: existing command implementation retained")
          PY

      - name: Validate, build and package APK
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          path = Path(".github/workflows/1phattrientroly.yml")
          workflow = yaml.safe_load(path.read_text(encoding="utf-8"))
          steps = workflow["jobs"]["build"]["steps"]

          wanted = [
              "Validate patch and protect passing files",
              "Build APK",
              "Package APK and SHA-256",
          ]

          for name in wanted:
              matches = [
                  step for step in steps
                  if step.get("name") == name and step.get("run")
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      "FAIL-CLOSED: expected one final step: " + name
                  )

              print("RUN original final step:", name, flush=True)
              subprocess.run(
                  [
                      "bash", "-e", "-u", "-o", "pipefail", "-c",
                      matches[0]["run"]
                  ],
                  check=True,
              )

          print("PASS: validation, APK build and packaging complete")
          PY

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-2-PhatTrienTroLy
          path: |
            dist/CarAssistant-1-PhatTrienTroLy.apk
            dist/CarAssistant-1-PhatTrienTroLy.sha256
          if-no-files-found: error
