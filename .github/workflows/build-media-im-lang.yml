name: Media Im Lang APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/media-im-lang-app
      - fix/media-im-lang-steering-keys

permissions:
  contents: read

concurrency:
  group: media-im-lang-build
  cancel-in-progress: false

jobs:
  build-media-im-lang:
    name: Build standalone Media Im Lang APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build standalone APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :media-im-lang:assembleDebug
          test -s media-im-lang/build/outputs/apk/debug/media-im-lang-debug.apk

      - name: Label APK with source commit and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp v10-source/media-im-lang/build/outputs/apk/debug/media-im-lang-debug.apk dist/Media-Im-Lang.apk
          sha256sum dist/Media-Im-Lang.apk > dist/SHA256SUMS.txt
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "run_number=${GITHUB_RUN_NUMBER}"
          } > dist/BUILD_INFO.txt
          cat dist/BUILD_INFO.txt
          cat dist/SHA256SUMS.txt

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: Media-Im-Lang-${{ github.run_number }}-${{ github.sha }}
          path: |
            dist/Media-Im-Lang.apk
            dist/SHA256SUMS.txt
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14
