name: Fix zoom va auto follow muot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-navigation-map-view:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact baseline and MapLibre dependency
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          GRADLE="v10-source/app/build.gradle"
          EXPECTED_SHA="1600edf884196a146ce5f4233f8de0a8ea282a4e"

          echo "========================================"
          echo "VERIFY EXACT BASELINE"
          echo "========================================"

          test -f "$FILE"
          test -f "$GRADLE"

          ACTUAL_SHA="$(git hash-object "$FILE")"

          echo "Expected SHA: $EXPECTED_SHA"
          echo "Actual SHA:   $ACTUAL_SHA"

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "FAIL: NavigationMapView.java is not the expected main baseline."
            echo "FAIL: Refusing to modify source."
            exit 1
          fi

          echo "PASS: Exact NavigationMapView.java baseline."

          echo
          echo "========================================"
          echo "VERIFY MAPLIBRE VERSION"
          echo "========================================"

          if ! grep -Fq \
            'implementation "org.maplibre.gl:android-sdk:11.11.0"' \
            "$GRADLE"; then
            echo "FAIL: MapLibre Android SDK 11.11.0 was not found."
            exit 1
          fi

          echo "PASS: MapLibre Android SDK 11.11.0."

          echo
          echo "========================================"
          echo "VERIFY SOURCE STRUCTURE"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path
          import sys

          path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          )

          text = path.read_text(encoding="utf-8")


          def require_exact(name, block):
              count = text.count(block)

              if count != 1:
                  print(
                      f"FAIL: {name}: expected exactly 1 match, found {count}"
                  )
                  sys.exit(1)

              print(f"PASS: {name}")


          require_exact(
              "CameraMode import",
              "import org.maplibre.android.location.modes.CameraMode;"
          )

          if "import org.maplibre.android.location.modes.RenderMode;" in text:
              print("FAIL: RenderMode import already exists.")
              sys.exit(1)

          print("PASS: RenderMode import is not present.")


          require_exact(
              "AUTO_FOLLOW_ZOOM",
              "    private static final double AUTO_FOLLOW_ZOOM = 16.0;"
          )

          require_exact(
              "DESTINATION_ZOOM",
              "    private static final double DESTINATION_ZOOM = 15.0;"
          )


          require_exact(
              "existing follow button",
              '''        addControlButton(
                  controls,
                  "◎",
                  "Recenter and resume auto follow",
                  v -> recenter());'''
          )


          require_exact(
              "onMapReady",
              '''    private void onMapReady(
                      MapLibreMap readyMap) {

                  map = readyMap;

                  UiSettings ui =
                      map.getUiSettings();

                  ui.setCompassEnabled(false);

                  ui.setZoomGesturesEnabled(true);

                  ui.setScrollGesturesEnabled(true);

                  ui.setRotateGesturesEnabled(true);

                  ui.setTiltGesturesEnabled(false);

                  map.setStyle(
                      "https://tiles.openfreemap.org/styles/liberty",
                      style -> enableLocation());
              }'''
          )


          require_exact(
              "enableLocation ending",
              '''        map.getLocationComponent()
                  .activateLocationComponent(
                      activation);

              map.getLocationComponent()
                  .setLocationComponentEnabled(true);

              startAutoFollow();'''
          )


          require_exact(
              "startAutoFollow",
              '''    private void startAutoFollow() {

                  if (map == null) {
                      return;
                  }

                  try {

                      map.getLocationComponent()
                          .setCameraMode(
                              CameraMode.TRACKING,
                              800L,
                              AUTO_FOLLOW_ZOOM,
                              null,
                              0.0,
                              null);

                  } catch (Exception ignored) {

                      recenter();
                  }
              }'''
          )


          require_exact(
              "recenter",
              '''    public void recenter() {

                  if (map == null) {
                      return;
                  }

                  try {

                      Location location =
                          map.getLocationComponent()
                              .getLastKnownLocation();

                      if (location == null) {

                          startAutoFollow();

                          return;
                      }

                      map.getLocationComponent()
                          .setCameraMode(
                              CameraMode.TRACKING,
                              500L,
                              AUTO_FOLLOW_ZOOM,
                              null,
                              0.0,
                              null);

                  } catch (Exception ignored) {
                  }
              }'''
          )


          if "setRenderMode(" in text:
              print("FAIL: setRenderMode() already exists.")
              sys.exit(1)

          print("PASS: Source structure matches exact baseline.")
          PY

      - name: Apply exact Java patch
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          EXPECTED_SHA="1600edf884196a146ce5f4233f8de0a8ea282a4e"

          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import sys

          path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          )

          expected_sha = "1600edf884196a146ce5f4233f8de0a8ea282a4e"

          original = path.read_text(encoding="utf-8")

          actual_sha = hashlib.sha1(
              original.encode("utf-8")
          ).hexdigest()

          if actual_sha != expected_sha:
              print("FAIL: Baseline SHA changed before patch.")
              sys.exit(1)


          def replace_exact(text, name, old, new):
              count = text.count(old)

              if count != 1:
                  print(
                      f"FAIL: {name}: expected exactly 1 exact match, found {count}"
                  )
                  sys.exit(1)

              return text.replace(old, new, 1)


          text = original


          old = (
              "import org.maplibre.android.location.modes.CameraMode;\n"
              "import org.maplibre.android.maps.MapLibreMap;"
          )

          new = (
              "import org.maplibre.android.location.modes.CameraMode;\n"
              "import org.maplibre.android.location.modes.RenderMode;\n"
              "import org.maplibre.android.maps.MapLibreMap;"
          )

          text = replace_exact(
              text,
              "RenderMode import",
              old,
              new,
          )


          old = (
              "    private static final double AUTO_FOLLOW_ZOOM = 16.0;"
          )

          new = (
              "    private static final double AUTO_FOLLOW_ZOOM = 17.0;"
          )

          text = replace_exact(
              text,
              "AUTO_FOLLOW_ZOOM",
              old,
              new,
          )


          old = '''        addControlButton(
                  controls,
                  "◎",
                  "Recenter and resume auto follow",
                  v -> recenter());'''

          new = '''        addControlButton(
                  controls,
                  "➤",
                  "Follow current location and direction",
                  v -> followCurrentLocation());'''

          text = replace_exact(
              text,
              "navigation follow button",
              old,
              new,
          )


          old = '''        map.getLocationComponent()
                  .activateLocationComponent(
                      activation);

              map.getLocationComponent()
                  .setLocationComponentEnabled(true);

              startAutoFollow();'''

          new = '''        map.getLocationComponent()
                  .activateLocationComponent(
                      activation);

              map.getLocationComponent()
                  .setLocationComponentEnabled(true);

              map.getLocationComponent()
                  .setRenderMode(RenderMode.GPS);

              startAutoFollow();'''

          text = replace_exact(
              text,
              "enableLocation GPS mode",
              old,
              new,
          )


          old = '''    public void recenter() {

                  if (map == null) {
                      return;
                  }

                  try {

                      Location location =
                          map.getLocationComponent()
                              .getLastKnownLocation();

                      if (location == null) {

                          startAutoFollow();

                          return;
                      }

                      map.getLocationComponent()
                          .setCameraMode(
                              CameraMode.TRACKING,
                              500L,
                              AUTO_FOLLOW_ZOOM,
                              null,
                              0.0,
                              null);

                  } catch (Exception ignored) {
                  }
              }'''

          new = '''    private void followCurrentLocation() {

                  if (map == null) {
                      return;
                  }

                  try {

                      Location location =
                          map.getLocationComponent()
                              .getLastKnownLocation();

                      if (location == null) {

                          startAutoFollow();

                          return;
                      }

                      map.getLocationComponent()
                          .setRenderMode(RenderMode.GPS);

                      map.animateCamera(
                          CameraUpdateFactory.newLatLngZoom(
                              new LatLng(
                                  location.getLatitude(),
                                  location.getLongitude()),
                              AUTO_FOLLOW_ZOOM),
                          500);

                      map.getLocationComponent()
                          .setCameraMode(
                              CameraMode.TRACKING,
                              800L,
                              AUTO_FOLLOW_ZOOM,
                              null,
                              0.0,
                              null);

                  } catch (Exception ignored) {

                      startAutoFollow();
                  }
              }

              public void recenter() {

                  followCurrentLocation();
              }'''

          text = replace_exact(
              text,
              "recenter method",
              old,
              new,
          )


          if text == original:
              print("FAIL: Patch made no changes.")
              sys.exit(1)

          if text.count(
              "import org.maplibre.android.location.modes.RenderMode;"
          ) != 1:
              print("FAIL: RenderMode import count is incorrect.")
              sys.exit(1)

          if text.count(
              "private static final double AUTO_FOLLOW_ZOOM = 17.0;"
          ) != 1:
              print("FAIL: AUTO_FOLLOW_ZOOM is incorrect.")
              sys.exit(1)

          if text.count(
              "setRenderMode(RenderMode.GPS);"
          ) != 2:
              print("FAIL: Expected exactly two RenderMode.GPS calls.")
              sys.exit(1)

          if text.count(
              "private void followCurrentLocation()"
          ) != 1:
              print("FAIL: followCurrentLocation() count is incorrect.")
              sys.exit(1)

          if text.count(
              "public void recenter()"
          ) != 1:
              print("FAIL: recenter() count is incorrect.")
              sys.exit(1)

          if "private static final double AUTO_FOLLOW_ZOOM = 16.0;" in text:
              print("FAIL: Old AUTO_FOLLOW_ZOOM remains.")
              sys.exit(1)

          if "Recenter and resume auto follow" in text:
              print("FAIL: Old follow button remains.")
              sys.exit(1)


          path.write_text(text, encoding="utf-8")

          print("PASS: Exact Java patch written.")
          PY

      - name: Verify final source
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import sys

          path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          )

          text = path.read_text(encoding="utf-8")


          checks = [
              (
                  "RenderMode import",
                  "import org.maplibre.android.location.modes.RenderMode;",
                  1,
              ),
              (
                  "AUTO_FOLLOW_ZOOM 17",
                  "private static final double AUTO_FOLLOW_ZOOM = 17.0;",
                  1,
              ),
              (
                  "GPS render mode",
                  "setRenderMode(RenderMode.GPS);",
                  2,
              ),
              (
                  "followCurrentLocation",
                  "private void followCurrentLocation()",
                  1,
              ),
              (
                  "recenter delegate",
                  '''    public void recenter() {

            followCurrentLocation();
          }''',
                  1,
              ),
          ]


          for name, needle, expected in checks:
              count = text.count(needle)

              if count != expected:
                  print(
                      f"FAIL: {name}: expected {expected}, found {count}"
                  )
                  sys.exit(1)

              print(f"PASS: {name}")


          print("PASS: Final Java source verification.")
          PY

      - name: Verify only NavigationMapView.java changed
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"

          echo "========================================"
          echo "CURRENT DIFF"
          echo "========================================"

          git diff -- "$FILE"

          echo
          echo "========================================"
          echo "CHANGED FILES"
          echo "========================================"

          git status --short

          CHANGED="$(git status --porcelain | awk '{print $2}')"

          if [ "$CHANGED" != "$FILE" ]; then
            echo "FAIL: A file other than NavigationMapView.java changed."
            echo "$CHANGED"
            exit 1
          fi

          echo "PASS: Exactly one tracked file changed."

      - name: Compile Java source against project MapLibre
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "COMPILE CHECK"
          echo "========================================"

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace

          echo
          echo "PASS: NavigationMapView.java compiles."
          echo "PASS: RenderMode.GPS is supported by MapLibre 11.11.0."

      - name: Final changed-file verification
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"

          CHANGED="$(git status --porcelain | awk '{print $2}')"

          if [ "$CHANGED" != "$FILE" ]; then
            echo "FAIL: Unexpected tracked file change detected."
            echo "$CHANGED"
            exit 1
          fi

          git add -- "$FILE"

          STAGED="$(git diff --cached --name-only)"

          if [ "$STAGED" != "$FILE" ]; then
            echo "FAIL: Exactly one staged file was required."
            echo "$STAGED"
            exit 1
          fi

          echo "PASS: Exactly one file staged."

      - name: Commit only NavigationMapView.java
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "Improve NavigationMapView GPS follow"

          COMMITTED_FILES="$(git diff-tree \
            --no-commit-id \
            --name-only \
            -r HEAD)"

          echo "Committed files:"
          echo "$COMMITTED_FILES"

          COUNT="$(printf '%s\n' "$COMMITTED_FILES" | sed '/^$/d' | wc -l | tr -d ' ')"

          if [ "$COUNT" != "1" ]; then
            echo "FAIL: Commit contains more than one file."
            exit 1
          fi

          if [ "$COMMITTED_FILES" != "$FILE" ]; then
            echo "FAIL: Commit is not exclusively NavigationMapView.java."
            exit 1
          fi

          echo "PASS: Commit contains exactly NavigationMapView.java."

      - name: Push to main
        shell: bash
        run: |
          set -euo pipefail

          git push origin HEAD:main

          echo "========================================"
          echo "SUCCESS"
          echo "========================================"
          echo "NavigationMapView.java patched and pushed."
