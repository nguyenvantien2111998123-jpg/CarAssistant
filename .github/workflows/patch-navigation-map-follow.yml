name: Fix zoom va auto follow muot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-navigation-map-view:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ============================================================
      # 2. BASELINE VERIFY
      # ============================================================

      - name: Verify exact Navigation baseline
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          GRADLE="v10-source/app/build.gradle"

          EXPECTED_SHA="1600edf884196a146ce5f4233f8de0a8ea282a4e"

          echo "========================================"
          echo "NAVIGATION BASELINE"
          echo "========================================"

          test -f "$FILE"
          test -f "$GRADLE"

          ACTUAL_SHA="$(sha256sum "$FILE" | awk '{print $1}')"

          echo "Expected SHA: $EXPECTED_SHA"
          echo "Actual SHA:   $ACTUAL_SHA"

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "FAIL: NavigationMapView.java baseline mismatch."
            exit 1
          fi

          echo "PASS: NavigationMapView.java exact baseline."

          echo "Checking MapLibre..."

          grep -Fq \
            'implementation "org.maplibre.gl:android-sdk:11.11.0"' \
            "$GRADLE"

          echo "PASS: MapLibre 11.11.0."

      # ============================================================
      # 3. VERIFY ORIGINAL NAVIGATION STRUCTURE
      # ============================================================

      - name: Verify original Navigation structure
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          )

          source = path.read_text(encoding="utf-8")

          def count(pattern, name, flags=re.MULTILINE):
              matches = list(re.finditer(pattern, source, flags))
              print(f"{name}: {len(matches)}")
              return matches

          # --------------------------------------------------------
          # RenderMode must NOT already exist
          # --------------------------------------------------------

          if "import org.maplibre.android.location.modes.RenderMode;" in source:
              raise SystemExit(
                  "FAIL: RenderMode import already exists."
              )

          if "setRenderMode(" in source:
              raise SystemExit(
                  "FAIL: setRenderMode already exists."
              )

          # --------------------------------------------------------
          # AUTO_FOLLOW_ZOOM
          # --------------------------------------------------------

          matches = count(
              r'private\s+static\s+final\s+double\s+AUTO_FOLLOW_ZOOM\s*=\s*16\.0\s*;',
              "AUTO_FOLLOW_ZOOM 16.0"
          )

          if len(matches) != 1:
              raise SystemExit(
                  f"FAIL: AUTO_FOLLOW_ZOOM expected 1 match, got {len(matches)}"
              )

          # --------------------------------------------------------
          # Existing follow button
          # --------------------------------------------------------

          pattern = (
              r'(?P<indent>[ \t]*)'
              r'addControlButton\(\s*'
              r'controls,\s*'
              r'"◎",\s*'
              r'"Recenter and resume auto follow",\s*'
              r'v\s*->\s*recenter\(\)\s*'
              r'\);'
          )

          matches = count(
              pattern,
              "existing follow button",
              re.MULTILINE
          )

          if len(matches) != 1:
              raise SystemExit(
                  "FAIL: existing follow button expected exactly "
                  f"1 match, got {len(matches)}"
              )

          # --------------------------------------------------------
          # enableLocation location component enabled
          # --------------------------------------------------------

          pattern = (
              r'map\.getLocationComponent\(\)'
              r'\s*\.setLocationComponentEnabled\(true\)\s*;'
          )

          matches = count(
              pattern,
              "location component enabled",
              re.MULTILINE
          )

          if len(matches) != 1:
              raise SystemExit(
                  "FAIL: setLocationComponentEnabled(true) expected "
                  f"1 match, got {len(matches)}"
              )

          # --------------------------------------------------------
          # startAutoFollow
          # --------------------------------------------------------

          pattern = (
              r'private\s+void\s+startAutoFollow\s*\(\s*\)\s*\{'
              r'.*?'
              r'map\.getLocationComponent\(\)'
              r'\s*\.setCameraMode\('
              r'\s*CameraMode\.TRACKING,'
              r'\s*800L,'
              r'\s*AUTO_FOLLOW_ZOOM,'
              r'\s*null,'
              r'\s*0\.0,'
              r'\s*null'
              r'\s*\);'
              r'.*?'
              r'\}'
          )

          matches = count(
              pattern,
              "startAutoFollow",
              re.DOTALL
          )

          if len(matches) != 1:
              raise SystemExit(
                  "FAIL: startAutoFollow expected exactly "
                  f"1 match, got {len(matches)}"
              )

          # --------------------------------------------------------
          # recenter
          # --------------------------------------------------------

          pattern = (
              r'public\s+void\s+recenter\s*\(\s*\)\s*\{'
              r'.*?'
              r'\n\s*\}\s*'
              r'/\*'
              r'\s*=+\s*'
              r'LIFECYCLE'
          )

          matches = count(
              pattern,
              "recenter block",
              re.DOTALL
          )

          if len(matches) != 1:
              raise SystemExit(
                  "FAIL: recenter block expected exactly "
                  f"1 match, got {len(matches)}"
              )

          print("")
          print("PASS: Original Navigation structure verified.")
          PY

      # ============================================================
      # 4. PATCH NAVIGATION
      # ============================================================

      - name: Patch NavigationMapView Follow V2
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          )

          source = path.read_text(encoding="utf-8")

          def replace_once(pattern, replacement, name, flags=re.MULTILINE):
              global source

              matches = list(
                  re.finditer(
                      pattern,
                      source,
                      flags
                  )
              )

              if len(matches) != 1:
                  raise SystemExit(
                      f"FAIL: {name}: expected exactly 1 match, "
                      f"got {len(matches)}"
                  )

              source = re.sub(
                  pattern,
                  replacement,
                  source,
                  count=1,
                  flags=flags
              )

              print(f"PASS: patched {name}")

          # ========================================================
          # 1. ADD RenderMode IMPORT
          # ========================================================

          replace_once(
              r'(import\s+org\.maplibre\.android\.location\.modes\.CameraMode;\s*)',
              r'\1import org.maplibre.android.location.modes.RenderMode;\n',
              "RenderMode import"
          )

          # ========================================================
          # 2. ZOOM 16 -> 17
          # ========================================================

          replace_once(
              r'(private\s+static\s+final\s+double\s+AUTO_FOLLOW_ZOOM\s*=\s*)16\.0(\s*;)',
              r'\g<1>17.0\2',
              "AUTO_FOLLOW_ZOOM 16 -> 17"
          )

          # ========================================================
          # 3. FOLLOW BUTTON
          # ========================================================

          replace_once(
              r'(?P<indent>[ \t]*)'
              r'addControlButton\(\s*'
              r'controls,\s*'
              r'"◎",\s*'
              r'"Recenter and resume auto follow",\s*'
              r'v\s*->\s*recenter\(\)\s*'
              r'\);',
              r'\g<indent>addControlButton(\n'
              r'\g<indent>        controls,\n'
              r'\g<indent>        "➤",\n'
              r'\g<indent>        "Follow current location",\n'
              r'\g<indent>        v -> followCurrentLocation());',
              "follow button"
          )

          # ========================================================
          # 4. ENABLE GPS RENDER MODE
          # ========================================================

          replace_once(
              r'(map\.getLocationComponent\(\)'
              r'\s*\.setLocationComponentEnabled\(true\);\s*)'
              r'(\s*startAutoFollow\(\);)',
              r'\1\n'
              r'        map.getLocationComponent()\n'
              r'                .setRenderMode(RenderMode.GPS);\n'
              r'\2',
              "GPS render mode"
          )

          # ========================================================
          # 5. INSERT followCurrentLocation()
          # ========================================================

          pattern = (
              r'(\n\s*private\s+void\s+startAutoFollow\s*\(\s*\)\s*\{)'
          )

          replacement = (
              '\n'
              '    private void followCurrentLocation() {\n'
              '\n'
              '        if (map == null) {\n'
              '            return;\n'
              '        }\n'
              '\n'
              '        try {\n'
              '\n'
              '            Location location =\n'
              '                    map.getLocationComponent()\n'
              '                            .getLastKnownLocation();\n'
              '\n'
              '            if (location == null) {\n'
              '                startAutoFollow();\n'
              '                return;\n'
              '            }\n'
              '\n'
              '            map.getLocationComponent()\n'
              '                    .setRenderMode(RenderMode.GPS);\n'
              '\n'
              '            map.animateCamera(\n'
              '                    CameraUpdateFactory.newLatLngZoom(\n'
              '                            new LatLng(\n'
              '                                    location.getLatitude(),\n'
              '                                    location.getLongitude()),\n'
              '                            AUTO_FOLLOW_ZOOM),\n'
              '                    500);\n'
              '\n'
              '            map.getLocationComponent()\n'
              '                    .setCameraMode(\n'
              '                            CameraMode.TRACKING,\n'
              '                            500L,\n'
              '                            AUTO_FOLLOW_ZOOM,\n'
              '                            null,\n'
              '                            0.0,\n'
              '                            null);\n'
              '\n'
              '        } catch (Exception ignored) {\n'
              '        }\n'
              '    }\n'
              '\n'
              r'\1'
          )

          replace_once(
              pattern,
              replacement,
              "followCurrentLocation method"
          )

          # ========================================================
          # 6. REPLACE recenter() WITH DELEGATE
          # ========================================================

          pattern = (
              r'    public\s+void\s+recenter\s*\(\s*\)\s*\{'
              r'.*?'
              r'    \}\n'
              r'\n'
              r'    /\*'
              r'\s*=+\s*'
              r'LIFECYCLE'
          )

          replacement = (
              '    public void recenter() {\n'
              '\n'
              '        followCurrentLocation();\n'
              '    }\n'
              '\n'
              '    /*\n'
              '     * =========================================================\n'
              '     * LIFECYCLE'
          )

          replace_once(
              pattern,
              replacement,
              "recenter method",
              re.DOTALL
          )

          path.write_text(
              source,
              encoding="utf-8"
          )

          print("")
          print("PASS: Navigation Follow V2 patch complete.")
          PY

      # ============================================================
      # 5. POST-PATCH VERIFY
      # ============================================================

      - name: Verify Navigation Follow V2
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          )

          source = path.read_text(encoding="utf-8")

          checks = {
              "RenderMode import":
                  r'import\s+org\.maplibre\.android\.location\.modes\.RenderMode\s*;',

              "AUTO_FOLLOW_ZOOM 17":
                  r'private\s+static\s+final\s+double\s+AUTO_FOLLOW_ZOOM\s*=\s*17\.0\s*;',

              "GPS render mode":
                  r'\.setRenderMode\(RenderMode\.GPS\)\s*;',

              "follow button":
                  r'addControlButton\(\s*controls,\s*"➤",\s*"Follow current location",\s*v\s*->\s*followCurrentLocation\(\)\s*\);',

              "followCurrentLocation":
                  r'private\s+void\s+followCurrentLocation\s*\(\s*\)\s*\{',

              "recenter delegates":
                  r'public\s+void\s+recenter\s*\(\s*\)\s*\{\s*followCurrentLocation\(\);\s*\}',

              "CameraMode tracking":
                  r'setCameraMode\(\s*CameraMode\.TRACKING',

              "last known location":
                  r'getLastKnownLocation\(\)',
          }

          for name, pattern in checks.items():

              matches = list(
                  re.finditer(
                      pattern,
                      source,
                      re.DOTALL
                  )
              )

              if not matches:
                  raise SystemExit(
                      f"FAIL: missing {name}"
                  )

              print(
                  f"PASS: {name} ({len(matches)} match)"
              )

          if "AUTO_FOLLOW_ZOOM = 16.0" in source:
              raise SystemExit(
                  "FAIL: old AUTO_FOLLOW_ZOOM 16.0 remains."
              )

          if '"◎"' in source:
              raise SystemExit(
                  "FAIL: old follow button label remains."
              )

          print("")
          print("PASS: Navigation Follow V2 verification.")
          PY

      # ============================================================
      # 6. SHOW DIFF
      # ============================================================

      - name: Show Navigation diff
        shell: bash
        run: |
          set -euo pipefail

          git diff -- \
            v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java

      # ============================================================
      # 7. BUILD
      # ============================================================

      - name: Assemble Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd v10-source

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ============================================================
      # 8. PACKAGE APK
      # ============================================================

      - name: Package Navigation Follow V2 APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          mkdir -p dist

          cp \
            "$APK" \
            "dist/CarAssistant-V10-Navigation-Follow-V2.apk"

          sha256sum \
            "dist/CarAssistant-V10-Navigation-Follow-V2.apk" \
            > \
            "dist/CarAssistant-V10-Navigation-Follow-V2.sha256"

          echo "========================================"
          echo "NAVIGATION FOLLOW V2 APK"
          echo "========================================"

          cat \
            "dist/CarAssistant-V10-Navigation-Follow-V2.sha256"

      # ============================================================
      # 9. UPLOAD
      # ============================================================

      - name: Upload Navigation Follow V2
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Navigation-Follow-V2
          path: |
            dist/CarAssistant-V10-Navigation-Follow-V2.apk
            dist/CarAssistant-V10-Navigation-Follow-V2.sha256
          if-no-files-found: error
