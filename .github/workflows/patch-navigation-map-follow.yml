name: fix zoom va auto follow muot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-navigation-map-view:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact baseline
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          GRADLE="v10-source/app/build.gradle"

          EXPECTED_SHA="1600edf884196a146ce5f4233f8de0a8ea282a4e"

          test -f "$FILE"
          test -f "$GRADLE"

          ACTUAL_SHA=$(sha256sum "$FILE" | awk '{print $1}')

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "FAIL: NavigationMapView.java SHA mismatch."
            echo "Expected: $EXPECTED_SHA"
            echo "Actual:   $ACTUAL_SHA"
            exit 1
          fi

          echo "PASS: NavigationMapView.java exact baseline SHA."

      - name: Verify baseline source structure
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          GRADLE="v10-source/app/build.gradle"

          grep -Fq 'implementation "org.maplibre.gl:android-sdk:11.11.0"' "$GRADLE"
          echo "PASS: MapLibre 11.11.0"

          grep -Fq 'import org.maplibre.android.location.modes.CameraMode;' "$FILE"
          echo "PASS: CameraMode import"

          if grep -Fq 'import org.maplibre.android.location.modes.RenderMode;' "$FILE"; then
            echo "FAIL: RenderMode import already exists."
            exit 1
          fi
          echo "PASS: RenderMode import absent"

          grep -Fq 'private static final double AUTO_FOLLOW_ZOOM = 16.0;' "$FILE"
          echo "PASS: AUTO_FOLLOW_ZOOM = 16.0"

          grep -Fq 'private static final double DESTINATION_ZOOM = 15.0;' "$FILE"
          echo "PASS: DESTINATION_ZOOM = 15.0"

          if grep -Fq 'private void followCurrentLocation()' "$FILE"; then
            echo "FAIL: followCurrentLocation() already exists."
            exit 1
          fi
          echo "PASS: followCurrentLocation() absent"

          if grep -Fq 'setRenderMode(' "$FILE"; then
            echo "FAIL: setRenderMode() already exists."
            exit 1
          fi
          echo "PASS: setRenderMode() absent"

      - name: Verify exact baseline blocks
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          def require_one(pattern, name):
              matches = list(re.finditer(pattern, text, re.MULTILINE))
              if len(matches) != 1:
                  raise SystemExit(
                      f"FAIL: {name}: expected exactly 1 match, found {len(matches)}"
                  )
              print(f"PASS: {name}: exactly 1 match")
              return matches[0]

          # Follow button.
          require_one(
              r'''^[ \t]*addControlButton\(\s*
          [ \t]*controls,\s*
          [ \t]*"◎",\s*
          [ \t]*"Recenter and resume auto follow",\s*
          [ \t]*v[ \t]*->[ \t]*recenter\(\)[ \t]*\);\s*$''',
              "existing follow button"
          )

          # enableLocation ending.
          require_one(
              r'''map\.getLocationComponent\(\)\s*
          \.setLocationComponentEnabled\(true\);\s*
          startAutoFollow\(\);''',
              "enableLocation ending"
          )

          # startAutoFollow.
          require_one(
              r'''private[ \t]+void[ \t]+startAutoFollow\(\)[ \t]*\{[\s\S]*?
          \.setCameraMode\(\s*
          CameraMode\.TRACKING,\s*
          800L,\s*
          AUTO_FOLLOW_ZOOM,\s*
          null,\s*
          0\.0,\s*
          null\);[\s\S]*?
          \}[ \t]*$''',
              "startAutoFollow"
          )

          # recenter.
          require_one(
              r'''public[ \t]+void[ \t]+recenter\(\)[ \t]*\{[\s\S]*?
          Location[ \t]+location[ \t]*=[\s\S]*?
          getLastKnownLocation\(\)[\s\S]*?
          if[ \t]*\([ \t]*location[ \t]*==[ \t]*null[ \t]*\)[\s\S]*?
          startAutoFollow\(\);[\s\S]*?
          \.setCameraMode\(\s*
          CameraMode\.TRACKING,\s*
          500L,\s*
          AUTO_FOLLOW_ZOOM,\s*
          null,\s*
          0\.0,\s*
          null\);[\s\S]*?
          \}[ \t]*\}''',
              "recenter implementation"
          )

          print("PASS: All baseline patch targets matched exactly once.")
          PY

      - name: Patch NavigationMapView
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          def replace_regex_once(text, pattern, replacement, name):
              matches = list(re.finditer(pattern, text, re.MULTILINE))

              if len(matches) != 1:
                  raise SystemExit(
                      f"FAIL: {name}: expected exactly 1 match, found {len(matches)}"
                  )

              print(f"PASS: {name}: exactly 1 match")

              return (
                  text[:matches[0].start()]
                  + replacement
                  + text[matches[0].end():]
              )

          # --------------------------------------------------
          # 1. Add RenderMode import.
          # --------------------------------------------------

          pattern = (
              r'^([ \t]*)import[ \t]+'
              r'org\.maplibre\.android\.location\.modes\.CameraMode;[ \t]*$'
          )

          matches = list(re.finditer(pattern, text, re.MULTILINE))

          if len(matches) != 1:
              raise SystemExit(
                  f"FAIL: RenderMode import anchor: expected exactly 1 match, found {len(matches)}"
              )

          indent = matches[0].group(1)

          replacement = (
              f"{indent}import org.maplibre.android.location.modes.CameraMode;\n"
              f"{indent}import org.maplibre.android.location.modes.RenderMode;"
          )

          text = (
              text[:matches[0].start()]
              + replacement
              + text[matches[0].end():]
          )

          print("PASS: RenderMode import inserted.")

          # --------------------------------------------------
          # 2. AUTO_FOLLOW_ZOOM 16.0 -> 17.0
          # --------------------------------------------------

          text = replace_regex_once(
              text,
              r'^[ \t]*private[ \t]+static[ \t]+final[ \t]+double[ \t]+'
              r'AUTO_FOLLOW_ZOOM[ \t]*=[ \t]*16\.0;[ \t]*$',
              '    private static final double AUTO_FOLLOW_ZOOM = 17.0;',
              "AUTO_FOLLOW_ZOOM"
          )

          # --------------------------------------------------
          # 3. Follow button.
          #    Whitespace tolerant, content strict.
          # --------------------------------------------------

          follow_pattern = (
              r'''^[ \t]*addControlButton\(\s*
          [ \t]*controls,\s*
          [ \t]*"◎",\s*
          [ \t]*"Recenter and resume auto follow",\s*
          [ \t]*v[ \t]*->[ \t]*recenter\(\)[ \t]*\);\s*$'''
          )

          follow_replacement = """        addControlButton(
                controls,
                "➤",
                "Follow current location and direction",
                v -> followCurrentLocation());"""

          text = replace_regex_once(
              text,
              follow_pattern,
              follow_replacement,
              "follow button"
          )

          # --------------------------------------------------
          # 4. enableLocation() -> GPS render mode.
          # --------------------------------------------------

          enable_location_pattern = (
              r'''(?P<indent>[ \t]*)map\.getLocationComponent\(\)\s*
          \.setLocationComponentEnabled\(true\);\s*
          (?P=indent)startAutoFollow\(\);'''
          )

          enable_location_replacement = """        map.getLocationComponent()
                .setLocationComponentEnabled(true);

          map.getLocationComponent()
                .setRenderMode(RenderMode.GPS);

          startAutoFollow();"""

          text = replace_regex_once(
              text,
              enable_location_pattern,
              enable_location_replacement,
              "GPS render mode"
          )

          # --------------------------------------------------
          # 5. Replace recenter() with followCurrentLocation()
          #    + recenter() delegate.
          # --------------------------------------------------

          recenter_pattern = (
              r'''(?ms)^    public[ \t]+void[ \t]+recenter\(\)[ \t]*\{
          .*?
          ^    \}'''
          )

          recenter_replacement = """    private void followCurrentLocation() {

          if (map == null) {
            return;
          }

          try {

            Location location =
                    map.getLocationComponent()
                            .getLastKnownLocation();

            if (location == null) {

                startAutoFollow();

                return;
            }

            map.getLocationComponent()
                    .setRenderMode(RenderMode.GPS);

            map.animateCamera(
                    CameraUpdateFactory.newLatLngZoom(
                            new LatLng(
                                    location.getLatitude(),
                                    location.getLongitude()),
                            AUTO_FOLLOW_ZOOM),
                    500);

            map.getLocationComponent()
                    .setCameraMode(
                            CameraMode.TRACKING,
                            800L,
                            AUTO_FOLLOW_ZOOM,
                            null,
                            0.0,
                            null);

          } catch (Exception ignored) {

            startAutoFollow();
          }
          }

          public void recenter() {

          followCurrentLocation();
          }"""

          # Before replacing, make sure the matched method really
          # contains the expected baseline implementation.
          recenter_matches = list(
              re.finditer(recenter_pattern, text, re.MULTILINE)
          )

          if len(recenter_matches) != 1:
              raise SystemExit(
                  f"FAIL: recenter implementation: expected exactly 1 method, found {len(recenter_matches)}"
              )

          old_recenter = recenter_matches[0].group(0)

          required_fragments = [
              "public void recenter()",
              "getLastKnownLocation()",
              "startAutoFollow();",
              "CameraMode.TRACKING",
              "500L",
              "AUTO_FOLLOW_ZOOM",
          ]

          for fragment in required_fragments:
              if fragment not in old_recenter:
                  raise SystemExit(
                      "FAIL: recenter implementation: "
                      f"matched method does not contain required fragment: {fragment}"
                  )

          print("PASS: recenter implementation: baseline content verified.")

          text = (
              text[:recenter_matches[0].start()]
              + recenter_replacement
              + text[recenter_matches[0].end():]
          )

          print("PASS: recenter implementation patched.")

          path.write_text(text, encoding="utf-8")

          print("PASS: NavigationMapView patch completed.")
          PY

      - name: Verify final source
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"

          grep -Fq 'import org.maplibre.android.location.modes.CameraMode;' "$FILE"
          grep -Fq 'import org.maplibre.android.location.modes.RenderMode;' "$FILE"

          grep -Fq 'private static final double AUTO_FOLLOW_ZOOM = 17.0;' "$FILE"
          grep -Fq 'private static final double DESTINATION_ZOOM = 15.0;' "$FILE"

          grep -Fq '"➤"' "$FILE"
          grep -Fq '"Follow current location and direction"' "$FILE"
          grep -Fq 'v -> followCurrentLocation());' "$FILE"

          grep -Fq 'setRenderMode(RenderMode.GPS);' "$FILE"
          grep -Fq 'private void followCurrentLocation()' "$FILE"
          grep -Fq 'public void recenter()' "$FILE"
          grep -Fq 'followCurrentLocation();' "$FILE"

          COUNT=$(grep -Fc 'setRenderMode(RenderMode.GPS);' "$FILE")
          if [ "$COUNT" -ne 2 ]; then
            echo "FAIL: Expected exactly 2 RenderMode.GPS calls, found $COUNT"
            exit 1
          fi

          FOLLOW_COUNT=$(grep -Fc 'v -> followCurrentLocation());' "$FILE")
          if [ "$FOLLOW_COUNT" -ne 1 ]; then
            echo "FAIL: Expected exactly 1 Follow button callback, found $FOLLOW_COUNT"
            exit 1
          fi

          METHOD_COUNT=$(grep -Fc 'private void followCurrentLocation()' "$FILE")
          if [ "$METHOD_COUNT" -ne 1 ]; then
            echo "FAIL: Expected exactly 1 followCurrentLocation(), found $METHOD_COUNT"
            exit 1
          fi

          echo "PASS: Final NavigationMapView verification."

      - name: Verify only NavigationMapView changed
        shell: bash
        run: |
          set -euo pipefail

          CHANGED=$(git status --short)

          echo "Changed files:"
          echo "$CHANGED"

          COUNT=$(printf '%s\n' "$CHANGED" | sed '/^$/d' | wc -l)

          if [ "$COUNT" -ne 1 ]; then
            echo "FAIL: Expected exactly 1 changed file, found $COUNT"
            exit 1
          fi

          printf '%s\n' "$CHANGED" |
            grep -Fq ' M v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java'

          echo "PASS: Only NavigationMapView.java changed."

      - name: Compile Java source
        shell: bash
        working-directory: v10-source
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew :app:compileDebugJavaWithJavac --no-daemon

      - name: Verify source after compile
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"

          grep -Fq 'import org.maplibre.android.location.modes.RenderMode;' "$FILE"
          grep -Fq 'private static final double AUTO_FOLLOW_ZOOM = 17.0;' "$FILE"
          grep -Fq 'private void followCurrentLocation()' "$FILE"
          grep -Fq 'setRenderMode(RenderMode.GPS);' "$FILE"

          echo "PASS: Source remains patched after compile."

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java

          git diff --cached --check

          git commit -m "Improve navigation auto-follow and direction tracking"

          git push origin HEAD:main
