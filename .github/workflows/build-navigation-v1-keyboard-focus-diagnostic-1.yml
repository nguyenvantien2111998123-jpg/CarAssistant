name: Build Navigation V1 Keyboard Focus Diagnostic 1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout current main source - same baseline as Home UI V2
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify current V10 source and baseline
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source"
          JAVA_SRC="$SRC/app/src/main/java/com/carassistant/v10"

          echo "========================================"
          echo "VERIFY CURRENT V10 SOURCE"
          echo "========================================"

          test -d "$SRC"
          test -f "$SRC/settings.gradle"
          test -f "$SRC/build.gradle"
          test -f "$SRC/gradlew"
          test -f "$SRC/app/build.gradle"
          test -f "$SRC/app/src/main/AndroidManifest.xml"

          test -f "$JAVA_SRC/V10CarActivity.java"
          test -f "$JAVA_SRC/V10ProjectionSession.java"
          test -f "$JAVA_SRC/V10DisplayController.java"
          test -f "$JAVA_SRC/V10SurfaceManager.java"
          test -f "$JAVA_SRC/V10TaskSession.java"
          test -f "$JAVA_SRC/V10SessionStore.java"
          test -f "$JAVA_SRC/NavigationMapView.java"

          echo "PASS: v10-source exists."
          echo "PASS: Gradle files exist."
          echo "PASS: AndroidManifest.xml exists."
          echo "PASS: V10 CORE source exists."
          echo "PASS: NavigationMapView.java exists."

      - name: Verify obsolete source directory is absent
        shell: bash
        run: |
          set -euo pipefail

          if [ -e "navigation-v1-source" ]; then
            echo "ERROR: Obsolete source directory exists."
            exit 1
          fi

          echo "PASS: Obsolete source directory is absent."

      - name: Verify current Git revision matches moving baseline rule
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_COMMIT="$(git rev-parse HEAD)"
          OLD_COMMIT="2c814a181d00cde9547a446927ae181e18cb9cbb"

          echo "Current main commit:"
          echo "$CURRENT_COMMIT"

          if [ "$CURRENT_COMMIT" = "$OLD_COMMIT" ]; then
            echo "ERROR: Repository is unexpectedly pointing to the old Foundation commit."
            exit 1
          fi

          echo "PASS: Current main revision is not the old Foundation commit."

      - name: Verify V10 package tree
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/carassistant/v10"

          if [ -d "v10-source/app/src/main/java/com/hieptran/aacast/doudou" ]; then
            echo "ERROR: Legacy V10 source tree detected."
            exit 1
          fi

          REQUIRED_FILES=(
            "$BASE/aabridge/AACastBridge.java"
            "$BASE/hook/InputHooks.java"
            "$BASE/hook/DisplayHooks.java"
            "$BASE/V10CarActivity.java"
            "$BASE/V10ProjectionSession.java"
            "$BASE/V10DisplayController.java"
            "$BASE/V10SurfaceManager.java"
            "$BASE/V10TaskSession.java"
            "$BASE/V10SessionStore.java"
            "$BASE/V10InputController.java"
            "$BASE/NavigationMapView.java"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing required file: $FILE"
              exit 1
            fi
            echo "PASS: Found $FILE"
          done

          for FILE in "${REQUIRED_FILES[@]}"; do
            if ! grep -q "package com.carassistant.v10" "$FILE"; then
              echo "ERROR: Invalid package declaration in $FILE"
              exit 1
            fi
          done

          echo "PASS: All required V10 source files use com.carassistant.v10."

      - name: Verify Navigation dependency and permissions
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="v10-source/app/build.gradle"
          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          if grep -Fq "org.maplibre.gl:android-sdk:11.11.0" "$GRADLE"; then
            echo "PASS: MapLibre dependency exists."
          else
            echo "ERROR: MapLibre dependency is missing."
            exit 1
          fi

          if grep -Fq "android.permission.ACCESS_FINE_LOCATION" "$MANIFEST"; then
            echo "PASS: ACCESS_FINE_LOCATION exists."
          else
            echo "ERROR: ACCESS_FINE_LOCATION is missing."
            exit 1
          fi

          if grep -Fq "android.permission.ACCESS_COARSE_LOCATION" "$MANIFEST"; then
            echo "PASS: ACCESS_COARSE_LOCATION exists."
          else
            echo "ERROR: ACCESS_COARSE_LOCATION is missing."
            exit 1
          fi

      - name: Verify NavigationMapView source
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"

          check() {
            local label="$1"
            local pattern="$2"

            if grep -Fq "$pattern" "$FILE"; then
              echo "PASS: $label"
            else
              echo "ERROR: $label"
              echo "Missing: $pattern"
              exit 1
            fi
          }

          check "NavigationMapView class" "class NavigationMapView"
          check "MapLibre initialization" "MapLibre.getInstance"
          check "MapLibre map view" "new MapView"
          check "Location component" "getLocationComponent"
          check "OpenFreeMap Liberty style" "https://tiles.openfreemap.org/styles/liberty"
          check "Zoom in" "public void zoomIn()"
          check "Zoom out" "public void zoomOut()"
          check "Recenter" "public void recenter()"
          check "Host resume" "public void onHostResume()"
          check "Host pause" "public void onHostPause()"
          check "Host destroy" "public void onHostDestroy()"

          echo "PASS: NavigationMapView source verification."

      - name: Verify Home UI V2 source
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java"

          check() {
            local label="$1"
            local pattern="$2"

            if grep -Fq "$pattern" "$FILE"; then
              echo "PASS: $label"
            else
              echo "ERROR: $label"
              echo "Missing: $pattern"
              exit 1
            fi
          }

          check "V10CarActivity" "public final class V10CarActivity"
          check "NavigationMapView field" "private NavigationMapView navigationMap;"
          check "NavigationMapView creation" "navigationMap=new NavigationMapView(this);"

          check "Transparent root" "root.setBackgroundColor(Color.TRANSPARENT);"
          check "Transparent launcher layer" "launcherLayer.setBackgroundColor(Color.TRANSPARENT);"
          check "Transparent dashboard" "dashboard.setBackgroundColor(Color.TRANSPARENT);"

          check "APP selector" 'sidebarButton("APP CHỌN")'
          check "TASKS control" '"TASKS"'
          check "MEDIA card" '"MEDIA"'
          check "WYN control" '"WYN"'

          check "Quick launch limit" "Math.min(4,q.size())"
          check "Real application icon" "i.loadIcon(pm)"

          check "Navigation resume" "navigationMap.onHostResume()"
          check "Navigation pause" "navigationMap.onHostPause()"
          check "Navigation destroy" "navigationMap.onHostDestroy()"

          echo "PASS: Home UI V2 source verification."

      - name: Verify Projection Persistence CORE
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/carassistant/v10"

          test -f "$SRC/V10ProjectionSession.java"
          test -f "$SRC/V10DisplayController.java"
          test -f "$SRC/V10SurfaceManager.java"
          test -f "$SRC/V10TaskSession.java"
          test -f "$SRC/V10SessionStore.java"

          sha256sum \
            "$SRC/V10ProjectionSession.java" \
            "$SRC/V10DisplayController.java" \
            "$SRC/V10SurfaceManager.java" \
            "$SRC/V10TaskSession.java" \
            "$SRC/V10SessionStore.java" \
            > /tmp/core.sha256

          echo "Protected CORE files:"
          cat /tmp/core.sha256

          echo "PASS: Projection/Persistence CORE files exist."

      - name: Verify Floating Touch controls
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java"

          check() {
            local label="$1"
            local pattern="$2"

            if grep -Fq "$pattern" "$FILE"; then
              echo "PASS: $label"
            else
              echo "ERROR: $label"
              echo "Missing: $pattern"
              exit 1
            fi
          }

          check "Floating Touch creation" "createFloatingTouchKey()"
          check "Floating Touch timing" "floatingDownTime"
          check "Floating BACK" 'addFloatingMenuButton("BACK"'
          check "Floating HOME" 'addFloatingMenuButton("HOME"'

          echo "PASS: Floating Touch controls."

      - name: Verify Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="v10-source/app/build.gradle"

          check() {
            local label="$1"
            local pattern="$2"

            if grep -Fq "$pattern" "$GRADLE"; then
              echo "PASS: $label"
            else
              echo "ERROR: $label"
              echo "Missing: $pattern"
              exit 1
            fi
          }

          check "Namespace" "namespace 'com.carassistant.v10'"
          check "Application ID" 'applicationId "com.carassistant.v10"'
          check "Compile SDK" "compileSdk 36"
          check "Min SDK" "minSdk 29"
          check "Target SDK" "targetSdk 36"
          check "Java 17" "JavaVersion.VERSION_17"
          check "MapLibre 11.11.0" "org.maplibre.gl:android-sdk:11.11.0"

          echo "PASS: Gradle configuration matches current V10."

      - name: Verify AndroidManifest components
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          check() {
            local label="$1"
            local pattern="$2"

            if grep -Fq "$pattern" "$MANIFEST"; then
              echo "PASS: $label"
            else
              echo "ERROR: $label"
              echo "Missing: $pattern"
              exit 1
            fi
          }

          check "V10LauncherActivity" 'com.carassistant.v10.V10LauncherActivity'
          check "V10CarActivity" 'com.carassistant.v10.V10CarActivity'
          check "V10ControlReceiver" 'com.carassistant.v10.V10ControlReceiver'
          check "AACastCarService" 'com.carassistant.v10.AACastCarService'
          check "DockStateProvider" 'com.carassistant.v10.DockStateProvider'
          check "Android Auto projection category" 'com.google.android.gms.car.category.CATEGORY_PROJECTION'
          check "Android Auto OEM projection category" 'com.google.android.gms.car.category.CATEGORY_PROJECTION_OEM'

          echo "PASS: AndroidManifest components."

      - name: Verify existing input architecture before diagnostic patch
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/carassistant/v10"

          AACAST="$BASE/aabridge/AACastBridge.java"
          INPUT="$BASE/hook/InputHooks.java"
          DISPLAY="$BASE/hook/DisplayHooks.java"
          ACTIVITY="$BASE/V10CarActivity.java"
          CONTROLLER="$BASE/V10InputController.java"

          echo "========================================"
          echo "VERIFY EXISTING INPUT ARCHITECTURE"
          echo "========================================"

          grep -Fq 'package com.carassistant.v10.aabridge;' "$AACAST"
          echo "PASS: AACastBridge package verified"

          grep -Fq 'DisplayHooks.installDisplayFlags' "$AACAST"
          echo "PASS: DisplayHooks.installDisplayFlags exists"

          grep -Fq 'DisplayHooks.installInputPolicy' "$AACAST"
          echo "PASS: DisplayHooks.installInputPolicy exists"

          grep -Fq 'InputHooks.install(param.classLoader);' "$AACAST"
          echo "PASS: AACastBridge installs InputHooks"

          grep -Fq 'injectInputEventToTarget' "$INPUT"
          echo "PASS: InputHooks hooks injectInputEventToTarget"

          grep -Fq 'MotionEvent' "$INPUT"
          echo "PASS: InputHooks handles MotionEvent"

          grep -Fq 'shouldDispatchInputWhenNonInteractive' "$DISPLAY"
          echo "PASS: DisplayHooks input policy exists"

          test -f "$CONTROLLER"
          grep -Fq 'V10InputController' "$ACTIVITY"
          echo "PASS: V10CarActivity references V10InputController"

          grep -Fq 'inputController =' "$ACTIVITY"
          echo "PASS: inputController assignment exists"

          grep -Fq 'new V10InputController(' "$ACTIVITY"
          echo "PASS: V10InputController constructor call exists"

          grep -Fq 'session);' "$ACTIVITY"
          echo "PASS: V10InputController receives session"

          grep -Fq 'setOnTouchListener' "$ACTIVITY"
          echo "PASS: setOnTouchListener exists"

          grep -Fq 'inputController' "$ACTIVITY"
          echo "PASS: inputController is attached to touch listener"

          echo "PASS: Existing input architecture verified."

      - name: Create KeyboardFocusHooks diagnostic class
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/carassistant/v10"
          FILE="$BASE/hook/KeyboardFocusHooks.java"

          cat > "$FILE" <<'JAVA'
          package com.carassistant.v10.hook;

          import android.view.inputmethod.EditorInfo;

          import java.lang.reflect.Method;

          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedBridge;
          import de.robv.android.xposed.XposedHelpers;

          /**
           * Keyboard Focus Diagnostic 1.
           *
           * Diagnostic-only hook for InputMethodManagerService.
           *
           * STRICTLY:
           * - no IME selection
           * - no key injection
           * - no input mutation
           * - no result mutation
           */
          public final class KeyboardFocusHooks {

              private static final String TAG = "[CarAssistant][KeyboardDiag1]";

              private KeyboardFocusHooks() {
              }

              public static void install(ClassLoader classLoader) {
                  XposedBridge.log(TAG + " INSTALL_BEGIN");

                  try {
                      String processName = getProcessName();
                      XposedBridge.log(TAG + " PROCESS_INFO process=" + processName);

                      String bridgeCLName =
                              KeyboardFocusHooks.class.getClassLoader() != null
                                      ? KeyboardFocusHooks.class.getClassLoader().toString()
                                      : "null";

                      String paramCLName =
                              classLoader != null
                                      ? classLoader.toString()
                                      : "null";

                      XposedBridge.log(
                              TAG
                                      + " CLASSLOADER_INFO bridgeCL="
                                      + bridgeCLName
                                      + " paramCL="
                                      + paramCLName);

                      Class<?> imsClass = findIMSClass(classLoader);

                      if (imsClass == null) {
                          XposedBridge.log(
                                  TAG
                                          + " IMS_CLASS_NOT_FOUND target=com.android.server.inputmethod.InputMethodManagerService");
                          return;
                      }

                      String realIMSCL =
                              imsClass.getClassLoader() != null
                                      ? imsClass.getClassLoader().toString()
                                      : "boot/system";

                      XposedBridge.log(
                              TAG
                                      + " IMS_CLASS_FOUND class="
                                      + imsClass.getName()
                                      + " classloader="
                                      + realIMSCL);

                      Method[] methods = imsClass.getDeclaredMethods();
                      int hookedCount = 0;

                      for (Method method : methods) {
                          if (!"startInputOrWindowGainedFocus".equals(method.getName())) {
                              continue;
                          }

                          Class<?>[] paramTypes = method.getParameterTypes();

                          StringBuilder sigBuilder = new StringBuilder();
                          sigBuilder.append(method.getName()).append("(");

                          for (int i = 0; i < paramTypes.length; i++) {
                              if (i > 0) {
                                  sigBuilder.append(", ");
                              }
                              sigBuilder.append(paramTypes[i].getName());
                          }

                          sigBuilder.append(")");

                          final String methodSig = sigBuilder.toString();
                          final int argCount = paramTypes.length;

                          try {
                              XposedBridge.hookMethod(
                                      method,
                                      new XC_MethodHook() {
                                          @Override
                                          protected void beforeHookedMethod(MethodHookParam param) {
                                              inspectFocusRequest(
                                                      param,
                                                      methodSig,
                                                      argCount);
                                          }
                                      });

                              hookedCount++;

                              XposedBridge.log(
                                      TAG
                                              + " HOOKED signature="
                                              + methodSig
                                              + " argCount="
                                              + argCount);

                          } catch (Throwable hookError) {
                              XposedBridge.log(
                                      TAG
                                              + " DIAGNOSTIC_ERROR hook_failed signature="
                                              + methodSig
                                              + " error="
                                              + hookError.getMessage());
                          }
                      }

                      if (hookedCount == 0) {
                          XposedBridge.log(
                                  TAG
                                          + " DIAGNOSTIC_ERROR no_matching_method startInputOrWindowGainedFocus");
                      } else {
                          XposedBridge.log(
                                  TAG
                                          + " INSTALL_OK hookedCount="
                                          + hookedCount);
                      }

                  } catch (Throwable installError) {
                      XposedBridge.log(
                              TAG
                                      + " DIAGNOSTIC_ERROR install_failed error="
                                      + installError.getMessage());
                  }
              }

              private static Class<?> findIMSClass(ClassLoader paramClassLoader) {
                  if (paramClassLoader != null) {
                      try {
                          return XposedHelpers.findClass(
                                  "com.android.server.inputmethod.InputMethodManagerService",
                                  paramClassLoader);
                      } catch (Throwable ignored) {
                      }
                  }

                  try {
                      return XposedHelpers.findClass(
                              "com.android.server.inputmethod.InputMethodManagerService",
                              ClassLoader.getSystemClassLoader());
                  } catch (Throwable ignored) {
                  }

                  try {
                      return XposedHelpers.findClass(
                              "com.android.server.inputmethod.InputMethodManagerService",
                              KeyboardFocusHooks.class.getClassLoader());
                  } catch (Throwable ignored) {
                  }

                  return null;
              }

              private static String getProcessName() {
                  try {
                      Class<?> activityThreadClass =
                              XposedHelpers.findClass(
                                      "android.app.ActivityThread",
                                      null);

                      Object currentProcessName =
                              XposedHelpers.callStaticMethod(
                                      activityThreadClass,
                                      "currentProcessName");

                      return currentProcessName != null
                              ? currentProcessName.toString()
                              : "unknown";

                  } catch (Throwable t) {
                      return "unknown_err:" + t.getMessage();
                  }
              }

              private static void inspectFocusRequest(
                      XC_MethodHook.MethodHookParam param,
                      String methodSig,
                      int argCount) {

                  try {
                      EditorInfo editorInfo = findEditorInfo(param.args);

                      StringBuilder argsTypeLog =
                              new StringBuilder();

                      argsTypeLog.append("[");

                      if (param.args != null) {
                          for (int i = 0; i < param.args.length; i++) {
                              if (i > 0) {
                                  argsTypeLog.append(", ");
                              }

                              Object arg = param.args[i];

                              argsTypeLog
                                      .append(i)
                                      .append(":");

                              if (arg == null) {
                                  argsTypeLog.append("null");
                              } else {
                                  argsTypeLog.append(
                                          arg.getClass().getName());
                              }
                          }
                      }

                      argsTypeLog.append("]");

                      if (editorInfo == null) {
                          XposedBridge.log(
                                  TAG
                                          + " FOCUS_REQUEST EDITOR_INFO_NULL sig="
                                          + methodSig
                                          + " argCount="
                                          + argCount
                                          + " types="
                                          + argsTypeLog);

                          return;
                      }

                      String packageName =
                              String.valueOf(editorInfo.packageName);

                      int inputType = editorInfo.inputType;
                      int imeOptions = editorInfo.imeOptions;
                      int fieldId = editorInfo.fieldId;

                      String fieldName =
                              String.valueOf(editorInfo.fieldName);

                      XposedBridge.log(
                              TAG
                                      + " FOCUS_REQUEST EDITOR_INFO_FOUND sig="
                                      + methodSig
                                      + " package="
                                      + packageName
                                      + " inputType="
                                      + inputType
                                      + " imeOptions="
                                      + imeOptions
                                      + " fieldId="
                                      + fieldId
                                      + " fieldName="
                                      + fieldName
                                      + " types="
                                      + argsTypeLog);

                  } catch (Throwable diagnosticError) {
                      XposedBridge.log(
                              TAG
                                      + " DIAGNOSTIC_ERROR focus_inspect_failed error="
                                      + diagnosticError.getMessage());
                  }
              }

              private static EditorInfo findEditorInfo(Object[] args) {
                  if (args == null) {
                      return null;
                  }

                  for (Object arg : args) {
                      if (arg instanceof EditorInfo) {
                          return (EditorInfo) arg;
                      }
                  }

                  return null;
              }
          }
          JAVA

          echo "PASS: Created KeyboardFocusHooks.java."

      - name: Patch AACastBridge cleanly
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/aabridge/AACastBridge.java"

          python3 - "$FILE" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          import_target = "import com.carassistant.v10.hook.InputHooks;\n"
          import_addition = "import com.carassistant.v10.hook.KeyboardFocusHooks;\n"

          if import_addition in text:
              print("Notice: KeyboardFocusHooks import already present")
          elif import_target in text:
              text = text.replace(
                  import_target,
                  import_target + import_addition,
                  1
              )
          else:
              raise SystemExit(
                  "FAIL: InputHooks import marker not found"
              )

          install_target = "            InputHooks.install(param.classLoader);\n"
          install_addition = "            KeyboardFocusHooks.install(param.classLoader);\n"

          if install_addition in text:
              print("Notice: KeyboardFocusHooks.install already present")
          elif install_target in text:
              text = text.replace(
                  install_target,
                  install_target + install_addition,
                  1
              )
          else:
              raise SystemExit(
                  "FAIL: InputHooks install marker not found"
              )

          path.write_text(text, encoding="utf-8")
          print("PASS: AACastBridge patched successfully.")
          PY

      - name: Verify diagnostic patch and strict non-mutation
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/carassistant/v10"

          AACAST="$BASE/aabridge/AACastBridge.java"
          DIAG="$BASE/hook/KeyboardFocusHooks.java"
          NAV="$BASE/NavigationMapView.java"

          echo "========================================"
          echo "VERIFY DIAGNOSTIC PATCH"
          echo "========================================"

          grep -Fq \
            'import com.carassistant.v10.hook.KeyboardFocusHooks;' \
            "$AACAST"

          grep -Fq \
            'KeyboardFocusHooks.install(param.classLoader);' \
            "$AACAST"

          echo "PASS: AACastBridge imports KeyboardFocusHooks."
          echo "PASS: AACastBridge installs KeyboardFocusHooks."

          grep -Fq \
            'com.android.server.inputmethod.InputMethodManagerService' \
            "$DIAG"

          grep -Fq \
            'startInputOrWindowGainedFocus' \
            "$DIAG"

          grep -Fq \
            'EditorInfo' \
            "$DIAG"

          grep -Fq \
            'FOCUS_REQUEST' \
            "$DIAG"

          grep -Fq \
            'INSTALL_OK' \
            "$DIAG"

          echo "PASS: Diagnostic markers verified."

          echo
          echo "========================================"
          echo "VERIFY STRICT NON-MUTATION"
          echo "========================================"

          if grep -Fq \
            'injectInputEvent' \
            "$DIAG"; then
            echo "ERROR: Key/input injection detected."
            exit 1
          fi

          if grep -Fq \
            'setResult' \
            "$DIAG"; then
            echo "ERROR: Result mutation detected."
            exit 1
          fi

          if grep -Fq \
            'selectInputMethod' \
            "$DIAG"; then
            echo "ERROR: IME selection detected."
            exit 1
          fi

          if grep -Fq \
            'setInputMethod' \
            "$DIAG"; then
            echo "ERROR: Input method mutation detected."
            exit 1
          fi

          echo "PASS: No input injection."
          echo "PASS: No result mutation."
          echo "PASS: No IME selection/mutation."

          if [ ! -f "$NAV" ]; then
            echo "ERROR: NavigationMapView was removed."
            exit 1
          fi

          echo "PASS: NavigationMapView remains intact."

      - name: Verify only intended diagnostic source changes exist
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "SOURCE CHANGE SUMMARY"
          echo "========================================"

          git status --short
          git diff --stat

          echo
          echo "Expected modified source:"
          echo " - AACastBridge.java"
          echo " - KeyboardFocusHooks.java"

          echo
          echo "NavigationMapView must remain unmodified."

          if git diff --name-only | grep -Fxq \
            "v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"; then
            echo "ERROR: NavigationMapView.java was modified."
            exit 1
          fi

          echo "PASS: NavigationMapView.java was not modified."

      - name: Verify Gradle wrapper
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew
          chmod +x ./gradlew

          ./gradlew --version

          echo "PASS: Gradle wrapper is executable."

      - name: Compile diagnostic APK
        working-directory: v10-source
        shell: bash
