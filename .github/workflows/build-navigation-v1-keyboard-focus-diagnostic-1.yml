name: Build Navigation V1 Keyboard Focus Diagnostic 1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact Navigation V1 baseline
        uses: actions/checkout@v4
        with:
          ref: f4a4f5684a0946935cabf6af44a2abbefee2f611
          fetch-depth: 1

      - name: Verify exact baseline and real source tree
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFY EXACT BASELINE"
          echo "========================================"

          EXPECTED="f4a4f5684a0946935cabf6af44a2abbefee2f611"
          ACTUAL="$(git rev-parse HEAD)"

          echo "EXPECTED: $EXPECTED"
          echo "ACTUAL:   $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: Commit does not match baseline"
            exit 1
          fi

          echo "PASS: Commit matches exact baseline"

          echo
          echo "========================================"
          echo "VERIFY REAL SOURCE TREE"
          echo "========================================"

          BASE="v10-source/app/src/main/java/com/carassistant/v10"

          REQUIRED_FILES=(
            "$BASE/aabridge/AACastBridge.java"
            "$BASE/hook/InputHooks.java"
            "$BASE/hook/DisplayHooks.java"
            "$BASE/V10CarActivity.java"
            "$BASE/V10ProjectionSession.java"
            "$BASE/V10DisplayController.java"
            "$BASE/V10InputController.java"
            "$BASE/NavigationMapView.java"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "FAIL: Missing required file $FILE"
              exit 1
            fi
            echo "PASS: Found $FILE"
          done

          echo
          echo "Real source root verified at: $BASE"

      - name: Verify baseline input architecture before patch
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/carassistant/v10"

          AACAST="$BASE/aabridge/AACastBridge.java"
          INPUT="$BASE/hook/InputHooks.java"
          DISPLAY="$BASE/hook/DisplayHooks.java"
          ACTIVITY="$BASE/V10CarActivity.java"

          echo "========================================"
          echo "VERIFY EXISTING INPUT ARCHITECTURE"
          echo "========================================"

          grep -Fq 'package com.carassistant.v10.aabridge;' "$AACAST"
          echo "PASS: AACastBridge package verified"

          grep -Fq 'InputHooks.install(param.classLoader);' "$AACAST"
          echo "PASS: AACastBridge installs InputHooks"

          grep -Fq 'injectInputEventToTarget' "$INPUT"
          echo "PASS: InputHooks hooks injectInputEventToTarget"

          grep -Fq 'MotionEvent' "$INPUT"
          echo "PASS: InputHooks handles MotionEvent"

          grep -Fq 'shouldDispatchInputWhenNonInteractive' "$DISPLAY"
          echo "PASS: DisplayHooks input policy exists"

          grep -Fq 'new V10InputController(session)' "$ACTIVITY"
          echo "PASS: V10CarActivity uses V10InputController"

      - name: Verify Navigation baseline remains untouched before patch
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"

          echo "========================================"
          echo "VERIFY NAVIGATION BASELINE"
          echo "========================================"

          grep -Fq '// buildDestinationSearch(); // Ẩn thanh tìm kiếm, giữ nguyên code phía dưới' "$NAV"

          echo "PASS: Navigation search UI line remains intact"

      - name: Create KeyboardFocusHooks diagnostic class
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/carassistant/v10"
          FILE="$BASE/hook/KeyboardFocusHooks.java"

          cat > "$FILE" <<'JAVA'
          package com.carassistant.v10.hook;

          import android.view.inputmethod.EditorInfo;

          import java.lang.reflect.Method;

          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedBridge;
          import de.robv.android.xposed.XposedHelpers;

          /**
           * Keyboard Focus Diagnostic 1.
           * Pure diagnostic hook to verify process, classloader, IME service class existence,
           * and capture startInputOrWindowGainedFocus overloads.
           */
          public final class KeyboardFocusHooks {

              private static final String TAG = "[CarAssistant][KeyboardDiag1]";

              private KeyboardFocusHooks() {
              }

              public static void install(ClassLoader classLoader) {
                  XposedBridge.log(TAG + " INSTALL_BEGIN");

                  try {
                      String processName = getProcessName();
                      XposedBridge.log(TAG + " PROCESS_INFO process=" + processName);

                      String bridgeCLName = KeyboardFocusHooks.class.getClassLoader() != null
                              ? KeyboardFocusHooks.class.getClassLoader().toString() : "null";
                      String paramCLName = classLoader != null
                              ? classLoader.toString() : "null";

                      XposedBridge.log(TAG + " CLASSLOADER_INFO bridgeCL=" + bridgeCLName + " paramCL=" + paramCLName);

                      Class<?> imsClass = findIMSClass(classLoader);

                      if (imsClass == null) {
                          XposedBridge.log(TAG + " IMS_CLASS_NOT_FOUND target=com.android.server.inputmethod.InputMethodManagerService");
                          return;
                      }

                      String realIMSCL = imsClass.getClassLoader() != null
                              ? imsClass.getClassLoader().toString() : "boot/system";
                      XposedBridge.log(TAG + " IMS_CLASS_FOUND class=" + imsClass.getName() + " classloader=" + realIMSCL);

                      Method[] methods = imsClass.getDeclaredMethods();
                      int hookedCount = 0;

                      for (Method method : methods) {
                          if (!"startInputOrWindowGainedFocus".equals(method.getName())) {
                              continue;
                          }

                          Class<?>[] paramTypes = method.getParameterTypes();
                          StringBuilder sigBuilder = new StringBuilder();
                          sigBuilder.append(method.getName()).append("(");
                          for (int i = 0; i < paramTypes.length; i++) {
                              if (i > 0) sigBuilder.append(", ");
                              sigBuilder.append(paramTypes[i].getName());
                          }
                          sigBuilder.append(")");

                          final String methodSig = sigBuilder.toString();
                          final int argCount = paramTypes.length;

                          try {
                              XposedBridge.hookMethod(method, new XC_MethodHook() {
                                  @Override
                                  protected void beforeHookedMethod(MethodHookParam param) {
                                      inspectFocusRequest(param, methodSig, argCount);
                                  }
                              });

                              hookedCount++;
                              XposedBridge.log(TAG + " HOOKED signature=" + methodSig + " argCount=" + argCount);

                          } catch (Throwable hookError) {
                              XposedBridge.log(TAG + " DIAGNOSTIC_ERROR hook_failed signature=" + methodSig + " error=" + hookError.getMessage());
                          }
                      }

                      if (hookedCount == 0) {
                          XposedBridge.log(TAG + " DIAGNOSTIC_ERROR no_matching_method startInputOrWindowGainedFocus");
                      } else {
                          XposedBridge.log(TAG + " INSTALL_OK hookedCount=" + hookedCount);
                      }

                  } catch (Throwable installError) {
                      XposedBridge.log(TAG + " DIAGNOSTIC_ERROR install_failed error=" + installError.getMessage());
                  }
              }

              private static Class<?> findIMSClass(ClassLoader paramClassLoader) {
                  // Strategy 1: Try paramClassLoader
                  if (paramClassLoader != null) {
                      try {
                          return XposedHelpers.findClass("com.android.server.inputmethod.InputMethodManagerService", paramClassLoader);
                      } catch (Throwable ignored) {
                      }
                  }

                  // Strategy 2: Try system server boot classloader
                  try {
                      return XposedHelpers.findClass("com.android.server.inputmethod.InputMethodManagerService", ClassLoader.getSystemClassLoader());
                  } catch (Throwable ignored) {
                  }

                  // Strategy 3: Try current context/bridge classloader
                  try {
                      return XposedHelpers.findClass("com.android.server.inputmethod.InputMethodManagerService", KeyboardFocusHooks.class.getClassLoader());
                  } catch (Throwable ignored) {
                  }

                  return null;
              }

              private static String getProcessName() {
                  try {
                      Class<?> activityThreadClass = XposedHelpers.findClass("android.app.ActivityThread", null);
                      Object currentProcessName = XposedHelpers.callStaticMethod(activityThreadClass, "currentProcessName");
                      return currentProcessName != null ? currentProcessName.toString() : "unknown";
                  } catch (Throwable t) {
                      return "unknown_err:" + t.getMessage();
                  }
              }

              private static void inspectFocusRequest(XC_MethodHook.MethodHookParam param, String methodSig, int argCount) {
                  try {
                      EditorInfo editorInfo = findEditorInfo(param.args);

                      StringBuilder argsTypeLog = new StringBuilder();
                      argsTypeLog.append("[");
                      if (param.args != null) {
                          for (int i = 0; i < param.args.length; i++) {
                              if (i > 0) argsTypeLog.append(", ");
                              Object arg = param.args[i];
                              argsTypeLog.append(i).append(":");
                              if (arg == null) {
                                  argsTypeLog.append("null");
                              } else {
                                  argsTypeLog.append(arg.getClass().getName());
                              }
                          }
                      }
                      argsTypeLog.append("]");

                      if (editorInfo == null) {
                          XposedBridge.log(TAG + " FOCUS_REQUEST EDITOR_INFO_NULL sig=" + methodSig + " argCount=" + argCount + " types=" + argsTypeLog.toString());
                          return;
                      }

                      String packageName = String.valueOf(editorInfo.packageName);
                      int inputType = editorInfo.inputType;
                      int imeOptions = editorInfo.imeOptions;
                      int fieldId = editorInfo.fieldId;
                      String fieldName = String.valueOf(editorInfo.fieldName);

                      XposedBridge.log(TAG + " FOCUS_REQUEST EDITOR_INFO_FOUND sig=" + methodSig
                              + " package=" + packageName
                              + " inputType=" + inputType
                              + " imeOptions=" + imeOptions
                              + " fieldId=" + fieldId
                              + " fieldName=" + fieldName
                              + " types=" + argsTypeLog.toString());

                  } catch (Throwable diagnosticError) {
                      XposedBridge.log(TAG + " DIAGNOSTIC_ERROR focus_inspect_failed error=" + diagnosticError.getMessage());
                  }
              }

              private static EditorInfo findEditorInfo(Object[] args) {
                  if (args == null) {
                      return null;
                  }
                  for (Object arg : args) {
                      if (arg instanceof EditorInfo) {
                          return (EditorInfo) arg;
                      }
                  }
                  return null;
              }
          }
          JAVA

          echo "PASS: Created KeyboardFocusHooks.java diagnostic source"

      - name: Patch AACastBridge cleanly using Python
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/aabridge/AACastBridge.java"

          python3 - "$FILE" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          import_target = "import com.carassistant.v10.hook.InputHooks;\n"
          import_addition = "import com.carassistant.v10.hook.KeyboardFocusHooks;\n"

          if import_addition in text:
              print("Notice: KeyboardFocusHooks import already present")
          elif import_target in text:
              text = text.replace(import_target, import_target + import_addition, 1)
          else:
              raise SystemExit("FAIL: Exact import marker for InputHooks not found")

          install_target = "            InputHooks.install(param.classLoader);\n"
          install_addition = "            KeyboardFocusHooks.install(param.classLoader);\n"

          if install_addition in text:
              print("Notice: KeyboardFocusHooks.install already present")
          elif install_target in text:
              text = text.replace(install_target, install_target + install_addition, 1)
          else:
              raise SystemExit("FAIL: Exact install marker in system_server block not found")

          path.write_text(text, encoding="utf-8")
          print("PASS: AACastBridge patched successfully")
          PY

      - name: Verify exact source modifications
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/carassistant/v10"

          AACAST="$BASE/aabridge/AACastBridge.java"
          DIAG="$BASE/hook/KeyboardFocusHooks.java"
          NAV="$BASE/NavigationMapView.java"

          echo "========================================"
          echo "VERIFY CODE INJECTION"
          echo "========================================"

          grep -Fq 'import com.carassistant.v10.hook.KeyboardFocusHooks;' "$AACAST"
          grep -Fq 'KeyboardFocusHooks.install(param.classLoader);' "$AACAST"
          echo "PASS: AACastBridge calls KeyboardFocusHooks.install"

          grep -Fq 'INSTALL_BEGIN' "$DIAG"
          grep -Fq 'IMS_CLASS_FOUND' "$DIAG"
          grep -Fq 'IMS_CLASS_NOT_FOUND' "$DIAG"
          grep -Fq 'HOOKED' "$DIAG"
          grep -Fq 'EDITOR_INFO_FOUND' "$DIAG"
          grep -Fq 'EDITOR_INFO_NULL' "$DIAG"
          echo "PASS: Diagnostic markers exist in KeyboardFocusHooks"

          echo
          echo "========================================"
          echo "VERIFY NAVIGATION BASELINE STILL UNTOUCHED"
          echo "========================================"

          grep -Fq '// buildDestinationSearch(); // Ẩn thanh tìm kiếm, giữ nguyên code phía dưới' "$NAV"
          echo "PASS: NavigationMapView remains intact"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            :app:assembleDebug \
            --stacktrace

      - name: Verify build artifact and output SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "FAIL: Built APK not found at $APK"
            exit 1
          fi

          echo "========================================"
          echo "APK VERIFICATION SUCCESSFUL"
          echo "========================================"

          ls -lh "$APK"
          sha256sum "$APK"

      - name: Verify git diff stat and check
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "GIT DIFF STAT"
          echo "========================================"
          git diff --stat

          echo
          echo "========================================"
          echo "GIT DIFF CHECK"
          echo "========================================"
          git diff --check || true

          echo
          echo "========================================"
          echo "UNTRACKED / NEW FILES"
          echo "========================================"
          git status --short

      - name: Upload Diagnostic 1 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: navigation-v1-keyboard-focus-diagnostic-1
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
