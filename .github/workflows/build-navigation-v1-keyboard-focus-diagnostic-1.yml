name: Build Navigation V1 Keyboard Focus Diagnostic 1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact Navigation V1 baseline
        uses: actions/checkout@v4
        with:
          ref: f4a4f5684a0946935cabf6af44a2abbefee2f611
          fetch-depth: 1

      - name: Verify exact baseline and real source tree
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFY EXACT BASELINE"
          echo "========================================"

          EXPECTED="f4a4f5684a0946935cabf6af44a2abbefee2f611"
          ACTUAL="$(git rev-parse HEAD)"

          echo "EXPECTED: $EXPECTED"
          echo "ACTUAL:   $ACTUAL"

          test "$ACTUAL" = "$EXPECTED"

          echo "PASS: commit matches exact baseline"

          echo
          echo "========================================"
          echo "VERIFY REAL SOURCE TREE"
          echo "========================================"

          BASE="v10-source/app/src/main/java/com/carassistant/v10"

          REQUIRED_FILES=(
            "$BASE/aabridge/AACastBridge.java"
            "$BASE/hook/InputHooks.java"
            "$BASE/hook/DisplayHooks.java"
            "$BASE/V10CarActivity.java"
            "$BASE/V10ProjectionSession.java"
            "$BASE/V10DisplayController.java"
            "$BASE/V10InputController.java"
            "$BASE/NavigationMapView.java"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "FAIL: missing $FILE"
              exit 1
            fi
            echo "PASS: $FILE"
          done

          echo
          echo "Real source root:"
          echo "$BASE"

      - name: Verify baseline input architecture before patch
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/carassistant/v10"

          AACAST="$BASE/aabridge/AACastBridge.java"
          INPUT="$BASE/hook/InputHooks.java"
          DISPLAY="$BASE/hook/DisplayHooks.java"
          ACTIVITY="$BASE/V10CarActivity.java"

          echo "========================================"
          echo "VERIFY EXISTING INPUT ARCHITECTURE"
          echo "========================================"

          grep -Fq 'package com.carassistant.v10.aabridge;' "$AACAST"
          echo "PASS: AACastBridge package"

          grep -Fq 'InputHooks.install(param.classLoader);' "$AACAST"
          echo "PASS: AACastBridge installs InputHooks"

          grep -Fq 'injectInputEventToTarget' "$INPUT"
          echo "PASS: InputHooks hooks injectInputEventToTarget"

          grep -Fq 'MotionEvent' "$INPUT"
          echo "PASS: InputHooks handles MotionEvent"

          grep -Fq 'shouldDispatchInputWhenNonInteractive' "$DISPLAY"
          echo "PASS: DisplayHooks input policy exists"

          grep -Fq 'new V10InputController(session)' "$ACTIVITY"
          echo "PASS: V10CarActivity uses V10InputController"

          echo
          echo "Existing baseline input path is touch/MotionEvent based."
          echo "Diagnostic 1 will add logging only."

      - name: Verify Navigation baseline remains untouched before patch
        shell: bash
        run: |
          set -euo pipefail

          NAV="v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"

          echo "========================================"
          echo "VERIFY NAVIGATION BASELINE"
          echo "========================================"

          grep -Fq '// buildDestinationSearch(); // Ẩn thanh tìm kiếm, giữ nguyên code phía dưới' "$NAV"

          echo "PASS: Navigation search UI remains disabled exactly as baseline"

      - name: Create framework-signature-independent keyboard focus diagnostic
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/carassistant/v10"
          FILE="$BASE/hook/KeyboardFocusHooks.java"

          cat > "$FILE" <<'JAVA'
          package com.carassistant.v10.hook;

          import android.view.inputmethod.EditorInfo;

          import java.lang.reflect.Method;

          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedBridge;
          import de.robv.android.xposed.XposedHelpers;

          /**
           * Keyboard Focus Diagnostic 1.
           *
           * Diagnostic only.
           *
           * This hook intentionally does NOT assume a specific Android framework
           * method signature. It discovers every method named
           * startInputOrWindowGainedFocus() and hooks every overload.
           *
           * It does not:
           * - create an IME
           * - select/change an IME
           * - change focus
           * - modify EditorInfo
           * - inject text
           * - inject key events
           * - change Navigation UI
           */
          public final class KeyboardFocusHooks {

              private static final String TAG =
                      "[CarAssistant][KeyboardDiag1]";

              private KeyboardFocusHooks() {
              }

              public static void install(ClassLoader classLoader) {
                  try {
                      Class<?> imsClass =
                              XposedHelpers.findClass(
                                      "com.android.server.inputmethod.InputMethodManagerService",
                                      classLoader);

                      Method[] methods =
                              imsClass.getDeclaredMethods();

                      int hookedCount = 0;

                      for (Method method : methods) {
                          if (!"startInputOrWindowGainedFocus"
                                  .equals(method.getName())) {
                              continue;
                          }

                          try {
                              XposedBridge.hookMethod(
                                      method,
                                      new XC_MethodHook() {
                                          @Override
                                          protected void beforeHookedMethod(
                                                  MethodHookParam param) {
                                              inspectFocusRequest(param);
                                          }
                                      });

                              hookedCount++;

                              XposedBridge.log(
                                      TAG
                                              + " HOOKED method="
                                              + method.getName()
                                              + " params="
                                              + method.getParameterTypes().length);

                          } catch (Throwable hookError) {
                              XposedBridge.log(
                                      TAG
                                              + " METHOD_HOOK_ERROR "
                                              + method
                                              + " error="
                                              + hookError);
                          }
                      }

                      if (hookedCount == 0) {
                          XposedBridge.log(
                                  TAG
                                          + " NO_METHOD_FOUND "
                                          + "startInputOrWindowGainedFocus");
                      } else {
                          XposedBridge.log(
                                  TAG
                                          + " INSTALL_OK hookedMethods="
                                          + hookedCount);
                      }

                  } catch (Throwable installError) {
                      XposedBridge.log(
                              TAG
                                      + " INSTALL_ERROR "
                                      + installError);
                  }
              }

              private static void inspectFocusRequest(
                      XC_MethodHook.MethodHookParam param) {

                  try {
                      EditorInfo editorInfo =
                              findEditorInfo(param.args);

                      if (editorInfo == null) {
                          XposedBridge.log(
                                  TAG
                                          + " FOCUS_REQUEST "
                                          + "EditorInfo=null"
                                          + " args="
                                          + safeArgCount(param.args));
                          return;
                      }

                      String packageName =
                              editorInfo.packageName;

                      int inputType =
                              editorInfo.inputType;

                      int imeOptions =
                              editorInfo.imeOptions;

                      String fieldName =
                              String.valueOf(editorInfo.fieldName);

                      int fieldId =
                              editorInfo.fieldId;

                      XposedBridge.log(
                              TAG
                                      + " FOCUS_REQUEST"
                                      + " package="
                                      + String.valueOf(packageName)
                                      + " inputType="
                                      + inputType
                                      + " imeOptions="
                                      + imeOptions
                                      + " fieldId="
                                      + fieldId
                                      + " fieldName="
                                      + fieldName);

                      inspectArguments(param.args);

                  } catch (Throwable diagnosticError) {
                      XposedBridge.log(
                              TAG
                                      + " DIAGNOSTIC_ERROR "
                                      + diagnosticError);
                  }
              }

              private static EditorInfo findEditorInfo(
                      Object[] args) {

                  if (args == null) {
                      return null;
                  }

                  for (Object arg : args) {
                      if (arg instanceof EditorInfo) {
                          return (EditorInfo) arg;
                      }
                  }

                  return null;
              }

              private static int safeArgCount(
                      Object[] args) {

                  return args == null ? 0 : args.length;
              }

              private static void inspectArguments(
                      Object[] args) {

                  if (args == null) {
                      return;
                  }

                  StringBuilder out =
                          new StringBuilder(
                                  TAG + " ARG_TYPES");

                  for (int i = 0;
                       i < args.length;
                       i++) {

                      Object arg = args[i];

                      out.append(" [")
                              .append(i)
                              .append("]=");

                      if (arg == null) {
                          out.append("null");
                          continue;
                      }

                      out.append(
                              arg.getClass().getName());

                      /*
                       * We deliberately do not dump arbitrary object contents.
                       * Some framework objects may contain sensitive or very
                       * large state. Only class names are needed for Diagnostic 1.
                       */
                  }

                  XposedBridge.log(
                          out.toString());
              }
          }
          JAVA

          echo "PASS: created framework-signature-independent diagnostic"
          echo "$FILE"

      - name: Patch AACastBridge with diagnostic hook
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/aabridge/AACastBridge.java"

          python3 - "$FILE" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          import_marker = (
              "import com.carassistant.v10.hook.InputHooks;\n"
          )

          diagnostic_import = (
              "import com.carassistant.v10.hook.KeyboardFocusHooks;\n"
          )

          if diagnostic_import in text:
              raise SystemExit(
                  "FAIL: KeyboardFocusHooks import already exists"
              )

          if import_marker not in text:
              raise SystemExit(
                  "FAIL: exact InputHooks import marker not found"
              )

          text = text.replace(
              import_marker,
              import_marker + diagnostic_import,
              1
          )

          install_marker = (
              "            InputHooks.install(param.classLoader);\n"
              "            return;\n"
          )

          install_replacement = (
              "            InputHooks.install(param.classLoader);\n"
              "            KeyboardFocusHooks.install(param.classLoader);\n"
              "            return;\n"
          )

          if install_marker not in text:
              raise SystemExit(
                  "FAIL: exact system_server install block not found"
              )

          text = text.replace(
              install_marker,
              install_replacement,
              1
          )

          path.write_text(text, encoding="utf-8")
          PY

          echo "PASS: AACastBridge patched"

      - name: Verify diagnostic patch exactly
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/carassistant/v10"

          AACAST="$BASE/aabridge/AACastBridge.java"
          DIAG="$BASE/hook/KeyboardFocusHooks.java"
          NAV="$BASE/NavigationMapView.java"

          echo "========================================"
          echo "VERIFY DIAGNOSTIC PATCH"
          echo "========================================"

          grep -Fq \
            'import com.carassistant.v10.hook.KeyboardFocusHooks;' \
            "$AACAST"

          grep -Fq \
            'KeyboardFocusHooks.install(param.classLoader);' \
            "$AACAST"

          echo "PASS: AACastBridge installs KeyboardFocusHooks"

          grep -Fq \
            'InputMethodManagerService' \
            "$DIAG"

          grep -Fq \
            'startInputOrWindowGainedFocus' \
            "$DIAG"

          grep -Fq \
            'EditorInfo' \
            "$DIAG"

          grep -Fq \
            'FOCUS_REQUEST' \
            "$DIAG"

          echo "PASS: diagnostic contains framework-independent focus detection"

          echo
          echo "========================================"
          echo "VERIFY NO FUNCTIONAL INPUT MODIFICATION"
          echo "========================================"

          if grep -Fq \
            'InputMethodManager' \
            "$DIAG"; then
              echo "FAIL: client-side IME manipulation found"
              exit 1
          fi

          if grep -Fq \
            'input text' \
            "$DIAG"; then
              echo "FAIL: text injection found"
              exit 1
          fi

          if grep -Fq \
            'injectInputEvent' \
            "$DIAG"; then
              echo "FAIL: input injection found"
              exit 1
          fi

          if grep -Fq \
            'setResult' \
            "$DIAG"; then
              echo "FAIL: framework result modification found"
              exit 1
          fi

          echo "PASS: no IME manipulation"
          echo "PASS: no text injection"
          echo "PASS: no input injection"
          echo "PASS: no framework result modification"

          echo
          echo "========================================"
          echo "VERIFY NAVIGATION UNCHANGED"
          echo "========================================"

          grep -Fq \
            '// buildDestinationSearch(); // Ẩn thanh tìm kiếm, giữ nguyên code phía dưới' \
            "$NAV"

          echo "PASS: Navigation search baseline unchanged"

      - name: Show changed files
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CHANGED FILES"
          echo "========================================"

          git status --short

          echo
          echo "Expected changes:"
          echo "  1. New KeyboardFocusHooks.java"
          echo "  2. AACastBridge.java diagnostic import/install only"
          echo
          echo "No NavigationMapView.java modification."
          echo "No V10ProjectionSession.java modification."
          echo "No V10DisplayController.java modification."
          echo "No InputHooks.java modification."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            :app:assembleDebug \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "FAIL: APK not found"
            exit 1
          fi

          echo "========================================"
          echo "APK RESULT"
          echo "========================================"

          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload Diagnostic 1 APK
        uses: actions/upload-artifact@v4
        with:
          name: navigation-v1-keyboard-focus-diagnostic-1
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
