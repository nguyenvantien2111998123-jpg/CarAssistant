                                  this,
                                  "Cần cấp quyền micro để dùng trợ lý giọng nói",
                                  Toast.LENGTH_LONG).show();
                      }
                  }
              }

              private void handleVoiceYouTubeQuery(String spokenText) {
                  if (spokenText == null || spokenText.trim().isEmpty()) {
                      Toast.makeText(
                              this,
                              "Câu lệnh đang trống",
                              Toast.LENGTH_SHORT).show();
                      return;
                  }

                  String query = spokenText.trim()
                          .replaceFirst("(?i)^\\s*(mở|tìm|phát)\\s+", "")
                          .replaceFirst("(?i)\\s+(trên\\s+)?youtube\\s*$", "")
                          .trim();

                  if (query.isEmpty()) {
                      query = spokenText.trim();
                  }

                  Intent launchIntent = getPackageManager()
                          .getLaunchIntentForPackage("com.google.android.youtube");

                  if (launchIntent == null || launchIntent.getComponent() == null) {
                      Toast.makeText(
                              this,
                              "Không tìm thấy ứng dụng YouTube",
                              Toast.LENGTH_LONG).show();
                      return;
                  }

                  if (session == null) {
                      Toast.makeText(
                              this,
                              "Màn hình chiếu chưa sẵn sàng",
                              Toast.LENGTH_LONG).show();
                      return;
                  }

                  final int displayId = session.getDisplayId();
                  if (displayId < 0) {
                      Toast.makeText(
                              this,
                              "Chưa xác định được màn hình chiếu",
                              Toast.LENGTH_LONG).show();
                      return;
                  }

                  launchProjection(launchIntent.getComponent());

                  final String searchUrl;
                  try {
                      searchUrl = "https://www.youtube.com/results?search_query="
                              + URLEncoder.encode(query, "UTF-8");
                  } catch (Exception e) {
                      Toast.makeText(
                              this,
                              "Không thể xử lý từ khóa tìm kiếm",
                              Toast.LENGTH_LONG).show();
                      return;
                  }

                  Toast.makeText(
                          this,
                          "Đang tìm trên YouTube: " + query,
                          Toast.LENGTH_LONG).show();

                  handler.postDelayed(() -> RootShellSession.EXEC.execute(() -> {
                      try {
                          String command =
                                  "am start --display " + displayId
                                  + " -a android.intent.action.VIEW"
                                  + " -d '" + searchUrl + "'"
                                  + " com.google.android.youtube";

                          new RootShellSession().run(12, command);
                      } catch (Exception e) {
                          handler.post(() -> Toast.makeText(
                                  V10CarActivity.this,
                                  "Không mở được kết quả YouTube",
                                  Toast.LENGTH_LONG).show());
                      }
                  }), 1400);
              }

          '''

          closing = text.rfind("\n}")
