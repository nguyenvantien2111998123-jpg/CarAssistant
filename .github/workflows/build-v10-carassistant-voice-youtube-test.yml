name: Test tro ly giong noi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      # ============================================================
      # 0. CHECKOUT
      # ============================================================

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 1. DIAGNOSTIC VERIFY REAL MAIN SOURCE
      #
      # IMPORTANT:
      # Do NOT fail immediately on first grep.
      # Print every PASS/FAIL and show actual source around failures.
      # ============================================================

      - name: Diagnostic verify main source anchors
        shell: bash
        run: |
          set -uo pipefail

          BASE="v10-source/app/src/main/java/com/carassistant/v10"

          echo "========================================"
          echo "CarAssistant Keyboard PASS"
          echo "DIAGNOSTIC SOURCE VERIFICATION"
          echo "========================================"

          echo ""
          echo "Git commit:"
          git rev-parse HEAD

          echo ""
          echo "Git branch:"
          git branch --show-current

          echo ""
          echo "========================================"
          echo "FILE EXISTENCE"
          echo "========================================"

          FAILURES=0

          check_file() {
            local file="$1"

            if [ -f "$file" ]; then
              echo "PASS: file exists: $file"
            else
              echo "FAIL: missing file: $file"
              FAILURES=$((FAILURES + 1))
            fi
          }

          check_file "$BASE/V10CarActivity.java"
          check_file "$BASE/V10ProjectionSession.java"
          check_file "$BASE/RootShellSession.java"
          check_file "$BASE/NavigationMapView.java"

          if [ "$FAILURES" -ne 0 ]; then
            echo ""
            echo "========================================"
            echo "FILE CHECK FAILED"
            echo "FAILURES: $FAILURES"
            echo "========================================"
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "V10CarActivity.java DIAGNOSTIC"
          echo "========================================"

          python3 <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java"
          )

          source = path.read_text()

          checks = [
              (
                  "session field",
                  r'^\s*(?:(?:public|protected|private)\s+)?V10ProjectionSession\s+session;',
                  "session"
              ),
              (
                  "session.attachTextureView",
                  r'session\.attachTextureView\s*\(',
                  "attachTextureView"
              ),
              (
                  "createFloatingTouchKey",
                  r'createFloatingTouchKey\s*\(\s*\)\s*;',
                  "createFloatingTouchKey"
              ),
              (
                  "launchProjection method",
                  r'^\s*(?:(?:public|protected|private)\s+)?void\s+launchProjection\s*\([^)]*\)\s*\{',
                  "launchProjection"
              ),
              (
                  "returnToLauncher method",
                  r'^\s*(?:(?:public|protected|private)\s+)?void\s+returnToLauncher\s*\([^)]*\)\s*\{',
                  "returnToLauncher"
              ),
              (
                  "showApps method",
                  r'^\s*(?:(?:public|protected|private)\s+)?void\s+showApps\s*\([^)]*\)\s*\{',
                  "showApps"
              ),
              (
                  "onPause method",
                  r'^\s*@Override\s+(?:(?:public|protected|private)\s+)?void\s+onPause\s*\([^)]*\)\s*\{',
                  "onPause"
              ),
              (
                  "onStop method",
                  r'^\s*@Override\s+(?:(?:public|protected|private)\s+)?void\s+onStop\s*\([^)]*\)\s*\{',
                  "onStop"
              ),
              (
                  "onDestroy method",
                  r'^\s*@Override\s+(?:(?:public|protected|private)\s+)?void\s+onDestroy\s*\([^)]*\)\s*\{',
                  "onDestroy"
              ),
          ]

          failures = 0

          lines = source.splitlines()

          def show_context(label):
              print("")
              print("----- ACTUAL SOURCE CONTEXT:", label, "-----")

              pattern_map = {
                  "session": r'V10ProjectionSession\s+session',
                  "attachTextureView": r'attachTextureView',
                  "createFloatingTouchKey": r'createFloatingTouchKey',
                  "launchProjection": r'\blaunchProjection\s*\(',
                  "returnToLauncher": r'\breturnToLauncher\s*\(',
                  "showApps": r'\bshowApps\s*\(',
                  "onPause": r'\bonPause\s*\(',
                  "onStop": r'\bonStop\s*\(',
                  "onDestroy": r'\bonDestroy\s*\(',
              }

              p = pattern_map.get(label, label)

              found = False

              for i, line in enumerate(lines):
                  if re.search(p, line):
                      found = True

                      start = max(0, i - 3)
                      end = min(len(lines), i + 8)

                      for n in range(start, end):
                          print(
                              f"{n + 1:4}: {lines[n]}"
                          )

                      break

              if not found:
                  print("No obvious source line found for:", label)

              print("---------------------------------------------")

          for name, pattern, label in checks:

              matches = list(
                  re.finditer(
                      pattern,
                      source,
                      re.MULTILINE
                  )
              )

              if len(matches) == 1:

                  print(
                      f"PASS: {name} "
                      f"(exactly 1 match)"
                  )

              elif len(matches) == 0:

                  print(
                      f"FAIL: {name} "
                      f"(0 matches)"
                  )

                  show_context(label)

                  failures += 1

              else:

                  print(
                      f"FAIL: {name} "
                      f"({len(matches)} matches; expected exactly 1)"
                  )

                  show_context(label)

                  failures += 1

          print("")
          print("========================================")
          print("V10CarActivity.java RESULT")
          print("========================================")

          if failures == 0:
              print("PASS: All V10CarActivity anchors verified.")
          else:
              print(
                  f"FAIL: {failures} V10CarActivity anchor(s) failed."
              )

          sys.exit(failures)
          PY

      # ============================================================
      # 2. V10ProjectionSession + OTHER SOURCE DIAGNOSTIC
      # ============================================================

      - name: Diagnostic verify projection and navigation source
        shell: bash
        run: |
          set -uo pipefail

          BASE="v10-source/app/src/main/java/com/carassistant/v10"

          python3 <<'PY'
          import re
          import sys
          from pathlib import Path

          checks = [
              (
                  Path(
                      "v10-source/app/src/main/java/com/carassistant/v10/V10ProjectionSession.java"
                  ),
                  "getDisplayId method",
                  r'^\s*(?:(?:public|protected|private)\s+)?(?:final\s+)?int\s+getDisplayId\s*\(\s*\)',
              ),
              (
                  Path(
                      "v10-source/app/src/main/java/com/carassistant/v10/V10ProjectionSession.java"
                  ),
                  "isActive method",
                  r'^\s*(?:(?:public|protected|private)\s+)?(?:final\s+)?boolean\s+isActive\s*\(\s*\)',
              ),
              (
                  Path(
                      "v10-source/app/src/main/java/com/carassistant/v10/RootShellSession.java"
                  ),
                  "RootShellSession class",
                  r'^\s*(?:(?:public|protected|private)\s+)?(?:abstract|final\s+)?class\s+RootShellSession\b',
              ),
              (
                  Path(
                      "v10-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
                  ),
                  "NavigationMapView class",
                  r'^\s*(?:(?:public|protected|private)\s+)?(?:abstract|final\s+)?class\s+NavigationMapView\b',
              ),
          ]

          failures = 0

          def context(path, pattern):

              print("")
              print(
                  "----- ACTUAL SOURCE CONTEXT:",
                  path.name,
                  "-----"
              )

              try:
                  lines = path.read_text().splitlines()
              except Exception as e:
                  print("Cannot read file:", e)
                  return

              for i, line in enumerate(lines):

                  if re.search(
                          pattern,
                          line,
                          re.MULTILINE):

                      start = max(0, i - 3)
                      end = min(
                          len(lines),
                          i + 8
                      )

                      for n in range(start, end):
                          print(
                              f"{n + 1:4}: {lines[n]}"
                          )

                      return

              print(
                  "No matching source line found."
              )

          for path, name, pattern in checks:

              if not path.exists():

                  print(
                      f"FAIL: {name} "
                      f"(file missing: {path})"
                  )

                  failures += 1
                  continue

              source = path.read_text()

              matches = list(
                  re.finditer(
                      pattern,
                      source,
                      re.MULTILINE
                  )
              )

              if len(matches) == 1:

                  print(
                      f"PASS: {name} "
                      f"(exactly 1 match)"
                  )

              elif len(matches) == 0:

                  print(
                      f"FAIL: {name} "
                      f"(0 matches)"
                  )

                  context(path, pattern)

                  failures += 1

              else:

                  print(
                      f"FAIL: {name} "
                      f"({len(matches)} matches)"
                  )

                  context(path, pattern)

                  failures += 1

          print("")
          print("========================================")
          print("PROJECTION / NAVIGATION RESULT")
          print("========================================")

          if failures == 0:
              print(
                  "PASS: Projection and Navigation source anchors verified."
              )
          else:
              print(
                  f"FAIL: {failures} source anchor(s) failed."
              )

          sys.exit(failures)
          PY

      # ============================================================
      # 3. V2A - KEYBOARD UI
      # ============================================================

      - name: Create Keyboard V2A
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/carassistant/v10"

          cat > "$BASE/CarAssistantKeyboard.java" <<'EOF'
          package com.carassistant.v10;

          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.util.Locale;

          public final class CarAssistantKeyboard {

              public interface Action {
                  void text(String value);
                  void key(int keyCode);
              }

              private final FrameLayout host;
              private final Action action;

              private LinearLayout panel;
              private boolean visible;

              public CarAssistantKeyboard(
                      FrameLayout host,
                      Action action) {

                  this.host = host;
                  this.action = action;
              }

              public boolean isVisible() {
                  return visible;
              }

              public void show() {

                  if (panel == null) {

                      panel = buildKeyboard();

                      FrameLayout.LayoutParams p =
                              new FrameLayout.LayoutParams(
                                      -1,
                                      dp(270),
                                      Gravity.BOTTOM);

                      p.setMargins(
                              dp(8),
                              0,
                              dp(8),
                              dp(8));

                      host.addView(panel, p);
                  }

                  panel.setVisibility(View.VISIBLE);
                  panel.bringToFront();

                  visible = true;
              }

              public void hide() {

                  if (panel != null) {
                      panel.setVisibility(View.GONE);
                  }

                  visible = false;
              }

              private LinearLayout buildKeyboard() {

                  LinearLayout root =
                          new LinearLayout(host.getContext());

                  root.setOrientation(
                          LinearLayout.VERTICAL);

                  root.setPadding(
                          dp(8),
                          dp(8),
                          dp(8),
                          dp(8));

                  GradientDrawable bg =
                          new GradientDrawable();

                  bg.setColor(
                          Color.rgb(15, 20, 26));

                  bg.setCornerRadius(dp(18));

                  bg.setStroke(
                          dp(1),
                          Color.rgb(65, 85, 105));

                  root.setBackground(bg);
                  root.setElevation(dp(18));

                  addRow(root, "1234567890");
                  addRow(root, "QWERTYUIOP");
                  addRow(root, "ASDFGHJKL");
                  addRow(root, "ZXCVBNM");

                  LinearLayout bottom =
                          new LinearLayout(host.getContext());

                  bottom.setGravity(Gravity.CENTER);

                  addKey(
                          bottom,
                          "⌫",
                          1.35f,
                          () -> action.key(
                                  KeyEvent.KEYCODE_DEL));

                  addKey(
                          bottom,
                          "SPACE",
                          3.8f,
                          () -> action.key(
                                  KeyEvent.KEYCODE_SPACE));

                  addKey(
                          bottom,
                          "ENTER",
                          1.55f,
                          () -> action.key(
                                  KeyEvent.KEYCODE_ENTER));

                  root.addView(
                          bottom,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1f));

                  return root;
              }

              private void addRow(
                      LinearLayout root,
                      String values) {

                  LinearLayout row =
                          new LinearLayout(
                                  host.getContext());

                  row.setGravity(Gravity.CENTER);

                  for (int i = 0;
                       i < values.length();
                       i++) {

                      final String value =
                              String.valueOf(
                                      values.charAt(i))
                                      .toLowerCase(
                                              Locale.ROOT);

                      addKey(
                              row,
                              String.valueOf(
                                      values.charAt(i)),
                              1f,
                              () -> action.text(value));
                  }

                  root.addView(
                          row,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1f));
              }

              private void addKey(
                      LinearLayout row,
                      String label,
                      float weight,
                      Runnable click) {

                  TextView key =
                          new TextView(
                                  host.getContext());

                  key.setText(label);

                  key.setTextColor(Color.WHITE);

                  key.setTextSize(
                          label.length() > 1
                                  ? 13
                                  : 18);

                  key.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD);

                  key.setGravity(Gravity.CENTER);

                  GradientDrawable bg =
                          new GradientDrawable();

                  bg.setColor(
                          Color.rgb(32, 41, 50));

                  bg.setCornerRadius(dp(11));

                  key.setBackground(bg);

                  key.setOnClickListener(
                          v -> click.run());

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(
                                  0,
                                  -1,
                                  weight);

                  p.setMargins(
                          dp(3),
                          dp(3),
                          dp(3),
                          dp(3));

                  row.addView(key, p);
              }

              private int dp(int value) {

                  return Math.round(
                          value *
                          host.getResources()
                              .getDisplayMetrics()
                              .density);
              }
          }
          EOF

          echo "PASS: V2A keyboard UI created."

      # ============================================================
      # 4. V2B - INPUT BRIDGE
      # ============================================================

      - name: Create Keyboard V2B Input Bridge
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/carassistant/v10"

          cat > "$BASE/CarAssistantInputBridge.java" <<'EOF'
          package com.carassistant.v10;

          import android.util.Log;

          public final class CarAssistantInputBridge {

              private static final String TAG =
                      "CarAssistantInputBridge";

              private final V10ProjectionSession session;

              private final RootShellSession rootShell =
                      new RootShellSession();

              public CarAssistantInputBridge(
                      V10ProjectionSession session) {

                  this.session = session;
              }

              public void text(String value) {

                  if (!session.isActive()
                          || value == null
                          || value.length() == 0) {
                      return;
                  }

                  String safe =
                          value
                                  .replace("\\", "\\\\")
                                  .replace("'", "'\\''")
                                  .replace("\n", "")
                                  .replace("\r", "");

                  String command =
                          "/system/bin/input -d "
                          + session.getDisplayId()
                          + " text '"
                          + safe
                          + "'";

                  run(command);
              }

              public void key(int keyCode) {

                  if (!session.isActive()) {
                      return;
                  }

                  run(
                          "/system/bin/input -d "
                          + session.getDisplayId()
                          + " keyevent "
                          + keyCode);
              }

              private void run(String command) {

                  RootShellSession.EXEC.execute(
                          () -> {

                              try {

                                  rootShell.run(
                                          5,
                                          command);

                              } catch (Throwable t) {

                                  Log.w(
                                          TAG,
                                          "input failed",
                                          t);
                              }
                          });
              }

              public void destroy() {
                  // Lifecycle is controlled by V2C.
              }
          }
          EOF

          echo "PASS: V2B input bridge created."

      # ============================================================
      # 5. V2C - CONTROLLER / LIFECYCLE
      # ============================================================

      - name: Create Keyboard V2C Controller
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/carassistant/v10"

          cat > "$BASE/CarAssistantKeyboardController.java" <<'EOF'
          package com.carassistant.v10;

          import android.os.Handler;
          import android.os.Looper;
          import android.util.Log;
          import android.widget.FrameLayout;

          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public final class CarAssistantKeyboardController {

              private static final String TAG =
                      "CarAssistantKeyboard";

              private static final long POLL_MS =
                      800L;

              private static final Pattern SHOWN =
                      Pattern.compile(
                              "mInputShown\\s*=\\s*(true|false)");

              private final V10ProjectionSession session;

              private final CarAssistantKeyboard keyboard;

              private final CarAssistantInputBridge bridge;

              private final Handler handler =
                      new Handler(
                              Looper.getMainLooper());

              private final RootShellSession stateShell =
                      new RootShellSession();

              private boolean started;

              private boolean lastShown;

              private final Runnable poller =
                      new Runnable() {

                  @Override
                  public void run() {

                      if (!started) {
                          return;
                      }

                      if (!session.isActive()) {

                          keyboard.hide();

                          handler.postDelayed(
                                  this,
                                  POLL_MS);

                          return;
                      }

                      RootShellSession.EXEC.execute(
                              () -> {

                          boolean shown = false;

                          try {

                              String out =
                                      stateShell.run(
                                              3,
                                              "dumpsys input_method "
                                              + "| grep -m 1 "
                                              + "mInputShown || true");

                              Matcher m =
                                      SHOWN.matcher(out);

                              if (m.find()) {

                                  shown =
                                          "true".equalsIgnoreCase(
                                                  m.group(1));
                              }

                          } catch (Throwable t) {

                              Log.w(
                                      TAG,
                                      "IME state failed",
                                      t);
                          }

                          final boolean state =
                                  shown;

                          if (state != lastShown) {

                              lastShown = state;

                              handler.post(
                                      () -> {

                                  if (!started
                                          || !session.isActive()) {

                                      keyboard.hide();

                                      return;
                                  }

                                  if (state) {
                                      keyboard.show();
                                  } else {
                                      keyboard.hide();
                                  }
                              });
                          }

                          if (started) {

                              handler.postDelayed(
                                      this,
                                      POLL_MS);
                          }
                      });
                  }
              };

              public CarAssistantKeyboardController(
                      FrameLayout host,
                      V10ProjectionSession session) {

                  this.session = session;

                  bridge =
                          new CarAssistantInputBridge(
                                  session);

                  keyboard =
                          new CarAssistantKeyboard(
                                  host,
                                  new CarAssistantKeyboard.Action() {

                              @Override
                              public void text(
                                      String value) {

                                  bridge.text(value);
                              }

                              @Override
                              public void key(
                                      int keyCode) {

                                  bridge.key(keyCode);
                              }
                          });
              }

              public void start() {

                  if (started) {
                      return;
                  }

                  started = true;

                  lastShown = false;

                  keyboard.hide();

                  handler.removeCallbacks(
                          poller);

                  handler.post(poller);
              }

              public void stop() {

                  started = false;

                  handler.removeCallbacks(
                          poller);

                  keyboard.hide();
              }

              public void hide() {

                  lastShown = false;

                  keyboard.hide();
              }
          }
          EOF

          echo "PASS: V2C controller created."

      # ============================================================
      # 6. INSPECT ACTUAL V10CarActivity
      # ============================================================

      - name: Inspect actual V10CarActivity source
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java"

          echo "========================================"
          echo "ACTUAL V10CarActivity SOURCE"
          echo "========================================"

          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java"
          )

          source = path.read_text()

          patterns = {
              "launchProjection":
                  r'(?:(?:public|protected|private)\s+)?void\s+launchProjection\s*\([^)]*\)\s*\{[^}]*\}',

              "returnToLauncher":
                  r'(?:(?:public|protected|private)\s+)?void\s+returnToLauncher\s*\([^)]*\)\s*\{[^}]*\}',

              "showApps":
                  r'(?:(?:public|protected|private)\s+)?void\s+showApps\s*\([^)]*\)\s*\{[^}]*',

              "onPause":
                  r'@Override\s+(?:(?:public|protected|private)\s+)?void\s+onPause\s*\([^)]*\)\s*\{[^}]*',

              "onDestroy":
                  r'@Override\s+(?:(?:public|protected|private)\s+)?void\s+onDestroy\s*\([^)]*\)\s*\{[^}]*',
          }

          for name, pattern in patterns.items():

              print("")
              print("=== ", name, " ===")

              match = re.search(
                  pattern,
                  source,
                  re.DOTALL
              )

              if match:
                  print(match.group(0))
              else:
                  print("NOT FOUND")
          PY

      # ============================================================
      # 7. PATCH V10CarActivity
      # ============================================================

      - name: Patch V10CarActivity
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import re
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java"
          )

          source = path.read_text()

          def replace_regex_once(
                  pattern,
                  replacement,
                  name):

              global source

              matches = list(
                  re.finditer(
                      pattern,
                      source,
                      re.MULTILINE
                  )
              )

              if len(matches) != 1:

                  raise SystemExit(
                      f"{name}: expected exactly 1 match, "
                      f"got {len(matches)}"
                  )

              source = re.sub(
                  pattern,
                  replacement,
                  source,
                  count=1,
                  flags=re.MULTILINE
              )

          replace_regex_once(
              r'(\s*(?:(?:public|protected|private)\s+)?V10ProjectionSession\s+session;)',

              r'\1\n'
              r'    private CarAssistantKeyboardController keyboardController;',

              "keyboard field"
          )

          replace_regex_once(
              r'(session\.attachTextureView\(\s*textureView\);[\s\n]*createFloatingTouchKey\(\);)',

              r'\1\n\n'
              r'        keyboardController =\n'
              r'                new CarAssistantKeyboardController(\n'
              r'                        projectionLayer,\n'
              r'                        session);\n'
              r'        keyboardController.start();',

              "keyboard initialization"
          )

          replace_regex_once(
              r'((?:(?:public|protected|private)\s+)?void\s+launchProjection\s*\([^)]*\)\s*\{)',

              r'\1\n'
              r'        if (keyboardController != null) {\n'
              r'            keyboardController.hide();\n'
              r'        }\n',

              "keyboard hide on projection launch"
          )

          replace_regex_once(
              r'((?:(?:public|protected|private)\s+)?void\s+returnToLauncher\s*\([^)]*\)\s*\{)',

              r'\1\n'
              r'        if (keyboardController != null) {\n'
              r'            keyboardController.hide();\n'
              r'        }\n',

              "keyboard hide on launcher"
          )

          replace_regex_once(
              r'((?:(?:public|protected|private)\s+)?void\s+showApps\s*\([^)]*\)\s*\{)',

              r'\1\n'
              r'        if (keyboardController != null) {\n'
              r'            keyboardController.hide();\n'
              r'        }\n',

              "keyboard hide on app selector"
          )

          replace_regex_once(
              r'(@Override\s+(?:(?:public|protected|private)\s+)?void\s+onPause\s*\([^)]*\)\s*\{)',

              r'\1\n'
