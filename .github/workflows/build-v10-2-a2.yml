name: Build Car Assistant V10.2-A2.1 Gearhead Dock Control Bar

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # GRADLE 8.13
      # ============================================================

      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            https://services.gradle.org/distributions/gradle-8.13-bin.zip

          unzip -q \
            gradle-8.13-bin.zip \
            -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-8.13/bin" \
            >> "$GITHUB_PATH"

      # ============================================================
      # VERIFY EXISTING V10 SOURCE
      # ============================================================

      - name: Verify V10 source exists
        shell: bash
        run: |
          set -euo pipefail

          test -d v10-source
          test -f v10-source/settings.gradle

          test -f \
            v10-source/app/src/main/AndroidManifest.xml

          echo "Existing V10 source found."

      # ============================================================
      # NORMALIZE PACKAGE
      # ============================================================

      - name: Normalize V10 package
        shell: bash
        run: |
          set -euo pipefail

          find v10-source \
            -type f \
            \( \
              -name '*.java' \
              -o -name '*.xml' \
              -o -name '*.gradle' \
            \) \
            -print0 |
            xargs -0 sed -i \
              -e 's/com\.carassistant\.v9/com.carassistant.v10/g' \
              -e 's/Car Assistant V9/Car Assistant V10/g' \
              -e 's/AACast V9/AACast V10/g'

      # ============================================================
      # REMOVE OLD V9 ACTIVITIES
      # ============================================================

      - name: Remove old V9 activities
        shell: bash
        run: |
          set -euo pipefail

          JAVA="v10-source/app/src/main/java"

          find "$JAVA" \
            -type f \
            \( \
              -name 'MainActivity.java' \
              -o -name 'AACastCarActivity.java' \
              -o -name 'LeaseTicker.java' \
            \) \
            -print \
            -delete

          OLD_FILES="$(
            find "$JAVA" \
              -type f \
              \( \
                -name 'MainActivity.java' \
                -o -name 'AACastCarActivity.java' \
                -o -name 'LeaseTicker.java' \
              \)
          )"

          if [ -n "$OLD_FILES" ]; then
            echo "ERROR: Old V9 files remain:"
            echo "$OLD_FILES"
            exit 1
          fi

          echo "Old V9 activities removed."

      # ============================================================
      # WRITE GEARHEAD CONTROL BAR
      # ============================================================

      - name: Write GearheadControlBar
        shell: bash
        run: |
          set -euo pipefail

          BAR="v10-source/app/src/main/java/com/hieptran/aacast/doudou/hook/GearheadControlBar.java"

          mkdir -p "$(dirname "$BAR")"

          cat > "$BAR" <<'EOF'
package com.carassistant.v10.hook;

import android.content.Context;
import android.content.Intent;
import android.graphics.Color;
import android.view.Gravity;
import android.view.View;
import android.view.ViewGroup;
import android.widget.LinearLayout;
import android.widget.TextView;

import java.util.Collections;
import java.util.IdentityHashMap;
import java.util.Set;

import de.robv.android.xposed.XC_MethodHook;
import de.robv.android.xposed.XposedBridge;
import de.robv.android.xposed.XposedHelpers;

public final class GearheadControlBar {

    private static final String TAG =
            "[V10 ControlBar]";

    private static final String GEARHEAD =
            "com.google.android.projection.gearhead";

    private static final String ACTION =
            "com.carassistant.v10.CONTROL";

    private static final String COMMAND =
            "command";

    private static final String[] DOCK_NAMES = {
            "nav_bar_container",
            "car_navigation_bar",
            "dock_container",
            "nav_bar",
            "floating_nav_bar_view",
            "navigation_bar_container",
            "navigation_bar",
            "bottom_navigation_bar",
            "system_navigation_bar",
            "navbar",
            "car_sys_ui_navbar"
    };

    private static final Set<ViewGroup> INSTALLED =
            Collections.newSetFromMap(
                    new IdentityHashMap<>());

    private GearheadControlBar() {
    }

    public static void install() {

        try {

            Class<?> wmg =
                    XposedHelpers.findClass(
                            "android.view.WindowManagerGlobal",
                            null);

            XposedBridge.hookAllMethods(
                    wmg,
                    "addView",
                    new XC_MethodHook() {

                        @Override
                        protected void afterHookedMethod(
                                MethodHookParam param) {

                            if (param.args.length > 0
                                    && param.args[0]
                                    instanceof View) {

                                View root =
                                        (View) param.args[0];

                                root.post(
                                        () -> scanRoot(root));
                            }
                        }
                    });

            scanExistingRoots();

            XposedBridge.log(
                    TAG +
                    " Gearhead dock-tree hook installed");

        } catch (Throwable t) {

            XposedBridge.log(
                    TAG +
                    " install failed: " +
                    t);
        }
    }

    private static void scanExistingRoots() {

        try {

            Object global =
                    XposedHelpers.callStaticMethod(
                            XposedHelpers.findClass(
                                    "android.view.WindowManagerGlobal",
                                    null),
                            "getInstance");

            String[] names =
                    (String[]) XposedHelpers.callMethod(
                            global,
                            "getViewRootNames");

            if (names == null) {
                return;
            }

            for (String name : names) {

                Object root =
                        XposedHelpers.callMethod(
                                global,
                                "getRootView",
                                name);

                if (root instanceof View) {

                    View view =
                            (View) root;

                    view.post(
                            () -> scanRoot(view));
                }
            }

        } catch (Throwable t) {

            XposedBridge.log(
                    TAG +
                    " existing-root scan failed: " +
                    t);
        }
    }

    private static void scanRoot(
            View root) {

        try {

            if (!root.isAttachedToWindow()
                    || root.getDisplay() == null
                    || root.getDisplay()
                            .getDisplayId() <= 0
                    || !(root instanceof ViewGroup)) {

                return;
            }

            ViewGroup dock =
                    findDockContainer(
                            (ViewGroup) root,
                            1200);

            if (dock == null
                    || INSTALLED.contains(dock)) {

                return;
            }

            LinearLayout bar =
                    new LinearLayout(
                            dock.getContext());

            bar.setOrientation(
                    LinearLayout.HORIZONTAL);

            bar.setGravity(
                    Gravity.CENTER_VERTICAL);

            bar.setPadding(
                    4,
                    2,
                    4,
                    2);

            bar.setBackgroundColor(
                    0xDD202124);

            addButton(
                    bar,
                    "←",
                    "back");

            addButton(
                    bar,
                    "⌂",
                    "home");

            addButton(
                    bar,
                    "▣",
                    "recents");

            addButton(
                    bar,
                    "Apps",
                    "apps");

            ViewGroup.LayoutParams params =
                    new ViewGroup.LayoutParams(
                            ViewGroup.LayoutParams.WRAP_CONTENT,
                            ViewGroup.LayoutParams.MATCH_PARENT);

            dock.addView(
                    bar,
                    params);

            bar.bringToFront();

            INSTALLED.add(dock);

            XposedBridge.log(
                    TAG +
                    " installed in " +
                    resourceEntryName(dock) +
                    " display=" +
                    root.getDisplay()
                            .getDisplayId());

        } catch (Throwable t) {

            XposedBridge.log(
                    TAG +
                    " scan failed: " +
                    t);
        }
    }

    private static ViewGroup findDockContainer(
            ViewGroup group,
            int budget) {

        if (budget <= 0) {
            return null;
        }

        String name =
                resourceEntryName(group);

        if (name != null
                && isDockName(name)) {

            return group;
        }

        int next =
                budget - 1;

        for (int i = 0;
                i < group.getChildCount();
                i++) {

            View child =
                    group.getChildAt(i);

            if (child instanceof ViewGroup) {

                ViewGroup found =
                        findDockContainer(
                                (ViewGroup) child,
                                next);

                if (found != null) {
                    return found;
                }
            }
        }

        return null;
    }

    private static String resourceEntryName(
            View view) {

        if (view.getId() == View.NO_ID) {
            return null;
        }

        try {

            String packageName =
                    view.getResources()
                            .getResourcePackageName(
                                    view.getId());

            if (!GEARHEAD.equals(packageName)) {
                return null;
            }

            return view.getResources()
                    .getResourceEntryName(
                            view.getId());

        } catch (Throwable ignored) {

            return null;
        }
    }

    private static boolean isDockName(
            String name) {

        for (String candidate :
                DOCK_NAMES) {

            if (candidate.equals(name)) {
                return true;
            }
        }

        return false;
    }

    private static void addButton(
            LinearLayout parent,
            String text,
            String command) {

        TextView button =
                new TextView(
                        parent.getContext());

        button.setText(text);

        button.setTextColor(
                Color.WHITE);

        button.setTextSize(
                "Apps".equals(text)
                        ? 13
                        : 20);

        button.setGravity(
                Gravity.CENTER);

        button.setPadding(
                18,
                0,
                18,
                0);

        button.setClickable(true);

        button.setFocusable(true);

        button.setOnClickListener(
                v -> sendCommand(
                        parent.getContext(),
                        command));

        parent.addView(
                button,
                new LinearLayout.LayoutParams(
                        ViewGroup.LayoutParams.WRAP_CONTENT,
                        ViewGroup.LayoutParams.MATCH_PARENT));
    }

    private static void sendCommand(
            Context context,
            String command) {

        try {

            Intent intent =
                    new Intent(ACTION);

            intent.setPackage(
                    "com.carassistant.v10");

            intent.putExtra(
                    COMMAND,
                    command);

            context.sendBroadcast(
                    intent);

            XposedBridge.log(
                    TAG +
                    " command=" +
                    command);

        } catch (Throwable t) {

            XposedBridge.log(
                    TAG +
                    " broadcast failed: " +
                    t);
        }
    }
}
EOF

          echo "GearheadControlBar written."

      # ============================================================
      # VERIFY CONTROL RECEIVER SOURCE
      # ============================================================

      - name: Verify V10ControlReceiver
        shell: bash
        run: |
          set -euo pipefail

          RECEIVER="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ControlReceiver.java"

          test -f "$RECEIVER"

          grep -q \
            'com.carassistant.v10.CONTROL' \
            "$RECEIVER"

          grep -q \
            'BroadcastReceiver' \
            "$RECEIVER"

          grep -q \
            'BACK' \
            "$RECEIVER"

          grep -q \
            'HOME' \
            "$RECEIVER"

          grep -q \
            'RECENTS' \
            "$RECEIVER"

          grep -q \
            'APPS' \
            "$RECEIVER"

          echo "V10ControlReceiver verified."

      # ============================================================
      # REBUILD MANIFEST
      # ============================================================

      - name: Rebuild Manifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          sed -i \
            -e 's/com\.carassistant\.v9/com.carassistant.v10/g' \
            -e 's/Car Assistant V9/Car Assistant V10/g' \
            -e 's/AACast V9/AACast V10/g' \
            "$MANIFEST"

          python3 - "$MANIFEST" <<'PY'
import re
import sys

path = sys.argv[1]

with open(path, "r", encoding="utf-8") as f:
    text = f.read()

remove_names = [
    "MainActivity",
    "AACastCarActivity",
    "V10LauncherActivity",
    "V10CarActivity",
    "V10ControlReceiver",
]

for name in remove_names:

    pattern = (
        r'\s*<(?:activity|receiver)\b'
        r'[^>]*android:name="[^"]*'
        + re.escape(name)
        + r'"[^>]*'
        r'(?:/>|>.*?</(?:activity|receiver)>)'
    )

    text = re.sub(
        pattern,
        "",
        text,
        flags=re.S,
    )

application = re.search(
    r'(<application\b[^>]*>)',
    text,
    flags=re.S,
)

if not application:
    raise SystemExit(
        "ERROR: application tag not found"
    )

components = r'''
        <activity
            android:name="com.carassistant.v10.V10LauncherActivity"
            android:exported="true">
            <intent-filter>
                <action
                    android:name="android.intent.action.MAIN" />
                <category
                    android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>

        <activity
            android:name="com.carassistant.v10.V10CarActivity"
            android:exported="true" />

        <receiver
            android:name="com.carassistant.v10.V10ControlReceiver"
            android:exported="true">
            <intent-filter>
                <action
                    android:name="com.carassistant.v10.CONTROL" />
            </intent-filter>
        </receiver>
'''

pos = application.end()

text = (
    text[:pos]
    + components
    + text[pos:]
)

with open(path, "w", encoding="utf-8") as f:
    f.write(text)
PY

          echo "Manifest rebuilt."

      # ============================================================
      # VERIFY MANIFEST
      # ============================================================

      - name: Verify Manifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          grep -q \
            'com.carassistant.v10.V10LauncherActivity' \
            "$MANIFEST"

          grep -q \
            'com.carassistant.v10.V10CarActivity' \
            "$MANIFEST"

          grep -q \
            'com.carassistant.v10.V10ControlReceiver' \
            "$MANIFEST"

          grep -q \
            'android:exported="true"' \
            "$MANIFEST"

          if grep -q \
              'android:name="[^"]*MainActivity' \
              "$MANIFEST"; then
            echo "ERROR: MainActivity remains."
            exit 1
          fi

          if grep -q \
              'android:name="[^"]*AACastCarActivity' \
              "$MANIFEST"; then
            echo "ERROR: AACastCarActivity remains."
            exit 1
          fi

          echo "Manifest verification passed."

      # ============================================================
      # VERIFY SOURCE
      # ============================================================

      - name: Verify V10 source
        shell: bash
        run: |
          set -euo pipefail

          JAVA="v10-source/app/src/main/java"
          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          REQUIRED=(
            "V10LauncherActivity.java"
            "V10CarActivity.java"
            "V10ProjectionSession.java"
            "V10InputController.java"
            "V10Display.java"
            "V10SessionStore.java"
            "V10ControlReceiver.java"
            "AACastCarService.java"
            "GearheadControlBar.java"
          )

          for file in "${REQUIRED[@]}"; do

            count="$(
              find "$JAVA" \
                -name "$file" \
                | wc -l
            )"

            if [ "$count" -ne 1 ]; then
              echo "ERROR: $file count=$count"
              exit 1
            fi
          done

          if grep -R \
              'com.carassistant.v9' \
              "$JAVA" \
              "$MANIFEST" \
              2>/dev/null; then

            echo "ERROR: V9 package remains."
            exit 1
          fi

          OLD_FILES="$(
            find "$JAVA" \
              -type f \
              \( \
                -name 'MainActivity.java' \
                -o -name 'AACastCarActivity.java' \
                -o -name 'LeaseTicker.java' \
              \)
          )"

          if [ -n "$OLD_FILES" ]; then
            echo "ERROR: Old V9 files remain:"
            echo "$OLD_FILES"
            exit 1
          fi

          echo "V10 source verification passed."

      # ============================================================
      # VERIFY GEARHEAD CONTROL BAR
      # ============================================================

      - name: Verify Gearhead Dock Control Bar
        shell: bash
        run: |
          set -euo pipefail

          BAR="v10-source/app/src/main/java/com/hieptran/aacast/doudou/hook/GearheadControlBar.java"

          ACTIVITY="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          test -f "$BAR"
          test -f "$ACTIVITY"

          grep -q \
            'WindowManagerGlobal' \
            "$BAR"

          grep -q \
            'getViewRootNames' \
            "$BAR"

          grep -q \
            'getRootView' \
            "$BAR"

          grep -q \
            'resourceEntryName' \
            "$BAR"

          grep -q \
            'com.google.android.projection.gearhead' \
            "$BAR"

          grep -q \
            'nav_bar_container' \
            "$BAR"

          grep -q \
            'car_navigation_bar' \
            "$BAR"

          grep -q \
            'dock_container' \
            "$BAR"

          grep -q \
            'floating_nav_bar_view' \
            "$BAR"

          grep -q \
            'navigation_bar_container' \
            "$BAR"

          grep -q \
            '"back"' \
            "$BAR"

          grep -q \
            '"home"' \
            "$BAR"

          grep -q \
            '"recents"' \
            "$BAR"

          grep -q \
            '"apps"' \
            "$BAR"

          grep -q \
            'sendBroadcast' \
            "$BAR"

          grep -q \
            'V10ControlReceiver.BACK' \
            "$ACTIVITY"

          grep -q \
            'V10ControlReceiver.HOME' \
            "$ACTIVITY"

          grep -q \
            'V10ControlReceiver.RECENTS' \
            "$ACTIVITY"

          grep -q \
            'V10ControlReceiver.APPS' \
            "$ACTIVITY"

          grep -q \
            'session.back()' \
            "$ACTIVITY"

          grep -q \
            'session.home()' \
            "$ACTIVITY"

          grep -q \
            'android:exported="true"' \
            "$MANIFEST"

          echo "Gearhead Dock Control Bar verification passed."

      # ============================================================
      # VERIFY XPOSED BRIDGE
      # ============================================================

      - name: Verify Xposed bridge
        shell: bash
        run: |
          set -euo pipefail

          BRIDGE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/aabridge/AACastBridge.java"

          test -f "$BRIDGE"

          grep -q \
            'com.google.android.projection.gearhead' \
            "$BRIDGE"

          grep -Eq \
            'GearheadControlBar[[:space:]]*\.[[:space:]]*install' \
            "$BRIDGE"

          grep -Eq \
            'InputHooks[[:space:]]*\.[[:space:]]*install' \
            "$BRIDGE"

          grep -Eq \
            'DisplayHooks[[:space:]]*\.[[:space:]]*installDisplayFlags' \
            "$BRIDGE"

          grep -Eq \
            'DisplayHooks[[:space:]]*\.[[:space:]]*installInputPolicy' \
            "$BRIDGE"

          echo "Xposed bridge verified."

      # ============================================================
      # VERIFY PROJECTION INVARIANTS
      # ============================================================

      - name: Verify V9 projection invariants
        shell: bash
        run: |
          set -euo pipefail

          SESSION="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          HOOK="v10-source/app/src/main/java/com/hieptran/aacast/doudou/hook/InputHooks.java"

          test -f "$SESSION"
          test -f "$HOOK"

          grep -q \
            'SurfaceTexture' \
            "$SESSION"

          grep -q \
            'setDefaultBufferSize' \
            "$SESSION"

          grep -q \
            'new Surface' \
            "$SESSION"

          grep -q \
            'createVirtualDisplay' \
            "$SESSION"

          grep -q \
            'V10Display.nameFor' \
            "$SESSION"

          grep -q \
            '160' \
            "$SESSION"

          grep -q \
            '10' \
            "$SESSION"

          grep -q \
            'Process.myUid() / 100000' \
            "$SESSION"

          grep -q \
            -- '--display' \
            "$SESSION"

          grep -q \
            -- '--windowingMode 1' \
            "$SESSION"

          grep -q \
            'input -d' \
            "$SESSION"

          grep -q \
            'keyevent 4' \
            "$SESSION"

          grep -q \
            'V10Display.matches' \
            "$HOOK"

          echo "Projection invariants passed."

      # ============================================================
      # VERIFY SWIPE
      # ============================================================

      - name: Verify swipe input
        shell: bash
        run: |
          set -euo pipefail

          INPUT="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10InputController.java"

          SESSION="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          test -f "$INPUT"
          test -f "$SESSION"

          grep -q \
            'MotionEvent.ACTION_DOWN' \
            "$INPUT"

          grep -q \
            'MotionEvent.ACTION_MOVE' \
            "$INPUT"

          grep -q \
            'MotionEvent.ACTION_UP' \
            "$INPUT"

          grep -q \
            'session.swipe' \
            "$INPUT"

          grep -q \
            'swipe' \
            "$SESSION"

          echo "Single-pointer swipe verified."

      # ============================================================
      # VERIFY ANDROID 12 / API 31
      # ============================================================

      - name: Verify Android 12 API 31 compatibility
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILES="$(
            find v10-source \
              -type f \
              \( \
                -name '*.gradle' \
                -o -name '*.gradle.kts' \
              \)
          )"

          echo "$GRADLE_FILES"

          if grep -R \
              'compileSdk.*3[3-9]' \
              v10-source \
              --include='*.gradle' \
              --include='*.gradle.kts' \
              2>/dev/null; then

            echo "WARNING: compileSdk is newer than API 31."
            echo "This is allowed only if minSdk remains Android 12 compatible."
          fi

          if grep -R \
              'minSdk.*[0-9][0-9]' \
              v10-source \
              --include='*.gradle' \
              --include='*.gradle.kts' \
              2>/dev/null; then

            echo "minSdk declaration found."
          fi

          echo "Android 12 compatibility inspection completed."

      # ============================================================
      # GRADLE VERSION
      # ============================================================

      - name: Gradle version
        shell: bash
        run: |
          set -euo pipefail

          gradle --version

      # ============================================================
      # CLEAN BUILD
      # ============================================================

      - name: Clean build
        shell: bash
        run: |
          set -euo pipefail

          cd v10-source

          gradle \
            clean \
            --no-daemon \
            --stacktrace

      # ============================================================
      # BUILD DEBUG APK
      # ============================================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd v10-source

          gradle \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK:"
          ls -lh "$APK"

          echo "SHA256:"
          sha256sum "$APK"

      # ============================================================
      # VERIFY APK PACKAGE
      # ============================================================

      - name: Verify APK package
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          if command -v aapt >/dev/null 2>&1; then

            aapt dump badging "$APK" \
              | grep -q \
                "package: name='com.carassistant.v10'"

            echo "APK package verified."

          else

            echo "aapt not directly available; Gradle build already succeeded."

          fi

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload V10.2-A2.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10.2-A2.1-debug
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ============================================================
      # COMMIT SOURCE
      # ============================================================

      - name: Commit V10.2-A2.1 source
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            v10-source

          if git diff \
              --cached \
              --quiet; then

            echo "No source changes to commit."

            exit 0
          fi

          git commit \
            -m \
            "Build Car Assistant V10.2-A2.1 Gearhead dock control bar"

          git push
