      - name: Rebuild Manifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          sed -i \
            -e 's/com\.carassistant\.v9/com.carassistant.v10/g' \
            -e 's/Car Assistant V9/Car Assistant V10/g' \
            -e 's/AACast V9/AACast V10/g' \
            "$MANIFEST"

          python3 - "$MANIFEST" <<'PY'
          import re
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          names = [
              "MainActivity",
              "AACastCarActivity",
              "V10LauncherActivity",
              "V10CarActivity",
          ]

          for name in names:
              pattern = (
                  r'\s*<activity\b'
                  r'[^>]*android:name="[^"]*'
                  + re.escape(name)
                  + r'"[^>]*'
                  r'(?:/>|>.*?</activity>)'
              )

              text = re.sub(
                  pattern,
                  '',
                  text,
                  flags=re.S,
              )

          match = re.search(
              r'(<application\b[^>]*>)',
              text,
              flags=re.S,
          )

          if not match:
              raise SystemExit(
                  "ERROR: application not found"
              )

          activities = r'''
                  <activity
                      android:name="com.carassistant.v10.V10LauncherActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name="com.carassistant.v10.V10CarActivity"
                      android:exported="true" />

                  <receiver
                      android:name="com.carassistant.v10.V10ControlReceiver"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="com.carassistant.v10.CONTROL" />
                      </intent-filter>
                  </receiver>
          '''

          pos = match.end()

          text = (
              text[:pos]
              + activities
              + text[pos:]
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

