name: Build Car Assistant V10.2-A2 Control Bar

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # GRADLE 8.13
      # ============================================================

      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            https://services.gradle.org/distributions/gradle-8.13-bin.zip

          unzip -q \
            gradle-8.13-bin.zip \
            -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-8.13/bin" \
            >> "$GITHUB_PATH"

      # ============================================================
      # CREATE CLEAN V10 FROM PROVEN V9
      # ============================================================

      - name: Create clean V10 source
        shell: bash
        run: |
          set -euo pipefail

          test -d \
            "v9-source/android-project/v9-source"

          rm -rf v10-source

          cp -R \
            v9-source/android-project/v9-source \
            v10-source

          find v10-source \
            -type f \
            -name '*.java' \
            -print0 |
            xargs -0 sed -i \
              -e 's/com\.carassistant\.v9/com.carassistant.v10/g' \
              -e 's/Car Assistant V9/Car Assistant V10/g' \
              -e 's/AACast V9/AACast V10/g'

          find v10-source \
            -type f \
            -name '*.xml' \
            -print0 |
            xargs -0 sed -i \
              -e 's/com\.carassistant\.v9/com.carassistant.v10/g' \
              -e 's/Car Assistant V9/Car Assistant V10/g' \
              -e 's/AACast V9/AACast V10/g'

          find v10-source \
            -type f \
            -name '*.gradle' \
            -print0 |
            xargs -0 sed -i \
              -e 's/com\.carassistant\.v9/com.carassistant.v10/g'

      # ============================================================
      # REMOVE OLD V9 / V10 ACTIVITIES
      # ============================================================

      - name: Remove old V9 and previous V10 files
        shell: bash
        run: |
          set -euo pipefail

          JAVA="v10-source/app/src/main/java"

          test -d "$JAVA"

          find "$JAVA" \
            -type f \
            \( \
              -name 'MainActivity.java' \
              -o -name 'AACastCarActivity.java' \
              -o -name 'LeaseTicker.java' \
              -o -name 'V10LauncherActivity.java' \
              -o -name 'V10CarActivity.java' \
              -o -name 'V10ProjectionSession.java' \
              -o -name 'V10InputController.java' \
              -o -name 'V10Display.java' \
              -o -name 'V10SessionStore.java' \
              -o -name 'GearheadControlBar.java' \
              -o -name 'V10ControlReceiver.java' \
            \) \
            -print \
            -delete

          OLD_FILES="$(
            find "$JAVA" \
              -type f \
              \( \
                -name 'MainActivity.java' \
                -o -name 'AACastCarActivity.java' \
              \)
          )"

          if [ -n "$OLD_FILES" ]; then
            echo "ERROR: Old V9 files remain:"
            echo "$OLD_FILES"
            exit 1
          fi

          echo "Old V9 activities removed."

      # ============================================================
      # SESSION STORE
      # ============================================================

      - name: Write V10SessionStore
        shell: bash
        run: |
          set -euo pipefail

          cat > \
          v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java \
          <<'EOF'
          package com.carassistant.v10;

          import android.content.ComponentName;
          import android.content.Context;
          import android.content.SharedPreferences;

          public final class V10SessionStore {

              private static final String PREFS =
                      "v10_session";

              private static final String TARGET =
                      "target_component";

              private V10SessionStore() {
              }

              private static SharedPreferences prefs(
                      Context context) {

                  return context.getSharedPreferences(
                          PREFS,
                          Context.MODE_PRIVATE);
              }

              public static void setTarget(
                      Context context,
                      ComponentName component) {

                  SharedPreferences.Editor editor =
                          prefs(context).edit();

                  if (component == null) {
                      editor.remove(TARGET);
                  } else {
                      editor.putString(
                              TARGET,
                              component.flattenToString());
                  }

                  editor.apply();
              }

              public static ComponentName getTarget(
                      Context context) {

                  String value =
                          prefs(context).getString(
                                  TARGET,
                                  null);

                  if (value == null || value.isEmpty()) {
                      return null;
                  }

                  return ComponentName.unflattenFromString(
                          value);
              }

              public static void clearTarget(
                      Context context) {

                  prefs(context)
                          .edit()
                          .remove(TARGET)
                          .apply();
              }
          }
          EOF

      # ============================================================
      # PHONE LAUNCHER
      # ============================================================

      - name: Write V10LauncherActivity
        shell: bash
        run: |
          set -euo pipefail

          cat > \
          v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java \
          <<'EOF'
          package com.carassistant.v10;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.pm.ResolveInfo;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;

          public final class V10LauncherActivity
                  extends Activity {

              private LinearLayout list;
              private TextView status;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  buildUi();
                  loadApps();
              }

              private void buildUi() {

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL);

                  root.setPadding(
                          32, 32, 32, 32);

                  root.setBackgroundColor(
                          Color.BLACK);

                  TextView title =
                          new TextView(this);

                  title.setText(
                          "Car Assistant V10");

                  title.setTextColor(
                          Color.WHITE);

                  title.setTextSize(26);

                  title.setGravity(
                          Gravity.CENTER);

                  root.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT));

                  status =
                          new TextView(this);

                  status.setText(
                          "Choose an app for Android Auto");

                  status.setTextColor(
                          Color.LTGRAY);

                  status.setTextSize(16);

                  root.addView(
                          status,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT));

                  Button refresh =
                          new Button(this);

                  refresh.setText("Refresh");

                  refresh.setOnClickListener(
                          v -> loadApps());

                  root.addView(
                          refresh,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT));

                  ScrollView scroll =
                          new ScrollView(this);

                  list =
                          new LinearLayout(this);

                  list.setOrientation(
                          LinearLayout.VERTICAL);

                  scroll.addView(list);

                  root.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  0,
                                  1f));

                  setContentView(root);
              }

              private void loadApps() {

                  list.removeAllViews();

                  Intent intent =
                          new Intent(
                                  Intent.ACTION_MAIN);

                  intent.addCategory(
                          Intent.CATEGORY_LAUNCHER);

                  List<ResolveInfo> apps =
                          getPackageManager()
                                  .queryIntentActivities(
                                          intent,
                                          0);

                  List<ResolveInfo> filtered =
                          new ArrayList<>();

                  for (ResolveInfo info : apps) {

                      if (info.activityInfo == null) {
                          continue;
                      }

                      if (getPackageName().equals(
                              info.activityInfo.packageName)) {
                          continue;
                      }

                      filtered.add(info);
                  }

                  Collections.sort(
                          filtered,
                          new Comparator<ResolveInfo>() {

                              @Override
                              public int compare(
                                      ResolveInfo a,
                                      ResolveInfo b) {

                                  String la =
                                          String.valueOf(
                                                  a.loadLabel(
                                                          getPackageManager()));

                                  String lb =
                                          String.valueOf(
                                                  b.loadLabel(
                                                          getPackageManager()));

                                  return la.compareToIgnoreCase(lb);
                              }
                          });

                  for (ResolveInfo info : filtered) {

                      ComponentName component =
                              new ComponentName(
                                      info.activityInfo.packageName,
                                      info.activityInfo.name);

                      Button button =
                              new Button(this);

                      button.setText(
                              String.valueOf(
                                      info.loadLabel(
                                              getPackageManager())));

                      button.setOnClickListener(
                              v -> {

                                  V10SessionStore.setTarget(
                                          V10LauncherActivity.this,
                                          component);

                                  status.setText(
                                          "Selected: "
                                                  + component
                                                  .flattenToShortString());
                              });

                      list.addView(
                              button,
                              new LinearLayout.LayoutParams(
                                      ViewGroup.LayoutParams.MATCH_PARENT,
                                      ViewGroup.LayoutParams.WRAP_CONTENT));
                  }
              }
          }
          EOF

      # ============================================================
      # V10 DISPLAY
      # ============================================================

      - name: Write V10Display
        shell: bash
        run: |
          set -euo pipefail

          cat > \
          v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10Display.java \
          <<'EOF'
          package com.carassistant.v10;

          public final class V10Display {

              public static final String PACKAGE =
                      "com.carassistant.v10";

              public static final String PREFIX =
                      "Car Assistant V10 ";

              private V10Display() {
              }

              public static String nameFor(int index) {
                  return PREFIX + (index + 1);
              }

              public static boolean matches(
                      String ownerPackage,
                      String name,
                      int type,
                      int ownerUid) {

                  if (!PACKAGE.equals(ownerPackage)
                          || type != 5
                          || ownerUid < 10000) {
                      return false;
                  }

                  return (PREFIX + "1").equals(name);
              }
          }
          EOF

      # ============================================================
      # PROJECTION SESSION
      # ============================================================

      - name: Write V10ProjectionSession
        shell: bash
        run: |
          set -euo pipefail

          cat > \
          v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java \
          <<'EOF'
          package com.carassistant.v10;

          import android.content.ComponentName;
          import android.content.Context;
          import android.graphics.SurfaceTexture;
          import android.hardware.display.DisplayManager;
          import android.os.Process;
          import android.util.Log;
          import android.view.Display;
          import android.view.Surface;
          import android.view.TextureView;

          public final class V10ProjectionSession
                  implements TextureView.SurfaceTextureListener {

              private static final String TAG =
                      "CarAssistantV10Projection";

              private final Context context;

              private final RootShellSession rootShell =
                      new RootShellSession();

              private TextureView textureView;

              private ComponentName target;

              private Display display;

              private android.hardware.display.VirtualDisplay
                      virtualDisplay;

              private Surface surface;

              private boolean destroyed;

              public V10ProjectionSession(
                      Context context) {

                  this.context =
                          context.getApplicationContext();
              }

              public void attachTextureView(
                      TextureView view) {

                  textureView = view;

                  view.setSurfaceTextureListener(
                          this);

                  if (view.isAvailable()) {
                      ensureDisplay();
                  }
              }

              public void setTarget(
                      ComponentName component) {

                  if (component == null) {
                      target = null;
                      release();
                      return;
                  }

                  boolean changed =
                          !component.equals(target);

                  target = component;

                  if (changed
                          && virtualDisplay != null) {
                      releaseDisplayOnly();
                  }

                  ensureDisplay();
              }

              public boolean isActive() {
                  return !destroyed
                          && target != null
                          && virtualDisplay != null
                          && display != null;
              }

              public void home() {
                  releaseDisplayOnly();
              }

              private void ensureDisplay() {

                  if (destroyed
                          || target == null
                          || textureView == null
                          || !textureView.isAvailable()
                          || virtualDisplay != null) {
                      return;
                  }

                  SurfaceTexture st =
                          textureView.getSurfaceTexture();

                  if (st == null) {
                      return;
                  }

                  int width =
                          textureView.getWidth();

                  int height =
                          textureView.getHeight();

                  if (width < 1 || height < 1) {
                      return;
                  }

                  try {

                      st.setDefaultBufferSize(
                              width,
                              height);

                      Surface newSurface =
                              new Surface(st);

                      DisplayManager manager =
                              (DisplayManager)
                                      context.getSystemService(
                                              Context.DISPLAY_SERVICE);

                      if (manager == null) {
                          newSurface.release();
                          throw new IllegalStateException(
                                  "DisplayManager unavailable");
                      }

                      android.hardware.display.VirtualDisplay
                              newVirtualDisplay =
                              manager.createVirtualDisplay(
                                      V10Display.nameFor(0),
                                      width,
                                      height,
                                      160,
                                      newSurface,
                                      10);

                      if (newVirtualDisplay == null) {
                          newSurface.release();
                          throw new IllegalStateException(
                                  "Cannot create virtual display");
                      }

                      Display newDisplay =
                              newVirtualDisplay.getDisplay();

                      if (newDisplay == null) {
                          newVirtualDisplay.release();
                          newSurface.release();
                          throw new IllegalStateException(
                                  "Virtual display has no Display");
                      }

                      surface =
                              newSurface;

                      virtualDisplay =
                              newVirtualDisplay;

                      display =
                              newDisplay;

                      launchTarget();

                  } catch (RuntimeException e) {

                      release();

                      Log.w(
                              TAG,
                              "Display creation failed",
                              e);
                  }
              }

              private void launchTarget() {

                  if (display == null
                          || target == null) {
                      return;
                  }

                  final int displayId =
                          display.getDisplayId();

                  final int userId =
                          Process.myUid() / 100000;

                  final String packageName =
                          target.getPackageName()
                                  .replace(
                                          "'",
                                          "'\"'\"'");

                  final String flat =
                          target.flattenToString()
                                  .replace(
                                          "'",
                                          "'\"'\"'");

                  final String command =
                          "/system/bin/am force-stop '"
                                  + packageName
                                  + "'; "
                                  + "/system/bin/am start"
                                  + " --user "
                                  + userId
                                  + " --display "
                                  + displayId
                                  + " --windowingMode 1"
                                  + " -a android.intent.action.MAIN"
                                  + " -c android.intent.category.LAUNCHER"
                                  + " -f 0x18000000"
                                  + " -n '"
                                  + flat
                                  + "'";

                  RootShellSession.EXEC.execute(
                          () -> {

                              try {

                                  rootShell.run(
                                          10,
                                          command);

                              } catch (Throwable t) {

                                  Log.w(
                                          TAG,
                                          "Launch failed",
                                          t);
                              }
                          });
              }

              public void tap(
                      float x,
                      float y) {

                  if (!isActive()) {
                      return;
                  }

                  final int displayId =
                          display.getDisplayId();

                  final int ix =
                          Math.max(
                                  0,
                                  Math.round(x));

                  final int iy =
                          Math.max(
                                  0,
                                  Math.round(y));

                  final String command =
                          "/system/bin/input -d "
                                  + displayId
                                  + " tap "
                                  + ix
                                  + " "
                                  + iy;

                  RootShellSession.EXEC.execute(
                          () -> {

                              try {
                                  rootShell.run(
                                          5,
                                          command);
                              } catch (Throwable t) {
                                  Log.w(
                                          TAG,
                                          "Tap failed",
                                          t);
                              }
                          });
              }

              public void swipe(
                      float startX,
                      float startY,
                      float endX,
                      float endY,
                      long duration) {

                  if (!isActive()) {
                      return;
                  }

                  final int displayId =
                          display.getDisplayId();

                  final String command =
                          "/system/bin/input -d "
                                  + displayId
                                  + " swipe "
                                  + Math.round(startX)
                                  + " "
                                  + Math.round(startY)
                                  + " "
                                  + Math.round(endX)
                                  + " "
                                  + Math.round(endY)
                                  + " "
                                  + duration;

                  RootShellSession.EXEC.execute(
                          () -> {

                              try {
                                  rootShell.run(
                                          5,
                                          command);
                              } catch (Throwable t) {
                                  Log.w(
                                          TAG,
                                          "Swipe failed",
                                          t);
                              }
                          });
              }

              public void back() {

                  if (!isActive()) {
                      return;
                  }

                  final int displayId =
                          display.getDisplayId();

                  final String command =
                          "/system/bin/input -d "
                                  + displayId
                                  + " keyevent 4";

                  RootShellSession.EXEC.execute(
                          () -> {

                              try {
                                  rootShell.run(
                                          5,
                                          command);
                              } catch (Throwable t) {
                                  Log.w(
                                          TAG,
                                          "Back failed",
                                          t);
                              }
                          });
              }

              private void releaseDisplayOnly() {

                  if (virtualDisplay != null) {
                      try {
                          virtualDisplay.release();
                      } catch (Throwable ignored) {
                      }
                  }

                  virtualDisplay = null;
                  display = null;

                  if (surface != null) {
                      try {
                          surface.release();
                      } catch (Throwable ignored) {
                      }
                  }

                  surface = null;
              }

              public void release() {
                  releaseDisplayOnly();
              }

              public void destroy() {

                  if (destroyed) {
                      return;
                  }

                  destroyed = true;

                  release();

                  rootShell.destroy();
              }

              @Override
              public void onSurfaceTextureAvailable(
                      SurfaceTexture surface,
                      int width,
                      int height) {

                  ensureDisplay();
              }

              @Override
              public void onSurfaceTextureSizeChanged(
                      SurfaceTexture surface,
                      int width,
                      int height) {
              }

              @Override
              public boolean onSurfaceTextureDestroyed(
                      SurfaceTexture surface) {

                  releaseDisplayOnly();

                  return true;
              }

              @Override
              public void onSurfaceTextureUpdated(
                      SurfaceTexture surface) {
              }
          }
          EOF

      # ============================================================
      # INPUT CONTROLLER
      # ============================================================

      - name: Write V10InputController
        shell: bash
        run: |
          set -euo pipefail

          cat > \
          v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10InputController.java \
          <<'EOF'
          package com.carassistant.v10;

          import android.view.MotionEvent;
          import android.view.View;

          public final class V10InputController {

              private final V10ProjectionSession session;

              private float downX;
              private float downY;
              private long downTime;
              private boolean moved;

              private static final float MOVE_SLOP = 12f;

              private static final long
                      SWIPE_MIN_DURATION = 80L;

              private static final long
                      SWIPE_MAX_DURATION = 800L;

              public V10InputController(
                      V10ProjectionSession session) {

                  this.session = session;
              }

              public View.OnTouchListener
                      createListener() {

                  return (view, event) -> {

                      switch (
                              event.getActionMasked()) {

                          case MotionEvent.ACTION_DOWN:

                              downX = event.getX();
                              downY = event.getY();
                              downTime =
                                      event.getEventTime();
                              moved = false;

                              return true;

                          case MotionEvent.ACTION_MOVE:

                              if (event.getPointerCount()
                                      == 1) {

                                  float dx =
                                          event.getX()
                                                  - downX;

                                  float dy =
                                          event.getY()
                                                  - downY;

                                  if (Math.abs(dx)
                                          > MOVE_SLOP
                                          || Math.abs(dy)
                                          > MOVE_SLOP) {

                                      moved = true;
                                  }
                              }

                              return true;

                          case MotionEvent.ACTION_UP:

                              float upX =
                                      event.getX();

                              float upY =
                                      event.getY();

                              long duration =
                                      event.getEventTime()
                                              - downTime;

                              if (!moved) {

                                  session.tap(
                                          upX,
                                          upY);

                              } else {

                                  duration =
                                          Math.max(
                                                  SWIPE_MIN_DURATION,
                                                  Math.min(
                                                          SWIPE_MAX_DURATION,
                                                          duration));

                                  session.swipe(
                                          downX,
                                          downY,
                                          upX,
                                          upY,
                                          duration);
                              }

                              return true;

                          case MotionEvent.ACTION_CANCEL:

                              moved = false;

                              return true;

                          default:
                              return true;
                      }
                  };
              }
          }
          EOF

      # ============================================================
      # CONTROL COMMAND RECEIVER
      # ============================================================

      - name: Write V10ControlReceiver
        shell: bash
        run: |
          set -euo pipefail

          cat > \
          v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ControlReceiver.java \
          <<'EOF'
          package com.carassistant.v10;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public final class V10ControlReceiver
                  extends BroadcastReceiver {

              public static final String ACTION =
                      "com.carassistant.v10.CONTROL";

              public static final String COMMAND =
                      "command";

              public static final String BACK =
                      "back";

              public static final String HOME =
                      "home";

              public static final String RECENTS =
                      "recents";

              public static final String APPS =
                      "apps";

              public interface Callback {
                  void onCommand(String command);
              }

              private static Callback callback;

              public static void setCallback(
                      Callback value) {
                  callback = value;
              }

              public static void clearCallback(
                      Callback value) {
                  if (callback == value) {
                      callback = null;
                  }
              }

              @Override
              public void onReceive(
                      Context context,
                      Intent intent) {

                  if (intent == null
                          || !ACTION.equals(
                                  intent.getAction())) {
                      return;
                  }

                  String command =
                          intent.getStringExtra(
                                  COMMAND);

                  Callback current =
                          callback;

                  if (current != null
                          && command != null) {
                      current.onCommand(command);
                  }
              }
          }
          EOF

      # ============================================================
      # CAR ACTIVITY
      # ============================================================

      - name: Write V10CarActivity
        shell: bash
        run: |
          set -euo pipefail

          cat > \
          v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java \
          <<'EOF'
          package com.carassistant.v10;

          import android.content.ComponentName;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.FrameLayout;
          import android.view.MotionEvent;
          import android.view.TextureView;

          import com.google.android.apps.auto.sdk.CarActivity;

          public final class V10CarActivity
                  extends CarActivity {

              private final Handler handler =
                      new Handler(
                              Looper.getMainLooper());

              private TextureView textureView;

              private V10ProjectionSession session;

              private V10InputController inputController;

              private boolean resumed;

              private final V10ControlReceiver.Callback
                      controlCallback =
                      command -> {

                          if (V10ControlReceiver.BACK
                                  .equals(command)) {

                              if (session != null) {
                                  session.back();
                              }

                              return;
                          }

                          if (V10ControlReceiver.HOME
                                  .equals(command)) {

                              if (session != null) {
                                  session.home();
                              }

                              V10SessionStore.clearTarget(
                                      V10CarActivity.this);

                              return;
                          }

                          if (V10ControlReceiver.APPS
                                  .equals(command)) {

                              V10SessionStore.clearTarget(
                                      V10CarActivity.this);

                              return;
                          }

                          if (V10ControlReceiver.RECENTS
                                  .equals(command)) {

                              return;
                          }
                      };

              private final Runnable targetPoller =
                      new Runnable() {

                          @Override
                          public void run() {

                              if (!resumed
                                      || session == null) {
                                  return;
                              }

                              ComponentName target =
                                      V10SessionStore
                                              .getTarget(
                                                      V10CarActivity.this);

                              if (target != null) {

                                  session.setTarget(
                                          target);
                              }

                              handler.postDelayed(
                                      this,
                                      500);
                          }
                      };

              private void applyChrome() {

                  try {

                      getCarUiController()
                              .getStatusBarController()
                              .hideAppHeader();

                      getCarUiController()
                              .getMenuController()
                              .hideMenuButton();

                  } catch (RuntimeException ignored) {
                  }
              }

              @Override
              public void onCreate(
                      Bundle state) {

                  setTheme(
                          R.style.Theme_AACast);

                  super.onCreate(state);

                  setIgnoreConfigChanges(-1);

                  applyChrome();
              }

              @Override
              public void onResume() {

                  super.onResume();

                  resumed = true;

                  applyChrome();

                  V10ControlReceiver
                          .setCallback(
                                  controlCallback);

                  if (textureView == null) {

                      android.widget.FrameLayout root =
                              new android.widget.FrameLayout(
                                      this);

                      root.setBackgroundColor(
                              Color.BLACK);

                      textureView =
                              new TextureView(this);

                      root.addView(
                              textureView,
                              new android.widget.FrameLayout
                                      .LayoutParams(
                                      android.widget.FrameLayout
                                              .LayoutParams.MATCH_PARENT,
                                      android.widget.FrameLayout
                                              .LayoutParams.MATCH_PARENT));

                      session =
                              new V10ProjectionSession(
                                      this);

                      session.attachTextureView(
                              textureView);

                      inputController =
                              new V10InputController(
                                      session);

                      textureView.setOnTouchListener(
                              inputController
                                      .createListener());

                      setContentView(root);
                  }

                  handler.removeCallbacks(
                          targetPoller);

                  handler.post(
                          targetPoller);
              }

              @Override
              public void onPause() {

                  resumed = false;

                  handler.removeCallbacks(
                          targetPoller);

                  V10ControlReceiver
                          .clearCallback(
                                  controlCallback);

                  super.onPause();
              }

              @Override
              public void onBackPressed() {

                  if (session != null
                          && session.isActive()) {

                      session.back();

                      return;
                  }

                  super.onBackPressed();
              }

              @Override
              public void onStop() {

                  resumed = false;

                  handler.removeCallbacks(
                          targetPoller);

                  if (session != null) {
                      session.release();
                  }

                  super.onStop();
              }

              @Override
              public void onDestroy() {

                  resumed = false;

                  handler.removeCallbacks(
                          targetPoller);

                  V10ControlReceiver
                          .clearCallback(
                                  controlCallback);

                  if (session != null) {

                      session.destroy();

                      session = null;
                  }

                  textureView = null;

                  super.onDestroy();
              }

              @Override
              public void onWindowFocusChanged(
                      boolean hasFocus,
                      boolean touchMode) {

                  super.onWindowFocusChanged(
                          hasFocus,
                          touchMode);

                  if (hasFocus) {
                      applyChrome();
                  }
              }
          }
          EOF

