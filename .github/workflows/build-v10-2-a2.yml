      - name: Upload V10.2-A2 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10.2-A2-debug
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit V10.2-A2
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add v10-source

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit \
            -m "Build Car Assistant V10.2-A2 control bar"

          git push
