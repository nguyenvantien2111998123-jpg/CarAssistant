      # ============================================================
      # GEARHEAD CONTROL BAR
      # ============================================================

      - name: Write GearheadControlBar
        shell: bash
        run: |
          set -euo pipefail

          cat > \
          v10-source/app/src/main/java/com/hieptran/aacast/doudou/hook/GearheadControlBar.java \
          <<'EOF'
          package com.carassistant.v10.hook;

          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.util.Collections;
          import java.util.IdentityHashMap;
          import java.util.Set;

          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedBridge;
          import de.robv.android.xposed.XposedHelpers;

          public final class GearheadControlBar {

              private static final String TAG =
                      "[V10 ControlBar]";

              private static final String GEARHEAD =
                      "com.google.android.projection.gearhead";

              private static final String ACTION =
                      "com.carassistant.v10.CONTROL";

              private static final String COMMAND =
                      "command";

              private static final String[] ROOT_NAMES = {
                      "GhFacetBar",
                      "TemplateNavigationService"
              };

              private static final Set<View>
                      INSTALLED =
                      Collections.newSetFromMap(
                              new IdentityHashMap<>());

              private GearheadControlBar() {
              }

              public static void install() {

                  try {

                      XposedBridge.hookAllMethods(
                              XposedHelpers.findClass(
                                      "android.view.WindowManagerGlobal",
                                      null),
                              "addView",
                              new XC_MethodHook() {

                                  @Override
                                  protected void afterHookedMethod(
                                          MethodHookParam param) {

                                      if (param.args.length < 1
                                              || !(param.args[0]
                                                      instanceof View)) {
                                          return;
                                      }

                                      View root =
                                              (View) param.args[0];

                                      root.post(
                                              () -> installIntoRoot(
                                                      root));
                                  }
                              });

                      XposedBridge.log(
                              TAG
                                      + " addView hook installed");

                  } catch (Throwable t) {

                      XposedBridge.log(
                              TAG
                                      + " hook failed: "
                                      + t);
                  }
              }

              private static void installIntoRoot(
                      View root) {

                  try {

                      if (INSTALLED.contains(root)) {
                          return;
                      }

                      if (!root.isAttachedToWindow()) {
                          return;
                      }

                      if (root.getDisplay() == null) {
                          return;
                      }

                      int displayId =
                              root.getDisplay()
                                      .getDisplayId();

                      if (displayId <= 0) {
                          return;
                      }

                      if (!(root instanceof ViewGroup)) {
                          return;
                      }

                      if (!looksLikeGearheadRoot(
                              root)) {
                          return;
                      }

                      ViewGroup group =
                              (ViewGroup) root;

                      LinearLayout bar =
                              new LinearLayout(
                                      root.getContext());

                      bar.setOrientation(
                              LinearLayout.HORIZONTAL);

                      bar.setGravity(
                              Gravity.CENTER_VERTICAL);

                      bar.setPadding(
                              6,
                              2,
                              6,
                              2);

                      bar.setBackgroundColor(
                              0xDD202124);

                      addButton(
                              bar,
                              "←",
                              "back");

                      addButton(
                              bar,
                              "⌂",
                              "home");

                      addButton(
                              bar,
                              "▣",
                              "recents");

                      addButton(
                              bar,
                              "Apps",
                              "apps");

                      ViewGroup.LayoutParams params =
                              new ViewGroup.LayoutParams(
                                      ViewGroup.LayoutParams.WRAP_CONTENT,
                                      56);

                      group.addView(
                              bar,
                              params);

                      bar.bringToFront();

                      INSTALLED.add(root);

                      XposedBridge.log(
                              TAG
                                      + " installed on display="
                                      + displayId);

                  } catch (Throwable t) {

                      XposedBridge.log(
                              TAG
                                      + " install failed: "
                                      + t);
                  }
              }

              private static boolean
                      looksLikeGearheadRoot(
                              View root) {

                  String displayName =
                          root.getDisplay()
                                  .getName();

                  if (displayName == null) {
                      return false;
                  }

                  for (String name :
                          ROOT_NAMES) {

                      if (displayName
                              .contains(name)) {
                          return true;
                      }
                  }

                  return true;
              }

              private static void addButton(
                      LinearLayout parent,
                      String text,
                      String command) {

                  TextView button =
                          new TextView(
                                  parent.getContext());

                  button.setText(text);

                  button.setTextColor(
                          Color.WHITE);

                  button.setTextSize(
                          18);

                  button.setGravity(
                          Gravity.CENTER);

                  button.setPadding(
                          22,
                          0,
                          22,
                          0);

                  button.setClickable(true);

                  button.setFocusable(true);

                  button.setOnClickListener(
                          v -> sendCommand(
                                  parent.getContext(),
                                  command));

                  parent.addView(
                          button,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.WRAP_CONTENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT));
              }

              private static void sendCommand(
                      Context context,
                      String command) {

                  try {

                      Intent intent =
                              new Intent(ACTION);

                      intent.setPackage(
                              "com.carassistant.v10");

                      intent.putExtra(
                              COMMAND,
                              command);

                      context.sendBroadcast(
                              intent);

                      XposedBridge.log(
                              TAG
                                      + " command="
                                      + command);

                  } catch (Throwable t) {

                      XposedBridge.log(
                              TAG
                                      + " broadcast failed: "
                                      + t);
                  }
              }
          }
          EOF

      # ============================================================
      # XPOSED BRIDGE
      # ============================================================

      - name: Write V10 AACastBridge
        shell: bash
        run: |
          set -euo pipefail

          cat > \
          v10-source/app/src/main/java/com/hieptran/aacast/doudou/aabridge/AACastBridge.java \
          <<'EOF'
          package com.carassistant.v10.aabridge;

          import android.os.Build;

          import com.carassistant.v10.V10Display;
          import com.carassistant.v10.hook.DisplayHooks;
          import com.carassistant.v10.hook.GearheadAllow;
          import com.carassistant.v10.hook.GearheadControlBar;
          import com.carassistant.v10.hook.InputHooks;
          import com.carassistant.v10.hook.InstallerSpoof;

          import de.robv.android.xposed.IXposedHookLoadPackage;
          import de.robv.android.xposed.XposedBridge;
          import de.robv.android.xposed.callbacks.XC_LoadPackage;

          public final class AACastBridge
                  implements IXposedHookLoadPackage {

              private static final String SELF =
                      V10Display.PACKAGE;

              private static final String GEARHEAD =
                      "com.google.android.projection.gearhead";

              private static final String PLAY =
                      "com.android.vending";

              @Override
              public void handleLoadPackage(
                      XC_LoadPackage.LoadPackageParam param) {

                  String packageName =
                          param.packageName;

                  if ("android".equals(
                          packageName)) {

                      DisplayHooks
                              .installDisplayFlags(
                                      param.classLoader);

                      DisplayHooks
                              .installInputPolicy(
                                      param.classLoader);

                      InputHooks.install(
                              param.classLoader);

                      return;
                  }

                  if (GEARHEAD.equals(
                          packageName)
                          || SELF.equals(
                                  packageName)) {

                      InstallerSpoof.hookLegacy(
                              param.classLoader,
                              PLAY);

                      if (GEARHEAD.equals(
                              packageName)) {

                          GearheadAllow.install(
                                  param.classLoader);

                          GearheadControlBar.install();
                      }

                      if (Build.VERSION.SDK_INT
                              >= 30) {

                          InstallerSpoof
                                  .hookInstallSource(
                                          "getInitiatingPackageName",
                                          PLAY);

                          InstallerSpoof
                                  .hookInstallSource(
                                          "getInstallingPackageName",
                                          PLAY);

                          if (Build.VERSION.SDK_INT
                                  >= 33) {

                              InstallerSpoof
                                      .hookInstallSource(
                                              "getPackageSource",
                                              2);
                          }

                          if (Build.VERSION.SDK_INT
                                  >= 34) {

                              InstallerSpoof
                                      .hookInstallSource(
                                              "getUpdateOwnerPackageName",
                                              PLAY);
                          }
                      }

                      XposedBridge.log(
                              "[V10] Module loaded in "
                                      + packageName);
                  }
              }
          }
          EOF

