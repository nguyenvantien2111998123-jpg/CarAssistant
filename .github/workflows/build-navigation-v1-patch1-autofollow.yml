      - name: Verify protected Projection Persistence Floating Touch
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"
          FILE="$SRC/V10CarActivity.java"

          sha256sum \
            "$SRC/V10ProjectionSession.java" \
            "$SRC/V10DisplayController.java" \
            "$SRC/V10SurfaceManager.java" \
            "$SRC/V10TaskSession.java" \
            "$SRC/V10SessionStore.java" \
            > /tmp/core-after.sha256

          if ! diff -u \
            /tmp/core-before.sha256 \
            /tmp/core-after.sha256; then

            echo \
              "ERROR: Protected Foundation core files changed."

            exit 1
          fi

          echo \
            "PASS: Projection/Persistence core SHA unchanged."

          check() {
            local label="$1"
            local pattern="$2"

            if grep -Fq "$pattern" "$FILE"; then
              echo "PASS: $label"
            else
              echo "ERROR: $label"
              echo "Missing: $pattern"
              exit 1
            fi
          }

          check \
