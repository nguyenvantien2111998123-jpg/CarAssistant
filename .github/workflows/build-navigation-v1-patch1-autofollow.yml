name: Build Navigation V1 Patch1 AutoFollow

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: navigation-v1-source

jobs:
  build-navigation-v1:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # STEP 01
      # ============================================================
      - name: Checkout main baseline
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ============================================================
      # STEP 02
      # ============================================================
      - name: Show repository state
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          echo "=== HEAD ==="
          git rev-parse HEAD

          echo
          echo "=== BRANCH ==="
          git branch --show-current

          echo
          echo "=== STATUS ==="
          git status --short

      # ============================================================
      # STEP 03
      # ============================================================
      - name: Verify exact main source
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          git fetch origin main --depth=1

          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="$(git rev-parse origin/main)"

          echo "HEAD=$ACTUAL"
          echo "origin/main=$EXPECTED"

          test "$ACTUAL" = "$EXPECTED"

          test -d navigation-v1-source
          test -f navigation-v1-source/settings.gradle
          test -f navigation-v1-source/build.gradle
          test -f navigation-v1-source/app/build.gradle

          echo "PASS: exact main source verified."

      # ============================================================
      # STEP 04
      # ============================================================
      - name: Verify required source structure
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -d app/src/main/java
          test -d app/src/main/res
          test -d app/libs

          echo "PASS: required Navigation V1 source structure exists."

      # ============================================================
      # STEP 05
      # ============================================================
      - name: Verify Android Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Root build.gradle ==="
          cat build.gradle

          echo
          echo "=== App build.gradle ==="
          cat app/build.gradle

          grep -Fq "com.android.application" build.gradle
          grep -Fq "compileSdk 36" app/build.gradle
          grep -Fq "minSdk 29" app/build.gradle
          grep -Fq "targetSdk 36" app/build.gradle
          grep -Fq "JavaVersion.VERSION_17" app/build.gradle

          echo "PASS: Android Gradle configuration verified."

      # ============================================================
      # STEP 06
      # ============================================================
      - name: Protected checksums
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Protected source inventory ==="

          find app/src/main/java \
            -type f \
            -print \
            | sort

          echo
          echo "PASS: protected source inventory collected."

      # ============================================================
      # STEP 07
      # ============================================================
      - name: Floating Touch checksum
        shell: bash
        run: |
          set -euo pipefail

          if [ -f app/src/main/java/com/carassistant/v10/V10CarActivity.java ]; then
            sha256sum \
              app/src/main/java/com/carassistant/v10/V10CarActivity.java
          fi

          echo "PASS: Floating Touch checksum step completed."

      # ============================================================
      # STEP 08
      # ============================================================
      - name: NavigationMap inspection
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            app/src/main/java/com/carassistant/v10/NavigationMapView.java

          echo "=== NavigationMapView.java ==="

          sed -n '1,260p' \
            app/src/main/java/com/carassistant/v10/NavigationMapView.java

          echo "PASS: NavigationMapView inspected."

      # ============================================================
      # STEP 09
      # ============================================================
      - name: Dashboard cleanup
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Dashboard/source cleanup check ==="

          find app/src/main \
            -type f \
            | sort

          echo
          echo "PASS: dashboard cleanup check completed."

      # ============================================================
      # STEP 10
      # ============================================================
      - name: Cleanup verification
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Verify stale source paths ==="

          if find . \
            -path './.gradle' -prune -o \
            -path './build' -prune -o \
            -type f \
            -print \
            | grep -E 'v10-source|AACast-Doudou/app' ; then

            echo "ERROR: stale source path detected."
            exit 1
          fi

          echo "PASS: no stale source paths detected."

      # ============================================================
      # STEP 11
      # ============================================================
      - name: Navigation core
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            app/src/main/java/com/carassistant/v10/V10CarActivity.java

          test -f \
            app/src/main/java/com/carassistant/v10/V10ProjectionSession.java

          echo "PASS: Navigation core files exist."

      # ============================================================
      # STEP 12
      # ============================================================
      - name: Protected core unchanged
        shell: bash
        run: |
          set -euo pipefail

          git status --short

          echo "PASS: protected core check completed."

      # ============================================================
      # STEP 13
      # ============================================================
      - name: Floating Touch unchanged
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            app/src/main/java/com/carassistant/v10/V10CarActivity.java

          echo "PASS: Floating Touch source exists."

      # ============================================================
      # STEP 14
      # ============================================================
      - name: Source inventory before patch
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          find navigation-v1-source \
            -type f \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            | sort > /tmp/navigation_inventory_before.txt

          echo "=== Inventory before patch ==="
          cat /tmp/navigation_inventory_before.txt

          echo
          echo "File count:"
          wc -l /tmp/navigation_inventory_before.txt

      # ============================================================
      # STEP 15
      # ============================================================
      - name: Source diff
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          git diff -- \
            navigation-v1-source

          echo "PASS: source diff check completed."

      # ============================================================
      # STEP 16
      # ============================================================
      - name: Git diff check
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          git status --short

          echo "PASS: git diff check completed."

      # ============================================================
      # STEP 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # STEP 18
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ============================================================
      # STEP 19
      # ============================================================
      - name: Accept SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Android SDK licenses processed."

      # ============================================================
      # STEP 20
      # ============================================================
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing platform-tools..."
          sdkmanager "platform-tools"

          echo "Installing Android 36 platform..."
          sdkmanager "platforms;android-36"

          echo "Installing Build Tools 36.0.0..."
          sdkmanager "build-tools;36.0.0"

          echo "Required Android SDK packages installed."

      # ============================================================
      # STEP 21
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "=== sdkmanager location ==="
          command -v sdkmanager

          echo
          echo "=== Android SDK root ==="
          echo "$ANDROID_SDK_ROOT"

          echo
          echo "=== Installed SDK packages ==="

          sdkmanager --list_installed | grep -E \
            'platform-tools|platforms;android-36|build-tools;36.0.0' \
            || true

          echo
          echo "=== Verify Android 36 platform ==="

          test -d "$ANDROID_SDK_ROOT/platforms/android-36"

          echo
          echo "=== Verify Build Tools 36.0.0 ==="

          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"

          echo
          echo "=== Verify Platform Tools ==="

          test -d "$ANDROID_SDK_ROOT/platform-tools"

          echo "Android SDK verification passed."

      # ============================================================
      # STEP 22
      # ============================================================
      - name: Make Gradle executable
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew

          chmod +x ./gradlew

          echo "Gradle wrapper is executable."

      # ============================================================
      # STEP 23
      # ============================================================
      - name: Verify Gradle source before compile
        shell: bash
        run: |
          set -euo pipefail

          echo "=== settings.gradle ==="
          cat settings.gradle

          echo
          echo "=== root build.gradle ==="
          cat build.gradle

          echo
          echo "=== app/build.gradle ==="
          cat app/build.gradle

          echo
          echo "=== legacy DEX ==="

          test -f app/libs/aasdk-legacy.dex

          ls -lh app/libs/aasdk-legacy.dex

          echo
          echo "PASS: Gradle source verified before compile."

      # ============================================================
      # STEP 24
      #
      # FIX:
      # Both Debug and Release used:
      #
      # tasks.matching {...}.configureEach
      #
      # This caused:
      # Cannot invoke method configureEach() on null object
      #
      # Patch BOTH hooks to project.tasks.configureEach.
      # ============================================================
      - name: Patch legacy DEX task hooks
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")

          text = path.read_text(encoding="utf-8")

          # ------------------------------------------------------------
          # DEBUG
          # ------------------------------------------------------------
          debug_start = text.find(
              "tasks.matching {\n    it.name == 'mergeProjectDexDebug'"
          )

          if debug_start < 0:
              debug_start = text.find(
                  "tasks.matching {"
              )

              if debug_start < 0:
                  raise SystemExit(
                      "ERROR: Debug tasks.matching block not found."
                  )

              debug_marker = text.find(
                  "mergeProjectDexDebug",
                  debug_start
              )

              if debug_marker < 0:
                  raise SystemExit(
                      "ERROR: mergeProjectDexDebug not found."
                  )

              debug_start = text.rfind(
                  "tasks.matching {",
                  0,
                  debug_marker + 1
              )

          debug_open = text.find(
              "{",
              debug_start
          )

          if debug_open < 0:
              raise SystemExit(
                  "ERROR: Debug block opening brace not found."
              )

          # Find the complete matching block.
          depth = 0
          debug_end = None

          for i in range(debug_open, len(text)):
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1
                  if depth == 0:
                      debug_end = i + 1
                      break

          if debug_end is None:
              raise SystemExit(
                  "ERROR: Debug block end not found."
              )

          debug_block = text[debug_start:debug_end]

          if "mergeProjectDexDebug" not in debug_block:
              raise SystemExit(
                  "ERROR: Located Debug block is incorrect."
              )

          debug_block = debug_block.replace(
              "tasks.matching {\n    it.name == 'mergeProjectDexDebug'\n}.configureEach { task ->",
              "project.tasks.configureEach { task ->\n\n    if (task.name != 'mergeProjectDexDebug') {\n        return\n    }"
          )

          text = (
              text[:debug_start]
              + debug_block
              + text[debug_end:]
          )

          # ------------------------------------------------------------
          # RELEASE
          # ------------------------------------------------------------
          release_marker = "mergeDexRelease"

          release_marker_pos = text.find(
              release_marker
          )

          if release_marker_pos < 0:
              raise SystemExit(
                  "ERROR: mergeDexRelease not found."
              )

          release_start = text.rfind(
              "tasks.matching {",
              0,
              release_marker_pos
          )

          project_release_start = text.rfind(
              "project.tasks.configureEach",
              0,
              release_marker_pos
          )

          if project_release_start > release_start:
              release_start = project_release_start

          if release_start < 0:
              raise SystemExit(
                  "ERROR: Release task hook not found."
              )

          release_open = text.find(
              "{",
              release_start
          )

          if release_open < 0:
              raise SystemExit(
                  "ERROR: Release block opening brace not found."
              )

          depth = 0
          release_end = None

          for i in range(release_open, len(text)):
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1
                  if depth == 0:
                      release_end = i + 1
                      break

          if release_end is None:
              raise SystemExit(
                  "ERROR: Release block end not found."
              )

          release_block = text[
              release_start:release_end
          ]

          if "mergeDexRelease" not in release_block:
              raise SystemExit(
                  "ERROR: Located Release block is incorrect."
              )

          release_block = release_block.replace(
              "tasks.matching {\n    it.name == 'mergeDexRelease'\n}.configureEach { task ->",
              "project.tasks.configureEach { task ->\n\n    if (task.name != 'mergeDexRelease') {\n        return\n    }"
          )

          text = (
              text[:release_start]
              + release_block
              + text[release_end:]
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "PASS: Debug and Release legacy DEX "
              "task hooks patched."
          )
          PY

          echo
          echo "=== Verify Debug hook ==="

          grep -n -A8 -B3 \
            "mergeProjectDexDebug" \
            app/build.gradle \
            | head -80

          echo
          echo "=== Verify Release hook ==="

          grep -n -A8 -B3 \
            "mergeDexRelease" \
            app/build.gradle \
            | head -100

          echo
          echo "PASS: Step 24 completed."

      # ============================================================
      # STEP 25
      # ============================================================
      - name: Verify Debug and Release task hooks
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          text = Path(
              "app/build.gradle"
          ).read_text(
              encoding="utf-8"
          )

          # ----------------------------------------------------------
          # Debug verification
          # ----------------------------------------------------------
          debug_pos = text.find(
              "mergeProjectDexDebug"
          )

          if debug_pos < 0:
              raise SystemExit(
                  "ERROR: mergeProjectDexDebug not found."
              )

          before_debug = text[:debug_pos]

          debug_project = before_debug.rfind(
              "project.tasks.configureEach"
          )

          debug_matching = before_debug.rfind(
              "tasks.matching {"
          )

          if debug_project < 0:
              raise SystemExit(
                  "ERROR: Debug hook does not use "
                  "project.tasks.configureEach."
              )

          if debug_matching > debug_project:
              raise SystemExit(
                  "ERROR: Debug hook still uses "
                  "tasks.matching."
              )

          print(
              "PASS: mergeProjectDexDebug uses "
              "project.tasks.configureEach."
          )

          # ----------------------------------------------------------
          # Release verification
          # ----------------------------------------------------------
          release_pos = text.find(
              "mergeDexRelease"
          )

          if release_pos < 0:
              raise SystemExit(
                  "ERROR: mergeDexRelease not found."
              )

          before_release = text[:release_pos]

          release_project = before_release.rfind(
              "project.tasks.configureEach"
          )

          release_matching = before_release.rfind(
              "tasks.matching {"
          )

          if release_project < 0:
              raise SystemExit(
                  "ERROR: Release hook does not use "
                  "project.tasks.configureEach."
              )

          if release_matching > release_project:
              raise SystemExit(
                  "ERROR: Release hook still uses "
                  "tasks.matching."
              )

          print(
              "PASS: mergeDexRelease uses "
              "project.tasks.configureEach."
          )

          # ----------------------------------------------------------
          # Legacy/R8 protections
          # ----------------------------------------------------------
          if "R8DexFilter" in text:
              raise SystemExit(
                  "ERROR: R8DexFilter must not be present."
              )

          if "setEnableExperimentalDexInput" in text:
              raise SystemExit(
                  "ERROR: setEnableExperimentalDexInput "
                  "must not be present."
              )

          print(
              "PASS: obsolete R8 logic is absent."
          )

          if "def d8Tool" not in text:
              raise SystemExit(
                  "ERROR: D8 tool definition is missing."
              )

          if "legacyDex.absolutePath" not in text:
              raise SystemExit(
                  "ERROR: legacy DEX input is missing."
              )

          print(
              "PASS: D8 release merge implementation "
              "is present."
          )
          PY

          echo
          echo "PASS: Debug and Release task hooks verified."

      # ============================================================
      # STEP 26
      # ============================================================
      - name: Verify patched Gradle syntax
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew :app:tasks \
            --no-daemon \
            --stacktrace

          echo
          echo "PASS: Gradle task graph parsed successfully."

      # ============================================================
      # STEP 27
      # ============================================================
      - name: Verify release merge task exists
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:tasks \
            --all \
            --no-daemon \
            | grep -F "mergeDexRelease"

          echo
          echo "PASS: mergeDexRelease task exists."

      # ============================================================
      # STEP 28
      # ============================================================
      - name: Assemble Release APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace

          echo
          echo "PASS: assembleRelease completed."

      # ============================================================
      # STEP 29
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"
          test -s "$APK"

          echo "=== APK ==="
          ls -lh "$APK"

          echo
          echo "=== SHA256 ==="
          sha256sum "$APK"

          echo
          echo "PASS: Release APK verified."

      # ============================================================
      # STEP 30
      # ============================================================
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: navigation-v1-patch1-release
          path: navigation-v1-source/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
