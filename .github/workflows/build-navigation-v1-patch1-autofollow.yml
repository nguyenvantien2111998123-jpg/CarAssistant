name: Build Navigation V1 Patch1 Autofollow

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: navigation-v1-source

    steps:

      - name: Checkout main baseline
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact main source
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          git fetch origin main --depth=1

          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="$(git rev-parse origin/main)"

          echo "HEAD=$ACTUAL"
          echo "origin/main=$EXPECTED"

          test "$ACTUAL" = "$EXPECTED"

          test -d navigation-v1-source
          test -f navigation-v1-source/settings.gradle
          test -f navigation-v1-source/build.gradle
          test -f navigation-v1-source/app/build.gradle

          echo "PASS: exact main source verified."

      - name: Verify required source structure
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          test -d app/src/main/java
          test -d app/src/main/res
          test -d app/libs

          test -f app/src/main/java/com/carassistant/v10/NavigationMapView.java
          test -f app/src/main/java/com/carassistant/v10/V10CarActivity.java
          test -f app/src/main/java/com/carassistant/v10/V10ProjectionSession.java

          test -f app/libs/aasdk-legacy.dex

          echo "Required Navigation V1 source structure verified."

      - name: Verify Android Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Root build.gradle ==="
          cat build.gradle

          echo
          echo "=== App build.gradle ==="
          cat app/build.gradle

          echo
          echo "=== Verify AGP 8.13.0 ==="
          grep -Fq "com.android.application" build.gradle
          grep -Fq "8.13.0" build.gradle

          echo
          echo "=== Verify compileSdk 36 ==="
          grep -Eq 'compileSdk[[:space:]]+36' app/build.gradle

          echo
          echo "=== Verify Java 17 ==="
          grep -Fq "JavaVersion.VERSION_17" app/build.gradle

          echo
          echo "=== Verify MapLibre dependency ==="
          grep -Fq 'org.maplibre.gl:android-sdk:11.11.0' app/build.gradle

          echo
          echo "Android Gradle configuration verified."

      - name: Save protected core checksums
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/carassistant-protected

          find app/src/main/java \
            -type f \
            \( \
              -name '*ProjectionService*.java' \
              -o -name '*ProjectionSession*.java' \
              -o -name '*Floating*.java' \
              -o -name '*Touch*.java' \
            \) \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > /tmp/carassistant-protected/core.sha256 || true

          echo "Protected core checksums:"
          cat /tmp/carassistant-protected/core.sha256 || true

      - name: Save Floating Touch checksum
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/carassistant-protected

          find app/src/main/java \
            -type f \
            -iname '*Floating*Touch*.java' \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > /tmp/carassistant-protected/floating-touch.sha256 || true

          echo "Floating Touch checksum:"
          cat /tmp/carassistant-protected/floating-touch.sha256 || true

      - name: Inspect NavigationMap initialization
        shell: bash
        run: |
          set -euo pipefail

          echo "=== NavigationMap initialization ==="

          grep -RIn \
            --include='*.java' \
            --include='*.kt' \
            'NavigationMap' \
            app/src/main/java \
            || true

          echo
          echo "=== Navigation source files ==="

          find app/src/main/java \
            -type f \
            \( \
              -iname '*Navigation*.java' \
              -o -iname '*Navigation*.kt' \
            \) \
            -print \
            | sort \
            || true

      - name: Clean redundant Dashboard code
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Cleaning redundant Dashboard code ==="

          while IFS= read -r -d '' file; do
            echo "Inspecting: $file"

            python3 - "$file" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          original = text

          lines = text.splitlines(True)
          seen = set()
          out = []

          for line in lines:
              stripped = line.strip()

              if stripped.startswith("import ") and stripped in seen:
                  continue

              if stripped.startswith("import "):
                  seen.add(stripped)

              out.append(line)

          text = "".join(out)

          if text != original:
              path.write_text(text, encoding="utf-8")
              print(f"Updated: {path}")
          else:
              print(f"No redundant imports found: {path}")
          PY

          done < <(
            find app/src/main/java \
              -type f \
              \( \
                -iname '*Dashboard*.java' \
                -o -iname '*Dashboard*.kt' \
              \) \
              -print0
          )

      - name: Verify cleanup
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Verify source after cleanup ==="

          find app/src/main/java \
            -type f \
            \( \
              -iname '*Dashboard*.java' \
              -o -iname '*Dashboard*.kt' \
            \) \
            -print \
            | sort

          echo
          echo "=== Duplicate imports check ==="

          python3 <<'PY'
          from pathlib import Path

          errors = []

          for path in Path("app/src/main/java").rglob("*"):
              if not path.is_file():
                  continue

              if path.suffix not in {".java", ".kt"}:
                  continue

              try:
                  lines = path.read_text(encoding="utf-8").splitlines()
              except Exception:
                  continue

              imports = [
                  line.strip()
                  for line in lines
                  if line.strip().startswith("import ")
              ]

              if len(imports) != len(set(imports)):
                  errors.append(str(path))

          if errors:
              print("Duplicate imports remain:")
              for item in errors:
                  print(item)
              raise SystemExit(1)

          print("Duplicate import check passed.")
          PY

      - name: Verify Navigation core
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Navigation core verification ==="

          NAV_FILES="$(
            find app/src/main/java \
              -type f \
              \( \
                -iname '*Navigation*.java' \
                -o -iname '*Navigation*.kt' \
              \) \
              | sort
          )"

          if [ -z "$NAV_FILES" ]; then
            echo "ERROR: No Navigation source files found."
            exit 1
          fi

          echo "$NAV_FILES"

          echo
          echo "=== NavigationMap references ==="

          grep -RIn \
            --include='*.java' \
            --include='*.kt' \
            'NavigationMap' \
            app/src/main/java \
            || true

      - name: Verify protected core unchanged
        shell: bash
        run: |
          set -euo pipefail

          if [ -s /tmp/carassistant-protected/core.sha256 ]; then
            sha256sum -c /tmp/carassistant-protected/core.sha256
          else
            echo "No protected core files were captured."
          fi

      - name: Verify Floating Touch unchanged
        shell: bash
        run: |
          set -euo pipefail

          if [ -s /tmp/carassistant-protected/floating-touch.sha256 ]; then
            sha256sum -c /tmp/carassistant-protected/floating-touch.sha256
          else
            echo "No Floating Touch files were captured."
          fi

      - name: Show source diff
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Git status ==="
          git status --short

          echo
          echo "=== Git diff stat ==="
          git diff --stat

          echo
          echo "=== Git diff ==="
          git diff -- app/src/main/java app/src/main/res app/build.gradle

      - name: Git diff check
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Git diff check ==="

          if git diff --quiet; then
            echo "No source changes detected before build."
          else
            echo "Source changes detected:"
            git diff --stat
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing platform-tools..."
          sdkmanager "platform-tools"

          echo "Installing Android 36 platform..."
          sdkmanager "platforms;android-36"

          echo "Installing Build Tools 36.0.0..."
          sdkmanager "build-tools;36.0.0"

          echo "Required Android SDK packages installed."

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "=== sdkmanager location ==="
          command -v sdkmanager

          echo
          echo "=== Android SDK root ==="
          echo "${ANDROID_SDK_ROOT}"

          echo
          echo "=== Installed SDK packages ==="
          sdkmanager --list_installed | grep -E \
            'platform-tools|platforms;android-36|build-tools;36.0.0' \
            || true

          echo
          echo "=== Verify Android 36 platform ==="
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"

          echo
          echo "=== Verify Build Tools 36.0.0 ==="
          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"

          echo
          echo "=== Verify Platform Tools ==="
          test -d "$ANDROID_SDK_ROOT/platform-tools"

          echo
          echo "Android SDK verification passed."

      - name: Make Gradle executable
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew
          chmod +x ./gradlew

          ./gradlew --version

      - name: Verify Gradle source before compile
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

          echo "Gradle source files verified."

      - name: Compile Java
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace

      - name: Patch release merge for aasdk legacy dex
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text(encoding="utf-8")

          marker = "tasks.matching {"

          marker_pos = text.find(marker)

          target_start = None
          search_pos = 0

          while True:
              pos = text.find(marker, search_pos)

              if pos < 0:
                  break

              block_end_probe = text.find(
                  "}.configureEach { task ->",
                  pos
              )

              if block_end_probe < 0:
                  break

              header = text[pos:block_end_probe]

              if "mergeDexRelease" in header:
                  target_start = pos
                  break

              search_pos = pos + len(marker)

          if target_start is None:
              raise SystemExit(
                  "ERROR: Existing mergeDexRelease task block was not found in baseline app/build.gradle."
              )

          open_brace = text.find("{", target_start)

          if open_brace < 0:
              raise SystemExit(
                  "ERROR: Could not find opening brace of mergeDexRelease block."
              )

          depth = 0
          target_end = None

          for index in range(open_brace, len(text)):
              char = text[index]

              if char == "{":
                  depth += 1

              elif char == "}":
                  depth -= 1

                  if depth == 0:
                      target_end = index + 1
                      break

          if target_end is None:
              raise SystemExit(
                  "ERROR: Could not find end of mergeDexRelease block."
              )

          new_block_lines = [
              "tasks.matching {",
              "    it.name == 'mergeDexRelease'",
              "}.configureEach { task ->",
              "",
              "    task.doLast {",
              "",
              "        def legacyDex =",
              "                rootProject.file('app/libs/aasdk-legacy.dex')",
              "",
              "        if (!legacyDex.exists()) {",
              "            throw new GradleException(",
              "                    \"Thiếu app/libs/aasdk-legacy.dex!\"",
              "            )",
              "        }",
              "",
              "        def outputDir =",
              "                task.outputDir.get().asFile",
              "",
              "        def dexFilter = {",
              "            it.isFile() &&",
              "            it.name ==~ /classes\\d*\\.dex/",
              "        } as FileFilter",
              "",
              "        def appDexes =",
              "                outputDir",
              "                        .listFiles(dexFilter)",
              "                        ?.toList() ?: []",
              "",
              "        if (appDexes.isEmpty()) {",
              "            throw new GradleException(",
              "                    \"Không tìm thấy classes*.dex trong \" +",
              "                    outputDir",
              "            )",
              "        }",
              "",
              "        def buildDirFile =",
              "                project.layout.buildDirectory",
              "                        .asFile",
              "                        .get()",
              "",
              "        def tempDir =",
              "                new File(",
              "                        buildDirFile,",
              "                        \"intermediates/dex_merged_temp\"",
              "                )",
              "",
              "        tempDir.deleteDir()",
              "        tempDir.mkdirs()",
              "",
              "        def sdkDir =",
              "                android.sdkDirectory.absolutePath",
              "",
              "        def buildToolsVersion =",
              "                android.buildToolsVersion",
              "",
              "        def d8Tool =",
              "                \"${sdkDir}/build-tools/\" +",
              "                \"${buildToolsVersion}/d8\"",
              "",
              "        if (!file(d8Tool).exists()) {",
              "            throw new GradleException(",
              "                    \"Không tìm thấy D8: \" + d8Tool",
              "            )",
              "        }",
              "",
              "        logger.lifecycle(",
              "                \"============================================================\"",
              "        )",
              "        logger.lifecycle(",
              "                \"AACast-Doudou LEGACY DEX MERGE\"",
              "        )",
              "        logger.lifecycle(",
              "                \"============================================================\"",
              "        )",
              "        logger.lifecycle(",
              "                \"Legacy DEX: \" + legacyDex.absolutePath",
              "        )",
              "        logger.lifecycle(",
              "                \"D8        : \" + d8Tool",
              "        )",
              "        logger.lifecycle(",
              "                \"App DEX count: \" + appDexes.size()",
              "        )",
              "",
              "        project.exec {",
              "            commandLine(",
              "                    [",
              "                            d8Tool,",
              "                            '--min-api',",
              "                            '29',",
              "                            '--output',",
              "                            tempDir.absolutePath",
              "                    ]",
              "                    +",
              "                    appDexes*.absolutePath",
              "                    +",
              "                    [",
              "                            legacyDex.absolutePath",
              "                    ]",
              "            )",
              "        }",
              "",
              "        def mergedDexes =",
              "                tempDir",
              "                        .listFiles(dexFilter)",
              "                        ?.toList() ?: []",
              "",
              "        if (mergedDexes.isEmpty()) {",
              "            throw new GradleException(",
              "                    \"D8 merge dex thất bại!\"",
              "            )",
              "        }",
              "",
              "        logger.lifecycle(",
              "                \"D8 produced ${mergedDexes.size()} merged dex file(s).\"",
              "        )",
              "",
              "        appDexes.each {",
              "            if (it.exists() && !it.delete()) {",
              "                throw new GradleException(",
              "                        \"Không thể xóa DEX cũ: \" + it.absolutePath",
              "                )",
              "            }",
              "        }",
              "",
              "        mergedDexes.each { merged ->",
              "",
              "            def target =",
              "                    new File(",
              "                            outputDir,",
              "                            merged.name",
              "                    )",
              "",
              "            if (!merged.renameTo(target)) {",
              "                target.bytes = merged.bytes",
              "                merged.delete()",
              "            }",
              "        }",
              "",
              "        tempDir.deleteDir()",
              "",
              "        def finalDexes =",
              "                outputDir",
              "                        .listFiles(dexFilter)",
              "                        ?.toList() ?: []",
              "",
              "        if (finalDexes.isEmpty()) {",
              "            throw new GradleException(",
              "                    \"Không còn DEX sau khi cài merged DEX!\"",
              "            )",
              "        }",
              "",
              "        logger.lifecycle(",
              "                \"PASS: D8 merge nguyên bản legacy DEX thành công.\"",
              "        )",
              "        logger.lifecycle(",
              "                \"Final DEX count: ${finalDexes.size()}\"",
              "        )",
              "    }",
              "}"
          ]

          new_block = "\n".join(new_block_lines)

          updated = (
              text[:target_start]
              + new_block
              + text[target_end:]
          )

          path.write_text(
              updated,
              encoding="utf-8"
          )

          print(
              "PASS: Existing baseline mergeDexRelease block "
              "was replaced successfully."
          )
          PY

      - name: Verify release merge patch
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Verify release merge patch ==="

          test -f app/build.gradle

          COUNT="$(grep -c "it.name == 'mergeDexRelease'" app/build.gradle || true)"

          echo "mergeDexRelease block count: $COUNT"

          test "$COUNT" -eq 1

          grep -Fq "app/libs/aasdk-legacy.dex" app/build.gradle
          grep -Fq "android.buildToolsVersion" app/build.gradle
          grep -Fq "D8 merge nguyên bản legacy DEX thành công" app/build.gradle
          grep -Fq "'--min-api'" app/build.gradle
          grep -Fq "'29'" app/build.gradle

          if grep -Fq "R8DexFilter" app/build.gradle; then
            echo "ERROR: R8DexFilter must not be present in release patch."
            exit 1
          fi

          if grep -Fq "setEnableExperimentalDexInput" app/build.gradle; then
            echo "ERROR: R8-specific logic must not be present in release patch."
            exit 1
          fi

          echo "Release merge patch markers verified."

      - name: Verify patched Gradle syntax
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Gradle task verification ==="

          ./gradlew \
            :app:tasks \
            --no-daemon \
            --stacktrace \
            >/tmp/carassistant-gradle-tasks.log

          echo "Gradle configuration parsed successfully."

          grep -Fq "assembleRelease" /tmp/carassistant-gradle-tasks.log

          echo "assembleRelease task is available."

      - name: Assemble Release APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          echo "=== Verify release APK ==="

          test -f "$APK"
          test -s "$APK"

          echo "APK path:"
          realpath "$APK"

          echo "APK size:"
          stat -c '%s bytes' "$APK"

          echo "APK SHA256:"
          sha256sum "$APK"

          echo "APK verification passed."

      - name: Upload Navigation V1 Patch1 APK
        uses: actions/upload-artifact@v4
        with:
          name: navigation-v1-patch1-autofollow-apk
          path: navigation-v1-source/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
