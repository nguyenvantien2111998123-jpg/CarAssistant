name: CarAssistant V10 - Navigation V1 Patch 1 Auto-follow Recenter

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      # ============================================================
      # 1. CHECKOUT MAIN
      # ============================================================
      - name: Checkout current main Navigation V1
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      # ============================================================
      # 2. JAVA
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. VERIFY CURRENT MAIN SOURCE
      # ============================================================
      - name: Verify current main Navigation V1 source
        shell: bash
        run: |
          set -euo pipefail

          SRC="navigation-v1-source"
          JAVA_SRC="$SRC/app/src/main/java/com/hieptran/aacast/doudou"
          NAV_SRC="$SRC/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          ACTIVITY="$JAVA_SRC/V10CarActivity.java"

          test -d "$SRC"
          test -f "$SRC/settings.gradle"
          test -f "$SRC/build.gradle"
          test -f "$SRC/app/build.gradle"
          test -f "$SRC/gradlew"

          test -f "$ACTIVITY"
          test -f "$NAV_SRC"

          test -f "$JAVA_SRC/V10ProjectionSession.java"
          test -f "$JAVA_SRC/V10DisplayController.java"
          test -f "$JAVA_SRC/V10SurfaceManager.java"
          test -f "$JAVA_SRC/V10TaskSession.java"
          test -f "$JAVA_SRC/V10SessionStore.java"

          echo "PASS: navigation-v1-source exists on main."
          echo "PASS: NavigationMapView exists."
          echo "PASS: V10CarActivity exists."
          echo "PASS: protected Projection/Persistence files exist."

      # ============================================================
      # 4. PROTECTED CORE HASH BEFORE PATCH
      # ============================================================
      - name: Lock protected Projection and Persistence core
        shell: bash
        run: |
          set -euo pipefail

          SRC="navigation-v1-source/app/src/main/java/com/hieptran/aacast/doudou"

          sha256sum \
            "$SRC/V10ProjectionSession.java" \
            "$SRC/V10DisplayController.java" \
            "$SRC/V10SurfaceManager.java" \
            "$SRC/V10TaskSession.java" \
            "$SRC/V10SessionStore.java" \
            > /tmp/core-before.sha256

          echo "PASS: Protected core SHA recorded."

      # ============================================================
      # 5. VERIFY BASELINE UI BEFORE PATCH
      #    Chỉ kiểm tra, KHÔNG sửa Home UI.
      # ============================================================
      - name: Verify Home UI V2 and transparent overlay baseline
        shell: bash
        run: |
          set -euo pipefail

          ACTIVITY="navigation-v1-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq "NavigationMapView" "$ACTIVITY"
          grep -Fq "projectionLayer" "$ACTIVITY"
          grep -Fq "launcherLayer" "$ACTIVITY"

          grep -Fq "APP CHỌN" "$ACTIVITY"
          grep -Fq "TASKS" "$ACTIVITY"
          grep -Fq "MEDIA" "$ACTIVITY"

          grep -Fq "Math.min(4" "$ACTIVITY"

          python3 - "$ACTIVITY" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          n = "".join(s.split())

          required = [
              "dashboard.setBackgroundColor(Color.TRANSPARENT);",
              "projectionLayer.setBackgroundColor(Color.TRANSPARENT);",
              "launcherLayer.setBackgroundColor(Color.TRANSPARENT);"
          ]

          for item in required:
              if item not in n:
                  raise SystemExit("ERROR: Missing transparent UI marker: " + item)

          print("PASS: Home UI V2 + transparent overlay markers.")
          PY

      # ============================================================
      # 6. SAVE BASELINE NAVIGATION SOURCE
      # ============================================================
      - name: Save Navigation V1 source before Patch 1
        shell: bash
        run: |
          set -euo pipefail

          NAV_SRC="navigation-v1-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"

          cp "$NAV_SRC" /tmp/NavigationMapView.before.java

          echo "PASS: Navigation V1 source snapshot saved."

      # ============================================================
      # 7. PATCH 1
      #
      # CHỈ SỬA NavigationMapView.java
      #
      # Không:
      # - sửa V10CarActivity
      # - sửa Home UI
      # - sửa overlay
      # - sửa Projection Core
      # - tạo UI layer mới
      # ============================================================
      - name: Apply Patch 1 Auto-follow and Recenter
        shell: bash
        run: |
          set -euo pipefail

          NAV_SRC="navigation-v1-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"

          test -f "$NAV_SRC"

          cat > "$NAV_SRC" <<'EOF'
          package com.carassistant.v10;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.os.Bundle;
          import android.os.Looper;
          import android.widget.FrameLayout;

          import org.maplibre.android.MapLibre;
          import org.maplibre.android.camera.CameraUpdateFactory;
          import org.maplibre.android.geometry.LatLng;
          import org.maplibre.android.location.LocationComponentActivationOptions;
          import org.maplibre.android.location.LocationComponentOptions;
          import org.maplibre.android.maps.MapLibreMap;
          import org.maplibre.android.maps.MapView;
          import org.maplibre.android.maps.UiSettings;

          public final class NavigationMapView extends FrameLayout {

              private static final int LOCATION_REQUEST = 4101;
              private static final long AUTO_FOLLOW_INTERVAL_MS = 1000L;
              private static final float AUTO_FOLLOW_MIN_DISTANCE_METERS = 5.0f;

              private final MapView mapView;
              private final LocationManager locationManager;

              private MapLibreMap map;

              private boolean autoFollow = true;
              private boolean locationUpdatesStarted = false;
              private Location lastAutoFollowLocation;

              private final LocationListener navigationLocationListener =
                      new LocationListener() {

                          @Override
                          public void onLocationChanged(Location location) {
                              if (location == null) {
                                  return;
                              }

                              if (!autoFollow || map == null) {
                                  return;
                              }

                              if (lastAutoFollowLocation != null
                                      && location.distanceTo(lastAutoFollowLocation)
                                      < AUTO_FOLLOW_MIN_DISTANCE_METERS) {
                                  return;
                              }

                              lastAutoFollowLocation = new Location(location);

                              followLocation(location);
                          }

                          @Override
                          public void onProviderEnabled(String provider) {
                          }

                          @Override
                          public void onProviderDisabled(String provider) {
                          }
                      };

              public NavigationMapView(Context context) {
                  super(context);

                  setBackgroundColor(Color.BLACK);

                  MapLibre.getInstance(
                          context.getApplicationContext());

                  locationManager =
                          (LocationManager) context.getSystemService(
                                  Context.LOCATION_SERVICE);

                  mapView = new MapView(context);

                  mapView.onCreate(
                          new Bundle());

                  addView(
                          mapView,
                          new LayoutParams(
                                  LayoutParams.MATCH_PARENT,
                                  LayoutParams.MATCH_PARENT));

                  mapView.getMapAsync(
                          this::onMapReady);
              }

              private void onMapReady(
                      MapLibreMap readyMap) {

                  map = readyMap;

                  UiSettings ui =
                          map.getUiSettings();

                  ui.setCompassEnabled(false);
                  ui.setZoomGesturesEnabled(true);
                  ui.setScrollGesturesEnabled(true);
                  ui.setRotateGesturesEnabled(true);
                  ui.setTiltGesturesEnabled(false);

                  map.setOnCameraMoveStartedListener(
                          reason -> {
                              if (reason
                                      == MapLibreMap
                                      .OnCameraMoveStartedListener
                                      .REASON_API_GESTURE) {

                                  autoFollow = false;
                              }
                          });

                  map.setStyle(
                          "https://tiles.openfreemap.org/styles/liberty",
                          style -> enableLocation());
              }

              private void enableLocation() {

                  if (map == null) {
                      return;
                  }

                  Context context =
                          getContext();

                  if (context == null) {
                      return;
                  }

                  if (context.checkSelfPermission(
                          Manifest.permission.ACCESS_FINE_LOCATION)
                          != PackageManager.PERMISSION_GRANTED) {

                      if (context instanceof Activity) {
                          ((Activity) context).requestPermissions(
                                  new String[]{
                                          Manifest.permission.ACCESS_FINE_LOCATION,
                                          Manifest.permission.ACCESS_COARSE_LOCATION
                                  },
                                  LOCATION_REQUEST);
                      }

                      return;
                  }

                  LocationComponentOptions options =
                          LocationComponentOptions
                                  .builder(context)
                                  .pulseEnabled(true)
                                  .build();

                  LocationComponentActivationOptions activation =
                          LocationComponentActivationOptions
                                  .builder(
                                          context,
                                          map.getStyle())
                                  .locationComponentOptions(options)
                                  .build();

                  map.getLocationComponent()
                          .activateLocationComponent(
                                  activation);

                  map.getLocationComponent()
                          .setLocationComponentEnabled(true);

                  startLocationUpdates();
                  autoFollowToLastKnownLocation();
              }

              private void startLocationUpdates() {

                  if (locationUpdatesStarted) {
                      return;
                  }

                  if (locationManager == null) {
                      return;
                  }

                  Context context =
                          getContext();

                  if (context == null) {
                      return;
                  }

                  if (context.checkSelfPermission(
                          Manifest.permission.ACCESS_FINE_LOCATION)
                          != PackageManager.PERMISSION_GRANTED
                          && context.checkSelfPermission(
                          Manifest.permission.ACCESS_COARSE_LOCATION)
                          != PackageManager.PERMISSION_GRANTED) {
                      return;
                  }

                  try {
                      if (locationManager.isProviderEnabled(
                              LocationManager.GPS_PROVIDER)) {

                          locationManager.requestLocationUpdates(
                                  LocationManager.GPS_PROVIDER,
                                  AUTO_FOLLOW_INTERVAL_MS,
                                  AUTO_FOLLOW_MIN_DISTANCE_METERS,
                                  navigationLocationListener,
                                  Looper.getMainLooper());
                      }

                      if (locationManager.isProviderEnabled(
                              LocationManager.NETWORK_PROVIDER)) {

                          locationManager.requestLocationUpdates(
                                  LocationManager.NETWORK_PROVIDER,
                                  AUTO_FOLLOW_INTERVAL_MS,
                                  AUTO_FOLLOW_MIN_DISTANCE_METERS,
                                  navigationLocationListener,
                                  Looper.getMainLooper());
                      }

                      locationUpdatesStarted = true;

                  } catch (SecurityException ignored) {
                  } catch (Exception ignored) {
                  }
              }

              private void stopLocationUpdates() {

                  if (!locationUpdatesStarted) {
                      return;
                  }

                  if (locationManager == null) {
                      return;
                  }

                  try {
                      locationManager.removeUpdates(
                              navigationLocationListener);
                  } catch (Exception ignored) {
                  }

                  locationUpdatesStarted = false;
              }

              private void autoFollowToLastKnownLocation() {

                  if (!autoFollow || map == null) {
                      return;
                  }

                  try {
                      Location location =
                              map.getLocationComponent()
                                      .getLastKnownLocation();

                      if (location != null) {
                          lastAutoFollowLocation =
                                  new Location(location);

                          followLocation(location);
                          return;
                      }
                  } catch (Exception ignored) {
                  }

                  try {
                      if (locationManager == null) {
                          return;
                      }

                      Context context =
                              getContext();

                      if (context == null) {
                          return;
                      }

                      if (context.checkSelfPermission(
                              Manifest.permission.ACCESS_FINE_LOCATION)
                              != PackageManager.PERMISSION_GRANTED
                              && context.checkSelfPermission(
                              Manifest.permission.ACCESS_COARSE_LOCATION)
                              != PackageManager.PERMISSION_GRANTED) {
                          return;
                      }

                      Location location = null;

                      try {
                          location =
                                  locationManager.getLastKnownLocation(
                                          LocationManager.GPS_PROVIDER);
                      } catch (Exception ignored) {
                      }

                      if (location == null) {
                          try {
                              location =
                                      locationManager.getLastKnownLocation(
                                              LocationManager.NETWORK_PROVIDER);
                          } catch (Exception ignored) {
                          }
                      }

                      if (location != null) {
                          lastAutoFollowLocation =
                                  new Location(location);

                          followLocation(location);
                      }

                  } catch (SecurityException ignored) {
                  } catch (Exception ignored) {
                  }
              }

              private void followLocation(
                      Location location) {

                  if (map == null || location == null) {
                      return;
                  }

                  map.animateCamera(
                          CameraUpdateFactory
                                  .newLatLng(
                                          new LatLng(
                                                  location.getLatitude(),
                                                  location.getLongitude())),
                          350);
              }

              public void zoomIn() {

                  if (map == null) {
                      return;
                  }

                  double zoom =
                          map.getCameraPosition().zoom;

                  map.animateCamera(
                          CameraUpdateFactory.zoomTo(
                                  Math.min(
                                          20.0,
                                          zoom + 1.0)),
                          250);
              }

              public void zoomOut() {

                  if (map == null) {
                      return;
                  }

                  double zoom =
                          map.getCameraPosition().zoom;

                  map.animateCamera(
                          CameraUpdateFactory.zoomTo(
                                  Math.max(
                                          1.0,
                                          zoom - 1.0)),
                          250);
              }

              public void recenter() {

                  if (map == null) {
                      return;
                  }

                  autoFollow = true;

                  try {
                      Location location =
                              map.getLocationComponent()
                                      .getLastKnownLocation();

                      if (location == null
                              && locationManager != null) {

                          Context context =
                                  getContext();

                          if (context != null
                                  && (context.checkSelfPermission(
                                  Manifest.permission.ACCESS_FINE_LOCATION)
                                  == PackageManager.PERMISSION_GRANTED
                                  || context.checkSelfPermission(
                                  Manifest.permission.ACCESS_COARSE_LOCATION)
                                  == PackageManager.PERMISSION_GRANTED)) {

                              try {
                                  location =
                                          locationManager.getLastKnownLocation(
                                                  LocationManager.GPS_PROVIDER);
                              } catch (Exception ignored) {
                              }

                              if (location == null) {
                                  try {
                                      location =
                                              locationManager.getLastKnownLocation(
                                                      LocationManager.NETWORK_PROVIDER);
                                  } catch (Exception ignored) {
                                  }
                              }
                          }
                      }

                      if (location == null) {
                          return;
                      }

                      lastAutoFollowLocation =
                              new Location(location);

                      map.animateCamera(
                              CameraUpdateFactory
                                      .newLatLngZoom(
                                              new LatLng(
                                                      location.getLatitude(),
                                                      location.getLongitude()),
                                              16.0),
                              500);

                  } catch (Exception ignored) {
                  }
              }

              public void onHostResume() {
                  mapView.onResume();

                  if (map != null) {
                      startLocationUpdates();

                      if (autoFollow) {
                          autoFollowToLastKnownLocation();
                      }
                  }
              }

              public void onHostPause() {
                  stopLocationUpdates();
                  mapView.onPause();
              }

              public void onHostDestroy() {
                  stopLocationUpdates();
                  mapView.onDestroy();
              }
          }
          EOF

          echo "PASS: Patch 1 source applied to NavigationMapView only."

      # ============================================================
      # 8. VERIFY PATCH SCOPE
      # ============================================================
      - name: Verify Patch 1 changed only Navigation layer
        shell: bash
        run: |
          set -euo pipefail

          git diff --name-only > /tmp/changed-files.txt

          echo "Changed files:"
          cat /tmp/changed-files.txt

          if grep -Fxq \
            "navigation-v1-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java" \
            /tmp/changed-files.txt; then
            :
          else
            echo "ERROR: NavigationMapView.java was not changed."
            exit 1
          fi

          CHANGED_COUNT="$(wc -l < /tmp/changed-files.txt)"

          if [ "$CHANGED_COUNT" -ne 1 ]; then
            echo "ERROR: Patch 1 changed files outside NavigationMapView.java."
            exit 1
          fi

          if grep -Fq \
            "V10CarActivity.java" \
            /tmp/changed-files.txt; then
            echo "ERROR: V10CarActivity.java changed."
            exit 1
          fi

          if grep -Fq \
            "AndroidManifest.xml" \
            /tmp/changed-files.txt; then
            echo "ERROR: AndroidManifest.xml changed."
            exit 1
          fi

          if grep -Fq \
            "build.gradle" \
            /tmp/changed-files.txt; then
            echo "ERROR: build.gradle changed."
            exit 1
          fi

          echo "PASS: Patch 1 scope is NavigationMapView.java only."

      # ============================================================
      # 9. VERIFY AUTO-FOLLOW / RECENTER
      # ============================================================
      - name: Verify Patch 1 Auto-follow and Recenter
        shell: bash
        run: |
          set -euo pipefail

          NAV_SRC="navigation-v1-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"

          python3 - "$NAV_SRC" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          compact = "".join(s.split())

          required = [
              "privatebooleanautoFollow=true;",
              "LocationManager",
              "LocationListener",
              "startLocationUpdates()",
              "stopLocationUpdates()",
              "autoFollowToLastKnownLocation()",
              "followLocation(Locationlocation)",
              "REASON_API_GESTURE",
              "autoFollow=false;",
              "autoFollow=true;",
              "publicvoidrecenter()",
              "CameraUpdateFactory.newLatLng(",
              "CameraUpdateFactory.newLatLngZoom(",
              "LocationManager.GPS_PROVIDER",
              "LocationManager.NETWORK_PROVIDER"
          ]

          for marker in required:
              if marker not in compact:
                  raise SystemExit(
                      "ERROR: Patch 1 marker missing: " + marker
                  )

          print("PASS: Auto-follow/Recenter markers.")
          PY

      # ============================================================
      # 10. VERIFY NO NEW UI LAYER
      # ============================================================
      - name: Verify no new UI or overlay layer
        shell: bash
        run: |
          set -euo pipefail

          NAV_SRC="navigation-v1-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"
          ACTIVITY="navigation-v1-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          if grep -Eq \
            "buildDashboard|buildAppPanel|launcherLayer|projectionLayer" \
            "$NAV_SRC"; then
            echo "ERROR: Patch 1 attempted to add Home UI/overlay logic."
            exit 1
          fi

          test -f "$ACTIVITY"

          python3 - "$ACTIVITY" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          n = "".join(s.split())

          required = [
              "NavigationMapView",
              "projectionLayer",
              "launcherLayer",
              "dashboard.setBackgroundColor(Color.TRANSPARENT);",
              "projectionLayer.setBackgroundColor(Color.TRANSPARENT);",
              "launcherLayer.setBackgroundColor(Color.TRANSPARENT);"
          ]

          for marker in required:
              if marker not in n:
                  raise SystemExit(
                      "ERROR: Home UI/overlay baseline changed or missing: "
                      + marker
                  )

          print("PASS: Existing Home UI V2 + Transparent Overlay remains.")
          PY

          echo "PASS: No new UI layer added by Patch 1."

      # ============================================================
      # 11. VERIFY PROTECTED CORE UNCHANGED
      # ============================================================
      - name: Verify protected Projection and Persistence core
        shell: bash
        run: |
          set -euo pipefail

          SRC="navigation-v1-source/app/src/main/java/com/hieptran/aacast/doudou"

          sha256sum \
            "$SRC/V10ProjectionSession.java" \
            "$SRC/V10DisplayController.java" \
            "$SRC/V10SurfaceManager.java" \
            "$SRC/V10TaskSession.java" \
            "$SRC/V10SessionStore.java" \
            > /tmp/core-after.sha256

          diff -u \
            /tmp/core-before.sha256 \
            /tmp/core-after.sha256

          echo "PASS: Projection/Persistence core unchanged."

      # ============================================================
      # 12. VERIFY ORIGINAL NAVIGATION FEATURES REMAIN
      # ============================================================
      - name: Verify Navigation V1 baseline remains
        shell: bash
        run: |
          set -euo pipefail

          NAV_SRC="navigation-v1-source/app/src/main/java/com/carassistant/v10/NavigationMapView.java"

          grep -Fq "org.maplibre.android.MapLibre" "$NAV_SRC"
          grep -Fq "https://tiles.openfreemap.org/styles/liberty" "$NAV_SRC"
          grep -Fq "public void zoomIn()" "$NAV_SRC"
          grep -Fq "public void zoomOut()" "$NAV_SRC"
          grep -Fq "public void recenter()" "$NAV_SRC"
          grep -Fq "onHostResume()" "$NAV_SRC"
          grep -Fq "onHostPause()" "$NAV_SRC"
          grep -Fq "onHostDestroy()" "$NAV_SRC"

          echo "PASS: Navigation V1 MapLibre/Zoom/Recenter/lifecycle remain."

      # ============================================================
      # 13. VERIFY MAIN SOURCE DOES NOT USE OLD v10-source
      # ============================================================
      - name: Verify current architecture paths
        shell: bash
        run: |
          set -euo pipefail

          test -d navigation-v1-source

          if [ -d v10-source ]; then
            echo "ERROR: Old v10-source directory exists on main."
            exit 1
          fi

          if grep -RIl \
            "v10-source" \
            .github/workflows/build-navigation-v1-patch1-autofollow.yml \
            >/tmp/old-path-hit.txt 2>/dev/null; then
            echo "ERROR: Patch 1 workflow still references old v10-source."
            exit 1
          fi

          echo "PASS: Patch 1 uses navigation-v1-source only."

      # ============================================================
      # 14. GRADLE PERMISSION
      # ============================================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd navigation-v1-source

          chmod +x gradlew

          test -x gradlew

          echo "PASS: Gradle wrapper ready."

      # ============================================================
      # 15. COMPILE
      # ============================================================
      - name: Compile Patch 1
        shell: bash
        run: |
          set -euo pipefail

          cd navigation-v1-source

          ./gradlew \
            :app:compileReleaseJavaWithJavac \
            --no-daemon \
            --stacktrace

          echo "PASS: Patch 1 Java compilation."

      # ============================================================
      # 16. ASSEMBLE
      # ============================================================
      - name: Assemble Patch 1 APK
        shell: bash
        run: |
          set -euo pipefail

          cd navigation-v1-source

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          test -f app/build/outputs/apk/release/app-release.apk

          echo "PASS: Patch 1 APK assembled."

      # ============================================================
      # 17. APK SHA256
      # ============================================================
      - name: Calculate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="navigation-v1-source/app/build/outputs/apk/release/app-release.apk"

          sha256sum "$APK"

          mkdir -p /tmp/apk-output

          cp \
            "$APK" \
            "/tmp/apk-output/CarAssistant-Navigation-V1-Patch1-AutoFollow.apk"

          sha256sum \
            "/tmp/apk-output/CarAssistant-Navigation-V1-Patch1-AutoFollow.apk" \
            > "/tmp/apk-output/CarAssistant-Navigation-V1-Patch1-AutoFollow.apk.sha256"

          echo "PASS: APK SHA256 generated."

      # ============================================================
      # 18. FINAL ARCHITECTURE CHECK
      # ============================================================
      - name: Final Patch 1 architecture check
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "PATCH 1 FINAL ARCHITECTURE"
          echo "=============================================="
          echo "Source: navigation-v1-source/"
          echo "Feature: Auto-follow + Recenter"
          echo "Modified Java: NavigationMapView.java ONLY"
          echo "Home UI V2: PRESERVED"
          echo "Transparent Overlay: PRESERVED"
          echo "Projection Core: PRESERVED"
          echo "Persistence Core: PRESERVED"
          echo "New UI layer: NONE"
          echo "Old v10-source: NOT USED"
          echo "=============================================="

          echo "PASS: Patch 1 architecture locked."

      # ============================================================
      # 19. UPLOAD APK
      # ============================================================
      - name: Upload Patch 1 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-Navigation-V1-Patch1-AutoFollow
          path: |
            /tmp/apk-output/CarAssistant-Navigation-V1-Patch1-AutoFollow.apk
            /tmp/apk-output/CarAssistant-Navigation-V1-Patch1-AutoFollow.apk.sha256
          if-no-files-found: error

      # ============================================================
      # 20. FINAL RESULT
      # ============================================================
      - name: Patch 1 PASS
        shell: bash
        run: |
          echo "================================================"
          echo "PASS: Navigation V1 Patch 1"
          echo "Auto-follow + Recenter"
