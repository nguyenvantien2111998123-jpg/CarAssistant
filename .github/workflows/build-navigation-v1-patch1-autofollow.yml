name: CarAssistant V10 - Navigation V1 Patch 1 Auto Follow + Home UI V2 Overlay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout exact Foundation
        uses: actions/checkout@v4
        with:
          ref: 2c814a181d00cde9547a446927ae181e18cb9cbb
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Foundation source
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$SRC/V10CarActivity.java"
          test -f "$SRC/V10ProjectionSession.java"
          test -f "$SRC/V10DisplayController.java"
          test -f "$SRC/V10SurfaceManager.java"
          test -f "$SRC/V10TaskSession.java"
          test -f "$SRC/V10SessionStore.java"

          ACTUAL="$(git rev-parse HEAD)"

          if [ "$ACTUAL" != "2c814a181d00cde9547a446927ae181e18cb9cbb" ]; then
            echo "ERROR: Foundation commit mismatch: $ACTUAL"
            exit 1
          fi

          sha256sum \
            "$SRC/V10ProjectionSession.java" \
            "$SRC/V10DisplayController.java" \
            "$SRC/V10SurfaceManager.java" \
            "$SRC/V10TaskSession.java" \
            "$SRC/V10SessionStore.java" \
            > /tmp/core-before.sha256

          echo "PASS: Foundation source and lock."

      - name: Add MapLibre and location permissions
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="v10-source/app/build.gradle"
          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          test -f "$GRADLE"
          test -f "$MANIFEST"

          if ! grep -Fq "org.maplibre.gl:android-sdk:11.11.0" "$GRADLE"; then
            printf '%s\n' \
              'implementation "org.maplibre.gl:android-sdk:11.11.0"' \
              > /tmp/maplibre.line

            sed -i \
              '/^[[:space:]]*dependencies[[:space:]]*{/r /tmp/maplibre.line' \
              "$GRADLE"
          fi

          if ! grep -Fq \
            "android.permission.ACCESS_FINE_LOCATION" \
            "$MANIFEST"; then

            printf '%s\n' \
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' \
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' \
              > /tmp/location.permissions

            sed -i \
              '/<manifest/r /tmp/location.permissions' \
              "$MANIFEST"
          fi

          if ! grep -Fq \
            "org.maplibre.gl:android-sdk:11.11.0" \
            "$GRADLE"; then
            echo "ERROR: MapLibre dependency missing."
            exit 1
          fi

          if ! grep -Fq \
            "android.permission.ACCESS_FINE_LOCATION" \
            "$MANIFEST"; then
            echo "ERROR: FINE location permission missing."
            exit 1
          fi

          if ! grep -Fq \
            "android.permission.ACCESS_COARSE_LOCATION" \
            "$MANIFEST"; then
            echo "ERROR: COARSE location permission missing."
            exit 1
          fi

          echo "PASS: Navigation dependency and permissions."

      - name: Create NavigationMapView with Patch 1 Auto-follow
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          cat > "$SRC/NavigationMapView.java" <<'EOF'
          package com.carassistant.v10;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.location.Location;
          import android.os.Bundle;
          import android.widget.FrameLayout;

          import org.maplibre.android.MapLibre;
          import org.maplibre.android.camera.CameraUpdateFactory;
          import org.maplibre.android.geometry.LatLng;
          import org.maplibre.android.location.LocationComponentActivationOptions;
          import org.maplibre.android.location.LocationComponentOptions;
          import org.maplibre.android.location.modes.CameraMode;
          import org.maplibre.android.maps.MapLibreMap;
          import org.maplibre.android.maps.MapView;
          import org.maplibre.android.maps.UiSettings;

          public final class NavigationMapView extends FrameLayout {

              private static final int LOCATION_REQUEST = 4101;

              private final MapView mapView;

              private MapLibreMap map;

              private boolean autoFollow = true;

              public NavigationMapView(Context context) {
                  super(context);

                  setBackgroundColor(Color.BLACK);

                  MapLibre.getInstance(
                          context.getApplicationContext());

                  mapView = new MapView(context);

                  mapView.onCreate(
                          new Bundle());

                  addView(
                          mapView,
                          new LayoutParams(
                                  LayoutParams.MATCH_PARENT,
                                  LayoutParams.MATCH_PARENT));

                  mapView.getMapAsync(
                          this::onMapReady);
              }

              private void onMapReady(
                      MapLibreMap readyMap) {

                  map = readyMap;

                  UiSettings ui =
                          map.getUiSettings();

                  ui.setCompassEnabled(false);
                  ui.setZoomGesturesEnabled(true);
                  ui.setScrollGesturesEnabled(true);
                  ui.setRotateGesturesEnabled(true);
                  ui.setTiltGesturesEnabled(false);

                  map.setStyle(
                          "https://tiles.openfreemap.org/styles/liberty",
                          style -> enableLocation());
              }

              private void enableLocation() {

                  if (map == null) {
                      return;
                  }

                  Context context =
                          getContext();

                  if (context == null) {
                      return;
                  }

                  if (context.checkSelfPermission(
                          Manifest.permission.ACCESS_FINE_LOCATION)
                          != PackageManager.PERMISSION_GRANTED) {

                      if (context instanceof Activity) {

                          ((Activity) context).requestPermissions(
                                  new String[]{
                                          Manifest.permission.ACCESS_FINE_LOCATION,
                                          Manifest.permission.ACCESS_COARSE_LOCATION
                                  },
                                  LOCATION_REQUEST);
                      }

                      return;
                  }

                  LocationComponentOptions options =
                          LocationComponentOptions
                                  .builder(context)
                                  .pulseEnabled(true)
                                  .build();

                  LocationComponentActivationOptions activation =
                          LocationComponentActivationOptions
                                  .builder(
                                          context,
                                          map.getStyle())
                                  .locationComponentOptions(options)
                                  .build();

                  map.getLocationComponent()
                          .activateLocationComponent(
                                  activation);

                  map.getLocationComponent()
                          .setLocationComponentEnabled(true);

                  if (autoFollow) {

                      map.getLocationComponent()
                              .setCameraMode(
                                      CameraMode.TRACKING);
                  }
              }

              public void zoomIn() {

                  if (map == null) {
                      return;
                  }

                  double zoom =
                          map.getCameraPosition().zoom;

                  map.animateCamera(
                          CameraUpdateFactory.zoomTo(
                                  Math.min(
                                          20.0,
                                          zoom + 1.0)),
                          250);

                  disableAutoFollow();
              }

              public void zoomOut() {

                  if (map == null) {
                      return;
                  }

                  double zoom =
                          map.getCameraPosition().zoom;

                  map.animateCamera(
                          CameraUpdateFactory.zoomTo(
                                  Math.max(
                                          1.0,
                                          zoom - 1.0)),
                          250);

                  disableAutoFollow();
              }

              public void recenter() {

                  if (map == null) {
                      return;
                  }

                  try {

                      Location location =
                              map.getLocationComponent()
                                      .getLastKnownLocation();

                      if (location == null) {
                          return;
                      }

                      autoFollow = true;

                      if (map.getLocationComponent()
                              .isLocationComponentActivated()) {

                          map.getLocationComponent()
                                  .setCameraMode(
                                          CameraMode.TRACKING);
                      }

                      map.animateCamera(
                              CameraUpdateFactory
                                      .newLatLngZoom(
                                              new LatLng(
                                                      location.getLatitude(),
                                                      location.getLongitude()),
                                              16.0),
                              500);

                  } catch (Exception ignored) {
                  }
              }

              private void disableAutoFollow() {

                  autoFollow = false;

                  if (map == null) {
                      return;
                  }

                  try {

                      if (map.getLocationComponent()
                              .isLocationComponentActivated()) {

                          map.getLocationComponent()
                                  .setCameraMode(
                                          CameraMode.NONE);
                      }

                  } catch (Exception ignored) {
                  }
              }

              public boolean isAutoFollowEnabled() {
                  return autoFollow;
              }

              public void onHostResume() {
                  mapView.onResume();
              }

              public void onHostPause() {
                  mapView.onPause();
              }

              public void onHostDestroy() {
                  mapView.onDestroy();
              }
          }
          EOF

          if ! grep -Fq \
            "class NavigationMapView" \
            "$SRC/NavigationMapView.java"; then
            echo "ERROR: NavigationMapView was not created."
            exit 1
          fi

          if ! grep -Fq \
            "CameraMode.TRACKING" \
            "$SRC/NavigationMapView.java"; then
            echo "ERROR: Auto-follow CameraMode missing."
            exit 1
          fi

          if ! grep -Fq \
            "public void recenter()" \
            "$SRC/NavigationMapView.java"; then
            echo "ERROR: Recenter missing."
            exit 1
          fi

          echo "PASS: Navigation V1 Patch 1."

      - name: Patch Home UI V2 and transparent Navigation overlay
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/carassistant-patch
          mkdir -p /tmp/carassistant-patch

          cat > /tmp/carassistant-patch/patch.py <<'PY'
          from pathlib import Path

          P = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          s = P.read_text(encoding="utf-8")

          def method(sig):
              a = s.find(sig)

              if a < 0:
                  raise RuntimeError(
                      "METHOD NOT FOUND: " + sig
                  )

              b = s.find("{", a)

              if b < 0:
                  raise RuntimeError(
                      "OPEN BRACE NOT FOUND: " + sig
                  )

              depth = 0

              for i in range(b, len(s)):

                  if s[i] == "{":
                      depth += 1

                  elif s[i] == "}":
                      depth -= 1

                      if depth == 0:
                          return a, i + 1

              raise RuntimeError(
                  "METHOD END NOT FOUND: " + sig
              )

          def replace(sig, new):
              global s

              a, b = method(sig)

              s = (
                  s[:a]
                  + new.rstrip()
                  + "\n"
                  + s[b:]
              )

          def require(x):

              if x not in s:
                  raise RuntimeError(
                      "FOUNDATION MARKER MISSING: " + x
                  )

          require(
              "public final class V10CarActivity"
          )

          require(
              "private void buildUi()"
          )

          require(
              "private void buildDashboard()"
          )

          require(
              "private void rebuildDock()"
          )

          require(
              "private LinearLayout appTile("
          )

          require(
              "public void onResume()"
          )

          require(
              "public void onPause()"
          )

          require(
              "public void onDestroy()"
          )

          imports = [
              (
                  "import android.content.pm.ResolveInfo;",
                  "import android.content.pm.ResolveInfo;\n"
                  "import android.content.pm.ApplicationInfo;\n"
                  "import android.content.pm.PackageManager;"
              ),
              (
                  "import android.graphics.drawable.GradientDrawable;",
                  "import android.graphics.drawable.GradientDrawable;\n"
                  "import android.graphics.drawable.Drawable;"
              ),
              (
                  "import android.widget.GridLayout;",
                  "import android.widget.GridLayout;\n"
                  "import android.widget.ImageView;"
              )
          ]

          for old, new in imports:

              if new.split("\n")[1] not in s:
                  s = s.replace(
                      old,
                      new,
                      1
                  )

          if (
              "private NavigationMapView navigationMap;"
              not in s
          ):

              s = s.replace(
                  "    private FrameLayout root;",
                  "    private FrameLayout root;\n"
                  "    private NavigationMapView navigationMap;",
                  1
              )

          build_ui = """
              private void buildUi() {

                  root =
                          new FrameLayout(this);

                  root.setBackgroundColor(
                          Color.TRANSPARENT);

                  setContentView(root);

                  buildDashboard();

                  if (navigationMap == null) {
                      navigationMap = new NavigationMapView(this);
                  }

                  FrameLayout.LayoutParams navParams =
                          new FrameLayout.LayoutParams(
                                  -1,
                                  -1);

                  navParams.gravity =
                          Gravity.CENTER;

                  root.addView(
                          navigationMap,
                          0,
                          navParams);

                  buildAppPanel();

                  rebuildDock();
              }
          """

          dashboard = """
              private void buildDashboard() {

                  dashboard =
                          new FrameLayout(this);

                  dashboard.setBackgroundColor(
                          Color.TRANSPARENT);

                  root.addView(
                          dashboard,
                          new FrameLayout.LayoutParams(
                                  -1,
                                  -1));

                  LinearLayout launcherLayer =
                          new LinearLayout(this);

                  launcherLayer.setOrientation(
                          LinearLayout.HORIZONTAL);

                  launcherLayer.setBackgroundColor(
                          Color.TRANSPARENT);

                  dashboard.addView(
                          launcherLayer,
                          new FrameLayout.LayoutParams(
                                  -1,
                                  -1));

                  LinearLayout sidebar =
                          new LinearLayout(this);

                  sidebar.setOrientation(
                          LinearLayout.VERTICAL);

                  sidebar.setGravity(
                          Gravity.TOP);

                  sidebar.setPadding(
                          dp(4),
                          dp(8),
                          dp(4),
                          dp(8));

                  launcherLayer.addView(
                          sidebar,
                          new LinearLayout.LayoutParams(
                                  dp(88),
                                  -1));

                  TextView appChoose =
                          sidebarButton(
                                  "APP CHỌN");

                  appChoose.setOnClickListener(
                          v -> showApps());

                  sidebar.addView(
                          appChoose,
                          sidebarButtonParams());

                  TextView tasks =
                          sidebarButton(
                                  "TASKS");

                  tasks.setOnClickListener(
                          v -> {});

                  sidebar.addView(
                          tasks,
                          sidebarButtonParams());

                  TextView media =
                          sidebarButton(
                                  "MEDIA");

                  media.setOnClickListener(
                          v -> {});

                  sidebar.addView(
                          media,
                          sidebarButtonParams());

                  TextView wyn =
                          sidebarButton(
                                  "WYN");

                  wyn.setOnClickListener(
                          v -> {});

                  sidebar.addView(
                          wyn,
                          sidebarFixedButtonParams());

                  LinearLayout bottom =
                          new LinearLayout(this);

                  bottom.setOrientation(
                          LinearLayout.HORIZONTAL);

                  FrameLayout.LayoutParams bfp =
                          new FrameLayout.LayoutParams(
                                  -1,
                                  dp(92));

                  bfp.gravity =
                          Gravity.BOTTOM;

                  bfp.setMargins(
                          dp(100),
                          0,
                          dp(12),
                          dp(8));

                  dashboard.addView(
                          bottom,
                          bfp);

                  LinearLayout mediaCard =
                          card();

                  mediaCard.setPadding(
                          dp(14),
                          dp(7),
                          dp(14),
                          dp(7));

                  mediaCard.addView(
                          text(
                                  "MEDIA",
                                  12,
                                  Color.LTGRAY),
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(25)));

                  mediaCard.addView(
                          text(
                                  "▶  Đang phát...",
                                  17,
                                  Color.WHITE),
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(35)));

                  mediaCard.setOnClickListener(
                          v -> {});

                  LinearLayout.LayoutParams mp =
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(78),
                                  1f);

                  mp.setMargins(
                          dp(12),
                          0,
                          0,
                          0);

                  bottom.addView(
                          mediaCard,
                          mp);
              }
          """

          dock = """
              private void rebuildDock() {

                  if (dock == null) {
                      return;
                  }

                  dock.removeAllViews();

                  ArrayList<AppInfo> q =
                          getQuickLaunchApps();

                  int n =
                          Math.min(
                                  4,
                                  q.size());

                  for (
                          int i = 0;
                          i < n;
                          i++) {

                      dock.addView(
                              quickLaunchTile(
                                      q.get(i)),
                              sidebarQuickParams());
                  }
              }

              private ArrayList<AppInfo> getQuickLaunchApps() {

                  ArrayList<AppInfo> out =
                          new ArrayList<>();

                  String[] p = {
                      "com.google.android.apps.maps",
                      "com.google.android.youtube",
                      "com.zing.zalo",
                      "com.spotify.music"
                  };

                  for (String x : p) {

                      for (AppInfo a : apps) {

                          if (
                              x.equals(
                                  a.component
                                      .getPackageName())) {

                              out.add(a);
                              break;
                          }
                      }

                      if (out.size() == 4) {
                          break;
                      }
                  }

                  if (out.size() < 4) {

                      for (AppInfo a : apps) {

                          boolean duplicate =
                                  false;

                          for (AppInfo b : out) {

                              if (
                                  b.component.equals(
                                      a.component)) {

                                  duplicate = true;
                              }
                          }

                          if (!duplicate) {
                              out.add(a);
                          }

                          if (out.size() == 4) {
                              break;
                          }
                      }
                  }

                  return out;
              }

              private LinearLayout quickLaunchTile(
                      AppInfo app) {

                  LinearLayout t =
                          new LinearLayout(this);

                  t.setOrientation(
                          LinearLayout.VERTICAL);

                  t.setGravity(
                          Gravity.CENTER);

                  GradientDrawable g =
                          new GradientDrawable();

                  g.setColor(
                          Color.rgb(
                                  22,
                                  27,
                                  33));

                  g.setCornerRadius(
                          dp(14));

                  t.setBackground(g);

                  ImageView i =
                          new ImageView(this);

                  Drawable d =
                          getRealAppIcon(
                                  app.component
                                      .getPackageName());

                  if (d != null) {
                      i.setImageDrawable(d);
                  }

                  i.setScaleType(
                          ImageView.ScaleType.CENTER_INSIDE);

                  t.addView(
                          i,
                          new LinearLayout.LayoutParams(
                                  dp(42),
                                  dp(42)));

                  TextView n =
                          text(
                                  app.name,
                                  8,
                                  Color.WHITE);

                  n.setGravity(
                          Gravity.CENTER);

                  n.setMaxLines(1);

                  t.addView(
                          n,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(18)));

                  t.setOnClickListener(
                          v ->
                                  launchProjection(
                                          app.component));

                  return t;
              }

              private Drawable getRealAppIcon(
                      String packageName) {

                  try {

                      PackageManager pm =
                              getPackageManager();

                      ApplicationInfo i =
                              pm.getApplicationInfo(
                                      packageName,
                                      0);

                      return i.loadIcon(pm);

                  } catch (Exception e) {

                      return null;
                  }
              }
          """

          app_tile = """
              private LinearLayout appTile(
                      AppInfo app) {

                  LinearLayout t =
                          new LinearLayout(this);

                  t.setOrientation(
                          LinearLayout.VERTICAL);

                  t.setGravity(
                          Gravity.CENTER);

                  GradientDrawable g =
                          new GradientDrawable();

                  g.setColor(
                          Color.rgb(
                                  22,
                                  27,
                                  33));

                  g.setCornerRadius(
                          dp(16));

                  t.setBackground(g);

                  ImageView i =
                          new ImageView(this);

                  Drawable d =
                          getRealAppIcon(
                                  app.component
                                      .getPackageName());

                  if (d != null) {
                      i.setImageDrawable(d);
                  }

                  i.setScaleType(
                          ImageView.ScaleType.CENTER_INSIDE);

                  t.addView(
                          i,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(64)));

                  TextView n =
                          text(
                                  app.name,
                                  12,
                                  Color.WHITE);

                  n.setGravity(
                          Gravity.CENTER);

                  n.setMaxLines(2);

                  t.addView(
                          n,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(38)));

                  t.setOnClickListener(
                          v -> {
                              hideApps();
                              launchProjection(
                                      app.component);
                          });

                  return t;
              }
          """

          replace(
              "    private void buildUi()",
              build_ui
          )

          replace(
              "    private void buildDashboard()",
              dashboard
          )

          replace(
              "    private void rebuildDock()",
              dock
          )

          replace(
              "    private LinearLayout appTile(",
              app_tile
          )

          a, b = method(
              "    private void buildAppPanel()"
          )

          block = s[a:b]

          block = block.replace(
              """appPanel.setBackgroundColor(
                  Color.rgb(
                          7,
                          9,
                          12));""",
              "appPanel.setBackgroundColor("
              "Color.TRANSPARENT);"
          )

          s = s[:a] + block + s[b:]

          def add_after(
                  sig,
                  needle,
                  insert):

              global s

              a, b = method(sig)

              block = s[a:b]

              if insert not in block:

                  block = block.replace(
                      needle,
                      needle
                      + "\n\n        "
                      + insert,
                      1
                  )

                  s = (
                      s[:a]
                      + block
                      + s[b:]
                  )

          add_after(
              "public void onResume()",
              "attachProjection();",
              "if (navigationMap != null) "
              "navigationMap.onHostResume();"
          )

          add_after(
              "public void onPause()",
              "super.onPause();",
              "if (navigationMap != null) "
              "navigationMap.onHostPause();"
          )

          add_after(
              "public void onDestroy()",
              "resumed = false;",
              "if (navigationMap != null) { "
              "navigationMap.onHostDestroy(); "
              "navigationMap = null; }"
          )

          P.write_text(
              s.rstrip() + "\n",
              encoding="utf-8"
          )

          print(
              "PATCH HOME UI V2 OVERLAY PASS"
          )
          PY

          python3 -m py_compile \
            /tmp/carassistant-patch/patch.py

          python3 \
            /tmp/carassistant-patch/patch.py

          echo "PASS: Home UI V2 overlay preserved."

      - name: Verify Navigation V1 + Patch 1 architecture
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"
          FILE="$SRC/V10CarActivity.java"
          NAV="$SRC/NavigationMapView.java"

          check() {
            local label="$1"
            local pattern="$2"
            local file="$3"

            if grep -Fq "$pattern" "$file"; then
              echo "PASS: $label"
            else
              echo "ERROR: $label"
              echo "Missing: $pattern"
              echo "File: $file"
              exit 1
            fi
          }

          check \
            "Navigation V1 field" \
            "private NavigationMapView navigationMap;" \
            "$FILE"

          # FIX ONLY:
          # Normalize all whitespace before checking the Java statement.
          # This avoids false failure caused by formatting/newlines.
          python3 - "$FILE" <<'PY'
          import re
          import sys

          path = sys.argv[1]
          text = open(path, encoding="utf-8").read()

          compact = re.sub(r"\s+", "", text)

          expected = "navigationMap=newNavigationMapView(this);"

          if expected in compact:
              print("PASS: Navigation V1 creation")
          else:
              print("ERROR: Navigation V1 creation")
              print("Missing NavigationMapView creation.")
              print()
              print("Actual navigationMap references:")
              for line_no, line in enumerate(
                  text.splitlines(),
                  1
              ):
                  if "navigationMap" in line:
                      print(
                          f"{line_no}: {line}"
                      )
              sys.exit(1)
          PY

          # FIX ONLY: Transparent root verification.
          # Normalize whitespace because the generated Java uses
          # line breaks between the method call components.
          python3 - "$FILE" <<'PY'
          import re
          import sys

          path = sys.argv[1]
          text = open(path, encoding="utf-8").read()

          compact = re.sub(r"\s+", "", text)

          expected = "root.setBackgroundColor(Color.TRANSPARENT);"

          if expected in compact:
              print("PASS: Transparent root")
          else:
              print("ERROR: Transparent root")
              print("Missing transparent root.")
              sys.exit(1)
          PY

          check \
            "Transparent Home UI overlay" \
            "launcherLayer.setBackgroundColor(Color.TRANSPARENT);" \
            "$FILE"

          check \
            "Transparent dashboard" \
            "dashboard.setBackgroundColor(Color.TRANSPARENT);" \
