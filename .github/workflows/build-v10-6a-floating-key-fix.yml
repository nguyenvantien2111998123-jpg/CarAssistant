name: Build Car Assistant V10-6A Floating Key Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # V10ProjectionSession
      # Add RECENTS targeted at the virtual display.
      # ============================================================
      - name: Patch V10ProjectionSession
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          test -f "$FILE"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
          )

          text = path.read_text(encoding="utf-8")

          if "public void recents()" not in text:

              method = r'''
              public void recents() {

                  if (!isActive()) {
                      return;
                  }

                  final int displayId =
                          display.getDisplayId();

                  final String command =
                          "/system/bin/input -d "
                                  + displayId
                                  + " keyevent 187";

                  RootShellSession.EXEC.execute(
                          () -> {

                              try {

                                  rootShell.run(
                                          5,
                                          command);

                              } catch (Throwable t) {

                                  Log.w(
                                          TAG,
                                          "Recents failed",
                                          t);
                              }
                          });
              }

              '''

              pattern = re.compile(
                  r"(?m)^[ \t]*public\s+void\s+back\s*\(\s*\)\s*\{"
              )

              match = pattern.search(text)

              if not match:
                  raise SystemExit(
                      "ERROR: Cannot find V10ProjectionSession.back()."
                  )

              text = (
                  text[:match.start()]
                  + method
                  + text[match.start():]
              )

              path.write_text(
                  text,
                  encoding="utf-8"
              )

          # ----------------------------------------------------------
          # Verify
          # ----------------------------------------------------------

          text = path.read_text(encoding="utf-8")

          required = [
              "public void recents()",
              "display.getDisplayId()",
              "/system/bin/input -d ",
              "keyevent 187",
              "rootShell.run",
          ]

          for item in required:
              if item not in text:
                  raise SystemExit(
                      "ERROR: Missing: " + item
                  )

          if text.count("public void recents()") != 1:
              raise SystemExit(
                  "ERROR: recents() must exist exactly once."
              )

          print("V10ProjectionSession: PASSED")
          PY

      # ============================================================
      # V10CarActivity
      # Reproduce the known-good V10-6 floating key,
      # but route RECENTS through session.recents().
      # ============================================================
      - name: Patch V10CarActivity
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          test -f "$FILE"

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          text = path.read_text(encoding="utf-8")

          # ----------------------------------------------------------
          # Imports
          # ----------------------------------------------------------

          marker = "import android.content.pm.ResolveInfo;"

          if marker not in text:
              raise SystemExit(
                  "ERROR: ResolveInfo import not found."
              )

          imports = [
              "import android.content.SharedPreferences;",
              "import android.os.SystemClock;",
              "import android.view.MotionEvent;",
              "import android.view.ViewConfiguration;",
              "import android.view.ViewGroup;",
          ]

          for imp in imports:
              if imp not in text:
                  text = text.replace(
                      marker,
                      marker + "\n" + imp,
                      1
                  )

          # ----------------------------------------------------------
          # Fields
          # ----------------------------------------------------------

          if "private TextView floatingTouchKey;" not in text:

              field_marker = (
                  "    private V10ProjectionSession session;"
              )

              if field_marker not in text:
                  raise SystemExit(
                      "ERROR: V10ProjectionSession field not found."
                  )

              fields = """
    private TextView floatingTouchKey;
    private LinearLayout floatingMenu;
    private long floatingLastTap;
    private boolean floatingDragging;
    private float floatingDownRawX;
    private float floatingDownRawY;
    private float floatingStartX;
    private float floatingStartY;
"""

              text = text.replace(
                  field_marker,
                  field_marker + fields,
                  1
              )

          # ----------------------------------------------------------
          # attachProjection()
          # Insert after session.attachTextureView(...)
          # instead of searching for a generic closing brace.
          # ----------------------------------------------------------

          if "createFloatingTouchKey();" not in text:

              attach_marker = (
                  "        session.attachTextureView(\n"
                  "                textureView);"
              )

              if attach_marker not in text:
                  raise SystemExit(
                      "ERROR: session.attachTextureView() marker not found."
                  )

              text = text.replace(
                  attach_marker,
                  attach_marker
                  + "\n\n"
                  + "        createFloatingTouchKey();",
                  1
              )

          # ----------------------------------------------------------
          # Floating implementation
          # ----------------------------------------------------------

          if "private void createFloatingTouchKey()" not in text:

              marker = (
                  "    public void handleControlBack()"
              )

              if marker not in text:
                  raise SystemExit(
                      "ERROR: handleControlBack() not found."
                  )

              methods = r'''
    private void createFloatingTouchKey() {

        if (floatingTouchKey != null) {
            return;
        }

        floatingTouchKey = new TextView(this);

        floatingTouchKey.setText("●");
        floatingTouchKey.setTextColor(Color.WHITE);
        floatingTouchKey.setTextSize(22);
        floatingTouchKey.setGravity(Gravity.CENTER);

        GradientDrawable bg =
                new GradientDrawable();

        bg.setShape(
                GradientDrawable.OVAL);

        bg.setColor(
                Color.rgb(25, 35, 45));

        bg.setStroke(
                dp(2),
                Color.rgb(80, 170, 230));

        floatingTouchKey.setBackground(bg);
        floatingTouchKey.setElevation(dp(12));

        SharedPreferences prefs =
                getSharedPreferences(
                        "v10_floating_key",
                        MODE_PRIVATE);

        FrameLayout.LayoutParams params =
                new FrameLayout.LayoutParams(
                        dp(58),
                        dp(58),
                        Gravity.TOP | Gravity.END);

        int savedX =
                prefs.getInt(
                        "x",
                        dp(18));

        int savedY =
                prefs.getInt(
                        "y",
                        dp(120));

        params.setMargins(
                0,
                savedY,
                savedX,
                0);

        projectionLayer.addView(
                floatingTouchKey,
                params);

        floatingTouchKey.setOnTouchListener(
                (view, event) -> {

                    switch (
                            event.getActionMasked()) {

                        case MotionEvent.ACTION_DOWN:

                            floatingDragging = false;

                            floatingDownRawX =
                                    event.getRawX();

                            floatingDownRawY =
                                    event.getRawY();

                            ViewGroup.LayoutParams lp =
                                    view.getLayoutParams();

                            if (lp instanceof
                                    FrameLayout.LayoutParams) {

                                FrameLayout.LayoutParams fp =
                                        (FrameLayout.LayoutParams) lp;

                                floatingStartX =
                                        fp.rightMargin;

                                floatingStartY =
                                        fp.topMargin;
                            }

                            return true;

                        case MotionEvent.ACTION_MOVE:

                            float dx =
                                    event.getRawX()
                                            - floatingDownRawX;

                            float dy =
                                    event.getRawY()
                                            - floatingDownRawY;

                            if (!floatingDragging
                                    && Math.hypot(
                                            dx,
                                            dy)
                                    > ViewConfiguration
                                            .get(this)
                                            .getScaledTouchSlop()) {

                                floatingDragging = true;
                            }

                            if (floatingDragging) {

                                int width =
                                        projectionLayer
                                                .getWidth();

                                int height =
                                        projectionLayer
                                                .getHeight();

                                int keySize =
                                        dp(58);

                                int right =
                                        Math.round(
                                                floatingStartX
                                                        - dx);

                                int top =
                                        Math.round(
                                                floatingStartY
                                                        + dy);

                                right =
                                        Math.max(
                                                0,
                                                Math.min(
                                                        Math.max(
                                                                0,
                                                                width
                                                                        - keySize),
                                                        right));

                                top =
                                        Math.max(
                                                0,
                                                Math.min(
                                                        Math.max(
                                                                0,
                                                                height
                                                                        - keySize),
                                                        top));

                                FrameLayout.LayoutParams fp =
                                        (FrameLayout.LayoutParams)
                                                view.getLayoutParams();

                                fp.rightMargin =
                                        right;

                                fp.topMargin =
                                        top;

                                view.setLayoutParams(fp);
                            }

                            return true;

                        case MotionEvent.ACTION_UP:

                            if (floatingDragging) {

                                FrameLayout.LayoutParams fp =
                                        (FrameLayout.LayoutParams)
                                                view.getLayoutParams();

                                prefs.edit()
                                        .putInt(
                                                "x",
                                                fp.rightMargin)
                                        .putInt(
                                                "y",
                                                fp.topMargin)
                                        .apply();

                                floatingDragging = false;

                                return true;
                            }

                            long now =
                                    SystemClock.uptimeMillis();

                            long delta =
                                    now - floatingLastTap;

                            floatingLastTap = now;

                            if (delta > 0
                                    && delta < 320) {

                                handleControlHome();
                                hideFloatingMenu();

                            } else {

                                showFloatingMenu();
                            }

                            view.performClick();

                            return true;

                        case MotionEvent.ACTION_CANCEL:

                            floatingDragging = false;

                            return true;

                        default:
                            return true;
                    }
                });

        floatingTouchKey.bringToFront();
    }

    private void showFloatingMenu() {

        if (floatingMenu != null) {
            hideFloatingMenu();
            return;
        }

        floatingMenu =
                new LinearLayout(this);

        floatingMenu.setOrientation(
                LinearLayout.VERTICAL);

        floatingMenu.setPadding(
                dp(8),
                dp(8),
                dp(8),
                dp(8));

        GradientDrawable menuBg =
                new GradientDrawable();

        menuBg.setColor(
                Color.rgb(15, 20, 26));

        menuBg.setCornerRadius(
                dp(16));

        menuBg.setStroke(
                dp(1),
                Color.rgb(65, 85, 105));

        floatingMenu.setBackground(
                menuBg);

        floatingMenu.setElevation(
                dp(14));

        addFloatingMenuButton(
                "BACK",
                () -> {
                    handleControlBack();
                    hideFloatingMenu();
                });

        addFloatingMenuButton(
                "RECENTS",
                () -> {

                    if (session != null) {
                        session.recents();
                    }

                    hideFloatingMenu();
                });

        addFloatingMenuButton(
                "2 SCREEN",
                () -> {
                    switchToTwoScreen();
                    hideFloatingMenu();
                });

        addFloatingMenuButton(
                "3 SCREEN",
                () -> {
                    switchToThreeScreen();
                    hideFloatingMenu();
                });

        FrameLayout.LayoutParams params =
                new FrameLayout.LayoutParams(
                        dp(170),
                        -2,
                        Gravity.TOP | Gravity.END);

        params.setMargins(
                0,
                dp(70),
                dp(18),
                0);

        projectionLayer.addView(
                floatingMenu,
                params);

        floatingMenu.bringToFront();
        floatingTouchKey.bringToFront();
    }

    private void addFloatingMenuButton(
            String label,
            Runnable action) {

        TextView button =
                new TextView(this);

        button.setText(label);
        button.setTextColor(Color.WHITE);
        button.setTextSize(14);
        button.setGravity(
                Gravity.CENTER_VERTICAL);

        GradientDrawable bg =
                new GradientDrawable();

        bg.setColor(
                Color.rgb(28, 38, 48));

        bg.setCornerRadius(
                dp(10));

        button.setBackground(bg);

        button.setPadding(
                dp(16),
                0,
                dp(16),
                0);

        button.setOnClickListener(
                v -> action.run());

        LinearLayout.LayoutParams params =
                new LinearLayout.LayoutParams(
                        -1,
                        dp(48));

        params.setMargins(
                0,
                dp(3),
                0,
                dp(3));

        floatingMenu.addView(
                button,
                params);
    }

    private void hideFloatingMenu() {

        if (floatingMenu == null) {
            return;
        }

        projectionLayer.removeView(
                floatingMenu);

        floatingMenu = null;
    }

    private void switchToTwoScreen() {

        RootView rootView =
                RootView.getCurrent();

        if (rootView != null) {
            rootView.setLayoutModeExternal(0);
        }
    }

    private void switchToThreeScreen() {

        RootView rootView =
                RootView.getCurrent();

        if (rootView != null) {
            rootView.setLayoutModeExternal(2);
        }
    }

'''

              text = text.replace(
                  marker,
                  methods + "\n" + marker,
                  1
              )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print("V10CarActivity: PASSED")
          PY

      # ============================================================
      # ROOTVIEW
      # ============================================================
      - name: Patch RootView
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/RootView.java"

          test -f "$FILE"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "app/src/main/java/com/hieptran/aacast/doudou/RootView.java"
          )

          text = path.read_text(encoding="utf-8")

          if "public void setLayoutModeExternal(" not in text:

              method = r'''
    public void setLayoutModeExternal(int mode) {

        final int targetMode =
                clamp(mode, 0, 5);

        handler.post(() -> {

            if (destroyed) {
                return;
            }

            layoutMode =
                    targetMode;

            loadRatios();

            prefs.edit()
                    .putInt(
                            "layout_mode_v3",
                            layoutMode)
                    .apply();

            applyVisibility();

            container.requestLayout();

            container.resizeAll();
        });
    }

'''

              pattern = re.compile(
                  r"(?m)^[ \t]*public\s+void\s+reloadSettings\s*\(\s*\)\s*\{"
              )

              match = pattern.search(text)

              if not match:
                  raise SystemExit(
                      "ERROR: Cannot find reloadSettings()."
                  )

              text = (
                  text[:match.start()]
                  + method
                  + text[match.start():]
              )

              path.write_text(
                  text,
                  encoding="utf-8"
              )

          print("RootView: PASSED")
          PY

      # ============================================================
      # FINAL STATIC CHECK
      # ============================================================
      - name: Verify complete V10-6A patch
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          V10="app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          PROJ="app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
          ROOT="app/src/main/java/com/hieptran/aacast/doudou/RootView.java"

          test -f "$V10"
          test -f "$PROJ"
          test -f "$ROOT"

          grep -q "createFloatingTouchKey" "$V10"
          grep -q "session.recents()" "$V10"

          grep -q "public void recents()" "$PROJ"
          grep -q "display.getDisplayId()" "$PROJ"
          grep -q '/system/bin/input -d ' "$PROJ"
          grep -q "keyevent 187" "$PROJ"

          grep -q "public void setLayoutModeExternal" "$ROOT"

          if grep -q "openSystemRecents" "$V10"; then
            echo "ERROR: openSystemRecents still exists."
            exit 1
          fi

          if grep -q '/system/bin/input keyevent 187' "$V10"; then
            echo "ERROR: phone-level RECENTS command remains."
            exit 1
          fi

          echo "========================================"
          echo "V10-6A STATIC CHECK: PASSED"
          echo "========================================"

      # ============================================================
      # BUILD
      # ============================================================
      - name: Build V10-6A
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ============================================================
      # APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-6A-Floating-Key-Fix
          path: v10-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
