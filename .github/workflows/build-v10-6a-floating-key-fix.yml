name: Build Car Assistant V10-6A Floating Key Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check source files
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          test -f app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java
          test -f app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java
          test -f app/src/main/java/com/hieptran/aacast/doudou/RootView.java

          echo "Source files OK."

      - name: Patch V10ProjectionSession - display RECENTS
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          cat > /tmp/v10_recents_method.txt <<'EOF'
          public void recents() {
              if (!isActive()) {
                  return;
              }

              final int displayId =
                      display.getDisplayId();

              final String command =
                      "/system/bin/input -d "
                              + displayId
                              + " keyevent 187";

              RootShellSession.EXECUTE(
                      () -> {
                          try {
                              rootShell.run(
                                      5,
                                      command);
                          } catch (Throwable t) {
                              Log.w(
                                      TAG,
                                      "Recents failed",
                                      t);
                          }
                      });
          }

          EOF

          python3 - "$FILE" /tmp/v10_recents_method.txt <<'PY'
          from pathlib import Path
          import re
          import sys

          source = Path(sys.argv[1])
          method_file = Path(sys.argv[2])

          text = source.read_text(encoding="utf-8")
          method = method_file.read_text(encoding="utf-8")

          if "public void recents()" not in text:
              pattern = re.compile(
                  r"(?m)^[ \t]*public\s+void\s+back\s*\(\s*\)\s*\{"
              )

              match = pattern.search(text)

              if not match:
                  raise SystemExit(
                      "ERROR: V10ProjectionSession.back() was not found."
                  )

              text = (
                  text[:match.start()]
                  + method
                  + text[match.start():]
              )

              source.write_text(text, encoding="utf-8")

          print("V10ProjectionSession RECENTS patch OK.")
          PY

      - name: Patch V10CarActivity - imports
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          text = source.read_text(encoding="utf-8")

          marker = "import android.content.pm.ResolveInfo;"

          imports = [
              "import android.content.SharedPreferences;",
              "import android.os.SystemClock;",
              "import android.view.MotionEvent;",
              "import android.view.ViewConfiguration;",
              "import android.view.ViewGroup;",
          ]

          missing = [
              item
              for item in imports
              if item not in text
          ]

          if missing:
              if marker not in text:
                  raise SystemExit(
                      "ERROR: ResolveInfo import marker not found."
                  )

              addition = "\n".join(missing) + "\n"

              text = text.replace(
                  marker,
                  marker + "\n" + addition,
                  1
              )

              source.write_text(
                  text,
                  encoding="utf-8"
              )

          print("V10CarActivity imports OK.")
          PY

      - name: Patch V10CarActivity - fields
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          cat > /tmp/v10_floating_fields.txt <<'EOF'
              private TextView floatingTouchKey;
              private LinearLayout floatingMenu;

              private boolean floatingDragging;
              private float floatingDownRawX;
              private float floatingDownRawY;
              private int floatingStartX;
              private int floatingStartY;
              private long floatingLastTap;

          EOF

          python3 - "$FILE" /tmp/v10_floating_fields.txt <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          field_file = Path(sys.argv[2])

          text = source.read_text(encoding="utf-8")
          fields = field_file.read_text(encoding="utf-8")

          marker = "    private V10ProjectionSession session;"

          if "private TextView floatingTouchKey;" not in text:
              if marker not in text:
                  raise SystemExit(
                      "ERROR: V10ProjectionSession field marker not found."
                  )

              text = text.replace(
                  marker,
                  marker + "\n" + fields.rstrip(),
                  1
              )

              source.write_text(
                  text,
                  encoding="utf-8"
              )

          print("V10CarActivity fields OK.")
          PY

      - name: Patch V10CarActivity - create floating key call
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          text = source.read_text(encoding="utf-8")

          if "createFloatingTouchKey();" in text:
              print("Floating key call already exists.")
              raise SystemExit(0)

          marker = """NO_TRIPLE_QUOTE_MARKER"""

          # The actual marker is built without embedding Java in a Python
          # multiline string so the workflow remains YAML-safe.
          marker = (
              "        session.attachTextureView("
              "\n"
              "                textureView);"
          )

          if marker not in text:
              raise SystemExit(
                  "ERROR: session.attachTextureView(textureView) marker not found."
              )

          replacement = (
              marker
              + "\n"
              + "\n"
              + "        createFloatingTouchKey();"
          )

          text = text.replace(
              marker,
              replacement,
              1
          )

          source.write_text(
              text,
              encoding="utf-8"
          )

          print("Floating key call inserted.")
          PY

      - name: Patch V10CarActivity - floating key implementation
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          cat > /tmp/v10_floating_methods.txt <<'EOF'
              private void createFloatingTouchKey() {
                  if (floatingTouchKey != null) {
                      return;
                  }

                  floatingTouchKey = new TextView(this);
                  floatingTouchKey.setText("●");
                  floatingTouchKey.setTextColor(Color.WHITE);
                  floatingTouchKey.setTextSize(22);
                  floatingTouchKey.setGravity(Gravity.CENTER);

                  GradientDrawable bg =
                          new GradientDrawable();

                  bg.setShape(
                          GradientDrawable.OVAL);

                  bg.setColor(
                          Color.rgb(25, 35, 45));

                  bg.setStroke(
                          dp(2),
                          Color.rgb(80, 170, 230));

                  floatingTouchKey.setBackground(bg);
                  floatingTouchKey.setElevation(dp(12));

                  SharedPreferences prefs =
                          getSharedPreferences(
                                  "v10_floating_key",
                                  MODE_PRIVATE);

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  dp(58),
                                  dp(58),
                                  Gravity.TOP | Gravity.END);

                  int savedX =
                          prefs.getInt(
                                  "x",
                                  dp(18));

                  int savedY =
                          prefs.getInt(
                                  "y",
                                  dp(120));

                  params.setMargins(
                          0,
                          savedY,
                          savedX,
                          0);

                  projectionLayer.addView(
                          floatingTouchKey,
                          params);

                  floatingTouchKey.setOnTouchListener(
                          (view, event) -> {
                              switch (
                                      event.getActionMasked()) {

                                  case MotionEvent.ACTION_DOWN:
                                      floatingDragging = false;

                                      floatingDownRawX =
                                              event.getRawX();

                                      floatingDownRawY =
                                              event.getRawY();

                                      ViewGroup.LayoutParams lp =
                                              view.getLayoutParams();

                                      if (lp
                                              instanceof FrameLayout.LayoutParams) {
                                          FrameLayout.LayoutParams fp =
                                                  (FrameLayout.LayoutParams) lp;

                                          floatingStartX =
                                                  fp.rightMargin;

                                          floatingStartY =
                                                  fp.topMargin;
                                      }

                                      return true;

                                  case MotionEvent.ACTION_MOVE:
                                      float dx =
                                              event.getRawX()
                                                      - floatingDownRawX;

                                      float dy =
                                              event.getRawY()
                                                      - floatingDownRawY;

                                      if (!floatingDragging
                                              && Math.hypot(dx, dy)
                                              > ViewConfiguration
                                                      .get(this)
                                                      .getScaledTouchSlop()) {
                                          floatingDragging = true;
                                      }

                                      if (floatingDragging) {
                                          int width =
                                                  projectionLayer.getWidth();

                                          int height =
                                                  projectionLayer.getHeight();

                                          int keySize =
                                                  dp(58);

                                          int right =
                                                  Math.round(
                                                          floatingStartX
                                                                  - dx);

                                          int top =
                                                  Math.round(
                                                          floatingStartY
                                                                  + dy);

                                          right =
                                                  Math.max(
                                                          0,
                                                          Math.min(
                                                                  Math.max(
                                                                          0,
                                                                          width
                                                                                  - keySize),
                                                                  right));

                                          top =
                                                  Math.max(
                                                          0,
                                                          Math.min(
                                                                  Math.max(
                                                                          0,
                                                                          height
                                                                                  - keySize),
                                                                  top));

                                          FrameLayout.LayoutParams fp =
                                                  (FrameLayout.LayoutParams)
                                                          view.getLayoutParams();

                                          fp.rightMargin =
                                                  right;

                                          fp.topMargin =
                                                  top;

                                          view.setLayoutParams(fp);
                                      }

                                      return true;

                                  case MotionEvent.ACTION_UP:
                                      if (floatingDragging) {
                                          FrameLayout.LayoutParams fp =
                                                  (FrameLayout.LayoutParams)
                                                          view.getLayoutParams();

                                          prefs.edit()
                                                  .putInt(
                                                          "x",
                                                          fp.rightMargin)
                                                  .putInt(
                                                          "y",
                                                          fp.topMargin)
                                                  .apply();

                                          floatingDragging = false;

                                          return true;
                                      }

                                      long now =
                                              SystemClock.uptimeMillis();

                                      long delta =
                                              now
                                                      - floatingLastTap;

                                      floatingLastTap = now;

                                      if (delta > 0
                                              && delta < 320) {
                                          handleControlHome();
                                          hideFloatingMenu();
                                      } else {
                                          showFloatingMenu();
                                      }

                                      view.performClick();

                                      return true;

                                  case MotionEvent.ACTION_CANCEL:
                                      floatingDragging = false;
                                      return true;

                                  default:
                                      return true;
                              }
                          });

                  floatingTouchKey.bringToFront();
              }

              private void showFloatingMenu() {
                  if (floatingMenu != null) {
                      hideFloatingMenu();
                      return;
                  }

                  floatingMenu =
                          new LinearLayout(this);

                  floatingMenu.setOrientation(
                          LinearLayout.VERTICAL);

                  floatingMenu.setPadding(
                          dp(8),
                          dp(8),
                          dp(8),
                          dp(8));

                  GradientDrawable menuBg =
                          new GradientDrawable();

                  menuBg.setColor(
                          Color.rgb(15, 20, 26));

                  menuBg.setCornerRadius(
                          dp(16));

                  menuBg.setStroke(
                          dp(1),
                          Color.rgb(65, 85, 105));

                  floatingMenu.setBackground(
                          menuBg);

                  floatingMenu.setElevation(
                          dp(14));

                  addFloatingMenuButton(
                          "BACK",
                          () -> {
                              handleControlBack();
                              hideFloatingMenu();
                          });

                  addFloatingMenuButton(
                          "RECENTS",
                          () -> {
                              if (session != null) {
                                  session.recents();
                              }

                              hideFloatingMenu();
                          });

                  addFloatingMenuButton(
                          "2 SCREEN",
                          () -> {
                              switchToTwoScreen();
                              hideFloatingMenu();
                          });

                  addFloatingMenuButton(
                          "3 SCREEN",
                          () -> {
                              switchToThreeScreen();
                              hideFloatingMenu();
                          });

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  dp(170),
                                  -2,
                                  Gravity.TOP | Gravity.END);

                  params.setMargins(
                          0,
                          dp(70),
                          dp(18),
                          0);

                  projectionLayer.addView(
                          floatingMenu,
                          params);

                  floatingMenu.bringToFront();

                  floatingTouchKey.bringToFront();
              }

              private void addFloatingMenuButton(
                      String label,
                      Runnable action) {

                  TextView button =
                          new TextView(this);

                  button.setText(label);
                  button.setTextColor(Color.WHITE);
                  button.setTextSize(14);
                  button.setGravity(
                          Gravity.CENTER_VERTICAL);

                  GradientDrawable bg =
                          new GradientDrawable();

                  bg.setColor(
                          Color.rgb(28, 38, 48));

                  bg.setCornerRadius(
                          dp(10));

                  button.setBackground(bg);

                  button.setPadding(
                          dp(16),
                          0,
                          dp(16),
                          0);

                  button.setOnClickListener(
                          v -> action.run());

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(48));

                  params.setMargins(
                          0,
                          dp(3),
                          0,
                          dp(3));

                  floatingMenu.addView(
                          button,
                          params);
              }

              private void hideFloatingMenu() {
                  if (floatingMenu == null) {
                      return;
                  }

                  projectionLayer.removeView(
                          floatingMenu);

                  floatingMenu = null;
              }

              private void switchToTwoScreen() {
                  RootView rootView =
                          RootView.getCurrent();

                  if (rootView != null) {
                      rootView.setLayoutModeExternal(0);
                  }
              }

              private void switchToThreeScreen() {
                  RootView rootView =
                          RootView.getCurrent();

                  if (rootView != null) {
                      rootView.setLayoutModeExternal(2);
                  }
              }

          EOF

          python3 - "$FILE" /tmp/v10_floating_methods.txt <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          method_file = Path(sys.argv[2])

          text = source.read_text(encoding="utf-8")
          methods = method_file.read_text(encoding="utf-8")

          if "private void createFloatingTouchKey()" in text:
              print("Floating methods already exist.")
              raise SystemExit(0)

          marker = "    public void handleControlBack()"

          if marker not in text:
              raise SystemExit(
                  "ERROR: handleControlBack() marker not found."
              )

          text = text.replace(
              marker,
              methods.rstrip()
              + "\n\n"
              + marker,
              1
          )

          source.write_text(
              text,
              encoding="utf-8"
          )

          print("Floating key implementation inserted.")
          PY

      - name: Patch RootView - external layout mode
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/RootView.java"

          cat > /tmp/v10_layout_method.txt <<'EOF'
              public void setLayoutModeExternal(int mode) {
                  final int targetMode =
                          clamp(mode, 0, 5);

                  handler.post(
                          () -> {
                              if (destroyed) {
                                  return;
                              }

                              layoutMode =
                                      targetMode;

                              loadRatios();

                              prefs.edit()
                                      .putInt(
                                              "layout_mode_v3",
                                              layoutMode)
                                      .apply();

                              applyVisibility();

                              container.requestLayout();
                              container.resizeAll();
                          });
              }

          EOF

          python3 - "$FILE" /tmp/v10_layout_method.txt <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          method_file = Path(sys.argv[2])

          text = source.read_text(encoding="utf-8")
          method = method_file.read_text(encoding="utf-8")

          if "setLayoutModeExternal(int mode)" in text:
              print("RootView external layout method already exists.")
              raise SystemExit(0)

          marker = "    public void reloadSettings()"

          if marker not in text:
              raise SystemExit(
                  "ERROR: RootView.reloadSettings() marker not found."
              )

          text = text.replace(
              marker,
              method.rstrip()
              + "\n\n"
              + marker,
              1
          )

          source.write_text(
              text,
              encoding="utf-8"
          )

          print("RootView patch OK.")
          PY

      - name: Verify V10-6A source patch
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          SESSION="app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
          ACTIVITY="app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          ROOT="app/src/main/java/com/hieptran/aacast/doudou/RootView.java"

          echo "Checking V10ProjectionSession..."

          grep -q "public void recents()" "$SESSION"
          grep -q "display.getDisplayId()" "$SESSION"
          grep -q "/system/bin/input -d " "$SESSION"
          grep -q "keyevent 187" "$SESSION"

          echo "Checking V10CarActivity..."

          grep -q "createFloatingTouchKey" "$ACTIVITY"
          grep -q 'session.recents()' "$ACTIVITY"
          grep -q '"RECENTS"' "$ACTIVITY"
          grep -q '"2 SCREEN"' "$ACTIVITY"
          grep -q '"3 SCREEN"' "$ACTIVITY"

          if grep -q "openSystemRecents" "$ACTIVITY"; then
            echo "ERROR: Old phone-level openSystemRecents() still exists."
            exit 1
          fi

          echo "Checking RootView..."

          grep -q "setLayoutModeExternal(int mode)" "$ROOT"

          echo "V10-6A static verification PASSED."

      - name: Compile Java
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            compileDebugJavaWithJavac

      - name: Build V10-6A APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Locate APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print -quit)"

      - name: Upload V10-6A APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-6A-Floating-Key-Fix
          path: |
            v10-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
