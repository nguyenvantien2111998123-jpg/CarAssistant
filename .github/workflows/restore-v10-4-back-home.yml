name: Restore V10-4 Back Home

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Patch V10CarActivity
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          test -f "$FILE"

          grep -q 'private TextureView textureView;' "$FILE"

          if ! grep -q 'private LinearLayout projectionControls;' "$FILE"; then
            sed -i '/private TextureView textureView;/a\    private LinearLayout projectionControls;' "$FILE"
          fi

          if ! grep -q 'Restored from V10-3:' "$FILE"; then
            perl -0pi -e 's|        textureView\n                \.setOnTouchListener\(\n                        inputController\n                                \.createListener\(\)\);|        textureView\n                .setOnTouchListener(\n                        inputController\n                                .createListener());\n\n        /*\n         * Restored from V10-3:\n         * projection navigation controls.\n         */\n        projectionControls = new LinearLayout(this);\n        projectionControls.setOrientation(LinearLayout.HORIZONTAL);\n        projectionControls.setGravity(Gravity.CENTER);\n\n        TextView backButton = buttonText("BACK");\n        backButton.setOnClickListener(v -> handleControlBack());\n\n        TextView homeButton = buttonText("HOME");\n        homeButton.setOnClickListener(v -> handleControlHome());\n\n        projectionControls.addView(\n                backButton,\n                new LinearLayout.LayoutParams(dp(90), dp(52)));\n\n        LinearLayout.LayoutParams homeParams =\n                new LinearLayout.LayoutParams(dp(90), dp(52));\n        homeParams.setMargins(dp(8), 0, 0, 0);\n        projectionControls.addView(homeButton, homeParams);\n\n        FrameLayout.LayoutParams controlsParams =\n                new FrameLayout.LayoutParams(\n                        -2, dp(60), Gravity.TOP | Gravity.END);\n        controlsParams.setMargins(0, dp(12), dp(12), 0);\n\n        projectionLayer.addView(\n                projectionControls,\n                controlsParams);|s' "$FILE"
          fi

          grep -q 'private LinearLayout projectionControls;' "$FILE"
          grep -q 'Restored from V10-3:' "$FILE"
          grep -q 'buttonText("BACK")' "$FILE"
          grep -q 'buttonText("HOME")' "$FILE"

          echo "V10 BACK/HOME controls restored."

      - name: Build V10
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-4-Restored-Back-Home
          path: v10-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-4-Restored-Source
          path: v10-source/
          if-no-files-found: error
