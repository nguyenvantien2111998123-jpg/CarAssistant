name: Restore V10-4 Back Home

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore V10-3 Back Home controls
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          s = path.read_text()

          if "private LinearLayout projectionControls;" not in s:
              s = s.replace(
                  "    private TextureView textureView;\n",
                  "    private TextureView textureView;\n"
                  "    private LinearLayout projectionControls;\n",
                  1
              )

          old = """        V10InputController
                inputController =
                        new V10InputController(
                                session);

        textureView
                .setOnTouchListener(
                        inputController
                                .createListener());
"""

          new = """        V10InputController
                inputController =
                        new V10InputController(
                                session);

        textureView
                .setOnTouchListener(
                        inputController
                                .createListener());

        /*
         * Restored from V10-3:
         * projection navigation controls.
         */
        projectionControls =
                new LinearLayout(this);

        projectionControls.setOrientation(
                LinearLayout.HORIZONTAL);

        projectionControls.setGravity(
                Gravity.CENTER);

        TextView backButton =
                buttonText("BACK");

        backButton.setOnClickListener(
                v -> handleControlBack());

        TextView homeButton =
                buttonText("HOME");

        homeButton.setOnClickListener(
                v -> handleControlHome());

        projectionControls.addView(
                backButton,
                new LinearLayout.LayoutParams(
                        dp(90),
                        dp(52)));

        LinearLayout.LayoutParams homeParams =
                new LinearLayout.LayoutParams(
                        dp(90),
                        dp(52));

        homeParams.setMargins(
                dp(8),
                0,
                0,
                0);

        projectionControls.addView(
                homeButton,
                homeParams);

        FrameLayout.LayoutParams controlsParams =
                new FrameLayout.LayoutParams(
                        -2,
                        dp(60),
                        Gravity.TOP | Gravity.END);

        controlsParams.setMargins(
                0,
                dp(12),
                dp(12),
                0);

        projectionLayer.addView(
                projectionControls,
                controlsParams);
"""

          if old not in s:
              if "Restored from V10-3:" in s:
                  print("Already restored.")
                  raise SystemExit(0)
              raise SystemExit(
                  "Expected attachProjection block was not found"
              )

          s = s.replace(old, new, 1)
          path.write_text(s)
          print("V10-3 BACK/HOME controls restored.")
          PY

      - name: Verify restoration
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -q 'Restored from V10-3:' "$FILE"
          grep -q 'backButton.setOnClickListener' "$FILE"
          grep -q 'homeButton.setOnClickListener' "$FILE"

          echo "V10-3 navigation overlay restored successfully."

      - name: Build V10
        working-directory: v10-source
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-4-Restored-Back-Home
          path: v10-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-4-Restored-Source
          path: v10-source/
          if-no-files-found: error
