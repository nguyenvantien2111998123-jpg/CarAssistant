name: Restore V10-4 Back Home

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Patch V10CarActivity
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          test -f "$FILE"

          grep -q 'private TextureView textureView;' "$FILE"

          if ! grep -q 'private LinearLayout projectionControls;' "$FILE"; then
            sed -i '/private TextureView textureView;/a\    private LinearLayout projectionControls;' "$FILE"
          fi

          if ! grep -q 'Restored from V10-3:' "$FILE"; then
            cat > /tmp/v10.patch <<'PATCH'
diff --git a/v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java b/v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java
--- a/v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java
+++ b/v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java
@@ -XXX,XXX +XXX,XXX @@
         textureView
                 .setOnTouchListener(
                         inputController
                                 .createListener());

+        /*
+         * Restored from V10-3:
+         * projection navigation controls.
+         */
+        projectionControls = new LinearLayout(this);
+        projectionControls.setOrientation(LinearLayout.HORIZONTAL);
+        projectionControls.setGravity(Gravity.CENTER);
+
+        TextView backButton = buttonText("BACK");
+        backButton.setOnClickListener(v -> handleControlBack());
+
+        TextView homeButton = buttonText("HOME");
+        homeButton.setOnClickListener(v -> handleControlHome());
+
+        projectionControls.addView(
+                backButton,
+                new LinearLayout.LayoutParams(dp(90), dp(52)));
+
+        LinearLayout.LayoutParams homeParams =
+                new LinearLayout.LayoutParams(dp(90), dp(52));
+        homeParams.setMargins(dp(8), 0, 0, 0);
+        projectionControls.addView(homeButton, homeParams);
+
+        FrameLayout.LayoutParams controlsParams =
+                new FrameLayout.LayoutParams(
+                        -2, dp(60), Gravity.TOP | Gravity.END);
+        controlsParams.setMargins(0, dp(12), dp(12), 0);
+
+        projectionLayer.addView(
+                projectionControls,
+                controlsParams);
+
PATCH

            # Do not use the placeholder patch.
            # Insert the block immediately after the listener instead.
            python3 -c '
from pathlib import Path

p = Path("v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java")
s = p.read_text()

needle = """        textureView
                .setOnTouchListener(
                        inputController
                                .createListener());"""

block = """        textureView
                .setOnTouchListener(
                        inputController
                                .createListener());

        /*
         * Restored from V10-3:
         * projection navigation controls.
         */
        projectionControls = new LinearLayout(this);
        projectionControls.setOrientation(LinearLayout.HORIZONTAL);
        projectionControls.setGravity(Gravity.CENTER);

        TextView backButton = buttonText("BACK");
        backButton.setOnClickListener(v -> handleControlBack());

        TextView homeButton = buttonText("HOME");
        homeButton.setOnClickListener(v -> handleControlHome());

        projectionControls.addView(
                backButton,
                new LinearLayout.LayoutParams(dp(90), dp(52)));

        LinearLayout.LayoutParams homeParams =
                new LinearLayout.LayoutParams(dp(90), dp(52));
        homeParams.setMargins(dp(8), 0, 0, 0);
        projectionControls.addView(homeButton, homeParams);

        FrameLayout.LayoutParams controlsParams =
                new FrameLayout.LayoutParams(
                        -2, dp(60), Gravity.TOP | Gravity.END);
        controlsParams.setMargins(0, dp(12), dp(12), 0);

        projectionLayer.addView(
                projectionControls,
                controlsParams);"""

if needle not in s:
    raise SystemExit("V10 attachProjection listener block not found")

s = s.replace(needle, block, 1)
p.write_text(s)
'

          fi

          grep -q 'private LinearLayout projectionControls;' "$FILE"
          grep -q 'Restored from V10-3:' "$FILE"
          grep -q 'buttonText("BACK")' "$FILE"
          grep -q 'buttonText("HOME")' "$FILE"

          echo "V10 BACK/HOME controls restored."

      - name: Build V10
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-4-Restored-Back-Home
          path: v10-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-4-Restored-Source
          path: v10-source/
          if-no-files-found: error
