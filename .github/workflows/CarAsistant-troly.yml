
name: CarAsistant tich hop tro ly

run-name: CarAsistant tich hop tro ly

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify immutable V10 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          expected = {
              "v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java":
                  "61e82df0fd17e7851c7bf1628ac03a9391e48523",
              "v10-source/app/src/main/AndroidManifest.xml":
                  "e6ffd5005ff0d0f8610c5950f20e17acba5410df",
              "v10-source/app/build.gradle":
                  "4d512337d46324a33a685d8cdb095e4ecacd3ceb",
          }

          for name, wanted in expected.items():
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(f"FAIL: missing source {name}")

              data = path.read_bytes()
              actual = hashlib.sha1(
                  b"blob " + str(len(data)).encode() + b"\0" + data
              ).hexdigest()

              if actual != wanted:
                  raise SystemExit(
                      f"FAIL-CLOSED: SHA mismatch: {name}; "
                      f"expected={wanted}; actual={actual}. "
                      "No patch applied."
                  )

              print(f"PASS SHA: {name}")

          print("PASS: immutable source verified")
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply integrated voice assistant patch
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java"
          )
          java = path.read_text(encoding="utf-8")
          original = java

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f"FAIL-CLOSED: {label}: expected 1 anchor, found {count}"
                  )
              return source.replace(old, new, 1)

          # Imports
          java = replace_once(
              java,
              "import android.os.Bundle;\n",
              "import android.os.Bundle;\n"
              "import android.Manifest;\n"
              "import android.content.pm.PackageManager;\n"
              "import android.net.Uri;\n"
              "import android.speech.RecognizerIntent;\n"
              "import android.speech.RecognitionListener;\n"
              "import android.speech.SpeechRecognizer;\n"
              "import android.widget.Toast;\n",
              "imports"
          )

          # Independent state: do not reuse the existing floating touch key.
          java = replace_once(
              java,
              "    private TextView floatingTouchKey;\n",
              "    private TextView floatingTouchKey;\n"
              "    private TextView floatingMicButton;\n"
              "    private SpeechRecognizer voiceRecognizer;\n"
              "    private boolean micDragging;\n"
              "    private float micDownRawX;\n"
              "    private float micDownRawY;\n"
              "    private int micStartX;\n"
              "    private int micStartY;\n",
              "voice fields"
          )

          # Wire the existing Home microphone to the integrated recognizer.
          java = replace_once(
              java,
              '        voice.setOnClickListener(v->{});',
              '        voice.setContentDescription("Trợ lý giọng nói");\n'
              '        voice.setOnClickListener(v -> startVoiceAssistant());',
              "Home mic listener"
          )

          # Create the second, independent floating mic above the projection.
          java = replace_once(
              java,
              "        createFloatingTouchKey();\n",
              "        createFloatingTouchKey();\n"
              "        createFloatingMicButton();\n",
              "projection mic attachment"
          )

          method_anchor = "private void showFloatingMenu() {"
          if java.count(method_anchor) != 1:
              raise SystemExit("FAIL-CLOSED: floating menu method anchor mismatch")

          methods = r'''
          private void createFloatingMicButton() {
              if (floatingMicButton != null || projectionLayer == null) return;

              floatingMicButton = new TextView(this);
              floatingMicButton.setText("🎙");
              floatingMicButton.setTextSize(25);
              floatingMicButton.setGravity(Gravity.CENTER);
              floatingMicButton.setTextColor(Color.WHITE);
              floatingMicButton.setContentDescription("Bấm để nói với trợ lý");

              GradientDrawable bg = new GradientDrawable();
              bg.setShape(GradientDrawable.OVAL);
              bg.setColor(Color.rgb(20, 105, 220));
              bg.setStroke(dp(2), Color.rgb(115, 190, 255));
              floatingMicButton.setBackground(bg);
              floatingMicButton.setElevation(dp(18));

              SharedPreferences prefs =
                      getSharedPreferences("v10_floating_mic", MODE_PRIVATE);

              FrameLayout.LayoutParams params =
                      new FrameLayout.LayoutParams(
                              dp(60), dp(60), Gravity.TOP | Gravity.START);

              int savedX = prefs.getInt("x", dp(18));
              int savedY = prefs.getInt("y", dp(120));
              params.setMargins(savedX, savedY, 0, 0);

              projectionLayer.addView(floatingMicButton, params);
              floatingMicButton.setOnClickListener(
                      v -> startVoiceAssistant());

              floatingMicButton.setOnTouchListener((view, event) -> {
                  switch (event.getActionMasked()) {
                      case MotionEvent.ACTION_DOWN:
                          micDragging = false;
                          micDownRawX = event.getRawX();
                          micDownRawY = event.getRawY();

                          ViewGroup.LayoutParams lp = view.getLayoutParams();
                          if (lp instanceof FrameLayout.LayoutParams) {
                              FrameLayout.LayoutParams fp =
                                      (FrameLayout.LayoutParams) lp;
                              micStartX = fp.leftMargin;
                              micStartY = fp.topMargin;
                          }
                          return true;

                      case MotionEvent.ACTION_MOVE:
                          float dx = event.getRawX() - micDownRawX;
                          float dy = event.getRawY() - micDownRawY;

                          if (!micDragging
                                  && Math.hypot(dx, dy)
                                  > ViewConfiguration.get(V10CarActivity.this)
                                          .getScaledTouchSlop()) {
                              micDragging = true;
                          }

                          if (micDragging) {
                              int width = projectionLayer.getWidth();
                              int height = projectionLayer.getHeight();
                              int size = dp(60);
                              int left = Math.round(micStartX + dx);
                              int top = Math.round(micStartY + dy);

                              left = Math.max(0,
                                      Math.min(Math.max(0, width - size), left));
                              top = Math.max(0,
                                      Math.min(Math.max(0, height - size), top));

                              FrameLayout.LayoutParams fp =
                                      (FrameLayout.LayoutParams) view.getLayoutParams();
                              fp.leftMargin = left;
                              fp.topMargin = top;
                              view.setLayoutParams(fp);
                          }
                          return true;

                      case MotionEvent.ACTION_UP:
                          if (micDragging) {
                              FrameLayout.LayoutParams fp =
                                      (FrameLayout.LayoutParams) view.getLayoutParams();
                              prefs.edit()
                                      .putInt("x", fp.leftMargin)
                                      .putInt("y", fp.topMargin)
                                      .apply();
                              micDragging = false;
                          } else {
                              view.performClick();
                          }
                          return true;

                      case MotionEvent.ACTION_CANCEL:
                          micDragging = false;
                          return true;

                      default:
                          return true;
                  }
              });

              floatingMicButton.bringToFront();
              if (floatingTouchKey != null) floatingTouchKey.bringToFront();
              floatingMicButton.bringToFront();
          }

          private void startVoiceAssistant() {
              if (checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                      != PackageManager.PERMISSION_GRANTED) {
                  Toast.makeText(this,
                          "Hãy cấp quyền Micro cho CarAssistant trong Cài đặt điện thoại.",
                          Toast.LENGTH_LONG).show();
                  return;
              }

              if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                  Toast.makeText(this,
                          "Thiết bị chưa có dịch vụ nhận diện giọng nói.",
                          Toast.LENGTH_LONG).show();
                  return;
              }

              try {
                  if (voiceRecognizer != null) {
                      voiceRecognizer.destroy();
                      voiceRecognizer = null;
                  }

                  voiceRecognizer = SpeechRecognizer.createSpeechRecognizer(this);
                  voiceRecognizer.setRecognitionListener(new RecognitionListener() {
                      @Override
                      public void onReadyForSpeech(Bundle params) {
                          Toast.makeText(V10CarActivity.this,
                                  "Đang nghe...", Toast.LENGTH_SHORT).show();
                      }

                      @Override
                      public void onBeginningOfSpeech() {}

                      @Override
                      public void onRmsChanged(float rmsdB) {}

                      @Override
                      public void onBufferReceived(byte[] buffer) {}

                      @Override
                      public void onEndOfSpeech() {
                          Toast.makeText(V10CarActivity.this,
                                  "Đang xử lý giọng nói...", Toast.LENGTH_SHORT).show();
                      }

                      @Override
                      public void onError(int error) {
                          String message = error
                                  == SpeechRecognizer.ERROR_NO_MATCH
                                  || error == SpeechRecognizer.ERROR_SPEECH_TIMEOUT
                                  ? "Chưa nghe rõ. Hãy bấm mic và nói lại."
                                  : "Không nhận diện được giọng nói. Kiểm tra dịch vụ nhận diện và kết nối mạng.";
                          Toast.makeText(V10CarActivity.this,
                                  message, Toast.LENGTH_LONG).show();
                      }

                      @Override
                      public void onResults(Bundle results) {
                          ArrayList<String> matches = results == null
                                  ? null
                                  : results.getStringArrayList(
                                          SpeechRecognizer.RESULTS_RECOGNITION);
                          if (matches == null || matches.isEmpty()) {
                              Toast.makeText(V10CarActivity.this,
                                      "Không nhận được nội dung.", Toast.LENGTH_SHORT).show();
                              return;
                          }
                          handleVoiceResult(matches.get(0));
                      }

                      @Override
                      public void onPartialResults(Bundle partialResults) {}

                      @Override
                      public void onEvent(int eventType, Bundle params) {}
                  });

                  Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                          RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "vi-VN");
                  intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, "vi-VN");
                  intent.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, false);
                  intent.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3);
                  voiceRecognizer.startListening(intent);
              } catch (RuntimeException error) {
                  Toast.makeText(this,
                          "Không khởi động được micro: " + error.getMessage(),
                          Toast.LENGTH_LONG).show();
              }
          }

          private void handleVoiceResult(String spoken) {
              if (spoken == null) return;

              String command = spoken.trim();
              String lower = command.toLowerCase(Locale.ROOT);

              if (lower.equals("quay lại") || lower.equals("back")
                      || lower.equals("trở lại")) {
                  handleControlBack();
                  Toast.makeText(this, "Đã thực hiện: quay lại",
                          Toast.LENGTH_SHORT).show();
                  return;
              }

              if (lower.contains("về home") || lower.contains("về trang chủ")
                      || lower.equals("home") || lower.equals("về nhà")) {
                  handleControlHome();
                  Toast.makeText(this, "Đã về Home",
                          Toast.LENGTH_SHORT).show();
                  return;
              }

              if (lower.contains("mở danh sách ứng dụng")
                      || lower.equals("mở ứng dụng")
                      || lower.equals("apps")) {
                  handleControlApps();
                  return;
              }

              if (lower.contains("mở youtube") || lower.equals("youtube")) {
                  if (session != null && session.isActive()) {
                      session.openUrlOnDisplay("https://www.youtube.com/");
                      Toast.makeText(this, "Đang mở YouTube",
                              Toast.LENGTH_SHORT).show();
                  } else {
                      Toast.makeText(this, "Hãy chọn ứng dụng chiếu trước.",
                              Toast.LENGTH_LONG).show();
                  }
                  return;
              }

              if (lower.contains("youtube") || lower.startsWith("tìm ")
                      || lower.startsWith("tìm kiếm ")
                      || lower.startsWith("kiếm ")) {
                  String query = command
                          .replaceFirst("(?i)^(hãy\\s+)?(tìm kiếm|tìm|kiếm|search)\\s*", "")
                          .replaceFirst("(?i)\\s+(trên youtube|youtube)$", "")
                          .trim();

                  if (query.isEmpty()) query = command;

                  if (session != null && session.isActive()) {
                      String url = "https://www.youtube.com/results?search_query="
                              + Uri.encode(query);
                      session.openUrlOnDisplay(url);
                      Toast.makeText(this, "Đang tìm: " + query,
                              Toast.LENGTH_LONG).show();
                  } else {
                      Toast.makeText(this,
                              "Hãy mở ứng dụng chiếu trước khi tìm kiếm.",
                              Toast.LENGTH_LONG).show();
                  }
                  return;
              }

              Toast.makeText(this, "Đã nghe: " + command
                              + ". Lệnh này chưa được tích hợp.",
                      Toast.LENGTH_LONG).show();
          }

          '''

          java = java.replace(
              method_anchor,
              methods + method_anchor,
              1
          )

          # Release speech resources without touching projection teardown.
          destroy_anchor = "        if (navigationMap != null) { navigationMap.onHostDestroy(); navigationMap = null; }"
          java = replace_once(
              java,
              destroy_anchor,
              "        if (voiceRecognizer != null) {\n"
              "            voiceRecognizer.destroy();\n"
              "            voiceRecognizer = null;\n"
              "        }\n"
              + destroy_anchor,
              "voice cleanup"
          )

          if java == original:
              raise SystemExit("FAIL: no source changes were made")

          if java.count("private void createFloatingMicButton()") != 1:
              raise SystemExit("FAIL: mic method count mismatch")
          if java.count("private void startVoiceAssistant()") != 1:
              raise SystemExit("FAIL: assistant method count mismatch")
          if "voice.setOnClickListener(v -> startVoiceAssistant())" not in java:
              raise SystemExit("FAIL: Home mic is not connected")
          if "createFloatingMicButton();" not in java:
              raise SystemExit("FAIL: projected mic is not attached")

          path.write_text(java, encoding="utf-8")
          print("PASS: integrated Home and projected mic patch applied")
          PY

      - name: Validate patch and build V10 APK
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          python3 - <<'PY'
          from pathlib import Path

          source = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java"
          ).read_text(encoding="utf-8")

          required = [
              "private void createFloatingMicButton()",
              "private void startVoiceAssistant()",
              "private void handleVoiceResult(String spoken)",
              "SpeechRecognizer.createSpeechRecognizer(this)",
              "voice.setOnClickListener(v -> startVoiceAssistant())",
              "createFloatingMicButton();",
              "createFloatingTouchKey();",
              "private void showFloatingMenu()",
              "public void handleControlHome()",
          ]

          for item in required:
              if item not in source:
                  raise SystemExit(f"FAIL: missing Java verification anchor: {item}")

          if source.count("private void createFloatingMicButton()") != 1:
              raise SystemExit("FAIL: duplicate mic implementation")

          print("PASS: source verification")
          PY

          cd v10-source
          gradle --no-daemon :app:assembleRelease

          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          mkdir -p ../dist
          cp "$APK" ../dist/CarAsistant-troly.apk

          cd ..
          sha256sum dist/CarAsistant-troly.apk \
            | tee dist/SHA256SUMS.txt

          echo "PASS: APK created"

      - name: Upload integrated APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAsistant-troly
          path: |
            dist/CarAsistant-troly.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
