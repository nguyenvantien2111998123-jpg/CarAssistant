
name: TL2
run-name: TL2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout verified CORE
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install workflow parser
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-yaml
          python3 -c "import yaml; print('PASS: PyYAML ready')"

      # ==========================================================
      # PATCH BASELINE: reuse TL1 verified steps in build workspace
      # ==========================================================
      - name: Apply verified TL1 baseline
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          workflow_path = Path(".github/workflows/TL1.yml")
          if not workflow_path.is_file():
              raise SystemExit("FAIL-CLOSED: TL1.yml missing")

          workflow = yaml.safe_load(
              workflow_path.read_text(encoding="utf-8")
          )
          steps = workflow.get("jobs", {}).get("build", {}).get("steps", [])

          required = [
              "Verify CORE and reference workflows",
              "Reuse only verified voice and V3 mic baseline steps",
              "Apply TL1 shared mic controls and four-second silence",
              "Verify TL1 patch and YAML",
          ]

          for name in required:
              matches = [
                  step for step in steps
                  if step.get("name") == name and step.get("run")
              ]

              if len(matches) != 1:
                  raise SystemExit(
                      f"FAIL-CLOSED: TL1 step {name!r}; "
                      f"expected 1, found {len(matches)}"
                  )

              print(f"RUN TL1 baseline step: {name}", flush=True)

              subprocess.run(
                  [
                      "bash", "-e", "-u", "-o", "pipefail",
                      "-c", matches[0]["run"]
                  ],
                  check=True,
              )

              print(f"PASS TL1 baseline step: {name}", flush=True)

          print("PASS: TL1 baseline applied without committing source")
          PY

      # ==========================================================
      # PATCH TL2: voice command follows the manual app-picker path
      # ==========================================================
      - name: Apply TL2 app-picker selection patch
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/"
              "V10CarActivity.java"
          )

          if not path.is_file():
              raise SystemExit(
                  "FAIL-CLOSED: V10CarActivity.java missing"
              )

          source = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global source

              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f"FAIL-CLOSED: {label}: "
                      f"expected 1 anchor, found {count}"
                  )

              source = source.replace(old, new, 1)
              print(f"PASS anchor: {label}")

          # A. Manual tile tap and voice selection use one handler.
          replace_once(
              "        t.setOnClickListener(v->{hideApps();launchProjection(app.component);});",
              "        t.setOnClickListener(v -> selectAppForProjection(app));",
              "manual app tile click handler",
          )

          # B. Add a shared selection method.
          helper = (
              "    private void selectAppForProjection(AppInfo app) {\n"
              "        if (app == null || app.component == null) {\n"
              "            return;\n"
              "        }\n"
              "        hideApps();\n"
              "        launchProjection(app.component);\n"
              "    }\n\n"
          )

          insertion = "    private void attachProjection() {"

          if source.count(insertion) != 1:
              raise SystemExit(
                  "FAIL-CLOSED: attachProjection anchor not unique"
              )

          if "private void selectAppForProjection(AppInfo app)" in source:
              raise SystemExit(
                  "FAIL-CLOSED: shared selection method already exists"
              )

          source = source.replace(insertion, helper + insertion, 1)
          print("PASS: shared app selection method added")

          # C. Find the exact voice-command method by balanced braces.
          declaration = re.compile(
              r"private\s+void\s+processVoiceCommand\s*"
              r"\(\s*String\s+spoken\s*\)\s*\{"
          )

          matches = list(declaration.finditer(source))

          if len(matches) != 1:
              raise SystemExit(
                  "FAIL-CLOSED: processVoiceCommand declaration "
                  f"expected 1, found {len(matches)}"
              )

          start = matches[0].start()
          brace = source.find("{", start)

          depth = 0
          in_string = False
          in_char = False
          escaped = False
          line_comment = False
          block_comment = False
          end = None
          i = brace

          while i < len(source):
              ch = source[i]
              nxt = source[i + 1] if i + 1 < len(source) else ""

              if line_comment:
                  if ch == "\n":
                      line_comment = False
                  i += 1
                  continue

              if block_comment:
                  if ch == "*" and nxt == "/":
                      block_comment = False
                      i += 2
                  else:
                      i += 1
                  continue

              if in_string or in_char:
                  if escaped:
                      escaped = False
                  elif ch == "\\":
                      escaped = True
                  elif in_string and ch == '"':
                      in_string = False
                  elif in_char and ch == "'":
                      in_char = False
                  i += 1
                  continue

              if ch == "/" and nxt == "/":
                  line_comment = True
                  i += 2
                  continue

              if ch == "/" and nxt == "*":
                  block_comment = True
                  i += 2
                  continue

              if ch == '"':
                  in_string = True
              elif ch == "'":
                  in_char = True
              elif ch == "{":
                  depth += 1
              elif ch == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break

              i += 1

          if end is None:
              raise SystemExit(
                  "FAIL-CLOSED: could not isolate voice-command method"
              )

          method = source[start:end]

          # Do not overwrite the method if it already has this patch.
          if "selectAppForProjection(app);" in method:
              raise SystemExit(
                  "FAIL-CLOSED: TL2 voice route already patched"
              )

          loop_anchor = "for (AppInfo app : apps)"
          launch_anchor = "launchProjection(app.component);"

          if method.count(loop_anchor) != 1:
              raise SystemExit(
                  "FAIL-CLOSED: app-list matching loop not unique"
              )

          if method.count(launch_anchor) != 1:
              raise SystemExit(
                  "FAIL-CLOSED: app launch inside voice method "
                  "not unique"
              )

          # Open the actual Applications panel before matching.
          # The existing showApps() loads the app list used by the UI.
          method = method.replace(
              loop_anchor,
              "showApps();\n        " + loop_anchor,
              1,
          )

          # Reuse exactly the same selection handler as a manual tap.
          method = method.replace(
              launch_anchor,
              "selectAppForProjection(app);",
              1,
          )

          source = source[:start] + method + source[end:]

          # D. Verify all expected anchors before writing the file.
          checks = [
              (
                  "shared selection method",
                  "private void selectAppForProjection(AppInfo app)",
              ),
              (
                  "manual tile handler",
                  "t.setOnClickListener(v -> selectAppForProjection(app));",
              ),
              (
                  "voice opens app picker",
                  "showApps();",
              ),
              (
                  "voice uses shared selection handler",
                  "selectAppForProjection(app);",
              ),
              (
                  "existing projection launch retained",
                  "launchProjection(app.component);",
              ),
              (
                  "existing session persistence retained",
                  "V10SessionStore",
              ),
          ]

          for label, anchor in checks:
              if anchor not in source:
                  raise SystemExit(
                      f"FAIL-CLOSED: missing {label}: {anchor}"
                  )
              print(f"PASS: {label}")

          path.write_text(source, encoding="utf-8")
          print("PASS: TL2 patch applied in workspace only")
          PY

      # ==========================================================
      # PATCH VALIDATION: fail before build if expected code is absent
      # ==========================================================
      - name: Validate TL2 and protect baseline
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          workflow = Path(".github/workflows/TL2.yml")
          yaml.safe_load(workflow.read_text(encoding="utf-8"))

          source_path = Path(
              "v10-source/app/src/main/java/com/carassistant/v10/"
              "V10CarActivity.java"
          )
          source = source_path.read_text(encoding="utf-8")

          required = {
              "manual tile uses shared selector":
                  "t.setOnClickListener(v -> selectAppForProjection(app));",
              "shared selector hides app picker":
                  "private void selectAppForProjection(AppInfo app)",
              "voice opens Applications panel":
                  "showApps();",
              "voice selects through shared method":
                  "selectAppForProjection(app);",
              "existing projection method":
                  "launchProjection(app.component);",
              "existing session persistence":
                  "V10SessionStore",
          }

          for label, anchor in required.items():
              if anchor not in source:
                  raise SystemExit(f"FAIL: {label}")
              print(f"PASS: {label}")

          # The workflow must not commit or push source changes.
          status = subprocess.check_output(
              ["git", "status", "--porcelain"],
              text=True,
          ).splitlines()

          print("PASS: no commit/push operation configured")
          print("PASS: changed source exists only in the runner workspace")
          PY

      # ==========================================================
      # INTEGRATION TEST: TL1 + TL2, one final APK build
      # ==========================================================
      - name: Compile integrated TL1 plus TL2
        shell: bash
        run: |
          set -euo pipefail
          cd v10-source
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace compileDebugJavaWithJavac

      - name: Build integrated APK
        shell: bash
        run: |
          set -euo pipefail
          cd v10-source
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Package TL2 APK and patched source
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          mkdir -p dist
          cp "$APK" dist/CarAssistant-TL2-unsigned.apk

          cp \
            v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java \
            dist/V10CarActivity-TL2.java

          sha256sum dist/CarAssistant-TL2-unsigned.apk \
            | tee dist/CarAssistant-TL2.sha256

          echo "PASS: integrated APK packaged"

      - name: Upload TL2 integration test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TL2
          path: |
            dist/CarAssistant-TL2-unsigned.apk
            dist/CarAssistant-TL2.sha256
            dist/V10CarActivity-TL2.java
          if-no-files-found: error
          retention-days: 30
