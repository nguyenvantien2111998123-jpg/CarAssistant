name: Navigation Presentation Phone

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-navigation-presentation-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      # ============================================================
      # 1. CHECKOUT EXACT IMMUTABLE BASELINE
      #
      # Run: 37607447583
      # Commit:
      # d69dc922696a4876dbc1000154ce230b220a0ecd
      # ============================================================
      - name: Checkout baseline 37607447583
        uses: actions/checkout@v4
        with:
          ref: d69dc922696a4876dbc1000154ce230b220a0ecd
          fetch-depth: 1

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. VERIFY EXACT BASELINE
      # ============================================================
      - name: Verify exact baseline
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="d69dc922696a4876dbc1000154ce230b220a0ecd"
          ACTUAL="$(git rev-parse HEAD)"

          echo "Expected baseline:"
          echo "$EXPECTED"

          echo "Actual checkout:"
          echo "$ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Baseline mismatch."
            exit 1
          fi

          echo "PASS: Exact baseline 37607447583."

      # ============================================================
      # 4. VERIFY REQUIRED SOURCE
      # ============================================================
      - name: Verify baseline source
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source"
          JAVA_SRC="$SRC/app/src/main/java/com/hieptran/aacast/doudou"

          test -d "$SRC"
          test -f "$SRC/settings.gradle"
          test -f "$SRC/build.gradle"
          test -f "$SRC/gradlew"
          test -f "$SRC/app/build.gradle"
          test -f "$SRC/app/src/main/AndroidManifest.xml"

          test -f "$JAVA_SRC/V10LauncherActivity.java"
          test -f "$JAVA_SRC/V10CarActivity.java"
          test -f "$JAVA_SRC/NavigationMapView.java"

          echo "PASS: Required source files exist."

      # ============================================================
      # 5. VERIFY PHONE ACTIVITY
      # ============================================================
      - name: Verify V10LauncherActivity
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"
          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          grep -Fq "package com.carassistant.v10;" "$FILE"
          grep -Fq "public final class V10LauncherActivity" "$FILE"
          grep -Fq "extends Activity" "$FILE"
          grep -Fq "private void buildUi()" "$FILE"

          grep -Fq 'android:name="com.carassistant.v10.V10LauncherActivity"' "$MANIFEST"
          grep -Fq '<action android:name="android.intent.action.MAIN" />' "$MANIFEST"
          grep -Fq '<category android:name="android.intent.category.LAUNCHER" />' "$MANIFEST"

          echo "PASS: V10LauncherActivity is the phone launcher."

      # ============================================================
      # 6. VERIFY ANDROID AUTO ACTIVITY
      #
      # DO NOT PATCH THIS ACTIVITY.
      # ============================================================
      - name: Verify V10CarActivity
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq "package com.carassistant.v10;" "$FILE"
          grep -Fq "public final class V10CarActivity" "$FILE"
          grep -Fq "extends CarActivity" "$FILE"

          echo "PASS: V10CarActivity remains Android Auto host."

      # ============================================================
      # 7. VERIFY NAVIGATION DEPENDENCIES
      # ============================================================
      - name: Verify Navigation dependencies
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="v10-source/app/build.gradle"
          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          grep -Fq "org.maplibre.gl:android-sdk:11.11.0" "$GRADLE"
          echo "PASS: MapLibre 11.11.0"

          grep -Fq "android.permission.ACCESS_FINE_LOCATION" "$MANIFEST"
          echo "PASS: ACCESS_FINE_LOCATION"

          grep -Fq "android.permission.ACCESS_COARSE_LOCATION" "$MANIFEST"
          echo "PASS: ACCESS_COARSE_LOCATION"

      # ============================================================
      # 8. LOCK NAVIGATIONMAPVIEW BEFORE PATCH
      # ============================================================
      - name: Lock NavigationMapView baseline
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          test -f "$FILE"

          sha256sum "$FILE" | tee /tmp/navigation-map-before.sha256

          grep -Fq "class NavigationMapView" "$FILE"
          grep -Fq "MapLibre.getInstance" "$FILE"
          grep -Fq "new MapView" "$FILE"
          grep -Fq "getLocationComponent" "$FILE"

          grep -Fq "https://tiles.openfreemap.org/styles/liberty" "$FILE"

          grep -Fq "nominatim.openstreetmap.org" "$FILE"

          grep -Fq "SpeechRecognizer" "$FILE"
          grep -Fq 'RecognizerIntent.LANGUAGE_MODEL_FREE_FORM' "$FILE"
          grep -Fq '"vi-VN"' "$FILE"
          grep -Fq "VOICE_SILENCE_TIMEOUT_MS = 5000L" "$FILE"
          grep -Fq "playVoiceStartTone" "$FILE"

          grep -Fq "public void zoomIn()" "$FILE"
          grep -Fq "public void zoomOut()" "$FILE"
          grep -Fq "public void recenter()" "$FILE"

          grep -Fq "public void onHostResume()" "$FILE"
          grep -Fq "public void onHostPause()" "$FILE"
          grep -Fq "public void onHostDestroy()" "$FILE"

          echo "PASS: NavigationMapView baseline locked."

      # ============================================================
      # 9. CREATE NavigationOverlayView
      #
      # IMPORTANT:
      # Use the REAL NavigationMapView.
      # No fake NavigationMap interface.
      # ============================================================
      - name: Create NavigationOverlayView
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationOverlayView.java"

          cat > "$FILE" <<'JAVA'
          package com.carassistant.v10;

          import android.content.Context;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.util.AttributeSet;
          import android.view.Gravity;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          /**
           * Navigation Presentation / Overlay Layer.
           *
           * PHONE ONLY.
           *
           * This class contains UI only.
           *
           * NavigationMapView remains the Navigation CORE.
           * No MapLibre, GPS, Nominatim, SpeechRecognizer,
           * routing engine or location provider is created here.
           */
          public class NavigationOverlayView extends FrameLayout {

              private NavigationMapView navigationMap;

              public NavigationOverlayView(Context context) {
                  super(context);
                  init();
              }

              public NavigationOverlayView(
                      Context context,
                      AttributeSet attrs) {
                  super(context, attrs);
                  init();
              }

              private void init() {
                  setClipChildren(false);
                  setClipToPadding(false);
                  setBackgroundColor(Color.TRANSPARENT);

                  buildTopBar();
                  buildSideControls();
                  buildBottomBar();
              }

              public void setNavigationMap(
                      NavigationMapView map) {

                  this.navigationMap = map;
              }

              // ====================================================
              // TOP BAR
              // ====================================================
              private void buildTopBar() {

                  LinearLayout bar =
                          new LinearLayout(getContext());

                  bar.setOrientation(
                          LinearLayout.HORIZONTAL);

                  bar.setGravity(
                          Gravity.CENTER_VERTICAL);

                  bar.setPadding(
                          dp(12),
                          dp(8),
                          dp(12),
                          dp(8));

                  bar.setBackground(
                          roundedBackground(
                                  Color.argb(
                                          175,
                                          12,
                                          18,
                                          24),
                                  16));

                  TextView title =
                          new TextView(getContext());

                  title.setText(
                          "Bản đồ điều hướng");

                  title.setTextColor(
                          Color.WHITE);

                  title.setTextSize(16);

                  title.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD);

                  title.setGravity(
                          Gravity.CENTER_VERTICAL);

                  bar.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  0,
                                  LayoutParams.MATCH_PARENT,
                                  1f));

                  TextView status =
                          new TextView(getContext());

                  status.setText("GPS");

                  status.setTextColor(
                          Color.WHITE);

                  status.setTextSize(12);

                  status.setGravity(
                          Gravity.CENTER);

                  bar.addView(
                          status,
                          new LinearLayout.LayoutParams(
                                  dp(50),
                                  LayoutParams.MATCH_PARENT));

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  LayoutParams.MATCH_PARENT,
                                  dp(54),
                                  Gravity.TOP);

                  params.setMargins(
                          dp(8),
                          dp(8),
                          dp(8),
                          0);

                  addView(bar, params);
              }

              // ====================================================
              // SIDE CONTROLS
              // ====================================================
              private void buildSideControls() {

                  LinearLayout controls =
                          new LinearLayout(getContext());

                  controls.setOrientation(
                          LinearLayout.VERTICAL);

                  controls.setGravity(
                          Gravity.CENTER);

                  controls.setPadding(
                          dp(4),
                          dp(4),
                          dp(4),
                          dp(4));

                  controls.setBackground(
                          roundedBackground(
                                  Color.argb(
                                          175,
                                          12,
                                          18,
                                          24),
                                  16));

                  TextView zoomIn =
                          createButton(
                                  "+",
                                  "Phóng to bản đồ");

                  zoomIn.setOnClickListener(
                          v -> {

                              if (navigationMap != null) {
                                  navigationMap.zoomIn();
                              }
                          });

                  TextView zoomOut =
                          createButton(
                                  "−",
                                  "Thu nhỏ bản đồ");

                  zoomOut.setOnClickListener(
                          v -> {

                              if (navigationMap != null) {
                                  navigationMap.zoomOut();
                              }
                          });

                  TextView recenter =
                          createButton(
                                  "◎",
                                  "Đưa bản đồ về vị trí hiện tại");

                  recenter.setOnClickListener(
                          v -> {

                              if (navigationMap != null) {
                                  navigationMap.recenter();
                              }
                          });

                  controls.addView(
                          zoomIn,
                          new LinearLayout.LayoutParams(
                                  dp(46),
                                  dp(46)));

                  controls.addView(
                          zoomOut,
                          new LinearLayout.LayoutParams(
                                  dp(46),
                                  dp(46)));

                  controls.addView(
                          recenter,
                          new LinearLayout.LayoutParams(
                                  dp(46),
                                  dp(46)));

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  dp(56),
                                  dp(160),
                                  Gravity.END |
                                          Gravity.CENTER_VERTICAL);

                  params.setMargins(
                          0,
                          0,
                          dp(8),
                          0);

                  addView(
                          controls,
                          params);
              }

              // ====================================================
              // BOTTOM BAR
              // ====================================================
              private void buildBottomBar() {

                  LinearLayout bar =
                          new LinearLayout(getContext());

                  bar.setOrientation(
                          LinearLayout.HORIZONTAL);

                  bar.setGravity(
                          Gravity.CENTER);

                  bar.setPadding(
                          dp(12),
                          dp(8),
                          dp(12),
                          dp(8));

                  bar.setBackground(
                          roundedBackground(
                                  Color.argb(
                                          190,
                                          12,
                                          18,
                                          24),
                                  16));

                  TextView infoText =
                          new TextView(getContext());

                  infoText.setText(
                          "Đang tìm tuyến đường tốt nhất...");

                  infoText.setTextColor(
                          Color.WHITE);

                  infoText.setTextSize(14);

                  infoText.setGravity(
                          Gravity.CENTER);

                  bar.addView(
                          infoText,
                          new LinearLayout.LayoutParams(
                                  LayoutParams.MATCH_PARENT,
                                  LayoutParams.WRAP_CONTENT));

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  LayoutParams.MATCH_PARENT,
                                  dp(60),
                                  Gravity.BOTTOM);

                  params.setMargins(
                          dp(8),
                          0,
                          dp(8),
                          dp(8));

                  addView(
                          bar,
                          params);
              }

              // ====================================================
              // BUTTON
              // ====================================================
              private TextView createButton(
                      String symbol,
                      String tooltip) {

                  TextView button =
                          new TextView(getContext());

                  button.setText(symbol);

                  button.setTextColor(
                          Color.WHITE);

                  button.setTextSize(20);

                  button.setGravity(
                          Gravity.CENTER);

                  button.setContentDescription(
                          tooltip);

                  button.setFocusable(true);

                  button.setClickable(true);

                  button.setBackground(
                          roundedBackground(
                                  Color.argb(
                                          150,
                                          20,
                                          28,
                                          36),
                                  12));

                  return button;
              }

              // ====================================================
              // BACKGROUND
              // ====================================================
              private GradientDrawable roundedBackground(
                      int color,
                      float cornerRadiusDp) {

                  GradientDrawable drawable =
                          new GradientDrawable();

                  drawable.setColor(color);

                  drawable.setCornerRadius(
                          dp((int) cornerRadiusDp));

                  return drawable;
              }

              // ====================================================
              // DP
              // ====================================================
              private int dp(int value) {

                  return (int) (
                          value
                                  * getResources()
                                          .getDisplayMetrics()
                                          .density
                          + 0.5f);
              }
          }
          JAVA

          grep -Fq "package com.carassistant.v10;" "$FILE"
          grep -Fq "class NavigationOverlayView" "$FILE"
          grep -Fq "private NavigationMapView navigationMap;" "$FILE"
          grep -Fq "setNavigationMap" "$FILE"
          grep -Fq "navigationMap.zoomIn()" "$FILE"
          grep -Fq "navigationMap.zoomOut()" "$FILE"
          grep -Fq "navigationMap.recenter()" "$FILE"

          echo "PASS: NavigationOverlayView created."

      # ============================================================
      # 10. PATCH V10LauncherActivity
      #
      # PHONE HOST:
      #
      # NavigationMapView
      #       ↓
      # NavigationOverlayView
      #
      # V10CarActivity is NOT modified.
      # ============================================================
      - name: Patch V10LauncherActivity phone host
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"
          )

          text = path.read_text()

          # --------------------------------------------------------
          # IMPORT FRAME LAYOUT
          # --------------------------------------------------------
          if "import android.widget.FrameLayout;" not in text:
              anchor = (
                  "import android.view.View;\n"
                  "import android.widget.GridLayout;"
              )
              replacement = (
                  "import android.view.View;\n"
                  "import android.widget.FrameLayout;\n"
                  "import android.widget.GridLayout;"
              )
              if anchor not in text:
                  raise SystemExit("ERROR: FrameLayout import anchor not found.")
              text = text.replace(anchor, replacement, 1)

          # --------------------------------------------------------
          # ROOT FIELD
          # --------------------------------------------------------
          old_root_field = "    private LinearLayout root;\n"
          new_root_field = "    private FrameLayout root;\n"

          if old_root_field not in text:
              if "private FrameLayout root;" not in text:
                  raise SystemExit("ERROR: root field anchor not found.")
          else:
              text = text.replace(old_root_field, new_root_field, 1)

          # --------------------------------------------------------
          # NAVIGATION FIELDS
          # --------------------------------------------------------
          if "private NavigationMapView navigationMap;" not in text:
              anchor = "    private LinearLayout dock;\n"
              replacement = (
                  "    private LinearLayout dock;\n\n"
                  "    // Phone Navigation host\n"
                  "    private NavigationMapView navigationMap;\n"
                  "    private NavigationOverlayView navigationOverlayView;\n"
              )
              if anchor not in text:
                  raise SystemExit("ERROR: dock field anchor not found.")
              text = text.replace(anchor, replacement, 1)

          # --------------------------------------------------------
          # LIFECYCLE
          # --------------------------------------------------------
          if "protected void onResume()" not in text:
              anchor = (
                  "    @Override\n"
                  "    protected void onDestroy() {\n\n"
                  "        handler.removeCallbacks(\n"
                  "                clockTicker);\n\n"
                  "        super.onDestroy();\n"
                  "    }\n"
              )

              replacement = (
                  "    @Override\n"
                  "    protected void onResume() {\n\n"
                  "        super.onResume();\n\n"
                  "        if (navigationMap != null) {\n"
                  "            navigationMap.onHostResume();\n"
                  "        }\n"
                  "    }\n\n"
                  "    @Override\n"
                  "    protected void onPause() {\n\n"
                  "        if (navigationMap != null) {\n"
                  "            navigationMap.onHostPause();\n"
                  "        }\n\n"
                  "        super.onPause();\n"
                  "    }\n\n"
                  "    @Override\n"
                  "    protected void onDestroy() {\n\n"
                  "        handler.removeCallbacks(\n"
                  "                clockTicker);\n\n"
                  "        if (navigationMap != null) {\n"
                  "            navigationMap.onHostDestroy();\n"
                  "        }\n\n"
                  "        super.onDestroy();\n"
                  "    }\n"
              )

              if anchor not in text:
                  raise SystemExit("ERROR: onDestroy anchor not found.")
              text = text.replace(anchor, replacement, 1)

          # --------------------------------------------------------
          # REPLACE buildUi()
          # --------------------------------------------------------
          build_ui_pattern = re.compile(
              r"    private void buildUi\(\) \{.*?"
              r"        setContentView\(root\);\n"
              r"    \}",
              re.DOTALL
          )

          match = build_ui_pattern.search(text)

          if not match:
              raise SystemExit("ERROR: V10LauncherActivity buildUi() not found.")

          new_build_ui = """    private void buildUi() {

          // ======================================================
          // PHONE ROOT
          // ======================================================

          root =
                  new FrameLayout(this);

          root.setBackgroundColor(
                  Color.rgb(
                          7,
                          9,
                          12));

          // ======================================================
          // REAL NAVIGATION CORE
          // ======================================================

          navigationMap =
                  new NavigationMapView(this);

          root.addView(
                  navigationMap,
                  new FrameLayout.LayoutParams(
                          -1,
                          -1));

          // ======================================================
          // NAVIGATION PRESENTATION / OVERLAY
          // ======================================================

          navigationOverlayView =
                  new NavigationOverlayView(
                          this);

          navigationOverlayView.setNavigationMap(
                  navigationMap);

          root.addView(
                  navigationOverlayView,
                  new FrameLayout.LayoutParams(
                          -1,
                          -1));

          // ======================================================
          // EXISTING LAUNCHER UI
          // ======================================================

          dashboard =
                  new LinearLayout(this);

          dashboard.setOrientation(
                  LinearLayout.VERTICAL);

          dashboard.setVisibility(
                  View.GONE);

          buildDashboard();

          buildAppPanel();

          if (appPanel != null) {
              appPanel.setVisibility(
                      View.GONE);
          }

          setContentView(root);
          }"""

          text = text[:match.start()] + new_build_ui + text[match.end():]

          path.write_text(text)

          print("PASS: V10LauncherActivity patched as Phone Navigation host.")
          PY

      # ============================================================
      # 11. VERIFY PHONE HOST
      # ============================================================
      - name: Verify V10LauncherActivity Navigation host
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"

          grep -Fq "import android.widget.FrameLayout;" "$FILE"

          grep -Fq "private FrameLayout root;" "$FILE"

          grep -Fq "private NavigationMapView navigationMap;" "$FILE"

          grep -Fq "private NavigationOverlayView navigationOverlayView;" "$FILE"

          grep -Fq "navigationMap =" "$FILE"
          grep -Fq "new NavigationMapView(this)" "$FILE"

          grep -Fq "navigationOverlayView =" "$FILE"
          grep -Fq "new NavigationOverlayView" "$FILE"

          grep -Fq "navigationOverlayView.setNavigationMap" "$FILE"

          grep -Fq "navigationMap.onHostResume()" "$FILE"
          grep -Fq "navigationMap.onHostPause()" "$FILE"
          grep -Fq "navigationMap.onHostDestroy()" "$FILE"

          echo "PASS: V10LauncherActivity hosts real NavigationMapView."
          echo "PASS: V10LauncherActivity hosts NavigationOverlayView."

      # ============================================================
      # 12. VERIFY ANDROID AUTO HOST UNTOUCHED
      # ============================================================
      - name: Verify V10CarActivity untouched
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          if grep -Fq "NavigationOverlayView" "$FILE"; then
            echo "ERROR: V10CarActivity contains Phone overlay."
            exit 1
          fi

          if grep -Fq "NavigationPresentationLayer" "$FILE"; then
            echo "ERROR: V10CarActivity contains Phone Presentation Layer."
            exit 1
          fi

          echo "PASS: V10CarActivity untouched."

      # ============================================================
      # 13. VERIFY NAVIGATIONMAPVIEW SHA
      # ============================================================
      - name: Verify NavigationMapView unchanged
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          sha256sum "$FILE" | tee /tmp/navigation-map-after.sha256

          BEFORE="$(cut -d' ' -f1 /tmp/navigation-map-before.sha256)"
          AFTER="$(cut -d' ' -f1 /tmp/navigation-map-after.sha256)"

          echo "NavigationMapView before:"
          echo "$BEFORE"

          echo "NavigationMapView after:"
          echo "$AFTER"

          if [ "$BEFORE" != "$AFTER" ]; then
            echo "ERROR: NavigationMapView changed."
            exit 1
          fi

          echo "PASS: NavigationMapView byte-for-byte unchanged."

      # ============================================================
      # 14. VERIFY OVERLAY IS PRESENTATION ONLY
      # ============================================================
      - name: Verify Overlay contains no Navigation engine
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationOverlayView.java"

          if grep -Eq \
            "MapLibre|SpeechRecognizer|LocationManager|FusedLocation|Nominatim|OkHttp|Retrofit" \
            "$FILE"; then

            echo "ERROR: Navigation engine/provider code detected in overlay."
            exit 1
          fi

          grep -Fq "NavigationMapView" "$FILE"
          grep -Fq "navigationMap.zoomIn()" "$FILE"
          grep -Fq "navigationMap.zoomOut()" "$FILE"
          grep -Fq "navigationMap.recenter()" "$FILE"

          echo "PASS: Overlay is UI/delegation only."

      # ============================================================
      # 15. VERIFY NO FAKE NavigationMap INTERFACE
      # ============================================================
      - name: Verify real NavigationMapView integration
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationOverlayView.java"

          if grep -Fq "interface NavigationMap" "$FILE"; then
            echo "ERROR: Fake NavigationMap interface detected."
            exit 1
          fi

          grep -Fq "private NavigationMapView navigationMap;" "$FILE"

          echo "PASS: Overlay uses real NavigationMapView."

      # ============================================================
      # 16. VERIFY PATCH SCOPE
      # ============================================================
      - name: Verify protected source files remain untouched
        shell: bash
        run: |
          set -euo pipefail

          echo "Changed files after patch:"
          git status --short

          if git status --short | grep -E \
            "NavigationMapView.java|V10CarActivity.java"; then

            echo "ERROR: Protected source file changed."
            exit 1
          fi

          echo "PASS: Protected files remain untouched."

      # ============================================================
      # 17. COMPILE JAVA
      # ============================================================
      - name: Compile Java
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace

          echo "PASS: Java compilation."

      # ============================================================
      # 18. ASSEMBLE APK
      # ============================================================
      - name: Assemble Debug APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

          echo "PASS: Debug APK assembled."

      # ============================================================
      # 19. VERIFY APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

