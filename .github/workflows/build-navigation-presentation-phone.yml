name: Navigation Presentation Phone

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-navigation-presentation-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      # ============================================================
      # 1. CHECKOUT EXACT BASELINE
      # ============================================================
      - name: Checkout baseline 37607447583
        uses: actions/checkout@v4
        with:
          ref: d69dc922696a4876dbc1000154ce230b220a0ecd
          fetch-depth: 1

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. VERIFY BASELINE SOURCE
      # ============================================================
      - name: Verify baseline source
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source"
          JAVA_SRC="$SRC/app/src/main/java/com/hieptran/aacast/doudou"

          echo "========================================"
          echo "VERIFY BASELINE SOURCE"
          echo "========================================"

          test -d "$SRC"
          test -f "$SRC/settings.gradle"
          test -f "$SRC/build.gradle"
          test -f "$SRC/gradlew"
          test -f "$SRC/app/build.gradle"
          test -f "$SRC/app/src/main/AndroidManifest.xml"

          test -f "$JAVA_SRC/V10CarActivity.java"
          test -f "$JAVA_SRC/NavigationMapView.java"
          test -f "$JAVA_SRC/V10ProjectionSession.java"
          test -f "$JAVA_SRC/V10DisplayController.java"
          test -f "$JAVA_SRC/V10SurfaceManager.java"
          test -f "$JAVA_SRC/V10TaskSession.java"
          test -f "$JAVA_SRC/V10SessionStore.java"

          echo "PASS: Core source exists."

      # ============================================================
      # 4. VERIFY EXACT BASELINE COMMIT
      # ============================================================
      - name: Verify exact baseline commit
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="d69dc922696a4876dbc1000154ce230b220a0ecd"
          ACTUAL="$(git rev-parse HEAD)"

          echo "Expected baseline:"
          echo "$EXPECTED"

          echo "Actual checkout:"
          echo "$ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Baseline mismatch."
            exit 1
          fi

          echo "PASS: Exact baseline 37607447583."

      # ============================================================
      # 5. VERIFY MAPLIBRE / LOCATION
      # ============================================================
      - name: Verify Navigation dependencies
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="v10-source/app/build.gradle"
          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          grep -Fq "org.maplibre.gl:android-sdk:11.11.0" "$GRADLE"
          echo "PASS: MapLibre 11.11.0"

          grep -Fq "android.permission.ACCESS_FINE_LOCATION" "$MANIFEST"
          echo "PASS: ACCESS_FINE_LOCATION"

          grep -Fq "android.permission.ACCESS_COARSE_LOCATION" "$MANIFEST"
          echo "PASS: ACCESS_COARSE_LOCATION"

      # ============================================================
      # 6. PROTECT NAVIGATIONMAPVIEW
      # ============================================================
      - name: Protect NavigationMapView baseline
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          test -f "$FILE"

          sha256sum "$FILE" | tee /tmp/navigation-map-before.sha256

          grep -Fq "class NavigationMapView" "$FILE"
          grep -Fq "MapLibre.getInstance" "$FILE"
          grep -Fq "new MapView" "$FILE"
          grep -Fq "getLocationComponent" "$FILE"
          grep -Fq "https://tiles.openfreemap.org/styles/liberty" "$FILE"

          grep -Fq "public void zoomIn()" "$FILE"
          grep -Fq "public void zoomOut()" "$FILE"
          grep -Fq "public void recenter()" "$FILE"

          grep -Fq "public void onHostResume()" "$FILE"
          grep -Fq "public void onHostPause()" "$FILE"
          grep -Fq "public void onHostDestroy()" "$FILE"

          echo "PASS: NavigationMapView protected."

      # ============================================================
      # 7. VERIFY NAVIGATION CORE
      # ============================================================
      - name: Verify Navigation CORE
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          echo "Checking protected Navigation functionality..."

          grep -Fq "nominatim.openstreetmap.org" "$FILE"
          echo "PASS: Nominatim"

          grep -Fq "SpeechRecognizer" "$FILE"
          echo "PASS: SpeechRecognizer"

          grep -Fq "RecognizerIntent.LANGUAGE_MODEL_FREE_FORM" "$FILE"
          echo "PASS: Voice recognizer"

          grep -Fq '"vi-VN"' "$FILE"
          echo "PASS: vi-VN"

          grep -Fq "VOICE_SILENCE_TIMEOUT_MS = 5000L" "$FILE"
          echo "PASS: 5 second timeout"

          grep -Fq "playVoiceStartTone" "$FILE"
          echo "PASS: Voice beep"

          grep -Fq "selectDestination" "$FILE"
          echo "PASS: Destination selection"

          grep -Fq "destinationMarker" "$FILE"
          echo "PASS: Destination marker"

          echo "PASS: Navigation CORE verification."

      # ============================================================
      # 8. VERIFY ACTUAL V10CarActivity STRUCTURE
      #
      # IMPORTANT:
      # Không đoán format khoảng trắng.
      # Kiểm tra package và cấu trúc buildUi() thật trước khi patch.
      # ============================================================
      - name: Verify actual V10CarActivity structure
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq "package com.carassistant.v10;" "$FILE"
          echo "PASS: V10CarActivity package"

          grep -Fq "private NavigationMapView navigationMap;" "$FILE"
          echo "PASS: NavigationMapView field"

          grep -Fq "private void buildUi()" "$FILE"
          echo "PASS: buildUi()"

          grep -Fq "navigationMap=new NavigationMapView(this);" "$FILE"
          echo "PASS: NavigationMapView creation"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          text = path.read_text()

          match = re.search(
              r'private\s+void\s+buildUi\s*\(\s*\)\s*\{.*?'
              r'navigationMap\s*=\s*new\s+NavigationMapView\s*\(\s*this\s*\)\s*;.*?'
              r'root\s*\.\s*addView\s*\(\s*'
              r'navigationMap\s*,.*?'
              r'new\s+FrameLayout\.LayoutParams\s*\(\s*-1\s*,\s*-1\s*\)\s*'
              r'\)\s*;',
              text,
              re.DOTALL
          )

          if not match:
              raise SystemExit(
                  "ERROR: Actual buildUi() NavigationMapView "
                  "attachment structure was not found."
              )

          print("PASS: Actual NavigationMapView attachment structure verified.")
          print()
          print("Matched source block:")
          print(match.group(0))
          PY

      # ============================================================
      # 9. CREATE PRESENTATION LAYER
      # ============================================================
      - name: Create NavigationPresentationLayer.java
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationPresentationLayer.java"

          cat > "$FILE" <<'JAVA'
          package com.carassistant.v10;

          import android.content.Context;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          /**
           * Navigation Presentation Layer.
           *
           * PHONE ONLY.
           *
           * UI/presentation layer only.
           *
           * NavigationMapView remains the existing navigation core.
           */
          public final class NavigationPresentationLayer
                  extends FrameLayout {

              private final NavigationMapView navigationMap;

              public NavigationPresentationLayer(
                      Context context,
                      NavigationMapView navigationMap) {

                  super(context);

                  this.navigationMap = navigationMap;

                  setClipChildren(false);
                  setClipToPadding(false);
                  setBackgroundColor(Color.TRANSPARENT);

                  buildTopBar();
                  buildSideControls();
                  buildBottomBar();
              }

              private int dp(int value) {
                  return (int) (
                          value
                          * getResources()
                                  .getDisplayMetrics()
                                  .density
                          + 0.5f);
              }

              private GradientDrawable roundedBackground(
                      int color,
                      int radiusDp) {

                  GradientDrawable drawable =
                          new GradientDrawable();

                  drawable.setColor(color);

                  drawable.setCornerRadius(
                          dp(radiusDp));

                  drawable.setStroke(
                          dp(1),
                          Color.argb(
                                  90,
                                  255,
                                  255,
                                  255));

                  return drawable;
              }

              private TextView createButton(
                      String text,
                      String description) {

                  TextView button =
                          new TextView(getContext());

                  button.setText(text);

                  button.setTextColor(
                          Color.WHITE);

                  button.setTextSize(20);

                  button.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD);

                  button.setGravity(
                          Gravity.CENTER);

                  button.setContentDescription(
                          description);

                  button.setClickable(true);
                  button.setFocusable(true);

                  button.setBackground(
                          roundedBackground(
                                  Color.argb(
                                          175,
                                          20,
                                          28,
                                          36),
                                  14));

                  return button;
              }

              private void buildTopBar() {

                  LinearLayout bar =
                          new LinearLayout(getContext());

                  bar.setOrientation(
                          LinearLayout.HORIZONTAL);

                  bar.setGravity(
                          Gravity.CENTER_VERTICAL);

                  bar.setPadding(
                          dp(16),
                          dp(8),
                          dp(16),
                          dp(8));

                  bar.setBackground(
                          roundedBackground(
                                  Color.argb(
                                          185,
                                          12,
                                          18,
                                          24),
                                  18));

                  TextView title =
                          new TextView(getContext());

                  title.setText(
                          "NAVIGATION");

                  title.setTextColor(
                          Color.WHITE);

                  title.setTextSize(16);

                  title.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD);

                  title.setGravity(
                          Gravity.CENTER_VERTICAL);

                  bar.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  0,
                                  LayoutParams.MATCH_PARENT,
                                  1f));

                  TextView status =
                          new TextView(getContext());

                  status.setText(
                          "GPS");

                  status.setTextColor(
                          Color.WHITE);

                  status.setTextSize(12);

                  status.setGravity(
                          Gravity.CENTER);

                  bar.addView(
                          status,
                          new LinearLayout.LayoutParams(
                                  dp(55),
                                  LayoutParams.MATCH_PARENT));

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  LayoutParams.MATCH_PARENT,
                                  dp(58),
                                  Gravity.TOP);

                  params.setMargins(
                          dp(72),
                          dp(10),
                          dp(72),
                          0);

                  addView(bar, params);
              }

              private void buildSideControls() {

                  LinearLayout controls =
                          new LinearLayout(getContext());

                  controls.setOrientation(
                          LinearLayout.VERTICAL);

                  controls.setGravity(
                          Gravity.CENTER);

                  controls.setPadding(
                          dp(5),
                          dp(5),
                          dp(5),
                          dp(5));

                  controls.setBackground(
                          roundedBackground(
                                  Color.argb(
                                          170,
                                          12,
                                          18,
                                          24),
                                  18));

                  TextView zoomIn =
                          createButton(
                                  "+",
                                  "Phóng to bản đồ");

                  zoomIn.setOnClickListener(
                          v -> navigationMap.zoomIn());

                  TextView zoomOut =
                          createButton(
                                  "−",
                                  "Thu nhỏ bản đồ");

                  zoomOut.setOnClickListener(
                          v -> navigationMap.zoomOut());

                  TextView recenter =
                          createButton(
                                  "◎",
                                  "Đưa bản đồ về vị trí hiện tại");

                  recenter.setOnClickListener(
                          v -> navigationMap.recenter());

                  controls.addView(
                          zoomIn,
                          new LinearLayout.LayoutParams(
                                  dp(48),
                                  dp(48)));

                  controls.addView(
                          zoomOut,
                          new LinearLayout.LayoutParams(
                                  dp(48),
                                  dp(48)));

                  controls.addView(
                          recenter,
                          new LinearLayout.LayoutParams(
                                  dp(48),
                                  dp(48)));

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  dp(58),
                                  dp(166),
                                  Gravity.END |
                                          Gravity.CENTER_VERTICAL);

                  params.setMargins(
                          0,
                          0,
                          dp(10),
                          0);

                  addView(controls, params);
              }

              private void buildBottomBar() {

                  LinearLayout bar =
                          new LinearLayout(getContext());

                  bar.setOrientation(
                          LinearLayout.HORIZONTAL);

                  bar.setGravity(
                          Gravity.CENTER);

                  bar.setPadding(
                          dp(8),
                          dp(4),
                          dp(8),
                          dp(4));

                  bar.setBackground(
                          roundedBackground(
                                  Color.argb(
                                          185,
                                          12,
                                          18,
                                          24),
                                  18));

                  addBottomItem(
                          bar,
                          "MAP",
                          "Bản đồ");

                  addBottomItem(
                          bar,
                          "SEARCH",
                          "Tìm kiếm");

                  addBottomItem(
                          bar,
                          "ROUTE",
                          "Tuyến đường");

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  LayoutParams.MATCH_PARENT,
                                  dp(58),
                                  Gravity.BOTTOM);

                  params.setMargins(
                          dp(72),
                          0,
                          dp(72),
                          dp(10));

                  addView(bar, params);
              }

              private void addBottomItem(
                      LinearLayout parent,
                      String text,
                      String description) {

                  TextView item =
                          new TextView(getContext());

                  item.setText(text);

                  item.setTextColor(
                          Color.WHITE);

                  item.setTextSize(11);

                  item.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD);

                  item.setGravity(
                          Gravity.CENTER);

                  item.setContentDescription(
                          description);

                  parent.addView(
                          item,
                          new LinearLayout.LayoutParams(
                                  0,
                                  LayoutParams.MATCH_PARENT,
                                  1f));
              }
          }
          JAVA

          test -s "$FILE"

          echo "PASS: NavigationPresentationLayer.java created."

      # ============================================================
      # 10. ATTACH PRESENTATION LAYER
      #
      # IMPORTANT:
      # Patch theo cấu trúc Java thật bằng regex.
      # Không phụ thuộc indentation.
      # ============================================================
      - name: Attach Presentation Layer to V10CarActivity
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          text = path.read_text()

          # --------------------------------------------------------
          # 1. Verify actual package.
          # --------------------------------------------------------

          if "package com.carassistant.v10;" not in text:
              raise SystemExit(
                  "ERROR: Unexpected V10CarActivity package."
              )

          # --------------------------------------------------------
          # 2. Add Presentation Layer field.
          # --------------------------------------------------------

          field_anchor = "private NavigationMapView navigationMap;"

          field = (
              "private NavigationPresentationLayer "
              "navigationPresentationLayer;"
          )

          if field not in text:
              if field_anchor not in text:
                  raise SystemExit(
                      "ERROR: NavigationMapView field anchor not found."
                  )

              text = text.replace(
                  field_anchor,
                  field_anchor + "\n    " + field,
                  1
              )

          # --------------------------------------------------------
          # 3. Locate the REAL buildUi() block.
          #
          # The regex intentionally ignores indentation/spacing.
          # --------------------------------------------------------

          build_ui_pattern = re.compile(
              r'(?P<prefix>'
              r'private\s+void\s+buildUi\s*\(\s*\)\s*\{'
              r'.*?'
              r')'
              r'(?P<map_create>'
              r'navigationMap\s*=\s*new\s+NavigationMapView'
              r'\s*\(\s*this\s*\)\s*;'
              r')'
              r'(?P<between>'
              r'\s*'
              r')'
              r'(?P<map_add>'
              r'root\s*\.\s*addView\s*\(\s*'
              r'navigationMap\s*,'
              r'\s*new\s+FrameLayout\.LayoutParams'
              r'\s*\(\s*-1\s*,\s*-1\s*\)'
              r'\s*\)\s*;'
              r')',
              re.DOTALL
          )

          match = build_ui_pattern.search(text)

          if not match:
              raise SystemExit(
                  "ERROR: Could not locate the actual "
                  "buildUi() NavigationMapView attachment."
              )

          # --------------------------------------------------------
          # 4. Prevent duplicate patch.
          # --------------------------------------------------------

          if "new NavigationPresentationLayer(" in text:
              raise SystemExit(
                  "ERROR: NavigationPresentationLayer is already attached."
              )

          # --------------------------------------------------------
          # 5. Keep existing NavigationMapView code exactly as-is.
          #    Insert only after its existing root.addView().
          # --------------------------------------------------------

          insertion = """

              navigationPresentationLayer =
                      new NavigationPresentationLayer(
                              this,
                              navigationMap);

              root.addView(
                      navigationPresentationLayer,
                      new FrameLayout.LayoutParams(
                              -1,
                              -1));"""

          old = match.group(0)

          replacement = old + insertion

          text = (
              text[:match.start()]
              + replacement
              + text[match.end():]
          )

          # --------------------------------------------------------
          # 6. Verify resulting source.
          # --------------------------------------------------------

          required = [
              "private NavigationPresentationLayer "
              "navigationPresentationLayer;",
              "new NavigationPresentationLayer(",
              "navigationMap=new NavigationMapView(this);",
              "root.addView(",
              "navigationPresentationLayer",
          ]

          for item in required:
              if item not in text:
                  raise SystemExit(
                      "ERROR: Missing Presentation Layer item: "
                      + item
                  )

          path.write_text(text)

          print(
              "PASS: Presentation Layer attached using "
              "actual buildUi() structure."
          )
          PY

      # ============================================================
      # 11. VERIFY NAVIGATIONMAPVIEW BYTE-FOR-BYTE UNCHANGED
      # ============================================================
      - name: Verify NavigationMapView was not modified
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          BEFORE="$(cut -d' ' -f1 /tmp/navigation-map-before.sha256)"
          AFTER="$(sha256sum "$FILE" | cut -d' ' -f1)"

          echo "NavigationMapView SHA before:"
          echo "$BEFORE"

          echo "NavigationMapView SHA after:"
          echo "$AFTER"

          if [ "$BEFORE" != "$AFTER" ]; then
            echo "ERROR: NavigationMapView.java was modified."
            exit 1
          fi

          echo "PASS: NavigationMapView.java unchanged."

      # ============================================================
      # 12. VERIFY PRESENTATION LAYER
      # ============================================================
      - name: Verify Presentation Layer source
        shell: bash
        run: |
          set -euo pipefail

          PRESENTATION="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationPresentationLayer.java"
          ACTIVITY="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          test -f "$PRESENTATION"

          grep -Fq "package com.carassistant.v10;" "$PRESENTATION"

          grep -Fq "class NavigationPresentationLayer" "$PRESENTATION"

          grep -Fq "NavigationMapView navigationMap" "$PRESENTATION"

          grep -Fq "navigationMap.zoomIn()" "$PRESENTATION"
          grep -Fq "navigationMap.zoomOut()" "$PRESENTATION"
          grep -Fq "navigationMap.recenter()" "$PRESENTATION"

          grep -Fq "new NavigationPresentationLayer(" "$ACTIVITY"

          echo "PASS: Presentation Layer verification."

      # ============================================================
      # 13. VERIFY NO SECOND NAVIGATION ENGINE
      # ============================================================
      - name: Verify Presentation Layer contains no navigation engine
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationPresentationLayer.java"

          if grep -Eiq \
            "MapLibre|getLocationComponent|SpeechRecognizer|nominatim|openfreemap|LocationManager|FusedLocationProvider|OkHttpClient|Retrofit" \
            "$FILE"; then

            echo "ERROR: Presentation Layer contains navigation/provider logic."
            exit 1
          fi

          echo "PASS: Presentation Layer contains UI/delegation only."

      # ============================================================
      # 14. VERIFY PROTECTED CORE FILES
      # ============================================================
      - name: Verify protected CORE files unchanged
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          for FILE in \
            "$SRC/V10ProjectionSession.java" \
            "$SRC/V10DisplayController.java" \
            "$SRC/V10SurfaceManager.java" \
            "$SRC/V10TaskSession.java" \
            "$SRC/V10SessionStore.java"; do

            test -f "$FILE"
          done

          echo "PASS: Projection/Persistence CORE remains present."

      # ============================================================
      # 15. VERIFY GRADLE CONFIGURATION
      # ============================================================
      - name: Verify Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="v10-source/app/build.gradle"

          grep -Fq "namespace 'com.carassistant.v10'" "$GRADLE"
          echo "PASS: Namespace"

          grep -Fq 'applicationId "com.carassistant.v10"' "$GRADLE"
          echo "PASS: Application ID"

          grep -Fq "compileSdk 36" "$GRADLE"
          echo "PASS: compileSdk 36"

          grep -Fq "minSdk 29" "$GRADLE"
          echo "PASS: minSdk 29"

          grep -Fq "targetSdk 36" "$GRADLE"
          echo "PASS: targetSdk 36"

          grep -Fq "JavaVersion.VERSION_17" "$GRADLE"
          echo "PASS: Java 17"

          grep -Fq "org.maplibre.gl:android-sdk:11.11.0" "$GRADLE"
          echo "PASS: MapLibre 11.11.0"

      # ============================================================
      # 16. GRADLE WRAPPER
      # ============================================================
      - name: Verify Gradle wrapper
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew

          chmod +x ./gradlew

          ./gradlew --version

          echo "PASS: Gradle wrapper."

      # ============================================================
      # 17. COMPILE
      # ============================================================
      - name: Compile Navigation Presentation Phone
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            :app:compileDebugJavaWithJavac \
            --stacktrace

          echo "========================================"
          echo "COMPILE PASS"
          echo "========================================"

      # ============================================================
      # 18. ASSEMBLE APK
      # ============================================================
      - name: Assemble Navigation Presentation Phone APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

          echo "========================================"
          echo "ASSEMBLE PASS"
          echo "========================================"

      # ============================================================
      # 19. LOCATE APK
      # ============================================================
      - name: Locate generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find v10-source/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            find v10-source/app/build/outputs \
              -maxdepth 6 \
              -type f \
              -print || true
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo "Generated APK:"
          echo "$APK"

          ls -lh "$APK"

          test -s "$APK"

          echo "PASS: APK exists."

      # ============================================================
      # 20. PACKAGE PHONE TEST APK
      # ============================================================
      - name: Package Phone Test APK
        shell: bash
        run: |
          set -euo pipefail

          cp "$APK" \
            CarAssistant-Navigation-Presentation-Phone.apk

          sha256sum \
