name: Navigation Presentation Phone

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-navigation-presentation-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      # ============================================================
      # 1. CHECKOUT EXACT IMMUTABLE BASELINE
      #    Run: 37607447583
      #    Commit: d69dc922696a4876dbc1000154ce230b220a0ecd
      # ============================================================
      - name: Checkout baseline 37607447583
        uses: actions/checkout@v4
        with:
          ref: d69dc922696a4876dbc1000154ce230b220a0ecd
          fetch-depth: 1

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. VERIFY EXACT BASELINE
      # ============================================================
      - name: Verify exact baseline
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="d69dc922696a4876dbc1000154ce230b220a0ecd"
          ACTUAL="$(git rev-parse HEAD)"

          echo "Expected:"
          echo "$EXPECTED"

          echo "Actual:"
          echo "$ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Baseline mismatch."
            exit 1
          fi

          echo "PASS: Exact baseline 37607447583."

      # ============================================================
      # 4. VERIFY SOURCE STRUCTURE
      # ============================================================
      - name: Verify baseline source
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source"
          JAVA_SRC="$SRC/app/src/main/java/com/hieptran/aacast/doudou"

          test -d "$SRC"
          test -f "$SRC/settings.gradle"
          test -f "$SRC/build.gradle"
          test -f "$SRC/gradlew"
          test -f "$SRC/app/build.gradle"
          test -f "$SRC/app/src/main/AndroidManifest.xml"

          test -f "$JAVA_SRC/V10LauncherActivity.java"
          test -f "$JAVA_SRC/V10CarActivity.java"
          test -f "$JAVA_SRC/NavigationMapView.java"

          echo "PASS: Required source files exist."

      # ============================================================
      # 5. VERIFY PHONE ACTIVITY
      # ============================================================
      - name: Verify V10LauncherActivity is phone launcher
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"
          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          grep -Fq "package com.carassistant.v10;" "$FILE"
          grep -Fq "public final class V10LauncherActivity" "$FILE"
          grep -Fq "extends Activity" "$FILE"
          grep -Fq "private void buildUi()" "$FILE"

          grep -Fq 'android:name="com.carassistant.v10.V10LauncherActivity"' "$MANIFEST"
          grep -Fq '<action android:name="android.intent.action.MAIN" />' "$MANIFEST"
          grep -Fq '<category android:name="android.intent.category.LAUNCHER" />' "$MANIFEST"

          echo "PASS: V10LauncherActivity is the phone launcher Activity."

      # ============================================================
      # 6. VERIFY ANDROID AUTO ACTIVITY IS NOT TARGET
      # ============================================================
      - name: Verify V10CarActivity remains separate
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq "package com.carassistant.v10;" "$FILE"
          grep -Fq "public final class V10CarActivity" "$FILE"
          grep -Fq "extends CarActivity" "$FILE"
          grep -Fq "private NavigationMapView navigationMap;" "$FILE"

          echo "PASS: V10CarActivity remains Android Auto host."
          echo "PASS: Phone patch will not target V10CarActivity."

      # ============================================================
      # 7. VERIFY MAPLIBRE / LOCATION
      # ============================================================
      - name: Verify Navigation dependencies
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="v10-source/app/build.gradle"
          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          grep -Fq "org.maplibre.gl:android-sdk:11.11.0" "$GRADLE"
          echo "PASS: MapLibre 11.11.0"

          grep -Fq "android.permission.ACCESS_FINE_LOCATION" "$MANIFEST"
          echo "PASS: ACCESS_FINE_LOCATION"

          grep -Fq "android.permission.ACCESS_COARSE_LOCATION" "$MANIFEST"
          echo "PASS: ACCESS_COARSE_LOCATION"

      # ============================================================
      # 8. LOCK NAVIGATIONMAPVIEW BEFORE PATCH
      # ============================================================
      - name: Lock NavigationMapView before patch
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          test -f "$FILE"

          sha256sum "$FILE" | tee /tmp/navigation-map-before.sha256

          grep -Fq "class NavigationMapView" "$FILE"
          grep -Fq "MapLibre.getInstance" "$FILE"
          grep -Fq "new MapView" "$FILE"
          grep -Fq "getLocationComponent" "$FILE"

          grep -Fq "https://tiles.openfreemap.org/styles/liberty" "$FILE"
          grep -Fq "nominatim.openstreetmap.org" "$FILE"

          grep -Fq "SpeechRecognizer" "$FILE"
          grep -Fq '"vi-VN"' "$FILE"
          grep -Fq "VOICE_SILENCE_TIMEOUT_MS = 5000L" "$FILE"
          grep -Fq "playVoiceStartTone" "$FILE"

          grep -Fq "public void zoomIn()" "$FILE"
          grep -Fq "public void zoomOut()" "$FILE"
          grep -Fq "public void recenter()" "$FILE"

          grep -Fq "public void onHostResume()" "$FILE"
          grep -Fq "public void onHostPause()" "$FILE"
          grep -Fq "public void onHostDestroy()" "$FILE"

          echo "PASS: NavigationMapView baseline locked."

      # ============================================================
      # 9. CREATE PRESENTATION LAYER
      # ============================================================
      - name: Create NavigationPresentationLayer
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationPresentationLayer.java"

          cat > "$FILE" <<'JAVA'
          package com.carassistant.v10;

          import android.content.Context;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          /**
           * Phone Navigation Presentation Layer.
           *
           * IMPORTANT:
           * This class is UI/presentation only.
           *
           * NavigationMapView remains the existing navigation core.
           * No MapLibre, GPS, Nominatim, SpeechRecognizer or routing
           * engine is created here.
           */
          public final class NavigationPresentationLayer
                  extends FrameLayout {

              private final NavigationMapView navigationMap;

              public NavigationPresentationLayer(
                      Context context,
                      NavigationMapView navigationMap) {

                  super(context);

                  this.navigationMap = navigationMap;

                  setClipChildren(false);
                  setClipToPadding(false);
                  setBackgroundColor(Color.TRANSPARENT);

                  buildTopBar();
                  buildSideControls();
                  buildBottomBar();
              }

              private int dp(int value) {
                  return (int) (
                          value
                                  * getResources()
                                          .getDisplayMetrics()
                                          .density
                          + 0.5f);
              }

              private GradientDrawable roundedBackground(
                      int color,
                      int radiusDp) {

                  GradientDrawable drawable =
                          new GradientDrawable();

                  drawable.setColor(color);

                  drawable.setCornerRadius(
                          dp(radiusDp));

                  drawable.setStroke(
                          dp(1),
                          Color.argb(
                                  90,
                                  255,
                                  255,
                                  255));

                  return drawable;
              }

              private TextView createButton(
                      String text,
                      String description) {

                  TextView button =
                          new TextView(getContext());

                  button.setText(text);
                  button.setTextColor(Color.WHITE);
                  button.setTextSize(20);

                  button.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD);

                  button.setGravity(
                          Gravity.CENTER);

                  button.setContentDescription(
                          description);

                  button.setClickable(true);
                  button.setFocusable(true);

                  button.setBackground(
                          roundedBackground(
                                  Color.argb(
                                          175,
                                          20,
                                          28,
                                          36),
                                  14));

                  return button;
              }

              private void buildTopBar() {

                  LinearLayout bar =
                          new LinearLayout(getContext());

                  bar.setOrientation(
                          LinearLayout.HORIZONTAL);

                  bar.setGravity(
                          Gravity.CENTER_VERTICAL);

                  bar.setPadding(
                          dp(12),
                          dp(6),
                          dp(12),
                          dp(6));

                  bar.setBackground(
                          roundedBackground(
                                  Color.argb(
                                          190,
                                          12,
                                          18,
                                          24),
                                  16));

                  TextView title =
                          new TextView(getContext());

                  title.setText("NAVIGATION");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(15);

                  title.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD);

                  title.setGravity(
                          Gravity.CENTER_VERTICAL);

                  bar.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  0,
                                  LayoutParams.MATCH_PARENT,
                                  1f));

                  TextView status =
                          new TextView(getContext());

                  status.setText("GPS");
                  status.setTextColor(Color.WHITE);
                  status.setTextSize(12);
                  status.setGravity(Gravity.CENTER);

                  bar.addView(
                          status,
                          new LinearLayout.LayoutParams(
                                  dp(50),
                                  LayoutParams.MATCH_PARENT));

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  LayoutParams.MATCH_PARENT,
                                  dp(54),
                                  Gravity.TOP);

                  params.setMargins(
                          dp(8),
                          dp(8),
                          dp(8),
                          0);

                  addView(bar, params);
              }

              private void buildSideControls() {

                  LinearLayout controls =
                          new LinearLayout(getContext());

                  controls.setOrientation(
                          LinearLayout.VERTICAL);

                  controls.setGravity(
                          Gravity.CENTER);

                  controls.setPadding(
                          dp(4),
                          dp(4),
                          dp(4),
                          dp(4));

                  controls.setBackground(
                          roundedBackground(
                                  Color.argb(
                                          175,
                                          12,
                                          18,
                                          24),
                                  16));

                  TextView zoomIn =
                          createButton(
                                  "+",
                                  "Phóng to bản đồ");

                  zoomIn.setOnClickListener(
                          v -> navigationMap.zoomIn());

                  TextView zoomOut =
                          createButton(
                                  "−",
                                  "Thu nhỏ bản đồ");

                  zoomOut.setOnClickListener(
                          v -> navigationMap.zoomOut());

                  TextView recenter =
                          createButton(
                                  "◎",
                                  "Đưa bản đồ về vị trí hiện tại");

                  recenter.setOnClickListener(
                          v -> navigationMap.recenter());

                  controls.addView(
                          zoomIn,
                          new LinearLayout.LayoutParams(
                                  dp(46),
                                  dp(46)));

                  controls.addView(
                          zoomOut,
                          new LinearLayout.LayoutParams(
                                  dp(46),
                                  dp(46)));

                  controls.addView(
                          recenter,
                          new LinearLayout.LayoutParams(
                                  dp(46),
                                  dp(46)));

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  dp(56),
                                  dp(160),
                                  Gravity.END |
                                          Gravity.CENTER_VERTICAL);

                  params.setMargins(
                          0,
                          0,
                          dp(8),
                          0);

                  addView(controls, params);
              }

              private void buildBottomBar() {

                  LinearLayout bar =
                          new LinearLayout(getContext());

                  bar.setOrientation(
                          LinearLayout.HORIZONTAL);

                  bar.setGravity(
                          Gravity.CENTER);

                  bar.setPadding(
                          dp(6),
                          dp(4),
                          dp(6),
                          dp(4));

                  bar.setBackground(
                          roundedBackground(
                                  Color.argb(
                                          190,
                                          12,
                                          18,
                                          24),
                                  16));

                  addBottomItem(
                          bar,
                          "MAP",
                          "Bản đồ");

                  addBottomItem(
                          bar,
                          "SEARCH",
                          "Tìm kiếm");

                  addBottomItem(
                          bar,
                          "ROUTE",
                          "Tuyến đường");

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  LayoutParams.MATCH_PARENT,
                                  dp(54),
                                  Gravity.BOTTOM);

                  params.setMargins(
                          dp(8),
                          0,
                          dp(8),
                          dp(8));

                  addView(bar, params);
              }

              private void addBottomItem(
                      LinearLayout parent,
                      String label,
                      String description) {

                  TextView item =
                          new TextView(getContext());

                  item.setText(label);
                  item.setTextColor(Color.WHITE);
                  item.setTextSize(12);
                  item.setGravity(Gravity.CENTER);
                  item.setContentDescription(description);

                  parent.addView(
                          item,
                          new LinearLayout.LayoutParams(
                                  0,
                                  LayoutParams.MATCH_PARENT,
                                  1f));
              }
          }
          JAVA

          grep -Fq "package com.carassistant.v10;" "$FILE"
          grep -Fq "class NavigationPresentationLayer" "$FILE"
          grep -Fq "NavigationMapView navigationMap" "$FILE"
          grep -Fq "navigationMap.zoomIn()" "$FILE"
          grep -Fq "navigationMap.zoomOut()" "$FILE"
          grep -Fq "navigationMap.recenter()" "$FILE"

          echo "PASS: Presentation Layer created."

      # ============================================================
      # 10. PATCH V10LauncherActivity
      #
      # IMPORTANT:
      # - PHONE ACTIVITY ONLY
      # - Do NOT modify NavigationMapView
      # - Do NOT modify V10CarActivity
      # ============================================================
      - name: Attach Navigation to V10LauncherActivity
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"
          )

          text = path.read_text()

          # --------------------------------------------------------
          # IMPORT FrameLayout
          # --------------------------------------------------------
          old_import = (
              "import android.view.View;\n"
              "import android.widget.GridLayout;"
          )

          new_import = (
              "import android.view.View;\n"
              "import android.widget.FrameLayout;\n"
              "import android.widget.GridLayout;"
          )

          if "import android.widget.FrameLayout;" not in text:
              if old_import not in text:
                  raise SystemExit(
                      "ERROR: V10LauncherActivity import anchor not found."
                  )

              text = text.replace(
                  old_import,
                  new_import,
                  1
              )

          # --------------------------------------------------------
          # ROOT TYPE
          # --------------------------------------------------------
          old_field = "    private LinearLayout root;\n"

          new_field = "    private FrameLayout root;\n"

          if old_field not in text:
              raise SystemExit(
                  "ERROR: V10LauncherActivity root field anchor not found."
              )

          text = text.replace(
              old_field,
              new_field,
              1
          )

          # --------------------------------------------------------
          # NAVIGATION FIELDS
          # --------------------------------------------------------
          marker = (
              "    private LinearLayout dock;\n"
          )

          addition = (
              "    private LinearLayout dock;\n"
              "\n"
              "    // Phone Navigation Presentation\n"
              "    private NavigationMapView navigationMap;\n"
              "    private NavigationPresentationLayer navigationPresentationLayer;\n"
          )

          if "private NavigationMapView navigationMap;" not in text:
              if marker not in text:
                  raise SystemExit(
                      "ERROR: dock field anchor not found."
                  )

              text = text.replace(
                  marker,
                  addition,
                  1
              )

          # --------------------------------------------------------
          # LIFECYCLE
          # --------------------------------------------------------
          old_destroy = """    @Override
          protected void onDestroy() {

          handler.removeCallbacks(
                  clockTicker);

          super.onDestroy();
          }
          """

          new_destroy = """    @Override
          protected void onResume() {

          super.onResume();

          if (navigationMap != null) {
              navigationMap.onHostResume();
          }
          }

          @Override
          protected void onPause() {

          if (navigationMap != null) {
              navigationMap.onHostPause();
          }

          super.onPause();
          }

          @Override
          protected void onDestroy() {

          handler.removeCallbacks(
                  clockTicker);

          if (navigationMap != null) {
              navigationMap.onHostDestroy();
          }

          super.onDestroy();
          }
          """

          if "protected void onResume()" not in text:
              if old_destroy not in text:
                  raise SystemExit(
                      "ERROR: onDestroy() anchor not found."
                  )

              text = text.replace(
                  old_destroy,
                  new_destroy,
                  1
              )

          # --------------------------------------------------------
          # BUILD UI ROOT
          # --------------------------------------------------------
          old_root = """    private void buildUi() {

          root =
                  new LinearLayout(this);

          root.setOrientation(
                  LinearLayout.VERTICAL);

          root.setPadding(
                  dp(18),
                  dp(12),
                  dp(18),
                  dp(8));

          root.setBackgroundColor(
                  Color.rgb(
                          7,
                          9,
                          12));

          dashboard =
                  new LinearLayout(this);
          """

          new_root = """    private void buildUi() {

          root =
                  new FrameLayout(this);

          root.setBackgroundColor(
                  Color.rgb(
                          7,
                          9,
                          12));

          // ------------------------------------------------------
          // REAL NAVIGATION MAP
          // ------------------------------------------------------
          navigationMap =
                  new NavigationMapView(this);

          root.addView(
                  navigationMap,
                  new FrameLayout.LayoutParams(
                          -1,
                          -1));

          // ------------------------------------------------------
          // NAVIGATION PRESENTATION
          // ------------------------------------------------------
          navigationPresentationLayer =
                  new NavigationPresentationLayer(
                          this,
                          navigationMap);

          root.addView(
                  navigationPresentationLayer,
                  new FrameLayout.LayoutParams(
                          -1,
                          -1));

          // ------------------------------------------------------
          // EXISTING DASHBOARD
          // ------------------------------------------------------
          dashboard =
                  new LinearLayout(this);

          dashboard.setOrientation(
                  LinearLayout.VERTICAL);

          dashboard.setPadding(
                  dp(18),
                  dp(12),
                  dp(18),
                  dp(8));

          dashboard.setBackgroundColor(
                  Color.rgb(
                          7,
                          9,
                          12));

          """

          if "navigationMap =\n                new NavigationMapView(this);" not in text:
              if old_root not in text:
                  raise SystemExit(
                      "ERROR: V10LauncherActivity buildUi root anchor not found."
                  )

              text = text.replace(
                  old_root,
                  new_root,
                  1
              )

          # --------------------------------------------------------
          # Keep dashboard above the map.
          # The Navigation UI will be exposed through the dashboard
          # MAP area after the dashboard's MAP card is replaced.
          # --------------------------------------------------------

          # --------------------------------------------------------
          # REPLACE EXISTING FAKE MAP CARD
          # WITH REAL NAVIGATION CONTAINER
          # --------------------------------------------------------
          old_map = """        // MAP

          LinearLayout map =
                  card();

          map.addView(
                  text(
                          "MAP",
                          12,
                          Color.LTGRAY));

          TextView mapText =
                  text(
                          "Navigation",
                          28,
                          Color.WHITE);

          mapText.setGravity(
                  Gravity.CENTER);

          map.addView(
                  mapText,
                  new LinearLayout.LayoutParams(
                          -1,
                          0,
                          1));

          content.addView(
                  map,
                  new LinearLayout.LayoutParams(
                          -1,
                          0,
                          2));
          """

          new_map = """        // MAP
          //
          // NavigationMapView + NavigationPresentationLayer
          // are already hosted by the phone root.
          //
          // The dashboard must not cover the real navigation map.
          // Therefore the dashboard MAP area is transparent and
          // only provides the existing layout slot.

          LinearLayout map =
                  card();

          map.setBackgroundColor(
                  Color.TRANSPARENT);

          TextView mapLabel =
                  text(
                          "NAVIGATION",
                          12,
                          Color.LTGRAY);

          map.addView(
                  mapLabel,
                  new LinearLayout.LayoutParams(
                          -1,
                          dp(30)));

          content.addView(
                  map,
                  new LinearLayout.LayoutParams(
                          -1,
                          0,
                          2));
          """

          if "TextView mapText =" in text:
              if old_map not in text:
                  raise SystemExit(
                      "ERROR: Existing V10LauncherActivity MAP block not found."
                  )

              text = text.replace(
                  old_map,
                  new_map,
                  1
              )

          # --------------------------------------------------------
          # The dashboard itself would still cover the map.
          # Make dashboard background transparent and let the real
          # NavigationMapView remain visible.
          # --------------------------------------------------------
          text = text.replace(
              """          dashboard.setBackgroundColor(
                  Color.rgb(
                          7,
                          9,
                          12));
          """,
              """          dashboard.setBackgroundColor(
                  Color.TRANSPARENT);
          """,
              1
          )

          path.write_text(text)

          print("PASS: V10LauncherActivity patched.")
          print("PASS: Real NavigationMapView added to phone root.")
          print("PASS: NavigationPresentationLayer added to phone root.")
          print("PASS: Existing V10LauncherActivity retained.")
          PY

      # ============================================================
      # 11. VERIFY PHONE PATCH
      # ============================================================
      - name: Verify phone Presentation integration
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"

          grep -Fq "import android.widget.FrameLayout;" "$FILE"

          grep -Fq "private FrameLayout root;" "$FILE"
          grep -Fq "private NavigationMapView navigationMap;" "$FILE"
          grep -Fq "private NavigationPresentationLayer navigationPresentationLayer;" "$FILE"

          grep -Fq "navigationMap =" "$FILE"
          grep -Fq "new NavigationMapView(this)" "$FILE"

          grep -Fq "navigationPresentationLayer =" "$FILE"
          grep -Fq "new NavigationPresentationLayer" "$FILE"

          grep -Fq "navigationMap.onHostResume()" "$FILE"
          grep -Fq "navigationMap.onHostPause()" "$FILE"
          grep -Fq "navigationMap.onHostDestroy()" "$FILE"

          echo "PASS: Phone Navigation integration verified."

      # ============================================================
      # 12. VERIFY V10CarActivity WAS NOT MODIFIED
      # ============================================================
      - name: Verify Android Auto host remains untouched
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          if grep -Fq "NavigationPresentationLayer" "$FILE"; then
            echo "ERROR: Android Auto V10CarActivity was modified."
            exit 1
          fi

          echo "PASS: V10CarActivity untouched by Phone Presentation patch."

      # ============================================================
      # 13. VERIFY NAVIGATIONMAPVIEW SHA AFTER PATCH
      # ============================================================
      - name: Verify NavigationMapView unchanged
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          sha256sum "$FILE" | tee /tmp/navigation-map-after.sha256

          BEFORE="$(cut -d' ' -f1 /tmp/navigation-map-before.sha256)"
          AFTER="$(cut -d' ' -f1 /tmp/navigation-map-after.sha256)"

          echo "Before: $BEFORE"
          echo "After : $AFTER"

          if [ "$BEFORE" != "$AFTER" ]; then
            echo "ERROR: NavigationMapView was modified."
            exit 1
          fi

          echo "PASS: NavigationMapView byte-for-byte unchanged."

      # ============================================================
      # 14. VERIFY PRESENTATION LAYER DOES NOT CREATE NAV CORE
      # ============================================================
      - name: Verify Presentation Layer only
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationPresentationLayer.java"

          if grep -Eq "MapLibre|SpeechRecognizer|LocationManager|FusedLocation|Nominatim|OkHttp|Retrofit" "$FILE"; then
            echo "ERROR: Presentation Layer contains Navigation core/provider code."
            exit 1
          fi

          grep -Fq "NavigationMapView" "$FILE"
          grep -Fq "navigationMap.zoomIn()" "$FILE"
          grep -Fq "navigationMap.zoomOut()" "$FILE"
          grep -Fq "navigationMap.recenter()" "$FILE"

          echo "PASS: Presentation Layer is UI/delegation only."

      # ============================================================
      # 15. VERIFY ONLY EXPECTED JAVA FILES CHANGED
      # ============================================================
      - name: Verify patch scope
        shell: bash
        run: |
          set -euo pipefail

          echo "Changed files:"
          git status --short

          if git status --short | grep -E "NavigationMapView.java|V10CarActivity.java"; then
            echo "ERROR: Protected Navigation/AA file changed."
            exit 1
          fi

