name: Build Car Assistant V10-7A Task Persistence

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify V10 source
        shell: bash
        run: |
          set -euo pipefail
          test -d v10-source
          test -f v10-source/gradlew
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/RootView.java

      - name: Patch V10-6 floating key
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          ROOT="app/src/main/java/com/hieptran/aacast/doudou/RootView.java"

          python3 <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java")
          s = p.read_text(encoding="utf-8")

          imports = [
              "import android.content.SharedPreferences;",
              "import android.os.SystemClock;",
              "import android.view.MotionEvent;",
              "import android.view.ViewConfiguration;",
              "import android.view.ViewGroup;",
          ]

          marker = "import android.view.View;"
          for imp in imports:
              if imp not in s:
                  s = s.replace(marker, marker + "\n" + imp, 1)

          if "TextView floatingTouchKey;" not in s:
              marker = "private"
              idx = s.find(marker)
              if idx >= 0:
                  s = s[:idx] + """TextView floatingTouchKey;
          LinearLayout floatingMenu;
          long floatingLastTap;
          boolean floatingDragging;
          float floatingDownRawX;
          float floatingDownRawY;
          float floatingStartX;
          float floatingStartY;

          """ + s[idx:]

          if "createFloatingTouchKey()" not in s:
              attach = "attachProjection();"
              pos = s.find(attach)

              if pos < 0:
                  raise SystemExit("attachProjection() not found.")

              end = pos + len(attach)

              s = s[:end] + """
          createFloatingTouchKey();""" + s[end:]

              methods = r'''
          private void createFloatingTouchKey() {
              if (floatingTouchKey != null) return;

              floatingTouchKey = new TextView(this);
              floatingTouchKey.setText("●");
              floatingTouchKey.setTextSize(22f);
              floatingTouchKey.setGravity(android.view.Gravity.CENTER);
              floatingTouchKey.setBackgroundResource(android.R.drawable.btn_default);

              floatingTouchKey.setOnTouchListener((v, event) -> {
                  switch (event.getActionMasked()) {
                      case MotionEvent.ACTION_DOWN:
                          floatingDownRawX = event.getRawX();
                          floatingDownRawY = event.getRawY();
                          floatingStartX = v.getX();
                          floatingStartY = v.getY();
                          floatingDragging = false;
                          return true;

                      case MotionEvent.ACTION_MOVE:
                          float dx = event.getRawX() - floatingDownRawX;
                          float dy = event.getRawY() - floatingDownRawY;

                          if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
                              floatingDragging = true;
                          }

                          if (floatingDragging) {
                              v.setX(floatingStartX + dx);
                              v.setY(floatingStartY + dy);
                          }

                          return true;

                      case MotionEvent.ACTION_UP:
                          if (!floatingDragging) {
                              long now = SystemClock.uptimeMillis();

                              if (now - floatingLastTap
                                      < ViewConfiguration.getDoubleTapTimeout()) {
                                  floatingLastTap = 0;
                                  returnToLauncher();
                              } else {
                                  floatingLastTap = now;
                                  showFloatingMenu();
                              }
                          }

                          getSharedPreferences(
                                  "v10_floating_key",
                                  MODE_PRIVATE
                          ).edit()
                                  .putFloat("x", v.getX())
                                  .putFloat("y", v.getY())
                                  .apply();

                          return true;
                  }

                  return true;
              });

              addContentView(
                      floatingTouchKey,
                      new ViewGroup.LayoutParams(72, 72)
              );

              SharedPreferences p =
                      getSharedPreferences("v10_floating_key", MODE_PRIVATE);

              floatingTouchKey.setX(p.getFloat("x", 24f));
              floatingTouchKey.setY(p.getFloat("y", 120f));
          }

          private void showFloatingMenu() {
              if (floatingMenu != null) {
                  ViewGroup parent =
                          (ViewGroup) floatingMenu.getParent();

                  if (parent != null) {
                      parent.removeView(floatingMenu);
                  }

                  floatingMenu = null;
              }

              floatingMenu = new LinearLayout(this);
              floatingMenu.setOrientation(LinearLayout.VERTICAL);
              floatingMenu.setBackgroundResource(
                      android.R.drawable.dialog_holo_light_frame
              );

              addFloatingMenuButton(
                      "BACK",
                      this::handleControlBack
              );

              addFloatingMenuButton(
                      "RECENTS",
                      this::openSystemRecents
              );

              addFloatingMenuButton(
                      "2 SCREEN",
                      this::switchToTwoScreen
              );

              addFloatingMenuButton(
                      "3 SCREEN",
                      this::switchToThreeScreen
              );

              addContentView(
                      floatingMenu,
                      new ViewGroup.LayoutParams(
                              220,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                      )
              );

              floatingMenu.setX(floatingTouchKey.getX());
              floatingMenu.setY(
                      Math.max(
                              0f,
                              floatingTouchKey.getY() - 260f
                      )
              );
          }

          private void addFloatingMenuButton(
                  String text,
                  Runnable action
          ) {
              TextView b = new TextView(this);

              b.setText(text);
              b.setTextSize(16f);
              b.setGravity(android.view.Gravity.CENTER);
              b.setPadding(12, 14, 12, 14);
              b.setBackgroundResource(
                      android.R.drawable.btn_default
              );

              b.setOnClickListener(v -> {
                  hideFloatingMenu();
                  action.run();
              });

              floatingMenu.addView(
                      b,
                      new LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                      )
              );
          }

          private void hideFloatingMenu() {
              if (floatingMenu != null) {
                  ViewGroup parent =
                          (ViewGroup) floatingMenu.getParent();

                  if (parent != null) {
                      parent.removeView(floatingMenu);
                  }

                  floatingMenu = null;
              }
          }

          private void openSystemRecents() {
              RootShellSession.EXEC.execute(() -> {
                  RootShellSession shell =
                          new RootShellSession();

                  try {
                      shell.run(
                              8,
                              "/system/bin/input keyevent 187"
                      );
                  } catch (Exception ignored) {
                  } finally {
                      shell.destroy();
                  }
              });
          }

          private void switchToTwoScreen() {
              RootView root = RootView.getCurrent();

              if (root != null) {
                  root.setLayoutModeExternal(0);
              }
          }

          private void switchToThreeScreen() {
              RootView root = RootView.getCurrent();

              if (root != null) {
                  root.setLayoutModeExternal(2);
              }
          }
          '''

              s += methods

          p.write_text(s, encoding="utf-8")

          p = Path("app/src/main/java/com/hieptran/aacast/doudou/RootView.java")
          s = p.read_text(encoding="utf-8")

          if "setLayoutModeExternal(int mode)" not in s:
              anchor = "    public void applyLayoutMode(int mode)"
              idx = s.find(anchor)

              if idx < 0:
                  raise SystemExit(
                      "RootView applyLayoutMode anchor not found."
                  )

              method = '''    public void setLayoutModeExternal(int mode) {
                  final int targetMode = clamp(mode, 0, 5);

                  handler.post(() -> {
                      if (destroyed) return;

                      layoutMode = targetMode;
                      loadRatios();

                      prefs.edit()
                              .putInt("layout_mode_v3", layoutMode)
                              .apply();

                      applyVisibility();
                      container.requestLayout();
                      container.resizeAll();
                  });
              }

          '''

              s = s[:idx] + method + s[idx:]

          p.write_text(s, encoding="utf-8")
          PY

      - name: Patch V10-7A task persistence
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
          )

          text = path.read_text(encoding="utf-8")

          old = """            final String command =
                    "/system/bin/am force-stop '" + packageName + "'; "
                            + "/system/bin/am start"
                            + " --user " + userId
                            + " --display " + displayId
                            + " --windowingMode 1"
                            + " -a android.intent.action.MAIN"
                            + " -c android.intent.category.LAUNCHER"
                            + " -f 0x18000000"
                            + " -n '" + flat + "'";"""

          new = """            // V10-7A: reuse the existing application task.
            // Do not force-stop the target and do not use MULTIPLE_TASK.
            final String command =
                    "/system/bin/am start"
                            + " --user " + userId
                            + " --display " + displayId
                            + " --windowingMode 1"
                            + " -a android.intent.action.MAIN"
                            + " -c android.intent.category.LAUNCHER"
                            + " -f 0x10000000"
                            + " -n '" + flat + "'";"""

          if old not in text:
              raise SystemExit(
                  "Expected V10ProjectionSession launch command not found."
              )

          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

          print("V10-7A task persistence patch applied.")
          PY

      - name: Validate V10-7A
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          V10="app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          ROOT="app/src/main/java/com/hieptran/aacast/doudou/RootView.java"
          PROJECTION="app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          grep -q "createFloatingTouchKey" "$V10"
          grep -q "showFloatingMenu" "$V10"
          grep -q "openSystemRecents" "$V10"
          grep -q "switchToTwoScreen" "$V10"
          grep -q "switchToThreeScreen" "$V10"
          grep -q "setLayoutModeExternal(int mode)" "$ROOT"

          if grep -q "/system/bin/am force-stop" "$PROJECTION"; then
            echo "ERROR: force-stop still exists."
            exit 1
          fi

          if grep -q "0x18000000" "$PROJECTION"; then
            echo "ERROR: MULTIPLE_TASK flag still exists."
            exit 1
          fi

          grep -q "0x10000000" "$PROJECTION"
          grep -q "/system/bin/am start" "$PROJECTION"

          echo "V10-7A validation: PASSED"

      - name: Build debug APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload V10-7A APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-7A-Task-Persistence
          path: v10-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
