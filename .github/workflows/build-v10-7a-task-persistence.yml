name: Build Car Assistant V10-7A Task Persistence

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # V10-6 - FLOATING TOUCH KEY
      # ============================================================
      - name: Patch V10CarActivity
        shell: python
        run: |
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/"
              "com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          text = path.read_text()

          # --------------------------------------------------------
          # Imports
          # --------------------------------------------------------
          imports = [
              "import android.content.SharedPreferences;",
              "import android.os.SystemClock;",
              "import android.view.MotionEvent;",
              "import android.view.ViewConfiguration;",
              "import android.view.ViewGroup;",
          ]

          marker = "import android.view.View;"

          if marker not in text:
              raise SystemExit("Cannot find android.view.View import.")

          for imp in imports:
              if imp not in text:
                  text = text.replace(
                      marker,
                      marker + "\n" + imp,
                      1
                  )

          # --------------------------------------------------------
          # Fields
          # --------------------------------------------------------
          field_marker = "    private final RootShellSession shell"

          fields = [
              "    private TextView floatingTouchKey;",
              "    private LinearLayout floatingMenu;",
              "    private long floatingLastTap;",
              "    private boolean floatingDragging;",
              "    private float floatingDownRawX;",
              "    private float floatingDownRawY;",
              "    private float floatingStartX;",
              "    private float floatingStartY;",
          ]

          if "floatingTouchKey" not in text:
              if field_marker not in text:
                  raise SystemExit(
                      "Cannot find V10CarActivity field marker."
                  )

              text = text.replace(
                  field_marker,
                  "\n".join(fields) + "\n" + field_marker,
                  1
              )

          # --------------------------------------------------------
          # Floating-key methods
          #
          # Built line-by-line so YAML indentation cannot break.
          # --------------------------------------------------------
          if "private void createFloatingTouchKey()" not in text:

              attach_marker = "    private void attachProjection()"

              if attach_marker not in text:
                  raise SystemExit(
                      "Cannot find attachProjection marker."
                  )

              method_lines = [
                  "    private void createFloatingTouchKey() {",
                  "        if (floatingTouchKey != null) {",
                  "            return;",
                  "        }",
                  "",
                  "        final SharedPreferences prefs =",
                  "                getSharedPreferences(",
                  '                        "v10_floating_key",',
                  "                        MODE_PRIVATE);",
                  "",
                  "        floatingTouchKey = new TextView(this);",
                  '        floatingTouchKey.setText("●");',
                  "        floatingTouchKey.setTextSize(18f);",
                  "        floatingTouchKey.setGravity(Gravity.CENTER);",
                  "        floatingTouchKey.setClickable(true);",
                  "",
                  "        final int size =",
                  "                (int) (52 * getResources().getDisplayMetrics().density);",
                  "",
                  "        FrameLayout.LayoutParams lp =",
                  "                new FrameLayout.LayoutParams(size, size);",
                  "",
                  '        lp.leftMargin = prefs.getInt("x", 24);',
                  '        lp.topMargin = prefs.getInt("y", 180);',
                  "",
                  "        projectionLayer.addView(",
                  "                floatingTouchKey,",
                  "                lp);",
                  "",
                  "        floatingTouchKey.setOnTouchListener(",
                  "                (v, event) -> {",
                  "",
                  "                    FrameLayout.LayoutParams params =",
                  "                            (FrameLayout.LayoutParams)",
                  "                                    v.getLayoutParams();",
                  "",
                  "                    switch (event.getActionMasked()) {",
                  "",
                  "                        case MotionEvent.ACTION_DOWN:",
                  "                            floatingDragging = false;",
                  "                            floatingDownRawX = event.getRawX();",
                  "                            floatingDownRawY = event.getRawY();",
                  "                            floatingStartX = params.leftMargin;",
                  "                            floatingStartY = params.topMargin;",
                  "                            return true;",
                  "",
                  "                        case MotionEvent.ACTION_MOVE:",
                  "                            float dx =",
                  "                                    event.getRawX() - floatingDownRawX;",
                  "                            float dy =",
                  "                                    event.getRawY() - floatingDownRawY;",
                  "",
                  "                            if (Math.abs(dx) >",
                  "                                    ViewConfiguration.get(this).getScaledTouchSlop()",
                  "                                    || Math.abs(dy) >",
                  "                                    ViewConfiguration.get(this).getScaledTouchSlop()) {",
                  "                                floatingDragging = true;",
                  "                            }",
                  "",
                  "                            if (floatingDragging) {",
                  "                                params.leftMargin = (int) (floatingStartX + dx);",
                  "                                params.topMargin = (int) (floatingStartY + dy);",
                  "                                v.setLayoutParams(params);",
                  "                            }",
                  "",
                  "                            return true;",
                  "",
                  "                        case MotionEvent.ACTION_UP:",
                  "                            if (floatingDragging) {",
                  "                                prefs.edit()",
                  '                                        .putInt("x", params.leftMargin)',
                  '                                        .putInt("y", params.topMargin)',
                  "                                        .apply();",
                  "                                return true;",
                  "                            }",
                  "",
                  "                            long now = SystemClock.uptimeMillis();",
                  "",
                  "                            if (now - floatingLastTap < 350) {",
                  "                                floatingLastTap = 0;",
                  "                                hideFloatingMenu();",
                  "",
                  "                                RootShellSession.EXEC.execute(",
                  "                                        () -> {",
                  "                                            RootShellSession shell =",
                  "                                                    new RootShellSession();",
                  "                                            try {",
                  "                                                shell.run(",
                  "                                                        8,",
                  '                                                        "/system/bin/input keyevent 3");',
                  "                                            } catch (Exception ignored) {",
                  "                                            } finally {",
                  "                                                shell.destroy();",
                  "                                            }",
                  "                                        });",
                  "                            } else {",
                  "                                floatingLastTap = now;",
                  "                                showFloatingMenu();",
                  "                            }",
                  "",
                  "                            return true;",
                  "                    }",
                  "",
                  "                    return true;",
                  "                });",
                  "    }",
                  "",
                  "    private void showFloatingMenu() {",
                  "        if (floatingMenu != null) {",
                  "            return;",
                  "        }",
                  "",
                  "        floatingMenu = new LinearLayout(this);",
                  "        floatingMenu.setOrientation(LinearLayout.VERTICAL);",
                  "        floatingMenu.setPadding(8, 8, 8, 8);",
                  "",
                  "        FrameLayout.LayoutParams menuLp =",
                  "                new FrameLayout.LayoutParams(",
                  "                        ViewGroup.LayoutParams.WRAP_CONTENT,",
                  "                        ViewGroup.LayoutParams.WRAP_CONTENT);",
                  "",
                  "        menuLp.leftMargin = 24;",
                  "        menuLp.topMargin = 120;",
                  "",
                  "        projectionLayer.addView(floatingMenu, menuLp);",
                  "",
                  "        addFloatingMenuButton(",
                  '                "BACK",',
                  "                this::handleControlBack);",
                  "",
                  "        addFloatingMenuButton(",
                  '                "RECENTS",',
                  "                this::openSystemRecents);",
                  "",
                  "        addFloatingMenuButton(",
                  '                "2 SCREEN",',
                  "                this::switchToTwoScreen);",
                  "",
                  "        addFloatingMenuButton(",
                  '                "3 SCREEN",',
                  "                this::switchToThreeScreen);",
                  "    }",
                  "",
                  "    private void addFloatingMenuButton(",
                  "            String text,",
                  "            Runnable action) {",
                  "",
                  "        TextView button = new TextView(this);",
                  "        button.setText(text);",
                  "        button.setTextSize(14f);",
                  "        button.setGravity(Gravity.CENTER);",
                  "        button.setPadding(24, 14, 24, 14);",
                  "        button.setClickable(true);",
                  "",
                  "        button.setOnClickListener(",
                  "                v -> {",
                  "                    hideFloatingMenu();",
                  "                    action.run();",
                  "                });",
                  "",
                  "        floatingMenu.addView(button);",
                  "    }",
                  "",
                  "    private void hideFloatingMenu() {",
                  "        if (floatingMenu != null) {",
                  "            projectionLayer.removeView(floatingMenu);",
                  "            floatingMenu = null;",
                  "        }",
                  "    }",
                  "",
                  "    private void openSystemRecents() {",
                  "        RootShellSession.EXEC.execute(",
                  "                () -> {",
                  "                    RootShellSession shell =",
                  "                            new RootShellSession();",
                  "                    try {",
                  "                        shell.run(",
                  "                                8,",
                  '                                "/system/bin/input keyevent 187");',
                  "                    } catch (Exception ignored) {",
                  "                    } finally {",
                  "                        shell.destroy();",
                  "                    }",
                  "                });",
                  "    }",
                  "",
                  "    private void switchToTwoScreen() {",
                  "        RootView root = RootView.getCurrent();",
                  "        if (root != null) {",
                  "            root.setLayoutModeExternal(0);",
                  "        }",
                  "    }",
                  "",
                  "    private void switchToThreeScreen() {",
                  "        RootView root = RootView.getCurrent();",
                  "        if (root != null) {",
                  "            root.setLayoutModeExternal(2);",
                  "        }",
                  "    }",
                  "",
              ]

              methods = "\n".join(method_lines)

              text = text.replace(
                  attach_marker,
                  methods + "\n" + attach_marker,
                  1
              )

          # --------------------------------------------------------
          # Create floating key after texture is added.
          # --------------------------------------------------------
          if "createFloatingTouchKey();" not in text:

              projection_marker = (
                  "        projectionLayer.addView(texture);"
              )

              if projection_marker not in text:
                  raise SystemExit(
                      "Cannot find projectionLayer.addView(texture)."
                  )

              text = text.replace(
                  projection_marker,
                  projection_marker
                  + "\n        createFloatingTouchKey();",
                  1
              )

          path.write_text(text)

          print("V10-6 V10CarActivity patch applied.")

      # ============================================================
      # V10-6 - EXTERNAL LAYOUT MODE
      # ============================================================
      - name: Patch RootView
        shell: python
        run: |
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/"
              "com/hieptran/aacast/doudou/RootView.java"
          )

          text = path.read_text()

          if "setLayoutModeExternal" not in text:

              marker = "    public void reloadSettings()"

              if marker not in text:
                  raise SystemExit(
                      "Cannot find RootView reloadSettings marker."
                  )

              method_lines = [
                  "    public void setLayoutModeExternal(int mode) {",
                  "        final int targetMode = clamp(mode, 0, 5);",
                  "",
                  "        handler.post(() -> {",
                  "            if (destroyed) {",
                  "                return;",
                  "            }",
                  "",
                  "            layoutMode = targetMode;",
                  "            loadRatios();",
                  "",
                  "            prefs.edit()",
                  '                    .putInt("layout_mode_v3", layoutMode)',
                  "                    .apply();",
                  "",
                  "            applyVisibility();",
                  "            container.requestLayout();",
                  "            container.resizeAll();",
                  "        });",
                  "    }",
                  "",
              ]

              method = "\n".join(method_lines)

              text = text.replace(
                  marker,
                  method + marker,
                  1
              )

          path.write_text(text)

          print("RootView patch applied.")

      # ============================================================
      # V10-7A - TASK PERSISTENCE
      # ============================================================
      - name: Patch V10ProjectionSession
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path(
              "v10-source/app/src/main/java/"
              "com/hieptran/aacast/doudou/"
              "V10ProjectionSession.java"
          )

          text = path.read_text()

          # --------------------------------------------------------
          # Remove force-stop using regex.
          #
          # This matches the actual Java source regardless of
          # indentation.
          # --------------------------------------------------------
          pattern = re.compile(
              r'''(?m)^[ \t]*"/system/bin/am force-stop '"[ \t]*\n'''
              r'''[ \t]*\+[ \t]*packageName[ \t]*\n'''
              r'''[ \t]*\+[ \t]*"'; "[ \t]*\n'''
              r'''[ \t]*\+[ \t]*"/system/bin/am start"[ \t]*'''
          )

          text, count = pattern.subn(
              '                "/system/bin/am start"',
              text,
              count=1
          )

          if count == 1:
              print("Removed am force-stop.")
          elif "/system/bin/am force-stop" in text:
              raise SystemExit(
                  "force-stop exists but could not be patched."
              )
          else:
              print("am force-stop already absent.")

          # --------------------------------------------------------
          # Remove MULTIPLE_TASK flag.
          # --------------------------------------------------------
          if '0x18000000' in text:
              text = text.replace(
                  '0x18000000',
                  '0x10000000',
                  1
              )
              print(
                  "Changed 0x18000000 -> 0x10000000."
              )

          # --------------------------------------------------------
          # Verify.
          # --------------------------------------------------------
          if "/system/bin/am force-stop" in text:
              raise SystemExit(
                  "ERROR: am force-stop still exists."
              )

          if "0x18000000" in text:
              raise SystemExit(
                  "ERROR: 0x18000000 still exists."
              )

          if "/system/bin/am start" not in text:
              raise SystemExit(
                  "ERROR: am start missing."
              )

          if "0x10000000" not in text:
              raise SystemExit(
                  "ERROR: NEW_TASK flag missing."
              )

          path.write_text(text)

          print("V10-7A task persistence patch applied.")

      # ============================================================
      # FINAL VALIDATION
      # ============================================================
      - name: Verify all patches
        shell: python
        run: |
          from pathlib import Path

          base = Path(
              "v10-source/app/src/main/java/"
              "com/hieptran/aacast/doudou/"
          )

          activity = (
              base / "V10CarActivity.java"
          ).read_text()

          root = (
              base / "RootView.java"
          ).read_text()

          projection = (
              base / "V10ProjectionSession.java"
          ).read_text()

          # --------------------------------------------------------
          # V10-6
          # --------------------------------------------------------
          required_activity = [
              "floatingTouchKey",
              "floatingMenu",
              "createFloatingTouchKey",
              "openSystemRecents",
              "switchToTwoScreen",
              "switchToThreeScreen",
          ]

          for item in required_activity:
              if item not in activity:
                  raise SystemExit(
                      f"Missing V10-6 item: {item}"
                  )

          if "setLayoutModeExternal" not in root:
              raise SystemExit(
                  "Missing setLayoutModeExternal."
              )

          # --------------------------------------------------------
          # V10-7A
          # --------------------------------------------------------
          if "/system/bin/am force-stop" in projection:
              raise SystemExit(
                  "force-stop is still present."
              )

          if "0x18000000" in projection:
              raise SystemExit(
                  "MULTIPLE_TASK flag is still present."
              )

          if "/system/bin/am start" not in projection:
              raise SystemExit(
                  "am start is missing."
              )

          if "0x10000000" not in projection:
              raise SystemExit(
                  "NEW_TASK flag is missing."
              )

          print("")
          print("==========================================")
          print("V10-7A VERIFICATION PASSED")
          print("==========================================")
          print("Floating key              : OK")
          print("BACK                      : OK")
          print("RECENTS                   : OK")
          print("2 SCREEN                  : OK")
          print("3 SCREEN                  : OK")
          print("External layout           : OK")
          print("force-stop                : ABSENT")
          print("MULTIPLE_TASK             : ABSENT")
          print("NEW_TASK                  : PRESENT")
          print("==========================================")

      # ============================================================
      # BUILD
      # ============================================================
      - name: Build Debug APK
        working-directory: v10-source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      # ============================================================
      # ARTIFACT
      # ============================================================
      - name: Upload V10-7A APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-7A-Task-Persistence
          path: |
            v10-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
