name: Build Car Assistant V6.0-A.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create V6-A2 source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf v6-a2-source

          mkdir -p v6-a2-source/carapp/src/main/java/com/carassistant/v6
          mkdir -p v6-a2-source/carapp/src/main/res/xml
          mkdir -p v6-a2-source/system/src/main/java/com/carassistant/v6/system
          mkdir -p v6-a2-source/system/src/main/assets

          # 1. Root Settings Gradle
          cat > v6-a2-source/settings.gradle.kts <<'EOT'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "CarAssistantV6A2"

          include(":carapp")
          include(":system")
          EOT

          # 2. Root Build Gradle
          cat > v6-a2-source/build.gradle.kts <<'EOT'
          plugins {
              id("com.android.application") version "8.6.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOT

          # 3. Gradle Properties
          cat > v6-a2-source/gradle.properties <<'EOT'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOT

          # 4. Module CarApp Build Gradle
          cat > v6-a2-source/carapp/build.gradle.kts <<'EOT'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.carassistant.v6"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.carassistant.v6"
                  minSdk = 28
                  targetSdk = 35
                  versionCode = 602
                  versionName = "6.0-A.2"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.car.app:app:1.7.0")
          }
          EOT

          # 5. Module System Build Gradle (Dùng Maven thay vì jar thiếu)
          cat > v6-a2-source/system/build.gradle.kts <<'EOT'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.carassistant.v6.system"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.carassistant.v6.system"
                  minSdk = 28
                  targetSdk = 35
                  versionCode = 602
                  versionName = "6.0-A.2"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          dependencies {
              compileOnly("org.xposed:api:82")
          }
          EOT

          # 6. CarApp Source Files
          cat > v6-a2-source/carapp/src/main/java/com/carassistant/v6/V6CarAppService.kt <<'EOT'
          package com.carassistant.v6

          import androidx.car.app.CarAppService
          import androidx.car.app.Session
          import androidx.car.app.validation.HostValidator

          class V6CarAppService : CarAppService() {

              override fun createHostValidator(): HostValidator =
                  HostValidator.ALLOW_ALL_HOSTS_VALIDATOR

              override fun onCreateSession(): Session =
                  V6CarSession()
          }
          EOT

          cat > v6-a2-source/carapp/src/main/java/com/carassistant/v6/V6CarSession.kt <<'EOT'
          package com.carassistant.v6

          import android.content.Intent
          import android.graphics.Rect
          import androidx.car.app.AppManager
          import androidx.car.app.CarContext
          import androidx.car.app.Screen
          import androidx.car.app.Session
          import androidx.car.app.SurfaceCallback
          import androidx.car.app.SurfaceContainer
          import androidx.car.app.model.Pane
          import androidx.car.app.model.PaneTemplate
          import androidx.car.app.model.Row
          import androidx.car.app.model.Template

          class V6CarSession : Session() {

              override fun onCreateScreen(intent: Intent): Screen =
                  V6Screen(carContext)

              private class V6Screen(
                  carContext: CarContext
              ) : Screen(carContext), SurfaceCallback {

                  private var bridge: V6VirtualDisplayBridge? = null

                  init {
                      carContext
                          .getCarService(AppManager::class.java)
                          .setSurfaceCallback(this)
                  }

                  override fun onGetTemplate(): Template =
                      PaneTemplate.Builder(
                          Pane.Builder()
                              .addRow(
                                  Row.Builder()
                                      .setTitle("Car Assistant V6")
                                      .addText("Virtual Display initialization...")
                                      .build()
                              )
                              .build()
                      )
                          .setTitle("Car Assistant V6")
                          .build()

                  override fun onSurfaceAvailable(surfaceContainer: SurfaceContainer) {
                      bridge?.release()

                      bridge = V6VirtualDisplayBridge(
                          surfaceContainer.width,
                          surfaceContainer.height,
                          surfaceContainer.dpi
                      )

                      bridge?.create(surfaceContainer.surface)
                  }

                  override fun onSurfaceDestroyed(surfaceContainer: SurfaceContainer) {
                      bridge?.release()
                      bridge = null
                  }

                  override fun onVisibleAreaChanged(visibleArea: Rect) = Unit
                  override fun onStableAreaChanged(stableArea: Rect) = Unit
              }
          }
          EOT

          cat > v6-a2-source/carapp/src/main/java/com/carassistant/v6/V6VirtualDisplayBridge.kt <<'EOT'
          package com.carassistant.v6

          import android.os.IBinder
          import android.os.Parcel
          import android.view.Surface

          class V6VirtualDisplayBridge(
              private val width: Int,
              private val height: Int,
              private val dpi: Int
          ) {

              companion object {
                  private const val SERVICE_NAME = "v60a_vd_service"
                  private const val DESCRIPTOR = "com.v60a.virtualdisplay.ipc.IVirtualDisplayService"
                  private const val TRANSACTION_CREATE = IBinder.FIRST_CALL_TRANSACTION
                  private const val TRANSACTION_RELEASE = IBinder.FIRST_CALL_TRANSACTION + 1
              }

              private var binder: IBinder? = null

              fun create(surface: Surface): Int {
                  val service = getService()
                      ?: throw IllegalStateException("v60a_vd_service unavailable")

                  val data = Parcel.obtain()
                  val reply = Parcel.obtain()

                  try {
                      data.writeInterfaceToken(DESCRIPTOR)
                      data.writeInt(1)
                      surface.writeToParcel(data, 0)
                      data.writeInt(width)
                      data.writeInt(height)
                      data.writeInt(dpi)

                      if (!service.transact(TRANSACTION_CREATE, data, reply, 0)) {
                          throw IllegalStateException("create transaction failed")
                      }

                      reply.readException()
                      return reply.readInt()
                  } finally {
                      data.recycle()
                      reply.recycle()
                  }
              }

              fun release() {
                  val service = binder ?: return

                  val data = Parcel.obtain()
                  val reply = Parcel.obtain()

                  try {
                      data.writeInterfaceToken(DESCRIPTOR)
                      service.transact(TRANSACTION_RELEASE, data, reply, 0)
                      reply.readException()
                  } catch (_: Throwable) {
                  } finally {
                      data.recycle()
                      reply.recycle()
                      binder = null
                  }
              }

              private fun getService(): IBinder? {
                  binder?.let { return it }

                  return try {
                      val manager = Class.forName("android.os.ServiceManager")
                      val method = manager.getDeclaredMethod("getService", String::class.java)
                      val result = method.invoke(null, SERVICE_NAME) as? IBinder
                      binder = result
                      result
                  } catch (t: Throwable) {
                      throw IllegalStateException("Cannot access v60a_vd_service", t)
                  }
              }
          }
          EOT

          cat > v6-a2-source/carapp/src/main/java/com/carassistant/v6/LauncherActivity.kt <<'EOT'
          package com.carassistant.v6

          import android.app.Activity
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.LinearLayout
          import android.widget.TextView

          class LauncherActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.BLACK)
                  }

                  val title = TextView(this).apply {
                      text = "CAR ASSISTANT V6"
                      textSize = 28f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                  }

                  val status = TextView(this).apply {
                      text = "Virtual Display ONLINE"
                      textSize = 18f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                  }

                  root.addView(title, LinearLayout.LayoutParams(-1, -2))
                  root.addView(status, LinearLayout.LayoutParams(-1, -2))

                  setContentView(root)
              }
          }
          EOT

          # 7. Manifests & Configs
          cat > v6-a2-source/carapp/src/main/AndroidManifest.xml <<'EOT'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="androidx.car.app.ACCESS_SURFACE" />

              <application
                  android:allowBackup="false"
                  android:label="Car Assistant V6"
                  android:supportsRtl="true">

                  <meta-data
                      android:name="com.google.android.gms.car.application"
                      android:resource="@xml/automotive_app_desc" />

                  <activity
                      android:name=".LauncherActivity"
                      android:exported="true"
                      android:theme="@android:style/Theme.Material.Light.NoActionBar" />

                  <service
                      android:name=".V6CarAppService"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="androidx.car.app.CarAppService" />
                          <category android:name="androidx.car.app.category.NAVIGATION" />
                      </intent-filter>

                  </service>

              </application>

          </manifest>
          EOT

          cat > v6-a2-source/carapp/src/main/res/xml/automotive_app_desc.xml <<'EOT'
          <automotiveApp>
              <uses name="template" />
          </automotiveApp>
          EOT

          cat > v6-a2-source/system/src/main/AndroidManifest.xml <<'EOT'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="Car Assistant V6 System">

                  <meta-data
                      android:name="xposedmodule"
                      android:value="true" />

                  <meta-data
                      android:name="xposeddescription"
                      android:value="Car Assistant V6 System Hook" />

                  <meta-data
                      android:name="xposedminversion"
                      android:value="82" />

                  <meta-data
                      android:name="xposedscope"
                      android:value="android" />

              </application>

          </manifest>
          EOT

          # Bổ sung file Xposed Init bắt buộc
          cat > v6-a2-source/system/src/main/assets/xposed_init <<'EOT'
          com.carassistant.v6.system.SystemServerHook
          EOT

          # 8. Complete SystemServerHook.java (Đã fix lỗi cú pháp)
          cat > v6-a2-source/system/src/main/java/com/carassistant/v6/system/SystemServerHook.java <<'EOT'
          package com.carassistant.v6.system;

          import android.content.Context;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.os.Binder;
          import android.os.IBinder;
          import android.os.Parcel;
          import android.os.RemoteException;
          import android.view.Display;
          import android.view.Surface;

          import java.lang.reflect.Method;

          import de.robv.android.xposed.IXposedHookLoadPackage;
          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedBridge;
          import de.robv.android.xposed.XposedHelpers;
          import de.robv.android.xposed.callbacks.XC_LoadPackage;

          public final class SystemServerHook implements IXposedHookLoadPackage {

              private static final String SERVICE_NAME = "v60a_vd_service";
              private static final String DESCRIPTOR = "com.v60a.virtualdisplay.ipc.IVirtualDisplayService";

              private static final int TRANSACTION_CREATE = IBinder.FIRST_CALL_TRANSACTION;
              private static final int TRANSACTION_RELEASE = IBinder.FIRST_CALL_TRANSACTION + 1;

              private static volatile VirtualDisplay virtualDisplay;
              private static volatile int displayId = Display.DEFAULT_DISPLAY;

              @Override
              public void handleLoadPackage(XC_LoadPackage.LoadPackageParam lpparam) throws Throwable {
                  if (!"android".equals(lpparam.packageName)) {
                      return;
                  }

                  XposedHelpers.findAndHookMethod(
                          "com.android.server.SystemServer",
                          lpparam.classLoader,
                          "startOtherServices",
                          new XC_MethodHook() {
                              @Override
                              protected void afterHookedMethod(MethodHookParam param) throws Throwable {
                                  Context context = findSystemContext(param.thisObject);
                                  if (context != null) {
                                      publishService(context);
                                  }
                              }
                          });
              }

              private static Context findSystemContext(Object systemServer) {
                  try {
                      Class<?> cls = Class.forName("com.android.server.SystemServer");
                      Method getContext = cls.getDeclaredMethod("getSystemContext");
                      getContext.setAccessible(true);
                      return (Context) getContext.invoke(systemServer);
                  } catch (Throwable t) {
                      XposedBridge.log("CarAssistant V6: getSystemContext failed: " + t);
                      return null;
                  }
              }

              private static void publishService(Context context) {
                  try {
                      Class<?> sm = Class.forName("android.os.ServiceManager");
                      Method addService = sm.getDeclaredMethod("addService", String.class, IBinder.class);
                      addService.setAccessible(true);

                      Binder service = new Binder() {
                          @Override
                          protected boolean onTransact(int code, Parcel data, Parcel reply, int flags) throws RemoteException {
                              if (code == TRANSACTION_CREATE) {
                                  data.enforceInterface(DESCRIPTOR);
                                  Surface surface = null;
                                  if (data.readInt() != 0) {
                                      surface = Surface.CREATOR.createFromParcel(data);
                                  }
                                  int width = data.readInt();
                                  int height = data.readInt();
                                  int dpi = data.readInt();

                                  DisplayManager dm = (DisplayManager) context.getSystemService(Context.DISPLAY_SERVICE);
                                  if (dm != null && surface != null) {
                                      if (virtualDisplay != null) {
                                          virtualDisplay.release();
                                      }
                                      virtualDisplay = dm.createVirtualDisplay("V60A_VD", width, height, dpi, surface, 0);
                                      displayId = virtualDisplay.getDisplay().getDisplayId();
                                  }

                                  reply.writeNoException();
                                  reply.writeInt(displayId);
                                  return true;
                              } else if (code == TRANSACTION_RELEASE) {
                                  data.enforceInterface(DESCRIPTOR);
                                  if (virtualDisplay != null) {
                                      virtualDisplay.release();
                                      virtualDisplay = null;
                                  }
                                  reply.writeNoException();
                                  return true;
                              }
                              return super.onTransact(code, data, reply, flags);
                          }
                      };

                      addService.invoke(null, SERVICE_NAME, service);
                      XposedBridge.log("CarAssistant V6: Service published successfully!");
                  } catch (Throwable t) {
                      XposedBridge.log("CarAssistant V6: publishService failed: " + t);
                  }
              }
          }
          EOT

      - name: Build APKs
        run: |
          cd v6-a2-source
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V6-A2-APKs
          path: |
            v6-a2-source/carapp/build/outputs/apk/debug/*.apk
            v6-a2-source/system/build/outputs/apk/debug/*.apk
