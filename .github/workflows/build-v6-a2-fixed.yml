name: Build Car Assistant V6.0-A.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create V6-A2 source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf v6-a2-source

          mkdir -p v6-a2-source/libs
          mkdir -p v6-a2-source/carapp/src/main/java/com/carassistant/v6
          mkdir -p v6-a2-source/carapp/src/main/res/xml
          mkdir -p v6-a2-source/system/src/main/java/com/carassistant/v6/system
          mkdir -p v6-a2-source/system/src/main/assets

          # ============================================================
          # Download Xposed API 82 locally
          # ============================================================

          curl -fL \
            "https://repository-cdn.liferay.com/nexus/content/repositories/gradle-plugins/de/robv/android/xposed/api/82/api-82.jar" \
            -o v6-a2-source/libs/api-82.jar

          test -s v6-a2-source/libs/api-82.jar

          # ============================================================
          # settings.gradle.kts
          # ============================================================

          cat > v6-a2-source/settings.gradle.kts <<'EOT'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "CarAssistantV6A2"

          include(":carapp")
          include(":system")
          EOT

          # ============================================================
          # Root build.gradle.kts
          # ============================================================

          cat > v6-a2-source/build.gradle.kts <<'EOT'
          plugins {
              id("com.android.application") version "8.6.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOT

          # ============================================================
          # gradle.properties
          # ============================================================

          cat > v6-a2-source/gradle.properties <<'EOT'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOT

          # ============================================================
          # CAR APP build.gradle.kts
          # ============================================================

          cat > v6-a2-source/carapp/build.gradle.kts <<'EOT'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.carassistant.v6"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.carassistant.v6"
                  minSdk = 28
                  targetSdk = 35
                  versionCode = 602
                  versionName = "6.0-A.2"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.car.app:app:1.7.0")
          }
          EOT

          # ============================================================
          # SYSTEM build.gradle.kts
          # ============================================================

          cat > v6-a2-source/system/build.gradle.kts <<'EOT'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.carassistant.v6.system"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.carassistant.v6.system"
                  minSdk = 28
                  targetSdk = 35
                  versionCode = 602
                  versionName = "6.0-A.2"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          dependencies {
              compileOnly(files("../libs/api-82.jar"))
          }
          EOT

          # ============================================================
          # V6CarAppService.kt
          # ============================================================

          cat > v6-a2-source/carapp/src/main/java/com/carassistant/v6/V6CarAppService.kt <<'EOT'
          package com.carassistant.v6

          import androidx.car.app.CarAppService
          import androidx.car.app.Session
          import androidx.car.app.validation.HostValidator

          class V6CarAppService : CarAppService() {

              override fun createHostValidator(): HostValidator =
                  HostValidator.ALLOW_ALL_HOSTS_VALIDATOR

              override fun onCreateSession(): Session =
                  V6CarSession()
          }
          EOT

          # ============================================================
          # V6CarSession.kt
          # ============================================================

          cat > v6-a2-source/carapp/src/main/java/com/carassistant/v6/V6CarSession.kt <<'EOT'
          package com.carassistant.v6

          import android.content.Intent
          import android.view.Surface

          import androidx.car.app.AppManager
          import androidx.car.app.CarContext
          import androidx.car.app.Screen
          import androidx.car.app.Session
          import androidx.car.app.SurfaceCallback
          import androidx.car.app.SurfaceContainer

          import androidx.car.app.model.Action
          import androidx.car.app.model.Pane
          import androidx.car.app.model.PaneTemplate
          import androidx.car.app.model.Row
          import androidx.car.app.model.Template

          class V6CarSession : Session() {

              private var bridge: V6VirtualDisplayBridge? = null

              override fun onCreateScreen(intent: Intent): Screen {
                  return V6Screen(carContext)
              }

              private inner class V6Screen(
                  carContext: CarContext
              ) : Screen(carContext) {

                  init {
                      val appManager =
                          carContext.getCarService(AppManager::class.java)

                      appManager.setSurfaceCallback(
                          object : SurfaceCallback {

                              override fun onSurfaceAvailable(
                                  surfaceContainer: SurfaceContainer
                              ) {
                                  val surface: Surface =
                                      surfaceContainer.surface
                                          ?: return

                                  bridge?.release()

                                  bridge =
                                      V6VirtualDisplayBridge(
                                          carContext = carContext
                                      )

                                  bridge?.create(
                                      surface = surface,
                                      width = surfaceContainer.width,
                                      height = surfaceContainer.height,
                                      dpi = surfaceContainer.dpi
                                  )
                              }

                              override fun onSurfaceDestroyed(
                                  surfaceContainer: SurfaceContainer
                              ) {
                                  bridge?.release()
                                  bridge = null
                              }
                          }
                      )
                  }

                  override fun onGetTemplate(): Template {
                      return PaneTemplate.Builder(
                          Pane.Builder()
                              .addRow(
                                  Row.Builder()
                                      .setTitle("CAR ASSISTANT V6")
                                      .addText("Virtual Display bridge")
                                      .build()
                              )
                              .build()
                      )
                          .setTitle("Car Assistant V6")
                          .setHeaderAction(Action.APP_ICON)
                          .build()
                  }
              }
          }
          EOT

          # ============================================================
          # V6VirtualDisplayBridge.kt
          # ============================================================

          cat > v6-a2-source/carapp/src/main/java/com/carassistant/v6/V6VirtualDisplayBridge.kt <<'EOT'
          package com.carassistant.v6

          import android.os.IBinder
          import android.os.Parcel
          import android.view.Surface

          class V6VirtualDisplayBridge(
              private val carContext: android.content.Context
          ) {

              companion object {
                  private const val SERVICE_NAME =
                      "v60a_vd_service"

                  private const val DESCRIPTOR =
                      "com.v60a.virtualdisplay.ipc.IVirtualDisplayService"

                  private const val TRANSACTION_CREATE = 1
                  private const val TRANSACTION_RELEASE = 2
              }

              private fun getBinder(): IBinder? {
                  return try {
                      val manager =
                          Class.forName(
                              "android.os.ServiceManager"
                          )

                      val method =
                          manager.getDeclaredMethod(
                              "getService",
                              String::class.java
                          )

                      method.isAccessible = true

                      method.invoke(
                          null,
                          SERVICE_NAME
                      ) as? IBinder

                  } catch (_: Throwable) {
                      null
                  }
              }

              fun create(
                  surface: Surface,
                  width: Int,
                  height: Int,
                  dpi: Int
              ): Int {

                  val binder =
                      getBinder()
                          ?: return -1

                  val data =
                      Parcel.obtain()

                  val reply =
                      Parcel.obtain()

                  return try {

                      data.writeInterfaceToken(
                          DESCRIPTOR
                      )

                      data.writeInt(1)

                      surface.writeToParcel(
                          data,
                          0
                      )

                      data.writeInt(width)
                      data.writeInt(height)
                      data.writeInt(dpi)

                      binder.transact(
                          TRANSACTION_CREATE,
                          data,
                          reply,
                          0
                      )

                      reply.readException()

                      reply.readInt()

                  } catch (_: Throwable) {

                      -1

                  } finally {

                      data.recycle()
                      reply.recycle()
                  }
              }

              fun release() {

                  val binder =
                      getBinder()
                          ?: return

                  val data =
                      Parcel.obtain()

                  val reply =
                      Parcel.obtain()

                  try {

                      data.writeInterfaceToken(
                          DESCRIPTOR
                      )

                      binder.transact(
                          TRANSACTION_RELEASE,
                          data,
                          reply,
                          0
                      )

                      reply.readException()

                  } catch (_: Throwable) {

                  } finally {

                      data.recycle()
                      reply.recycle()
                  }
              }
          }
          EOT

          # ============================================================
          # LauncherActivity.kt
          # ============================================================

          cat > v6-a2-source/carapp/src/main/java/com/carassistant/v6/LauncherActivity.kt <<'EOT'
          package com.carassistant.v6

          import android.app.Activity
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.TextView

          class LauncherActivity : Activity() {

              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {
                  super.onCreate(savedInstanceState)

                  val text =
                      TextView(this).apply {

                          text = """
                              CAR ASSISTANT V6

                              Virtual Display ONLINE

                              Display ID: ${display?.displayId ?: -1}
                          """.trimIndent()

                          textSize = 28f

                          setTextColor(
                              Color.WHITE
                          )

                          setBackgroundColor(
                              Color.BLACK
                          )

                          gravity =
                              Gravity.CENTER
                      }

                  setContentView(text)
              }
          }
          EOT

          # ============================================================
          # Car App Manifest
          # ============================================================

          cat > v6-a2-source/carapp/src/main/AndroidManifest.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="androidx.car.app.ACCESS_SURFACE" />

              <application
                  android:allowBackup="false"
                  android:label="Car Assistant V6">

                  <meta-data
                      android:name="androidx.car.app.minCarApiLevel"
                      android:value="1" />

                  <service
                      android:name=".V6CarAppService"
                      android:exported="true">

                      <intent-filter>
                          <action
                              android:name="androidx.car.app.CarAppService" />
                      </intent-filter>

                      <meta-data
                          android:name="androidx.car.app"
                          android:resource="@xml/automotive_app_desc" />

                  </service>

                  <activity
                      android:name=".LauncherActivity"
                      android:exported="true" />

              </application>

          </manifest>
          EOT

          # ============================================================
          # Automotive app description
          # ============================================================

          cat > v6-a2-source/carapp/src/main/res/xml/automotive_app_desc.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>

          <automotiveApp>
              <uses name="template" />
          </automotiveApp>
          EOT

          # ============================================================
          # SYSTEM AndroidManifest.xml
          # ============================================================

          cat > v6-a2-source/system/src/main/AndroidManifest.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="Car Assistant V6 System">

                  <meta-data
                      android:name="xposedmodule"
                      android:value="true" />

                  <meta-data
                      android:name="xposeddescription"
                      android:value="Car Assistant V6 System Hook" />

                  <meta-data
                      android:name="xposedminversion"
                      android:value="82" />

                  <meta-data
                      android:name="xposedscope"
                      android:value="android" />

              </application>

          </manifest>
          EOT

          # ============================================================
          # Xposed entry point
          # ============================================================

          cat > v6-a2-source/system/src/main/assets/xposed_init <<'EOT'
          com.carassistant.v6.system.SystemServerHook
          EOT

          # ============================================================
          # SystemServerHook.java
          # ============================================================

          cat > v6-a2-source/system/src/main/java/com/carassistant/v6/system/SystemServerHook.java <<'EOT'
          package com.carassistant.v6.system;

          import android.content.Context;
          import android.content.Intent;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.os.Binder;
          import android.os.IBinder;
          import android.os.Parcel;
          import android.os.RemoteException;
          import android.view.Display;
          import android.view.Surface;

          import java.lang.reflect.Method;

          import de.robv.android.xposed.IXposedHookLoadPackage;
          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedBridge;
          import de.robv.android.xposed.XposedHelpers;
          import de.robv.android.xposed.callbacks.XC_LoadPackage;

          public class SystemServerHook
                  implements IXposedHookLoadPackage {

              private static final String TAG =
                      "CarAssistant V6";

              private static final String SERVICE_NAME =
                      "v60a_vd_service";

              private static final String DESCRIPTOR =
                      "com.v60a.virtualdisplay.ipc.IVirtualDisplayService";

              private static final int TRANSACTION_CREATE = 1;
              private static final int TRANSACTION_RELEASE = 2;

              private static VirtualDisplay virtualDisplay;

              private static int displayId =
                      Display.DEFAULT_DISPLAY;

              @Override
              public void handleLoadPackage(
                      XC_LoadPackage.LoadPackageParam lpparam) {

                  if (!"android".equals(
                          lpparam.packageName)) {
                      return;
                  }

                  XposedBridge.log(
                          TAG +
                          ": System framework loaded"
                  );

                  try {

                      hookSystemServer();

                  } catch (Throwable t) {

                      XposedBridge.log(
                              TAG +
                              ": hookSystemServer failed: "
                              + t
                      );
                  }
              }

              private static void hookSystemServer() {

                  XposedHelpers.findAndHookMethod(
                          "com.android.server.SystemServer",
                          null,
                          "startOtherServices",
                          new XC_MethodHook() {

                              @Override
                              protected void afterHookedMethod(
                                      MethodHookParam param) {

                                  try {

                                      Context context =
                                              findSystemContext(
                                                      param.thisObject
                                              );

                                      if (context != null) {
                                          publishService(context);
                                      }

                                  } catch (Throwable t) {

                                      XposedBridge.log(
                                              TAG +
                                              ": startOtherServices hook failed: "
                                              + t
                                      );
                                  }
                              }
                          }
                  );
              }

              private static Context findSystemContext(
                      Object systemServer) {

                  try {

                      Class<?> cls =
                              Class.forName(
                                      "com.android.server.SystemServer"
                              );

                      Method getContext =
                              cls.getDeclaredMethod(
                                      "getSystemContext"
                              );

                      getContext.setAccessible(true);

                      return (Context)
                              getContext.invoke(
                                      systemServer
                              );

                  } catch (Throwable t) {

                      XposedBridge.log(
                              TAG +
                              ": getSystemContext failed: "
                              + t
                      );

                      return null;
                  }
              }

              private static void publishService(
                      final Context context) {

                  try {

                      Class<?> sm =
                              Class.forName(
                                      "android.os.ServiceManager"
                              );

                      Method addService =
                              sm.getDeclaredMethod(
                                      "addService",
                                      String.class,
                                      IBinder.class
                              );

                      addService.setAccessible(true);

                      Binder service =
                              new Binder() {

                                  @Override
                                  protected boolean onTransact(
                                          int code,
                                          Parcel data,
                                          Parcel reply,
                                          int flags)
                                          throws RemoteException {

                                      if (code ==
                                              IBinder.INTERFACE_TRANSACTION) {

                                          reply.writeString(
                                                  DESCRIPTOR
                                          );

                                          return true;
                                      }

                                      if (code ==
                                              TRANSACTION_CREATE) {

                                          data.enforceInterface(
                                                  DESCRIPTOR
                                          );

                                          Surface surface =
                                                  null;

                                          if (data.readInt() != 0) {

                                              surface =
                                                      Surface.CREATOR
                                                              .createFromParcel(
                                                                      data
                                                              );
                                          }

                                          int width =
                                                  data.readInt();

                                          int height =
                                                  data.readInt();

                                          int dpi =
                                                  data.readInt();

                                          int result =
                                                  createVirtualDisplay(
                                                          context,
                                                          surface,
                                                          width,
                                                          height,
                                                          dpi
                                                  );

                                          reply.writeNoException();

                                          reply.writeInt(
                                                  result
                                          );

                                          return true;
                                      }

                                      if (code ==
                                              TRANSACTION_RELEASE) {

                                          data.enforceInterface(
                                                  DESCRIPTOR
                                          );

                                          releaseVirtualDisplay();

                                          reply.writeNoException();

                                          return true;
                                      }

                                      return super.onTransact(
                                              code,
                                              data,
                                              reply,
                                              flags
                                      );
                                  }
                              };

                      addService.invoke(
                              null,
                              SERVICE_NAME,
                              service
                      );

                      XposedBridge.log(
                              TAG +
                              ": service published successfully"
                      );

                  } catch (Throwable t) {

                      XposedBridge.log(
                              TAG +
                              ": publishService failed: "
                              + t
                      );
                  }
              }

              private static synchronized int
              createVirtualDisplay(
                      Context context,
                      Surface surface,
                      int width,
                      int height,
                      int dpi) {

                  try {

                      if (surface == null) {
                          return -1;
                      }

                      if (width <= 0) {
                          width = 1280;
                      }

                      if (height <= 0) {
                          height = 720;
                      }

                      if (dpi <= 0) {
                          dpi = 160;
                      }

                      DisplayManager dm =
                              (DisplayManager)
                                      context.getSystemService(
                                              Context.DISPLAY_SERVICE
                                      );

                      if (dm == null) {
                          return -1;
                      }

                      releaseVirtualDisplay();

                      int flags =
                              DisplayManager
                                      .VIRTUAL_DISPLAY_FLAG_PUBLIC
                              | DisplayManager
                                      .VIRTUAL_DISPLAY_FLAG_PRESENTATION
                              | DisplayManager
                                      .VIRTUAL_DISPLAY_FLAG_OWN_CONTENT_ONLY;

                      virtualDisplay =
                              dm.createVirtualDisplay(
                                      "V60A_VD",
                                      width,
                                      height,
                                      dpi,
                                      surface,
                                      flags
                              );

                      if (virtualDisplay == null) {

                          displayId =
                                  Display.DEFAULT_DISPLAY;

                          return -1;
                      }

                      Display display =
                              virtualDisplay.getDisplay();

                      if (display == null) {

                          virtualDisplay.release();

                          virtualDisplay = null;

                          displayId =
                                  Display.DEFAULT_DISPLAY;

                          return -1;
                      }

                      displayId =
                              display.getDisplayId();

                      XposedBridge.log(
                              TAG +
                              ": VirtualDisplay created id="
                              + displayId
                      );

                      launchLauncher(
                              context,
                              displayId
                      );

                      return displayId;

                  } catch (Throwable t) {

                      XposedBridge.log(
                              TAG +
                              ": createVirtualDisplay failed: "
                              + t
                      );

                      displayId =
                              Display.DEFAULT_DISPLAY;

                      return -1;
                  }
              }

              private static void launchLauncher(
                      Context context,
                      int targetDisplayId) {

                  try {

                      Intent intent =
                              new Intent();

                      intent.setComponent(
                              new android.content.ComponentName(
                                      "com.carassistant.v6",
                                      "com.carassistant.v6.LauncherActivity"
                              )
                      );

                      intent.addFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK
                                      | Intent.FLAG_ACTIVITY_CLEAR_TOP
                      );

                      Class<?> activityOptionsClass =
                              Class.forName(
                                      "android.app.ActivityOptions"
                              );

                      Method makeBasic =
                              activityOptionsClass
                                      .getDeclaredMethod(
                                              "makeBasic"
                                      );

                      Object options =
                              makeBasic.invoke(null);

                      Method setLaunchDisplayId =
                              activityOptionsClass
                                      .getDeclaredMethod(
                                              "setLaunchDisplayId",
                                              int.class
                                      );

                      setLaunchDisplayId.setAccessible(true);

                      setLaunchDisplayId.invoke(
                              options,
                              targetDisplayId
                      );

                      Method toBundle =
                              activityOptionsClass
                                      .getDeclaredMethod(
                                              "toBundle"
                                      );

                      Object bundle =
                              toBundle.invoke(options);

                      Class<?> activityTaskManager =
                              Class.forName(
                                      "android.app.ActivityTaskManager"
                              );

                      Method getService =
                              activityTaskManager
                                      .getDeclaredMethod(
                                              "getService"
                                      );

                      Object atm =
                              getService.invoke(null);

                      Class<?> userHandleClass =
                              Class.forName(
                                      "android.os.UserHandle"
                              );

                      Object userHandle =
                              userHandleClass
                                      .getDeclaredConstructor(
                                              int.class
                                      )
                                      .newInstance(0);

                      Method startActivity =
                              null;

                      /*
                       * Do NOT reference IApplicationThread
                       * directly. It is a hidden framework type
                       * and is not available in the compile SDK.
                       */
                      for (Method candidate :
                              atm.getClass().getMethods()) {

                          if (!"startActivityAsUser".equals(
                                  candidate.getName())) {
                              continue;
                          }

                          Class<?>[] p =
                                  candidate.getParameterTypes();

                          boolean hasApplicationThread =
                                  false;

                          boolean hasIntent =
                                  false;

                          boolean hasUserHandle =
                                  false;

                          boolean hasBundle =
                                  false;

                          for (Class<?> type : p) {

                              String name =
                                      type.getName();

                              if ("android.app.IApplicationThread"
                                      .equals(name)) {

                                  hasApplicationThread =
                                          true;

                              } else if (
                                      Intent.class.getName()
                                              .equals(name)) {

                                  hasIntent = true;

                              } else if (
                                      userHandleClass.getName()
                                              .equals(name)) {

                                  hasUserHandle = true;

                              } else if (
                                      android.os.Bundle.class
                                              .getName()
                                              .equals(name)) {

                                  hasBundle = true;
                              }
                          }

                          if (hasApplicationThread
                                  && hasIntent
                                  && hasUserHandle
                                  && hasBundle) {

                              startActivity =
                                      candidate;

                              break;
                          }
                      }

                      if (startActivity == null) {

                          XposedBridge.log(
                                  TAG +
                                  ": compatible startActivityAsUser not found"
                          );

                          return;
                      }

                      Class<?>[] types =
                              startActivity
                                      .getParameterTypes();

                      Object[] args =
                              new Object[types.length];

                      boolean callingPackageAssigned =
                              false;

                      for (int i = 0;
                           i < types.length;
                           i++) {

                          Class<?> type =
                                  types[i];

                          String typeName =
                                  type.getName();

                          if ("android.app.IApplicationThread"
                                  .equals(typeName)) {

                              args[i] = null;

                          } else if (
                                  Intent.class.getName()
                                          .equals(typeName)) {

                              args[i] = intent;

                          } else if (
                                  userHandleClass.getName()
                                          .equals(typeName)) {

                              args[i] = userHandle;

                          } else if (
                                  android.os.Bundle.class
                                          .getName()
                                          .equals(typeName)) {

                              args[i] = bundle;

                          } else if (
                                  type == String.class) {

                              if (!callingPackageAssigned) {

                                  args[i] =
                                          "com.carassistant.v6";

                                  callingPackageAssigned =
                                          true;

                              } else {

                                  args[i] = null;
                              }

                          } else if (
                                  type == int.class) {

                              args[i] = 0;

                          } else if (
                                  type == long.class) {

                              args[i] = 0L;

                          } else if (
                                  type == boolean.class) {

                              args[i] = false;

                          } else {

                              args[i] = null;
                          }
                      }

                      startActivity.setAccessible(
                              true
                      );

                      Object result =
                              startActivity.invoke(
                                      atm,
                                      args
                              );

                      XposedBridge.log(
                              TAG +
                              ": Launcher launch requested on display "
                              + targetDisplayId
                              + ", result="
                              + result
                      );

                  } catch (Throwable t) {

                      XposedBridge.log(
                              TAG +
                              ": launchLauncher failed: "
                              + t
                      );
                  }
              }

              private static synchronized void
              releaseVirtualDisplay() {

                  try {

                      if (virtualDisplay != null) {

                          virtualDisplay.release();

                          virtualDisplay = null;
                      }

                      displayId =
                              Display.DEFAULT_DISPLAY;

                  } catch (Throwable t) {

                      XposedBridge.log(
                              TAG +
                              ": releaseVirtualDisplay failed: "
                              + t
                      );
                  }
              }
          }
