name: Build Car Assistant V6.0-A.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create V6-A2 source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf v6-a2-source
          mkdir -p v6-a2-source/carapp/src/main/java/com/carassistant/v6
          mkdir -p v6-a2-source/carapp/src/main/res/xml
          mkdir -p v6-a2-source/system/src/main/java/com/carassistant/v6/system
          mkdir -p v6-a2-source/system/src/main/assets
          mkdir -p v6-a2-source/libs

          cat > v6-a2-source/settings.gradle.kts <<'EOT'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CarAssistantV6A2"
          include(":carapp")
          include(":system")
          EOT

          cat > v6-a2-source/build.gradle.kts <<'EOT'
          plugins {
              id("com.android.application") version "8.6.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOT

          cat > v6-a2-source/gradle.properties <<'EOT'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOT

          cat > v6-a2-source/carapp/build.gradle.kts <<'EOT'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.carassistant.v6"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.carassistant.v6"
                  minSdk = 28
                  targetSdk = 35
                  versionCode = 602
                  versionName = "6.0-A.2"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.car.app:app:1.7.0")
          }
          EOT

          cat > v6-a2-source/system/build.gradle.kts <<'EOT'
          plugins {
              id("com.android.application")
          }
          android {
              namespace = "com.carassistant.v6.system"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.carassistant.v6.system"
                  minSdk = 28
                  targetSdk = 35
                  versionCode = 602
                  versionName = "6.0-A.2"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          dependencies {
              compileOnly(files("../libs/api-82.jar"))
          }
          EOT

          cat > v6-a2-source/carapp/src/main/java/com/carassistant/v6/V6CarAppService.kt <<'EOT'
          package com.carassistant.v6

          import androidx.car.app.CarAppService
          import androidx.car.app.Session
          import androidx.car.app.validation.HostValidator

          class V6CarAppService : CarAppService() {
              override fun createHostValidator(): HostValidator =
                  HostValidator.ALLOW_ALL_HOSTS_VALIDATOR

              override fun onCreateSession(): Session = V6CarSession()
          }
          EOT

          cat > v6-a2-source/carapp/src/main/java/com/carassistant/v6/V6CarSession.kt <<'EOT'
          package com.carassistant.v6

          import android.content.Intent
          import android.graphics.Rect
          import androidx.car.app.AppManager
          import androidx.car.app.CarContext
          import androidx.car.app.Screen
          import androidx.car.app.Session
          import androidx.car.app.SurfaceCallback
          import androidx.car.app.SurfaceContainer
          import androidx.car.app.model.Pane
          import androidx.car.app.model.PaneTemplate
          import androidx.car.app.model.Row
          import androidx.car.app.model.Template

          class V6CarSession : Session() {
              override fun onCreateScreen(intent: Intent): Screen =
                  V6Screen(carContext)

              private class V6Screen(carContext: CarContext) :
                  Screen(carContext), SurfaceCallback {

                  private var bridge: V6VirtualDisplayBridge? = null

                  init {
                      carContext.getCarService(AppManager::class.java)
                          .setSurfaceCallback(this)
                  }

                  override fun onGetTemplate(): Template =
                      PaneTemplate.Builder(
                          Pane.Builder()
                              .addRow(
                                  Row.Builder()
                                      .setTitle("Car Assistant V6")
                                      .addText("Virtual Display initialization...")
                                      .build()
                              ).build()
                      ).setTitle("Car Assistant V6").build()

                  override fun onSurfaceAvailable(
                      surfaceContainer: SurfaceContainer
                  ) {
                      bridge?.release()
                      bridge = V6VirtualDisplayBridge(
                          surfaceContainer.width,
                          surfaceContainer.height,
                          surfaceContainer.dpi
                      )
                      bridge?.create(surfaceContainer.surface)
                  }

                  override fun onSurfaceDestroyed(
                      surfaceContainer: SurfaceContainer
                  ) {
                      bridge?.release()
                      bridge = null
                  }

                  override fun onVisibleAreaChanged(visibleArea: Rect) = Unit
                  override fun onStableAreaChanged(stableArea: Rect) = Unit
              }
          }
          EOT

          cat > v6-a2-source/carapp/src/main/java/com/carassistant/v6/V6VirtualDisplayBridge.kt <<'EOT'
          package com.carassistant.v6

          import android.os.IBinder
          import android.os.Parcel
          import android.view.Surface

          class V6VirtualDisplayBridge(
              private val width: Int,
              private val height: Int,
              private val dpi: Int
          ) {
              companion object {
                  private const val SERVICE_NAME = "v60a_vd_service"
                  private const val DESCRIPTOR =
                      "com.v60a.virtualdisplay.ipc.IVirtualDisplayService"
                  private const val TRANSACTION_CREATE =
                      IBinder.FIRST_CALL_TRANSACTION
                  private const val TRANSACTION_RELEASE =
                      IBinder.FIRST_CALL_TRANSACTION + 1
              }

              private var binder: IBinder? = null

              fun create(surface: Surface): Int {
                  val service = getService()
                      ?: throw IllegalStateException("v60a_vd_service unavailable")
                  val data = Parcel.obtain()
                  val reply = Parcel.obtain()
                  try {
                      data.writeInterfaceToken(DESCRIPTOR)
                      data.writeInt(1)
                      surface.writeToParcel(data, 0)
                      data.writeInt(width)
                      data.writeInt(height)
                      data.writeInt(dpi)
                      if (!service.transact(TRANSACTION_CREATE, data, reply, 0)) {
                          throw IllegalStateException("create transaction failed")
                      }
                      reply.readException()
                      return reply.readInt()
                  } finally {
                      data.recycle()
                      reply.recycle()
                  }
              }

              fun release() {
                  val service = binder ?: return
                  val data = Parcel.obtain()
                  val reply = Parcel.obtain()
                  try {
                      data.writeInterfaceToken(DESCRIPTOR)
                      service.transact(TRANSACTION_RELEASE, data, reply, 0)
                      reply.readException()
                  } catch (_: Throwable) {
                  } finally {
                      data.recycle()
                      reply.recycle()
                      binder = null
                  }
              }

              private fun getService(): IBinder? {
                  binder?.let { return it }
                  return try {
                      val manager = Class.forName("android.os.ServiceManager")
                      val method = manager.getDeclaredMethod(
                          "getService", String::class.java
                      )
                      val result = method.invoke(null, SERVICE_NAME) as? IBinder
                      binder = result
                      result
                  } catch (t: Throwable) {
                      throw IllegalStateException("Cannot access v60a_vd_service", t)
                  }
              }
          }
          EOT

          cat > v6-a2-source/carapp/src/main/java/com/carassistant/v6/LauncherActivity.kt <<'EOT'
          package com.carassistant.v6

          import android.app.Activity
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.LinearLayout
          import android.widget.TextView

          class LauncherActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.BLACK)
                  }
                  val title = TextView(this).apply {
                      text = "CAR ASSISTANT V6"
                      textSize = 28f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                  }
                  val status = TextView(this).apply {
                      text = "Virtual Display ONLINE"
                      textSize = 18f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                  }
                  root.addView(title, LinearLayout.LayoutParams(-1, -2))
                  root.addView(status, LinearLayout.LayoutParams(-1, -2))
                  setContentView(root)
              }
          }
          EOT

          cat > v6-a2-source/carapp/src/main/AndroidManifest.xml <<'EOT'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="androidx.car.app.ACCESS_SURFACE" />
              <application
                  android:allowBackup="false"
                  android:label="Car Assistant V6"
                  android:supportsRtl="true">
                  <meta-data
                      android:name="com.google.android.gms.car.application"
                      android:resource="@xml/automotive_app_desc" />
                  <activity
                      android:name=".LauncherActivity"
                      android:exported="true"
                      android:theme="@android:style/Theme.Material.Light.NoActionBar" />
                  <service
                      android:name=".V6CarAppService"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="androidx.car.app.CarAppService" />
                          <category android:name="androidx.car.app.category.NAVIGATION" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOT

          cat > v6-a2-source/carapp/src/main/res/xml/automotive_app_desc.xml <<'EOT'
          <automotiveApp>
              <uses name="template" />
          </automotiveApp>
          EOT

          cat > v6-a2-source/system/src/main/AndroidManifest.xml <<'EOT'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:label="Car Assistant V6 System"
                  android:description="Car Assistant V6 System Hook">
                  <meta-data android:name="xposedmodule" android:value="true" />
                  <meta-data
                      android:name="xposeddescription"
                      android:value="Car Assistant V6 System Hook" />
                  <meta-data android:name="xposedminversion" android:value="82" />
                  <meta-data android:name="xposedscope" android:value="android" />
              </application>
          </manifest>
          EOT

          cat > v6-a2-source/system/src/main/java/com/carassistant/v6/system/SystemServerHook.java <<'EOT'
          package com.carassistant.v6.system;

          import android.app.ActivityOptions;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.os.Binder;
          import android.os.IBinder;
          import android.os.Parcel;
          import android.os.RemoteException;
          import android.view.Display;
          import android.view.Surface;
          import java.lang.reflect.Method;
          import de.robv.android.xposed.IXposedHookLoadPackage;
          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedBridge;
          import de.robv.android.xposed.XposedHelpers;
          import de.robv.android.xposed.callbacks.XC_LoadPackage;

          public final class SystemServerHook implements IXposedHookLoadPackage {
              private static final String SERVICE_NAME = "v60a_vd_service";
              private static final String DESCRIPTOR =
                      "com.v60a.virtualdisplay.ipc.IVirtualDisplayService";
              private static final int TRANSACTION_CREATE = IBinder.FIRST_CALL_TRANSACTION;
              private static final int TRANSACTION_RELEASE = IBinder.FIRST_CALL_TRANSACTION + 1;
              private static volatile VirtualDisplay virtualDisplay;
              private static volatile int displayId = Display.DEFAULT_DISPLAY;

              @Override
              public void handleLoadPackage(XC_LoadPackage.LoadPackageParam lpparam)
                      throws Throwable {
                  if (!"android".equals(lpparam.packageName)) return;

                  XposedHelpers.findAndHookMethod(
                      "com.android.server.SystemServer",
                      lpparam.classLoader,
                      "startOtherServices",
                      new XC_MethodHook() {
                          @Override
                          protected void afterHookedMethod(MethodHookParam param)
                                  throws Throwable {
                              Context context = findSystemContext(param.thisObject);
                              if (context != null) publishService(context);
                          }
                      });
              }

              private static Context findSystemContext(Object systemServer) {
                  try {
                      Class<?> cls = Class.forName("com.android.server.SystemServer");
                      Method getContext = cls.getDeclaredMethod("getSystemContext");
                      getContext.setAccessible(true);
                      return (Context) getContext.invoke(systemServer);
                  } catch (Throwable t) {
                      XposedBridge.log(
                          "CarAssistant V6: getSystemContext failed: " + t);
                      return null;
                  }
              }

              private static void publishService(Context context) {
                  try {
                      Class<?> sm = Class.forName("android.os.ServiceManager");
                      Method addService = sm.getDeclaredMethod(
                          "addService", String.class, IBinder.class);
                      addService.setAccessible(true);

                      Binder service = new Binder() {
                          @Override
                          protected boolean onTransact(
                                  int code, Parcel data, Parcel reply, int flags)
                                  throws RemoteException {
                              if (code == INTERFACE_TRANSACTION) {
                                  reply.writeString(DESCRIPTOR);
                                  return true;
                              }

                              data.enforceInterface(DESCRIPTOR);

                              if (code == TRANSACTION_CREATE) {
                                  Surface surface = null;
                                  if (data.readInt() != 0) {
                                      surface = Surface.CREATOR.createFromParcel(data);
                                  }
                                  int width = data.readInt();
                                  int height = data.readInt();
                                  int dpi = data.readInt();
                                  try {
                                      int id = createDisplay(
                                          context, surface, width, height, dpi);
                                      reply.writeNoException();
                                      reply.writeInt(id);
                                  } catch (Throwable t) {
                                      Exception e = (t instanceof Exception)
                                          ? (Exception)t : new RuntimeException(t);
                                      reply.writeException(e);
                                  }
                                  return true;
                              }

                              if (code == TRANSACTION_RELEASE) {
                                  releaseDisplay();
                                  reply.writeNoException();
                                  return true;
                              }

                              return super.onTransact(code, data, reply, flags);
                          }
                      };

                      // Deliberately no Binder.attachInterface().
                      addService.invoke(null, SERVICE_NAME, service);
                      XposedBridge.log(
                          "CarAssistant V6: Binder service published");
                  } catch (Throwable t) {
                      XposedBridge.log(
                          "CarAssistant V6: publish failed: " + t);
                  }
              }

              private static synchronized int createDisplay(
                      Context context, Surface surface,
                      int width, int height, int dpi) throws Exception {
                  releaseDisplay();

                  DisplayManager dm = (DisplayManager) context.getSystemService(
                      Context.DISPLAY_SERVICE);
                  if (dm == null) {
                      throw new IllegalStateException("DisplayManager unavailable");
                  }

                  int flags = DisplayManager.VIRTUAL_DISPLAY_FLAG_PUBLIC
                      | DisplayManager.VIRTUAL_DISPLAY_FLAG_PRESENTATION
                      | DisplayManager.VIRTUAL_DISPLAY_FLAG_OWN_CONTENT_ONLY;

                  virtualDisplay = dm.createVirtualDisplay(
                      "CarAssistant-V6", width, height, dpi, surface, flags);
                  if (virtualDisplay == null) {
                      throw new IllegalStateException(
                          "createVirtualDisplay returned null");
                  }

                  displayId = virtualDisplay.getDisplay().getDisplayId();
                  XposedBridge.log(
                      "CarAssistant V6: VirtualDisplay created, id=" + displayId);
                  launchLauncher(context, displayId);
                  return displayId;
              }

              private static synchronized void releaseDisplay() {
                  VirtualDisplay vd = virtualDisplay;
                  virtualDisplay = null;
                  displayId = Display.DEFAULT_DISPLAY;
                  if (vd != null) {
                      try { vd.release(); } catch (Throwable ignored) { }
                  }
              }

              private static void launchLauncher(
                      Context context, int targetDisplayId) throws Exception {
                  Intent intent = new Intent();
                  intent.setComponent(new ComponentName(
                      "com.carassistant.v6",
                      "com.carassistant.v6.LauncherActivity"));
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);

                  ActivityOptions options = ActivityOptions.makeBasic();
                  options.setLaunchDisplayId(targetDisplayId);

                  context.startActivity(intent, options.toBundle());
                  XposedBridge.log(
                      "CarAssistant V6: Launcher requested on display="
                      + targetDisplayId);
              }
          }
          EOT

          printf '%s\n' 'com.carassistant.v6.system.SystemServerHook' \
            > v6-a2-source/system/src/main/assets/xposed_init

          curl -fL \
            "https://repository-cdn.liferay.com/nexus/content/repositories/gradle-plugins/de/robv/android/xposed/api/82/api-82.jar" \
            -o v6-a2-source/libs/api-82.jar

          test -s v6-a2-source/libs/api-82.jar
          ! grep -R "UserHandle\.of" v6-a2-source/system/src/main/java
          ! grep -R "UserHandle\.CURRENT" v6-a2-source/system/src/main/java
          ! grep -R "attachInterface" v6-a2-source/system/src/main/java

      - name: Build V6-A2
        shell: bash
        run: |
          set -euo pipefail
          cd v6-a2-source
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          ./gradlew :carapp:assembleDebug :system:assembleDebug --stacktrace --info

      - name: Verify V6-A2 System APK
        shell: bash
        run: |
          set -euo pipefail
          APK="v6-a2-source/system/build/outputs/apk/debug/system-debug.apk"
          test -s "$APK"

          unzip -l "$APK" | grep -q 'assets/xposed_init$'
          ENTRY="$(unzip -p "$APK" assets/xposed_init | tr -d '\r' | head -n 1)"
          test "$ENTRY" = "com.carassistant.v6.system.SystemServerHook"

          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          test -n "$AAPT2"
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml > manifest.txt

          grep -q "xposedmodule" manifest.txt
          grep -q "xposeddescription" manifest.txt
          grep -q "xposedminversion" manifest.txt
          grep -q "xposedscope" manifest.txt
          grep -q 'value.*"true"' manifest.txt
          grep -q 'value.*"82"' manifest.txt
          grep -q 'value.*"android"' manifest.txt

          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -p "$APK" classes.dex > classes.dex
          strings classes.dex | grep -q 'com/carassistant/v6/system/SystemServerHook'
          strings classes.dex | grep -q 'de/robv/android/xposed/'

          echo "V6-A2 System APK verification: PASS"

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp v6-a2-source/carapp/build/outputs/apk/debug/carapp-debug.apk \
            output/CarAssistant-V6-A2-CarApp.apk
          cp v6-a2-source/system/build/outputs/apk/debug/system-debug.apk \
            output/CarAssistant-V6-A2-System.apk
          cd v6-a2-source
          zip -r ../output/CarAssistant-V6-A2-source.zip . \
            -x "*.gradle-cache*" -x "*/build/*"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V6-A2
          path: output/
