name: Build Car Assistant V10-6A Persistence 3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore V10-6A source baseline
        shell: bash
        run: |
          set -euo pipefail

          BASELINE="9075636a7d5947c1b0eee49c2bd3fd0e1b6b0cf1"

          echo "Restoring V10-6A source:"
          echo "$BASELINE"

          git fetch origin "$BASELINE" --depth=1
          git checkout "$BASELINE" -- v10-source

          test -f "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
          test -f "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          test -f "v10-source/app/src/main/java/com/hieptran/aacast/doudou/RootView.java"

          if [ -f "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java" ]; then
            echo "ERROR: V10ProjectionService.java exists."
            echo "This is NOT the V10-6A architecture."
            exit 1
          fi

          echo "V10-6A source baseline restored successfully."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check source files
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          test -f app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java
          test -f app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java
          test -f app/src/main/java/com/hieptran/aacast/doudou/RootView.java

          echo "Source files OK."

      # ============================================================
      # V10-6A - RECENTS
      # ============================================================

      - name: Patch V10ProjectionSession - display RECENTS
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          source = Path(sys.argv[1])
          text = source.read_text(encoding="utf-8")

          if "public void recents()" not in text:

              pattern = re.compile(
                  r"(?m)^[ \t]*public\s+void\s+back\s*\(\s*\)\s*\{"
              )

              match = pattern.search(text)

              if not match:
                  raise SystemExit(
                      "ERROR: V10ProjectionSession.back() was not found."
                  )

              method = '''    public void recents() {
                  if (!isActive()) {
                      return;
                  }

                  final int displayId =
                          display.getDisplayId();

                  final String command =
                          "/system/bin/input -d "
                                  + displayId
                                  + " keyevent 187";

                  RootShellSession.EXEC.execute(
                          () -> {
                              try {
                                  rootShell.run(
                                          5,
                                          command);
                              } catch (Throwable t) {
                                  Log.w(
                                          TAG,
                                          "Recents failed",
                                          t);
                              }
                          });
              }

          '''

              text = (
                  text[:match.start()]
                  + method
                  + text[match.start():]
              )

              source.write_text(
                  text,
                  encoding="utf-8"
              )

          print("V10ProjectionSession RECENTS patch OK.")
          PY

      # ============================================================
      # V10-6A - FLOATING KEY
      # ============================================================

      - name: Patch V10CarActivity - Floating Key and 2/3 Screen
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          text = source.read_text(encoding="utf-8")

          imports = [
              "import android.content.SharedPreferences;",
              "import android.os.SystemClock;",
              "import android.view.MotionEvent;",
              "import android.view.ViewConfiguration;",
              "import android.view.ViewGroup;",
          ]

          marker = "import android.content.pm.ResolveInfo;"

          missing = [
              item
              for item in imports
              if item not in text
          ]

          if missing:
              if marker not in text:
                  raise SystemExit(
                      "ERROR: ResolveInfo import marker not found."
                  )

              text = text.replace(
                  marker,
                  marker + "\n" + "\n".join(missing),
                  1
              )

          if "private TextView floatingTouchKey;" not in text:

              marker = "    private V10ProjectionSession session;"

              fields = '''    private TextView floatingTouchKey;
              private LinearLayout floatingMenu;

              private boolean floatingDragging;
              private float floatingDownRawX;
              private float floatingDownRawY;
              private int floatingStartX;
              private int floatingStartY;
              private long floatingLastTap;
          '''

              if marker not in text:
                  raise SystemExit(
                      "ERROR: V10ProjectionSession field marker not found."
                  )

              text = text.replace(
                  marker,
                  marker + "\n" + fields,
                  1
              )

          if "createFloatingTouchKey();" not in text:

              marker = (
                  "        session.attachTextureView("
                  "\n"
                  "                textureView);"
              )

              if marker not in text:
                  raise SystemExit(
                      "ERROR: session.attachTextureView marker not found."
                  )

              text = text.replace(
                  marker,
                  marker
                  + "\n\n"
                  + "        createFloatingTouchKey();",
                  1
              )

          if "private void createFloatingTouchKey()" not in text:

              marker = "    public void handleControlBack()"

              methods = '''    private void createFloatingTouchKey() {
                  if (floatingTouchKey != null) {
                      return;
                  }

                  floatingTouchKey = new TextView(this);
                  floatingTouchKey.setText("●");
                  floatingTouchKey.setTextColor(Color.WHITE);
                  floatingTouchKey.setTextSize(22);
                  floatingTouchKey.setGravity(Gravity.CENTER);

                  GradientDrawable bg =
                          new GradientDrawable();

                  bg.setShape(
                          GradientDrawable.OVAL);

                  bg.setColor(
                          Color.rgb(25, 35, 45));

                  bg.setStroke(
                          dp(2),
                          Color.rgb(80, 170, 230));

                  floatingTouchKey.setBackground(bg);
                  floatingTouchKey.setElevation(dp(12));

                  SharedPreferences prefs =
                          getSharedPreferences(
                                  "v10_floating_key",
                                  MODE_PRIVATE);

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  dp(58),
                                  dp(58),
                                  Gravity.TOP | Gravity.END);

                  params.setMargins(
                          0,
                          prefs.getInt("y", dp(120)),
                          prefs.getInt("x", dp(18)),
                          0);

                  projectionLayer.addView(
                          floatingTouchKey,
                          params);

                  floatingTouchKey.setOnTouchListener(
                          (view, event) -> {

                              switch (
                                      event.getActionMasked()) {

                                  case MotionEvent.ACTION_DOWN:

                                      floatingDragging =
                                              false;

                                      floatingDownRawX =
                                              event.getRawX();

                                      floatingDownRawY =
                                              event.getRawY();

                                      ViewGroup.LayoutParams lp =
                                              view.getLayoutParams();

                                      if (lp
                                              instanceof FrameLayout.LayoutParams) {

                                          FrameLayout.LayoutParams fp =
                                                  (FrameLayout.LayoutParams) lp;

                                          floatingStartX =
                                                  fp.rightMargin;

                                          floatingStartY =
                                                  fp.topMargin;
                                      }

                                      return true;

                                  case MotionEvent.ACTION_MOVE:

                                      float dx =
                                              event.getRawX()
                                                      - floatingDownRawX;

                                      float dy =
                                              event.getRawY()
                                                      - floatingDownRawY;

                                      if (!floatingDragging
                                              && Math.hypot(dx, dy)
                                              > ViewConfiguration
                                                      .get(this)
                                                      .getScaledTouchSlop()) {

                                          floatingDragging =
                                                  true;
                                      }

                                      if (floatingDragging) {

                                          int width =
                                                  projectionLayer.getWidth();

                                          int height =
                                                  projectionLayer.getHeight();

                                          int keySize =
                                                  dp(58);

                                          int right =
                                                  Math.round(
                                                          floatingStartX
                                                                  - dx);

                                          int top =
                                                  Math.round(
                                                          floatingStartY
                                                                  + dy);

                                          right =
                                                  Math.max(
                                                          0,
                                                          Math.min(
                                                                  Math.max(
                                                                          0,
                                                                          width
                                                                                  - keySize),
                                                                  right));

                                          top =
                                                  Math.max(
                                                          0,
                                                          Math.min(
                                                                  Math.max(
                                                                          0,
                                                                          height
                                                                                  - keySize),
                                                                  top));

                                          FrameLayout.LayoutParams fp =
                                                  (FrameLayout.LayoutParams)
                                                          view.getLayoutParams();

                                          fp.rightMargin =
                                                  right;

                                          fp.topMargin =
                                                  top;

                                          view.setLayoutParams(fp);
                                      }

                                      return true;

                                  case MotionEvent.ACTION_UP:

                                      if (floatingDragging) {

                                          FrameLayout.LayoutParams fp =
                                                  (FrameLayout.LayoutParams)
                                                          view.getLayoutParams();

                                          prefs.edit()
                                                  .putInt(
                                                          "x",
                                                          fp.rightMargin)
                                                  .putInt(
                                                          "y",
                                                          fp.topMargin)
                                                  .apply();

                                          floatingDragging =
                                                  false;

                                          return true;
                                      }

                                      long now =
                                              SystemClock.uptimeMillis();

                                      long delta =
                                              now
                                                      - floatingLastTap;

                                      floatingLastTap =
                                              now;

                                      if (delta > 0
                                              && delta < 320) {

                                          handleControlHome();
                                          hideFloatingMenu();

                                      } else {

                                          showFloatingMenu();
                                      }

                                      view.performClick();

                                      return true;

                                  case MotionEvent.ACTION_CANCEL:

                                      floatingDragging =
                                              false;

                                      return true;

                                  default:
                                      return true;
                              }
                          });

                  floatingTouchKey.bringToFront();
              }

              private void showFloatingMenu() {

                  if (floatingMenu != null) {
                      hideFloatingMenu();
                      return;
                  }

                  floatingMenu =
                          new LinearLayout(this);

                  floatingMenu.setOrientation(
                          LinearLayout.VERTICAL);

                  floatingMenu.setPadding(
                          dp(8),
                          dp(8),
                          dp(8),
                          dp(8));

                  GradientDrawable bg =
                          new GradientDrawable();

                  bg.setColor(
                          Color.rgb(15, 20, 26));

                  bg.setCornerRadius(
                          dp(16));

                  bg.setStroke(
                          dp(1),
                          Color.rgb(65, 85, 105));

                  floatingMenu.setBackground(bg);
                  floatingMenu.setElevation(dp(14));

                  addFloatingMenuButton(
                          "BACK",
                          () -> {
                              handleControlBack();
                              hideFloatingMenu();
                          });

                  addFloatingMenuButton(
                          "RECENTS",
                          () -> {
                              if (session != null) {
                                  session.recents();
                              }

                              hideFloatingMenu();
                          });

                  addFloatingMenuButton(
                          "2 SCREEN",
                          () -> {
                              switchToTwoScreen();
                              hideFloatingMenu();
                          });

                  addFloatingMenuButton(
                          "3 SCREEN",
                          () -> {
                              switchToThreeScreen();
                              hideFloatingMenu();
                          });

                  FrameLayout.LayoutParams params =
                          new FrameLayout.LayoutParams(
                                  dp(170),
                                  -2,
                                  Gravity.TOP | Gravity.END);

                  params.setMargins(
                          0,
                          dp(70),
                          dp(18),
                          0);

                  projectionLayer.addView(
                          floatingMenu,
                          params);

                  floatingMenu.bringToFront();
                  floatingTouchKey.bringToFront();
              }

              private void addFloatingMenuButton(
                      String label,
                      Runnable action) {

                  TextView button =
                          new TextView(this);

                  button.setText(label);
                  button.setTextColor(Color.WHITE);
                  button.setTextSize(14);
                  button.setGravity(
                          Gravity.CENTER_VERTICAL);

                  GradientDrawable bg =
                          new GradientDrawable();

                  bg.setColor(
                          Color.rgb(28, 38, 48));

                  bg.setCornerRadius(
                          dp(10));

                  button.setBackground(bg);

                  button.setPadding(
                          dp(16),
                          0,
                          dp(16),
                          0);

                  button.setOnClickListener(
                          v -> action.run());

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(48));

                  params.setMargins(
                          0,
                          dp(3),
                          0,
                          dp(3));

                  floatingMenu.addView(
                          button,
                          params);
              }

              private void hideFloatingMenu() {

                  if (floatingMenu == null) {
                      return;
                  }

                  projectionLayer.removeView(
                          floatingMenu);

                  floatingMenu = null;
              }

              private void switchToTwoScreen() {

                  RootView rootView =
                          RootView.getCurrent();

                  if (rootView != null) {
                      rootView.setLayoutModeExternal(0);
                  }
              }

              private void switchToThreeScreen() {

                  RootView rootView =
                          RootView.getCurrent();

                  if (rootView != null) {
                      rootView.setLayoutModeExternal(2);
                  }
              }

          '''

              if marker not in text:
                  raise SystemExit(
                      "ERROR: handleControlBack() marker not found."
                  )

              text = text.replace(
                  marker,
                  methods + "\n" + marker,
                  1
              )

          source.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "Floating Key / 2 SCREEN / 3 SCREEN patch OK."
          )
          PY

      # ============================================================
      # ROOTVIEW
      # ============================================================

      - name: Patch RootView - external layout mode
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/RootView.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          text = source.read_text(encoding="utf-8")

          if "setLayoutModeExternal(int mode)" not in text:

              marker = "    public void reloadSettings()"

              method = '''    public void setLayoutModeExternal(int mode) {
                  final int targetMode =
                          clamp(mode, 0, 5);

                  handler.post(
                          () -> {

                              if (destroyed) {
                                  return;
                              }

                              layoutMode =
                                      targetMode;

                              loadRatios();

                              prefs.edit()
                                      .putInt(
                                              "layout_mode_v3",
                                              layoutMode)
                                      .apply();

                              applyVisibility();

                              container.requestLayout();
                              container.resizeAll();
                          });
              }

          '''

              if marker not in text:
                  raise SystemExit(
                      "ERROR: RootView.reloadSettings() marker not found."
                  )

              text = text.replace(
                  marker,
                  method + marker,
                  1
              )

              source.write_text(
                  text,
                  encoding="utf-8"
              )

          print(
              "RootView external layout patch OK."
          )
          PY

      # ============================================================
      # PERSISTENCE-3 - PROJECTION SESSION
      # ============================================================

      - name: Patch Persistence-3 ProjectionSession
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          text = source.read_text(encoding="utf-8")

          start = text.find(
              "    private void launchTarget()"
          )

          end = text.find(
              "\n    private float mapX",
              start
          )

          if start < 0 or end < 0:
              raise SystemExit(
                  "ERROR: launchTarget() boundaries not found."
              )

          new_launch = '''    private void launchTarget() {

                  if (display == null
                          || target == null) {
                      return;
                  }

                  final int displayId =
                          display.getDisplayId();

                  final int userId =
                          Process.myUid() / 100000;

                  final String flat =
                          target.flattenToString()
                                  .replace(
                                          "'",
                                          "'\\"'\\"'");

                  final String command =
                          "/system/bin/am start"
                                  + " --user "
                                  + userId
                                  + " --display "
                                  + displayId
                                  + " --windowingMode 1"
                                  + " --activity-reorder-to-front"
                                  + " -a android.intent.action.MAIN"
                                  + " -c android.intent.category.LAUNCHER"
                                  + " -f 0x18000000"
                                  + " -n '"
                                  + flat
                                  + "'";

                  RootShellSession.EXEC.execute(
                          () -> {

                              try {

                                  rootShell.run(
                                          10,
                                          command);

                              } catch (Throwable t) {

                                  Log.w(
                                          TAG,
                                          "Launch/reorder failed",
                                          t);
                              }
                          });
              }
          '''

          text = (
              text[:start]
              + new_launch
              + text[end:]
          )

          old_available = '''    @Override
              public void onSurfaceTextureAvailable(
                      SurfaceTexture surface,
                      int width,
                      int height) {

                  ensureDisplay();
              }'''

          new_available = '''    @Override
              public void onSurfaceTextureAvailable(
                      SurfaceTexture surfaceTexture,
                      int width,
                      int height) {

                  if (destroyed
                          || target == null) {
                      return;
                  }

                  if (virtualDisplay != null) {

                      try {

                          surfaceTexture.setDefaultBufferSize(
                                  width,
                                  height);

                          Surface newSurface =
                                  new Surface(
                                          surfaceTexture);

                          if (surface != null) {

                              try {
                                  surface.release();
                              } catch (Throwable ignored) {
                              }
                          }

                          surface =
                                  newSurface;

                          virtualDisplay.setSurface(
                                  newSurface);

                          contentWidth =
                                  width;

                          contentHeight =
                                  height;

                          /*
                           * Bring the existing application
                           * task back to the front.
                           */
                          launchTarget();

                          Log.d(
                                  TAG,
                                  "Reattached Surface to existing VirtualDisplay.");

                      } catch (Throwable t) {

                          Log.w(
                                  TAG,
                                  "Surface reattach failed",
                                  t);
                      }

                      return;
                  }

                  ensureDisplay();
              }'''

          if old_available not in text:
              raise SystemExit(
                  "ERROR: onSurfaceTextureAvailable() marker not found."
              )

          text = text.replace(
              old_available,
              new_available,
              1
          )

          old_destroyed = '''    @Override
              public boolean onSurfaceTextureDestroyed(
                      SurfaceTexture surface) {

                  releaseDisplayOnly();

                  return true;
              }'''

          new_destroyed = '''    @Override
              public boolean onSurfaceTextureDestroyed(
                      SurfaceTexture surfaceTexture) {

                  if (virtualDisplay != null) {

                      try {
                          virtualDisplay.setSurface(null);
                      } catch (Throwable ignored) {
                      }
                  }

                  if (surface != null) {

                      try {
                          surface.release();
                      } catch (Throwable ignored) {
                      }

                      surface = null;
                  }

                  Log.d(
                          TAG,
                          "Surface destroyed; VirtualDisplay kept alive.");

                  return true;
              }'''

          if old_destroyed not in text:
              raise SystemExit(
                  "ERROR: onSurfaceTextureDestroyed() marker not found."
              )

          text = text.replace(
              old_destroyed,
              new_destroyed,
              1
          )

          source.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "Persistence-3 ProjectionSession patch OK."
          )
          PY

      # ============================================================
      # PERSISTENCE-3 - ACTIVITY onStop
      # ============================================================

      - name: Patch Persistence-3 Activity onStop
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          source = Path(sys.argv[1])
          text = source.read_text(encoding="utf-8")

          pattern = re.compile(
              r"(?ms)"
              r"(@Override\s+"
              r"public void onStop\(\)\s*\{)"
              r"(.*?)"
              r"(\n\s*super\.onStop\(\);\s*"
              r"\n\s*\})"
          )

          match = pattern.search(text)

          if not match:
              raise SystemExit(
                  "ERROR: V10CarActivity.onStop() not found."
              )

          body = match.group(2)

          body2 = re.sub(
              r"\s*"
              r"if\s*\(\s*session\s*!=\s*null\s*\)"
              r"\s*\{\s*"
              r"session\.release\s*\(\s*\)\s*;"
              r"\s*\}\s*",
              "\n",
              body
          )

          if (
              body2 == body
              and "session.release()" in body
          ):
              raise SystemExit(
                  "ERROR: Could not remove session.release() from onStop()."
              )

          replacement = (
              match.group(1)
              + body2
              + match.group(3)
          )

          text = (
              text[:match.start()]
              + replacement
              + text[match.end():]
          )

          source.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "Persistence-3 onStop patch OK."
          )
          PY

      # ============================================================
      # VERIFY
      # ============================================================

      - name: Verify Persistence-3 source and markers
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          SESSION="app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
          ACTIVITY="app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          ROOT="app/src/main/java/com/hieptran/aacast/doudou/RootView.java"

          echo "=========================================="
          echo "VERIFY ARCHITECTURE"
          echo "=========================================="

          if [ -f "app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java" ]; then
            echo "ERROR: V10ProjectionService.java detected."
            exit 1
          fi

          echo "Architecture: PASS"

          echo "=========================================="
          echo "VERIFY RECENTS"
          echo "=========================================="

          grep -Fq "public void recents()" "$SESSION"
          grep -Fq "keyevent 187" "$SESSION"

          echo "RECENTS: PASS"

          echo "=========================================="
          echo "VERIFY FLOATING KEY"
          echo "=========================================="

          grep -Fq "createFloatingTouchKey" "$ACTIVITY"
          grep -Fq '"BACK"' "$ACTIVITY"
          grep -Fq '"RECENTS"' "$ACTIVITY"
          grep -Fq '"2 SCREEN"' "$ACTIVITY"
          grep -Fq '"3 SCREEN"' "$ACTIVITY"

          echo "Floating Key: PASS"

          echo "=========================================="
          echo "VERIFY ROOTVIEW"
          echo "=========================================="

          grep -Fq "setLayoutModeExternal(int mode)" "$ROOT"

          echo "2/3 SCREEN: PASS"

          echo "=========================================="
          echo "VERIFY PERSISTENCE-3"
          echo "=========================================="

          python3 - "$SESSION" <<'PY'
          from pathlib import Path
          import re
          import sys

          text = Path(
              sys.argv[1]
          ).read_text(
              encoding="utf-8"
          )

          if "--activity-reorder-to-front" not in text:
              raise SystemExit(
                  "ERROR: missing activity reorder flag."
              )

          if not re.search(
              r"virtualDisplay\s*\.\s*setSurface\s*\(\s*null\s*\)",
              text
          ):
              raise SystemExit(
                  "ERROR: missing surface detach marker."
              )

          if not re.search(
              r"virtualDisplay\s*\.\s*setSurface\s*\(\s*newSurface\s*\)",
              text
          ):
              raise SystemExit(
                  "ERROR: missing surface reattach marker."
              )

          if "VirtualDisplay kept alive." not in text:
              raise SystemExit(
                  "ERROR: missing VirtualDisplay persistence log."
              )

          if "am force-stop" in text:
              raise SystemExit(
                  "ERROR: am force-stop still exists."
              )

          print("PASS: activity reorder flag")
          print("PASS: surface detach")
          print("PASS: surface reattach")
          print("PASS: VirtualDisplay persistence log")
          print("PASS: no am force-stop")
          PY

          echo "Projection persistence markers: PASS"

          echo "=========================================="
          echo "VERIFY onStop()"
          echo "=========================================="

          python3 - "$ACTIVITY" <<'PY'
          from pathlib import Path
          import re
          import sys

          text = Path(
              sys.argv[1]
          ).read_text(
              encoding="utf-8"
          )

          pattern = re.compile(
              r"@Override\s+"
              r"public\s+void\s+onStop\s*\(\s*\)\s*\{"
              r"(.*?)"
              r"\bsuper\.onStop\s*\(\s*\)\s*;",
              re.S
          )

          match = pattern.search(text)

          if not match:
              raise SystemExit(
                  "ERROR: public void onStop() not found."
              )

          block = match.group(1)

          if re.search(
              r"\bsession\s*\.\s*release\s*\(\s*\)",
              block
          ):
              raise SystemExit(
                  "ERROR: session.release() still exists inside onStop()."
              )

          print(
              "onStop(): PASS - projection session is kept alive."
          )
          PY

          echo "=========================================="
          echo "FINAL STATIC CHECK"
          echo "=========================================="

          if grep -Fq "am force-stop" "$SESSION"; then
            echo "ERROR: force-stop detected."
            exit 1
          fi

          echo "Persistence-3 static verification PASSED."
          echo "All V10-6A + Persistence-3 checks passed."

      # ============================================================
      # COMPILE
      # ============================================================

      - name: Compile Java
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            compileDebugJavaWithJavac

      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build V10-6A Persistence-3 APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ============================================================
      # LOCATE APK
      # ============================================================

      - name: Locate APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK="$(
            find app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              -print -quit
          )"

          test -n "$APK"

          echo "APK=$APK"

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload V10-6A Persistence-3 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-6A-Persistence-3
          path: v10-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
