name: Build Car Assistant APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Phase A project
        run: |
          rm -rf build-src
          mkdir -p build-src
          unzip -o CarAssistant-PhaseA-v1-fixed2.zip -d build-src
          echo "=== Project root ==="
          ls -la build-src

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: build-src
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: car-assistant-phase-a-debug-apk
          path: build-src/app/build/outputs/apk/debug/app-debug.apk
