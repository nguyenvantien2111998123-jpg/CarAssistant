name: Build Car Assistant V10 - 8B1 Projection Service

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify V10 8B1 source
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$BASE/V10CarActivity.java"
          test -f "$BASE/V10ProjectionSession.java"
          test -f "$BASE/V10ProjectionService.java"
          test -f "$BASE/RootShellSession.java"

          echo "===== V10 source files ====="
          ls -lh "$BASE/V10CarActivity.java"
          ls -lh "$BASE/V10ProjectionSession.java"
          ls -lh "$BASE/V10ProjectionService.java"
          ls -lh "$BASE/RootShellSession.java"

          echo
          echo "===== Package checks ====="

          grep -q '^package com.carassistant.v10;' \
            "$BASE/V10ProjectionService.java"

          grep -q '^package com.carassistant.v10;' \
            "$BASE/V10ProjectionSession.java"

          echo "Package: OK"

      - name: Verify V10ProjectionService
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionService.java"

          echo "===== V10ProjectionService markers ====="

          grep -nE \
            "class V10ProjectionService|VirtualDisplay|createVirtualDisplay|setSurface|START_STICKY|startForeground|launchTargetLocked|activity-reorder-to-front" \
            "$FILE"

          test "$(grep -c "class V10ProjectionService" "$FILE")" -eq 1
          test "$(grep -c "createVirtualDisplay" "$FILE")" -ge 1
          test "$(grep -c "virtualDisplay.setSurface" "$FILE")" -ge 1
          test "$(grep -c "START_STICKY" "$FILE")" -ge 1
          test "$(grep -c "startForeground(" "$FILE")" -ge 1

          # Không được có force-stop trong ProjectionService
          if grep -n "force-stop" "$FILE"; then
            echo "ERROR: force-stop detected in V10ProjectionService"
            exit 1
          fi

          echo "V10ProjectionService verification: OK"

      - name: Verify V10ProjectionSession
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          echo "===== V10ProjectionSession markers ====="

          grep -nE \
            "V10ProjectionService|setTarget|attachSurface|detachSurface|public void release|onSurfaceTextureDestroyed" \
            "$FILE"

          test "$(grep -c "V10ProjectionService" "$FILE")" -ge 5
          test "$(grep -c "V10ProjectionService.setTarget" "$FILE")" -eq 1
          test "$(grep -c "V10ProjectionService.attachSurface" "$FILE")" -eq 1
          test "$(grep -c "V10ProjectionService.detachSurface" "$FILE")" -ge 1

          # Session không được tự sở hữu VirtualDisplay nữa
          if grep -n "createVirtualDisplay" "$FILE"; then
            echo "ERROR: V10ProjectionSession still creates VirtualDisplay"
            exit 1
          fi

          echo "V10ProjectionSession verification: OK"

      - name: Verify Manifest Projection Service
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/AndroidManifest.xml"

          echo "===== Manifest service ====="

          grep -nA4 -B2 \
            "V10ProjectionService" \
            "$FILE"

          grep -q \
            'android:name="com.carassistant.v10.V10ProjectionService"' \
            "$FILE"

          grep -q \
            'android:stopWithTask="false"' \
            "$FILE"

          echo "Manifest verification: OK"

      - name: Create CarSystemUI
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/CarSystemUI.java"

          cat > "$FILE" <<'EOF'
          package com.carassistant.v10;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.os.SystemClock;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewConfiguration;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public final class CarSystemUI {

              public interface Callback {
                  void onBack();
                  void onHome();
                  void onRecents();
              }

              private static final String PREFS = "v10_car_system_ui";
              private static final String KEY_X = "key_x";
              private static final String KEY_Y = "key_y";

              private static final int KEY_SIZE_DP = 52;
              private static final int MENU_WIDTH_DP = 190;
              private static final int MENU_BUTTON_HEIGHT_DP = 52;

              private final Context context;
              private final FrameLayout host;
              private final Callback callback;
              private final SharedPreferences prefs;
              private final int touchSlop;

              private View floatingKey;
              private LinearLayout menu;

              private float downRawX;
              private float downRawY;
              private int startX;
              private int startY;
              private long lastTapTime;

              public CarSystemUI(
                      Context context,
                      FrameLayout host,
                      Callback callback) {
                  this.context = context;
                  this.host = host;
                  this.callback = callback;
                  this.prefs = context.getSharedPreferences(
                          PREFS,
                          Context.MODE_PRIVATE);
                  this.touchSlop =
                          ViewConfiguration.get(context)
                                  .getScaledTouchSlop();
              }

              public void attach() {
                  if (floatingKey != null) {
                      return;
                  }

                  TextView key = new TextView(context);
                  floatingKey = key;

                  key.setText("≡");
                  key.setTextColor(Color.WHITE);
                  key.setTextSize(24f);
                  key.setGravity(Gravity.CENTER);
                  key.setBackground(
                          background(
                                  Color.argb(225, 25, 25, 25),
                                  26));

                  FrameLayout.LayoutParams lp =
                          new FrameLayout.LayoutParams(
                                  dp(KEY_SIZE_DP),
                                  dp(KEY_SIZE_DP));

                  lp.gravity = Gravity.TOP | Gravity.START;
                  lp.leftMargin =
                          prefs.getInt(KEY_X, dp(18));
                  lp.topMargin =
                          prefs.getInt(KEY_Y, dp(18));

                  host.addView(key, lp);

                  key.setOnTouchListener((view, event) -> {
                      FrameLayout.LayoutParams p =
                              (FrameLayout.LayoutParams)
                                      view.getLayoutParams();

                      switch (event.getActionMasked()) {
                          case MotionEvent.ACTION_DOWN:
                              downRawX = event.getRawX();
                              downRawY = event.getRawY();
                              startX = p.leftMargin;
                              startY = p.topMargin;
                              return true;

                          case MotionEvent.ACTION_MOVE:
                              float dx =
                                      event.getRawX() - downRawX;
                              float dy =
                                      event.getRawY() - downRawY;

                              if (Math.abs(dx) > touchSlop
                                      || Math.abs(dy) > touchSlop) {

                                  p.leftMargin =
                                          (int) (startX + dx);

                                  p.topMargin =
                                          (int) (startY + dy);

                                  clampPosition(p);
                                  view.setLayoutParams(p);
                              }

                              return true;

                          case MotionEvent.ACTION_UP:
                              float upDx =
                                      event.getRawX() - downRawX;
                              float upDy =
                                      event.getRawY() - downRawY;

                              if (Math.abs(upDx) <= touchSlop
                                      && Math.abs(upDy) <= touchSlop) {
                                  handleTap();
                              } else {
                                  savePosition(p);
                              }

                              return true;

                          default:
                              return true;
                      }
                  });
              }

              public void detach() {
                  hideMenu();

                  if (floatingKey != null) {
                      host.removeView(floatingKey);
                      floatingKey = null;
                  }
              }

              private void handleTap() {
                  long now =
                          SystemClock.uptimeMillis();

                  if (now - lastTapTime < 350L) {
                      lastTapTime = 0L;
                      hideMenu();

                      if (callback != null) {
                          callback.onHome();
                      }

                      return;
                  }

                  lastTapTime = now;
                  showMenu();
              }

              private void showMenu() {
                  if (menu != null) {
                      hideMenu();
                      return;
                  }

                  menu = new LinearLayout(context);
                  menu.setOrientation(LinearLayout.VERTICAL);

                  menu.setPadding(
                          dp(8),
                          dp(8),
                          dp(8),
                          dp(8));

                  menu.setBackground(
                          background(
                                  Color.argb(
                                          240,
                                          25,
                                          25,
                                          25),
                                  18));

                  FrameLayout.LayoutParams lp =
                          new FrameLayout.LayoutParams(
                                  dp(MENU_WIDTH_DP),
                                  ViewGroup.LayoutParams.WRAP_CONTENT);

                  lp.gravity =
                          Gravity.TOP | Gravity.START;

                  FrameLayout.LayoutParams keyLp =
                          (FrameLayout.LayoutParams)
                                  floatingKey.getLayoutParams();

                  lp.leftMargin =
                          Math.max(
                                  0,
                                  keyLp.leftMargin - dp(10));

                  lp.topMargin =
                          Math.max(
                                  0,
                                  keyLp.topMargin
                                          + dp(KEY_SIZE_DP)
                                          + dp(8));

                  host.addView(menu, lp);

                  addMenuButton(
                          "BACK",
                          () -> {
                              hideMenu();

                              if (callback != null) {
                                  callback.onBack();
                              }
                          });

                  addMenuButton(
                          "RECENTS",
                          () -> {
                              hideMenu();

                              if (callback != null) {
                                  callback.onRecents();
                              }
                          });
              }

              private void addMenuButton(
                      String label,
                      final Runnable action) {

                  TextView button = new TextView(context);

                  button.setText(label);
                  button.setTextColor(Color.WHITE);
                  button.setTextSize(16f);
                  button.setGravity(Gravity.CENTER);

                  button.setBackground(
                          background(
                                  Color.argb(
                                          60,
                                          255,
                                          255,
                                          255),
                                  12));

                  LinearLayout.LayoutParams lp =
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(MENU_BUTTON_HEIGHT_DP));

                  lp.bottomMargin = dp(6);

                  menu.addView(button, lp);

                  button.setOnClickListener(
                          v -> action.run());
              }

              private void hideMenu() {
                  if (menu != null) {
                      host.removeView(menu);
                      menu = null;
                  }
              }

              private void clampPosition(
                      FrameLayout.LayoutParams lp) {

                  int width = host.getWidth();
                  int height = host.getHeight();
                  int size = dp(KEY_SIZE_DP);

                  if (width > 0) {
                      lp.leftMargin =
                              Math.max(
                                      0,
                                      Math.min(
                                              lp.leftMargin,
                                              width - size));
                  }

                  if (height > 0) {
                      lp.topMargin =
                              Math.max(
                                      0,
                                      Math.min(
                                              lp.topMargin,
                                              height - size));
                  }
              }

              private void savePosition(
                      FrameLayout.LayoutParams lp) {

                  prefs.edit()
                          .putInt(
                                  KEY_X,
                                  lp.leftMargin)
                          .putInt(
                                  KEY_Y,
                                  lp.topMargin)
                          .apply();
              }

              private GradientDrawable background(
                      int color,
                      int radiusDp) {

                  GradientDrawable bg =
                          new GradientDrawable();

                  bg.setColor(color);
                  bg.setCornerRadius(dp(radiusDp));

                  return bg;
              }

              private int dp(int value) {
                  return Math.round(
                          value * context
                                  .getResources()
                                  .getDisplayMetrics()
                                  .density);
              }
          }
          EOF

          test -f "$FILE"
          grep -q "class CarSystemUI" "$FILE"

      - name: Create CarRecents
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/CarRecents.java"

          # Lấy đúng implementation hiện tại từ workflow cũ,
          # không patch V10ProjectionSession/V10CarActivity.
          cat > "$FILE" <<'EOF'
          package com.carassistant.v10;

          import android.content.ComponentName;
          import android.content.Context;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.util.ArrayList;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public final class CarRecents {

              public interface Callback {
                  void onTaskSelected(ComponentName component);
                  void onClose();
              }

              private static final Pattern TASK_ID =
                      Pattern.compile("#(\\d+)");

              private static final Pattern DISPLAY_ID =
                      Pattern.compile("displayId[=:](\\d+)");

              private static final Pattern REAL_ACTIVITY =
                      Pattern.compile(
                              "realActivity=ComponentInfo\\{([^/}]+)/([^}]+)\\}");

              private final Context context;
              private final FrameLayout host;
              private final RootShellSession shell;
              private final int displayId;
              private final String ownPackage;
              private final Callback callback;

              private LinearLayout panel;
              private TextView status;

              public CarRecents(
                      Context context,
                      FrameLayout host,
                      RootShellSession shell,
                      int displayId,
                      String ownPackage,
                      Callback callback) {
                  this.context = context;
                  this.host = host;
                  this.shell = shell;
                  this.displayId = displayId;
                  this.ownPackage = ownPackage;
                  this.callback = callback;
              }

              public void show() {
                  if (panel != null) {
                      return;
                  }

                  panel = new LinearLayout(context);
                  panel.setOrientation(
                          LinearLayout.VERTICAL);

                  panel.setPadding(
                          dp(16),
                          dp(12),
                          dp(16),
                          dp(12));

                  panel.setBackgroundColor(
                          Color.rgb(7, 9, 12));

                  LinearLayout header =
                          new LinearLayout(context);

                  header.setGravity(
                          Gravity.CENTER_VERTICAL);

                  TextView close =
                          button("CLOSE");

                  close.setOnClickListener(v -> {
                      hide();

                      if (callback != null) {
                          callback.onClose();
                      }
                  });

                  header.addView(
                          close,
                          new LinearLayout.LayoutParams(
                                  dp(95),
                                  dp(54)));

                  TextView title =
                          text(
                                  "RECENT APPS",
                                  21,
                                  Color.WHITE);

                  title.setGravity(Gravity.CENTER);

                  header.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(54),
                                  1f));

                  panel.addView(header);

                  status =
                          text(
                                  "Loading…",
                                  14,
                                  Color.LTGRAY);

                  status.setGravity(Gravity.CENTER);

                  panel.addView(
                          status,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(42)));

                  ScrollView scroll =
                          new ScrollView(context);

                  LinearLayout list =
                          new LinearLayout(context);

                  list.setOrientation(
                          LinearLayout.VERTICAL);

                  scroll.addView(list);

                  panel.addView(
                          scroll,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1f));

                  host.addView(
                          panel,
                          new FrameLayout.LayoutParams(
                                  -1,
                                  -1));

                  load(list);
              }

              public void destroy() {
                  hide();
                  shell.destroy();
              }

              public void hide() {
                  if (panel != null) {
                      host.removeView(panel);
                      panel = null;
                      status = null;
                  }
              }

              private void load(LinearLayout list) {
                  RootShellSession.EXEC.execute(() -> {
                      try {
                          String output =
                                  shell.run(
                                          10,
                                          "/system/bin/dumpsys activity recents");

                          List<RecentTask> tasks =
                                  parse(output);

                          host.post(() -> {
                              if (panel == null) {
                                  return;
                              }

                              list.removeAllViews();

                              if (tasks.isEmpty()) {
                                  status.setText(
                                          "No recent projection tasks");
                                  return;
                              }

                              status.setText(
                                      tasks.size()
                                              + " task(s)");

                              for (RecentTask task : tasks) {
                                  TextView item =
                                          button(task.label);

                                  LinearLayout.LayoutParams lp =
                                          new LinearLayout.LayoutParams(
                                                  -1,
                                                  dp(70));

                                  lp.bottomMargin = dp(8);

                                  list.addView(item, lp);

                                  item.setOnClickListener(v -> {
                                      if (callback != null) {
                                          callback.onTaskSelected(
                                                  task.component);
                                      }
                                  });
                              }
                          });

                      } catch (Throwable error) {
                          host.post(() -> {
                              if (status != null) {
                                  status.setText(
                                          "Recents unavailable");
                              }
                          });
                      }
                  });
              }

              private List<RecentTask> parse(
                      String output) {

                  LinkedHashMap<Integer, RecentTask> result =
                          new LinkedHashMap<>();

                  int currentTaskId = -1;
                  boolean currentDisplayMatches = false;
                  ComponentName currentComponent = null;

                  String[] lines =
                          output.split("\\r?\\n");

                  for (String line : lines) {

                      Matcher taskMatcher =
                              TASK_ID.matcher(line);

                      if (taskMatcher.find()
                              && line.contains("Task")) {

                          currentTaskId =
                                  Integer.parseInt(
                                          taskMatcher.group(1));

                          currentDisplayMatches = false;
                          currentComponent = null;

                          Matcher displayMatcher =
                                  DISPLAY_ID.matcher(line);

                          if (displayMatcher.find()) {
                              currentDisplayMatches =
                                      Integer.parseInt(
                                              displayMatcher.group(1))
                                              == displayId;
                          }

                          continue;
                      }

                      if (currentTaskId < 0) {
                          continue;
                      }

                      Matcher displayMatcher =
                              DISPLAY_ID.matcher(line);

                      if (displayMatcher.find()) {
                          currentDisplayMatches =
                                  Integer.parseInt(
                                          displayMatcher.group(1))
                                          == displayId;
                      }

                      Matcher activityMatcher =
                              REAL_ACTIVITY.matcher(line);

                      if (activityMatcher.find()) {
                          currentComponent =
                                  new ComponentName(
                                          activityMatcher.group(1),
                                          activityMatcher.group(2));
                      }

                      if (currentDisplayMatches
                              && currentComponent != null
                              && !ownPackage.equals(
                                      currentComponent.getPackageName())
                              && !result.containsKey(
                                      currentTaskId)) {

                          result.put(
                                  currentTaskId,
                                  new RecentTask(
                                          currentTaskId,
                                          currentComponent));
                      }
                  }

                  return new ArrayList<>(
                          result.values());
              }

              private static final class RecentTask {

                  final int taskId;
                  final ComponentName component;
                  final String label;

                  RecentTask(
                          int taskId,
                          ComponentName component) {

                      this.taskId = taskId;
                      this.component = component;

                      this.label =
                              component.getPackageName()
                                      + "\nTask #"
                                      + taskId;
                  }
              }

              private TextView button(
                      String value) {

                  TextView view =
                          text(
                                  value,
                                  16,
                                  Color.WHITE);

                  view.setGravity(Gravity.CENTER);

                  GradientDrawable bg =
                          new GradientDrawable();

                  bg.setColor(
                          Color.rgb(22, 27, 33));

                  bg.setCornerRadius(
                          dp(14));

                  view.setBackground(bg);

                  return view;
              }

              private TextView text(
                      String value,
                      int size,
                      int color) {

                  TextView view =
                          new TextView(context);

                  view.setText(value);
                  view.setTextSize(size);
                  view.setTextColor(color);

                  return view;
              }

              private int dp(int value) {
                  return Math.round(
                          value
                                  * context
                                          .getResources()
                                          .getDisplayMetrics()
                                          .density);
              }
          }
          EOF

          test -f "$FILE"
          grep -q "class CarRecents" "$FILE"

      - name: Verify generated UI
        shell: bash
        run: |
          set -euo pipefail

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$BASE/CarSystemUI.java"
          test -f "$BASE/CarRecents.java"

          grep -q "class CarSystemUI" \
            "$BASE/CarSystemUI.java"

          grep -q "class CarRecents" \
            "$BASE/CarRecents.java"

          echo "Generated UI source: OK"

      - name: Verify Activity is Service-compatible
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          echo "===== Activity projection lifecycle ====="

          grep -nE \
            "onResume|onPause|onStop|session.release|launchProjection" \
            "$FILE"

          # Activity vẫn có thể gọi session.release().
          # release() hiện chỉ detach Surface.
          grep -q "session.release();" "$FILE"

          echo "Activity compatibility check: OK"

      - name: Compile Java
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace

      - name: Build APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Locate APK and SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK=$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-8B1-ProjectionService
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
