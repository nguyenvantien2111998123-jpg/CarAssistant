name: Build Navigation V2 Route

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout locked Navigation V1 baseline
        uses: actions/checkout@v4
        with:
          ref: 9b2fc5b3f24b32ff4f2ed7ddb6d794cdb5f647f9
          fetch-depth: 1

      - name: Verify locked baseline
        shell: bash
        run: |
          set -e
          expected="9b2fc5b3f24b32ff4f2ed7ddb6d794cdb5f647f9"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "LOCKED BASELINE OK: $actual"

      - name: Verify baseline source
        shell: bash
        run: |
          set -e

          test -f v10-source/gradlew
          test -f v10-source/settings.gradle
          test -f v10-source/app/build.gradle
          test -f v10-source/app/src/main/AndroidManifest.xml

          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java

          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java

          grep -Fq "package com.carassistant.v10;" \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

          grep -Fq "package com.carassistant.v10;" \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java

          grep -Fq 'implementation "org.maplibre.gl:android-sdk:11.11.0"' \
            v10-source/app/build.gradle

          echo "BASELINE SOURCE OK"

      - name: Protect Projection Core
        shell: bash
        run: |
          set -e

          sha256sum \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java \
            > projection-core-before.sha256

      - name: Add Navigation V2 network permission
        shell: bash
        run: |
          set -e

          manifest="v10-source/app/src/main/AndroidManifest.xml"
          permission='<uses-permission android:name="android.permission.INTERNET" />'

          if ! grep -Fq "$permission" "$manifest"; then
            awk -v p="$permission" '
              /<application/ && !done {
                print "    " p
                done=1
              }
              { print }
            ' "$manifest" > "$manifest.tmp"

            mv "$manifest.tmp" "$manifest"
          fi

          grep -Fq "$permission" "$manifest"

          echo "INTERNET PERMISSION OK"

      - name: Replace NavigationMapView with V2 Route
        shell: bash
        run: |
          set -e

          file="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          cat > "$file" <<'JAVA'
          package com.carassistant.v10;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.location.Location;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.core.app.ActivityCompat;

          import org.json.JSONArray;
          import org.json.JSONObject;
          import org.maplibre.android.MapLibre;
          import org.maplibre.android.camera.CameraUpdateFactory;
          import org.maplibre.android.geometry.LatLng;
          import org.maplibre.android.location.LocationComponentActivationOptions;
          import org.maplibre.android.location.LocationComponentOptions;
          import org.maplibre.android.maps.MapLibreMap;
          import org.maplibre.android.maps.MapView;
          import org.maplibre.android.maps.Style;
          import org.maplibre.android.style.layers.LineLayer;
          import org.maplibre.android.style.layers.PropertyFactory;
          import org.maplibre.android.style.sources.GeoJsonSource;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.util.ArrayList;
          import java.util.List;

          public final class NavigationMapView extends FrameLayout {

              private static final int LOCATION_REQUEST = 4101;

              private final MapView mapView;
              private final Handler handler =
                      new Handler(Looper.getMainLooper());

              private MapLibreMap map;
              private EditText search;
              private TextView status;

              private double currentLat;
              private double currentLon;
              private boolean hasLocation;

              public NavigationMapView(Context context) {
                  super(context);

                  setBackgroundColor(Color.BLACK);

                  MapLibre.getInstance(
                          context.getApplicationContext());

                  mapView = new MapView(context);
                  mapView.onCreate(new Bundle());

                  addView(
                          mapView,
                          new LayoutParams(-1, -1));

                  buildControls();

                  mapView.getMapAsync(
                          this::onMapReady);
              }

              private void buildControls() {
                  LinearLayout panel =
                          new LinearLayout(getContext());

                  panel.setOrientation(
                          LinearLayout.VERTICAL);

                  panel.setPadding(
                          12,
                          12,
                          12,
                          12);

                  panel.setBackgroundColor(
                          0xCC111820);

                  LayoutParams panelParams =
                          new LayoutParams(
                                  -1,
                                  -2);

                  panelParams.gravity =
                          Gravity.TOP;

                  panelParams.setMargins(
                          16,
                          16,
                          16,
                          0);

                  addView(
                          panel,
                          panelParams);

                  LinearLayout row =
                          new LinearLayout(getContext());

                  row.setOrientation(
                          LinearLayout.HORIZONTAL);

                  search =
                          new EditText(getContext());

                  search.setSingleLine(true);
                  search.setHint(
                          "Nhập địa điểm");
                  search.setTextColor(Color.WHITE);
                  search.setHintTextColor(
                          0xFFBBBBBB);

                  row.addView(
                          search,
                          new LinearLayout.LayoutParams(
                                  0,
                                  54,
                                  1));

                  Button find =
                          new Button(getContext());

                  find.setText("TÌM");

                  find.setOnClickListener(
                          v -> searchPlace());

                  row.addView(
                          find,
                          new LinearLayout.LayoutParams(
                                  100,
                                  54));

                  panel.addView(row);

                  LinearLayout buttons =
                          new LinearLayout(getContext());

                  buttons.setOrientation(
                          LinearLayout.HORIZONTAL);

                  Button here =
                          new Button(getContext());

                  here.setText("VỊ TRÍ");

                  here.setOnClickListener(
                          v -> recenter());

                  buttons.addView(
                          here,
                          new LinearLayout.LayoutParams(
                                  0,
                                  54,
                                  1));

                  Button zoomIn =
                          new Button(getContext());

                  zoomIn.setText("+");

                  zoomIn.setOnClickListener(
                          v -> zoomIn());

                  buttons.addView(
                          zoomIn,
                          new LinearLayout.LayoutParams(
                                  0,
                                  54,
                                  1));

                  Button zoomOut =
                          new Button(getContext());

                  zoomOut.setText("-");

                  zoomOut.setOnClickListener(
                          v -> zoomOut());

                  buttons.addView(
                          zoomOut,
                          new LinearLayout.LayoutParams(
                                  0,
                                  54,
                                  1));

                  panel.addView(buttons);

                  status =
                          new TextView(getContext());

                  status.setTextColor(Color.WHITE);
                  status.setText(
                          "Navigation V2");

                  panel.addView(
                          status,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  -2));
              }

              private void onMapReady(
                      MapLibreMap readyMap) {

                  map = readyMap;

                  map.setStyle(
                          "https://tiles.openfreemap.org/styles/liberty",
                          style -> enableLocation());
              }

              private void enableLocation() {
                  if (map == null) {
                      return;
                  }

                  Context context =
                          getContext();

                  if (context == null) {
                      return;
                  }

                  if (context.checkSelfPermission(
                          Manifest.permission.ACCESS_FINE_LOCATION)
                          != PackageManager.PERMISSION_GRANTED) {

                      if (context instanceof Activity) {
                          ActivityCompat.requestPermissions(
                                  (Activity) context,
                                  new String[] {
                                          Manifest.permission.ACCESS_FINE_LOCATION,
                                          Manifest.permission.ACCESS_COARSE_LOCATION
                                  },
                                  LOCATION_REQUEST);
                      }

                      return;
                  }

                  LocationComponentOptions options =
                          LocationComponentOptions.builder(
                                  context)
                                  .pulseEnabled(true)
                                  .build();

                  LocationComponentActivationOptions activation =
                          LocationComponentActivationOptions
                                  .builder(
                                          context,
                                          map.getStyle())
                                  .locationComponentOptions(
                                          options)
                                  .build();

                  map.getLocationComponent()
                          .activateLocationComponent(
                                  activation);

                  map.getLocationComponent()
                          .setLocationComponentEnabled(
                                  true);

                  Location location =
                          map.getLocationComponent()
                                  .getLastKnownLocation();

                  if (location != null) {
                      currentLat =
                              location.getLatitude();

                      currentLon =
                              location.getLongitude();

                      hasLocation = true;
                  }
              }

              public void zoomIn() {
                  if (map == null) {
                      return;
                  }

                  double zoom =
                          map.getCameraPosition().zoom;

                  map.animateCamera(
                          CameraUpdateFactory.zoomTo(
                                  Math.min(
                                          20.0,
                                          zoom + 1.0)),
                          250);
              }

              public void zoomOut() {
                  if (map == null) {
                      return;
                  }

                  double zoom =
                          map.getCameraPosition().zoom;

                  map.animateCamera(
                          CameraUpdateFactory.zoomTo(
                                  Math.max(
                                          1.0,
                                          zoom - 1.0)),
                          250);
              }

              public void recenter() {
                  if (map == null) {
                      return;
                  }

                  try {
                      Location location =
                              map.getLocationComponent()
                                      .getLastKnownLocation();

                      if (location == null) {
                          Toast.makeText(
                                  getContext(),
                                  "Chưa có GPS",
                                  Toast.LENGTH_SHORT)
                                  .show();
                          return;
                      }

                      currentLat =
                              location.getLatitude();

                      currentLon =
                              location.getLongitude();

                      hasLocation = true;

                      map.animateCamera(
                              CameraUpdateFactory
                                      .newLatLngZoom(
                                              new LatLng(
                                                      currentLat,
                                                      currentLon),
                                              16.0),
                              500);

                  } catch (Exception ignored) {
                  }
              }

              private void searchPlace() {
                  final String query =
                          search.getText()
                                  .toString()
                                  .trim();

                  if (query.isEmpty()) {
                      Toast.makeText(
                              getContext(),
                              "Nhập địa điểm",
                              Toast.LENGTH_SHORT)
                              .show();
                      return;
                  }

                  status.setText(
                          "Đang tìm...");

                  new Thread(() -> {
                      HttpURLConnection connection =
                              null;

                      try {
                          String encoded =
                                  URLEncoder.encode(
                                          query,
                                          "UTF-8");

                          URL url =
                                  new URL(
                                          "https://nominatim.openstreetmap.org/search"
                                          + "?format=json"
                                          + "&limit=1"
                                          + "&q="
                                          + encoded);

                          connection =
                                  (HttpURLConnection)
                                          url.openConnection();

                          connection.setRequestMethod(
                                  "GET");

                          connection.setRequestProperty(
                                  "User-Agent",
                                  "CarAssistant-NavigationV2");

                          connection.setConnectTimeout(
                                  10000);

                          connection.setReadTimeout(
                                  10000);

                          BufferedReader reader =
                                  new BufferedReader(
                                          new InputStreamReader(
                                                  connection
                                                          .getInputStream()));

                          StringBuilder body =
                                  new StringBuilder();

                          String line;

                          while ((line =
                                  reader.readLine()) != null) {
                              body.append(line);
                          }

                          reader.close();

                          JSONArray results =
                                  new JSONArray(
                                          body.toString());

                          if (results.length() == 0) {
                              postStatus(
                                      "Không tìm thấy địa điểm");
                              return;
                          }

                          JSONObject item =
                                  results.getJSONObject(0);

                          double lat =
                                  Double.parseDouble(
                                          item.getString("lat"));

                          double lon =
                                  Double.parseDouble(
                                          item.getString("lon"));

                          String name =
                                  item.optString(
                                          "display_name",
                                          query);

                          if (map != null) {
                              double finalLat = lat;
                              double finalLon = lon;

                              handler.post(() -> {
                                  map.animateCamera(
                                          CameraUpdateFactory
                                                  .newLatLngZoom(
                                                          new LatLng(
                                                                  finalLat,
                                                                  finalLon),
                                                          15.0),
                                          600);

                                  status.setText(
                                          "Đã tìm: " + name);

                                  if (hasLocation) {
                                      requestRoute(
                                              finalLat,
                                              finalLon);
                                  } else {
                                      status.setText(
                                              "Đã tìm: "
                                                      + name
                                                      + " - chưa có GPS");
                                  }
                              });
                          }

                      } catch (Exception error) {
                          postStatus(
                                  "Lỗi tìm kiếm");
                      } finally {
                          if (connection != null) {
                              connection.disconnect();
                          }
                      }
                  }).start();
              }

              private void requestRoute(
                      double destinationLat,
                      double destinationLon) {

                  if (!hasLocation) {
                      return;
                  }

                  final double originLat =
                          currentLat;

                  final double originLon =
                          currentLon;

                  postStatus(
                          "Đang tính tuyến...");

                  new Thread(() -> {
                      HttpURLConnection connection =
                              null;

                      try {
                          String routeUrl =
                                  "https://router.project-osrm.org/route/v1/driving/"
                                  + originLon
                                  + ","
                                  + originLat
                                  + ";"
                                  + destinationLon
                                  + ","
                                  + destinationLat
                                  + "?overview=full"
                                  + "&geometries=geojson";

                          connection =
                                  (HttpURLConnection)
                                          new URL(
                                                  routeUrl)
                                                  .openConnection();

                          connection.setRequestMethod(
                                  "GET");

                          connection.setRequestProperty(
                                  "User-Agent",
                                  "CarAssistant-NavigationV2");

                          connection.setConnectTimeout(
                                  15000);

                          connection.setReadTimeout(
                                  15000);

                          BufferedReader reader =
                                  new BufferedReader(
                                          new InputStreamReader(
                                                  connection
                                                          .getInputStream()));

                          StringBuilder body =
                                  new StringBuilder();

                          String line;

                          while ((line =
                                  reader.readLine()) != null) {
                              body.append(line);
                          }

                          reader.close();

                          JSONObject response =
                                  new JSONObject(
                                          body.toString());

                          JSONArray routes =
                                  response.getJSONArray(
                                          "routes");

                          if (routes.length() == 0) {
                              throw new Exception(
                                      "No route");
                          }

                          JSONObject route =
                                  routes.getJSONObject(0);

                          JSONObject geometry =
                                  route.getJSONObject(
                                          "geometry");

                          JSONArray coordinates =
                                  geometry.getJSONArray(
                                          "coordinates");

                          List<LatLng> points =
                                  new ArrayList<>();

                          for (int i = 0;
                               i < coordinates.length();
                               i++) {

                              JSONArray point =
                                      coordinates
                                              .getJSONArray(i);

                              points.add(
                                      new LatLng(
                                              point.getDouble(1),
                                              point.getDouble(0)));
                          }

                          double distance =
                                  route.getDouble(
                                          "distance");

                          double duration =
                                  route.getDouble(
                                          "duration");

                          handler.post(() -> {
                              drawRoute(points);

                              status.setText(
                                      String.format(
                                              "Tuyến %.1f km - %.0f phút",
                                              distance / 1000.0,
                                              duration / 60.0));
                          });

                      } catch (Exception error) {
                          postStatus(
                                  "Không tính được tuyến");
                      } finally {
                          if (connection != null) {
                              connection.disconnect();
                          }
                      }
                  }).start();
              }

              private void drawRoute(
                      List<LatLng> points) {

                  if (map == null
                          || points == null
                          || points.isEmpty()) {
                      return;
                  }

                  Style style =
                          map.getStyle();

                  if (style == null) {
                      return;
                  }

                  try {
                      JSONArray coordinates =
                              new JSONArray();

                      for (LatLng point : points) {
                          JSONArray coordinate =
                                  new JSONArray();

                          coordinate.put(
                                  point.getLongitude());

                          coordinate.put(
                                  point.getLatitude());

                          coordinates.put(
                                  coordinate);
                      }

                      JSONObject geometry =
                              new JSONObject();

                      geometry.put(
                              "type",
                              "LineString");

                      geometry.put(
                              "coordinates",
                              coordinates);

                      JSONObject feature =
                              new JSONObject();

                      feature.put(
                              "type",
                              "Feature");

                      feature.put(
                              "geometry",
                              geometry);

                      if (style.getLayer(
                              "carassistant-route-layer")
                              != null) {

                          style.removeLayer(
                                  "carassistant-route-layer");
                      }

                      if (style.getSource(
                              "carassistant-route-source")
                              != null) {

                          style.removeSource(
                                  "carassistant-route-source");
                      }

                      GeoJsonSource source =
                              new GeoJsonSource(
                                      "carassistant-route-source",
                                      feature.toString());

                      style.addSource(source);

                      LineLayer line =
                              new LineLayer(
                                      "carassistant-route-layer",
                                      "carassistant-route-source");

                      line.setProperties(
                              PropertyFactory.lineColor(
                                      Color.BLUE),
                              PropertyFactory.lineWidth(
                                      6f));

                      style.addLayer(line);

                      LatLng first =
                              points.get(0);

                      map.animateCamera(
                              CameraUpdateFactory
                                      .newLatLngZoom(
                                              first,
                                              14.0),
                              500);

                  } catch (Exception ignored) {
                  }
              }

              private void postStatus(
                      final String message) {

                  handler.post(() ->
                          status.setText(message));
              }

              public void onHostResume() {
                  mapView.onResume();
              }

              public void onHostPause() {
                  mapView.onPause();
              }

              public void onHostDestroy() {
                  mapView.onDestroy();
              }
          }
          JAVA

          grep -Fq "package com.carassistant.v10;" "$file"
          grep -Fq "requestRoute(" "$file"
          grep -Fq "drawRoute(" "$file"
          grep -Fq "router.project-osrm.org" "$file"
          grep -Fq "nominatim.openstreetmap.org" "$file"

          echo "Navigation V2 Route source OK"

      - name: Add Navigation V2 Home entry
        shell: bash
        run: |
          set -e

          file="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$file" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          begin = "        // NAV_V2_ROUTE_HOME_BEGIN"
          end = "        // NAV_V2_ROUTE_HOME_END"

          if begin in text or end in text:
              raise SystemExit("Navigation V2 Home markers already exist")

          marker = '        map.addView('

          pos = text.find(marker)

          if pos < 0:
              raise SystemExit("MAP card marker not found")

          click = """
        // NAV_V2_ROUTE_HOME_BEGIN
        map.setOnClickListener(v -> {
            if (navigationMap == null) {
                return;
            }

            launcherLayer.setVisibility(View.GONE);
            navigationMap.setVisibility(View.VISIBLE);
            navigationMap.bringToFront();
        });
        // NAV_V2_ROUTE_HOME_END

"""

          text = text[:pos] + click + text[pos:]

          path.write_text(text)

          check = path.read_text()

          if check.count(begin) != 1:
              raise SystemExit("Navigation Home begin marker invalid")

          if check.count(end) != 1:
              raise SystemExit("Navigation Home end marker invalid")

          if check.count("navigationMap.setVisibility(View.VISIBLE);") != 1:
              raise SystemExit("Navigation Home entry count invalid")

          print("Navigation V2 Home entry OK")
          PY

      - name: Verify Navigation V2 integration
        shell: bash
        run: |
          set -e

          activity="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          navigation="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          grep -Fq "private NavigationMapView navigationMap;" "$activity"
          grep -Fq "new NavigationMapView(this)" "$activity"
          grep -Fq "NAV_V2_ROUTE_HOME_BEGIN" "$activity"
          grep -Fq "NAV_V2_ROUTE_HOME_END" "$activity"
          grep -Fq "navigationMap.setVisibility(View.VISIBLE);" "$activity"
          grep -Fq "navigationMap.bringToFront();" "$activity"

          grep -Fq "onHostResume()" "$navigation"
          grep -Fq "onHostPause()" "$navigation"
          grep -Fq "onHostDestroy()" "$navigation"
          grep -Fq "router.project-osrm.org" "$navigation"

          echo "Navigation V2 integration verification OK"

      - name: Verify Home UI baseline markers
        shell: bash
        run: |
          set -e

          file="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq '"CAR ASSISTANT"' "$file"
          grep -Fq '"MAP"' "$file"
          grep -Fq '"Navigation"' "$file"
          grep -Fq '"SPEED"' "$file"
          grep -Fq '"WEATHER"' "$file"
          grep -Fq '"MEDIA"' "$file"
          grep -Fq '"APPS"' "$file"

          grep -Fq "buildDashboard();" "$file"
          grep -Fq "buildAppPanel();" "$file"

          echo "HOME UI BASELINE MARKERS OK"

      - name: Verify Projection Core unchanged
        shell: bash
        run: |
          set -e

          sha256sum \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java \
            > projection-core-after.sha256

          diff -u \
            projection-core-before.sha256 \
            projection-core-after.sha256

          echo "PROJECTION CORE UNCHANGED"

      - name: Check source diff
        shell: bash
        run: |
          set -e

          cd v10-source

          git diff --check
          git status --short
          git diff --stat

      - name: Build Navigation V2 APK
        shell: bash
        run: |
          set -e

          cd v10-source

          chmod +x ./gradlew

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          apk="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$apk"

          echo "APK:"
          ls -lh "$apk"

          echo "SHA256:"
          sha256sum "$apk"

      - name: Upload Navigation V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: carassistant-navigation-v2-route
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
