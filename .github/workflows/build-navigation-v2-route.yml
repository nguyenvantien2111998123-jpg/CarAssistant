name: Build Navigation V2 Route

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          ref: 9b2fc5b3f24b32ff4f2ed7ddb6d794cdb5f647f9
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify baseline
        shell: bash
        run: |
          set -e

          EXPECTED="9b2fc5b3f24b32ff4f2ed7ddb6d794cdb5f647f9"

          test "$(git rev-parse HEAD)" = "$EXPECTED"

          test -f v10-source/settings.gradle
          test -f v10-source/app/build.gradle
          test -f v10-source/gradlew

          echo "Baseline OK: $EXPECTED"

      - name: Protect Projection Core
        shell: bash
        run: |
          set -e

          sha256sum \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java \
            > /tmp/projection-before.txt

      - name: Fix MapLibre dependency
        shell: bash
        run: |
          set -e

          FILE="v10-source/app/build.gradle"

          python3 -c '
          from pathlib import Path

          p = Path("'"$FILE"'")
          s = p.read_text()

          s = s.replace(
              "implementation \"org.maplibre.gl:android-sdk-opengl:11.8.0\"",
              "implementation \"org.maplibre.gl:android-sdk:11.8.0\""
          )

          s = s.replace(
              "implementation \"org.maplibre.gl:android-sdk:11.11.0\"",
              "implementation \"org.maplibre.gl:android-sdk:11.8.0\""
          )

          if "implementation \"org.maplibre.gl:android-sdk:11.8.0\"" not in s:
              raise SystemExit("MapLibre dependency not found")

          p.write_text(s)
          '

          grep -Fq \
            'implementation "org.maplibre.gl:android-sdk:11.8.0"' \
            "$FILE"

          ! grep -Fq \
            'android-sdk-opengl:11.8.0' \
            "$FILE"

          echo "MapLibre dependency OK"

      - name: Verify MapLibre dependency
        shell: bash
        run: |
          set -e

          chmod +x v10-source/gradlew
          cd v10-source

          ./gradlew :app:dependencies \
            --configuration debugCompileClasspath \
            --no-daemon \
            > /tmp/dependencies.txt

          grep -Fq \
            'org.maplibre.gl:android-sdk:11.8.0' \
            /tmp/dependencies.txt

          echo "MapLibre resolution OK"

      - name: Add INTERNET permission
        shell: bash
        run: |
          set -e

          python3 -c '
          from pathlib import Path

          p = Path("v10-source/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permission = "<uses-permission android:name=\"android.permission.INTERNET\" />"

          if permission not in s:
              if "<application" not in s:
                  raise SystemExit("application marker not found")

              s = s.replace(
                  "<application",
                  permission + "\n    <application",
                  1
              )

              p.write_text(s)
          '

          echo "INTERNET permission OK"

      - name: Restore Navigation V2 source
        shell: bash
        run: |
          set -e

          OLD="4b391b252b9d92840b151045f533056f47684e71"
          NAV="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          git fetch origin "$OLD" --depth=1

          git show "$OLD:$NAV" > "$NAV"

          test -s "$NAV"

          grep -Fq "NavigationMapView" "$NAV"

          echo "Navigation V2 source restored safely"

      - name: Fix MapLibre Java namespace
        shell: bash
        run: |
          set -e

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          python3 -c '
          from pathlib import Path

          p = Path("'"$FILE"'")
          s = p.read_text()

          old = "com.maplibre.android."
          new = "org.maplibre.android."

          if old in s:
              s = s.replace(old, new)
              p.write_text(s)
              print("Old MapLibre namespace converted")
          elif new in s:
              print("MapLibre namespace already correct")
          else:
              raise SystemExit(
                  "MapLibre namespace not found: neither old nor new namespace exists"
              )
          '

          grep -Fq \
            "org.maplibre.android." \
            "$FILE"

          ! grep -Fq \
            "com.maplibre.android." \
            "$FILE"

          echo "MapLibre namespace OK"

      - name: Patch Navigation entry
        shell: bash
        run: |
          set -e

          python3 -c '
          from pathlib import Path

          p = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          s = p.read_text()

          start = s.find("    private void buildUi() {")
          end = s.find("    private void buildDashboard() {")

          if start < 0 or end < 0 or end <= start:
              raise SystemExit("Navigation UI markers not found")

          block = """    private void buildUi() {
          // NAV_V2_ENTRY_BEGIN

          root = new FrameLayout(this);

          projectionLayer = new FrameLayout(this);
          root.addView(
                  projectionLayer,
                  new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                  )
          );

          launcherLayer = new LinearLayout(this);
          launcherLayer.setOrientation(LinearLayout.VERTICAL);
          root.addView(
                  launcherLayer,
                  new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                  )
          );

          navigationMap = new NavigationMapView(this);
          navigationMap.setVisibility(View.GONE);

          root.addView(
                  navigationMap,
                  new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                  )
          );

          buildDashboard();
          setContentView(root);
          launcherLayer.bringToFront();

          // NAV_V2_ENTRY_END
          }

          """

          p.write_text(s[:start] + block + s[end:])
          '

          grep -Fq \
            "NAV_V2_ENTRY_BEGIN" \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

          grep -Fq \
            "NAV_V2_ENTRY_END" \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

          echo "Navigation entry OK"

      - name: Patch Navigation card click
        shell: bash
        run: |
          set -e

          python3 -c '
          from pathlib import Path

          p = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          s = p.read_text()

          marker = (
              "        content.addView(\n"
              "                map,\n"
              "                new LinearLayout.LayoutParams(\n"
          )

          if s.count(marker) != 1:
              raise SystemExit("MAP card marker not found")

          if "navigationMap.setVisibility(View.VISIBLE);" not in s:
              click = """        map.setOnClickListener(v -> {
                  launcherLayer.setVisibility(View.GONE);
                  navigationMap.setVisibility(View.VISIBLE);
                  navigationMap.bringToFront();
              });

              """

              s = s.replace(
                  marker,
                  click + marker,
                  1
              )

          p.write_text(s)

          if s.count("navigationMap.setVisibility(View.VISIBLE);") != 1:
              raise SystemExit("Navigation visibility call count invalid")
          '

          echo "Navigation card click OK"

      - name: Verify Navigation V2
        shell: bash
        run: |
          set -e

          ACTIVITY="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          NAV="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          grep -Fq \
            "NAV_V2_ENTRY_BEGIN" \
            "$ACTIVITY"

          grep -Fq \
            "NAV_V2_ENTRY_END" \
            "$ACTIVITY"

          grep -Fq \
            "navigationMap.setVisibility(View.VISIBLE);" \
            "$ACTIVITY"

          grep -Fq \
            "navigationMap.setVisibility(View.GONE);" \
            "$ACTIVITY"

          grep -Fq \
            "org.maplibre.android.maps" \
            "$NAV"

          grep -Fq \
            "org.maplibre.android.camera" \
            "$NAV"

          grep -Fq \
            "org.maplibre.android.geometry" \
            "$NAV"

          ! grep -Fq \
            "com.maplibre.android." \
            "$NAV"

          ! grep -Fq \
            "navigationMap.openNavigation();" \
            "$ACTIVITY"

          ! grep -Fq \
            "navigationMap.closeNavigation();" \
            "$ACTIVITY"

          ! grep -Fq \
            "navigationMap.setOnExitListener" \
            "$ACTIVITY"

          echo "Navigation V2 verification OK"

      - name: Verify protected files
        shell: bash
        run: |
          set -e

          sha256sum \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java \
            > /tmp/projection-after.txt

          diff -u \
            /tmp/projection-before.txt \
            /tmp/projection-after.txt

          echo "Projection Core unchanged"

      - name: Check YAML and source
        shell: bash
        run: |
          set -e

          git diff --check

          test -s \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java

          test -s \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

          echo "Source checks OK"

      - name: Build APK
        shell: bash
        run: |
          set -e

          chmod +x v10-source/gradlew
          cd v10-source

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK created:"
          ls -lh "$APK"

          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: carassistant-navigation-v2
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
