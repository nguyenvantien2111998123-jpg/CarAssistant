name: Build Navigation V2 Route

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout V10 baseline
        uses: actions/checkout@v4
        with:
          ref: 9b2fc5b3f24b32ff4f2ed7ddb6d794cdb5f647f9
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify exact baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9b2fc5b3f24b32ff4f2ed7ddb6d794cdb5f647f9"
          test -f v10-source/app/build.gradle
          test -f v10-source/app/src/main/AndroidManifest.xml
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java
          echo 'Baseline OK'

      - name: Save protected files
        shell: bash
        run: |
          set -euo pipefail
          BASE='v10-source/app/src/main/java/com/hieptran/aacast/doudou'
          cp "$BASE/V10CarActivity.java" /tmp/V10CarActivity.before.java
          sha256sum \
            "$BASE/V10ProjectionSession.java" \
            "$BASE/V10DisplayController.java" \
            "$BASE/V10SurfaceManager.java" \
            "$BASE/V10TaskSession.java" \
            "$BASE/V10SessionStore.java" \
            > /tmp/projection.before.sha256

      - name: Set MapLibre 11.8.0 only
        shell: bash
        run: |
          set -euo pipefail
          FILE='v10-source/app/build.gradle'
          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import re
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          wanted = 'implementation "org.maplibre.gl:android-sdk:11.8.0"'
          s = re.sub(r"implementation\\s+['\"]org\\.maplibre\\.gl:android-sdk[^'\"]+['\"]", wanted, s)
          if wanted not in s:
              raise SystemExit('MapLibre dependency was not found')
          p.write_text(s)
          PY
          grep -Fq 'implementation "org.maplibre.gl:android-sdk:11.8.0"' "$FILE"

      - name: Add Internet permission only if missing
        shell: bash
        run: |
          set -euo pipefail
          FILE='v10-source/app/src/main/AndroidManifest.xml'
          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in s:
              marker = '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />'
              if marker not in s:
                  raise SystemExit('Location permission marker not found')
              s = s.replace(marker, marker + '\n    ' + permission, 1)
              p.write_text(s)
          PY
          grep -Fq 'android.permission.INTERNET' "$FILE"

      - name: Restore Navigation V2 source
        shell: bash
        run: |
          set -euo pipefail
          NAV='v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java'
          NAV_COMMIT='4b391b252b9d92840b151045f533056f47684e71'
          git fetch origin "$NAV_COMMIT" --depth=1
          git show "$NAV_COMMIT:$NAV" > "$NAV"
          test -s "$NAV"
          grep -Fq 'package com.carassistant.v10;' "$NAV"
          grep -Fq 'class NavigationMapView' "$NAV"
          grep -Fq 'org.maplibre.android.' "$NAV"

      - name: Patch Navigation V2 in place
        shell: bash
        run: |
          set -euo pipefail
          NAV='v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java'
          python3 - "$NAV" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          if 'NAV_V2_ROUTE_PATCH_BEGIN' in s:
              raise SystemExit('Navigation V2 route patch already exists')

          anchor = '    public void onHostResume() {'
          if anchor not in s:
              raise SystemExit('Navigation V2 anchor not found; refusing whole-file replacement')

          extra = r'''    // NAV_V2_ROUTE_PATCH_BEGIN

              private static final String ROUTE_SOURCE_ID = "carassistant-route-source";
              private static final String ROUTE_LAYER_ID = "carassistant-route-layer";

              public interface PlaceSearchListener {
                  void onResults(org.json.JSONArray results);
                  void onError();
              }

              public interface RouteListener {
                  void onRoute(double distanceMeters, double durationSeconds);
                  void onError();
              }

              public void autoFollow() {
                  recenter();
                  postDelayed(this::recenter, 1200L);
                  postDelayed(this::recenter, 2500L);
              }

              public void searchPlaces(String query, PlaceSearchListener listener) {
                  if (query == null || query.trim().isEmpty()) {
                      if (listener != null) listener.onError();
                      return;
                  }
                  final String q = query.trim();
                  new Thread(() -> {
                      try {
                          String encoded = java.net.URLEncoder.encode(q, "UTF-8");
                          java.net.URL url = new java.net.URL(
                                  "https://nominatim.openstreetmap.org/search?format=json&limit=5&q=" + encoded);
                          java.net.HttpURLConnection c =
                                  (java.net.HttpURLConnection) url.openConnection();
                          c.setRequestMethod("GET");
                          c.setConnectTimeout(10000);
                          c.setReadTimeout(10000);
                          c.setRequestProperty("User-Agent", "CarAssistant/1.0");
                          java.io.BufferedReader r = new java.io.BufferedReader(
                                  new java.io.InputStreamReader(c.getInputStream(), "UTF-8"));
                          StringBuilder b = new StringBuilder();
                          String line;
                          while ((line = r.readLine()) != null) b.append(line);
                          r.close();
                          org.json.JSONArray results = new org.json.JSONArray(b.toString());
                          post(() -> {
                              if (listener != null) listener.onResults(results);
                          });
                      } catch (Exception e) {
                          post(() -> {
                              if (listener != null) listener.onError();
                          });
                      }
                  }).start();
              }

              public void routeTo(double latitude, double longitude, RouteListener listener) {
                  final LatLng destination = new LatLng(latitude, longitude);
                  Location origin = null;
                  try {
                      if (map != null) {
                          origin = map.getLocationComponent().getLastKnownLocation();
                      }
                  } catch (Exception ignored) {
                  }
                  if (origin == null) {
                      if (listener != null) listener.onError();
                      return;
                  }

                  final double startLat = origin.getLatitude();
                  final double startLon = origin.getLongitude();
                  new Thread(() -> {
                      try {
                          String routeUrl =
                                  "https://router.project-osrm.org/route/v1/driving/"
                                          + startLon + "," + startLat + ";"
                                          + longitude + "," + latitude
                                          + "?overview=full&geometries=geojson";
                          java.net.HttpURLConnection c =
                                  (java.net.HttpURLConnection) new java.net.URL(routeUrl).openConnection();
                          c.setRequestMethod("GET");
                          c.setConnectTimeout(12000);
                          c.setReadTimeout(12000);
                          c.setRequestProperty("User-Agent", "CarAssistant/1.0");
                          java.io.BufferedReader r = new java.io.BufferedReader(
                                  new java.io.InputStreamReader(c.getInputStream(), "UTF-8"));
                          StringBuilder b = new StringBuilder();
                          String line;
                          while ((line = r.readLine()) != null) b.append(line);
                          r.close();

                          org.json.JSONObject root = new org.json.JSONObject(b.toString());
                          org.json.JSONArray routes = root.optJSONArray("routes");
                          if (routes == null || routes.length() == 0) throw new Exception("No route");
                          org.json.JSONObject route = routes.getJSONObject(0);
                          double distance = route.optDouble("distance", 0.0);
                          double duration = route.optDouble("duration", 0.0);
                          org.json.JSONObject geometry = route.getJSONObject("geometry");
                          org.json.JSONArray coordinates = geometry.getJSONArray("coordinates");
                          StringBuilder geo = new StringBuilder();
                          geo.append("{\"type\":\"Feature\",\"geometry\":{\"type\":\"LineString\",\"coordinates\":[");
                          for (int i = 0; i < coordinates.length(); i++) {
                              if (i > 0) geo.append(',');
                              geo.append(coordinates.getJSONArray(i).toString());
                          }
                          geo.append("]},\"properties\":{}}}");
                          final String geoJson = geo.toString();
                          post(() -> {
                              drawRoute(geoJson, startLat, startLon, latitude, longitude);
                              if (listener != null) listener.onRoute(distance, duration);
                          });
                      } catch (Exception e) {
                          post(() -> {
                              if (listener != null) listener.onError();
                          });
                      }
                  }).start();
              }

              private void drawRoute(String geoJson,
                                     double startLat,
                                     double startLon,
                                     double endLat,
                                     double endLon) {
                  if (map == null || map.getStyle() == null) return;
                  try {
                      org.maplibre.android.maps.Style style = map.getStyle();
                      org.maplibre.android.style.sources.GeoJsonSource source =
                              style.getSourceAs(ROUTE_SOURCE_ID);
                      if (source == null) {
                          source = new org.maplibre.android.style.sources.GeoJsonSource(
                                  ROUTE_SOURCE_ID, geoJson);
                          style.addSource(source);
                          org.maplibre.android.style.layers.LineLayer layer =
                                  new org.maplibre.android.style.layers.LineLayer(
                                          ROUTE_LAYER_ID, ROUTE_SOURCE_ID);
                          layer.setProperties(
                                  org.maplibre.android.style.layers.PropertyFactory.lineWidth(6f),
                                  org.maplibre.android.style.layers.PropertyFactory.lineColor(Color.BLUE));
                          style.addLayer(layer);
                      } else {
                          source.setGeoJson(geoJson);
                      }
                      LatLng center = new LatLng(
                              (startLat + endLat) / 2.0,
                              (startLon + endLon) / 2.0);
                      map.animateCamera(
                              CameraUpdateFactory.newLatLngZoom(center, 12.0), 500);
                  } catch (Exception ignored) {
                  }
              }

              // NAV_V2_ROUTE_PATCH_END

          '''
          s = s.replace(anchor, extra + anchor, 1)
          p.write_text(s)
          PY
          grep -Fq 'NAV_V2_ROUTE_PATCH_BEGIN' "$NAV"
          grep -Fq 'searchPlaces' "$NAV"
          grep -Fq 'routeTo' "$NAV"

      - name: Add separate phone Navigation Activity
        shell: bash
        run: |
          set -euo pipefail
          FILE='v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10NavigationActivity.java'
          test ! -e "$FILE"
          cat > "$FILE" <<'JAVA'
          package com.carassistant.v10;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          public final class V10NavigationActivity extends Activity {
              private NavigationMapView navigationMap;
              private EditText searchBox;
              private TextView status;
              private LinearLayout results;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  buildUi();
                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{
                              Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.ACCESS_COARSE_LOCATION}, 4101);
                  } else {
                      status.setText("Đã có quyền vị trí");
                      navigationMap.autoFollow();
                  }
              }

              private void buildUi() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(12, 12, 12, 12);
                  root.setBackgroundColor(Color.rgb(7, 9, 12));

                  TextView title = new TextView(this);
                  title.setText("CAR ASSISTANT NAVIGATION");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(20);
                  root.addView(title, new LinearLayout.LayoutParams(-1, 58));

                  LinearLayout searchRow = new LinearLayout(this);
                  searchBox = new EditText(this);
                  searchBox.setSingleLine(true);
                  searchBox.setHint("Tìm địa điểm...");
                  searchBox.setTextColor(Color.WHITE);
                  searchBox.setHintTextColor(Color.LTGRAY);
                  searchRow.addView(searchBox, new LinearLayout.LayoutParams(0, 58, 1));

                  Button search = new Button(this);
                  search.setText("TÌM");
                  search.setOnClickListener(v -> searchPlaces());
                  searchRow.addView(search, new LinearLayout.LayoutParams(90, 58));
                  root.addView(searchRow);

                  Button recenter = new Button(this);
                  recenter.setText("RECENTER");
                  recenter.setOnClickListener(v -> {
                      navigationMap.recenter();
                      status.setText("Đã đưa camera về vị trí hiện tại");
                  });
                  root.addView(recenter, new LinearLayout.LayoutParams(-1, 54));

                  status = new TextView(this);
                  status.setText("Đang khởi tạo bản đồ...");
                  status.setTextColor(Color.LTGRAY);
                  root.addView(status, new LinearLayout.LayoutParams(-1, 42));

                  ScrollView scroll = new ScrollView(this);
                  results = new LinearLayout(this);
                  results.setOrientation(LinearLayout.VERTICAL);
                  scroll.addView(results);
                  root.addView(scroll, new LinearLayout.LayoutParams(-1, 0, 0.30f));

                  navigationMap = new NavigationMapView(this);
                  root.addView(navigationMap, new LinearLayout.LayoutParams(-1, 0, 1f));
                  setContentView(root);
              }

              private void searchPlaces() {
                  String q = searchBox.getText().toString().trim();
                  if (q.isEmpty()) {
                      status.setText("Nhập địa điểm cần tìm");
                      return;
                  }
                  results.removeAllViews();
                  status.setText("Đang tìm kiếm...");
                  navigationMap.searchPlaces(q, new NavigationMapView.PlaceSearchListener() {
                      @Override
                      public void onResults(org.json.JSONArray data) {
                          results.removeAllViews();
                          if (data.length() == 0) {
                              status.setText("Không tìm thấy địa điểm");
                              return;
                          }
                          status.setText("Chọn điểm đến để tính tuyến");
                          for (int i = 0; i < data.length(); i++) {
                              try {
                                  org.json.JSONObject item = data.getJSONObject(i);
                                  String name = item.optString("display_name", "Điểm đến");
                                  double lat = Double.parseDouble(item.getString("lat"));
                                  double lon = Double.parseDouble(item.getString("lon"));
                                  Button b = new Button(V10NavigationActivity.this);
                                  b.setText(name);
                                  b.setGravity(Gravity.START | Gravity.CENTER_VERTICAL);
                                  b.setOnClickListener(v -> calculateRoute(lat, lon));
                                  results.addView(b, new LinearLayout.LayoutParams(-1, 64));
                              } catch (Exception ignored) {
                              }
                          }
                      }

                      @Override
                      public void onError() {
                          status.setText("Lỗi kết nối tìm kiếm");
                      }
                  });
              }

              private void calculateRoute(double lat, double lon) {
                  status.setText("Đang tính tuyến...");
                  navigationMap.routeTo(lat, lon, new NavigationMapView.RouteListener() {
                      @Override
                      public void onRoute(double distanceMeters, double durationSeconds) {
                          double km = distanceMeters / 1000.0;
                          long minutes = Math.round(durationSeconds / 60.0);
                          status.setText(String.format(
                                  java.util.Locale.getDefault(),
                                  "Tuyến: %.1f km • khoảng %d phút",
                                  km, minutes));
                      }

                      @Override
                      public void onError() {
                          status.setText("Không tính được tuyến từ vị trí hiện tại");
                      }
                  });
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == 4101
                          && grantResults.length > 0
                          && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      status.setText("Đã cấp quyền vị trí");
                      navigationMap.autoFollow();
                  } else if (requestCode == 4101) {
                      status.setText("Chưa được cấp quyền vị trí");
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (navigationMap != null) navigationMap.onHostResume();
              }

              @Override
              protected void onPause() {
                  if (navigationMap != null) navigationMap.onHostPause();
                  super.onPause();
              }

              @Override
              protected void onDestroy() {
                  if (navigationMap != null) {
                      navigationMap.onHostDestroy();
                      navigationMap = null;
                  }
                  super.onDestroy();
              }
          }
          JAVA
          grep -Fq 'class V10NavigationActivity' "$FILE"
          grep -Fq 'package com.carassistant.v10;' "$FILE"

      - name: Register phone Activity without touching V10CarActivity buildUi
        shell: bash
        run: |
          set -euo pipefail
          FILE='v10-source/app/src/main/AndroidManifest.xml'
          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          if 'android:name="com.carassistant.v10.V10NavigationActivity"' not in s:
              marker = '        <activity\n            android:name="com.carassistant.v10.V10CarActivity"'
              if marker not in s:
                  raise SystemExit('V10CarActivity manifest marker not found')
              activity = '''        <activity
              android:name="com.carassistant.v10.V10NavigationActivity"
              android:exported="false" />

          '''
              s = s.replace(marker, activity + marker, 1)
              p.write_text(s)
          PY
          grep -Fq 'com.carassistant.v10.V10NavigationActivity' "$FILE"

      - name: Patch only MAP card click
        shell: bash
        run: |
          set -euo pipefail
          FILE='v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java'
          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          if 'NAV_V2_MAP_CARD_CLICK_BEGIN' in s:
              raise SystemExit('MAP card patch already exists')

          old = "        map.addView(\n                mapText,\n                new LinearLayout.LayoutParams(\n                        -1,\n                        0,\n                        1));\n\n        content.addView("
          new = "        map.addView(\n                mapText,\n                new LinearLayout.LayoutParams(\n                        -1,\n                        0,\n                        1));\n\n        // NAV_V2_MAP_CARD_CLICK_BEGIN\n        map.setOnClickListener(v -> {\n            Intent intent = new Intent(\n                    V10CarActivity.this,\n                    V10NavigationActivity.class);\n            startActivity(intent);\n        });\n        // NAV_V2_MAP_CARD_CLICK_END\n\n        content.addView("
          if old not in s:
              raise SystemExit('Exact MAP card block not found; refusing buildUi rewrite')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          grep -Fq 'NAV_V2_MAP_CARD_CLICK_BEGIN' "$FILE"
          grep -Fq 'V10NavigationActivity.class' "$FILE"

      - name: Verify buildUi was not replaced
        shell: bash
        run: |
          set -euo pipefail
          FILE='v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java'
          grep -Fq 'private void buildUi()' "$FILE"
          grep -Fq 'buildDashboard();' "$FILE"
          grep -Fq 'buildAppPanel();' "$FILE"
          grep -Fq 'attachProjection();' "$FILE"
          diff -u /tmp/V10CarActivity.before.java "$FILE" > /tmp/V10CarActivity.diff || true
          test "$(grep -c 'NAV_V2_MAP_CARD_CLICK_BEGIN' /tmp/V10CarActivity.diff)" -eq 1
          echo 'V10CarActivity changed only by the MAP card listener patch'

      - name: Verify Projection Core unchanged
        shell: bash
        run: |
          set -euo pipefail
          BASE='v10-source/app/src/main/java/com/hieptran/aacast/doudou'
          sha256sum \
            "$BASE/V10ProjectionSession.java" \
            "$BASE/V10DisplayController.java" \
            "$BASE/V10SurfaceManager.java" \
            "$BASE/V10TaskSession.java" \
            "$BASE/V10SessionStore.java" \
            > /tmp/projection.after.sha256
          diff -u /tmp/projection.before.sha256 /tmp/projection.after.sha256
          echo 'Projection Core unchanged'

      - name: Verify allowed changed files only
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          echo "$changed"
          while IFS= read -r f; do
            case "$f" in
              v10-source/app/build.gradle) ;;
              v10-source/app/src/main/AndroidManifest.xml) ;;
              v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java) ;;
              v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java) ;;
              *) echo "Unexpected changed file: $f"; exit 1 ;;
            esac
          done <<< "$changed"
          test -n "$changed"
          git diff --check

      - name: Validate Navigation V2 source
        shell: bash
        run: |
          set -euo pipefail
          NAV='v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java'
          grep -Fq 'package com.carassistant.v10;' "$NAV"
          grep -Fq 'class NavigationMapView' "$NAV"
          grep -Fq 'public void zoomIn()' "$NAV"
          grep -Fq 'public void zoomOut()' "$NAV"
          grep -Fq 'public void recenter()' "$NAV"
          grep -Fq 'public void onHostResume()' "$NAV"
          grep -Fq 'public void onHostPause()' "$NAV"
          grep -Fq 'public void onHostDestroy()' "$NAV"
          grep -Fq 'NAV_V2_ROUTE_PATCH_BEGIN' "$NAV"
          grep -Fq 'https://nominatim.openstreetmap.org/search' "$NAV"
          grep -Fq 'https://router.project-osrm.org/route/v1/driving/' "$NAV"
          grep -Fq 'GeoJsonSource' "$NAV"
          echo 'Navigation V2 verification PASS'

      - name: Validate manifest and permissions
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST='v10-source/app/src/main/AndroidManifest.xml'
          grep -Fq 'android.permission.ACCESS_FINE_LOCATION' "$MANIFEST"
          grep -Fq 'android.permission.ACCESS_COARSE_LOCATION' "$MANIFEST"
          grep -Fq 'android.permission.INTERNET' "$MANIFEST"
          grep -Fq 'com.carassistant.v10.V10NavigationActivity' "$MANIFEST"
          echo 'Manifest verification PASS'

      - name: Compile Java
        shell: bash
        run: |
          set -euo pipefail
          chmod +x v10-source/gradlew
          cd v10-source
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon --stacktrace

      - name: Assemble debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x v10-source/gradlew
          cd v10-source
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='v10-source/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: carassistant-navigation-v2-route-phone-ui
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
