name: Build Navigation V2 Route

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout locked Navigation V1 baseline
        uses: actions/checkout@v4
        with:
          ref: 9b2fc5b3f24b32ff4f2ed7ddb6d794cdb5f647f9
          fetch-depth: 1

      - name: Verify baseline
        shell: bash
        run: |
          set -e
          EXPECTED="9b2fc5b3f24b32ff4f2ed7ddb6d794cdb5f647f9"
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED"
          echo "Baseline OK: $ACTUAL"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify project
        shell: bash
        run: |
          set -e
          test -f settings.gradle
          test -f v10-source/app/build.gradle
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java
          echo "Project verification OK"

      - name: Hash protected Projection Core before changes
        shell: bash
        run: |
          set -e
          sha256sum \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java \
            > /tmp/projection-core-before.txt

      - name: Add INTERNET permission
        shell: bash
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path

          p = Path("v10-source/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET" />'

          if permission not in s:
              marker = '<application'
              if marker not in s:
                  raise SystemExit("AndroidManifest application marker not found")
              s = s.replace(marker, permission + "\n    " + marker, 1)
              p.write_text(s)

          print("INTERNET permission OK")
          PY

      - name: Write Navigation V2 source
        shell: bash
        run: |
          set -e
          cat > v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java <<'JAVA'
          package com.carassistant.v10;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.location.Location;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.annotation.NonNull;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import com.mapbox.mapboxsdk.geometry.LatLng;
          import com.mapbox.mapboxsdk.maps.MapView;
          import com.mapbox.mapboxsdk.maps.MapLibreMap;
          import com.mapbox.mapboxsdk.maps.OnMapReadyCallback;
          import com.mapbox.mapboxsdk.maps.Style;
          import com.mapbox.mapboxsdk.location.LocationComponent;
          import com.mapbox.mapboxsdk.location.modes.CameraMode;
          import com.mapbox.mapboxsdk.plugins.annotation.LineManager;
          import com.mapbox.mapboxsdk.plugins.annotation.LineOptions;
          import com.mapbox.mapboxsdk.plugins.annotation.SymbolManager;
          import com.mapbox.mapboxsdk.plugins.annotation.SymbolOptions;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.util.ArrayList;
          import java.util.List;

          public class NavigationMapView extends FrameLayout {

              public interface ExitListener {
                  void onExitNavigation();
              }

              private final Activity activity;
              private final MapView mapView;
              private MapLibreMap map;
              private LocationComponent locationComponent;

              private final Handler mainHandler = new Handler(Looper.getMainLooper());

              private EditText searchBox;
              private TextView resultText;

              private double currentLat;
              private double currentLon;

              private boolean hasLocation = false;
              private boolean firstFollowDone = false;

              private ExitListener exitListener;

              public NavigationMapView(Activity activity) {
                  super(activity);
                  this.activity = activity;

                  setBackgroundColor(Color.BLACK);

                  mapView = new MapView(activity);
                  LayoutParams mapParams =
                          new LayoutParams(
                                  LayoutParams.MATCH_PARENT,
                                  LayoutParams.MATCH_PARENT
                          );
                  addView(mapView, mapParams);

                  mapView.onCreate(null);
                  mapView.getMapAsync(new OnMapReadyCallback() {
                      @Override
                      public void onMapReady(@NonNull MapLibreMap mapLibreMap) {
                          map = mapLibreMap;

                          map.setStyle(
                                  new Style.Builder()
                                          .fromUri(
                                                  "https://tiles.openfreemap.org/styles/liberty"
                                          ),
                                  style -> {
                                      enableLocation();
                                  }
                          );
                      }
                  });

                  buildControls();
              }

              private void buildControls() {
                  LinearLayout panel = new LinearLayout(activity);
                  panel.setOrientation(LinearLayout.VERTICAL);
                  panel.setPadding(12, 12, 12, 12);
                  panel.setBackgroundColor(0xCC202020);

                  LayoutParams panelParams =
                          new LayoutParams(
                                  LayoutParams.MATCH_PARENT,
                                  LayoutParams.WRAP_CONTENT
                          );
                  panelParams.gravity = Gravity.TOP;
                  panelParams.setMargins(16, 16, 16, 0);
                  addView(panel, panelParams);

                  LinearLayout searchRow = new LinearLayout(activity);
                  searchRow.setOrientation(LinearLayout.HORIZONTAL);

                  searchBox = new EditText(activity);
                  searchBox.setHint("Tìm địa điểm");
                  searchBox.setSingleLine(true);
                  searchBox.setTextColor(Color.WHITE);
                  searchBox.setHintTextColor(0xFFBBBBBB);
                  searchBox.setBackgroundColor(0xFF303030);

                  searchRow.addView(
                          searchBox,
                          new LinearLayout.LayoutParams(
                                  0,
                                  52,
                                  1
                          )
                  );

                  Button searchButton = new Button(activity);
                  searchButton.setText("TÌM");
                  searchButton.setOnClickListener(v -> searchPlace());

                  searchRow.addView(
                          searchButton,
                          new LinearLayout.LayoutParams(
                                  90,
                                  52
                          )
                  );

                  panel.addView(searchRow);

                  LinearLayout buttonRow = new LinearLayout(activity);
                  buttonRow.setOrientation(LinearLayout.HORIZONTAL);

                  Button recenterButton = new Button(activity);
                  recenterButton.setText("VỊ TRÍ");
                  recenterButton.setOnClickListener(v -> recenter());

                  Button exitButton = new Button(activity);
                  exitButton.setText("THOÁT");
                  exitButton.setOnClickListener(v -> {
                      if (exitListener != null) {
                          exitListener.onExitNavigation();
                      }
                  });

                  buttonRow.addView(
                          recenterButton,
                          new LinearLayout.LayoutParams(
                                  0,
                                  52,
                                  1
                          )
                  );

                  buttonRow.addView(
                          exitButton,
                          new LinearLayout.LayoutParams(
                                  0,
                                  52,
                                  1
                          )
                  );

                  panel.addView(buttonRow);

                  resultText = new TextView(activity);
                  resultText.setTextColor(Color.WHITE);
                  resultText.setPadding(8, 8, 8, 8);
                  panel.addView(resultText);
              }

              public void setOnExitListener(ExitListener listener) {
                  this.exitListener = listener;
              }

              public void openNavigation() {
                  setVisibility(VISIBLE);
                  bringToFront();

                  if (mapView != null) {
                      mapView.onStart();
                      mapView.onResume();
                  }

                  if (hasLocation && !firstFollowDone) {
                      recenter();
                  }
              }

              public void closeNavigation() {
                  if (mapView != null) {
                      mapView.onPause();
                  }
                  setVisibility(GONE);
              }

              private void enableLocation() {
                  if (map == null) {
                      return;
                  }

                  locationComponent = map.getLocationComponent();

                  if (ContextCompat.checkSelfPermission(
                          activity,
                          Manifest.permission.ACCESS_FINE_LOCATION
                  ) != PackageManager.PERMISSION_GRANTED) {

                      ActivityCompat.requestPermissions(
                              activity,
                              new String[]{
                                      Manifest.permission.ACCESS_FINE_LOCATION,
                                      Manifest.permission.ACCESS_COARSE_LOCATION
                              },
                              701
                      );
                      return;
                  }

                  locationComponent.activateLocationComponent(
                          activity,
                          map.getStyle()
                  );

                  locationComponent.setLocationComponentEnabled(true);
                  locationComponent.setCameraMode(CameraMode.TRACKING);

                  locationComponent.addLocationConsumer(location -> {
                      if (location == null) {
                          return;
                      }

                      currentLat = location.getLatitude();
                      currentLon = location.getLongitude();
                      hasLocation = true;

                      if (!firstFollowDone && getVisibility() == VISIBLE) {
                          recenter();
                      }
                  });
              }

              private void recenter() {
                  if (map == null || !hasLocation) {
                      Toast.makeText(
                              activity,
                              "Chưa có vị trí GPS",
                              Toast.LENGTH_SHORT
                      ).show();
                      return;
                  }

                  map.animateCamera(
                          com.mapbox.mapboxsdk.camera.CameraUpdateFactory
                                  .newLatLngZoom(
                                          new LatLng(currentLat, currentLon),
                                          15.0
                                  ),
                          600
                  );

                  firstFollowDone = true;
              }

              private void searchPlace() {
                  final String query = searchBox.getText().toString().trim();

                  if (query.isEmpty()) {
                      Toast.makeText(
                              activity,
                              "Nhập địa điểm cần tìm",
                              Toast.LENGTH_SHORT
                      ).show();
                      return;
                  }

                  resultText.setText("Đang tìm...");

                  new Thread(() -> {
                      try {
                          String encoded =
                                  URLEncoder.encode(query, "UTF-8");

                          String url =
                                  "https://nominatim.openstreetmap.org/search"
                                          + "?format=json"
                                          + "&limit=1"
                                          + "&q="
                                          + encoded;

                          HttpURLConnection connection =
                                  (HttpURLConnection)
                                          new URL(url).openConnection();

                          connection.setRequestMethod("GET");
                          connection.setRequestProperty(
                                  "User-Agent",
                                  "CarAssistant/NavigationV2"
                          );
                          connection.setConnectTimeout(10000);
                          connection.setReadTimeout(10000);

                          InputStream input =
                                  connection.getInputStream();

                          BufferedReader reader =
                                  new BufferedReader(
                                          new InputStreamReader(input)
                                  );

                          StringBuilder body = new StringBuilder();
                          String line;

                          while ((line = reader.readLine()) != null) {
                              body.append(line);
                          }

                          reader.close();
                          connection.disconnect();

                          JSONArray results =
                                  new JSONArray(body.toString());

                          if (results.length() == 0) {
                              mainHandler.post(() ->
                                      resultText.setText(
                                              "Không tìm thấy địa điểm"
                                      )
                              );
                              return;
                          }

                          JSONObject item =
                                  results.getJSONObject(0);

                          double lat =
                                  Double.parseDouble(
                                          item.getString("lat")
                                  );

                          double lon =
                                  Double.parseDouble(
                                          item.getString("lon")
                                  );

                          String name =
                                  item.optString(
                                          "display_name",
                                          query
                                  );

                          mainHandler.post(() -> {
                              resultText.setText(name);

                              if (map != null) {
                                  map.animateCamera(
                                          com.mapbox.mapboxsdk.camera
                                                  .CameraUpdateFactory
                                                  .newLatLngZoom(
                                                          new LatLng(
                                                                  lat,
                                                                  lon
                                                          ),
                                                          15.0
                                                  ),
                                          600
                                  );
                              }

                              Button routeButton =
                                      new Button(activity);

                              routeButton.setText(
                                      "ĐẾN ĐÂY"
                              );

                              routeButton.setOnClickListener(
                                      v -> calculateRoute(
                                              lat,
                                              lon
                                      )
                              );

                              if (routeButton.getParent() == null) {
                                  addView(
                                          routeButton,
                                          createRouteButtonParams()
                                  );
                              }
                          });

                      } catch (Exception e) {
                          mainHandler.post(() ->
                                  resultText.setText(
                                          "Lỗi tìm kiếm: "
                                                  + e.getClass()
                                                  .getSimpleName()
                                  )
                          );
                      }
                  }).start();
              }

              private LayoutParams createRouteButtonParams() {
                  LayoutParams params =
                          new LayoutParams(
                                  LayoutParams.WRAP_CONTENT,
                                  LayoutParams.WRAP_CONTENT
                          );

                  params.gravity =
                          Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL;

                  params.setMargins(
                          0,
                          0,
                          0,
                          24
                  );

                  return params;
              }

              private void calculateRoute(
                      double destinationLat,
                      double destinationLon
              ) {
                  if (!hasLocation) {
                      Toast.makeText(
                              activity,
                              "Chưa có vị trí GPS",
                              Toast.LENGTH_SHORT
                      ).show();
                      return;
                  }

                  resultText.setText("Đang tính tuyến...");

                  new Thread(() -> {
                      try {
                          String url =
                                  "https://router.project-osrm.org/route/v1/driving/"
                                          + currentLon
                                          + ","
                                          + currentLat
                                          + ";"
                                          + destinationLon
                                          + ","
                                          + destinationLat
                                          + "?overview=full"
                                          + "&geometries=geojson";

                          HttpURLConnection connection =
                                  (HttpURLConnection)
                                          new URL(url).openConnection();

                          connection.setRequestMethod("GET");
                          connection.setRequestProperty(
                                  "User-Agent",
                                  "CarAssistant/NavigationV2"
                          );
                          connection.setConnectTimeout(15000);
                          connection.setReadTimeout(15000);

                          InputStream input =
                                  connection.getInputStream();

                          BufferedReader reader =
                                  new BufferedReader(
                                          new InputStreamReader(input)
                                  );

                          StringBuilder body = new StringBuilder();
                          String line;

                          while ((line = reader.readLine()) != null) {
                              body.append(line);
                          }

                          reader.close();
                          connection.disconnect();

                          JSONObject response =
                                  new JSONObject(body.toString());

                          JSONArray routes =
                                  response.getJSONArray("routes");

                          if (routes.length() == 0) {
                              throw new Exception(
                                      "No route"
                              );
                          }

                          JSONObject route =
                                  routes.getJSONObject(0);

                          JSONObject geometry =
                                  route.getJSONObject("geometry");

                          JSONArray coordinates =
                                  geometry.getJSONArray("coordinates");

                          List<LatLng> points =
                                  new ArrayList<>();

                          for (int i = 0;
                               i < coordinates.length();
                               i++) {

                              JSONArray point =
                                      coordinates.getJSONArray(i);

                              double lon =
                                      point.getDouble(0);

                              double lat =
                                      point.getDouble(1);

                              points.add(
                                      new LatLng(lat, lon)
                              );
                          }

                          double distance =
                                  route.getDouble("distance");

                          double duration =
                                  route.getDouble("duration");

                          mainHandler.post(() -> {
                              drawRoute(points);

                              String km =
                                      String.format(
                                              "%.1f km",
                                              distance / 1000.0
                                      );

                              String min =
                                      String.format(
                                              "%.0f phút",
                                              duration / 60.0
                                      );

                              resultText.setText(
                                      "Tuyến: "
                                              + km
                                              + " • "
                                              + min
                              );
                          });

                      } catch (Exception e) {
                          mainHandler.post(() ->
                                  resultText.setText(
                                          "Lỗi tính tuyến: "
                                                  + e.getClass()
                                                  .getSimpleName()
                                  )
                          );
                      }
                  }).start();
              }

              private void drawRoute(List<LatLng> points) {
                  if (map == null || points.isEmpty()) {
                      return;
                  }

                  map.addPolyline(
                          new com.mapbox.mapboxsdk.annotations
                                  .PolylineOptions()
                                  .addAll(points)
                          .color(Color.BLUE)
                          .width(7f)
                  );

                  LatLng first = points.get(0);

                  map.animateCamera(
                          com.mapbox.mapboxsdk.camera
                                  .CameraUpdateFactory
                                  .newLatLngZoom(
                                          first,
                                          14.0
                                  ),
                          600
                  );
              }

              @Override
              protected void onAttachedToWindow() {
                  super.onAttachedToWindow();

                  if (mapView != null) {
                      mapView.onStart();
                      mapView.onResume();
                  }
              }

              @Override
              protected void onDetachedFromWindow() {
                  if (mapView != null) {
                      mapView.onPause();
                  }

                  super.onDetachedFromWindow();
              }
          }
          JAVA

      - name: Patch Navigation entry by marker
        shell: bash
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          source = path.read_text()

          start_marker = "    private void buildUi() {"
          end_marker = "    private void buildDashboard() {"

          start = source.find(start_marker)
          end = source.find(end_marker)

          if start < 0:
              raise SystemExit("buildUi start marker not found")

          if end < 0:
              raise SystemExit("buildDashboard marker not found")

          if end <= start:
              raise SystemExit("Invalid buildUi/buildDashboard order")

          new_build_ui = """    private void buildUi() {
          // NAV_V2_ENTRY_BEGIN

          root = new FrameLayout(this);

          projectionLayer = new FrameLayout(this);
          root.addView(
                  projectionLayer,
                  new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                  )
          );

          launcherLayer = new FrameLayout(this);
          root.addView(
                  launcherLayer,
                  new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                  )
          );

          navigationMap = new NavigationMapView(this);
          navigationMap.setVisibility(View.GONE);

          navigationMap.setOnExitListener(() -> {
              navigationMap.closeNavigation();
              navigationMap.setVisibility(View.GONE);
              launcherLayer.setVisibility(View.VISIBLE);
              launcherLayer.bringToFront();
          });

          root.addView(
                  navigationMap,
                  new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                  )
          );

          buildDashboard();

          setContentView(root);

          launcherLayer.bringToFront();

          // NAV_V2_ENTRY_END
      }

"""

          source = source[:start] + new_build_ui + source[end:]

          path.write_text(source)

          check = path.read_text()

          if check.count("// NAV_V2_ENTRY_BEGIN") != 1:
              raise SystemExit("NAV_V2_ENTRY_BEGIN marker count is not 1")

          if check.count("// NAV_V2_ENTRY_END") != 1:
              raise SystemExit("NAV_V2_ENTRY_END marker count is not 1")

          if check.count("navigationMap = new NavigationMapView(this);") != 1:
              raise SystemExit(
                  "NavigationMapView construction count is not 1"
              )

          if check.count("navigationMap.setOnExitListener") != 1:
              raise SystemExit(
                  "Navigation exit listener count is not 1"
              )

          print("Navigation entry marker patch OK")
          PY

      - name: Patch Navigation card click
        shell: bash
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          source = path.read_text()

          call = "navigationMap.openNavigation();"

          if source.count(call) == 0:
              marker = "        content.addView(map,"
              pos = source.find(marker)

              if pos < 0:
                  raise SystemExit(
                      "MAP card content.addView marker not found"
                  )

              click_block = """        map.setOnClickListener(v -> {
              launcherLayer.setVisibility(View.GONE);
              navigationMap.setVisibility(View.VISIBLE);
              navigationMap.openNavigation();
              navigationMap.bringToFront();
          });

"""

              source = source[:pos] + click_block + source[pos:]

          path.write_text(source)

          check = path.read_text()

          if check.count(call) != 1:
              raise SystemExit(
                  "navigationMap.openNavigation() count is not 1"
              )

          print("Navigation card click patch OK")
          PY

      - name: Verify Navigation V2 entry
        shell: bash
        run: |
          set -e
          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq "NAV_V2_ENTRY_BEGIN" "$FILE"
          grep -Fq "NAV_V2_ENTRY_END" "$FILE"
          grep -Fq "navigationMap.setOnExitListener" "$FILE"
          grep -Fq "navigationMap.openNavigation();" "$FILE"
          grep -Fq "navigationMap.bringToFront();" "$FILE"

          COUNT="$(grep -Fc "navigationMap = new NavigationMapView(this);" "$FILE")"
          test "$COUNT" = "1"

          echo "Navigation V2 entry verification OK"

      - name: Verify Home UI V2
        shell: bash
        run: |
          set -e
          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq "CAR ASSISTANT" "$FILE"
          grep -Fq "MAP" "$FILE"
          grep -Fq "Navigation" "$FILE"
          grep -Fq "SPEED" "$FILE"
          grep -Fq "WEATHER" "$FILE"
          grep -Fq "MEDIA" "$FILE"
          grep -Fq "APPS" "$FILE"

          echo "Home UI V2 verification OK"

      - name: Verify Navigation lifecycle
        shell: bash
        run: |
          set -e
          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          grep -Fq "onAttachedToWindow" "$FILE"
          grep -Fq "onDetachedFromWindow" "$FILE"
          grep -Fq "mapView.onStart()" "$FILE"
          grep -Fq "mapView.onResume()" "$FILE"
          grep -Fq "mapView.onPause()" "$FILE"

          echo "Navigation lifecycle verification OK"

      - name: Hash protected Projection Core after changes
        shell: bash
        run: |
          set -e

          sha256sum \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java \
            > /tmp/projection-core-after.txt

          diff -u \
            /tmp/projection-core-before.txt \
            /tmp/projection-core-after.txt

          echo "Projection Core unchanged"

      - name: Check source diff
        shell: bash
        run: |
          set -e
          git diff --check
          git status --short
          git diff --stat

      - name: Build APK
        shell: bash
        run: |
          set -e
          chmod +x ./gradlew
          ./gradlew :v10-source:app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
