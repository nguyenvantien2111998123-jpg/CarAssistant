      - name: Register phone Navigation Activity
        shell: bash
        run: |
          set -e

          FILE="v10-source/app/src/main/AndroidManifest.xml"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          activity = """
          <activity
              android:name="com.carassistant.v10.V10NavigationActivity"
              android:exported="false" />
          """

          if "V10NavigationActivity" not in s:

              marker = """
          <activity
              android:name="com.carassistant.v10.V10CarActivity"
              android:exported="true" />
          """

              if marker not in s:
                  raise SystemExit(
                      "V10CarActivity manifest marker not found"
                  )

              s = s.replace(
                  marker,
                  marker + activity,
                  1
              )

              p.write_text(s)

          print("Phone Navigation Activity registered")
          PY

