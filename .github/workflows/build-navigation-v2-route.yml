name: Build Navigation V2 Route

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          ref: 9b2fc5b3f24b32ff4f2ed7ddb6d794cdb5f647f9
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify baseline
        shell: bash
        run: |
          set -e

          EXPECTED="9b2fc5b3f24b32ff4f2ed7ddb6d794cdb5f647f9"

          test "$(git rev-parse HEAD)" = "$EXPECTED"

          test -f v10-source/settings.gradle
          test -f v10-source/app/build.gradle
          test -f v10-source/gradlew

          echo "Baseline OK: $EXPECTED"

      - name: Protect Projection Core
        shell: bash
        run: |
          set -e

          sha256sum \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java \
            > /tmp/projection-before.txt

      - name: Protect baseline files
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/baseline-protected

          cp \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java \
            /tmp/baseline-protected/V10CarActivity.java

          cp \
            v10-source/app/build.gradle \
            /tmp/baseline-protected/build.gradle

          echo "Baseline copies created"

      - name: Fix MapLibre dependency only
        shell: bash
        run: |
          set -e

          FILE="v10-source/app/build.gradle"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          old1 = 'implementation "org.maplibre.gl:android-sdk-opengl:11.8.0"'
          old2 = 'implementation "org.maplibre.gl:android-sdk:11.11.0"'
          wanted = 'implementation "org.maplibre.gl:android-sdk:11.8.0"'

          s = s.replace(old1, wanted)
          s = s.replace(old2, wanted)

          if wanted not in s:
              raise SystemExit("MapLibre 11.8.0 dependency not found")

          p.write_text(s)
          PY

          grep -Fq \
            'implementation "org.maplibre.gl:android-sdk:11.8.0"' \
            "$FILE"

          ! grep -Fq \
            'android-sdk-opengl:11.8.0' \
            "$FILE"

          echo "MapLibre dependency OK"

      - name: Verify MapLibre dependency
        shell: bash
        run: |
          set -e

          chmod +x v10-source/gradlew

          cd v10-source

          ./gradlew :app:dependencies \
            --configuration debugCompileClasspath \
            --no-daemon \
            > /tmp/dependencies.txt

          grep -Fq \
            'org.maplibre.gl:android-sdk:11.8.0' \
            /tmp/dependencies.txt

          echo "MapLibre resolution OK"

      - name: Add INTERNET permission
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("v10-source/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET" />'

          if permission not in s:
              marker = '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />'

              if marker not in s:
                  raise SystemExit("Location permission marker not found")

              s = s.replace(
                  marker,
                  marker + "\n    " + permission,
                  1
              )

              p.write_text(s)

          print("INTERNET permission OK")
          PY

          grep -Fq \
            'android.permission.INTERNET' \
            v10-source/app/src/main/AndroidManifest.xml

      - name: Restore Navigation V2 source
        shell: bash
        run: |
          set -e

          NAV_COMMIT="4b391b252b9d92840b151045f533056f47684e71"

          NAV="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          git fetch origin "$NAV_COMMIT" --depth=1

          git show "$NAV_COMMIT:$NAV" > "$NAV"

          test -s "$NAV"

          grep -Fq "class NavigationMapView" "$NAV"

          echo "Navigation V2 baseline restored"

      - name: Patch NavigationMapView only
        shell: bash
        run: |
          set -e

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          cat > "$FILE" <<'JAVA'
          package com.carassistant.v10;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.location.Location;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.TextUtils;
          import android.widget.FrameLayout;

          import org.json.JSONArray;
          import org.json.JSONObject;
          import org.maplibre.android.MapLibre;
          import org.maplibre.android.camera.CameraUpdateFactory;
          import org.maplibre.android.geometry.LatLng;
          import org.maplibre.android.maps.MapLibreMap;
          import org.maplibre.android.maps.MapView;
          import org.maplibre.android.maps.UiSettings;
          import org.maplibre.android.style.layers.LineLayer;
          import org.maplibre.android.style.layers.PropertyFactory;
          import org.maplibre.android.style.sources.GeoJsonSource;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.util.Locale;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public final class NavigationMapView extends FrameLayout {

              private static final int LOCATION_REQUEST = 4101;

              private static final String ROUTE_SOURCE =
                      "carassistant-route-source";

              private static final String ROUTE_LAYER =
                      "carassistant-route-layer";

              private final MapView mapView;
              private final Handler mainHandler =
                      new Handler(Looper.getMainLooper());

              private final ExecutorService networkExecutor =
                      Executors.newSingleThreadExecutor();

              private MapLibreMap map;
              private GeoJsonSource routeSource;

              public interface SearchListener {
                  void onSearchStarted();
                  void onSearchResults(String[] names, double[] lats, double[] lngs);
                  void onSearchError(String message);
              }

              public interface RouteListener {
                  void onRouteStarted();
                  void onRouteReady(double distanceMeters, double durationSeconds);
                  void onRouteError(String message);
              }

              public NavigationMapView(Context context) {
                  super(context);

                  setBackgroundColor(Color.BLACK);

                  MapLibre.getInstance(
                          context.getApplicationContext());

                  mapView = new MapView(context);

                  mapView.onCreate(new Bundle());

                  addView(
                          mapView,
                          new LayoutParams(-1, -1));

                  mapView.getMapAsync(
                          this::onMapReady);
              }

              private void onMapReady(
                      MapLibreMap readyMap) {

                  map = readyMap;

                  UiSettings ui =
                          map.getUiSettings();

                  ui.setCompassEnabled(false);
                  ui.setZoomGesturesEnabled(true);
                  ui.setScrollGesturesEnabled(true);
                  ui.setRotateGesturesEnabled(true);
                  ui.setTiltGesturesEnabled(false);

                  map.setStyle(
                          "https://tiles.openfreemap.org/styles/liberty",
                          style -> {

                              routeSource =
                                      new GeoJsonSource(
                                              ROUTE_SOURCE);

                              style.addSource(
                                      routeSource);

                              LineLayer routeLayer =
                                      new LineLayer(
                                              ROUTE_LAYER,
                                              ROUTE_SOURCE);

                              routeLayer.setProperties(
                                      PropertyFactory.lineColor(
                                              "#1976D2"),
                                      PropertyFactory.lineWidth(
                                              6f),
                                      PropertyFactory.lineOpacity(
                                              0.90f));

                              style.addLayer(routeLayer);

                              enableLocation();

                              mainHandler.postDelayed(
                                      this::recenter,
                                      700);
                          });
              }

              private void enableLocation() {

                  if (map == null) {
                      return;
                  }

                  Context context =
                          getContext();

                  if (context == null) {
                      return;
                  }

                  if (context.checkSelfPermission(
                          Manifest.permission.ACCESS_FINE_LOCATION)
                          != PackageManager.PERMISSION_GRANTED) {

                      if (context instanceof Activity) {

                          ((Activity) context)
                                  .requestPermissions(
                                          new String[]{
                                                  Manifest.permission.ACCESS_FINE_LOCATION,
                                                  Manifest.permission.ACCESS_COARSE_LOCATION
                                          },
                                          LOCATION_REQUEST);
                      }

                      return;
                  }

                  try {

                      map.getLocationComponent()
                              .activateLocationComponent(
                                      map.getStyle());

                      map.getLocationComponent()
                              .setLocationComponentEnabled(true);

                  } catch (Exception ignored) {
                  }
              }

              public void onLocationPermissionResult() {

                  enableLocation();

                  mainHandler.postDelayed(
                          this::recenter,
                          500);
              }

              public void zoomIn() {

                  if (map == null) {
                      return;
                  }

                  double z =
                          map.getCameraPosition().zoom;

                  map.animateCamera(
                          CameraUpdateFactory.zoomTo(
                                  Math.min(
                                          20.0,
                                          z + 1.0)),
                          250);
              }

              public void zoomOut() {

                  if (map == null) {
                      return;
                  }

                  double z =
                          map.getCameraPosition().zoom;

                  map.animateCamera(
                          CameraUpdateFactory.zoomTo(
                                  Math.max(
                                          1.0,
                                          z - 1.0)),
                          250);
              }

              public void recenter() {

                  if (map == null) {
                      return;
                  }

                  try {

                      Location location =
                              map.getLocationComponent()
                                      .getLastKnownLocation();

                      if (location == null) {
                          return;
                      }

                      map.animateCamera(
                              CameraUpdateFactory.newLatLngZoom(
                                      new LatLng(
                                              location.getLatitude(),
                                              location.getLongitude()),
                                      16.0),
                              500);

                  } catch (Exception ignored) {
                  }
              }

              public void search(
                      String query,
                      SearchListener listener) {

                  if (TextUtils.isEmpty(query)) {

                      if (listener != null) {
                          listener.onSearchError(
                                  "Vui lòng nhập địa điểm");
                      }

                      return;
                  }

                  if (listener != null) {
                      listener.onSearchStarted();
                  }

                  networkExecutor.execute(() -> {

                      HttpURLConnection connection =
                              null;

                      try {

                          String encoded =
                                  URLEncoder.encode(
                                          query,
                                          "UTF-8");

                          String url =
                                  "https://nominatim.openstreetmap.org/search"
                                  + "?format=json"
                                  + "&limit=5"
                                  + "&q="
                                  + encoded;

                          connection =
                                  (HttpURLConnection)
                                          new URL(url)
                                                  .openConnection();

                          connection.setRequestMethod("GET");
                          connection.setConnectTimeout(10000);
                          connection.setReadTimeout(10000);

                          connection.setRequestProperty(
                                  "User-Agent",
                                  "CarAssistant/1.0");

                          int code =
                                  connection.getResponseCode();

                          if (code < 200 || code >= 300) {
                              throw new Exception(
                                      "HTTP " + code);
                          }

                          String body =
                                  readStream(
                                          connection.getInputStream());

                          JSONArray array =
                                  new JSONArray(body);

                          int count =
                                  Math.min(
                                          5,
                                          array.length());

                          String[] names =
                                  new String[count];

                          double[] lats =
                                  new double[count];

                          double[] lngs =
                                  new double[count];

                          for (int i = 0;
                               i < count;
                               i++) {

                              JSONObject item =
                                      array.getJSONObject(i);

                              names[i] =
                                      item.optString(
                                              "display_name",
                                              "Địa điểm");

                              lats[i] =
                                      Double.parseDouble(
                                              item.getString(
                                                      "lat"));

                              lngs[i] =
                                      Double.parseDouble(
                                              item.getString(
                                                      "lon"));
                          }

                          mainHandler.post(() -> {

                              if (listener != null) {
                                  listener.onSearchResults(
                                          names,
                                          lats,
                                          lngs);
                              }
                          });

                      } catch (Exception e) {

                          mainHandler.post(() -> {

                              if (listener != null) {
                                  listener.onSearchError(
                                          "Không tìm thấy địa điểm");
                              }
                          });

                      } finally {

                          if (connection != null) {
                              connection.disconnect();
                          }
                      }
                  });
              }

              public void setDestinationAndRoute(
                      double destinationLat,
                      double destinationLng,
                      RouteListener listener) {

                  if (listener != null) {
                      listener.onRouteStarted();
                  }

                  Location origin =
                          getCurrentLocation();

                  if (origin == null) {

                      if (listener != null) {
                          listener.onRouteError(
                                  "Chưa lấy được vị trí hiện tại");
                      }

                      return;
                  }

                  final double originLat =
                          origin.getLatitude();

                  final double originLng =
                          origin.getLongitude();

                  networkExecutor.execute(() -> {

                      HttpURLConnection connection =
                              null;

                      try {

                          String url =
                                  String.format(
                                          Locale.US,
                                          "https://router.project-osrm.org/route/v1/driving/"
                                          + "%f,%f;%f,%f"
                                          + "?overview=full&geometries=geojson",
                                          originLng,
                                          originLat,
                                          destinationLng,
                                          destinationLat);

                          connection =
                                  (HttpURLConnection)
                                          new URL(url)
                                                  .openConnection();

                          connection.setRequestMethod("GET");
                          connection.setConnectTimeout(15000);
                          connection.setReadTimeout(15000);

                          connection.setRequestProperty(
                                  "User-Agent",
                                  "CarAssistant/1.0");

                          int code =
                                  connection.getResponseCode();

                          if (code < 200 || code >= 300) {
                              throw new Exception(
                                      "HTTP " + code);
                          }

                          String body =
                                  readStream(
                                          connection.getInputStream());

                          JSONObject root =
                                  new JSONObject(body);

                          String status =
                                  root.optString(
                                          "code",
                                          "");

                          if (!"Ok".equalsIgnoreCase(status)) {
                              throw new Exception(
                                      "OSRM route error");
                          }

                          JSONArray routes =
                                  root.getJSONArray(
                                          "routes");

                          if (routes.length() == 0) {
                              throw new Exception(
                                      "Không có tuyến đường");
                          }

                          JSONObject route =
                                  routes.getJSONObject(0);

                          double distance =
                                  route.optDouble(
                                          "distance",
                                          0);

                          double duration =
                                  route.optDouble(
                                          "duration",
                                          0);

                          JSONObject geometry =
                                  route.getJSONObject(
                                          "geometry");

                          mainHandler.post(() -> {

                              try {

                                  drawRoute(
                                          geometry);

                                  if (listener != null) {
                                      listener.onRouteReady(
                                              distance,
                                              duration);
                                  }

                              } catch (Exception e) {

                                  if (listener != null) {
                                      listener.onRouteError(
                                              "Không thể vẽ tuyến");
                                  }
                              }
                          });

                      } catch (Exception e) {

                          mainHandler.post(() -> {

                              if (listener != null) {
                                  listener.onRouteError(
                                          "Không tính được tuyến đường");
                              }
                          });

                      } finally {

                          if (connection != null) {
                              connection.disconnect();
                          }
                      }
                  });
              }

              private Location getCurrentLocation() {

                  if (map == null) {
                      return null;
                  }

                  try {

                      return map.getLocationComponent()
                              .getLastKnownLocation();

                  } catch (Exception ignored) {

                      return null;
                  }
              }

              private void drawRoute(
                      JSONObject geometry)
                      throws Exception {

                  if (map == null
                          || map.getStyle() == null
                          || routeSource == null) {

                      throw new Exception(
                              "Map chưa sẵn sàng");
                  }

                  routeSource.setGeoJson(
                          geometry.toString());

                  JSONArray coordinates =
                          geometry.getJSONArray(
                                  "coordinates");

                  if (coordinates.length() == 0) {
                      return;
                  }

                  double minLat = 90;
                  double maxLat = -90;
                  double minLng = 180;
                  double maxLng = -180;

                  for (int i = 0;
                       i < coordinates.length();
                       i++) {

                      JSONArray point =
                              coordinates.getJSONArray(i);

                      double lng =
                              point.getDouble(0);

                      double lat =
                              point.getDouble(1);

                      minLat =
                              Math.min(
                                      minLat,
                                      lat);

                      maxLat =
                              Math.max(
                                      maxLat,
                                      lat);

                      minLng =
                              Math.min(
                                      minLng,
                                      lng);

                      maxLng =
                              Math.max(
                                      maxLng,
                                      lng);
                  }

                  LatLng southWest =
                          new LatLng(
                                  minLat,
                                  minLng);

                  LatLng northEast =
                          new LatLng(
                                  maxLat,
                                  maxLng);

                  map.animateCamera(
                          CameraUpdateFactory.newLatLngBounds(
                                  new org.maplibre.android.geometry.LatLngBounds.Builder()
                                          .include(southWest)
                                          .include(northEast)
                                          .build(),
                                  80),
                          700);
              }

              private String readStream(
                      InputStream input)
                      throws Exception {

                  BufferedReader reader =
                          new BufferedReader(
                                  new InputStreamReader(
                                          input,
                                          "UTF-8"));

                  StringBuilder builder =
                          new StringBuilder();

                  String line;

                  while ((line = reader.readLine())
                          != null) {

                      builder.append(line);
                  }

                  reader.close();

                  return builder.toString();
              }

              public void onHostResume() {
                  mapView.onResume();
              }

              public void onHostPause() {
                  mapView.onPause();
              }

              public void onHostDestroy() {

                  networkExecutor.shutdownNow();

                  mapView.onDestroy();
              }
          }
          JAVA

          grep -Fq \
            "class NavigationMapView" \
            "$FILE"

          grep -Fq \
            "public void recenter()" \
            "$FILE"

          grep -Fq \
            "public void search(" \
            "$FILE"

          grep -Fq \
            "public void setDestinationAndRoute(" \
            "$FILE"

          grep -Fq \
            "router.project-osrm.org" \
            "$FILE"

          grep -Fq \
            "nominatim.openstreetmap.org" \
            "$FILE"

          echo "NavigationMapView feature patch OK"

      - name: Add phone Navigation Activity
        shell: bash
        run: |
          set -e

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10NavigationActivity.java"

          cat > "$FILE" <<'JAVA'
          package com.carassistant.v10;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.Locale;

          public final class V10NavigationActivity
                  extends Activity {

              private NavigationMapView navigationMap;
              private LinearLayout results;
              private TextView status;
              private EditText searchBox;

              @Override
              protected void onCreate(
                      Bundle state) {

                  super.onCreate(state);

                  buildPhoneUi();

                  if (checkSelfPermission(
                          Manifest.permission.ACCESS_FINE_LOCATION)
                          != PackageManager.PERMISSION_GRANTED) {

                      requestPermissions(
                              new String[]{
                                      Manifest.permission.ACCESS_FINE_LOCATION,
                                      Manifest.permission.ACCESS_COARSE_LOCATION
                              },
                              4101);

                  } else {

                      navigationMap
                              .onLocationPermissionResult();
                  }
              }

              private void buildPhoneUi() {

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL);

                  root.setPadding(
                          18,
                          18,
                          18,
                          18);

                  root.setBackgroundColor(
                          Color.rgb(7, 9, 12));

                  TextView title =
                          text(
                                  "CAR ASSISTANT NAVIGATION",
                                  21);

                  title.setTextColor(
                          Color.WHITE);

                  root.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  60));

                  LinearLayout searchRow =
                          new LinearLayout(this);

                  searchRow.setGravity(
                          Gravity.CENTER_VERTICAL);

                  searchBox =
                          new EditText(this);

                  searchBox.setHint(
                          "Tìm địa điểm...");

                  searchBox.setSingleLine(true);

                  searchBox.setTextColor(
                          Color.WHITE);

                  searchBox.setHintTextColor(
                          Color.LTGRAY);

                  searchRow.addView(
                          searchBox,
                          new LinearLayout.LayoutParams(
                                  0,
                                  58,
                                  1));

                  Button search =
                          button("TÌM");

                  search.setOnClickListener(
                          v -> performSearch());

                  searchRow.addView(
                          search,
                          new LinearLayout.LayoutParams(
                                  75,
                                  58));

                  root.addView(searchRow);

                  LinearLayout controls =
                          new LinearLayout(this);

                  Button recenter =
                          button("📍 RECENTER");

                  recenter.setOnClickListener(
                          v -> {

                              navigationMap.recenter();

                              status.setText(
                                      "Đã đưa camera về vị trí hiện tại");
                          });

                  controls.addView(
                          recenter,
                          new LinearLayout.LayoutParams(
                                  0,
                                  54,
                                  1));

                  root.addView(controls);

                  status =
                          text(
                                  "Đang khởi tạo bản đồ...",
                                  13);

                  status.setTextColor(
                          Color.LTGRAY);

                  root.addView(
                          status,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  45));

                  ScrollView resultScroll =
                          new ScrollView(this);

                  results =
                          new LinearLayout(this);

                  results.setOrientation(
                          LinearLayout.VERTICAL);

                  resultScroll.addView(results);

                  root.addView(
                          resultScroll,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  0.32f));

                  navigationMap =
                          new NavigationMapView(this);

                  root.addView(
                          navigationMap,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  0,
                                  1f));

                  setContentView(root);
              }

              private void performSearch() {

                  String query =
                          searchBox
                                  .getText()
                                  .toString()
                                  .trim();

                  results.removeAllViews();

                  status.setText(
                          "Đang tìm kiếm...");

                  navigationMap.search(
                          query,
                          new NavigationMapView.SearchListener() {

                              @Override
                              public void onSearchStarted() {
                                  status.setText(
                                          "Đang tìm kiếm...");
                              }

                              @Override
                              public void onSearchResults(
                                      String[] names,
                                      double[] lats,
                                      double[] lngs) {

                                  results.removeAllViews();

                                  if (names.length == 0) {

                                      status.setText(
                                              "Không tìm thấy địa điểm");

                                      return;
                                  }

                                  status.setText(
                                          "Chọn một địa điểm để tính tuyến");

                                  for (int i = 0;
                                       i < names.length;
                                       i++) {

                                      final double lat =
                                              lats[i];

                                      final double lng =
                                              lngs[i];

                                      Button item =
                                              button(
                                                      names[i]);

                                      item.setGravity(
                                              Gravity.CENTER_VERTICAL);

                                      item.setOnClickListener(
                                              v -> routeTo(
                                                      lat,
                                                      lng));

                                      results.addView(
                                              item,
                                              new LinearLayout.LayoutParams(
                                                      -1,
                                                      64));
                                  }
                              }

                              @Override
                              public void onSearchError(
                                      String message) {

                                  status.setText(
                                          message);
                              }
                          });
              }

              private void routeTo(
                      double lat,
                      double lng) {

                  status.setText(
                          "Đang tính tuyến...");

                  navigationMap
                          .setDestinationAndRoute(
                                  lat,
                                  lng,
                                  new NavigationMapView.RouteListener() {

                                      @Override
                                      public void onRouteStarted() {
                                          status.setText(
                                                  "Đang tính tuyến...");
                                      }

                                      @Override
                                      public void onRouteReady(
                                              double distance,
                                              double duration) {

                                          double km =
                                                  distance / 1000.0;

                                          long minutes =
                                                  Math.round(
                                                          duration / 60.0);

                                          status.setText(
                                                  String.format(
                                                          Locale.US,
                                                          "Tuyến: %.1f km • %d phút",
                                                          km,
                                                          minutes));

                                          Toast.makeText(
                                                  V10NavigationActivity.this,
                                                  "Đã vẽ tuyến",
                                                  Toast.LENGTH_SHORT)
                                                  .show();
                                      }

                                      @Override
                                      public void onRouteError(
                                              String message) {

                                          status.setText(
                                                  message);
                                      }
                                  });
              }

              private Button button(
                      String value) {

                  Button button =
                          new Button(this);

                  button.setText(value);

                  return button;
              }

              private TextView text(
                      String value,
                      float size) {

                  TextView view =
                          new TextView(this);

                  view.setText(value);
                  view.setTextSize(size);

                  return view;
              }

              @Override
              protected void onResume() {

                  super.onResume();

                  if (navigationMap != null) {
                      navigationMap.onHostResume();
                  }
              }

              @Override
              protected void onPause() {

                  if (navigationMap != null) {
                      navigationMap.onHostPause();
                  }

                  super.onPause();
              }

              @Override
              protected void onDestroy() {

                  if (navigationMap != null) {
                      navigationMap.onHostDestroy();
                      navigationMap = null;
                  }

                  super.onDestroy();
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] grantResults) {

                  super.onRequestPermissionsResult(
                          requestCode,
                          permissions,
                          grantResults);

                  if (requestCode != 4101) {
                      return;
                  }

                  boolean granted =
                          grantResults.length > 0
                                  && grantResults[0]
                                  == PackageManager.PERMISSION_GRANTED;

                  if (granted) {

                      status.setText(
                              "Vị trí đã được cấp quyền");

                      navigationMap
                              .onLocationPermissionResult();

                  } else {

                      status.setText(
                              "Chưa được cấp quyền vị trí");
                  }
              }
          }
          JAVA

