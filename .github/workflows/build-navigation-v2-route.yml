name: Build Navigation V2 Route

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout locked Navigation V1 baseline
        uses: actions/checkout@v4
        with:
          ref: 9b2fc5b3f24b32ff4f2ed7ddb6d794cdb5f647f9
          fetch-depth: 1

      - name: Verify locked baseline
        shell: bash
        run: |
          set -e
          EXPECTED="9b2fc5b3f24b32ff4f2ed7ddb6d794cdb5f647f9"
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED"
          echo "Baseline OK: $ACTUAL"

      - name: Verify Android project
        shell: bash
        run: |
          set -e
          test -f v10-source/settings.gradle
          test -f v10-source/app/build.gradle
          test -f v10-source/app/src/main/AndroidManifest.xml
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java
          test -f v10-source/app/libs/aasdk-legacy.jar
          test -f v10-source/app/libs/aasdk-legacy.dex
          echo "Android project verification OK"

      - name: Hash protected Projection Core before Navigation V2
        shell: bash
        run: |
          set -e
          cd v10-source
          sha256sum \
            app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java \
            > /tmp/projection-core-before.txt

      - name: Add Navigation network permission
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          path = Path("v10-source/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET" />'

          if permission not in text:
              marker = "<application"
              if marker not in text:
                  raise SystemExit("AndroidManifest application marker not found")

              text = text.replace(
                  marker,
                  permission + "\n    " + marker,
                  1
              )
              path.write_text(text)

          if permission not in path.read_text():
              raise SystemExit("INTERNET permission verification failed")

          print("INTERNET permission OK")
          PY

      - name: Write Navigation V2 source
        shell: bash
        run: |
          set -e
          cat > v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java <<'JAVA'
          package com.hieptran.aacast.doudou;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.annotation.NonNull;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import org.json.JSONArray;
          import org.json.JSONObject;
          import org.maplibre.android.camera.CameraUpdateFactory;
          import org.maplibre.android.geometry.LatLng;
          import org.maplibre.android.location.LocationComponent;
          import org.maplibre.android.location.modes.CameraMode;
          import org.maplibre.android.maps.MapLibreMap;
          import org.maplibre.android.maps.MapView;
          import org.maplibre.android.maps.OnMapReadyCallback;
          import org.maplibre.android.maps.Style;
          import org.maplibre.android.style.layers.LineLayer;
          import org.maplibre.android.style.sources.GeoJsonSource;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.util.ArrayList;
          import java.util.List;

          public final class NavigationMapView extends FrameLayout {

              public interface ExitListener {
                  void onExitNavigation();
              }

              private static final int LOCATION_REQUEST = 701;

              private final Activity activity;
              private final Handler handler =
                      new Handler(Looper.getMainLooper());

              private final MapView mapView;

              private MapLibreMap map;
              private LocationComponent locationComponent;

              private EditText searchBox;
              private TextView resultText;

              private double currentLat;
              private double currentLon;
              private boolean hasLocation;
              private boolean firstLocationFix;

              private ExitListener exitListener;

              public NavigationMapView(Activity activity) {
                  super(activity);
                  this.activity = activity;

                  setBackgroundColor(Color.BLACK);

                  mapView = new MapView(activity);

                  LayoutParams mapParams =
                          new LayoutParams(
                                  LayoutParams.MATCH_PARENT,
                                  LayoutParams.MATCH_PARENT
                          );

                  addView(mapView, mapParams);
                  mapView.onCreate(null);

                  mapView.getMapAsync(
                          new OnMapReadyCallback() {
                              @Override
                              public void onMapReady(
                                      @NonNull MapLibreMap readyMap) {

                                  map = readyMap;

                                  map.setStyle(
                                          new Style.Builder()
                                                  .fromUri(
                                                          "https://tiles.openfreemap.org/styles/liberty"
                                                  ),
                                          style -> enableLocation()
                                  );
                              }
                          }
                  );

                  buildControls();
              }

              private void buildControls() {
                  LinearLayout panel =
                          new LinearLayout(activity);

                  panel.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  panel.setPadding(
                          12,
                          12,
                          12,
                          12
                  );

                  panel.setBackgroundColor(
                          0xCC202020
                  );

                  LayoutParams panelParams =
                          new LayoutParams(
                                  LayoutParams.MATCH_PARENT,
                                  LayoutParams.WRAP_CONTENT
                          );

                  panelParams.gravity = Gravity.TOP;
                  panelParams.setMargins(16, 16, 16, 0);

                  addView(panel, panelParams);

                  LinearLayout searchRow =
                          new LinearLayout(activity);

                  searchRow.setOrientation(
                          LinearLayout.HORIZONTAL
                  );

                  searchBox =
                          new EditText(activity);

                  searchBox.setHint("Tìm địa điểm");
                  searchBox.setSingleLine(true);
                  searchBox.setTextColor(Color.WHITE);
                  searchBox.setHintTextColor(0xFFBBBBBB);
                  searchBox.setBackgroundColor(0xFF303030);

                  searchRow.addView(
                          searchBox,
                          new LinearLayout.LayoutParams(
                                  0,
                                  52,
                                  1
                          )
                  );

                  Button searchButton =
                          new Button(activity);

                  searchButton.setText("TÌM");
                  searchButton.setOnClickListener(
                          v -> searchPlace()
                  );

                  searchRow.addView(
                          searchButton,
                          new LinearLayout.LayoutParams(
                                  90,
                                  52
                          )
                  );

                  panel.addView(searchRow);

                  LinearLayout buttonRow =
                          new LinearLayout(activity);

                  buttonRow.setOrientation(
                          LinearLayout.HORIZONTAL
                  );

                  Button recenterButton =
                          new Button(activity);

                  recenterButton.setText("VỊ TRÍ");
                  recenterButton.setOnClickListener(
                          v -> recenter()
                  );

                  Button exitButton =
                          new Button(activity);

                  exitButton.setText("THOÁT");
                  exitButton.setOnClickListener(
                          v -> {
                              if (exitListener != null) {
                                  exitListener.onExitNavigation();
                              }
                          }
                  );

                  buttonRow.addView(
                          recenterButton,
                          new LinearLayout.LayoutParams(
                                  0,
                                  52,
                                  1
                          )
                  );

                  buttonRow.addView(
                          exitButton,
                          new LinearLayout.LayoutParams(
                                  0,
                                  52,
                                  1
                          )
                  );

                  panel.addView(buttonRow);

                  resultText =
                          new TextView(activity);

                  resultText.setTextColor(Color.WHITE);
                  resultText.setPadding(8, 8, 8, 8);

                  panel.addView(resultText);
              }

              public void setOnExitListener(
                      ExitListener listener) {
                  exitListener = listener;
              }

              public void openNavigation() {
                  setVisibility(VISIBLE);
                  bringToFront();

                  mapView.onStart();
                  mapView.onResume();

                  if (hasLocation) {
                      recenter();
                  }
              }

              public void closeNavigation() {
                  mapView.onPause();
                  setVisibility(GONE);
              }

              public void onHostResume() {
                  mapView.onStart();
                  mapView.onResume();
              }

              public void onHostPause() {
                  mapView.onPause();
              }

              private void enableLocation() {
                  if (map == null) {
                      return;
                  }

                  if (ContextCompat.checkSelfPermission(
                          activity,
                          Manifest.permission.ACCESS_FINE_LOCATION
                  ) != PackageManager.PERMISSION_GRANTED) {

                      ActivityCompat.requestPermissions(
                              activity,
                              new String[] {
                                      Manifest.permission.ACCESS_FINE_LOCATION,
                                      Manifest.permission.ACCESS_COARSE_LOCATION
                              },
                              LOCATION_REQUEST
                      );
                      return;
                  }

                  locationComponent =
                          map.getLocationComponent();

                  locationComponent.activateLocationComponent(
                          activity,
                          map.getStyle()
                  );

                  locationComponent.setLocationComponentEnabled(
                          true
                  );

                  locationComponent.setCameraMode(
                          CameraMode.TRACKING
                  );

                  locationComponent.addOnLocationClickListener(
                          location -> {
                              if (location != null) {
                                  currentLat =
                                          location.getLatitude();
                                  currentLon =
                                          location.getLongitude();
                                  hasLocation = true;
                              }
                          }
                  );
              }

              private void recenter() {
                  if (map == null || !hasLocation) {
                      Toast.makeText(
                              activity,
                              "Chưa có vị trí GPS",
                              Toast.LENGTH_SHORT
                      ).show();
                      return;
                  }

                  map.animateCamera(
                          CameraUpdateFactory.newLatLngZoom(
                                  new LatLng(
                                          currentLat,
                                          currentLon
                                  ),
                                  15.0
                          ),
                          600
                  );

                  firstLocationFix = true;
              }

              private void searchPlace() {
                  final String query =
                          searchBox.getText()
                                  .toString()
                                  .trim();

                  if (query.isEmpty()) {
                      Toast.makeText(
                              activity,
                              "Nhập địa điểm cần tìm",
                              Toast.LENGTH_SHORT
                      ).show();
                      return;
                  }

                  resultText.setText("Đang tìm...");

                  new Thread(() -> {
                      HttpURLConnection connection = null;

                      try {
                          String encoded =
                                  URLEncoder.encode(
                                          query,
                                          "UTF-8"
                                  );

                          String requestUrl =
                                  "https://nominatim.openstreetmap.org/search"
                                          + "?format=json"
                                          + "&limit=1"
                                          + "&q="
                                          + encoded;

                          connection =
                                  (HttpURLConnection)
                                          new URL(
                                                  requestUrl
                                          ).openConnection();

                          connection.setRequestMethod("GET");
                          connection.setRequestProperty(
                                  "User-Agent",
                                  "CarAssistant-NavigationV2"
                          );
                          connection.setConnectTimeout(10000);
                          connection.setReadTimeout(10000);

                          InputStream input =
                                  connection.getInputStream();

                          BufferedReader reader =
                                  new BufferedReader(
                                          new InputStreamReader(
                                                  input
                                          )
                                  );

                          StringBuilder body =
                                  new StringBuilder();

                          String line;

                          while (
                                  (line = reader.readLine())
                                          != null
                          ) {
                              body.append(line);
                          }

                          reader.close();

                          JSONArray results =
                                  new JSONArray(
                                          body.toString()
                                  );

                          if (results.length() == 0) {
                              postResult(
                                      "Không tìm thấy địa điểm"
                              );
                              return;
                          }

                          JSONObject item =
                                  results.getJSONObject(0);

                          final double lat =
                                  Double.parseDouble(
                                          item.getString("lat")
                                  );

                          final double lon =
                                  Double.parseDouble(
                                          item.getString("lon")
                                  );

                          final String name =
                                  item.optString(
                                          "display_name",
                                          query
                                  );

                          handler.post(() -> {
                              resultText.setText(name);

                              if (map != null) {
                                  map.animateCamera(
                                          CameraUpdateFactory
                                                  .newLatLngZoom(
                                                          new LatLng(
                                                                  lat,
                                                                  lon
                                                          ),
                                                          15.0
                                                  ),
                                          600
                                  );
                              }

                              addRouteButton(
                                      lat,
                                      lon
                              );
                          });

                      } catch (Exception error) {
                          postResult(
                                  "Lỗi tìm kiếm: "
                                          + error.getClass()
                                                  .getSimpleName()
                          );
                      } finally {
                          if (connection != null) {
                              connection.disconnect();
                          }
                      }
                  }).start();
              }

              private void addRouteButton(
                      double lat,
                      double lon) {

                  final Button routeButton =
                          new Button(activity);

                  routeButton.setText("ĐẾN ĐÂY");

                  routeButton.setOnClickListener(
                          v -> calculateRoute(
                                  lat,
                                  lon
                          )
                  );

                  LayoutParams params =
                          new LayoutParams(
                                  LayoutParams.WRAP_CONTENT,
                                  LayoutParams.WRAP_CONTENT
                          );

                  params.gravity =
                          Gravity.BOTTOM
                                  | Gravity.CENTER_HORIZONTAL;

                  params.setMargins(
                          0,
                          0,
                          0,
                          24
                  );

                  addView(routeButton, params);
              }

              private void calculateRoute(
                      double destinationLat,
                      double destinationLon) {

                  if (!hasLocation) {
                      Toast.makeText(
                              activity,
                              "Chưa có vị trí GPS",
                              Toast.LENGTH_SHORT
                      ).show();
                      return;
                  }

                  resultText.setText(
                          "Đang tính tuyến..."
                  );

                  final double originLat =
                          currentLat;

                  final double originLon =
                          currentLon;

                  new Thread(() -> {
                      HttpURLConnection connection = null;

                      try {
                          String requestUrl =
                                  "https://router.project-osrm.org/route/v1/driving/"
                                          + originLon
                                          + ","
                                          + originLat
                                          + ";"
                                          + destinationLon
                                          + ","
                                          + destinationLat
                                          + "?overview=full"
                                          + "&geometries=geojson";

                          connection =
                                  (HttpURLConnection)
                                          new URL(
                                                  requestUrl
                                          ).openConnection();

                          connection.setRequestMethod("GET");
                          connection.setRequestProperty(
                                  "User-Agent",
                                  "CarAssistant-NavigationV2"
                          );
                          connection.setConnectTimeout(15000);
                          connection.setReadTimeout(15000);

                          InputStream input =
                                  connection.getInputStream();

                          BufferedReader reader =
                                  new BufferedReader(
                                          new InputStreamReader(
                                                  input
                                          )
                                  );

                          StringBuilder body =
                                  new StringBuilder();

                          String line;

                          while (
                                  (line = reader.readLine())
                                          != null
                          ) {
                              body.append(line);
                          }

                          reader.close();

                          JSONObject response =
                                  new JSONObject(
                                          body.toString()
                                  );

                          JSONArray routes =
                                  response.getJSONArray(
                                          "routes"
                                  );

                          if (routes.length() == 0) {
                              throw new Exception(
                                      "No route returned"
                              );
                          }

                          JSONObject route =
                                  routes.getJSONObject(0);

                          JSONObject geometry =
                                  route.getJSONObject(
                                          "geometry"
                                  );

                          JSONArray coordinates =
                                  geometry.getJSONArray(
                                          "coordinates"
                                  );

                          List<LatLng> points =
                                  new ArrayList<>();

                          for (
                                  int i = 0;
                                  i < coordinates.length();
                                  i++
                          ) {
                              JSONArray point =
                                      coordinates
                                              .getJSONArray(i);

                              points.add(
                                      new LatLng(
                                              point.getDouble(1),
                                              point.getDouble(0)
                                      )
                              );
                          }

                          final double distance =
                                  route.getDouble(
                                          "distance"
                                  );

                          final double duration =
                                  route.getDouble(
                                          "duration"
                                  );

                          handler.post(() -> {
                              drawRoute(points);

                              resultText.setText(
                                      String.format(
                                              "Tuyến: %.1f km • %.0f phút",
                                              distance / 1000.0,
                                              duration / 60.0
                                      )
                              );
                          });

                      } catch (Exception error) {
                          postResult(
                                  "Lỗi tính tuyến: "
                                          + error.getClass()
                                                  .getSimpleName()
                          );
                      } finally {
                          if (connection != null) {
                              connection.disconnect();
                          }
                      }
                  }).start();
              }

              private void drawRoute(
                      List<LatLng> points) {

                  if (map == null || points.isEmpty()) {
                      return;
                  }

                  JSONArray coordinates =
                          new JSONArray();

                  for (LatLng point : points) {
                      JSONArray coordinate =
                              new JSONArray();

                      coordinate.put(point.getLongitude());
                      coordinate.put(point.getLatitude());

                      coordinates.put(coordinate);
                  }

                  JSONObject geometry =
                          new JSONObject();

                  try {
                      geometry.put(
                              "type",
                              "LineString"
                      );

                      geometry.put(
                              "coordinates",
                              coordinates
                      );

                      JSONObject feature =
                              new JSONObject();

                      feature.put(
                              "type",
                              "Feature"
                      );

                      feature.put(
                              "geometry",
                              geometry
                      );

                      GeoJsonSource source =
                              new GeoJsonSource(
                                      "carassistant-route-source",
                                      feature.toString()
                              );

                      Style style =
                              map.getStyle();

                      if (style == null) {
                          return;
                      }

                      if (
                              style.getSource(
                                      "carassistant-route-source"
                              ) != null
                      ) {
                          style.removeSource(
                                  "carassistant-route-source"
                          );
                      }

                      if (
                              style.getLayer(
                                      "carassistant-route-layer"
                              ) != null
                      ) {
                          style.removeLayer(
                                  "carassistant-route-layer"
                          );
                      }

                      style.addSource(source);

                      LineLayer layer =
                              new LineLayer(
                                      "carassistant-route-layer",
                                      "carassistant-route-source"
                              );

                      layer.setProperties(
                              org.maplibre.android.style.layers.PropertyFactory
                                      .lineColor(Color.BLUE),
                              org.maplibre.android.style.layers.PropertyFactory
                                      .lineWidth(7f)
                      );

                      style.addLayer(layer);

                      map.animateCamera(
                              CameraUpdateFactory
                                      .newLatLngZoom(
                                              points.get(0),
                                              14.0
                                      ),
                              600
                      );

                  } catch (Exception error) {
                      postResult(
                              "Không thể vẽ tuyến"
                      );
                  }
              }

              private void postResult(
                      final String message) {

                  handler.post(() ->
                          resultText.setText(message)
                  );
              }

              @Override
              protected void onAttachedToWindow() {
                  super.onAttachedToWindow();
                  mapView.onStart();
                  mapView.onResume();
              }

              @Override
              protected void onDetachedFromWindow() {
                  mapView.onPause();
                  super.onDetachedFromWindow();
              }
          }
          JAVA

      - name: Apply Navigation V2 entry atomically
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          source = path.read_text()

          begin = "        // NAV_V2_ROUTE_BEGIN"
          end = "        // NAV_V2_ROUTE_END"

          if begin in source or end in source:
              raise SystemExit(
                  "Navigation V2 markers already exist in baseline"
              )

          build_ui_marker = "    private void buildUi() {"
          dashboard_marker = "    private void buildDashboard() {"

          build_ui_start = source.find(build_ui_marker)
          dashboard_start = source.find(dashboard_marker)

          if build_ui_start < 0:
              raise SystemExit(
                  "buildUi() marker not found"
              )

          if dashboard_start < 0:
              raise SystemExit(
                  "buildDashboard() marker not found"
              )

          if dashboard_start <= build_ui_start:
              raise SystemExit(
                  "Invalid buildUi/buildDashboard order"
              )

          original_build_ui = source[
              build_ui_start:dashboard_start
          ]

          if "buildDashboard();" not in original_build_ui:
              raise SystemExit(
                  "Baseline buildUi() does not call buildDashboard()"
              )

          if "buildAppPanel();" not in original_build_ui:
              raise SystemExit(
                  "Baseline buildUi() does not call buildAppPanel()"
              )

          navigation_setup = """        // NAV_V2_ROUTE_BEGIN

          navigationMap = new NavigationMapView(this);

          navigationMap.setVisibility(View.GONE);

          navigationMap.setOnExitListener(() -> {
              navigationMap.closeNavigation();
              navigationMap.setVisibility(View.GONE);
              launcherLayer.setVisibility(View.VISIBLE);
              launcherLayer.bringToFront();
          });

          root.addView(
                  navigationMap,
                  new FrameLayout.LayoutParams(
                          -1,
                          -1
                  )
          );

          // NAV_V2_ROUTE_END
          """

          cleaned_build_ui = """    private void buildUi() {

          root =
                  new FrameLayout(this);

          root.setBackgroundColor(
                  Color.rgb(
                          7,
                          9,
                          12
                  )
          );

          projectionLayer =
                  new FrameLayout(this);

          projectionLayer.setVisibility(
                  View.GONE
          );

          root.addView(
                  projectionLayer,
                  new FrameLayout.LayoutParams(
                          -1,
                          -1
                  )
          );

          launcherLayer =
                  new LinearLayout(this);

          launcherLayer.setOrientation(
                  LinearLayout.VERTICAL
          );

          launcherLayer.setPadding(
                  dp(18),
                  dp(12),
                  dp(18),
                  dp(8)
          );

          root.addView(
                  launcherLayer,
                  new FrameLayout.LayoutParams(
                          -1,
                          -1
                  )
          );

          buildDashboard();
          buildAppPanel();

          """ + navigation_setup + """

          setContentView(root);
      }

      """

          source = (
              source[:build_ui_start]
              + cleaned_build_ui
              + source[dashboard_start:]
          )

          source = source.replace(
              "        map.addView(\n"
              "                mapText,\n"
              "                new LinearLayout.LayoutParams(\n"
              "                        -1,\n"
              "                        0,\n"
              "                        1));",
              "        map.addView(\n"
              "                mapText,\n"
              "                new LinearLayout.LayoutParams(\n"
              "                        -1,\n"
              "                        0,\n"
              "                        1));\n\n"
              "        map.setOnClickListener(v -> {\n"
              "            launcherLayer.setVisibility(View.GONE);\n"
              "            navigationMap.setVisibility(View.VISIBLE);\n"
              "            navigationMap.openNavigation();\n"
              "            navigationMap.bringToFront();\n"
              "        });",
              1
          )

          source = source.replace(
              "        if (navigationMap != null) {\n"
              "            navigationMap.onHostResume();\n"
              "        }\n\n",
              "",
              1
          )

          on_resume_marker = "    @Override\n    public void onResume() {"
          on_resume_start = source.find(on_resume_marker)

          if on_resume_start < 0:
              raise SystemExit(
                  "onResume() marker not found"
              )

          on_resume_body_marker = "        super.onResume();"
          on_resume_body = source.find(
              on_resume_body_marker,
              on_resume_start
          )

          if on_resume_body < 0:
              raise SystemExit(
                  "onResume() super marker not found"
              )

          insert_after_resume = (
              "\n\n"
              "        if (navigationMap != null) {\n"
              "            navigationMap.onHostResume();\n"
              "        }"
          )

          source = (
              source[:on_resume_body + len(on_resume_body_marker)]
              + insert_after_resume
              + source[on_resume_body + len(on_resume_body_marker):]
          )

          if "onPause()" not in source:
              source += """

          @Override
          public void onPause() {
              if (navigationMap != null) {
                  navigationMap.onHostPause();
              }

              super.onPause();
          }
          """

          path.write_text(source)

          check = path.read_text()

          required = [
              "NAV_V2_ROUTE_BEGIN",
              "NAV_V2_ROUTE_END",
              "navigationMap = new NavigationMapView(this);",
              "navigationMap.setOnExitListener",
              "navigationMap.openNavigation();",
              "navigationMap.bringToFront();",
              "navigationMap.onHostResume();",
              "navigationMap.onHostPause();"
          ]

          for item in required:
              if item not in check:
                  raise SystemExit(
                      "Required Navigation marker missing: "
                      + item
                  )

          if check.count(
                  "navigationMap = new NavigationMapView(this);"
          ) != 1:
              raise SystemExit(
                  "NavigationMapView construction count is not 1"
              )

          if check.count(
                  "NAV_V2_ROUTE_BEGIN"
          ) != 1:
              raise SystemExit(
                  "NAV_V2_ROUTE_BEGIN count is not 1"
              )

          if check.count(
                  "NAV_V2_ROUTE_END"
          ) != 1:
              raise SystemExit(
                  "NAV_V2_ROUTE_END count is not 1"
              )

          print(
              "Navigation V2 atomic entry integration OK"
          )
          PY

      - name: Verify Navigation V2 source and entry
        shell: bash
        run: |
          set -e

          ACTIVITY="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          NAV="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          test -f "$NAV"

          grep -Fq "NAV_V2_ROUTE_BEGIN" "$ACTIVITY"
          grep -Fq "NAV_V2_ROUTE_END" "$ACTIVITY"
          grep -Fq "navigationMap = new NavigationMapView(this);" "$ACTIVITY"
          grep -Fq "navigationMap.openNavigation();" "$ACTIVITY"
          grep -Fq "navigationMap.setOnExitListener" "$ACTIVITY"
          grep -Fq "navigationMap.onHostResume();" "$ACTIVITY"
          grep -Fq "navigationMap.onHostPause();" "$ACTIVITY"

          grep -Fq "package com.hieptran.aacast.doudou;" "$NAV"
          grep -Fq "org.maplibre.android.maps.MapLibreMap" "$NAV"
          grep -Fq "org.maplibre.gl:android-sdk" v10-source/app/build.gradle

          test "$(grep -Fc "navigationMap = new NavigationMapView(this);" "$ACTIVITY")" = "1"

          echo "Navigation V2 source verification OK"

      - name: Verify Home UI remains baseline
        shell: bash
        run: |
          set -e

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq 'text("CAR ASSISTANT"' "$FILE"
          grep -Fq '"MAP"' "$FILE"
          grep -Fq '"Navigation"' "$FILE"
          grep -Fq '"SPEED"' "$FILE"
          grep -Fq '"WEATHER"' "$FILE"
          grep -Fq '"MEDIA"' "$FILE"
          grep -Fq '"APPS"' "$FILE"
          grep -Fq "buildDashboard();" "$FILE"
          grep -Fq "buildAppPanel();" "$FILE"

          echo "Baseline Home UI verification OK"

      - name: Verify protected Projection Core unchanged
        shell: bash
        run: |
          set -e
          cd v10-source

          sha256sum \
            app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java \
            > /tmp/projection-core-after.txt

          diff -u \
            /tmp/projection-core-before.txt \
            /tmp/projection-core-after.txt

          echo "Projection Core unchanged"

      - name: Check repository diff
        shell: bash
        run: |
          set -e
          git diff --check
          git status --short
          git diff --stat

      - name: Build Navigation V2 Debug APK
        shell: bash
        run: |
          set -e
          cd v10-source
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload Navigation V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: carassistant-navigation-v2
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
