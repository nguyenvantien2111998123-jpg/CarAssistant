name: Build Navigation V2 Route

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout locked V1 baseline
        uses: actions/checkout@v4
        with:
          ref: 9b2fc5b3f24b32ff4f2ed7ddb6d794cdb5f647f9
          fetch-depth: 1

      - name: Verify baseline
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="9b2fc5b3f24b32ff4f2ed7ddb6d794cdb5f647f9"
          ACTUAL="$(git rev-parse HEAD)"

          echo "EXPECTED=$EXPECTED"
          echo "ACTUAL=$ACTUAL"

          test "$ACTUAL" = "$EXPECTED"

          echo "BASELINE: PASS"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail

          test -f v10-source/gradlew
          test -f v10-source/app/build.gradle
          test -f v10-source/app/src/main/AndroidManifest.xml
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java
          test -f v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java

          grep -Fq \
            'org.maplibre.gl:android-sdk:11.11.0' \
            v10-source/app/build.gradle

          grep -Fq \
            'package com.carassistant.v10;' \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

          echo "PROJECT: PASS"

      - name: Protect Projection Core
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          sha256sum \
            "$SRC/V10ProjectionSession.java" \
            "$SRC/V10DisplayController.java" \
            "$SRC/V10SurfaceManager.java" \
            "$SRC/V10TaskSession.java" \
            "$SRC/V10SessionStore.java" \
            > /tmp/core-before.sha256

          echo "PROJECTION CORE HASH: PASS"

      - name: Add Internet permission
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/AndroidManifest.xml"

          if ! grep -Fq \
            'android.permission.INTERNET' \
            "$FILE"; then

            python3 <<'PY'
from pathlib import Path

p = Path("v10-source/app/src/main/AndroidManifest.xml")
s = p.read_text()

anchor = '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />'
insert = anchor + '\n    <uses-permission android:name="android.permission.INTERNET" />'

if anchor not in s:
    raise SystemExit("LOCATION_PERMISSION_ANCHOR_NOT_FOUND")

s = s.replace(anchor, insert, 1)
p.write_text(s)
PY
          fi

          grep -Fq \
            'android.permission.INTERNET' \
            "$FILE"

          echo "INTERNET PERMISSION: PASS"

      - name: Write Navigation V2
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          cat > "$FILE" <<'JAVA'
package com.carassistant.v10;

import android.Manifest;
import android.app.Activity;
import android.content.Context;
import android.content.pm.PackageManager;
import android.graphics.Color;
import android.location.Location;
import android.os.Bundle;
import android.text.InputType;
import android.view.Gravity;
import android.view.inputmethod.InputMethodManager;
import android.widget.Button;
import android.widget.EditText;
import android.widget.FrameLayout;
import android.widget.LinearLayout;
import android.widget.TextView;

import org.json.JSONArray;
import org.json.JSONObject;
import org.maplibre.android.MapLibre;
import org.maplibre.android.annotations.Marker;
import org.maplibre.android.annotations.MarkerOptions;
import org.maplibre.android.annotations.Polyline;
import org.maplibre.android.annotations.PolylineOptions;
import org.maplibre.android.camera.CameraUpdateFactory;
import org.maplibre.android.geometry.LatLng;
import org.maplibre.android.location.LocationComponentActivationOptions;
import org.maplibre.android.location.LocationComponentOptions;
import org.maplibre.android.maps.MapLibreMap;
import org.maplibre.android.maps.MapView;
import org.maplibre.android.maps.UiSettings;

import java.io.BufferedReader;
import java.io.InputStream;
import java.io.InputStreamReader;
import java.net.HttpURLConnection;
import java.net.URL;
import java.net.URLEncoder;
import java.nio.charset.StandardCharsets;
import java.util.ArrayList;
import java.util.List;

public final class NavigationMapView extends FrameLayout {

    private static final int LOCATION_REQUEST = 4101;

    private static final String STYLE =
            "https://tiles.openfreemap.org/styles/liberty";

    private static final String SEARCH =
            "https://nominatim.openstreetmap.org/search";

    private static final String ROUTE =
            "https://routing.openstreetmap.de/routed-car/route/v1/driving/";

    private final MapView mapView;

    private MapLibreMap map;

    private Runnable exitListener;

    private EditText searchInput;
    private LinearLayout results;
    private TextView status;

    private boolean opened;
    private boolean followed;

    private Marker destination;
    private Polyline routeLine;

    public NavigationMapView(Context context) {
        super(context);

        setBackgroundColor(Color.BLACK);

        MapLibre.getInstance(
                context.getApplicationContext());

        mapView =
                new MapView(context);

        mapView.onCreate(
                new Bundle());

        addView(
                mapView,
                new LayoutParams(
                        -1,
                        -1));

        buildControls();

        mapView.getMapAsync(
                this::onMapReady);
    }

    public void setOnExitListener(
            Runnable listener) {

        exitListener = listener;
    }

    private void onMapReady(
            MapLibreMap ready) {

        map = ready;

        UiSettings ui =
                map.getUiSettings();

        ui.setCompassEnabled(false);
        ui.setZoomGesturesEnabled(true);
        ui.setScrollGesturesEnabled(true);
        ui.setRotateGesturesEnabled(true);
        ui.setTiltGesturesEnabled(false);

        map.setStyle(
                STYLE,
                style -> enableLocation());
    }

    private void enableLocation() {

        Context c = getContext();

        if (map == null || c == null) {
            return;
        }

        if (c.checkSelfPermission(
                Manifest.permission.ACCESS_FINE_LOCATION)
                != PackageManager.PERMISSION_GRANTED) {

            if (c instanceof Activity) {

                ((Activity) c).requestPermissions(
                        new String[]{
                                Manifest.permission.ACCESS_FINE_LOCATION,
                                Manifest.permission.ACCESS_COARSE_LOCATION
                        },
                        LOCATION_REQUEST);
            }

            return;
        }

        LocationComponentOptions options =
                LocationComponentOptions
                        .builder(c)
                        .pulseEnabled(true)
                        .build();

        LocationComponentActivationOptions activation =
                LocationComponentActivationOptions
                        .builder(
                                c,
                                map.getStyle())
                        .locationComponentOptions(
                                options)
                        .build();

        map.getLocationComponent()
                .activateLocationComponent(
                        activation);

        map.getLocationComponent()
                .setLocationComponentEnabled(
                        true);

        if (opened) {
            postDelayed(
                    this::autoFollow,
                    500);
        }
    }

    private void buildControls() {

        LinearLayout panel =
                new LinearLayout(
                        getContext());

        panel.setOrientation(
                LinearLayout.VERTICAL);

        panel.setPadding(
                dp(8),
                dp(8),
                dp(8),
                dp(8));

        panel.setBackgroundColor(
                Color.argb(
                        225,
                        12,
                        17,
                        23));

        LinearLayout row =
                new LinearLayout(
                        getContext());

        row.setGravity(
                Gravity.CENTER_VERTICAL);

        searchInput =
                new EditText(
                        getContext());

        searchInput.setSingleLine(
                true);

        searchInput.setHint(
                "Tìm địa điểm...");

        searchInput.setTextColor(
                Color.WHITE);

        searchInput.setHintTextColor(
                Color.LTGRAY);

        searchInput.setInputType(
                InputType.TYPE_CLASS_TEXT |
                InputType.TYPE_TEXT_FLAG_CAP_SENTENCES);

        row.addView(
                searchInput,
                new LinearLayout.LayoutParams(
                        0,
                        dp(50),
                        1));

        Button search =
                button("TÌM");

        search.setOnClickListener(
                v -> searchPlace());

        row.addView(
                search,
                new LinearLayout.LayoutParams(
                        dp(70),
                        dp(50)));

        panel.addView(row);

        LinearLayout actions =
                new LinearLayout(
                        getContext());

        Button locate =
                button("MY LOCATION");

        locate.setOnClickListener(
                v -> recenter());

        actions.addView(
                locate,
                new LinearLayout.LayoutParams(
                        0,
                        dp(46),
                        1));

        Button back =
                button("BACK");

        back.setOnClickListener(
                v -> {

                    opened = false;

                    setVisibility(GONE);

                    if (exitListener != null) {
                        exitListener.run();
                    }
                });

        actions.addView(
                back,
                new LinearLayout.LayoutParams(
                        dp(90),
                        dp(46)));

        panel.addView(actions);

        status =
                new TextView(
                        getContext());

        status.setTextColor(
                Color.LTGRAY);

        status.setTextSize(12);

        panel.addView(
                status,
                new LinearLayout.LayoutParams(
                        -1,
                        dp(30)));

        results =
                new LinearLayout(
                        getContext());

        results.setOrientation(
                LinearLayout.VERTICAL);

        panel.addView(
                results,
                new LinearLayout.LayoutParams(
                        -1,
                        -2));

        LayoutParams p =
                new LayoutParams(
                        -1,
                        -2,
                        Gravity.TOP);

        p.setMargins(
                dp(8),
                dp(8),
                dp(8),
                0);

        addView(
                panel,
                p);
    }

    private Button button(
            String label) {

        Button b =
                new Button(
                        getContext());

        b.setText(label);
        b.setTextSize(12);

        return b;
    }

    public void openNavigation() {

        opened = true;
        followed = false;

        setVisibility(VISIBLE);

        status.setText(
                "Đang lấy vị trí...");

        postDelayed(
                this::autoFollow,
                300);

        postDelayed(
                this::autoFollow,
                1200);

        postDelayed(
                this::autoFollow,
                2500);
    }

    public void closeNavigation() {

        opened = false;

        setVisibility(GONE);
    }

    private void autoFollow() {

        if (!opened
                || followed
                || map == null) {

            return;
        }

        Location l =
                lastLocation();

        if (l == null) {

            status.setText(
                    "Chưa có GPS...");

            return;
        }

        followed = true;

        map.animateCamera(
                CameraUpdateFactory
                        .newLatLngZoom(
                                new LatLng(
                                        l.getLatitude(),
                                        l.getLongitude()),
                                16.0),
                600);

        status.setText(
                "Vị trí hiện tại");
    }

    public void recenter() {

        Location l =
                lastLocation();

        if (l == null) {

            status.setText(
                    "Chưa có GPS");

            return;
        }

        map.animateCamera(
                CameraUpdateFactory
                        .newLatLngZoom(
                                new LatLng(
                                        l.getLatitude(),
                                        l.getLongitude()),
                                16.0),
                500);

        status.setText(
                "Đã đưa camera về vị trí hiện tại");
    }

    private Location lastLocation() {

        try {

            return map == null
                    ? null
                    : map.getLocationComponent()
                            .getLastKnownLocation();

        } catch (Exception ignored) {

            return null;
        }
    }

    private void searchPlace() {

        final String q =
                searchInput
                        .getText()
                        .toString()
                        .trim();

        if (q.isEmpty()) {

            status.setText(
                    "Nhập địa điểm cần tìm");

            return;
        }

        hideKeyboard();

        results.removeAllViews();

        status.setText(
                "Đang tìm...");

        new Thread(
                () -> {

                    try {

                        String url =
                                SEARCH
                                        + "?format=jsonv2"
                                        + "&limit=5"
                                        + "&q="
                                        + URLEncoder.encode(
                                                q,
                                                StandardCharsets.UTF_8.name());

                        JSONArray a =
                                new JSONArray(
                                        httpGet(url));

                        ArrayList<Place> places =
                                new ArrayList<>();

                        for (int i = 0;
                                i < a.length();
                                i++) {

                            JSONObject o =
                                    a.getJSONObject(i);

                            places.add(
                                    new Place(
                                            o.optString(
                                                    "display_name",
                                                    "Địa điểm"),
                                            o.getDouble(
                                                    "lat"),
                                            o.getDouble(
                                                    "lon")));
                        }

                        post(
                                () -> showResults(
                                        places));

                    } catch (Exception e) {

                        post(
                                () -> status.setText(
                                        "Tìm kiếm lỗi"));
                    }

                })
                .start();
    }

    private void showResults(
            List<Place> places) {

        results.removeAllViews();

        if (places.isEmpty()) {

            status.setText(
                    "Không tìm thấy địa điểm");

            return;
        }

        status.setText(
                "Chọn điểm đến");

        for (Place p : places) {

            TextView item =
                    new TextView(
                            getContext());

            item.setText(
                    p.name);

            item.setTextColor(
                    Color.WHITE);

            item.setTextSize(13);

            item.setGravity(
                    Gravity.CENTER_VERTICAL);

            item.setPadding(
                    dp(10),
                    0,
                    dp(10),
                    0);

            item.setBackgroundColor(
                    Color.rgb(
                            28,
                            35,
                            43));

            LinearLayout.LayoutParams lp =
                    new LinearLayout.LayoutParams(
                            -1,
                            dp(52));

            lp.setMargins(
                    0,
                    dp(2),
                    0,
                    dp(2));

            results.addView(
                    item,
                    lp);

            item.setOnClickListener(
                    v -> select(p));
        }
    }

    private void select(
            Place p) {

        Location l =
                lastLocation();

        if (l == null) {

            status.setText(
                    "Chưa có GPS để tính tuyến");

            return;
        }

        if (destination != null) {
            destination.remove();
        }

        destination =
                map.addMarker(
                        new MarkerOptions()
                                .position(
                                        new LatLng(
                                                p.lat,
                                                p.lon))
                                .title(p.name));

        results.removeAllViews();

        status.setText(
                "Đang tính tuyến...");

        final double slat =
                l.getLatitude();

        final double slon =
                l.getLongitude();

        new Thread(
                () -> requestRoute(
                        slat,
                        slon,
                        p.lat,
                        p.lon))
                .start();
    }

    private void requestRoute(
            double slat,
            double slon,
            double dlat,
            double dlon) {

        try {

            String coords =
                    slon
                            + ","
                            + slat
                            + ";"
                            + dlon
                            + ","
                            + dlat;

            String url =
                    ROUTE
                            + coords
                            + "?overview=full"
                            + "&geometries=geojson"
                            + "&steps=false";

            JSONObject root =
                    new JSONObject(
                            httpGet(url));

            if (!"Ok".equals(
                    root.optString(
                            "code"))) {

                throw new IllegalStateException();
            }

            JSONArray pointsJson =
                    root.getJSONArray(
                            "routes")
                            .getJSONObject(0)
                            .getJSONObject(
                                    "geometry")
                            .getJSONArray(
                                    "coordinates");

            ArrayList<LatLng> points =
                    new ArrayList<>();

            for (int i = 0;
                    i < pointsJson.length();
                    i++) {

                JSONArray p =
                        pointsJson
                                .getJSONArray(i);

                points.add(
                        new LatLng(
                                p.getDouble(1),
                                p.getDouble(0)));
            }

            post(
                    () -> drawRoute(
                            points));

        } catch (Exception e) {

            post(
                    () -> status.setText(
                            "Không tính được tuyến"));
        }
    }

    private void drawRoute(
            List<LatLng> points) {

        if (points.size() < 2) {

            status.setText(
                    "Route không hợp lệ");

            return;
        }

        if (routeLine != null) {
            routeLine.remove();
        }

        routeLine =
                map.addPolyline(
                        new PolylineOptions()
                                .addAll(points)
                                .color(
                                        Color.rgb(
                                                40,
                                                125,
                                                255))
                                .width(8.0f)
                                .alpha(0.95f));

        status.setText(
                "Đã vẽ tuyến");

        map.animateCamera(
                CameraUpdateFactory
                        .newLatLngZoom(
                                points.get(
                                        points.size()
                                                / 2),
                                12.0),
                700);
    }

    private String httpGet(
            String urlString)
            throws Exception {

        HttpURLConnection c =
                (HttpURLConnection)
                        new URL(urlString)
                                .openConnection();

        c.setRequestMethod("GET");
        c.setConnectTimeout(12000);
        c.setReadTimeout(15000);

        c.setRequestProperty(
                "User-Agent",
                "CarAssistant-Navigation-V2/1.0");

        c.setRequestProperty(
                "Accept",
                "application/json");

        int code =
                c.getResponseCode();

        InputStream in =
                code >= 200
                        && code < 300
                        ? c.getInputStream()
                        : c.getErrorStream();

        if (in == null) {
            throw new IllegalStateException(
                    "HTTP " + code);
        }

        BufferedReader r =
                new BufferedReader(
                        new InputStreamReader(
                                in,
                                StandardCharsets.UTF_8));

        StringBuilder out =
                new StringBuilder();

        String line;

        while ((line = r.readLine())
                != null) {

            out.append(line);
        }

        r.close();
        c.disconnect();

        if (code < 200
                || code >= 300) {

            throw new IllegalStateException(
                    "HTTP " + code);
        }

        return out.toString();
    }

    private void hideKeyboard() {

        InputMethodManager imm =
                (InputMethodManager)
                        getContext()
                                .getSystemService(
                                        Context.INPUT_METHOD_SERVICE);

        if (imm != null) {

            imm.hideSoftInputFromWindow(
                    searchInput
                            .getWindowToken(),
                    0);
        }
    }

    private void post(
            Runnable r) {

        ((Activity) getContext())
                .runOnUiThread(r);
    }

    private int dp(
            float v) {

        return Math.round(
                v *
                getResources()
                        .getDisplayMetrics()
                        .density);
    }

    public void onHostResume() {
        mapView.onResume();
    }

    public void onHostPause() {
        mapView.onPause();
    }

    public void onHostDestroy() {

        if (routeLine != null) {
            routeLine.remove();
        }

        if (destination != null) {
            destination.remove();
        }

        mapView.onDestroy();
    }

    private static final class Place {

        final String name;
        final double lat;
        final double lon;

        Place(
                String n,
                double a,
                double o) {

            name = n;
            lat = a;
            lon = o;
        }
    }
}
