
name: TL1
run-name: TL1

on:
 workflow_dispatch:

permissions:
 contents: read

jobs:
 build:
  runs-on: ubuntu-latest
  timeout-minutes: 40

  steps:
  - name: Checkout verified CORE
    uses: actions/checkout@v4
    with:
      ref: main
      fetch-depth: 1

  - name: Verify CORE and reference workflows
    shell: bash
    run: |
      set -euo pipefail
      python3 - <<'PY'
      from pathlib import Path
      import hashlib

      expected = {
          "v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java": "61e82df0fd17e7851c7bf1628ac03a9391e48523",
          "v10-source/app/src/main/AndroidManifest.xml": "e6ffd5005ff0d0f8610c5950f20e17acba5410df",
          "v10-source/app/build.gradle": "4d512337d46324a33a685d8cdb095e4ecacd3ceb",
          ".github/workflows/build-carassistant-voice-commands-v2.yml": "4ee7f307c2a106a384a33c7b4386f1864c621ff3",
          ".github/workflows/1phattrientroly.yml": "b9ccec46c734ea2865077b12b6543626b11f6db3",
      }

      for name, wanted in expected.items():
          p = Path(name)
          if not p.is_file():
              raise SystemExit(f"FAIL-CLOSED: missing {name}")
          b = p.read_bytes()
          actual = hashlib.sha1(
              b"blob " + str(len(b)).encode() + b"\0" + b
          ).hexdigest()
          if actual != wanted:
              raise SystemExit(
                  f"FAIL-CLOSED: SHA mismatch {name}: "
                  f"expected={wanted}, actual={actual}"
              )
          print(f"PASS SHA: {name}")
      PY

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Gradle 8.13
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.13'

  - name: Reuse only verified voice and V3 mic baseline steps
    shell: bash
    run: |
      set -euo pipefail
      sudo apt-get update
      sudo apt-get install -y python3-yaml
      python3 - <<'PY'
      from pathlib import Path
      import subprocess
      import yaml

      def run_step(workflow_path, step_name):
          data = yaml.safe_load(
              Path(workflow_path).read_text(encoding="utf-8")
          )
          steps = data["jobs"]["build"]["steps"]
          matches = [
              step for step in steps
              if step.get("name") == step_name and step.get("run")
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"FAIL-CLOSED: expected one step {step_name!r}, "
                  f"found {len(matches)}"
              )
          subprocess.run(
              [
                  "bash", "-e", "-u", "-o", "pipefail",
                  "-c", matches[0]["run"]
              ],
              check=True,
          )
          print(f"PASS: reused {step_name}")

      run_step(
          ".github/workflows/build-carassistant-voice-commands-v2.yml",
          "Verify baseline and patch voice recognition",
      )
      run_step(
          ".github/workflows/1phattrientroly.yml",
          "Apply proven V3 floating mic and status auto-hide",
      )
      PY

  - name: Apply TL1 shared mic controls and four-second silence
    shell: bash
    run: |
      set -euo pipefail
      python3 - <<'PY'
      from pathlib import Path
      import re

      p = Path(
          "v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java"
      )
      s = p.read_text(encoding="utf-8")

      def once(old, new, label):
          global s
          n = s.count(old)
          if n != 1:
              raise SystemExit(
                  f"FAIL-CLOSED: {label}: expected 1 anchor, found {n}"
              )
          s = s.replace(old, new, 1)
          print(f"PASS anchor: {label}")

      once(
          "    private Runnable voiceStatusHideRunnable;\n",
          "    private Runnable voiceStatusHideRunnable;\n"
          "    private boolean projectionMicDragging;\n"
          "    private float projectionMicDownRawX;\n"
          "    private float projectionMicDownRawY;\n"
          "    private int projectionMicStartX;\n"
          "    private int projectionMicStartY;\n",
          "mic drag fields",
      )

      once(
          "        voice.setOnClickListener(v -> startVoiceRecognition());",
          "        voice.setContentDescription(\"Trợ lý giọng nói\");\n"
          "        voice.setOnClickListener(v -> toggleVoiceRecognition());",
          "Home mic toggle",
      )

      once(
          "    private void startVoiceRecognition() {",
          "    private void toggleVoiceRecognition() {\n"
          "        if (voiceRecognizer != null) {\n"
          "            stopVoiceRecognition();\n"
          "            if (projectionMicButton != null) "
          "projectionMicButton.setText(\"🎙\");\n"
          "            return;\n"
          "        }\n"
          "        startVoiceRecognition();\n"
          "    }\n\n"
          "    private void startVoiceRecognition() {",
          "shared mic toggle method",
      )

      projection_click = re.compile(
          r"(?ms)^([ \t]*)projectionMicButton"
          r"\.setOnClickListener\(v -> \{.*?^\1\}\);"
      )
      s, count = projection_click.subn(
          lambda m: (
              m.group(1)
              + "projectionMicButton.setOnClickListener("
              + "v -> toggleVoiceRecognition());"
          ),
          s,
          count=1,
      )
      if count != 1:
          raise SystemExit(
              "FAIL-CLOSED: projection mic toggle: "
              f"expected 1 handler, found {count}"
          )
      print("PASS anchor: projection mic toggle")

      def replace_regex_once(pattern, replacement, label):
          global s
          s2, n = re.subn(
              pattern, replacement, s, count=1, flags=re.MULTILINE
          )
          if n != 1:
              raise SystemExit(
                  f"FAIL-CLOSED: {label}: expected 1 match, found {n}"
              )
          s = s2
          print(f"PASS anchor: {label}")

      replace_regex_once(
          r"([ \t]*)voiceHandler\.postDelayed"
          r"\(pending,\s*[0-9]+L\);",
          r"\g<1>voiceHandler.postDelayed(pending, 4000L);",
          "four-second silence watchdog",
      )

      replace_regex_once(
          r"(?m)^([ \t]*)(RecognizerIntent\."
          r"EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS,"
          r"[ \t]*)\n[ \t]*[0-9]+L\);$",
          r"\g<1>\g<2>\n\g<1>        4000L);",
          "four-second complete-silence hint",
      )

      replace_regex_once(
          r"(?m)^([ \t]*)(RecognizerIntent\."
          r"EXTRA_SPEECH_INPUT_POSSIBLY_COMPLETE_SILENCE_LENGTH_MILLIS,"
          r"[ \t]*)\n[ \t]*[0-9]+L\);$",
          r"\g<1>\g<2>\n\g<1>        4000L);",
          "four-second possible-silence hint",
      )

      if re.search(
          r"session\.startListening\(intent\);\s*"
          r"scheduleVoiceSilenceStop\(session\);",
          s,
      ):
          print("PASS anchor: no-speech timeout already starts immediately")
      else:
          replace_regex_once(
              r"(?m)^([ \t]*)session\.startListening\(intent\);$",
              r"\g<1>session.startListening(intent);\n"
              r"\g<1>scheduleVoiceSilenceStop(session);",
              "no-speech timeout starts immediately",
          )

      mic_layout = re.compile(
          r"(?ms)^([ \t]*)FrameLayout\.LayoutParams params = "
          r"new FrameLayout\.LayoutParams\(\s*"
          r"dp\(58\), dp\(58\), Gravity\.BOTTOM \| Gravity\.END\);\s*"
          r"params\.setMargins\(0, 0, dp\(18\), dp\(88\)\);\s*"
          r"projectionLayer\.addView\(projectionMicButton, params\);"
      )

      def replace_mic_layout(match):
          indent = match.group(1)
          return (
              indent
              + 'SharedPreferences micPrefs = getSharedPreferences('
              + '"v10_projection_mic", MODE_PRIVATE);\n'
              + indent
              + "FrameLayout.LayoutParams params = "
              + "new FrameLayout.LayoutParams(\n"
              + indent
              + "        dp(58), dp(58), Gravity.TOP | Gravity.END);\n"
              + indent
              + 'params.rightMargin = micPrefs.getInt("x", dp(18));\n'
              + indent
              + 'params.topMargin = micPrefs.getInt("y", dp(120));\n'
              + indent
              + "projectionLayer.addView(projectionMicButton, params);"
          )

      s, mic_count = mic_layout.subn(
          replace_mic_layout, s, count=1
      )
      if mic_count != 1:
          raise SystemExit(
              "FAIL-CLOSED: floating mic layout anchor not found exactly once"
          )
      print("PASS anchor: floating mic position persistence")

      mic_touch_anchor = re.compile(
          r"(?m)^([ \t]*)projectionMicButton"
          r"\.setOnClickListener\(v -> toggleVoiceRecognition\(\)\);"
          r"[ \t]*\n([ \t]*)\}"
      )

      def add_mic_touch(match):
          indent = match.group(1)
          close_indent = match.group(2)
          lines = [
              indent
              + "projectionMicButton.setOnClickListener("
              + "v -> toggleVoiceRecognition());",
              indent
              + "projectionMicButton.setOnTouchListener((view, event) -> {",
              indent + "    switch (event.getActionMasked()) {",
              indent + "        case MotionEvent.ACTION_DOWN: {",
              indent + "            projectionMicDragging = false;",
              indent + "            projectionMicDownRawX = event.getRawX();",
              indent + "            projectionMicDownRawY = event.getRawY();",
              indent
              + "            FrameLayout.LayoutParams fp = "
              + "(FrameLayout.LayoutParams) view.getLayoutParams();",
              indent + "            projectionMicStartX = fp.rightMargin;",
              indent + "            projectionMicStartY = fp.topMargin;",
              indent + "            return true;",
              indent + "        }",
              indent + "        case MotionEvent.ACTION_MOVE: {",
              indent
              + "            float dx = event.getRawX() - projectionMicDownRawX;",
              indent
              + "            float dy = event.getRawY() - projectionMicDownRawY;",
              indent
              + "            if (!projectionMicDragging && Math.hypot(dx, dy) "
              + "> ViewConfiguration.get(V10CarActivity.this)"
              + ".getScaledTouchSlop()) {",
              indent + "                projectionMicDragging = true;",
              indent + "            }",
              indent + "            if (projectionMicDragging) {",
              indent
              + "                int maxX = Math.max(0, "
              + "projectionLayer.getWidth() - dp(58));",
              indent
              + "                int maxY = Math.max(0, "
              + "projectionLayer.getHeight() - dp(58));",
              indent
              + "                FrameLayout.LayoutParams fp = "
              + "(FrameLayout.LayoutParams) view.getLayoutParams();",
              indent
              + "                fp.rightMargin = Math.max(0, "
              + "Math.min(maxX, Math.round(projectionMicStartX - dx)));",
              indent
              + "                fp.topMargin = Math.max(0, "
              + "Math.min(maxY, Math.round(projectionMicStartY + dy)));",
              indent + "                view.setLayoutParams(fp);",
              indent + "            }",
              indent + "            return true;",
              indent + "        }",
              indent + "        case MotionEvent.ACTION_UP: {",
              indent + "            if (projectionMicDragging) {",
              indent
              + "                FrameLayout.LayoutParams fp = "
              + "(FrameLayout.LayoutParams) view.getLayoutParams();",
              indent
              + '                micPrefs.edit().putInt("x", fp.rightMargin)'
              + '.putInt("y", fp.topMargin).apply();',
              indent + "                projectionMicDragging = false;",
              indent + "            } else {",
              indent + "                view.performClick();",
              indent + "            }",
              indent + "            return true;",
              indent + "        }",
              indent + "        case MotionEvent.ACTION_CANCEL:",
              indent + "            projectionMicDragging = false;",
              indent + "            return true;",
              indent + "        default:",
              indent + "            return true;",
              indent + "    }",
              indent + "});",
              close_indent + "}",
          ]
          return "\n".join(lines)

      s, mic_touch_count = mic_touch_anchor.subn(
          add_mic_touch, s, count=1
      )
      if mic_touch_count != 1:
          raise SystemExit(
              "FAIL-CLOSED: floating mic touch anchor not found exactly once"
          )
      print("PASS anchor: floating mic drag and tap handler")

      checks = [
          "private void toggleVoiceRecognition()",
          "RecognizerIntent.EXTRA_PARTIAL_RESULTS, true",
          "voiceHandler.postDelayed(pending, 4000L)",
          "scheduleVoiceSilenceStop(session);",
          "projectionMicButton.setOnTouchListener",
          "processVoiceCommand(spoken);",
          'getSharedPreferences("v10_projection_mic", MODE_PRIVATE)',
      ]

      for item in checks:
          if item not in s:
              raise SystemExit(f"FAIL-CLOSED: missing TL1 feature {item}")

      if re.search(
          r"voiceHandler\.postDelayed\(pending,\s*3000L\)", s
      ):
          raise SystemExit(
              "FAIL-CLOSED: three-second watchdog remains"
          )

      p.write_text(s, encoding="utf-8")
      print("PASS: TL1 patch applied in build workspace only")
      PY

  - name: Verify TL1 patch and YAML
    shell: bash
    run: |
      set -euo pipefail
      python3 - <<'PY'
      from pathlib import Path
      import re
      import yaml

      y = yaml.safe_load(
          Path(".github/workflows/TL1.yml").read_text(encoding="utf-8")
      )
      if not isinstance(y, dict) or "jobs" not in y:
          raise SystemExit("FAIL: invalid TL1 workflow YAML")

      s = Path(
          "v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java"
      ).read_text(encoding="utf-8")

      required = {
          "Home mic toggle": "voice.setOnClickListener(v -> toggleVoiceRecognition())",
          "partial transcript": "RecognizerIntent.EXTRA_PARTIAL_RESULTS, true",
          "four-second timeout": "voiceHandler.postDelayed(pending, 4000L)",
          "complete-silence hint": "RecognizerIntent.EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS",
          "possible-silence hint": "RecognizerIntent.EXTRA_SPEECH_INPUT_POSSIBLY_COMPLETE_SILENCE_LENGTH_MILLIS",
          "floating mic drag": "projectionMicButton.setOnTouchListener",
          "saved mic position": 'getSharedPreferences("v10_projection_mic", MODE_PRIVATE)',
          "existing command dispatcher": "processVoiceCommand(spoken);",
      }

      for name, anchor in required.items():
          if anchor not in s:
              raise SystemExit(f"FAIL: {name}")
          print(f"PASS: {name}")

      if re.search(
          r"voiceHandler\.postDelayed\(pending,\s*3000L\)", s
      ):
          raise SystemExit("FAIL: three-second watchdog remains")

      print("PASS: TL1 workflow YAML and source anchors")
      PY

  - name: Build APK
    shell: bash
    run: |
      set -euo pipefail
      cd v10-source
      chmod +x gradlew
      ./gradlew --no-daemon --stacktrace compileDebugJavaWithJavac
      ./gradlew --no-daemon --stacktrace assembleDebug

  - name: Package APK and patched source
    shell: bash
    run: |
      set -euo pipefail

      APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

      test -s "$APK"
      mkdir -p dist
      cp "$APK" dist/CarAssistant-TL1-unsigned.apk
      sha256sum dist/CarAssistant-TL1-unsigned.apk

  - name: Upload TL1 artifact
    uses: actions/upload-artifact@v4
    with:
      name: TL1
      path: |
        dist/CarAssistant-TL1-unsigned.apk
        v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java
      if-no-files-found: error
      retention-days: 30
