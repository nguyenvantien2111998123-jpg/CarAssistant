name: TL1
run-name: TL1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout verified CORE
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify CORE and reference workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
              "v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java": "61e82df0fd17e7851c7bf1628ac03a9391e48523",
              "v10-source/app/src/main/AndroidManifest.xml": "e6ffd5005ff0d0f8610c5950f20e17acba5410df",
              "v10-source/app/build.gradle": "4d512337d46324a33a685d8cdb095e4ecacd3ceb",
              ".github/workflows/build-carassistant-voice-commands-v2.yml": "4ee7f307c2a106a384a33c7b4386f1864c621ff3",
              ".github/workflows/1phattrientroly.yml": "b9ccec46c734ea2865077b12b6543626b11f6db3",
          }
          for name, wanted in expected.items():
              p = Path(name)
              if not p.is_file():
                  raise SystemExit(f"FAIL-CLOSED: missing {name}")
              b = p.read_bytes()
              actual = hashlib.sha1(b"blob " + str(len(b)).encode() + b"\0" + b).hexdigest()
              if actual != wanted:
                  raise SystemExit(f"FAIL-CLOSED: SHA mismatch {name}: expected={wanted}, actual={actual}")
              print(f"PASS SHA: {name}")
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reuse only verified voice and V3 mic baseline steps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-yaml
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml
          def run_step(workflow_path, step_name):
              data = yaml.safe_load(Path(workflow_path).read_text(encoding="utf-8"))
              steps = data["jobs"]["build"]["steps"]
              matches = [s for s in steps if s.get("name") == step_name and s.get("run")]
              if len(matches) != 1:
                  raise SystemExit(f"FAIL-CLOSED: expected one step {step_name!r}, found {len(matches)}")
              subprocess.run(["bash", "-e", "-u", "-o", "pipefail", "-c", matches[0]["run"]], check=True)
              print(f"PASS: reused {step_name}")
          run_step(".github/workflows/build-carassistant-voice-commands-v2.yml", "Verify baseline and patch voice recognition")
          run_step(".github/workflows/1phattrientroly.yml", "Apply proven V3 floating mic and status auto-hide")
          PY

      - name: Apply TL1 shared mic controls and three-second silence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java")
          s = p.read_text(encoding="utf-8")
          def once(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"FAIL-CLOSED: {label}: expected 1 anchor, found {n}")
              s = s.replace(old, new, 1)
              print(f"PASS anchor: {label}")

          once("    private Runnable voiceStatusHideRunnable;\n",
               "    private Runnable voiceStatusHideRunnable;\n"
               "    private boolean projectionMicDragging;\n"
               "    private float projectionMicDownRawX;\n"
               "    private float projectionMicDownRawY;\n"
               "    private int projectionMicStartX;\n"
               "    private int projectionMicStartY;\n", "mic drag fields")
          once("        voice.setOnClickListener(v -> startVoiceRecognition());",
               "        voice.setContentDescription(\"Trợ lý giọng nói\");\n"
               "        voice.setOnClickListener(v -> toggleVoiceRecognition());", "Home mic toggle")
          once("    private void startVoiceRecognition() {",
               "    private void toggleVoiceRecognition() {\n"
               "        if (voiceRecognizer != null) {\n"
               "            stopVoiceRecognition();\n"
               "            if (projectionMicButton != null) projectionMicButton.setText(\"🎙\");\n"
               "            return;\n"
               "        }\n"
               "        startVoiceRecognition();\n"
               "    }\n\n"
               "    private void startVoiceRecognition() {", "shared mic toggle method")
          import re
          projection_click = re.compile(
              r"(?ms)^([ \t]*)projectionMicButton\.setOnClickListener\(v -> \{.*?^\1\}\);"
          )
          s, count = projection_click.subn(
              lambda m: m.group(1) + "projectionMicButton.setOnClickListener(v -> toggleVoiceRecognition());",
              s,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"FAIL-CLOSED: projection mic toggle: expected 1 handler, found {count}")
          print("PASS anchor: projection mic toggle")
          once("                  voiceHandler.postDelayed(pending, 4000L);",
               "                  voiceHandler.postDelayed(pending, 3000L);", "three-second silence watchdog")
          once("                              4000L);", "                              3000L);", "three-second complete-silence hint")
          once("                              4000L);", "                              3000L);", "three-second possible-silence hint")
          once("                      session.startListening(intent);",
               "                      session.startListening(intent);\n"
               "                      scheduleVoiceSilenceStop(session);", "no-speech timeout starts immediately")
          once("                  FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(\n"
               "                          dp(58), dp(58), Gravity.BOTTOM | Gravity.END);\n"
               "                  params.setMargins(0, 0, dp(18), dp(88));\n"
               "                  projectionLayer.addView(projectionMicButton, params);",
               "                  SharedPreferences micPrefs = getSharedPreferences(\"v10_projection_mic\", MODE_PRIVATE);\n"
               "                  FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(\n"
               "                          dp(58), dp(58), Gravity.TOP | Gravity.START);\n"
               "                  params.leftMargin = micPrefs.getInt(\"x\", dp(18));\n"
               "                  params.topMargin = micPrefs.getInt(\"y\", dp(120));\n"
               "                  projectionLayer.addView(projectionMicButton, params);", "floating mic position persistence")
          once("                  projectionMicButton.setOnClickListener(v -> toggleVoiceRecognition());\n"
               "              }",
               "                  projectionMicButton.setOnClickListener(v -> toggleVoiceRecognition());\n"
               "                  projectionMicButton.setOnTouchListener((view, event) -> {\n"
               "                      switch (event.getActionMasked()) {\n"
               "                          case MotionEvent.ACTION_DOWN: {\n"
               "                              projectionMicDragging = false;\n"
               "                              projectionMicDownRawX = event.getRawX();\n"
               "                              projectionMicDownRawY = event.getRawY();\n"
               "                              FrameLayout.LayoutParams fp = (FrameLayout.LayoutParams) view.getLayoutParams();\n"
               "                              projectionMicStartX = fp.leftMargin;\n"
               "                              projectionMicStartY = fp.topMargin;\n"
               "                              return true;\n"
               "                          }\n"
               "                          case MotionEvent.ACTION_MOVE: {\n"
               "                              float dx = event.getRawX() - projectionMicDownRawX;\n"
               "                              float dy = event.getRawY() - projectionMicDownRawY;\n"
               "                              if (!projectionMicDragging && Math.hypot(dx, dy) > ViewConfiguration.get(V10CarActivity.this).getScaledTouchSlop()) projectionMicDragging = true;\n"
               "                              if (projectionMicDragging) {\n"
               "                                  int maxX = Math.max(0, projectionLayer.getWidth() - dp(58));\n"
               "                                  int maxY = Math.max(0, projectionLayer.getHeight() - dp(58));\n"
               "                                  FrameLayout.LayoutParams fp = (FrameLayout.LayoutParams) view.getLayoutParams();\n"
               "                                  fp.leftMargin = Math.max(0, Math.min(maxX, Math.round(projectionMicStartX + dx)));\n"
               "                                  fp.topMargin = Math.max(0, Math.min(maxY, Math.round(projectionMicStartY + dy)));\n"
               "                                  view.setLayoutParams(fp);\n"
               "                              }\n"
               "                              return true;\n"
               "                          }\n"
               "                          case MotionEvent.ACTION_UP: {\n"
               "                              if (projectionMicDragging) {\n"
               "                                  FrameLayout.LayoutParams fp = (FrameLayout.LayoutParams) view.getLayoutParams();\n"
               "                                  micPrefs.edit().putInt(\"x\", fp.leftMargin).putInt(\"y\", fp.topMargin).apply();\n"
               "                                  projectionMicDragging = false;\n"
               "                              } else {\n"
               "                                  view.performClick();\n"
               "                              }\n"
               "                              return true;\n"
               "                          }\n"
               "                          case MotionEvent.ACTION_CANCEL:\n"
               "                              projectionMicDragging = false;\n"
               "                              return true;\n"
               "                          default: return true;\n"
               "                      }\n"
               "                  });\n"
               "              }", "draggable floating mic")

          checks = [
              "private void toggleVoiceRecognition()",
              "RecognizerIntent.EXTRA_PARTIAL_RESULTS, true",
              "voiceHandler.postDelayed(pending, 3000L)",
              "scheduleVoiceSilenceStop(session);",
              "projectionMicButton.setOnTouchListener",
              "processVoiceCommand(spoken);",
          ]
          for item in checks:
              if item not in s:
                  raise SystemExit(f"FAIL-CLOSED: missing TL1 feature {item}")
          if "voiceHandler.postDelayed(pending, 4000L)" in s:
              raise SystemExit("FAIL-CLOSED: old four-second watchdog remains")
          p.write_text(s, encoding="utf-8")
          print("PASS: TL1 patch applied in build workspace only; repository CORE untouched")
          PY

      - name: Verify TL1 patch and YAML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          y = yaml.safe_load(Path(".github/workflows/TL1.yml").read_text(encoding="utf-8"))
          assert isinstance(y, dict) and "jobs" in y
          s = Path("v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java").read_text(encoding="utf-8")
          required = {
              "Home mic": "voice.setOnClickListener(v -> toggleVoiceRecognition())",
              "partial transcript": "RecognizerIntent.EXTRA_PARTIAL_RESULTS, true",
              "3-second timeout": "voiceHandler.postDelayed(pending, 3000L)",
              "floating mic drag": "projectionMicButton.setOnTouchListener",
              "existing dispatcher": "processVoiceCommand(spoken);",
          }
          for name, anchor in required.items():
              if anchor not in s:
                  raise SystemExit(f"FAIL: {name}")
              print(f"PASS: {name}")
          print("PASS: TL1 workflow YAML and source anchors")
          PY

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd v10-source
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Package APK and patched source
        shell: bash
        run: |
          set -euo pipefail
          APK="v10-source/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/CarAssistant-TL1-unsigned.apk
          sha256sum dist/CarAssistant-TL1-unsigned.apk

      - name: Upload TL1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: TL1
          path: |
            dist/CarAssistant-TL1-unsigned.apk
            v10-source/app/src/main/java/com/carassistant/v10/V10CarActivity.java
          if-no-files-found: error
          retention-days: 30
