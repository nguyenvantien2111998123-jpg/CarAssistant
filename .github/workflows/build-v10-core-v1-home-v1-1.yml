name: Build Car Assistant V10 Core V1 - Home V1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rebuild exact frozen Display Core V1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          workflow = Path('.github/workflows/build-v10-display-core-v1.yml')
          if not workflow.is_file():
              raise SystemExit('Missing frozen Core V1 workflow')

          doc = yaml.safe_load(workflow.read_text(encoding='utf-8'))
          selected = []

          for step in doc['jobs']['build']['steps']:
              if 'run' in step and not step.get('uses'):
                  selected.append(step)
              if step.get('name') == 'Build V10 Display Core V1':
                  break

          if not selected:
              raise SystemExit('Core V1 run steps not found')

          for step in selected:
              name = step.get('name', 'unnamed')
              print('CORE > ' + name)
              subprocess.run(
                  ['bash', '-euo', 'pipefail', '-c', step['run']],
                  check=True,
              )
          PY

      - name: Apply existing SAFE Floating Touch patch unchanged
        shell: bash
        run: |
          set -euo pipefail
          PATCH='.github/workflows/build-v10-display-core-v1-floating-touch-longpress-safe.yml'

          test -f "$PATCH"

          python3 - "$PATCH" <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import yaml

          patch_file = Path(sys.argv[1])
          doc = yaml.safe_load(patch_file.read_text(encoding='utf-8'))

          wanted = {
              'Extract only Floating Touch source patch',
              'Replace the entire Floating Touch listener with SAFE long-press version',
          }

          found = set()
          for step in doc['jobs']['build']['steps']:
              if step.get('name') in wanted:
                  found.add(step['name'])
                  subprocess.run(
                      ['bash', '-euo', 'pipefail', '-c', step['run']],
                      check=True,
                  )

          if found != wanted:
              missing = wanted - found
              raise SystemExit('Missing SAFE Floating Touch steps: ' + repr(sorted(missing)))
          PY

      - name: Create clean Home V1 Java patch file
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/home_v1.java <<'HOME_V1'
              private void buildDashboard() {
                  dashboard = new LinearLayout(this);
                  dashboard.setOrientation(LinearLayout.VERTICAL);
                  dashboard.setBackgroundColor(Color.rgb(6, 9, 12));
          
                  LinearLayout header = new LinearLayout(this);
                  header.setGravity(Gravity.CENTER_VERTICAL);
                  header.setPadding(dp(14), dp(4), dp(14), dp(4));
                  header.setBackgroundColor(Color.rgb(9, 13, 17));
          
                  LinearLayout timeBox = new LinearLayout(this);
                  timeBox.setOrientation(LinearLayout.VERTICAL);
          
                  clock = text("", 23, Color.WHITE);
                  clock.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  date = text("", 11, Color.LTGRAY);
          
                  timeBox.addView(clock, new LinearLayout.LayoutParams(-1, dp(31)));
                  timeBox.addView(date, new LinearLayout.LayoutParams(-1, dp(20)));
                  header.addView(timeBox, new LinearLayout.LayoutParams(dp(150), dp(56)));
          
                  TextView location = text("Vị trí hiện tại", 14, Color.WHITE);
                  location.setGravity(Gravity.CENTER);
                  header.addView(location, new LinearLayout.LayoutParams(0, dp(56), 1f));
          
                  TextView weather = text("Thời tiết  -- °C", 15, Color.WHITE);
                  weather.setGravity(Gravity.CENTER);
                  header.addView(weather, new LinearLayout.LayoutParams(dp(150), dp(56)));
          
                  dashboard.addView(header, new LinearLayout.LayoutParams(-1, dp(64)));
          
                  FrameLayout center = new FrameLayout(this);
                  center.setBackgroundColor(Color.rgb(11, 17, 21));
          
                  TextView map = text("3D DARK MAP", 24, Color.rgb(110, 130, 140));
                  map.setGravity(Gravity.CENTER);
                  map.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  map.setBackgroundColor(Color.rgb(13, 21, 25));
                  center.addView(map, new FrameLayout.LayoutParams(-1, -1));
          
                  TextView mapStatus = text(
                          "Map Surface - ready for live map provider",
                          11,
                          Color.rgb(135, 150, 155));
                  mapStatus.setGravity(Gravity.CENTER);
          
                  FrameLayout.LayoutParams mapStatusParams =
                          new FrameLayout.LayoutParams(-1, dp(28), Gravity.BOTTOM);
                  mapStatusParams.setMargins(dp(82), 0, dp(10), dp(8));
                  center.addView(mapStatus, mapStatusParams);
          
                  LinearLayout sidebar = new LinearLayout(this);
                  sidebar.setOrientation(LinearLayout.VERTICAL);
                  sidebar.setGravity(Gravity.TOP | Gravity.CENTER_HORIZONTAL);
                  sidebar.setPadding(dp(7), dp(8), dp(7), dp(8));
          
                  GradientDrawable sidebarBackground = new GradientDrawable();
                  sidebarBackground.setColor(Color.rgb(12, 18, 23));
                  sidebarBackground.setCornerRadius(dp(18));
                  sidebarBackground.setStroke(dp(1), Color.rgb(43, 57, 65));
                  sidebar.setBackground(sidebarBackground);
                  sidebar.setElevation(dp(8));
          
                  addHomeSideButton(sidebar, "MENU", "MENU", () -> showApps());
                  addHomeSideButton(sidebar, "MAP", "MAP", () -> { });
                  addHomeSideButton(sidebar, "FILES", "FILES", () -> { });
                  addHomeSideButton(sidebar, "SET", "SETTINGS", () -> { });
                  addHomeSideButton(sidebar, "MORE", "MORE", () -> showApps());
          
                  FrameLayout.LayoutParams sidebarParams =
                          new FrameLayout.LayoutParams(dp(78), -1, Gravity.START | Gravity.TOP);
                  sidebarParams.setMargins(dp(10), dp(10), 0, dp(10));
                  center.addView(sidebar, sidebarParams);
          
                  dashboard.addView(center, new LinearLayout.LayoutParams(-1, 0, 1f));
          
                  LinearLayout bottom = new LinearLayout(this);
                  bottom.setGravity(Gravity.CENTER_VERTICAL);
                  bottom.setPadding(dp(10), dp(5), dp(10), dp(5));
                  bottom.setBackgroundColor(Color.rgb(9, 13, 17));
          
                  LinearLayout media = new LinearLayout(this);
                  media.setGravity(Gravity.CENTER_VERTICAL);
                  addBottomButton(media, "PREV", "PREV");
                  addBottomButton(media, "NEXT", "NEXT");
                  bottom.addView(media, new LinearLayout.LayoutParams(dp(150), dp(66)));
          
                  LinearLayout vehicle = new LinearLayout(this);
                  vehicle.setGravity(Gravity.CENTER);
                  addVehicleStat(vehicle, "DRIVE", "00:00", "DRIVING TIME");
                  addVehicleStat(vehicle, "SPEED", "0 km/h", "SPEED");
                  addVehicleStat(vehicle, "DIST", "0.0 km", "DISTANCE");
                  bottom.addView(vehicle, new LinearLayout.LayoutParams(0, dp(66), 1f));
          
                  LinearLayout nowPlaying = new LinearLayout(this);
                  nowPlaying.setOrientation(LinearLayout.VERTICAL);
                  nowPlaying.setGravity(Gravity.CENTER_VERTICAL);
                  nowPlaying.addView(text("Chưa phát nhạc", 13, Color.WHITE));
                  nowPlaying.addView(text("MEDIA", 10, Color.LTGRAY));
                  bottom.addView(nowPlaying, new LinearLayout.LayoutParams(dp(190), dp(66)));
          
                  dashboard.addView(bottom, new LinearLayout.LayoutParams(-1, dp(78)));
                  launcherLayer.addView(dashboard, new LinearLayout.LayoutParams(-1, -1));
              }
          
              private void addHomeSideButton(
                      LinearLayout parent,
                      String glyph,
                      String label,
                      final Runnable action) {
                  TextView button = text(glyph, 16, Color.WHITE);
                  button.setGravity(Gravity.CENTER);
                  button.setContentDescription(label);
          
                  GradientDrawable background = new GradientDrawable();
                  background.setColor(Color.rgb(19, 27, 33));
                  background.setCornerRadius(dp(14));
                  button.setBackground(background);
          
                  button.setOnClickListener(v -> {
                      if (action != null) {
                          action.run();
                      }
                  });
          
                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(dp(62), dp(58));
                  params.setMargins(0, dp(4), 0, dp(4));
                  parent.addView(button, params);
              }
          
              private void addBottomButton(
                      LinearLayout parent,
                      String glyph,
                      String label) {
                  TextView button = text(glyph, 14, Color.WHITE);
                  button.setGravity(Gravity.CENTER);
                  button.setContentDescription(label);
          
                  GradientDrawable background = new GradientDrawable();
                  background.setColor(Color.rgb(19, 27, 33));
                  background.setCornerRadius(dp(14));
                  button.setBackground(background);
          
                  parent.addView(
                          button,
                          new LinearLayout.LayoutParams(dp(62), dp(54)));
              }
          
              private void addVehicleStat(
                      LinearLayout parent,
                      String glyph,
                      String value,
                      String label) {
                  LinearLayout item = new LinearLayout(this);
                  item.setOrientation(LinearLayout.VERTICAL);
                  item.setGravity(Gravity.CENTER);
          
                  TextView top = text(glyph + "  " + value, 15, Color.WHITE);
                  top.setGravity(Gravity.CENTER);
          
                  TextView bottom = text(label, 9, Color.LTGRAY);
                  bottom.setGravity(Gravity.CENTER);
          
                  item.addView(top);
                  item.addView(bottom);
          
                  parent.addView(
                          item,
                          new LinearLayout.LayoutParams(0, dp(62), 1f));
              }
          HOME_V1

          test -s /tmp/home_v1.java
          echo 'Home V1 patch file created.'

      - name: Apply clean Home V1 source patch
        shell: bash
        run: |
          set -euo pipefail

          FILE='v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java'
          PATCH='/tmp/home_v1.java'

          test -f "$FILE"
          test -s "$PATCH"

          python3 - "$FILE" "$PATCH" <<'PY'
          from pathlib import Path
          import re
          import sys

          source_path = Path(sys.argv[1])
          patch_path = Path(sys.argv[2])

          source = source_path.read_text(encoding='utf-8')
          replacement = patch_path.read_text(encoding='utf-8')

          def find_method_end(text, signature):
              start = text.find(signature)
              if start < 0:
                  raise SystemExit('Missing method: ' + signature)

              brace = text.find('{', start)
              if brace < 0:
                  raise SystemExit('Missing opening brace: ' + signature)

              depth = 0
              in_string = False
              escape = False
              line_comment = False
              block_comment = False
              i = brace

              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ''

                  if line_comment:
                      if c == '\n':
                          line_comment = False
                  elif block_comment:
                      if c == '*' and n == '/':
                          block_comment = False
                          i += 1
                  elif in_string:
                      if escape:
                          escape = False
                      elif c == '\\':
                          escape = True
                      elif c == '"':
                          in_string = False
                  else:
                      if c == '/' and n == '/':
                          line_comment = True
                          i += 1
                      elif c == '/' and n == '*':
                          block_comment = True
                          i += 1
                      elif c == '"':
                          in_string = True
                      elif c == '{':
                          depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              return start, i + 1

                  i += 1

              raise SystemExit('Unclosed method: ' + signature)

          start, end = find_method_end(source, '    private void buildDashboard()')
          source = source[:start] + replacement.rstrip() + '\n' + source[end:]

          if source.count('private void buildDashboard()') != 1:
              raise SystemExit('Expected exactly one buildDashboard()')

          required = [
              '3D DARK MAP',
              'Vị trí hiện tại',
              'Thời tiết',
              'addHomeSideButton',
              'addBottomButton',
              'addVehicleStat',
              'Chưa phát nhạc',
          ]
          for marker in required:
              if marker not in source:
                  raise SystemExit('Missing Home V1 marker: ' + marker)

          forbidden = [
              'floatingLastTap',
              'V10ProjectionService',
              'am force-stop',
          ]
          for marker in forbidden:
              if marker in source:
                  raise SystemExit('Home patch introduced forbidden marker: ' + marker)

          # Home V1 must not alter the Core V1 onStop() lifecycle behavior.
          m = re.search(
              r'public void onStop\(\)\s*\{(.*?)\n\s*\}',
              source,
              re.S,
          )
          if not m:
              raise SystemExit('onStop() not found')
          if 'session.release()' in m.group(1):
              raise SystemExit('Core V1 onStop() release detected')

          source_path.write_text(source, encoding='utf-8')
          print('Clean Home V1 source patch applied.')
          PY

      - name: Verify Core V1 and Home V1 boundaries
        shell: bash
        run: |
          set -euo pipefail

          ACTIVITY='v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java'
          SESSION='v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java'
          DISPLAY='v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java'

          grep -Fq '3D DARK MAP' "$ACTIVITY"
          grep -Fq 'Vị trí hiện tại' "$ACTIVITY"
          grep -Fq 'Thời tiết' "$ACTIVITY"
          grep -Fq 'addHomeSideButton' "$ACTIVITY"
          grep -Fq 'addBottomButton' "$ACTIVITY"
          grep -Fq 'addVehicleStat' "$ACTIVITY"
          grep -Fq 'Chưa phát nhạc' "$ACTIVITY"

          grep -Fq 'createVirtualDisplay' "$DISPLAY"
          grep -Fq -- '--activity-reorder-to-front' "$DISPLAY"
          grep -Fq 'session.hideTask()' "$ACTIVITY"

          if grep -Fq 'session.release()' "$ACTIVITY"; then
            echo 'ERROR: session.release() found in V10CarActivity.java'
            exit 1
          fi

          if grep -Fq 'am force-stop' "$ACTIVITY"; then exit 1; fi
          if grep -Fq 'V10ProjectionService' "$ACTIVITY"; then exit 1; fi
          if grep -Fq 'floatingLastTap' "$ACTIVITY"; then exit 1; fi

          echo 'Core V1 + Floating Touch + Home V1 boundary verification PASSED.'

      - name: Validate workflow structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          path = Path('.github/workflows/build-v10-core-v1-home-v1.yml')
          doc = yaml.safe_load(path.read_text(encoding='utf-8'))

          if not isinstance(doc, dict):
              raise SystemExit('Workflow YAML root is not a mapping')
          if 'jobs' not in doc or 'build' not in doc['jobs']:
              raise SystemExit('build job missing')

          steps = doc['jobs']['build']['steps']
          names = [step.get('name', '') for step in steps]

          required = [
              'Checkout repository',
              'Set up JDK 17',
              'Rebuild exact frozen Display Core V1',
              'Apply existing SAFE Floating Touch patch unchanged',
              'Create clean Home V1 Java patch file',
              'Apply clean Home V1 source patch',
              'Verify Core V1 and Home V1 boundaries',
              'Validate workflow structure',
              'Compile Java',
              'Build APK',
              'Locate APK and SHA256',
              'Upload Home V1 APK',
          ]

          for name in required:
              if name not in names:
                  raise SystemExit('Missing workflow step: ' + name)

          for step in steps:
              run = step.get('run', '')
              if len(run) > 21000:
                  raise SystemExit(
                      'A GitHub Actions run block exceeds 21000 characters: '
                      + step.get('name', 'unnamed')
                  )

          print('Workflow YAML structure and run-block limits PASSED.')
          PY

      - name: Compile Java
        working-directory: v10-source
        shell: bash
        run: ./gradlew --no-daemon --stacktrace compileDebugJavaWithJavac

      - name: Build APK
        working-directory: v10-source
        shell: bash
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Locate APK and SHA256
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "APK=$APK"
          sha256sum "$APK"

      - name: Upload Home V1 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10-Core-V1-Home-V1
          path: v10-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
