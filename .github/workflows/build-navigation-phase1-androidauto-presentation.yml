name: Phase 1 - Android Auto Presentation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aa-navigation-presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      # ============================================================
      # 1. CHECKOUT IMMUTABLE NAVIGATION BASELINE
      # ============================================================
      - name: Checkout immutable Navigation baseline 37607447583
        uses: actions/checkout@v4
        with:
          ref: d69dc922696a4876dbc1000154ce230b220a0ecd
          fetch-depth: 1

      - name: Verify immutable baseline
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="d69dc922696a4876dbc1000154ce230b220a0ecd"
          ACTUAL="$(git rev-parse HEAD)"

          echo "Expected baseline: $EXPECTED"
          echo "Actual baseline:   $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Wrong baseline."
            exit 1
          fi

          echo "PASS: Baseline = run 37607447583."
          echo "PASS: Commit = $ACTUAL."

      # ============================================================
      # 2. JAVA
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. VERIFY SOURCE STRUCTURE
      # ============================================================
      - name: Verify Navigation CORE and Android Auto host
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source"
          JAVA_SRC="$SRC/app/src/main/java/com/hieptran/aacast/doudou"

          test -d "$SRC"
          test -f "$SRC/gradlew"
          test -f "$SRC/app/build.gradle"
          test -f "$SRC/app/src/main/AndroidManifest.xml"

          test -f "$JAVA_SRC/NavigationMapView.java"
          test -f "$JAVA_SRC/V10CarActivity.java"
          test -f "$JAVA_SRC/V10LauncherActivity.java"

          echo "PASS: V10 source exists."
          echo "PASS: NavigationMapView exists."
          echo "PASS: V10CarActivity exists."
          echo "PASS: V10LauncherActivity exists."

      # ============================================================
      # 4. LOCK NAVIGATION CORE
      # ============================================================
      - name: Lock NavigationMapView CORE
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          BEFORE="$(sha256sum "$FILE" | awk '{print $1}')"

          echo "NavigationMapView baseline SHA256:"
          echo "$BEFORE"

          cat > /tmp/navigation_core.sha256 <<EOF
          $BEFORE  $FILE
          EOF

          grep -Fq "class NavigationMapView" "$FILE"
          grep -Fq "MapLibre.getInstance" "$FILE"
          grep -Fq "https://tiles.openfreemap.org/styles/liberty" "$FILE"
          grep -Fq "public void zoomIn()" "$FILE"
          grep -Fq "public void zoomOut()" "$FILE"
          grep -Fq "public void recenter()" "$FILE"
          grep -Fq "public void onHostResume()" "$FILE"
          grep -Fq "public void onHostPause()" "$FILE"
          grep -Fq "public void onHostDestroy()" "$FILE"

          echo "PASS: Navigation CORE signature verified."

      # ============================================================
      # 5. VERIFY AA HOST
      # ============================================================
      - name: Verify Android Auto host before patch
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          grep -Fq "public final class V10CarActivity" "$FILE"
          grep -Fq "extends CarActivity" "$FILE"
          grep -Fq "private NavigationMapView navigationMap;" "$FILE"
          grep -Fq "navigationMap.onHostResume()" "$FILE"
          grep -Fq "navigationMap.onHostPause()" "$FILE"
          grep -Fq "navigationMap.onHostDestroy()" "$FILE"

          echo "PASS: V10CarActivity is the Android Auto host."
          echo "PASS: Existing NavigationMapView host wiring found."

      # ============================================================
      # 6. CREATE CANONICAL PRESENTATION LAYER
      # ============================================================
      - name: Create canonical Navigation Presentation Layer
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationPresentationView.java"

          cat > "$FILE" <<'JAVA'
          package com.carassistant.v10;

          import android.content.Context;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          /**
           * Canonical Navigation Presentation Layer.
           *
           * Android Auto is the primary presentation target.
           *
           * NavigationMapView remains the immutable Navigation CORE.
           *
           * This class contains PRESENTATION ONLY.
           */
          public final class NavigationPresentationView
                  extends FrameLayout {

              public enum Mode {
                  ANDROID_AUTO,
                  PHONE_SUBSET
              }

              private NavigationMapView navigationMap;

              private final Mode mode;

              private TextView routeStatus;
              private TextView gpsStatus;

              public NavigationPresentationView(
                      Context context,
                      Mode mode) {

                  super(context);

                  this.mode = mode;

                  setClickable(false);
                  setFocusable(false);

                  buildPresentation();
              }

              public void setNavigationMap(
                      NavigationMapView map) {

                  navigationMap = map;
              }

              public Mode getMode() {

                  return mode;
              }

              public void setRouteStatus(
                      String status) {

                  if (routeStatus == null) {
                      return;
                  }

                  routeStatus.setText(
                          status == null
                                  ? ""
                                  : status);
              }

              public void setGpsStatus(
                      String status) {

                  if (gpsStatus == null) {
                      return;
                  }

                  gpsStatus.setText(
                      status == null
                              ? ""
                              : status);
              }

              private void buildPresentation() {

                  /*
                   * ==================================================
                   * TOP NAVIGATION INFORMATION
                   * ==================================================
                   */

                  LinearLayout topBar =
                          new LinearLayout(getContext());

                  topBar.setOrientation(
                          LinearLayout.HORIZONTAL);

                  topBar.setGravity(
                          Gravity.CENTER_VERTICAL);

                  GradientDrawable topBackground =
                          background(
                                  Color.argb(
                                          205,
                                          10,
                                          16,
                                          22),
                                  dp(16));

                  topBar.setBackground(
                          topBackground);

                  topBar.setPadding(
                          dp(16),
                          dp(8),
                          dp(16),
                          dp(8));

                  TextView title =
                          text(
                                  "CAR ASSISTANT",
                                  16,
                                  Color.WHITE);

                  title.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD);

                  topBar.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  0,
                                  -1,
                                  1f));

                  gpsStatus =
                          text(
                                  "GPS",
                                  12,
                                  Color.WHITE);

                  gpsStatus.setGravity(
                          Gravity.CENTER);

                  topBar.addView(
                          gpsStatus,
                          new LinearLayout.LayoutParams(
                                  dp(70),
                                  -1));

                  FrameLayout.LayoutParams topParams =
                          new FrameLayout.LayoutParams(
                                  -1,
                                  dp(54),
                                  Gravity.TOP);

                  topParams.setMargins(
                          dp(18),
                          dp(14),
                          dp(18),
                          0);

                  addView(
                          topBar,
                          topParams);

                  /*
                   * ==================================================
                   * RIGHT NAVIGATION CONTROLS
                   * ==================================================
                   */

                  LinearLayout controls =
                          new LinearLayout(getContext());

                  controls.setOrientation(
                          LinearLayout.VERTICAL);

                  controls.setGravity(
                          Gravity.CENTER);

                  addControl(
                          controls,
                          "+",
                          "Zoom in",
                          v -> {

                              if (navigationMap != null) {
                                  navigationMap.zoomIn();
                              }
                          });

                  addControl(
                          controls,
                          "−",
                          "Zoom out",
                          v -> {

                              if (navigationMap != null) {
                                  navigationMap.zoomOut();
                              }
                          });

                  addControl(
                          controls,
                          "◎",
                          "Recenter",
                          v -> {

                              if (navigationMap != null) {
                                  navigationMap.recenter();
                              }
                          });

                  FrameLayout.LayoutParams controlParams =
                          new FrameLayout.LayoutParams(
                                  dp(62),
                                  -2,
                                  Gravity.TOP | Gravity.END);

                  controlParams.setMargins(
                          0,
                          dp(82),
                          dp(18),
                          0);

                  addView(
                          controls,
                          controlParams);

                  /*
                   * ==================================================
                   * BOTTOM NAVIGATION STATUS
                   * ==================================================
                   */

                  LinearLayout bottomBar =
                          new LinearLayout(getContext());

                  bottomBar.setOrientation(
                          LinearLayout.VERTICAL);

                  bottomBar.setGravity(
                          Gravity.CENTER_VERTICAL);

                  bottomBar.setPadding(
                          dp(16),
                          dp(8),
                          dp(16),
                          dp(8));

                  GradientDrawable bottomBackground =
                          background(
                                  Color.argb(
                                          205,
                                          10,
                                          16,
                                          22),
                                  dp(16));

                  bottomBar.setBackground(
                          bottomBackground);

                  routeStatus =
                          text(
                                  "Sẵn sàng dẫn đường",
                                  14,
                                  Color.WHITE);

                  routeStatus.setGravity(
                          Gravity.CENTER_VERTICAL);

                  bottomBar.addView(
                          routeStatus,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(36)));

                  FrameLayout.LayoutParams bottomParams =
                          new FrameLayout.LayoutParams(
                                  -1,
                                  dp(58),
                                  Gravity.BOTTOM);

                  bottomParams.setMargins(
                          dp(18),
                          0,
                          dp(18),
                          dp(16));

                  addView(
                          bottomBar,
                          bottomParams);
              }

              private void addControl(
                      LinearLayout parent,
                      String label,
                      String description,
                      OnClickListener listener) {

                  TextView button =
                          text(
                                  label,
                                  25,
                                  Color.WHITE);

                  button.setGravity(
                          Gravity.CENTER);

                  button.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD);

                  button.setContentDescription(
                          description);

                  button.setClickable(true);
                  button.setFocusable(true);

                  GradientDrawable bg =
                          background(
                                  Color.argb(
                                          190,
                                          20,
                                          30,
                                          40),
                                  dp(14));

                  bg.setStroke(
                          dp(1),
                          Color.argb(
                                  150,
                                  80,
                                  170,
                                  230));

                  button.setBackground(bg);

                  button.setOnClickListener(
                          listener);

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  dp(58),
                                  dp(58));

                  params.setMargins(
                          0,
                          dp(3),
                          0,
                          dp(3));

                  parent.addView(
                          button,
                          params);
              }

              private TextView text(
                      String value,
                      float size,
                      int color) {

                  TextView view =
                          new TextView(getContext());

                  view.setText(value);
                  view.setTextSize(size);
                  view.setTextColor(color);

                  return view;
              }

              private GradientDrawable background(
                      int color,
                      float radius) {

                  GradientDrawable drawable =
                          new GradientDrawable();

                  drawable.setColor(color);
                  drawable.setCornerRadius(radius);

                  return drawable;
              }

              private int dp(float value) {

                  return Math.round(
                          value
                                  * getResources()
                                          .getDisplayMetrics()
                                          .density);
              }
          }
          JAVA

          test -s "$FILE"

          echo "PASS: Canonical NavigationPresentationView created."
          echo "PASS: Presentation contains UI only."

      # ============================================================
      # 7. PATCH V10CarActivity
      # ============================================================
      - name: Attach Navigation Presentation to Android Auto
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          s = path.read_text(encoding="utf-8")

          # 1. Add field
          if "private NavigationPresentationView navigationPresentation;" not in s:
              field_pattern = re.compile(r"(\s*private\s+NavigationMapView\s+navigationMap\s*;)")
              match = field_pattern.search(s)
              if not match:
                  raise SystemExit("ERROR: NavigationMapView field anchor not found.")
              s = s[:match.end()] + "\n    private NavigationPresentationView navigationPresentation;" + s[match.end():]

          # 2. Add presentation view into main FrameLayout
          if "NavigationPresentationView.Mode.ANDROID_AUTO" not in s:
              main_pattern = re.compile(
                  r"(FrameLayout\s+main\s*=\s*new\s+FrameLayout\s*\(\s*this\s*\)\s*;\s*\n\s*dashboard\.addView\s*\(\s*main\s*,\s*new\s+LinearLayout\.LayoutParams\s*\(\s*0\s*,\s*-1\s*,\s*1f\s*\)\s*\)\s*;)",
                  re.DOTALL
              )
              match = main_pattern.search(s)
              if not match:
                  raise SystemExit("ERROR: Dashboard main anchor not found.")

              replacement = (
                  match.group(1) + "\n\n"
                  "        navigationPresentation = new NavigationPresentationView(\n"
                  "                this, NavigationPresentationView.Mode.ANDROID_AUTO);\n"
                  "        navigationPresentation.setNavigationMap(navigationMap);\n"
                  "        main.addView(navigationPresentation, new FrameLayout.LayoutParams(-1, -1));"
              )

              s = s[:match.start()] + replacement + s[match.end():]

          path.write_text(s, encoding="utf-8")
          PY

          grep -Fq \
            "private NavigationPresentationView navigationPresentation;" \
            "$FILE"

          grep -Fq \
            "NavigationPresentationView.Mode.ANDROID_AUTO" \
            "$FILE"

          grep -Fq \
            "navigationPresentation.setNavigationMap(" \
            "$FILE"

          echo "PASS: Android Auto Presentation attached."
          echo "PASS: V10CarActivity remains the AA host."

      # ============================================================
      # 8. VERIFY PHONE WAS NOT MODIFIED
      # ============================================================
      - name: Verify Phone host remains untouched
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10LauncherActivity.java"

          if grep -Fq "NavigationPresentationView" "$FILE"; then
            echo "ERROR: Phone host was modified during Phase 1."
            exit 1
          fi

          if grep -Fq "NavigationMapView navigationMap" "$FILE"; then
            echo "ERROR: Phone Navigation was modified during Phase 1."
            exit 1
          fi

          echo "PASS: V10LauncherActivity remains untouched."
          echo "PASS: Phone Adapter/Preview is deferred until AA PASS."

      # ============================================================
      # 9. VERIFY PRESENTATION HAS NO NAVIGATION CORE
      # ============================================================
      - name: Verify Presentation Layer does not duplicate CORE
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationPresentationView.java"

          if grep -Eq \
            "MapLibre|SpeechRecognizer|LocationManager|FusedLocation|Nominatim|OkHttp|Retrofit" \
            "$FILE"; then

            echo "ERROR: Presentation contains Navigation engine/provider."
            exit 1
          fi

          grep -Fq "NavigationMapView" "$FILE"
          grep -Fq "navigationMap.zoomIn()" "$FILE"
          grep -Fq "navigationMap.zoomOut()" "$FILE"
          grep -Fq "navigationMap.recenter()" "$FILE"

          echo "PASS: Presentation depends on Navigation CORE APIs only."
          echo "PASS: No duplicated Navigation engine/provider."

      # ============================================================
      # 10. VERIFY NAVIGATION CORE SHA DID NOT CHANGE
      # ============================================================
      - name: Verify NavigationMapView remains byte-identical
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          AFTER="$(sha256sum "$FILE" | awk '{print $1}')"
          BEFORE="$(awk '{print $1}' /tmp/navigation_core.sha256)"

          echo "NavigationMapView BEFORE: $BEFORE"
          echo "NavigationMapView AFTER:  $AFTER"

          if [ "$BEFORE" != "$AFTER" ]; then
            echo "ERROR: NavigationMapView changed."
            exit 1
          fi

          echo "PASS: NavigationMapView is unchanged."

      # ============================================================
      # 11. VERIFY AA PRESENTATION STRUCTURE
      # ============================================================
      - name: Verify Android Auto Presentation structure
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationPresentationView.java"

          check() {
            local label="$1"
            local pattern="$2"

            if grep -Fq "$pattern" "$FILE"; then
              echo "PASS: $label"
            else
              echo "ERROR: $label"
              echo "Missing: $pattern"
              exit 1
            fi
          }

          check "Presentation class" \
            "public final class NavigationPresentationView"

          check "Android Auto mode" \
            "ANDROID_AUTO"

          check "Phone subset mode reserved" \
            "PHONE_SUBSET"

          check "NavigationMapView dependency" \
            "private NavigationMapView navigationMap;"

          check "Zoom in presentation action" \
            "navigationMap.zoomIn();"

          check "Zoom out presentation action" \
            "navigationMap.zoomOut();"

          check "Recenter presentation action" \
            "navigationMap.recenter();"

          check "Route status" \
            "setRouteStatus"

          check "GPS status" \
            "setGpsStatus"

          echo "PASS: AA Presentation structure verified."

      # ============================================================
      # 12. VERIFY EXISTING PROJECTION CORE
      # ============================================================
      - name: Verify existing Projection/Persistence CORE
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$SRC/V10ProjectionSession.java"
          test -f "$SRC/V10DisplayController.java"
          test -f "$SRC/V10SurfaceManager.java"
          test -f "$SRC/V10TaskSession.java"
          test -f "$SRC/V10SessionStore.java"

          grep -Fq "createFloatingTouchKey()" \
            "$SRC/V10CarActivity.java"

          grep -Fq 'addFloatingMenuButton("BACK"' \
            "$SRC/V10CarActivity.java"

          grep -Fq 'addFloatingMenuButton("HOME"' \
            "$SRC/V10CarActivity.java"

          echo "PASS: Existing Projection/Persistence CORE preserved."
          echo "PASS: Existing Floating Touch controls preserved."

      # ============================================================
      # 13. GRADLE CONFIGURATION
      # ============================================================
      - name: Verify Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="v10-source/app/build.gradle"

          grep -Fq "namespace 'com.carassistant.v10'" "$GRADLE"
          grep -Fq 'applicationId "com.carassistant.v10"' "$GRADLE"
          grep -Fq "compileSdk 36" "$GRADLE"
          grep -Fq "minSdk 29" "$GRADLE"
          grep -Fq "targetSdk 36" "$GRADLE"
          grep -Fq "JavaVersion.VERSION_17" "$GRADLE"
          grep -Fq "org.maplibre.gl:android-sdk:11.11.0" "$GRADLE"

          echo "PASS: Gradle configuration verified."

      # ============================================================
      # 14. GRADLE COMPILE
      # ============================================================
      - name: Compile Android Auto Presentation
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            :app:compileDebugJavaWithJavac \
            --stacktrace

          echo "PASS: Java compilation."

      # ============================================================
      # 15. ASSEMBLE APK
      # ============================================================
      - name: Assemble Android Auto Presentation APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

          echo "PASS: APK assemble."

      # ============================================================
      # 16. VERIFY APK
      # ============================================================
      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find v10-source/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            find v10-source/app/build/outputs \
              -maxdepth 5 \
              -type f \
              -print || true
            exit 1
          fi

          echo "Generated APK:"
          echo "$APK"

          ls -lh "$APK"

          test -s "$APK"

          cp "$APK" \
            CarAssistant-Navigation-Phase1-AndroidAuto-Presentation.apk

          sha256sum \
            CarAssistant-Navigation-Phase1-AndroidAuto-Presentation.apk \
            > CarAssistant-Navigation-Phase1-AndroidAuto-Presentation.sha256

          echo ""
          echo "=============================================="
          echo "ANDROID AUTO PRESENTATION PHASE 1 APK READY"
          echo "=============================================="

          echo ""
          echo "APK:"
          ls -lh \
            CarAssistant-Navigation-Phase1-AndroidAuto-Presentation.apk

          echo ""
          echo "SHA256:"
          cat \
            CarAssistant-Navigation-Phase1-AndroidAuto-Presentation.sha256

          echo ""
          echo "PASS: Phase 1 APK ready for Android Auto test."

      # ============================================================
      # 17. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload Phase 1 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-Navigation-Phase1-AndroidAuto-Presentation
          path: |
            CarAssistant-Navigation-Phase1-AndroidAuto-Presentation.apk
            CarAssistant-Navigation-Phase1-AndroidAuto-Presentation.sha256
          if-no-files-found: error
          retention-days: 14
