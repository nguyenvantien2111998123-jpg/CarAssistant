Name: Build Main Clean Navigation V2 Baseline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v10-source

    steps:
      - name: Checkout exact main baseline
        uses: actions/checkout@v4
        with:
          ref: 09b2c919b946164618b79283b7c3293c586547a8
          fetch-depth: 0

      - name: Verify exact commit
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="09b2c919b946164618b79283b7c3293c586547a8"
          echo "HEAD=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Verify required source structure
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          test -d app/src/main/java
          test -d app/src/main/res
          test -d app/libs

          echo "Required Navigation V2 source structure verified."

      - name: Save protected core checksums
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/carassistant-protected

          find app/src/main/java \
            -type f \
            \( \
              -name '*ProjectionService*.java' \
              -o -name '*ProjectionSession*.java' \
              -o -name '*Floating*.java' \
              -o -name '*Touch*.java' \
            \) \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > /tmp/carassistant-protected/core.sha256 || true

          echo "Protected core checksums:"
          cat /tmp/carassistant-protected/core.sha256 || true

      - name: Save Floating Touch checksum
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/carassistant-protected

          find app/src/main/java \
            -type f \
            -iname '*Floating*Touch*.java' \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > /tmp/carassistant-protected/floating-touch.sha256 || true

          echo "Floating Touch checksum:"
          cat /tmp/carassistant-protected/floating-touch.sha256 || true

      - name: Inspect NavigationMap initialization
        shell: bash
        run: |
          set -euo pipefail

          echo "=== NavigationMap initialization ==="

          grep -RIn \
            --include='*.java' \
            --include='*.kt' \
            'NavigationMap' \
            app/src/main/java \
            || true

          echo "=== Navigation source files ==="

          find app/src/main/java \
            -type f \
            \( \
              -iname '*Navigation*.java' \
              -o -iname '*Navigation*.kt' \
            \) \
            -print \
            | sort \
            || true

      - name: Clean redundant Dashboard code
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Cleaning redundant Dashboard code ==="

          while IFS= read -r -d '' file; do
            echo "Inspecting: $file"

            python3 - "$file" <<'PY'
import sys
from pathlib import Path

path = Path(sys.argv[1])
text = path.read_text(encoding="utf-8")

original = text

# Remove only clearly redundant/duplicate Dashboard imports.
lines = text.splitlines(True)
seen = set()
out = []

for line in lines:
    stripped = line.strip()

    if stripped.startswith("import ") and stripped in seen:
        continue

    if stripped.startswith("import "):
        seen.add(stripped)

    out.append(line)

text = "".join(out)

if text != original:
    path.write_text(text, encoding="utf-8")
    print(f"Updated: {path}")
else:
    print(f"No redundant imports found: {path}")
PY

          done < <(
            find app/src/main/java \
              -type f \
              \( \
                -iname '*Dashboard*.java' \
                -o -iname '*Dashboard*.kt' \
              \) \
              -print0
          )

      - name: Verify cleanup
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Verify source after cleanup ==="

          find app/src/main/java \
            -type f \
            \( \
              -iname '*Dashboard*.java' \
              -o -iname '*Dashboard*.kt' \
            \) \
            -print \
            | sort

          echo "=== Duplicate imports check ==="

          python3 <<'PY'
from pathlib import Path

errors = []

for path in Path("app/src/main/java").rglob("*"):
    if not path.is_file():
        continue

    if path.suffix not in {".java", ".kt"}:
        continue

    try:
        lines = path.read_text(encoding="utf-8").splitlines()
    except Exception:
        continue

    imports = [line.strip() for line in lines if line.strip().startswith("import ")]

    if len(imports) != len(set(imports)):
        errors.append(str(path))

if errors:
    print("Duplicate imports remain:")
    for item in errors:
        print(item)
    raise SystemExit(1)

print("Duplicate import check passed.")
PY

      - name: Verify Navigation core
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Navigation core verification ==="

          NAV_FILES="$(find app/src/main/java \
            -type f \
            \( \
              -iname '*Navigation*.java' \
              -o -iname '*Navigation*.kt' \
            \) \
            | sort)"

          if [ -z "$NAV_FILES" ]; then
            echo "ERROR: No Navigation source files found."
            exit 1
          fi

          echo "$NAV_FILES"

          echo "=== NavigationMap references ==="

          grep -RIn \
            --include='*.java' \
            --include='*.kt' \
            'NavigationMap' \
            app/src/main/java \
            || true

      - name: Verify protected core unchanged
        shell: bash
        run: |
          set -euo pipefail

          if [ -s /tmp/carassistant-protected/core.sha256 ]; then
            sha256sum -c /tmp/carassistant-protected/core.sha256
          else
            echo "No protected core files were captured."
          fi

      - name: Verify Floating Touch unchanged
        shell: bash
        run: |
          set -euo pipefail

          if [ -s /tmp/carassistant-protected/floating-touch.sha256 ]; then
            sha256sum -c /tmp/carassistant-protected/floating-touch.sha256
          else
            echo "No Floating Touch files were captured."
          fi

      - name: Show source diff
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Git status ==="
          git status --short

          echo "=== Git diff stat ==="
          git diff --stat

          echo "=== Git diff ==="
          git diff -- app/src/main/java app/src/main/res app/build.gradle

      - name: Git diff check
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Git diff check ==="

          if git diff --quiet; then
            echo "No source changes detected before build."
          else
            echo "Source changes detected:"
            git diff --stat
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Make Gradle executable
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew
          chmod +x ./gradlew

          ./gradlew --version

      - name: Compile Java
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace

      - name: Patch release merge for aasdk legacy dex
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
from pathlib import Path

path = Path("app/build.gradle")
text = path.read_text(encoding="utf-8")

start_marker = "tasks.matching { it.name == 'mergeDexRelease' }.configureEach { task ->"

start = text.find(start_marker)

if start < 0:
    raise SystemExit(
        "ERROR: Original mergeDexRelease patch block was not found."
    )

depth = 0
end = None
started = False

for index in range(start, len(text)):
    char = text[index]

    if char == "{":
        depth += 1
        started = True
    elif char == "}":
        depth -= 1

        if started and depth == 0:
            end = index + 1
            break

if end is None:
    raise SystemExit(
        "ERROR: Could not determine end of mergeDexRelease block."
    )

new_block = """
tasks.matching { it.name == 'mergeDexRelease' }.configureEach { task ->
    def legacyDex = file("$projectDir/libs/aasdk-legacy.dex")
    def legacyInputDir = file("$buildDir/intermediates/aasdk_legacy_input")
    def stagedLegacyDex = file("$legacyInputDir/aasdk-legacy.dex")
    def filteredDir = file("$buildDir/intermediates/aasdk_legacy_filtered")
    def mergedDir = file("$buildDir/intermediates/aasdk_legacy_merged")
    def rulesFile = file("$buildDir/intermediates/aasdk_legacy_r8.pro")
    def helperDir = file("$buildDir/intermediates/aasdk_legacy_helper")
    def androidJar = file("${android.sdkDirectory}/platforms/${android.compileSdk}/android.jar")

    doFirst {
        if (!legacyDex.exists()) {
            throw new GradleException(
                "Missing legacy dex: ${legacyDex.absolutePath}"
            )
        }

        if (!androidJar.exists()) {
            throw new GradleException(
                "Missing Android platform jar: ${androidJar.absolutePath}"
            )
        }

        legacyInputDir.mkdirs()
        filteredDir.mkdirs()
        mergedDir.mkdirs()
        helperDir.mkdirs()

        stagedLegacyDex.bytes = legacyDex.bytes

        legacyDex.delete()

        rulesFile.text = '''
-dontshrink
-dontoptimize
-dontobfuscate
-dontpreverify
-dontwarn **
-ignorewarnings
-keep class ** { *; }
'''

        def builderRoot = new File(
            System.getProperty("user.home"),
            ".gradle/caches/modules-2/files-2.1/com.android.tools.build/builder/8.13.0"
        )

        if (!builderRoot.exists()) {
            throw new GradleException(
                "AGP builder 8.13.0 cache was not found: ${builderRoot.absolutePath}"
            )
        }

        def builderJarFiles = builderRoot.findFiles {
            it.name == "builder-8.13.0.jar"
        }

        if (builderJarFiles == null || builderJarFiles.length == 0) {
            throw new GradleException(
                "builder-8.13.0.jar was not found under ${builderRoot.absolutePath}"
            )
        }

        def builderJar = builderJarFiles[0]

        println("Using AGP builder: ${builderJar.absolutePath}")

        def r8Class = new File(
            builderJar.parentFile,
            "com/android/tools/r8/R8.class"
        )

        def d8Class = new File(
            builderJar.parentFile,
            "com/android/tools/r8/D8.class"
        )

        println("Builder jar verified: ${builderJar.exists()}")
        println("R8.class expected from AGP builder.")
        println("D8.class expected from AGP builder.")

        def helperSource = new File(helperDir, "R8DexFilter.java")

        helperSource.text = '''
import com.android.tools.r8.CompilationMode;
import com.android.tools.r8.R8;
import com.android.tools.r8.R8Command;
import com.android.tools.r8.utils.OutputMode;

import java.nio.file.Path;
import java.nio.file.Paths;
import java.util.ArrayList;
import java.util.List;

public class R8DexFilter {
    public static void main(String[] args) throws Exception {
        if (args.length != 4) {
            throw new IllegalArgumentException(
                "Usage: R8DexFilter <input.dex> <output.dir> <android.jar> <rules.pro>"
            );
        }

        Path inputDex = Paths.get(args[0]);
        Path outputDir = Paths.get(args[1]);
        Path androidJar = Paths.get(args[2]);
        Path rules = Paths.get(args[3]);

        List<Path> libraries = new ArrayList<>();
        libraries.add(androidJar);

        R8Command.Builder builder = R8Command.builder();

        builder
            .setMode(CompilationMode.RELEASE)
            .setEnableExperimentalDexInput(true)
            .addProgramFiles(inputDex)
            .addLibraryFiles(libraries)
            .addProguardConfigurationFiles(rules)
            .setOutput(outputDir, OutputMode.DexIndexed);

        R8.run(builder.build());
    }
}
'''

        println("R8 helper source written: ${helperSource.absolutePath}")
    }

    doLast {
        def legacyInputDir = file("$buildDir/intermediates/aasdk_legacy_input")
        def stagedLegacyDex = file("$legacyInputDir/aasdk-legacy.dex")
        def filteredDir = file("$buildDir/intermediates/aasdk_legacy_filtered")
        def mergedDir = file("$buildDir/intermediates/aasdk_legacy_merged")
        def rulesFile = file("$buildDir/intermediates/aasdk_legacy_r8.pro")
        def helperDir = file("$buildDir/intermediates/aasdk_legacy_helper")
        def helperSource = file("$helperDir/R8DexFilter.java")
        def helperClasses = file("$helperDir/classes")
        def androidJar = file("${android.sdkDirectory}/platforms/${android.compileSdk}/android.jar")

        def builderRoot = new File(
            System.getProperty("user.home"),
            ".gradle/caches/modules-2/files-2.1/com.android.tools.build/builder/8.13.0"
        )

        def builderJarFiles = builderRoot.findFiles {
            it.name == "builder-8.13.0.jar"
        }

        if (builderJarFiles == null || builderJarFiles.length == 0) {
            throw new GradleException(
                "builder-8.13.0.jar was not found."
            )
        }

        def builderJar = builderJarFiles[0]

        helperClasses.mkdirs()
        filteredDir.mkdirs()
        mergedDir.mkdirs()

        def appDexDir = task.outputs.files.singleFile

        def appDexFiles = fileTree(appDexDir).matching {
            include("**/*.dex")
        }.files.sort { a, b ->
            a.name <=> b.name
        }

        if (appDexFiles.isEmpty()) {
            throw new GradleException(
                "No application dex files found in ${appDexDir.absolutePath}"
            )
        }

        println("Application dex files:")
        appDexFiles.each {
            println(" - ${it.absolutePath}")
        }

        println("Legacy dex:")
        println(" - ${stagedLegacyDex.absolutePath}")

        def compileClasspath = builderJar.absolutePath

        exec {
            commandLine(
                "javac",
                "-cp", compileClasspath,
                "-d", helperClasses.absolutePath,
                helperSource.absolutePath
            )
        }

        exec {
            commandLine(
                "java",
                "-cp",
                "${helperClasses.absolutePath}${File.pathSeparator}${builderJar.absolutePath}",
                "R8DexFilter",
                stagedLegacyDex.absolutePath,
                filteredDir.absolutePath,
                androidJar.absolutePath,
                rulesFile.absolutePath
            )
        }

        def filteredDexFiles = fileTree(filteredDir).matching {
            include("**/*.dex")
        }.files.sort { a, b ->
            a.name <=> b.name
        }

        if (filteredDexFiles.isEmpty()) {
            throw new GradleException(
                "R8 produced no filtered dex files."
            )
        }

        println("Filtered legacy dex files:")
        filteredDexFiles.each {
            println(" - ${it.absolutePath}")
        }

        def d8Inputs = []
        d8Inputs.addAll(appDexFiles)
        d8Inputs.addAll(filteredDexFiles)

        println("Running D8 merge with ${d8Inputs.size()} dex inputs.")

        def d8Command = [
            "java",
            "-cp",
            builderJar.absolutePath,
            "com.android.tools.r8.D8"
        ]

        d8Inputs.each {
            d8Command.add(it.absolutePath)
        }

        d8Command.add("--lib")
        d8Command.add(androidJar.absolutePath)
        d8Command.add("--min-api")
        d8Command.add("${android.defaultConfig.minSdk ?: 23}")
        d8Command.add("--output")
        d8Command.add(mergedDir.absolutePath)

        exec {
            commandLine(d8Command)
        }

        def mergedDexFiles = fileTree(mergedDir).matching {
            include("**/*.dex")
        }.files.sort { a, b ->
            a.name <=> b.name
        }

        if (mergedDexFiles.isEmpty()) {
            throw new GradleException(
                "D8 produced no merged dex files."
            )
        }

        println("Merged dex files:")
        mergedDexFiles.each {
            println(" - ${it.absolutePath}")
        }

        fileTree(appDexDir).matching {
            include("**/*.dex")
        }.files.each {
            if (!it.delete()) {
                throw new GradleException(
                    "Could not delete old dex: ${it.absolutePath}"
                )
            }
        }

        mergedDexFiles.eachWithIndex { dexFile, index ->
            def destination = new File(
                appDexDir,
                dexFile.name
            )

            if (!dexFile.renameTo(destination)) {
                destination.bytes = dexFile.bytes
            }

            println("Installed merged dex: ${destination.absolutePath}")
        }

        if (!stagedLegacyDex.exists()) {
            throw new GradleException(
                "Staged legacy dex disappeared before restore."
            )
        }

        def legacyDex = file("$projectDir/libs/aasdk-legacy.dex")
        legacyDex.parentFile.mkdirs()
        legacyDex.bytes = stagedLegacyDex.bytes

        println("Restored legacy dex to ${legacyDex.absolutePath}")
    }
}
"""

path.write_text(
    text[:start] + new_block.strip("\n") + text[end:],
    encoding="utf-8"
)

print("mergeDexRelease patch installed successfully.")
PY

      - name: Verify release merge patch
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Verify release merge patch ==="

          test -f app/build.gradle

          grep -Fq "mergeDexRelease" app/build.gradle
          grep -Fq "aasdk-legacy.dex" app/build.gradle
          grep -Fq "R8DexFilter" app/build.gradle
          grep -Fq "setEnableExperimentalDexInput(true)" app/build.gradle
          grep -Fq "builder-8.13.0.jar" app/build.gradle
          grep -Fq "com.android.tools.r8.D8" app/build.gradle

          echo "Release merge patch markers verified."

      - name: Assemble Release APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          echo "=== Verify release APK ==="

          test -f "$APK"
          test -s "$APK"

          echo "APK path:"
          realpath "$APK"

          echo "APK size:"
          stat -c '%s bytes' "$APK"

          echo "APK SHA256:"
          sha256sum "$APK"

          echo "APK verification passed."

      - name: Upload clean baseline APK
        uses: actions/upload-artifact@v4
        with:
          name: navigation-v2-clean-baseline-apk
          path: v10-source/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
