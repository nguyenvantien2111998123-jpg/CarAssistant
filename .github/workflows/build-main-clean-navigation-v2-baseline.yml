name: Build Main Clean Navigation V2 Baseline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: v10-source

    steps:
      - name: Checkout exact main baseline
        uses: actions/checkout@v4
        with:
          ref: 09b2c919b946164618b79283b7c3293c586547a8
          fetch-depth: 0

      - name: Verify exact commit
        shell: bash
        run: |
          set -e
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="09b2c919b946164618b79283b7c3293c586547a8"
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Verify required source structure
        shell: bash
        run: |
          set -e
          test -f app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java
          test -f app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java
          test -f app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java
          test -f app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java
          test -f app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java
          test -f app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java
          test -f app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java
          echo "Required source files exist."

      - name: Save protected core checksums
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/carassistant-protected

          sha256sum \
            app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java \
            > /tmp/carassistant-protected/core.sha256

          echo "Protected Projection/Persistence core checksums:"
          cat /tmp/carassistant-protected/core.sha256

      - name: Save Floating Touch checksum
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path(
              "app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          source = path.read_text(encoding="utf-8")

          start_marker = "    private void createFloatingTouchKey() {"
          end_marker = "private void showFloatingMenu() {"

          start = source.find(start_marker)
          end = source.find(end_marker)

          print("Floating Touch start index:", start)
          print("Floating Touch end index:", end)

          if start < 0:
              raise SystemExit(
                  "createFloatingTouchKey() was not found."
              )

          if end < 0:
              raise SystemExit(
                  "showFloatingMenu() was not found."
              )

          if end <= start:
              raise SystemExit(
                  "Invalid Floating Touch method boundaries."
              )

          block = source[start:end]

          digest = hashlib.sha256(
              block.encode("utf-8")
          ).hexdigest()

          Path(
              "/tmp/carassistant-protected/floating.sha256"
          ).write_text(
              digest + "\n",
              encoding="utf-8"
          )

          print(
              "Floating Touch SHA256:",
              digest
          )
          PY

      - name: Inspect NavigationMap initialization
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          source = path.read_text(encoding="utf-8")

          needle = "navigationMap = new NavigationMapView(this);"
          count = source.count(needle)

          print(
              "NavigationMapView initialization count:",
              count
          )

          if count != 2:
              raise SystemExit(
                  "Expected exactly 2 NavigationMapView initializations "
                  "in the original baseline, found "
                  + str(count)
              )

          print(
              "Redundant NavigationMapView initialization detected."
          )
          PY

      - name: Clean redundant Dashboard code
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          source = path.read_text(encoding="utf-8")

          navigation_needle = (
              "navigationMap = new NavigationMapView(this);"
          )

          navigation_positions = []
          search_from = 0

          while True:
              pos = source.find(
                  navigation_needle,
                  search_from
              )

              if pos < 0:
                  break

              navigation_positions.append(pos)
              search_from = pos + len(navigation_needle)

          if len(navigation_positions) != 2:
              raise SystemExit(
                  "Expected exactly 2 NavigationMapView initializations "
                  "before cleanup, found "
                  + str(len(navigation_positions))
              )

          second_pos = navigation_positions[1]

          line_start = source.rfind(
              "\n",
              0,
              second_pos
          ) + 1

          after_init = (
              second_pos
              + len(navigation_needle)
          )

          next_root = source.find(
              "root.addView(",
              after_init
          )

          if next_root < 0:
              raise SystemExit(
                  "The second NavigationMapView root.addView() "
                  "was not found."
              )

          next_statement_end = source.find(
              ");",
              next_root
          )

          if next_statement_end < 0:
              raise SystemExit(
                  "The second NavigationMapView root.addView() "
                  "closing statement was not found."
              )

          next_statement_end += 2

          if (
              next_statement_end < len(source)
              and source[next_statement_end] == "\n"
          ):
              next_statement_end += 1

          source = (
              source[:line_start]
              + source[next_statement_end:]
          )

          dashboard_start_marker = (
              "    private void buildDashboard() {"
          )

          dashboard_end_marker = (
              "    private void buildAppPanel() {"
          )

          dashboard_start = source.find(
              dashboard_start_marker
          )

          dashboard_end = source.find(
              dashboard_end_marker
          )

          print(
              "buildDashboard start:",
              dashboard_start
          )

          print(
              "buildAppPanel boundary:",
              dashboard_end
          )

          if dashboard_start < 0:
              raise SystemExit(
                  "buildDashboard() was not found."
              )

          if dashboard_end < 0:
              raise SystemExit(
                  "buildAppPanel() boundary was not found."
              )

          if dashboard_end <= dashboard_start:
              raise SystemExit(
                  "Invalid buildDashboard() method boundaries."
              )

          source = (
              source[:dashboard_start]
              + source[dashboard_end:]
          )

          weight_start_marker = (
              "    private LinearLayout.LayoutParams\n"
              "            weightParams() {"
          )

          weight_start = source.find(
              weight_start_marker
          )

          if weight_start < 0:
              raise SystemExit(
                  "weightParams() was not found."
              )

          brace_start = source.find(
              "{",
              weight_start
          )

          if brace_start < 0:
              raise SystemExit(
                  "weightParams() opening brace was not found."
              )

          depth = 0
          end = None

          for i in range(
              brace_start,
              len(source)
          ):
              char = source[i]

              if char == "{":
                  depth += 1

              elif char == "}":
                  depth -= 1

                  if depth == 0:
                      end = i + 1
                      break

          if end is None:
              raise SystemExit(
                  "Could not determine end of weightParams()."
              )

          if (
              end < len(source)
              and source[end] == "\n"
          ):
              end += 1

          source = (
              source[:weight_start]
              + source[end:]
          )

          call = "        buildDashboard();\n"

          call_count = source.count(call)

          print(
              "buildDashboard() call count before removal:",
              call_count
          )

          if call_count != 1:
              raise SystemExit(
                  "Expected exactly 1 buildDashboard(); call, found "
                  + str(call_count)
              )

          source = source.replace(
              call,
              "",
              1
          )

          if "buildDashboard();" in source:
              raise SystemExit(
                  "buildDashboard(); call still exists."
              )

          if "private void buildDashboard()" in source:
              raise SystemExit(
                  "buildDashboard() method still exists."
              )

          path.write_text(
              source,
              encoding="utf-8"
          )

          print(
              "Cleanup completed successfully."
          )
          PY

      - name: Verify cleanup
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          source = path.read_text(encoding="utf-8")

          navigation_count = source.count(
              "navigationMap = new NavigationMapView(this);"
          )

          print(
              "NavigationMapView initialization count after cleanup:",
              navigation_count
          )

          if navigation_count != 1:
              raise SystemExit(
                  "NavigationMapView initialization count "
                  "is not exactly 1."
              )

          if "private void buildDashboard()" in source:
              raise SystemExit(
                  "Legacy buildDashboard() still exists."
              )

          if "buildDashboard();" in source:
              raise SystemExit(
                  "Legacy buildDashboard(); call still exists."
              )

          if "weightParams()" in source:
              raise SystemExit(
                  "weightParams() still exists."
              )

          required = [
              "private NavigationMapView navigationMap;",
              "private FrameLayout projectionLayer;",
              "private LinearLayout launcherLayer;",
              "private LinearLayout appPanel;",
              "private LinearLayout dock;",
              "private void buildAppPanel()",
              "private void rebuildAppGrid(",
              "private void loadApps()",
              "private void rebuildDock()",
              "private LinearLayout appTile(",
              "private void attachProjection()",
              "private void launchProjection(",
              "private void returnToLauncher()",
              "private void showApps()",
              "private void hideApps()",
              "private void createFloatingTouchKey()",
              "private void showFloatingMenu()",
              "private void addFloatingMenuButton(",
              "private void hideFloatingMenu()",
              "private String initial(",
          ]

          for item in required:
              if item not in source:
                  raise SystemExit(
                      "Required source element missing: "
                      + item
                  )

          print(
              "Modern V10 UI / Projection structure preserved."
          )

          print(
              "Cleanup verification PASSED."
          )
          PY

      - name: Verify Navigation core
        shell: bash
        run: |
          set -e

          NAV="app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          test -f "$NAV"

          grep -q "class NavigationMapView" "$NAV"
          grep -q "recenter()" "$NAV"
          grep -q "onHostResume()" "$NAV"
          grep -q "onHostPause()" "$NAV"
          grep -q "onHostDestroy()" "$NAV"

          echo "NavigationMapView core verification passed."

      - name: Verify protected core unchanged
        shell: bash
        run: |
          set -e

          sha256sum \
            app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java \
            > /tmp/carassistant-protected/core-after.sha256

          diff -u \
            /tmp/carassistant-protected/core.sha256 \
            /tmp/carassistant-protected/core-after.sha256

          echo "Projection/Persistence core is byte-identical."

      - name: Verify Floating Touch unchanged
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path(
              "app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          source = path.read_text(encoding="utf-8")

          start_marker = "    private void createFloatingTouchKey() {"
          end_marker = "private void showFloatingMenu() {"

          start = source.find(start_marker)
          end = source.find(end_marker)

          print(
              "Floating Touch start index after cleanup:",
              start
          )

          print(
              "Floating Touch end index after cleanup:",
              end
          )

          if start < 0:
              raise SystemExit(
                  "createFloatingTouchKey() was not found after cleanup."
              )

          if end < 0:
              raise SystemExit(
                  "showFloatingMenu() was not found after cleanup."
              )

          if end <= start:
              raise SystemExit(
                  "Invalid Floating Touch boundaries after cleanup."
              )

          block = source[start:end]

          digest = hashlib.sha256(
              block.encode("utf-8")
          ).hexdigest()

          expected = Path(
              "/tmp/carassistant-protected/floating.sha256"
          ).read_text(
              encoding="utf-8"
          ).strip()

          print(
              "Floating Touch SHA256 before:",
              expected
          )

          print(
              "Floating Touch SHA256 after:",
              digest
          )

          if digest != expected:
              raise SystemExit(
                  "Floating Touch block changed."
              )

          print(
              "Floating Touch is byte-identical."
          )
          PY

      - name: Show source diff
        shell: bash
        run: |
          set -e

          git status --short

          git diff -- \
            app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

      - name: Git diff check
        shell: bash
        run: |
          set -e
          git diff --check

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x ./gradlew

      - name: Compile Java
        shell: bash
        run: |
          set -e

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace

      # ============================================================
      # ONLY RELEASE-MERGE PATCH
      #
      # Source of truth:
      #   v10-source/app/build.gradle on main
      #
      # The original V10 / Navigation / Projection / Persistence
      # structure is not changed.
      #
      # Problem fixed:
      #   AGP mergeDexRelease was automatically feeding
      #   app/libs/aasdk-legacy.dex into R8.
      #
      # R8 CLI rejects DEX program input by default.
      #
      # New CI-only approach:
      #   1. Move legacy dex out of app/libs BEFORE AGP merge.
      #   2. Let AGP build the normal application dex files.
      #   3. Use the exact AGP builder R8 API with experimental
      #      DEX-input support.
      #   4. Treat already-built app dex files as R8 libraries.
      #      This removes duplicate classes from the legacy dex.
      #   5. Use the same AGP D8 to merge the filtered legacy dex
      #      back with the normal application dex files.
      #
      # Nothing is committed to build.gradle.
      # The modification exists only inside the GitHub Actions
      # workspace during this release build.
      # ============================================================

      - name: Patch release merge for aasdk legacy dex
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          source = path.read_text(encoding="utf-8")

          start_marker = (
              "tasks.matching { it.name == 'mergeDexRelease' }.configureEach { task ->"
          )

          end_marker = (
              "\n\ntasks.register('distRelease'"
          )

          start = source.find(start_marker)
          end = source.find(end_marker, start)

          print("Original release merge start:", start)
          print("Original release merge end:", end)

          if start < 0:
              raise SystemExit(
                  "Original mergeDexRelease block was not found."
              )

          if end < 0:
              raise SystemExit(
                  "distRelease boundary was not found."
              )

          new_block = r'''tasks.matching { it.name == 'mergeDexRelease' }.configureEach { task ->

    /*
     * CI-only release merge patch.
     *
     * AGP must NOT see aasdk-legacy.dex as an automatic local
     * DEX dependency. It is therefore copied outside app/libs
     * during Gradle configuration, before mergeDexRelease starts.
     */
    def originalLegacyDex = rootProject.file('app/libs/aasdk-legacy.dex')
    def ciLegacyDex = new File(
            project.layout.buildDirectory.asFile.get(),
            'intermediates/aasdk_legacy_input/aasdk-legacy.dex'
    )

    if (!originalLegacyDex.exists()) {
        throw new GradleException(
                'Thiếu app/libs/aasdk-legacy.dex!'
        )
    }

    ciLegacyDex.parentFile.mkdirs()
    ciLegacyDex.bytes = originalLegacyDex.bytes

    /*
     * Remove the DEX from app/libs before AGP creates the
     * mergeDexRelease task inputs.
     */
    if (!originalLegacyDex.delete()) {
        throw new GradleException(
                'Không thể đưa aasdk-legacy.dex ra khỏi app/libs!'
        )
    }

    println(
            'CI legacy dex staged outside app/libs: '
                    + ciLegacyDex.absolutePath
    )

    task.doLast {

        def legacyDex = ciLegacyDex

        if (!legacyDex.exists()) {
            throw new GradleException(
                    'Không tìm thấy CI legacy dex: '
                            + legacyDex.absolutePath
            )
        }

        def outputDir = task.outputDir.get().asFile

        def dexFilter = {
            it.isFile() && it.name ==~ /classes\d*\.dex/
        } as FileFilter

        def appDexes = outputDir.listFiles(dexFilter)?.toList() ?: []

        if (appDexes.isEmpty()) {
            throw new GradleException(
                    'Không tìm thấy classes*.dex trong '
                            + outputDir
            )
        }

        println(
                'Application dex files before legacy merge:'
        )

        appDexes.each {
            println(
                    '  APP DEX: '
                            + it.absolutePath
            )
        }

        def buildDirFile = project.layout.buildDirectory.asFile.get()

        def tempDir = new File(
                buildDirFile,
                'intermediates/dex_merged_temp'
        )

        tempDir.deleteDir()
        tempDir.mkdirs()

        def filteredDir = new File(
                buildDirFile,
                'intermediates/aasdk_legacy_filtered'
        )

        filteredDir.deleteDir()
        filteredDir.mkdirs()

        def filteredLegacyDex = new File(
                filteredDir,
                'classes.dex'
        )

        def r8Rules = new File(
                filteredDir,
                'filter.pro'
        )

        def r8RuleLines = [
                '-dontoptimize',
                '-dontobfuscate',
                '-dontpreverify',
                '-ignorewarnings',
                '',
                '-keep class com.google.android.apps.auto.sdk.** { *; }',
                '',
                '-keep class com.google.android.gms.** { *; }',
                '-keep class com.google.protobuf.** { *; }',
                '',
                '-dontwarn **'
        ]

        r8Rules.text =
                r8RuleLines.join(System.lineSeparator())
                        + System.lineSeparator()

        def sdkDir = android.sdkDirectory.absolutePath
        def androidJar = new File(
                android.sdkDirectory,
                'platforms/android-' + android.compileSdk + '/android.jar'
        )

        if (!androidJar.exists()) {
            throw new GradleException(
                    'Không tìm thấy android.jar: '
                            + androidJar.absolutePath
            )
        }

        /*
         * Resolve the exact AGP builder used by this project.
         */
        def builderRoot = new File(
                System.getProperty('user.home'),
                '.gradle/caches/modules-2/files-2.1/com.android.tools.build/builder/8.13.0'
        )

        if (!builderRoot.exists()) {
            throw new GradleException(
                    'Không tìm thấy thư mục AGP builder 8.13.0: '
                            + builderRoot.absolutePath
            )
        }

        def builderCandidates = fileTree(builderRoot).matching {
            include '**/builder-8.13.0.jar'
        }.files.toList()

        if (builderCandidates.isEmpty()) {
            throw new GradleException(
                    'Không tìm thấy builder-8.13.0.jar trong: '
                            + builderRoot.absolutePath
            )
        }

        def agpBuilderJar = builderCandidates.sort { a, b ->
            b.lastModified() <=> a.lastModified()
        }.first()

        println(
                'EXACT AGP BUILDER: '
                        + agpBuilderJar.absolutePath
        )

        def builderListingOutput =
                new ByteArrayOutputStream()

        project.exec {
            standardOutput = builderListingOutput
            commandLine(
                    'jar',
                    'tf',
                    agpBuilderJar.absolutePath
            )
        }

        def builderListing =
                builderListingOutput.toString('UTF-8')

        if (!builderListing.contains(
                'com/android/tools/r8/R8.class'
        )) {
            throw new GradleException(
                    'builder-8.13.0.jar không chứa R8.class: '
                            + agpBuilderJar.absolutePath
            )
        }

        if (!builderListing.contains(
                'com/android/tools/r8/D8.class'
        )) {
            throw new GradleException(
                    'builder-8.13.0.jar không chứa D8.class: '
                            + agpBuilderJar.absolutePath
            )
        }

        println(
                'Verified AGP builder contains R8.class and D8.class.'
        )

        /*
         * The current AGP builder contains the experimental
         * R8 API which explicitly enables DEX program input.
         *
         * We invoke that API directly instead of using the
         * normal R8 command line, which rejects DEX inputs.
         */
        def helperDir = new File(
                buildDirFile,
                'intermediates/r8_dex_filter_helper'
        )

        helperDir.deleteDir()
        helperDir.mkdirs()

        def helperJava = new File(
                helperDir,
                'R8DexFilter.java'
        )

        helperJava.text = '''
import com.android.tools.r8.CompilationMode;
import com.android.tools.r8.R8;
import com.android.tools.r8.R8Command;
import com.android.tools.r8.utils.OutputMode;

import java.nio.file.Path;
import java.nio.file.Paths;

public final class R8DexFilter {

    private R8DexFilter() {
    }

    public static void main(String[] args) throws Exception {

        if (args.length < 4) {
            throw new IllegalArgumentException(
                    "Usage: R8DexFilter <input.dex> <outputDir> <android.jar> <rules.pro> [library.dex...]"
            );
        }

        Path inputDex = Paths.get(args[0]);
        Path outputDir = Paths.get(args[1]);
        Path androidJar = Paths.get(args[2]);
        Path rules = Paths.get(args[3]);

        R8Command.Builder builder =
                R8Command.builder()
                        .setMode(CompilationMode.RELEASE)
                        .setMinApiLevel(29)
                        .setDisableTreeShaking(true)
                        .setDisableMinification(true)
                        .setEnableExperimentalDexInput(true)
                        .addProgramFiles(inputDex)
                        .addLibraryFiles(androidJar)
                        .addProguardConfigurationFiles(rules)
                        .setOutput(
                                outputDir,
                                OutputMode.DexIndexed
                        );

        for (int i = 4; i < args.length; i++) {
            builder.addLibraryFiles(
                    Paths.get(args[i])
            );
        }

        R8.run(
                builder.build()
        );
    }
}
'''

        project.exec {
            commandLine(
                    'javac',
                    '-cp',
                    agpBuilderJar.absolutePath,
                    '-d',
                    helperDir.absolutePath,
                    helperJava.absolutePath
            )
        }

        println(
                'R8 experimental DEX-input helper compiled.'
        )

        /*
         * Pass the already-built application DEX files as
         * R8 library inputs.
         *
         * Therefore:
         *
         *   legacy dex = program
         *   app dexes  = libraries
         *
         * Classes which already exist in the application are
         * not emitted again from the legacy program.
         */
        def r8Args = [
                'java',
                '-cp',
                agpBuilderJar.absolutePath
                        + File.pathSeparator
                        + helperDir.absolutePath,
                'R8DexFilter',
                legacyDex.absolutePath,
                filteredDir.absolutePath,
                androidJar.absolutePath,
                r8Rules.absolutePath
        ]

        r8Args += appDexes*.absolutePath

        project.exec {
            commandLine(r8Args)
        }

        if (!filteredLegacyDex.exists()) {
            throw new GradleException(
                    'R8 không tạo được filtered aasdk-legacy.dex!'
            )
        }

        println(
                'Filtered legacy dex: '
                        + filteredLegacyDex.absolutePath
        )

        /*
         * D8 accepts already-compiled DEX files and merges them
         * into the final DEX output.
         */
        def finalD8Args = [
                'java',
                '-cp',
                agpBuilderJar.absolutePath,
                'com.android.tools.r8.D8',
                '--release',
                '--min-api',
                '29',
                '--output',
                tempDir.absolutePath
        ]

        finalD8Args += appDexes*.absolutePath
        finalD8Args += filteredLegacyDex.absolutePath

        project.exec {
            commandLine(finalD8Args)
        }

        def mergedDexes =
                tempDir.listFiles(dexFilter)?.toList() ?: []

        if (mergedDexes.isEmpty()) {
            throw new GradleException(
                    'D8 merge dex thất bại!'
            )
        }

        println(
                'D8 merged dex files:'
        )

        mergedDexes.each {
            println(
                    '  MERGED DEX: '
                            + it.absolutePath
            )
        }

        appDexes.each {
            it.delete()
        }

        mergedDexes.each { merged ->
            def target = new File(
                    outputDir,
                    merged.name
            )

            if (!merged.renameTo(target)) {
                target.bytes = merged.bytes
                merged.delete()
            }
        }

        /*
         * Restore the original legacy dex in the CI workspace.
         * It is outside the APK build input at this point.
         */
        def restoreLegacyDex =
                rootProject.file(
                        'app/libs/aasdk-legacy.dex'
                )

        restoreLegacyDex.parentFile.mkdirs()

        if (!restoreLegacyDex.exists()) {
            restoreLegacyDex.bytes = legacyDex.bytes
        }

        tempDir.deleteDir()

        println(
                'Release legacy dex merge completed successfully.'
        )
    }
}
