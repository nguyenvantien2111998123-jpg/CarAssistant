name: Build Main Clean Navigation V2 Baseline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: v10-source

    steps:

      - name: Checkout exact main baseline
        uses: actions/checkout@v4
        with:
          ref: 09b2c919b946164618b79283b7c3293c586547a8
          fetch-depth: 0

      - name: Verify exact commit
        shell: bash
        run: |
          set -e

          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="09b2c919b946164618b79283b7c3293c586547a8"

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          test "$ACTUAL" = "$EXPECTED"

      - name: Verify required source structure
        shell: bash
        run: |
          set -e

          test -f app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java
          test -f app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java
          test -f app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java
          test -f app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java
          test -f app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java
          test -f app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java
          test -f app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java

          echo "Required source files exist."

      - name: Save protected core checksums
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/carassistant-protected

          sha256sum \
            app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java \
            > /tmp/carassistant-protected/core.sha256

          echo "Protected Projection/Persistence core checksums:"
          cat /tmp/carassistant-protected/core.sha256

      - name: Save Floating Touch checksum
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path(
              "app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          source = path.read_text(encoding="utf-8")

          start_marker = "    private void createFloatingTouchKey() {"
          end_marker = "private void showFloatingMenu() {"

          start = source.find(start_marker)
          end = source.find(end_marker)

          print("Floating Touch start index:", start)
          print("Floating Touch end index:", end)

          if start < 0:
              raise SystemExit(
                  "createFloatingTouchKey() was not found."
              )

          if end < 0:
              raise SystemExit(
                  "showFloatingMenu() was not found."
              )

          if end <= start:
              raise SystemExit(
                  "Invalid Floating Touch method boundaries."
              )

          block = source[start:end]

          digest = hashlib.sha256(
              block.encode("utf-8")
          ).hexdigest()

          Path(
              "/tmp/carassistant-protected/floating.sha256"
          ).write_text(
              digest + "\n",
              encoding="utf-8"
          )

          print("Floating Touch SHA256:", digest)
          PY

      - name: Inspect NavigationMap initialization
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          source = path.read_text(encoding="utf-8")

          needle = "navigationMap = new NavigationMapView(this);"

          count = source.count(needle)

          print(
              "NavigationMapView initialization count:",
              count
          )

          if count != 2:
              raise SystemExit(
                  "Expected exactly 2 NavigationMapView initializations "
                  "in the original baseline, found "
                  + str(count)
              )

          print(
              "Redundant NavigationMapView initialization detected."
          )
          PY

      - name: Clean redundant Dashboard code
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          source = path.read_text(encoding="utf-8")

          navigation_needle = (
              "navigationMap = new NavigationMapView(this);"
          )

          navigation_positions = []
          search_from = 0

          while True:
              pos = source.find(
                  navigation_needle,
                  search_from
              )

              if pos < 0:
                  break

              navigation_positions.append(pos)
              search_from = pos + len(navigation_needle)

          if len(navigation_positions) != 2:
              raise SystemExit(
                  "Expected exactly 2 NavigationMapView initializations "
                  "before cleanup, found "
                  + str(len(navigation_positions))
              )

          second_pos = navigation_positions[1]

          line_start = source.rfind(
              "\n",
              0,
              second_pos
          ) + 1

          after_init = second_pos + len(
              navigation_needle
          )

          next_root = source.find(
              "root.addView(",
              after_init
          )

          if next_root < 0:
              raise SystemExit(
                  "The second NavigationMapView root.addView() "
                  "was not found."
              )

          next_statement_end = source.find(
              ");",
              next_root
          )

          if next_statement_end < 0:
              raise SystemExit(
                  "The second NavigationMapView root.addView() "
                  "closing statement was not found."
              )

          next_statement_end += 2

          if (
              next_statement_end < len(source)
              and source[next_statement_end] == "\n"
          ):
              next_statement_end += 1

          source = (
              source[:line_start]
              + source[next_statement_end:]
          )

          dashboard_start_marker = (
              "    private void buildDashboard() {"
          )

          dashboard_end_marker = (
              "    private void buildAppPanel() {"
          )

          dashboard_start = source.find(
              dashboard_start_marker
          )

          dashboard_end = source.find(
              dashboard_end_marker
          )

          print(
              "buildDashboard start:",
              dashboard_start
          )

          print(
              "buildAppPanel boundary:",
              dashboard_end
          )

          if dashboard_start < 0:
              raise SystemExit(
                  "buildDashboard() was not found."
              )

          if dashboard_end < 0:
              raise SystemExit(
                  "buildAppPanel() boundary was not found."
              )

          if dashboard_end <= dashboard_start:
              raise SystemExit(
                  "Invalid buildDashboard() method boundaries."
              )

          source = (
              source[:dashboard_start]
              + source[dashboard_end:]
          )

          weight_start_marker = (
              "    private LinearLayout.LayoutParams\n"
              "            weightParams() {"
          )

          weight_start = source.find(
              weight_start_marker
          )

          if weight_start < 0:
              raise SystemExit(
                  "weightParams() was not found."
              )

          brace_start = source.find(
              "{",
              weight_start
          )

          if brace_start < 0:
              raise SystemExit(
                  "weightParams() opening brace was not found."
              )

          depth = 0
          end = None

          for i in range(
              brace_start,
              len(source)
          ):
              char = source[i]

              if char == "{":
                  depth += 1

              elif char == "}":
                  depth -= 1

                  if depth == 0:
                      end = i + 1
                      break

          if end is None:
              raise SystemExit(
                  "Could not determine end of weightParams()."
              )

          if (
              end < len(source)
              and source[end] == "\n"
          ):
              end += 1

          source = (
              source[:weight_start]
              + source[end:]
          )

          path.write_text(
              source,
              encoding="utf-8"
          )

          print("Cleanup completed successfully.")
          PY

      - name: Verify cleanup
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          source = path.read_text(
              encoding="utf-8"
          )

          navigation_count = source.count(
              "navigationMap = new NavigationMapView(this);"
          )

          print(
              "NavigationMapView initialization count after cleanup:",
              navigation_count
          )

          if navigation_count != 1:
              raise SystemExit(
                  "NavigationMapView initialization count is not exactly 1."
              )

          if (
              "private void buildDashboard()" in source
          ):
              raise SystemExit(
                  "Legacy buildDashboard() still exists."
              )

          if (
              "weightParams()" in source
          ):
              raise SystemExit(
                  "weightParams() still exists."
              )

          required = [
              "private NavigationMapView navigationMap;",
              "private FrameLayout projectionLayer;",
              "private LinearLayout launcherLayer;",
              "private LinearLayout appPanel;",
              "private LinearLayout dock;",
              "private void buildAppPanel()",
              "private void rebuildAppGrid(",
              "private void loadApps()",
              "private void rebuildDock()",
              "private LinearLayout appTile(",
              "private void attachProjection()",
              "private void launchProjection(",
              "private void returnToLauncher()",
              "private void showApps()",
              "private void hideApps()",
              "private void createFloatingTouchKey()",
              "private void showFloatingMenu()",
              "private void addFloatingMenuButton(",
              "private void hideFloatingMenu()",
              "private String initial(",
          ]

          for item in required:
              if item not in source:
                  raise SystemExit(
                      "Required source element missing: "
                      + item
                  )

          print(
              "Modern V10 UI / Projection structure preserved."
          )

          print(
              "Cleanup verification PASSED."
          )
          PY

      - name: Verify Navigation core
        shell: bash
        run: |
          set -e

          NAV="app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          test -f "$NAV"

          grep -q "class NavigationMapView" "$NAV"
          grep -q "recenter()" "$NAV"
          grep -q "onHostResume()" "$NAV"
          grep -q "onHostPause()" "$NAV"
          grep -q "onHostDestroy()" "$NAV"

          echo "NavigationMapView core verification passed."

      - name: Verify protected core unchanged
        shell: bash
        run: |
          set -e

          sha256sum \
            app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java \
            > /tmp/carassistant-protected/core-after.sha256

          diff -u \
            /tmp/carassistant-protected/core.sha256 \
            /tmp/carassistant-protected/core-after.sha256

          echo "Projection/Persistence core is byte-identical."

      - name: Verify Floating Touch unchanged
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path(
              "app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          source = path.read_text(
              encoding="utf-8"
          )

          start_marker = (
              "    private void createFloatingTouchKey() {"
          )

          end_marker = (
              "private void showFloatingMenu() {"
          )

          start = source.find(
              start_marker
          )

          end = source.find(
              end_marker
          )

          print(
              "Floating Touch start index after cleanup:",
              start
          )

          print(
              "Floating Touch end index after cleanup:",
              end
          )

          if start < 0:
              raise SystemExit(
                  "createFloatingTouchKey() was not found after cleanup."
              )

          if end < 0:
              raise SystemExit(
                  "showFloatingMenu() was not found after cleanup."
              )

          if end <= start:
              raise SystemExit(
                  "Invalid Floating Touch boundaries after cleanup."
              )

          block = source[start:end]

          digest = hashlib.sha256(
              block.encode("utf-8")
          ).hexdigest()

          expected = Path(
              "/tmp/carassistant-protected/floating.sha256"
          ).read_text(
              encoding="utf-8"
          ).strip()

          print(
              "Floating Touch SHA256 before:",
              expected
          )

          print(
              "Floating Touch SHA256 after:",
              digest
          )

          if digest != expected:
              raise SystemExit(
                  "Floating Touch block changed."
              )

          print(
              "Floating Touch is byte-identical."
          )
          PY

      - name: Show source diff
        shell: bash
        run: |
          set -e

          git status --short

          git diff -- \
            app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

      - name: Git diff check
        shell: bash
        run: |
          set -e

          git diff --check

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x ./gradlew

      - name: Compile Java
        shell: bash
        run: |
          set -e

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace

      - name: Assemble Release APK
        shell: bash
        run: |
          set -e

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          echo "APK:"
          ls -lh "$APK"

          echo "SHA256:"
          sha256sum "$APK"

      - name: Upload clean baseline APK
        uses: actions/upload-artifact@v4
        with:
          name: main-clean-navigation-v2-baseline
          path: v10-source/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
