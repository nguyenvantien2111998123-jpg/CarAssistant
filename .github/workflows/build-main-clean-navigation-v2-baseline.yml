name: Clean Navigation V2 Baseline

on:
  workflow_dispatch:

jobs:
  clean-build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT EXACT MAIN BASELINE
      # ============================================================

      - name: Checkout exact main baseline
        uses: actions/checkout@v4
        with:
          ref: 09b2c919b946164618b79283b7c3293c586547a8
          fetch-depth: 0

      # ============================================================
      # 2. VERIFY EXACT COMMIT
      # ============================================================

      - name: Verify exact commit
        run: |
          set -e

          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="09b2c919b946164618b79283b7c3293c586547a8"

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          test "$ACTUAL" = "$EXPECTED"

      # ============================================================
      # 3. VERIFY REQUIRED SOURCE STRUCTURE
      # ============================================================

      - name: Verify required source structure
        run: |
          set -e

          test -f app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java
          test -f app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java
          test -f app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java
          test -f app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java
          test -f app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java
          test -f app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java
          test -f app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java

          echo "Required source files exist."

      # ============================================================
      # 4. SAVE PROTECTED CORE CHECKSUMS
      # ============================================================

      - name: Save protected core checksums
        run: |
          set -e

          mkdir -p /tmp/carassistant-protected

          sha256sum \
            app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java \
            > /tmp/carassistant-protected/core.sha256

          echo "Protected Projection/Persistence core checksums:"
          cat /tmp/carassistant-protected/core.sha256

      # ============================================================
      # 5. SAVE FLOATING TOUCH CHECKSUM
      # ============================================================

      - name: Save Floating Touch checksum
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path(
              "app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          source = path.read_text(encoding="utf-8")

          start_marker = "    private void createFloatingTouchKey() {"
          end_marker = "private void showFloatingMenu() {"

          start = source.find(start_marker)
          end = source.find(end_marker)

          print("Floating Touch start index:", start)
          print("Floating Touch end index:", end)

          if start < 0:
              raise SystemExit("createFloatingTouchKey() was not found.")

          if end < 0:
              raise SystemExit("showFloatingMenu() was not found.")

          if end <= start:
              raise SystemExit(
                  "Invalid Floating Touch method boundaries."
              )

          block = source[start:end]

          digest = hashlib.sha256(
              block.encode("utf-8")
          ).hexdigest()

          Path(
              "/tmp/carassistant-protected/floating.sha256"
          ).write_text(
              digest + "\n",
              encoding="utf-8"
          )

          print("Floating Touch SHA256:", digest)
          PY

      # ============================================================
      # 6. INSPECT NAVIGATION MAP INITIALIZATION
      # ============================================================

      - name: Inspect NavigationMap initialization
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          source = path.read_text(encoding="utf-8")

          needle = "navigationMap = new NavigationMapView(this);"
          count = source.count(needle)

          print("NavigationMapView initialization count:", count)

          if count != 2:
              raise SystemExit(
                  "Expected exactly 2 NavigationMapView initializations "
                  "in the original baseline, found " + str(count)
              )

          print("Redundant NavigationMapView initialization detected.")
          PY

      # ============================================================
      # 7. CLEAN REDUNDANT DASHBOARD CODE
      # ============================================================

      - name: Clean redundant Dashboard code
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          source = path.read_text(encoding="utf-8")

          navigation_needle = "navigationMap = new NavigationMapView(this);"

          navigation_positions = []
          search_from = 0

          while True:
              pos = source.find(
                  navigation_needle,
                  search_from
              )

              if pos < 0:
                  break

              navigation_positions.append(pos)
              search_from = pos + len(navigation_needle)

          if len(navigation_positions) != 2:
              raise SystemExit(
                  "Expected exactly 2 NavigationMapView initializations, found "
                  + str(len(navigation_positions))
              )

          first = navigation_positions[0]
          second = navigation_positions[1]

          second_line_end = source.find("\n", second)

          if second_line_end < 0:
              raise SystemExit(
                  "Could not find end of redundant NavigationMapView line."
              )

          second_line_end += 1

          root_add_marker = (
              "root.addView(\n"
              "                navigationMap,\n"
              "                new FrameLayout.LayoutParams(-1, -1));\n"
          )

          root_add_pos = source.find(
              root_add_marker,
              second_line_end
          )

          if root_add_pos < 0:
              raise SystemExit(
                  "Could not find redundant NavigationMapView root.addView block."
              )

          root_add_end = root_add_pos + len(root_add_marker)

          source = (
              source[:second]
              + source[second_line_end:root_add_pos]
              + source[root_add_end:]
          )

          dashboard_start = source.find(
              "    private void buildDashboard() {"
          )

          dashboard_end = source.find(
              "    private void buildAppPanel() {",
              dashboard_start
          )

          print("buildDashboard start:", dashboard_start)
          print("buildAppPanel boundary:", dashboard_end)

          if dashboard_start < 0:
              raise SystemExit(
                  "buildDashboard() method was not found."
              )

          if dashboard_end < 0:
              raise SystemExit(
                  "buildAppPanel() boundary was not found."
              )

          source = (
              source[:dashboard_start]
              + source[dashboard_end:]
          )

          call = "        buildDashboard();\n"
          call_count = source.count(call)

          print(
              "buildDashboard() call count before removal:",
              call_count
          )

          if call_count != 1:
              raise SystemExit(
                  "Expected exactly 1 buildDashboard(); call, found "
                  + str(call_count)
              )

          source = source.replace(
              call,
              "",
              1
          )

          if "buildDashboard();" in source:
              raise SystemExit(
                  "buildDashboard(); call still exists."
              )

          weight_start = source.find(
              "    private LinearLayout.LayoutParams weightParams("
          )

          weight_end = source.find(
              "    private String initial(",
              weight_start
          )

          if weight_start < 0:
              raise SystemExit(
                  "weightParams() method was not found."
              )

          if weight_end < 0:
              raise SystemExit(
                  "initial() boundary was not found."
              )

          source = (
              source[:weight_start]
              + source[weight_end:]
          )

          path.write_text(
              source,
              encoding="utf-8"
          )

          print(
              "Cleanup completed successfully."
          )
          print(
              "Removed redundant NavigationMapView."
          )
          print(
              "Removed legacy buildDashboard()."
          )
          print(
              "Removed legacy buildDashboard(); call."
          )
          print(
              "Removed legacy weightParams()."
          )
          PY

      # ============================================================
      # 8. VERIFY CLEANUP
      # ============================================================

      - name: Verify cleanup
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          source = path.read_text(encoding="utf-8")

          navigation_count = source.count(
              "navigationMap = new NavigationMapView(this);"
          )

          print(
              "NavigationMapView initialization count after cleanup:",
              navigation_count
          )

          if navigation_count != 1:
              raise SystemExit(
                  "NavigationMapView initialization count "
                  "is not exactly 1."
              )

          if "private void buildDashboard()" in source:
              raise SystemExit(
                  "Legacy buildDashboard() still exists."
              )

          if "buildDashboard();" in source:
              raise SystemExit(
                  "Legacy buildDashboard(); call still exists."
              )

          if "weightParams()" in source:
              raise SystemExit(
                  "weightParams() still exists."
              )

          required = [
              "private NavigationMapView navigationMap;",
              "private FrameLayout projectionLayer;",
              "private LinearLayout launcherLayer;",
              "private LinearLayout appPanel;",
              "private LinearLayout dock;",
              "private void buildAppPanel()",
              "private void rebuildAppGrid(",
              "private void loadApps()",
              "private void rebuildDock()",
              "private LinearLayout appTile(",
              "private void attachProjection()",
              "private void launchProjection(",
              "private void returnToLauncher()",
              "private void showApps()",
              "private void hideApps()",
              "private void createFloatingTouchKey()",
              "private void showFloatingMenu()",
              "private void addFloatingMenuButton(",
              "private void hideFloatingMenu()",
              "private String initial(",
          ]

          for item in required:
              if item not in source:
                  raise SystemExit(
                      "Required source element missing: "
                      + item
                  )

          print(
              "Modern V10 UI / Projection structure preserved."
          )

          print(
              "Cleanup verification PASSED."
          )
          PY

      # ============================================================
      # 9. VERIFY NAVIGATION CORE
      # ============================================================

      - name: Verify Navigation core
        run: |
          set -e

          NAV="app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          test -f "$NAV"

          grep -q "class NavigationMapView" "$NAV"
          grep -q "recenter()" "$NAV"
          grep -q "onHostResume()" "$NAV"
          grep -q "onHostPause()" "$NAV"
          grep -q "onHostDestroy()" "$NAV"

          echo "NavigationMapView core verification passed."

      # ============================================================
      # 10. VERIFY PROTECTED CORE UNCHANGED
      # ============================================================

      - name: Verify protected core unchanged
        run: |
          set -e

          sha256sum \
            app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java \
            > /tmp/carassistant-protected/core-after.sha256

          diff -u \
            /tmp/carassistant-protected/core.sha256 \
            /tmp/carassistant-protected/core-after.sha256

          echo "Projection/Persistence core is byte-identical."

      # ============================================================
      # 11. VERIFY FLOATING TOUCH UNCHANGED
      # ============================================================

      - name: Verify Floating Touch unchanged
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path(
              "app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          source = path.read_text(encoding="utf-8")

          start_marker = "    private void createFloatingTouchKey() {"
          end_marker = "private void showFloatingMenu() {"

          start = source.find(start_marker)
          end = source.find(end_marker)

          print(
              "Floating Touch start index after cleanup:",
              start
          )

          print(
              "Floating Touch end index after cleanup:",
              end
          )

          if start < 0:
              raise SystemExit(
                  "createFloatingTouchKey() was not found after cleanup."
              )

          if end < 0:
              raise SystemExit(
                  "showFloatingMenu() was not found after cleanup."
              )

          if end <= start:
              raise SystemExit(
                  "Invalid Floating Touch boundaries after cleanup."
              )

          block = source[start:end]

          digest = hashlib.sha256(
              block.encode("utf-8")
          ).hexdigest()

          expected = Path(
              "/tmp/carassistant-protected/floating.sha256"
          ).read_text(
              encoding="utf-8"
          ).strip()

          print(
              "Floating Touch SHA256 before:",
              expected
          )

          print(
              "Floating Touch SHA256 after:",
              digest
          )

          if digest != expected:
              raise SystemExit(
                  "Floating Touch block changed."
              )

          print(
              "Floating Touch is byte-identical."
          )
          PY

      # ============================================================
      # 12. SHOW SOURCE DIFF
      # ============================================================

      - name: Show source diff
        run: |
          set -e

          git status --short

          git diff -- \
            app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

      # ============================================================
      # 13. GIT DIFF CHECK
      # ============================================================

      - name: Git diff check
        run: |
          set -e

          git diff --check

          echo "Git diff check PASSED."

      # ============================================================
      # 14. SETUP JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 15. SETUP ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      # ============================================================
      # 16. ACCEPT ANDROID SDK LICENSES
      # ============================================================

      - name: Accept Android SDK licenses
        run: |
          set -e

          yes | sdkmanager --licenses > /dev/null || true

          echo "Android SDK licenses accepted."

      # ============================================================
      # 17. MAKE GRADLE EXECUTABLE
      # ============================================================

      - name: Make Gradle executable
        run: |
          set -e

          chmod +x v10-source/gradlew

          echo "Gradle executable permission set."

      # ============================================================
      # 18. COMPILE JAVA
      # ============================================================

      - name: Compile Java
        working-directory: v10-source
        run: |
          set -e

          ./gradlew :app:compileReleaseJavaWithJavac \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 19. PATCH ONLY aasdk-legacy.dex DUPLICATE MERGE
      #
      # IMPORTANT:
      # - Không sửa Java.
      # - Không sửa Navigation.
      # - Không sửa Projection Core.
      # - Không R8.
      # - Không re-dex aasdk-legacy.dex.
      # - Giữ nguyên bytecode gốc của aasdk-legacy.dex.
      #
      # Lỗi cũ:
      # D8 merge app dex + aasdk-legacy.dex
      # -> duplicate androidx.core.app.RemoteActionCompatParcelizer
      #
      # Cách sửa:
      # giữ app dex do AGP tạo,
      # sau đó đặt nguyên file aasdk-legacy.dex vào output
      # dưới dạng một classesN.dex riêng.
      # ============================================================

      - name: Patch aasdk legacy dex merge
        working-directory: v10-source
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          source = path.read_text(encoding="utf-8")

          marker_start = "tasks.matching { it.name == 'mergeDexRelease' }.configureEach { task ->"
          marker_end = "tasks.register('distRelease', Copy) {"

          start = source.find(marker_start)
          end = source.find(marker_end, start)

          if start < 0:
              raise SystemExit(
                  "mergeDexRelease block was not found."
              )

          if end < 0:
              raise SystemExit(
                  "distRelease boundary was not found."
              )

          old_block = source[start:end]

          expected_fragments = [
              "libs/aasdk-legacy.dex",
              "mergeDexRelease",
              "project.exec",
              "d8Tool",
              "mergedDexes",
          ]

          for fragment in expected_fragments:
              if fragment not in old_block:
                  raise SystemExit(
                      "Expected fragment missing from original "
                      "mergeDexRelease block: " + fragment
                  )

          new_block = r'''tasks.matching { it.name == 'mergeDexRelease' }.configureEach { task ->
    task.doLast {
        def legacyDex = rootProject.file('app/libs/aasdk-legacy.dex')
        if (!legacyDex.exists()) {
            throw new GradleException("Thiếu app/libs/aasdk-legacy.dex!")
        }

        def outputDir = task.outputDir.get().asFile
        def dexFilter = { it.isFile() && it.name ==~ /classes\d*\.dex/ } as FileFilter
        def appDexes = outputDir.listFiles(dexFilter)?.toList() ?: []

        if (appDexes.isEmpty()) {
            throw new GradleException(
                    "Không tìm thấy classes*.dex trong " + outputDir
            )
        }

        /*
         * KHÔNG đưa aasdk-legacy.dex vào D8 merge.
         *
         * aasdk-legacy.dex phải được giữ nguyên bytecode gốc.
         * D8 merge với app dex gây duplicate:
         *
         * androidx.core.app.RemoteActionCompatParcelizer
         *
         * Vì Android runtime có thể nạp nhiều dex ở minSdk 29,
         * giữ legacy SDK thành một dex riêng sẽ tránh việc D8
         * phân tích/merge lại legacy dex.
         */

        int nextIndex = 1
        File target

        while (true) {
            String name = nextIndex == 1
                    ? "classes.dex"
                    : "classes${nextIndex}.dex"

            target = new File(outputDir, name)

            if (!target.exists()) {
                break
            }

            nextIndex++
        }

        target.bytes = legacyDex.bytes

        if (target.length() != legacyDex.length()) {
            throw new GradleException(
                    "Copy aasdk-legacy.dex thất bại: kích thước không khớp."
            )
        }

        println(
                "Added raw aasdk-legacy.dex as " +
                target.name +
                " without D8 reprocessing."
        )

        println(
                "Legacy dex size: " +
                legacyDex.length() +
                " bytes."
        )
    }
}

'''

          source = (
              source[:start]
              + new_block
              + source[end:]
          )

          path.write_text(
              source,
              encoding="utf-8"
          )

          verify = path.read_text(encoding="utf-8")

          if "project.exec {" in verify:
              raise SystemExit(
                  "Old D8 project.exec merge block still exists."
              )

          if "mergedDexes" in verify:
              raise SystemExit(
                  "Old mergedDexes logic still exists."
              )

          if "d8Tool" in verify:
              raise SystemExit(
                  "Old d8Tool merge logic still exists."
              )

          if "tasks.matching { it.name == 'mergeDexRelease' }" not in verify:
              raise SystemExit(
                  "Patched mergeDexRelease block is missing."
              )

          if "target.bytes = legacyDex.bytes" not in verify:
              raise SystemExit(
                  "Raw legacy dex copy logic is missing."
              )

          print(
              "aasdk-legacy.dex duplicate merge patch applied successfully."
          )
          print(
              "Legacy dex remains raw and is not re-dexed."
          )
          PY

      # ============================================================
      # 20. ASSEMBLE RELEASE APK
      # ============================================================

      - name: Assemble Release APK
        working-directory: v10-source
        run: |
          set -e

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 21. VERIFY APK
      # ============================================================

      - name: Verify APK
        working-directory: v10-source
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          echo "APK exists:"
          ls -lh "$APK"

          echo "APK SHA256:"
          sha256sum "$APK"

      # ============================================================
      # 22. UPLOAD APK
      # ============================================================

      - name: Upload clean baseline APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-Clean-Navigation-V2-Baseline
          path: v10-source/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
