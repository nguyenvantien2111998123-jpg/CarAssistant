name: Build Main Clean Navigation V2 Baseline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: v10-source

    steps:
      - name: Checkout exact main baseline
        uses: actions/checkout@v4
        with:
          ref: 09b2c919b946164618b79283b7c3293c586547a8
          fetch-depth: 0

      - name: Verify exact commit
        shell: bash
        run: |
          set -e
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="09b2c919b946164618b79283b7c3293c586547a8"

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          test "$ACTUAL" = "$EXPECTED"

      - name: Verify required source structure
        shell: bash
        run: |
          set -e

          test -f app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java
          test -f app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java
          test -f app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java
          test -f app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java
          test -f app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java
          test -f app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java
          test -f app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java

          echo "Required source files exist."

      - name: Save protected core checksums
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/carassistant-protected

          sha256sum \
            app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java \
            > /tmp/carassistant-protected/core.sha256

          echo "Protected Projection/Persistence core checksums:"
          cat /tmp/carassistant-protected/core.sha256

      - name: Save Floating Touch checksum
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          p = Path("app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java")
          s = p.read_text(encoding="utf-8")

          start_marker = "    private void createFloatingTouchKey() {"
          end_marker = "    private void showFloatingMenu() {"

          start = s.find(start_marker)
          end = s.find(end_marker)

          if start < 0:
              raise SystemExit("createFloatingTouchKey() not found")

          if end < 0:
              raise SystemExit("showFloatingMenu() not found")

          if end <= start:
              raise SystemExit("Invalid Floating Touch boundaries")

          block = s[start:end]
          digest = hashlib.sha256(block.encode("utf-8")).hexdigest()

          Path("/tmp/carassistant-protected/floating.sha256").write_text(
              digest + "\n",
              encoding="utf-8"
          )

          print("Floating Touch SHA256:", digest)
          PY

      - name: Inspect NavigationMap initialization
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java")
          s = p.read_text(encoding="utf-8")

          needle = "navigationMap = new NavigationMapView(this);"
          count = s.count(needle)

          print("NavigationMapView initialization count:", count)

          if count < 2:
              raise SystemExit(
                  "Expected the current main baseline to contain the redundant "
                  "NavigationMapView initialization."
              )

          print("Redundant NavigationMapView initialization detected.")
          PY

      - name: Clean redundant Dashboard code
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          p = Path("app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java")
          s = p.read_text(encoding="utf-8")

          # ------------------------------------------------------------
          # 1. Remove ONLY the second NavigationMapView initialization.
          # ------------------------------------------------------------

          navigation_block = """\
          navigationMap = new NavigationMapView(this);
          root.addView(
                  navigationMap,
                  new FrameLayout.LayoutParams(-1, -1));
          """

          first = s.find(navigation_block)
          if first < 0:
              raise SystemExit(
                  "First NavigationMapView initialization block not found."
              )

          second = s.find(
              navigation_block,
              first + len(navigation_block)
          )

          if second < 0:
              raise SystemExit(
                  "Second NavigationMapView initialization block not found."
              )

          s = s[:second] + s[second + len(navigation_block):]

          # ------------------------------------------------------------
          # 2. Remove only the legacy buildDashboard() method.
          #    Other UI/projection methods remain untouched.
          # ------------------------------------------------------------

          dashboard = textwrap.dedent(
              """\
              private void buildDashboard() {

                  dashboard =
                          new LinearLayout(this);
                  dashboard.setOrientation(LinearLayout.VERTICAL);
                  dashboard.setPadding(
                          dp(16),
                          dp(16),
                          dp(16),
                          dp(16));

                  TextView title =
                          new TextView(this);
                  title.setText("CAR ASSISTANT");
                  title.setTextSize(24);
                  title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  dashboard.addView(title);

                  date =
                          new TextView(this);
                  dashboard.addView(date);

                  clock =
                          new TextView(this);
                  dashboard.addView(clock);

                  LinearLayout mapRow =
                          new LinearLayout(this);
                  mapRow.setOrientation(LinearLayout.HORIZONTAL);

                  mapRow.addView(
                          card("MAP", "Navigation"),
                          weightParams());

                  mapRow.addView(
                          infoCard("SPEED", "0 km/h"),
                          weightParams());

                  dashboard.addView(mapRow);

                  LinearLayout infoRow =
                          new LinearLayout(this);
                  infoRow.setOrientation(LinearLayout.HORIZONTAL);

                  infoRow.addView(
                          infoCard("WEATHER", "--"),
                          weightParams());

                  infoRow.addView(
                          infoCard("MEDIA", "Idle"),
                          weightParams());

                  dashboard.addView(infoRow);

                  dock =
                          new LinearLayout(this);
                  dock.setOrientation(LinearLayout.HORIZONTAL);
                  dock.setGravity(Gravity.CENTER_VERTICAL);

                  Button apps =
                          buttonText("APPS");

                  apps.setOnClickListener(
                          v -> showApps());

                  dock.addView(
                          apps,
                          weightParams());

                  dashboard.addView(dock);
              }
              """
          )

          start = s.find(dashboard)
          if start < 0:
              raise SystemExit(
                  "Legacy buildDashboard() block not found."
              )

          end = start + len(dashboard)

          s = s[:start] + s[end:]

          # ------------------------------------------------------------
          # 3. Remove only weightParams(), which is now unused after
          #    removing the legacy Dashboard.
          # ------------------------------------------------------------

          weight_method = textwrap.dedent(
              """\
              private LinearLayout.LayoutParams weightParams() {
                  return new LinearLayout.LayoutParams(
                          0,
                          -2,
                          1f);
              }
              """
          )

          weight_start = s.find(weight_method)

          if weight_start >= 0:
              weight_end = weight_start + len(weight_method)
              s = s[:weight_start] + s[weight_end:]

          p.write_text(s, encoding="utf-8")

          print("Cleanup completed.")
          PY

      - name: Verify cleanup
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java")
          s = p.read_text(encoding="utf-8")

          navigation_needle = "navigationMap = new NavigationMapView(this);"
          navigation_count = s.count(navigation_needle)

          print(
              "NavigationMapView initialization count after cleanup:",
              navigation_count
          )

          if navigation_count != 1:
              raise SystemExit(
                  "NavigationMapView initialization count must be exactly 1."
              )

          if "private void buildDashboard()" in s:
              raise SystemExit(
                  "Legacy buildDashboard() still exists."
              )

          if "private LinearLayout.LayoutParams weightParams()" in s:
              raise SystemExit(
                  "Legacy weightParams() still exists."
              )

          # Required modern Navigation/UI pieces must still exist.
          required = [
              "private NavigationMapView navigationMap;",
              "private FrameLayout projectionLayer;",
              "private LinearLayout launcherLayer;",
              "private LinearLayout appPanel;",
              "private LinearLayout dock;",
              "private void buildAppPanel()",
              "private void rebuildAppGrid()",
              "private void loadApps()",
              "private void rebuildDock()",
              "private void appTile(",
              "private void attachProjection()",
              "private void launchProjection(",
              "private void returnToLauncher()",
              "private void showApps()",
              "private void hideApps()",
              "private void createFloatingTouchKey()",
              "private void showFloatingMenu()",
              "private void hideFloatingMenu()",
              "private void initial(",
          ]

          for item in required:
              if item not in s:
                  raise SystemExit(
                      f"Required source element missing: {item}"
                  )

          print("Cleanup verification passed.")
          PY

      - name: Verify Navigation core
        shell: bash
        run: |
          set -e

          NAV="app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          test -f "$NAV"

          grep -q "class NavigationMapView" "$NAV"
          grep -q "recenter()" "$NAV"
          grep -q "onHostResume()" "$NAV"
          grep -q "onHostPause()" "$NAV"
          grep -q "onHostDestroy()" "$NAV"

          echo "NavigationMapView core verification passed."

      - name: Verify protected core unchanged
        shell: bash
        run: |
          set -e

          sha256sum \
            app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10DisplayController.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10SurfaceManager.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10TaskSession.java \
            app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java \
            > /tmp/carassistant-protected/core-after.sha256

          diff -u \
            /tmp/carassistant-protected/core.sha256 \
            /tmp/carassistant-protected/core-after.sha256

          echo "Projection/Persistence core is byte-identical."

      - name: Verify Floating Touch unchanged
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          p = Path("app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java")
          s = p.read_text(encoding="utf-8")

          start_marker = "    private void createFloatingTouchKey() {"
          end_marker = "    private void showFloatingMenu() {"

          start = s.find(start_marker)
          end = s.find(end_marker)

          if start < 0:
              raise SystemExit("createFloatingTouchKey() not found after cleanup")

          if end < 0:
              raise SystemExit("showFloatingMenu() not found after cleanup")

          if end <= start:
              raise SystemExit("Invalid Floating Touch boundaries")

          block = s[start:end]
          digest = hashlib.sha256(block.encode("utf-8")).hexdigest()

          expected = Path(
              "/tmp/carassistant-protected/floating.sha256"
          ).read_text(
              encoding="utf-8"
          ).strip()

          print("Before:", expected)
          print("After: ", digest)

          if digest != expected:
              raise SystemExit(
                  "Floating Touch block changed."
              )

          print("Floating Touch is byte-identical.")
          PY

      - name: Show source diff
        shell: bash
        run: |
          set -e

          git status --short
          git diff -- app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

      - name: Git diff check
        shell: bash
        run: |
          set -e
          git diff --check

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x ./gradlew

      - name: Compile Java
        shell: bash
        run: |
          set -e

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace

      - name: Assemble Release APK
        shell: bash
        run: |
          set -e

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          echo "APK:"
          ls -lh "$APK"

          echo "SHA256:"
          sha256sum "$APK"

      - name: Upload clean baseline APK
        uses: actions/upload-artifact@v4
        with:
          name: main-clean-navigation-v2-baseline
          path: v10-source/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
