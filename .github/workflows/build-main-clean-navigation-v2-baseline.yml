name: CarAssistant - Clean Main Navigation V2 Baseline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-main:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout exact Main baseline
        uses: actions/checkout@v4
        with:
          ref: 09b2c919b946164618b79283b7c3293c586547a8
          fetch-depth: 0

      - name: Verify exact commit
        shell: bash
        run: |
          set -e

          EXPECTED="09b2c919b946164618b79283b7c3293c586547a8"
          ACTUAL="$(git rev-parse HEAD)"

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          test "$ACTUAL" = "$EXPECTED"

          echo "Exact Main baseline verified."

      - name: Verify required source structure
        shell: bash
        run: |
          set -e

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          test -f "$BASE/V10CarActivity.java"
          test -f "$BASE/NavigationMapView.java"

          test -f "$BASE/V10ProjectionSession.java"
          test -f "$BASE/V10DisplayController.java"
          test -f "$BASE/V10SurfaceManager.java"
          test -f "$BASE/V10TaskSession.java"
          test -f "$BASE/V10SessionStore.java"

          test -f "v10-source/app/build.gradle"

          echo "Required source structure PASS."

      - name: Save protected core checksums
        shell: bash
        run: |
          set -e

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          mkdir -p /tmp/protected-before

          sha256sum \
            "$BASE/V10ProjectionSession.java" \
            "$BASE/V10DisplayController.java" \
            "$BASE/V10SurfaceManager.java" \
            "$BASE/V10TaskSession.java" \
            "$BASE/V10SessionStore.java" \
            > /tmp/protected-before/checksums.txt

          echo "Protected core checksums saved."

      - name: Save Floating Touch checksum
        shell: bash
        run: |
          set -e

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 <<'PY'
          from pathlib import Path
          import hashlib

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          text = path.read_text()

          start_marker = "    private void createFloatingTouchKey() {"
          end_marker = "private void showFloatingMenu() {"

          start = text.find(start_marker)
          end = text.find(end_marker, start)

          if start == -1:
              raise SystemExit("Floating Touch start marker not found")

          if end == -1:
              raise SystemExit("Floating Touch end marker not found")

          block = text[start:end]

          if "createFloatingTouchKey()" not in block:
              raise SystemExit("createFloatingTouchKey missing")

          if "floatingDownTime" not in block:
              raise SystemExit("floatingDownTime missing")

          if 'addFloatingMenuButton("BACK"' not in text:
              raise SystemExit("BACK floating button missing")

          if 'addFloatingMenuButton("HOME"' not in text:
              raise SystemExit("HOME floating button missing")

          digest = hashlib.sha256(
              block.encode("utf-8")
          ).hexdigest()

          Path("/tmp/floating-touch-before.sha256").write_text(
              digest + "\n"
          )

          print("Floating Touch SHA256:", digest)
          print("Floating Touch checksum saved.")
          PY

      - name: Clean redundant Dashboard code
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          text = path.read_text()

          # ============================================================
          # 1. Remove duplicate NavigationMapView initialization.
          #
          # Do NOT search for a hard-coded "duplicate block".
          #
          # Count the real Java initialization statement and remove
          # only the SECOND occurrence.
          # ============================================================

          nav_line = "navigationMap = new NavigationMapView(this);"

          nav_count = text.count(nav_line)

          print("NavigationMapView initialization count BEFORE:", nav_count)

          if nav_count != 2:
              raise SystemExit(
                  "Expected exactly 2 NavigationMapView initializations "
                  f"at baseline, found {nav_count}"
              )

          first_pos = text.find(nav_line)
          second_pos = text.find(
              nav_line,
              first_pos + len(nav_line)
          )

          if first_pos == -1 or second_pos == -1:
              raise SystemExit(
                  "Could not locate both NavigationMapView initializations"
              )

          # Remove only the second initialization statement.
          text = (
              text[:second_pos]
              + text[second_pos + len(nav_line):]
          )

          # Remove the immediately associated root.addView(
          # block belonging to the second NavigationMapView.
          #
          # At the exact baseline source this is:
          #
          # root.addView(
          #         navigationMap,
          #         new FrameLayout.LayoutParams(-1, -1));
          #
          add_pattern = re.compile(
              r'\nroot\.addView\(\s*'
              r'navigationMap,\s*'
              r'new FrameLayout\.LayoutParams\(-1, -1\)\);\s*'
          )

          add_matches = list(add_pattern.finditer(text))

          if len(add_matches) != 2:
              raise SystemExit(
                  "Expected exactly 2 real navigationMap root.addView "
                  f"blocks after locating initializations, found {len(add_matches)}"
              )

          # The first addView belongs to the first navigation map.
          # Remove the second one.
          second_add = add_matches[1]

          text = (
              text[:second_add.start()]
              + "\n"
              + text[second_add.end():]
          )

          # ============================================================
          # 2. Remove old clock/date fields.
          # ============================================================

          text = text.replace(
              "    private TextView clock;\n"
              "    private TextView date;\n"
              "\n",
              ""
          )

          # ============================================================
          # 3. Remove obsolete imports.
          # ============================================================

          text = text.replace(
              "import android.graphics.Typeface;\n",
              ""
          )

          text = text.replace(
              "import java.text.SimpleDateFormat;\n",
              ""
          )

          text = text.replace(
              "import java.util.Date;\n",
              ""
          )

          # ============================================================
          # 4. Remove clockTicker Runnable using real method marker.
          # ============================================================

          start = text.find(
              "    private final Runnable clockTicker ="
          )

          end = text.find(
              "    private final Runnable targetPoller =",
              start
          )

          if start == -1 or end == -1:
              raise SystemExit(
                  "clockTicker boundaries not found"
              )

          text = text[:start] + text[end:]

          # ============================================================
          # 5. Remove clockTicker calls.
          # ============================================================

          text = re.sub(
              r'\n\s*handler\.removeCallbacks\(\s*clockTicker\);\s*\n',
              "\n",
              text
          )

          text = re.sub(
              r'\n\s*handler\.post\(clockTicker\);\s*\n',
              "\n",
              text
          )

          # ============================================================
          # 6. Replace buildDashboard() using the REAL source markers.
          #
          # Exact baseline structure:
          #
          # buildDashboard()
          #     ...
          # buildAppPanel()
          #
          # Keep dashboard/dock/APPS/showApps behavior.
          # Remove legacy CAR ASSISTANT / MAP / SPEED / WEATHER / MEDIA.
          # ============================================================

          start = text.find(
              "    private void buildDashboard() {"
          )

          end = text.find(
              "    private void buildAppPanel() {",
              start
          )

          if start == -1:
              raise SystemExit(
                  "buildDashboard start marker not found"
              )

          if end == -1:
              raise SystemExit(
                  "buildAppPanel marker not found after buildDashboard"
              )

          dashboard = """\
    private void buildDashboard() {

        dashboard =
                new LinearLayout(this);

        dashboard.setOrientation(
                LinearLayout.VERTICAL);

        launcherLayer.addView(
                dashboard,
                new LinearLayout.LayoutParams(
                        -1,
                        -1));

        LinearLayout dockRow =
                new LinearLayout(this);

        dockRow.setGravity(
                Gravity.CENTER_VERTICAL);

        dock =
                new LinearLayout(this);

        dock.setGravity(
                Gravity.CENTER_VERTICAL);

        dockRow.addView(
                dock,
                new LinearLayout.LayoutParams(
                        0,
                        -1,
                        1));

        TextView appsButton =
                buttonText("APPS");

        appsButton.setOnClickListener(
                v -> showApps());

        dockRow.addView(
                appsButton,
                new LinearLayout.LayoutParams(
                        dp(90),
                        dp(58)));

        dashboard.addView(
                dockRow,
                new LinearLayout.LayoutParams(
                        -1,
                        dp(70)));
    }

"""

          text = text[:start] + dashboard + text[end:]

          # ============================================================
          # 7. Remove updateClock() using real source markers.
          # ============================================================

          start = text.find(
              "    private void updateClock() {"
          )

          end = text.find(
              "    private LinearLayout card() {",
              start
          )

          if start == -1:
              raise SystemExit(
                  "updateClock start marker not found"
              )

          if end == -1:
              raise SystemExit(
                  "card() marker not found after updateClock"
              )

          text = text[:start] + text[end:]

          # ============================================================
          # 8. Remove card() and infoCard().
          #
          # Both are inside the block ending immediately before
          # buttonText().
          # ============================================================

          start = text.find(
              "    private LinearLayout card() {"
          )

          end = text.find(
              "    private TextView buttonText(",
              start
          )

          if start == -1:
              raise SystemExit(
                  "card() marker not found"
              )

          if end == -1:
              raise SystemExit(
                  "buttonText() marker not found after card()"
              )

          text = text[:start] + text[end:]

          # ============================================================
          # 9. Remove weightParams().
          #
          # Keep initial(), because appTile() still uses initial().
          # ============================================================

          start = text.find(
              "    private LinearLayout.LayoutParams\n"
              "            weightParams() {"
          )

          if start != -1:

              end = text.find(
                  "    private String initial(",
                  start
              )

              if end == -1:
                  raise SystemExit(
                      "initial() marker not found after weightParams()"
                  )

              text = text[:start] + text[end:]

          path.write_text(text)

          # ============================================================
          # 10. Final real initialization count.
          # ============================================================

          final_count = text.count(
              "navigationMap = new NavigationMapView(this);"
          )

          print(
              "NavigationMapView initialization count AFTER:",
              final_count
          )

          if final_count != 1:
              raise SystemExit(
                  "NavigationMapView cleanup failed: "
                  f"expected 1, found {final_count}"
              )

          print("Dashboard cleanup completed successfully.")
          PY

      - name: Verify cleanup
        shell: bash
        run: |
          set -e

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          NAV_COUNT="$(grep -o "navigationMap = new NavigationMapView(this);" "$FILE" | wc -l | tr -d ' ')"

          echo "Final NavigationMapView initialization count: $NAV_COUNT"

          test "$NAV_COUNT" = "1"

          # Legacy Dashboard content must be gone.
          ! grep -q 'CAR ASSISTANT' "$FILE"
          ! grep -q '"MAP"' "$FILE"
          ! grep -q '"SPEED"' "$FILE"
          ! grep -q '"WEATHER"' "$FILE"
          ! grep -q '"MEDIA"' "$FILE"

          # Obsolete helpers/infrastructure must be gone.
          ! grep -q 'infoCard(' "$FILE"
          ! grep -q 'weightParams(' "$FILE"
          ! grep -q 'clockTicker' "$FILE"
          ! grep -q 'updateClock' "$FILE"
          ! grep -q 'Typeface' "$FILE"
          ! grep -q 'SimpleDateFormat' "$FILE"

          # initial() MUST remain because appTile() uses it.
          grep -q 'private String initial(' "$FILE"
          grep -q 'initial(app.name)' "$FILE"

          echo "Cleanup verification PASS."

      - name: Verify Navigation core remains
        shell: bash
        run: |
          set -e

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          grep -q "class NavigationMapView" "$FILE"
          grep -q "MapLibre" "$FILE"
          grep -q "recenter()" "$FILE"
          grep -q "onHostResume()" "$FILE"
          grep -q "onHostPause()" "$FILE"
          grep -q "onHostDestroy()" "$FILE"

          echo "Navigation core preserved."

      - name: Verify protected core unchanged
        shell: bash
        run: |
          set -e

          BASE="v10-source/app/src/main/java/com/hieptran/aacast/doudou"

          sha256sum \
            "$BASE/V10ProjectionSession.java" \
            "$BASE/V10DisplayController.java" \
            "$BASE/V10SurfaceManager.java" \
            "$BASE/V10TaskSession.java" \
            "$BASE/V10SessionStore.java" \
            > /tmp/protected-after.txt

          diff -u \
            /tmp/protected-before/checksums.txt \
            /tmp/protected-after.txt

          echo "Projection/Persistence protected core unchanged."

      - name: Verify Floating Touch unchanged
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import hashlib

          path = Path(
              "v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"
          )

          text = path.read_text()

          start_marker = "    private void createFloatingTouchKey() {"
          end_marker = "private void showFloatingMenu() {"

          start = text.find(start_marker)
          end = text.find(end_marker, start)

          if start == -1:
              raise SystemExit(
                  "Floating Touch start marker not found after cleanup"
              )

          if end == -1:
              raise SystemExit(
                  "Floating Touch end marker not found after cleanup"
              )

          block = text[start:end]

          digest = hashlib.sha256(
              block.encode("utf-8")
          ).hexdigest()

          before = Path(
              "/tmp/floating-touch-before.sha256"
          ).read_text().strip()

          print("Floating Touch BEFORE:", before)
          print("Floating Touch AFTER: ", digest)

          if digest != before:
              raise SystemExit(
                  "Floating Touch changed during cleanup"
              )

          print("Floating Touch unchanged.")
          PY

      - name: Show diff
        shell: bash
        run: |
          git diff -- \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

      - name: Git diff check
        shell: bash
        run: |
          set -e

          git diff --check

          echo "git diff --check PASS."

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Compile
        working-directory: v10-source
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            :app:compileDebugJavaWithJavac \
            --no-daemon \
            --stacktrace

      - name: Assemble APK
        working-directory: v10-source
        shell: bash
        run: |
          set -e

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="v10-source/app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          echo "APK exists:"
          ls -lh "$APK"

          echo "APK SHA256:"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: main-clean-navigation-v2-baseline
          path: v10-source/app/build/outputs/apk/release/app-release.apk
