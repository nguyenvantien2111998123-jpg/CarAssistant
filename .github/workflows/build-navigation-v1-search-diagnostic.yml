name: CarAssistant Navigation V1 - Search Nominatim Runtime Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout current main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify diagnostic baseline
        shell: bash
        run: |
          set -euo pipefail

          SRC="v10-source"
          FILE="$SRC/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          test -f "$FILE"

          grep -Fq "class NavigationMapView" "$FILE"
          grep -Fq "searchNominatim" "$FILE"
          grep -Fq "https://nominatim.openstreetmap.org/search" "$FILE"
          grep -Fq "MapLibre.getInstance" "$FILE"
          grep -Fq "https://tiles.openfreemap.org/styles/liberty" "$FILE"
          grep -Fq "VOICE_SILENCE_TIMEOUT_MS" "$FILE"

          echo "PASS: NavigationMapView baseline verified."
          echo "PASS: MapLibre source present."
          echo "PASS: OpenFreeMap source present."
          echo "PASS: Voice V3.2 source present."
          echo "PASS: Nominatim search source present."

      - name: Patch ONLY searchNominatim for runtime diagnostic
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "v10-source/app/src/main/java/"
              "com/hieptran/aacast/doudou/NavigationMapView.java"
          )

          text = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r'    private void searchNominatim\(\s*'
              r'String query\) \{.*?'
              r'\n    private void postSearchResults\(',
              re.S
          )

          replacement_lines = [
              '    private void searchNominatim(',
              '            String query) {',
              '',
              '        HttpURLConnection connection = null;',
              '',
              '        String stage = "START";',
              '        String host = "nominatim.openstreetmap.org";',
              '',
              '        try {',
              '',
              '            /*',
              '             * =====================================================',
              '             * DIAGNOSTIC 1 — DNS HOST',
              '             * =====================================================',
              '             */',
              '            stage = "DNS";',
              '',
              '            java.net.InetAddress address =',
              '                    java.net.InetAddress.getByName(host);',
              '',
              '            String resolvedAddress =',
              '                    address.getHostAddress();',
              '',
              '            Log.d(',
              '                    "CarAssistant-Nominatim",',
              '                    "DNS OK host="',
              '                            + host',
              '                            + " address="',
              '                            + resolvedAddress);',
              '',
              '            /*',
              '             * =====================================================',
              '             * DIAGNOSTIC 2 — CREATE URL',
              '             * =====================================================',
              '             */',
              '            stage = "URL";',
              '',
              '            String encoded =',
              '                    URLEncoder.encode(',
              '                            query,',
              '                            "UTF-8");',
              '',
              '            URL url =',
              '                    new URL(',
              '                            "https://nominatim.openstreetmap.org/search"',
              '                                    + "?format=jsonv2"',
              '                                    + "&limit=5"',
              '                                    + "&accept-language=vi"',
              '                                    + "&q="',
              '                                    + encoded);',
              '',
              '            Log.d(',
              '                    "CarAssistant-Nominatim",',
              '                    "URL OK "',
              '                            + url.toString());',
              '',
              '            /*',
              '             * =====================================================',
              '             * DIAGNOSTIC 3 — CONNECT',
              '             * =====================================================',
              '             */',
              '            stage = "CONNECT";',
              '',
              '            connection =',
              '                    (HttpURLConnection)',
              '                            url.openConnection();',
              '',
              '            connection.setRequestMethod(',
              '                    "GET");',
              '',
              '            connection.setConnectTimeout(',
              '                    8000);',
              '',
              '            connection.setReadTimeout(',
              '                    10000);',
              '',
              '            connection.setUseCaches(false);',
              '',
              '            connection.setRequestProperty(',
              '                    "User-Agent",',
              '                    "CarAssistant-NavigationV3/1.0");',
              '',
              '            connection.setRequestProperty(',
              '                    "Accept",',
              '                    "application/json");',
              '',
              '            connection.setRequestProperty(',
              '                    "Accept-Language",',
              '                    "vi-VN,vi;q=0.9");',
              '',
              '            Log.d(',
              '                    "CarAssistant-Nominatim",',
              '                    "CONNECT starting");',
              '',
              '            connection.connect();',
              '',
              '            Log.d(',
              '                    "CarAssistant-Nominatim",',
              '                    "CONNECT OK");',
              '',
              '            /*',
              '             * =====================================================',
              '             * DIAGNOSTIC 4 — HTTP RESPONSE',
              '             * =====================================================',
              '             */',
              '            stage = "HTTP";',
              '',
              '            int code =',
              '                    connection.getResponseCode();',
              '',
              '            String responseMessage =',
              '                    connection.getResponseMessage();',
              '',
              '            Log.d(',
              '                    "CarAssistant-Nominatim",',
              '                    "HTTP response="',
              '                            + code',
              '                            + " message="',
              '                            + responseMessage);',
              '',
              '            if (code !=',
              '                    HttpURLConnection.HTTP_OK) {',
              '',
              '                InputStream errorStream =',
              '                        connection.getErrorStream();',
              '',
              '                StringBuilder errorBody =',
              '                        new StringBuilder();',
              '',
              '                if (errorStream != null) {',
              '',
              '                    BufferedReader errorReader =',
              '                            new BufferedReader(',
              '                                    new InputStreamReader(',
              '                                            errorStream,',
              '                                            "UTF-8"));',
              '',
              '                    String errorLine;',
              '',
              '                    while ((errorLine =',
              '                            errorReader.readLine()) != null) {',
              '',
              '                        errorBody.append(',
              '                                errorLine);',
              '                    }',
              '',
              '                    errorReader.close();',
              '                }',
              '',
              '                String diagnostic =',
              '                        "NOMINATIM DIAGNOSTIC\n"',
              '                                + "DNS: OK "',
              '                                + resolvedAddress',
              '                                + "\n"',
              '                                + "URL: OK\n"',
              '                                + "CONNECT: OK\n"',
              '                                + "HTTP: "',
              '                                + code',
              '                                + " "',
              '                                + responseMessage',
              '                                + "\n"',
              '                                + "BODY: "',
              '                                + errorBody.toString();',
              '',
              '                Log.e(',
              '                        "CarAssistant-Nominatim",',
              '                        diagnostic);',
              '',
              '                postSearchMessage(',
              '                        diagnostic);',
              '',
              '                return;',
              '            }',
              '',
              '            /*',
              '             * =====================================================',
              '             * HTTP 200 — READ RESPONSE',
              '             * =====================================================',
              '             */',
              '            stage = "READ";',
              '',
              '            InputStream input =',
              '                    connection.getInputStream();',
              '',
              '            BufferedReader reader =',
              '                    new BufferedReader(',
              '                            new InputStreamReader(',
              '                                    input,',
              '                                    "UTF-8"));',
              '',
              '            StringBuilder body =',
              '                    new StringBuilder();',
              '',
              '            String line;',
              '',
              '            while ((line =',
              '                    reader.readLine()) != null) {',
              '',
              '                body.append(line);',
              '            }',
              '',
              '            reader.close();',
              '',
              '            Log.d(',
              '                    "CarAssistant-Nominatim",',
              '                    "HTTP 200 bodyLength="',
              '                            + body.length());',
              '',
              '            /*',
              '             * =====================================================',
              '             * EXISTING JSON PARSING',
              '             * GIỮ NGUYÊN LOGIC V3.2',
              '             * =====================================================',
              '             */',
              '            JSONArray array =',
              '                    new JSONArray(',
              '                            body.toString());',
              '',
              '            ArrayList<SearchResult> results =',
              '                    new ArrayList<>();',
              '',
              '            for (int i = 0;',
              '                 i < array.length() && i < 5;',
              '                 i++) {',
              '',
              '                JSONObject item =',
              '                        array.getJSONObject(i);',
              '',
              '                String latText =',
              '                        item.optString(',
              '                                "lat",',
              '                                "");',
              '',
              '                String lonText =',
              '                        item.optString(',
              '                                "lon",',
              '                                "");',
              '',
              '                String name =',
              '                        item.optString(',
              '                                "display_name",',
              '                                "Địa điểm");',
              '',
              '                if (latText.isEmpty()',
              '                        || lonText.isEmpty()) {',
              '',
              '                    continue;',
              '                }',
              '',
              '                try {',
              '',
              '                    double lat =',
              '                            Double.parseDouble(',
              '                                    latText);',
              '',
              '                    double lon =',
              '                            Double.parseDouble(',
              '                                    lonText);',
              '',
              '                    results.add(',
              '                            new SearchResult(',
              '                                    name,',
              '                                    lat,',
              '                                    lon));',
              '',
              '                } catch (',
              '                        NumberFormatException ignored) {',
              '                }',
              '            }',
              '',
              '            Log.d(',
              '                    "CarAssistant-Nominatim",',
              '                    "SEARCH OK results="',
              '                            + results.size());',
              '',
              '            postSearchResults(',
              '                    results);',
              '',
              '        } catch (Exception e) {',
              '',
              '            String exceptionClass =',
              '                    e.getClass()',
              '                            .getSimpleName();',
              '',
              '            String exceptionMessage =',
              '                    e.getMessage();',
              '',
              '            if (exceptionMessage == null',
              '                    || exceptionMessage.trim().isEmpty()) {',
              '',
              '                exceptionMessage =',
              '                        "(no message)";',
              '            }',
              '',
              '            String diagnostic =',
              '                    "NOMINATIM DIAGNOSTIC\n"',
              '                            + "STAGE: "',
              '                            + stage',
              '                            + "\n"',
              '                            + "HOST: "',
              '                            + host',
              '                            + "\n"',
              '                            + "EXCEPTION: "',
              '                            + exceptionClass',
              '                            + "\n"',
              '                            + "MESSAGE: "',
              '                            + exceptionMessage;',
              '',
              '            Log.e(',
              '                    "CarAssistant-Nominatim",',
              '                    diagnostic,',
              '                    e);',
              '',
              '            postSearchMessage(',
              '                    diagnostic);',
              '',
              '        } finally {',
              '',
              '            if (connection != null) {',
              '                connection.disconnect();',
              '            }',
              '        }',
              '    }',
              '',
              '    private void postSearchResults('
          ]

          replacement = "\n".join(replacement_lines)

          matches = list(pattern.finditer(text))

          if len(matches) != 1:
              raise SystemExit(
                  f"ERROR: Expected exactly 1 searchNominatim method, found {len(matches)}"
              )

          new_text = pattern.sub(replacement, text, count=1)

          if new_text == text:
              raise SystemExit(
                  "ERROR: Diagnostic patch made no change."
              )

          path.write_text(
              new_text,
              encoding="utf-8"
          )

          print("PASS: Only searchNominatim() was patched.")
          PY

      - name: Verify diagnostic patch scope
        shell: bash
        run: |
          set -euo pipefail

          FILE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java"

          grep -Fq "CarAssistant-Nominatim" "$FILE"
          grep -Fq "InetAddress.getByName" "$FILE"
          grep -Fq "connection.connect()" "$FILE"
          grep -Fq "getResponseCode()" "$FILE"
          grep -Fq "getSimpleName()" "$FILE"
          grep -Fq "getMessage()" "$FILE"

          grep -Fq "VOICE_SILENCE_TIMEOUT_MS" "$FILE"
          grep -Fq "https://tiles.openfreemap.org/styles/liberty" "$FILE"
          grep -Fq "MapLibre.getInstance" "$FILE"

          echo "PASS: DNS diagnostic present."
          echo "PASS: URL diagnostic present."
          echo "PASS: CONNECT diagnostic present."
          echo "PASS: HTTP diagnostic present."
          echo "PASS: Exception class diagnostic present."
          echo "PASS: Exception message diagnostic present."
          echo "PASS: MapLibre unchanged."
          echo "PASS: Voice V3.2 source still present."

      - name: Verify Gradle wrapper
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew
          chmod +x ./gradlew

          ./gradlew --version

          echo "PASS: Gradle wrapper."

      - name: Compile diagnostic APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            :app:compileDebugJavaWithJavac \
            --stacktrace

          echo "PASS: Diagnostic Java compile."

      - name: Assemble diagnostic APK
        working-directory: v10-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

          echo "PASS: Diagnostic APK assemble."

      - name: Package diagnostic APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find v10-source/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: Diagnostic APK not found."
            exit 1
          fi

          cp "$APK" \
            CarAssistant-Navigation-V1-Search-Diagnostic.apk

          sha256sum \
            CarAssistant-Navigation-V1-Search-Diagnostic.apk \
            > CarAssistant-Navigation-V1-Search-Diagnostic.sha256

          echo ""
          echo "========================================"
          echo "SEARCH DIAGNOSTIC APK READY"
          echo "========================================"

          ls -lh \
            CarAssistant-Navigation-V1-Search-Diagnostic.apk

          echo ""
          echo "SHA256:"
          cat \
            CarAssistant-Navigation-V1-Search-Diagnostic.sha256

          echo ""
          echo "PASS: Diagnostic APK ready."

      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-Navigation-V1-Search-Diagnostic
          path: |
            CarAssistant-Navigation-V1-Search-Diagnostic.apk
            CarAssistant-Navigation-V1-Search-Diagnostic.sha256
          if-no-files-found: error
          retention-days: 14
