name: Build Car Assistant V10.2-A2.1 Gearhead Control Bar V4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail

          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle-8.13-bin.zip -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"

      # ------------------------------------------------------------
      # 1. Verify current V10 source
      # ------------------------------------------------------------

      - name: Verify V10 source
        shell: bash
        run: |
          set -euo pipefail

          test -d v10-source
          test -f v10-source/settings.gradle
          test -f v10-source/app/build.gradle
          test -f v10-source/app/src/main/AndroidManifest.xml

          echo "V10 source exists."

      # ------------------------------------------------------------
      # 2. Normalize package only
      # ------------------------------------------------------------

      - name: Normalize V10 package
        shell: bash
        run: |
          set -euo pipefail

          find v10-source \
            -type f \
            \( \
              -name '*.java' \
              -o -name '*.xml' \
              -o -name '*.gradle' \
              -o -name '*.gradle.kts' \
            \) \
            -print0 |
          xargs -0 sed -i \
            -e 's/com\.carassistant\.v9/com.carassistant.v10/g' \
            -e 's/Car Assistant V9/Car Assistant V10/g' \
            -e 's/AACast V9/AACast V10/g'

      # ------------------------------------------------------------
      # 3. Remove obsolete V9 activity files
      # ------------------------------------------------------------

      - name: Remove obsolete V9 activities
        shell: bash
        run: |
          set -euo pipefail

          JAVA="v10-source/app/src/main/java"

          find "$JAVA" \
            -type f \
            \( \
              -name 'MainActivity.java' \
              -o -name 'AACastCarActivity.java' \
              -o -name 'LeaseTicker.java' \
            \) \
            -delete

          OLD_FILES="$(
            find "$JAVA" \
              -type f \
              \( \
                -name 'MainActivity.java' \
                -o -name 'AACastCarActivity.java' \
                -o -name 'LeaseTicker.java' \
              \)
          )"

          if [ -n "$OLD_FILES" ]; then
            echo "ERROR: obsolete V9 files remain:"
            echo "$OLD_FILES"
            exit 1
          fi

          echo "Obsolete V9 files removed."

      # ------------------------------------------------------------
      # 4. Write V10SessionStore
      #
      # Preserve existing target persistence and add only the
      # currently-running CarActivity reference.
      # ------------------------------------------------------------

      - name: Write V10SessionStore
        shell: bash
        run: |
          set -euo pipefail

          STORE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10SessionStore.java"

          mkdir -p "$(dirname "$STORE")"

          python3 - "$STORE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          source = r'''
          package com.carassistant.v10;

          import android.content.ComponentName;
          import android.content.Context;
          import android.content.SharedPreferences;

          public final class V10SessionStore {

              private static final String PREFS =
                      "v10_session";

              private static final String TARGET =
                      "target_component";

              private static volatile V10CarActivity currentActivity;

              private V10SessionStore() {
              }

              private static SharedPreferences prefs(
                      Context context) {

                  return context.getSharedPreferences(
                          PREFS,
                          Context.MODE_PRIVATE);
              }

              public static void setTarget(
                      Context context,
                      ComponentName component) {

                  SharedPreferences.Editor editor =
                          prefs(context).edit();

                  if (component == null) {
                      editor.remove(TARGET);
                  } else {
                      editor.putString(
                              TARGET,
                              component.flattenToString());
                  }

                  editor.apply();
              }

              public static ComponentName getTarget(
                      Context context) {

                  String value =
                          prefs(context).getString(
                                  TARGET,
                                  null);

                  if (value == null ||
                          value.isEmpty()) {
                      return null;
                  }

                  return ComponentName.unflattenFromString(
                          value);
              }

              public static void clearTarget(
                      Context context) {

                  prefs(context)
                          .edit()
                          .remove(TARGET)
                          .apply();
              }

              public static void setCurrentActivity(
                      V10CarActivity activity) {

                  currentActivity = activity;
              }

              public static V10CarActivity getCurrentActivity() {

                  return currentActivity;
              }

              public static void clearCurrentActivity(
                      V10CarActivity activity) {

                  if (currentActivity == activity) {
                      currentActivity = null;
                  }
              }
          }
          '''

          path.write_text(
              source.strip() + "\n",
              encoding="utf-8"
          )

          print("V10SessionStore written.")
          PY

      # ------------------------------------------------------------
      # 5. Patch V10CarActivity
      #
      # Only add:
      # - current activity registration
      # - Back control
      # - safe Home control
      #
      # We deliberately DO NOT invent recents/apps projection APIs.
      # ------------------------------------------------------------

      - name: Patch V10CarActivity
        shell: bash
        run: |
          set -euo pipefail

          ACTIVITY="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java"

          python3 - "$ACTIVITY" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          # Register activity immediately after super.onCreate(...)
          if "V10SessionStore.setCurrentActivity(this);" not in text:

              needle = """        super.onCreate(state);
"""

              replacement = """        super.onCreate(state);

        V10SessionStore.setCurrentActivity(this);
"""

              if needle not in text:
                  raise SystemExit(
                      "ERROR: V10CarActivity onCreate marker not found"
                  )

              text = text.replace(
                  needle,
                  replacement,
                  1
              )

          # Clear activity reference before destruction.
          if "V10SessionStore.clearCurrentActivity(this);" not in text:

              needle = """        super.onDestroy();
"""

              replacement = """        V10SessionStore.clearCurrentActivity(this);

        super.onDestroy();
"""

              if needle not in text:
                  raise SystemExit(
                      "ERROR: V10CarActivity onDestroy marker not found"
                  )

              text = text.replace(
                  needle,
                  replacement,
                  1
              )

          # Add only methods supported by the actual current
          # V10ProjectionSession.
          if "public void handleControlBack()" not in text:

              marker = """
}
"""

              methods = r'''
    public void handleControlBack() {

        if (session != null
                && session.isActive()) {

            session.back();
        }
    }

    public void handleControlHome() {

        if (session != null) {
            session.release();
        }
    }

    public void handleControlRecents() {
        // Reserved for the next control-session implementation.
    }

    public void handleControlApps() {
        // Reserved for the next launcher/control implementation.
    }
'''

              pos = text.rfind(marker)

              if pos < 0:
                  raise SystemExit(
                      "ERROR: V10CarActivity closing brace not found"
                  )

              text = (
                  text[:pos]
                  + "\n"
                  + methods
                  + text[pos:]
              )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print("V10CarActivity patched safely.")
          PY

      # ------------------------------------------------------------
      # 6. Write deterministic BroadcastReceiver
      # ------------------------------------------------------------

      - name: Write V10ControlReceiver
        shell: bash
        run: |
          set -euo pipefail

          RECEIVER="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ControlReceiver.java"

          mkdir -p "$(dirname "$RECEIVER")"

          python3 - "$RECEIVER" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          source = r'''
          package com.carassistant.v10;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public final class V10ControlReceiver
                  extends BroadcastReceiver {

              public static final String ACTION =
                      "com.carassistant.v10.CONTROL";

              public static final String EXTRA_COMMAND =
                      "command";

              @Override
              public void onReceive(
                      Context context,
                      Intent intent) {

                  if (intent == null) {
                      return;
                  }

                  if (!ACTION.equals(
                          intent.getAction())) {
                      return;
                  }

                  String command =
                          intent.getStringExtra(
                                  EXTRA_COMMAND);

                  if (command == null) {
                      return;
                  }

                  command =
                          command.trim()
                                  .toLowerCase();

                  V10CarActivity activity =
                          V10SessionStore
                                  .getCurrentActivity();

                  if (activity == null) {
                      return;
                  }

                  switch (command) {

                      case "back":
                          activity.handleControlBack();
                          break;

                      case "home":
                          activity.handleControlHome();
                          break;

                      case "recents":
                          activity.handleControlRecents();
                          break;

                      case "apps":
                          activity.handleControlApps();
                          break;

                      default:
                          break;
                  }
              }
          }
          '''

          path.write_text(
              source.strip() + "\n",
              encoding="utf-8"
          )

          print("V10ControlReceiver written.")
          PY

      # ------------------------------------------------------------
      # 7. Write GearheadControlBar
      # ------------------------------------------------------------

      - name: Write GearheadControlBar
        shell: bash
        run: |
          set -euo pipefail

          BAR="v10-source/app/src/main/java/com/hieptran/aacast/doudou/hook/GearheadControlBar.java"

          mkdir -p "$(dirname "$BAR")"

          python3 - "$BAR" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          source = r'''
          package com.carassistant.v10.hook;

          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.util.Collections;
          import java.util.IdentityHashMap;
          import java.util.Set;

          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedBridge;
          import de.robv.android.xposed.XposedHelpers;

          public final class GearheadControlBar {

              private static final String TAG =
                      "[V10 ControlBar]";

              private static final String GEARHEAD =
                      "com.google.android.projection.gearhead";

              private static final String ACTION =
                      "com.carassistant.v10.CONTROL";

              private static final String SELF =
                      "com.carassistant.v10";

              private static final Set<ViewGroup> INSTALLED =
                      Collections.newSetFromMap(
                              new IdentityHashMap<ViewGroup, Boolean>());

              private static final String[] DOCK_NAMES = {
                      "nav_bar_container",
                      "car_navigation_bar",
                      "dock_container",
                      "nav_bar",
                      "floating_nav_bar_view",
                      "navigation_bar_container",
                      "navigation_bar",
                      "bottom_navigation_bar",
                      "system_navigation_bar",
                      "navbar",
                      "car_sys_ui_navbar"
              };

              private GearheadControlBar() {
              }

              public static void install() {

                  try {

                      Class<?> wmg =
                              XposedHelpers.findClass(
                                      "android.view.WindowManagerGlobal",
                                      null);

                      XposedBridge.hookAllMethods(
                              wmg,
                              "addView",
                              new XC_MethodHook() {

                                  @Override
                                  protected void afterHookedMethod(
                                          MethodHookParam param) {

                                      if (param.args.length == 0) {
                                          return;
                                      }

                                      Object value =
                                              param.args[0];

                                      if (!(value instanceof View)) {
                                          return;
                                      }

                                      final View root =
                                              (View) value;

                                      root.post(
                                              new Runnable() {
                                                  @Override
                                                  public void run() {
                                                      scanRoot(root);
                                                  }
                                              });
                                  }
                              });

                      scanExistingRoots();

                      XposedBridge.log(
                              TAG
                              + " Gearhead dock hook installed");

                  } catch (Throwable t) {

                      XposedBridge.log(
                              TAG
                              + " install failed: "
                              + t);
                  }
              }

              private static void scanExistingRoots() {

                  try {

                      Class<?> cls =
                              XposedHelpers.findClass(
                                      "android.view.WindowManagerGlobal",
                                      null);

                      Object global =
                              XposedHelpers.callStaticMethod(
                                      cls,
                                      "getInstance");

                      String[] names =
                              (String[])
                                      XposedHelpers.callMethod(
                                              global,
                                              "getViewRootNames");

                      if (names == null) {
                          return;
                      }

                      for (String name : names) {

                          try {

                              Object root =
                                      XposedHelpers.callMethod(
                                              global,
                                              "getRootView",
                                              name);

                              if (!(root instanceof View)) {
                                  continue;
                              }

                              final View view =
                                      (View) root;

                              view.post(
                                      new Runnable() {
                                          @Override
                                          public void run() {
                                              scanRoot(view);
                                          }
                                      });

                          } catch (Throwable ignored) {
                          }
                      }

                  } catch (Throwable t) {

                      XposedBridge.log(
                              TAG
                              + " root scan failed: "
                              + t);
                  }
              }

              private static void scanRoot(View root) {

                  try {

                      if (!root.isAttachedToWindow()) {
                          return;
                      }

                      if (root.getDisplay() == null) {
                          return;
                      }

                      if (root.getDisplay().getDisplayId() <= 0) {
                          return;
                      }

                      if (!(root instanceof ViewGroup)) {
                          return;
                      }

                      ViewGroup dock =
                              findDockContainer(
                                      (ViewGroup) root,
                                      1500);

                      if (dock == null) {
                          return;
                      }

                      if (INSTALLED.contains(dock)) {
                          return;
                      }

                      installBar(dock);

                  } catch (Throwable t) {

                      XposedBridge.log(
                              TAG
                              + " scan failed: "
                              + t);
                  }
              }

              private static ViewGroup findDockContainer(
                      ViewGroup group,
                      int budget) {

                  if (budget <= 0) {
                      return null;
                  }

                  String name =
                          resourceEntryName(group);

                  if (name != null
                          && isDockName(name)) {

                      return group;
                  }

                  int nextBudget =
                          budget - 1;

                  for (int i = 0;
                          i < group.getChildCount();
                          i++) {

                      View child =
                              group.getChildAt(i);

                      if (!(child instanceof ViewGroup)) {
                          continue;
                      }

                      ViewGroup found =
                              findDockContainer(
                                      (ViewGroup) child,
                                      nextBudget);

                      if (found != null) {
                          return found;
                      }
                  }

                  return null;
              }

              private static String resourceEntryName(
                      View view) {

                  if (view.getId() == View.NO_ID) {
                      return null;
                  }

                  try {

                      String packageName =
                              view.getResources()
                                      .getResourcePackageName(
                                              view.getId());

                      if (!GEARHEAD.equals(
                              packageName)) {
                          return null;
                      }

                      return view.getResources()
                              .getResourceEntryName(
                                      view.getId());

                  } catch (Throwable ignored) {

                      return null;
                  }
              }

              private static boolean isDockName(
                      String name) {

                  for (String candidate :
                          DOCK_NAMES) {

                      if (candidate.equals(name)) {
                          return true;
                      }
                  }

                  return false;
              }

              private static void installBar(
                      ViewGroup dock) {

                  LinearLayout bar =
                          new LinearLayout(
                                  dock.getContext());

                  bar.setOrientation(
                          LinearLayout.HORIZONTAL);

                  bar.setGravity(
                          Gravity.CENTER_VERTICAL);

                  bar.setPadding(
                          4,
                          2,
                          4,
                          2);

                  bar.setBackgroundColor(
                          0xDD202124);

                  addButton(
                          bar,
                          "←",
                          "back");

                  addButton(
                          bar,
                          "⌂",
                          "home");

                  addButton(
                          bar,
                          "▣",
                          "recents");

                  addButton(
                          bar,
                          "Apps",
                          "apps");

                  dock.addView(
                          bar,
                          new ViewGroup.LayoutParams(
                                  ViewGroup.LayoutParams.WRAP_CONTENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT));

                  bar.bringToFront();

                  INSTALLED.add(dock);

                  XposedBridge.log(
                          TAG
                          + " installed in "
                          + resourceEntryName(dock));
              }

              private static void addButton(
                      LinearLayout parent,
                      String label,
                      String command) {

                  TextView button =
                          new TextView(
                                  parent.getContext());

                  button.setText(label);

                  button.setTextColor(
                          Color.WHITE);

                  button.setTextSize(
                          "Apps".equals(label)
                                  ? 13
                                  : 20);

                  button.setGravity(
                          Gravity.CENTER);

                  button.setPadding(
                          18,
                          0,
                          18,
                          0);

                  button.setClickable(true);

                  button.setFocusable(true);

                  button.setOnClickListener(
                          new View.OnClickListener() {

                              @Override
                              public void onClick(
                                      View v) {

                                  sendCommand(
                                          parent.getContext(),
                                          command);
                              }
                          });

                  parent.addView(
                          button,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.WRAP_CONTENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT));
              }

              private static void sendCommand(
                      Context context,
                      String command) {

                  try {

                      Intent intent =
                              new Intent(ACTION);

                      intent.setPackage(SELF);

                      intent.putExtra(
                              "command",
                              command);

                      context.sendBroadcast(
                              intent);

                      XposedBridge.log(
                              TAG
                              + " command="
                              + command);

                  } catch (Throwable t) {

                      XposedBridge.log(
                              TAG
                              + " broadcast failed: "
                              + t);
                  }
              }
          }
          '''

          path.write_text(
              source.strip() + "\n",
              encoding="utf-8"
          )

          print("GearheadControlBar written.")
          PY

      # ------------------------------------------------------------
      # 8. Patch Xposed bridge
      #
      # CRITICAL:
      # Preserve existing GearheadDockPatcher.
      # Add GearheadControlBar.install().
      # ------------------------------------------------------------

      - name: Patch AACastBridge
        shell: bash
        run: |
          set -euo pipefail

          BRIDGE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/aabridge/AACastBridge.java"

          test -f "$BRIDGE"

          python3 - "$BRIDGE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          # Add import without destroying existing hooks.
          if "import com.carassistant.v10.hook.GearheadControlBar;" not in text:

              needle = "import com.carassistant.v10.hook.GearheadAllow;\n"

              if needle not in text:
                  raise SystemExit(
                      "ERROR: GearheadAllow import not found"
                  )

              text = text.replace(
                  needle,
                  needle
                  + "import com.carassistant.v10.hook.GearheadControlBar;\n",
                  1
              )

          # Install both existing dock patcher and new control bar.
          if "GearheadControlBar.install();" not in text:

              needle = "GearheadDockPatcher.install();"

              if needle not in text:
                  raise SystemExit(
                      "ERROR: GearheadDockPatcher.install() not found"
                  )

              text = text.replace(
                  needle,
                  needle
                  + "\n                GearheadControlBar.install();",
                  1
              )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print("AACastBridge patched.")
          PY

      # ------------------------------------------------------------
      # 9. Rebuild Manifest
      # ------------------------------------------------------------

      - name: Rebuild Manifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          # Remove only V10 components that this workflow owns.
          pattern = re.compile(
              r'\s*<(activity|receiver)\b[^>]*'
              r'android:name="'
              r'[^"]*(?:V10LauncherActivity|V10CarActivity|V10ControlReceiver)'
              r'[^"]*"'
              r'[^>]*(?:/>|>.*?</\1>)',
              re.S
          )

          text = pattern.sub("", text)

          match = re.search(
              r'(<application\b[^>]*>)',
              text,
              re.S
          )

          if not match:
              raise SystemExit(
                  "ERROR: application tag not found"
              )

          components = r'''
                  <activity
                      android:name="com.carassistant.v10.V10LauncherActivity"
                      android:exported="true">
                      <intent-filter>
                          <action
                              android:name="android.intent.action.MAIN" />
                          <category
                              android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name="com.carassistant.v10.V10CarActivity"
                      android:exported="true" />

                  <receiver
                      android:name="com.carassistant.v10.V10ControlReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action
                              android:name="com.carassistant.v10.CONTROL" />
                      </intent-filter>
                  </receiver>
          '''

          text = (
              text[:match.end()]
              + components
              + text[match.end():]
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print("Manifest rebuilt.")
          PY

      # ------------------------------------------------------------
      # 10. Validate Manifest
      # ------------------------------------------------------------

      - name: Validate Manifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]

          tree = ET.parse(path)
          root = tree.getroot()

          NAME = "{http://schemas.android.com/apk/res/android}name"
          EXPORTED = "{http://schemas.android.com/apk/res/android}exported"

          expected = {
              "com.carassistant.v10.V10LauncherActivity": "true",
              "com.carassistant.v10.V10CarActivity": "true",
              "com.carassistant.v10.V10ControlReceiver": "true",
          }

          found = {}

          for element in root.findall(".//*"):

              name = element.get(NAME)

              if name in expected:
                  found[name] = element.get(EXPORTED)

          for name, value in expected.items():

              if name not in found:
                  raise SystemExit(
                      "ERROR: missing " + name
                  )

              if found[name] != value:
                  raise SystemExit(
                      "ERROR: wrong exported value for "
                      + name
                  )

          print("Manifest verified.")
          PY

      # ------------------------------------------------------------
      # 11. Static source validation
      # ------------------------------------------------------------

      - name: Verify V10 source
        shell: bash
        run: |
          set -euo pipefail

          JAVA="v10-source/app/src/main/java"

          REQUIRED=(
            "V10LauncherActivity.java"
            "V10CarActivity.java"
            "V10ProjectionSession.java"
            "V10InputController.java"
            "V10Display.java"
            "V10SessionStore.java"
            "V10ControlReceiver.java"
            "AACastCarService.java"
            "AACastDisplay.java"
            "GearheadControlBar.java"
          )

          for file in "${REQUIRED[@]}"; do

            count="$(
              find "$JAVA" \
                -name "$file" |
              wc -l
            )"

            if [ "$count" -ne 1 ]; then
              echo "ERROR: $file count=$count"
              exit 1
            fi

          done

          if grep -R \
              'com.carassistant.v9' \
              "$JAVA" \
              2>/dev/null; then

            echo "ERROR: V9 package remains."
            exit 1
          fi

          echo "V10 source verification passed."

      # ------------------------------------------------------------
      # 12. Verify projection invariants
      # ------------------------------------------------------------

      - name: Verify projection engine
        shell: bash
        run: |
          set -euo pipefail

          SESSION="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          test -f "$SESSION"

          grep -q 'SurfaceTexture' "$SESSION"
          grep -q 'setDefaultBufferSize' "$SESSION"
          grep -q 'new Surface' "$SESSION"
          grep -q 'createVirtualDisplay' "$SESSION"
          grep -q 'V10Display.nameFor' "$SESSION"
          grep -q -- '--display' "$SESSION"
          grep -q -- '--windowingMode 1' "$SESSION"
          grep -q 'input -d' "$SESSION"

          echo "Projection engine verified."

      # ------------------------------------------------------------
      # 13. Verify swipe
      # ------------------------------------------------------------

      - name: Verify swipe input
        shell: bash
        run: |
          set -euo pipefail

          INPUT="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10InputController.java"

          test -f "$INPUT"

          grep -q 'MotionEvent.ACTION_DOWN' "$INPUT"
          grep -q 'MotionEvent.ACTION_MOVE' "$INPUT"
          grep -q 'MotionEvent.ACTION_UP' "$INPUT"
          grep -q 'session.swipe' "$INPUT"

          echo "Swipe input verified."

      # ------------------------------------------------------------
      # 14. Verify control receiver
      # ------------------------------------------------------------

      - name: Verify control receiver
        shell: bash
        run: |
          set -euo pipefail

          RECEIVER="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ControlReceiver.java"

          test -f "$RECEIVER"

          grep -q 'BroadcastReceiver' "$RECEIVER"
          grep -q 'com.carassistant.v10.CONTROL' "$RECEIVER"
          grep -q 'EXTRA_COMMAND' "$RECEIVER"

          grep -q '"back"' "$RECEIVER"
          grep -q '"home"' "$RECEIVER"
          grep -q '"recents"' "$RECEIVER"
          grep -q '"apps"' "$RECEIVER"

          echo "Control receiver verified."

      # ------------------------------------------------------------
      # 15. Verify Gearhead control bar
      # ------------------------------------------------------------

      - name: Verify Gearhead control bar
        shell: bash
        run: |
          set -euo pipefail

          BAR="v10-source/app/src/main/java/com/hieptran/aacast/doudou/hook/GearheadControlBar.java"

          test -f "$BAR"

          grep -q 'WindowManagerGlobal' "$BAR"
          grep -q 'addView' "$BAR"
          grep -q 'com.google.android.projection.gearhead' "$BAR"
          grep -q 'com.carassistant.v10.CONTROL' "$BAR"
          grep -q 'sendBroadcast' "$BAR"

          grep -q '"back"' "$BAR"
          grep -q '"home"' "$BAR"
          grep -q '"recents"' "$BAR"
          grep -q '"apps"' "$BAR"

          echo "Gearhead control bar verified."

      # ------------------------------------------------------------
      # 16. Verify Xposed bridge
      #
      # This specifically catches the error from run
      # 37056585621.
      # ------------------------------------------------------------

      - name: Verify Xposed bridge
        shell: bash
        run: |
          set -euo pipefail

          BRIDGE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/aabridge/AACastBridge.java"

          test -f "$BRIDGE"

          grep -q \
            'com.google.android.projection.gearhead' \
            "$BRIDGE"

          grep -Eq \
            'GearheadDockPatcher[[:space:]]*\.[[:space:]]*install' \
            "$BRIDGE"

          grep -Eq \
            'GearheadControlBar[[:space:]]*\.[[:space:]]*install' \
            "$BRIDGE"

          grep -Eq \
            'InputHooks[[:space:]]*\.[[:space:]]*install' \
            "$BRIDGE"

          grep -Eq \
            'DisplayHooks[[:space:]]*\.[[:space:]]*installDisplayFlags' \
            "$BRIDGE"

          grep -Eq \
            'DisplayHooks[[:space:]]*\.[[:space:]]*installInputPolicy' \
            "$BRIDGE"

          echo "Xposed bridge verified."

      # ------------------------------------------------------------
      # 17. Android 12 compatibility
      # ------------------------------------------------------------

      - name: Verify Android 12 compatibility
        shell: bash
        run: |
          set -euo pipefail

          if grep -R \
              'getSentFromUid\|getSentFromPackage' \
              v10-source/app/src/main/java \
              2>/dev/null; then

            echo "ERROR: Android 14-only BroadcastReceiver API detected."
            exit 1
          fi

          echo "Android 12 compatibility verified."

      # ------------------------------------------------------------
      # 18. Compile BEFORE anything is committed
      # ------------------------------------------------------------

      - name: Gradle clean
        shell: bash
        run: |
          set -euo pipefail

          cd v10-source

          gradle \
            clean \
            --no-daemon \
            --stacktrace

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd v10-source

          gradle \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # ------------------------------------------------------------
      # 19. Verify APK
      # ------------------------------------------------------------

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK size:"
          ls -lh "$APK"

          echo "APK SHA256:"
          sha256sum "$APK"

      # ------------------------------------------------------------
      # 20. Upload APK
      # ------------------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10.2-A2.1-V4-debug
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ------------------------------------------------------------
      # 21. Commit only after successful build
      # ------------------------------------------------------------

      - name: Commit V10.2-A2.1 source
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add v10-source

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m \
            "Build Car Assistant V10.2-A2.1 Gearhead control bar V4"

          git push
