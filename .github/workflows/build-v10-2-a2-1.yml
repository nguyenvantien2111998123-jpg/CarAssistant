name: Build Car Assistant V10.2-A2.1 Gearhead Dock Control Bar

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            https://services.gradle.org/distributions/gradle-8.13-bin.zip

          unzip -q \
            gradle-8.13-bin.zip \
            -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-8.13/bin" \
            >> "$GITHUB_PATH"

      - name: Verify existing V10 source
        shell: bash
        run: |
          set -euo pipefail

          test -d v10-source
          test -f v10-source/settings.gradle
          test -f v10-source/app/build.gradle
          test -f \
            v10-source/app/src/main/AndroidManifest.xml

          echo "V10 source exists."

      - name: Normalize V10 package
        shell: bash
        run: |
          set -euo pipefail

          find v10-source \
            -type f \
            \( \
              -name '*.java' \
              -o -name '*.xml' \
              -o -name '*.gradle' \
              -o -name '*.gradle.kts' \
            \) \
            -print0 |
          xargs -0 sed -i \
            -e 's/com\.carassistant\.v9/com.carassistant.v10/g' \
            -e 's/Car Assistant V9/Car Assistant V10/g' \
            -e 's/AACast V9/AACast V10/g'

      - name: Remove obsolete V9 files
        shell: bash
        run: |
          set -euo pipefail

          JAVA="v10-source/app/src/main/java"

          find "$JAVA" \
            -type f \
            \( \
              -name 'MainActivity.java' \
              -o -name 'AACastCarActivity.java' \
              -o -name 'LeaseTicker.java' \
            \) \
            -delete

          OLD_FILES="$(
            find "$JAVA" \
              -type f \
              \( \
                -name 'MainActivity.java' \
                -o -name 'AACastCarActivity.java' \
                -o -name 'LeaseTicker.java' \
              \)
          )"

          if [ -n "$OLD_FILES" ]; then
            echo "ERROR: obsolete V9 files remain:"
            echo "$OLD_FILES"
            exit 1
          fi

          echo "Obsolete V9 files removed."

      - name: Write GearheadControlBar
        shell: bash
        run: |
          set -euo pipefail

          BAR="v10-source/app/src/main/java/com/hieptran/aacast/doudou/hook/GearheadControlBar.java"

          mkdir -p "$(dirname "$BAR")"

          python3 - "$BAR" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          source = r'''
          package com.carassistant.v10.hook;

          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.util.Collections;
          import java.util.IdentityHashMap;
          import java.util.Set;

          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedBridge;
          import de.robv.android.xposed.XposedHelpers;

          public final class GearheadControlBar {

              private static final String TAG =
                      "[V10 ControlBar]";

              private static final String GEARHEAD =
                      "com.google.android.projection.gearhead";

              private static final String ACTION =
                      "com.carassistant.v10.CONTROL";

              private static final Set<ViewGroup> INSTALLED =
                      Collections.newSetFromMap(
                              new IdentityHashMap<ViewGroup, Boolean>());

              private static final String[] DOCK_NAMES = {
                      "nav_bar_container",
                      "car_navigation_bar",
                      "dock_container",
                      "nav_bar",
                      "floating_nav_bar_view",
                      "navigation_bar_container",
                      "navigation_bar",
                      "bottom_navigation_bar",
                      "system_navigation_bar",
                      "navbar",
                      "car_sys_ui_navbar"
              };

              private GearheadControlBar() {
              }

              public static void install() {
                  try {
                      Class<?> wmg =
                              XposedHelpers.findClass(
                                      "android.view.WindowManagerGlobal",
                                      null);

                      XposedBridge.hookAllMethods(
                              wmg,
                              "addView",
                              new XC_MethodHook() {
                                  @Override
                                  protected void afterHookedMethod(
                                          MethodHookParam param) {

                                      if (param.args.length == 0) {
                                          return;
                                      }

                                      Object value = param.args[0];

                                      if (!(value instanceof View)) {
                                          return;
                                      }

                                      final View root =
                                              (View) value;

                                      root.post(
                                              new Runnable() {
                                                  @Override
                                                  public void run() {
                                                      scanRoot(root);
                                                  }
                                              });
                                  }
                              });

                      scanExistingRoots();

                      XposedBridge.log(
                              TAG +
                              " Gearhead dock-tree hook installed");

                  } catch (Throwable t) {
                      XposedBridge.log(
                              TAG +
                              " install failed: " +
                              t);
                  }
              }

              private static void scanExistingRoots() {
                  try {
                      Class<?> cls =
                              XposedHelpers.findClass(
                                      "android.view.WindowManagerGlobal",
                                      null);

                      Object global =
                              XposedHelpers.callStaticMethod(
                                      cls,
                                      "getInstance");

                      String[] names =
                              (String[]) XposedHelpers.callMethod(
                                      global,
                                      "getViewRootNames");

                      if (names == null) {
                          return;
                      }

                      for (String name : names) {
                          try {
                              Object root =
                                      XposedHelpers.callMethod(
                                              global,
                                              "getRootView",
                                              name);

                              if (!(root instanceof View)) {
                                  continue;
                              }

                              final View view =
                                      (View) root;

                              view.post(
                                      new Runnable() {
                                          @Override
                                          public void run() {
                                              scanRoot(view);
                                          }
                                      });

                          } catch (Throwable ignored) {
                          }
                      }

                  } catch (Throwable t) {
                      XposedBridge.log(
                              TAG +
                              " existing-root scan failed: " +
                              t);
                  }
              }

              private static void scanRoot(View root) {
                  try {
                      if (!root.isAttachedToWindow()) {
                          return;
                      }

                      if (root.getDisplay() == null) {
                          return;
                      }

                      if (root.getDisplay().getDisplayId() <= 0) {
                          return;
                      }

                      if (!(root instanceof ViewGroup)) {
                          return;
                      }

                      ViewGroup dock =
                              findDockContainer(
                                      (ViewGroup) root,
                                      1500);

                      if (dock == null) {
                          return;
                      }

                      if (INSTALLED.contains(dock)) {
                          return;
                      }

                      installBar(dock);

                  } catch (Throwable t) {
                      XposedBridge.log(
                              TAG +
                              " scan failed: " +
                              t);
                  }
              }

              private static void installBar(
                      ViewGroup dock) {

                  LinearLayout bar =
                          new LinearLayout(
                                  dock.getContext());

                  bar.setOrientation(
                          LinearLayout.HORIZONTAL);

                  bar.setGravity(
                          Gravity.CENTER_VERTICAL);

                  bar.setPadding(
                          4,
                          2,
                          4,
                          2);

                  bar.setBackgroundColor(
                          0xDD202124);

                  addButton(
                          bar,
                          "←",
                          "back");

                  addButton(
                          bar,
                          "⌂",
                          "home");

                  addButton(
                          bar,
                          "▣",
                          "recents");

                  addButton(
                          bar,
                          "Apps",
                          "apps");

                  ViewGroup.LayoutParams params =
                          new ViewGroup.LayoutParams(
                                  ViewGroup.LayoutParams.WRAP_CONTENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT);

                  dock.addView(
                          bar,
                          params);

                  bar.bringToFront();

                  INSTALLED.add(dock);

                  XposedBridge.log(
                          TAG +
                          " installed in " +
                          resourceEntryName(dock));
              }

              private static ViewGroup findDockContainer(
                      ViewGroup group,
                      int budget) {

                  if (budget <= 0) {
                      return null;
                  }

                  String name =
                          resourceEntryName(group);

                  if (name != null
                          && isDockName(name)) {
                      return group;
                  }

                  int nextBudget =
                          budget - 1;

                  for (int i = 0;
                          i < group.getChildCount();
                          i++) {

                      View child =
                              group.getChildAt(i);

                      if (!(child instanceof ViewGroup)) {
                          continue;
                      }

                      ViewGroup found =
                              findDockContainer(
                                      (ViewGroup) child,
                                      nextBudget);

                      if (found != null) {
                          return found;
                      }
                  }

                  return null;
              }

              private static String resourceEntryName(
                      View view) {

                  if (view.getId() == View.NO_ID) {
                      return null;
                  }

                  try {
                      String packageName =
                              view.getResources()
                                  .getResourcePackageName(
                                          view.getId());

                      if (!GEARHEAD.equals(packageName)) {
                          return null;
                      }

                      return view.getResources()
                              .getResourceEntryName(
                                      view.getId());

                  } catch (Throwable ignored) {
                      return null;
                  }
              }

              private static boolean isDockName(
                      String name) {

                  for (String candidate : DOCK_NAMES) {
                      if (candidate.equals(name)) {
                          return true;
                      }
                  }

                  return false;
              }

              private static void addButton(
                      LinearLayout parent,
                      String label,
                      String command) {

                  TextView button =
                          new TextView(
                                  parent.getContext());

                  button.setText(label);

                  button.setTextColor(
                          Color.WHITE);

                  button.setTextSize(
                          "Apps".equals(label)
                                  ? 13
                                  : 20);

                  button.setGravity(
                          Gravity.CENTER);

                  button.setPadding(
                          18,
                          0,
                          18,
                          0);

                  button.setClickable(true);

                  button.setFocusable(true);

                  button.setOnClickListener(
                          new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
                                  sendCommand(
                                          parent.getContext(),
                                          command);
                              }
                          });

                  parent.addView(
                          button,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.WRAP_CONTENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT));
              }

              private static void sendCommand(
                      Context context,
                      String command) {

                  try {
                      Intent intent =
                              new Intent(ACTION);

                      intent.setPackage(
                              "com.carassistant.v10");

                      intent.putExtra(
                              "command",
                              command);

                      context.sendBroadcast(
                              intent);

                      XposedBridge.log(
                              TAG +
                              " command=" +
                              command);

                  } catch (Throwable t) {
                      XposedBridge.log(
                              TAG +
                              " broadcast failed: " +
                              t);
                  }
              }
          }
          '''

          path.write_text(
              source.strip() + "\n",
              encoding="utf-8"
          )

          print("GearheadControlBar written.")
          PY

      - name: Verify GearheadControlBar
        shell: bash
        run: |
          set -euo pipefail

          BAR="v10-source/app/src/main/java/com/hieptran/aacast/doudou/hook/GearheadControlBar.java"

          test -f "$BAR"

          grep -q 'WindowManagerGlobal' "$BAR"
          grep -q 'getViewRootNames' "$BAR"
          grep -q 'getRootView' "$BAR"
          grep -q 'resourceEntryName' "$BAR"
          grep -q 'com.google.android.projection.gearhead' "$BAR"

          grep -q 'nav_bar_container' "$BAR"
          grep -q 'car_navigation_bar' "$BAR"
          grep -q 'dock_container' "$BAR"
          grep -q 'floating_nav_bar_view' "$BAR"
          grep -q 'navigation_bar_container' "$BAR"

          grep -q '"back"' "$BAR"
          grep -q '"home"' "$BAR"
          grep -q '"recents"' "$BAR"
          grep -q '"apps"' "$BAR"

          grep -q 'sendBroadcast' "$BAR"

          echo "GearheadControlBar verified."

      - name: Verify V10ControlReceiver
        shell: bash
        run: |
          set -euo pipefail

          RECEIVER="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ControlReceiver.java"

          test -f "$RECEIVER"

          grep -q 'BroadcastReceiver' "$RECEIVER"
          grep -q 'com.carassistant.v10.CONTROL' "$RECEIVER"

          echo "V10ControlReceiver exists and uses the V10 control action."

      - name: Inspect V10ControlReceiver commands
        shell: bash
        run: |
          set -euo pipefail

          RECEIVER="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ControlReceiver.java"

          echo "----- V10ControlReceiver.java -----"
          sed -n '1,260p' "$RECEIVER"
          echo "-----------------------------------"

          if grep -Eq \
              'KEYCODE_BACK|keyevent 4|BACK|back' \
              "$RECEIVER"; then
            echo "Back handling detected."
          else
            echo "WARNING: Back handling not found in receiver."
          fi

          if grep -Eq \
              'KEYCODE_HOME|keyevent 3|HOME|home' \
              "$RECEIVER"; then
            echo "Home handling detected."
          else
            echo "WARNING: Home handling not found in receiver."
          fi

          if grep -Eq \
              'RECENTS|recents|KEYCODE_APP_SWITCH|keyevent 187' \
              "$RECEIVER"; then
            echo "Recents handling detected."
          else
            echo "WARNING: Recents handling not found in receiver."
          fi

          echo "Receiver inspection completed."

      - name: Rebuild Manifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          text = re.sub(
              r'\s*<(activity|receiver)\b[^>]*'
              r'android:name="[^"]*(?:MainActivity|AACastCarActivity|'
              r'V10LauncherActivity|V10CarActivity|V10ControlReceiver)[^"]*"'
              r'[^>]*(?:/>|>.*?</\1>)',
              '',
              text,
              flags=re.S
          )

          match = re.search(
              r'(<application\b[^>]*>)',
              text,
              flags=re.S
          )

          if not match:
              raise SystemExit(
                  "ERROR: application tag not found"
              )

          components = r'''
                  <activity
                      android:name="com.carassistant.v10.V10LauncherActivity"
                      android:exported="true">
                      <intent-filter>
                          <action
                              android:name="android.intent.action.MAIN" />
                          <category
                              android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name="com.carassistant.v10.V10CarActivity"
                      android:exported="true" />

                  <receiver
                      android:name="com.carassistant.v10.V10ControlReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action
                              android:name="com.carassistant.v10.CONTROL" />
                      </intent-filter>
                  </receiver>
          '''

          insert_at = match.end()

          text = (
              text[:insert_at]
              + components
              + text[insert_at:]
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print("Manifest rebuilt.")
          PY

      - name: Validate Manifest XML
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]

          tree = ET.parse(path)
          root = tree.getroot()

          ANDROID_NAME = \
              "{http://schemas.android.com/apk/res/android}name"

          ANDROID_EXPORTED = \
              "{http://schemas.android.com/apk/res/android}exported"

          expected = {
              "com.carassistant.v10.V10LauncherActivity": "true",
              "com.carassistant.v10.V10CarActivity": "true",
              "com.carassistant.v10.V10ControlReceiver": "true",
          }

          found = {}

          for element in root.findall(".//*"):
              name = element.get(ANDROID_NAME)

              if name in expected:
                  found[name] = element.get(
                      ANDROID_EXPORTED
                  )

          for name, value in expected.items():
              if name not in found:
                  raise SystemExit(
                      "ERROR: missing " + name
                  )

              if found[name] != value:
                  raise SystemExit(
                      "ERROR: wrong exported value for " + name
                  )

          for element in root.findall(".//*"):
              name = element.get(ANDROID_NAME)

              if name and (
                  name.endswith("MainActivity")
                  or name.endswith("AACastCarActivity")
              ):
                  raise SystemExit(
                      "ERROR: obsolete activity remains: "
                      + name
                  )

          print("Manifest XML and exported values verified.")
          PY

      - name: Verify V10 source
        shell: bash
        run: |
          set -euo pipefail

          JAVA="v10-source/app/src/main/java"
          MANIFEST="v10-source/app/src/main/AndroidManifest.xml"

          REQUIRED=(
            "V10LauncherActivity.java"
            "V10CarActivity.java"
            "V10ProjectionSession.java"
            "V10InputController.java"
            "V10Display.java"
            "V10SessionStore.java"
            "V10ControlReceiver.java"
            "AACastCarService.java"
            "GearheadControlBar.java"
          )

          for file in "${REQUIRED[@]}"; do
            count="$(
              find "$JAVA" \
                -name "$file" |
              wc -l
            )"

            if [ "$count" -ne 1 ]; then
              echo "ERROR: $file count=$count"
              exit 1
            fi
          done

          if grep -R \
              'com.carassistant.v9' \
              "$JAVA" \
              "$MANIFEST" \
              2>/dev/null; then
            echo "ERROR: V9 package remains."
            exit 1
          fi

          echo "V10 source verification passed."

      - name: Verify V10 projection invariants
        shell: bash
        run: |
          set -euo pipefail

          SESSION="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"
          HOOK="v10-source/app/src/main/java/com/hieptran/aacast/doudou/hook/InputHooks.java"

          test -f "$SESSION"
          test -f "$HOOK"

          grep -q 'SurfaceTexture' "$SESSION"
          grep -q 'setDefaultBufferSize' "$SESSION"
          grep -q 'new Surface' "$SESSION"
          grep -q 'createVirtualDisplay' "$SESSION"
          grep -q 'V10Display.nameFor' "$SESSION"
          grep -q 'Process.myUid() / 100000' "$SESSION"
          grep -q -- '--display' "$SESSION"
          grep -q -- '--windowingMode 1' "$SESSION"
          grep -q 'input -d' "$SESSION"
          grep -q 'keyevent 4' "$SESSION"
          grep -q 'V10Display.matches' "$HOOK"

          echo "Projection invariants passed."

      - name: Verify swipe input
        shell: bash
        run: |
          set -euo pipefail

          INPUT="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10InputController.java"
          SESSION="v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10ProjectionSession.java"

          test -f "$INPUT"
          test -f "$SESSION"

          grep -q 'MotionEvent.ACTION_DOWN' "$INPUT"
          grep -q 'MotionEvent.ACTION_MOVE' "$INPUT"
          grep -q 'MotionEvent.ACTION_UP' "$INPUT"
          grep -q 'session.swipe' "$INPUT"
          grep -q 'swipe' "$SESSION"

          echo "Single-pointer swipe verified."

      - name: Verify Xposed bridge
        shell: bash
        run: |
          set -euo pipefail

          BRIDGE="v10-source/app/src/main/java/com/hieptran/aacast/doudou/aabridge/AACastBridge.java"

          test -f "$BRIDGE"

          grep -q \
            'com.google.android.projection.gearhead' \
            "$BRIDGE"

          grep -Eq \
            'GearheadControlBar[[:space:]]*\.[[:space:]]*install' \
            "$BRIDGE"

          grep -Eq \
            'InputHooks[[:space:]]*\.[[:space:]]*install' \
            "$BRIDGE"

          grep -Eq \
            'DisplayHooks[[:space:]]*\.[[:space:]]*installDisplayFlags' \
            "$BRIDGE"

          grep -Eq \
            'DisplayHooks[[:space:]]*\.[[:space:]]*installInputPolicy' \
            "$BRIDGE"

          echo "Xposed bridge verified."

      - name: Verify Android 12 compatibility
        shell: bash
        run: |
          set -euo pipefail

          if grep -R \
              'getSentFromUid\|getSentFromPackage' \
              v10-source/app/src/main/java \
              2>/dev/null; then

            echo "ERROR: API 34-only BroadcastReceiver APIs detected."
            exit 1
          fi

          echo "Android 12 compatibility check passed."

      - name: Validate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd v10-source

          gradle \
            --version

          gradle \
            clean \
            --no-daemon \
            --stacktrace

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd v10-source

          gradle \
            assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK:"
          ls -lh "$APK"

          echo "SHA256:"
          sha256sum "$APK"

      - name: Verify APK package
        shell: bash
        run: |
          set -euo pipefail

          APK="v10-source/app/build/outputs/apk/debug/app-debug.apk"

          if command -v aapt >/dev/null 2>&1; then

            aapt dump badging "$APK" |
              grep -q \
                "package: name='com.carassistant.v10'"

            echo "APK package verified."

          else

            echo "aapt unavailable; package check skipped."

          fi

      - name: Upload V10.2-A2.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarAssistant-V10.2-A2.1-debug
          path: v10-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit V10.2-A2.1 source
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            v10-source

          if git diff \
              --cached \
              --quiet; then

            echo "No source changes to commit."
            exit 0
          fi

          git commit \
            -m \
            "Build Car Assistant V10.2-A2.1 Gearhead dock control bar"

          git push
