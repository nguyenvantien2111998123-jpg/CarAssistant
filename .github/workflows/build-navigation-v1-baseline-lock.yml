- name: Commit Navigation V1 source to main safely
        shell: bash
        run: |
          set -euo pipefail

          BASELINE="2c814a181d00cde9547a446927ae181e18cb9cbb"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            v10-source/app/build.gradle \
            v10-source/app/src/main/AndroidManifest.xml \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/NavigationMapView.java \
            v10-source/app/src/main/java/com/hieptran/aacast/doudou/V10CarActivity.java

          if git diff --cached --quiet; then
            echo "ERROR: No Navigation source changes staged."
            exit 1
          fi

          echo "Navigation V1 staged changes:"
          git diff --cached --stat

          git commit \
            -m "Lock Navigation V1 baseline"

          echo "Local Navigation commit:"
          git rev-parse HEAD

          echo "Fetching current remote main..."
          git fetch origin main --depth=64

          echo "Verifying baseline is an ancestor of remote main..."
          git merge-base \
            --is-ancestor \
            "$BASELINE" \
            origin/main

          echo "PASS: Remote main contains Home UI V2 baseline."

          echo "Checking whether remote main changed V10 source..."
          if ! git diff \
            --quiet \
            "$BASELINE" \
            origin/main \
            -- \
            v10-source
          then
            echo "ERROR: Remote main contains V10 source changes."
            echo "Navigation V1 promotion stopped to protect the source."
            echo ""
            echo "Remote V10 source changes:"
            git diff --name-only \
              "$BASELINE" \
              origin/main \
              -- \
              v10-source
            exit 1
          fi

          echo "PASS: Remote main has no V10 source changes."

          echo "Rebasing Navigation V1 commit onto current main..."
          GIT_EDITOR=true \
            git rebase \
            origin/main

          echo "PASS: Navigation V1 rebased onto current main."

          echo "Final commit after rebase:"
          git rev-parse HEAD

          echo "Final source diff against remote main:"
          git diff \
            --stat \
            origin/main...HEAD \
            -- \
            v10-source

          git push origin HEAD:main

          echo "PASS: Navigation V1 source pushed to main."
