name: Warm Gradle Cache - AndroidX Core

on:
  workflow_dispatch:
  push:
    paths:
      - "navigation-v1-source/app/build.gradle"
      - "navigation-v1-source/build.gradle"
      - "navigation-v1-source/settings.gradle"
      - "navigation-v1-source/gradle/**"
      - ".github/workflows/warm-gradle-cache-androidx-core.yml"

permissions:
  contents: read

jobs:
  warm-gradle-cache:
    name: Warm Gradle dependency cache
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: navigation-v1-source

    steps:

      - name: 01 - Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: 02 - Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 03 - Install Android SDK Platform 36
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "INSTALL ANDROID SDK PLATFORM 36"
          echo "============================================================"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              | sort \
              | tail -1)"
          fi

          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "FAIL: Không tìm thấy sdkmanager."
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" "platforms;android-36"
          "$SDKMANAGER" "build-tools;35.0.0"

          test -f "$ANDROID_HOME/platforms/android-36/android.jar"

          echo "PASS: Android SDK Platform 36"
          ls -lh "$ANDROID_HOME/platforms/android-36/android.jar"

      - name: 04 - Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -x gradlew

          echo "PASS: Gradle project structure"

      - name: 05 - Show Gradle version
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --version

      - name: 06 - Create AndroidX Core cache warmup init script
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail

          cat > warm-androidx-core.init.gradle <<'EOF'
          allprojects { project ->

              if (project.name == "app") {

                  project.afterEvaluate {

                      def warmConfiguration =
                              project.configurations.findByName(
                                      "androidxCoreWarmup"
                              )

                      if (warmConfiguration == null) {
                          warmConfiguration =
                                  project.configurations.create(
                                          "androidxCoreWarmup"
                                  )
                      }

                      project.dependencies.add(
                              "androidxCoreWarmup",
                              "androidx.core:core:1.13.1"
                      )

                      project.tasks.register(
                              "warmAndroidXCoreCache"
                      ) {

                          doLast {

                              def files =
                                      warmConfiguration.resolve()

                              if (files.isEmpty()) {
                                  throw new GradleException(
                                          "Không resolve được androidx.core:core:1.13.1"
                                  )
                              }

                              files.each { f ->
                                  logger.lifecycle(
                                          "ANDROIDX CORE: " +
                                          f.absolutePath
                                  )
                              }

                              logger.lifecycle(
                                      "PASS: AndroidX Core đã được tải vào Gradle cache."
                              )
                          }
                      }
                  }
              }
          }
          EOF

          echo "PASS: Đã tạo Gradle init script"

      - name: 07 - Warm AndroidX Core into Gradle cache
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --init-script ../warm-androidx-core.init.gradle \
            warmAndroidXCoreCache

      - name: 08 - Verify AndroidX Core Gradle cache
        shell: bash
        run: |
          set -euo pipefail

          CACHE_ROOT="$HOME/.gradle/caches/modules-2/files-2.1/androidx.core/core"

          echo "============================================================"
          echo "VERIFY ANDROIDX CORE CACHE"
          echo "============================================================"

          if [ ! -d "$CACHE_ROOT" ]; then
            echo "FAIL: Không tồn tại:"
            echo "$CACHE_ROOT"
            exit 1
          fi

          echo "AndroidX Core cache:"
          find "$CACHE_ROOT" -type f -name "core-*.jar" -print

          CORE_JAR="$(find "$CACHE_ROOT/1.13.1" \
            -type f \
            -name "core-1.13.1.jar" \
            | head -1)"

          if [ -z "${CORE_JAR:-}" ]; then
            echo "FAIL: Không tìm thấy core-1.13.1.jar"
            exit 1
          fi

          echo "FOUND:"
          echo "$CORE_JAR"

          ls -lh "$CORE_JAR"

          echo "PASS: androidx.core:core:1.13.1 đã nằm trong Gradle cache."

      - name: 09 - Warm normal Gradle dependencies
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            dependencies \
            --configuration debugRuntimeClasspath

      - name: 10 - Warm R8 dependency
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            dependencies \
            --configuration r8Tool

      - name: 11 - Resolve R8 and AndroidX Core together
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --init-script ../warm-androidx-core.init.gradle \
            warmAndroidXCoreCache

      - name: 12 - Verify R8 cache
        shell: bash
        run: |
          set -euo pipefail

          R8_JAR="$HOME/.gradle/caches/modules-2/files-2.1/com.android.tools/r8/8.13.6"

          if [ ! -d "$R8_JAR" ]; then
            echo "FAIL: Không tìm thấy R8 8.13.6 trong Gradle cache."
            exit 1
          fi

          find "$R8_JAR" \
            -type f \
            -name "r8-8.13.6.jar" \
            -print

          test -n "$(find "$R8_JAR" \
            -type f \
            -name "r8-8.13.6.jar" \
            | head -1)"

          echo "PASS: R8 8.13.6 đã được cache."

      - name: 13 - Verify AndroidX Core exact cache path
        shell: bash
        run: |
          set -euo pipefail

          CORE_ROOT="$HOME/.gradle/caches/modules-2/files-2.1/androidx.core/core/1.13.1"

          test -d "$CORE_ROOT"

          CORE_JAR="$(find "$CORE_ROOT" \
            -type f \
            -name "core-1.13.1.jar" \
            | head -1)"

          test -n "$CORE_JAR"

          echo "============================================================"
          echo "ANDROIDX CORE READY"
          echo "============================================================"
          echo "Path:"
          echo "$CORE_JAR"
          echo
          echo "Size:"
          ls -lh "$CORE_JAR"
          echo
          echo "SHA256:"
          sha256sum "$CORE_JAR"
          echo
          echo "PASS: Gradle cache đã có androidx.core:core:1.13.1"

      - name: 14 - Show complete relevant Gradle cache
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "RELEVANT GRADLE CACHE"
          echo "============================================================"

          echo
          echo "--- AndroidX Core ---"
          find "$HOME/.gradle/caches/modules-2/files-2.1/androidx.core" \
            -type f \
            -name "*.jar" \
            2>/dev/null \
            | sort || true

          echo
          echo "--- R8 ---"
          find "$HOME/.gradle/caches/modules-2/files-2.1/com.android.tools/r8" \
            -type f \
            -name "*.jar" \
            2>/dev/null \
            | sort || true

          echo
          echo "--- MapLibre ---"
          find "$HOME/.gradle/caches/modules-2/files-2.1/org.maplibre.gl" \
            -type f \
            -name "*.jar" \
            2>/dev/null \
            | sort || true

      - name: 15 - Final result
        shell: bash
        run: |
          set -euo pipefail

          CORE_COUNT="$(find \
            "$HOME/.gradle/caches/modules-2/files-2.1/androidx.core/core/1.13.1" \
            -type f \
            -name "core-1.13.1.jar" \
            | wc -l)"

          if [ "$CORE_COUNT" -lt 1 ]; then
            echo "FAIL: AndroidX Core chưa được cache."
            exit 1
          fi

          echo "============================================================"
          echo "GRADLE CACHE WARM: PASS"
          echo "============================================================"
          echo "AndroidX Core 1.13.1 : READY"
          echo "R8 8.13.6             : READY"
          echo "Gradle dependencies    : WARMED"
          echo "Android SDK 36         : READY"
          echo "============================================================"
