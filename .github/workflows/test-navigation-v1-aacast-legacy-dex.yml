name: Test Navigation V1 AACast Legacy DEX Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-navigation-v1-build:
    name: Build Navigation V1 with original AACast legacy DEX
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:

      - name: 01 - Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 02 - Setup Java 17 and Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 03 - Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: 04 - Install Android SDK Platform 36
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager --install "platforms;android-36"

          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"

          echo "PASS: Android SDK Platform 36"

      - name: 05 - Install Android Build Tools 35.0.0
        run: |
          set -e

          sdkmanager --install "build-tools;35.0.0"

          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/d8"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/dexdump"

          echo "PASS: Android Build Tools 35.0.0"

      - name: 06 - Verify Navigation V1 source and legacy SDK files
        working-directory: navigation-v1-source
        run: |
          set -e

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

          test -s app/libs/aasdk-legacy.jar
          test -s app/libs/aasdk-legacy.dex

          echo "SOURCE:"
          pwd

          echo
          echo "LEGACY SDK FILES:"

          ls -lh app/libs/aasdk-legacy.jar
          ls -lh app/libs/aasdk-legacy.dex

          echo
          echo "PASS: Navigation V1 source and legacy SDK files"

      - name: 07 - Verify AACast legacy DEX architecture
        working-directory: navigation-v1-source
        run: |
          set -e

          echo "Checking Navigation V1 build.gradle..."

          grep -Fq \
            'implementation "org.maplibre.gl:android-sdk:11.11.0"' \
            app/build.gradle

          grep -Fq \
            "compileOnly files('libs/aasdk-legacy.jar')" \
            app/build.gradle

          grep -Fq \
            "mergeProjectDexDebug" \
            app/build.gradle

          grep -Fq \
            "mergeDexRelease" \
            app/build.gradle

          grep -Fq \
            "app/libs/aasdk-legacy.dex" \
            app/build.gradle

          grep -Fq \
            "minifyEnabled false" \
            app/build.gradle

          if grep -Fq "sanitizeLegacyDex" app/build.gradle; then
            echo "FAIL: sanitizeLegacyDex is still present in build.gradle"
            exit 1
          fi

          if grep -Fq "com.android.tools:r8:" app/build.gradle; then
            echo "FAIL: R8 dependency is still present in build.gradle"
            exit 1
          fi

          if grep -Fq "androidxCoreTool" app/build.gradle; then
            echo "FAIL: androidxCoreTool is still present in build.gradle"
            exit 1
          fi

          echo
          echo "PASS: build.gradle uses original AACast-Doudou legacy DEX architecture"

      - name: 08 - Verify Gradle wrapper
        working-directory: navigation-v1-source
        run: |
          set -e

          test -f gradlew

          chmod +x gradlew

          ./gradlew --version

          echo "PASS: Gradle wrapper"

      - name: 09 - Resolve Debug dependency graph
        working-directory: navigation-v1-source
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:dependencies \
            --configuration debugRuntimeClasspath

          echo
          echo "PASS: Debug dependency graph resolved"

      - name: 10 - Build Navigation V1 Debug APK
        working-directory: navigation-v1-source
        run: |
          set -e

          echo "============================================================"
          echo "BUILD: :app:assembleDebug"
          echo "============================================================"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

          APK="$(find app/build/outputs/apk/debug \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo
            echo "FAIL: Debug APK not found"
            exit 1
          fi

          test -s "$APK"

          echo
          echo "DEBUG APK:"
          echo "$APK"

          ls -lh "$APK"

          echo
          echo "PASS: :app:assembleDebug"

      - name: 11 - Verify original legacy DEX is packaged
        working-directory: navigation-v1-source
        run: |
          set -e

          APK="$(find app/build/outputs/apk/debug \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "FAIL: Debug APK not found"
            exit 1
          fi

          test -s "$APK"

          VERIFY_DIR="app/build/legacy-apk-verify"

          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"

          unzip -q "$APK" 'classes*.dex' -d "$VERIFY_DIR"

          DEX_COUNT="$(
            find "$VERIFY_DIR" \
              -type f \
              -name 'classes*.dex' \
              | wc -l \
              | tr -d ' '
          )"

          if [ "$DEX_COUNT" -lt 1 ]; then
            echo "FAIL: APK contains no classes*.dex"
            exit 1
          fi

          echo
          echo "APK DEX count: $DEX_COUNT"

          LEGACY_FOUND=0

          while IFS= read -r DEX_FILE; do

            echo
            echo "------------------------------------------------------------"
            echo "Checking DEX:"
            echo "$DEX_FILE"
            echo "------------------------------------------------------------"

            DUMP_FILE="$DEX_FILE.txt"

            "$ANDROID_SDK_ROOT/build-tools/35.0.0/dexdump" \
              "$DEX_FILE" > "$DUMP_FILE"

            if grep -Fq \
              "com/google/android/apps/auto/sdk" \
              "$DUMP_FILE"; then

              echo "PASS: Android Auto legacy SDK found in:"
              echo "$DEX_FILE"

              LEGACY_FOUND=1
            fi

          done < <(
            find "$VERIFY_DIR" \
              -type f \
              -name 'classes*.dex' \
              | sort
          )

          if [ "$LEGACY_FOUND" -ne 1 ]; then
            echo
            echo "FAIL: com/google/android/apps/auto/sdk"
            echo "was NOT found in packaged APK DEX."

            echo
            echo "Packaged DEX files:"
            find "$VERIFY_DIR" \
              -type f \
              -name 'classes*.dex' \
              -print

            exit 1
          fi

          echo
          echo "============================================================"
          echo "PASS: Original AACast legacy SDK is packaged in Debug APK"
          echo "============================================================"

      - name: 12 - Final result
        run: |
          echo
          echo "============================================================"
          echo "NAVIGATION V1 AACAST LEGACY DEX BUILD: PASS"
          echo "============================================================"
          echo
          echo "Build.gradle architecture : PASS"
          echo "MapLibre 11.11.0          : PASS"
          echo "Legacy JAR compileOnly    : PASS"
          echo "Legacy DEX runtime        : PASS"
          echo "R8 sanitize               : NOT USED"
          echo "Debug APK                 : PASS"
          echo "Android Auto SDK          : PRESENT"
          echo
          echo "Step 15 sanitize has NOT been removed yet."
          echo
          echo "This workflow is only the isolated build test."
          echo "Do NOT modify setup-navigation-v1-environment.yml"
          echo "until this workflow passes."
          echo "============================================================"
