name: Extract V9

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract V9
        run: |
          set -e

          test -f CarAssistant-V9-Source.zip

          rm -rf v9-source
          mkdir -p v9-source

          unzip -q CarAssistant-V9-Source.zip -d v9-source

          echo "=== V9 SOURCE ==="
          find v9-source -type f | sort

      - name: Commit v9-source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add v9-source

          git commit -m "Extract V9 source" || echo "Nothing to commit"

          git push
