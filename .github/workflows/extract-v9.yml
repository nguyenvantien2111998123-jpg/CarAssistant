name: Extract V9

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract v9.zip
        run: |
          set -e
          test -f v9.zip
          rm -rf v9-source
          mkdir -p v9-source
          unzip -q v9.zip -d v9-source

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v9-source
          git commit -m "Extract V9 source" || echo "Nothing to commit"
          git push
