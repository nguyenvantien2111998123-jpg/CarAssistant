name: Extract V9

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-v9:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract V9 source
        shell: bash
        run: |
          set -e

          rm -rf v9-source
          mkdir -p v9-source

          echo "=== Extract outer ZIP ==="
          unzip -q CarAssistant-V9-Source.zip -d v9-source

          INNER="v9-source/CarAssistant-V9-source.zip"

          echo "=== Check inner ZIP ==="
          if [ ! -f "$INNER" ]; then
            echo "ERROR: Inner ZIP not found:"
            find v9-source -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "=== Extract inner ZIP ==="
          mkdir -p v9-source/android-project
          unzip -q "$INNER" -d v9-source/android-project

          echo "=== ANDROID PROJECT STRUCTURE ==="
          find v9-source/android-project -maxdepth 4 -type f | sort

          echo "=== PROJECT FILES ==="
          find v9-source/android-project -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" -o \
            -name "build.gradle" -o \
            -name "build.gradle.kts" -o \
            -name "AndroidManifest.xml" \
          \) | sort

          echo "=== APP DIRECTORIES ==="
          find v9-source/android-project -type d -name "app" | sort

          echo "=== DONE ==="
