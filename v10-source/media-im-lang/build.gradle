plugins {
    id 'com.android.application'
}

android {
    namespace 'com.carassistant.mediaimlang'
    compileSdk 36

    defaultConfig {
        applicationId 'com.carassistant.mediaimlang'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
}
