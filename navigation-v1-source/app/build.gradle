plugins {
    id 'com.android.application'
}

def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.carassistant.v10'
    compileSdk 36

    defaultConfig {
        applicationId "com.carassistant.v10"
        minSdk 29
        targetSdk 36
        versionCode 3
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled false
            shrinkResources false

            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/MANIFEST.MF',
                    'META-INF/*.kotlin_module',
                    'META-INF/*.version',
                    'META-INF/*.txt',
                    'DebugProbesKt.bin'
            ]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

configurations {
    r8Tool
}

dependencies {
    implementation "org.maplibre.gl:android-sdk:11.11.0"

    compileOnly files('libs/xposed-api-82.jar')
    compileOnly files('libs/aasdk-legacy.jar')

    r8Tool "com.android.tools:r8:8.13.6"

    testImplementation 'junit:junit:4.13.2'
}

def findR8Jar = {
    def r8Files = configurations.r8Tool.resolve().findAll {
        it.exists() &&
        it.isFile() &&
        it.name.toLowerCase().endsWith(".jar")
    }

    if (r8Files.isEmpty()) {
        throw new GradleException(
                "Không resolve được R8 tool: com.android.tools:r8:8.13.6"
        )
    }

    def selected = r8Files.find {
        it.name == "r8-8.13.6.jar"
    }

    if (selected == null) {
        selected = r8Files[0]
    }

    logger.lifecycle("R8 TOOL: " + selected.absolutePath)

    return selected
}

def findAndroidXCoreJar = {
    def candidates = []

    def gradleUserHome =
            System.getProperty("user.home") +
            "/.gradle/caches/modules-2/files-2.1"

    def coreRoot =
            file(gradleUserHome + "/androidx.core/core")

    if (coreRoot.exists()) {
        coreRoot.eachDir { versionDir ->
            versionDir.eachDir { hashDir ->
                fileTree(hashDir).matching {
                    include "*.jar"
                    include "**/*.jar"
                }.files.each { f ->
                    candidates << f
                }
            }
        }
    }

    candidates = candidates.findAll {
        it.exists() && it.isFile()
    }

    if (candidates.isEmpty()) {
        throw new GradleException(
                "Không tìm thấy androidx.core:core trong Gradle cache."
        )
    }

    def preferred = candidates.find {
        it.name == "core-1.13.1.jar"
    }

    if (preferred != null) {
        return preferred
    }

    candidates.sort {
        a, b -> a.absolutePath <=> b.absolutePath
    }

    return candidates.last()
}

tasks.register("sanitizeLegacyDex") {

    def legacyDex =
            rootProject.file("app/libs/aasdk-legacy.dex")

    def outputRoot =
            project.layout.buildDirectory
                    .dir("intermediates/sanitized-legacy-dex")
                    .get()
                    .asFile

    def outputDir =
            new File(outputRoot, "release")

    def outputDex =
            new File(outputDir, "classes.dex")

    def rulesFile =
            new File(outputRoot, "legacy-r8-rules.pro")

    inputs.file(legacyDex)
    outputs.file(outputDex)

    doLast {

        if (!legacyDex.exists()) {
            throw new GradleException(
                    "Thiếu app/libs/aasdk-legacy.dex!"
            )
        }

        outputDir.deleteDir()
        outputDir.mkdirs()

        rulesFile.text = '''
-dontobfuscate
-dontoptimize
-dontwarn **

-keep class com.google.android.apps.auto.sdk.** { *; }

-keep class ** { *; }

-keep,allowshrinking,allowoptimization class androidx.** { *; }

-checkdiscard class androidx.core.app.CoreComponentFactory
-checkdiscard class androidx.core.app.RemoteActionCompat
-checkdiscard class androidx.core.app.RemoteActionCompatParcelizer
-checkdiscard class androidx.core.graphics.drawable.IconCompat
-checkdiscard class androidx.core.graphics.drawable.IconCompatParcelizer
'''.stripIndent()

        def r8Jar = findR8Jar()

        def androidJar =
                new File(
                        android.sdkDirectory,
                        "platforms/${android.compileSdk}/android.jar"
                )

        if (!androidJar.exists()) {
            throw new GradleException(
                    "Không tìm thấy Android SDK android.jar: " +
                    androidJar.absolutePath
            )
        }

        def androidXCoreJar = findAndroidXCoreJar()

        logger.lifecycle("============================================================")
        logger.lifecycle("SANITIZE LEGACY DEX")
        logger.lifecycle("============================================================")
        logger.lifecycle("Input DEX     : " + legacyDex.absolutePath)
        logger.lifecycle("Output DEX    : " + outputDex.absolutePath)
        logger.lifecycle("R8            : " + r8Jar.absolutePath)
        logger.lifecycle("Android API   : " + androidJar.absolutePath)
        logger.lifecycle("AndroidX Core : " + androidXCoreJar.absolutePath)
        logger.lifecycle("============================================================")

        project.exec {
            commandLine(
                    "java",
                    "-cp",
                    r8Jar.absolutePath,
                    "com.android.tools.r8.R8",
                    "--release",
                    "--min-api",
                    "29",
                    "--output",
                    outputDir.absolutePath,
                    "--lib",
                    androidJar.absolutePath,
                    "--lib",
                    androidXCoreJar.absolutePath,
                    "--pg-conf",
                    rulesFile.absolutePath,
                    legacyDex.absolutePath
            )
        }

        if (!outputDex.exists()) {
            throw new GradleException(
                    "R8 không tạo được sanitized legacy dex!"
            )
        }

        logger.lifecycle(
                "PASS: R8 đã tạo sanitized legacy dex."
        )

        def buildToolsDir =
                new File(
                        android.sdkDirectory,
                        "build-tools/${android.buildToolsVersion}"
                )

        def dexdump =
                new File(
                        buildToolsDir,
                        "dexdump"
                )

        if (!dexdump.exists()) {
            throw new GradleException(
                    "Không tìm thấy dexdump: " +
                    dexdump.absolutePath
            )
        }

        def dumpFile =
                new File(
                        outputRoot,
                        "sanitized-dexdump.txt"
                )

        project.exec {
            standardOutput =
                    new FileOutputStream(dumpFile)

            commandLine(
                    dexdump.absolutePath,
                    outputDex.absolutePath
            )
        }

        def dumpText = dumpFile.text

        def forbiddenDescriptors = [
                "Landroidx/core/app/CoreComponentFactory;",
                "Landroidx/core/app/RemoteActionCompat;",
                "Landroidx/core/app/RemoteActionCompatParcelizer;",
                "Landroidx/core/graphics/drawable/IconCompat;",
                "Landroidx/core/graphics/drawable/IconCompatParcelizer;"
        ]

        def remainingExact =
                forbiddenDescriptors.findAll { descriptor ->
                    dumpText.contains(descriptor)
                }

        if (!remainingExact.isEmpty()) {

            logger.lifecycle(
                    "FAIL: AndroidX class vẫn còn trong sanitized DEX"
            )

            remainingExact.each {
                logger.lifecycle(
                        "STILL PRESENT: " + it
                )
            }

            throw new GradleException(
                    "Một hoặc nhiều AndroidX class vẫn còn."
            )
        }

        logger.lifecycle(
                "PASS: cả 5 AndroidX class mục tiêu đã được loại bỏ."
        )

        def remainingAndroidX =
                dumpText.readLines().findAll {
                    it.contains("androidx/")
                }

        if (!remainingAndroidX.isEmpty()) {

            logger.lifecycle(
                    "FAIL: AndroidX vẫn còn trong sanitized dex"
            )

            remainingAndroidX.each {
                logger.lifecycle(it)
            }

            throw new GradleException(
                    "Sanitized legacy dex vẫn chứa androidx/*."
            )
        }

        if (!dumpText.contains(
                "com/google/android/apps/auto/sdk"
        )) {
            throw new GradleException(
                    "Sanitized dex không còn " +
                    "com/google/android/apps/auto/sdk."
            )
        }

        logger.lifecycle(
                "PASS: com.google.android.apps.auto.sdk vẫn còn."
        )

        logger.lifecycle(
                "SANITIZE LEGACY DEX: PASS"
        )
    }
}

tasks.matching {
    it.name == "mergeProjectDexDebug"
}.configureEach { task ->

    dependsOn tasks.named("sanitizeLegacyDex")

    task.doLast {

        def sanitizedDex =
                new File(
                        project.layout.buildDirectory
                                .dir(
                                        "intermediates/" +
                                        "sanitized-legacy-dex/release"
                                )
                                .get()
                                .asFile,
                        "classes.dex"
                )

        if (!sanitizedDex.exists()) {
            throw new GradleException(
                    "Thiếu sanitized legacy dex cho Debug!"
            )
        }

        def bucket =
                new File(
                        task.outputDir.get().asFile,
                        "legacy_sdk"
                )

        bucket.deleteDir()
        bucket.mkdirs()

        new File(
                bucket,
                "classes.dex"
        ).bytes = sanitizedDex.bytes

        logger.lifecycle(
                "PASS: sanitized legacy dex đã thêm vào Debug."
        )
    }
}

tasks.matching {
    it.name == "mergeDexRelease"
}.configureEach { task ->

    dependsOn tasks.named("sanitizeLegacyDex")

    task.doLast {

        def sanitizedDex =
                new File(
                        project.layout.buildDirectory
                                .dir(
                                        "intermediates/" +
                                        "sanitized-legacy-dex/release"
                                )
                                .get()
                                .asFile,
                        "classes.dex"
                )

        if (!sanitizedDex.exists()) {
            throw new GradleException(
                    "Thiếu sanitized legacy dex!"
            )
        }

        def outputDir =
                task.outputDir.get().asFile

        def dexFilter = {
            it.isFile() &&
            it.name ==~ /classes\d*\.dex/
        } as FileFilter

        def appDexes =
                outputDir
                        .listFiles(dexFilter)
                        ?.toList() ?: []

        if (appDexes.isEmpty()) {
            throw new GradleException(
                    "Không tìm thấy classes*.dex trong " +
                    outputDir
            )
        }

        def buildDirFile =
                project.layout.buildDirectory
                        .asFile
                        .get()

        def tempDir =
                new File(
                        buildDirFile,
                        "intermediates/dex_merged_temp"
                )

        tempDir.deleteDir()
        tempDir.mkdirs()

        def sdkDir =
                android.sdkDirectory.absolutePath

        def buildToolsVersion =
                android.buildToolsVersion

        def d8Tool =
                "${sdkDir}/build-tools/" +
                "${buildToolsVersion}/d8"

        logger.lifecycle("============================================================")
        logger.lifecycle("MERGE RELEASE DEX")
        logger.lifecycle("============================================================")

        project.exec {
            commandLine(
                    [
                            d8Tool,
                            "--min-api",
                            "29",
                            "--output",
                            tempDir.absolutePath
                    ]
                    +
                    appDexes*.absolutePath
                    +
                    [
                            sanitizedDex.absolutePath
                    ]
            )
        }

        def mergedDexes =
                tempDir
                        .listFiles(dexFilter)
                        ?.toList() ?: []

        if (mergedDexes.isEmpty()) {
            throw new GradleException(
                    "D8 merge dex thất bại!"
            )
        }

        appDexes.each {
            it.delete()
        }

        mergedDexes.each { merged ->

            def target =
                    new File(
                            outputDir,
                            merged.name
                    )

            if (!merged.renameTo(target)) {
                target.bytes = merged.bytes
                merged.delete()
            }
        }

        tempDir.deleteDir()

        logger.lifecycle(
                "PASS: D8 merge release dex."
        )
    }
}

tasks.register("distRelease", Copy) {

    dependsOn "assembleRelease"

    def buildDirFile =
            project.layout.buildDirectory
                    .asFile
                    .get()

    from "${buildDirFile}/outputs/apk/release/app-release.apk"

    into "${rootDir}/dist"

    rename(
            "app-release.apk",
            "AACast-Doudou-v1.0.0.apk"
    )

    doLast {

        def apkFile =
                file(
                        "${rootDir}/dist/" +
                        "AACast-Doudou-v1.0.0.apk"
                )

        if (apkFile.exists()) {

            def sha256 =
                    java.security.MessageDigest
                            .getInstance("SHA-256")
                            .digest(apkFile.bytes)
                            .collect {
                                String.format(
                                        "%02x",
                                        it
                                )
                            }
                            .join()

            file(
                    "${rootDir}/dist/" +
                    "AACast-Doudou-v1.0.0.apk.sha256"
            ).text =
                    "${sha256}  AACast-Doudou-v1.0.0.apk\n"
        }
    }
}
