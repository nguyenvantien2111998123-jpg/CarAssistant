plugins {
    id 'com.android.application'
}

def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.carassistant.v10'
    compileSdk 36

    defaultConfig {
        applicationId "com.carassistant.v10"
        minSdk 29
        targetSdk 36
        versionCode 3
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            // KHÔNG bật R8/minify cho toàn bộ application.
            // Legacy Android Auto SDK được xử lý riêng ở task sanitizeLegacyDex.
            minifyEnabled false
            shrinkResources false

            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/MANIFEST.MF',
                    'META-INF/*.kotlin_module',
                    'META-INF/*.version',
                    'META-INF/*.txt',
                    'DebugProbesKt.bin'
            ]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation "org.maplibre.gl:android-sdk:11.11.0"

    // Xposed API: chỉ compile, runtime do LSPosed cung cấp.
    compileOnly files('libs/xposed-api-82.jar')

    // Android Auto SDK legacy:
    // chỉ compile Java code.
    // Runtime release dùng aasdk-legacy.dex đã sanitize.
    compileOnly files('libs/aasdk-legacy.jar')

    testImplementation 'junit:junit:4.13.2'
}


/*
 * ============================================================
 * LEGACY DEX SANITIZATION
 * ============================================================
 *
 * aasdk-legacy.dex hiện chứa đúng 5 class AndroidX:
 *
 *   androidx/core/app/CoreComponentFactory
 *   androidx/core/app/RemoteActionCompat
 *   androidx/core/app/RemoteActionCompatParcelizer
 *   androidx/core/graphics/drawable/IconCompat
 *   androidx/core/graphics/drawable/IconCompatParcelizer
 *
 * AndroidX chính thức của application được cung cấp bởi:
 *
 *   androidx.core:core:1.13.1
 *   androidx.core:core-ktx:1.13.1
 *
 * MỤC TIÊU:
 *
 *   1. KHÔNG loại AndroidX khỏi dependency của application.
 *   2. KHÔNG R8 toàn bộ application.
 *   3. KHÔNG rebuild/optimize toàn bộ legacy SDK.
 *   4. Chỉ loại implementation AndroidX bị đóng nhúng trong
 *      aasdk-legacy.dex.
 *   5. Giữ nguyên toàn bộ com.google.android.apps.auto.sdk.
 *
 * R8 được dùng ở đây như một DEX sanitizer riêng.
 *
 * AndroidX Core 1.13.1 được đưa vào R8 dưới dạng LIBRARY.
 * Vì vậy các reference AndroidX trong legacy SDK có thể liên
 * kết tới AndroidX chính thức của application thay vì giữ lại
 * implementation AndroidX duplicate trong legacy dex.
 *
 * KHÔNG dùng:
 *
 *   -keep class androidx.** { *; }
 *
 * vì rule đó sẽ giữ lại chính duplicate AndroidX.
 */


/*
 * ============================================================
 * FIND R8 JAR
 * ============================================================
 */
def findR8Jar = {
    def candidates = []

    def gradleUserHome =
            System.getProperty("user.home") +
            "/.gradle/caches/modules-2/files-2.1"

    def r8Root =
            file(
                    gradleUserHome +
                    "/com.android.tools/r8"
            )

    if (r8Root.exists()) {
        r8Root.eachDir { versionDir ->
            versionDir.eachDir { hashDir ->

                fileTree(hashDir).matching {
                    include "**/r8-*.jar"
                    include "**/r8.jar"
                }.files.each { f ->
                    candidates << f
                }
            }
        }
    }

    /*
     * Fallback:
     * tìm R8 bên trong Android Gradle Plugin cache.
     */
    def agpRoot =
            file(
                    gradleUserHome +
                    "/com.android.tools.build/gradle"
            )

    if (agpRoot.exists()) {
        agpRoot.eachDir { versionDir ->
            versionDir.eachDir { hashDir ->

                fileTree(hashDir).matching {
                    include "**/r8*.jar"
                }.files.each { f ->
                    candidates << f
                }
            }
        }
    }

    candidates =
            candidates.findAll {
                it.exists() && it.isFile()
            }

    if (candidates.isEmpty()) {
        throw new GradleException(
                "Không tìm thấy R8 jar trong Gradle cache. " +
                "Không thể sanitize aasdk-legacy.dex."
        )
    }

    candidates.sort {
        a, b ->
            a.absolutePath <=> b.absolutePath
    }

    return candidates.last()
}


/*
 * ============================================================
 * FIND ANDROIDX CORE JAR
 * ============================================================
 *
 * MapLibre hiện tại kéo AndroidX Core 1.13.1.
 *
 * Không lấy AndroidX từ aasdk-legacy.jar.
 * Lấy chính artifact AndroidX Core mà Gradle đã resolve.
 */
def findAndroidXCoreJar = {

    def candidates = []

    def gradleUserHome =
            System.getProperty("user.home") +
            "/.gradle/caches/modules-2/files-2.1"

    def coreRoot =
            file(
                    gradleUserHome +
                    "/androidx.core/core"
            )

    if (coreRoot.exists()) {

        coreRoot.eachDir { versionDir ->

            /*
             * Ưu tiên đúng version đang resolve:
             * androidx.core:core:1.13.1
             */
            if (versionDir.name == "1.13.1") {

                versionDir.eachDir { hashDir ->

                    fileTree(hashDir).matching {
                        include "*.jar"
                        include "**/*.jar"
                    }.files.each { f ->
                        candidates << f
                    }
                }
            }
        }
    }

    /*
     * Fallback nếu cache structure khác.
     */
    if (candidates.isEmpty() && coreRoot.exists()) {

        coreRoot.eachDir { versionDir ->

            versionDir.eachDir { hashDir ->

                fileTree(hashDir).matching {
                    include "*.jar"
                    include "**/*.jar"
                }.files.each { f ->
                    candidates << f
                }
            }
        }
    }

    candidates =
            candidates.findAll {
                it.exists() && it.isFile()
            }

    if (candidates.isEmpty()) {
        throw new GradleException(
                "Không tìm thấy androidx.core:core trong " +
                "Gradle cache."
        )
    }

    /*
     * Ưu tiên tên core-1.13.1.jar nếu có.
     */
    def preferred =
            candidates.find {
                it.name == "core-1.13.1.jar"
            }

    if (preferred != null) {
        return preferred
    }

    candidates.sort {
        a, b ->
            a.absolutePath <=> b.absolutePath
    }

    return candidates.last()
}


/*
 * ============================================================
 * SANITIZE LEGACY DEX
 * ============================================================
 */
tasks.register("sanitizeLegacyDex") {

    def legacyDex =
            rootProject.file(
                    "app/libs/aasdk-legacy.dex"
            )

    def outputRoot =
            project.layout.buildDirectory
                    .dir("intermediates/sanitized-legacy-dex")
                    .get()
                    .asFile

    def outputDir =
            new File(
                    outputRoot,
                    "release"
            )

    def outputDex =
            new File(
                    outputDir,
                    "classes.dex"
            )

    def rulesFile =
            new File(
                    outputRoot,
                    "legacy-r8-rules.pro"
            )

    inputs.file(legacyDex)

    outputs.file(outputDex)

    doLast {

        if (!legacyDex.exists()) {
            throw new GradleException(
                    "Thiếu app/libs/aasdk-legacy.dex!"
            )
        }

        outputDir.deleteDir()
        outputDir.mkdirs()

        /*
         * ======================================================
         * EXACT ANDROIDX CLASSES TO REMOVE
         * ======================================================
         *
         * Đây là 5 class đã được kiểm kê trong legacy SDK.
         */
        def androidXClasses = [
                "androidx.core.app.CoreComponentFactory",
                "androidx.core.app.RemoteActionCompat",
                "androidx.core.app.RemoteActionCompatParcelizer",
                "androidx.core.graphics.drawable.IconCompat",
                "androidx.core.graphics.drawable.IconCompatParcelizer"
        ]

        /*
         * ======================================================
         * R8 RULES
         * ======================================================
         *
         * Giữ legacy Android Auto SDK.
         *
         * Không obfuscate.
         * Không optimize.
         *
         * AndroidX được phép shrink.
         *
         * Các class AndroidX bị embedded trong legacy dex sẽ
         * được loại bỏ khi R8 có AndroidX Core chính thức làm
         * library.
         */
        rulesFile.text = '''
-dontobfuscate
-dontoptimize
-dontwarn **

-keep class com.google.android.apps.auto.sdk.** { *; }

-keep class ** { *; }

-keep,allowshrinking,allowoptimization class androidx.** { *; }

-checkdiscard class androidx.core.app.CoreComponentFactory
-checkdiscard class androidx.core.app.RemoteActionCompat
-checkdiscard class androidx.core.app.RemoteActionCompatParcelizer
-checkdiscard class androidx.core.graphics.drawable.IconCompat
-checkdiscard class androidx.core.graphics.drawable.IconCompatParcelizer
'''.stripIndent()

        def r8Jar =
                findR8Jar()

        def androidJar =
                new File(
                        android.sdkDirectory,
                        "platforms/${android.compileSdk}/android.jar"
                )

        if (!androidJar.exists()) {
            throw new GradleException(
                    "Không tìm thấy Android SDK android.jar: " +
                    androidJar.absolutePath
            )
        }

        def androidXCoreJar =
                findAndroidXCoreJar()

        println "============================================================"
        println "SANITIZE LEGACY DEX - ANDROIDX ONLY"
        println "============================================================"
        println "Input DEX      : " +
                legacyDex.absolutePath
        println "Output DEX     : " +
                outputDex.absolutePath
        println "R8             : " +
                r8Jar.absolutePath
        println "Android API    : " +
                androidJar.absolutePath
        println "AndroidX Core  : " +
                androidXCoreJar.absolutePath
        println "============================================================"
        println "Target classes:"
        androidXClasses.each {
            println "  REMOVE: " + it
        }
        println "============================================================"

        /*
         * ======================================================
         * R8
         * ======================================================
         *
         * Quan trọng:
         *
         * android.jar       = Android platform library
         * core-1.13.1.jar   = AndroidX authoritative library
         * aasdk-legacy.dex  = PROGRAM INPUT
         *
         * AndroidX Core KHÔNG phải program input.
         * Do đó implementation AndroidX trong legacy dex
         * có thể bị loại bỏ mà reference vẫn resolve tới
         * AndroidX chính thức.
         */
        project.exec {

            commandLine(
                    "java",
                    "-cp",
                    r8Jar.absolutePath,
                    "com.android.tools.r8.R8",

                    "--release",

                    "--min-api",
                    "29",

                    "--output",
                    outputDir.absolutePath,

                    "--lib",
                    androidJar.absolutePath,

                    "--lib",
                    androidXCoreJar.absolutePath,

                    "--pg-conf",
                    rulesFile.absolutePath,

                    legacyDex.absolutePath
            )
        }

        if (!outputDex.exists()) {
            throw new GradleException(
                    "R8 không tạo được sanitized legacy dex!"
            )
        }

        println "PASS: R8 đã tạo sanitized legacy dex."
        println "Size: " +
                outputDex.length() +
                " bytes"

        /*
         * ======================================================
         * DEXDUMP VERIFY
         * ======================================================
         */
        def buildToolsDir =
                new File(
                        android.sdkDirectory,
                        "build-tools/${android.buildToolsVersion}"
                )

        def dexdump =
                new File(
                        buildToolsDir,
                        "dexdump"
                )

        if (!dexdump.exists()) {
            throw new GradleException(
                    "Không tìm thấy dexdump: " +
                    dexdump.absolutePath
            )
        }

        def dumpFile =
                new File(
                        outputRoot,
                        "sanitized-dexdump.txt"
                )

        project.exec {
            standardOutput =
                    new FileOutputStream(dumpFile)

            commandLine(
                    dexdump.absolutePath,
                    outputDex.absolutePath
            )
        }

        def dumpText =
                dumpFile.text

        /*
         * ======================================================
         * VERIFY 5 EXACT CLASSES ARE GONE
         * ======================================================
         */
        def dexNames =
                dumpText.readLines()

        def forbiddenDescriptors = [
                "Landroidx/core/app/CoreComponentFactory;",
                "Landroidx/core/app/RemoteActionCompat;",
                "Landroidx/core/app/RemoteActionCompatParcelizer;",
                "Landroidx/core/graphics/drawable/IconCompat;",
                "Landroidx/core/graphics/drawable/IconCompatParcelizer;"
        ]

        def remainingExact =
                forbiddenDescriptors.findAll { descriptor ->
                    dumpText.contains(descriptor)
                }

        if (!remainingExact.isEmpty()) {

            println "============================================================"
            println "FAIL: AndroidX class vẫn còn trong sanitized DEX"
            println "============================================================"

            remainingExact.each {
                println "STILL PRESENT: " + it
            }

            throw new GradleException(
                    "Một hoặc nhiều trong 5 AndroidX class " +
                    "vẫn còn trong sanitized legacy dex."
            )
        }

        println "PASS: cả 5 AndroidX class mục tiêu đã được loại bỏ."

        /*
         * ======================================================
         * VERIFY NO ANDROIDX IMPLEMENTATION REMAINS
         * ======================================================
         *
         * Inventory hiện tại của aasdk-legacy.dex chỉ có 5
         * AndroidX class nói trên.
         *
         * Vì vậy kiểm tra thêm toàn bộ androidx/ để đảm bảo
         * không có AndroidX implementation nào khác lọt lại.
         */
        def remainingAndroidX =
                dexNames.findAll {
                    it.contains("androidx/")
                }

        if (!remainingAndroidX.isEmpty()) {

            println "============================================================"
            println "FAIL: AndroidX vẫn còn trong sanitized dex"
            println "============================================================"

            remainingAndroidX.each {
                println it
            }

            throw new GradleException(
                    "Sanitized legacy dex vẫn chứa androidx/*."
            )
        }

        println(
                "PASS: sanitized legacy dex không còn " +
                "androidx/*."
        )

        /*
         * ======================================================
         * VERIFY LEGACY ANDROID AUTO SDK
         * ======================================================
         */
        if (!dumpText.contains(
                "com/google/android/apps/auto/sdk"
        )) {

            throw new GradleException(
                    "FAIL: sanitized dex không còn " +
                    "com/google/android/apps/auto/sdk."
            )
        }

        println(
                "PASS: com/google/android/apps/auto/sdk vẫn còn."
        )

        /*
         * ======================================================
         * VERIFY THE 5 TARGETS ARE NOT IN OUTPUT
         * ======================================================
         */
        println "============================================================"
        println "FINAL SANITIZE CHECK"
        println "============================================================"

        androidXClasses.each { className ->

            def dexPath =
                    className.replace(
                            ".",
                            "/"
                    )

            if (dumpText.contains(dexPath)) {

                throw new GradleException(
                        "FAIL: class vẫn còn: " +
                        className
                )
            }

            println(
                    "PASS removed: " +
                    className
            )
        }

        println "============================================================"
        println "SANITIZE LEGACY DEX: PASS"
        println "============================================================"
    }
}


/*
 * ============================================================
 * DEBUG BUILD
 * ============================================================
 *
 * Debug trước đây sử dụng legacy dex như một bucket riêng.
 * Giữ nguyên cơ chế đó, nhưng dùng sanitized dex.
 */
tasks.matching {
    it.name == 'mergeProjectDexDebug'
}.configureEach { task ->

    dependsOn tasks.named("sanitizeLegacyDex")

    task.doLast {

        def sanitizedDex =
                new File(
                        project.layout.buildDirectory
                                .dir(
                                        "intermediates/" +
                                        "sanitized-legacy-dex/release"
                                )
                                .get()
                                .asFile,
                        "classes.dex"
                )

        if (!sanitizedDex.exists()) {
            throw new GradleException(
                    "Thiếu sanitized legacy dex cho Debug!"
            )
        }

        def bucket =
                new File(
                        task.outputDir.get().asFile,
                        "legacy_sdk"
                )

        bucket.deleteDir()
        bucket.mkdirs()

        new File(
                bucket,
                "classes.dex"
        ).bytes =
                sanitizedDex.bytes

        println(
                "PASS: sanitized legacy dex " +
                "đã được thêm vào Debug."
        )
    }
}


/*
 * ============================================================
 * RELEASE DEX MERGE
 * ============================================================
 *
 * TUYỆT ĐỐI KHÔNG đưa aasdk-legacy.dex gốc vào D8.
 *
 * Chỉ dùng:
 *
 * build/intermediates/sanitized-legacy-dex/release/classes.dex
 */
tasks.matching {
    it.name == 'mergeDexRelease'
}.configureEach { task ->

    dependsOn tasks.named("sanitizeLegacyDex")

    task.doLast {

        def sanitizedDex =
                new File(
                        project.layout.buildDirectory
                                .dir(
                                        "intermediates/" +
                                        "sanitized-legacy-dex/release"
                                )
                                .get()
                                .asFile,
                        "classes.dex"
                )

        if (!sanitizedDex.exists()) {
            throw new GradleException(
                    "Thiếu sanitized legacy dex!"
            )
        }

        def outputDir =
                task.outputDir.get().asFile

        def dexFilter = {
            it.isFile() &&
                    it.name ==~ /classes\d*\.dex/
        } as FileFilter

        def appDexes =
                outputDir
                        .listFiles(dexFilter)
                        ?.toList() ?: []

        if (appDexes.isEmpty()) {
            throw new GradleException(
                    "Không tìm thấy classes*.dex trong " +
                    outputDir
            )
        }

        /*
         * D8 merge:
         *
         * app dexes
         * +
         * sanitized legacy dex
         *
         * AndroidX trong app dex đến từ AndroidX dependency
         * chính thức.
         */
        def buildDirFile =
                project.layout.buildDirectory
                        .asFile
                        .get()

        def tempDir =
                new File(
                        buildDirFile,
                        "intermediates/dex_merged_temp"
                )

        tempDir.deleteDir()
        tempDir.mkdirs()

        def sdkDir =
                android.sdkDirectory.absolutePath

        def buildToolsVersion =
                android.buildToolsVersion

        def d8Tool =
                "${sdkDir}/build-tools/" +
                "${buildToolsVersion}/d8"

        println "============================================================"
        println "MERGE RELEASE DEX"
        println "============================================================"
        println "App dex count    : " +
                appDexes.size()
        println "Sanitized legacy : " +
                sanitizedDex.absolutePath
        println "D8               : " +
                d8Tool
        println "============================================================"

        project.exec {

            commandLine(
                    [
                            d8Tool,
                            '--min-api',
                            '29',
                            '--output',
                            tempDir.absolutePath
                    ]
                    +
                    appDexes*.absolutePath
                    +
                    [
                            sanitizedDex.absolutePath
                    ]
            )
        }

        def mergedDexes =
                tempDir
                        .listFiles(dexFilter)
                        ?.toList() ?: []

        if (mergedDexes.isEmpty()) {
            throw new GradleException(
                    "D8 merge dex thất bại!"
            )
        }

        appDexes.each {
            it.delete()
        }

        mergedDexes.each { merged ->

            def target =
                    new File(
                            outputDir,
                            merged.name
                    )

            if (!merged.renameTo(target)) {

                target.bytes =
                        merged.bytes

                merged.delete()
            }
        }

        tempDir.deleteDir()

        println(
                "PASS: D8 merge release dex."
        )

        println(
                "Merged dex count: " +
                outputDir
                        .listFiles(dexFilter)
                        ?.size()
        )
    }
}


/*
 * ============================================================
 * DISTRIBUTION
 * ============================================================
 */
tasks.register('distRelease', Copy) {

    dependsOn 'assembleRelease'

    def buildDirFile =
            project.layout.buildDirectory
                    .asFile
                    .get()

    from "${buildDirFile}/outputs/apk/release/app-release.apk"

    into "${rootDir}/dist"

    rename(
            'app-release.apk',
            'AACast-Doudou-v1.0.0.apk'
    )

    doLast {

        def apkFile =
                file(
                        "${rootDir}/dist/" +
                        "AACast-Doudou-v1.0.0.apk"
                )

        if (apkFile.exists()) {

            def sha256 =
                    java.security.MessageDigest
                            .getInstance("SHA-256")
                            .digest(apkFile.bytes)
                            .collect {
                                String.format(
                                        "%02x",
                                        it
                                )
                            }
                            .join()

            file(
                    "${rootDir}/dist/" +
                    "AACast-Doudou-v1.0.0.apk.sha256"
            ).text =
                    "${sha256}  AACast-Doudou-v1.0.0.apk\n"
        }
    }
}
